# concept.toml: everything about this project that is not Java code.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "container-hardening"
level = "intermediate"
module = "platform-hardening"
title = "Container Hardening"
short_title = "Container Hardening"
package = "container"
main_class = "ContainerDemo"
tagline = "Assume the process is taken over, and ask what it can reach"
bold = "A container is a process with settings, so decide what a hijacked process can do before it happens: run as a non-root user, drop all capabilities, forbid new privileges, make the root file system read-only, keep the host out, and set limits; each setting removes specific attacks, and the Pod Security Standards name the levels."
domain = "a containerised web shop"
domain_note = ""
youtube_description = "Container hardening in Java: what a compromised process can reach as root, and the settings that remove each attack, from docker run defaults to the Restricted level."
thumb_lines = ["CONTAINER", "HARDENING"]
thumb_code = "--cap-drop=ALL --read-only"
youtube_title = "Container Hardening: What a Compromised Process Can Reach (Docker and Kubernetes)"
youtube_tags = ["container security", "docker", "kubernetes", "pod security standards", "capabilities", "seccomp", "java", "application security"]

[readme]
intro = """
An attacker who finds a flaw in the shop's application gets code execution **inside the container**. What they can do next depends on the container's settings, and the defaults are generous: a plain `docker run` gives root inside the container, 14 Linux capabilities, a writable file system, and no limits on memory or processes.
Tutorials add more to "make it work": `--privileged`, the Docker socket, the host network. Each setting is a door for the attacker.

This project turns the question into code. A `ContainerSpec` holds the settings that matter (user, capabilities, privileged, read-only file system, privilege escalation, seccomp, host mounts and namespaces, memory and process limits, how secrets are passed, the image), and an
**attacker model** asks thirteen questions of it: can a hijacked process read secrets, tamper with the app, drop and run a tool, become root, use dangerous system calls, sniff the network, mount host things, talk to the Docker socket, touch host files, reach the host network, see host processes, exhaust memory, fork without limit? Each answer names the setting that decides it.

What the project shows, in order:
- **Defaults:** 7 of the 13 attacks are possible. **The tutorial configuration:** all 13.
- **Hardening one setting at a time**, with the effect of each: host access, seccomp, capabilities, non-root user, no new privileges, read-only root, limits, down to 1 of 13.
- **Pod Security Standards:** the Privileged, Baseline and Restricted levels, with the reasons a container fails the next level, and the same settings rendered as Docker flags and as a Kubernetes `securityContext`.
- **What is left:** the application's own secrets. Hardening limits the blast radius; it does not make the application safe.

**Maps to:** OWASP Top 10 (2025) A02 Security Misconfiguration · CIS Docker and Kubernetes Benchmarks · Kubernetes Pod Security Standards · NIST SP 800-190 (Application Container Security) · CWE-250 · CWE-269.
"""
analogy = """
A guest in a hotel room can do what the room allows: with the master key and the service lift (privileged, host mounts), they can reach every floor; with a plain key, only their room; with a room that has no phone line to the safe and a lock on the minibar, much less. You design the room for the day a guest turns out to be a thief.
"""
scenario = """
A containerised web shop with a flaw that gives an attacker code execution. The demo evaluates five configurations: Docker's defaults, the configuration from the tutorial, eight steps of hardening, the hardened container, and two settings that look harmless.
"""
costs = [
    "**Read-only file systems need writable scratch space** (a tmpfs for `/tmp`, volumes for data), and applications that write next to their code must be changed.",
    "**Non-root needs the image prepared:** file ownership, ports above 1024 (or the NET_BIND_SERVICE capability), and a user that exists.",
    "**Limits need numbers** from load tests; too low gives out-of-memory kills, too high protects nothing.",
    "**The default seccomp profile is generous on purpose.** A custom profile for your application is stronger and costs maintenance.",
    "**Hardening is not isolation.** Containers share the host kernel: a kernel bug can still escape. For hostile code use a sandboxed runtime or virtual machines.",
]
too_much = """
Do not turn every flag on at once without tests: add one setting, run the application's tests and a smoke test, and record the result. And do not mistake the container for the whole defence: network policy, secrets management and patching still apply.
"""
met_before = [
    "`docker run --privileged` and `-v /var/run/docker.sock:/var/run/docker.sock` in tutorials.",
    "`securityContext` in Kubernetes manifests, and Pod Security admission labels.",
    "Distroless and non-root base images.",
    "A scanner report titled \"container runs as root\".",
]
where = """
This project is in [platform-hardening](..) and follows [linux-hardening](../linux-hardening): the host settings below the container. The Docker and kind version (container-hardening-with-docker-and-kind) applies these flags to real containers and enforces Pod Security Standards.
"""
twin = """
The attacks are rules, not a kernel: each rule states the documented effect of a Linux or Docker setting (capabilities, user namespaces, seccomp, mounts, cgroup limits). That keeps the project runnable anywhere and the output exact. The Pod Security Standards checks follow the Baseline and Restricted profiles of the Kubernetes documentation.
"""
test_note = "Everything is fixed data, so the demo prints the same text on every run."

[[act]]
title = "What 'docker run' with no options gives an attacker"
summary = "7 of 13 attacks are possible and the level is Baseline: root, a writable file system, raw sockets, and no memory or process limits."
detail = """
The default container runs as root, has 14 capabilities including NET_RAW, a writable root file system and no limits. A hijacked process can read the secrets in its environment, change the application's files, drop and run a tool, sniff the pod network, and exhaust memory or processes.
The default seccomp profile blocks the dangerous system calls, and no host directories, sockets or namespaces are shared, so the kernel and the host are not directly in reach. Kubernetes classifies it as Baseline.
"""
speech = """
First demo: what docker run with no options gives an attacker. [[slnc 400]] Seven of thirteen attacks are possible. [[slnc 300]] The process is root. [[slnc 300]] The file system is writable. [[slnc 300]] There are no limits. [[slnc 600]]
The default seccomp profile still blocks the dangerous system calls, and nothing of the host is shared.
"""
rows = { defaults = "active amber" }
console = [
    ["tamper-with-app, drop-and-run, become-root, sniff-network, exhaust-memory, fork-bomb, read-secrets  POSSIBLE", "amber"],
    ["dangerous-syscalls, mount-host, docker-socket, host-files, host-network, see-host-processes  blocked", "ok"],
    ["7 of 13 attacks possible; level: BASELINE", "amber"],
]

[[act]]
title = "The configuration from the tutorial"
summary = "--privileged, the Docker socket, the host's /etc, the host network and PID namespace, and unconfined seccomp make all 13 attacks possible; the level is Privileged."
detail = """
The command that appears in many "how to run" pages is privileged, mounts the Docker socket and /etc, shares the host's network and process namespaces, and removes the seccomp filter. All thirteen attacks are possible, including starting a privileged container through the socket, which is root on the host.
The checker lists six reasons the container is not even Baseline.
"""
speech = """
Second demo: the configuration from the tutorial. [[slnc 400]] Privileged. The docker socket. The host's etc directory. The host network and process space. No seccomp filter. [[slnc 600]]
All thirteen attacks are possible. [[slnc 300]] The docker socket alone is root on the host.
"""
rows = { reckless = "active wrong" }
console = [
    ["docker run --privileged --security-opt seccomp=unconfined --network host --pid host -v /var/run/docker.sock:/var/run/docker.sock -v /etc:/etc shop-app:latest", "bad"],
    ["13 of 13 attacks possible; level: PRIVILEGED", "bad"],
]

[[act]]
title = "One setting at a time"
summary = "Removing host access takes 13 down to 9, seccomp 8, dropping capabilities 6, a non-root user alone changes nothing, no new privileges 5, a read-only root 3, and limits 1."
detail = """
Starting from the tutorial configuration: removing privileged and the host namespaces and mounts cuts the attacks from 13 to 9; the default seccomp profile blocks the dangerous system calls (8); dropping all capabilities blocks raw sockets and mounting (6) and reaches Baseline. A non-root user alone changes nothing,
because set-user-id programs can still raise privileges; with no_new_privs the become-root attack is blocked (5) and the container reaches Restricted. A read-only root file system with a noexec temporary directory blocks tampering and dropping a tool (3), and memory and process limits block the last two (1).
"""
speech = """
Third demo: one setting at a time. [[slnc 400]] Remove the host access, and thirteen attacks become nine. [[slnc 300]] The default seccomp profile, eight. Drop all capabilities, six. [[slnc 600]]
A non-root user on its own changes nothing, because set user id programs can still raise privileges. [[slnc 300]] Forbid new privileges, five. A read only file system, three. Limits, one.
"""
rows = { steps = "active ok" }
console = [
    ["start: the tutorial configuration -> 13 of 13 possible, level PRIVILEGED", "bad"],
    ["no privileged, no host network, PID or mounts -> 9 of 13", "amber"],
    ["drop all capabilities -> 6 of 13, level BASELINE", "amber"],
    ["run as a user that is not root -> 6 of 13 (no change by itself)", "amber"],
    ["no new privileges -> 5 of 13, level RESTRICTED", "ok"],
    ["read-only root, noexec temporary directory -> 3 of 13", "ok"],
    ["memory and process limits -> 1 of 13", "ok"],
]

[[act]]
title = "The hardened container"
summary = "The result as Docker flags and a Kubernetes securityContext, at the Restricted level; the one thing still possible is reading the secrets the application needs."
detail = """
The hardened container runs as user 10001, drops all capabilities, has a read-only root with a noexec tmpfs, forbids new privileges, has a 512 MB memory limit and a 200-process limit, takes its secrets from files, and uses an image pinned by digest. The same settings are printed as a docker run command and as a Kubernetes
securityContext, so what was checked is what is deployed. The level is Restricted. Of the thirteen attacks only one is left: a hijacked application can read the secrets it was given, because it needs them.
"""
speech = """
Fourth demo: the hardened container. [[slnc 400]] A user that is not root. No capabilities. A read only file system. No new privileges. Limits. An image pinned by digest. [[slnc 600]]
The settings are printed as docker flags and as a kubernetes security context, so what was checked is what is deployed. [[slnc 600]]
One attack is left: reading the secrets the application needs. Hardening limits the damage. It does not fix the flaw.
"""
rows = { hardened = "active ok" }
console = [
    ["docker run --user 10001 --cap-drop=ALL --read-only --tmpfs /tmp:rw,noexec,nosuid --security-opt no-new-privileges --memory 512m --pids-limit 200 shop-app@sha256:9f2c1a7d", "ok"],
    ["level: RESTRICTED", "ok"],
    ["still possible: read-secrets  (the application must read its secrets, so a hijacked application can too)", "amber"],
]

[[act]]
title = "Settings that look harmless"
summary = "NET_RAW added to the hardened container drops it to Baseline with 1 attack possible because it is not root; root with SYS_ADMIN makes it Privileged with 3 possible."
detail = """
Adding NET_RAW back keeps the level at Baseline (NET_RAW is in the default set, but Restricted wants every capability dropped) and still blocks sniffing, because the process is not root. Running as root with CAP_SYS_ADMIN, which looks like a small change, makes the level Privileged: mounting becomes possible, and root inside the container comes back.
"""
speech = """
Fifth demo: settings that look harmless. [[slnc 400]] Add the raw sockets capability back to the hardened container. [[slnc 300]] It drops from restricted to baseline, but sniffing is still blocked, because the process is not root. [[slnc 600]]
Run as root with the system admin capability, and it is privileged again, with three attacks possible.
"""
rows = { harmless = "active amber" }
console = [
    ["hardened + NET_RAW -> level BASELINE, 1 of 13 attacks possible (NET_RAW matters only to root)", "amber"],
    ["hardened + root + SYS_ADMIN -> level PRIVILEGED, 3 of 13 attacks possible", "bad"],
]

[animation]
subtitle = "A hijacked process in a container, thirteen things it might try, and the settings that stop them."
boxes = [
    ["defaults", "docker run defaults", "7 of 13 possible"],
    ["reckless", "The tutorial configuration", "all 13"],
    ["steps", "One setting at a time", "13, 9, 8, 6, 5, 3, 1"],
    ["hardened", "Restricted", "only the app's own secrets remain"],
    ["harmless", "Harmless-looking additions", "root and SYS_ADMIN undo it"],
]

[docs.problem]
scenario = """
A web shop runs in containers. The application has flaws, as applications do, and the team wants to limit what one compromised container can do.
"""
naive = """
Run it with whatever flags make it start, and fix problems as they appear.
"""
deliver = [
    "A container specification covering user, capabilities, privilege, file system, seccomp, host access, limits, secrets and image.",
    "An attacker model with thirteen attacks, each tied to the setting that decides it.",
    "Pod Security Standards levels with the reasons for failing the next level.",
    "Renderers for Docker flags and a Kubernetes securityContext.",
]

[docs.prerequisites]
required = [
    "Java basics",
    "An idea of what a container is and what `docker run` does",
]
not_required = [
    "Docker or Kubernetes: the project models their settings",
    "Linux kernel knowledge",
]
install = []

[docs.session]
objectives = [
    "name the settings that decide what a compromised container process can do",
    "explain why a non-root user is not enough alone",
    "list what the Restricted Pod Security level requires",
    "explain what hardening does not fix",
]
walkthrough = """
Run act two and ask which one setting is the worst, and why. In act three, ask why changing the user did not change the count. In act four, ask what the next layers (network policy, secrets management) have to do for the one attack that is left.
"""
exercises = [
    "Add an attack for the service account token mounted at a well-known path, and a setting that blocks it.",
    "Add a network egress setting and an attack that uses it to reach the cloud metadata address.",
    "Add a custom seccomp profile level between the default and unconfined.",
    "Read a Kubernetes YAML file and build a ContainerSpec from it.",
]

[docs.explained]
sentence = """
Design a container for the day its process is taken over: non-root, no capabilities, no new privileges, read-only root, no host access, limits, secrets as files and an image pinned by digest, and know that this limits the damage and does not remove the flaw.
"""
verdict = """
Aim for the Restricted Pod Security level for application workloads. Use distroless or minimal non-root images, pin by digest, pass secrets as files from a secret store, add network policies, and enforce the standards with admission control so that a new workload cannot drift.
"""
recognise = [
    "`--privileged`, `--cap-add`, `-v /var/run/docker.sock`, `--network host`, `--pid host`.",
    "`securityContext`, `runAsNonRoot`, `readOnlyRootFilesystem`, `allowPrivilegeEscalation: false`.",
    "`pod-security.kubernetes.io/enforce: restricted` on a namespace.",
    "CIS Docker Benchmark findings.",
]

[spec]
purpose = """
Teach container hardening by asking thirteen attack questions of a container's settings, removing the attacks one setting at a time, classifying the result by Pod Security level, and showing what hardening leaves open.
"""
nongoals = [
    "A kernel or runtime simulation.",
    "Enforcing policies on a real cluster: container-hardening-with-docker-and-kind.",
    "Sandboxed runtimes (gVisor, Kata) and virtual machines.",
]
problem = """
Containers run with defaults and tutorial flags, so one application flaw becomes a host compromise.
"""
roles = [["The settings", "`ContainerSpec`, `Seccomp`"], ["The attacker model", "`Attacker`, `Attack`, `Outcome`"], ["The levels and renderings", "`PodSecurityLevel`, `Renderer`"], ["Entry point", "`ContainerDemo`"]]
requirements = [
    "Docker's defaults allow 7 of the 13 attacks and are at the Baseline level.",
    "The tutorial configuration allows all 13 and is Privileged, with the reasons listed.",
    "Each hardening setting blocks the attacks it should, and a non-root user alone does not block privilege escalation.",
    "The hardened container is Restricted and allows only reading the application's own secrets.",
    "The rendered Docker flags and securityContext match the settings.",
    "The demo prints the same output on every run.",
]

