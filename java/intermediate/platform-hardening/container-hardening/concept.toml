[[act]]
title = "The hardened container"
summary = "The same settings as a docker run command and as a Kubernetes securityContext; all nine Pod Security checks pass, so the level is Restricted. The one attack left is read-secrets: the app must read its secrets, so a hijacked app can too."
detail = """
The input is the hardened container: user 10001, all capabilities dropped, a read-only root with a noexec, nosuid tmpfs on /tmp, no new privileges, 512 MB of memory and 200 processes at most, secrets as files, and an image pinned by its digest.
The same settings are written twice from one object, as a `docker run` command and as a Kubernetes `securityContext`, so what was checked is what is deployed.
The result, check by check: all six Baseline checks and all three Restricted checks pass, so the level is Restricted. One attack is still possible, read-secrets: the application must read its secrets, so a hijacked application can read them too. Hardening limits the damage; it does not fix the flaw.
"""
figure = "level_checks"
figure_title = "Every Pod Security check, before and after"
figure_speech = """
Fourth demo: the hardened container. [[slnc 400]] This picture shows how the Kubernetes level is made, check by check. [[slnc 300]] The middle column is Docker's defaults, and the right column is the hardened container. [[slnc 700]]
The first six checks are the baseline level. [[slnc 300]] They keep the host out: no privileged mode, no host network, no host process space, no host folders, a seccomp filter, and no extra capabilities. [[slnc 300]] The defaults already pass them. [[slnc 600]]
The last three are the restricted level. [[slnc 300]] Not root, no privilege escalation, and all capabilities dropped. [[slnc 300]] The defaults fail all three. [[slnc 300]] The hardened container passes every check, so its level is restricted.
"""
speech = """
Here is the hardened container as a docker run command. [[slnc 300]] A user that is not root, no capabilities, a read only root with a temporary folder that cannot run programs, no new privileges, limits, and an image pinned by digest.
[[page]]
