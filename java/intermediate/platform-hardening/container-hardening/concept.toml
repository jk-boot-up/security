[[act]]
title = "One setting at a time"
summary = "Starting from 13 of 13: no host access 9, the default seccomp profile 8, drop all capabilities 6 (Baseline), a user that is not root 6 (blocks nothing alone), no new privileges 5 (Restricted), a read-only root with a noexec /tmp 3, memory and process limits 1: only read-secrets is left."
detail = """
The input of each step is the container of the step before, with one setting more. The result is the count, the level, and the attacks that step blocked, worked out as the difference of the two lists.
No host access blocks docker-socket, host-files, host-network and see-host-processes (13 to 9). The default seccomp profile blocks dangerous-syscalls (8). Dropping all capabilities blocks sniff-network and mount-host (6) and passes Baseline.
A user that is not root blocks nothing on its own, because set-user-id programs in the image can still raise privileges. No new privileges sets no_new_privs and blocks become-root (5); with it, all three Restricted checks pass. A read-only root with a noexec /tmp blocks tamper-with-app and drop-and-run (3), and limits block exhaust-memory and fork-bomb (1).
"""
figure = "step_matrix"
figure_title = "Which attacks are left after each step"
figure_speech = """
Third demo: one setting at a time. [[slnc 400]] Each row is one attack, and each column is the container after one more step. [[slnc 300]] A red square is an attack that is still possible. [[slnc 700]]
At the start, every square is red. [[slnc 300]] Step one removes the host access: four attacks on the host go away, and nine are left. [[slnc 300]] Step two, the default seccomp profile, blocks the dangerous system calls: eight. [[slnc 300]] Step three drops all capabilities: no raw sockets and no mounting, six, and the level becomes baseline. [[slnc 600]]
Step four changes the user, and look: nothing changes. [[slnc 300]] A set user id program can still make the process root. [[slnc 300]] Step five forbids new privileges, and now become root is blocked: five, and restricted. [[slnc 300]] A read only root takes it to three, and limits to one.
"""
