key = "01-poster"
kind = "poster"
title = "Container Hardening"
narration = "Hello, and welcome. [[slnc 400]] This video explains container Hardening, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A container is a process with settings, so decide what a hijacked process can do before it happens: run as a non-root user, drop all capabilities, forbid new privileges, make the root file system read-only, keep the host out, and set limits; each setting removes specific attacks, and the Pod Security Standards name the levels. [[slnc 600]] Think of it this way. [[slnc 300]] A guest in a hotel room can do what the room allows: with the master key and the service lift (privileged, host mounts), they can reach every floor; with a plain key, only their room; with a room that has no phone line to the safe and a lock on the minibar, much less. You design the room for the day a guest turns out to be a thief. [[slnc 700]] In this video, the domain is a containerised web shop. [[slnc 500]] By the end, you will be able to: [[slnc 300]] Name the settings that decide what a compromised container process can do. [[slnc 300]] Explain why a non-root user is not enough alone. [[slnc 300]] List what the Restricted Pod Security level requires."

[[scene]]
key = "02-scenario"
