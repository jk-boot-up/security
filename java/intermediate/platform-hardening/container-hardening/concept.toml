[threatmodel]
scope = """
The runtime settings of an application container, after an attacker has gained code execution inside it. It covers what that process can do to the container, the host and its neighbours.
It does not cover how the attacker got in, kernel vulnerabilities, or the network policy around the container.
"""
assets = [
    "The host and the other containers on it.",
    "The application's files and the secrets it holds.",
    "The availability of the node.",
]
actors = [
    "An attacker with code execution in the application.",
    "The operator who writes the container settings.",
]
boundaries = [
    "The container to the host: the kernel interface, mounts and shared namespaces.",
    "The container to its neighbours: shared resources and the network.",
]
assumptions = [
    "The kernel and the container runtime are patched.",
    "The thirteen attacks are representative, not exhaustive.",
]
out_of_scope = [
    "Kernel exploits and runtime escapes: patch, and use sandboxed runtimes for hostile code.",
    "Network policy and egress control.",
]
tests = [
    "`ContainerTest` checks the attack rules for each setting, the three configurations, the Docker socket, the effect of a non-root user with and without no_new_privs, root with SYS_ADMIN, the Pod Security levels and violations, and the rendered flags and YAML.",
    "`ContainerTest` also checks the nine Pod Security checks, the grouping of the attacks, the one-flag-per-line command and that every demo line fits a slide.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next module, detection-and-response, asks how an attack is noticed and handled once it gets through, starting with detecting attacks in logs.
"""

[[threat]]
id = "T1"
stride = "E"
threat = "A hijacked process escapes to the host through privileges, capabilities, seccomp gaps, mounts or the Docker socket"
where = "`Attacker` rules: become-root, mount-host, docker-socket, host-files, dangerous-syscalls"
control = "Non-root, drop ALL capabilities, no new privileges, default seccomp, no host mounts or namespaces, never --privileged"
residual = "Kernel vulnerabilities: patch and consider sandboxed runtimes"

[[threat]]
id = "T2"
stride = "D"
threat = "A hijacked process uses all the memory or processes of the node"
where = "`Attacker` rules: exhaust-memory, fork-bomb"
control = "Memory and process limits, and CPU limits"
residual = "Limits set too high, or noisy neighbours that share a limit"

[[threat]]
id = "T3"
stride = "T"
threat = "A hijacked process changes the application, drops a tool, or reads its secrets"
where = "`Attacker` rules: tamper-with-app, drop-and-run, read-secrets"
control = "Read-only root, noexec temporary directory; secrets as files from a secret store, short-lived"
residual = "The application's own secrets stay readable by the application: rotate them and limit their reach"

[poster]
headline = [["CONTAINER", "text"], ["HARDENING", "accent"]]
taglines = [["Assume the process is taken over, and ask what it can reach", "gold"]]
before = { code = "docker run shop-app:latest", note = "7 of 13 attacks possible", tag = "BEFORE" }
after = { code = "--cap-drop=ALL --read-only", note = "1 of 13, Restricted", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "Container Hardening"
narration = "Hello, and welcome. [[slnc 400]] This video explains container hardening, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A container is just a process, with settings. [[slnc 300]] Hardening means deciding, before an attack, what a hijacked process could reach: run it as a user that is not root, drop its capabilities, forbid new privileges, make its files read only, keep the host out, and set limits. [[slnc 300]] Each setting removes specific attacks. [[slnc 600]] Think of a hotel room for a guest you do not fully trust: no master key, no access to other floors, and a limit on the minibar. [[slnc 600]] Our example is a containerised web shop."

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["A web shop runs in a container,", "and its application has a flaw", "that lets an attacker run code inside.", "", "The demo asks thirteen questions", "of each configuration:", "what can the attacker reach now?"]
narration = "Here is the scenario. [[slnc 400]] A web shop runs in a container, and its application has a flaw that lets an attacker run code inside. [[slnc 500]] The demo models the container's settings, and asks thirteen questions of each configuration: can the attacker read secrets, become root, reach the host, use the Docker socket, run out the memory, and so on. [[slnc 500]] It tries Docker's defaults, a tutorial's configuration, and then hardens one setting at a time."

[[scene]]
key = "02-words"
kind = "bullets"
title = "The Words"
body = ["Capability: one slice of root's power", "seccomp: a filter on system calls", "Namespace: the container's own view", "cgroup: a limit on memory or processes", "no_new_privs: no gaining privileges later", "Pod Security Standards: three levels"]
narration = """Before the demos, the words. [[slnc 500]] Linux splits root's power into about forty capabilities, such as raw sockets or system admin. [[slnc 500]] Seccomp, secure computing mode, is a filter on the system calls a process may make. [[slnc 500]] A namespace gives the container its own view of the network, the processes, and the files. [[slnc 500]] A cgroup, a control group, limits the memory and the processes it may use. [[slnc 500]] No new privs is a flag that stops a process from gaining privileges later, even through a set user id program. [[slnc 500]] And the Kubernetes Pod Security Standards name three levels: privileged, baseline, and restricted."""

[[scene]]
key = "02-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "02-reach"
kind = "figure"
title = "One hijacked process, thirteen questions"
body = "reach_map"
narration = """Let's see the core idea on one example. [[slnc 400]] An attacker found a flaw in the shop's application, and now runs code inside its container. [[slnc 300]] In the middle, that hijacked process. [[slnc 600]] Around it, thirteen questions, grouped by what they reach. [[slnc 300]] Top left, inside the container: read the secrets, change the app, drop a tool and run it, become root. [[slnc 300]] Top right, the kernel: dangerous system calls, raw sockets, mounting. [[slnc 300]] Bottom left, the host: the Docker socket, host files, the host network and its processes. [[slnc 300]] And bottom right, the node's resources: memory and processes. [[slnc 700]]
Each answer depends on one setting of the container. [[slnc 300]] Red means possible, green means blocked. [[slnc 300]] With no options at all, seven are red."""

[[scene]]
key = "03-acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "04-costs"
kind = "bullets"
title = "What It Costs"
body = ["Read-only files need writable temp folders", "Dropped capabilities break some images", "Limits must be sized, or they kill the app", "Non-root needs ports above 1024", "Debugging inside is harder"]
narration = "Nothing is free. [[slnc 400]] Here is what it costs. [[slnc 500]] A read only file system means every place the application writes must be a separate, writable folder. [[slnc 500]] Dropping all capabilities breaks images that quietly relied on them. [[slnc 500]] Memory and process limits must be sized, or they stop the application under real load. [[slnc 500]] A user that is not root usually needs a port above 1024. [[slnc 300]] And debugging inside a locked-down container is harder."

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["--privileged in a docker run command", "/var/run/docker.sock mounted into a container", "runAsNonRoot and readOnlyRootFilesystem", "Pod Security admission: restricted"]
narration = "You have probably met this already. [[slnc 400]] Privileged, in a docker run command, turns almost every protection off. [[slnc 500]] The Docker socket mounted into a container is root on the host, for anything inside. [[slnc 500]] Run as non root, and read only root file system, in a Kubernetes manifest, are the hardened settings. [[slnc 500]] And a namespace labelled for the restricted pod security level checks them all at once."

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Never privileged; never the Docker socket", "No host network, process space or mounts", "Run as a user that is not root", "Drop all capabilities; no new privileges", "Read-only root; limits on memory and processes", "Aim for the Restricted level"]
narration = "So, how do you use it? [[slnc 400]] Never run privileged, and never mount the Docker socket. [[slnc 300]] Keep the host's network, processes, and files out. [[slnc 500]] Run as a user that is not root, drop all capabilities, and forbid new privileges. [[slnc 500]] Make the root file system read only, and set limits on memory and processes. [[slnc 300]] Aim for the restricted level. [[slnc 500]] And remember: hardening limits the damage, it does not fix the application's flaw."

[[scene]]
key = "12-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add an attack that reaches", "the cloud metadata address, and a setting that blocks it."]
narration = "That's container hardening. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Assume the process is taken over, and decide what it can reach: no root, no capabilities, no new privileges, a read only file system, nothing of the host, and limits. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add an attack that uses the network to reach the cloud metadata address, and a setting that blocks it. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] The container is plain data, so the classes are all about the rules. [[slnc 300]] Here are the ones that matter."""

[[class]]
name = "ContainerSpec"
what = "the settings that decide what a hijacked process can do"
[[class.part]]
title = "root, and a capability"
code = """
public boolean runsAsRoot() {
    return user.equals("root") || user.equals("0");
}
...
public boolean has(String capability) {
    return privileged || capabilities.contains("ALL")
            || capabilities.contains(capability);
"""
speech = """A record with one field per setting, and two questions the rules ask often. [[slnc 300]] Is the user root, by name or by number zero? [[slnc 300]] And does it hold a capability: a privileged container holds them all. [[slnc 300]] Each hardening step returns a copy with one field changed."""

[[class]]
name = "Attacker"
what = "thirteen attacks, each answered by the setting that decides it"
[[class.part]]
title = "one rule per attack"
code = """
case "become-root" -> c.runsAsRoot() ? yes(a, "it already runs as root")
        : c.allowPrivilegeEscalation() ? yes(a, "set-user-id programs work")
        : no(a, "not root, no_new_privs set");
"""
speech = """Each attack is one case, and each answer carries its reason. [[slnc 300]] Become root is blocked only when the user is not root and new privileges are forbidden. [[slnc 300]] That is why step four alone changed nothing."""

[[class]]
name = "PodSecurityLevel"
what = "the three Kubernetes levels, decided check by check"
[[class.part]]
title = "a check per rule"
code = """
new Check(BASELINE, "no host network",
        c -> c.hostNetwork() ? List.of("host network") : List.of()),
...
new Check(RESTRICTED, "not root",
        c -> c.runsAsRoot() ? List.of("runs as root") : List.of()),
"""
speech = """Each check has a level, a name, and the problems it finds. [[slnc 300]] An empty list means it passes."""
[[class.part]]
title = "the highest level that passes"
code = """
if (!violations(c, BASELINE).isEmpty()) {
    return PRIVILEGED;
}
return violations(c, RESTRICTED).isEmpty() ? RESTRICTED : BASELINE;
"""
speech = """Any baseline problem gives privileged. [[slnc 300]] Otherwise, any restricted problem gives baseline, and none gives restricted."""

[[class]]
name = "Renderer"
what = "the same settings as Docker flags and a Kubernetes securityContext"
[[class.part]]
title = "flags from the fields"
code = """
if (!c.runsAsRoot()) {
    a.add("--user " + c.user());
}
if (c.capabilities().isEmpty()) {
    a.add("--cap-drop=ALL");
}
"""
speech = """The command is written from the same object the attacker checked. [[slnc 300]] So the flags that are deployed are the settings that were tested."""

[[class]]
name = "ContainerDemo"
what = "runs the five demos and works out each step"
[[class.part]]
title = "what a step blocked"
code = """
List<String> blocked = new ArrayList<>(Attacker.possibleIds(before));
blocked.removeAll(Attacker.possibleIds(after));
"""
speech = """What a step blocked is worked out, not written by hand: the attacks possible before, minus the attacks possible after."""

