Here is the real output. [[slnc 400]] First the input: the settings of the default container. [[slnc 300]] Root, fourteen capabilities, a writable file system, the default seccomp profile, no host access, and no limits.
[[page]]
Then the result, attack by attack. [[slnc 300]] Inside the container, every attack is possible. [[slnc 300]] In the kernel, seccomp blocks the dangerous system calls, and there is no system admin capability. [[slnc 300]] But root with the raw sockets capability can sniff the network.
