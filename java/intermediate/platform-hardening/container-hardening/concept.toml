narration = "Nothing is free. [[slnc 400]] Here is what it costs. [[slnc 500]] Read-only file systems need writable scratch space. [[slnc 500]] Non-root needs the image prepared. [[slnc 500]] Limits need numbers. [[slnc 500]] The default seccomp profile is generous on purpose. [[slnc 500]] Hardening is not isolation."

[[scene]]
key = "05-roles"
