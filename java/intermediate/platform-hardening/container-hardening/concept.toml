narration = "So, how do you use it? [[slnc 400]] Aim for the Restricted Pod Security level for application workloads. [[slnc 500]] Use distroless or minimal non-root images, pin by digest, pass secrets as files from a secret store, add network policies, and enforce the standards with admission control so that a new workload cannot drift."

