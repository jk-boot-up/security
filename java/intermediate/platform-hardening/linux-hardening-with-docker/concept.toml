[[act]]
title = "The fixes a machine can make, and where they live"
summary = "Seven fix commands (chmod u-s, g-w, 640, 600, o-w) run as root in the running container: 19 - 7 = 12 findings, none a permission. docker diff lists the seven changed files in the container's own layer, plus 8 parent folders. A new container from the same image has 19 findings again."
detail = """
The input is the 7 auto findings and their fix commands: chmod u-s on the hidden shell, chmod g-w on the cron script, chmod 640 on /etc/shadow, chmod 600 on the host key and the config, chmod o-w on the upload folder and its file. They run as root in the running container.
The result in that container: 19 - 7 = 12 findings, none of them a permission. docker diff shows where the changes live: the seven files, marked C for changed, in the container's own writable layer, and 8 parent folders.
A new container from the same image has 19 findings again: the fixes stayed in the old container's layer. The image is what runs next time, so a change belongs in the image's recipe.
"""
figure = "findings_bars"
figure_title = "Nineteen, twelve, and nineteen again"
figure_speech = """
Second demo: the fixes a machine can make, and where they live. [[slnc 400]] On the left, the seven fix commands, run as root in the running container. [[slnc 300]] Remove the set user id bit, remove group write, tighten the secrets, remove write for others. [[slnc 700]]
On the right, the number of findings. [[slnc 300]] Nineteen in the typical container. [[slnc 300]] Nineteen minus seven leaves twelve, after the fix, in the same container. [[slnc 700]]
Then a new container, from the same image. [[slnc 300]] Nineteen again. [[slnc 300]] The fixes never reached the image.
"""
speech = """
Here is the output. [[slnc 400]] The seven fix commands, each a chmod. [[slnc 300]] After the fix, in the same container: nineteen minus seven is twelve, and none of them is a permission.
[[page]]
Where the fix lives: docker diff lists the seven files, marked C for changed, in the container's own layer, and eight parent folders. [[slnc 400]] A new container from the same image: nineteen findings again.
"""
