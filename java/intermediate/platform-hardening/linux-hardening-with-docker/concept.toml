[[act]]
title = "The bill"
summary = "Inside the container kernel.randomize_va_space reads 2, the host's value, and writing 0 is refused: read-only file system. A container shares the host's kernel; the scan ran as root; the allow-lists are the shop's; how a container is started is the next project."
detail = """
The input is the kernel, seen from inside a container: kernel.randomize_va_space reads 2, which is the host's value. Writing 0 to it from inside is refused: a read-only file system.
What it means: a container shares the host's kernel, so kernel settings are the host's to fix. The scan ran as root; an attacker starts as the app process and sees less. The allow-lists, port 8080 and no set-user-id file, are the shop's own decisions. How a container is started, with which user, capabilities and mounts, is the subject of container-hardening.
"""
figure = "kernel"
figure_title = "One kernel, shared"
figure_speech = """
Fifth demo: the bill. [[slnc 400]] A container is not a small computer. [[slnc 300]] It is a process on the host, and it shares the host's kernel. [[slnc 700]]
Inside the container, randomize va space reads two: that is the host's value. [[slnc 300]] Writing zero to it from inside is refused, because that part of the file system is read only. [[slnc 700]]
So kernel settings are the host's to fix, and the image cannot answer them.
"""
speech = """
Here is the output. [[slnc 400]] Read: two, the host's value. [[slnc 300]] Write zero: refused, read only file system. [[slnc 400]] What it means: the host fixes kernel settings. [[slnc 300]] The scan ran as root, and an attacker starts as app. [[slnc 300]] The allow-lists are the shop's own. [[slnc 300]] And how a container is started is the next project.
"""
