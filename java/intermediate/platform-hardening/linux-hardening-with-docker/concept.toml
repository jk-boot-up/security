[[act]]
title = "Running it again"
summary = "A running hardened container has 0 findings; after chmod 666 /opt/app/config.properties inside it, the same scan finds loose-permissions and world-writable-file, both HIGH: 0666 & ~0600 = 0066, rw- for the group and others. A new container from the image has 0 findings."
detail = """
The input is a running hardened container with 0 findings, and someone who runs chmod 666 /opt/app/config.properties inside it.
The result: the same scan finds loose-permissions and world-writable-file on the config, both HIGH. The bits that are too many are worked out as 0666 & ~0600 = 0066: read and write for the group and for everyone else.
A new container from the image has 0 findings. The scan runs in the build on the image, and on running containers it finds drift; the answer to drift is a new container.
"""
figure = "drift"
figure_title = "Drift inside a running container"
figure_speech = """
Fourth demo: running it again. [[slnc 400]] Someone runs chmod six six six on the config file, inside a running hardened container. [[slnc 700]]
The mode now is zero six six six. [[slnc 300]] The policy allows zero six zero zero. [[slnc 300]] Take away the allowed bits, and zero zero six six is left: read and write, for the group and for everyone else. [[slnc 700]]
The same scan finds two high findings. [[slnc 300]] A new container from the image has none. [[slnc 300]] So the answer to drift is a new container.
"""
speech = """
Here is the output. [[slnc 400]] Before the drift: zero findings. [[slnc 300]] The drift: chmod six six six on the config file. [[slnc 300]] After it, the same scan finds two high findings, and the bits that are too open, zero zero six six. [[slnc 400]] A new container from the image: zero findings.
"""
