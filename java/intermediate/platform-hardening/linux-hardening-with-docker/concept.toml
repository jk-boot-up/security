# concept.toml: everything about this project that is not Java code.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "linux-hardening-with-docker"
level = "intermediate"
module = "platform-hardening"
title = "Linux Hardening with Docker"
short_title = "Hardening with Docker"
package = "hostscan"
main_class = "HostScanDemo"
tagline = "Scan a real container the way an auditor scans a host, fix what a machine can fix, and put every decision where it lasts: in the recipe of the image"
bold = "A script run as root inside a real container reads its file modes, accounts, sshd_config, listening ports and kernel settings; a typical image has 19 findings, a machine can fix the 7 permission ones, but a fix inside a running container is gone in the next one, so the decisions belong in the image's recipe, which gives a hardened image with 0 findings; a container cannot change the kernel it shares, and how it is started is a separate matter."
domain = "an online store"
domain_note = ""
youtube_description = "Two real Docker images built from Dockerfiles for an online store's server: a typical one with an account without a password, a second root, a copied shell with the setuid bit, a world-writable upload folder, loose modes on the shadow file, a host key and a config, an sshd_config that allows root and empty passwords, and three listeners on every interface; a scan run as root inside the container finds 19 findings, a machine fixes 7 and docker diff shows where they live, a new container has all 19 again, and the same shop with its decisions in the recipe has none."
thumb_lines = ["HARDENING", "WITH DOCKER"]
thumb_code = "docker exec -u 0 shop sh -c 'find / -perm -4000'"
youtube_title = "Linux Hardening with Docker: Scanning a Real Container and Fixing the Image (CIS Benchmarks)"
youtube_tags = ["linux hardening", "docker", "cis benchmarks", "container security", "file permissions", "sshd_config", "setuid", "security misconfiguration", "owasp top 10", "java"]

[readme]
intro = """
The plain [linux-hardening](../linux-hardening) project checks a prepared directory tree that stands in for a container image. This one checks **real containers**: it builds two Docker images from Dockerfiles written by the demo (`alpine:3.24.3` underneath), starts them, and runs one script as root inside each to read the files and modes, accounts, `sshd_config`, listeners and kernel settings. It needs Docker; the tests are tagged `integration`: `./gradlew integrationTest`.

What it shows:
- **A typical image.** 19 findings: an account with no password and a second UID 0 account, a copied shell with the set-user-id bit, a world-writable upload folder and file, a shadow file, a host key and a config that are too open, a group-writable cron script, root login and empty passwords in `sshd_config`, and three listeners on every interface (telnet, an unauthenticated Docker API, Redis).
- **What a machine can fix, and where the fix lives.** Seven are permission changes. They are applied in the running container; `docker diff` lists them in its writable layer; **a new container from the same image has all 19 again.**
- **The decisions, in the recipe.** A hardened Dockerfile: no second root, no test account, a locked service account, private modes, no copied shell, one listener on 8080, the process runs as `app`, and the container started with `accept_redirects` 0 and `syncookies` 1: **0 findings**.
- **Running it again.** Loosen the config inside a running hardened container and the scan finds the drift; a new container has none.
- **The bill.** A container shares the host's kernel: `kernel.randomize_va_space` cannot be changed from inside (read-only file system). Allow-lists are the shop's decisions, and how a container is started is the subject of [container-hardening](../container-hardening).

**Maps to:** OWASP Top 10 (2025) A02 Security Misconfiguration · CIS Benchmarks for Linux and Docker · CWE-732 (incorrect permission assignment), CWE-250 (execution with unnecessary privileges), CWE-1188.
"""
analogy = """
A building inspector who checks a flat in a block and tightens a loose handrail on the spot. When the tenants move out the handrail is loose again, because it was the flat that was fixed and not the plans. The fix that lasts is the one made in the plans.
"""
scenario = """
An online store ships its server as a container image. The demo builds the typical image that nobody reviewed and the same shop with its decisions made, and scans both.
"""
costs = [
    "**The scan needs a rule for each setting,** and each rule needs an allow-list that someone owns.",
    "**A running container is a copy:** fixing it fixes nothing that lasts.",
    "**The kernel is the host's,** so some checks cannot be answered by the image.",
    "**Hardening can break the application,** so the scan runs where the tests do.",
    "**Images age:** new packages and new files bring new findings.",
]
too_much = """
A throw-away container that runs one trusted command for a few seconds does not need a scan. Scan images that run for long, accept connections or hold data.
"""
met_before = [
    "A `USER` line, or its absence, in a Dockerfile.",
    "`chmod 777` in a deployment script to \"make it work\".",
    "A CIS benchmark report.",
    "`docker exec` used to fix something in production.",
]
where = """
This is the tools version of [linux-hardening](../linux-hardening), in the [platform-hardening](..) module. How the container is started, with which user, capabilities and mounts, comes next in [container-hardening](../container-hardening).
"""
twin = """
The images are real, built from Dockerfiles written here on a pinned Alpine; the containers are real, with their own namespaced kernel settings; the scan is one script run through docker exec. Container names are never printed; the demo takes about half a minute.
"""
test_note = "The rule tests run on text and need no container. The scan tests build the two images and start containers, and remove them (./gradlew integrationTest). They need Docker."

[[act]]
title = "What the scan finds in a typical image"
summary = "A real container, one script run as root inside it, and 19 findings from critical to low."
detail = """
shop-host:typical is a real container from a real image, scanned by one script run as root inside it: files and modes, accounts, sshd_config, listeners from /proc/net/tcp, kernel settings. It finds 19 findings: 7 critical (an account with no password, a second root, a set-user-id copy of a shell, empty passwords in sshd_config, and three listeners: telnet, an unauthenticated Docker API and Redis), 8 high, 2 medium and 2 low. Seven can be fixed mechanically.
"""
speech = """
First demo: what the scan finds in a typical image. [[slnc 400]] One script, run as root inside a real container. [[slnc 600]]
Nineteen findings. [[slnc 300]] A second root, an account with no password, a copied shell with the set user I D bit, and three listeners on every interface.
"""
rows = { scan = "active wrong" }
console = [
    ["empty-password test; extra-root-account toor", "bad"],
    ["unexpected-setuid /tmp/.hidden-shell", "bad"],
    ["19 findings: 7 critical, 8 high, 2 medium, 2 low; 7 auto-fixable", "bad"],
]

[[act]]
title = "The fixes a machine can make, and where they live"
summary = "Seven permission fixes applied in the running container are in its writable layer, and a new container from the same image has all 19 findings again."
detail = """
Seven permission changes applied in the running container leave 12 findings, none of them a permission. docker diff lists what changed in the container's own writable layer: the cron script, the shadow file, the host key, the config, the copied shell and the upload folder. A new container from the same image has 19 findings again: a fix in a running container is not a fix. The image is what runs next time, so a change belongs in the image's recipe.
"""
speech = """
Second demo: the fixes a machine can make, and where they live. [[slnc 400]] Seven permission fixes, applied in the running container. [[slnc 600]]
Docker diff shows them in the container's own layer. [[slnc 300]] A new container from the same image has all nineteen findings again.
"""
rows = { fixes = "active ok" }
console = [
    ["7 permission changes applied: 12 findings left", "ok"],
    ["docker diff: the changes are in the container's layer", "ok"],
    ["a new container from the same image: 19 findings again", "bad"],
]

[[act]]
title = "The decisions a person makes, in the recipe"
summary = "A hardened Dockerfile with the decisions made, started with safe kernel settings, scans with 0 findings and runs as app."
detail = """
The decisions go in the recipe: no second root account and no test account; a locked service account with no login shell; sshd_config with root login, passwords, empty passwords and X11 off; private modes for the key, the config and cron; no copied shell with the set-user-id bit; one listener, port 8080; the process runs as app, not root; and the namespaced kernel settings the container is started with: accept_redirects 0 and syncookies 1. shop-host:hardened, scanned the same way, has 0 findings. The typical image's process runs as root; the hardened one as app.
"""
speech = """
Third demo: the decisions a person makes, in the recipe. [[slnc 400]] No second root, no test account, private modes, one listener. [[slnc 600]]
The process runs as app, not as root. [[slnc 300]] The scan finds nothing.
"""
rows = { recipe = "active ok" }
console = [
    ["shop-host:hardened: 0 findings", "ok"],
    ["typical image runs as root; hardened runs as app", "ok"],
    ["accept_redirects 0 and syncookies 1 at start", "ok"],
]

[[act]]
title = "Running it again"
summary = "Loosening a file in a running hardened container is found as drift, and a new container from the image has none."
detail = """
Someone loosens the config file inside a running container: the scan finds loose-permissions and world-writable-file for /opt/app/config.properties. A new container from the image has 0 findings. The scan is part of the build, on the image after it is built, and a regression fails it; on running containers it finds drift, and the answer to drift is a new container.
"""
speech = """
Fourth demo: running it again. [[slnc 400]] Someone loosens the config file inside a running container. [[slnc 600]]
The scan finds it. [[slnc 300]] The answer to drift is a new container.
"""
rows = { again = "active ok" }
console = [
    ["config.properties made 666: loose-permissions, world-writable-file", "bad"],
    ["a new container from the image: 0 findings", "ok"],
]

[[act]]
title = "The bill"
summary = "A container shares the host's kernel, the allow-lists are the shop's own, and how it is started is another scan."
detail = """
kernel.randomize_va_space inside the container is the host kernel's value, 2; writing 0 to it from inside is refused: a read-only file system. A container shares the host's kernel, so these checks are the host's to fix. The scan runs as root inside the container; a process that runs as app sees less, and an attacker starts as that process. The allow-lists, port 8080 and no set-user-id file, are the shop's own decisions. How a container is started, with which user, capabilities, mounts and filesystem mode, is the subject of container-hardening.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] A container shares the host's kernel, and cannot change its settings. [[slnc 600]]
The allow lists are the shop's own decisions. [[slnc 300]] How a container is started is another scan.
"""
rows = { bill = "active wrong" }
console = [
    ["randomize_va_space: the host's 2; writing 0: read-only file system", "bad"],
    ["the allow-lists are the shop's decisions", "ok"],
    ["how it is started: container-hardening", "ok"],
]

