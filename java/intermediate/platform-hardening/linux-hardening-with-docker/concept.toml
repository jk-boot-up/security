[docs.problem]
scenario = """
An online store ships its server as a container image that has collected small settings nobody chose.
"""
naive = """
Fix what the scan reports with docker exec on the running container.
"""
deliver = [
    "Two real images built from Dockerfiles.",
    "A scan of a real running container.",
    "The difference between fixing a container and fixing an image.",
    "The limits of what a container can change.",
]

[docs.prerequisites]
required = [
    "Java basics",
    "The plain linux-hardening project, for the ideas",
    "Docker, with the alpine:3.24.3 image (pulled on first use)",
]
not_required = [
    "A Linux host: Docker Desktop is enough",
]
install = ["docker"]

[docs.session]
objectives = [
    "scan a container from the inside",
    "separate what a machine can fix from what a person decides",
    "say why a fix belongs in the image",
    "name two things a container cannot change",
]
walkthrough = """
Run act two and find the line that shows the fixes disappear. In act three list the decisions that were made. In act five find the setting that is not the image's to change.
"""
exercises = [
    "Add a rule for files owned by a user that does not exist.",
    "Add a USER line to the typical image and see which findings change.",
    "Scan a public image such as nginx with the same script.",
    "Make the scan a step in a build that fails on a critical finding.",
]

[docs.explained]
sentence = """
An image is a recipe, and a container is a copy of what it makes: a setting that is only fixed in the copy is lost with the copy.
"""
verdict = """
Scan the image in the build, make every decision in the recipe, run as a service account, start containers with safe kernel settings, treat drift as a reason for a new container, and remember that the kernel belongs to the host.
"""
recognise = [
    "`USER app` in a Dockerfile.",
    "`docker diff` output.",
    "`chmod` in a Dockerfile.",
    "A benchmark report with CIS numbers.",
]

[spec]
purpose = """
Teach scanning a real container for common host misconfigurations and fixing them where they last.
"""
nongoals = [
