[threatmodel]
scope = """
The server image of an online store and a container started from it: its accounts, files, SSH settings, listeners and namespaced kernel settings. It does not cover the packages inside or the host.
"""
assets = [
    "The shop's data and keys inside the container.",
    "The host that runs the container.",
]
actors = [
    "An attacker who reaches a listener or logs in.",
    "An operator who fixes things with docker exec.",
]
boundaries = [
    "The container and the host's kernel.",
    "The image, which is built once, and the container, which is a copy.",
]
assumptions = [
    "The image is built from a recipe under review.",
    "Containers are replaced rather than patched.",
]
out_of_scope = [
    "Vulnerabilities in installed packages.",
    "Escapes from the container.",
]
tests = [
    "`ScannerTest` runs the rules on text: modes, accounts, sshd settings, listeners and kernel settings.",
    "`ContainerScanTest` builds the images and starts real containers for the counts, the fixes and where they live, the hardened image, the kernel options and the drift.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next project in this module, container-hardening, looks at how the container is started: user, capabilities, mounts and filesystem mode.
"""

[[threat]]
id = "T1"
stride = "S"
threat = "An account with no password or a second root"
where = "/etc/passwd and /etc/shadow"
control = "A rule for accounts, a recipe with a locked service account"
residual = "Accounts added at run time"

[[threat]]
id = "T2"
stride = "E"
threat = "A service that listens where it should not"
where = "listeners, sshd_config"
control = "An allow-list of ports and SSH settings in the recipe"
residual = "Listeners started later by a process"

[[threat]]
id = "T3"
stride = "T"
threat = "Files that anyone can change, or a shell with the set-user-id bit"
where = "modes in the image"
control = "Private modes in the recipe, a rule for set-user-id files"
residual = "Files created at run time"

[[threat]]
id = "T4"
stride = "I"
threat = "Kernel settings that the container cannot control"
where = "the shared kernel"
control = "Namespaced settings at start-up; the host's settings are the host's to fix"
residual = "Everything the host has not hardened"

[poster]
headline = [["HARDENING", "text"], ["WITH DOCKER", "accent"]]
taglines = [["Fix what a machine can fix, and put every decision in the recipe", "gold"]]
before = { code = "19 findings in a running container", note = "fixed there: 19 again in the next", tag = "BEFORE" }
after = { code = "USER app", note = "decisions in the recipe: 0 findings", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "Linux Hardening with Docker"
narration = "Hello, and welcome. [[slnc 400]] This video explains Linux hardening for real Docker containers. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A container can be scanned the way an auditor scans a server: its file permissions, accounts, S S H settings, which is secure shell, open ports, and kernel settings. [[slnc 300]] But a fix made inside a running container is gone in the next one. [[slnc 300]] So every decision belongs in the recipe of the image, the Dockerfile. [[slnc 600]] Think of fixing a typo in a printed copy, instead of in the master document. [[slnc 600]] Our example is an online store."

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online store ships its server", "as a container image.", "", "The demo builds two real images:", "  a typical one nobody reviewed", "  the same shop with its decisions made", "", "and scans each from the inside, as root."]
narration = "Here is the scenario. [[slnc 400]] An online store ships its server as a container image. [[slnc 500]] The demo builds two real Docker images: a typical one that nobody reviewed, and the same shop with its decisions made. [[slnc 500]] It starts each one, and runs a single scanning script as root inside it, reading the files, the accounts, the S S H configuration, the listening ports, and the kernel settings."

[[scene]]
key = "02-words"
kind = "bullets"
title = "The Words"
body = ["Image: the read-only recipe result", "Container: a running copy, with its own layer", "Dockerfile: the recipe of an image", "Mode: a file's permission bits, in octal", "Finding: a broken rule, with a severity", "Drift: a running container that changed"]
narration = """Before the demos, the words. [[slnc 500]] An image is what a recipe builds: read only layers of files. [[slnc 500]] A container is a running copy of an image, with its own thin writable layer on top. [[slnc 500]] A Dockerfile is the recipe of an image. [[slnc 500]] A mode is a file's permission bits, written in octal. [[slnc 500]] A finding is one broken rule, with a severity. [[slnc 500]] And drift is a running container that changed after it started."""

[[scene]]
key = "02-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "02-layers"
kind = "figure"
title = "Where a fix in a container lives"
body = "layers"
narration = """Let's see the core idea on the real example. [[slnc 400]] At the bottom, the image: read only layers that every container starts from. [[slnc 700]]
On the left, a running container after the seven fixes. [[slnc 300]] Docker diff lists what changed, and every change is in the container's own writable layer, on top of the image. [[slnc 300]] The shadow file, the host key, the config, the cron script, the hidden shell, and the upload folder and its file. [[slnc 700]]
On the right, a new container from the same image. [[slnc 300]] It starts with a fresh, empty layer, so it has all nineteen findings again. [[slnc 300]] A fix that lasts goes into the recipe."""

[[scene]]
key = "03-acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "04-costs"
kind = "bullets"
title = "What It Costs"
body = ["A rule for each setting", "A running container is a copy: fixes vanish", "The kernel belongs to the host", "Hardening can break the application", "Images age, and must be rebuilt"]
narration = "Nothing is free. [[slnc 400]] Here is what it costs. [[slnc 500]] The scan needs a rule for each setting it checks. [[slnc 500]] A running container is a copy, so a fix made inside it vanishes with it. [[slnc 500]] The kernel belongs to the host, and a container cannot change most of its settings. [[slnc 500]] Hardening can break the application, so test it. [[slnc 300]] And images age, so they must be rebuilt and scanned again."

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["USER app in a Dockerfile", "chmod lines in a Dockerfile", "docker diff output", "A benchmark report with CIS numbers"]
narration = "You have probably met this already. [[slnc 400]] A user line in a Dockerfile makes the process run as someone other than root. [[slnc 500]] Chmod lines in a Dockerfile are permission decisions, made where they last. [[slnc 500]] Docker diff output lists what changed inside a running container, which is drift. [[slnc 500]] And a benchmark report with C I S numbers is the same checks, by a maintained tool."

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Scan containers from the inside", "Let a machine fix permissions", "Let a person make the other decisions", "Put every decision in the Dockerfile", "Run as a user that is not root", "Replace, don't patch, a drifted container"]
narration = "So, how do you use it? [[slnc 400]] Scan containers from the inside, in the build. [[slnc 500]] Let a machine fix permissions, and let a person make the other decisions. [[slnc 300]] Put every decision in the Dockerfile, where it lasts. [[slnc 500]] Run the process as a user that is not root. [[slnc 300]] And when a running container drifts, replace it with a new one, instead of patching it."

[[scene]]
key = "12-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a USER line to the typical", "image and see which findings change."]
narration = "That's Linux hardening with Docker. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Scan a real container the way an auditor scans a host, fix what a machine can fix, and put every decision where it lasts: in the recipe of the image. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a user line to the typical image, and see which findings change. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] The demo builds real images and starts real containers, and one script reads each one. [[slnc 300]] Here are the classes that matter."""

[[class]]
name = "Docker"
what = "the docker command, as a program"
[[class.part]]
title = "run a script as root inside a container"
code = """
static String exec(String container, String script)
        throws IOException, InterruptedException {
    return run("exec", "-u", "0", container,
            "sh", "-c", script);
"""
speech = """Every look inside a container is one docker exec. [[slnc 300]] Minus u zero runs the script as root, so it can read the shadow file and every folder, the way an auditor would."""

[[class]]
name = "Scanner"
what = "one snapshot script, and the rules over what it printed"
[[class.part]]
title = "the snapshot script"
code = """
echo '#setuid'
find / -xdev -perm -4000 -type f 2>/dev/null
...
echo '#tcp'
cat /proc/net/tcp /proc/net/tcp6
"""
speech = """The script prints one section per question, each after a hash line. [[slnc 300]] Find lists the set user id files, and the kernel's socket tables list the listeners."""
[[class.part]]
title = "a rule with its fix"
code = """
found.add(new Finding(Severity.HIGH, "loose-permissions", path,
        String.format("mode 0%o is looser than 0%o",
                mode, PRIVATE_FILES.get(path)),
        "chmod " + Integer.toOctalString(PRIVATE_FILES.get(path))
                + " " + path));
"""
speech = """A permission finding carries the command that fixes it. [[slnc 300]] Account, S S H, kernel and port findings carry none: a person decides those."""

[[class]]
name = "Listeners"
what = "reads the kernel's socket tables, in hex"
[[class.part]]
title = "every interface, and the port in hex"
code = """
boolean everywhere() {
    return hexAddress.matches("0+");
...
out.add(new Listener(local[0], local[1],
        Integer.parseInt(local[1], 16)));
"""
speech = """An address of all zeros means every interface. [[slnc 300]] The port is parsed from hex: zero zero one seven is twenty three."""

[[class]]
name = "Images"
what = "writes the two Dockerfiles and builds them"
[[class.part]]
title = "the decisions, in the recipe"
code = """
RUN addgroup -S app && adduser -S -G app -s /sbin/nologin app
...
USER app
CMD ["sh", "-c", "while true; do nc -l -p 8080; done"]
"""
speech = """The hardened recipe makes a service account with no login shell, runs the process as that account, and listens on one port. [[slnc 300]] Every new container starts with those decisions."""

[[acronym]]
short = "SSH"
long = "Secure Shell: remote login over an encrypted connection"
say = "S S H is secure shell: logging in to a server over an encrypted connection. Its daemon reads sshd config."
[[acronym]]
short = "UID"
long = "User ID: the number the kernel uses for an account"
say = "U I D is the user I D, the number the kernel uses for an account. Zero is root."
[[acronym]]
short = "hex"
long = "hexadecimal: base 16, digits 0-9 and A-F"
say = "Hex is hexadecimal, base sixteen. Seventeen in hex, one seven, is twenty three."
[[acronym]]
short = "TCP, IP, IPv6"
long = "Transmission Control Protocol; Internet Protocol, version 6"
say = "T C P is the transmission control protocol, and I P is the internet protocol. In I P version six, two colons mean every address."
[[acronym]]
short = "API"
long = "Application Programming Interface"
say = "A P I is an application programming interface. The Docker A P I lets a caller start containers, so it is root on the host."
[[acronym]]
short = "TLS"
long = "Transport Layer Security: encryption for a connection"
say = "T L S is transport layer security, the encryption behind H T T P S."
[[acronym]]
short = "HTTP, HTTPS"
long = "Hypertext Transfer Protocol; HTTP over TLS"
say = "H T T P is the hypertext transfer protocol of the web. H T T P S is H T T P inside T L S."
[[acronym]]
short = "X11"
long = "the X Window System, version 11: graphical sessions"
say = "X eleven is the X window system, for graphical sessions. A server does not need it forwarded over S S H."
[[acronym]]
short = "SYN"
long = "the TCP synchronize packet that opens a connection"
say = "S Y N is the T C P synchronize packet. S Y N cookies stop a flood of half-open connections from filling the queue."
[[acronym]]
short = "CIS"
long = "Center for Internet Security: publishes hardening benchmarks"
say = "C I S is the center for internet security, which publishes hardening benchmarks for Linux and Docker."
