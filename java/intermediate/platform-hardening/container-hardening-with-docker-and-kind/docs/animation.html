<title>Container Hardening with Docker and kind — Animated Walkthrough</title>
<style>

  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px;
    background: var(--vk-0f172a, #0f172a); color: var(--vk-e2e8f0, #e2e8f0);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    padding-top: calc(24px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  p.sub { color: var(--vk-94a3b8, #94a3b8); margin: 0 0 20px; max-width: 70ch; }
  .wrap { max-width: 1100px; margin: 0 auto; }
  .stage { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  @media (max-width: 760px) { .stage { grid-template-columns: 1fr; } }
  .boxes { display: flex; flex-direction: column; gap: 10px; }
  .row { border: 2px solid var(--vk-334155, #334155); border-radius: 10px; padding: 12px 16px;
         background: var(--vk-1e293b, #1e293b); transition: all .25s ease; opacity: .55; }
  .row .name { font-weight: 700; font-size: 1rem; }
  .row .job { color: var(--vk-94a3b8, #94a3b8); font-size: .82rem; margin-top: 2px; }
  .row.active { opacity: 1; box-shadow: 0 0 0 2px currentColor inset; }
  .row.wrong { border-color: var(--vk-f87171, #f87171); color: var(--vk-f87171, #f87171); }
  .row.wrong.active { background: var(--vk-3f1d24, #3f1d24); }
  .row.ok { border-color: var(--vk-34d399, #34d399); color: var(--vk-34d399, #34d399); }
  .row.ok.active { background: var(--vk-10261f, #10261f); }
  .row.amber { border-color: var(--vk-fbbf24, #fbbf24); color: var(--vk-fbbf24, #fbbf24); }
  .row.amber.active { background: var(--vk-2a2110, #2a2110); }
  .row.dim { opacity: .22; }
  .console { background: var(--vk-020617, #020617); border: 1px solid var(--vk-334155, #334155); border-radius: 10px; padding: 16px;
             font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: .86rem;
             line-height: 1.55; overflow-y: auto; min-height: 320px; white-space: pre-wrap; }
  #console-lines span.ok { color: var(--vk-34d399, #34d399); }
  #console-lines span.bad { color: var(--vk-f87171, #f87171); }
  #console-lines span.amber { color: var(--vk-fbbf24, #fbbf24); }
  #console-lines span.muted { color: var(--vk-94a3b8, #94a3b8); }
  .narration { background: var(--vk-1e293b, #1e293b); border: 1px solid var(--vk-334155, #334155); border-radius: 10px;
               padding: 14px 18px; margin-bottom: 16px; min-height: 3.2em; }
  .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  button { background: var(--vk-334155, #334155); color: var(--vk-e2e8f0, #e2e8f0); border: 1px solid var(--vk-475569, #475569); border-radius: 8px;
           padding: 10px 18px; font-size: .92rem; cursor: pointer; }
  button:hover { background: var(--vk-475569, #475569); }
  button:disabled { opacity: .45; cursor: default; }
  button#play { background: var(--vk-7c3aed, #7c3aed); border-color: var(--vk-7c3aed, #7c3aed); }
  button#play:hover { background: var(--vk-8b5cf6, #8b5cf6); }
  #progress { color: var(--vk-94a3b8, #94a3b8); font-size: .85rem; margin-left: auto; }
  .step-label { font-size: .78rem; text-transform: uppercase; letter-spacing: .04em;
                color: var(--vk-a78bfa, #a78bfa); font-weight: 700; margin-bottom: 4px; }

<body>
<div class="wrap">
  <h1>Container Hardening with Docker and kind — Step by Step</h1>
  <p class="sub">An online store's container, thirteen real attempts, and a cluster that says no.</p>

  <div class="narration">
    <div class="step-label" id="step-label">Ready</div>
    <div id="narration">Press Step or Play to begin.</div>
  </div>

  <div class="stage">
    <div class="boxes" id="boxes">
      <div class="row" id="row-defaults">
        <div class="name">No options</div>
        <div class="job">7 of 13</div>
      </div>
      <div class="row" id="row-tutorial">
        <div class="name">The tutorial</div>
        <div class="job">13 of 13</div>
      </div>
      <div class="row" id="row-steps">
        <div class="name">One at a time</div>
        <div class="job">13 down to 1</div>
      </div>
      <div class="row" id="row-hardened">
        <div class="name">Hardened</div>
        <div class="job">1 left</div>
      </div>
      <div class="row" id="row-kind">
        <div class="name">On kind</div>
        <div class="job">admission says no</div>
      </div>
    </div>
    <div class="console"><div id="console-lines"></div></div>
  </div>

  <div class="controls">
    <button id="step">Step ▸</button>
    <button id="play">Play ▶</button>
    <button id="reset">Reset ↺</button>
    <span id="progress">0 / 0</span>
  </div>
</div>

<script>
const STEPS = [
 {
  "label": "Act 1 — What docker run with no options gives an attacker",
  "narration": "First demo: what docker run with no options gives an attacker. Thirteen real attempts, run inside the container. Seven work. The secrets, the writable root, a dropped file, root, a raw socket, and no limits.",
  "rows": {
   "defaults": "active wrong"
  },
  "console": [
   [
    "POSSIBLE: read-secrets, tamper-with-app, drop-and-run, become-root",
    "bad"
   ],
   [
    "POSSIBLE: sniff-network, exhaust-memory, fork-bomb",
    "bad"
   ],
   [
    "7 of 13 attacks possible",
    "bad"
   ]
  ]
 },
 {
  "label": "Act 2 — The configuration from the tutorial",
  "narration": "Second demo: the configuration from the tutorial. Privileged, the host's network, the host's processes, the Docker socket. All thirteen attacks work. One command gives the process the host.",
  "rows": {
   "tutorial": "active wrong"
  },
  "console": [
   [
    "docker run --privileged --network host --pid host -v docker.sock ...",
    "bad"
   ],
   [
    "13 of 13 attacks possible",
    "bad"
   ]
  ]
 },
 {
  "label": "Act 3 — One setting at a time",
  "narration": "Third demo: one setting at a time. Thirteen, eight, seven, five, five, five, three, one. The number goes down only when an option takes away something an attack uses.",
  "rows": {
   "steps": "active ok"
  },
  "console": [
   [
    "13 -> 8 -> 7 -> 5 -> 5 -> 5 -> 3 -> 1",
    "ok"
   ],
   [
    "a non-root user: root is gone, the app's own files are open",
    "ok"
   ],
   [
    "no new privileges: no set-user-id program here to stop",
    "ok"
   ]
  ]
 },
 {
  "label": "Act 4 — The hardened container",
  "narration": "Fourth demo: the hardened container. One attack left: the secret the application has to read. Add root and a capability, and only the seccomp filter still stands between the attacker and mount. Each layer covers for a mistake in the others.",
  "rows": {
   "hardened": "active ok"
  },
  "console": [
   [
    "1 of 13 attacks possible: read-secrets",
    "ok"
   ],
   [
    "+ NET_RAW: still 1",
    "ok"
   ],
   [
    "+ root + SYS_ADMIN: 2; without the filter too: 4 (mount-host)",
    "bad"
   ]
  ]
 },
 {
  "label": "Act 5 — The same on Kubernetes, with Pod Security Standards on kind",
  "narration": "Fifth demo: the same on Kubernetes. A real kind cluster, with pod security standards. Baseline refuses the tutorial's pod. Restricted refuses a plain pod, and admits the hardened one. The hardened pod still has two attacks left.",
  "rows": {
   "kind": "active ok"
  },
  "console": [
   [
    "tutorial pod: baseline refuses (3), restricted refuses (7)",
    "ok"
   ],
   [
    "plain pod: baseline admits, restricted refuses (4)",
    "ok"
   ],
   [
    "hardened pod admitted; probed from inside: 2 of 13",
    "ok"
   ]
  ]
 }
];
const rowIds = ["defaults", "tutorial", "steps", "hardened", "kind"];
const stepLabel = document.getElementById("step-label");
const narrationEl = document.getElementById("narration");
const consoleEl = document.getElementById("console-lines");
const progressEl = document.getElementById("progress");
const playBtn = document.getElementById("play");
let i = -1, timer = null;

function esc(t) { return t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

function render() {
  for (const id of rowIds) document.getElementById("row-" + id).className = "row";
  if (i < 0) {
    stepLabel.textContent = "Ready";
    narrationEl.textContent = "Press Step or Play to begin.";
    consoleEl.innerHTML = "";
    progressEl.textContent = "0 / " + STEPS.length;
    return;
  }
  const s = STEPS[i];
  stepLabel.textContent = s.label;
  narrationEl.textContent = s.narration;
  for (const id of rowIds) {
    const cls = s.rows[id];
    document.getElementById("row-" + id).className = "row " + (cls ? cls : "dim");
  }
  consoleEl.innerHTML = s.console.map(([t, c]) => '<span class="' + c + '">' + esc(t) + "</span>").join("\n");
  progressEl.textContent = (i + 1) + " / " + STEPS.length;
}
function step() { if (i >= STEPS.length - 1) { stopPlay(); return; } i += 1; render(); }
function reset() { stopPlay(); i = -1; render(); }
// While a step's narration is playing, Play waits for it to finish.
function speaking() { return typeof window.vkSpeaking === "function" && window.vkSpeaking(); }
function startPlay() {
  if (timer) return;
  playBtn.textContent = "Pause ❚❚";
  let quiet = 0;
  timer = setInterval(() => {
    if (speaking()) { quiet = 0; return; }
    if (++quiet < 6) return;                     // 6 × 500 ms of reading time
    quiet = 0;
    if (i >= STEPS.length - 1) { stopPlay(); return; }
    step();
  }, 500);
  if (i < 0) step();
}
function stopPlay() { if (timer) clearInterval(timer); timer = null; playBtn.textContent = "Play ▶"; }

document.getElementById("step").addEventListener("click", () => { stopPlay(); step(); });
document.getElementById("reset").addEventListener("click", reset);
playBtn.addEventListener("click", () => { if (timer) stopPlay(); else startPlay(); });
render();
</script>
<!-- videokit:narration -->
<script>
/* videokit narration player: a Narration on/off switch and a play/pause
   button for the current step. It watches the page's own narration text,
   works out which step is showing, and plays audio/step-N.m4a beside the
   page (rendered by tools/videokit; not embedded, so the page stays small).
   If the page already plays its own clips, only the pause button is added. */
(function () {
  "use strict";
  var STEPS = ["First demo: what docker run with no options gives an attacker. Thirteen real attempts, run inside the container. Seven work. The secrets, the writable root, a dropped file, root, a raw socket, and no limits.", "Second demo: the configuration from the tutorial. Privileged, the host's network, the host's processes, the Docker socket. All thirteen attacks work. One command gives the process the host.", "Third demo: one setting at a time. Thirteen, eight, seven, five, five, five, three, one. The number goes down only when an option takes away something an attack uses.", "Fourth demo: the hardened container. One attack left: the secret the application has to read. Add root and a capability, and only the seccomp filter still stands between the attacker and mount. Each layer covers for a mistake in the others.", "Fifth demo: the same on Kubernetes. A real kind cluster, with pod security standards. Baseline refuses the tutorial's pod. Restricted refuses a plain pod, and admits the hardened one. The hardened pod still has two attacks left."];
  var norm = function (s) { return String(s || "").replace(/\s+/g, " ").trim(); };
  var box = document.getElementById("narration") || document.querySelector(".narration");
  if (!box || !STEPS.length) return;

  var pageOwnsAudio = !!document.getElementById("audio");
  var current = null, step = -1, on = false;
  try { on = localStorage.getItem("vk-narration") === "on"; } catch (e) {}

  // Remember whichever clip the page (or this script) last started.
  var realPlay = HTMLMediaElement.prototype.play;
  HTMLMediaElement.prototype.play = function () {
    // While the UX layer jumps across several steps, nothing speaks.
    if (window.vkQuiet) return Promise.resolve();
    if (current && current !== this) { try { current.pause(); } catch (e) {} }
    current = this;
    this.addEventListener("play", label);
    this.addEventListener("pause", label);
    this.addEventListener("ended", label);
    var p = realPlay.apply(this, arguments);
    label();
    return p;
  };

  // Lets a page's Play button wait for the step's narration to finish.
  window.vkSpeaking = function () { return !!(current && !current.paused && !current.ended); };

  var bar = document.querySelector(".controls") || box.parentNode;
  function button(id, text) {
    var b = document.createElement("button");
    b.id = id; b.type = "button"; b.textContent = text;
    bar.appendChild(b);
    return b;
  }
  var narrBtn = pageOwnsAudio ? null : button("vk-narration", "");
  var stepBtn = button("vk-step-audio", "");
  var note = document.createElement("span");
  note.id = "vk-note";
  note.style.cssText = "color:#94a3b8;font-size:.8rem;margin-left:8px";
  bar.appendChild(note);

  function stepFor(text) {
    var t = norm(text);
    for (var i = 0; i < STEPS.length; i++) {
      var s = norm(STEPS[i]);
      if (s && t.indexOf(s.slice(0, 60)) !== -1) return i;
    }
    return -1;
  }
  function stop() { if (current) { try { current.pause(); } catch (e) {} } current = null; label(); }
  function play(i) {
    if (i < 0) return;
    var a = new Audio("audio/step-" + (i + 1) + ".m4a");
    a.play().then(function () { note.textContent = ""; }, function (e) {
      note.textContent = e && e.name === "NotAllowedError"
        ? "Click Play step to hear this step."
        : "Narration audio not found: run tools/videokit/videokit.sh animation <project>.";
      label();
    });
  }
  function label() {
    if (narrBtn) narrBtn.textContent = (on ? "🔊 Narration: on" : "🔇 Narration: off");
    if (narrBtn) narrBtn.setAttribute("aria-pressed", String(on));
    var playing = current && !current.paused && !current.ended;
    var paused = current && current.paused && !current.ended;
    stepBtn.textContent = playing ? "⏸ Pause step" : paused ? "▶ Resume step" : "▶ Play step";
    stepBtn.disabled = step < 0;
  }

  if (narrBtn) narrBtn.addEventListener("click", function () {
    on = !on;
    try { localStorage.setItem("vk-narration", on ? "on" : "off"); } catch (e) {}
    if (on) { if (step >= 0) play(step); } else stop();
    label();
  });
  stepBtn.addEventListener("click", function () {
    if (current && !current.ended) {
      if (current.paused) current.play(); else current.pause();
    } else play(step);
  });

  function changed() {
    var i = stepFor(box.textContent);
    if (i === step) return;
    step = i;
    window.vkStep = i;
    if (!window.vkQuiet && !pageOwnsAudio) { stop(); if (on) play(i); }
    label();
    try { document.dispatchEvent(new CustomEvent("vk:step", { detail: i })); } catch (e) {}
  }
  // After a jump, speak the step that is now showing (if narration is on).
  window.vkReplay = function () { if (!pageOwnsAudio) { stop(); if (on) play(step); } };
  window.vkStepCount = STEPS.length;
  window.vkStepTexts = STEPS;
  new MutationObserver(changed).observe(box, { childList: true, subtree: true, characterData: true });
  changed();
  label();
})();
</script>
<script>
/* videokit UX layer for every animation page (injected by tools/videokit).

   It never reaches into a page's own code: it drives the page through its own
   Step and Reset buttons and reads which step is showing from the narration
   player (window.vkStep). It adds:
     - a Light / Dim / Dark theme switch, remembered per viewer;
     - a clickable timeline of the steps, a Back button and a progress bar;
     - Predict mode: before each step, the learner is asked what happens next;
     - keyboard control: arrows, space, R, N, 1-9;
     - a short glow on whatever just changed, and console lines that slide in;
     - an "All steps" list for revisiting any step.
   Page colours were turned into --vk-* variables when the page was injected,
   so the themes below remap the palette rather than filter the page. */
(function () {
  "use strict";
  var N = window.vkStepCount || 0;
  var TEXTS = window.vkStepTexts || [];
  var box = document.querySelector(".narration") || document.getElementById("narration");
  if (!box || !N) return;

  // ---------- themes ----------
  var THEMES = {

    },
    light: {
      "0f172a": "#f4f6fb", "020617": "#ffffff", "1e293b": "#ffffff", "334155": "#cfd6e2",
      "475569": "#b4bfcf", "e2e8f0": "#0f172a", "94a3b8": "#475569", "f87171": "#c0262d",
      "34d399": "#047857", "fbbf24": "#a15c07", "7c3aed": "#6d28d9", "8b5cf6": "#7c3aed",
      "a78bfa": "#6d28d9", "3f1d24": "#fde8e8", "10261f": "#dcf7ea", "2a2110": "#fdf1d6",
      "0c2b3d": "#e0f2fe", "38bdf8": "#0369a1", "1e1b4b": "#ede9fe", "b9a3ff": "#6d28d9",
      "123a52": "#cdebfb", "2b0f12": "#fde8e8", "06281f": "#dcf7ea", "fca5a5": "#b91c1c",
      "0f766e": "#ccfbf1", "14b8a6": "#0f766e", "2a1f05": "#fdf1d6", "4ade80": "#15803d",
      "2c1010": "#fde8e8", "2b2247": "#ede9fe", "c4b5fd": "#6d28d9", "f472b6": "#be185d",
      "60a5fa": "#1d4ed8", "22d3ee": "#0e7490", "fde68a": "#92400e", "86efac": "#166534"
    }
  };
  var LABELS = { light: "☀ Light", dim: "◐ Dim", dark: "☾ Dark" };
  var root = document.documentElement;
  var themeCss = document.createElement("style");
  themeCss.id = "vk-theme-vars";
  document.head.appendChild(themeCss);
  function applyTheme(name) {
    var map = THEMES[name] || {};
    themeCss.textContent = ":root{" + Object.keys(map).map(function (k) {
      return "--vk-" + k + ":" + map[k];
    }).join(";") + "}";
    root.setAttribute("data-vk-theme", name);
    root.style.colorScheme = name === "light" ? "light" : "dark";
    try { localStorage.setItem("vk-theme", name); } catch (e) {}
    [].forEach.call(document.querySelectorAll("#vk-theme button"), function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.theme === name));
    });
  }
  var saved = null;
  try { saved = localStorage.getItem("vk-theme"); } catch (e) {}
  var prefersLight = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
  var theme = THEMES[saved] ? saved : (prefersLight ? "light" : "dark");

  // ---------- styles for the added controls ----------
  var css = document.createElement("style");
  css.id = "vk-ux-css";
  css.textContent = [
    "#vk-top{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin:0 0 10px}",

    "#vk-all li.here a{color:var(--vk-a78bfa,#a78bfa);font-weight:700}",
    "button:focus-visible,#vk-all a:focus-visible{outline:3px solid var(--vk-a78bfa,#a78bfa);outline-offset:2px}",
    ".vk-flash{animation:vkFlash 1s ease-out}",
    "@keyframes vkFlash{0%{box-shadow:0 0 0 0 rgba(167,139,250,.9)}100%{box-shadow:0 0 0 14px rgba(167,139,250,0)}}",
    ".vk-fade{animation:vkFade .45s ease-out}",
    "@keyframes vkFade{from{opacity:.15;transform:translateY(4px)}to{opacity:1;transform:none}}",
    ".console span,.console .ln,.console div{animation:vkIn .35s ease-out both}",
    ".console span:nth-child(2){animation-delay:.08s}.console span:nth-child(3){animation-delay:.16s}",
    ".console span:nth-child(4){animation-delay:.24s}.console span:nth-child(5){animation-delay:.32s}",
    ".console span:nth-child(6){animation-delay:.4s}.console span:nth-child(n+7){animation-delay:.48s}",
    "@keyframes vkIn{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}",
    "@media (max-width:600px){#vk-keys{display:none}#vk-timeline button{min-width:40px;min-height:40px}}",
    // Phone widths: no sideways scrolling, whatever the page's own grid says.
    "body{overflow-wrap:anywhere}",
    "@media (max-width:760px){",
    "  body{padding-left:14px!important;padding-right:14px!important}",
    "  .wrap,.stage,.boxes,.controls,.col-main,.col-client{max-width:100%!important;min-width:0!important}",
    "  .stage,.cols,.grid,[class*=grid]{grid-template-columns:minmax(0,1fr)!important}",
    "  .stage>*,.boxes>*,.row,.box,.family,.lane,.col-main>*,.col-client>*{min-width:0!important;max-width:100%}",
    "  [style*=grid-template-columns]{grid-template-columns:minmax(0,1fr)!important}",
    "  .row,.box,.name,.job,.role,.nm,.val,.ms,.note,.tag{white-space:normal!important}",
    "  svg{max-width:100%;height:auto}",
    "}",
    "@media (prefers-reduced-motion:reduce){.vk-flash,.vk-fade,.console span,.console .ln,.console div{animation:none!important}#vk-bar i{transition:none}}"
  ].join("\n");
  document.head.appendChild(css);

  // ---------- the page's own buttons ----------
  function find(id, re) {
    var b = document.getElementById(id);
    if (b) return b;
    return [].filter.call(document.querySelectorAll("button"), function (x) {
      return !/^vk-/.test(x.id) && re.test(x.textContent);
    })[0] || null;
  }
  var nextBtn = find("step", /^\s*(step|next)\b/i);
  var resetBtn = find("reset", /reset|restart|start over/i);
  var playBtn = find("play", /^\s*play\b|pause/i);
  if (!nextBtn || !resetBtn) return;

  // ---------- step titles ----------
  function titleOf(k) {
    var own = (typeof STEPS !== "undefined" && STEPS[k]) || null;   // eslint-disable-line no-undef
    var t = own && (own.label || own.title || own.name || own.heading);
    if (t) return String(t).replace(/<[^>]*>/g, "");
    var first = String(TEXTS[k] || "").split(/(?<=[.!?])\s/)[0];
    return first.length > 90 ? first.slice(0, 87) + "…" : first;
  }
  function current() { return typeof window.vkStep === "number" ? window.vkStep : -1; }

  // ---------- jumping ----------
  function jump(k) {
    k = Math.max(-1, Math.min(N - 1, k));
    var cur = current();
    if (k === cur) return;
    if (k === cur + 1) { nextBtn.click(); return; }
    window.vkQuiet = true;
    try {
      resetBtn.click();
      for (var j = 0; j <= k; j++) nextBtn.click();
    } finally {
      window.vkQuiet = false;
    }
  }

  // ---------- controls ----------
  var wrap = box.parentNode;
  var top = document.createElement("div");
  top.id = "vk-top";
  var themeBox = document.createElement("div");
  themeBox.id = "vk-theme";
  themeBox.setAttribute("role", "group");
  themeBox.setAttribute("aria-label", "Colour theme");
  ["light", "dim", "dark"].forEach(function (name) {
    var b = document.createElement("button");
    b.type = "button"; b.dataset.theme = name; b.textContent = LABELS[name];
    b.addEventListener("click", function () { applyTheme(name); });
    themeBox.appendChild(b);
  });
  var predictBtn = document.createElement("button");
  predictBtn.type = "button"; predictBtn.id = "vk-predict";
  predictBtn.textContent = "🤔 Predict first";
  predictBtn.title = "Before each step, stop and guess what will happen";
  var predict = false;
  try { predict = localStorage.getItem("vk-predict") === "on"; } catch (e) {}
  top.appendChild(predictBtn);
  top.appendChild(themeBox);
  var h1 = document.querySelector("h1");
  if (h1) h1.parentNode.insertBefore(top, h1);
  else document.body.insertBefore(top, document.body.firstChild);

  var timeline = document.createElement("div");
  timeline.id = "vk-timeline";
  timeline.setAttribute("aria-label", "Steps");
  var chips = [];
  for (var k = 0; k < N; k++) (function (k) {
    var b = document.createElement("button");
    b.type = "button";
    b.textContent = String(k + 1);
    b.title = "Step " + (k + 1) + ": " + titleOf(k);
    b.setAttribute("aria-label", b.title);
    b.addEventListener("click", function () { hidePredict(); jump(k); });
    timeline.appendChild(b);
    chips.push(b);
  })(k);
  var controlsRow = nextBtn.parentNode;
  var anchor = (box.compareDocumentPosition(controlsRow) & Node.DOCUMENT_POSITION_FOLLOWING) ? box : controlsRow;
  anchor.parentNode.insertBefore(timeline, anchor);

  var bar = document.createElement("div");
  bar.id = "vk-bar";
  bar.innerHTML = "<i></i>";
  box.appendChild(bar);

  var back = document.createElement("button");
  back.type = "button"; back.id = "vk-back"; back.textContent = "◂ Back";
  back.addEventListener("click", function () { hidePredict(); jump(current() - 1); });
  nextBtn.parentNode.insertBefore(back, nextBtn);

  var keys = document.createElement("p");
  keys.id = "vk-keys";
  keys.innerHTML = "Keys: <kbd>→</kbd> next · <kbd>←</kbd> back · <kbd>Space</kbd> play/pause · " +
    "<kbd>1</kbd>–<kbd>9</kbd> jump · <kbd>R</kbd> reset · <kbd>N</kbd> narration · <kbd>P</kbd> predict";
  var controls = nextBtn.parentNode;
  controls.parentNode.insertBefore(keys, controls.nextSibling);

  var all = document.createElement("details");
  all.id = "vk-all";
  var list = "<summary>All steps — revisit any of them</summary><ol>";
  for (var q = 0; q < N; q++) list += '<li><a tabindex="0" data-k="' + q + '"></a></li>';
  all.innerHTML = list + "</ol>";
  [].forEach.call(all.querySelectorAll("a"), function (a) {
    var k = +a.dataset.k;
    a.textContent = titleOf(k);
    a.addEventListener("click", function () { hidePredict(); jump(k); });
    a.addEventListener("keydown", function (e) { if (e.key === "Enter") { hidePredict(); jump(k); } });
  });
  var main = document.querySelector(".wrap") || (h1 && h1.parentNode) || document.body;
  main.appendChild(all);

  // ---------- predict mode ----------
  var card = null, passOnce = false;
  function hidePredict() { if (card) { card.remove(); card = null; } }
  function showPredict() {
    var next = current() + 1;
    if (next >= N) return false;
    card = document.createElement("div");
    card.id = "vk-predict-card";
    card.setAttribute("role", "status");
    card.innerHTML = "<b>Predict first.</b> Step " + (next + 1) + " is: <span></span><br>" +
      "What do you expect to happen? Say it out loud, then reveal.";
    card.querySelector("span").textContent = titleOf(next);
    var reveal = document.createElement("button");
    reveal.type = "button"; reveal.textContent = "Reveal ▸";
    reveal.addEventListener("click", function () { hidePredict(); passOnce = true; nextBtn.click(); });
    card.appendChild(document.createElement("br"));
    card.appendChild(reveal);
    box.parentNode.insertBefore(card, box);
    reveal.focus({ preventScroll: true });
    return true;
  }
  function setPredict(v) {
    predict = v;
    predictBtn.setAttribute("aria-pressed", String(v));
    try { localStorage.setItem("vk-predict", v ? "on" : "off"); } catch (e) {}
    if (!v) hidePredict();
  }
  predictBtn.addEventListener("click", function () { setPredict(!predict); });
  // In predict mode, the page's own Step button asks before it reveals.
  nextBtn.addEventListener("click", function (e) {
    if (passOnce) { passOnce = false; return; }
    if (!predict || window.vkQuiet || card) return;
    if (showPredict()) { e.stopImmediatePropagation(); e.preventDefault(); }
  }, true);

  // ---------- keyboard ----------
  document.addEventListener("keydown", function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    var t = e.target;
    if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
    var k = e.key;
    if (k === "ArrowRight") { e.preventDefault(); if (card) { hidePredict(); passOnce = true; } nextBtn.click(); }
    else if (k === "ArrowLeft") { e.preventDefault(); hidePredict(); jump(current() - 1); }
    else if (k === " " && playBtn && !(t && t.tagName === "BUTTON")) { e.preventDefault(); playBtn.click(); }
    else if (k === "r" || k === "R" || k === "Home") { hidePredict(); resetBtn.click(); }
    else if (k === "n" || k === "N") { var nb = document.getElementById("vk-narration") || document.getElementById("audio"); if (nb) nb.click(); }
    else if (k === "p" || k === "P") setPredict(!predict);
    else if (/^[1-9]$/.test(k) && +k <= N) { hidePredict(); jump(+k - 1); }
  });

  // ---------- show what changed ----------
  var stage = document.querySelector(".stage") || document.body;
  new MutationObserver(function (muts) {
    muts.forEach(function (m) {
      var el = m.target;
      if (m.type !== "attributes" || !el.classList || /^vk-/.test(el.id || "")) return;
      var was = String(m.oldValue || "").replace(/\bvk-\S+/g, "").trim();
      var now = String(el.className || "").replace(/\bvk-\S+/g, "").trim();
      if (was === now || /\bdim\b/.test(now)) return;
      el.classList.remove("vk-flash");
      void el.offsetWidth;
      el.classList.add("vk-flash");
      setTimeout(function () { el.classList.remove("vk-flash"); }, 1000);
    });
  }).observe(stage, { subtree: true, attributes: true, attributeFilter: ["class"], attributeOldValue: true });

  var textEl = document.getElementById("narration") || box;
  function refresh() {
    var cur = current();
    chips.forEach(function (c, k) {
      if (k === cur) c.setAttribute("aria-current", "step"); else c.removeAttribute("aria-current");
      if (k <= cur) c.classList.add("seen");
    });
    bar.firstChild.style.width = (N ? ((cur + 1) / N) * 100 : 0) + "%";
    back.disabled = cur < 0;
    [].forEach.call(all.querySelectorAll("li"), function (li, k) { li.classList.toggle("here", k === cur); });
    textEl.classList.remove("vk-fade");
    void textEl.offsetWidth;
    if (cur >= 0) textEl.classList.add("vk-fade");
  }
  document.addEventListener("vk:step", refresh);

  applyTheme(theme);
  setPredict(predict);
  refresh();
})();
</script>
<!-- /videokit:narration -->
</body>
</html>
