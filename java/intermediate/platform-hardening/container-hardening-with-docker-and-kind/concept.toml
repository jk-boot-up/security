[[scene]]
key = "01-poster"
kind = "poster"
title = "Container Hardening with Docker and kind"
narration = "Hello, and welcome. [[slnc 400]] This video explains container hardening, measured with real Docker containers and a real Kubernetes cluster on kind. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] Assume the process in a container has been taken over. [[slnc 300]] Thirteen real attempts, run inside the container, measure what it can still reach. [[slnc 300]] Each docker run option, and each Kubernetes pod security level, takes some of them away, until only the secret the application must read is left. [[slnc 600]] Think of testing every lock in a building by actually trying the doors. [[slnc 600]] Our example is an online store."

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online store runs its application", "in a container.", "", "The demo assumes a process in it", "has been taken over,", "runs thirteen real attempts inside", "containers started in different ways,", "then asks a kind cluster to refuse the worst."]
narration = "Here is the scenario. [[slnc 400]] An online store runs its application in a container. [[slnc 500]] The demo assumes a process in it has been taken over. [[slnc 300]] It runs the attacker's thirteen first steps, for real, inside containers started in different ways, and counts how many work. [[slnc 500]] Then it starts a Kubernetes cluster with kind, and asks it to refuse the worst pods."

[[scene]]
key = "02-words"
kind = "bullets"
title = "The Words"
body = ["Probe: a real attempt, run inside", "Capability: one slice of root's power", "CapEff: the capabilities held, as bits", "seccomp: a filter on system calls", "cgroup: memory.max and pids.max", "Pod Security Standards: three levels", "kind: Kubernetes in Docker"]
narration = """Before the demos, the words. [[slnc 500]] A probe is one real attempt, a small shell command, run inside the container as the user it runs as. [[slnc 500]] Linux splits root's power into capabilities, such as raw sockets or system admin. [[slnc 500]] Cap eff, in slash proc, lists the capabilities a process holds, one bit each. [[slnc 500]] Seccomp, secure computing mode, filters the system calls a process may make. [[slnc 500]] A cgroup, a control group, sets memory max and P I D s max. [[slnc 500]] Kubernetes' Pod Security Standards name three levels: privileged, baseline, and restricted. [[slnc 500]] And kind runs a real Kubernetes cluster inside Docker containers."""

[[scene]]
key = "02-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "02-mask"
kind = "figure"
title = "How a probe reads the capability mask"
body = "capability_mask"
narration = """Let's see the core idea on one example: how a probe reads what the process may do. [[slnc 400]] At the top, the input: the cap eff line from slash proc, in a container started with no options. [[slnc 300]] It is a number in hexadecimal, and each bit is one capability. [[slnc 300]] Green bits are set. [[slnc 700]]
In the middle, the result: fourteen bits are set, Docker's default capabilities, from chown at bit zero, to set f cap at bit thirty one. [[slnc 600]]
At the bottom, two bits worked out. [[slnc 300]] Shift the mask right by thirteen, and keep the last bit: one. [[slnc 300]] So net raw is held, and root can sniff the network. [[slnc 300]] Shift by twenty one: zero. [[slnc 300]] So sys admin is not held, and mount is refused. [[slnc 300]] The sniff network probe does exactly this."""

[[scene]]
key = "03-acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "04-costs"
kind = "bullets"
title = "What It Costs"
body = ["Every restriction can break the application", "The app's own secret stays readable", "Kubernetes judges the spec, not the image", "Limits need real numbers", "A lab may differ from production"]
narration = "Nothing is free. [[slnc 400]] Here is what it costs. [[slnc 500]] Every restriction can break the application, so each one needs testing. [[slnc 500]] The secret the application must read, a hijacked application can read too. [[slnc 500]] Kubernetes' pod security levels judge the pod's settings, not what is inside the image. [[slnc 500]] Limits on memory and processes need real numbers. [[slnc 300]] And a lab's Docker may behave differently from production."

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["--privileged or --cap-add in a compose file", "securityContext in a Kubernetes manifest", "pod-security.kubernetes.io/enforce labels", "kind create cluster in a build script"]
narration = "You have probably met this already. [[slnc 400]] Privileged, or cap add, in a compose file, gives a container more than it needs. [[slnc 500]] A security context, in a Kubernetes manifest, is where the hardened settings go. [[slnc 500]] A pod security enforce label on a namespace makes Kubernetes refuse pods below a level. [[slnc 500]] And kind create cluster, in a build script, is a real Kubernetes, for testing."

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Assume takeover; measure what is reachable", "Non-root, no capabilities, no new privileges", "Read-only root, noexec temp, limits", "A seccomp profile", "Enforce the restricted level", "Keep the secret out of the environment"]
narration = "So, how do you use it? [[slnc 400]] Assume the process is taken over, and measure what it can reach, with real attempts. [[slnc 500]] Run as a user that is not root, drop all capabilities, and forbid new privileges. [[slnc 500]] Use a read only root, a temporary folder where nothing can run, limits, and a seccomp profile. [[slnc 300]] Enforce the restricted level on every namespace. [[slnc 500]] And keep secrets out of the environment, where every process can see them."

[[scene]]
key = "12-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Mount the secret as a file", "instead of an environment variable, and probe again."]
narration = "That's container hardening with Docker and kind. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Assume the process is taken over, and measure, with real attempts, what each option and each pod security level takes away from it. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Mount the secret as a file instead of an environment variable, and run the probes again. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] Everything that is printed was measured inside a real container or a real cluster. [[slnc 300]] Here are the classes that matter."""

[[class]]
name = "Probes"
what = "the thirteen real attempts, as one shell script"
[[class.part]]
title = "an attempt is a command that works or fails"
code = """
r() { if "$@" >/dev/null 2>&1; then echo "$N=POSSIBLE"; else echo "$N=blocked"; fi; }
N=read-secrets; r test -n "$DB_PASSWORD"
...
N=mount-host; r mount -t tmpfs tmpfs /mnt
"""
speech = """Each attempt is a real command. [[slnc 300]] If it works, the attack is possible; if the kernel refuses it, it is blocked. [[slnc 300]] Reading the secret is just testing the environment variable, and mounting is a real mount."""
[[class.part]]
title = "what the probes read"
code = """
echo "fact CapEff=$(grep CapEff /proc/self/status | cut -f2)"
...
echo "fact memory.max=$(cat /sys/fs/cgroup/memory.max)"
"""
speech = """The script also prints the values it read, the capability mask and the limits, so the output can show the evidence, not only the verdict."""

[[class]]
name = "Capabilities"
what = "a teaching class: reads the CapEff mask bit by bit"
[[class.part]]
title = "one capability is one bit"
code = """
public static boolean held(String capEff, int n) {
    return (Long.parseUnsignedLong(capEff, 16) >> n & 1) == 1;
"""
speech = """Parse the hexadecimal mask, shift it right by the capability's number, and keep the last bit. [[slnc 300]] A test checks that Docker's default mask holds exactly its fourteen capabilities."""

[[class]]
name = "Run"
what = "one container, started with options, probed, and removed"
[[class.part]]
title = "docker run, then docker exec"
code = """
List<String> command = new ArrayList<>(List.of("docker", "run", "-d", "--rm",
        "--name", name));
command.addAll(options);
...
return Sh.must(List.of("docker", "exec", name, "sh", "-c", Probes.SCRIPT));
"""
speech = """The options under test go straight into docker run. [[slnc 300]] Then the script runs inside, with docker exec, as the container's own user, and the container is removed."""

[[class]]
name = "Cluster"
what = "a real kind cluster, with its own kubeconfig, deleted at the end"
[[class.part]]
title = "a namespace that enforces a standard"
code = """
kubectl("label", "namespace", name,
        "pod-security.kubernetes.io/enforce=" + enforce,
        "pod-security.kubernetes.io/warn=" + warn, "--overwrite");
"""
speech = """Pod Security Admission is switched on by a label on the namespace: enforce refuses a pod, warn only prints the checks it fails."""

[[class]]
name = "Report"
what = "prints the results; works out what a step blocked and opened"
[[class.part]]
title = "blocked and opened, from two lists"
code = """
List<String> blocked = new ArrayList<>(Probes.possibleNames(before));
blocked.removeAll(Probes.possibleNames(after));
List<String> opened = new ArrayList<>(Probes.possibleNames(after));
opened.removeAll(Probes.possibleNames(before));
"""
speech = """What a step blocked is what worked before and not after; what it opened is the other way round. [[slnc 300]] That is how step four shows that a new user closed one attempt and opened another."""

