"""

[[threat]]
id = "T1"
stride = "E"
threat = "A taken-over process reaches the host"
where = "privileged, host namespaces, mounts, capabilities"
control = "No privileged, no host namespaces or paths, all capabilities dropped, a seccomp filter"
residual = "Kernel bugs"

[[threat]]
id = "T2"
stride = "E"
threat = "The process is root, or becomes root"
where = "the user of the container"
control = "A numeric user that is not root, no new privileges"
residual = "Files the user owns"

[[threat]]
id = "T3"
stride = "T"
threat = "The attacker changes the application or drops a tool"
where = "the root file system"
control = "A read-only root and a temporary directory mounted noexec"
residual = "A writable temporary directory that runs code (as on Kubernetes emptyDir)"

[[threat]]
id = "T4"
stride = "D"
threat = "One container uses all the memory or processes"
where = "cgroup limits"
control = "Memory and process limits"
residual = "Limits set too high"

