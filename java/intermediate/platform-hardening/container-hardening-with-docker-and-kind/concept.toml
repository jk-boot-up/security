[docs.session]
objectives = [
    "assume a process is taken over and measure what it can reach",
    "name the docker run options that take attacks away",
    "read a Pod Security Admission refusal",
    "say what is left in the hardened container and why",
]
walkthrough = """
Run act three and find the line where the number does not change although the set does. In act four find the layer that holds when root comes back. In act five find the two attacks left in the hardened pod.
"""
exercises = [
    "Add a fourteenth attempt and see which option stops it.",
    "Mount the secret as a file instead of an environment variable and rerun the probe.",
    "Add a seccomp profile to the Kubernetes pod and compare.",
    "Move the hardened pod's temporary directory to a noexec mount.",
]

[docs.explained]
sentence = """
Hardening a container is taking away, one option at a time, what a taken-over process could use, and measuring what is left.
"""
verdict = """
Run as a user that is not root, drop all capabilities, keep the root file system read-only with a noexec temporary directory, filter system calls, set memory and process limits, never mount the Docker socket or host paths, let the cluster refuse what you did not mean to run, and keep secrets as short-lived as you can.
"""
recognise = [
    "`--privileged` or `--cap-add` in a command or a compose file.",
    "`securityContext` in a manifest.",
    "`pod-security.kubernetes.io/enforce` on a namespace.",
    "A `kind create cluster` in a build script.",
]

