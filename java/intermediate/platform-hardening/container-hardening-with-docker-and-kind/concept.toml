narration = "That's containers on Docker and kind. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Hardening a container is taking away, one option at a time, what a taken-over process could use, and measuring what is left. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a fourteenth attempt and see which option stops it. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"
