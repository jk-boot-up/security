Sixth demo: the same on Kubernetes, in a real kind cluster. [[slnc 400]] At the top, the input and the result together. [[slnc 300]] Each column is a namespace that enforces one Pod Security Standard. [[slnc 300]] Each row is a pod, sent so that only the admission decides. [[slnc 700]]
The tutorial's pod is refused by baseline, for three checks, and by restricted, for seven. [[slnc 300]] A plain pod is admitted by baseline, and refused by restricted, for four. [[slnc 300]] The hardened pod is admitted everywhere. [[slnc 600]]
At the bottom, the admitted pods, probed from inside. [[slnc 300]] The plain pod still allows seven attempts: baseline does not ask for a seccomp filter. [[slnc 300]] The hardened pod allows two: the secret, and a dropped script, because its temporary folder can run programs.
"""
