Here is the output. [[slnc 300]] The lab: one kind node, three namespaces, three pods, sent with dry run equals server. [[slnc 300]] Then the decisions table.
[[page]]
Why baseline refuses the tutorial's pod: host namespaces, host path volumes, and privileged. [[slnc 300]] Why restricted refuses the plain pod: four checks. [[slnc 300]] A namespace that only warns creates the pod, and lists the same four.
[[page]]
The running pods, probed from inside: seven, and two. [[slnc 400]] And what the standards do not cover: they judge the spec once, a writable temporary folder still runs a script, the namespace labels can be changed, and the secret is still readable.
"""
