[[act]]
title = "One setting at a time"
summary = "From 13 of 13: no host access 8, a seccomp profile 7, drop all capabilities 5, a user that is not root 5 (blocks become-root, opens tamper-with-app), no new privileges 5 (nothing to stop), a read-only root with a noexec /tmp 3, memory and process limits 1: read-secrets is left."
detail = """
The input of each step is the container of the step before, with one option more. The result is the count, and what the step blocked and opened, worked out as the difference of the two lists of attempts that worked.
No host access and no privileged mode blocks mount-host and the four host attempts (13 to 8). A seccomp profile blocks dangerous-syscalls (7). Dropping all capabilities blocks sniff-network and, less obviously, tamper-with-app: root without DAC_OVERRIDE cannot write files that belong to the app user (5).
A user that is not root blocks become-root but opens tamper-with-app again, because the app user owns /app (5). No new privileges moves nothing, because this image has no set-user-id program; in an image that has one, it is what stops it. A read-only root with a noexec /tmp blocks tamper-with-app and drop-and-run (3), and limits block exhaust-memory and fork-bomb (1).
"""
figure = "step_matrix"
figure_title = "Which attempts still work after each step"
figure_speech = """
Third demo: one option at a time, each one measured. [[slnc 400]] Each row is one attempt, and each column is the container after one more step. [[slnc 300]] Red means it still works. [[slnc 700]]
Step one removes the host access: five go away, eight are left. [[slnc 300]] Step two, a seccomp profile: seven. [[slnc 300]] Step three drops all capabilities: raw sockets go, and so does writing the app, because root without the D A C override capability cannot write files owned by the app user. [[slnc 600]]
Step four runs as the app user. [[slnc 300]] Become root goes, but the amber square shows what comes back: the app user owns its files, so it can change them. [[slnc 300]] Step five changes nothing here: the image has no set user id program to stop. [[slnc 300]] A read only root takes it to three, and limits to one.
"""
