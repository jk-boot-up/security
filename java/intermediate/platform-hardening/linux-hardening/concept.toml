[[act]]
title = "Running it again, in every build"
summary = "The build fails at HIGH or worse. The hardened image has 0 findings and the build passes; after a deployment script runs chmod 0777 /var/www/uploads and an engineer adds a test account with a login shell, the scan finds 2 HIGH findings and the build fails."
detail = """
The input is a build rule, fail at HIGH or worse, and the hardened image: 0 findings, so the build passes.
Then a later change: a deployment script runs chmod 0777 on the upload folder, and an engineer adds a test account with a login shell.
The result: the same scan finds 2 findings, world-writable-dir on /var/www/uploads (auto) and default-account for test, both HIGH, so the build fails the day the regression appears.
"""
figure = "regression"
figure_title = "A later change fails the build"
figure_speech = """
Fourth demo: running it again, in every build. [[slnc 400]] The build rule: fail on any finding that is high or worse. [[slnc 700]]
On the left, the hardened image. [[slnc 300]] Zero findings, so the build passes. [[slnc 700]]
In the middle, a later change. [[slnc 300]] A deployment script makes the upload folder writable by everyone again. [[slnc 300]] And an engineer adds a test account, to debug something. [[slnc 700]]
On the right, the next build. [[slnc 300]] The same scan finds two high findings. [[slnc 300]] The build fails, on the day the regression appears, not months later in an audit.
"""
speech = """
