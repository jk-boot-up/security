[[act]]
title = "The fixes a machine can make"
summary = "Seven permission changes, each worked out: 4755 - 4000 = 0755 (no set-user-id), 0775 - 0020 = 0755 (no group write), 0644 & 0640 = 0640 and 0644 & 0600 = 0600 (the policy's maximum), 0777 - 0002 = 0775 and 0666 - 0002 = 0664 (no write for others). 20 - 7 = 13 findings are left, none of them a permission; a second run changes nothing."
detail = """
The input is the 20 findings, 7 of them marked auto. For each, the fixer either takes bits away or keeps only the bits the policy allows.
Taking away: the hidden shell 4755 - 4000 = 0755 (no set-user-id), the cron script 0775 - 0020 = 0755 (no group write), the upload folder 0777 - 0002 = 0775 and its file 0666 - 0002 = 0664 (no write for others).
Keeping only: /etc/shadow 0644 & 0640 = 0640, the SSH host key and the application config 0644 & 0600 = 0600.
The result: 7 changes, 20 - 7 = 13 findings left, none of them a permission. A second run makes 0 changes. The fixer does not touch accounts, services or settings: those are decisions.
"""
figure = "fix_math"
figure_title = "How each new mode is made"
figure_speech = """
Second demo: the fixes a machine can make. [[slnc 400]] On the left, each file and its mode before the fix. [[slnc 300]] In the middle, the bits that change. [[slnc 300]] On the right, the new mode. [[slnc 700]]
Each digit is three bits: read is four, write is two, execute is one. [[slnc 300]] The hidden shell loses the set user id bit: four seven five five, minus four thousand, is zero seven five five. [[slnc 300]] The cron script loses group write: minus twenty. [[slnc 300]] The upload folder and its file lose write for others: minus two. [[slnc 700]]
The secrets keep only what the policy allows. [[slnc 300]] The shadow file becomes zero six four zero. [[slnc 300]] The host key and the app config become zero six zero zero: only the owner can read them. [[slnc 300]] Seven changes, and thirteen findings are left.
"""
speech = """
Here is the output. [[slnc 400]] Before the fix: twenty findings, seven of them auto. [[slnc 300]] Then each new mode, worked out. [[slnc 300]] A minus sign takes bits away. [[slnc 300]] An and sign keeps only the bits the policy allows.
[[page]]
After the fix: seven changes. [[slnc 300]] Twenty minus seven leaves thirteen findings, and none of them is a permission. [[slnc 300]] Run the fixer again, and it changes nothing.
"""
rows = { fix = "active ok" }
console = [
    ["BEFORE THE FIX:", "code"],
    ["  20 findings, 7 of them marked auto", "muted"],
    ["HOW EACH NEW MODE IS MADE (- takes bits away, & keeps only):", "code"],
    ["  /tmp/.hidden-shell            4755 - 4000 = 0755  no set-user-id", "muted"],
    ["  /etc/cron.daily/backup.sh     0775 - 0020 = 0755  no group write", "muted"],
    ["  /etc/shadow                   0644 & 0640 = 0640  policy 0640", "muted"],
    ["  /etc/ssh/ssh_host_ed25519_key 0644 & 0600 = 0600  policy 0600", "muted"],
    ["  /opt/app/config.properties    0644 & 0600 = 0600  policy 0600", "muted"],
    ["  /var/www/uploads              0777 - 0002 = 0775  no other write", "muted"],
    ["  /var/www/uploads/readme.txt   0666 - 0002 = 0664  no other write", "muted"],
    ["---", ""],
    ["AFTER THE FIX:", "code"],
    ["  changes    7", "muted"],
    ["  findings   20 - 7 = 13, none of them a permission", "muted"],
    ["  run again  0 changes: nothing left to fix", "muted"],
]

[[act]]
title = "The decisions a person makes"
summary = "The account line toor:x:0:0 has UID 0, root's number, so it is a second root; the shadow line test:: has an empty password field. The port table is hex: 00000000:0017 is 0.0.0.0 port 0x0017 = 23 on every interface, 0100007F:0CEA is 127.0.0.1 port 3306, this host only. A person removes toor and test, turns off root login, passwords, empty passwords and X11 forwarding, sets the three kernel options and stops ports 23, 2375 and 6379: 13 findings become 0."
detail = """
The input is the 13 findings left, and how the checker read them. In /etc/passwd the third field is the user id: toor:x:0:0 has UID 0, which is root's number, so toor is a second root. In /etc/shadow the second field is the password hash: test:: has it empty, so test logs in with no password.
The kernel's port table /proc/net/tcp writes each local address as hex: 00000000:0017 is address 0.0.0.0 (every interface) and port 0x0017 = 23. 0100007F:0CEA is the address 127.0.0.1 written backwards (little-endian) and port 0x0CEA = 3306: this host only. Ports 22 and 443 are allowed; 23, 2375 and 6379 are not.
Before the decisions the login accounts are root, toor, test and ana; PermitRootLogin, PasswordAuthentication, PermitEmptyPasswords and X11Forwarding are yes; randomize_va_space is 0, tcp_syncookies is unset, accept_redirects is 1; ports 22, 23, 443, 2375 and 6379 listen on every interface.
After them the login accounts are root and ana; the four SSH settings are no; the kernel settings are 2, 1 and 0; only 22 and 443 listen on every interface. The scan reports 0 findings.
"""
figure = "port_decode"
figure_title = "Reading an account line, and the port table in hex"
figure_speech = """
Third demo: the decisions a person makes. [[slnc 400]] First, how the checker read the findings. [[slnc 300]] An account line has seven fields, split by colons. [[slnc 300]] The third field is the user id. [[slnc 300]] Toor has user id zero, which is root's number, so toor is a second root. [[slnc 300]] In the shadow file, the second field is the password hash, and for test it is empty. [[slnc 700]]
Below, the kernel's port table. [[slnc 300]] It writes each address and port in hex. [[slnc 300]] Zero zero one seven in hex is twenty three, telnet. [[slnc 300]] An address of all zeros means every interface. [[slnc 300]] Zero one zero zero zero zero seven F, read backwards, is one two seven dot zero dot zero dot one: this host only. [[slnc 700]]
So the person deletes two accounts, changes four S S H settings and three kernel settings, and stops three services.
"""
speech = """
Here is the output. [[slnc 400]] The account lines, field by field: toor has user id zero, and test has an empty password field. [[slnc 300]] Then the port table, from hex to a number, with a verdict for each port.
[[page]]
Before the decisions: thirteen findings. [[slnc 300]] Four login accounts, four S S H settings that say yes, kernel settings that are off or missing, and five ports open on every interface.
[[page]]
After the decisions: two login accounts, root and ana. [[slnc 300]] All four S S H settings say no. [[slnc 300]] The kernel settings are on. [[slnc 300]] Only ports twenty two and four four three listen on every interface. [[slnc 300]] Zero findings.
"""
rows = { decide = "active ok" }
console = [
