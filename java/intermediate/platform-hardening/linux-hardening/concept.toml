[threatmodel]
scope = """
The configuration of the online store's Linux server image: file permissions, accounts, the SSH daemon, kernel parameters and listening ports.
It does not cover software vulnerabilities, application code, or the hypervisor and network around the host.
"""
assets = [
    "Root on the host and the secrets stored on it.",
    "The application and its data.",
]
actors = [
    "An attacker with a low-privilege foothold (for example through an application bug).",
    "An attacker on the network.",
    "An administrator who changes settings for convenience.",
]
boundaries = [
    "The network to the host: listening ports and the SSH daemon.",
    "Low privilege to root: set-user-id files, writable scripts and sudo.",
]
assumptions = [
    "The policy is right for this host.",
    "The scan reads the same tree that runs.",
]
out_of_scope = [
    "Vulnerable packages: the sbom-and-provenance and scanning projects.",
    "Containers' own isolation: container-hardening.",
]
tests = [
    "`LinuxHardeningTest` checks every rule on the prepared tree, the allow-lists, the order of the report, the mechanical fixes and their worked-out steps (and what they leave alone), the hardened tree, a regression that fails the build gate, missing files and links; the tests are skipped without Unix file modes.",
    "`ReadingTest` checks, without a file system, the mode digits as letters, the little-endian hex addresses of the port table, the steps of a fix and the build gate.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next project, container-hardening, asks what a compromised process can reach from inside a container and removes it, layer by layer.
"""

[[threat]]
id = "T1"
stride = "E"
threat = "A low-privilege user escalates through a set-user-id file, a writable cron script or a readable secret"
where = "`Scanner.permissions`"
control = "Allow-listed set-user-id files, maximum modes for secrets, no group or world write on scripts"
residual = "Vulnerabilities in the allowed set-user-id programs themselves"

[[threat]]
id = "T2"
stride = "S"
threat = "An attacker logs in as an account with no password, a default name, or root over SSH"
where = "`Scanner.accounts`, `Scanner.ssh`"
control = "Remove default accounts, keys only, no root login, no empty passwords"
residual = "Stolen keys; add multi-factor and monitoring"

[[threat]]
id = "T3"
stride = "E"
threat = "A service that should not be reachable listens on every interface"
where = "`Scanner.ports`"
control = "An allow-list of ports; bind other services to localhost; host firewall"
residual = "A service on an allowed port with its own flaws"

[poster]
headline = [["LINUX", "text"], ["HARDENING CHECKER", "accent"]]
taglines = [["Most host compromises begin with a setting that nobody looked at", "gold"]]
before = { code = "/tmp/.hidden-shell 4755", note = "set-user-id, not allowed", tag = "BEFORE" }
after = { code = "4755 - 4000 = 0755", note = "the fix a machine makes", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "Linux Hardening Checker"
narration = "Hello, and welcome. [[slnc 400]] This video explains Linux hardening, with a checker written in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] Hardening means removing the settings that make a server easy to break into. [[slnc 300]] A server image is built once and runs for years, and it collects settings nobody chose: a world-writable file, a test account with no password, root login over S S H, which is secure shell, and a port open to everyone. [[slnc 300]] A checker finds them, a machine fixes the safe ones, and a person decides the rest. [[slnc 600]] Think of locking up a shop at night: every door, every window, every time. [[slnc 600]] Our example is an online store's server image."

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online store's server image:", "a base image plus the store's application.", "", "The demo builds a prepared copy of it", "in a temporary folder, with real", "permission bits, account files,", "an SSH config, kernel settings", "and a table of listening ports."]
narration = "Here is the scenario. [[slnc 400]] An online store's server image is built from a base image, plus the store's application. [[slnc 500]] The demo builds a prepared copy of such an image in a temporary folder, with real permission bits, account files, an S S H configuration, kernel settings, and a table of listening ports. [[slnc 500]] Then it runs the checker, applies the safe fixes, lets a person decide the rest, and runs it again."

[[scene]]
key = "02-words"
kind = "bullets"
title = "The Words"
body = ["Mode: a file's permission bits, in octal", "Set-user-id: runs a program as its owner", "Account line: name, password, user id, shell", "Listening port: a service anyone can call", "Finding: a broken rule, with a severity", "Policy: what this host is allowed to have"]
narration = """Before the demos, the words. [[slnc 500]] A file's mode is its permission bits, written as four octal digits. [[slnc 500]] The set user id bit makes a program run with its owner's rights, often root's. [[slnc 500]] An account line, in the passwd file, holds the name, the user id and the login shell. [[slnc 500]] A listening port is a service that waits for connections. [[slnc 500]] A finding is one broken rule, with a stable name and a severity. [[slnc 500]] And a policy says what this host is allowed to have: which set user id files, which ports, which modes."""

[[scene]]
key = "02-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "02-mode-digits"
kind = "figure"
title = "How a file mode is read"
body = "mode_digits"
narration = """Let's see the core idea on two real files. [[slnc 400]] A mode has four digits. [[slnc 300]] The first holds the special bits. [[slnc 300]] Then one digit for the owner, one for the group, and one for everyone else. [[slnc 300]] In each digit, read is four, write is two, and execute is one, added together. [[slnc 700]]
On the left, the hidden shell in the temp folder: four seven five five. [[slnc 300]] The four is the set user id bit. [[slnc 300]] Seven is read, write and execute for the owner, and five is read and execute for the rest. [[slnc 300]] So anyone can run it, and it runs as root. [[slnc 300]] It is not on the allow-list. [[slnc 700]]
On the right, the shadow file, which holds the password hashes: zero six four four. [[slnc 300]] The last four means everyone can read it. [[slnc 300]] The policy allows at most zero six four zero."""

[[scene]]
key = "03-acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "04-costs"
kind = "bullets"
title = "What It Costs"
body = ["Automatic fixes can break things", "The allow-lists are the real work", "A scan is a snapshot", "Containers change what matters", "Full benchmarks are long"]
narration = "Nothing is free. [[slnc 400]] Here is what it costs. [[slnc 500]] Automatic fixes can break things, so only the safe, reviewed ones are automated. [[slnc 500]] The allow-lists, of expected set user id files and expected ports, are the real work. [[slnc 500]] A scan is a snapshot, true only on the day it ran. [[slnc 500]] Containers change which checks matter. [[slnc 300]] And full benchmarks, like the C I S ones, have hundreds of checks."

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["find / -perm -4000 in an incident report", "PermitRootLogin yes in sshd_config", "A Docker API on port 2375", "Lynis, OpenSCAP or CIS-CAT output"]
narration = "You have probably met this already. [[slnc 400]] A find command for set user id files, in an incident report, is the first thing responders look for. [[slnc 500]] Permit root login yes, in an S S H configuration, is left over from the install. [[slnc 500]] A Docker A P I on port two three seven five, without T L S, is root on the host for anyone who connects. [[slnc 500]] And Lynis, open scap, or C I S cat output, is a maintained checker doing the full list."

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Write the policy down", "Scan the image in the build", "Scan the hosts regularly", "Automate only safe, reviewed fixes", "A new finding fails the build", "Maintained benchmark tools for the full list"]
narration = "So, how do you use it? [[slnc 400]] Write the policy down: which files, accounts, and ports are expected. [[slnc 500]] Scan the image in every build, and the running hosts regularly. [[slnc 500]] Automate only the fixes that are safe and reviewed, like permissions. [[slnc 300]] Treat every new finding as a regression that fails the build. [[slnc 500]] And use maintained benchmark tools for the full list."

[[scene]]
key = "12-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a rule for sudoers entries", "with NOPASSWD, and decide if it is fixable."]
narration = "That's Linux hardening. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Most host compromises start from a setting nobody chose, so check files, accounts, S S H, kernel settings and ports in every build, let a machine fix permissions, and let a person decide the rest. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a rule for sudo entries with no password, and decide whether a machine may fix it. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] The checker reads a folder the way it would read the root of a real host. [[slnc 300]] Here are the classes that matter."""

[[class]]
name = "Modes"
what = "reads and sets a file's permission bits"
[[class.part]]
title = "the bits, and a digit as letters"
code = """
static final int SETUID = 04000;
...
static final int OTHER_WRITE = 0002;
static final int GROUP_WRITE = 0020;
...
return ((Integer) Files.getAttribute(p, "unix:mode")) & 07777;
...
return ((digit & 4) != 0 ? "r" : "-") + ((digit & 2) != 0 ? "w" : "-")
        + ((digit & 1) != 0 ? "x" : "-");
"""
speech = """The bits are named octal constants. [[slnc 300]] The mode is read through the J D K's unix file attribute view, which includes the set user id bit. [[slnc 300]] And a digit becomes letters: four is read, two is write, one is execute."""

[[class]]
name = "Scanner"
what = "the checks, in five groups, and the safe fixer"
[[class.part]]
title = "an unexpected set-user-id file"
code = """
if (!dir && (mode & (Modes.SETUID | Modes.SETGID)) != 0
        && !policy.setuidAllowed().contains(name)) {
    f.add(new Finding("unexpected-setuid", Severity.CRITICAL, name,
...
"""
speech = """Each rule is a plain if. [[slnc 300]] A file with the set user id or set group id bit, that is not on the policy's allow-list, is a critical finding. [[slnc 300]] The last argument, true, marks it as one a machine may fix."""
[[class.part]]
title = "take bits away, or keep only the allowed ones"
code = """
case "unexpected-setuid" ->
        remove(x, mode, Modes.SETUID | Modes.SETGID, "set-user-id");
case "world-writable-dir", "world-writable-file" ->
        remove(x, mode, Modes.OTHER_WRITE, "other write");
...
case "loose-permissions" ->
        keep(x, mode, policy.maxModes().get(x.subject()));
...
return new Fix(x.subject(), mode, "-",
        mode & bits, mode & ~bits, "no " + why);
"""
speech = """The fixer only touches findings marked fixable. [[slnc 300]] It either removes bits, with and not, or keeps only the bits the policy allows, with and. [[slnc 300]] It returns each change, so the demo can print how the new mode was made."""

[[class]]
name = "HostFiles"
what = "reads the account, SSH and kernel files"
[[class.part]]
title = "an account that can log in"
code = """
static boolean canLogIn(String[] account) {
    return !(account[6].endsWith("nologin")
            || account[6].endsWith("false"));
"""
speech = """The seventh field of an account line is its shell. [[slnc 300]] A shell of nologin or false means nobody can log in as it. [[slnc 300]] Only accounts that can log in are checked for empty passwords and default names."""

[[class]]
name = "PortTable"
what = "reads the kernel's table of listening sockets"
[[class.part]]
title = "hex, and the address backwards"
code = """
if (p.length < 4 || !p[3].equals("0A")) {
...
out.add(new Listener(p[1], address(local[0]),
        Integer.parseInt(local[1], 16)));
...
return (v & 0xFF) + "." + (v >> 8 & 0xFF)
        + "." + (v >> 16 & 0xFF) + "." + (v >> 24 & 0xFF);
"""
speech = """State zero A means listening. [[slnc 300]] The port is parsed from hex. [[slnc 300]] The address is one hex number with its bytes in reverse order, so the lowest byte comes first."""

[[class]]
name = "BuildGate"
what = "the scan as a build step"
[[class.part]]
title = "fail at a severity"
code = """
public record BuildGate(Severity failAt) {
    public boolean passes(List<Finding> findings) {
        return findings.stream()
                .noneMatch(f -> f.severity().compareTo(failAt) >= 0);
"""
speech = """The gate fails the build when any finding is at least as severe as its threshold. [[slnc 300]] With high, the two findings that came back fail it."""

[[acronym]]
short = "SSH"
long = "Secure Shell: remote login over an encrypted connection"
say = "S S H is secure shell: logging in to a server over an encrypted connection. Its daemon reads sshd config."
[[acronym]]
short = "UID"
long = "User ID: the number the kernel uses for an account"
say = "U I D is the user I D, the number the kernel uses for an account. Zero is root."
[[acronym]]
short = "rwx"
long = "read, write, execute: the three permission bits"
say = "r w x means read, write and execute, the three bits in each permission digit: four, two and one."
[[acronym]]
short = "hex"
long = "hexadecimal: base 16, digits 0-9 and A-F"
say = "Hex is hexadecimal, base sixteen. Seventeen in hex, one seven, is twenty three."
[[acronym]]
short = "TCP, IP, IPv4"
long = "Transmission Control Protocol; Internet Protocol, version 4"
say = "T C P is the transmission control protocol, and I P is the internet protocol. I P version four addresses look like one two seven dot zero dot zero dot one."
[[acronym]]
short = "API"
long = "Application Programming Interface"
say = "A P I is an application programming interface. The Docker A P I lets a caller start containers, so it is root on the host."
[[acronym]]
short = "TLS"
long = "Transport Layer Security: encryption for a connection"
say = "T L S is transport layer security, the encryption behind H T T P S."
[[acronym]]
short = "HTTP, HTTPS"
long = "Hypertext Transfer Protocol; HTTP over TLS (port 443)"
say = "H T T P is the hypertext transfer protocol of the web. H T T P S is H T T P inside T L S, on port four four three."
[[acronym]]
short = "ASLR"
long = "Address Space Layout Randomization"
say = "A S L R is address space layout randomization: the kernel puts memory at random places, so an exploit cannot guess them. randomize va space two turns it fully on."
[[acronym]]
short = "SYN"
long = "the TCP synchronize packet that opens a connection"
say = "S Y N is the T C P synchronize packet that opens a connection. S Y N cookies stop a flood of half-open connections from filling the queue."
[[acronym]]
short = "X11"
long = "the X Window System, version 11: graphical sessions"
say = "X eleven is the X window system, for graphical sessions. A server does not need it forwarded over S S H."
[[acronym]]
short = "CIS, CAT"
long = "Center for Internet Security; CIS-CAT, its Configuration Assessment Tool"
say = "C I S is the center for internet security, which publishes hardening benchmarks for Linux and many other systems. C I S cat is its configuration assessment tool."
[[acronym]]
short = "JDK"
long = "Java Development Kit"
say = "J D K is the Java development kit. Its unix file attribute view reads the full permission bits."
