# concept.toml: everything about this project that is not Java code.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "linux-hardening"
level = "intermediate"
module = "platform-hardening"
title = "Linux Hardening Checker"
short_title = "Linux Hardening"
package = "linuxhard"
main_class = "LinuxHardeningDemo"
tagline = "Most host compromises begin with a setting that nobody looked at"
bold = "A Linux host or container image is secure only if its file permissions, accounts, SSH settings, kernel options and listening ports are what they should be; a checker reads them all with the JDK, separates the permission fixes a machine can make safely from the decisions a person must make, and runs again in every build."
domain = "a Linux server image"
domain_note = ""
youtube_description = "A Linux hardening checker in Java: permissions, SUID files, accounts, SSH, kernel settings and open ports, with automatic fixes for what is safe."
thumb_lines = ["LINUX", "HARDENING CHECKER"]
thumb_code = "find / -perm -4000"
youtube_title = "Linux Hardening Checker in Java: Permissions, SUID, Accounts, SSH, Ports"
youtube_tags = ["linux hardening", "suid", "file permissions", "sshd_config", "cis benchmark", "java", "application security"]

[readme]
intro = """
A server image is built once and runs for years. Over time it collects the settings that nobody chose: a file that was made world-writable to get a deployment working, a test account with no password, a root login over SSH left on from the install, a database port that listens on every interface,
a copy of a shell with the set-user-id bit. Each is small. Together they are the usual first step of an intrusion and the usual finding of an audit.

This project is a **host checker**. It reads a root directory (a live system's `/`, a mounted container image, or the prepared test tree used here) and checks, in five groups:
- **File permissions:** unexpected **set-user-id** or set-group-id files, world-writable files and directories without the sticky bit, secrets and keys that are not private enough, cron scripts a group can write.
- **Accounts:** a second UID 0 account, logins with an empty password, well-known default account names with a shell.
- **SSH daemon:** root login, password authentication, empty passwords, X11 forwarding.
- **Kernel settings:** address space randomization, SYN cookies, ICMP redirects.
- **Listening ports:** services that listen on every interface and are not on the allow-list.

Then it separates what a machine can fix (a permission change is mechanical and safe) from what needs a person (removing an account, changing a service, deciding a policy), applies the first group, and shows that the report shrinks to the decisions.

**Maps to:** OWASP Top 10 (2025) A02 Security Misconfiguration · CIS Benchmarks for Linux (sections on file permissions, user accounts, SSH and network parameters) · CWE-732 · CWE-250 · NIST SP 800-123 · NIST CSF Protect.
"""
analogy = """
A building inspector with a checklist who also carries a screwdriver: they tighten the loose handrail on the spot, and write a note for the owner about the missing fire exit. A re-inspection every month catches the handrail that someone loosens again.
"""
scenario = """
A server image for a small web shop, built from a base image plus the shop's application. The demo builds a prepared copy of such an image in a temporary directory, with real Unix permission bits (including set-user-id), account files, an SSH configuration, kernel settings and a table of listening ports,
and scans it before and after the fixes.
"""
costs = [
    "**Automatic fixes can break things.** Removing the set-user-id bit from a tool that needs it, or tightening a file that another service reads, stops that service. Fix mechanically only what is on a reviewed list and run the tests after.",
    "**The allow-lists are the work.** Which set-user-id programs, ports and file modes are right depends on the host; the policy must be written, versioned and reviewed.",
    "**A scan is a snapshot.** The same scan belongs in the image build and on running hosts, or the next change undoes the work.",
    "**Containers change the picture.** Many host checks (kernel settings, ports) belong to the host, not the image; the container-hardening project covers the container side.",
    "**Benchmarks are long.** The CIS benchmarks have hundreds of checks; start with the ones that stop the common attacks and grow from there.",
]
too_much = """
For production, use maintained tools (OpenSCAP, Lynis, CIS-CAT, the distribution's hardening guides, or your configuration management with tested roles) and their reports. Writing your own checker is for understanding what they check and for adding the few rules that are specific to your platform.
"""
met_before = [
    "`find / -perm -4000` in privilege escalation guides.",
    "`PermitRootLogin no` and `PasswordAuthentication no` in every SSH hardening list.",
    "Lynis, OpenSCAP and CIS-CAT reports.",
    "`chmod 600` on private keys, and \"unprotected private key file\" errors from ssh.",
]
where = """
This project is in [platform-hardening](..) and is followed by [container-hardening](../container-hardening), which looks at the same ideas from inside a container. The Docker version (linux-hardening-with-docker) runs these checks against a hardened image.
"""
twin = """
The file permissions are real Unix mode bits set and read through the JDK (the `unix` file attribute view, so the tests need Linux or macOS and are skipped elsewhere). The account, SSH, kernel and port files are small text files in the formats of the real ones, including a `/proc/net/tcp` style table. The fixture is built in a temporary directory that is removed afterwards.
"""
test_note = "The temporary directory's name is never printed, and the tests are skipped on systems without Unix file modes."

[[act]]
title = "What the checker finds on a typical image"
summary = "20 findings: 7 critical, 8 high, 3 medium and 2 low, of which 7 can be fixed mechanically."
detail = """
The checker reads the image and reports, worst first: a login with no password, a second UID 0 account called toor, telnet, the Docker API and Redis listening on every interface, empty passwords allowed in SSH, and a copy of a shell with the set-user-id bit in /tmp (critical).
The high findings include a group-writable cron script, a test account with a shell, a shadow file, an SSH host key and an application config with a password that are readable by everyone, root login over SSH, and a world-writable upload directory. Seven of the twenty are permission problems that a machine can fix.
"""
speech = """
First demo: what the checker finds on a typical image. [[slnc 400]] Twenty findings. [[slnc 300]] A second root account. [[slnc 300]] A login with no password. [[slnc 300]] Telnet, the docker api and redis, open to the world. [[slnc 600]]
A copy of a shell with the set user id bit. [[slnc 300]] A shadow file that anyone can read. [[slnc 300]] Seven of the twenty are permissions that a machine can fix.
"""
rows = { scan = "active wrong" }
console = [
    ["CRITICAL unexpected-setuid  /tmp/.hidden-shell: mode 4755 [auto-fixable]", "bad"],
    ["CRITICAL extra-root-account  toor: UID 0 gives root rights to a second name", "bad"],
    ["CRITICAL open-port  port 2375: Docker API without TLS: root on the host for anyone who connects", "bad"],
    ["HIGH loose-permissions  /etc/shadow: mode 0644 is looser than 0640 [auto-fixable]", "bad"],
    ["20 findings: 7 critical, 8 high, 3 medium, 2 low; 7 can be fixed mechanically", "amber"],
]

[[act]]
title = "The fixes a machine can make"
summary = "Seven permission changes are applied and 13 findings are left, none of them permissions: accounts, SSH, kernel settings and ports."
detail = """
The checker removes the set-user-id bit from the unexpected file, takes world write away from the upload directory and its file, group write away from the cron script, and tightens shadow, the SSH host key and the application config to the modes the policy names.
It does not touch accounts, services or settings. The second scan still reports thirteen findings, all of them decisions: the empty password and the extra root account, the three ports, the SSH settings, the kernel options and the default account.
"""
speech = """
Second demo: the fixes a machine can make. [[slnc 400]] Seven permission changes. [[slnc 300]] The unexpected set user id bit is removed. [[slnc 300]] World write goes away. [[slnc 300]] The secrets become private. [[slnc 600]]
Thirteen findings are left, and none of them is a permission. [[slnc 300]] They are decisions for a person.
"""
rows = { fix = "active ok" }
console = [
    ["permission changes applied: 7", "ok"],
    ["findings left: 13 (none of them a permission)", "amber"],
]

[[act]]
title = "The decisions a person makes"
summary = "After removing the second root account and the test account, switching off passwords and root login for SSH, setting the kernel options and closing the extra ports, the scan reports 0 findings."
detail = """
A person reads the thirteen findings and decides: delete the toor and test accounts, set the SSH daemon to refuse root login, passwords and empty passwords, set the three kernel options, and stop the telnet, Docker API and Redis services (the port table now shows only SSH, the local-only service and HTTPS).
The scan is clean. The result is a baseline: the same scan, with the same policy, goes into the image build.
"""
speech = """
Third demo: the decisions a person makes. [[slnc 400]] Delete the second root account and the test account. [[slnc 300]] Turn off root login and passwords for ssh. [[slnc 300]] Set the kernel options. [[slnc 300]] Stop the services that should not listen. [[slnc 600]]
The scan is clean, and becomes the baseline.
"""
rows = { decide = "active ok" }
console = [
    ["after the person's decisions -> 0 findings", "ok"],
]

[[act]]
title = "Running it again"
summary = "A second scan of the hardened tree reports 0 findings, and the same scan in the build makes a regression fail it."
detail = """
Hardening decays: a deployment script makes a directory world-writable again, an engineer adds a test account to debug something. The scan is cheap, so it runs in the image build and on running hosts; a new finding fails the build or raises an alert.
"""
speech = """
Fourth demo: running it again. [[slnc 400]] Hardening decays. [[slnc 300]] A deployment script loosens a directory. [[slnc 300]] An engineer adds a test account. [[slnc 600]]
The scan is cheap, so it runs in every build, and a new finding fails it.
"""
rows = { again = "active ok" }
console = [
    ["a second scan of the hardened tree -> 0 findings", "ok"],
]

[animation]
subtitle = "A server image, a checklist of five groups of settings, and the fixes that a machine may make."
boxes = [
    ["scan", "Scan", "permissions, accounts, SSH, kernel, ports"],
    ["fix", "Machine fixes", "safe permission changes"],
    ["decide", "Human decisions", "accounts, services, policy"],
    ["again", "Scan again", "in every build"],
]

[docs.problem]
scenario = """
A small shop runs on Linux servers built from an image that has grown for years, and nobody can say which of its settings are intentional.
"""
naive = """
The image boots and the application works, so the host is fine.
"""
deliver = [
    "A prepared image tree with real Unix permission bits and the usual mistakes.",
    "A checker for permissions, set-user-id files, accounts, SSH, kernel settings and listening ports, with a policy.",
    "A safe fixer for permission findings only.",
    "A report that separates fixable findings from decisions.",
]

[docs.prerequisites]
required = [
    "Java basics",
    "An idea of Unix file permissions (read, write, execute for user, group and others)",
]
not_required = [
    "Root access: the checker reads a directory tree",
    "Docker: that is the next project",
]
install = []

[docs.session]
objectives = [
    "explain the set-user-id bit and why an unexpected one is critical",
    "say which permissions a secret file should have and why",
    "list the SSH and account settings that matter most",
    "explain why only permission fixes are automated",
]
walkthrough = """
Run act one and ask which findings an attacker with a low-privilege shell would use first. In act two, ask why the checker does not delete the toor account. In act four, ask where the scan should run.
"""
exercises = [
    "Add a rule for files with no owner (a user that has been deleted), using the `unix:uid` attribute.",
    "Add a rule for `/etc/sudoers` entries with NOPASSWD, and decide if it is fixable.",
    "Read the allow-lists from a policy file and add a test for an invalid file.",
    "Make the scan fail a Gradle build when a CRITICAL finding is present.",
]

[docs.explained]
sentence = """
A host is hardened when its permissions, accounts, SSH, kernel options and listening ports match a written policy; machines can fix permissions safely, people decide the rest, and a scan in every build keeps it that way.
"""
verdict = """
Write the policy, scan the image in the build and the hosts regularly, automate only the safe, reviewed fixes, treat every new finding as a regression, and use maintained benchmark tools for the full list.
"""
recognise = [
    "`find / -perm -4000 -type f` in an incident report.",
    "`PermitRootLogin`, `PasswordAuthentication` and `PermitEmptyPasswords` in `sshd_config`.",
    "`chmod 600 id_rsa`.",
    "Lynis, OpenSCAP and CIS-CAT output.",
]

[spec]
purpose = """
Teach host hardening by scanning a prepared Linux image for permission, account, SSH, kernel and port problems, applying the safe mechanical fixes, and showing the decisions left for a person.
"""
nongoals = [
    "A full CIS benchmark implementation.",
    "Running on Windows (the tests need Unix file modes).",
    "The Docker version: the linux-hardening-with-docker project.",
]
problem = """
Images and hosts keep the settings that were convenient once, and nobody scans for them.
"""
roles = [["The checker", "`Scanner`, `Finding`, `Severity`, `Policy`, `Modes`"], ["The prepared image", "`Fixture`"], ["Entry point", "`LinuxHardeningDemo`"]]
requirements = [
    "The checker finds the planted permission, account, SSH, kernel and port problems and nothing on allow-listed items.",
    "Findings are sorted worst first.",
    "Permission fixes change only modes and leave no fixable finding; the other findings remain.",
    "The hardened tree has no findings.",
    "The demo prints the same output on every run.",
]

