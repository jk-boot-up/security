[[act]]
title = "The bill"
summary = "The lock made B wait 3 steps; two transfers that each lock their own sender first deadlock, while one lock order for everyone (ANA-1, then BEN-2) finishes both and leaves ana 520 and ben 480; two servers with locks in their own memory both pay out 80, 160 from 100, so the guarantee must come from the database."
detail = """
A lock makes requests to one account take turns: in act two's order, B waited 3 steps while A held the lock.
Two transfers in opposite directions, A from ANA-1 to BEN-2 for 50 and B from BEN-2 to ANA-1 for 70, each lock their own sender first. In the order AB, A locks ANA-1, B locks BEN-2, A waits for BEN-2 and B waits for ANA-1: each waits for a lock the other holds, a deadlock.
With one lock order for everyone, the smaller account first, both lock ANA-1, then BEN-2. B waits while A moves 50 and unlocks both, then B moves 70. No deadlock: ana has 500 - 50 + 70 = 520 and ben 500 + 50 - 70 = 480.
Two servers sharing one database, each with a lock in its own memory, take the locks server-1:ANA-1 and server-2:ANA-1, which never meet: both pay out 80, 160 from 100. With more than one server, the database must give the guarantee, with row locks, isolation levels or a version check, which is the -with-postgres version of this project.
"""
figure = "lock_order"
figure_title = "Two lock orders, and two servers with their own locks"
figure_speech = """
Fifth demo: the bill. [[slnc 400]] On the left, two transfers in opposite directions. [[slnc 300]] A sends fifty from ana to ben, and B sends seventy from ben to ana. [[slnc 300]] Each one locks its own sender first. [[slnc 300]] A holds ana's lock, and B holds ben's. [[slnc 300]] Now each one waits for the lock the other holds. [[slnc 300]] Neither can go on, for ever. [[slnc 300]] That is a deadlock. [[slnc 700]]
On the right, one rule for everyone: take the smaller account's lock first. [[slnc 300]] Both transfers start with ana's lock. [[slnc 300]] A gets it, and B waits. [[slnc 300]] A finishes and unlocks, then B runs. [[slnc 300]] No deadlock, and the balances add up. [[slnc 700]]
At the bottom, two servers that share one database. [[slnc 300]] Each takes a lock in its own memory. [[slnc 300]] The two locks never meet, so both servers pay out eighty, from one hundred. [[slnc 300]] With more than one server, the database must decide.
"""
speech = """
The lock costs waiting: B spent three steps waiting while A held it. [[slnc 400]] Then two transfers, each locking its own sender first. [[slnc 300]] A locks ana's account, B locks ben's, and each waits for the other. [[slnc 300]] A deadlock.
