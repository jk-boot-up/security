tagline = "Correct one at a time is not correct at the same time"
bold = "A check and the action it protects must happen as one step, a retried request must not run twice, and the server must keep its own rules about amounts, coupons and order states, because attackers send requests together, again and out of order."
domain = "an online bank"
domain_note = ""
youtube_description = """Race conditions and business logic flaws in Java, OWASP Top 10 A06, insecure design. Explained with an online bank and store, like two cashiers who each check the same nearly empty account and both hand over the money. We watch two withdrawals of 80 from a balance of 100 both succeed, and a single-use coupon used twice, by running the steps of two requests in a written order; fix them with a lock and with a compare-and-set, so the balance can never go below zero; stop a retried payment from paying twice with an idempotency key; keep the server's own rules about negative amounts, transfers to yourself, stacked coupons, totals sent by the client and orders refunded twice; and finish with the bill: locks make requests take turns, locks taken in the wrong order deadlock, and a lock in one server does not stop another."""
thumb_lines = ["RACE CONDITIONS", "AND BUSINESS LOGIC"]
