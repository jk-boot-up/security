[[act]]
title = "The bill"
summary = "A lock made B wait 3 steps; two transfers that lock their own sender first deadlock, while one fixed lock order finishes both; two servers with locks in their own memory both pay 80 from 100, so the guarantee must come from the database."
detail = """
A lock makes requests to one account take turns: B spent 3 steps waiting while A held the lock. Two transfers in opposite directions, each locking its own sender first, deadlock: A locks ANA-1, B locks BEN-2,
and each waits for the other. With every lock taken in one order, the smaller account first, both finish and ana has 520 and ben 480. Two servers, each with its own lock in its own memory, sharing one database,
both pay out 80 from 100: a lock in one process does not stop another. With more than one server, the guarantee must come from the database, which is the -with-postgres version of this project.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] A lock makes requests to one account take turns. [[slnc 300]] The second request waited while the first held the lock. [[slnc 600]]
Two transfers in opposite directions, each locking its own sender first, wait for each other for ever. [[slnc 300]] That is a deadlock. [[slnc 300]] Taking every lock in one fixed order prevents it. [[slnc 600]]
And two servers, each with its own lock in its own memory, both pay out. [[slnc 300]] A lock in one process does not stop another. [[slnc 600]]
With more than one server, the guarantee must come from the database.
"""
