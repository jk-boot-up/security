]

[[act]]
title = "Sending the same request twice"
summary = "Without a key, a retried rent payment of 300 leaves ana with 400 and ben with 600; with an idempotency key, the second send returns the first answer, the same key with another amount is refused, and a new key is a new payment."
detail = """
Ana pays 300 rent, the reply is lost, and her app sends the request again. Without a key, ana has 400 and ben 600: paid twice. With an idempotency key chosen by the app for this payment, the first send moves 300,
and the same key again returns "already done: moved 300", so ana has 700 and ben 300. The same key with a different amount is refused, because a key names one request. A new key is a new payment.
The key is claimed in one step before the money moves, so two copies racing each other cannot both run.
"""
speech = """
Third demo: sending the same request twice. [[slnc 400]] Ana pays her rent. [[slnc 300]] The reply is lost, and her app sends the request again. [[slnc 600]]
Without a key, she pays twice. [[slnc 600]]
With an idempotency key, chosen by the app for this one payment, the second send returns the first answer. [[slnc 300]] The money moves once. [[slnc 600]]
The same key with a different amount is refused. [[slnc 300]] A key names one request. [[slnc 300]] And the key is claimed in one step, so two copies racing each other cannot both run.
"""
rows = { retry = "active ok" }
console = [
    ["the reply is lost and the app sends again: without a key, ana has 400 and ben 600  <- PAID TWICE", "bad"],
    ["with an idempotency key: first send: moved 300", "ok"],
    ["the same key again: already done: moved 300; ana has 700 and ben 300", "ok"],
    ["the same key with a different amount: refused: the key rent-october was used for a different transfer", "ok"],
    ["a new key is a new payment: moved 300; ana has 400", "muted"],
]

[[act]]
title = "Rules the server must keep"
summary = "A careless bank moves money the wrong way for -50 and rewards ten transfers to oneself; a careless checkout charges -59 for boots at 180; an order kept as flags is refunded 360 without being paid; the careful versions refuse each one."
detail = """
A careless bank given a transfer of -50 from ana to ben takes 50 from ben. Ten transfers of 1 from ana to herself earn 10 reward points for nothing. The careful bank refuses a negative amount,
a transfer to the same account, and more money than the account holds. A cart with boots at 180, three coupons and a total of 1 written by the client is charged -59 by a careless checkout,
and 160 by the careful one, which ignores the client's total and allows one coupon per order. An order kept as flags is shipped before payment and refunded 360 on an order of 180. As a state machine,
shipping first is refused, paying, shipping and refunding work, and a second refund is refused: 180 refunded in all.
"""
