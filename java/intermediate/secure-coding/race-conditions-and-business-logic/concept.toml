[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] Each request is a list of steps, so the demo can run them in any order. [[slnc 300]] Here are the classes that matter."""

[[class]]
name = "Interleaving"
what = "runs two requests' steps in a written order"
[[class.part]]
title = "one letter, one step"
code = """
for (char c : order.toCharArray()) {
    Steps request = requests[c - 'A'];
    if (request.finished()) {
        continue;
    }
    trace.add(request.step());
"""
speech = """An order such as A B A B A B is read one letter at a time. [[slnc 300]] Each letter runs the next step of that request, and the step's description goes into the trace. [[slnc 300]] The demo and the tests use it to try every order."""

[[class]]
name = "NaiveWithdrawal"
what = "check, then act: three steps with a gap"
[[class.part]]
title = "read, check, write"
code = """
case 0 -> {
    seen = ledger.balance(account);
...
case 1 -> {
    approved = seen >= amount;
...
ledger.set(account, seen - amount);
ledger.payOut(account, amount);
"""
speech = """Three separate steps. [[slnc 300]] The write uses the balance that was read earlier, seen, not the balance as it is now. [[slnc 300]] Another request that runs in between is never noticed."""

[[class]]
name = "LockedWithdrawal"
what = "the same steps inside a lock"
[[class.part]]
title = "wait for the lock, then read"
code = """
if (!ledger.tryLock(lock, name)) {
    waiting = true;
    return name + " waits for the lock " + lock;
}
...
ledger.unlock(lock, name);
"""
speech = """The first step takes the lock, or waits for it. [[slnc 300]] Read, check and write happen only while the lock is held. [[slnc 300]] It is released after the write, so the next request reads the new balance."""

[[class]]
name = "Ledger and CasWithdrawal"
what = "a write that happens only if nothing changed"
[[class.part]]
title = "compare, then set, in one step"
code = """
boolean compareAndSet(String account, long expected, long updated) {
    if (balances.get(account) != expected) {
        return false;
    }
    balances.put(account, updated);
    return true;
"""
speech = """The compare and set checks that the balance is still the expected value, and writes, in one step. [[slnc 300]] In real Java, an atomic long does the same in one processor instruction."""
[[class.part]]
title = "on failure, start again"
code = """
if (ledger.compareAndSet(account, seen, seen - amount)) {
    ledger.payOut(account, amount);
...
phase = Phase.READ;
"""
speech = """If the write fails, someone else wrote first. [[slnc 300]] The request goes back to reading, and checks again with the new balance."""

[[class]]
name = "Bank"
what = "idempotency keys and the transfer rules"
[[class.part]]
title = "claim the key in one step"
code = """
Transfer earlier = keys.putIfAbsent(key, t);
if (earlier != null) {
    if (!earlier.equals(t)) {
        return "refused: the key was used for another transfer";
    }
"""
speech = """Put if absent stores the key only if it is new, in one step. [[slnc 300]] So when two copies race, only one of them claims it. [[slnc 300]] A known key with a different transfer is refused, and the same transfer gets the first answer."""
[[class.part]]
title = "rules the server keeps"
code = """
if (t.amount() <= 0) {
    return "the amount must be above zero";
}
if (t.from().equals(t.to())) {
    return "a transfer to the same account";
"""
speech = """Each rule is a plain check on the server. [[slnc 300]] An amount must be above zero, and a transfer must go to another account."""

[[class]]
name = "Checkout"
what = "prices from the catalogue, one coupon"
[[class.part]]
title = "the server's price, one coupon"
code = """
Long price = CATALOGUE.get(line.sku());
...
} else if (applied) {
    notes.add(coupon + " refused: one coupon per order");
"""
speech = """The price comes from the catalogue, never from the request. [[slnc 300]] The total the client sent is ignored. [[slnc 300]] After one coupon is applied, every other one is refused."""

[[class]]
name = "Order"
what = "an order as a state machine"
[[class.part]]
title = "each step from the right state only"
code = """
String ship() {
    return move(state == State.PAID, State.SHIPPED, "ship");
}
...
String refund() {
    String answer = move(
        state == State.PAID || state == State.SHIPPED,
        State.REFUNDED, "refund");
"""
speech = """Each step names the states it may start from. [[slnc 300]] Ship only from paid. [[slnc 300]] Refund only from paid or shipped, so a refunded order cannot be refunded again."""

[[class]]
name = "LockingTransfer"
what = "two locks, taken in one fixed order"
[[class.part]]
title = "the smaller account first"
code = """
boolean swap = fixedOrder && from.compareTo(to) > 0;
this.first = swap ? to : from;
this.second = swap ? from : to;
"""
speech = """With the fixed order, the account that sorts first is always locked first, whichever way the money goes. [[slnc 300]] Two transfers can never hold one lock each, so they cannot deadlock."""

[[acronym]]
short = "OWASP"
long = "Open Worldwide Application Security Project"
say = "O W A S P is the open worldwide application security project, which publishes the top ten list of web application risks."
[[acronym]]
short = "TOCTOU"
long = "Time Of Check to Time Of Use: the gap in check, then act"
say = "T O C T O U is time of check to time of use: the gap between checking a value and using it."
[[acronym]]
short = "API"
long = "Application Programming Interface"
say = "A P I is an application programming interface: the requests a service accepts from programs."
[[acronym]]
short = "SQL"
long = "Structured Query Language: how programs ask a database"
say = "S Q L is structured query language, the language programs use to read and change a database."


[threatmodel]
scope = """
An online bank's withdrawals and transfers and an online store's coupons, checkout and order workflow, under requests that arrive together, arrive again, and break the rules. It covers one service process; the database-level
guarantees for many servers are the -with-postgres version. It does not cover authentication or input parsing, covered by earlier projects.
"""
assets = [
    "Account balances and the money paid out.",
    "Single-use coupons and the discounts given.",
    "Orders, their states and refunds.",
    "Idempotency keys and their stored answers.",
]
actors = [
    "Customers, whose apps retry when a reply is lost.",
    "An attacker who sends the same request many times in parallel, or with crafted values.",
    "Operators who run more than one server.",
]
boundaries = [
    "Client to server: amounts, totals, coupons and steps arrive from outside and must be checked against the server's own rules.",
    "Request to shared state: every check and action on shared state is a place where requests can overlap.",
]
assumptions = [
    "One service process in the plain version; the model's locks are the process's locks.",
    "Clients choose a new idempotency key for each new operation, and reuse it only for retries.",
    "In the demo, concurrency is modelled with a written order of steps; the real-thread tests force the bad order.",
]
out_of_scope = [
    "Database isolation levels and row locks: the -with-postgres version.",
    "Distributed locks across services.",
    "Authentication and input validation: the earlier projects.",
]
tests = [
    "`InterleavingTest` runs every order of two requests: check-then-act overdraws in some, the lock and compare-and-set in none; coupons, deadlock and fixed lock order.",
    "`RealThreadsTest` forces the bad order with a barrier on real threads, and checks the lock, compare-and-set and idempotency key under load fifty times.",
    "`RulesTest` checks the transfer rules, idempotency answers, the order state machine and checkout pricing.",
    "`EveryOrderTest` checks the 20 and 70 orders the demo counts, that only the two in-turn orders are safe, and how each checkout total is made.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next project, secrets-in-errors-and-logs, looks at what leaks when things go wrong, and the -with-postgres version moves these guarantees into the database.
"""

[[threat]]
id = "T1"
stride = "T"
threat = "Two requests both pass a balance or coupon check before either writes, and spend the same money or coupon twice"
where = "`NaiveWithdrawal`, `CouponRedemption`"
control = "The check and the write as one step: a lock, a compare-and-set, or a claim in one step"
residual = "A lock in one process does not protect state shared by many servers"

[[threat]]
id = "T2"
stride = "T"
threat = "A retried request moves money again"
where = "`Bank.transfer`"
control = "An idempotency key claimed in one step, returning the first answer to every copy"
residual = "Keys must be stored long enough to cover retries, and clients must send them"

[[threat]]
id = "T3"
stride = "T"
threat = "A negative amount, a transfer to oneself or an overdraft is accepted"
where = "`Bank` rules"
control = "Server-side rules for every transfer"
residual = "Rules nobody wrote down are not enforced; new features need new rules"

[[threat]]
id = "T4"
stride = "T"
threat = "The client's total or stacked coupons set the price"
where = "`Checkout`"
control = "Prices from the catalogue, the client's total ignored, one coupon per order"
residual = "Promotions with complex rules need their own tests"

[[threat]]
id = "T5"
stride = "E"
threat = "Workflow steps are skipped or repeated: shipped before payment, refunded twice"
where = "`Order`"
control = "A state machine that allows each step only from the right states"
residual = "States must be checked and changed in one step too, or a race returns"

[[threat]]
id = "T6"
stride = "D"
threat = "Locks taken in different orders deadlock, and requests hang"
where = "`LockingTransfer`"
control = "Every lock taken in one fixed order"
residual = "Locks still cost throughput, and timeouts are needed for anything that waits"
