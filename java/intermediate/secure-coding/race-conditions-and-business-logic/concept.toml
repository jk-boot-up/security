[poster]
headline = [["RACE CONDITIONS", "text"], ["AND BUSINESS LOGIC", "accent"]]
taglines = [["Correct one at a time is not correct at the same time", "gold"]]
before = { code = "if (balance >= amount) ...", note = "two requests both pass", tag = "BEFORE" }
after = { code = "one step + idempotency key", note = "every order is safe", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "Race Conditions and Business Logic"
narration = """Hello, and welcome. [[slnc 400]] This video explains race conditions and business logic flaws, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A race condition happens when the result depends on the order in which two things run. [[slnc 300]] A business logic flaw is a rule the server forgot to keep. [[slnc 600]] Think of two cashiers at two counters. [[slnc 300]] A customer with one hundred asks both for eighty, at the same moment. [[slnc 300]] Each cashier looks, sees one hundred, and pays. [[slnc 300]] Neither was wrong to look. [[slnc 300]] Together, they paid one hundred and sixty. [[slnc 700]] In this video, the domain is an online bank and store. [[slnc 500]] By the end, you will hear how two requests slip through one check. [[slnc 300]] How to make the check and the action one step. [[slnc 300]] How to stop a retried payment from paying twice. [[slnc 300]] And which rules the server must keep for itself."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["A bank and a store serve many requests at once.", "", "Customers double-click.", "Apps retry when a reply is lost.", "Attackers send the same request", "many times, in parallel, on purpose."]
narration = """Here is the scenario. [[slnc 400]] An online bank and store serve many requests at once, from many devices. [[slnc 500]] Customers double click. [[slnc 300]] Apps retry when a reply is lost. [[slnc 300]] And attackers send the same request many times, in parallel, on purpose."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["Race condition: the order decides the result", "Check, then act: a gap between the two", "Compare-and-set: write only if unchanged", "Idempotency key: one request, run once", "Deadlock: each waits for the other"]
narration = """Before the demos, the words. [[slnc 500]] A race condition is when the order of two things decides the result. [[slnc 500]] Check, then act, leaves a gap between the check and the action. [[slnc 500]] A compare and set writes a value only if it has not changed. [[slnc 500]] An idempotency key makes one request run once, however often it is sent. [[slnc 500]] And a deadlock is two requests, each waiting for the other."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "09-ladder"
kind = "bullets"
title = "Ways to Close the Gap"
body = ["A lock around check and write: one process", "Compare-and-set: no lock, a retry", "One conditional UPDATE: the database decides", "Row locks and versions: many servers"]
narration = """Let's put the ways to close the gap side by side. [[slnc 400]] A lock around the check and the write works inside one process. [[slnc 500]] A compare and set needs no lock, and retries when it loses. [[slnc 500]] A single conditional update lets the database check and write in one step. [[slnc 500]] And with many servers, row locks and version checks in the database are the guarantee."""

[[scene]]
key = "10-roles"
kind = "bullets"
title = "Who Does What"
body = ["Steps and Interleaving: requests in a written order", "Ledger: shared state of the model", "NaiveWithdrawal, LockedWithdrawal, CasWithdrawal", "Bank: idempotency keys and rules", "Order and Checkout: states and prices"]
narration = """Here is who does what in the code. [[slnc 400]] Each request is a list of steps, and the interleaving runs them in a written order. [[slnc 500]] The ledger holds the shared state. [[slnc 500]] Three withdrawal classes show check then act, a lock, and a compare and set. [[slnc 500]] The bank class keeps idempotency keys and the transfer rules. [[slnc 300]] And the order and checkout classes keep the states and the prices."""

[[scene]]
key = "11-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Gift cards redeemed many times at once", "Idempotency-Key headers in payment APIs", "SELECT ... FOR UPDATE and version columns", "Orders with states and allowed steps"]
narration = """You have probably met this already. [[slnc 400]] Gift cards and coupons redeemed many times, by sending the same request in parallel. [[slnc 500]] Payment providers that ask for an idempotency key header. [[slnc 500]] Database code that selects a row for update, or keeps a version column. [[slnc 500]] And order systems with states, and rules about which step may follow which."""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Make every check and its action one step", "Give retried requests an idempotency key", "Enforce business rules on the server", "Take locks in one fixed order", "With many servers, let the database decide"]
narration = """So, how do you use it? [[slnc 400]] Make every check and the action it protects one step. [[slnc 500]] Give every request that may be retried an idempotency key. [[slnc 500]] Enforce the business rules on the server, with explicit states for workflows. [[slnc 500]] Take locks in one fixed order. [[slnc 500]] And with more than one server, let the database provide the guarantee."""

[[scene]]
key = "13-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Change the order of steps", "and find every order that overdraws."]
narration = """That's race conditions and business logic. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] A check and its action must be one step, a retry must run once, and the server keeps its own rules. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine, with nothing installed except a Java development kit. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Change the order of steps in the first demo, and find every order that overdraws. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
An online bank's withdrawals and transfers and an online store's coupons, checkout and order workflow, under requests that arrive together, arrive again, and break the rules. It covers one service process; the database-level
guarantees for many servers are the -with-postgres version. It does not cover authentication or input parsing, covered by earlier projects.
"""
assets = [
    "Account balances and the money paid out.",
    "Single-use coupons and the discounts given.",
    "Orders, their states and refunds.",
    "Idempotency keys and their stored answers.",
]
actors = [
    "Customers, whose apps retry when a reply is lost.",
    "An attacker who sends the same request many times in parallel, or with crafted values.",
    "Operators who run more than one server.",
]
boundaries = [
    "Client to server: amounts, totals, coupons and steps arrive from outside and must be checked against the server's own rules.",
    "Request to shared state: every check and action on shared state is a place where requests can overlap.",
]
assumptions = [
    "One service process in the plain version; the model's locks are the process's locks.",
    "Clients choose a new idempotency key for each new operation, and reuse it only for retries.",
    "In the demo, concurrency is modelled with a written order of steps; the real-thread tests force the bad order.",
]
out_of_scope = [
    "Database isolation levels and row locks: the -with-postgres version.",
    "Distributed locks across services.",
    "Authentication and input validation: the earlier projects.",
]
tests = [
    "`InterleavingTest` runs every order of two requests: check-then-act overdraws in some, the lock and compare-and-set in none; coupons, deadlock and fixed lock order.",
    "`RealThreadsTest` forces the bad order with a barrier on real threads, and checks the lock, compare-and-set and idempotency key under load fifty times.",
    "`RulesTest` checks the transfer rules, idempotency answers, the order state machine and checkout pricing.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next project, secrets-in-errors-and-logs, looks at what leaks when things go wrong, and the -with-postgres version moves these guarantees into the database.
"""

[[threat]]
id = "T1"
stride = "T"
threat = "Two requests both pass a balance or coupon check before either writes, and spend the same money or coupon twice"
where = "`NaiveWithdrawal`, `CouponRedemption`"
control = "The check and the write as one step: a lock, a compare-and-set, or a claim in one step"
residual = "A lock in one process does not protect state shared by many servers"

[[threat]]
id = "T2"
stride = "T"
threat = "A retried request moves money again"
where = "`Bank.transfer`"
control = "An idempotency key claimed in one step, returning the first answer to every copy"
residual = "Keys must be stored long enough to cover retries, and clients must send them"

[[threat]]
id = "T3"
stride = "T"
threat = "A negative amount, a transfer to oneself or an overdraft is accepted"
where = "`Bank` rules"
control = "Server-side rules for every transfer"
residual = "Rules nobody wrote down are not enforced; new features need new rules"

[[threat]]
id = "T4"
stride = "T"
threat = "The client's total or stacked coupons set the price"
where = "`Checkout`"
control = "Prices from the catalogue, the client's total ignored, one coupon per order"
residual = "Promotions with complex rules need their own tests"

[[threat]]
id = "T5"
stride = "E"
threat = "Workflow steps are skipped or repeated: shipped before payment, refunded twice"
where = "`Order`"
control = "A state machine that allows each step only from the right states"
residual = "States must be checked and changed in one step too, or a race returns"

[[threat]]
id = "T6"
stride = "D"
threat = "Locks taken in different orders deadlock, and requests hang"
where = "`LockingTransfer`"
control = "Every lock taken in one fixed order"
residual = "Locks still cost throughput, and timeouts are needed for anything that waits"
