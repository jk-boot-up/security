[[act]]
title = "Sending the same request twice"
summary = "Without a key, a retried rent payment of 300 leaves ana with 400 and ben with 600; with the idempotency key rent-october, the second send returns the first answer and ana keeps 700, the same key with 900 is refused, and a new key rent-november is a new payment."
detail = """
The input: ana pays ben 300 rent, a transfer from ANA-1 to BEN-2, with balances ana 1000 and ben 0. The reply is lost, so her app sends the same request again.
Without a key, send 1 moves 300 (ana 700, ben 300) and send 2 moves 300 again (ana 400, ben 600): paid twice. With the idempotency key rent-october, chosen by the app for this one payment, send 1 moves 300 and send 2 returns "already done: moved 300", so ana still has 700. The same key with an amount of 900 is refused, because a key names one request; a new key, rent-november, is a new payment and ana has 400.
How the bank reads a key: a new key is claimed in one step, the money moves and the answer is kept; a repeated request gets the kept answer and nothing moves; a changed request is refused; and when two copies arrive at once, only one claim succeeds.
"""
figure = "idempotency"
figure_title = "A payment sent twice, without and with a key"
figure_speech = """
Third demo: the same request, sent twice. [[slnc 400]] At the top, the input. [[slnc 300]] Ana pays ben three hundred rent. [[slnc 300]] The bank moves the money, but the reply is lost on the way back. [[slnc 300]] Her app cannot tell, so it sends the same request again. [[slnc 700]]
On the left, before the fix: no key. [[slnc 300]] The bank sees two requests, and moves three hundred twice. [[slnc 300]] Ana ends with four hundred instead of seven hundred. [[slnc 700]]
On the right, after the fix. [[slnc 300]] The app picks a key for this one payment, rent october, and sends it with every copy. [[slnc 300]] The first send moves the money. [[slnc 300]] The second finds the key, and gets the first answer back. [[slnc 300]] Nothing moves twice. [[slnc 300]] The same key with a different amount is refused, and a new key is a new payment. [[slnc 700]]
At the bottom, how the bank reads a key. [[slnc 300]] The key is claimed in one step, before any money moves, so two copies racing each other cannot both run.
"""
speech = """
The input: a transfer of three hundred, from ana to ben. [[slnc 300]] The reply is lost, and the app sends it again. [[slnc 400]] Before the fix, with no key, the second send moves the money again. [[slnc 300]] Ana has four hundred, and ben six hundred. [[slnc 300]] Paid twice.
