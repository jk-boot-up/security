tagline = "Correct one at a time is not correct at the same time"
bold = "A check and the action it protects must happen as one step, a retried request must not run twice, and the server must keep its own rules about amounts, coupons and order states, because attackers send requests together, again and out of order."
domain = "an online bank"
domain_note = ""
