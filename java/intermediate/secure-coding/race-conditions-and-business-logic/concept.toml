[[scene]]
key = "01-poster"
kind = "poster"
title = "Race Conditions and Business Logic"
narration = """Hello, and welcome. [[slnc 400]] This video explains race conditions and business logic flaws, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A race condition happens when the result depends on the order in which two things run. [[slnc 300]] A business logic flaw is a rule the server forgot to keep. [[slnc 300]] The O W A S P top ten, from the open worldwide application security project, lists both under insecure design. [[slnc 600]] Think of two cashiers at two counters. [[slnc 300]] A customer with one hundred asks both for eighty, at the same moment. [[slnc 300]] Each cashier looks, sees one hundred, and pays. [[slnc 300]] Neither was wrong to look. [[slnc 300]] Together, they paid one hundred and sixty. [[slnc 700]] In this video, the domain is an online bank and store. [[slnc 500]] By the end, you will see how two requests slip through one check. [[slnc 300]] How to make the check and the action one step. [[slnc 300]] How to stop a retried payment from paying twice. [[slnc 300]] And which rules the server must keep for itself."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["A bank and a store serve many requests at once.", "", "Customers double-click.", "Apps retry when a reply is lost.", "Attackers send the same request", "many times, in parallel, on purpose.", "", "The demo writes down the order of the steps,", "so every run prints the same result."]
narration = """Here is the scenario. [[slnc 400]] An online bank and store serve many requests at once, from many devices. [[slnc 500]] Customers double click. [[slnc 300]] Apps retry when a reply is lost. [[slnc 300]] And attackers send the same request many times, in parallel, on purpose. [[slnc 500]] Real thread timing changes from run to run. [[slnc 300]] So the demo splits each request into its steps, and writes down the order in which they run. [[slnc 300]] Every run prints the same result."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["Race condition: the order decides the result", "Check, then act: a gap between the two", "Lock: one request at a time", "Compare-and-set: write only if unchanged", "Idempotency key: one request, run once", "Deadlock: each waits for the other"]
narration = """Before the demos, the words. [[slnc 500]] A race condition is when the order of two things decides the result. [[slnc 500]] Check, then act, leaves a gap between the check and the action. [[slnc 300]] Its other name is T O C T O U: time of check to time of use. [[slnc 500]] A lock lets one request at a time into a piece of code. [[slnc 500]] A compare and set writes a value only if it has not changed since it was read. [[slnc 500]] An idempotency key makes one request run once, however often it is sent. [[slnc 500]] And a deadlock is two requests, each waiting for the other."""

[[scene]]
key = "04-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "05-the-gap"
kind = "figure"
title = "Two withdrawals, one gap"
body = "the_gap"
narration = """Let's see the core idea on one example. [[slnc 400]] Ana's account holds one hundred. [[slnc 300]] Two withdrawals of eighty arrive at the same moment: A from her phone, and B from her laptop. [[slnc 300]] Each one has three steps: read the balance, check that it covers eighty, and write the new balance. [[slnc 700]]
Time runs from left to right. [[slnc 300]] A reads one hundred. [[slnc 300]] Then B reads one hundred. [[slnc 300]] A checks: one hundred covers eighty, yes. [[slnc 300]] B checks the same number, and also says yes. [[slnc 300]] Inside the red box is the gap: between A's check and A's write, B has already read and checked. [[slnc 700]]
Now both write. [[slnc 300]] A writes twenty, and pays out eighty. [[slnc 300]] B writes twenty, and pays out eighty. [[slnc 300]] The bottom row adds up the money: one hundred and sixty, from an account that held one hundred. [[slnc 300]] Every step was correct on its own. [[slnc 300]] Only the order was wrong."""

[[scene]]
key = "06-acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "07-ladder"
kind = "bullets"
title = "Ways to Close the Gap"
body = ["A lock around check and write: one process", "Compare-and-set: no lock, a retry", "One conditional update: the database decides", "Row locks and versions: many servers"]
narration = """Let's put the ways to close the gap side by side. [[slnc 400]] A lock around the check and the write works inside one process. [[slnc 500]] A compare and set needs no lock, and retries when it loses. [[slnc 500]] A single conditional update lets the database check and write in one step. [[slnc 500]] And with many servers, row locks and version checks in the database are the guarantee."""

[[scene]]
key = "08-costs"
kind = "bullets"
title = "What It Costs"
body = ["Locks make requests take turns", "Locks in different orders deadlock", "A lock in one process does not stop another", "Idempotency keys need storage and expiry", "Business rules must be written down"]
narration = """Nothing is free. [[slnc 400]] Here is what it costs. [[slnc 500]] Locks make requests to the same account take turns, which costs time on a busy account. [[slnc 500]] Locks taken in different orders can deadlock. [[slnc 500]] A lock in one process does not stop another process. [[slnc 500]] Idempotency keys must be stored long enough to cover retries. [[slnc 500]] And a business rule that nobody wrote down is a rule that nobody enforces."""

