[docs.session]
objectives = [
    "explain check-then-act and why testing one request at a time misses it",
    "make a check and its action one step with a lock or a compare-and-set",
    "explain idempotency keys and when a client needs them",
    "list the business rules a server must enforce whatever the client sends",
    "explain deadlock and why a lock in one process is not enough with many servers",
]
walkthrough = """
Start with the two cashiers. Run act one and ask the group to find the step where it went wrong; there is none, only the order. In act two, ask why the compare-and-set needs a retry. In act three, ask who chooses the key,
and what happens if the server chooses it instead. In act four, ask which rules were never written down. In act five, ask how the two servers could share one lock.
"""
exercises = [
    "Change the order string in act one and find every order that overdraws; compare with the count the test computes.",
    "Add a daily withdrawal limit, and check that it holds in every order with the lock and with compare-and-set.",
    "Give idempotency keys an expiry on a simulated clock, and decide what a retry after expiry should do.",
    "Add a three-account transfer and show that one fixed lock order still prevents deadlock.",
]

[docs.explained]
sentence = """
A race condition lets two requests both pass a check before either acts, so the check and the action must be one step; retries need idempotency keys so they run once; and the server must enforce its own business rules
and order states, because clients send requests together, again and out of order.
"""
verdict = """
Find every check-then-act on money, stock, coupons and counts, and make it one step: a lock, a compare-and-set, or better a single conditional database update. Give every request that may be retried an idempotency key.
Write the business rules down and enforce them on the server, with explicit states for workflows. Take locks in one fixed order, and with more than one server, let the database provide the guarantee.
"""
recognise = [
    "`if (balance >= amount) { ... balance = balance - amount; }` in a request handler.",
    "An `Idempotency-Key` header in a payment API.",
    "`UPDATE account SET balance = balance - ? WHERE id = ? AND balance >= ?` as a one-step check and write.",
    "Order tables with a state column and allowed transitions.",
]

[spec]
purpose = """
Teach race conditions and business-logic flaws by showing two withdrawals and two coupon uses overlapping in a written order, fixing them with a lock and a compare-and-set, making retries idempotent, and enforcing business
rules and an order state machine on the server.
"""
nongoals = [
    "Database locking and isolation levels: the -with-postgres version.",
    "Distributed locks and consensus.",
    "Load testing.",
]
problem = """
Developers test one request at a time, so overlapping requests and retries find the flaws in production.
"""
roles = [["Requests as steps", "`Steps`"], ["Running steps in a written order", "`Interleaving`"], ["Shared state of the model", "`Ledger`, `CouponBook`"], ["Withdrawals", "`NaiveWithdrawal`, `LockedWithdrawal`, `CasWithdrawal`"], ["Coupons", "`CouponRedemption`"], ["Lock order", "`LockingTransfer`"], ["Real threads", "`RealAccounts`"], ["Idempotency and rules", "`Bank`"], ["States", "`Order`"], ["Prices", "`Checkout`"], ["Entry point", "`RacesDemo`"]]
requirements = [
    "Some order of steps makes check-then-act overdraw, and one request after another does not.",
    "With a lock or a compare-and-set, no order of steps overdraws or loses money.",
    "A coupon claimed in one step is used once in every order.",
    "The same idempotency key moves money once, even from many threads at once, and the same key with a different transfer is refused.",
    "The bank refuses non-positive amounts, self-transfers, unknown accounts and overdrafts; checkout prices from the catalogue with one coupon; an order is refunded at most once and only after payment.",
