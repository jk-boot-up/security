[[act]]
title = "Making the check and the write one step"
summary = "With a lock on ANA-1, B waits while A reads, checks and writes, then reads 20 and is refused; with a compare-and-set, B's write of 100 to 20 fails because the balance is now 20, so B reads again and is refused; a coupon claimed in one step is used once; in every order, the lock (0 of 70) and the compare-and-set (0 of 20) never pay out more than 100."
detail = """
With a lock on the account around read, check and write, in the order ABABABAB: A takes the lock ANA-1, and B waits three times while A reads 100, checks, writes 20 and releases the lock. Then B takes the lock, reads 20, checks that 20 covers 80: no, and refuses. Paid out 80, balance 100 - 80 = 20.
Without a lock, a compare-and-set writes only if the balance is still the value that was read. In the order ABABAB both read 100 and pass the check; A sets 100 to 20; B tries to set 100 to 20, but the balance is now 20, and 100 = 20 is false, so nothing is written and B reads again, sees 20 and is refused.
A coupon claimed in one step (check and mark together) before the discount gives 20 once. Run in every order: check, then act pays out more than 100 in 18 of 20 orders, the lock in 0 of 70, the compare-and-set in 0 of 20.
"""
figure = "one_step"
figure_title = "A lock and a compare-and-set, step by step"
figure_speech = """
Second demo: making the check and the write one step. [[slnc 400]] On the left, a lock on ana's account. [[slnc 300]] A takes the lock first. [[slnc 300]] Each time B tries to start, it finds the lock taken, and waits. [[slnc 300]] Those are the amber lines. [[slnc 300]] A reads one hundred, checks, writes twenty, and releases the lock. [[slnc 300]] Only then does B read. [[slnc 300]] It sees twenty, and refuses. [[slnc 700]]
On the right, a compare and set, with no lock. [[slnc 300]] Both requests read one hundred, and both pass the check. [[slnc 300]] A writes: set one hundred to twenty, and it works. [[slnc 300]] B tries the same write. [[slnc 300]] But the write only happens if the balance is still the one hundred that B read. [[slnc 300]] It is now twenty, so nothing is written, and B starts again. [[slnc 300]] This time it reads twenty, and refuses. [[slnc 700]]
At the bottom, every order. [[slnc 300]] Check then act pays too much in eighteen of twenty. [[slnc 300]] The lock and the compare and set, in none.
"""
