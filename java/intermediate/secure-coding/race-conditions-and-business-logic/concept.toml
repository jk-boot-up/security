[[act]]
title = "Making the check and the write one step"
summary = "With a lock, B waits while A reads, checks and writes, then sees 20 and is refused; with a compare-and-set, B's write fails because the balance changed, and B starts again and is refused; a coupon claimed in one step is used once."
detail = """
With a lock on the account around read, check and write, A takes the lock, and B waits while A reads 100, checks, writes 20 and releases the lock. Then B takes the lock, reads 20, and refuses.
Paid out 80, balance 20. Without a lock, a compare-and-set writes only if the balance is still what was read: A sets 100 to 20, B tries to set 100 to 20 and fails because the balance changed,
reads again, sees 20 and refuses. A coupon claimed in one step before the discount is used once. The rule that must always hold, the balance never below zero and each coupon used once, now holds
in every order of steps.
"""
speech = """
Second demo: making the check and the write one step. [[slnc 400]] First, with a lock on the account. [[slnc 600]]
A takes the lock. [[slnc 300]] B waits, while A reads, checks, and writes. [[slnc 300]] Then B takes the lock, sees twenty, and refuses. [[slnc 600]]
Second, without a lock, with a compare and set. [[slnc 300]] The write succeeds only if the balance is still the value that was read. [[slnc 300]] B's write fails, because A changed the balance. [[slnc 300]] B reads again, sees twenty, and refuses. [[slnc 600]]
A coupon claimed in one step is used once. [[slnc 300]] The rule now holds, in every order of steps.
"""
rows = { atomic = "active ok" }
console = [
    ["with a lock: A takes the lock ANA-1, B waits for the lock ANA-1 three times", "muted"],
