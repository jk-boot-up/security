[threatmodel]
scope = """
A shop's checkout responses and log lines. It covers what goes into error pages and logs and what a customer can cause to be written.
It does not cover who may access the log service, or how the log is shipped and stored.
"""
assets = [
    "Card numbers, CVVs, session tokens and database credentials.",
    "The integrity of the audit trail.",
]
actors = [
    "A customer, honest or not.",
    "Anyone with access to the logs: staff, vendors, a contractor, an attacker with a stolen log-service account.",
]
boundaries = [
    "The server to the customer: the response.",
    "The application to the log service: the line, and then every reader and backup.",
]
assumptions = [
    "Logs are readable by more people than the database is.",
    "Developers add log lines without thinking about every field.",
]
out_of_scope = [
    "Log shipping, retention and access control.",
    "Detection rules over logs: detecting-attacks.",
]
tests = [
    "`LeaksTest` checks the naive and fixed checkout and loggers with canary secrets, one-line events, line length, the Secret wrapper, Luhn card detection and the redaction patterns, and states that unnamed secrets are not found.",
    "`TeachingStepsTest` checks the Luhn steps, the page reader, the canary search, the rule names and the line wrapping the demo prints.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next project, fuzzing, finds the inputs that make parsers fail in the first place.
"""

[[threat]]
id = "T1"
stride = "I"
threat = "An error response gives the customer hosts, users, passwords and code structure"
where = "`Checkout` naive error path"
control = "A generic answer with a correlation reference"
residual = "Support needs the log to resolve the reference"

[[threat]]
id = "T2"
stride = "I"
threat = "Cards, CVVs, tokens and passwords are kept in the log and read by many people"
where = "`NaiveLogger`, `Checkout.pay`"
control = "Do not log secrets; `Secret` wrapper; redaction at the logging edge; short retention"
residual = "Secrets with no name and no shape are not recognised"

[[threat]]
id = "T3"
stride = "T"
threat = "A customer forges log lines with line breaks and control characters"
where = "`NaiveLogger.info`"
control = "Escape control characters so each event is one line; cut long lines"
residual = "Structured (JSON) logging is safer still"

[poster]
headline = [["SECRETS IN ERRORS", "text"], ["AND LOGS", "accent"]]
taglines = [["A log is a second database that nobody protects", "gold"]]
before = { code = "?user=app&password=s3cr3t-db-password", note = "What the error page shows", tag = "BEFORE" }
after = { code = "Quote reference ref-0001 to support.", note = "A reference, and the detail in the log", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "Secrets in Errors and Logs"
narration = "Hello, and welcome. [[slnc 400]] This video explains how secrets leak through error pages and logs, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] When something fails, error pages and log files collect whatever the code was holding. [[slnc 300]] A stack trace can show a customer the database password. [[slnc 300]] A log can keep card numbers and tokens, for everyone who can search it, for years. [[slnc 300]] A log is a second database that nobody protects. [[slnc 600]] Think of a shop that writes every customer's card number in the staff diary, and leaves the diary on the counter. [[slnc 600]] Our example is an online shop's checkout."

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online shop's checkout fails,", "because the database is down.", "", "The demo shows the page the customer gets,", "and the log lines the team keeps:", "first in a naive version, then a fixed one.", "", "Every value is fake: a test card number,", "a made-up password and token."]
narration = "Here is the scenario. [[slnc 400]] An online shop's checkout fails, because its database is down. [[slnc 500]] The demo shows the page the customer gets, and the log lines the team keeps, first in a naive version and then in a fixed one. [[slnc 500]] Every value is fake: the card is a standard test number, and the password and the token are made up for the demo."

[[scene]]
key = "02-words"
kind = "bullets"
title = "The Words"
body = ["Stack trace: the exception and the methods it passed", "Log: lines the code writes for the team to read later", "Log injection: a line break that forges a log line", "Redaction: masking a secret in text that was written", "Canary: a known fake secret, searched for by a test", "Reference: a number that links a page to a log line"]
narration = """Before the demos, the words. [[slnc 500]] A stack trace is an exception, with the list of methods it passed through. [[slnc 500]] A log is the lines the code writes, for the team to read later. [[slnc 500]] Log injection is text with a line break in it, which forges an extra log line. [[slnc 500]] Redaction masks a secret in text that was already written. [[slnc 500]] A canary is a known fake secret, sent through the flow, so a test can search for it. [[slnc 500]] And a reference is a number that links what the customer saw to a line in the log."""

[[scene]]
key = "02-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "02-one-failure"
kind = "figure"
title = "One failure, two readers"
body = "one_failure"
narration = """Let's see the core idea on one example: one failed payment. [[slnc 400]] At the top, the input: the exception the database driver throws. [[slnc 300]] Its message holds the database address, and the password, in red. [[slnc 700]]
That one message can go to two places, with very different readers. [[slnc 300]] The page goes to the customer, and to anyone who causes an error on purpose. [[slnc 300]] The log goes to support, to vendors, and into backups that are kept for years. [[slnc 700]]
On the left, before the fix: the password is on the page, and in the log. [[slnc 500]] On the right, after the fix. [[slnc 300]] The page gets one sentence and a reference number. [[slnc 300]] The log gets the detail, under the same reference, with the password masked. [[slnc 300]] The search at the bottom confirms it: no password in the page, and none in the log."""

[[scene]]
key = "03-acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "04-costs"
kind = "bullets"
title = "What It Costs"
body = ["Less detail on the page makes support harder", "Redaction costs time on every line", "Patterns miss some secrets, and mask some non-secrets", "Logs kept for years are a risk of their own"]
narration = "Nothing is free. [[slnc 400]] Here is what it costs. [[slnc 500]] Less detail on the error page makes support harder, so the reference number has to work. [[slnc 500]] Redaction costs time on every log line. [[slnc 500]] Patterns miss some secrets, and mask some values that were not secret. [[slnc 300]] Structured logs, with named fields, make it easier. [[slnc 500]] And every log kept for years is a risk of its own, so keep logs only as long as you need them."

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["A stack trace on a shop's error page", "A debug page left on in production", "A card number or a token in a support ticket", "CWE-209, CWE-532 or CWE-117 in a report"]
narration = "You have probably met this already. [[slnc 400]] A stack trace on a shop's error page is the first demo. [[slnc 500]] A framework's debug page left on in production shows even more. [[slnc 500]] A card number, or a token, pasted into a support ticket from the logs, is the second demo. [[slnc 500]] And C W E 209, 532, or 117, in a security report, are these three leaks by their numbers."

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "How To Use It"
body = ["A generic answer and a reference for the customer", "The detail in the log, under the same reference", "Never log bodies, passwords, cards or tokens", "Wrap secrets in a type that cannot print", "One event per line; escape line breaks", "Redact as the last defence; test with canaries"]
narration = "So, how do you use it? [[slnc 400]] Give the customer a generic answer, with a reference number. [[slnc 300]] Put the detail in the log, under the same reference. [[slnc 500]] Never log request bodies, passwords, card data, or tokens. [[slnc 300]] Wrap secrets in a type that cannot print. [[slnc 500]] Keep every event on one line, and escape line breaks. [[slnc 500]] Redact as the last line of defence. [[slnc 300]] And add canary tests: send a known fake secret through the flow, and fail the build if it shows up anywhere."

[[scene]]
key = "12-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Log a customer's e-mail address", "with all but its first letter and domain masked."]
narration = "That's secrets in errors and logs. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Errors and logs outlive the request, so give the customer a reference and no detail, keep secrets out of messages with types and not patterns, keep each event on one line, and redact as a last defence. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a customer's e-mail address to the log, and mask all but its first letter and its domain. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] Everything is plain Java, with no logging library, so every step is visible. [[slnc 300]] Here are the classes that matter."""

[[class]]
name = "Checkout"
what = "the shop's checkout, in a naive and a fixed version"
[[class.part]]
title = "the error path"
code = '''
if (safe) {
    String ref = String.format("ref-%04d", ++references);
    log.error("checkout failed [" + ref + "]", e);
    return new Response(500,
            "Something went wrong. Quote reference " + ref + " to support.");
}
log.error("checkout failed", e);
return new Response(500, describe(e));
'''
speech = """When saving the order fails, the fixed version makes a new reference, logs the failure under it, and answers with one sentence. [[slnc 300]] The naive version puts the exception itself on the page."""

[[class]]
name = "Secret"
what = "a value that never prints"
[[class.part]]
title = "toString is always redacted"
code = '''
public String reveal() {
    return value;
}
...
@Override
public String toString() {
    return "[REDACTED]";
}
'''
speech = """A Secret's text is always redacted, so putting it in a log message by mistake leaks nothing. [[slnc 300]] Code that needs the value calls reveal, in one place that is easy to search for and review."""

[[class]]
name = "SafeLogger"
what = "one line per event, redacted and cut"
[[class.part]]
title = "escape, redact, cut"
code = '''
if (c == '\n') {
    b.append("\\n");
...
String line = redactor.redact(b.toString());
return line.length() > MAX_LINE
        ? line.substring(0, MAX_LINE) + "...[cut]" : line;
'''
speech = """Every control character becomes a visible escape, so a line break becomes backslash n, and one event stays one line. [[slnc 300]] Then the line is redacted, and cut at three hundred characters."""

[[class]]
name = "Redactor"
what = "masks secrets by name and by shape"
[[class.part]]
title = "named rules, run in order"
code = '''
new Rule("password in a URL",
        t -> URL_PASSWORD.matcher(t).replaceAll("$1[REDACTED]$3")),
...
new Rule("card, Luhn passes", Redactor::maskCards));
...
for (Rule rule : RULES) {
    out = rule.apply().apply(out);
}
'''
speech = """The redactor is a list of named rules, each a pattern and a replacement, run one after the other. [[slnc 300]] The names are what the demo prints as the rule that masked a text."""

[[class]]
name = "Luhn"
what = "the check digit that card numbers carry"
[[class.part]]
title = "double every second digit"
code = '''
if (alternate) {
    d *= 2;
    if (d > 9) {
        d -= 9;
    }
}
...
return sum(digits) % 10 == 0;
'''
speech = """From the right, every second digit is doubled, and a result over nine loses nine. [[slnc 300]] A card number's sum ends in zero, so a long number that fails the check is left alone."""

[[class]]
name = "Canaries"
what = "known fake secrets, searched for by a test"
[[class.part]]
title = "a leak is a match"
code = '''
public boolean foundIn(String name, String text) {
    return text.contains(secrets.get(name));
}
'''
speech = """A canary search is just a contains. [[slnc 300]] The tests send the fake card, C V V, token and password through the checkout, and fail if any of them shows up in the page or the log."""

