[[act]]
title = "Redaction: what it finds and what it misses"
summary = "Seven texts go through the redactor: a Luhn-valid card, key-named password, api_key and authorization values and a URL password are masked; an order number that fails the Luhn check (sum 31) is rightly left; 'the key is hunter2' has no name and no shape and is missed. A Secret prints as [REDACTED]."
detail = """
The input is seven texts, a to g. The result: a, the card 4111-1111-1111-1111, becomes [CARD ****1111]; b, the order number 4111111111111112, is left; c, d and e are masked by key name (password, api_key, authorization); f, a URL with a password, is masked; g, "the key is hunter2", is left as it was.
How the Luhn check is made: from the right, every second digit is doubled (9 is taken off a result over 9) and all are added. For 4111111111111111 the sum is 30, which ends in 0, so it is a card; for 4111111111111112 the sum is 31, so it is not.
A Secret in a message prints as token [REDACTED]; only reveal() gives the value.
"""
figure = "luhn_and_rules"
figure_title = "The Luhn check, and what each rule did"
figure_speech = """
Fourth demo: redaction, the last line of defence. [[slnc 400]] At the top, how the redactor tells a card number from any other long number: the Luhn check. [[slnc 300]] Take the digits. [[slnc 300]] From the right, double every second one, in amber; a result over nine loses nine. [[slnc 300]] Add them all. [[slnc 300]] For the test card the sum is thirty, which ends in zero, so it is a card. [[slnc 300]] For the order number, only the last digit differs, and the sum is thirty one: not a card. [[slnc 700]]
At the bottom, seven texts before and after redaction, and the rule that masked each one. [[slnc 300]] The card, and values named password, A P I key, and authorization, are masked. [[slnc 300]] So is a password inside a U R L. [[slnc 500]]
But look at g. [[slnc 300]] The key is hunter two. [[slnc 300]] It has no name the redactor knows, and no shape, so it passes through. [[slnc 300]] That is why redaction is the last defence, not the first.
"""
speech = """
Before redaction: seven texts, a to g. [[slnc 300]] A card with dashes, an order number, a password pair, a J S O N key, a bearer token, a U R L with a password, and a sentence.
[[page]]
After redaction. [[slnc 300]] The card shows only its last four digits. [[slnc 300]] The order number is unchanged. [[slnc 300]] The password, the key, the token and the U R L password are masked. [[slnc 300]] And g is unchanged too.
[[page]]
The rule that masked each one. [[slnc 300]] Card, by the Luhn check. [[slnc 300]] Key name, three times. [[slnc 300]] Password in a U R L. [[slnc 300]] And none, twice: b is right to stay, and g is a secret the redactor missed.
[[page]]
How the Luhn check is made, for a and b: the digits, every second one doubled, and the sum. [[slnc 300]] Thirty is a card, thirty one is not. [[slnc 500]] And a Secret in a message prints as redacted; only reveal gives the value.
"""
rows = { redact = "active ok" }
console = [
    ["BEFORE REDACTION:", "code"],
    ["  a  charge 4111-1111-1111-1111 for order 1042", "muted"],
    ["  b  order 4111111111111112 shipped", "muted"],
