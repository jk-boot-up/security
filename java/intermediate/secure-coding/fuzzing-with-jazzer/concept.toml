# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "fuzzing-with-jazzer"
level = "intermediate"
module = "secure-coding"
title = "Fuzzing with Jazzer"
short_title = "Fuzzing with Jazzer"
package = "jazzerfuzz"
main_class = "JazzerFuzzDemo"
tagline = "Give the machine your example inputs and a fuzz target of three lines; it adds its own coverage counters, mutates the examples and reports the inputs nobody thought of"
bold = "Jazzer 0.30 fuzzes the store's parsers from a fuzz target of three lines and a handful of seed inputs: it instruments the bytecode itself, finds three crashes in the order line parser and a gift-message bug in the cart parser, saves each input, and its sanitizers report a regular expression injection that is not a crash; but it cannot guess a product code with no seeds, it stops at a default input length, it does not know a business rule, and every saved input is only worth something once it is made smallest and kept as a regression test."
domain = "an online store"
domain_note = ""
youtube_description = "The real Jazzer 0.30 (libFuzzer for the JVM) fuzzing an online store's order line parser and cart parser: a fuzz target of three lines, seed inputs from the example tests, a fixed random seed, three distinct crashes in the careless order line parser, a gift-message crash in the cart parser that needs a seed with a note field, coverage points with and without seeds, each crashing input made smallest and replayed as a regression test with the Jazzer JUnit integration, a sanitizer that reports a regular expression injection in a search box, and what a fuzzer does not find."
thumb_lines = ["FUZZING WITH", "JAZZER"]
thumb_code = "@FuzzTest void parse(FuzzedDataProvider d)"
youtube_title = "Fuzzing with Jazzer: Seeds, Crashes, Sanitizers and Regression Tests for Java Parsers (SSDF PW.8)"
youtube_tags = ["jazzer", "fuzzing", "libfuzzer", "java fuzzing", "coverage guided fuzzing", "sanitizers", "regression tests", "ssdf", "pw.8", "java"]

[readme]
intro = """
The plain [fuzzing](../fuzzing) project writes a mutation fuzzer and a coverage counter by hand and ends with "coverage-guided tools such as Jazzer add the branch counters to the bytecode by themselves: the -with-jazzer version". This is that version: the real **Jazzer 0.30**, started as a program by the demo on the same two parsers, with a fixed random seed. It needs no server, no Docker and nothing beyond Gradle (the Jazzer jars include the native part for macOS and Linux); the demo takes about half a minute, and the real-Jazzer tests are tagged `integration`: `./gradlew integrationTest`.

What it shows:
- **The example tests pass.** Six of six, and a line with only a product code still crashes the parser.
- **The real Jazzer.** A fuzz target of three lines (`Parsers.orderLineCareless(data.consumeRemainingAsAsciiString())`), the two example lines as seeds, random seed 7 and 300000 runs: **three distinct findings** (two `ArrayIndexOutOfBoundsException` at different lines, and a `Money` that went negative through an int overflow), each with its input saved.
- **Guided by coverage, and by the seeds.** With no seeds it reaches 7 coverage points and finds nothing: it cannot guess a product code. The cart parser's gift-message bug is found only when a seed has a `note` field.
- **From crash to fix.** Each saved input is made smallest (`AAA-0000`, `AAA-0000,0`, `AAA-0000,4000,4000000`) and replayed as a regression test through the **Jazzer JUnit** integration, in milliseconds; the fixed parsers run clean under the same fuzzer.
- **Beyond crashes.** A **sanitizer** reports `Regular Expression Injection` in a search box that hands the customer's words to the pattern engine. A cart with a quantity of -5 is no crash, so no report; the nesting crash needs more than the default input length.

**Maps to:** NIST SSDF PW.8 (test executable code) · OWASP Top 10 (2025) A05 Injection (for the sanitizer) · CWE-20, CWE-248, CWE-674 (uncontrolled recursion), CWE-190 (integer overflow).
"""
analogy = """
A tireless clerk who takes the three forms you already have, changes a letter here and a number there, hands thousands of variants to the counter, and writes down every one that makes the counter jam. The clerk does not know what the forms mean, only that a jam is a jam.
"""
scenario = """
An online store parses order lines and carts that come from outside. The demo gives Jazzer the example inputs of the team and watches what comes back.
"""
costs = [
    "**Each parser needs a fuzz target,** a few lines, and someone to keep them working.",
    "**The seeds decide a lot:** a fuzzer with none cannot guess a product code.",
    "**A run is a budget:** a fixed number in the build, longer ones at night.",
    "**Findings must be made smallest, reproduced and fixed,** or they pile up.",
    "**A fuzzer finds crashes and what its sanitizers know,** not wrong decisions.",
]
too_much = """
Code that only moves data between two typed fields has nothing to fuzz. Fuzz what reads bytes or text from outside: parsers, decoders, importers, anything with a format.
"""
met_before = [
    "A `crash-...` file next to a build.",
    "`@FuzzTest` in a JUnit class.",
    "A `corpus` folder in a repository.",
    "A nightly job named `fuzz`.",
]
where = """
This is the tools version of [fuzzing](../fuzzing), in the [secure-coding](..) module. The input checks it exercises are the subject of [input-validation](../input-validation) and its Hibernate Validator version.
"""
twin = """
Jazzer runs for real, in a program of its own with a fixed random seed, so the same findings come out each time. The two parsers are the same as in the plain project, without the hand-written coverage counters. Nothing here is mocked.
"""
test_note = "Most tests run in milliseconds: the saved inputs as regression tests, the minimizer and the reader of Jazzer's report. The tests that start Jazzer are tagged integration (./gradlew integrationTest)."

[[act]]
title = "The example tests pass"
summary = "Six of six example tests pass, and a line with only a product code still crashes the parser."
detail = """
The order line parser passes six of its six example tests. SHO-1042,2,8990 gives a total of 17980 cents, and SHO-1042,two,8990 is refused as invalid. But a line with only a product code, SHO-1042, throws an ArrayIndexOutOfBoundsException: an input nobody wrote a test for. A parser may refuse input; anything else it throws is a bug.
"""
speech = """
First demo: the example tests pass. [[slnc 400]] Six of six. [[slnc 600]]
But a line with only a product code crashes the parser. [[slnc 300]] An input nobody wrote a test for.
"""
rows = { examples = "active wrong" }
console = [
    ["6 of 6 example tests pass", "ok"],
    ["SHO-1042 alone: ArrayIndexOutOfBoundsException", "bad"],
]

[[act]]
title = "The real Jazzer"
summary = "A three-line fuzz target, two seed lines, a fixed random seed and 300000 runs find three distinct bugs."
detail = """
Jazzer 0.30 is started as a program on a fuzz target of three lines, with the two example inputs as seeds, random seed 7 and 300000 runs. It adds branch counters to the parser's bytecode by itself and reports three distinct findings: ArrayIndexOutOfBoundsException in OrderLine.parseCareless at line 24 (second field missing), at line 25 (third field missing), and IllegalArgumentException in Money.<init> (a total that overflowed an int and went negative). Each input is saved in a file.
"""
speech = """
Second demo: the real Jazzer. [[slnc 400]] A fuzz target of three lines, the two example inputs as seeds, and a fixed random seed. [[slnc 600]]
Three distinct bugs come back, each with the line and the input.
"""
rows = { jazzer = "active ok" }
console = [
    ["ArrayIndexOutOfBoundsException in OrderLine.parseCareless (line 24)", "bad"],
    ["ArrayIndexOutOfBoundsException in OrderLine.parseCareless (line 25)", "bad"],
    ["IllegalArgumentException in Money.<init> (line 8)", "bad"],
]

[[act]]
title = "Guided by coverage, and by what you give it"
summary = "With no seeds it reaches 7 coverage points and finds nothing; with the examples, 19 and three bugs; the gift-message bug needs a seed with a note field."
detail = """
With no seed inputs and 300000 runs, Jazzer reaches 7 coverage points and finds nothing: it cannot guess a product code. With the two example lines as seeds it reaches 19 and finds 3. The cart parser, 1000000 runs, with seeds that have no gift note, finds nothing; with one more seed that has a note field it finds the StringIndexOutOfBoundsException in CartParser.giftMessage. The seeds are the examples the team already has; the fuzzer mutates them, keeps what reaches new branches, and spends its runs near the interesting parts.
"""
speech = """
Third demo: guided by coverage, and by what you give it. [[slnc 400]] With no seeds it reaches seven coverage points and finds nothing. [[slnc 600]]
With the example lines it reaches nineteen and finds three bugs. [[slnc 300]] The gift message bug needs a seed with a note field.
"""
rows = { guided = "active ok" }
console = [
    ["no seeds: 7 coverage points, 0 findings", "bad"],
    ["the two example lines as seeds: 19 points, 3 findings", "ok"],
    ["a seed with a note field: the gift-message bug", "ok"],
]

[[act]]
title = "From crash to fix"
summary = "Each saved input is made smallest, kept as a regression test, and the fixed parsers run clean under the same fuzzer."
detail = """
Each saved input is made smallest while it still crashes in the same place: AAA-0000 (a line with one field), AAA-0000,0 (two fields) and AAA-0000,4000,4000000 (a total that overflows an int). The fixed parser refuses each with a reason. Each smallest input is now a regression test that runs on every build, in milliseconds, through the Jazzer JUnit integration. The fixed order parser under the same fuzzer: 0 findings in 300000 runs; the fixed cart parser: 0 in 1000000.
"""
speech = """
Fourth demo: from crash to fix. [[slnc 400]] Each crashing input is made smallest. [[slnc 600]]
It becomes a regression test that runs on every build. [[slnc 300]] The fixed parsers run clean under the same fuzzer.
"""
rows = { fix = "active ok" }
console = [
    ["AAA-0000, AAA-0000,0, AAA-0000,4000,4000000", "ok"],
    ["the fixed parser refuses each, with a reason", "ok"],
    ["fixed order parser: 0 findings in 300000 runs", "ok"],
]

[[act]]
title = "What fuzzing finds besides crashes, and what it does not"
summary = "A sanitizer flags a regular expression injection; a quantity of -5 is no crash; the nesting crash needs a longer input than the default."
detail = """
A search box that hands what the customer typed to the regular expression engine: Jazzer reports Regular Expression Injection in Parsers.searchCareless, a security issue and not a crash; the same box looking for the text as text has 0 findings. A cart with a quantity of -5 is parsed: no crash, so no report; whether -5 is allowed is a business rule. The cart's nesting crash needs more than Jazzer's default input length of 4096 bytes; written by hand, the careless parser overflows the stack and the fixed one refuses nesting deeper than 32. In a build, a fixed budget of runs on every change; longer runs at night.
"""
speech = """
Fifth demo: what fuzzing finds besides crashes, and what it does not. [[slnc 400]] A sanitizer reports a regular expression injection. [[slnc 600]]
A quantity of minus five is no crash, so there is no report. [[slnc 300]] A fuzzer finds crashes, not wrong decisions.
"""
rows = { beyond = "active wrong" }
console = [
    ["Regular Expression Injection in Parsers.searchCareless", "bad"],
    ["quantity -5: parsed, no crash, no report", "bad"],
    ["nesting crash: needs a longer input than the default", "bad"],
]

