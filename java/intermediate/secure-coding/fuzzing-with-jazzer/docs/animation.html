<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fuzzing with Jazzer — Animated Walkthrough</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px;
    background: #0f172a; color: #e2e8f0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    padding-top: calc(24px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  p.sub { color: #94a3b8; margin: 0 0 20px; max-width: 70ch; }
  .wrap { max-width: 1100px; margin: 0 auto; }
  .stage { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  @media (max-width: 760px) { .stage { grid-template-columns: 1fr; } }
  .boxes { display: flex; flex-direction: column; gap: 10px; }
  .row { border: 2px solid #334155; border-radius: 10px; padding: 12px 16px;
         background: #1e293b; transition: all .25s ease; opacity: .55; }
  .row .name { font-weight: 700; font-size: 1rem; }
  .row .job { color: #94a3b8; font-size: .82rem; margin-top: 2px; }
  .row.active { opacity: 1; box-shadow: 0 0 0 2px currentColor inset; }
  .row.wrong { border-color: #f87171; color: #f87171; }
  .row.wrong.active { background: #3f1d24; }
  .row.ok { border-color: #34d399; color: #34d399; }
  .row.ok.active { background: #10261f; }
  .row.amber { border-color: #fbbf24; color: #fbbf24; }
  .row.amber.active { background: #2a2110; }
  .row.dim { opacity: .22; }
  .console { background: #020617; border: 1px solid #334155; border-radius: 10px; padding: 16px;
             font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: .86rem;
             line-height: 1.55; overflow-y: auto; min-height: 320px; white-space: pre-wrap; }
  #console-lines span.ok { color: #34d399; }
  #console-lines span.bad { color: #f87171; }
  #console-lines span.amber { color: #fbbf24; }
  #console-lines span.muted { color: #94a3b8; }
  .narration { background: #1e293b; border: 1px solid #334155; border-radius: 10px;
               padding: 14px 18px; margin-bottom: 16px; min-height: 3.2em; }
  .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  button { background: #334155; color: #e2e8f0; border: 1px solid #475569; border-radius: 8px;
           padding: 10px 18px; font-size: .92rem; cursor: pointer; }
  button:hover { background: #475569; }
  button:disabled { opacity: .45; cursor: default; }
  button#play { background: #7c3aed; border-color: #7c3aed; }
  button#play:hover { background: #8b5cf6; }
  #progress { color: #94a3b8; font-size: .85rem; margin-left: auto; }
  .step-label { font-size: .78rem; text-transform: uppercase; letter-spacing: .04em;
                color: #a78bfa; font-weight: 700; margin-bottom: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Fuzzing with Jazzer — Step by Step</h1>
  <p class="sub">An online store, a parser, and a fuzzer that tries the inputs nobody thought of.</p>

  <div class="narration">
    <div class="step-label" id="step-label">Ready</div>
    <div id="narration">Press Step or Play to begin.</div>
  </div>

  <div class="stage">
    <div class="boxes" id="boxes">
      <div class="row" id="row-examples">
        <div class="name">Examples pass</div>
        <div class="job">6 of 6</div>
      </div>
      <div class="row" id="row-jazzer">
        <div class="name">Jazzer</div>
        <div class="job">3 findings</div>
      </div>
      <div class="row" id="row-guided">
        <div class="name">Seeds</div>
        <div class="job">coverage points</div>
      </div>
      <div class="row" id="row-fix">
        <div class="name">Smallest input</div>
        <div class="job">regression test</div>
      </div>
      <div class="row" id="row-beyond">
        <div class="name">Beyond crashes</div>
        <div class="job">sanitizers, limits</div>
      </div>
    </div>
    <div class="console"><div id="console-lines"></div></div>
  </div>

  <div class="controls">
    <button id="step">Step ▸</button>
    <button id="play">Play ▶</button>
    <button id="reset">Reset ↺</button>
    <span id="progress">0 / 0</span>
  </div>
</div>

<script>
const STEPS = [
 {
  "label": "Act 1 — The example tests pass",
  "narration": "First demo: the example tests pass. Six of six. But a line with only a product code crashes the parser. An input nobody wrote a test for.",
  "rows": {
   "examples": "active wrong"
  },
  "console": [
   [
    "6 of 6 example tests pass",
    "ok"
   ],
   [
    "SHO-1042 alone: ArrayIndexOutOfBoundsException",
    "bad"
   ]
  ]
 },
 {
  "label": "Act 2 — The real Jazzer",
  "narration": "Second demo: the real Jazzer. A fuzz target of three lines, the two example inputs as seeds, and a fixed random seed. Three distinct bugs come back, each with the line and the input.",
  "rows": {
   "jazzer": "active ok"
  },
  "console": [
   [
    "ArrayIndexOutOfBoundsException in OrderLine.parseCareless (line 24)",
    "bad"
   ],
   [
    "ArrayIndexOutOfBoundsException in OrderLine.parseCareless (line 25)",
    "bad"
   ],
   [
    "IllegalArgumentException in Money.<init> (line 8)",
    "bad"
   ]
  ]
 },
 {
  "label": "Act 3 — Guided by coverage, and by what you give it",
  "narration": "Third demo: guided by coverage, and by what you give it. With no seeds it reaches seven coverage points and finds nothing. With the example lines it reaches nineteen and finds three bugs. The gift message bug needs a seed with a note field.",
  "rows": {
   "guided": "active ok"
  },
  "console": [
   [
    "no seeds: 7 coverage points, 0 findings",
    "bad"
   ],
   [
    "the two example lines as seeds: 19 points, 3 findings",
    "ok"
   ],
   [
    "a seed with a note field: the gift-message bug",
    "ok"
   ]
  ]
 },
 {
  "label": "Act 4 — From crash to fix",
  "narration": "Fourth demo: from crash to fix. Each crashing input is made smallest. It becomes a regression test that runs on every build. The fixed parsers run clean under the same fuzzer.",
  "rows": {
   "fix": "active ok"
  },
  "console": [
   [
    "AAA-0000, AAA-0000,0, AAA-0000,4000,4000000",
    "ok"
   ],
   [
    "the fixed parser refuses each, with a reason",
    "ok"
   ],
   [
    "fixed order parser: 0 findings in 300000 runs",
    "ok"
   ]
  ]
 },
 {
  "label": "Act 5 — What fuzzing finds besides crashes, and what it does not",
  "narration": "Fifth demo: what fuzzing finds besides crashes, and what it does not. A sanitizer reports a regular expression injection. A quantity of minus five is no crash, so there is no report. A fuzzer finds crashes, not wrong decisions.",
  "rows": {
   "beyond": "active wrong"
  },
  "console": [
   [
    "Regular Expression Injection in Parsers.searchCareless",
    "bad"
   ],
   [
    "quantity -5: parsed, no crash, no report",
    "bad"
   ],
   [
    "nesting crash: needs a longer input than the default",
    "bad"
   ]
  ]
 }
];
const rowIds = ["examples", "jazzer", "guided", "fix", "beyond"];
const stepLabel = document.getElementById("step-label");
const narrationEl = document.getElementById("narration");
const consoleEl = document.getElementById("console-lines");
const progressEl = document.getElementById("progress");
const playBtn = document.getElementById("play");
let i = -1, timer = null;

function esc(t) { return t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

function render() {
  for (const id of rowIds) document.getElementById("row-" + id).className = "row";
  if (i < 0) {
    stepLabel.textContent = "Ready";
    narrationEl.textContent = "Press Step or Play to begin.";
    consoleEl.innerHTML = "";
    progressEl.textContent = "0 / " + STEPS.length;
    return;
  }
  const s = STEPS[i];
  stepLabel.textContent = s.label;
  narrationEl.textContent = s.narration;
  for (const id of rowIds) {
    const cls = s.rows[id];
    document.getElementById("row-" + id).className = "row " + (cls ? cls : "dim");
  }
  consoleEl.innerHTML = s.console.map(([t, c]) => '<span class="' + c + '">' + esc(t) + "</span>").join("\n");
  progressEl.textContent = (i + 1) + " / " + STEPS.length;
}
function step() { if (i >= STEPS.length - 1) { stopPlay(); return; } i += 1; render(); }
function reset() { stopPlay(); i = -1; render(); }
// While a step's narration is playing, Play waits for it to finish.
function speaking() { return typeof window.vkSpeaking === "function" && window.vkSpeaking(); }
function startPlay() {
  if (timer) return;
  playBtn.textContent = "Pause ❚❚";
  let quiet = 0;
  timer = setInterval(() => {
    if (speaking()) { quiet = 0; return; }
    if (++quiet < 6) return;                     // 6 × 500 ms of reading time
    quiet = 0;
    if (i >= STEPS.length - 1) { stopPlay(); return; }
    step();
  }, 500);
  if (i < 0) step();
}
function stopPlay() { if (timer) clearInterval(timer); timer = null; playBtn.textContent = "Play ▶"; }

document.getElementById("step").addEventListener("click", () => { stopPlay(); step(); });
document.getElementById("reset").addEventListener("click", reset);
playBtn.addEventListener("click", () => { if (timer) stopPlay(); else startPlay(); });
render();
</script>
</body>
</html>
