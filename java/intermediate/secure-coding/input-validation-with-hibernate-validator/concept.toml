[docs.session]
objectives = [
    "put constraints on a record and read the violations",
    "write a custom constraint and a class-level rule",
    "order checks with a group sequence",
    "name three things that validation does not do",
]
walkthrough = """
Run act three and find which check asked the catalogue. In act four find the line that keeps the slow pattern away from long input. In act five find the template that was run as code.
"""
exercises = [
    "Add a @Pattern to the e-mail so that it refuses ben@localhost.",
    "Add a constraint that checks a postal code against a list of codes.",
    "Move the catalogue lookup to a cheaper check and see what changes.",
    "Write a message that never repeats the value, and test it with markup.",
]

[docs.explained]
sentence = """
A rule that is written once, on the type, and checked in order from the cheapest to the dearest, is a rule that gets used.
"""
verdict = """
Put constraints on the types that cross the boundary, validate at the service as well as the page, check sizes before shapes before lookups, write a pattern for what you require instead of trusting a wide built-in, keep messages free of raw input and templates free of visitor text, and remember that validation is not encoding.
"""
recognise = [
    "`@Valid` and `@NotNull` on a parameter.",
    "A `@GroupSequence`.",
    "A custom `@Constraint` annotation.",
    "A 400 response that lists field errors.",
]

[spec]
purpose = """
Teach writing the rules of a form as Jakarta Validation constraints with Hibernate Validator, and what they leave to other code.
"""
nongoals = [
    "A web framework's binding of requests to objects.",
    "Output encoding.",
    "Business rules that need a database.",
]
problem = """
Validation rules are scattered, repeated and unordered, so they drift and cost more than they should.
"""
roles = [["The form", "`Checkout`, `Line`"], ["Custom rules", "`NoInvisible`, `Country`, `PostalCodeMatchesCountry`, `InStock`"], ["The validator", "`Checks`"], ["The service", "`Orders`"], ["Entry point", "`BeanValidationDemo`"]]
requirements = [
    "Constraints are annotations on records and a parameter.",
    "All violations are reported at once with their paths.",
    "Cheap checks run before expensive ones, by group sequence.",
    "A length limit runs before a pattern.",
    "A message template built from visitor text is not evaluated by default.",
    "The demo prints the same output on every run.",
]

