[readme]
intro = """
The plain [input-validation](../input-validation) project writes the rules of a checkout form by hand. This one writes them as **annotations** and lets **Hibernate Validator 9.1** (Jakarta Validation 3.1) run them. It needs no server and no tool beyond Gradle; the demo takes a couple of seconds.

What it shows:
- **Where validation belongs.** A shop that trusts the page totals a quantity of -3 as a refund. The same service with constraints on its parameter (`@NotNull @Valid Checkout`) refuses it, and refuses a missing form. The form has no price, so no hidden field can set one.
- **Annotations.** `@Min`, `@Max`, `@Pattern`, `@Email`, `@NotBlank`, `@Size`, container constraints on the lines of a cart. A form with several bad fields reports **all of them at once** with their paths. The built-in `@Email` takes `ben@localhost`, which the shop's rule refuses: a built-in check can be wider than your rule.
- **Your own constraints and groups.** A rule for invisible characters in normal form C, a class-level rule across two fields (the postal code fits the country, reported on the postal code), and a **group sequence** (limits, then shapes, then an expensive catalogue lookup) so that a bad value never costs a lookup.
- **Limits.** A cart of 10000 lines and an address of 10013 characters are refused before anything inside them is looked at. A pattern with repetitions nested two deep is exponential on the JDK; a length limit that runs first keeps it away from long input.
- **The bill.** A message that repeats the value repeats markup; a template built from the visitor's text is evaluated by a validator that allows method calls, and is not by default; valid text is not safe text.

**Maps to:** OWASP Top 10 (2025) A05 Injection · CWE-20 (improper input validation), CWE-1333 (inefficient regular expression complexity), CWE-917 (expression language injection) · Jakarta Validation 3.1.
"""
analogy = """
A customs desk with a written list. Each item on the list is a rule that a clerk can read, the clerks check the cheap rules first and send only the clean parcels to the slow inspection, and the desk never tells a traveller more than the rule that stopped them.
"""
scenario = """
An online store takes a checkout form: an e-mail address, a country and postal code, a login and the lines of a cart. The demo writes the rules once on the types and sends forms through them.
"""
costs = [
    "**The rules live in annotations,** which are easy to read and easy to forget on a new field.",
    "**Built-in constraints are general,** and the shop's rule is usually narrower.",
    "**A custom constraint is code,** with its own tests and its own ways to be slow.",
    "**Messages are output:** they need the same care as any other text sent back.",
    "**A group sequence makes the order explicit,** and someone must keep it right.",
]
too_much = """
A script that reads one trusted file does not need a validation framework. Use one where input from outside crosses into code, and where more than one place needs the same rules.
"""
met_before = [
    "`@Valid` on a controller parameter.",
    "`@NotNull` and `@Size` on an entity.",
    "A 400 response with a list of field errors.",
    "`javax.validation` imports from before the move to `jakarta`.",
]
where = """
This is the tools version of [input-validation](../input-validation), in the [secure-coding](..) module. It follows the same five questions with a real library: where validation belongs, what is allowed, what must be normalised, which limits apply, and what validation does not do.
"""
twin = """
Hibernate Validator is the real library with its default settings, English messages and the Expressly implementation of Jakarta EL. Nothing is mocked and nothing needs a network; step counts for the pattern are counted by a wrapper around the input.
"""
test_note = "The tests run the real validator and need no other tool."

[[act]]
title = "Where validation belongs"
summary = "The same service takes a quantity of -3 as a refund, or refuses it because its parameter has constraints."
detail = """
A shop that trusts the page totals a quantity of -3 for the sku at 89.90 as -269.70: a refund. The service whose parameter is @NotNull @Valid Checkout refuses it with the path place.checkout.lines[0].quantity, and refuses a missing form. An honest order is accepted and totalled from the catalogue. The form has no price field, so there is nothing for a hidden field to set.
"""
speech = """
First demo: where validation belongs. [[slnc 400]] A shop that trusts the page totals a quantity of minus three as a refund. [[slnc 600]]
The service with constraints on its parameter refuses it, and the form has no price to change.
"""
rows = { where = "active wrong" }
console = [
    ["trusting the page: quantity -3 -> total -269.70", "bad"],
    ["constraints on the parameter: lines[0].quantity refused", "ok"],
    ["no price on the form: nothing to set", "ok"],
]

[[act]]
title = "Say what is allowed, in annotations"
summary = "Built-in constraints on a record, all violations at once, and a built-in check that is wider than the shop's rule."
detail = """
Quantity 7 is accepted; 0 and 100 are refused with the messages must be greater than or equal to 1 and must be less than or equal to 99. The sku must match [A-Z]{3}-\\d{4}. The e-mail uses @Email, which takes ben@localhost: a built-in check is wider than the rule, so add a @Pattern for what you require. A country code is checked by a custom constraint against the JDK's list. A form with several bad fields reports all of them at once, with their paths.
"""
speech = """
Second demo: say what is allowed, in annotations. [[slnc 400]] Quantity, sku, e-mail and country are annotations on a record. [[slnc 600]]
All the violations come back at once, each with its path. [[slnc 300]] The built in e-mail check is wider than the shop's rule.
"""
rows = { annotations = "active ok" }
console = [
    ["quantity 0 and 100: refused with a message each", "ok"],
    ["ben@localhost: accepted by @Email", "bad"],
    ["a form with bad fields: 5 violations at once", "ok"],
]

[[act]]
title = "Your own constraints, across fields, and in an order"
summary = "An invisible-character rule, a postal code that must fit the country, and a group sequence that asks the catalogue only when the cheap checks pass."
detail = """
A custom constraint refuses a zero-width space, a line break and text that is not in normal form C, and accepts capitals and Cyrillic, which the login pattern refuses: no single rule catches everything. A class-level rule checks that the postal code fits the country and reports the violation on the postal code. A group sequence runs limits, then shapes, then the expensive checks: a sku in the wrong shape never reaches the catalogue (0 lookups); a sku in the right shape that nobody sells costs one lookup.
"""
speech = """
Third demo: your own constraints, across fields, and in an order. [[slnc 400]] A rule for invisible characters, and a rule across the postal code and the country. [[slnc 600]]
A group sequence runs the cheap checks first. [[slnc 300]] A sku in the wrong shape never reaches the catalogue.
"""
rows = { custom = "active ok" }
console = [
    ["zero-width space, line break, decomposed text: refused", "ok"],
    ["DE with 1011: reported on postalCode", "ok"],
    ["wrong-shape sku: 0 lookups; unknown sku: 1 lookup", "ok"],
]

[[act]]
title = "Limits are validation too"
summary = "A cart of 10000 lines and an address of 10013 characters are refused first, and a nested pattern costs sixteen times more for four more characters unless a length limit runs before it."
detail = """
A cart of 10000 lines is refused by the size limit, and the catalogue was asked 0 times. An e-mail address of 10013 characters is refused before the e-mail pattern runs. The pattern ((a+)+)+b on 8, 12 and 16 a's followed by ! takes 2264, 36808 and 589752 steps: four more characters multiply the work by sixteen. The JDK remembers its way through the simpler (a+)+$ and needs only quadratic time; one more level of nesting is exponential again. With @Size(max = 20) in the first group, 5000 characters cost 0 steps.
"""
speech = """
Fourth demo: limits are validation too. [[slnc 400]] A cart of ten thousand lines is refused before any line is looked at. [[slnc 600]]
A nested pattern costs sixteen times more for four more characters. [[slnc 300]] A length limit in the first group keeps it away from long input.
"""
rows = { limits = "active wrong" }
console = [
    ["10000 lines: refused by size, 0 lookups", "ok"],
    ["((a+)+)+b: 2264, 36808, 589752 steps", "bad"],
    ["5000 a's with @Size(max = 20) first: 0 steps", "ok"],
]

[[act]]
title = "The bill: what validation does not do"
summary = "A message can repeat markup, a template built from the visitor's text is evaluated when method calls are allowed, and valid text is not safe text."
detail = """
A review title <b>great</b> is refused for its length and the message repeats the visitor's text, markup and all. A surname O'Brien and a title <b>ok</b> are valid text, and encoding on output and parameters in the query are still the code's job. A coupon written into a constraint's own message template: Hibernate Validator 9 leaves ${1+1} as text; a validator set to allow method calls, as old versions did, evaluates it to 2 and ${'a'.concat('b')} to ab, which is the visitor's text run as code. Passed as a message parameter, the same text stays text even there.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] A message that repeats the visitor's text repeats markup. [[slnc 600]]
A template built from the visitor's text is run as code, if the validator allows method calls. [[slnc 300]] Pass it as a parameter instead.
"""
rows = { bill = "active wrong" }
console = [
    ["the message repeats <b>great</b>", "bad"],
    ["template ${1+1}: text by default, 2 with method calls allowed", "bad"],
    ["as a message parameter: text in both", "ok"],
]

