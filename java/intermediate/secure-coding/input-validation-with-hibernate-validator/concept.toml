[[act]]
title = "Your own constraints, across fields, and in an order"
summary = "Five logins: @NoInvisible alone catches 3 of 5, all the login's rules catch 5 of 5; a cross-field rule refuses DE 1011 (DE codes match \\d{5}) on the postal code and accepts IN 110001; the group sequence Limits, Default, Expensive refuses sho-1042 with 0 catalogue lookups and SHO-9999 with 1."
detail = """
The input is five logins: one with a zero-width space (U+200B), one with a line break (U+000A), BenK in capitals, one with a Cyrillic е (U+0435) in place of e, and é typed as two characters (e and U+0301). The custom @NoInvisible rule refuses 3 of 5 (the hidden characters and the text not in normal form C); all the login's rules, with @Pattern, refuse 5 of 5.
A rule across two fields, @PostalCodeMatchesCountry, refuses DE with 1011 (DE codes match \\d{5}) and reports it on postalCode, where the person can fix it; IN with 110001 is accepted.
How the groups order the checks: 1 Limits (sizes), 2 Default (shapes), 3 Expensive (@InStock, a catalogue lookup), each only if all before passed. So sho-1042 is refused by its pattern with 0 lookups, and SHO-9999, the right shape but not sold, costs 1 lookup.
"""
figure = "group_order"
figure_title = "Cheap checks first: a lookup only for a good shape"
figure_speech = """
Third demo: your own constraints, and an order. [[slnc 400]] At the top, the group sequence. [[slnc 300]] First the Limits group: sizes, before anything looks inside a value. [[slnc 300]] Then the Default group: the shapes, such as patterns. [[slnc 300]] Last the Expensive group: the check that asks the catalogue. [[slnc 300]] A group runs only if every group before it found nothing wrong. [[slnc 700]]
