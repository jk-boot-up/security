[threatmodel]
scope = """
The checkout form and the service that takes it, validated by Hibernate Validator constraints. It covers shapes, ranges, sizes, order, the cost of the checks and their messages. It does not cover encoding on output or query parameters.
"""
assets = [
    "The order totals and the catalogue.",
    "The server's time and memory.",
]
actors = [
    "A visitor who can send any bytes.",
    "A developer who adds a field or a constraint.",
]
boundaries = [
    "The edge of the service: everything past it is meant to be checked.",
]
assumptions = [
    "The service is the only way to place an order.",
    "Messages are encoded when they are put in a page.",
]
out_of_scope = [
    "Authentication and authorisation.",
    "Injection into other interpreters.",
]
tests = [
    "`BeanValidationTest` runs the real validator for the violations and paths, the built-in and custom constraints, the group sequence and its lookups, the limits, the nested pattern, method validation and the message templates.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next project in this module, race-conditions-and-business-logic-with-postgres, moves from what is allowed to what is allowed at the same time.
"""

[[threat]]
id = "T1"
stride = "T"
threat = "A request sets a value the page never offered"
where = "the service's parameter"
control = "Constraints on the type, validated at the service, with no price on the form"
residual = "A field added without a constraint"

[[threat]]
id = "T2"
stride = "D"
threat = "A huge value or a nested pattern exhausts the server"
where = "sizes and patterns"
control = "Limits in the first group, no nested repetition"
residual = "Patterns that look safe"

[[threat]]
id = "T3"
stride = "S"
threat = "Look-alike or invisible characters get through"
where = "text fields"
control = "A custom constraint, normal form C, plain patterns"
residual = "Characters that the pattern allows and people confuse"

[[threat]]
id = "T4"
stride = "I"
threat = "A message repeats the visitor's text or evaluates it"
where = "message templates"
control = "No raw values in messages, message parameters, the default expression language level"
residual = "A validator configured to allow method calls"

