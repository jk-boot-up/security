level = "intermediate"
module = "secure-coding"
title = "Input Validation with Hibernate Validator"
short_title = "Validation with Hibernate Validator"
package = "beanvalidation"
main_class = "BeanValidationDemo"
tagline = "Write what is allowed once, as annotations on the type, and let Jakarta Validation run it at the boundary, in an order, with limits first"
bold = "Hibernate Validator 9 with Jakarta Validation 3.1 turns the rules of the shop into annotations on records: built-in and custom constraints, a rule across two fields, container elements, method validation at the service boundary, and a group sequence that runs the limits first, then the shapes, then the checks that cost a lookup; but a built-in constraint can be wider than the rule, a pattern can still be exponential, a message can repeat the visitor's text, and validation is not encoding."
domain = "an online store"
domain_note = ""
youtube_description = "Hibernate Validator 9.1 with Jakarta Validation 3.1 on a checkout form written as Java records: constraints for quantity, sku, e-mail and country; all violations reported at once with their paths; a custom constraint for invisible characters and a class-level rule that checks the postal code against the country; method validation on a service; a group sequence that checks limits before shapes before a catalogue lookup; a cart of 10000 lines and a nested pattern stopped by a length limit; and what validation does not do, including message templates that evaluate expression language."
thumb_lines = ["VALIDATION WITH", "HIBERNATE VALIDATOR"]
