[[act]]
title = "The bill: what validation does not do"
summary = "A review title message repeats <b>great</b>, markup and all; a coupon ${1+1} put into a message template becomes \"the coupon 2 does not exist\" when templates may call methods, while Hibernate Validator 9's default and a message parameter keep it as text."
detail = """
The input is a review title <b>great</b> (12 characters). The result is the message "title: '<b>great</b>' is not 3 to 10 characters": it repeats the visitor's text, markup and all, so encode it or leave it out.
The input is a coupon put into a constraint's own message template: ${1+1} and ${'a'.concat('b')}. Before the fix, on a validator set to allow method calls in templates as old versions did, the messages are "the coupon 2 does not exist" and "the coupon ab does not exist": the visitor's text was run as code (expression injection).
After the fix, Hibernate Validator 9's default keeps "the coupon ${1+1} does not exist", and passing the text as a message parameter keeps it as text even on the risky validator. Valid text still needs encoding on output and query parameters, and each rule is a business decision, written down.
"""
figure = "template_injection"
figure_title = "A visitor's text inside a message template"
figure_speech = """
Fifth demo: the bill. [[slnc 400]] Validation does not do everything. [[slnc 600]] At the top, the input: a coupon code typed by a visitor, dollar, brace, one plus one, brace. [[slnc 300]] A careless constraint puts it inside its message template. [[slnc 700]]
In the middle, before the fix: a validator that lets templates call methods, as old versions did. [[slnc 300]] The template is evaluated, and the message says the coupon two does not exist. [[slnc 300]] The visitor's text was run as code. [[slnc 700]]
At the bottom, after the fix. [[slnc 300]] Hibernate Validator nine does not evaluate it by default. [[slnc 300]] And passed as a message parameter, the text stays text, even on the risky validator.
"""
speech = """
Here is the output. [[slnc 400]] A review title with a bold tag is too long. [[slnc 300]] The message repeats the title, markup and all. [[slnc 300]] If an error page prints it, the markup runs. [[slnc 400]] Then two coupons that look like template expressions.
[[page]]
Before the fix, the templates are evaluated: one plus one becomes two, and a method call joins a and b. [[slnc 300]] After the fix, the default and a message parameter keep the text as it was typed. [[slnc 400]] Valid text still needs encoding and query parameters, and every rule is a business decision.
"""
rows = { bill = "active wrong" }
console = [
