[[act]]
title = "Limits are validation too"
summary = "A cart of 10000 lines and a 10013-character address stop in the Limits group with 0 lookups; ((a+)+)+b takes 2264, 36808 and 589752 steps on 8, 12 and 16 a's (about 16 times per 4 a's), while @Size(max = 20) in the Limits group refuses 5000 a's in 0 steps; the JDK's (a+)+$ grows only 3 to 4 times when the a's double."
detail = """
The input is two oversized values: a cart of 10000 lines and an e-mail address of 10013 characters. The result: both stop in the Limits group, the cart with "size must be between 0 and 50" and 0 catalogue lookups, the address with "size must be between 0 and 254".
Before the fix, the coupon pattern ((a+)+)+b on 8, 12 and 16 a's and a ! takes 2264, 36808 and 589752 steps (every character the engine reads is a step): x 16.3 and x 16.0, so four more a's cost about 2^4 = 16 times the work (ReDoS).
After the fix, @Size(max = 20) in the Limits group refuses 5000 a's with 0 steps: the pattern never runs. Why two levels of nesting: the JDK remembers its way through the simpler (a+)+$, which takes 109, 349 and 1213 steps for 8, 16 and 32 a's, 3 to 4 times the work for twice the a's.
"""
figure = "redos_growth"
figure_title = "A size limit first, so the slow pattern never runs"
figure_speech = """
Fourth demo: limits are validation too. [[slnc 400]] The input: a run of a's, then an exclamation mark, checked against a pattern with repetitions nested two deep. [[slnc 700]]
The rose bars are before the fix. [[slnc 300]] Eight a's take about two thousand steps. [[slnc 300]] Twelve take thirty six thousand. [[slnc 300]] Sixteen take almost six hundred thousand. [[slnc 300]] Four more a's, sixteen times the work. [[slnc 700]]
The green bar is after the fix. [[slnc 300]] A size limit of twenty, in the first group, refuses five thousand a's before the pattern runs: zero steps. [[slnc 500]] The amber bars show the simpler pattern on the J D K. [[slnc 300]] It grows slowly, which is why a safe looking pattern is not proof of a safe pattern.
"""
speech = """
Here is the output. [[slnc 400]] A cart of ten thousand lines and a very long e-mail address both stop in the limits group, before any lookup. [[slnc 400]] Then the nested pattern. [[slnc 300]] Four more a's multiply the steps by about sixteen. [[slnc 300]] That is regular expression denial of service.
[[page]]
After the fix, a size limit in the first group refuses five thousand a's in zero steps. [[slnc 400]] And the simpler pattern: twice the a's cost three to four times the steps, not doubling for each a. [[slnc 300]] One more level of nesting is enough to make it exponential.
"""
rows = { limits = "active wrong" }
