[[act]]
title = "Canonicalise before validating"
summary = "A raw-text registry gives three accounts to ana, full-width ａｎａ and ANA; NFKC, strip and lower-case turn all three into ana, so the canonical registry refuses two as already taken; hidden and look-alike letters are refused, José typed two ways is equal after NFC, and a look-alike of the staff name is refused by its skeleton."
detail = """
The input is three spellings of one name: plain ana (U+0061 U+006E U+0061), full-width (U+FF41 U+FF4E U+FF41) and capitals ANA. Before the fix, a registry that compares raw text gives each one a new account.
How the canonical form is made: NFKC folds the full-width letters into ana, strip removes spaces at the ends, and lower-case (with Locale.ROOT) gives ana. After the fix, the registry compares canonical names: the plain spelling gets the account and the other two are refused as already taken.
A zero-width space (U+200B) or a line break (U+000A) inside a name is refused (no control or invisible characters), and a Cyrillic а (U+0430) in place of a is refused because login names are kept to plain letters.
José typed with one letter é (U+00E9) and with e plus a combining accent (U+0065 U+0301) is different raw text and equal after NFC. A display name may use any script, but "Shоp Suppоrt" with Cyrillic o has the skeleton "shop support" and is refused as reserved for the shop's staff; "José Martín" is accepted.
"""
figure = "canonical_names"
figure_title = "Three spellings, one name: compare after the canonical form"
figure_speech = """
Third demo: canonicalise before validating. [[slnc 400]] On the left, the input: three spellings of the name ana. [[slnc 300]] Plain letters, full width letters, and capitals. [[slnc 300]] Under each letter is its Unicode code point. [[slnc 300]] The full width letters have different code points from the plain ones. [[slnc 700]]
In the middle, how the canonical form is made. [[slnc 300]] N F K C folds the full width letters into plain ones. [[slnc 300]] Then the spaces at the ends are stripped, and the text is lower-cased. [[slnc 300]] All three spellings become the same three letters. [[slnc 700]]
On the right, the result. [[slnc 300]] Before the fix, a registry that compares raw text opens three accounts for one name. [[slnc 300]] After the fix, it compares the canonical names, so there is only one.
"""
speech = """
Here is the output. [[slnc 400]] The input: three spellings, with their code points. [[slnc 300]] Before the fix, the raw text registry says yes to all three. [[slnc 300]] Three accounts for one name.
[[page]]
How the canonical form is made, for the full width spelling. [[slnc 300]] N F K C gives plain a, n, a. [[slnc 300]] Strip and lower-case change nothing more. [[slnc 400]] After the fix, the plain spelling gets the account, and the other two are already taken.
[[page]]
Some letters hide. [[slnc 300]] A zero width space and a line break are refused, because a name has no control or invisible characters. [[slnc 300]] A Cyrillic letter that looks like a is refused, because login names use plain letters only.
[[page]]
José can be typed with one accented letter, or with e and a combining accent. [[slnc 300]] As raw text they differ; after N F C they are equal. [[slnc 400]] A display name may use any script. [[slnc 300]] But shop support written with Cyrillic o has the skeleton shop support, so it is refused.
"""
