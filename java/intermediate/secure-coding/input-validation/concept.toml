kind = "poster"
title = "Input Validation Done Right"
narration = """Hello, and welcome. [[slnc 400]] This video explains input validation, done right, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] Input validation decides which values a program accepts, at the point where they arrive from outside. [[slnc 600]] Think of a concert. [[slnc 300]] A sticker saying checked, printed at home, means nothing. [[slnc 300]] The real check happens at the door. [[slnc 300]] The attendant knows what a real ticket looks like, and nobody brings a lorry through the turnstile. [[slnc 700]] In this video, the domain is an online store. [[slnc 500]] By the end, you will hear where validation belongs. [[slnc 300]] How to say what is allowed. [[slnc 300]] Why text needs one canonical form. [[slnc 300]] And why limits are validation too."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online store's checkout and account forms.", "", "Values the page never sends,", "names spelled in unusual ways,", "and sizes nobody planned for."]
narration = """Here is the scenario. [[slnc 400]] An online store has a checkout form, and an account form. [[slnc 500]] The demo sends values the page would never send. [[slnc 300]] Names spelled in unusual ways. [[slnc 300]] And sizes nobody planned for."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["Trust boundary: where outside values arrive", "Allow-list: what a value may be", "Parse: turn text into a type", "Canonical form: one spelling for one value", "ReDoS: a pattern that takes too long"]
narration = """Before the demos, the words. [[slnc 500]] A trust boundary is where values from outside arrive. [[slnc 500]] An allow list says what a value may be. [[slnc 500]] To parse is to turn text into a type that holds only good values. [[slnc 500]] A canonical form is one spelling for one value. [[slnc 500]] And re dos is a regular expression that takes so long it stops a server."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "09-ladder"
kind = "bullets"
title = "In Order, At The Boundary"
body = ["1. Limit the size", "2. Refuse invisible characters", "3. Normalise and trim", "4. Check the allow-list and parse", "5. Use only typed values"]
narration = """Let's put it in order. [[slnc 400]] First, limit the size. [[slnc 500]] Second, refuse invisible and control characters. [[slnc 500]] Third, normalise and trim. [[slnc 500]] Fourth, check the allow list, and parse into a type. [[slnc 500]] And fifth, let the rest of the code use only typed values."""

[[scene]]
key = "10-roles"
kind = "bullets"
title = "Who Does What"
body = ["Value types: parse or refuse", "Checkout: the boundary for orders", "Username and DisplayName: names", "Limits: sizes", "Backtracking: the cost of a pattern"]
narration = """Here is who does what in the code. [[slnc 400]] Each value type parses its text, or refuses it. [[slnc 500]] The checkout class is the boundary for orders. [[slnc 500]] The username and display name classes put names into one form. [[slnc 500]] The limits class checks sizes. [[slnc 300]] And the backtracking class counts the steps a pattern takes."""

[[scene]]
key = "11-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Form attributes, skipped with curl", "@Size, @Pattern and @Email", "Look-alike account names", "Outages caused by one pattern"]
narration = """You have probably met this already. [[slnc 400]] Forms with required and pattern attributes, which a command line tool simply skips. [[slnc 500]] Annotations such as size, pattern and email in Java applications. [[slnc 500]] Account names and web addresses that only look like the real ones. [[slnc 500]] And outages caused by a single regular expression."""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Validate on the server", "Parse into types with allow-lists", "Normalise before comparing", "Limit before working", "Never echo raw input"]
narration = """So, how do you use it? [[slnc 400]] Validate on the server, at every boundary. [[slnc 500]] Parse into types, using allow lists. [[slnc 500]] Normalise text before comparing it. [[slnc 500]] Limit every size before doing any work. [[slnc 500]] And never repeat raw input in an error message."""

[[scene]]
key = "13-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a postcode type", "whose rule depends on the country."]
narration = """That's input validation done right. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Decide what is allowed, on the server, in one canonical form, before it costs anything. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine, with nothing installed except a Java development kit. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a postcode type whose rule depends on the country. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
The online store's checkout and account forms at the server's trust boundary: the values they accept, the form of text they compare, and the sizes they allow. It covers anyone who can send a request.
It does not cover output encoding, database queries or access control, which have their own projects.
"""
assets = [
    "Order totals and prices.",
    "Account names and the uniqueness of each name.",
    "The server's time and memory.",
    "The trust customers place in names shown as the shop's staff.",
]
actors = [
    "An honest customer using the page.",
    "An attacker sending requests directly.",
    "Someone registering a look-alike account name.",
]
boundaries = [
    "Client to server: the page's checks end here, and the server's begin.",
    "Validated values to the store's logic: only typed values cross it.",
]
assumptions = [
    "Prices and products come from the store's own catalogue.",
    "The country list is the one the JDK ships, and is current enough for shipping.",
    "In the demo, all values are fixed and no network is used.",
]
out_of_scope = [
    "Output encoding: the cross-site-scripting project.",
    "Database query safety: parameters, named here as the reason validation is not enough.",
    "Authorization: the broken-access-control project.",
]
tests = [
    "`ValueTypesTest` checks accepted and refused values for every type, and that refusals never repeat the raw input.",
    "`CheckoutTest` checks the boundary: direct requests, unknown fields, unknown products, every problem at once.",
    "`CanonicalTest` checks canonical names, invisible characters, locale independence, NFC and look-alikes.",
    "`LimitsTest` checks body, cart and pattern limits.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next project, race-conditions-and-business-logic, turns from single values to sequences of requests: two valid withdrawals that together spend money twice.
"""

[[threat]]
id = "T1"
stride = "T"
threat = "Values the page would refuse are sent directly to the server"
where = "`TrustingShop`, `Checkout.place`"
control = "Every field is validated on the server; the page's checks are only a convenience"
residual = "None for these fields; every new field needs its own type"

[[threat]]
id = "T2"
stride = "T"
threat = "A hidden or extra field, such as a price, changes what the server does"
where = "`Checkout.place`"
control = "Unknown fields are refused, and prices come from the catalogue"
residual = "A field that is expected but trusted too much is still a risk, so each one is reviewed"

[[threat]]
id = "T3"
stride = "S"
threat = "A second account, or a staff look-alike, is registered with another spelling of a name"
where = "`Username`, `DisplayName`, `Accounts`"
control = "One canonical form (NFKC, trim, Locale.ROOT), invisible characters refused, and a look-alike check for display names"
residual = "The look-alike table is small; the full Unicode confusables data catches more"

[[threat]]
id = "T4"
stride = "D"
threat = "A huge body, a huge list or a slow pattern uses up the server"
where = "`Limits`, `Backtracking`"
control = "Size limits before any work, and no nested repetition in patterns that read input"
residual = "Limits must also be set in the web server and gateway in front of the application"

[[threat]]
id = "T5"
stride = "I"
threat = "An error message repeats raw input, which may hold markup or forged log lines"
where = "`Rejected`"
control = "Messages name the field and the rule only"
residual = "Logs of refused requests must also be written safely"

[[threat]]
id = "T6"
stride = "T"
threat = "A valid value is treated as safe for output or for a query"
where = "the code after the boundary"
control = "None here: output encoding and query parameters are separate controls"
residual = "Covered by the cross-site-scripting project and by parameterized queries"
