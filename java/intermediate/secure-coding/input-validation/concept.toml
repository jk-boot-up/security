long = "Java Development Kit"
say = "J D K is the Java development kit, which ships the list of country codes."
[[acronym]]
short = "NFC, NFKC"
long = "Unicode Normalization Form C, and its compatibility form"
say = "N F C is Unicode normalization form C: one way to write each accented letter. N F K C also folds compatibility forms, such as full width letters, into plain ones."
[[acronym]]
short = "ReDoS"
long = "Regular expression Denial of Service"
say = "Re Dos is regular expression denial of service: a pattern that takes so long on a crafted input that it stops a server."
[[acronym]]
short = "NaN"
long = "Not a Number: a special floating-point value"
say = "N a N is not a number, a special floating point value that is never a valid amount of money."
[[acronym]]
short = "U+0061"
long = "A Unicode code point in hexadecimal: here the letter a"
say = "U plus, then four hexadecimal digits, names one Unicode character, for example U plus zero zero six one is the letter a."

