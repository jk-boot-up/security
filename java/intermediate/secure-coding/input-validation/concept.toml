[[act]]
title = "Say what is allowed, and parse into types"
summary = "Each field has one allowed shape: \"7\" becomes Quantity[value=7], \"Ben@Shop.EXAMPLE\" becomes Email[value=Ben@shop.example] and \"19.50\" becomes Money[amount=19.50], while 0, 1e2, sho-1042, ben@@shop.example, ZZ and 19.505 are refused; a form with four bad fields gets all four problems at once."
detail = """
The input is one raw string per field; the result is either a typed value or the rule it broke. A quantity is digits only from 1 to 99: "7" becomes Quantity[value=7]; "0", "1e2" and " 5" are refused.
A product code (SKU) is 3 capital letters, a dash and 4 digits; "sho-1042" is refused, and "SHO-1042;" is longer than 8 characters. An e-mail address keeps its local part and lower-cases its domain: "Ben@Shop.EXAMPLE" becomes Ben@shop.example; ben@@shop.example and ben@localhost are refused.
A country is a two-letter ISO code the JDK knows, so ZZ and lower-case de are refused. An amount is exact, with at most two decimals, so 19.505, -5 and NaN are refused.
A form with four bad fields (country=Mars email=x quantity=lots sku=shoes) gets 4 problems reported at once, each naming the field and the rule, never the raw value.
"""
figure = "parse_types"
figure_title = "A raw string goes in; a type, or the broken rule, comes out"
figure_speech = """
Second demo: say what is allowed, and parse into types. [[slnc 400]] On the left, the input: raw strings, exactly as they arrive in the request. [[slnc 300]] Every one is just text. [[slnc 700]]
On the right, the result. [[slnc 300]] A string that has the allowed shape becomes a type: a Quantity, a S K U, an Email, a Country Code, a Money amount. [[slnc 300]] Green means it passed. [[slnc 500]] A string that breaks the rule is refused, and the result names the rule it broke. [[slnc 300]] Rose means it was refused. [[slnc 700]]
Once a value is a Quantity, it can only hold a number from one to ninety nine. [[slnc 300]] So later code never has to check it again.
"""
speech = """
Here is the output, field by field. [[slnc 400]] A quantity: seven becomes a Quantity. [[slnc 300]] Zero is out of range. [[slnc 300]] One e two and a number with a space in front are not digits only. [[slnc 400]] A product code: lower-case letters are refused, and so is a code with a semicolon on the end, because it is too long.
[[page]]
An e-mail address: the domain is lower-cased, the local part is kept as typed. [[slnc 300]] Two at signs are refused, and so is a domain with no dot. [[slnc 400]] A country must be a code the J D K knows: Z Z is not a country, and lower-case D E is not the code.
