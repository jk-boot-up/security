# concept.toml: everything about this project that is not Java code.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "input-validation"
level = "intermediate"
module = "secure-coding"
title = "Input Validation Done Right"
short_title = "Input Validation"
package = "validation"
main_class = "ValidationDemo"
tagline = "Decide what is allowed, at the boundary, before it costs anything"
bold = "Validation belongs on the server, at the trust boundary: say exactly what is allowed and parse it into types, put text into one canonical form before checking it, and limit sizes before doing work, while remembering that a valid value is still not safe to print or to paste into a query."
domain = "an online store"
domain_note = ""
youtube_description = """Input validation in Java, done right, for OWASP Top 10 A05 and A06. Explained with an online store, like a door attendant who checks tickets at the door instead of trusting a sticker the visitor printed at home. We send a negative quantity and a hidden price straight past the checkout page, parse every field into a type that cannot hold anything else, fold full-width and look-alike names into one canonical form, limit request bodies, carts and fields, count the steps of a regular expression that doubles its work with every character, and finish with the bill: a valid value is still not safe to put in a page or a query."""
thumb_lines = ["INPUT VALIDATION", "DONE RIGHT"]
thumb_code = "Quantity.parse(\"-3\")"
youtube_title = "Input Validation Done Right in Java (Allow-Lists, Unicode, ReDoS)"
youtube_tags = ["input validation", "owasp top 10", "allow list", "unicode normalization", "redos", "trust boundary", "secure coding", "java", "application security"]

[readme]
intro = """
Every value that reaches a server came from somewhere it does not control. **Input validation** decides, at that **trust boundary**, which values the code will accept. Four habits make it work.
**Validate on the server**: checks in the page help honest customers and stop nobody else, because anyone can send the request without the page. **Allow, do not block**: say exactly what
a value may be, and **parse** it into a **type** (a quantity, a product code, an e-mail address, an amount of money) that cannot hold anything else. **Canonicalise first**: text has many spellings
of one value, such as full-width letters, accents typed in two ways and letters from other scripts that look Latin, so normalise before comparing. **Limit before working**: a maximum size for bodies, lists
and fields, and no regular expression that can take exponential time.

The demo follows an online store's checkout and account forms through each habit, and ends with what validation does not do.

Maps to: OWASP Top 10 2025 A05 (Injection) and A06 (Insecure Design); CWE-20 (improper input validation), CWE-1333 (inefficient regular expression complexity), CWE-176 (improper handling of Unicode encoding),
CWE-180 (validate before canonicalise); OWASP ASVS 5.0, the chapter on validation and business logic.
"""
analogy = """
Think of a concert with tickets. A sticker on the visitor's coat saying "checked" means nothing, because the visitor printed it at home: the check happens at the door. The attendant has a list
of what a ticket looks like rather than a list of every fake ever seen. A ticket written in a different alphabet that looks like a real name gets a closer look, and nobody is allowed to bring a lorry
through the turnstile.
"""
scenario = """
An online store has a checkout form (product code, quantity, e-mail address, shipping country) and an account form (login name and display name). The demo sends values the page would never send,
values in unusual spellings and values of extreme size, first to code that trusts them and then to code that validates at the boundary.
"""
costs = [
    "**Rules must match the business.** A quantity limit of 99 refuses a wholesale customer ordering 150; every rule is a business decision that has to be written down and kept up to date.",
    "**Validation is not output encoding.** A review that says `<b>great</b>` is valid text and still markup, so it must be encoded when written into a page.",
    "**Validation is not query safety.** O'Brien is a valid surname with a quote in it, so the database layer must bind values as parameters.",
    "**Strict types cost code.** One small class per kind of value is more code than a string, and pays back by never being checked twice.",
    "**Unicode is large.** A small look-alike table catches the common cases; the full Unicode confusables data is bigger and changes with each Unicode release.",
]
too_much = """
For an internal tool used by a handful of trusted people, a few simple checks may be enough. For anything that faces customers, every field at the boundary deserves a type, a limit and a
canonical form, because the cost of a value nobody expected is paid later and somewhere else.
"""
met_before = [
    "Forms with `required`, `min`, `max` and `pattern` attributes, and the same requests sent with curl.",
    "Jakarta Validation annotations such as `@Size`, `@Pattern` and `@Email` in Java applications.",
    "Look-alike domain names and account names used in phishing.",
    "Outages caused by one regular expression on one long input.",
]
where = """
This project is the first in the intermediate track's **secure-coding** module ([secure-coding](..)). It builds on
[cross-site-scripting](../../web-security/cross-site-scripting), which encodes what validation lets through, and on the beginner project
[http-basics-and-headers](../../../beginner/networking/http-basics-and-headers), whose strict parser refuses ambiguous requests.
"""
twin = """
Everything runs in memory with fixed inputs, so the output is the same on every run. The cost of the regular expression is measured by counting the steps of a model of a backtracking
engine, not by timing, so it is exact on every machine. The country list is the one the JDK ships.
"""
test_note = "Every rule is checked with parameterized tests of accepted and refused values. The regular-expression cost is counted in steps rather than timed, so the golden output is the same on every machine."

[[act]]
title = "Where validation belongs"
summary = "The page refuses a quantity of -3, but the same request sent without the page gives a total of -269.70 and a hidden price of 0.01 gives 0.02; the server-side checkout refuses both."
detail = """
The checkout page refuses a quantity of -3 before sending. The same request, sent without the page to a shop that trusts the page, gives a total of -269.70: a negative total is a refund.
A hidden price field changed to 0.01 gives a total of 0.02 instead of 179.80: the customer set the price. The checkout that validates on the server refuses the quantity (digits only)
and the price field (not a field of this form), and an honest order is accepted with a total of 179.80 from the catalogue.
"""
speech = """
First demo: where validation belongs. [[slnc 400]] The checkout page refuses a quantity of minus three. [[slnc 600]]
But the same request, sent without the page, reaches a shop that trusts the page. [[slnc 300]] The total is negative. [[slnc 300]] That is a refund. [[slnc 600]]
A hidden price field, changed to one cent, makes the order cost two cents. [[slnc 300]] The customer set the price. [[slnc 600]]
The checkout that validates on the server refuses both. [[slnc 300]] And an honest order is priced from the catalogue.
"""
rows = { boundary = "active wrong" }
console = [
    ["the checkout page refuses a quantity of -3 before sending: true", "muted"],
    ["the same request sent without the page, to a shop that trusts the page: total -269.70  <- A NEGATIVE TOTAL IS A REFUND", "bad"],
    ["a hidden price field changed to 0.01: total 0.02 instead of 179.80  <- THE CUSTOMER SET THE PRICE", "bad"],
    ["the checkout that validates on the server: accepted false (quantity: digits only)", "ok"],
    ["and the hidden price: accepted false (price: not a field of this form)", "ok"],
    ["an honest order: accepted true, total 179.80 from the catalogue", "ok"],
]

[[act]]
title = "Say what is allowed, and parse into types"
summary = "Quantities, product codes, e-mail addresses, country codes and amounts each have one allowed shape; 0, 1e2, sho-1042, ben@@shop.example, ZZ and 19.505 are refused, and four bad fields are reported at once."
detail = """
Each field has one allowed shape, and a value that passes becomes a type that cannot hold anything else. A quantity is 1 to 99 in digits, so 0, 1e2 and " 5" are refused. A product code is three
capital letters, a dash and four digits. An e-mail address keeps its local part and lower-cases its domain; ben@@shop.example and ben@localhost are refused. A country is an ISO code, so ZZ
and lower-case de are refused. Money is an exact decimal with at most two places, so 19.505, -5 and NaN are refused. A form with four bad fields reports all four at once.
"""
speech = """
Second demo: say what is allowed. [[slnc 400]] Each field has one allowed shape. [[slnc 600]]
A quantity is a number from one to ninety nine, in digits. [[slnc 300]] Zero is refused. [[slnc 300]] So is one e two, and a number with a space in front. [[slnc 600]]
A product code has one pattern. [[slnc 300]] An e-mail address with two at signs is refused. [[slnc 300]] A country must be a real country code. [[slnc 300]] And money has at most two decimals, and is never negative. [[slnc 600]]
A value that passes becomes a type that cannot hold anything else. [[slnc 300]] So later code never checks it again.
"""
rows = { types = "active ok" }
console = [
    ["quantity \"0\": refused (from 1 to 99); quantity \"1e2\": refused (digits only)", "ok"],
    ["sku \"sho-1042\": refused (three capital letters, a dash and four digits)", "ok"],
    ["email \"Ben@Shop.EXAMPLE\": accepted as Ben@shop.example; \"ben@@shop.example\": refused", "ok"],
    ["country \"ZZ\": refused; amount \"19.505\": refused; amount \"NaN\": refused", "ok"],
    ["a form with four bad fields reports all four at once: 4", "ok"],
    ["each value that passes is a type that cannot hold anything else, so later code never checks it again", "muted"],
]

[[act]]
title = "Canonicalise before validating"
summary = "A raw-text registry accepts full-width ａｎａ and ANA as new accounts; the canonical one folds them to ana and refuses them, refuses invisible and control characters, and NFC makes José typed two ways equal."
detail = """
With ana registered, a registry that compares raw text also accepts the full-width ａｎａ and ANA in capitals: two accounts for one name. The canonical registry normalises with NFKC, trims and
lower-cases without the machine's locale, so the full-width spelling is ana, and is refused as already taken. A zero-width space or a line break inside a name is refused, and so is a Cyrillic
letter in place of a Latin one, because login names are kept to plain letters. José typed with one accented letter and with e plus a combining accent are different raw text and equal after NFC.
A display name may use any script, but "Shоp Suppоrt" written with Cyrillic o is refused as a look-alike of the staff name.
"""
speech = """
Third demo: canonicalise before validating. [[slnc 400]] Ana is registered. [[slnc 300]] A registry that compares raw text also accepts ana in full width letters, and ana in capitals. [[slnc 300]] Two accounts for one name. [[slnc 600]]
The canonical registry folds every spelling into one form, before checking it. [[slnc 300]] The full width spelling is refused, as already taken. [[slnc 600]]
An invisible zero width space is refused. [[slnc 300]] So is a line break. [[slnc 300]] So is a Cyrillic letter in place of a Latin one. [[slnc 600]]
A name typed with an accent in two different ways becomes equal after normalising. [[slnc 300]] And a display name that only looks like the shop's support team is refused.
"""
rows = { canonical = "active amber" }
console = [
    ["ana is registered; a registry that compares raw text also accepts the full-width ａｎａ: true  <- TWO ACCOUNTS FOR ONE NAME", "bad"],
    ["the canonical registry folds the full-width spelling to ana: refused (already taken)", "ok"],
    ["an invisible zero-width space inside a name: refused (no control or invisible characters)", "ok"],
    ["Cyrillic а in place of a: refused; login names are kept to plain letters", "ok"],
    ["José typed two ways looks the same; as raw text equal: false, after NFC: true", "amber"],
    ["a display name \"Shоp Suppоrt\" with Cyrillic o: refused (reserved for the shop's staff)", "ok"],
]

[[act]]
title = "Limits are validation too"
summary = "A 1000000-byte body is refused after reading 16385 bytes, a 10000-line cart and a 10000-character address are refused, and the pattern (a+)+$ needs 2097130 steps for 20 a's against 21 for the linear check."
detail = """
A request body of 1000000 bytes is refused after reading only 16385 of them, one more than the limit. A cart of 10000 lines and an e-mail address of 10000 characters are refused before any other
work. The pattern (a+)+$ on 10 a's and a ! takes 2036 steps to fail, on 15 a's 65519 steps and on 20 a's 2097130 steps: each extra character roughly doubles the work, so a few dozen characters can
stop a server (ReDoS). The same rule written without nesting, checked in one pass, takes 21 steps. So: no nested repetition in patterns that read input, and a length limit before any pattern runs.
"""
speech = """
Fourth demo: limits are validation too. [[slnc 400]] A request body of a million bytes is refused, after reading only a little more than the limit. [[slnc 600]]
A cart of ten thousand lines is refused. [[slnc 300]] So is an e-mail address of ten thousand characters. [[slnc 600]]
Then a regular expression with a repetition inside a repetition. [[slnc 300]] On ten letters and a mark, it takes about two thousand steps to fail. [[slnc 300]] On twenty, about two million. [[slnc 600]]
Each extra character doubles the work. [[slnc 300]] A few dozen characters can stop a server. [[slnc 600]]
The same rule, written without nesting, takes twenty one steps.
"""
rows = { limits = "active wrong" }
console = [
    ["a request body of 1000000 bytes: refused (larger than 16384 bytes) after reading 16385 of them", "ok"],
    ["a cart of 10000 lines: refused (more than 50 lines)", "ok"],
    ["the pattern (a+)+$ on 10 a's and a !: matched false after 2036 steps", "amber"],
    ["the pattern (a+)+$ on 20 a's and a !: matched false after 2097130 steps", "bad"],
    ["each extra character roughly doubles the work  <- A FEW DOZEN CHARACTERS CAN STOP A SERVER (ReDoS)", "bad"],
    ["the same rule written without nesting, a+$, checked in one pass: 21 steps for 20 a's and a !", "ok"],
]

[[act]]
title = "The bill: what validation does not do"
summary = "A valid review can still be markup, a valid surname can hold a quote, refusals never repeat raw input, and a limit of 99 refuses a wholesale order of 150."
detail = """
A review "<b>great</b>" is valid text and still markup, so it is encoded on output. A surname O'Brien is valid and contains a quote, so the database layer binds values as parameters and never
pastes them into query text. A refused e-mail address with a line break and markup gives the message "email: not a valid address", without repeating the raw input. A wholesale order of 150 is
refused by a limit of 99: a limit stricter than the business turns customers away, so each rule is a written business decision. Validation narrows what reaches the code; encoding,
parameters and access checks still do their own jobs.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] Validation does not do everything. [[slnc 600]]
A review with a bold tag is valid text. [[slnc 300]] It is still markup, so it is encoded when it is written into a page. [[slnc 600]]
O'Brien is a valid surname, with a quote in it. [[slnc 300]] So the database layer binds values as parameters. [[slnc 600]]
A refused value is never repeated in the error message. [[slnc 600]]
And a limit of ninety nine turns away a wholesale customer ordering one hundred and fifty. [[slnc 300]] So every rule is a written business decision.
"""
rows = { boundary = "active amber", types = "active amber" }
console = [
    ["a review \"<b>great</b>\" is valid text, and still markup: encode it on output (see cross-site-scripting)", "amber"],
    ["a surname O'Brien is valid and contains a quote, so the database layer must bind values as parameters", "amber"],
    ["a refused e-mail address with a line break and markup: \"email: not a valid address\", raw input repeated: false", "ok"],
    ["a wholesale order of 150: refused (from 1 to 99); each rule is a written business decision", "amber"],
    ["validation narrows what reaches the code; encoding, parameters and access checks still do their own jobs", "muted"],
]

