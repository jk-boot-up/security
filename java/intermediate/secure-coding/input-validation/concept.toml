[[act]]
title = "Limits are validation too"
summary = "A 1000000-byte body is refused after reading 16385 bytes, a 10000-line cart and a 10003-character address are refused; (a+)+$ tries all 4 splits of aaa! and takes 2036, 65519 and 2097130 steps for 10, 15 and 20 a's (about 32 times more per 5 a's), against 21 steps for a+$ in one pass."
detail = """
The input is three oversized values: a request body of 1000000 bytes, a cart of 10000 lines and an e-mail address of 10003 characters. The result: the body is refused after reading 16385 bytes, one more than the limit of 16384; the cart is refused (more than 50 lines) and the address (longer than 254 characters), before any other work.
How (a+)+$ reads aaa!: the inner and outer repetitions can split the a's as (aaa), (aa)(a), (a)(aa) or (a)(a)(a); each split fails at the !, so the engine tries all 4 = 2^(3-1), in 11 steps.
Before the fix, (a+)+$ on 10, 15 and 20 a's and a ! takes 2036, 65519 and 2097130 steps: five more a's cost about 2^5 = 32 times the work (ReDoS). After the fix, a+$ checked in one pass takes 21 steps for 20 a's and a !, and a length limit runs before any pattern.
"""
figure = "redos_steps"
figure_title = "Every split of the a's is tried: the work doubles with each one"
figure_speech = """
Fourth demo: limits are validation too. [[slnc 400]] At the top, a small input: three a's and an exclamation mark. [[slnc 300]] The pattern has a repetition inside a repetition. [[slnc 300]] So the a's can be grouped in four ways. [[slnc 300]] All three together, two and one, one and two, or one, one and one. [[slnc 300]] Every grouping fails at the exclamation mark, so the engine tries them all. [[slnc 700]]
Four is two to the power of two. [[slnc 300]] With n a's there are two to the power n minus one groupings. [[slnc 700]]
At the bottom, the steps for ten, fifteen and twenty a's. [[slnc 300]] Five more a's cost about thirty two times the work. [[slnc 300]] Twenty a's take about two million steps. [[slnc 300]] The same rule without nesting takes twenty one.
"""
speech = """
Here is the output. [[slnc 400]] The input: a body of a million bytes, a cart of ten thousand lines, and an e-mail address of ten thousand and three characters. [[slnc 300]] The result: the body is refused after reading just one byte more than the limit. [[slnc 300]] The cart and the address are refused before any other work. [[slnc 400]] Then the four groupings of three a's.
[[page]]
Before the fix, the nested pattern: about two thousand steps for ten a's, sixty five thousand for fifteen, two million for twenty. [[slnc 300]] That is regular expression denial of service, Re Dos. [[slnc 400]] After the fix, the pattern without nesting: twenty one steps. [[slnc 300]] And a length limit runs before any pattern.
"""
rows = { limits = "active wrong" }
console = [
    ["THE INPUT, THREE OVERSIZED VALUES:", "code"],
    ["  body         1000000 bytes", "muted"],
    ["  cart         10000 lines", "muted"],
    ["  e-mail       10003 characters", "muted"],
    ["THE RESULT, REFUSED BEFORE THE WORK:", "code"],
    ["  body         read 16385, refused: larger than 16384 bytes", "ok"],
    ["  cart         refused (more than 50 lines)", "ok"],
    ["  e-mail       refused: longer than 254 characters", "ok"],
    ["---", ""],
    ["HOW (a+)+$ READS aaa! (every split of the a's fails at the !):", "code"],
    ["  (aaa)!  (aa)(a)!  (a)(aa)!  (a)(a)(a)!", "muted"],
    ["  4 splits = 2^(3-1), 11 steps in all", "muted"],
    ["BEFORE THE FIX, (a+)+$ ON n a's AND A !:", "code"],
    ["  10 a's       2036 steps, matched false", "muted"],
    ["  15 a's       65519 steps, matched false  (x 32.2)", "muted"],
    ["  20 a's       2097130 steps, matched false  (x 32.0)", "muted"],
    ["  5 more a's: about 2^5 = 32 times the work  <- ReDoS", "bad"],
    ["AFTER THE FIX, a+$ IN ONE PASS:", "code"],
    ["  20 a's       21 steps, matched false", "ok"],
    ["  and a length limit before any pattern runs", "ok"],
]

[[act]]
title = "The bill: what validation does not do"
summary = "The display names <b>great</b> and O'Brien are both accepted, and are still markup and a quote; the error for a bad e-mail address does not repeat the input; a limit of 99 refuses a wholesale order of 150."
detail = """
The input is two display names, <b>great</b> and O'Brien. The result: both are accepted, because both are allowed names, yet the first is still markup, so it is encoded on output, and the second has a quote, so the database layer binds it as a parameter.
A bad e-mail address with a line break and markup gets the message "email: not a valid address", which does not repeat the input (repeats it? false).
A wholesale order of 150 is refused (from 1 to 99): a limit stricter than the business turns a customer away, so each limit is a written business decision. Validation narrows what reaches the code; encoding, parameters and access checks still do their jobs.
"""
figure = "valid_not_safe"
figure_title = "Valid is not the same as safe"
figure_speech = """
Fifth demo: the bill. [[slnc 400]] Validation does not do everything. [[slnc 600]] On the left, the input: two display names, and a wholesale order. [[slnc 700]]
On the right, the result. [[slnc 300]] Bold great is accepted: it is a valid name. [[slnc 300]] But it is still markup, so the page must encode it when it writes it out. [[slnc 500]] O'Brien is accepted too, and it has a quote in it. [[slnc 300]] So the database layer must bind it as a parameter, never paste it into the query. [[slnc 500]]
And the order of one hundred and fifty is refused by a limit of ninety nine. [[slnc 300]] A rule stricter than the business turns a customer away.
"""
speech = """
Here is the output. [[slnc 400]] Both display names are accepted, and each still needs its own defence: encoding in the page, and a parameter in the query. [[slnc 400]] A bad e-mail address gets an error message. [[slnc 300]] The message names the field and the rule, and does not repeat the input.
[[page]]
A wholesale order of one hundred and fifty is refused. [[slnc 300]] So each limit is a written business decision. [[slnc 400]] Validation narrows what reaches the code. [[slnc 300]] Encoding, parameters and access checks still do their own jobs.
"""
rows = { boundary = "active amber", types = "active amber" }
console = [
