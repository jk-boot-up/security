residual = "Covered by the cross-site-scripting project and by parameterized queries"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] Every value type follows the same plan: limit, check, and parse, or refuse. [[slnc 300]] Here are the classes that matter."""

[[class]]
name = "Checkout"
what = "the trust boundary for an order"
[[class.part]]
title = "only the expected fields"
code = """
for (String name : new TreeSet<>(fields.keySet())) {
    if (!FIELDS.contains(name)) {
        String shown = name.matches("[a-z]{1,20}") ? name : "a field";
        problems.add(new Rejected(shown, "not a field of this form"));
"""
speech = """The checkout knows its four fields. [[slnc 300]] Any other field, such as a hidden price, is a problem. [[slnc 300]] Every problem is collected, so the customer sees all of them at once."""
[[class.part]]
title = "the price comes from the catalogue"
code = """
price = Catalogue.price(sku).orElse(null);
...
BigDecimal total = price.multiply(BigDecimal.valueOf(quantity.value()));
return new Result(new Order(sku, quantity, email, country, total), List.of());
"""
speech = """The price is looked up by product code, never read from the form. [[slnc 300]] The total is that price times a Quantity that is already known to be good."""

[[class]]
name = "Quantity"
what = "a value type: parse the text, or refuse it"
[[class.part]]
title = "limit, check, then build"
code = """
String text = Text.bounded("quantity", raw, 3);
if (text.isEmpty() || !text.chars().allMatch(c -> c >= '0' && c <= '9')) {
    throw new Rejected("quantity", "digits only");
...
return new Quantity(value);
"""
speech = """First the length, before any other work. [[slnc 300]] Then digits only, then the range one to ninety nine. [[slnc 300]] Only then is a Quantity made, so a Quantity is always good."""

[[class]]
name = "Username"
what = "a login name in its one canonical form"
[[class.part]]
title = "hidden characters, canonical form, allow-list"
code = """
if (Text.hasControlOrFormat(text)) {
...
String canonical = Text.nfkc(text).strip().toLowerCase(Locale.ROOT);
if (!Text.asciiOnly(canonical) || !ALLOWED.matcher(canonical).matches()) {
"""
speech = """Control and invisible characters are refused first. [[slnc 300]] Then N F K C, strip and lower-case, with the root locale so the machine's language cannot change it. [[slnc 300]] Only the canonical text is checked against the allow list."""

[[class]]
name = "DisplayName"
what = "any script, but not a look-alike of the staff"
[[class.part]]
title = "compare by skeleton"
code = """
if (STAFF.contains(skeleton(nfc))) {
    throw new Rejected("display name", "reserved for the shop's staff");
"""
speech = """The skeleton replaces look-alike letters with the Latin letter they imitate. [[slnc 300]] If the skeleton is a staff name, the display name is refused."""

[[class]]
name = "Limits"
what = "sizes, checked before the work"
[[class.part]]
title = "read at most one byte more than the limit"
code = """
while (total <= MAX_BODY_BYTES) {
    int room = Math.min(buffer.length, MAX_BODY_BYTES + 1 - total);
    int n = in.read(buffer, 0, room);
...
throw new Rejected("body", "larger than " + MAX_BODY_BYTES + " bytes");
"""
speech = """The body is read in pieces, never past the limit plus one byte. [[slnc 300]] So a body of a million bytes costs the server only sixteen thousand to refuse."""

[[class]]
name = "Backtracking"
what = "a teaching model that counts a pattern's steps"
[[class.part]]
title = "try every split of the run"
code = """
for (int stop = end; stop > start; stop--) {
    steps += stop - start;
    ...
    boolean matched = stop == s.length() || group(s, stop);
"""
speech = """Each group takes as many a's as it can, then gives one back and tries again. [[slnc 300]] Every way to split the a's is tried, and each step is counted. [[slnc 300]] That is why the count doubles with each a."""

[[class]]
name = "Rejected"
what = "a refusal that never repeats the input"
[[class.part]]
title = "the field and the rule, nothing else"
code = """
super(field + ": " + rule);
"""
speech = """The message is the field and the rule. [[slnc 300]] The raw value is never in it, so it cannot forge a log line or put markup on an error page."""

