    "Regular-expression engine internals: the step counter shows the cost",
    "A validation library: the tools version uses Jakarta Validation",
]
install = []

[docs.session]
objectives = [
    "explain why checks in the page are not validation",
    "write a value type that parses instead of checking",
    "canonicalise text before comparing or checking it",
    "spot a regular expression that can take exponential time",
    "say what validation leaves to encoding, parameters and access checks",
]
walkthrough = """
Start with the concert tickets. Run the demo one act at a time. After act one, ask who wrote the hidden price. In act three, ask the group to spell ana in as many ways as they can. In act four,
ask how many characters would take a minute, and lead to why a length limit comes first.
"""
exercises = [
    "Add a postcode type whose rule depends on the country, and test it for two countries.",
    "Add a limit on the number of fields in a request and test a form with a thousand fields.",
    "Find a nested repetition in a real pattern you use, and rewrite it.",
    "Extend the look-alike table with three Greek letters and test that a staff name spelled with them is refused.",
]

[docs.explained]
sentence = """
Input validation decides at the server's trust boundary which values the code accepts, by parsing each value into a type with one allowed shape, after putting text into one canonical form and
after checking its size, while output encoding, query parameters and access checks stay responsible for their own jobs.
"""
verdict = """
Validate on the server, at every trust boundary. Parse into types with allow-lists, and report every problem at once. Normalise text before comparing it, and refuse invisible characters in names.
Limit every size before doing work, and keep patterns free of nested repetition. Never repeat raw input in an error, and write each rule down as a business decision.
"""
recognise = [
    "`@Valid`, `@Size` and `@Pattern` in Spring and Jakarta applications.",
    "Value objects such as `Money`, `EmailAddress` or `Sku` in well-kept domain models.",
    "`Normalizer.normalize` and confusable checks in account sign-up code.",
    "Request size limits in web servers and gateways.",
]

[spec]
purpose = """
Teach input validation by sending an online store's forms values the page never sends, in unusual spellings and at extreme sizes, first to code that trusts them and then to code that validates at the boundary.
"""
