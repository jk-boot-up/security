level = "intermediate"
module = "secure-coding"
title = "Secrets in Logs with Logback"
short_title = "Logs with Logback"
package = "logging"
main_class = "LoggingDemo"
tagline = "A log is a second database that nobody protects; make secrets unprintable first, cover the shapes you know second, and write events as data"
bold = "With Logback 1.6 and logstash-logback-encoder 9 a careless message puts the card, the cvv, the token and the database password in the file and lets a line break forge a second event; a masking layout and a masking JSON decorator cover the shapes they know (a card only if it passes Luhn), types that print as [REDACTED] or ****1111 need no masking at all, JSON keeps one event on one line, but a record is written as its fields, a mask never covers a shape it has not seen, and the log file stays data that needs an owner."
domain = "an online store"
domain_note = ""
youtube_description = "Logback 1.6 and logstash-logback-encoder 9 against a careless checkout log: card number, cvv, token and database password in the file, a forged second event from a line break, a layout with a mask converter and a masked exception converter, a Luhn check so that an order number is not taken for a card, a Secret and a Card that print safely, JSON events with a masking decorator by path and by shape, a record that leaks its fields, and a secret in a shape nobody listed."
thumb_lines = ["SECRETS IN LOGS", "WITH LOGBACK"]
