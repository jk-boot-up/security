[[act]]
title = "Make the secret unprintable"
summary = "A CheckoutRequest made of a Card and a Secret logs as card=****1111, cvv=[REDACTED] through a plain layout with no masking; reveal() gives 737 only where the value is used; a library's exception is logged by class with ref-0001."
detail = """
The input is what the code holds: name "Ana", new Card("4111111111111111"), new Secret("737") and order 1042.
How each one prints: a Card's toString is ****1111 (the last 4 of 16 digits), a Secret's toString is [REDACTED], and reveal() gives 737, only where the value is used.
The result, through the plain layout %level %msg%n with no masking: CheckoutRequest[name=Ana, card=****1111, cvv=[REDACTED], order=1042], and the token as [REDACTED]. A library's exception carries whatever the library put in its message, so it is logged by class, SQLException, with the reference ref-0001.
"""
figure = "types_print"
figure_title = "Types that print safely"
figure_speech = """
Third demo: make the secret unprintable. [[slnc 400]] On the left, the input: what the code holds. [[slnc 300]] A name, a Card with the full number, a Secret with the C V V, and the order number. [[slnc 700]]
On the right, how each one prints. [[slnc 300]] A Card's to string method gives four stars and the last four digits. [[slnc 300]] A Secret's to string gives redacted. [[slnc 300]] Only reveal gives the value, and only the code that needs it calls it. [[slnc 700]]
At the bottom, the result: the log file, through a plain layout, with no masking at all. [[slnc 300]] Nothing to mask, because the secret never reached the line. [[slnc 300]] And the library's exception is logged by its class name and a reference, never by its message.
"""
speech = """
The input: a name, a card, a secret and an order. [[slnc 300]] How each one prints: the card as its last four digits, the secret as redacted. [[slnc 300]] reveal gives seven three seven, only where it is used.
