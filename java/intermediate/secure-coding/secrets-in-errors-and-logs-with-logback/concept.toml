[[scene]]
key = "01-poster"
kind = "poster"
title = "Secrets in Logs with Logback"
narration = "Hello, and welcome. [[slnc 400]] This video explains keeping secrets out of logs with Logback, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A log is a second database that nobody protects. [[slnc 300]] With Logback, a careless message puts the card, the security code, the token and the database password in the file. [[slnc 300]] The fix comes in three layers: make secrets unprintable first, mask the shapes you know second, and write each event as data, on one line. [[slnc 600]] Think of a till receipt that prints only the last four digits of a card, because the full number was never sent to the printer. [[slnc 600]] Our example is an online store."

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online store logs its checkout.", "", "The demo writes the same three events", "four ways, with Logback and", "logstash-logback-encoder,", "and reads what each way leaves in the file.", "", "Every value is fake."]
narration = "Here is the scenario. [[slnc 400]] An online store logs its checkout. [[slnc 500]] The demo writes the same three events four ways: carelessly, with masks in the layout, with types that cannot print, and as structured J S O N. [[slnc 500]] It uses Logback and the logstash encoder, writes into memory, and reads exactly what each way leaves behind. [[slnc 300]] Every card, token and password is fake."

[[scene]]
key = "02-words"
kind = "bullets"
title = "The Words"
body = ["Layout: turns a log event into a line of text", "Conversion word: a %name in the layout", "Masking: covering a secret in text that was written", "Structured log: an event as named fields", "Canary: a known fake secret, searched for by a test", "Log injection: a line break that forges a line"]
narration = """Before the demos, the words. [[slnc 500]] A layout turns a log event into a line of text. [[slnc 500]] A conversion word is a name with a percent sign in the layout, like percent level or percent message. [[slnc 500]] Masking covers a secret in text that was already written. [[slnc 500]] A structured log writes each event as named fields, here as J S O N. [[slnc 500]] A canary is a known fake secret, sent through on purpose, so a test can search for it. [[slnc 500]] And log injection is a line break in a value, which forges an extra log line."""

[[scene]]
key = "02-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "02-four-ways"
kind = "figure"
title = "One card number, four ways"
body = "four_ways"
narration = """Let's see the core idea on one example: one card number, logged four ways. [[slnc 400]] At the top, the input: the test card, four one one one, and twelve more digits. [[slnc 700]]
First, a plain layout writes it as it is, in red. [[slnc 300]] Second, the mask in the layout recognises its shape and covers it. [[slnc 300]] Third, a Card type prints only its last four digits, so there is nothing to mask. [[slnc 300]] Fourth, a J S O N event with the masking decorator covers it by its field path. [[slnc 700]]
Three of the four ways keep the number out of the file. [[slnc 300]] But only the type works without knowing what a card looks like. [[slnc 300]] That is the order of defence in this video: make it unprintable first, and mask as a safety net."""

[[scene]]
key = "03-acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "04-costs"
kind = "bullets"
title = "What It Costs"
body = ["A mask is a guess about shapes", "Unprintable types need discipline", "JSON logs need a pipeline that reads JSON", "Records are written as their fields", "Every log line is data you keep"]
narration = "Nothing is free. [[slnc 400]] Here is what it costs. [[slnc 500]] A mask is a guess about the shapes of secrets, and some will not match. [[slnc 500]] Types that cannot print need discipline, everywhere a secret is held. [[slnc 500]] J S O N logs need a log pipeline that reads J S O N. [[slnc 500]] Records and beans are written as their fields, not as their text, so their fields leak. [[slnc 300]] And every log line is data you keep, and must protect."

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["A toString() that prints every field", "A full card number in a log search", "A masking decorator in a Logstash encoder", "Two log lines where one event happened"]
narration = "You have probably met this already. [[slnc 400]] A to string method that prints every field is how most secrets reach a log. [[slnc 500]] A full card number, found by a log search, is the first demo. [[slnc 500]] A masking decorator, in a logstash encoder's configuration, is the net from the fourth demo. [[slnc 500]] And two log lines where only one event happened is a line break, forging an entry."

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Do not log secrets", "Give them types that cannot print", "Mask the shapes you know, as a net", "One event per line, as JSON", "Test the net with your own fake secrets", "Every log: an owner and an end date"]
narration = "So, how do you use it? [[slnc 400]] Do not log secrets at all. [[slnc 300]] Give them types that cannot print. [[slnc 500]] Mask the shapes you know, as a safety net. [[slnc 300]] Write events as J S O N, so a line break stays inside one line. [[slnc 500]] Test the net with fake secrets of your own. [[slnc 300]] And give every log an owner, and an end date."

