[readme]
intro = """
The plain [secrets-in-errors-and-logs](../secrets-in-errors-and-logs) project writes its own redactor and its own logger. This one uses **Logback 1.6** and **logstash-logback-encoder 9** (JSON events, masking), configured in code, writing into memory so that the output can be compared. It needs no server and no tool beyond Gradle; the demo takes a couple of seconds.

What it shows:
- **What the log keeps.** A careless message: the card, the cvv and the token in a map, the database password in an exception message, and a customer name with a line break that **forges a second event** (4 lines from 3 events).
- **Covering shapes in the layout.** A `%mask` conversion word and a `%maskedEx` word (class and message of the exception and its causes, no frames). A card is covered only if it passes the **Luhn** check, so a 16-digit order number is left alone; the line break becomes `\\n`.
- **Make the secret unprintable.** `Secret` prints `[REDACTED]`, `Card` prints `****1111`, a `CheckoutRequest` record made of them prints safely under a plain layout. An exception from a library is logged by class, with a reference.
- **Structured logs.** JSON events keep a line break inside one line; a record is written as its **fields**, not its `toString` (`PlainCard` leaks `number`, `Card` with `@JsonValue` does not); path masks and a value masker cover the rest.
- **The bill.** A pin, a code word and an SSN in free text are in shapes nobody listed; a log file needs an owner, a retention and a level.

**Maps to:** OWASP Top 10 (2025) A09 Security Logging and Alerting Failures · CWE-532 (sensitive information in a log file), CWE-209, CWE-117 (improper output neutralization for logs).
"""
analogy = """
A shop's till roll. If it prints the whole card number, anyone who finds the roll in the bin has it. A till that cannot print the number, because the number never reaches the printer, is safer than a till with a person who blacks out what they recognise.
"""
scenario = """
An online store logs its checkout. The demo writes the same three events four ways and reads what each way leaves in the file.
"""
costs = [
    "**A mask is a guess about shapes,** and secrets arrive in shapes nobody listed.",
    "**Types that cannot print need discipline,** and a library's own exception message is outside them.",
    "**JSON logs need a pipeline that reads JSON.**",
    "**Records and beans are written as fields,** which is not what their toString says.",
    "**Every log line is retained data:** it needs an owner and an end date.",
]
too_much = """
A throwaway script that nobody else reads does not need structured logging or masking. Add them when logs leave the machine: to a file others can read, to a central service, to a vendor.
"""
met_before = [
    "`logback.xml` with a pattern and a rolling file.",
    "A `toString()` generated by an IDE that prints every field.",
    "A log line that says \"user=... password=...\" from a debugging session.",
    "A log search that shows a stranger's name.",
]
where = """
This is the tools version of [secrets-in-errors-and-logs](../secrets-in-errors-and-logs), in the [secure-coding](..) module. Where such logs are shipped and searched is the subject of [security-logging-with-loki-and-grafana](../../detection-and-response/security-logging-with-loki-and-grafana).
"""
twin = """
Logback and the Logstash encoder are the real libraries; each case has a logger context of its own that writes into memory. Times and thread names are left out of the lines so that the output is the same on every run.
"""
test_note = "The tests run the real Logback and need no other tool."

[[act]]
title = "What the log keeps"
summary = "A careless message puts the card, the cvv, the token and the database password in the file, and a line break forges a second event."
detail = """
Three events written with a plain layout: a map of the request with the card number and the cvv, and a token; an exception from the driver whose message holds the database URL with its password; and a customer name with a line break. The file holds the card, the cvv, the token and the password, and the forged line: 4 lines from 3 events. The log is a second database that nobody protects.
"""
speech = """
First demo: what the log keeps. [[slnc 400]] The card, the cvv, the token and the database password are all in the file. [[slnc 600]]
And a customer name with a line break writes a second event of its own.
"""
rows = { keeps = "active wrong" }
console = [
    ["card=4111 1111 1111 1111, cvv=737, token=eyJ...", "bad"],
    ["password=s3cr3t-db-password in the exception message", "bad"],
    ["a line break in a name: 4 lines from 3 events", "bad"],
]

[[act]]
title = "Covering the shapes of secrets in the layout"
summary = "A %mask conversion word and a %maskedEx word cover what they recognise; a card only if it passes Luhn; a line break becomes \\n."
detail = """
The same three events through %mask and %maskedEx: the card becomes [CARD ****1111], the cvv and the token [REDACTED], the database password in the exception is covered and the exception is written as class and message only. A 16-digit order number that fails the Luhn check is left alone. The line break in the forged name became the two characters \\n: one event is one line.
"""
speech = """
Second demo: covering the shapes of secrets in the layout. [[slnc 400]] A mask converter and a masked exception converter. [[slnc 600]]
A card is covered only if it passes the Luhn check, so an order number is left alone. [[slnc 300]] A line break becomes two characters, and one event stays one line.
"""
rows = { mask = "active ok" }
console = [
    ["card=[CARD ****1111], cvv=[REDACTED], token=[REDACTED]", "ok"],
    ["order 4111111111111112 is left alone (fails Luhn)", "ok"],
    ["the forged line is one line with \\n in it", "ok"],
]

[[act]]
title = "Make the secret unprintable"
summary = "Types that print as [REDACTED] and ****1111 need no mask at all, and a library's exception is logged by class with a reference."
detail = """
A CheckoutRequest made of a Card and a Secret prints as CheckoutRequest[name=Ana, card=****1111, cvv=[REDACTED], order=1042] under a plain layout, with no masking. The value is read where it is used, by name, and a search for reveal( finds every place that does. An exception from a library carries whatever the library put in its message, so it is logged by class, with a reference, or through %maskedEx.
"""
speech = """
Third demo: make the secret unprintable. [[slnc 400]] A card prints as the last four digits. A secret prints as redacted. [[slnc 600]]
There is nothing to mask, because the value never reaches the line. [[slnc 300]] An exception from a library is logged by class, with a reference.
"""
rows = { types = "active ok" }
console = [
    ["CheckoutRequest[name=Ana, card=****1111, cvv=[REDACTED], order=1042]", "ok"],
    ["token [REDACTED] with no mask configured", "ok"],
    ["library exceptions: by class, with a reference", "ok"],
]

[[act]]
title = "Structured logs"
summary = "JSON events keep a line break inside one line; a record is written as its fields; path masks and a value masker cover the rest."
detail = """
JSON events from logstash-logback-encoder: fields are data, a line break in a value is escaped, so the forged name stays one event of one line. A record is written as its fields, not as its toString: PlainCard leaks number and holder, while a Card with @JsonValue is written as ****1111. The masking decorator covers /cvv and /card/number by path and the shapes of secrets in any string, including the exception message.
"""
speech = """
Fourth demo: structured logs. [[slnc 400]] An event is one line of Jason, and a line break in a value is escaped. [[slnc 600]]
A record is written as its fields, so it leaks. [[slnc 300]] Path masks and a value masker cover what is left.
"""
rows = { json = "active ok" }
console = [
    ["a forged name stays one JSON line", "ok"],
    ["PlainCard: number and holder in the JSON", "bad"],
    ["/card/number and /cvv masked; the password in the message too", "ok"],
]

[[act]]
title = "The bill"
summary = "A pin, a code word and an SSN in free text are in shapes nobody listed; the file needs an owner, a retention and a level."
detail = """
A customer says: my pin is 4921 and the code is hunter2, ssn 078-05-1120. A mask cannot cover what it has never seen. So the order of defence is: do not log it, make it unprintable, then cover the shapes you know, and test the last one with the secrets you really have. A log file is data: who can read it, how long it is kept, who can delete a person from it and where it is copied are decisions. Debug logging in production is a second logging policy.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] A pin, a code word, a social security number in free text: no mask knew those shapes. [[slnc 600]]
Do not log it. Make it unprintable. Then cover the shapes you know.
"""
rows = { bill = "active wrong" }
console = [
    ["pin 4921, code hunter2, ssn 078-05-1120: not covered", "bad"],
    ["do not log it; make it unprintable; then mask", "ok"],
    ["a log file needs an owner, a retention and a level", "ok"],
]

