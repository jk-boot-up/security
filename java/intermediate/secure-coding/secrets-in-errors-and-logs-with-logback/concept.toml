narration = "That's secrets in logs, with Logback. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Whatever reaches a log line stays there, so the safest secret is one that never reaches it. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a conversion word that hashes the user id, instead of printing it. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] Logback and the logstash encoder do the writing. [[slnc 300]] Our classes decide what reaches the line."""

[[class]]
name = "LogSetup"
what = "configures Logback in code, writing into memory"
[[class.part]]
title = "our own conversion words"
code = '''
layout.setPattern(pattern);
layout.getInstanceConverterMap().put("mask", MaskConverter::new);
layout.getInstanceConverterMap().put("maskedEx", MaskedThrowableConverter::new);
'''
speech = """A pattern layout learns two new conversion words: percent mask and percent masked ex. [[slnc 300]] Each one names a converter class that turns an event into text."""

[[class]]
name = "MaskConverter"
what = "%mask: the message, masked, on one line"
[[class.part]]
title = "mask, then escape line breaks"
code = '''
public String convert(ILoggingEvent event) {
    return Masker.mask(event.getFormattedMessage())
            .replace("\r", "\\r").replace("\n", "\\n");
'''
speech = """The converter masks the formatted message. [[slnc 300]] Then it writes every line break as backslash n, so one event is always one line."""

[[class]]
name = "Masker"
what = "finds the shapes of secrets, and covers them"
[[class.part]]
title = "patterns, then cards"
code = '''
out = URL_PASSWORD.matcher(out).replaceAll("$1[REDACTED]$3");
out = BEARER.matcher(out).replaceAll("$1[REDACTED]");
out = JWT.matcher(out).replaceAll("[REDACTED]");
out = PAIR.matcher(out).replaceAll("$1[REDACTED]");
out = cards(out);
'''
speech = """The masker runs its patterns one after the other: a password in a U R L, a bearer token, a J W T, and values named password, key, token or C V V. [[slnc 300]] Then it looks for card numbers."""
[[class.part]]
title = "a card only if Luhn passes"
code = '''
String cover = luhn(digits)
        ? "[CARD ****" + digits.substring(digits.length() - 4) + "]" : m.group();
...
return IntStream.of(luhnSteps(digits)).sum() % 10 == 0;
'''
speech = """A long run of digits is covered only if its Luhn sum ends in zero. [[slnc 300]] So the order number is left alone."""

[[class]]
name = "Secret and Card"
what = "types that print safely"
[[class.part]]
title = "toString and @JsonValue"
code = '''
public String toString() {
    return "[REDACTED]";
}
...
@JsonValue
public String masked() {
    return "****" + number.substring(number.length() - 4);
'''
speech = """A Secret's to string is always redacted. [[slnc 300]] A Card prints its last four digits, and the J S O N value annotation makes J S O N use the same text."""

[[class]]
name = "LoggingDemo.masking"
what = "the masking decorator for JSON events"
[[class.part]]
title = "by path, and by shape"
code = '''
mask.addPath("/cvv");
mask.addPath("/card/number");
mask.addValueMasker((context, value) -> {
'''
speech = """The decorator covers two fields by their path in the J S O N. [[slnc 300]] And a value masker runs the same Masker over every string, so the password in an exception's message is covered too."""

