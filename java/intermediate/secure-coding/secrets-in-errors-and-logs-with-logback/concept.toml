[[act]]
title = "Covering the shapes of secrets in the layout"
summary = "The same three calls through %mask and %maskedEx write 3 lines with no fake secret left; a card is covered only when the Luhn sum ends in 0 (30 for the card, 31 for the order number)."
detail = """
The input is the same three log calls. The result, through the layout %level %mask%maskedEx%n: 3 lines; the card is [CARD ****1111], the CVV, the token and the database password are [REDACTED], and the forged name stays on line 3 with its line break written as \\n. The canary search finds nothing.
Before and after masking: in "charge 4111 1111 1111 1111 for order 4111111111111112" only the card is covered; password=, api_key and Bearer values are covered by name and shape.
How the Luhn check is made: from the right every second digit is doubled (9 taken off a result over 9) and all are added. 4111111111111111 gives 30, which ends in 0: a card. 4111111111111112 gives 31: not a card.
"""
figure = "mask_layout"
figure_title = "The same events, masked in the layout"
figure_speech = """
Second demo: covering the shapes of secrets in the layout. [[slnc 400]] The input is the same three log calls. [[slnc 300]] The layout now has two conversion words of our own: mask, for the message, and masked ex, for the exception. [[slnc 700]]
At the top, the result. [[slnc 300]] The card is covered, showing only its last four digits. [[slnc 300]] The C V V, the token and the password are redacted, in green. [[slnc 300]] The forged name stays on one line, with the line break written as backslash n. [[slnc 300]] The canary search finds nothing. [[slnc 700]]
At the bottom, how the mask tells a card from an order number: the Luhn check. [[slnc 300]] From the right, every second digit is doubled. [[slnc 300]] For the card, the sum is thirty, which ends in zero: a card. [[slnc 300]] For the order number, it is thirty one: not a card, so it is left alone.
"""
