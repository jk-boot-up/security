[[act]]
title = "Structured logs"
summary = "As JSON, the forged name stays inside one line as \\n; a PlainCard record is written as its fields (the full number) while a Card with @JsonValue is ****1111; the masking decorator covers /cvv and /card/number by path and the password in the exception by shape."
detail = """
The input is the forged name and a charge with order and amount fields, written as JSON events by logstash-logback-encoder. The result: one line per event; the line break in the name is escaped as \\n inside the message string, and the fields are data.
A record is written as its fields, not as its toString: PlainCard gives "number":"4111111111111111" and "holder":"Ana", and the cvv 737. A Card with @JsonValue is written as "****1111".
After the masking decorator (paths /cvv and /card/number, and a value masker for shapes): the number and the cvv are "[REDACTED]", and the password in the exception's message is [REDACTED].
"""
figure = "json_events"
figure_title = "Events as data"
figure_speech = """
Fourth demo: structured logs. [[slnc 400]] Each event is written as one line of J S O N, with named fields. [[slnc 700]]
At the top, the forged name. [[slnc 300]] Inside a J S O N string, a line break must be escaped, so it is written as backslash n, in amber. [[slnc 300]] One event is one line, whatever the customer types. [[slnc 700]]
In the middle, a trap. [[slnc 300]] A Java record is written as its fields, not as its to string. [[slnc 300]] So PlainCard puts the full card number in the log, in red. [[slnc 300]] A Card with the J S O N value annotation is written as its last four digits. [[slnc 700]]
At the bottom, the masking decorator. [[slnc 300]] It covers the card number and the C V V by their paths, and the password in the exception's message by its shape.
"""
speech = """
The forged name as J S O N: one line, with the line break escaped. [[slnc 300]] The charge has its order and amount as fields. [[slnc 400]] A record as J S O N: PlainCard writes the full number and the C V V. [[slnc 300]] Card writes four stars and the last four digits.
[[page]]
After the masking decorator: the number and the C V V are redacted by path. [[slnc 300]] And the password in the exception's message is redacted by its shape.
"""
