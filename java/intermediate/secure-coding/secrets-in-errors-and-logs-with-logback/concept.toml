    "Add a conversion word that hashes the user id instead of printing it.",
    "Add a path mask for an address field.",
    "Write a test that fails when a Secret reaches a log line through string concatenation.",
    "Put the JSON events in a file and search them for a card number.",
]

[docs.explained]
sentence = """
Whatever reaches a log line stays there, so the safest secret is one that never reaches it.
"""
verdict = """
Do not log secrets, give them types that cannot print, cover the shapes you know as a net, write events as data that keeps a line break inside one line, test the net with your own secrets, and give every log an owner and an end date.
"""
recognise = [
    "`logger.info(\"... {}\", request)` with a request object.",
    "A `toString()` that prints every field.",
    "A `%msg` pattern in `logback.xml`.",
    "A `MaskingJsonGeneratorDecorator` in a Logstash encoder.",
]

[spec]
purpose = """
Teach keeping secrets out of Logback logs with types, masking and structured events.
"""
nongoals = [
    "Shipping or searching logs.",
    "Log retention tooling.",
    "Audit logging requirements.",
]
problem = """
Logs are written freely, read widely and kept for long, so what is written in them is exposed.
"""
