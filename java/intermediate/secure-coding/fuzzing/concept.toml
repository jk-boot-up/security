    "Bytecode instrumentation: the branch counters are written by hand",
]
install = []

[docs.session]
objectives = [
    "explain what a fuzzer finds that example tests do not",
    "write a harness that separates expected refusals from crashes",
    "explain why coverage guidance reaches deeper code than blind mutation",
    "shrink a crash to its smallest input and keep it as a regression test",
    "say what fuzzing cannot find",
]
walkthrough = """
Start with the new employee and the till. Run the demo one act at a time. After act two, ask what kind of input each crash needed. In act three, ask why matching one letter at a time
helps the fuzzer, and what a compiled string comparison does instead. In act five, ask which test would catch the quantity of -5.
"""
exercises = [
    "Add a third parser, for a discount code such as SAVE-10, write its harness, and fuzz it.",
    "Remove the letter-by-letter comparison in isNote and see how many runs the guided fuzzer needs now.",
    "Add a dictionary mutation that inserts known field names, and compare the run at which the gift-message bug is found.",
    "Turn the quantity of -5 into a property: every parsed quantity is between 1 and 99, and fuzz until it breaks.",
]

[docs.explained]
sentence = """
Fuzzing runs a program on large numbers of mutated inputs, keeps the ones that reach new code, and records every failure other than an expected refusal, so that each crash can be shrunk to its smallest input, fixed and kept as a regression test.
"""
verdict = """
Fuzz every parser that reads outside input. Write one harness per parser that treats only the parser's own refusal as expected. Keep stack traces, seed the fuzzer from real inputs, and let coverage
guide it. Shrink every crash, keep the smallest input as a test, fix the cause, and fuzz again. Give every build a budget of runs, run longer at night, and use properties to catch wrong answers as well as crashes.
"""
recognise = [
    "`@FuzzTest` methods and Jazzer in Java projects.",
    "OSS-Fuzz badges and \"found by fuzzing\" in advisories.",
    "A `corpus` folder of interesting inputs next to a test.",
    "Regression tests named after a crash, with a strange-looking input.",
]

