    { id = "parser", label = "Parser", sub = "instrumented", col = 2, row = 0, colour = "client" },
    { id = "oracle", label = "Oracle", sub = "only ParseException is allowed", col = 3, row = 0, colour = "amber" },
]
edges = [
    { from = "corpus", to = "mutate" },
    { from = "mutate", to = "parser", label = "input" },
