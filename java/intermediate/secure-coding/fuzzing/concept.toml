[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] The fuzzer is about a hundred lines, and the parsers carry their own bugs. [[slnc 300]] Here are the lines that matter."""

[[class]]
name = "Fuzzer"
what = "changes seed inputs, runs a parser, keeps what is new"
[[class.part]]
title = "one change: flip a bit"
code = """
char c = text.charAt(at);
text.setCharAt(at, (char) ((c ^ (1 << random.nextInt(7))) & 0x7f));
"""
speech = """One kind of change flips a single bit of one character. [[slnc 300]] The others insert, delete or replace a character, swap a number for a boundary value, or nest brackets."""
[[class.part]]
title = "a crash is anything but a refusal"
code = """
} catch (ParseException expected) {
    return new Outcome(coverage, null, false);
} catch (RuntimeException | StackOverflowError bug) {
    return new Outcome(coverage, bug, false);
"""
speech = """A parse exception is the parser refusing the input, which is fine. [[slnc 300]] Any other exception, or a stack overflow, is a crash, and the fuzzer records it."""
[[class.part]]
title = "guided: keep an input that reached a new branch"
code = """
if (outcome.coverage().addsTo(seen)) {
    List<Integer> fresh = outcome.coverage().newBranches(seen);
    seen.or(outcome.coverage().hits());
    if (guided) {
        corpus.add(input);
"""
speech = """If the run reached a branch no earlier run reached, the branch is added to the seen set. [[slnc 300]] Guided, the input is also kept, and later runs change it further."""

[[class]]
name = "Coverage"
what = "the branches one run reached"
[[class.part]]
title = "a counter per branch"
code = """
void hit(int branch) {
    hits.set(branch);
}
"""
speech = """Each interesting branch of a parser calls hit with its own number. [[slnc 300]] Here this is done by hand. [[slnc 300]] Jazzer adds the same counters to the bytecode by itself."""

[[class]]
name = "CartParser"
what = "the cart format, with the gift-message bug"
[[class.part]]
title = "one letter, one branch"
code = """
for (int i = 0; i < NOTE.length(); i++) {
    if (i >= key.length() || key.charAt(i) != NOTE.charAt(i)) {
        return false;
    }
    coverage.hit(50 + i);
"""
speech = """The field name is compared with note one letter at a time, as compiled code does. [[slnc 300]] Each letter that matches reaches a new branch. [[slnc 300]] That is what guidance follows."""
[[class.part]]
title = "the bug: no colon"
code = """
int colon = note.indexOf(':');
if (careful && colon < 0) {
    throw new ParseException("a gift message is #to:message");
}
String to = note.substring(1, colon);
"""
speech = """With no colon, index of returns minus one. [[slnc 300]] The careless version goes on to substring, which throws. [[slnc 300]] The fixed version refuses the message first."""

[[class]]
name = "OrderLine"
what = "one order import line, careless and fixed"
[[class.part]]
title = "the overflow, and its fix"
code = """
int total = quantity * unit;
...
long total = Math.multiplyExact((long) quantity, (long) unit);
"""
speech = """The careless version multiplies two ints, so a big total wraps round to a negative one. [[slnc 300]] The fixed version checks the ranges, and multiplies in a long, with an exact check."""

[[class]]
name = "Minimizer"
what = "delta debugging: the smallest input that still crashes"
[[class.part]]
title = "remove a piece, keep it if it still crashes"
code = """
String candidate = current.substring(0, start)
        + current.substring(Math.min(current.length(), start + size));
if (sameCrash(harness, candidate, signature)) {
    current = candidate;
"""
speech = """Remove one piece of the input. [[slnc 300]] If it still crashes with the same signature, keep the smaller input. [[slnc 300]] Pieces get smaller until no single character can go."""

[[class]]
name = "Crash"
what = "names a failure, so each bug is counted once"
[[class.part]]
title = "type and place"
code = """
return failure.getClass().getSimpleName() + " in " + where;
"""
speech = """A crash is named by its exception type and the parser method it happened in. [[slnc 300]] The same bug found again is not counted twice."""

