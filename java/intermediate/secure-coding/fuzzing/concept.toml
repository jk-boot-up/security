[[act]]
title = "A mutation fuzzer"
summary = "From 2 seeds each, 20000 runs find a missing-field crash at run 86 and an overflow at run 548 in the order parser, and 100000 runs find a stack overflow from deep nesting at run 1223 in the cart parser."
detail = """
The fuzzer flips bits, inserts, deletes and replaces characters, swaps numbers for boundary values and nests brackets deeply, with random numbers from L64X128MixRandom and seed 7, so every run finds the same crashes in the same order.
In 20000 runs from 2 seed inputs, the order parser shows 2 distinct crashes: at run 86 an ArrayIndexOutOfBoundsException from "SHO-1042,28990", a line missing its comma, and at run 548 an IllegalArgumentException
from "BAG-0007,999999999,4500", where the quantity times the price overflows an int into a negative total. In 100000 runs the cart parser shows 1 distinct crash: at run 1223 a StackOverflowError from an input of
200039 characters starting with a wall of opening brackets. Each crash is a bug the example tests missed, found without anyone guessing the input.
"""
speech = """
Second demo: a mutation fuzzer. [[slnc 400]] It starts from two real inputs for each parser. [[slnc 300]] It flips bits, inserts and deletes characters, swaps numbers for boundary values, and nests brackets deeply. [[slnc 600]]
Its random numbers come from a fixed seed. [[slnc 300]] So every run finds the same crashes, in the same order. [[slnc 600]]
In twenty thousand runs, the order parser crashes in two ways. [[slnc 300]] A line missing its comma. [[slnc 300]] And a quantity so large that the total overflows, and turns negative. [[slnc 600]]
The cart parser overflows its stack on brackets nested two hundred thousand deep. [[slnc 600]]
Each one is a bug the example tests missed, and nobody had to guess the input.
"""
rows = { blind = "active ok" }
