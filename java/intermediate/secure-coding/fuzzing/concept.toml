Fifth demo: what fuzzing does not find. [[slnc 400]] The input is a cart with a quantity of minus five. [[slnc 300]] The fixed parser reads it without any trouble. [[slnc 300]] The result is parsed. [[slnc 300]] No crash, so the fuzzer reports nothing. [[slnc 700]]
Whether minus five is allowed is a business rule. [[slnc 300]] A fuzzer cannot know that. [[slnc 300]] It finds crashes, and broken properties, not wrong decisions. [[slnc 700]]
