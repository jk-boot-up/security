[[act]]
title = "Guided by coverage"
summary = "Blind, 100000 runs reach 14 branches and never find the gift-message bug. Guided, the fuzzer keeps 8 inputs that reached new branches, matching n, no, not, note one letter at a time, reaches 18 branches and finds the bug at run 49776: indexOf(':') is -1, so substring(1, -1) throws."
detail = """
The gift-message bug needs a field named note and a value starting with #. Blind, the fuzzer always changes a seed and keeps nothing: in 100000 runs it reaches 14 branches and never finds the bug.
Guided by coverage, it keeps every input that reaches a branch no earlier input reached: a comma in a list at run 1162, an escape at 1486, an empty object at 2142, an empty list at 3251, then "n" matched at run 21497, "no" at 23783, "not" at 24448 and "note" at 47709. That is 18 branches and 10 inputs kept (2 seeds and 8 new).
At run 49776 the input [{"note":"#AG-0007","qty"1}] crashes. How: the note is "#AG-0007", indexOf(':') is -1, and substring(1, -1) throws a StringIndexOutOfBoundsException in CartParser.giftMessage.
"""
figure = "letter_by_letter"
figure_title = "Guidance keeps each input that matches one more letter"
figure_speech = """
Third demo: guided by coverage. [[slnc 400]] One bug hides behind a field named note, with a value that starts with a hash. [[slnc 300]] Blind, the fuzzer changes a seed and forgets the result. [[slnc 300]] It would need four right letters, all at once. [[slnc 300]] In a hundred thousand runs, it never gets there. [[slnc 700]]
Guided, the fuzzer keeps every input that reaches a new branch. [[slnc 300]] The parser compares the field name one letter at a time, so each letter that matches is a new branch. [[slnc 300]] At run twenty one thousand, n matches. [[slnc 300]] Then n o, then n o t, then note. [[slnc 300]] Each kept input is the starting point for the next. [[slnc 600]]
At run forty nine thousand, seven hundred and seventy six, the value starts with a hash, and the parser crashes. [[slnc 300]] On the right: blind reached fourteen branches, guided reached eighteen.
"""
speech = """
The target: a field named note, and a value starting with a hash. [[slnc 300]] Blind, a hundred thousand runs: fourteen branches, and the bug is not found.
[[page]]
Guided: the inputs kept, each with the branch it reached first. [[slnc 300]] A comma in a list, an escape, an empty object, an empty list. [[slnc 300]] Then the field name, letter by letter. [[slnc 400]] Eighteen branches, ten inputs kept. [[slnc 300]] Found at run forty nine thousand, seven hundred and seventy six.
[[page]]
How the crash is made. [[slnc 300]] The note is hash A G dash zero zero zero seven. [[slnc 300]] It has no colon, so index of colon is minus one. [[slnc 300]] And substring from one to minus one throws an exception.
"""
