[[act]]
title = "A mutation fuzzer"
summary = "Six kinds of change, one or two per run, from seeded random numbers. From 2 seeds, 20000 runs find a missing-field crash at run 86 and an int overflow at run 548 (999999999 x 4500 wraps to -1125730708); 100000 runs find a stack overflow at run 1223."
detail = """
The fuzzer changes a seed input in one or two ways per run: it flips one bit, inserts, deletes or replaces a character, swaps a number for a boundary value (0, 1, 99, 100, 999999999, 2147483647, -1), or inserts 200000 opening brackets. Its random numbers come from L64X128MixRandom with seed 7, so every run is the same.
The first six runs show the input before and after the change; all six are refused. A flipped bit can make an invisible control character, printed as \\x10.
In 20000 runs the order parser crashes twice: at run 86 an ArrayIndexOutOfBoundsException from "SHO-1042,28990", a line missing its comma, and at run 548 an IllegalArgumentException in Money from "BAG-0007,999999999,4500".
The overflow worked out: 999999999 x 4500 = 4499999995500; an int keeps the low 32 bits, 4499999995500 - 1047 x 4294967296 = 3169236588, and read as a signed int that is 3169236588 - 4294967296 = -1125730708, a negative total that Money refuses.
In 100000 runs the cart parser overflows its stack at run 1223, on 200039 characters that start with opening brackets.
"""
figure = "first_runs"
figure_title = "How the inputs are made, and how a total overflows"
figure_speech = """
Second demo: a mutation fuzzer. [[slnc 400]] On the left, the first six runs. [[slnc 300]] Each one takes a seed, makes one or two small changes, and runs the parser. [[slnc 300]] Replace a character, flip a bit, delete one, or swap a number for a boundary value. [[slnc 300]] All six are refused, which is fine. [[slnc 700]]
Twenty thousand runs later, two crashes. [[slnc 300]] At run eighty six, a line missing its comma. [[slnc 300]] At run five hundred and forty eight, a huge quantity. [[slnc 700]]
On the right, how that overflow is made. [[slnc 300]] The exact total is about four and a half trillion cents. [[slnc 300]] An int keeps only thirty two bits. [[slnc 300]] So the parser keeps the remainder after whole multiples of two to the thirty two. [[slnc 300]] Read as a signed int, that is minus one billion, one hundred and twenty five million. [[slnc 300]] A negative total, which the money class refuses with an exception.
"""
speech = """
Here are the changes the fuzzer can make. [[slnc 300]] Flip one bit, insert, delete or replace a character. [[slnc 300]] Swap a number for a boundary value, like zero, ninety nine, or the largest int. [[slnc 300]] Or nest two hundred thousand brackets. [[slnc 300]] Its random numbers come from a fixed seed, seven, so every run is the same.
[[page]]
The first six runs: the change, and the input after it. [[slnc 300]] A flipped bit can make an invisible character, so it is printed as backslash x one zero. [[slnc 300]] All six are refused.
[[page]]
The crashes in the order lines. [[slnc 300]] Run eighty six: the missing comma. [[slnc 300]] Run five hundred and forty eight: the overflow. [[slnc 400]] Then how the overflow is made, step by step, ending at a negative number. [[slnc 300]] Money refuses it, and that exception is the crash.
[[page]]
And the carts: at run twelve twenty three, the parser overflows its stack, on two hundred thousand opening brackets.
"""
rows = { blind = "active ok" }
console = [
    ["THE MUTATIONS (1 or 2 per run):", "code"],
    ["  flip      one bit of one character", "muted"],
    ["  insert    a random character", "muted"],
    ["  delete    one character", "muted"],
    ["  replace   one character by a random one", "muted"],
    ["  number    a number becomes 0 1 99 100 999999999 2147483647 -1", "muted"],
