[[act]]
title = "From crash to fix"
summary = "Delta debugging shrinks the gift-message crash from 28 characters to 11, {\"note\":\"#\", in 7 steps; the four smallest inputs crash the careless parsers and are refused by the fixed ones, which show 0 crashes in 20000 and 100000 runs, and 2000 of 2000 valid carts round-trip."
detail = """
Delta debugging removes pieces of a crashing input for as long as it still crashes the same way. The gift-message input shrinks 28, 21, 17, 16, 14, 13, 12 and 11 characters: {"note":"#".
Before the fix, the four smallest inputs crash the careless parsers: "SHO-1042" with an ArrayIndexOutOfBoundsException, "BAG-0007,999999999,4" with an IllegalArgumentException, {"note":"#" with a StringIndexOutOfBoundsException, and the 200039-character nesting with a StackOverflowError.
After the fix, the fixed parsers refuse each one: a line has three fields; quantity is 1 to 99; a gift message is #to:message; nested deeper than 32. Each smallest input is now a regression test; the nesting one is kept as it is, because how deep is too deep depends on the stack.
Under the same fuzzer the fixed parsers show 0 crashes in 20000 runs and 0 in 100000. A property check, parse, print and parse again, gives the same cart for 2000 of 2000 valid inputs; for example [{"sk":"BAG-0007","qty":1} ] prints without the space.
"""
figure = "shrink_steps"
figure_title = "Shrink each crash, then fix the parser"
figure_speech = """
Fourth demo: from crash to fix. [[slnc 400]] On the left, delta debugging. [[slnc 300]] It removes a piece of the crashing input, and runs it again. [[slnc 300]] If it still crashes the same way, the smaller input is kept. [[slnc 300]] First big pieces, then smaller ones. [[slnc 300]] Twenty eight characters become eleven: just a note that is a hash. [[slnc 700]]
On the right, before and after the fix. [[slnc 300]] Each smallest input crashes the careless parser, in red. [[slnc 300]] The fixed parser checks the number of fields, the ranges, the gift message and the depth. [[slnc 300]] So it refuses every one, in green. [[slnc 600]]
Each smallest input becomes a regression test. [[slnc 300]] And under the same fuzzer, the fixed parsers do not crash at all.
"""
speech = """
The shrinking, step by step: each line is shorter, and still crashes the same way. [[slnc 300]] It ends at eleven characters.
[[page]]
Before the fix: the four smallest inputs, and the exception each one throws. [[slnc 300]] After the fix: the same inputs, each one refused, with a reason. [[slnc 300]] Each is now a regression test.
[[page]]
The fixed parsers under the same fuzzer: zero crashes. [[slnc 400]] And a property check: parse, print, and parse again. [[slnc 300]] The example has a space before the closing bracket, which printing drops. [[slnc 300]] The cart is the same for two thousand of two thousand inputs.
"""
rows = { fix = "active ok" }
console = [
