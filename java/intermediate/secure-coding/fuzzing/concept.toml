A normal order line gives the right total. [[slnc 300]] A word where a number should be is refused, as it should be. [[slnc 600]]
But a line with only a product code crashes the parser. [[slnc 300]] Nobody wrote a test for that. [[slnc 600]]
A parser may refuse input. [[slnc 300]] Anything else it throws is a bug.
"""
