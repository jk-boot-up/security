[poster]
headline = [["FUZZING", "text"], ["INPUTS NOBODY TESTED", "accent"]]
taglines = [["Let a program write the inputs nobody thought of", "gold"]]
before = { code = "assertEquals(17980, parse(\"SHO-1042,2,8990\"))", note = "the inputs someone thought of", tag = "BEFORE" }
after = { code = "Fuzzer.run(harness, seeds)", note = "a hundred thousand inputs nobody did", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "Fuzzing: Finding the Inputs Nobody Tested"
narration = """Hello, and welcome. [[slnc 400]] This video explains fuzzing, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] Fuzzing runs a program on huge numbers of changed inputs, and records every input that makes it fail in a way nobody expected. [[slnc 600]] Think of a new employee given the shop's till. [[slnc 300]] The manual's sales all work. [[slnc 300]] Then the employee presses every button, in every order, until the till freezes. [[slnc 300]] Nobody wrote that case down. [[slnc 700]] In this video, the domain is an online store. [[slnc 500]] By the end, you will hear what a fuzzer finds that example tests miss. [[slnc 300]] Why coverage guidance reaches deeper code. [[slnc 300]] How a crash becomes a regression test. [[slnc 300]] And what fuzzing cannot find."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online store parses order lines", "from its warehouse, and carts from its site.", "", "Both parsers pass their example tests.", "Both read input from outside."]
narration = """Here is the scenario. [[slnc 400]] An online store parses order lines from its warehouse, and carts from its site. [[slnc 500]] Both parsers pass the tests their authors wrote. [[slnc 300]] And both read input that comes from outside the store."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["Seed: a real input to start from", "Mutation: a small change to an input", "Crash: any failure but a refusal", "Coverage: the branches an input reached", "Harness: the code that feeds one parser"]
narration = """Before the demos, the words. [[slnc 500]] A seed is a real input, the starting point. [[slnc 500]] A mutation is a small change to an input. [[slnc 500]] A crash is any failure other than the parser's own refusal. [[slnc 500]] Coverage is the set of branches an input reached. [[slnc 500]] And a harness is the small piece of code that feeds the fuzzer's input to one parser."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "09-ladder"
kind = "bullets"
title = "From Crash To Test"
body = ["1. Fuzz from real seeds", "2. Keep inputs that reach new branches", "3. Shrink each crash", "4. Keep the smallest input as a test", "5. Fix, and fuzz again"]
narration = """Let's put it in order. [[slnc 400]] First, fuzz from real seed inputs. [[slnc 500]] Second, keep every input that reaches a new branch. [[slnc 500]] Third, shrink each crash to its smallest input. [[slnc 500]] Fourth, keep that input as a regression test. [[slnc 500]] And fifth, fix the cause, and fuzz again."""

[[scene]]
key = "10-roles"
kind = "bullets"
title = "Who Does What"
body = ["Fuzzer: mutates and runs", "Harness: feeds one parser", "Coverage: counts branches", "Crash: names a failure", "Minimizer: shrinks it"]
narration = """Here is who does what in the code. [[slnc 400]] The fuzzer mutates inputs and runs them. [[slnc 500]] Each harness feeds one parser. [[slnc 500]] The coverage class counts the branches an input reached. [[slnc 500]] The crash class names a failure by its type and place. [[slnc 300]] And the minimizer shrinks a crashing input to its smallest form."""

[[scene]]
key = "11-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["OSS-Fuzz", "Jazzer and @FuzzTest", "\"Found by fuzzing\" in advisories", "Property-based testing"]
narration = """You have probably met this already. [[slnc 400]] O S S fuzz, which fuzzes thousands of open source projects all the time. [[slnc 500]] Jazzer, and fuzz test methods, in Java projects. [[slnc 500]] Security advisories that say, found by fuzzing. [[slnc 500]] And property based testing libraries, which generate inputs from rules."""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Fuzz every parser of outside input", "One harness per parser", "Keep stack traces and the corpus", "Every crash becomes a test", "A budget in every build"]
narration = """So, how do you use it? [[slnc 400]] Fuzz every parser that reads input from outside. [[slnc 500]] Write one harness for each parser. [[slnc 500]] Keep stack traces, and keep the inputs that reached new branches. [[slnc 500]] Turn every crash into a regression test. [[slnc 500]] And give every build a budget of runs."""

[[scene]]
key = "13-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Remove the letter-by-letter", "comparison and count the runs again."]
narration = """That's fuzzing. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Let a program write the inputs nobody thought of, and turn every crash into a test. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine, with nothing installed except a Java development kit. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Remove the letter by letter comparison, and count how many runs the guided fuzzer needs now. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
The online store's two parsers of outside input, for order import lines and for carts, and the fuzzing that tests them. It covers anyone who can send a file or a request with crafted bytes. It does not
cover the business rules applied to parsed values, which are checked by other tests.
"""
assets = [
    "The store's availability: a crash or a stack overflow stops an import or a checkout.",
    "Order totals, which an overflow can turn negative.",
    "The trust that parsed values have the shape the code expects.",
]
actors = [
    "The warehouse and the site, sending ordinary input.",
    "An attacker sending crafted bytes.",
    "The fuzzer, playing the attacker in the build.",
]
boundaries = [
    "Outside input to the parsers: every byte crosses it unchecked.",
    "Parsed values to the store's logic: only values of the right shape should cross it.",
]
assumptions = [
    "Only a ParseException is an expected failure; any other throwable is a bug.",
    "The fuzzer runs with stack traces kept, so crashes are named by where they happened.",
    "In the demo, inputs come from fixed seeds and a seeded random number generator.",
]
out_of_scope = [
    "Business rules for parsed values, such as a negative quantity: the race-conditions-and-business-logic project.",
    "Native code and memory corruption.",
    "Bytecode instrumentation: the -with-jazzer version.",
]
tests = [
    "`ParsersTest` holds the example tests both versions pass.",
    "`FuzzerTest` checks repeatability, the bugs blind and guided fuzzing find, and that the fixed parsers survive.",
    "`MinimizerTest` checks that crashes shrink to inputs that crash the same way.",
    "`RegressionTest` keeps the smallest crashing inputs, which the fixed parsers refuse.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The -with-jazzer version runs the same harnesses under Jazzer, with real bytecode instrumentation and JUnit's fuzz tests.
"""

[[threat]]
id = "T1"
stride = "D"
threat = "A line with missing fields crashes the import with an index error"
where = "`OrderLine.parseCareless`"
control = "The fixed parser checks the number of fields, and the smallest input is a regression test"
residual = "Every new field needs the same check"

[[threat]]
id = "T2"
stride = "T"
threat = "A large quantity times a price overflows an int and gives a negative total"
where = "`OrderLine.parseCareless`, `Money`"
control = "Range limits and Math.multiplyExact on longs; Money refuses a negative total"
residual = "Other arithmetic needs the same care"

[[threat]]
id = "T3"
stride = "D"
threat = "Deeply nested brackets overflow the stack"
where = "`CartParser.value`"
control = "A depth limit of 32 refuses the input before recursion can overflow"
residual = "Limits on input size belong in front of the parser too"

[[threat]]
id = "T4"
stride = "D"
threat = "A gift message without a colon crashes the cart parser"
where = "`CartParser.giftMessage`"
control = "The fixed parser checks the message's shape, and coverage-guided fuzzing reaches the code"
residual = "Code the fuzzer never reaches is never tested, so coverage is watched"

[[threat]]
id = "T5"
stride = "T"
threat = "A value that parses cleanly is still wrong for the business, such as a quantity of -5"
where = "the store logic after parsing"
control = "None here: fuzzing finds crashes and broken properties, not wrong decisions"
residual = "Business rules need their own tests and properties"
