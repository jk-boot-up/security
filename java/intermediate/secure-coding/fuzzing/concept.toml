]

[[act]]
title = "Guided by coverage"
summary = "Blind, 100000 runs reach 14 branches and never find the gift-message bug; guided by coverage, keeping 10 inputs, the fuzzer reaches 18 branches and finds it at run 49776."
detail = """
The gift-message bug needs a field named note and a value starting with #: four letters and one more, all right at once. Blind, in 100000 runs, the fuzzer reaches 14 branches and never finds it.
Guided by coverage, keeping every input that reaches a new branch, it reaches 18 branches with 10 inputs kept, and finds the bug at run 49776 with the input [{"note":"#AG-0007","qty"1}]. The parser compares the
field name one letter at a time, so each letter matched is a new branch, and the fuzzer keeps the input that reached it. The work is counted in runs, not seconds, so the comparison is the same on every machine.
"""
speech = """
Third demo: guided by coverage. [[slnc 400]] One bug hides behind a field named note, with a value that starts with a hash. [[slnc 300]] Four letters, and one more, all right at once. [[slnc 600]]
Blind, in a hundred thousand runs, the fuzzer never finds it. [[slnc 600]]
Guided by coverage, the fuzzer keeps every input that reaches a branch nobody reached before. [[slnc 300]] Each letter of note that matches is a new branch. [[slnc 300]] So it creeps forward, one letter at a time. [[slnc 600]]
It finds the bug at run forty nine thousand, seven hundred and seventy six. [[slnc 300]] The work is counted in runs, not seconds, so the comparison is the same on every machine.
"""
rows = { guided = "active ok" }
console = [
    ["the gift-message bug needs a field named note and a value starting with #: four letters and one more, all right at once", "muted"],
    ["blind, 100000 runs: branches reached 14, gift-message bug found: false", "amber"],
    ["guided, keeping every input that reaches a new branch: branches reached 18, inputs kept 10", "ok"],
    ["the guided fuzzer finds it at run 49776, input \"[{\"note\":\"#AG-0007\",\"qty\"1}]\"  <- ONE LETTER AT A TIME, EACH ONE A NEW BRANCH", "ok"],
    ["the work is counted in runs, not seconds, so the comparison is the same on every machine", "muted"],
]

[[act]]
title = "From crash to fix"
summary = "Delta debugging shrinks the crashes to \"SHO-1042\", \"BAG-0007,999999999,4\" and {\"note\":\"#\"; each becomes a regression test, the fixed parsers show 0 crashes in the same runs, and 2000 of 2000 valid carts round-trip."
detail = """
Delta debugging removes pieces of each crashing input for as long as it still crashes the same way. The missing-field crash shrinks from 14 characters to "SHO-1042", which the fixed parser refuses because a line has three fields.
The overflow shrinks from 23 characters to "BAG-0007,999999999,4", refused because the quantity is 1 to 99. The gift-message crash shrinks from 28 characters to {"note":"#", refused because a gift message is #to:message.
The nesting crash is kept as it is, because how deep is too deep depends on the stack; the fixed parser refuses it as nested deeper than 32. Each smallest input is now a regression test. Under the same fuzzer the
fixed parsers show 0 crashes in 20000 runs and 0 in 100000, and a property check, parse, print and parse again, gives the same cart for 2000 of 2000 inputs the fuzzer found valid.
"""
speech = """
Fourth demo: from crash to fix. [[slnc 400]] Delta debugging removes pieces of each crashing input, for as long as it still crashes the same way. [[slnc 600]]
The missing field shrinks to just the product code. [[slnc 300]] The overflow shrinks to a huge quantity and a price of four. [[slnc 300]] The gift message shrinks to a note that is only a hash. [[slnc 600]]
Each smallest input becomes a regression test. [[slnc 300]] So the bug cannot come back unnoticed. [[slnc 600]]
The fixed parsers check the number of fields, the ranges, the depth, and the gift message. [[slnc 300]] Under the same fuzzer, they do not crash at all. [[slnc 600]]
And a property check confirms that parsing, printing and parsing again gives the same cart, every time.
"""
rows = { fix = "active ok" }
console = [
    ["ArrayIndexOutOfBoundsException: 14 characters made smallest, \"SHO-1042\"; fixed: refused (a line has three fields)", "ok"],
    ["IllegalArgumentException in Money.<init>: 23 characters made smallest, \"BAG-0007,999999999,4\"; fixed: refused (quantity is 1 to 99)", "ok"],
    ["StringIndexOutOfBoundsException in CartParser.giftMessage: 28 characters made smallest, \"{\"note\":\"#\"\"; fixed: refused (a gift message is #to:message)", "ok"],
    ["the nesting crash: the fixed parser says refused (nested deeper than 32)", "ok"],
    ["the fixed parsers under the same fuzzer: 0 crashes in 20000 runs, and 0 in 100000", "ok"],
    ["a property check: parse, print and parse again gives the same cart for 2000 of 2000 inputs the fuzzer found valid", "ok"],
]

[[act]]
title = "What fuzzing does not find"
summary = "A cart with a quantity of -5 parses without a crash, so no fuzzer reports it; each parser needs a harness, builds need a budget, and Jazzer adds branch counters by itself."
detail = """
A cart with a quantity of -5 parses: no crash, so no report. Whether -5 is allowed is a business rule; a fuzzer finds crashes and broken properties, not wrong decisions. Every parser needs its own harness, and
this store wrote 2, one for each. In a build, a fixed budget of runs on every change; longer runs at night, keeping the inputs that reached new branches. Coverage-guided tools such as Jazzer add the branch counters
to the bytecode by themselves, which is the -with-jazzer version.
"""
speech = """
Fifth demo: what fuzzing does not find. [[slnc 400]] A cart with a quantity of minus five parses without a crash. [[slnc 300]] So no fuzzer reports it. [[slnc 600]]
Whether minus five is allowed is a business rule. [[slnc 300]] A fuzzer finds crashes and broken properties, not wrong decisions. [[slnc 600]]
Every parser needs its own harness. [[slnc 300]] Every build needs a budget of runs, with longer runs at night. [[slnc 600]]
And tools such as Jazzer add the branch counters to the code by themselves.
"""
rows = { bill = "active amber" }
console = [
