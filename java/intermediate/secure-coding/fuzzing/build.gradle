plugins {
    id 'java'
    id 'application'
}

group = 'com.jk.explore.security'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// The JVM normally replaces exceptions thrown many times from hot code with one shared exception that has no stack trace.
// A fuzzer names each crash by where it happened, so it needs every stack trace: fuzzers such as Jazzer switch this off too.
def fuzzingJvmArgs = ['-XX:-OmitStackTraceInFastThrow']

application {
    mainClass = 'com.jk.explore.security.fuzzing.FuzzingDemo'
    applicationDefaultJvmArgs = fuzzingJvmArgs
}

test {
    useJUnitPlatform()
    jvmArgs fuzzingJvmArgs
}

// No deprecated or to-be-removed API is allowed in any project: a warning fails the build.
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.addAll(['-Xlint:deprecation', '-Xlint:removal', '-Werror'])
}
