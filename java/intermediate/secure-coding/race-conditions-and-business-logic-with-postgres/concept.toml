[[act]]
title = "Row locks: making the check and the write one step"
summary = "With select ... for update, A locks ANA-1 and reads 100, B waits (pg_stat_activity shows the wait), A pays 80 and commits, and B then reads 20 and refuses: paid out 80, balance 20; nowait refuses at once with 55P03, lock_timeout gives up after 300 ms, and skip locked takes the next free row."
detail = """
A runs select ... for update on ANA-1: it locks the row and reads 100. B asks for the same row and waits; pg_stat_activity shows B waiting for a lock (true). A pays out 80 and commits, which releases the lock. B then gets the row, reads 20, and 20 >= 80 is false, so B refuses. The result: paid out 80, balance 20.
When B should not wait while A holds the row: for update nowait refuses at once with 55P03 lock_not_available; lock_timeout of 300 ms waits that long and then gives up with 55P03; skip locked takes the next row that nobody holds, here BEN-2, as workers do on a queue.
"""
figure = "row_lock"
figure_title = "A row lock: B waits, then sees what A wrote"
figure_speech = """
Second demo: a row lock. [[slnc 400]] A selects the account for update. [[slnc 300]] That locks the row, and A reads one hundred. [[slnc 300]] B asks for the same row. [[slnc 300]] The row is locked, so B waits. [[slnc 300]] The amber bar is the time B spends waiting. [[slnc 300]] Postgres shows it in its activity view, as a lock wait. [[slnc 700]]
A pays out eighty and commits. [[slnc 300]] The commit releases the lock. [[slnc 300]] Now B gets the row, and reads twenty, the value A wrote. [[slnc 300]] Twenty does not cover eighty, so B refuses. [[slnc 700]]
At the bottom, three ways not to wait. [[slnc 300]] No wait refuses at once. [[slnc 300]] A lock timeout waits three hundred milliseconds, then gives up. [[slnc 300]] And skip locked takes the next free row instead, as workers do when they share a queue.
"""
speech = """
Here is the output. [[slnc 300]] A locks the row and reads one hundred. [[slnc 300]] B waits. [[slnc 300]] A pays and commits, and B reads twenty, and refuses. [[slnc 300]] Paid out eighty. [[slnc 500]] With no wait, B is refused at once, with five five P zero three, lock not available. [[slnc 300]] With a lock timeout, it waits three hundred milliseconds first. [[slnc 300]] And skip locked takes ben's row instead.
"""
rows = { lock = "active ok" }
console = [
    ["THE STEPS (select ... for update):", "code"],
    ["  A            locks the row ANA-1 and reads 100", "muted"],
