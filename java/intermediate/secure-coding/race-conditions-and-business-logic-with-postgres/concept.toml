[poster]
headline = [["RACES WITH", "text"], ["POSTGRESQL", "accent"]]
taglines = [["The database can close the gap, at a price", "gold"]]
before = { code = "A reads 100, B reads 100: 160 paid", note = "Check, then act", tag = "BEFORE" }
after = { code = "select ... for update", note = "One step in the database", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "Race Conditions with PostgreSQL and Hibernate"
narration = """Hello, and welcome. [[slnc 400]] This video explains race conditions, with PostgreSQL and Hibernate, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A race condition is two requests meeting in the gap between a check and a write. [[slnc 300]] Both read a balance of a hundred, both see enough money, and the bank pays out a hundred and sixty. [[slnc 300]] The database can close that gap with a constraint, a lock, an isolation level, or a version number, and each one has a price. [[slnc 600]] Think of two cashiers who both check the same account, before either one writes in the ledger. [[slnc 600]] Our example is a bank."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["A customer withdraws from one account", "on a phone and a laptop at the same moment.", "", "The demo plays the two requests", "against a real PostgreSQL 18 in Docker,", "with plain JDBC and with Hibernate,", "in a written order of statements,", "and tries every way to close the gap."]
narration = """Here is the scenario. [[slnc 400]] A bank customer withdraws from the same account, on a phone and on a laptop, at the same moment. [[slnc 500]] The demo plays the two requests against a real PostgreSQL database in Docker, with plain J D B C and with Hibernate. [[slnc 300]] It controls exactly when each one reads and writes, so every run prints the same result. [[slnc 500]] Then it tries every way to close the gap, and shows what each one costs."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["Transaction: statements that commit together", "Check constraint: a rule the table enforces", "Row lock: select ... for update", "Isolation level: what one transaction sees of another", "Write skew: two rows, one rule, both commit", "Optimistic locking: a version number on the row"]
narration = """Before the demos, the words. [[slnc 500]] A transaction is a group of statements that commit together, or not at all. [[slnc 500]] A check constraint is a rule the table itself enforces, for every program. [[slnc 500]] A row lock, taken with select for update, makes other writers of that row wait. [[slnc 500]] An isolation level says how much one transaction sees of another one's changes. [[slnc 500]] Write skew is two transactions that each change a different row, and together break a rule over both. [[slnc 500]] And optimistic locking stores a version number on the row, and refuses an update made on an old version."""

[[scene]]
key = "04-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "05-four-ways"
kind = "figure"
title = "Four ways the database closes the gap"
body = "four_ways"
narration = """Let's see the core idea on one example. [[slnc 400]] A has just taken eighty from a balance of one hundred. [[slnc 300]] Now B asks for eighty too. [[slnc 300]] Without help, B would read the old balance and pay out again. [[slnc 700]]
Here are four ways to tell the database the rule. [[slnc 300]] First, a rule in the table: the balance can never be below zero. [[slnc 300]] B's update would leave minus sixty, so it fails with a check violation. [[slnc 500]] Second, the check inside the update: only where the balance covers eighty. [[slnc 300]] B's update changes no row. [[slnc 500]] Third, a row lock. [[slnc 300]] B waits until A commits, then reads twenty and refuses. [[slnc 500]] Fourth, a version column. [[slnc 300]] B's update asks for the version it loaded, finds none, and Hibernate refuses it. [[slnc 600]]
In every column, the check and the write became one step, and only eighty is paid out."""

[[scene]]
key = "06-acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "07-costs"
kind = "bullets"
title = "What It Costs"
body = ["Locks make requests wait", "Stronger isolation means retries", "Optimistic locking hands the conflict back", "Locks in different orders deadlock", "A transaction that waits for a person blocks everyone"]
narration = """Nothing is free. [[slnc 400]] Here is what it costs. [[slnc 500]] Locks make other requests wait. [[slnc 500]] Stronger isolation means the database refuses more, so callers must retry. [[slnc 500]] Optimistic locking hands the conflict back to the caller, or the customer. [[slnc 500]] Locks taken in different orders can deadlock. [[slnc 300]] And a transaction that waits for a person keeps everyone else waiting."""

[[scene]]
key = "08-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["A coupon used twice, or a double payout", "@Version on an entity", "select ... for update in a repository", "\"could not serialize access\" or", "  \"deadlock detected\" in a log"]
narration = """You have probably met this already. [[slnc 400]] A coupon used twice, or a payout made twice, is a race that someone won. [[slnc 500]] A version annotation on an entity is optimistic locking. [[slnc 500]] Select for update in a repository query is a row lock. [[slnc 500]] And could not serialize access, or deadlock detected, in a log, is the database refusing, and asking the caller to try again."""

[[scene]]
key = "09-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Put the rule in a constraint", "Make the check and the write one statement", "Lock in one order, when you must lock", "Pick the isolation your rule needs, and retry", "Keep transactions short", "Never trust a lock in one server's memory"]
narration = """So, how do you use it? [[slnc 400]] Put the rule, like a balance that never goes below zero, in a constraint. [[slnc 300]] Make the check and the write a single statement. [[slnc 500]] When you must lock, always lock in the same order. [[slnc 500]] Choose the isolation level your rule needs, and retry what the database refuses. [[slnc 300]] Keep transactions short. [[slnc 500]] And never rely on a lock in the memory of one server."""

[[scene]]
key = "10-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "11-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Make a coupon single-use", "with a unique constraint."]
narration = """That's race conditions with PostgreSQL and Hibernate. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] A rule that must always hold belongs where every writer must pass: in the schema, in one statement, or behind a lock that the database enforces. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine, with Docker. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a unique constraint, and use it to make a coupon single-use. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] Most of the work is done by the database, so the classes are small. [[slnc 300]] Here are the ones that matter."""

[[class]]
name = "Db"
what = "a real PostgreSQL in Docker, and its tables"
[[class.part]]
title = "the rule lives in the table"
code = """
"create table accounts (id text primary key, balance int not null check (balance >= 0), paid_out int not null default 0)",
"""
speech = """The accounts table carries the rule itself: the balance can never be below zero. [[slnc 300]] Every program that writes to it, careful or not, must pass that check."""
[[class.part]]
title = "sessions that wait for each other"
code = """
Connection c = DriverManager.getConnection(url(), p);
c.setAutoCommit(false);
"""
speech = """Each request is a real connection with auto commit off. [[slnc 300]] Its locks last until it commits, so the demo can make another session wait, and watch it wait."""

[[class]]
name = "RaceConditionsDemo"
what = "the statements, in a written order"
[[class.part]]
title = "the check inside the update"
code = """
static final String DRAW = "update accounts set balance = balance - 80, paid_out = paid_out + 80 where id = 'ANA-1'";
static final String DRAW_IF_COVERED = DRAW + " and balance >= 80";
"""
speech = """The update subtracts from what is there now, not from a value read earlier. [[slnc 300]] With the extra condition, it changes one row or none, and the count tells the caller which."""
[[class.part]]
title = "retry only what timing caused"
code = """
} catch (SQLException e) {
    if (!SqlStates.retry(e.getSQLState())) {
        throw e;
    }
"""
speech = """A refused transaction is run again from the start, but only for the codes that mean bad timing. [[slnc 300]] Anything else is a real error, and goes to the caller."""

[[class]]
name = "HibAccount"
what = "the account entity, with a version column"
[[class.part]]
title = "@Version"
code = """
@Version
private long version;
"""
speech = """One annotation. [[slnc 300]] Hibernate adds the version to the where clause of every update, and adds one to it. [[slnc 300]] An update on an old version changes no row, and Hibernate throws."""

[[class]]
name = "SqlStates"
what = "a teaching class: what each error code asks"
[[class.part]]
title = "codes, names and what to do"
code = """
KNOWN.put("23514", new Meaning("check_violation", "refuse, do not retry", false));
KNOWN.put("55P03", new Meaning("lock_not_available", "try again later", false));
KNOWN.put("40001", new Meaning("serialization_failure", "retry the transaction", true));
KNOWN.put("40P01", new Meaning("deadlock_detected", "retry the transaction", true));
"""
speech = """The four error codes this video met. [[slnc 300]] Only serialization failures and deadlocks are worth retrying at once. [[slnc 300]] A unit test checks the table, with no database."""

