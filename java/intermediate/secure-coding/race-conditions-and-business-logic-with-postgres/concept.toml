[readme]
intro = """
The plain [race-conditions-and-business-logic](../race-conditions-and-business-logic) project shows the gap between a check and a write with a scripted interleaving and its own locks. This one runs it against a real **PostgreSQL 18** in Docker, with plain JDBC and **Hibernate ORM 7**. It needs Docker; the tests are tagged `integration`: `./gradlew integrationTest`.

What it shows:
- **Check, then act.** Two withdrawals of 80 from a balance of 100 each read 100: the bank pays out 160 and the balance says 20. A check constraint (`balance >= 0`) with a relative update, or a condition inside the update (`where balance >= 80`, one row or none), refuses the second. A single-use coupon is claimed in one statement.
- **Row locks.** `SELECT ... FOR UPDATE`: the second session waits (`pg_stat_activity` shows a Lock wait), then reads 20 and is refused. `NOWAIT` refuses at once, `lock_timeout` gives up, `SKIP LOCKED` takes the next row.
- **Isolation levels.** READ COMMITTED applies a relative update to the new value; REPEATABLE READ refuses it (`40001`) and the caller retries; write skew across two rows passes under REPEATABLE READ (total -100) and is refused under SERIALIZABLE.
- **Hibernate.** `@Version` makes the update `... where id=? and version=?`, so the second writer gets an `OptimisticLockException`; a pessimistic lock is `for no key update`. A payment key is claimed in the same transaction as the money.
- **The bill.** Opposite lock order deadlocks and PostgreSQL cancels one (`40P01`); locks in the memory of two servers protect nothing; a transaction that waits for a person keeps everyone waiting.

**Maps to:** OWASP Top 10 (2025) A06 Insecure Design · CWE-362 (race condition), CWE-367 (time-of-check time-of-use), CWE-840 (business logic errors).
"""
analogy = """
A bank counter with two clerks and one ledger. If both read the balance before either writes, both pay out. Writing the rule on the ledger itself, queueing at the page, or stamping every page with a number so that a stale copy is refused each stop the double payment, and each has a different cost.
"""
scenario = """
A bank lets a customer withdraw from the same account on a phone and a laptop at the same moment. The demo plays the two requests against a real database and tries every way to close the gap.
"""
costs = [
    "**Locks make requests wait,** and a long transaction makes everybody wait.",
    "**Stronger isolation means retries,** and the code must be safe to repeat.",
    "**Optimistic locking pushes the conflict to the user** or to a retry loop.",
    "**Deadlocks happen when locks are taken in different orders,** and the database resolves them by cancelling one.",
    "**A rule in the schema holds for every program,** but only the rules that a constraint can express.",
]
too_much = """
A table that one background job updates once a night does not need row locks or serializable transactions. Use them where two requests can reach the same row, or the same rule across rows, at the same moment.
"""
met_before = [
    "`@Version` on a JPA entity.",
    "`SELECT ... FOR UPDATE` in a repository query.",
    "`@Transactional(isolation = ...)`.",
    "A 409 Conflict or an \"optimistic lock\" error page.",
]
where = """
This is the tools version of [race-conditions-and-business-logic](../race-conditions-and-business-logic), in the [secure-coding](..) module. The plain project explains the gap with its own locks; this one uses what a database already has.
"""
twin = """
PostgreSQL 18.6 is the real server in a container on a free loopback port, started with a short deadlock timeout and removed at the end. The sessions are real connections; the interleavings are scripted, so that the output is the same on every run. Ports and container names are never printed; the demo takes about thirty seconds.
"""
test_note = "The tests start one PostgreSQL for the whole class and remove it (./gradlew integrationTest). They need Docker."

[[act]]
title = "Check, then act: two requests in the gap"
summary = "Two withdrawals that read before either writes pay out 160 from 100; a check constraint, a conditional update and a one-statement claim close the gap."
detail = """
ana has 100 and sends two withdrawals of 80. A and B both read 100, both checks pass, both write the balance they worked out: the bank paid out 160 from a balance of 100, and the balance says 20. With the rule in the table, balance int check (balance >= 0), and the update relative to what is there, the second is refused by the database with 23514. With the check inside the update, where balance >= 80, A changes one row and B none. A single-use coupon checked, applied and marked used by two requests that both saw used = false gives a discount of 40; claimed in one statement, where used = false, A claims 1 and B 0.
"""
speech = """
First demo: check, then act. [[slnc 400]] Two withdrawals both read a hundred. [[slnc 600]]
Both checks pass before either writes, and the bank pays out a hundred and sixty. [[slnc 300]] A constraint in the table, or a condition inside the update, refuses the second.
"""
rows = { race = "active wrong" }
console = [
    ["A reads 100, B reads 100, both pay 80: 160 paid out of 100", "bad"],
    ["check (balance >= 0) with a relative update: B refused (23514)", "ok"],
    ["where balance >= 80: A changed 1 row, B changed 0", "ok"],
]

[[act]]
title = "Row locks: making the check and the write one step"
summary = "SELECT FOR UPDATE makes the second request wait and then see the first; NOWAIT, a timeout and SKIP LOCKED are the other ways to meet a lock."
detail = """
A selects the account for update and reads 100. B asks for the same row and waits: pg_stat_activity shows a Lock wait. A pays out 80 and commits; then B reads 20 and is refused. With NOWAIT, B is refused at once with 55P03. With lock_timeout of 300 ms, B waits at least 300 ms and gives up. With SKIP LOCKED, B takes the next row that nobody holds, as workers do on a queue.
"""
speech = """
Second demo: row locks. [[slnc 400]] A selects the account for update. B asks for the same row, and waits. [[slnc 600]]
When A commits, B reads the new balance, and is refused. [[slnc 300]] No wait, a timeout, or skip locked are the other ways to meet a lock.
"""
rows = { lock = "active ok" }
console = [
    ["B waits behind A (pg_stat_activity: Lock)", "ok"],
    ["after A commits, B reads 20: refused", "ok"],
    ["NOWAIT: 55P03 at once; lock_timeout: 55P03 after 300 ms", "ok"],
]

[[act]]
title = "Isolation levels"
summary = "READ COMMITTED applies a relative update to the new value; REPEATABLE READ refuses it; only SERIALIZABLE stops write skew."
detail = """
Under READ COMMITTED, A read 100, B took 30 and committed, and A's update of balance - 30 is applied to the new value: balance 40. Under REPEATABLE READ A keeps its snapshot and the update is refused with 40001, could not serialize access; A starts again and succeeds. Two accounts that must stay at 0 or more in total: under REPEATABLE READ both see 200, each takes 150 from a different account, both commit and the total is -100: write skew. Under SERIALIZABLE B is refused with 40001 and the total is 50. A stronger level makes the database refuse some interleavings, and the application must retry what it refuses.
"""
speech = """
Third demo: isolation levels. [[slnc 400]] Repeatable read refuses an update of a row that changed under it. [[slnc 600]]
Two accounts, two requests, two different rows: write skew passes at repeatable read, and only serializable stops it. [[slnc 300]] The caller must be able to retry.
"""
rows = { isolation = "active ok" }
console = [
    ["REPEATABLE READ: 40001, A starts again and succeeds", "ok"],
    ["REPEATABLE READ: write skew, total -100", "bad"],
    ["SERIALIZABLE: B refused (40001), total 50", "ok"],
]

[[act]]
title = "Optimistic locking with Hibernate, and one-time keys"
summary = "A version column makes the update conditional; a payment key claimed in the same transaction as the money runs once."
detail = """
A and B both load the account: balance 100 and 100, version 0 and 0. A pays 80 and commits with update hib_account set balance=?,version=? where id=? and version=?. B pays 80 on what it loaded and its commit is refused with an OptimisticLockException. B starts again, loads balance 20 at version 1, and the rule refuses. A pessimistic write lock sends select ... for no key update. The same payment key arriving twice at once: A claims the key and moves 70 in one transaction, B with the same key waits for A and then finds the key taken; ana has 30.
"""
speech = """
Fourth demo: optimistic locking with Hibernate. [[slnc 400]] The update says where id and where version. [[slnc 600]]
The second writer touches no row and is refused. [[slnc 300]] A one time key, claimed in the same transaction as the money, runs the payment once.
"""
rows = { hibernate = "active ok" }
console = [
    ["update ... where id=? and version=?", "ok"],
    ["B: OptimisticLockException; B starts again and is refused by the rule", "ok"],
    ["the same key twice: A moves 70, B finds the key taken", "ok"],
]

[[act]]
title = "The bill"
summary = "Opposite lock order deadlocks, locks in one server's memory protect nothing in another, and a transaction that waits for a person keeps everyone waiting."
detail = """
Two transfers in opposite directions, each locking its own sender first: PostgreSQL finds the cycle and cancels exactly one with 40P01, and the other finishes. With every lock taken in one order, order by id, both finish. Two servers, each with a lock of its own in its own memory, pay out 160 from 100. A request that locks the account and then waits for a person to confirm keeps everyone else waiting: B gives up with 55P03. So: keep transactions short, lock in one order, retry on 40001 and 40P01, and let the database enforce the rules that must always hold.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] Two transfers that lock in opposite orders deadlock, and the database cancels one. [[slnc 600]]
A lock in one server's memory protects nothing in another. [[slnc 300]] And a transaction that waits for a person keeps everyone waiting.
"""
rows = { bill = "active wrong" }
console = [
    ["opposite lock order: one is cancelled (40P01)", "bad"],
    ["two servers with their own locks: 160 paid out of 100", "bad"],
    ["a lock held while a person decides: B gives up (55P03)", "bad"],
]

