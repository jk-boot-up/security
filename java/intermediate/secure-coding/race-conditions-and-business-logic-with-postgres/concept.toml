[[act]]
title = "Isolation levels"
summary = "Under READ COMMITTED a relative update after B's commit is applied to the new value, 70 - 30 = 40; under REPEATABLE READ it is refused with 40001 and A retries to 40; two transactions that each take 150 from a different row of a total of 200 leave -100 under REPEATABLE READ (write skew), and SERIALIZABLE refuses the second, total 50."
detail = """
READ COMMITTED, the default: A reads 100; B takes 30 and commits, leaving 70; A's update, balance - 30, is applied to the new value: 70 - 30 = 40.
REPEATABLE READ, the same steps: A reads 100 and keeps that snapshot; B takes 30 and commits; A's update is refused with 40001 serialization_failure, "could not serialize access due to concurrent update". A retries from the start, in 1 attempt: 70 - 30 = 40. The caller must be able to retry.
One rule over two rows: ANA-1 and ANA-2 hold 100 each and the total must stay at 0 or more. A and B each read the total, 200, and see room for 150; A takes 150 from ANA-1 and B 150 from ANA-2. Under REPEATABLE READ both commit: 200 - 150 - 150 = -100, write skew, because neither update touched the other's row. Under SERIALIZABLE, B is refused with 40001, and the total is 200 - 150 = 50.
"""
figure = "isolation"
figure_title = "Isolation levels, and write skew over two rows"
figure_speech = """
Third demo: isolation levels. [[slnc 400]] At the top left, read committed, the default. [[slnc 300]] A reads one hundred. [[slnc 300]] B takes thirty and commits. [[slnc 300]] A's update takes thirty from what is there now, seventy, so the balance is forty. [[slnc 600]]
At the top right, repeatable read. [[slnc 300]] A keeps the snapshot it read. [[slnc 300]] When it tries to update a row that changed since then, Postgres refuses, with four zero zero zero one. [[slnc 300]] A must start again, and then it succeeds. [[slnc 700]]
At the bottom, one rule over two rows: the total must stay at zero or more. [[slnc 300]] Both transactions see a total of two hundred. [[slnc 300]] Each takes one hundred and fifty, from a different row. [[slnc 300]] On the left, under repeatable read, neither update touched the other's row, so both commit. [[slnc 300]] The total is minus one hundred. [[slnc 300]] That is write skew. [[slnc 300]] On the right, serializable notices, and refuses the second.
"""
speech = """
Read committed: A read one hundred, B took thirty, and A's update was applied to seventy: forty. [[slnc 400]] Repeatable read: the same steps, but A's update is refused, with serialization failure. [[slnc 300]] Could not serialize access due to concurrent update. [[slnc 300]] A retries from the start, and gets forty.
[[page]]
One rule over two rows. [[slnc 300]] Under repeatable read, both see two hundred, and both commit. [[slnc 300]] Two hundred minus one fifty, minus one fifty, is minus one hundred: write skew. [[slnc 400]] Under serializable, B is refused, and the total stays at fifty.
"""
