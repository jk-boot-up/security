[[act]]
title = "Optimistic locking with Hibernate, and one-time keys"
summary = "Both sessions load balance 100 at version 0; A's update sets balance 20 and version 0 + 1 = 1 where version = 0; B's update still asks for version 0, changes no row and gets an OptimisticLockException, and its retry loads 20 and refuses; a payment key inserted twice at once runs once, ana 100 - 70 = 30."
detail = """
With Hibernate 7 and a @Version column, A and B both load ANA-1: balance 100, version 0. A pays 80 and commits with update hib_account set balance=?,version=? where id=? and version=?: balance 20, version 0 + 1 = 1, where version = 0, which changes 1 row. B pays 80 on what it loaded and commits: its update asks for version 0, but the row is at version 1, so it changes 0 rows and Hibernate throws an OptimisticLockException. B retries: it loads 20 at version 1, and 20 >= 80 is false.
A pessimistic write lock from Hibernate sends select ... for no key update of ha1_0.
One payment key, rent-october, is the primary key of payments. A inserts it (1 row) and moves 70 in one transaction; B inserts the same key at the same time and waits for A; A commits the key and the money together; B's insert then changes 0 rows, so nothing moves. Ana has 100 - 70 = 30.
"""
figure = "versions"
figure_title = "A version number, and a payment key"
figure_speech = """
Fourth demo: optimistic locking, with Hibernate. [[slnc 400]] The account row has a version number. [[slnc 300]] A and B both load it at version zero, with a balance of one hundred. [[slnc 600]]
A commits first. [[slnc 300]] Hibernate's update says: set the balance and the version, where the id matches, and the version is still zero. [[slnc 300]] It is, so one row changes: balance twenty, version one. [[slnc 600]]
Then B commits what it loaded. [[slnc 300]] Its update also asks for version zero. [[slnc 300]] But the row is now at version one, so no row changes, and Hibernate throws an optimistic lock exception. [[slnc 300]] B loads again, sees twenty, and refuses. [[slnc 700]]
At the bottom, a payment key. [[slnc 300]] The key is the primary key of the payments table. [[slnc 300]] A inserts it and moves the money, in one transaction. [[slnc 300]] B's copy waits, then finds the key taken, and moves nothing.
"""
speech = """
Here is the output. [[slnc 300]] Both load balance one hundred, version zero. [[slnc 300]] A commits with an update that asks for version zero, and moves it to one. [[slnc 400]] B commits on what it loaded. [[slnc 300]] The row is at version one, so zero rows change, and B gets an optimistic lock exception. [[slnc 300]] B's retry loads twenty, and refuses.
[[page]]
A pessimistic lock from Hibernate is select for no key update. [[slnc 400]] Then the payment key, sent twice at once. [[slnc 300]] A inserts it and moves seventy. [[slnc 300]] B waits for A. [[slnc 300]] A commits the key and the money together, and B's insert changes zero rows. [[slnc 300]] Ana has thirty.
"""
