[[act]]
title = "The bill"
summary = "Two transfers that each lock their own sender first deadlock, and PostgreSQL cancels 1 with 40P01 while the other is done; one lock order (order by id) finishes both; two servers' own locks pay out 80 + 80 = 160 from 100; a row locked while a person confirms makes B give up after 300 ms; 40001 and 40P01 are retried, 23514 is refused."
detail = """
Two transfers, each locking its own sender first: A locks ANA-1 and then asks for BEN-2, B locks BEN-2 and then asks for ANA-1. PostgreSQL finds the cycle and cancels 1 of them with 40P01 deadlock_detected; the other is done, and the cancelled one must be retried. With one lock order for everyone, order by id ... for update, both are done.
Two servers, each with a lock in its own memory, pay out 80 + 80 = 160 from 100: the locks never meet. A row locked while a person confirms makes B give up after 300 ms with 55P03: keep transactions short.
What each error code asks of the application: 23514 check_violation, refuse and do not retry; 55P03 lock_not_available, try again later; 40001 serialization_failure and 40P01 deadlock_detected, retry the transaction.
"""
figure = "the_bill"
figure_title = "A deadlock, and what each error code asks"
figure_speech = """
Fifth demo: the bill. [[slnc 400]] On the left, two transfers in opposite directions. [[slnc 300]] A holds ana's row, and waits for ben's. [[slnc 300]] B holds ben's row, and waits for ana's. [[slnc 300]] That is a cycle: a deadlock. [[slnc 300]] Postgres finds it, and cancels one of them with four zero P zero one. [[slnc 300]] The other one finishes. [[slnc 300]] The cancelled one must run again. [[slnc 300]] When every transfer locks in the same order, by account id, there is no cycle. [[slnc 700]]
On the right, the error codes this video met, and what each one asks of the application. [[slnc 300]] Two three five one four is a broken rule: refuse, and do not retry. [[slnc 300]] Five five P zero three is a lock that is busy: try again later. [[slnc 300]] Four zero zero zero one and four zero P zero one are timing: retry the whole transaction. [[slnc 600]]
And locks in two servers' own memory never meet: both pay out.
"""
speech = """
Here is the output. [[slnc 300]] Each transfer locks its own sender first. [[slnc 300]] Postgres finds the cycle and cancels one, with deadlock detected, and the other is done. [[slnc 300]] With one lock order, both are done. [[slnc 400]] And two servers, each with its own lock, pay out one hundred and sixty from one hundred.
[[page]]
A row locked while a person confirms: B gives up after three hundred milliseconds. [[slnc 300]] Keep transactions short. [[slnc 400]] And the table of error codes: refuse a check violation, try a busy lock later, and retry serialization failures and deadlocks.
"""
rows = { bill = "active amber" }
