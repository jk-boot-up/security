[[scene]]
key = "01-poster"
kind = "poster"
title = "Dependency Confusion"
narration = "Hello, and welcome. [[slnc 400]] This video explains dependency confusion, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A company's build fetches its own libraries from a private repository, and open-source ones from a public registry. [[slnc 300]] If an attacker registers one of the company's private names in the public registry, with a higher version, many builds will install the attacker's package instead. [[slnc 300]] The fix is to let each name come from one repository only, and to check the exact bytes. [[slnc 600]] Think of a warehouse that accepts any delivery with the right label, whoever the driver is. [[slnc 600]] Our example is an online store's build pipeline."

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online store's build needs:", "  json-lib, from the public registry", "  shop-pricing and shop-audit,", "  from its private repository", "", "The demo has both repositories,", "resolvers that behave like real tools,", "a lockfile, and a build that runs install scripts."]
narration = "Here is the scenario. [[slnc 400]] An online store's build needs one open-source library from the public registry, and two internal libraries, shop pricing and shop audit, from its private repository. [[slnc 500]] The demo has both repositories, and resolvers that choose between them the way real build tools do. [[slnc 300]] It has a lockfile, and a build that runs install scripts. [[slnc 500]] The attacker's script only prints a line, but on a real build machine it would send the build's secrets away."

[[scene]]
key = "02-words"
kind = "bullets"
title = "The Words"
body = ["Package: a library with a name and a version", "Repository: where packages are published", "Version range: the versions a build accepts", "Install script: code a package runs when installed", "Digest: a fingerprint of the exact bytes", "Lockfile: the versions and digests a build trusts"]
narration = """Before the demos, the words. [[slnc 500]] A package is a library with a name and a version, like shop pricing one point four point two. [[slnc 500]] A repository is where packages are published. [[slnc 300]] Only the store can publish to its private repository; anyone can publish to a public registry. [[slnc 500]] A version range is the set of versions a build accepts, like at least one point zero. [[slnc 500]] An install script is code that a package runs when it is installed, on the build machine. [[slnc 500]] A digest is a fingerprint of the exact bytes. [[slnc 300]] And a lockfile lists the versions and digests that a trusted build installed."""

[[scene]]
key = "02-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "02-one-name"
kind = "figure"
title = "One name, two places"
body = "one_name_two_places"
narration = """Let's see the core idea on one example. [[slnc 400]] At the top, what the build asks for: shop pricing, version one point zero or higher. [[slnc 600]]
On the left, the private repository. [[slnc 300]] Only the store can publish there, and it holds the real library, one point four point two. [[slnc 500]] On the right, the public registry. [[slnc 300]] Anyone can publish there. [[slnc 300]] The attacker has published the same name, version ninety nine, with an install script. [[slnc 700]]
Both versions are in the range. [[slnc 300]] A build that takes the highest version installs the attacker's package, and runs its script. [[slnc 500]] The attacker never saw the store's code. [[slnc 300]] Only the name."""

[[scene]]
key = "03-acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "04-costs"
kind = "bullets"
title = "What It Costs"
body = ["Name filters must follow your naming", "Failing closed means some builds break", "Lockfiles need updating", "Reserve your names in public registries", "Install scripts are the dangerous part"]
narration = "Nothing is free. [[slnc 400]] Here is what it costs. [[slnc 500]] Filters by name must be kept in step with how your teams name libraries. [[slnc 500]] Failing closed means a build breaks when an internal library is missing, instead of quietly finding one elsewhere. [[slnc 500]] Lockfiles must be updated on purpose, with every upgrade. [[slnc 500]] Reserving your names in public registries takes effort. [[slnc 300]] And install scripts are the dangerous part: they run code on the build machine."

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["--extra-index-url in a pip command", "Several repositories with no content filter", "exclusiveContent, npm scopes, --require-hashes", "A finding titled Dependency Confusion, CWE-427"]
narration = "You have probably met this already. [[slnc 400]] An extra index U R L, in a pip command, is the highest version wins behaviour. [[slnc 500]] Several repositories in a build file, with no filter by name, is repository order. [[slnc 500]] Gradle's exclusive content, npm scopes, and pip's require hashes are the fixes, by their real names. [[slnc 500]] And a finding titled dependency confusion, C W E four two seven, is this attack in a report."

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Route internal names to the private repository only", "Fail closed when they are missing there", "Keep CI away from public registries directly", "Lock and verify digests", "Turn off install scripts in CI", "Watch public registries for your names"]
narration = "So, how do you use it? [[slnc 400]] Route internal names to the private repository only, and fail closed when they are missing there. [[slnc 500]] Keep C I machines from reaching public registries directly; go through a repository manager with rules. [[slnc 500]] Lock and verify the digests of every package. [[slnc 300]] Turn off install scripts in the build, where you can. [[slnc 500]] And reserve your names publicly, and watch for them."

[[scene]]
key = "12-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Report public names within", "one edit of an internal name."]
narration = "That's dependency confusion. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] A build must decide by name which repository may supply a package, fail closed when it is missing there, and check the exact bytes against a lockfile, because the highest version, or the first answer, may come from an attacker. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a check that reports public names within one letter of an internal name. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] Each resolver is one rule a real build tool uses, so the classes are short. [[slnc 300]] Here are the ones that matter."""

[[class]]
name = "HighestVersionResolver"
what = "asks every repository; the highest version wins"
[[class.part]]
title = "one stream over all repositories"
code = """
return repositories.stream()
        .flatMap(r -> r.find(name, range).stream().map(a -> new Resolved(a, r)))
        .max(Comparator.comparing((Resolved x) -> x.artifact().version()))
"""
speech = """Every repository is asked, and every version in range goes into one list. [[slnc 300]] The highest wins, wherever it came from. [[slnc 300]] That is how the attacker's ninety nine got in."""

[[class]]
name = "Version"
what = "a version, compared number by number"
[[class.part]]
title = "the first number that differs decides"
code = """
for (int i = 0; i < 3; i++) {
    if (a[i] != b[i]) {
        return part[i] + " " + a[i] + (a[i] > b[i] ? " > " : " < ") + b[i];
"""
speech = """A teaching method that explains a comparison. [[slnc 300]] Major, then minor, then patch: the first number that differs decides. [[slnc 300]] A test checks it against the real comparison."""

[[class]]
name = "FirstRepositoryResolver"
what = "asks in order; the first that has the name answers"
[[class.part]]
title = "the first match wins"
code = """
for (Repository r : repositories) {
    var found = r.find(name, range).stream()
            .max(Comparator.comparing(Artifact::version));
    if (found.isPresent()) {
        return new Resolved(found.get(), r);
"""
speech = """The repositories are asked in order, and the first one that has the name answers. [[slnc 300]] When the private repository does not have it, the loop simply goes on to the public one."""

[[class]]
name = "ContentFilteringResolver"
what = "the fix: a name decides which repositories may supply it"
[[class.part]]
title = "internal names, private repositories only"
code = """
boolean internal = internalName.test(name);
return repositories.stream().filter(r -> internal != r.isPublic()).toList();
"""
speech = """An internal name may come only from a private repository, and any other name only from a public one. [[slnc 300]] If the allowed repository does not have it, the build fails. [[slnc 300]] It never falls through."""

[[class]]
name = "Artifact"
what = "a package; its digest covers every byte"
[[class.part]]
title = "three lines, then SHA-256"
code = '''
String script = installScript == null ? "" : installScript;
return name + "@" + version + "\n" + content + "\n" + script;
...
byte[] bytes = digestInput().getBytes(StandardCharsets.UTF_8);
return HexFormat.of().formatHex(d.digest(bytes));
'''
speech = """The digest covers the name and version, the contents, and the install script. [[slnc 300]] Change any byte, and the S H A two fifty six digest changes."""

[[class]]
name = "VerifyingResolver"
what = "the fix: the same version and digest as the lockfile, or stop"
[[class.part]]
title = "compare with the lockfile"
code = """
Resolved r = inner.resolve(name, range, repositories);
boolean sameVersion = r.artifact().version().equals(expected.version());
boolean sameBytes = r.artifact().digest().equals(expected.digest());
if (!sameVersion || !sameBytes) {
"""
speech = """It wraps any other resolver. [[slnc 300]] Whatever that one picks must have the version and the digest that the lockfile recorded. [[slnc 300]] Otherwise the build stops."""

