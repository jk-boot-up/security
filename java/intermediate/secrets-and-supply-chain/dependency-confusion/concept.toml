title = "How To Use It"
body = ["Explain how a public package can replace a private one", "Say which tool behaviours are vulnerable and why", "Describe content filtering by name and why it fails", "closed", "Explain what a lockfile digest adds to a pinned", "version"]
narration = "So, how do you use it? [[slnc 400]] Route internal names to the private repository only (content filtering or a proxying repository manager with rules), keep C I from reaching the public registry directly, lock and verify digests, disable install scripts in C I where you can, reserve your names publicly, and alert when a public registry has one of your internal names."

