required = [
    "Java basics",
    "An idea of what a package repository and a dependency are",
]
not_required = [
    "Gradle, npm or pip: the resolvers model their rules",
    "A network",
]
install = []

[docs.session]
objectives = [
    "explain how a public package can replace a private one",
    "say which tool behaviours are vulnerable and why",
    "describe content filtering by name and why it fails closed",
    "explain what a lockfile digest adds to a pinned version",
]
walkthrough = """
Run act two and ask what the attacker needed to know and what they needed to own. In act three, ask what a pin protects and what it does not. In act five, ask who reviews a changed digest.
"""
exercises = [
    "Add a second internal prefix and update the filter, with a test that an old name is still routed correctly.",
    "Add typosquatting detection: report public names within one edit of an internal name.",
    "Make the build refuse install scripts from public packages unless they are on an allow-list.",
    "Write the check that fails CI when a lockfile entry changes without a matching review note.",
]

[docs.explained]
sentence = """
A build must decide by name which repository may supply a package, fail closed when it is missing there, and check the exact bytes against a lockfile, because the highest version or the first answer may come from an attacker.
"""
verdict = """
Route internal names to the private repository only (content filtering or a proxying repository manager with rules), keep CI from reaching the public registry directly, lock and verify digests, disable install scripts in CI where you can, reserve your names publicly, and alert when a public registry
has one of your internal names.
"""
recognise = [
    "`--extra-index-url` or several `repositories {}` blocks without content filters.",
    "Requirements written as \">=1.0\" for internal packages.",
    "`exclusiveContent`, scoped packages and `--require-hashes` in build files.",
    "A finding titled \"Dependency Confusion\" or CWE-427.",
]

[spec]
purpose = """
Teach dependency confusion by registering a public package under a private name and watching five resolvers, then fixing the build with name-based routing, locked digests and a name watch.
"""
nongoals = [
    "A real registry, build tool or network.",
    "Typosquatting and malicious maintainers of legitimate packages.",
    "The Gradle version: the dependency-confusion-with-gradle project.",
]
problem = """
Build tools choose between repositories by rules that were designed for convenience, and an attacker can satisfy those rules from outside.
"""
roles = [["Packages and repositories", "`Version`, `VersionRange`, `Artifact`, `Repository`, `Resolved`"], ["Resolvers", "`Resolver`, `HighestVersionResolver`, `FirstRepositoryResolver`, `ContentFilteringResolver`, `VerifyingResolver`"], ["Locking and detection", "`Lockfile`, `NameWatch`"], ["The build", "`Build`, `ResolutionException`"], ["Entry point", "`DepConfusionDemo`"]]
requirements = [
    "Highest-version-wins installs a public package that has an internal name and a higher version.",
    "Repository order does not protect a name missing from the private repository or a public-first order, even with an exact pinned version.",
    "Content filtering supplies internal names only from the private repository, fails closed when missing, and never asks the private repository for public names.",
    "A lockfile with digests rejects a different source, version or contents.",
    "A name watch lists internal names that the public registry has.",
    "The demo prints the same output on every run.",
]

