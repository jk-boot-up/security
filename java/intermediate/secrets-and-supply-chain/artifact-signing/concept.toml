[[act]]
title = "A public log that every signature must be in"
summary = "Two releases go into a Merkle log: leaf = sha256(00 || entry), root = sha256(01 || leaf 0 || leaf 1) = c1e815c249fdd097, signed by the log; entry 1's proof is one hash; the gate now refuses the thief's jar unlogged, and logged by the log's day 150; the monitor reports entry 2; a log that hides it must sign two roots of size 3, and is caught."
detail = """
The input: the log holds entry 0, 2.3.0 by stable-2026a logged day 90, and entry 1, 2.4.0 logged day 120; each entry is the key id, the statement and the signature.
How the root is made, as RFC 9162 defines it: leaf 0 = sha256(00 || entry 0) = 05e76fd5f6c4ca1a, leaf 1 = sha256(00 || entry 1) = cf27ce9d14a8e52d, and root = sha256(01 || leaf 0 || leaf 1) = c1e815c249fdd097. The log signs a head: size 2 and that root.
The proof that entry 1 is in the log is one hash, leaf 0: sha256(01 || proof || leaf 1) gives c1e815c249fdd097 again, which equals the signed root.
The deployment now requires a log entry: the real 2.4.0 is accepted as entry 1; the thief's jar is refused when it is not in the log, and refused when it is, because it was logged on day 150 and the key was revoked on day 130. The store's monitor reports entry 2: 2.4.0 by stable-2026a with SHA-256 14669a56d76a94fc, a release it never made.
A log that hides entry 2 from the monitor must show two views of size 3: to the monitor the beta build, root f230f49e340792fc; to the customer the thief's jar, root 92f28850530761dd. Each is sha256(01 || old root || leaf 2), so each is consistent with the head of size 2, but two signed roots for one size prove the fork.
"""
figure = "merkle_log"
figure_title = "How the log's root is made, and how a fork shows"
figure_speech = """
Fourth demo: a public log. [[slnc 400]] On the left, the log with two entries. [[slnc 300]] Each entry is hashed with a zero byte in front: that is a leaf. [[slnc 300]] Two leaves are hashed together, with a one byte in front: that is the root, C one E eight. [[slnc 300]] The log signs its size and its root: the signed head. [[slnc 300]] To prove that entry one is in the log, it hands out one hash, leaf zero, in amber. [[slnc 300]] Anyone can redo the root from it. [[slnc 700]]
On the right, a dishonest log that hides the thief's entry from the store's monitor. [[slnc 300]] It shows the monitor one third entry, and the customer another. [[slnc 300]] Each new root is the old root plus leaf two, so each view still extends the old head. [[slnc 300]] But both are signed, both have size three, and their roots differ. [[slnc 300]] When the monitor and the customer compare heads, that is proof of a fork.
"""
speech = """
The input: two entries, each with the key id, the statement and the signature. [[slnc 300]] How the root is made: each leaf is the hash of zero and the entry, and the root is the hash of one and both leaves. [[slnc 300]] C one E eight. [[slnc 300]] The log signs that head with its own key.
[[page]]
The proof for entry one is one hash, leaf zero. [[slnc 300]] Hashed with leaf one, it gives the signed root again. [[slnc 400]] Now the deployment requires a log entry. [[slnc 300]] The real release is accepted as entry one. [[slnc 300]] The thief's jar is refused unlogged, and refused when logged, by the log's day, one hundred and fifty. [[slnc 300]] And the store's monitor reports entry two, a release the store never made.
[[page]]
A log that hides entry two from the monitor shows two views of size three. [[slnc 300]] Each root is the old root hashed with a different leaf two, so both views extend the old head. [[slnc 300]] But one size with two signed roots proves the fork.
"""
rows = { log = "active ok" }
console = [
    ["THE LOG (each entry: key id, statement, signature):", "code"],
    ["  entry 0  2.3.0 by stable-2026a, logged day 90, 227 bytes", "muted"],
    ["  entry 1  2.4.0 by stable-2026a, logged day 120, 228 bytes", "muted"],
    ["HOW THE ROOT IS MADE (a Merkle tree, RFC 9162):", "code"],
    ["  leaf 0  sha256(00 || entry 0)       = 05e76fd5f6c4ca1a", "muted"],
    ["  leaf 1  sha256(00 || entry 1)       = cf27ce9d14a8e52d", "muted"],
    ["  root    sha256(01 || leaf 0 || leaf 1) = c1e815c249fdd097", "muted"],
    ["THE SIGNED HEAD:", "code"],
    ["  size    2", "muted"],
    ["  root    c1e815c249fdd097...", "muted"],
    ["  signed  by the log's own key: true", "muted"],
    ["---", ""],
    ["THE PROOF THAT ENTRY 1 IS IN THE LOG (1 hash):", "code"],
    ["  proof     leaf 0 = 05e76fd5f6c4ca1a", "muted"],
    ["  redo      sha256(01 || proof || leaf 1) = c1e815c249fdd097", "muted"],
    ["  checks    equals the signed root: true", "muted"],
    ["THE DEPLOYMENT, NOW REQUIRING A LOG ENTRY:", "code"],
    ["  the real 2.4.0    accepted  signed by stable-2026a, entry 1", "ok"],
    ["  thief, not logged refused   not in the public log", "ok"],
    ["  thief, logged     refused   logged day 150, revoked day 130", "ok"],
    ["  <- THE LOG'S DAY COUNTS, NOT THE DAY THE SIGNER WROTE", "bad"],
    ["THE STORE'S MONITOR (signed with its keys, never released):", "code"],
    ["  entry 2: 2.4.0 by stable-2026a, sha256 14669a56d76a94fc", "muted"],
    ["---", ""],
    ["A LOG THAT HIDES ENTRY 2 SHOWS TWO VIEWS OF SIZE 3:", "code"],
    ["  monitor   entry 2 = the beta build, root f230f49e340792fc", "muted"],
    ["  customer  entry 2 = the thief's jar, root 92f28850530761dd", "muted"],
    ["HOW EACH VIEW EXTENDS THE HEAD OF SIZE 2 (proof: leaf 2):", "code"],
