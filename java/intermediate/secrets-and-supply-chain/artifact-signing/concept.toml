[[act]]
title = "Signing keys: per channel, rotated, revoked"
summary = "A beta key cannot sign for stable; stable-2026b is added on day 100 and stable-2026a revoked on day 130, an overlap of 130 - 100 = 30 days; signatures on days 110 and 120 pass, one on day 140 is refused, but a thief with the old key signs on day 150, writes day 120, and is accepted."
detail = """
A beta build signed with beta-2026a and offered to the stable deployment is refused: beta-2026a signs beta, not stable.
The rotation: stable-2026a is trusted from day 0 and revoked on day 130; stable-2026b is added on day 100. Both are trusted for 130 - 100 = 30 days, day 100 to 129.
Signed on day 110 with either key: accepted. Signed on day 120 with stable-2026a: accepted. Signed on day 140 with stable-2026a: refused, signed day 140, revoked day 130.
Before: a thief with stable-2026a signs a different jar (SHA-256 14669a56d76a94fc) on day 150 and writes signed-day=120. After: accepted, because the signer writes the day, and nothing independent records when it really signed.
"""
figure = "key_timeline"
figure_title = "Two keys, an overlap, a revocation and a backdated signature"
figure_speech = """
Third demo: managing the keys. [[slnc 400]] At the top, the two stable keys, day by day. [[slnc 300]] Stable twenty twenty six A is trusted from day zero, until it is revoked on day one hundred and thirty. [[slnc 300]] Stable twenty twenty six B is added on day one hundred. [[slnc 300]] The amber box is the overlap: one hundred and thirty minus one hundred, thirty days with both keys trusted, while every build moves to the new key. [[slnc 700]]
Below, signatures, placed on the day they say. [[slnc 300]] Day one hundred and ten, with either key, and day one hundred and twenty: accepted. [[slnc 300]] Day one hundred and forty, after the revocation: refused. [[slnc 700]]
At the bottom, the problem. [[slnc 300]] A thief with the old key signs on day one hundred and fifty. [[slnc 300]] But the signer writes the day, so the thief writes day one hundred and twenty. [[slnc 300]] And it is accepted.
"""
speech = """
First, a beta build offered to the stable deployment. [[slnc 300]] Refused: the beta key signs beta, not stable. [[slnc 400]] Then the rotation. [[slnc 300]] The old key is revoked on day one hundred and thirty, the new one added on day one hundred: a thirty day overlap. [[slnc 400]] Signatures on days one hundred and ten and one hundred and twenty are accepted. [[slnc 300]] Day one hundred and forty is refused.
[[page]]
Before: a thief with the old key, on day one hundred and fifty. [[slnc 300]] A different jar, and the statement says day one hundred and twenty. [[slnc 400]] After: accepted. [[slnc 300]] A backdated signature passes, because the signer writes the day.
"""
