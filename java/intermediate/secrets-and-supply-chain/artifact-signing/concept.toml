[[act]]
title = "The bill"
summary = "The gate refuses an unsigned jar but guards only its own path; the signing key needs a hardware module; rotation needs an overlap of 30 days; keyless signing is the modern alternative."
detail = """
The gate refuses an unsigned jar with the reason no signature, but a jar copied by hand onto a server never meets the gate, so the other paths must be locked.
The signing key is the crown jewel: here it is made from a fixed demo seed; in practice it stays in a hardware module, and each use is approved.
Rotation is a project: every deployment must trust the new key before the old one is revoked, here with an overlap of 30 days.
Keyless signing replaces long-lived keys with short-lived certificates tied to an identity and recorded in a public log, which is the subject of the -with-cosign version.
"""
figure = "gate_paths"
figure_title = "What the gate guards, and what it costs"
figure_speech = """
Fifth demo: the bill. [[slnc 400]] At the top, the path a release takes. [[slnc 300]] It is built, signed with a key in hardware, written to the public log, checked by the gate, and only then run on the server. [[slnc 700]]
The red dashed line is the problem. [[slnc 300]] A jar copied by hand straight onto a server never meets the gate. [[slnc 300]] The gate refuses an unsigned jar, but only on its own path, so every other path must be locked. [[slnc 700]]
Then the key. [[slnc 300]] Here it comes from a fixed demo seed. [[slnc 300]] In practice it lives in a hardware module, and every use is approved. [[slnc 300]] And rotation needs an overlap, so every deployment trusts the new key before the old one goes.
"""
speech = """
The gate refuses an unsigned jar. [[slnc 300]] But a jar copied by hand never meets it. [[slnc 400]] The signing key is the crown jewel: in practice, in a hardware module. [[slnc 400]] Rotation needs an overlap of thirty days here. [[slnc 400]] And keyless signing replaces long lived keys with short lived certificates, tied to an identity and recorded in a public log. [[slnc 300]] That is the cosign version of this project.
"""
