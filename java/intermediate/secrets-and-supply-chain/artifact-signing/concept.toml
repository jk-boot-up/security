[[scene]]
key = "01-poster"
kind = "poster"
title = "Artifact Signing"
narration = """Hello, and welcome. [[slnc 400]] This video explains artifact signing, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] An artifact is a file that a build produces, such as the jar that a store deploys. [[slnc 300]] Signing it lets every deployment check that the file is exactly what the release team made. [[slnc 600]] Think of a shop that receives sealed crates from its own warehouse. [[slnc 300]] A crate is opened only if the seal is right and unbroken. [[slnc 300]] And every seal ever stamped is written in a public ledger that no one can erase. [[slnc 700]] In this video, the domain is an online store. [[slnc 500]] By the end, you will hear how a release is signed and checked. [[slnc 300]] How signing keys are rotated and revoked. [[slnc 300]] Why the signer's own date cannot be trusted. [[slnc 300]] And how a public log catches a signature made in secret."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online store builds its release jar.", "", "It travels through mirrors, caches", "and build servers to production.", "", "Any of them could change it."]
narration = """Here is the scenario. [[slnc 400]] An online store builds its release jar. [[slnc 500]] The jar travels through mirrors, caches, and build servers, on its way to production. [[slnc 500]] Any of them could change it. [[slnc 300]] So production must be able to tell, before it runs anything, whether the file is exactly the one the release team made."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["Digest: a fingerprint of exact bytes", "Signature: proof a key holder vouched", "Pinned key: the one key a deployment trusts", "Revocation: a key no longer counts", "Transparency log: a public, append-only record"]
narration = """Before the demos, the words. [[slnc 500]] A digest is a short fingerprint of the exact bytes of a file. [[slnc 500]] A signature proves that the holder of a key vouched for something. [[slnc 500]] A pinned key is the one key a deployment has decided to trust. [[slnc 500]] Revocation means a key no longer counts. [[slnc 500]] And a transparency log is a public record that can only grow."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "09-ladder"
kind = "bullets"
title = "Four Questions Before Anything Runs"
body = ["Are these the exact bytes? the digest", "Who vouched for them? the signature", "Was that key trusted then? channel, rotation, revocation", "Could anyone see the signing? the log"]
narration = """Let's put it in order. [[slnc 400]] Are these the exact bytes the release team made? [[slnc 300]] The digest answers that. [[slnc 500]] Who vouched for them? [[slnc 300]] The signature. [[slnc 500]] Was that key trusted for this channel, on that day? [[slnc 300]] The key ring. [[slnc 500]] And could anyone see that the signing happened? [[slnc 300]] The transparency log."""

[[scene]]
key = "10-roles"
kind = "bullets"
title = "Who Does What"
body = ["Statement: what is vouched for", "SigningKey and KeyRing: keys and trust", "Verifier: the checks, in order", "TransparencyLog and MerkleTree: the public record", "DeployGate and Monitor: point of use, and the watcher"]
narration = """Here is who does what in the code. [[slnc 400]] The statement says exactly what is vouched for. [[slnc 500]] The signing key signs it, and the key ring decides which keys count, and when. [[slnc 500]] The verifier runs the checks, in order. [[slnc 500]] The transparency log keeps every signature in a Merkle tree, and hands out proofs. [[slnc 300]] And the deployment gate and the monitor use them."""

[[scene]]
key = "11-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Package managers checking signatures", ".sig and .asc files next to downloads", "Certificate Transparency logs", "Supply chain incidents"]
narration = """You have probably met this already. [[slnc 400]] Package managers check a signature before they install anything. [[slnc 500]] Downloads often come with a signature file, and a published key. [[slnc 500]] Every web certificate is recorded in public certificate transparency logs. [[slnc 500]] And supply chain incidents often begin with a release that was changed on the way."""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Sign a statement over the digest", "Verify at the point of use, keys pinned per channel", "Keep keys in hardware; rotate with an overlap", "Revoke by an independent time", "Require the log, and watch it"]
narration = """So, how do you use it? [[slnc 400]] Sign a statement over the digest of every release. [[slnc 500]] Verify it where the artifact is used, with keys pinned per channel. [[slnc 500]] Keep signing keys in hardware, and rotate them with an overlap. [[slnc 500]] Revoke by a time that the signer cannot write. [[slnc 500]] And require every signature to be in a public log, and watch that log for releases you never made."""

[[scene]]
key = "13-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Make the gate refuse", "a rollback to an older signed jar."]
narration = """That's artifact signing. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Run only the exact bytes that a trusted key signed, and only if that signature is in a public log that someone watches. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine, with nothing installed except a Java development kit. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Make the gate refuse a rollback to an older signed jar. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
How an online store's release jar gets from its build to production: signing a release statement, trusting and rotating signing keys, a transparency log of signatures, and
the deployment gate. It does not cover the build's own integrity, dependency risks, or the hardware module that should hold the keys.
"""
assets = [
    "The release jar that runs in production.",
    "The signing keys, and the key ring that deployments trust.",
    "The transparency log and its signed heads.",
    "The record of releases the store really made.",
]
actors = [
    "The release team, who build and sign releases.",
    "Anyone who can change files on mirrors, caches or build servers.",
    "A thief or an insider holding a signing key.",
    "A dishonest or compromised log operator.",
]
boundaries = [
    "Release build to the delivery path: the jar leaves the release team's control.",
    "Delivery path to the deployment gate: nothing is trusted until verified.",
    "Signing key to everything else: whoever holds it can vouch for anything.",
]
assumptions = [
    "The deployment's pinned keys and the log's key were installed through a trusted channel.",
    "The gate is on every path to production.",
    "In the demo, keys come from fixed demo seeds and days are numbers.",
]
out_of_scope = [
    "Build provenance and SBOMs: the sbom-and-provenance project.",
    "Container images and keyless signing: the -with-cosign version.",
    "Rollback to an older signed release: an exercise.",
]
tests = [
    "`Ed25519Test` checks RFC 8032 test 1 and determinism.",
    "`MerkleTreeTest` checks known values and every inclusion and consistency proof up to seventeen entries, with wrong indexes and rewritten histories refused.",
    "`VerifierTest` checks the canonical statement, every refusal and its reason, channels, rotation and revocation.",
    "`LogAndGateTest` checks the gate with and without a log entry, revocation by the log's day, signed heads, the monitor and a forked log.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next project, sbom-and-provenance, records what went into the build and how it was made, so a signature vouches not only for the bytes but for their origin.
"""

[[threat]]
id = "T1"
stride = "T"
threat = "The jar is changed on a mirror, a cache or a build server"
where = "`Verifier.verify`"
control = "A signed statement over the SHA-256 of the exact bytes, compared in constant time before anything runs"
residual = "A path to production that skips the gate runs unchecked"

[[threat]]
id = "T2"
stride = "S"
threat = "A forged statement or key claims to be the store's"
where = "`Verifier.verify`, `KeyRing`"
control = "Keys are pinned by id and channel; the signature must verify under the pinned public key"
residual = "The pinned keys themselves must reach every deployment through a trusted channel"

[[threat]]
id = "T3"
stride = "E"
threat = "A stolen or misused signing key signs a release the store never made"
where = "the signing key"
control = "Signatures must be in the public log, and the store's monitor reports releases it did not make"
residual = "Between the signing and the monitor's alert, a deployment that trusts the log may run the release; keep keys in hardware"

[[threat]]
id = "T4"
stride = "R"
threat = "A stolen key backdates its signature to before the revocation"
where = "`KeyRing.revoke`, `DeployGate.checkWithLog`"
control = "Revocation is judged by the day the log recorded the signature, not the day the signer wrote"
residual = "Without a log, a backdated signature passes, so verifiers that skip the log stay exposed"

[[threat]]
id = "T5"
stride = "T"
threat = "The log operator shows different histories to different readers"
where = "`TransparencyLog`"
control = "Signed heads, consistency proofs, and comparing heads: two heads of one size with different roots prove a fork"
residual = "Readers must actually exchange heads; a reader who never compares cannot see a fork"

[[threat]]
id = "T6"
stride = "D"
threat = "A deployment cannot verify because a key was revoked before it learned the new one"
where = "`KeyRing`"
control = "Rotation with an overlap in which both keys are trusted"
residual = "Deployments that are not updated during the overlap stop accepting releases"
