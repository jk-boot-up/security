[docs.session]
objectives = [
    "explain why a checksum next to a download does not prove integrity",
    "sign and verify a release statement that covers the exact bytes",
    "rotate and revoke a signing key without breaking deployments",
    "explain why the signer's own date cannot settle revocation",
    "describe what a transparency log and its inclusion and consistency proofs prove",
]
walkthrough = """
Start with the sealed crates. Run act one and ask who decided what runs in production. In act two, ask why the statement carries the digest and not the jar. In act three, ask
what the backdated signature tells about trusting dates. In act four, ask what the monitor would need to know to spot the bad entry. In act five, ask which deployment paths in
a real store would skip the gate.
"""
exercises = [
    "Add a second monitor that keeps the last head it saw and checks consistency with every new head.",
    "Make the gate refuse a release whose version is lower than the one already deployed, to stop a rollback to an old signed jar.",
    "Sign with two keys and require both, as a two-person rule for releases.",
    "Add a log key rotation: the verifier trusts two log keys for a while.",
]

[docs.explained]
sentence = """
A deployment should run only an artifact whose exact bytes match a statement signed by a trusted key for its channel, and whose signature is in an append-only public log
that the publisher monitors, so that changed files, edited statements, forged keys, secret signatures and backdated signatures are all refused or found.
"""
verdict = """
Sign every release statement over the artifact's digest and verify it at the point of use, with keys pinned per channel. Keep signing keys in hardware, rotate them with an
overlap, and revoke by an independent time. Require signatures to be in a transparency log, and monitor it for releases you did not make.
"""
