[docs.problem]
scenario = """
An online store builds a release jar and deploys it to production through mirrors, caches and build servers, any of which could change the file on the way.
"""
naive = """
Download the jar and run it, perhaps after comparing it with a checksum published in the same place.
"""
deliver = [
    "A canonical release statement with the SHA-256 of the artifact, signed with Ed25519.",
    "A verifier that pins public keys per channel, compares digests in constant time and explains every refusal.",
    "Key rotation with an overlap, and revocation from a day onwards.",
    "A Merkle transparency log with signed heads, inclusion and consistency proofs, after RFC 9162.",
    "A deployment gate that requires a log entry and revokes by the log's day, and a monitor that reports releases the store never made.",
]

[docs.prerequisites]
required = [
    "Java basics",
    "The digital-signatures project, or an idea of what a signature and a public key are",
]
not_required = [
    "Any signing service or certificate authority",
    "Knowledge of Merkle trees: the project builds one",
]
install = []

[docs.session]
objectives = [
    "explain why a checksum next to a download does not prove integrity",
    "sign and verify a release statement that covers the exact bytes",
    "rotate and revoke a signing key without breaking deployments",
    "explain why the signer's own date cannot settle revocation",
    "describe what a transparency log and its inclusion and consistency proofs prove",
]
walkthrough = """
Start with the sealed crates. Run act one and ask who decided what runs in production. In act two, ask why the statement carries the digest and not the jar. In act three, ask
what the backdated signature tells about trusting dates. In act four, ask what the monitor would need to know to spot the bad entry. In act five, ask which deployment paths in
a real store would skip the gate.
"""
exercises = [
    "Add a second monitor that keeps the last head it saw and checks consistency with every new head.",
    "Make the gate refuse a release whose version is lower than the one already deployed, to stop a rollback to an old signed jar.",
    "Sign with two keys and require both, as a two-person rule for releases.",
    "Add a log key rotation: the verifier trusts two log keys for a while.",
]

[docs.explained]
sentence = """
A deployment should run only an artifact whose exact bytes match a statement signed by a trusted key for its channel, and whose signature is in an append-only public log
that the publisher monitors, so that changed files, edited statements, forged keys, secret signatures and backdated signatures are all refused or found.
"""
verdict = """
Sign every release statement over the artifact's digest and verify it at the point of use, with keys pinned per channel. Keep signing keys in hardware, rotate them with an
overlap, and revoke by an independent time. Require signatures to be in a transparency log, and monitor it for releases you did not make.
"""
recognise = [
    "Package managers that refuse a package whose signature does not verify.",
    "Admission rules that only allow signed container images to run.",
    "Signed tree heads and inclusion proofs in Certificate Transparency logs.",
    "Security findings titled \"download of code without integrity check\", CWE-494.",
]

[spec]
purpose = """
Teach how to trust a release by signing a statement over its digest, verifying it with pinned keys per channel, rotating and revoking keys, and requiring every signature to
be in a public, append-only Merkle log that the publisher monitors.
"""
nongoals = [
    "Container image signing formats and registries: the -with-cosign version.",
    "Build provenance and SBOMs: the sbom-and-provenance project.",
    "Hardware security modules: described, not run.",
]
problem = """
Teams verify downloads with a checksum from the same place as the file, keep one signing key forever, trust the signer's dates, and have no way to see a signature made in secret.
"""
roles = [["The release statement", "`Statement`"], ["Signing keys", "`SigningKey`"], ["Trusted keys and revocation", "`KeyRing`"], ["Checks before deployment", "`Verifier`"], ["The Merkle tree and its proofs", "`MerkleTree`"], ["The public log", "`TransparencyLog`"], ["The store's watcher", "`Monitor`"], ["The point of use", "`DeployGate`"], ["Entry point", "`SigningDemo`"]]
requirements = [
    "A changed jar, an edited statement, a forged key, an unknown key and a missing signature are each refused with their reason.",
