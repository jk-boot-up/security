On the right, after the mirror. [[slnc 300]] The same file name, the same size. [[slnc 300]] But one bit of byte seven hundred was flipped, in amber, so the slash became a dot. [[slnc 300]] And the digest is completely different: it starts six D six C. [[slnc 300]] One bit changes every hex digit. [[slnc 700]]
At the bottom, the trusting deployment step. [[slnc 300]] It never looks at the bytes, so it accepts the altered jar, and runs it in production.
"""
