[[act]]
title = "A signed release, checked before it runs"
summary = "A statement with the jar's SHA-256 is signed with Ed25519 and checked against a pinned key: the real jar passes; a changed jar, an edited statement, a forged key, an unknown key and no signature are refused."
detail = """
The release statement names the artifact, its version, its channel, the SHA-256 of its exact bytes and the signing day. It is signed with the key stable-2026a, giving a
64-byte Ed25519 signature that is the same on every run. The deployment pins that key's public key and checks before it deploys. The real jar is accepted. The jar with one
byte changed is refused because it does not match the signed digest. The statement edited to version 2.4.1, with the signature kept, is refused. A signature from another key
that calls itself stable-2026a is refused, a key the deployment does not know is refused, and no signature at all is refused.
"""
speech = """
Second demo: a signed release. [[slnc 400]] The release team writes a statement. [[slnc 300]] The name, the version, the channel, and the S H A two fifty six of the jar's exact bytes. [[slnc 600]]
It signs the statement with its key. [[slnc 300]] And the deployment pins that key, and checks before it runs anything. [[slnc 600]]
The real jar is accepted. [[slnc 600]]
A jar with one byte changed is refused. [[slnc 300]] A statement edited to another version is refused. [[slnc 300]] A signature from a key that only claims the right name is refused. [[slnc 300]] And no signature at all is refused.
"""
rows = { sign = "active ok" }
console = [
    ["the statement: name=shop-app version=2.4.0 channel=stable sha256=4577e6b10a2f145d... signed-day=120", "muted"],
    ["signed with stable-2026a: an Ed25519 signature of 64 bytes, the same on every run: 6caf4ae3bad1f0aa...", "muted"],
    ["the real jar: accepted (signed by stable-2026a for shop-app 2.4.0)", "ok"],
    ["the jar with one byte changed: refused (the artifact does not match the signed digest)", "ok"],
    ["the statement edited to version 2.4.1, signature kept: refused (the signature does not match)", "ok"],
    ["signed by another key that calls itself stable-2026a: refused (the signature does not match)", "ok"],
    ["signed by a key the deployment does not know: refused (unknown key attacker-1)", "ok"],
    ["no signature at all: refused (no signature)", "ok"],
]

[[act]]
title = "Signing keys: per channel, rotated, revoked"
summary = "A beta key cannot sign for stable; two stable keys overlap from day 100; after revocation on day 130 a day 140 signature is refused, but a thief can backdate to day 120."
detail = """
A beta build signed with beta-2026a and offered to the stable deployment is refused: that key signs for beta, not stable. On day 100 stable-2026b is added, and both stable
keys are trusted while the build moves over, so releases signed on day 110 with either key are accepted. On day 130 stable-2026a is revoked. A release it signed on day 120,
before the revocation, is still accepted, and one it signed on day 140 is refused. But the signer writes the day: a thief with the old key signs a different jar on day 150,
dates it day 120, and it is accepted. A backdated signature passes, because nothing independent records when it was really made.
"""
speech = """
Third demo: managing the keys. [[slnc 400]] Each release channel has its own key. [[slnc 300]] A beta key cannot sign a stable release. [[slnc 600]]
Keys are rotated with an overlap. [[slnc 300]] For a while, the old key and the new key are both trusted. [[slnc 600]]
Then the old key is revoked. [[slnc 300]] A signature it made before the revocation still counts. [[slnc 300]] One made after does not. [[slnc 600]]
But the signer writes the date. [[slnc 300]] A thief with the old key signs a different jar, and dates it before the revocation. [[slnc 300]] And it is accepted.
"""
rows = { keys = "active amber" }
console = [
    ["a beta build signed with beta-2026a, offered to the stable deployment: refused (key beta-2026a signs for beta, not stable)", "ok"],
    ["day 100: stable-2026b is added, and both stable keys are trusted while the build moves over", "muted"],
    ["signed on day 110 with stable-2026a: accepted;  with stable-2026b: accepted", "ok"],
    ["day 130: stable-2026a is revoked", "muted"],
    ["a release it signed on day 120, before the revocation: accepted", "ok"],
    ["a release it signed on day 140: refused (signed on day 140, after key stable-2026a was revoked on day 130)", "ok"],
    ["a thief with the old key signs a different jar on day 150 and dates it day 120: accepted  <- A BACKDATED SIGNATURE", "bad"],
]

[[act]]
title = "A public log that every signature must be in"
summary = "Releases go into an append-only Merkle log with signed heads and proofs; the backdated jar is refused unlogged and refused when logged by the log's day; the monitor reports it; a forked log is caught."
detail = """
The store logs its releases, 2.3.0 on day 90 and 2.4.0 on day 120, in an append-only log whose tree head (size 2, root c1e815c249fdd097) is signed by the log. The proof that
2.4.0 is in the log is one hash, and it checks against the signed head. The deployment now requires a log entry and accepts the real release as entry 1. The thief's backdated
jar is refused when it is not in the log, and refused when it is, because the log recorded it on day 150, after the revocation: the log's day counts, not the signer's.
The store's monitor reads the log and reports entry 2 as a version 2.4.0 signed with stable-2026a that is not a release the store made. A log operator who hides that entry
from the monitor must show two views, both signed, both of size 3, with different roots. Each still extends the earlier head of size 2, but two signed heads of the same
size with different roots cannot both be true, so comparing heads proves the fork.
"""
speech = """
Fourth demo: a public log. [[slnc 400]] Every signature goes into a log that can only grow. [[slnc 300]] It is a Merkle tree, the structure behind certificate transparency. [[slnc 600]]
The log signs its head: its size, and its root hash. [[slnc 300]] A short proof shows that a release is in it. [[slnc 600]]
Now the deployment requires a log entry. [[slnc 300]] The thief's jar, kept out of the log, is refused. [[slnc 300]] Put into the log, it is refused too, because the log records the real day. [[slnc 600]]
The store's own monitor reads the log, and reports a release the store never made. [[slnc 600]]
And a log that shows the monitor one history, and the customer another, is caught. [[slnc 300]] Two signed heads of the same size, with different roots, cannot both be true.
"""
rows = { log = "active ok" }
console = [
    ["the store logs its releases: 2.3.0 on day 90 and 2.4.0 on day 120; the log's head: size 2, root c1e815c249fdd097..., signed by the log: true", "muted"],
    ["the proof that 2.4.0 is in the log: 1 hash, and it checks against the signed head: true", "ok"],
    ["the deployment, now requiring a log entry: accepted (signed by stable-2026a for shop-app 2.4.0, logged as entry 1)", "ok"],
    ["the thief's backdated jar, not logged: refused (the signature is not in the public log)", "ok"],
    ["the thief's backdated jar, logged on day 150: refused (logged on day 150, after key stable-2026a was revoked on day 130)  <- THE LOG'S DAY, NOT THE SIGNER'S", "ok"],
    ["the store's monitor reports: entry 2: version 2.4.0 signed with stable-2026a, digest 14669a56d76a94fc is not a release the store made", "amber"],
    ["two views, both signed by the log, both of size 3: roots f230f49e340792fc... and 92f28850530761dd...", "amber"],
    ["each view still extends the earlier head of size 2: true and true", "muted"],
    ["two signed heads of the same size with different roots cannot both be true: the fork is proved: true", "ok"],
]

[[act]]
title = "The bill"
summary = "The gate refuses an unsigned jar but protects only the paths through it; the signing key needs a hardware module; rotation needs an overlap; keyless signing is the modern alternative."
detail = """
The gate refuses an unsigned jar, but it protects only the paths that pass through it: a jar copied straight onto a server never meets the gate. The signing key is the crown
jewel: in the demo it comes from a fixed seed, and in practice it stays in a hardware module, with each signing approved and logged. Rotation is a project, because every
deployment must trust the new key before the old one is revoked, here with an overlap of 30 days. Keyless signing replaces long-lived keys with short-lived certificates tied
to an identity and recorded in a public log, which is the subject of the -with-cosign version.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] The gate refuses an unsigned jar. [[slnc 300]] But it only protects the paths that go through it. [[slnc 300]] A jar copied straight onto a server never meets it. [[slnc 600]]
The signing key is the crown jewel. [[slnc 300]] In practice it stays in a hardware module, and every signing is approved and logged. [[slnc 600]]
Rotation is a project. [[slnc 300]] Every deployment must trust the new key before the old one is revoked. [[slnc 600]]
And keyless signing replaces long lived keys with short lived certificates, tied to an identity, and recorded in a public log.
"""
rows = { bill = "active amber" }
console = [
    ["the gate refuses an unsigned jar: refused (no signature)", "ok"],
