[[act]]
title = "A signed release, checked before it runs"
summary = "A 151-byte statement with the jar's SHA-256 is signed with Ed25519 by stable-2026a; the deployment pins that public key and runs six checks in order: the real jar passes; a changed byte, an edited version, a forged key, an unknown key and no signature are each refused at their own check."
detail = """
The input is the release statement, 151 bytes of text in one exact form: release-statement/v1, name=shop-app, version=2.4.0, channel=stable, the full 64-hex-digit SHA-256 of the jar, and signed-day=120.
The result of signing: an Ed25519 signature of 64 bytes, starting 6caf4ae3bad1f0aa, by the key stable-2026a, whose 32-byte public key starts 797d4b479b52e839. Signing again gives the same signature, because Ed25519 is deterministic.
The deployment pins that public key and checks in order: 1 the statement parses in its exact form, 2 the key id is pinned, 3 the Ed25519 signature verifies, 4 the key and the statement are for the stable channel, 5 it was signed while the key was trusted, 6 the SHA-256 of the jar equals the signed one.
The results: the real jar is accepted; the jar with one byte changed is refused at check 6; the statement edited to 2.4.1 with the signature kept, and a forged key that calls itself stable-2026a, are refused at check 3 (bad signature); an unknown key, attacker-1, is refused at check 2; no signature is refused at once.
"""
figure = "check_grid"
figure_title = "Six checks in order, and where each attempt stops"
figure_speech = """
Second demo: a signed release. [[slnc 400]] On the left, the six checks the deployment runs, in order. [[slnc 300]] Is the statement in its one exact form? [[slnc 300]] Is the key one it pinned? [[slnc 300]] Does the Ed twenty five five nineteen signature verify? [[slnc 300]] Is it for the stable channel? [[slnc 300]] Was the key trusted on the signing day? [[slnc 300]] And does the jar's digest equal the signed digest? [[slnc 700]]
On the right, six attempts. [[slnc 300]] A green tick is a check passed, a red cross is where it stops. [[slnc 300]] The real jar passes all six, and is deployed. [[slnc 300]] The jar with one changed byte passes the first five, because the statement is genuine, and stops at the digest. [[slnc 300]] The edited version and the forged key stop at the signature. [[slnc 300]] An unknown key stops at the key, and no signature stops at once.
"""
speech = """
Here is the input: the statement, one hundred and fifty one bytes of text. [[slnc 300]] The name, the version, the channel, the full S H A two fifty six of the jar, and the day. [[slnc 400]] The result: an Ed twenty five five nineteen signature of sixty four bytes, by the key stable twenty twenty six A. [[slnc 300]] Signing again gives the same signature: Ed twenty five five nineteen is deterministic.
[[page]]
How the deployment checks. [[slnc 300]] It pins the public key of stable twenty twenty six A. [[slnc 300]] Then six checks, in this order, and the first one that fails gives the reason.
[[page]]
The results. [[slnc 300]] The real jar is accepted. [[slnc 300]] One changed byte: the jar differs from the signed digest. [[slnc 300]] An edited version, or a key that only claims the right name: a bad signature. [[slnc 300]] An unknown key, and no signature, are refused too.
"""
rows = { sign = "active ok" }
console = [
    ["BEFORE SIGNING (the statement, 151 bytes of text):", "code"],
    ["  release-statement/v1", "muted"],
    ["  name=shop-app", "muted"],
    ["  version=2.4.0", "muted"],
    ["  channel=stable", "muted"],
    ["  sha256=4577e6b10a2f145d... (64 hex digits)", "muted"],
    ["  signed-day=120", "muted"],
    ["AFTER SIGNING (Ed25519 with the key stable-2026a):", "code"],
    ["  public key  797d4b479b52e839... (32 bytes)", "muted"],
    ["  signature   6caf4ae3bad1f0aa... (64 bytes)", "muted"],
    ["  again       the same signature: Ed25519 is deterministic", "muted"],
    ["---", ""],
    ["HOW THE DEPLOYMENT CHECKS (it pins stable-2026a):", "code"],
    ["  1 parse    the statement is in its one exact form", "muted"],
    ["  2 key      the key id is one the deployment pinned", "muted"],
    ["  3 verify   Ed25519(public key, statement, signature)", "muted"],
    ["  4 channel  the key and the statement are for stable", "muted"],
    ["  5 dates    signed while the key was trusted", "muted"],
    ["  6 digest   sha256(jar) equals the signed sha256", "muted"],
