narration = "That's SBOMs with syft and grype. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] You cannot answer whether you are affected by an advisory without a list of what you ship, and the list is useful only if it is written at every build, scanned again on a schedule and read by a gate that has rules for exceptions. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a rule that refuses a library with no licence. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"
