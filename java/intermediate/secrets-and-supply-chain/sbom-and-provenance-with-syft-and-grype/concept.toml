[[act]]
title = "The bill"
summary = "The same log4j-core 2.14.1 jar renamed blob.dat is listed by syft as no log4j library and gets no grype advisory; the bill for shop-sbom:2.14.1 does not describe shop-sbom:2.25.5; and a scan cannot see tomorrow's advisories, whether the code is called, or who built the image."
detail = """
The input is an image whose /app/lib holds the log4j-core-2.14.1.jar renamed blob.dat. The result: syft lists no log4j library and grype finds no advisory, because a
scanner sees only what the cataloguer recognises.
The bill written for shop-sbom:2.14.1, offered for shop-sbom:2.25.5, does not describe it: write the bill at every build. And a scan cannot see tomorrow's advisories
(keep the bills and rescan on a schedule), cannot know whether the store calls the vulnerable code (a VEX statement records that), and cannot say who built the image
(signed provenance, in the plain sbom-and-provenance project).
"""
figure = "blind_spots"
figure_title = "What a scan cannot see"
figure_speech = """
Fifth demo: the bill. [[slnc 400]] On the left, a renamed jar. [[slnc 300]] The same vulnerable log4j core jar, copied in as blob dot dat. [[slnc 300]] syft does not recognise it, so it is not in the bill, and grype finds nothing. [[slnc 700]]
In the middle, a stale bill. [[slnc 300]] The bill written for the old image does not describe the new one. [[slnc 300]] Write it at every build. [[slnc 700]]
On the right, what no scan can do. [[slnc 300]] It cannot see tomorrow's advisories, so keep the bills and scan them again. [[slnc 300]] It cannot know if the store ever calls the vulnerable code. [[slnc 300]] And it cannot say who built the image.
"""
speech = """
The input: the jar renamed blob dot dat. [[slnc 300]] The result: syft lists no log4j library, and grype finds no advisory. [[slnc 400]] The stale bill does not describe the new image.
