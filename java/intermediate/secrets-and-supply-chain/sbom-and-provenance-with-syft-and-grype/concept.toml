[threatmodel]
scope = """
Container images that carry third-party Java libraries, catalogued by syft and scanned by grype before a gate. It covers known advisories, what the cataloguer can recognise, stale bills and old databases, and exceptions. It does not cover the signing of the bill or how the image was built.
"""
assets = [
    "The images the store runs.",
    "The bills of materials, one per build.",
]
actors = [
    "The team that builds and ships the images.",
    "An attacker who uses a published advisory.",
    "An author of a library that is shaded or renamed into a jar.",
]
boundaries = [
    "The image: it holds code that the store did not write.",
    "The gate: the only place that decides what may be deployed.",
]
assumptions = [
    "The pipeline writes the bill at the build, from the image that is deployed.",
    "The vulnerability database is refreshed before each scan.",
]
out_of_scope = [
    "Unknown vulnerabilities that have no advisory.",
    "Malicious libraries that have no advisory.",
]
tests = [
    "`SbomScanTest` builds real images and runs syft and grype for the bill, the advisories, a scan of the bill alone, the gate with exceptions, a renamed jar and a stale bill.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next project in this module, dependency-confusion-with-gradle, looks at where a dependency comes from, which neither a bill nor a scan can see.
"""

[[threat]]
id = "T1"
stride = "T"
threat = "A library with a known critical advisory is shipped"
where = "the image, the scanner"
control = "Scan every build and gate on critical and high advisories"
residual = "An advisory published after the scan"

[[threat]]
id = "T2"
stride = "I"
threat = "A library the cataloguer cannot recognise is in the image"
where = "the image"
control = "Build from declared dependencies and compare the bill with the build file"
residual = "A renamed or shaded jar is still invisible"

[[threat]]
id = "T3"
stride = "R"
threat = "A bill for another image is used as proof"
where = "the bill"
control = "Write the bill at every build and keep it with the image's digest"
residual = "A bill that nobody compares with the image"

[[threat]]
id = "T4"
stride = "T"
threat = "An old database misses new advisories"
where = "the scanner"
control = "Refresh the database before each scan and scan stored bills again on a schedule"
residual = "The days between a publication and the database"

[[threat]]
id = "T5"
stride = "E"
threat = "An exception stays for ever"
where = "the gate"
control = "Each exception names the advisory, the reason and an end day, and cannot cover a critical advisory"
residual = "Exceptions that are renewed without a review"

[poster]
headline = [["SBOMS WITH", "text"], ["SYFT AND GRYPE", "accent"]]
taglines = [["A bill of materials says what is inside an image, a scanner says which of it is known to b", "gold"]]
before = { code = "syft writes a CycloneDX bill for shop-sbom:2.14.1", note = "What a bill of materials answers", tag = "BEFORE" }
after = { code = "syft image -o cyclonedx-json | grype", note = "The bill", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "SBOMs and Scanning with syft and grype"
narration = "Hello, and welcome. [[slnc 400]] This video explains software bills of materials, and scanning them, with syft and grype. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A bill of materials is a list of every library inside an image. [[slnc 300]] syft writes that list, grype checks it against a database of known vulnerabilities, and a deployment gate decides what to do about each one. [[slnc 300]] But a scanner sees only what it recognises, and its database ages every day. [[slnc 600]] Think of the ingredients label on food, checked against a list of product recalls. [[slnc 600]] Our example is an online store."

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online store ships its application", "as a container image that carries log4j.", "", "The demo builds images with three", "log4j versions, writes their bills with syft,", "scans them with grype, upgrades,", "and puts a gate in front of the result."]
narration = "Here is the scenario. [[slnc 400]] An online store ships its application as a container image, and the image carries the log4j logging library. [[slnc 500]] The demo builds images with three versions of log4j: one from before log4 shell was fixed, one part way, and a current one. [[slnc 500]] It writes their bills of materials with syft, scans them with grype, upgrades, and puts a deployment gate in front of the result."

[[scene]]
key = "02-words"
kind = "bullets"
title = "The Words"
body = ["Bill of materials (SBOM): every package in an image", "Package URL: one package's exact name", "Advisory: a published vulnerability, with a fix", "Severity: critical, high, medium, low", "Gate: the check before deploying", "Exception: a written, dated decision to accept one"]
narration = """Before the demos, the words. [[slnc 500]] A bill of materials, an S B O M, lists every package in an image. [[slnc 500]] A package U R L is one package's exact name: its ecosystem, group, name and version. [[slnc 500]] An advisory is a published vulnerability, with the versions that fix it. [[slnc 500]] Its severity is critical, high, medium or low. [[slnc 500]] The gate is the check before deploying. [[slnc 500]] And an exception is a written, dated decision to accept one advisory for a while."""

[[scene]]
key = "02-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "02-purl"
kind = "figure"
title = "One package URL, and its fingerprint"
body = "purl_parts"
narration = """Let's see the core idea on one example: how the bill names one library. [[slnc 400]] At the top, the package U R L syft wrote for the log4j core jar. [[slnc 300]] It has four parts. [[slnc 300]] The type, maven, says which ecosystem. [[slnc 300]] The namespace is the Maven group. [[slnc 300]] Then the name, and the version. [[slnc 300]] A scanner matches advisories on exactly these parts. [[slnc 700]]
At the bottom, the jar's fingerprint. [[slnc 300]] The S H A one the bill records, and the S H A one this program works out from the jar itself. [[slnc 300]] They are the same, so the bill names this exact jar."""

[[scene]]
key = "03-acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "04-costs"
kind = "bullets"
title = "What It Costs"
body = ["A scanner finds only what the cataloguer recognises", "A bill must be written at every build", "The vulnerability database ages", "Most findings are not exploitable here", "Exceptions need an owner and an end date"]
narration = "Nothing is free. [[slnc 400]] Here is what it costs. [[slnc 500]] A scanner finds only the packages its cataloguer recognises. [[slnc 500]] A bill describes one image, so it must be written at every build. [[slnc 500]] The vulnerability database ages, so old scans must be run again. [[slnc 500]] Findings are many, and most are not exploitable in your use. [[slnc 300]] And each exception needs an owner, and an end date."

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["A CycloneDX or SPDX file next to a release", "pkg:maven/... package URLs", "A scan with thousands of base image findings", "\"Are we affected by log4shell?\""]
narration = "You have probably met this already. [[slnc 400]] A CycloneDX, or S P D X, file next to a release is a bill of materials. [[slnc 500]] A package U R L, starting with p k g colon maven, names one library exactly. [[slnc 500]] A scan with thousands of findings in the base image is the noise every team learns to sort. [[slnc 500]] And the question, are we affected by log4 shell, is what a bill of materials answers in minutes."

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "How To Use It"
body = ["A bill of materials for every image, at build time", "Keep it with the image", "Scan again on a schedule, with a fresh database", "Gate on critical and high", "Exceptions with a reason and an end date", "Know what your cataloguer cannot see"]
narration = "So, how do you use it? [[slnc 400]] Write a bill of materials for every image, at build time, and keep it with the image. [[slnc 500]] Scan it again on a schedule, with a fresh database. [[slnc 500]] Gate on critical and high advisories. [[slnc 300]] Allow exceptions only with a reason and an end date, and never for a critical one. [[slnc 500]] And know what your cataloguer cannot see, like a renamed jar."

[[scene]]
key = "07-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a rule that refuses", "a library with no licence."]
narration = "That's bills of materials and scanning, with syft and grype. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] You cannot answer whether you are affected by an advisory without a list of what you ship, and the list helps only if it is written at every build, scanned again on a schedule, and read by a gate. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a rule to the gate that refuses a library with no licence. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] syft and grype do the heavy work; the Java classes run them, read what they write, and decide. [[slnc 300]] Here are the ones that matter."""

[[class]]
name = "Lab"
what = "builds the images and runs the real commands"
[[class.part]]
title = "an image with one log4j version"
code = """
StringBuilder dockerfile = new StringBuilder("FROM " + BASE + "\\n");
...
dockerfile.append("COPY ").append(name).append(" /app/lib/\\n");
...
run(List.of("docker", "build", "-q", "-t", "shop-sbom:" + tag, context.toString()));
"""
speech = """Each image is the base image, plus two log4j jars copied into slash app slash lib. [[slnc 300]] The jars are downloaded once, and checked against a pinned S H A two fifty six."""

[[class]]
name = "Sbom"
what = "runs syft and reads the CycloneDX bill"
[[class.part]]
title = "catalogue an image"
code = """
static Sbom of(String image) throws IOException, InterruptedException {
    return parse(Lab.run(List.of("syft", image, "-o", "cyclonedx-json", "-q")));
"""
speech = """One command writes the bill: syft, the image, and the output format. [[slnc 300]] The class keeps the J S O N, and reads the components from it."""
[[class.part]]
title = "the libraries, by package URL"
code = """
if ("library".equals(c.get("type")) && c.get("purl") != null) {
    out.add(String.valueOf(c.get("purl")));
"""
speech = """Every library component with a package U R L is one entry. [[slnc 300]] A sorted set makes two bills easy to compare."""

[[class]]
name = "Scan"
what = "runs grype and reads its findings"
[[class.part]]
title = "scan an image, or a bill alone"
code = """
return parse(Lab.run(List.of("grype", image, "-o", "json", "-q")));
...
return parse(Lab.run(List.of("grype", "sbom:" + sbom, "-o", "json", "-q")));
"""
speech = """grype scans an image, or a bill written earlier, with the prefix s b o m colon. [[slnc 300]] Each match becomes a finding: the package, the advisory, its severity, and the versions that fix it."""

[[class]]
name = "Gate"
what = "the deployment gate, with exceptions that end"
[[class.part]]
title = "an exception covers a high advisory, until its day"
code = """
boolean covered = f.severity().equals("High")
        && waivers.stream().anyMatch(w -> covers(w, f, today));
...
return (w.id().equals(f.id()) || w.id().equals(f.alias())) && w.endsOnDay() >= today;
"""
speech = """Only a high advisory can be covered, never a critical one. [[slnc 300]] And only while the exception's end day has not passed."""

[[class]]
name = "Purl"
what = "a teaching class: a package URL split into its parts"
[[class.part]]
title = "type, namespace, name, version"
code = """
String type = rest.substring(0, rest.indexOf('/'));
String path = rest.substring(type.length() + 1, rest.lastIndexOf('@'));
String version = rest.substring(rest.lastIndexOf('@') + 1).replaceAll("[?#].*$", "");
"""
speech = """The type comes before the first slash, and the version after the at sign. [[slnc 300]] Between them, the namespace and the name."""

[[acronym]]
short = "SBOM"
long = "Software Bill of Materials: every package in an image"
say = "S B O M is software bill of materials: the list of every package in an image."
[[acronym]]
short = "CVE"
long = "Common Vulnerabilities and Exposures: a public advisory's id"
say = "C V E is common vulnerabilities and exposures: the public id of an advisory, such as C V E twenty twenty one, four four two two eight."
[[acronym]]
short = "URL, purl"
long = "Uniform Resource Locator; package URL: a package's exact name"
say = "U R L is uniform resource locator. A package U R L, or purl, is the exact name of a package."
[[acronym]]
short = "SHA-1"
long = "Secure Hash Algorithm 1: the fingerprint syft records for a jar"
say = "S H A one is secure hash algorithm one: the fingerprint syft records for each jar."
[[acronym]]
short = "OS"
long = "Operating System: here, Alpine Linux's packages"
say = "O S is operating system: here, the Alpine Linux packages of the base image."
[[acronym]]
short = "JSON"
long = "JavaScript Object Notation: the format of the bill and the scan"
say = "J S O N is JavaScript object notation, the text format of the bill and of the scan."
[[acronym]]
short = "VEX"
long = "Vulnerability Exploitability eXchange: is it exploitable here?"
say = "V E X is vulnerability exploitability exchange: a statement of whether an advisory can be exploited in this product."
[[acronym]]
short = "SPDX"
long = "Software Package Data Exchange: another SBOM format"
say = "S P D X is software package data exchange, the other common S B O M format."
[[acronym]]
short = "GHSA"
long = "GitHub Security Advisory: an advisory id from GitHub"
say = "G H S A is a GitHub security advisory id; grype maps it to the C V E."

