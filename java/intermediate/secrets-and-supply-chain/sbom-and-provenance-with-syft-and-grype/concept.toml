level = "intermediate"
module = "secrets-and-supply-chain"
title = "SBOMs and Scanning with syft and grype"
short_title = "SBOMs with syft and grype"
package = "sbomscan"
main_class = "SbomScanDemo"
tagline = "A bill of materials says what is inside an image, a scanner says which of it is known to be broken, and a gate decides what to do about it"
bold = "A bill of materials written by syft lists every library an image contains by package URL, grype matches those packages against a vulnerability database, and a deployment gate can refuse critical and high advisories except where a written exception with an end date covers a high one; but a scanner finds only what the cataloguer recognises, a bill describes exactly one image, the database is data that ages, and a finding is a question, not a verdict."
domain = "an online store"
domain_note = ""
youtube_description = "SBOMs and vulnerability scanning with the real syft and grype commands: images built here with log4j 2.14.1, 2.16.0 and 2.25.5, a CycloneDX bill of materials with package URLs, grype matching log4j-shell and its follow-ups with the versions that fix them, a scan of the bill alone, a diff of two bills, a deployment gate with time-limited exceptions that cannot cover a critical advisory, a renamed jar that no scanner finds, a stale bill, and the age of the vulnerability database."
thumb_lines = ["SBOMS WITH", "SYFT AND GRYPE"]
thumb_code = "syft image -o cyclonedx-json | grype"
youtube_title = "SBOMs and Scanning with syft and grype: log4j, a Gate, Exceptions and Blind Spots (OWASP A03, A06)"
