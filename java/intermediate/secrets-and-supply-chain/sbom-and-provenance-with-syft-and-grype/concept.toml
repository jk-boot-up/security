[readme]
intro = """
The plain [sbom-and-provenance](../sbom-and-provenance) project writes a bill of materials and signed build provenance by hand. This one uses the real tools: **syft 1** catalogues a container image into a CycloneDX bill of materials and **grype 0.12x** matches it against a vulnerability database. It needs Docker, the `syft` and `grype` commands (`brew install syft grype`) and, the first time, a network for the database and for three log4j jars from Maven Central; its tests are tagged `integration`: `./gradlew integrationTest`.

What it shows:
- **What a bill answers.** Images are built here from a base image already on the machine with log4j 2.14.1, 2.16.0 or 2.25.5. syft lists the libraries by package URL, with hashes and licences. It names the image, and not the repository, the commit or the builder: that is what provenance is for.
- **Scanning it.** grype finds log4j-shell (critical) and its follow-ups, with the versions that fix them, in the image and in the bill alone. The rest of the findings come from the operating system packages of the base image and change every day, so they are never printed.
- **Fixing it and checking.** The new bill differs from the old in exactly the libraries that changed, and the new scan is clean.
- **A gate.** No critical or high advisory in the store's own libraries, except an exception that names the advisory, the reason and the day it ends. An exception cannot cover a critical advisory and it runs out.
- **The bill.** A log4j jar renamed `blob.dat` is found by no scanner; a bill describes one image only; the vulnerability database is data with an age; a finding is a question, not a verdict.

**Maps to:** OWASP Top 10 (2025) A03 Software Supply Chain Failures and A06 Vulnerable and Outdated Components · CWE-1395 (dependency on a vulnerable third-party component) · CycloneDX · NTIA minimum elements for an SBOM.
"""
analogy = """
The ingredients list on a food package, checked against the recall notices. The list is only as good as the person who wrote it, a recall tomorrow still applies to a package made today, and an ingredient that was relabelled is not on the list at all.
"""
scenario = """
An online store ships its application as a container image that carries log4j. The demo builds the images, writes and reads the bills of materials, scans them, upgrades, and puts a deployment gate in front of the result.
"""
costs = [
    "**A scanner finds only what the cataloguer recognises:** a renamed or shaded jar, or a library copied in as source, is invisible.",
    "**The bill must be written at every build,** because it describes exactly one image.",
    "**The database is data that ages,** and a scan with an old database is a scan of last month's world.",
    "**Findings are many and mostly not exploitable,** so someone must triage them and record the answer, for example as a VEX statement.",
    "**Exceptions need an owner and an end date** or they become permanent.",
]
too_much = """
A small team with one application and a handful of libraries can read its dependency list by hand. Add scanning when the list is longer than anyone reads, or when a customer or a regulator asks for the bill.
"""
met_before = [
    "`syft` or `grype` as a step in a pipeline.",
    "A `bom.json` or `sbom.cdx.json` attached to a release.",
    "A scanner report with hundreds of findings, most of them in the base image.",
    "A `.grype.yaml` file with ignore rules.",
]
where = """
This is the tools version of [sbom-and-provenance](../sbom-and-provenance), in the [secrets-and-supply-chain](..) module. The signed provenance of how an image was built is in that project and in [artifact-signing-with-cosign](../artifact-signing-with-cosign).
"""
twin = """
The images are real images built on this machine with docker build, and the commands are the real syft and grype. Digests, image ids and the number of operating system findings are never printed; the demo takes about a minute.
"""
test_note = "The tests build the four images once for the whole class and need Docker, syft and grype (./gradlew integrationTest)."

[[act]]
title = "What a bill of materials answers"
summary = "syft lists the libraries of an image by package URL, with hashes and licences, and says nothing about who built it."
detail = """
syft catalogues the image shop-sbom:2.14.1 without running it and writes a CycloneDX JSON document. It lists operating system packages and the application's libraries, log4j-core and log4j-api 2.14.1, each by its package URL, which names the ecosystem, the library and the version. Hashes and licences are there. What it does not say is which repository, commit or builder made the image; that is what provenance is for.
"""
speech = """
First demo: what a bill of materials answers. [[slnc 400]] syft reads the image without running it. [[slnc 600]]
It lists every library by package URL, with hashes and licences. [[slnc 600]]
It does not say who built the image, or from what.
"""
rows = { bill = "active ok" }
console = [
    ["syft writes a CycloneDX bill for shop-sbom:2.14.1", "ok"],
    ["log4j-core and log4j-api 2.14.1, by package URL", "ok"],
    ["no repository, commit or builder in the bill", "bad"],
]

[[act]]
title = "Scanning it against known advisories"
summary = "grype finds log4j-shell and its follow-ups in the image and in the bill alone, and says which versions fix them."
detail = """
grype matches the image's packages to its vulnerability database: two critical advisories in log4j, CVE-2021-44228 and CVE-2021-45046, and one high, CVE-2021-45105, with the versions that fix them. Scanning the bill alone, not the image, finds the same advisories. The rest of the findings come from the base image's operating system packages, and their number changes every day, so the demo does not print it.
"""
speech = """
Second demo: scanning it. [[slnc 400]] grype matches the packages to its database. [[slnc 600]]
Two critical advisories and one high, with the versions that fix them. [[slnc 600]]
The bill alone is enough: the image is not needed.
"""
rows = { scan = "active wrong" }
console = [
    ["critical: CVE-2021-44228, CVE-2021-45046; high: CVE-2021-45105", "bad"],
    ["fixed in 2.15.0, 2.16.0 or 2.17.0", "ok"],
    ["the bill alone finds the same advisories", "ok"],
]

[[act]]
title = "Fixing it, and checking that it is fixed"
summary = "The new bill differs from the old in exactly the libraries that changed, and the new scan has no critical or high advisory in log4j."
detail = """
The upgrade that clears every critical and high advisory is 2.17.0 or later, and the team builds 2.25.5. The new bill is compared with the old: it removes the 2.14.1 libraries and adds the 2.25.5 ones, and the base image's packages are the same in both. The scan of the new image has no critical or high advisory in log4j, where the old image had three.
"""
speech = """
Third demo: fixing it, and checking. [[slnc 400]] The team upgrades to a version past every fix. [[slnc 600]]
The new bill differs in exactly the libraries that changed. [[slnc 600]]
The new scan has no critical or high advisory in log4j.
"""
rows = { fix = "active ok" }
console = [
    ["upgrade to log4j 2.25.5", "ok"],
    ["the bills differ in exactly the log4j libraries", "ok"],
    ["critical and high in log4j: 0, where the old image had 3", "ok"],
]

[[act]]
title = "A gate that reads the scan"
summary = "No critical or high advisory in the store's own libraries; a high one may have a written exception with an end date, a critical one may not."
detail = """
The gate refuses an image with a critical or high advisory in the store's libraries. The old image is refused with two critical and one high. An exception for the high one does not help, because an exception cannot cover a critical advisory. 2.16.0 fixes the critical ones and is still refused because of the high one. With a written exception that names the advisory, the reason and the day it ends, it is deployed on day 100 and refused on day 130, after the exception ran out on day 120. 2.25.5 is deployed.
"""
speech = """
Fourth demo: a gate that reads the scan. [[slnc 400]] Critical or high advisories in the store's libraries are refused. [[slnc 600]]
An exception may cover a high one, never a critical one. [[slnc 600]]
It names the advisory, the reason and the day it ends, so it cannot stay for ever.
"""
rows = { gate = "active ok" }
console = [
    ["2.14.1 -> refused (2 critical and 1 high)", "ok"],
    ["2.16.0 with an exception on day 100 -> deployed; on day 130 -> refused", "ok"],
    ["2.25.5 -> deployed", "ok"],
]

[[act]]
title = "The bill"
summary = "A renamed jar is found by no scanner, a bill describes one image only, the database ages, and a finding is a question, not a verdict."
detail = """
The same log4j-core 2.14.1 jar renamed blob.dat in another image is in no bill and in no scan: a scanner finds only what the cataloguer recognises. The bill written for 2.14.1 does not describe 2.25.5, so a bill must be written at every build. The database the scan matches against is data, with an age. An advisory published tomorrow matches a bill written today, so the bills must be kept and scanned again on a schedule. A finding is a question, not a verdict: a vulnerable library the store never calls is still reported, and a statement of exploitability records the answer.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] A renamed jar is in no bill and in no scan. [[slnc 600]]
A bill describes exactly one image, and the database has an age. [[slnc 600]]
A finding is a question, not a verdict.
"""
rows = { bill = "active ok" }
console = [
    ["log4j-core renamed blob.dat -> in no bill, in no scan", "bad"],
    ["the bill of 2.14.1 offered for 2.25.5 -> does not describe it", "bad"],
    ["the database is data: it has an age", "ok"],
]

