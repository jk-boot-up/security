[[scene]]
key = "01-poster"
kind = "poster"
title = "SBOMs and Build Provenance"
narration = """Hello, and welcome. [[slnc 400]] This video explains software bills of materials and build provenance, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A bill of materials lists what is inside a release. [[slnc 300]] Provenance records who built it, and from which source. [[slnc 600]] Think of food in a shop. [[slnc 300]] The label lists the ingredients. [[slnc 300]] But a certificate of origin, stamped by the factory, says where it was made, and from which batch. [[slnc 700]] In this video, the domain is an online store. [[slnc 500]] By the end, you will hear what a bill of materials can and cannot say. [[slnc 300]] What a signed provenance statement contains. [[slnc 300]] How a deployment checks it. [[slnc 300]] And why builds that can be repeated matter."""

