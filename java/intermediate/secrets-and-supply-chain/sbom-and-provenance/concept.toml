[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] Nothing here talks to a network: each class is one idea from the demos. [[slnc 300]] Here are the ones that matter."""

[[class]]
name = "Sbom"
what = "a CycloneDX bill of materials, written and checked"
[[class.part]]
title = "one component: package URL and SHA-256"
code = """
list.add(Json.object(
        "type", "library",
        ...
        "purl", c.purl(),
        "hashes", List.of(Json.object("alg", "SHA-256", "content", c.sha256()))));
"""
speech = """Each library becomes one component. [[slnc 300]] Its package U R L names it, and its S H A two fifty six pins its exact bytes."""
[[class.part]]
title = "is this the SBOM for this jar?"
code = """
String content = Json.text(list.get(0), "content");
return content != null
        && Digests.same(Digests.unhex(content), Digests.sha256(artifact));
"""
speech = """An S B O M belongs to a jar when its application hash equals the jar's own hash. [[slnc 300]] The comparison takes the same time wherever the bytes differ."""

[[class]]
name = "Provenance"
what = "an in-toto statement with a SLSA Provenance predicate"
[[class.part]]
title = "the subject, the source and the builder"
code = """
"subject", List.of(Json.object(
        "name", artifactName,
        "digest", Json.object("sha256", Digests.hex(Digests.sha256(artifact))))),
...
"externalParameters", Json.object(
        "repository", source.repository(), "ref", source.ref()),
...
"builder", Json.object("id", builderId),
"""
speech = """The subject is the jar, by name and digest. [[slnc 300]] The external parameters say which repository and branch were built. [[slnc 300]] And the builder id names who ran it."""

[[class]]
name = "Dsse"
what = "the signing envelope"
[[class.part]]
title = "the pre-authentication encoding"
code = """
byte[] head = ("DSSEv1 " + type.length + " " + payloadType + " " + body.length + " ")
        .getBytes(StandardCharsets.UTF_8);
"""
speech = """This line is the whole encoding. [[slnc 300]] The type and its length go in front of the body, so the signature covers both."""
[[class.part]]
title = "open: the type, then the signature"
code = """
if (!PAYLOAD_TYPE.equals(Json.text(root, "payloadType"))) {
    throw new BadEnvelopeException("the payload is not an in-toto statement");
...
if (Ed25519.verify(key, pae(PAYLOAD_TYPE, payload), signature)) {
    return new Opened(payload, keyId);
"""
speech = """Opening an envelope first checks the type. [[slnc 300]] Then it verifies the signature over the encoded bytes, with a key the caller trusts."""

[[class]]
name = "Policy"
what = "the deployment gate: seven checks, in order"
[[class.part]]
title = "a refusal names its check"
code = """
if (!subjectMatches(statement, artifactName, artifact)) {
    return Verdict.refuse(4, "the statement is about another artifact");
}
if (!builderId.equals(
        Json.text(statement, "predicate", "runDetails", "builder", "id"))) {
    return Verdict.refuse(5, "built by a builder that is not trusted");
"""
speech = """Each check is a plain if. [[slnc 300]] The first one that fails ends the check, with its number and a reason. [[slnc 300]] Only a release that passes all seven is deployed."""

[[class]]
name = "Pipeline"
what = "a build pipeline placed at a SLSA build level"
[[class.part]]
title = "the level from three facts"
code = """
if (!writesProvenance) {
    return 0;
}
if (!hostedPlatformSigns) {
    return 1;
}
return buildsIsolatedFromSigningKey ? 3 : 2;
"""
speech = """Three facts decide the level. [[slnc 300]] Is there provenance? Does the platform sign it, not a developer? [[slnc 300]] And are builds kept away from the signing key?"""

[[class]]
name = "Archive"
what = "builds the jar, carelessly or reproducibly"
[[class.part]]
title = "sorted entries, the commit's time"
code = """
static byte[] reproducible(Map<String, byte[]> files) {
    return zip(new ArrayList<>(new TreeMap<>(files).keySet()), files, COMMIT_TIME);
...
entry.setTimeLocal(time);
"""
speech = """A reproducible build sorts the entries by name, and stamps every entry with the commit's time. [[slnc 300]] So two builds of one commit give the same bytes."""

[[acronym]]
short = "SBOM"
long = "Software Bill of Materials: what a release contains"
say = "S B O M is software bill of materials: the list of what a release contains."
[[acronym]]
short = "SLSA"
long = "Supply-chain Levels for Software Artifacts: build levels 0 to 3"
say = "S L S A is supply chain levels for software artifacts: a scale for how far a build's provenance can be trusted."
[[acronym]]
short = "DSSE"
long = "Dead Simple Signing Envelope: holds a payload and its signatures"
say = "D S S E is the dead simple signing envelope: it holds a payload, its type, and its signatures."
[[acronym]]
short = "PAE"
long = "Pre-Authentication Encoding: the bytes DSSE signs"
say = "P A E is the pre authentication encoding: the exact bytes D S S E signs, with the type and the lengths in front."
[[acronym]]
short = "SHA-256"
long = "Secure Hash Algorithm, 256 bits: a fingerprint of bytes"
say = "S H A two fifty six is the secure hash algorithm with two hundred fifty six bits: a fingerprint of any bytes."
[[acronym]]
short = "URL, purl"
long = "Uniform Resource Locator; package URL: a package's standard name"
say = "U R L is uniform resource locator. A package U R L, or purl, is the standard name of a package, such as pkg maven, group, name, version."
[[acronym]]
short = "JSON"
long = "JavaScript Object Notation: the text format of the documents"
say = "J S O N is JavaScript object notation, the text format the S B O M and the statement are written in."
[[acronym]]
short = "CI"
long = "Continuous Integration: the build service that runs on every change"
say = "C I is continuous integration: the build service that builds every change."
[[acronym]]
short = "SPDX"
long = "Software Package Data Exchange: another SBOM format"
say = "S P D X is software package data exchange, the other common S B O M format."

[threatmodel]
scope = """
How an online store records what a release contains and how it was built, and how its deployment checks that record: the SBOM, the provenance statement, the DSSE
envelope, the builder's key and the deployment gate. It does not cover vulnerabilities in the listed components, the source review process, or public transparency logs.
"""
assets = [
    "The release jar and its SBOM.",
    "The provenance statements and the builder's signing key.",
    "The build service itself.",
    "The deployment gate's trust settings: the key, builder id, repository and branch.",
]
actors = [
    "The store's build service.",
    "Developers, who can push branches and run builds on their laptops.",
    "An outsider who can fork the repository and request builds.",
    "A thief or insider with access to the builder's key or the build machines.",
]
boundaries = [
    "Source control to the build service: what is built is decided here.",
    "Build service to everything else: only the platform should hold the signing key.",
    "Delivery to production: nothing runs until the gate has checked it.",
]
assumptions = [
    "The gate's trusted key and builder id were installed through a trusted channel.",
    "The gate is on every path to production.",
    "In the demo, the builder key comes from a fixed demo seed and timestamps are fixed strings.",
]
out_of_scope = [
    "Scanning components against advisories: the -with-syft-and-grype version.",
    "Public transparency logs: the artifact-signing project.",
    "Reviewing the commits that main contains.",
]
tests = [
    "`DsseAndJsonTest` checks the DSSE encoding against the specification's example, trusted and untrusted keys, bad envelopes, and the JSON reader and writer.",
    "`PolicyTest` checks every gate refusal and its reason, an edited statement, and the statement's fields.",
    "`SbomAndBuildTest` checks the CycloneDX document, SBOM matching, reproducible and careless builds, and SLSA levels.",
    "`Ed25519Test` checks RFC 8032 test 1 and determinism.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next project, dependency-confusion, looks at how a build can be tricked into fetching the wrong component in the first place.
"""

[[threat]]
id = "T1"
stride = "S"
threat = "A build of a fork or an unreviewed branch is deployed as if it were the release"
where = "`Policy.check`"
control = "The gate checks the repository and branch named in signed provenance"
residual = "A malicious commit merged into main passes; code review protects main"

[[threat]]
id = "T2"
stride = "E"
threat = "A stolen builder key signs provenance that lies about the source"
where = "the builder key"
control = "Only the build platform holds the key; builds are isolated from it at SLSA level three"
residual = "Until the theft is noticed and the key revoked, forged statements pass"

[[threat]]
id = "T3"
stride = "T"
threat = "A compromised build service builds something other than the commit and signs provenance that looks honest"
where = "`Builder.build`"
control = "Reproducible builds let an independent rebuild of the commit check the digest"
residual = "Someone has to actually rebuild and compare"

[[threat]]
id = "T4"
stride = "T"
threat = "A statement is edited after signing, or a different jar is paired with real provenance"
where = "`Dsse.open`, `Policy.check`"
control = "The signature covers the payload type and statement; the subject digest must match the jar"
residual = "None within this check"

[[threat]]
id = "T5"
stride = "R"
threat = "Nobody can tell which components or source a running release came from"
where = "`Sbom`, `Provenance`"
control = "An SBOM and signed provenance kept with every release"
residual = "A stale SBOM misleads; it must be written at every build"
