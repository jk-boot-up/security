[[act]]
title = "SLSA build levels, and builds that can be repeated"
summary = "A laptop build is level 0, self-signed provenance level 1, the hosted CI runner level 2 and a hardened platform level 3; two careless builds of one commit give different jars, two reproducible builds give the same jar, 38a6dd0dd912fc89..., which the gate accepts against the provenance."
detail = """
The input is four pipelines and what each does: the laptop writes no provenance; the signed laptop writes it but the developer signs it; the hosted CI runner has the
platform sign it, but the key is not isolated from the build steps; the hardened platform isolates it. The result: levels 0, 1, 2 and 3, held back by "no provenance",
"the developer holds the key" and "build steps can reach the key".
Two careless builds of the same commit, at 2026-10-01 09:03:12 and 2026-10-02 14:40:51, with the files in the order the file system listed them, give jars
2f40929e19141de8... and abed690ac267ede2...: not the same. Two reproducible builds, both stamped with the commit time 2026-10-01 09:00:00 and with entries sorted by
name, both give 38a6dd0dd912fc89..., the provenance subject, so the gate deploys the rebuild.
"""
figure = "levels_and_builds"
figure_title = "Build levels, and builds that can be repeated"
figure_speech = """
Fourth demo: build levels, and builds that can be repeated. [[slnc 400]] On the left, the S L S A build levels, climbing up. [[slnc 300]] A laptop build with no provenance is level zero. [[slnc 300]] A laptop that signs its own provenance is level one: the developer holds the key, so could forge it. [[slnc 300]] The hosted C I runner is level two: build steps can reach the key, so a malicious step could sign anything. [[slnc 300]] A hardened platform that keeps every build away from the key is level three. [[slnc 700]]
