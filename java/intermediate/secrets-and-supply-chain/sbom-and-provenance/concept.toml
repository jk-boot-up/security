[[act]]
title = "Provenance: who built it, from what"
summary = "An in-toto statement with a SLSA Provenance v1 predicate names the jar by digest, the repository, branch and commit, and the builder; DSSE signs the encoding DSSEv1 28 application/vnd.in-toto+json 768 followed by the statement, so the same bytes under another type do not verify."
detail = """
The input is the statement the build service writes: _type https://in-toto.io/Statement/v1, the subject shop-1.4.0.jar with SHA-256 38a6dd0dd912fc89..., the predicate
type https://slsa.dev/provenance/v1, the build type, the repository https://git.shop.example/shop/store, the ref refs/heads/main, the commit 4f1c2a9e8b7d..., the
builder https://build.shop.example/runner/v1 and the invocation build-1042.
How the signed bytes are made: DSSE's pre-authentication encoding is DSSEv1, the length of the type in bytes, the type, the length of the body in bytes, and the
body. The type application/vnd.in-toto+json is 28 bytes and the statement 768, so the signed bytes start "DSSEv1 28 application/vnd.in-toto+json 768 {".
The result is an envelope: the payload type, the payload in base64 (1024 characters), the key id shop-ci-2026 and a 64-byte Ed25519 signature, which verifies with
the builder's key. The same bytes offered as application/json are signed bytes that start "DSSEv1 16 application/json 768", over which the signature is false, and
the gate refuses the type before it even tries.
"""
figure = "statement_envelope"
figure_title = "The statement, the bytes that are signed, and the envelope"
figure_speech = """
Second demo: provenance. [[slnc 400]] On the left, the statement the build service writes. [[slnc 300]] The subject is the jar, named by its fingerprint. [[slnc 300]] Then where it came from: the repository, the branch, and the exact commit. [[slnc 300]] And the builder that ran the build. [[slnc 700]]
At the top right, the bytes that are signed. [[slnc 300]] D S S E does not sign the statement alone. [[slnc 300]] It signs a fixed word, the length of the type, the type, the length of the statement, and the statement. [[slnc 300]] The type is twenty eight bytes, the statement seven hundred and sixty eight. [[slnc 700]]
Below it, the envelope that is published next to the jar: the type, the statement in base sixty four, the key's name, and the signature. [[slnc 700]]
At the bottom left, the same statement under another type. [[slnc 300]] The signed bytes would be different, so the signature does not verify.
"""
speech = """
Here is the statement, field by field: the subject and its fingerprint, the predicate type, the build type, the repository, the branch, the commit, the builder, and the build's id.
[[page]]
How the signed bytes are made. [[slnc 300]] The type is twenty eight bytes, the body seven hundred and sixty eight, and both lengths go in front of the statement. [[slnc 500]] The envelope carries the statement in base sixty four, the key id, and a sixty four byte Ed25519 signature. [[slnc 300]] With the builder's key, it verifies.
[[page]]
The same bytes under the type application json. [[slnc 300]] The signed bytes now start with sixteen and that type, so the signature is false. [[slnc 300]] And the gate refuses it.
"""
rows = { provenance = "active ok" }
console = [
    ["THE STATEMENT (in-toto, written by the builder):", "code"],
    ["  _type          https://in-toto.io/Statement/v1", "muted"],
    ["  subject        shop-1.4.0.jar", "muted"],
    ["                 sha256 38a6dd0dd912fc89...", "muted"],
    ["  predicateType  https://slsa.dev/provenance/v1", "muted"],
    ["  buildType      https://build.shop.example/gradle-jar/v1", "muted"],
    ["  repository     https://git.shop.example/shop/store", "muted"],
    ["  ref            refs/heads/main", "muted"],
    ["  gitCommit      4f1c2a9e8b7d...", "muted"],
    ["  builder.id     https://build.shop.example/runner/v1", "muted"],
    ["  invocationId   build-1042", "muted"],
    ["---", ""],
    ["HOW THE SIGNED BYTES ARE MADE (DSSE PAE):", "code"],
    ["  rule    DSSEv1 len(type) type len(body) body", "muted"],
    ["  type    application/vnd.in-toto+json = 28 bytes", "muted"],
    ["  body    the statement = 768 bytes", "muted"],
    ["  signed  DSSEv1 28 application/vnd.in-toto+json 768 {...", "muted"],
    ["THE ENVELOPE (published next to the jar):", "code"],
    ["  payloadType  application/vnd.in-toto+json", "muted"],
    ["  payload      base64 of the 768 bytes, 1024 chars", "muted"],
    ["  keyid        shop-ci-2026", "muted"],
    ["  sig          Ed25519, 64 bytes: 4bcda4522f65c0c7...", "muted"],
    ["VERIFYING THE ENVELOPE:", "code"],
    ["  Ed25519      key shop-ci-2026, over the signed bytes: true", "muted"],
    ["---", ""],
    ["THE SAME BYTES, OFFERED AS ANOTHER TYPE:", "code"],
    ["  payloadType   application/json", "muted"],
    ["  signed bytes  DSSEv1 16 application/json 768 {...", "muted"],
    ["  Ed25519       over those bytes: false", "muted"],
    ["  the gate      refused: the payload is not an in-toto statement", "muted"],
]

[[act]]
title = "Checking before deploying"
summary = "The gate trusts one key, one builder, one repository and the main branch, and runs seven checks in order; it deploys the real release and refuses a fork (check 6), a branch (7), a laptop key (2), the staging runner (5), an edited statement (2), a swapped jar (4) and no provenance (1)."
detail = """
The input is the gate's policy: the key shop-ci-2026, the builder https://build.shop.example/runner/v1, the repository https://git.shop.example/shop/store and the
ref refs/heads/main; and its seven checks, in order: provenance, signature, statement, subject, builder, repository, branch. Eight releases are offered.
The result: A, the real release, passes all seven checks and is deployed. B, a fork, fails check 6 (another repository); C, an unreviewed branch, check 7; D, a
laptop's key, check 2 (no signature from a trusted builder); E, the trusted key naming the staging runner, check 5; F, the fork's statement edited to name main's
repository, check 2; G, the fork's jar with the real provenance, check 4; H, no provenance, check 1.
How two refusals are made: the fork's signed statement is 772 bytes and names the fork; the edited one is 768 bytes and names main's repository, and Ed25519 over the
edited bytes is false. The real statement's subject is sha256 38a6dd0dd912fc89..., but the fork's jar is 6d76d2c9bc23cc20..., so the statement is about another artifact.
"""
figure = "gate_matrix"
figure_title = "Eight releases against the gate's seven checks"
figure_speech = """
Third demo: checking before deploying. [[slnc 400]] Across the top, the gate's seven checks, in order. [[slnc 300]] Is there provenance? Is the signature from a trusted key? Is it a provenance statement? Is it about this jar? Then the builder, the repository, and the branch. [[slnc 700]]
Down the side, eight releases. [[slnc 300]] Green means a check passed. Red marks the one that failed, and the gate stops there. [[slnc 700]]
