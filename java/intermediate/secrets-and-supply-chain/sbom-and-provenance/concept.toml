[poster]
headline = [["SBOM AND PROVENANCE", "text"], ["WHAT, WHO, FROM WHAT", "accent"]]
taglines = [["Know what is inside a release, and prove where it came from", "gold"]]
before = { code = "signed jar, any source", note = "a fork's build passes", tag = "BEFORE" }
after = { code = "SBOM + signed SLSA provenance", note = "checked at the gate", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "SBOMs and Build Provenance"
narration = """Hello, and welcome. [[slnc 400]] This video explains bills of materials and build provenance, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A bill of materials lists what is inside a release. [[slnc 300]] Provenance records who built it, and from which source. [[slnc 600]] Think of food in a shop. [[slnc 300]] The label lists the ingredients. [[slnc 300]] But a certificate of origin, stamped by the factory, says where it was made, and from which batch. [[slnc 700]] In this video, the domain is an online store. [[slnc 500]] By the end, you will hear what a bill of materials can and cannot say. [[slnc 300]] What a signed provenance statement contains. [[slnc 300]] How a deployment checks it. [[slnc 300]] And why builds that can be repeated matter."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online store ships a release jar.", "", "It must say what is inside,", "and prove it was built", "from the reviewed main branch,", "by the store's own build service."]
narration = """Here is the scenario. [[slnc 400]] An online store ships a release jar. [[slnc 500]] It must say what is inside it. [[slnc 300]] And it must prove that the jar was built from the reviewed main branch, by the store's own build service. [[slnc 500]] Not from a fork, not from a branch, and not on someone's laptop."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["SBOM: what a release contains", "Provenance: how and from what it was built", "in-toto statement: a signed claim about an artifact", "DSSE: the envelope that is signed", "SLSA level: how much the provenance can be trusted"]
narration = """Before the demos, the words. [[slnc 500]] An S B O M, a software bill of materials, lists what a release contains. [[slnc 500]] Provenance records how, and from what, it was built. [[slnc 500]] An in toto statement is a signed claim about an artifact. [[slnc 500]] D S S E is the envelope around it that gets signed. [[slnc 500]] And a S L S A level says how far the provenance can be trusted."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "09-ladder"
kind = "bullets"
title = "Questions Before a Release Runs"
body = ["What is inside it? the SBOM", "Is it the exact bytes? the subject digest", "Who built it? the builder id and key", "From what? repository, branch, commit", "Can anyone check? a reproducible build"]
narration = """Let's put it in order. [[slnc 400]] What is inside it? [[slnc 300]] The bill of materials. [[slnc 500]] Is it the exact bytes? [[slnc 300]] The subject digest. [[slnc 500]] Who built it? [[slnc 300]] The builder, and the builder's key. [[slnc 500]] From what? [[slnc 300]] The repository, branch, and commit. [[slnc 500]] And can anyone check? [[slnc 300]] Only if the build can be repeated."""

[[scene]]
key = "10-roles"
kind = "bullets"
title = "Who Does What"
body = ["Sbom and Component: what is inside", "Builder and Archive: a reproducible build", "Provenance and Dsse: the signed statement", "Policy: the deployment gate", "Pipeline: SLSA build levels"]
narration = """Here is who does what in the code. [[slnc 400]] The bill of materials class lists the components. [[slnc 500]] The builder builds the jar reproducibly, with the archive class. [[slnc 500]] The provenance class writes the statement, and the D S S E class signs it in an envelope. [[slnc 500]] The policy class is the deployment gate. [[slnc 300]] And the pipeline class decides build levels."""

[[scene]]
key = "11-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["CycloneDX and SPDX files", "Provenance files next to releases", "SLSA levels in security policies", "Compromised build servers in the news"]
narration = """You have probably met this already. [[slnc 400]] CycloneDX and S P D X files, attached to releases. [[slnc 500]] Provenance files published next to downloads. [[slnc 500]] S L S A levels mentioned in project security policies. [[slnc 500]] And news stories about build servers that were compromised, and shipped signed releases."""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Write an SBOM at every build, and scan it", "Let the platform sign provenance", "Check builder, source and digest at deploy", "Protect the key; isolate builds from it", "Make builds reproducible"]
narration = """So, how do you use it? [[slnc 400]] Write a bill of materials at every build, and scan it continuously. [[slnc 500]] Let the build platform sign provenance, not developers. [[slnc 500]] Check the builder, the source and the digest before deploying. [[slnc 500]] Protect the builder's key, and keep builds away from it. [[slnc 500]] And make builds reproducible, so anyone can check."""

