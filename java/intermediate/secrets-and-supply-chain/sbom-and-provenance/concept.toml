narration = """Nothing is free. [[slnc 400]] Here is what it costs. [[slnc 500]] Provenance helps only when something checks it. [[slnc 500]] The builder's key, and the builder itself, become the target. [[slnc 500]] An S B O M describes one build, so the next build needs a new one. [[slnc 500]] Reproducible builds take work: clocks, file order and tool versions must all be fixed. [[slnc 500]] And a build level is a claim about the platform, true only if builds really cannot reach the key."""

