narration = """Before the demos, the words. [[slnc 500]] An S B O M, a software bill of materials, lists what a release contains. [[slnc 500]] Provenance records how, and from what, it was built. [[slnc 500]] An in toto statement is a signed claim about an artifact. [[slnc 500]] The D S S E envelope, the dead simple signing envelope, holds the statement and its signature. [[slnc 500]] The S L S A level says how far the provenance can be trusted. [[slnc 500]] And a reproducible build turns the same source into the same bytes, every time."""

[[scene]]
