narration = """Here is the scenario. [[slnc 400]] An online store ships a release jar, built from three files at one commit of its main branch, with three libraries. [[slnc 500]] It must say what is inside it. [[slnc 300]] And it must prove that the jar was built from the reviewed main branch, by the store's own build service. [[slnc 500]] Not from a fork, not from a branch, and not on someone's laptop."""

[[scene]]
