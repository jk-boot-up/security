body = "sbom_entry"
narration = """Let's see the core idea on one example: one library in the bill of materials. [[slnc 400]] At the top, the library at build time. [[slnc 300]] Its name is a package U R L: the ecosystem, maven, then the group, the name and the version. [[slnc 300]] Its jar is a run of bytes. [[slnc 300]] S H A two fifty six turns those bytes into a fingerprint, and the S B O M records it. [[slnc 300]] Change one byte, and the fingerprint is completely different. [[slnc 700]]
At the bottom, the same library, checked later. [[slnc 300]] The fingerprint in the S B O M, and the fingerprint of the jar on disk now. [[slnc 300]] They differ. [[slnc 300]] So the check reports that this library was changed after the build."""

