[readme]
intro = """
The [artifact-signing](../artifact-signing) project made sure a release is the exact bytes the release team signed. That still leaves two questions open: **what is
inside** the release, and **how and from what it was built**. A signature over a jar built from a fork, or from an unreviewed branch, is still a valid signature.

This project answers both:
- A **software bill of materials (SBOM)** in **CycloneDX 1.6** lists every component with its **package URL** and **SHA-256**. It finds a library that changed after
  the build, and says nothing about who built the release.
- **Provenance**: an **in-toto Statement** with a **SLSA Provenance v1** predicate names the artifact by its digest, the **source repository, branch and commit**, and
  the **builder**, and is signed by the builder in a **DSSE envelope** whose signature covers the payload type too.
- A **deployment gate** that checks the signature, the subject digest, the builder, the repository and the branch before anything runs.
- **SLSA build levels**, and **reproducible builds** that let anyone rebuild the commit and compare digests.

**Maps to:** OWASP Top 10 (2025) A03 Software Supply Chain Failures and A08 Software or Data Integrity Failures · SLSA v1.0 build track · in-toto · NIST SSDF
PS.2, PS.3 and PW.4 · CWE-494 Download of Code Without Integrity Check · CWE-1357 Reliance on Insufficiently Trustworthy Component · OWASP ASVS 5.0, the chapter on
software integrity and dependency management.
"""
analogy = """
Think of food in a shop. The label on the packet lists the ingredients: that is the bill of materials. It does not say which factory made it, from which batch, or
whether the factory followed its recipe. For that the shop wants a certificate of origin, stamped by the factory and naming the batch, and a shop that checks the stamp
before the packet goes on the shelf. And if the recipe is precise enough, anyone can cook the same dish again and taste whether it matches.
"""
scenario = """
An online store releases shop-1.4.0.jar, built from three files at one commit of its main branch and depending on three libraries. The demo writes the jar with a
reproducible archive builder, writes its SBOM, and has a build service sign provenance with an Ed25519 key made from a fixed demo seed. A deployment gate then checks
builds of a fork, a branch, a laptop, a staging runner, an edited statement and a swapped jar.
"""
costs = [
    "**Provenance helps only when it is checked.** A deploy script that never asks deploys a fork's build as happily as the real one.",
    "**The builder's key and the builder itself are now the target.** With the key, anyone can sign a statement that a fork's jar came from main; with control of the build, anyone can make the builder sign it.",
    "**An SBOM goes stale.** It describes one build; the next release needs a new one, and both need scanning against advisories published after the build.",
    "**Reproducible builds take work.** Timestamps, file order, locales and tool versions all have to be fixed before two builds agree.",
    "**Levels are claims about the platform.** A pipeline is only level three if its build steps really cannot reach the signing key.",
]
too_much = """
Any team that ships software to others should produce an SBOM at every build, and any deployment that runs code it did not build should check signed provenance.
The higher SLSA levels matter most for builds that many others depend on, and for teams whose build systems are shared or exposed.
"""
met_before = [
    "CycloneDX and SPDX files attached to releases and requested by customers and regulators.",
    "`*.intoto.jsonl` and `*.sigstore.json` files next to release downloads.",
    "SLSA levels mentioned in project security policies and OpenSSF Scorecard checks.",
    "Supply chain incidents where a build server was compromised and signed releases were shipped.",
]
where = """
This project is in [secrets-and-supply-chain](..), after [artifact-signing](../artifact-signing), which signed the exact bytes of a release. It builds on
[patching-and-dependency-hygiene](../../../beginner/safe-habits/patching-and-dependency-hygiene), which introduced bills of materials and advisories.
"""
twin = """
The jar is built from three small files with a fixed commit time and sorted entries, stored without compression, so its SHA-256 is the same on every run and every
machine. The builder's key comes from a fixed demo seed, and Ed25519 signatures are deterministic. Timestamps in the documents are fixed strings. Nothing is fetched
from a network, and no real build service runs.
"""
test_note = "The DSSE encoding is checked against the example in the DSSE specification, Ed25519 against RFC 8032 test 1, and every gate refusal is checked with its reason; reproducible builds are checked to ignore file order and clock."

[[act]]
title = "What a bill of materials answers, and what it does not"
summary = "The CycloneDX SBOM lists three libraries with purls and SHA-256 hashes, matches the jar, and finds a changed library, but says nothing about who built the jar or from what."
detail = """
The release shop-1.4.0.jar is built from three files and depends on three libraries. Its CycloneDX 1.6 SBOM lists them by package URL, each with a SHA-256:
acme-http 3.0.2, acme-json 2.4.1 and acme-log 1.9.0. The SBOM's application hash matches the jar, so it is the SBOM for this jar, and a library jar changed after
the SBOM was written is found by its hash. But which repository, branch and commit the jar was built from, and who built it on which machine, the SBOM does not say.
That is what provenance is for.
"""
speech = """
First demo: what a bill of materials answers. [[slnc 400]] The store's release depends on three libraries. [[slnc 600]]
The bill of materials lists each one, by package name, with a fingerprint of its exact bytes. [[slnc 300]] It matches this jar. [[slnc 600]]
And a library changed after the build is found, because its fingerprint no longer matches. [[slnc 600]]
But which repository, branch and commit the jar was built from, the bill of materials does not say. [[slnc 300]] Nor who built it. [[slnc 300]] That is what provenance is for.
"""
rows = { sbom = "active amber" }
console = [
    ["the release shop-1.4.0.jar is built from 3 files and depends on 3 libraries", "muted"],
    ["the CycloneDX 1.6 SBOM lists, each with a SHA-256: pkg:maven/com.acme/acme-http@3.0.2, pkg:maven/com.acme/acme-json@2.4.1, pkg:maven/com.acme/acme-log@1.9.0", "muted"],
    ["this SBOM is the one for this jar: true", "ok"],
    ["a library jar changed after the SBOM was written is found: [pkg:maven/com.acme/acme-json@2.4.1]", "ok"],
    ["which repository, branch and commit the jar was built from: the SBOM does not say", "amber"],
    ["who built it, and on which machine: the SBOM does not say  <- THAT IS WHAT PROVENANCE IS FOR", "amber"],
]

[[act]]
title = "Provenance: who built it, from what"
summary = "An in-toto statement with a SLSA Provenance v1 predicate names the jar by digest, the repository, branch and commit, and the builder, signed in a DSSE envelope whose signature also covers the payload type."
detail = """
The build service writes an in-toto statement with the predicate type https://slsa.dev/provenance/v1. Its subject is shop-1.4.0.jar with SHA-256 38a6dd0dd912fc89.
The build definition names the build type, the source repository https://git.shop.example/shop/store, the branch refs/heads/main and the commit 4f1c2a9e8b7d. The run
details name the builder, https://build.shop.example/runner/v1. The statement is signed with Ed25519 in a DSSE envelope, over the encoding "DSSEv1 28
application/vnd.in-toto+json 768" followed by the statement, and verifies with the builder's key shop-ci-2026. Because the payload type is part of what is signed, the
same bytes offered as another payload type are refused.
"""
speech = """
Second demo: provenance. [[slnc 400]] The build service writes a statement about the jar. [[slnc 600]]
The subject is the jar, named by its fingerprint. [[slnc 300]] Then the source: the repository, the branch, and the exact commit. [[slnc 300]] And the builder that ran the build. [[slnc 600]]
The builder signs the statement, inside an envelope. [[slnc 300]] The signature covers the type of document too. [[slnc 600]]
So the same signed bytes, offered as a different type of document, are refused.
"""
rows = { provenance = "active ok" }
console = [
    ["an in-toto statement, predicate https://slsa.dev/provenance/v1", "muted"],
    ["subject: shop-1.4.0.jar, sha256 38a6dd0dd912fc89...", "muted"],
    ["source: https://git.shop.example/shop/store, refs/heads/main, commit 4f1c2a9e8b7d...", "muted"],
    ["builder: https://build.shop.example/runner/v1", "muted"],
    ["signed in a DSSE envelope over the encoding: DSSEv1 28 application/vnd.in-toto+json 768 {...}", "muted"],
    ["the Ed25519 signature verifies with the builder's key shop-ci-2026: true", "ok"],
    ["the same signed bytes offered as another payload type: refused (the payload is not an in-toto statement)", "ok"],
]

[[act]]
title = "Checking before deploying"
summary = "The gate deploys the real release and refuses a fork, an unreviewed branch, a laptop-signed build, the staging runner, an edited statement, a swapped jar and a jar with no provenance."
detail = """
The deployment gate trusts one builder key and one builder id, and expects the main branch of the store's repository. The release from the trusted builder, built from
main, is deployed. A build of a fork is refused because it was built from another repository, and a build of an unreviewed branch because it was built from another
branch. A build signed on a developer's laptop has no signature from a trusted builder. A statement signed with the trusted key but naming the staging runner names a
builder that is not trusted. The fork's statement edited after signing to say main's repository no longer matches its signature. The fork's jar offered with the real
release's provenance is refused because the statement is about another artifact. And a jar with no provenance at all is refused.
"""
speech = """
Third demo: checking before deploying. [[slnc 400]] The gate trusts one builder, and expects the main branch of the store's repository. [[slnc 600]]
The real release is deployed. [[slnc 600]]
A build of a fork is refused. [[slnc 300]] So is a build of an unreviewed branch. [[slnc 300]] And a build signed on a developer's laptop. [[slnc 600]]
A statement with the right key but the wrong builder is refused. [[slnc 300]] A statement edited after signing is refused. [[slnc 300]] A different jar with the real statement is refused. [[slnc 300]] And a jar with no provenance at all is refused.
"""
rows = { gate = "active ok" }
console = [
    ["the release from the trusted builder, built from main: deployed", "ok"],
    ["a build of a fork: refused (built from another repository)", "ok"],
    ["a build of an unreviewed branch: refused (built from another branch)", "ok"],
    ["a build signed on a developer's laptop: refused (no signature from a trusted builder)", "ok"],
    ["the trusted key, but a statement naming the staging runner: refused (built by a builder that is not trusted)", "ok"],
    ["the fork's statement edited after signing to say main's repository: refused (the signature does not match the statement)", "ok"],
    ["the fork's jar offered with the real release's provenance: refused (the statement is about another artifact)", "ok"],
    ["a jar with no provenance at all: refused (no provenance)", "ok"],
]

[[act]]
title = "SLSA build levels, and builds that can be repeated"
summary = "A laptop build is level 0, self-signed provenance level 1, the hosted CI runner level 2, and an isolated platform level 3; careless builds differ, reproducible builds match and can be checked against the provenance."
detail = """
SLSA build levels are defined by what each adds. A developer's laptop build is level zero: it writes no provenance. A laptop build that signs its own provenance is level
one, held back because the developer holds the key and could forge it. The store's hosted CI runner is level two, held back because build steps run where the signing key
can be reached, so a malicious build could sign anything. A hardened build platform with isolated, short-lived builds is level three. Two careless builds of the same
commit, each with its own clock and the file system's order, give different jars. Two reproducible builds, with the commit time and sorted entries, give the same jar,
SHA-256 38a6dd0dd912fc89, so anyone can rebuild the commit and check it against the provenance subject.
"""
speech = """
Fourth demo: build levels, and builds that can be repeated. [[slnc 400]] A laptop build with no provenance is level zero. [[slnc 600]]
A laptop that signs its own provenance is level one. [[slnc 300]] The developer holds the key, so the developer could forge it. [[slnc 600]]
The store's hosted build runner is level two. [[slnc 300]] Build steps can reach the key, so a malicious build could sign anything. [[slnc 600]]
A platform that isolates every build from the key is level three. [[slnc 600]]
And two careless builds of the same commit give different jars. [[slnc 300]] Two reproducible builds give the same jar. [[slnc 300]] So anyone can rebuild it, and check.
"""
rows = { levels = "active amber" }
console = [
    ["a developer's laptop build: level 0, held back because it writes no provenance", "bad"],
    ["a laptop build that signs its own provenance: level 1, held back because ... the developer could forge it", "amber"],
    ["the store's hosted CI runner: level 2, held back because ... a malicious build could sign anything", "amber"],
    ["a hardened build platform with isolated, short-lived builds: level 3", "ok"],
    ["two careless builds of the same commit (own clock, file-system order) give the same jar: false", "bad"],
    ["two reproducible builds (commit time, sorted entries) give the same jar: true, sha256 38a6dd0dd912fc89...", "ok"],
    ["so anyone can rebuild the commit and check it against the provenance subject: true", "ok"],
]

[[act]]
title = "The bill"
summary = "A script that never checks deploys a fork; a stolen builder key makes a forged statement pass; an SBOM for 1.4.0 does not describe 1.4.1."
detail = """
Provenance only helps when it is checked: a deploy script that never asks runs the fork's build. With the builder's key stolen, a fork's jar with a statement
claiming main is deployed by the gate, so the key and the builder must be protected. The SBOM written for 1.4.0, checked against the 1.4.1 jar, does not describe it, so
the SBOM must be written at every build. And a correct SBOM is only useful if something scans it against new advisories, which is the -with-syft-and-grype version.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] Provenance helps only when it is checked. [[slnc 300]] A deploy script that never asks runs the fork's build. [[slnc 600]]
If the builder's key is stolen, a forged statement passes the gate. [[slnc 300]] So the key, and the builder, must be protected. [[slnc 600]]
And the bill of materials for one release does not describe the next. [[slnc 300]] Write it at every build, and scan it against new advisories.
"""
rows = { bill = "active wrong" }
console = [
    ["a deploy script that never checks runs the fork's build: deployed  <- PROVENANCE ONLY HELPS WHEN IT IS CHECKED", "bad"],
    ["with the builder's key stolen, a fork's jar with a statement claiming main: deployed  <- PROTECT THE KEY AND THE BUILDER", "bad"],
    ["the SBOM written for 1.4.0, checked against the 1.4.1 jar: describes it false  <- WRITE THE SBOM AT EVERY BUILD", "amber"],
    ["and a correct SBOM is only useful if something scans it against new advisories: see the -with-syft-and-grype version", "muted"],
]

