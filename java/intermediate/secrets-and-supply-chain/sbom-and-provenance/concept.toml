[docs.session]
objectives = [
    "explain what an SBOM records and what it cannot",
    "read an in-toto statement with a SLSA Provenance predicate",
    "explain what the DSSE encoding protects against",
    "list the checks a deployment gate makes on provenance",
    "place a pipeline at a SLSA build level and say what holds it back",
]
walkthrough = """
Start with the food label and the certificate of origin. Run act one and ask what the SBOM would tell an auditor and what it would not. In act two, read the statement
aloud field by field. In act three, ask which check stops each refused build. In act four, place the group's own pipeline at a level. In act five, ask who in the
organisation can reach the builder's key.
"""
exercises = [
    "Add a check that the commit in the provenance is one the store has reviewed, from a list of reviewed commits.",
    "Write an SPDX version of the SBOM and compare what each format records.",
    "Add a second signature to the envelope and require both, as a two-builder rule.",
    "Make the careless build reproducible step by step and see which change fixes the digest.",
]

[docs.explained]
sentence = """
An SBOM records what a release contains, signed provenance records which builder made it from which repository, branch and commit, and a deployment should check both,
with reproducible builds letting anyone confirm the result.
"""
verdict = """
Write an SBOM at every build and scan it continuously. Have the build platform, not developers, sign provenance, and check it at deployment against the expected
builder, repository and branch. Protect the builder's key and isolate builds from it. Make builds reproducible so that independent rebuilds can confirm the provenance.
"""
recognise = [
    "Release pages that publish an SBOM and a provenance file next to each artifact.",
    "Admission policies that require provenance from a named builder.",
    "Questions from customers or regulators asking for an SBOM.",
    "SLSA levels in project documentation and scorecards.",
]

[spec]
purpose = """
Teach the difference between what a release contains and how it was made, by writing a CycloneDX SBOM, signing SLSA provenance in a DSSE envelope, checking it at a
deployment gate, explaining SLSA build levels, and making the build reproducible.
"""
nongoals = [
    "Scanning SBOMs against advisories: the -with-syft-and-grype version.",
    "Keyless signing and public transparency logs: the artifact-signing project and its -with-cosign version.",
    "Running a real build platform.",
]
problem = """
Teams sign releases and publish SBOMs, but deploy without checking where a release was built from, so a valid signature over a fork's build is accepted.
"""
