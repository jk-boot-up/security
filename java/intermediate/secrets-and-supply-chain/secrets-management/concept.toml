[docs.problem]
scenario = """
An online store's servers need a database password and a payment provider's API key. Developers, build servers, container images and the
running application all handle them, and any of them can leak.
"""
naive = """
Put the password in the configuration file, the key in an environment variable, and copy both into the image so that it works everywhere.
"""
deliver = [
    "A small secret scanner using setting names and entropy, run over a sample repository.",
    "Demonstrations of the environment-variable and image-layer leaks.",
    "Run-time injection from owner-only files, a Secret type that never prints, and wiping after use.",
    "A model secrets service with per-application leased logins, renewal limits, expiry, revocation and an audit trail.",
    "A key rotation with two versions during the changeover, and the blast radius of a leak measured by its lease.",
]

[docs.prerequisites]
required = [
    "Java basics",
    "The keystore-basics project, or what a key file and file permissions are",
]
not_required = [
    "A secrets server: the service is modelled in the same process (the -with-openbao version runs a real one)",
    "Docker: image layers are modelled as archives",
]
install = []

[docs.session]
objectives = [
    "name three places secrets leak outside the source code",
    "explain why run-time injection from a file is better than an environment variable",
    "explain what a lease is and why short-lived, per-application logins shrink a leak",
    "describe a rotation that never leaves the application without a working key",
]
walkthrough = """
Start with the hotel and its key cards. Run the demo one act at a time. After act one, ask where else in the group's own systems a secret might
sit in an image or an environment. After act three, ask what happens to the shop if the secrets service is down. After act four, compare the two
blast radii, and ask what the static password's would be in the group's own systems.
"""
exercises = [
    "Add a scanner rule for private-key blocks (a BEGIN PRIVATE KEY line) and test it.",
    "Give the secrets service a policy so that the reports job may only lease read-only logins.",
    "Make the shop renew its lease automatically at two thirds of its time to live, and test it with the simulated clock.",
    "Rotate the database login every hour while a simulated request stream keeps working.",
]

[docs.explained]
sentence = """
Secrets should never live in code, images or environment variables; they should be injected at run time, never logged, and ideally leased per
application for a short time from a secrets service that can rotate and revoke them, which then becomes the thing to protect.
"""
verdict = """
Keep secrets out of repositories and images, and scan both. Inject them at run time from files only the application can read, and never log
them. Prefer short-lived, per-application credentials from a secrets service, rotate with two valid versions during a changeover, and revoke
on any sign of a leak. Protect the secrets service as the most valuable system you run.
"""
recognise = [
    "`/run/secrets/...` paths and Kubernetes secret volumes.",
    "`vault read database/creds/...` or `bao lease renew` in scripts.",
    "Secret scanning alerts on a pull request.",
    "Key versions such as `v1` and `v2` in a provider's dashboard.",
]

[spec]
purpose = """
Teach how secrets leak and how they are managed safely by scanning a sample repository, demonstrating environment and image-layer leaks,
injecting secrets at run time, leasing per-application logins from a model secrets service, and rotating a key with no downtime.
"""
nongoals = [
    "A real secrets server: the -with-openbao version.",
    "Platform and workload identity: the advanced track.",
    "Encryption at rest of the secrets store itself.",
]
problem = """
Learners put secrets where they are convenient, and the convenient places are the ones that leak.
"""
roles = [["Secret values", "`Secret`"], ["Secret scanner", "`SecretScanner`"], ["Image layers", "`ImageLayers`"], ["Run-time injection", "`MountedSecrets`"], ["Secrets service and leases", "`SecretsService`"], ["The database", "`Database`"], ["Key rotation", "`PaymentProvider`"], ["Entry point", "`SecretsDemo`"]]
requirements = [
    "The scanner finds named settings and random-looking values, and ignores placeholders.",
    "A secret file readable by others is refused; the Secret type never prints its value and can be wiped.",
    "Each application gets its own leased login, which ends at its expiry, stops renewing at the maximum, and ends at once when revoked.",
    "Both key versions work during a rotation and only the new one after it.",
    "The demo prints the same output on every run and never a secret value.",
]

