[[act]]
title = "Secrets injected at run time"
summary = "A mounted secret file with permissions rw-r--r-- (group and others can read) is refused; rw------- (owner only) is read once, 24 characters; a log line shows [redacted]; the startup copy is wiped."
detail = """
Before the fix, the mounted file run/secrets/db-password has permissions rw-r--r--: owner rw-, group r--, others r--. Group and others can read it, so the store refuses it at startup.
After the fix, the same file has rw-------: owner rw-, group ---, others ---. It is read once at startup: 24 characters, not in the code or the image.
The code writes "connecting with password " + password into a log line; the log shows connecting with password [redacted], because the Secret type never prints its value.
Once the connection pool has its copy, the startup copy is wiped, and using it fails.
"""
figure = "permission_bits"
figure_title = "The secret file's permissions, before and after the fix"
figure_speech = """
Second demo: secrets injected at run time. [[slnc 400]] The secret is a file in a mounted folder, read when the store starts. [[slnc 600]]
Before the fix, the permissions are r w dash, r dash dash, r dash dash. [[slnc 300]] Read them in three groups of three letters. [[slnc 300]] The owner may read and write. [[slnc 300]] The group may read. [[slnc 300]] And everyone else may read too. [[slnc 300]] So the store refuses the file at startup. [[slnc 700]]
After the fix, only the owner has letters, and the group and the others have none. [[slnc 300]] The file is read once: twenty four characters. [[slnc 700]]
At the bottom, the code writes the password into a log line. [[slnc 300]] But the log shows only the word redacted, because the secret type never prints its value.
"""
speech = """
Here is the output. [[slnc 400]] Before the fix: the permissions, split by whom, and the result: refused, because the group and others can read it. [[slnc 500]] After the fix: owner only, read once, twenty four characters. [[slnc 500]] The code and the log line it wrote: the value is redacted. [[slnc 400]] And once the connection pool has its copy, the startup copy is wiped, and using it fails.
"""
rows = { inject = "active ok" }
console = [
    ["BEFORE THE FIX, the mounted file run/secrets/db-password:", "code"],
    ["  permissions  rw-r--r--", "muted"],
    ["  by whom      owner rw-  group r--  others r--", "muted"],
    ["  at startup   refused: group and others can read it", "ok"],
    ["AFTER THE FIX, the same file:", "code"],
    ["  permissions  rw-------", "muted"],
    ["  by whom      owner rw-  group ---  others ---", "muted"],
    ["  at startup   read once, 24 characters, not in the code or image", "muted"],
    ["THE SECRET WRITTEN INTO A LOG LINE:", "code"],
    ["  the code  \"connecting with password \" + password", "muted"],
    ["  the log   connecting with password [redacted]", "ok"],
    ["ONCE THE CONNECTION POOL HAS ITS COPY:", "code"],
    ["  the startup copy is wiped: true, using it fails: true", "muted"],
]

[[act]]
title = "A secrets service that hands out leased logins"
summary = "shop-api and reports each get their own database login until t=900; a wrong credential is refused; renewals give min(now + 900, 0 + 3600): 1500, 2300, 3000, 3600, 3600; the unrenewed reports login is removed at t=900 and the shop's at t=3600; the audit trail has 10 entries."
detail = """
The requests: at t=0, shop-api with its credential gets v-shop-api-1 until t=900, reports gets v-reports-2 until t=900, and shop-api with a wrong credential is refused.
At t=600 v-shop-api-1 works. A renewal's new end is min(now + time to live, issued + maximum): at t=600, min(600 + 900, 0 + 3600) = 1500.
At t=900 the reports lease ends, never renewed: its login is removed, and v-reports-2 no longer works.
The shop renews at t=1400, 2100, 2800 and 3500: 2300, 3000, then min(3700, 3600) = 3600 twice, because a lease never runs past its maximum.
At t=3600 v-shop-api-1 no longer works, so the shop asks for a new lease. The audit trail records all 10 requests.
"""
figure = "lease_timeline"
figure_title = "Two leases on one time line"
figure_speech = """
Third demo: a secrets service that hands out leased logins. [[slnc 400]] Each application proves who it is, and gets a database login of its own, for nine hundred seconds. [[slnc 600]]
At the top, the reports job's login. [[slnc 300]] It is never renewed, so at t equals nine hundred its lease ends, and the login is removed from the database. [[slnc 700]]
Below it, the shop's login. [[slnc 300]] The shop renews while it works. [[slnc 300]] Each renewal moves the end to now plus nine hundred, but never past the maximum, three thousand six hundred seconds after it was issued. [[slnc 300]] At t equals two thousand eight hundred, now plus nine hundred would be three thousand seven hundred, so the end stops at three thousand six hundred. [[slnc 700]]
At the red line, the maximum, the login ends for good, and the shop asks for a new one.
"""
speech = """
Here is the output. [[slnc 400]] The requests: each application gets its own login, and a wrong credential is refused. [[slnc 400]] At t equals six hundred, the shop's login works, and the first renewal is worked out: the smaller of fifteen hundred and three thousand six hundred. [[slnc 300]] At nine hundred, the reports login is removed.
[[page]]
The next four renewals. [[slnc 300]] From t equals two thousand eight hundred, the maximum wins. [[slnc 300]] At three thousand six hundred, the shop's login stops working, so it asks for a new lease.
[[page]]
And the audit trail: ten entries, one for every lease, refusal, renewal and end. [[slnc 300]] It shows who had which login, and when.
"""
rows = { service = "active ok" }
console = [
