[[act]]
title = "Rotation without downtime, and the blast radius of a leak"
summary = "The provider accepts [v1], then [v1, v2], then [v2]: there is never a moment with no working key. A leased login copied at t=600 works 900 - 600 = 300 s more, 3600 - 600 = 3000 s if renewed, and not at all once revoked; a static password still works three years later."
detail = """
The rotation in three steps: with v1 in use the provider accepts [v1]; it issues v2 and accepts [v1, v2], so both work during the changeover; once every server is on v2, v1 is revoked and only [v2] is accepted.
The blast radius of a leak: a thief copies a leased login at t=600. It ends at t=900, so it works 900 - 600 = 300 s more; if the thief can renew it, at most until t=3600, 3600 - 600 = 3000 s more.
Once the leak is noticed, revoking the lease ends it at once: the login works right after: false.
A static database password copied at the same time still works three years later, until someone changes it.
"""
figure = "rotation_steps"
figure_title = "A key rotation in three steps"
figure_speech = """
Fourth demo: rotation without downtime. [[slnc 400]] The payment provider issues the store's A P I key. [[slnc 600]]
Step one: the store uses version one, and the provider accepts only version one. [[slnc 600]]
Step two: the provider issues version two, while version one is still in use. [[slnc 300]] During this changeover, it accepts both. [[slnc 300]] So each server of the store can switch whenever it is ready. [[slnc 600]]
Step three: every server uses version two, and version one is revoked. [[slnc 300]] Now only version two works. [[slnc 600]] Because the two versions overlap, there is never a moment with no working key.
"""
speech = """
Here is the output. [[slnc 400]] The three steps of the rotation, with the versions the provider accepts. [[slnc 500]] Then a leak. [[slnc 300]] A thief copies a leased login at t equals six hundred. [[slnc 300]] Nine hundred minus six hundred: it works three hundred seconds more. [[slnc 300]] Renewed, at most three thousand seconds. [[slnc 300]] Revoked, not at all. [[slnc 400]] A static password copied at the same time still works three years later.
"""
rows = { rotate = "active amber" }
console = [
    ["THE PAYMENT KEY, STEP BY STEP (what the provider accepts):", "code"],
    ["  1 v1 in use              [v1]      v1 true  v2 false", "muted"],
    ["  2 v2 issued              [v1, v2]  v1 true  v2 true", "muted"],
    ["  3 all on v2, v1 revoked  [v2]      v1 false v2 true", "muted"],
    ["A LOGIN A THIEF COPIES AT t=600:", "code"],
    ["  leased   ends at t=900: 900 - 600 = 300 s more", "muted"],
    ["  renewed  at most t=3600: 3600 - 600 = 3000 s more", "muted"],
    ["  revoked  the login works right after: false", "amber"],
    ["A STATIC PASSWORD THE THIEF COPIES AT THE SAME TIME:", "code"],
    ["  three years later it works: true  <- UNTIL SOMEONE CHANGES IT", "bad"],
]

[[act]]
