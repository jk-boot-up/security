title = "Secrets Management"
narration = """Hello, and welcome. [[slnc 400]] This video explains secrets management, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A secret is anything that proves an application may do something. [[slnc 300]] A database password, an A P I key, a signing key. [[slnc 300]] Secrets management is getting them to the application without leaking them on the way. [[slnc 600]] Think of a hotel. [[slnc 300]] The old way is one master key, copied for every member of staff, and never changed. [[slnc 300]] The better way is a key card for each guest, that stops working at checkout, and can be cancelled at once. [[slnc 700]] In this video, the domain is an online store. [[slnc 500]] By the end, you will hear where secrets leak. [[slnc 300]] How to inject them at run time. [[slnc 300]] How a secrets service leases a login to each application. [[slnc 300]] And how to rotate a key with no downtime."""

