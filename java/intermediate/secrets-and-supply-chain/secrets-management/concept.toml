title = "The Scenario"
body = ["An online store needs a database password", "and a payment provider's API key.", "", "Developers, build servers, images", "and the running store all handle them.", "", "Any of them can leak."]
narration = """Here is the scenario. [[slnc 400]] An online store needs a database password, and an A P I key for its payment provider. [[slnc 500]] Developers, build servers, container images, and the running store all handle them. [[slnc 500]] And any one of them can leak."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["Secret: a value that proves access", "Injection: handing it over at run time", "Lease: a login that ends by itself", "Rotation: replacing a secret with no downtime", "Revocation: ending it at once"]
narration = """Before the demos, the words. [[slnc 500]] A secret is a value that proves an application may do something. [[slnc 500]] Injection means handing it over when the application starts, not building it in. [[slnc 500]] A lease is a login that ends by itself, after a time to live. [[slnc 500]] Rotation is replacing a secret, with no downtime. [[slnc 500]] And revocation is ending it at once."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "09-ladder"
kind = "bullets"
title = "From Worst to Best"
body = ["In the code or the image: for ever", "In an environment variable: widely readable", "In an owner-only file: better", "Leased per application: ends by itself", "With rotation and revocation: ends at once"]
narration = """Let's put the options side by side, worst first. [[slnc 400]] In the code or the image, a secret lasts for ever. [[slnc 500]] In an environment variable, it is widely readable. [[slnc 500]] In a file only the application can read, it is better. [[slnc 500]] Leased to each application, it ends by itself. [[slnc 500]] And with rotation and revocation, a leaked one can be ended at once."""

[[scene]]
key = "10-roles"
kind = "bullets"
title = "Who Does What"
body = ["Secret: never prints, can be wiped", "SecretScanner: names and entropy", "MountedSecrets: owner-only files", "SecretsService: leases and audit", "PaymentProvider: two key versions"]
narration = """Here is who does what in the code. [[slnc 400]] The secret class never prints its value, and can be wiped. [[slnc 500]] The scanner looks for setting names and random looking values. [[slnc 500]] Mounted secrets reads owner only files at startup. [[slnc 500]] The secrets service leases logins and keeps an audit trail. [[slnc 300]] And the payment provider accepts two key versions during a rotation."""

[[scene]]
key = "11-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["/run/secrets in containers", "Vault, OpenBao, cloud secret managers", "Secret scanning on pull requests", "Key versions in a provider's dashboard"]
narration = """You have probably met this already. [[slnc 400]] Container platforms mount secrets as files, under run secrets. [[slnc 500]] Vault, OpenBao, and the cloud providers' secret managers lease and rotate them. [[slnc 500]] Code hosts scan pull requests for committed secrets. [[slnc 500]] And payment providers show key versions in their dashboards."""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Keep secrets out of code and images", "Inject at run time, never log", "Lease short-lived logins per application", "Rotate with two versions, revoke on a leak", "Guard the secrets service"]
narration = """So, how do you use it? [[slnc 400]] Keep secrets out of code and images, and scan both. [[slnc 500]] Inject them at run time, and never log them. [[slnc 500]] Lease short lived logins, one per application. [[slnc 500]] Rotate with two versions during the changeover, and revoke on any sign of a leak. [[slnc 500]] And guard the secrets service as the most valuable system you run."""

[[scene]]
key = "13-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Give the reports job", "a read-only policy and test it."]
narration = """That's secrets management. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] A secret that is leased, short lived and revocable leaks far less than one that sits still. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine, with nothing installed except a Java development kit. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Give the reports job a policy that allows only read only logins, and test it. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
How an online store's database password and payment key reach its servers: the repository, the build and image, the running process, its logs,
and a secrets service that leases database logins. It covers developers' mistakes, a thief with a copy of the repository or image, and a thief
with a copied login. It does not cover the security of the secrets server's own storage, or platform identity.
"""
assets = [
    "The database password and every leased database login.",
    "The payment provider's API key and its versions.",
    "Each application's credential for the secrets service.",
    "The audit trail of the secrets service.",
]
actors = [
    "Developers and build servers that handle configuration.",
    "The store's servers, which read secrets at startup.",
    "A thief with a copy of the repository, an image or a log.",
    "A thief with a copied login.",
]
boundaries = [
    "Source and build to the running store: anything copied across outlives the run.",
    "The store's process to its logs and child processes.",
    "The store to the secrets service: the application must prove who it is.",
]
assumptions = [
    "The secrets service is reachable only by the store's applications, and its own storage is protected.",
    "File permissions are enforced by the operating system.",
    "In the demo, every secret value is an obviously fake demo value, and generated passwords are random and never printed.",
]
out_of_scope = [
    "Encryption at rest and unsealing of a real secrets server: the -with-openbao version.",
    "Workload and platform identity: the advanced track.",
    "Scanning the history of a real repository.",
]
tests = [
    "`SecretTest` checks that a secret never prints, compares values and stops working once wiped.",
    "`LeaksTest` checks the scanner, entropy, the image-layer leak and refusal of a secret file readable by others.",
    "`ServiceTest` checks per-application logins, refusals and audit, expiry, renewal limits, revocation and rotation.",
    "`DemoRunsTest` compares the whole demo with the golden output and checks that no secret value is printed.",
]
next = """
The next project, artifact-signing, moves from the secrets an application uses to the trust in the application itself: signing a release and
checking it before it runs.
"""

[[threat]]
id = "T1"
stride = "I"
threat = "A secret committed to the repository is read by anyone with a copy, for ever"
where = "`SecretScanner`, the sample repository"
control = "Secrets stay out of files; settings name where a secret comes from; a scanner checks every commit"
residual = "A scanner finds only what it has patterns for, and a secret once committed must be treated as leaked and rotated"

[[threat]]
id = "T2"
stride = "I"
threat = "A secret copied into an image layer is read from the image, even after a later layer deletes it"
where = "`ImageLayers`"
control = "Secrets are injected at run time, never built into images"
residual = "Images built before the change still contain the secret and must be deleted"

[[threat]]
id = "T3"
stride = "I"
threat = "A secret in an environment variable, or a secret file readable by others, is read by another process or user"
where = "`MountedSecrets.read`"
control = "Owner-only secret files are read once at startup; files readable by others are refused"
residual = "Anyone who can run code as the store's own user can still read the secret from its memory"

[[threat]]
id = "T4"
stride = "I"
threat = "A secret is written into a log line, a crash report or an error page"
where = "`Secret.toString`"
control = "The Secret type prints [redacted] and is wiped after use"
residual = "Code that turns the value into a String on purpose can still log it; reviews and log scanning remain"

[[threat]]
id = "T5"
stride = "S"
threat = "A copied database login is used by someone else"
where = "`SecretsService`, `Database.login`"
control = "Logins are per application, leased for 900 seconds, renewable only to 3600, and revocable at once"
residual = "A thief can use a copied login until it ends or is revoked, and can renew it with a stolen application credential"

[[threat]]
id = "T6"
stride = "E"
threat = "The secrets service is compromised and hands out every secret"
where = "the secrets service"
control = "Applications prove who they are; every request is audited"
residual = "The secrets service is the most valuable system to protect, with its own access control, monitoring and backups"
