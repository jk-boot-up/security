# concept.toml: everything about this project that is not Java code.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "secrets-management"
level = "intermediate"
module = "secrets-and-supply-chain"
title = "Secrets Management"
short_title = "Secrets Management"
package = "secrets"
main_class = "SecretsDemo"
tagline = "A secret that never sits still is a secret that leaks less"
bold = "Secrets leak from code, environment variables and image layers; inject them at run time from owner-only files, keep them out of logs, and better still lease short-lived, per-application logins from a secrets service that can rotate and revoke them."
domain = "an online store"
domain_note = ""
youtube_description = """Secrets management in Java: where database passwords and API keys leak, and how a secrets service hands out short-lived logins instead. Explained with an online store, like a hotel that gives each guest a key card that stops working at checkout, instead of copying one master key for everyone. A small scanner finds secrets committed to a repository, a child process reads a key from the environment, and a deleted file is still in an image layer. Then secrets are injected at run time from owner-only files and redacted from logs, a secrets service leases a separate database login to each application with a time to live, a payment key is rotated with no downtime, and the bill: the secrets service itself becomes the most valuable thing to protect."""
thumb_lines = ["SECRETS", "MANAGEMENT"]
thumb_code = "lease: v-shop-api-1, 900 s"
youtube_title = "Secrets Management in Java (Leaks, Run-Time Injection, Leases, Rotation)"
youtube_tags = ["secrets management", "api keys", "secret scanning", "secret rotation", "dynamic credentials", "openbao", "vault", "java", "application security"]

[readme]
intro = """
Every application has secrets: a database password, an API key for the payment provider, a signing key. The beginner project
[keystore-basics](../../../beginner/cryptography/keystore-basics) showed where a key can live on one machine. This project looks at how
secrets reach a running application, and how they **leak** on the way: written into a configuration file and committed, passed in an
**environment variable** that every child process and crash report can read, or copied into a container **image layer** that a later layer
only hides. The fixes are **run-time injection** from a file only the application can read, a **Secret** type that never prints its value,
and better still a **secrets service** that gives each application its own **leased** login with a time to live, so a stolen login stops
working by itself, and can be **rotated** and **revoked** without downtime.

It maps to OWASP Top 10 (2025) A02 Security Misconfiguration and A04 Cryptographic Failures, CWE-798 (hard-coded credentials), CWE-522
(insufficiently protected credentials), CWE-526 (secrets in environment variables), CWE-532 (secrets in logs), and the ASVS 5.0 chapter on
secret management.
"""
analogy = """
Think of a hotel. The old way is one master key, copied for every member of staff, never changed, and written on a note in the office. The
better way is a key card for each guest, programmed at the desk, opening only that guest's room, and stopping at checkout. If a card is lost,
the desk cancels it at once, and the other guests never notice. The desk itself, which can make any card, becomes the thing to guard.
"""
scenario = """
An online store needs a database password and an API key for its payment provider. The demo looks for those secrets where teams leave
them, injects them at run time instead, replaces the shared password with leased logins from a secrets service, rotates the payment key
with no downtime, and counts the cost.
"""
costs = [
    "**The secrets service holds every secret.** It needs its own access control, audit trail and backups, and an outage of it stops every application that needs a new login.",
    "**The first credential is the hard part.** An application still has to prove who it is to the secrets service. Platform identity (workload identity, in the advanced track) removes that last shared secret.",
    "**Leases and rotation need applications that cope.** A connection pool must reconnect with a new login without a restart, and every server must switch keys before the old one is revoked.",
    "**A scanner is one check.** It finds only what it has patterns for; the history of a repository and the layers of every image must be scanned too.",
]
too_much = """
For a single demo on one laptop, a file that only the developer can read is enough. As soon as there are servers, teams or customers, secrets
belong outside the code and the image, injected at run time, and for anything that holds money or personal data, short-lived credentials
from a secrets service are the standard.
"""
met_before = [
    "Docker and Kubernetes secrets mounted as files under /run/secrets.",
    "HashiCorp Vault and OpenBao, AWS Secrets Manager, Azure Key Vault and Google Secret Manager.",
    "gitleaks, trufflehog and GitHub secret scanning, which fail a build or block a push.",
    "Breach reports that begin with a key found in a public repository or an image.",
]
where = """
This project opens [secrets-and-supply-chain](..) in the intermediate track. It builds on [keystore-basics](../../../beginner/cryptography/keystore-basics),
and the `-with-openbao` version runs the same leases against a real secrets server.
"""
twin = """
Everything runs in one process with a simulated clock in seconds, so leases and rotations are exact. The secrets service is a small model of
how Vault and OpenBao lease database logins, not a full server. The demo values are obviously fake and never printed. Generated passwords are
random and never printed either, so the demo shows only facts that do not depend on them. The environment-variable act starts a real child
process (`printenv`), and file permissions are the POSIX ones of macOS and Linux.
"""
test_note = "A simulated clock makes leases exact; generated passwords are random and never printed, so the demo shows only facts that do not depend on them. A test checks that no demo secret value ever appears in the output."

[[act]]
title = "Where secrets leak"
summary = "A scanner finds 3 secrets in 3 committed files; a child process reads a key from the environment; a key deleted in a later image layer is still in layer two."
detail = """
The scanner reads the three files the team committed and finds three secrets: a database password and a payment key named in a
properties file, and a random-looking value in a script. The production file names where its secrets come from and holds none. A key in an
environment variable is read by any program the store starts, and by crash reports and debug pages that print the environment. And an image
built with the key, which a later layer deletes, hides it from the running container, but anyone with the image file reads it from layer two.
"""
speech = """
First demo: where secrets leak. [[slnc 400]] A small scanner reads the files the team committed. [[slnc 300]] It finds three secrets. [[slnc 300]] A database password and a payment key, written into a settings file. [[slnc 300]] And a random looking value in a script. [[slnc 600]]
A key in an environment variable is read by every program the store starts. [[slnc 300]] And by crash reports that print the environment. [[slnc 600]]
And a key copied into a container image, then deleted in a later layer, is only hidden. [[slnc 300]] Anyone with the image file can read it from the earlier layer.
"""
rows = { leaks = "active wrong" }
console = [
    ["the scanner reads the 3 files the team committed and finds 3 secrets:", "muted"],
    ["  config/application.properties:3 (a setting named db.password)", "bad"],
    ["  config/application.properties:4 (a setting named payment.api-key)", "bad"],
    ["  scripts/refund.sh:2 (a random-looking value)", "bad"],
    ["a key in an environment variable is read by any program the store starts: true", "bad"],
    ["the running container sees the key: false; anyone with the image file reads it from layer two: true", "bad"],
]

[[act]]
title = "Secrets injected at run time"
summary = "A secret file readable by others is refused; an owner-only file is read once at startup; the value prints as [redacted] and the startup copy is wiped."
detail = """
Secrets are injected when the store starts, as files in a mounted folder, the way container platforms do. A secret file with permissions
rw-r--r-- is refused at startup, because others can read it. The same file with rw------- is read once: twenty-four characters, nothing in
the code or the image. Written into a log line, the secret shows as [redacted], because the Secret type never prints its value. Once the
connection pool has its copy, the startup copy is wiped, and using it fails.
"""
speech = """
Second demo: secrets injected at run time. [[slnc 400]] The secret is a file in a mounted folder, read when the store starts. [[slnc 600]]
If others can read the file, the store refuses to start. [[slnc 300]] With owner only permissions, it is read once. [[slnc 600]]
Written into a log line, it shows as redacted, because the secret type never prints its value. [[slnc 600]]
And once the connection pool has its copy, the startup copy is wiped.
"""
rows = { inject = "active ok" }
console = [
    ["a secret file with permissions rw-r--r--: refused at startup, because others can read it", "ok"],
    ["the same file with permissions rw-------: read once at startup, 24 characters, nothing in the code or the image", "ok"],
    ["the secret written into a log line: \"connecting with password [redacted]\"", "ok"],
    ["once the connection pool has its copy, the startup copy is wiped: true", "ok"],
]

[[act]]
title = "A secrets service that hands out leased logins"
summary = "Each application gets its own database login for 900 seconds; a wrong credential is refused; renewals stop at 3600 seconds; ended leases are removed; every request is audited."
detail = """
Instead of one shared password, a secrets service hands out logins. The shop API proves who it is and gets a database login of its own,
v-shop-api-1, for 900 seconds. The reports job gets a different login; no two applications share one. A wrong application credential is
refused. At t=600 the shop's login works, and renewing extends it to t=1500. The reports lease, never renewed, ends at t=900 and its login is
removed from the database. Renewals stop at the maximum of 3600 seconds after issue, and at t=3600 the database refuses the shop's login, so
the shop asks for a new one. The audit trail records every request: ten entries.
"""
speech = """
Third demo: a secrets service that hands out leased logins. [[slnc 400]] The shop proves who it is, and gets a database login of its own. [[slnc 300]] For nine hundred seconds. [[slnc 600]]
The reports job gets a different login. [[slnc 300]] No two applications share one. [[slnc 300]] A wrong application credential is refused. [[slnc 600]]
The shop renews its lease while it works. [[slnc 300]] The reports lease is never renewed, so it ends, and its login is removed from the database. [[slnc 600]]
Renewals stop at a maximum of one hour. [[slnc 300]] Then the database refuses the old login, and the shop asks for a new one. [[slnc 300]] And every request is in the audit trail.
"""
rows = { service = "active ok" }
console = [
    ["shop-api proves who it is and gets a database login of its own: v-shop-api-1, for 900 seconds", "ok"],
    ["reports gets a different login: v-reports-2; no two applications share one: true", "ok"],
    ["a wrong application credential: refused", "ok"],
    ["the shop renews its lease at t=600: now until t=1500", "muted"],
    ["at t=900 the reports lease ends, it was never renewed: 1 login removed, reports can log in: false", "amber"],
    ["the lease stops at the maximum of 3600 seconds after issue; at t=3600 the database refuses the login: true", "amber"],
    ["the audit trail records every request: 10 entries", "muted"],
]

[[act]]
title = "Rotation without downtime, and the blast radius of a leak"
summary = "Both key versions work during a changeover and only the new one after; a leaked leased login works for at most 300 more seconds and is revoked at once, while a static password works for years."
detail = """
The payment provider issues key v2 while v1 is still in use, and during the changeover it accepts both. Every server of the store switches to
v2, then v1 is revoked: v1 is refused and v2 works, with no moment in which neither did. Then the blast radius of a leak. A leased login copied
at t=600 works for at most 300 more seconds, or 3000 if the thief can renew it, and once the leak is noticed, revoking the lease ends it at once.
A static database password copied at the same moment still works three years later, until someone remembers to change it.
"""
speech = """
Fourth demo: rotation, and the blast radius of a leak. [[slnc 400]] The payment provider issues a new key, while the old one is still in use. [[slnc 300]] During the changeover, both work. [[slnc 600]]
The store switches every server to the new key. [[slnc 300]] Then the old one is revoked. [[slnc 300]] There is never a moment when neither key works. [[slnc 600]]
Now a leak. [[slnc 300]] A leased login, copied by a thief, works for a few minutes at most. [[slnc 300]] And revoking the lease ends it at once. [[slnc 600]]
A static password, copied at the same moment, still works three years later.
"""
rows = { rotate = "active amber" }
console = [
    ["the provider issues v2, and during the changeover it accepts [v1, v2]: v1 true, v2 true", "ok"],
    ["every server of the store switches to v2, then v1 is revoked: v1 false, v2 true", "ok"],
    ["a leased login copied at t=600 works for at most 300 more seconds, or 3000 if the thief can renew it", "amber"],
    ["revoking the lease ends it at once: the login works: false", "ok"],
    ["a static database password copied at t=600 still works three years later: true", "bad"],
]

[[act]]
title = "The bill"
summary = "The secrets service becomes the target; the first credential remains; applications must handle new logins; a scanner is one check."
detail = """
The secrets service holds every secret, so it needs its own access control, audit and backups. The application still needs a first credential
to prove who it is; platform identity, in the advanced track, removes it. Leases and rotation need applications that can reconnect with a new
login without a restart. A scanner finds only what it has patterns for, so it is one check, not a guarantee, and history must be scanned too.
The -with-openbao version runs the same leases against a real secrets server.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] The secrets service now holds every secret. [[slnc 300]] So it needs its own access control, audit trail, and backups. [[slnc 600]]
The application still needs a first credential, to prove who it is. [[slnc 300]] Platform identity, in the advanced track, removes that last secret. [[slnc 600]]
Applications must reconnect with new logins, without a restart. [[slnc 300]] And a scanner finds only what it has patterns for.
"""
rows = { service = "active amber", rotate = "active amber" }
console = [
    ["the secrets service holds every secret, so it needs its own access control, audit and backups", "amber"],
    ["the application still needs a first credential to prove who it is", "amber"],
    ["leases and rotation need applications that can reconnect with a new login without a restart", "amber"],
    ["a scanner finds only what it has patterns for, so it is one check, not a guarantee", "amber"],
]

