narration = "That's secrets with OpenBao. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] A secrets server turns a secret that never changes into a login that lasts minutes, belongs to one application and can be taken back. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Let the application renew its own lease in a loop and log every renewal. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"
