domain = "an online store"
domain_note = ""
youtube_description = "Secrets management with OpenBao 2.7 and a real PostgreSQL in Docker: AppRole logins with a secret id that works once, policies that name what each application may read, versioned secrets with a changeover and a destroyed version, an audit trail that hashes values, per-application database logins that really connect and really stop, renewal capped at a maximum, revoking one lease or all of an application's leases, a static password that OpenBao rotates, and a sealed server that the store cannot start without."
