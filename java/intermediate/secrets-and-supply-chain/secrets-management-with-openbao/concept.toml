[docs.session]
objectives = [
    "explain how an application proves who it is to a secrets server",
    "write a policy that names what an application may read",
    "lease a database login and say when it ends",
    "describe what the store does when the secrets server is sealed",
]
walkthrough = """
Run act three and read the lease durations. In act four ask what a thief gets from a leased login and from a static password. In act five ask what the store should do while OpenBao is sealed.
"""
exercises = [
    "Let the application renew its own lease in a loop and log every renewal.",
    "Wrap the secret id in a response-wrapped token so that only the application can unwrap it.",
    "Give reports a read-only login that expires in five minutes, and a policy to match.",
    "Run OpenBao with real storage and an auto-unseal, and write down the recovery steps.",
]

[docs.explained]
sentence = """
A secrets server turns a secret that never changes into a login that lasts minutes, belongs to one application and can be taken back.
"""
verdict = """
Keep secrets in a service, give each application its own role and policy, lease database logins and renew them, rotate static passwords, audit every request, revoke on a leak, and plan for the day the service is sealed.
"""
recognise = [
    "A user name that starts with `v-` in a database.",
    "`role_id` and `secret_id` in a deployment.",
    "`lease_duration` and `renewable` in an API answer.",
    "An unseal key held by several people.",
]

[spec]
purpose = """
Teach secrets management with a real secrets server: identity, policy, leases, rotation, revocation and failure.
"""
nongoals = [
    "Running OpenBao in production.",
    "Encryption as a service and PKI.",
    "Cloud secret managers.",
]
problem = """
Teams keep long-lived shared secrets in code and configuration, and have no way to contain a leak.
"""
roles = [["The lab", "`BaoLab`"], ["The client", "`Bao`"], ["Entry point", "`BaoSecretsDemo`"]]
requirements = [
    "A secret id works once, and a token carries only its application's policy.",
    "Secrets are versioned and the audit trail hashes their values.",
    "Each application gets a database login of its own, and the login really connects with only its grants.",
