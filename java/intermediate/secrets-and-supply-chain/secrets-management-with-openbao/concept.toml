    ["  logins that still connect  0 of 3", "muted"],
    ["  reports still gets one     allowed (200)", "ok"],
]

[[act]]
title = "The bill"
summary = "Sealing OpenBao (204) makes every request fail with 503: no payment key and no new login, so no new server of the store can start; a login already held still connects; unsealing with the key (200) brings the reads back. The service holds every secret, a dev server keeps them in memory, and the first credential remains."
detail = """
The operator seals OpenBao, as in an incident: allowed (204). While it is sealed, the payment key is refused (503) and a new login is refused (503), so no new server of the store can start; a login the application already has still connects.
After unsealing with the key: allowed (200), and the payment key is allowed (200) again.
What it costs: OpenBao holds every secret, so it must be guarded, audited and backed up; this dev server keeps everything in memory, a real one stores it; the first credential, the role id and secret id, remains; applications must take a new login without a restart.
"""
figure = "sealed"
figure_title = "Sealed means down"
figure_speech = """
Fifth demo: the bill. [[slnc 400]] The operator seals open bao, as in an incident. [[slnc 300]] A sealed server cannot read its own storage. [[slnc 600]]
In the middle, what the store gets while it is sealed. [[slnc 300]] The payment key: refused, five oh three, service unavailable. [[slnc 300]] A new login: refused too. [[slnc 300]] So no new server of the store can start. [[slnc 300]] A login it already holds keeps working, until its lease ends. [[slnc 700]]
On the right, the operator unseals with the key, and the reads work again. [[slnc 600]] That is the price. [[slnc 300]] The secrets service is now the one system the whole store depends on.
"""
speech = """
Here is the output: seal, then the refusals while sealed, then the unseal.
[[page]]
