[[act]]
title = "Rotation, and the blast radius of a leak"
summary = "A thief's copy of the static payments password connects before the rotation and not after it, while the new password does; three leased shop-api logins all connect until one revoke-prefix call (204) ends them: 0 of 3 still connect, and reports still gets a login (200)."
detail = """
Before the rotation, the static login payments, which OpenBao manages: a thief copies its password, and it connects.
After the rotation (POST database/rotate-role/payments): the new password differs, the new password connects, and the thief's copy does not.
Before the revocation, three leased logins of shop-api all connect, and a thief copies one. After revoking every lease under database/creds/shop-api: allowed (204), 0 of 3 logins still connect, and reports still gets a login: allowed (200).
"""
figure = "blast_radius"
figure_title = "Rotate a static password, revoke leased logins"
figure_speech = """
Fourth demo: rotation, and the blast radius of a leak. [[slnc 400]] On the left, a static password, one that has to stay, for the payments service. [[slnc 300]] A thief copies it, and it connects. [[slnc 300]] Open bao rotates it. [[slnc 300]] The new password differs, and it connects. [[slnc 300]] The thief's copy no longer does. [[slnc 700]]
On the right, three leased logins of the shop. [[slnc 300]] A thief copies one. [[slnc 300]] The operator does not need to know which. [[slnc 300]] One call revokes every lease under the shop's path. [[slnc 300]] None of the three connects any more. [[slnc 300]] And the reports job is untouched: it still gets a login.
"""
speech = """
Here is the output. [[slnc 400]] Before the rotation, the copied password connects. [[slnc 300]] After it, only the new one does. [[slnc 400]] Then three leased logins. [[slnc 300]] After the revoke prefix call, zero of three connect, and reports still gets its own.
"""
rows = { rotation = "active amber" }
console = [
    ["BEFORE THE ROTATION (the static login payments):", "code"],
    ["  a thief copies its password, which connects: true", "muted"],
    ["AFTER THE ROTATION (POST database/rotate-role/payments):", "code"],
    ["  the new password differs   true", "muted"],
    ["  the new password connects  true", "muted"],
    ["  the thief's copy connects  false", "muted"],
    ["BEFORE THE REVOCATION (3 leased logins of shop-api):", "code"],
    ["  all connect, and a thief copies one: true", "muted"],
    ["AFTER REVOKING EVERY LEASE UNDER database/creds/shop-api:", "code"],
