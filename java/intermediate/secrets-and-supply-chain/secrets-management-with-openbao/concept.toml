[readme]
intro = """
The plain [secrets-management](../secrets-management) project builds a secrets service from scratch and ends with "the -with-openbao version runs the same leases against a real secrets server". This is that version: a real **OpenBao 2.7** and a real **PostgreSQL 18** in Docker, on a private network, each bound to a free loopback port, with a small Java client that speaks OpenBao's HTTP API. It needs Docker; its tests are tagged `integration`: `./gradlew integrationTest`.

What it shows:
- **Who may ask.** `shop-api` and `reports` each have an AppRole and a policy. A **secret id works once**: the same one again, or one nobody issued, gets 400. The shop reads its payment key and is refused (403) the reports key, the reports app the other way round, and a request with no token is refused.
- **Secrets that stay still.** KV version 2 keeps versions: during a changeover version 1 and version 2 are both readable by number, the application cannot destroy versions, the operator destroys version 1, and version 2 goes on working. The **audit trail** records the path and the application, and writes the values as HMACs, never the key.
- **Database logins that are leased.** Each application is given a login of its own, named `v-approle-shop-api-<random>`, that really connects to PostgreSQL and can read `orders` but not `card_numbers`. A lease is renewed up to its **maximum of 20 seconds**; an unrenewed one ends and the login is removed; **revoking a lease ends the login at once.** (A `VALID UNTIL` in the creation statement is not extended by a renewal unless a renew statement says so.)
- **Rotation and blast radius.** A static password that OpenBao manages is rotated and the thief's copy stops working; **revoking every lease under one path** ends all of an application's logins and leaves the others alone.
- **The bill.** A **sealed** OpenBao refuses every read with 503, so the store cannot start a server; logins already held go on working until their lease would have ended; unsealing restores service. This dev server keeps everything in memory.

**Maps to:** OWASP Top 10 (2025) A02 Security Misconfiguration, A04 Cryptographic Failures · CWE-798, CWE-522 · OWASP Secrets Management Cheat Sheet · NIST SP 800-57.
"""
analogy = """
A hotel that stops handing out master keys. Each guest gets a card for their own room that stops working at checkout, the front desk can cancel one card or all of a floor's at once, and a log records every card that was cut. The price is a front desk that must always be open.
"""
scenario = """
An online store has a shop API and a reports job that both need a payment key and a database login. The demo starts a real OpenBao and a real PostgreSQL, gives each application a role and a policy, leases logins, and then renews, expires, rotates, revokes and seals.
"""
costs = [
    "**The secrets service holds every secret,** so it needs its own access control, audit, backups and unseal procedure.",
    "**The store cannot start while it is sealed or down,** so its availability is now part of the store's.",
    "**Applications need a first credential,** a role id and a secret id, to prove who they are.",
    "**Leases and rotation need applications that can reconnect** with a new login without a restart.",
    "**Policies are one more thing to write and review,** and a policy that is too wide undoes the point.",
]
too_much = """
A single small service on one machine with one secret can read an owner-only file injected at deploy time. Use a secrets server when several applications need secrets of their own, when logins should expire, or when a leak must be containable.
"""
met_before = [
    "`vault read database/creds/...` and `v-approle-...` user names in a database.",
    "`role_id` and `secret_id` in a deployment pipeline.",
    "A `403 permission denied` from a secrets server.",
    "A secrets service sealed after a restart.",
]
where = """
This is the tools version of [secrets-management](../secrets-management), in the [secrets-and-supply-chain](..) module. It runs the same ideas, leases, rotation and revocation, against a real secrets server and a real database.
"""
twin = """
OpenBao and PostgreSQL are real containers on a private Docker network, each bound to a free loopback port and removed at the end. OpenBao's audit device writes to a file inside its container, which the demo reads. Tokens, passwords, lease ids and ports are never printed; the demo waits about ten seconds, once, for a lease to end.
"""
test_note = "The tests start one OpenBao and one PostgreSQL for the whole class and remove them (./gradlew integrationTest). Two tests wait for a lease to end."

[[act]]
title = "A secrets server, and who may ask"
summary = "An application proves who it is with a role id and a secret id that works once, and gets a token that carries only its own policy."
detail = """
The store's payment key lives in OpenBao, not in the code, the environment or the image. shop-api logs in with its role id and its secret id and gets a token with the policies default and shop-api for 120 seconds. The same secret id again is refused, and so is one nobody issued. shop-api reads its payment key but is refused the reports key; reports reads its own key and is refused the payment key. A request with no token is refused. A policy names exactly what each application may read, and everything else is refused.
"""
speech = """
First demo: a secrets server, and who may ask. [[slnc 400]] Each application has a role, and a secret id that works once. [[slnc 600]]
The same secret id again is refused. [[slnc 600]]
The shop reads its payment key, and is refused the reports key. [[slnc 300]] The reports job is refused the payment key. [[slnc 600]]
A policy names exactly what each application may read.
"""
rows = { who = "active ok" }
console = [
    ["shop-api logs in: a token with policies [default, shop-api]", "ok"],
    ["the same secret id again -> refused (400)", "ok"],
    ["shop-api reads the reports key -> refused (403)", "ok"],
    ["no token -> refused (403)", "ok"],
]

[[act]]
title = "Secrets that stay still: versions, rotation and the audit trail"
summary = "Versions of a secret are readable by number during a changeover, the application cannot destroy them, the operator does, and the audit trail records requests with values hashed."
detail = """
The store reads the payment key, version 1. The provider issues version 2 and it is written as version 2; during the changeover both are readable by number, and the current version is now version 2. The application cannot destroy versions: refused. After every server has switched, the operator destroys version 1; reading version 1 is now refused with 404, and version 2 still works. The audit trail recorded the requests, the path and the application that asked, and not the key itself: values are written as HMACs.
"""
speech = """
Second demo: secrets that stay still. [[slnc 400]] The provider issues version two of the payment key. [[slnc 600]]
During the changeover both versions are readable by number. [[slnc 600]]
The application cannot destroy versions. [[slnc 300]] The operator destroys version one, and version two goes on working. [[slnc 600]]
The audit trail records who asked for what, and writes the values as hashes.
"""
rows = { versions = "active ok" }
console = [
    ["v1 and v2 readable by number during the changeover", "ok"],
    ["the application cannot destroy a version -> refused (403)", "ok"],
    ["v1 destroyed -> 404; v2 -> allowed", "ok"],
    ["the audit trail holds the path, not the key", "ok"],
]

[[act]]
title = "Database logins that are leased"
summary = "Each application gets a real database login of its own, with only its grants, that is renewed up to a maximum, ends when unrenewed, and ends at once when revoked."
detail = """
shop-api asks and gets a database login of its own, named v-approle-shop-api-<random>, for 8 seconds. Reports gets a different one; no two applications share one. Both connect to the real database. shop-api's login reads orders and cannot read the card numbers. shop-api asking for reports' login is refused. The shop renews its lease asking for 600 seconds and is capped at the maximum of 20. Reports never renewed: 9 seconds on, its lease has ended and the login is removed. The shop's renewed login still connects. The operator revokes the shop's lease, and the login no longer connects.
"""
speech = """
Third demo: database logins that are leased. [[slnc 400]] The shop is given a login of its own, and so is the reports job. [[slnc 600]]
They really connect, and the shop's login cannot read the card numbers. [[slnc 600]]
A renewal is capped at the maximum. [[slnc 300]] A lease that is not renewed ends, and the login is removed. [[slnc 600]]
When the operator revokes a lease, the login stops at once.
"""
rows = { leases = "active ok" }
console = [
    ["shop-api: v-approle-shop-api-<random>, 8 seconds; reports: another", "ok"],
    ["shop-api's login reads orders: true; card numbers: false", "ok"],
    ["renewal asked for 600 seconds -> capped at 20", "ok"],
    ["not renewed -> the login is removed; revoked -> stops at once", "ok"],
]

[[act]]
title = "Rotation, and the blast radius of a leak"
summary = "A static password that OpenBao manages is rotated and the thief's copy stops working; revoking every lease under one path ends one application's logins and no others."
detail = """
The payments service has a static login that OpenBao manages. A thief copies its password, which connects. OpenBao rotates it: the new password differs, the new one connects, and the thief's copy does not. Three logins leased to shop-api's servers all connect; a thief copies one. The leak is noticed and the operator revokes every lease under database/creds/shop-api at once: 0 logins still connect. The other applications are untouched: reports still gets a login.
"""
speech = """
Fourth demo: rotation, and the blast radius of a leak. [[slnc 400]] A static password that open bao manages is rotated, and the thief's copy stops working. [[slnc 600]]
Three leased logins are copied by a thief. [[slnc 300]] The operator revokes everything under the shop's path, and none of them connect. [[slnc 600]]
The other applications are untouched.
"""
rows = { rotation = "active ok" }
console = [
    ["rotate the static password: the thief's copy -> false", "ok"],
    ["three leased logins all connect", "amber"],
    ["revoke everything under database/creds/shop-api -> 0 connect", "ok"],
    ["reports still gets a login", "ok"],
]

[[act]]
title = "The bill"
summary = "A sealed OpenBao refuses every request with 503, so the store cannot start a server; logins already held keep working until their lease ends; unsealing restores service."
detail = """
The operator seals OpenBao, as in an incident. The application asks for its payment key and is refused with 503, and for a new login, refused with 503: the store cannot start a server while the secrets service is down. A login it already holds keeps working until its lease would have ended. The operator unseals with the key and the application reads again. The secrets service holds every secret, so it needs its own access control, audit and backups. The application still needs a first credential, its role id and a secret id; platform identity, in the advanced track, removes it. Leases and rotation need applications that can reconnect with a new login without a restart.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] The operator seals open bao. [[slnc 600]]
The application cannot read its payment key, or get a new login. [[slnc 300]] The store cannot start a server. [[slnc 600]]
A login it already holds keeps working until the lease ends. [[slnc 600]]
Unseal it, and service returns. [[slnc 300]] The secrets service holds every secret, so it needs the care of one.
"""
rows = { bill = "active ok" }
console = [
    ["sealed: the payment key -> 503, a new login -> 503", "bad"],
    ["a login already held still connects", "ok"],
    ["unsealed: the application reads again", "ok"],
]

