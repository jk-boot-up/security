title = "How To Use It"
body = ["Explain how an application proves who it is to a", "secrets server", "Write a policy that names what an application may read", "Lease a database login and say when it ends", "Describe what the store does when the secrets server", "is sealed"]
narration = "So, how do you use it? [[slnc 400]] Keep secrets in a service, give each application its own role and policy, lease database logins and renew them, rotate static passwords, audit every request, revoke on a leak, and plan for the day the service is sealed."

