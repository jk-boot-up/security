]

[[act]]
title = "Database logins that are leased"
summary = "OpenBao runs CREATE ROLE ... VALID UNTIL and GRANT SELECT ON orders for each request: shop-api and reports get their own v-approle-... logins for 8 s; both connect, shop-api reads orders but not card_numbers; a renewal asking 600 s is capped at the 20 s maximum; after 9.5 s the unrenewed reports login no longer connects and the renewed shop login does, until the operator revokes it."
detail = """
The input is the role the operator set up: for every request OpenBao runs CREATE ROLE "{{name}}" WITH LOGIN PASSWORD '{{password}}' VALID UNTIL '{{expiration}}' and GRANT SELECT ON orders TO "{{name}}", with a time to live of 8 s and a maximum of 20 s.
The requests GET database/creds/shop-api and database/creds/reports return two logins, v-approle-shop-api-... and v-approle-reports-..., different, each with a lease of 8 s. Both connect to the real PostgreSQL; shop-api's login reads orders and not card_numbers.
The shop renews and asks for 600 seconds: allowed (200), but granted min(600, 20 - its age), so at most 20.
After 9.5 seconds, past the 8 s time to live, the reports login, never renewed, no longer connects; the renewed shop login still does. The operator revokes the shop's lease: allowed (204), and the login no longer connects.
"""
figure = "leased_logins"
figure_title = "Two leased database logins"
figure_speech = """
Third demo: database logins that are leased. [[slnc 400]] Each time an application asks, open bao creates a brand new PostgreSQL login, with a random name and password, and an end date. [[slnc 600]]
At the top, two logins on one time line. [[slnc 300]] Each one starts with a time to live of eight seconds. [[slnc 300]] The reports login is never renewed, so it stops at eight seconds. [[slnc 300]] The shop renews, and asks for six hundred seconds. [[slnc 300]] But a lease never runs past its maximum, twenty seconds. [[slnc 600]]
The white line is nine and a half seconds. [[slnc 300]] The reports login no longer connects. [[slnc 300]] The shop's still does. [[slnc 700]]
At the bottom, what the shop's login may read. [[slnc 300]] The role grants select on orders only, so the card numbers table is refused.
"""
speech = """
Here is the output. [[slnc 400]] The role: the S Q L that open bao runs for every login, and the time to live and maximum. [[slnc 300]] Then the two requests, and two different logins, whose names end in random letters.
[[page]]
In the real database, both connect, and the shop's reads orders, but not card numbers. [[slnc 400]] The renewal asks for six hundred seconds, and gets at most twenty. [[slnc 300]] After nine and a half seconds, only the renewed login connects. [[slnc 300]] And once the operator revokes its lease, it stops at once.
"""
