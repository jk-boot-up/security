[threatmodel]
scope = """
Secrets for an online store's applications held in OpenBao, and the database logins it leases. It covers identity, policy, leases, rotation, revocation and the failure of the service. It does not cover the host that runs OpenBao.
"""
assets = [
    "The payment key and the database logins.",
    "The unseal key and the root token.",
]
actors = [
    "An application with its own role.",
    "A thief who copies a secret id or a login.",
    "An operator with the root token.",
]
boundaries = [
    "The application to OpenBao: a token with one policy.",
    "OpenBao to PostgreSQL: an administrator login that only OpenBao holds.",
]
assumptions = [
    "The channel to OpenBao is TLS in production.",
    "The root token and unseal keys are held by several people.",
]
out_of_scope = [
    "Compromise of the OpenBao host.",
    "Storage and high availability of OpenBao.",
]
tests = [
    "`BaoSecretsTest` starts a real OpenBao and PostgreSQL and checks the single use of a secret id, the policies, versions, the audit trail, per-application logins, revocation, expiry, the renewal cap, revoking a prefix, rotation and sealing.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next project in this module, artifact-signing-with-cosign, moves from the secrets the store holds to the proof that what it runs is what was built.
"""

[[threat]]
id = "T1"
stride = "S"
threat = "A stolen secret id or token lets another party act as the application"
where = "AppRole login, tokens"
control = "A secret id that works once and a short token life"
residual = "A thief who is first to use the secret id"

[[threat]]
id = "T2"
stride = "I"
threat = "A leaked database login stays valid"
where = "database/creds"
control = "Short leases, a renewal cap and revocation"
residual = "The seconds until the lease ends or is revoked"

[[threat]]
id = "T3"
stride = "E"
threat = "An application reads another application's secrets"
where = "policies"
control = "One policy per application that names its paths only"
residual = "A policy that is written too wide"

[[threat]]
id = "T4"
stride = "D"
threat = "The secrets service is sealed or down and the store cannot start"
where = "OpenBao"
control = "Held logins keep working until their lease ends; unseal procedure and monitoring"
residual = "An outage longer than the leases"

[poster]
headline = [["SECRETS WITH", "text"], ["OPENBAO", "accent"]]
taglines = [["Each application gets its own short-lived login", "gold"]]
before = { code = "db.password=never-changes", note = "one password, for ever", tag = "BEFORE" }
after = { code = "GET database/creds/shop-api", note = "a login per app, 8 s lease", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "Secrets Management with OpenBao"
narration = "Hello, and welcome. [[slnc 400]] This video explains secrets management with open bao, a real secrets server, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A secrets server keeps keys and passwords in one guarded place, and hands each application only what its policy allows. [[slnc 300]] Instead of one database password that never changes, each application is leased a login of its own, that ends with its lease, or the moment a leak is noticed. [[slnc 600]] Think of a hotel key card that opens one room, for one stay, and can be cancelled from the front desk. [[slnc 600]] Our example is an online store."

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online store has a shop API", "and a reports job.", "Both need a payment key", "and a database login.", "", "The demo starts a real OpenBao", "and a real PostgreSQL in Docker,", "then leases, renews, rotates,", "revokes and seals."]
narration = "Here is the scenario. [[slnc 400]] An online store has a shop A P I and a reports job. [[slnc 300]] Both need a payment key, and a database login. [[slnc 500]] The demo starts a real open bao and a real PostgreSQL in Docker. [[slnc 300]] It gives each application a role and a policy, leases them database logins, and then renews, expires, rotates, revokes, and finally seals the server."

[[scene]]
key = "02-words"
kind = "bullets"
title = "The Words"
body = ["Role id and secret id: how an app logs in", "Token: what it gets, for a short time", "Policy: the paths a token may use", "Lease: a login that ends by itself", "Revoke: end a lease at once", "Seal: lock the server, nothing is served"]
narration = """Before the demos, the words. [[slnc 500]] A role id and a secret id are how an application logs in to open bao. [[slnc 300]] The secret id works only once. [[slnc 500]] A token is what the application gets back, for a short time. [[slnc 500]] A policy lists the paths a token may use. [[slnc 500]] A lease is a login that ends by itself. [[slnc 500]] To revoke is to end a lease at once. [[slnc 500]] And to seal is to lock the server, so it serves nothing until it is unsealed with its key."""

[[scene]]
key = "02-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "02-approle"
kind = "figure"
title = "How an application logs in"
body = "approle_login"
narration = """Let's see the core idea on one example: how the shop logs in. [[slnc 400]] On the left, the request. [[slnc 300]] The shop sends its role id, which names the application, and a secret id, which works once. [[slnc 300]] Neither is ever printed. [[slnc 600]] On the right, the response from the real open bao: allowed, status two hundred. [[slnc 300]] And a token, carrying the default policy and the shop's own policy, for one hundred and twenty seconds. [[slnc 700]]
At the bottom, the same secret id a second time. [[slnc 300]] Refused, status four hundred. [[slnc 300]] So a thief who sees a used secret id gets nothing. [[slnc 300]] And a secret id that nobody issued is refused the same way. [[slnc 600]] Everything else in this video starts with that token."""

[[scene]]
key = "03-acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "04-costs"
kind = "bullets"
title = "What It Costs"
body = ["The secrets server holds every secret", "Sealed or down: no new secrets, no new servers", "Each application needs a first credential", "Applications must reconnect when logins change", "Policies to write and review"]
narration = "Nothing is free. [[slnc 400]] Here is what it costs. [[slnc 500]] The secrets server holds every secret, so it is the most valuable thing to attack. [[slnc 500]] While it is sealed or down, applications cannot get new secrets, and new servers cannot start. [[slnc 500]] Each application still needs a first credential to log in with. [[slnc 500]] Applications must reconnect when their logins change. [[slnc 300]] And policies are one more thing to write and review."

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["A database user named v-approle-...", "A role id and a secret id in a deployment", "Unseal keys split among several people", "A password in a config file that never changes"]
narration = "You have probably met this already. [[slnc 400]] A database user whose name starts with v dash, followed by a role name, is a login leased by a secrets server. [[slnc 500]] A role id and a secret id, in a deployment, are an application's way to log in. [[slnc 500]] Unseal keys split among several people are how the server is opened after a restart. [[slnc 500]] And a password in a config file that has never changed is what this project replaces."

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Keep secrets in a secrets server", "Each application: its own role and policy", "Lease database logins and renew them", "Rotate the passwords that stay", "Audit every request", "Revoke on a leak; plan for the server sealed"]
narration = "So, how do you use it? [[slnc 400]] Keep secrets in a secrets server, not in files. [[slnc 300]] Give each application its own role, and a policy that names exactly what it may read. [[slnc 500]] Lease database logins, and renew them while they are needed. [[slnc 300]] Rotate the passwords that must stay. [[slnc 500]] Audit every request. [[slnc 300]] Revoke at once when something leaks. [[slnc 300]] And plan for the day the server is sealed."

[[scene]]
key = "07-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Let the application renew", "its own lease, and log every renewal."]
narration = "That's secrets management with open bao. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] A secrets server turns a secret that never changes into a login that lasts minutes, belongs to one application, and can be taken back. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Let the application renew its own lease in a loop, and log every renewal. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] The server and the database are real, in Docker; the Java side is small. [[slnc 300]] Here are the classes that matter."""

[[class]]
name = "BaoLab"
what = "starts OpenBao and PostgreSQL in Docker, and removes them"
[[class.part]]
title = "pinned images, loopback only"
code = '''
static final String BAO_IMAGE = "openbao/openbao:2.7.0";
static final String POSTGRES_IMAGE = "postgres:18.6-alpine";
'''
speech = """The lab pins both images, so every run is the same. [[slnc 300]] It starts them on a private Docker network, with ports bound to the loopback address only, and removes everything when it closes."""

[[class]]
name = "Bao"
what = "a small client for OpenBao's HTTP API"
[[class.part]]
title = "every request carries the token"
code = '''
if (token != null) {
    b.header("X-Vault-Token", token);
'''
speech = """Every call is plain H T T P to a path under v one. [[slnc 300]] The token goes in a header. [[slnc 300]] With no token, open bao refuses almost everything."""

[[class]]
name = "BaoSecretsDemo"
what = "sets up the roles, then runs the five demos"
[[class.part]]
title = "one policy per application"
code = '''
return "path \"secret/data/" + app + "/*\" { capabilities = [\"read\"] }\n"
        + "path \"database/creds/" + app + "\" { capabilities = [\"read\"] }";
'''
speech = """Each application's policy names two paths: its own secrets, and its own database logins. [[slnc 300]] Nothing else is named, so everything else is refused."""
[[class.part]]
title = "a login role, and a database role"
code = '''
root.post("auth/approle/role/" + app, Map.of("token_policies", app, "token_ttl", "120s",
        "secret_id_num_uses", 1, "secret_id_ttl", "60s"));
root.post("database/roles/" + app, Map.of("db_name", "shopdb",
        "creation_statements", CREATE, "renew_statements", RENEW,
        "default_ttl", "8s", "max_ttl", "20s"));
'''
speech = """The login role gives a token for one hundred and twenty seconds, and a secret id that works once. [[slnc 300]] The database role says which S Q L creates a login, with a time to live of eight seconds and a maximum of twenty."""
[[class.part]]
title = "lease, renew"
code = '''
Bao.Reply a = shop.get("database/creds/shop-api");
...
String lease = String.valueOf(a.json().get("lease_id"));
Bao.Reply renewed = root.put("sys/leases/renew", Map.of("lease_id", lease, "increment", 600));
'''
speech = """Reading database creds creates a new login and returns it with a lease id. [[slnc 300]] Renewing asks for more time, and open bao caps it at the maximum."""

[[class]]
name = "PolicyRule"
what = "a teaching class: decides a read the way the policy does"
[[class.part]]
title = "a star covers what is below it"
code = '''
if (path.endsWith("*")) {
    return request.startsWith(path.substring(0, path.length() - 1));
}
return request.equals(path);
'''
speech = """A rule that ends in a star covers every path that starts with the rest. [[slnc 300]] Any other rule covers only its own path. [[slnc 300]] The demo prints its answer next to the real server's, and they agree."""

[[acronym]]
short = "API"
long = "Application Programming Interface: how one program calls another"
say = "A P I is application programming interface: the way one program calls another, here open bao's."

[[acronym]]
short = "HTTP"
long = "Hypertext Transfer Protocol: requests, and their status codes"
say = "H T T P is hypertext transfer protocol: each request gets a status code, two hundred for allowed, four oh three for forbidden."

[[acronym]]
short = "HMAC"
long = "Hash-based Message Authentication Code: a hash made with a secret key"
say = "H M A C is hash based message authentication code: a hash made with a key, so only the key's owner can make the same one."

[[acronym]]
short = "SHA-256"
long = "Secure Hash Algorithm, 256 bits: 64 hex (base 16) characters"
say = "S H A is secure hash algorithm. S H A two fifty six gives two hundred and fifty six bits: sixty four hex characters, hex being base sixteen, the digits zero to nine and a to f."

[[acronym]]
short = "SQL"
long = "Structured Query Language: the commands a database runs"
say = "S Q L is structured query language: the commands a database runs, like create role and grant."

[[acronym]]
short = "TTL"
long = "Time To Live: how long a lease or token lasts before it ends by itself"
say = "T T L is time to live: how long a lease lasts, eight seconds here, before it ends by itself."

