[[act]]
title = "Secrets that stay still: versions, rotation and the audit trail"
summary = "The payment key goes from {api-key=key-v1} to version 2 {api-key=key-v2} while version 1 stays readable by number; the application cannot destroy a version (403), the operator can (204), and version 1 then answers 404; the audit trail holds the paths and the application, never the key: key-v2 becomes hmac-sha256: plus 64 hex characters, the exact hash in the log."
detail = """
Before the rotation the store reads the current payment key, {api-key=key-v1}. The provider issues v2, and the operator writes it as version 2. During the changeover both are readable by number: version 1 {api-key=key-v1}, version 2 {api-key=key-v2}, and the current version is now version 2.
Destroying version 1 once every server has switched: by the application, refused (403); by the operator, allowed (204); then version 1 is refused (404) and version 2 is allowed (200).
The audit trail recorded the requests for secret/data/shop-api/payment and the application that asked, but not the key itself. How it hides a value: OpenBao writes it as an HMAC-SHA256 with the server's own key. key-v2 becomes hmac-sha256: followed by 64 hex characters, and sys/audit-hash gives exactly the hash that is in the log.
"""
figure = "versions_audit"
figure_title = "Versions through a changeover, and a hidden value"
figure_speech = """
Second demo: secrets that stay still. [[slnc 400]] A payment key is not leased: the provider issues it, and the store keeps it. [[slnc 300]] So open bao keeps versions. [[slnc 700]]
On the left, before: the store reads version one. [[slnc 300]] In the middle, the changeover. [[slnc 300]] The provider issues a new key, and it is written as version two. [[slnc 300]] Version one is still readable by its number, so a server that has not switched yet keeps working. [[slnc 300]] On the right, once every server has switched, the operator destroys version one, and reading it now gives four oh four, not found. [[slnc 700]]
At the bottom, the audit trail. [[slnc 300]] It records every request, but never a secret. [[slnc 300]] A value is written as an H M A C: a keyed hash, with a key only the server has. [[slnc 300]] Key v two becomes sixty four hex characters, and that exact hash is in the log.
"""
speech = """
Here is the output. [[slnc 400]] Before the rotation, version one. [[slnc 300]] After the provider issues version two: both versions, and the current one. [[slnc 400]] Destroying version one: the application is refused, the operator is allowed, and then only version two is left.
[[page]]
The audit trail: the requests and the application are logged, the key is not. [[slnc 400]] And how a value is hidden: an H M A C with S H A two fifty six, sixty four hex characters, found in the trail exactly.
"""
rows = { versions = "active ok" }
console = [
    ["BEFORE THE ROTATION, WHAT THE STORE READS:", "code"],
    ["  current    {api-key=key-v1}", "muted"],
    ["AFTER THE PROVIDER ISSUES v2 (written as version 2):", "code"],
    ["  version 1  {api-key=key-v1}", "muted"],
    ["  version 2  {api-key=key-v2}", "muted"],
    ["  current    {api-key=key-v2}", "muted"],
    ["DESTROYING VERSION 1, ONCE EVERY SERVER HAS SWITCHED:", "code"],
    ["  by the application  refused (403)", "amber"],
    ["  by the operator     allowed (204)", "ok"],
    ["  then version 1      refused (404)", "amber"],
    ["  then version 2      allowed (200)", "ok"],
    ["---", ""],
    ["THE AUDIT TRAIL:", "code"],
    ["  requests for secret/data/shop-api/payment  true", "muted"],
    ["  the application that asked, shop-api       true", "muted"],
    ["  the key itself, key-v1 or key-v2           false", "muted"],
    ["HOW THE AUDIT TRAIL HIDES A VALUE (HMAC-SHA256, server's key):", "code"],
    ["  key-v2 becomes  hmac-sha256: + 64 hex characters (not shown)", "muted"],
