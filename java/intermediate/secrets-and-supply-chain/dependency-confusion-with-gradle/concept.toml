[threatmodel]
scope = """
A Gradle build that resolves dependencies from a private and a public repository. It covers version ranges, repository order, content filters and dependency verification. It does not cover the contents of the packages or the repositories' own security.
"""
assets = [
    "The build machine and the secrets it can reach.",
    "The libraries that end up in the store's release.",
]
actors = [
    "The team that maintains the build.",
    "An attacker who can publish in the public repository.",
    "Someone who can replace a file in the private repository.",
]
boundaries = [
    "The public repository: anyone can publish under any name that is free.",
    "The build file: the only place that says which repository may answer for which group.",
]
assumptions = [
    "The build file and the verification metadata are reviewed like code.",
    "The repositories are served over https.",
]
out_of_scope = [
    "Malicious code in a library that is on the allow list.",
    "Compromise of the private repository's storage.",
]
tests = [
    "`DependencyConfusionTest` runs real Gradle builds for the range, the order, the filters and the request count, the verification metadata and the subgroup.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next module, tls, starts with local-certificate-authority-with-step-ca.
"""

[[threat]]
id = "T1"
stride = "S"
threat = "An internal name is resolved from the public repository"
where = "the build file"
control = "Content filters per repository, exact versions or locks"
residual = "Groups that are not listed"

[[threat]]
id = "T2"
stride = "T"
threat = "The same version number is served with other bytes"
where = "any repository"
control = "Dependency verification with sha256 checksums"
residual = "Metadata approved without a review"

[[threat]]
id = "T3"
stride = "I"
threat = "An unpublished internal name is asked for in the public repository"
where = "the build"
control = "The filter keeps the name out of every request to the public repository"
residual = "Plugin and build script repositories"

[[threat]]
id = "T4"
stride = "R"
threat = "Checksums are written from a build that was already compromised"
where = "gradle/verification-metadata.xml"
control = "Write them from a build you trust and review every change"
residual = "Approving changes without looking"

[poster]
headline = [["CONFUSION WITH", "text"], ["GRADLE", "accent"]]
taglines = [["Tell each repository which names it may answer for", "gold"]]
before = { code = "com.shop:pricing:99.0.0 from public", note = "A range takes the highest", tag = "BEFORE" }
after = { code = "content { includeGroupAndSubgroups }", note = "Filters and checksums", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "Dependency Confusion with Gradle"
narration = "Hello, and welcome. [[slnc 400]] This video explains dependency confusion in real Gradle builds, and how Gradle stops it. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A Gradle build that lists a private and a public repository asks both of them for every name. [[slnc 300]] So an attacker who publishes the company's internal name in the public one can win. [[slnc 300]] Repository content filters tell each repository which groups it may answer for, and dependency verification checks the checksum of every file the build downloads. [[slnc 600]] Think of telling the post room which supplier may deliver which parts, and weighing every box on arrival. [[slnc 600]] Our example is an online store."

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online store builds with Gradle.", "Its pricing and audit libraries", "live in its private repository;", "its JSON library in a public one.", "", "The demo runs real Gradle builds", "against both repositories,", "which remember every request."]
narration = "Here is the scenario. [[slnc 400]] An online store builds with Gradle. [[slnc 300]] Its pricing and audit libraries live in the company's private repository, and its J S O N library in a public one. [[slnc 500]] The demo serves both repositories on this machine, and they remember every request they receive. [[slnc 500]] It runs real Gradle builds against them, while an attacker publishes the store's internal names in the public one."

[[scene]]
key = "02-words"
kind = "bullets"
title = "The Words"
body = ["Group, name, version: com.shop:pricing:1.4.2", "Repository: where jars are published", "Range: [1.4,) means 1.4 or higher", "Content filter: which groups a repository may serve", "Checksum: a fingerprint of a file's bytes", "Verification metadata: the checksums a build trusts"]
narration = """Before the demos, the words. [[slnc 500]] A Gradle dependency has a group, a name and a version, like com dot shop, pricing, one point four point two. [[slnc 500]] A repository is where jars are published. [[slnc 500]] A range, like one point four and up, accepts any version from one point four. [[slnc 500]] A content filter says which groups a repository may answer for. [[slnc 500]] A checksum is a fingerprint of a file's exact bytes. [[slnc 300]] And the verification metadata is the file of checksums that a build trusts."""

[[scene]]
key = "02-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "02-every-repository"
kind = "figure"
title = "Gradle asks every repository"
body = "every_repository"
narration = """Let's see the core idea on one example. [[slnc 400]] At the top, what the build asks for: com dot shop pricing, one point four or higher. [[slnc 600]]
For a range, Gradle reads the version list of every repository. [[slnc 300]] On the left, the private repository lists one point four point two. [[slnc 300]] On the right, the public repository, where anyone can publish, lists ninety nine point zero point zero. [[slnc 300]] The attacker put it there. [[slnc 700]]
Both versions are in range. [[slnc 300]] Ninety nine is more than one, so Gradle takes ninety nine. [[slnc 300]] Nothing in the build says that a com dot shop name may only come from the private repository. [[slnc 300]] That is the confusion."""

[[scene]]
key = "03-acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "04-costs"
kind = "bullets"
title = "What It Costs"
body = ["Every internal group must be listed", "Subgroups need their own rule", "The checksum file is one more thing to review", "Plugins have their own repository list", "Checksums written too late trust the attacker"]
narration = "Nothing is free. [[slnc 400]] Here is what it costs. [[slnc 500]] Every internal group must be listed in the filter. [[slnc 300]] A filter for one group does not cover its subgroups, unless you ask for them. [[slnc 500]] The checksum file is one more file to review in every upgrade. [[slnc 500]] Plugins, and the build script itself, have a repository list of their own. [[slnc 300]] And checksums written from a build that was already compromised record the attacker's package."

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["mavenCentral() and a company repository together", "content { includeGroup ... } or exclusiveContent", "gradle/verification-metadata.xml", "A version such as 1.+ or [1.4,)"]
narration = "You have probably met this already. [[slnc 400]] Maven Central and a company repository in the same repositories block is the setup this attack needs. [[slnc 500]] A content block with include group, or exclusive content, is the filter. [[slnc 500]] A verification metadata file in the gradle folder holds the checksums. [[slnc 500]] And a version like one dot plus, or a range, is what lets the highest number win."

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Say which repository may answer for each group", "Include the subgroups", "Exact versions, or locks", "Keep verification metadata under review", "The same rules for plugins", "Reserve internal groups publicly, where you can"]
narration = "So, how do you use it? [[slnc 400]] Declare which repository may answer for each group, and include the subgroups. [[slnc 500]] Use exact versions, or dependency locks, instead of ranges. [[slnc 500]] Keep the verification metadata in version control, and review every change to it. [[slnc 300]] Give plugins the same rules. [[slnc 500]] And where you can, reserve your internal groups in the public registry too."

[[scene]]
key = "12-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Use exclusiveContent for one", "group and compare it with includeGroup."]
narration = "That's dependency confusion with Gradle. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] A build should ask only the repository that owns a name, and should check the bytes it gets against a list it reviewed. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Use exclusive content for one group, and compare it with include group. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] The builds are real Gradle builds, so most of the code sets up repositories and reads what happened. [[slnc 300]] Here are the parts that matter."""

[[class]]
name = "Repo"
what = "a Maven repository on a loopback port that logs every request"
[[class.part]]
title = "remember the path, then answer"
code = """
String path = exchange.getRequestURI().getPath();
requests.add(path);
byte[] body = path.endsWith("maven-metadata.xml") ? metadata(path) : files.get(path);
"""
speech = """Every path a build asks for goes into a list first. [[slnc 300]] That list is the log that shows zero requests with the filters, and the leaked name without them."""

[[class]]
name = "Build"
what = "writes a small Gradle build and runs the real Gradle"
[[class.part]]
title = "who published each resolved jar"
code = """
def origin = new java.util.zip.ZipFile(a.file).withCloseable { z ->
    z.getInputStream(z.getEntry('origin.txt')).text }
println "RESOLVED ${id.group}:${id.module}:${id.version} from ${origin}"
"""
speech = """The build file has a small task. [[slnc 300]] For every jar Gradle resolved, it opens the jar and prints who published it. [[slnc 300]] That is how the output can say: the attacker's."""

[[class]]
name = "DependencyConfusionDemo"
what = "the content filters and the verification metadata"
[[class.part]]
title = "the two filters"
code = """
private static final String PRIVATE_ONLY = "includeGroupAndSubgroups 'com.shop'";
private static final String NOT_SHOP = "excludeGroupAndSubgroups 'com.shop'";
"""
speech = """The private repository includes the group com dot shop and its subgroups. [[slnc 300]] The public one excludes exactly the same groups, so an internal name is never asked for there."""
[[class.part]]
title = "write the checksums once"
code = """
Build.Result written = good.run("--write-verification-metadata", "sha256");
"""
speech = """One trusted run writes the verification metadata. [[slnc 300]] Every later run is checked against it."""

[[class]]
name = "VersionSteps"
what = "a teaching class: how a range picks a version"
[[class.part]]
title = "in range, then the highest"
code = """
return versions.stream().filter(v -> inRange(v, range)).max(ORDER);
"""
speech = """Keep the versions at or above the lower bound, then take the highest, compared number by number. [[slnc 300]] A test checks it against the rule Gradle follows."""

[[class]]
name = "GroupFilter"
what = "a teaching class: which groups a filter covers"
[[class.part]]
title = "exact group, or group and subgroups"
code = """
case "includeGroup", "excludeGroup" -> group.equals(filterGroup);
case "includeGroupAndSubgroups", "excludeGroupAndSubgroups" ->
        group.equals(filterGroup) || group.startsWith(filterGroup + ".");
"""
speech = """Include group matches one group exactly. [[slnc 300]] The subgroups version also matches every group that starts with it and a dot. [[slnc 300]] That is why com dot shop dot tools slipped through."""

[[class]]
name = "Checksums"
what = "a teaching class: what verification compares"
[[class.part]]
title = "the SHA-256 of the bytes"
code = """
MessageDigest sha = MessageDigest.getInstance("SHA-256");
return HexFormat.of().formatHex(sha.digest(bytes));
"""
speech = """It computes the S H A two fifty six of the bytes a repository serves. [[slnc 300]] The demo shows that it equals the checksum Gradle wrote."""

