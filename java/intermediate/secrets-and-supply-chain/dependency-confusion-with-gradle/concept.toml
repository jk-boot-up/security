# concept.toml: everything about this project that is not Java code.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "dependency-confusion-with-gradle"
level = "intermediate"
module = "secrets-and-supply-chain"
title = "Dependency Confusion with Gradle"
short_title = "Confusion with Gradle"
package = "depconfusion"
main_class = "DependencyConfusionDemo"
tagline = "Gradle asks every repository for every name unless it is told which repository may answer for which group, and then it checks the bytes against a list"
bold = "A Gradle build that lists a private and a public repository will take the highest version of an internal name from whichever one has it, and the first copy of an exact version in declaration order; repository content filters tell each repository which groups it may answer for, so an internal name is never even asked for in the public repository, and dependency verification checks the sha256 of every artifact against a file in the repository; but a filter is only as good as its list of groups, and checksums written from a build that was already compromised record the attacker's package."
domain = "an online store"
domain_note = ""
youtube_description = "Dependency confusion with real Gradle 9 builds against a private and a public Maven repository on loopback ports: a version range that takes the attacker's 99.0.0 from the public repository, an exact version taken from the first repository that has it, content filters that keep an internal group out of the public repository and show zero requests for it, dependency verification metadata that refuses an unlisted version and the same version with other bytes, a filter for com.shop that does not cover com.shop.tools, and checksums written from a compromised build."
thumb_lines = ["CONFUSION WITH", "GRADLE"]
thumb_code = "content { includeGroupAndSubgroups }"
youtube_title = "Dependency Confusion with Gradle: Content Filters and Dependency Verification (OWASP A03)"
youtube_tags = ["dependency confusion", "gradle", "repository content filtering", "dependency verification", "supply chain", "maven", "owasp top 10", "a03", "java"]

[readme]
intro = """
The plain [dependency-confusion](../dependency-confusion) project simulates resolvers in Java. This one runs **real Gradle 9 builds** (this project's own wrapper) against two real Maven repositories, a private one and a public one, that the demo serves on loopback ports and that remember every request. No Docker and no network are needed; the tests are tagged `integration` because each build takes a few seconds: `./gradlew integrationTest`.

What it shows:
- **A build that works.** `com.shop:pricing` and `com.shop:audit` come from the private repository, `org.acme:json-lib` from the public one.
- **The attacker registers an internal name in the public repository.** A version range `[1.4,)` takes the highest version of any repository: `pricing 99.0.0`, the attacker's. An exact version is safer, but the first repository in declaration order that has it wins, so a public repository declared first serves the attacker's `audit 3.1.0`.
- **Content filters.** The private repository includes group `com.shop` and its subgroups, the public one excludes them. The build resolves the right packages, and the public repository received **zero requests** for `com.shop`. An internal library that is not published yet fails without leaking its name; without the filter, the name is asked for in the public repository.
- **Dependency verification.** `--write-verification-metadata sha256` records the checksums in `gradle/verification-metadata.xml`. A version that is not listed and the same version with other bytes are both refused.
- **The bill.** A filter for the exact group `com.shop` does not cover `com.shop.tools`; checksums written while the attacker's package was already being resolved are the attacker's; plugin repositories are a separate list.

**Maps to:** OWASP Top 10 (2025) A03 Software Supply Chain Failures · CWE-427 (uncontrolled search path element), CWE-494 · the 2021 dependency confusion research.
"""
analogy = """
A shop that phones every supplier in the city for a part number and takes the highest revision number it hears. Telling each supplier which part numbers it may answer for, and checking the part against the drawing, are two different protections.
"""
scenario = """
An online store builds with Gradle. Its pricing and audit libraries live in the company's repository and its JSON library in a public one. The demo plays the store's build and an attacker who can publish in the public repository.
"""
costs = [
    "**Every internal group must be listed,** in every build and every settings file, and a new group that nobody adds is unprotected.",
    "**Checksums are one more file to review** every time a dependency changes, and people approve changes without looking.",
    "**Plugins and the build script have their own repositories** and need the same rules.",
    "**Exact versions and lockfiles help,** but a lockfile written from a compromised build locks the attacker in.",
]
too_much = """
A build that uses a single repository, which you control, with exact versions, has nothing to confuse. Add filters and verification when more than one repository is involved or when versions are ranges.
"""
met_before = [
    "`mavenCentral()` and a company repository in the same `repositories` block.",
    "`content { includeGroup ... }` or `exclusiveContent` in a build file.",
    "A `verification-metadata.xml` in the `gradle` folder.",
    "A version such as `1.+` or `[1.4,)` in a dependency.",
]
where = """
This is the tools version of [dependency-confusion](../dependency-confusion), in the [secrets-and-supply-chain](..) module. What the shipped image contains, and what is known broken in it, is in [sbom-and-provenance-with-syft-and-grype](../sbom-and-provenance-with-syft-and-grype).
"""
twin = """
The repositories are small HTTP servers started by the demo on loopback ports, with jars that carry a file saying who published them. Gradle is the real Gradle; ports and temporary folders are never printed. The demo takes about a minute.
"""
test_note = "The tests start their own repositories and run real Gradle builds (./gradlew integrationTest); they need no Docker and no network."

[[act]]
title = "A build that works"
summary = "The internal libraries come from the private repository and the public library from the public one."
detail = """
The consumer build declares the private repository first and the public one second. pricing (range [1.4,)), audit 3.1.0 and json-lib 2.0.1 are resolved: the two internal libraries from the private repository, json-lib from the public one.
"""
speech = """
First demo: a build that works. [[slnc 400]] Two repositories, private first and public second. [[slnc 600]]
The internal libraries come from the private one. [[slnc 300]] The json library comes from the public one.
"""
rows = { build = "active ok" }
console = [
    ["pricing 1.4.2 and audit 3.1.0 from the private repository", "ok"],
    ["json-lib 2.0.1 from the public repository", "ok"],
]

[[act]]
title = "Somebody registers the company's name in the public repository"
summary = "A version range takes the highest version of any repository, and an exact version comes from the first repository that has it."
detail = """
The attacker publishes pricing 99.0.0 in the public repository. The range [1.4,) takes the highest version it can find in any repository: the attacker's. An exact version is safer, but with the public repository declared first, the attacker's copy of audit 3.1.0 is the first one found, and it is used.
"""
speech = """
Second demo: somebody registers the company's name in the public repository. [[slnc 400]] A version range takes the highest version anywhere. [[slnc 600]]
An exact version comes from the first repository that has it.
"""
rows = { range = "active wrong" }
console = [
    ["pricing 99.0.0 from the public repository (the attacker's)", "bad"],
    ["audit 3.1.0 from the public repository, when it is declared first", "bad"],
]

[[act]]
title = "The repository says which names it may answer for"
summary = "Content filters keep the internal group out of the public repository, and the public repository receives no request for it."
detail = """
The private repository includes the group com.shop and its subgroups, and the public repository excludes them. The same build resolves pricing 1.4.2 and audit 3.1.0 from the private repository, and the public repository received zero requests for com.shop. A library that is not published yet is refused, and still the public repository was not asked. Without the filter, the build asks the public repository for the internal name: the name leaks, and so does the chance to answer it.
"""
speech = """
Third demo: the repository says which names it may answer for. [[slnc 400]] The private repository includes the company's group. The public one excludes it. [[slnc 600]]
The public repository receives no request for the company's names at all.
"""
rows = { filter = "active ok" }
console = [
    ["pricing 1.4.2 from private; requests to the public repository for com.shop: 0", "ok"],
    ["an unpublished internal library: could not find, and nobody was asked", "ok"],
    ["without the filter the name is asked for in the public repository", "bad"],
]

[[act]]
title = "Checksums that the build checks"
summary = "Dependency verification records the sha256 of what was resolved and refuses an unlisted version and the same version with other bytes."
detail = """
gradle --write-verification-metadata sha256 records the checksums in gradle/verification-metadata.xml. The same build with the metadata passes. When the attacker's 99.0.0 starts to win the range, the build is refused: it is not listed. When the private repository serves the same version number with other bytes, the build is refused: the checksum differs.
"""
speech = """
Fourth demo: checksums that the build checks. [[slnc 400]] Gradle records the checksum of everything it resolved. [[slnc 600]]
A version that is not listed is refused. [[slnc 300]] The same version with other bytes is refused too.
"""
rows = { verify = "active ok" }
console = [
    ["gradle/verification-metadata.xml written once", "ok"],
    ["the attacker's 99.0.0 -> refused: not listed", "ok"],
    ["same version, other bytes -> refused: checksum differs", "ok"],
]

[[act]]
title = "The bill"
summary = "A filter is only as good as its list, checksums can be written from a compromised build, and plugins have their own repositories."
detail = """
A filter for the exact group com.shop does not cover com.shop.tools: the attacker's signer 9.0 is taken from the public repository. With the group and its subgroups, the private signer 1.0 is used. Checksums written while the attacker's package was already being resolved are the attacker's checksums, and the build then accepts it. The repositories for plugins and the build script are a separate list. The repositories here are plain http on loopback; a real repository is https.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] A filter for one group does not cover its subgroups. [[slnc 600]]
Checksums written from a compromised build record the attacker's package. [[slnc 600]]
Plugins have a repository list of their own.
"""
rows = { bill = "active ok" }
console = [
    ["a filter for com.shop does not cover com.shop.tools", "bad"],
    ["checksums written from a compromised build trust the attacker", "bad"],
    ["plugin repositories are a separate list", "ok"],
]

