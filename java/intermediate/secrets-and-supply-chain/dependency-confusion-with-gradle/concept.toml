[[act]]
title = "The bill"
summary = "includeGroup 'com.shop' does not cover com.shop.tools, so the attacker's com.shop.tools:signer:9.0 comes from public; includeGroupAndSubgroups does, and signer 1.0 comes from private. Checksums written after the attacker published trust pricing 99.0.0. Plugin repositories need the same filters, and real repositories use https."
detail = """
The input: the attacker publishes com.shop.tools:signer:9.0, and the store asks for com.shop.tools:signer:[1.0,).
How a filter matches: includeGroup 'com.shop' covers com.shop only, so it does not cover com.shop.tools; includeGroupAndSubgroups 'com.shop' does. The result with includeGroup and excludeGroup: signer 9.0 from public (the attacker's). With the group and its subgroups: signer 1.0 from private.
Checksums written with --write-verification-metadata sha256 after the attacker published, and without filters, record the attacker's pricing 99.0.0: the metadata trusts whatever was resolved. Still to do: the plugin repositories (pluginManagement) need the same filters, and a real repository uses https, not http on loopback.
"""
figure = "filter_subgroups"
figure_title = "What a filter covers, and checksums written too late"
figure_speech = """
Fifth demo: the bill. [[slnc 400]] The attacker publishes a package in a subgroup, com dot shop dot tools. [[slnc 600]]
The first filter is include group com dot shop. [[slnc 300]] It covers exactly that group, and not its subgroups. [[slnc 300]] So the signer comes from the attacker. [[slnc 500]] The second filter includes the group and its subgroups. [[slnc 300]] It covers com dot shop dot tools, and the signer comes from private. [[slnc 700]]
At the bottom, checksums written too late. [[slnc 300]] If the metadata is written after the attacker published, it records the attacker's jar. [[slnc 300]] Write it only from a build you trust, and review every change.
"""
speech = """
The input: a package in a subgroup. [[slnc 300]] How a filter matches: include group says no, include group and subgroups says yes. [[slnc 400]] The results follow: the attacker's signer, then the store's own.
[[page]]
Checksums written after the attacker published: the metadata trusts the attacker's pricing. [[slnc 400]] And two things still to do: the same filters for plugin repositories, and H T T P S for a real repository.
"""
