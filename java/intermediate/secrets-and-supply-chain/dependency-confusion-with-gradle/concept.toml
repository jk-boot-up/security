[docs.problem]
scenario = """
An online store builds with Gradle from a private repository and a public one, and an attacker can publish anything under any name in the public one.
"""
naive = """
List both repositories and trust that the right one answers.
"""
deliver = [
    "Real Gradle builds against two real repositories.",
    "The attacker's package winning by range and by order.",
    "Content filters and the request count that proves them.",
    "Dependency verification and where it stops.",
]

[docs.prerequisites]
required = [
    "Java basics",
    "The plain dependency-confusion project, for the ideas",
    "Gradle, through this project's wrapper",
]
not_required = [
    "Docker or a network connection",
]
install = ["gradle"]

[docs.session]
objectives = [
    "explain why a version range lets a public package win",
    "write a repository content filter",
    "write and read verification metadata",
    "name what a filter and a checksum file do not cover",
]
walkthrough = """
Run act two and find the version that won. In act three look at the count of requests to the public repository. In act five ask which subgroup you forgot in your own build.
"""
exercises = [
    "Use exclusiveContent for one group and compare it with includeGroup.",
    "Add a dependency lock and see what it changes.",
    "Add the same filters to pluginManagement.",
    "Turn a version range into an exact version and rerun act two.",
]

[docs.explained]
sentence = """
A build should ask only the repository that owns a name, and should check the bytes it gets against a list it reviewed.
"""
verdict = """
Declare which repository may answer for each group, use exact versions or locks, keep verification metadata under review, give plugins the same rules, and publish your internal groups in the public registry too, as placeholders, where that is possible.
"""
recognise = [
    "`content { includeGroup ... }` or `exclusiveContent`.",
    "`gradle/verification-metadata.xml`.",
    "`repositoriesMode = FAIL_ON_PROJECT_REPOS`.",
    "A version such as `1.+` or `[1.4,)`.",
]

[spec]
purpose = """
Teach how Gradle resolves a name across repositories and how to restrict it with content filters and dependency verification.
"""
nongoals = [
    "Signing artifacts.",
    "Running a repository manager.",
    "Other build tools.",
]
problem = """
Builds that list a public and a private repository can take an internal name from a public one.
"""
roles = [["Repository", "`Repo`"], ["The two repositories", "`Lab`"], ["One Gradle build", "`Build`"], ["Entry point", "`DependencyConfusionDemo`"]]
requirements = [
    "A Gradle build resolves from two repositories that remember every request.",
    "A version range and declaration order can pick the attacker's package.",
    "Content filters keep internal groups out of the public repository, which then receives no request for them.",
    "Verification metadata refuses an unlisted version and different bytes.",
    "The demo prints the same output on every run.",
]

