[[act]]
title = "The bill"
summary = "The gate refuses an unsigned image, but a direct pull still gets it; the signing key is the crown jewel, and a wrong passphrase cannot sign; rotation is a project with no date on old signatures; keyless signing needs the public Fulcio and Rekor services; cosign 3 is moving offline signing behind a signing config."
detail = """
The gate refuses the unsigned image, digest F, with no signature for this digest, but a direct pull from the registry gets it anyway: the gate protects only the paths that pass through it.
The signing key is the crown jewel: with a wrong passphrase it cannot sign. Rotation is a project: every gate must trust the new key before the old one goes, and nothing marks the day an old signature was made.
Keyless signing replaces long-lived keys with short-lived certificates tied to an identity and logged in public; it needs the Fulcio and Rekor services, which a local lab does not have. cosign 3 is moving offline signing behind a signing config, so the flags used here may change.
"""
figure = "gate_paths"
figure_title = "What the gate guards, and what it costs"
figure_speech = """
Fifth demo: the bill. [[slnc 400]] At the top, the path an image takes. [[slnc 300]] It is built, signed with a key that needs a passphrase, pushed to the registry, checked by the gate, and only then run. [[slnc 700]]
The red dashed line is the problem. [[slnc 300]] A direct pull from the registry never meets the gate, and gets the unsigned image. [[slnc 300]] So every other path must be locked. [[slnc 700]]
And the keys. [[slnc 300]] A wrong passphrase cannot sign, so protect the key and its passphrase. [[slnc 300]] Rotation needs every gate to learn the new key first. [[slnc 300]] And keyless signing needs public services that a local lab does not have.
"""
speech = """
The gate refuses the unsigned image. [[slnc 300]] But a direct pull gets it anyway. [[slnc 400]] With a wrong passphrase, the key cannot sign.
[[page]]
Rotation is a project, and nothing marks the day an old signature was made. [[slnc 400]] Keyless signing uses short lived certificates, logged in public, through the Fulcio and Rekor services. [[slnc 400]] And cosign three is moving offline signing behind a signing config, so these flags may change.
"""
