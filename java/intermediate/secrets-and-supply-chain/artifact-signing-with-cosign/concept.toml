[readme]
intro = """
The plain [artifact-signing](../artifact-signing) project signs a jar with Ed25519 and builds a transparency log from scratch, and ends with "keyless signing ... the -with-cosign version". This one uses the real tool, **cosign 3**, to sign and verify real container images in a real registry (**registry:3** in Docker, on a free low loopback port). It needs Docker and the `cosign` command (`brew install cosign`); its tests are tagged `integration`: `./gradlew integrationTest`.

What it shows:
- **A tag is a name, not a checksum.** The release is pushed as `shop/app:2.4.0` (nginx 1.31.7). A different image (nginx 1.31.6) is pushed under the same tag and the deployment, pulling by tag, gets it.
- **A signed release, checked before it runs.** The release key signs the **digest**; the signature is stored in the same registry as one more tag. The gate resolves the tag to a digest and verifies with the pinned public key. A moved tag has no signature (refused); an image signed by the attacker's key is refused (the key is not trusted); the tag put back is accepted.
- **Signed claims and rotating keys.** `-a channel=stable` is signed with the image and checked by the gate; a beta build signed by the same key is refused by the stable gate. A gate trusts `[release, next]` while a build moves over. A thief with a retired key signs a new image today and a gate that still trusts it accepts it: **a signature carries no time**, and without a log there is no revocation day.
- **Attestations.** The CI system signs a SLSA provenance statement; the gate verifies it and applies a rule of its own (the builder must be the CI system). An image built on a laptop and attested by the same key **verifies, and fails the rule**. A statement signed only by the attacker's key, or offered for another digest, is refused.
- **The bill.** The gate refuses an unsigned image, but a pull straight from the registry never meets the gate. The key is protected by a passphrase. Keyless signing needs the public Fulcio and Rekor services, which a local lab does not have, so the transparency log is left out here.

**Maps to:** OWASP Top 10 (2025) A08 Software or Data Integrity Failures · SLSA · CWE-494 (download of code without integrity check), CWE-345 · Sigstore.
"""
analogy = """
A shipment with a wax seal. The tag on the crate is a label anyone can reprint; the seal is a stamp that only the shipper holds, pressed over the exact contents. The customs gate checks the seal against the shipper's known stamp, and ignores the label.
"""
scenario = """
An online store ships its application as a container image. The demo starts a real registry, pushes real images, signs and attests them with cosign, and tries every move an attacker or an accident could make before a deployment gate.
"""
costs = [
    "**The key is the crown jewel:** here a passphrase-protected file; in practice a hardware module, with each use approved and logged.",
    "**A signature carries no time,** so without a transparency log nothing says when a retired key was last honest.",
    "**Every gate must be told the new key before the old one goes,** which is a project in itself.",
    "**The gate protects only paths that pass through it,** and every other way to start an image is a gap.",
    "**Keyless signing needs public services** (Fulcio, Rekor) or your own deployments of them, and cosign 3 is still moving its offline flags.",
]
too_much = """
A team that builds and runs its images in one trusted place and pulls only by digest from its own registry gets much of the benefit from the digest alone. Add signatures when images cross a boundary, to another team, another environment or a customer.
"""
met_before = [
    "`image: shop/app:latest` in a deployment file.",
    "`cosign verify` in a pipeline or an admission policy.",
    "A `.sig` tag next to an image in a registry.",
    "A provenance file named `provenance.intoto.jsonl`.",
]
where = """
This is the tools version of [artifact-signing](../artifact-signing), in the [secrets-and-supply-chain](..) module. It follows the same questions, which key, which artifact and which claims, with a real tool and a real registry.
"""
twin = """
The registry is a real container on a free loopback port. The images are real images that are already on this machine. cosign is run as a program, with key pairs generated in a temporary folder that is removed at the end. Digests, keys and ports are never printed; the demo takes about twenty seconds.
"""
test_note = "The tests start one registry for the whole class and remove it (./gradlew integrationTest). They need Docker and the cosign command."

[[act]]
title = "A deployment that runs whatever a tag points at"
summary = "A different image is pushed under the same tag, and a deployment that pulls by tag gets it."
detail = """
The release team pushes the image as shop/app:2.4.0 and the tag points at one digest. The deployment pulls by tag and gets exactly that image. Someone with push rights, or a registry that is not what it was, pushes a different image under the same tag: the digests differ. The deployment pulls by tag again and gets the other image: a tag is a name, not a checksum. Pulling by the digest it was given gets the release, but only if the digest itself came from somewhere that cannot be changed.
"""
speech = """
First demo: a deployment that runs whatever a tag points at. [[slnc 400]] The release is pushed with a tag. [[slnc 600]]
Someone pushes a different image under the same tag. [[slnc 300]] The deployment pulls by tag, and gets the other image. [[slnc 600]]
A tag is a name, not a checksum.
"""
rows = { tags = "active wrong" }
console = [
    ["the release is pushed as shop/app:2.4.0", "ok"],
    ["another image is pushed under the same tag: the digests differ", "bad"],
    ["the deployment pulls by tag and gets the other image", "bad"],
]

[[act]]
title = "A signed release, checked before it runs"
summary = "The release key signs the digest, the gate verifies it with the pinned public key, and a moved tag or an unknown key is refused."
detail = """
The release pipeline signs the image digest with the release key. The signature is stored in the same registry, next to the image, as one more tag. The deployment pins the public key and checks before it deploys: accepted. The tag is moved to the attacker's image and the same gate refuses it: no signature for this digest. The attacker signs their own image with a key of their own and the gate refuses that too: not a key it trusts. The tag is put back and the gate accepts.
"""
speech = """
Second demo: a signed release, checked before it runs. [[slnc 400]] The release key signs the digest. [[slnc 600]]
The gate pins the public key and checks before it deploys. [[slnc 600]]
When the tag is moved to the attacker's image, it has no signature. [[slnc 300]] When the attacker signs it with their own key, that key is not trusted.
"""
rows = { gate = "active ok" }
console = [
    ["the release signed; the gate -> accepted", "ok"],
    ["the tag moved to the attacker's image -> refused (no signature)", "ok"],
    ["signed by the attacker's own key -> refused", "ok"],
]

[[act]]
title = "Signed claims, and keys that rotate"
summary = "Claims such as channel=stable are signed with the image; a beta build is refused by the stable gate; a retired key still signs for any gate that trusts it."
detail = """
The release signs the digest again with the claims channel=stable and version=2.4.0. A gate that requires channel=stable accepts; one that requires channel=beta refuses. A beta build signed by the same key with channel=beta, offered to the stable gate, is refused. The next key is added while the build moves over, so the gate trusts the release and next keys, and both signatures are accepted. When the old key is retired, a gate that trusts only the next key refuses a digest signed only by the old one. A thief with the retired old key signs a new image today and a gate that still trusts the old key accepts it: a signature carries no time, and without a log there is no revocation day. A gate that dropped the old key refuses.
"""
speech = """
Third demo: signed claims, and keys that rotate. [[slnc 400]] A claim such as channel equals stable is signed with the image. [[slnc 600]]
A beta build, signed by the same key, is refused by the stable gate. [[slnc 600]]
A retired key can still sign today, for any gate that still trusts it. [[slnc 300]] A signature carries no time.
"""
rows = { claims = "active ok" }
console = [
    ["channel=stable required: accepted; channel=beta required: refused", "ok"],
    ["a beta build offered to the stable gate -> refused", "ok"],
    ["the retired key signs a new image today: accepted by a gate that still trusts it", "bad"],
]

[[act]]
title = "Signed statements about how the image was built"
summary = "A provenance attestation names the builder; the gate verifies it and applies its own rule, so a laptop build signed by the same key verifies and still fails."
detail = """
The CI system signs a provenance statement for the digest: the builder is the CI system and the source is a commit. The gate verifies the attestation with the release key and reads the builder; its own rule, that the builder must be the CI system, is satisfied. An image built on a laptop and attested by the same key verifies, the builder is the laptop, and the gate's own rule refuses it: a signature says who signed, the rule says what was signed. An image whose provenance only the attacker's key signed, naming the CI system as builder, is refused by a gate that trusts the release key. The release key's attestation offered for another digest is refused. The public transparency log is left out because this lab is local.
"""
speech = """
Fourth demo: signed statements about how the image was built. [[slnc 400]] The C I system signs a provenance statement, naming the builder. [[slnc 600]]
The gate verifies it and applies its own rule. [[slnc 600]]
An image built on a laptop and attested by the same key verifies, and fails the rule. [[slnc 300]] A signature says who signed. The rule says what was signed.
"""
rows = { attest = "active ok" }
console = [
    ["the CI provenance: verified, builder is the CI system -> accepted", "ok"],
    ["a laptop build, same key: verifies, builder is the laptop -> refused by the rule", "ok"],
    ["provenance signed only by the attacker's key -> refused", "ok"],
]

[[act]]
title = "The bill"
summary = "The gate refuses an unsigned image, but a pull straight from the registry never meets it; the key needs a passphrase and a plan, and keyless signing needs public services."
detail = """
The gate refuses an unsigned image. But it protects only the paths that pass through it: a pull straight from the registry gets the unsigned image. The signing key is the crown jewel: with a wrong passphrase it cannot sign. Rotation is a project: every gate must trust the new key before the old one is dropped, and nothing marks the day an old signature was made. Keyless signing replaces long-lived keys with short-lived certificates tied to an identity and recorded in a public log; it needs the public Fulcio and Rekor services, which a local lab does not have. Cosign 3 is moving offline signing behind a signing config, so the flags used here may change.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] The gate refuses an unsigned image. [[slnc 600]]
But a pull straight from the registry never meets the gate. [[slnc 600]]
The signing key is the crown jewel. [[slnc 300]] Keyless signing replaces it with short lived certificates, and needs public services.
"""
rows = { bill = "active ok" }
console = [
    ["an unsigned image -> refused at the gate", "ok"],
    ["a pull straight from the registry -> gets it anyway", "bad"],
    ["a wrong passphrase -> cannot sign", "ok"],
]

