slug = "artifact-signing-with-cosign"
level = "intermediate"
module = "secrets-and-supply-chain"
title = "Artifact Signing with cosign"
short_title = "Signing with cosign"
package = "cosignsigning"
main_class = "CosignSigningDemo"
tagline = "A tag is a name, a digest is a checksum, and a signature on the digest is the only thing a deployment gate can rely on"
bold = "A container image tag can be moved to a different image, so a gate must resolve the tag to a digest and verify a signature that a pinned key made over exactly that digest, with the signed claims it requires and, where it matters, a signed statement of how the image was built; a signature carries no time and no revocation without a log, the gate protects only the paths that pass through it, and the key is the crown jewel."
domain = "an online store"
domain_note = ""
youtube_description = "Signing container images with cosign 3 against a real registry in Docker: a tag moved to another image, a gate that resolves the tag to a digest and verifies a signature made by a pinned key, the signature stored next to the image, signed claims such as channel=stable, a beta build refused by the stable gate, key rotation with an overlap, a thief with a retired key, signed provenance statements with a rule of the gate's own, an attestation from the wrong key or for another digest, a pull that never meets the gate, and why keyless signing needs services a local lab does not have."
thumb_lines = ["SIGNING WITH", "COSIGN"]
thumb_code = "cosign verify --key cosign.pub"
youtube_title = "Signing Container Images with cosign: Digests, Claims, Attestations and Rotation (OWASP A08)"
