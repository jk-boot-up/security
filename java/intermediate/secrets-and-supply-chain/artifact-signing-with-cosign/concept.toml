[[act]]
title = "A signed release, checked before it runs"
summary = "cosign signs a payload that names digest A, not the tag; the signature is stored as one more tag in the same registry; a gate that pins the release key accepts digest A, refuses the moved tag (digest B, no signature), refuses digest B signed by the attacker's own key, and accepts again when the tag is put back."
