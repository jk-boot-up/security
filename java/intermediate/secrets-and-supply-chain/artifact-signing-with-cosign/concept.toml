body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Try the first exercise", "in docs/session.md."]
narration = "That's signing with cosign. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] A deployment should run an image only if a key it trusts signed exactly that digest, with the claims it requires, and everything else is a name that anyone could have moved. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a rule that refuses provenance with reproducible set to false. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"
