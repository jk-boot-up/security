[[act]]
title = "Signed claims, and keys that rotate"
summary = "Digest A is signed again with channel=stable and version=2.4.0; a stable gate accepts it, a beta gate refuses it, and a beta build (digest C) is refused by the stable gate; a gate that trusts both keys accepts during rotation, the next key takes over, but a thief who signs digest D with the retired old key is accepted by a gate that still trusts old: a signature carries no date."
detail = """
The input: digest A is signed again with the claims channel=stable and version=2.4.0, inside the payload, so they cannot be edited. A beta build, digest C, is signed with channel=beta.
The result: a gate that requires channel=stable accepts digest A; a gate that requires channel=beta refuses it (claims do not match the gate); the stable gate refuses digest C.
The rotation from the release key to next: a gate that trusts both accepts digest A; after digest A is also signed with next, a gate that trusts only next accepts it; digest C, signed only by the release key, is refused by that gate.
Before: a thief with the retired old key signs digest D today, and the signature carries no date. After: a gate that still trusts old accepts it; only a gate that dropped old refuses it. Without a log there is no day to revoke from.
"""
figure = "claims_keys"
figure_title = "Claims the gate requires, and keys it trusts"
figure_speech = """
Third demo: signed claims, and keys that rotate. [[slnc 400]] On the left, claims. [[slnc 300]] Digest A is signed again, with channel equals stable and version two point four point zero, inside the payload. [[slnc 300]] A stable gate accepts it, and a beta gate refuses it. [[slnc 300]] The beta build, digest C, is refused by the stable gate. [[slnc 700]]
On the right, the keys each gate trusts. [[slnc 300]] During rotation a gate trusts both the release key and next. [[slnc 300]] When it trusts only next, a release signed only by the old key is refused. [[slnc 700]]
At the bottom, the problem. [[slnc 300]] A thief with the retired old key signs digest D, today. [[slnc 300]] A signature carries no date, so any gate that still trusts old accepts it.
"""
speech = """
Before: digest A signed again, with two claims, channel stable and version two point four point zero. [[slnc 300]] And a beta build, digest C, with channel beta. [[slnc 400]] After: the stable gate accepts digest A. [[slnc 300]] The beta gate refuses it. [[slnc 300]] And the stable gate refuses the beta build.
[[page]]
The rotation. [[slnc 300]] Trusting both keys, digest A is accepted. [[slnc 300]] Trusting only next, it is accepted once next has signed it, and the beta build is refused. [[slnc 400]] Then a thief signs digest D with the retired old key. [[slnc 300]] A gate that still trusts old accepts it. [[slnc 300]] There is no log, so there is no day to revoke from.
