[threatmodel]
scope = """
Container images pushed to a registry and deployed through a gate that verifies cosign signatures and attestations. It covers moved tags, untrusted and retired keys, claims and provenance. It does not cover the registry's own storage or the images' contents.
"""
assets = [
    "The images the store runs.",
    "The release signing key.",
]
actors = [
    "The release pipeline.",
    "An attacker with push rights.",
    "A thief with an old signing key.",
]
boundaries = [
    "The registry: anyone with push rights can change a tag.",
    "The gate: the only place that decides what may run.",
]
assumptions = [
    "The gate's public keys come from a place that attackers cannot change.",
    "Every deployment passes through the gate.",
]
out_of_scope = [
    "Vulnerabilities inside the images.",
    "Compromise of the build itself.",
]
tests = [
    "`CosignSigningTest` starts a real registry and runs cosign for a moved tag, a pinned key, an unsigned digest, signed claims, the stored signature, an attestation and a wrong passphrase.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next project in this module, sbom-and-provenance-with-syft-and-grype, adds what the image contains to what is known about who built it.
"""

[[threat]]
id = "T1"
stride = "T"
threat = "A tag is moved to an image the pipeline did not build"
where = "the registry, the gate"
control = "Resolve to a digest and verify a signature over it with a pinned key"
residual = "A gate that is skipped"

[[threat]]
id = "T2"
stride = "S"
threat = "An image signed by an untrusted or retired key is accepted"
where = "the gate's list of keys"
control = "Pin keys, rotate with an overlap and drop old keys"
residual = "No revocation time without a transparency log"

[[threat]]
id = "T3"
stride = "E"
threat = "The signing key is stolen"
where = "the release pipeline"
control = "A passphrase now, a hardware module and approvals in practice"
residual = "Anything signed before the theft is noticed"

[[threat]]
id = "T4"
stride = "R"
threat = "A verified signature is mistaken for a verified build"
where = "attestations"
control = "Rules of the gate's own over the signed claims"
residual = "Rules that nobody reviews"

[poster]
headline = [["SIGNING WITH", "text"], ["COSIGN", "accent"]]
taglines = [["A tag is a name, a digest is a checksum, and a signature on the digest is the only thing a", "gold"]]
before = { code = "the release is pushed as shop/app:2.4.0", note = "A deployment that runs whatever a tag po", tag = "BEFORE" }
after = { code = "cosign verify --key cosign.pub", note = "The bill", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "Artifact Signing with cosign"
narration = "Hello, and welcome. [[slnc 400]] This video explains signing container images with cosign. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A container image has a tag, which is a name anyone can move, and a digest, which is a checksum of its contents. [[slnc 300]] cosign signs the digest with a key. [[slnc 300]] A deployment gate then runs an image only if a key it trusts signed exactly that digest, with the claims it requires. [[slnc 600]] Think of a tamper seal on a parcel. [[slnc 300]] The label can be swapped, but the seal belongs to one box, and one sender. [[slnc 600]] Our example is an online store."

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online store ships its application", "as a container image.", "", "The demo starts a real registry in Docker,", "pushes real images,", "signs and attests them with cosign,", "and tries every move an attacker", "could make before the deployment gate."]
narration = "Here is the scenario. [[slnc 400]] An online store ships its application as a container image. [[slnc 500]] The demo starts a real registry in Docker, and pushes real images to it. [[slnc 300]] It signs them with cosign, and adds signed statements about how they were built. [[slnc 500]] Then it tries every move an attacker, or an accident, could make, and asks a deployment gate what it would run."

[[scene]]
key = "02-words"
kind = "bullets"
title = "The Words"
body = ["Tag: a name for an image, which can move", "Digest: the SHA-256 checksum of an image", "Signature: a key holder vouched for a digest", "Claim: a key=value signed with it", "Attestation: a signed statement, such as provenance", "Pinned key: the key a gate trusts"]
narration = """Before the demos, the words. [[slnc 500]] A tag is a name for an image, such as two point four point zero, and it can be moved. [[slnc 500]] A digest is the S H A two fifty six checksum of an image's manifest. [[slnc 500]] A signature proves that the holder of a key vouched for one digest. [[slnc 500]] A claim is a key and a value, signed together with it. [[slnc 500]] An attestation is a signed statement about an image, such as how it was built: its provenance. [[slnc 500]] And a pinned key is the one key a gate has decided to trust."""

[[scene]]
key = "02-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "02-seal"
kind = "figure"
title = "One release, signed by its digest"
body = "seal"
narration = """Let's see the core idea on one release. [[slnc 400]] At the top, the release pipeline. [[slnc 300]] The tag two point four point zero points at digest A. [[slnc 300]] Cosign signs a payload that names digest A, not the tag, with the release key. [[slnc 300]] The signature is stored in the registry next to the image, as one more tag named after the digest. [[slnc 700]]
At the bottom, the gate. [[slnc 300]] It holds the release key's public key, and resolves the tag to a digest before it verifies. [[slnc 300]] Digest A is accepted. [[slnc 300]] When the tag is moved to digest B, there is no signature for that digest. [[slnc 300]] And when the attacker signs digest B with a key of their own, the gate does not trust that key. [[slnc 600]] Only the digest that the release key signed is run."""

[[scene]]
key = "03-acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "04-costs"
kind = "bullets"
title = "What It Costs"
body = ["The signing key is the crown jewel", "A signature carries no time", "Gates must learn a new key before the old one goes", "The gate protects only paths through it", "Keyless signing needs public services"]
narration = "Nothing is free. [[slnc 400]] Here is what it costs. [[slnc 500]] The signing key is the crown jewel: whoever has it can sign anything. [[slnc 500]] A signature carries no time, so a retired key can still sign today, without a log to say when. [[slnc 500]] Every gate must be told the new key before the old one goes. [[slnc 500]] The gate protects only the paths that pass through it. [[slnc 300]] And keyless signing removes the key, but needs public services."

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["cosign sign or cosign verify in a pipeline", "image: name@sha256:... in a deployment", "An admission policy that checks signatures", "An in-toto statement with a predicateType"]
narration = "You have probably met this already. [[slnc 400]] Cosign sign, or cosign verify, in a build pipeline, is this tool at work. [[slnc 500]] An image named with an at sign and a sha two five six digest, in a deployment, is pulling by digest, not by tag. [[slnc 500]] An admission policy that checks signatures, in a cluster, is the deployment gate. [[slnc 500]] And an in toto statement, with a predicate type, is a signed statement of how the image was built."

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Deploy by digest", "Verify a pinned key's signature on that digest", "Require signed claims and provenance", "Check them with your own rules", "Plan key rotation; keep keys in hardware", "Make the gate the only way an image starts"]
narration = "So, how do you use it? [[slnc 400]] Deploy by digest, never by tag alone. [[slnc 300]] Verify a signature from a pinned key, on that digest. [[slnc 500]] Require signed claims and a signed build statement, and check them with your own rules. [[slnc 500]] Plan key rotation, keep keys in hardware, and log every signature. [[slnc 300]] And make the gate the only way an image can start."

[[scene]]
key = "07-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a rule that refuses", "provenance that is not reproducible."]
narration = "That's signing container images with cosign. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] A deployment should run an image only if a key it trusts signed exactly that digest, with the claims it requires, and everything else is a name that anyone could have moved. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a rule that refuses a build statement which says it is not reproducible. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] The Java side starts a registry, runs the real cosign command, and reads what it says. [[slnc 300]] Here are the lines that matter."""

[[class]]
name = "Lab"
what = "a real registry in Docker, and the digest a tag points at"
[[class.part]]
title = "ask the registry what a tag means now"
code = """
URI manifest = URI.create("http://127.0.0.1:" + port + "/v2/" + name + "/manifests/" + tag);
...
HttpResponse<Void> r = http.send(head, HttpResponse.BodyHandlers.discarding());
String digest = r.headers().firstValue("Docker-Content-Digest").orElseThrow();
return registry() + "/" + name + "@" + digest;
"""
speech = """The lab asks the registry for the manifest behind a tag. [[slnc 300]] The answer carries the digest in a header. [[slnc 300]] The gate always works on that digest, never on the tag."""

[[class]]
name = "Cosign"
what = "runs the cosign command with a pinned public key"
[[class.part]]
title = "verify a digest with one key"
code = """
List<String> command = new ArrayList<>(List.of("cosign", "verify",
        "--key", publicKey(keyName).toString(),
        "--insecure-ignore-tlog=true"));
required.forEach((k, v) -> command.addAll(List.of("-a", k + "=" + v)));
command.add(digestRef);
"""
speech = """Verify passes the public key, any claims the gate requires, and the digest. [[slnc 300]] The transparency log is switched off only because this lab is local."""
[[class.part]]
title = "cosign's errors, in the lesson's words"
code = """
if (output.contains("missing or incorrect annotation")) {
    return "claims do not match the gate";
...
if (output.contains("do not match threshold")) {
    return "not signed by this key";
"""
speech = """When cosign refuses, its message is turned into a short reason. [[slnc 300]] A claim that does not match, a signature by another key, or no signature at all."""

[[class]]
name = "SignedPayload"
what = "a teaching class: what cosign really signed"
[[class.part]]
title = "the digest and the claims, inside the payload"
code = """
Map<String, Object> critical = (Map<String, Object>) json.get("critical");
...
Map<String, Object> image = (Map<String, Object>) critical.get("image");
...
Object optional = json.get("optional");
"""
speech = """The payload has a critical part, with the image's digest, and an optional part, with the claims. [[slnc 300]] The signature covers both, and neither one names the tag."""

[[class]]
name = "CosignSigningDemo"
what = "the deployment gate and the five demos"
[[class.part]]
title = "resolve the tag, then try each trusted key"
code = """
String digest = lab.resolve(repository, tag);
...
for (String key : trustedKeys) {
    Cosign.Result r = cosign.verify(key, digest, required);
    if (r.ok()) {
        return new Verdict(true, "signed by the " + key + " key");
"""
speech = """The gate resolves the tag to a digest, then tries each key it trusts. [[slnc 300]] During a rotation that list has two keys. [[slnc 300]] Removing a key from it is the only way to retire one."""

