[[act]]
title = "The cookie decides what the server builds"
summary = "A forged price of 1 cent is believed (2 cents in total), and a cookie holding a TempCleaner deletes the marker file while it is read, before the server sees it is not a cart."
detail = """
The customer writes a cart of their own: KTL-001 twice at 1 cent. The server reads it and believes it: 1 line, 2 x 1 = 2 cents.
Then a cookie that is not a cart at all: a TempCleaner, pointing at a marker file on the server. The stream names one class, TempCleaner, and the server builds it. Its readObject runs inside the call that reads the cookie and deletes the file.
Only then does the server see that the object is not a cart, and refuse it: "the cookie is not a cart", and "marker file exists afterwards: false". Checking the type after readObject is too late.
"""
figure = "gadget_runs"
figure_title = "A lie, and a class that runs code while it is read"
figure_speech = """
Second demo: the cookie decides what the server builds. [[slnc 400]] On the left, a lie. [[slnc 300]] The customer writes their own cart: two kettles, at one cent each. [[slnc 300]] The server reads it, and believes it. [[slnc 300]] The total is two cents. [[slnc 700]]
On the right, something worse. [[slnc 300]] The cookie holds a TempCleaner. [[slnc 300]] It stands for a class from a library that is already on the server. [[slnc 600]]
Follow the steps from the top. [[slnc 300]] Before reading, the marker file exists. [[slnc 300]] Step one: read object builds the TempCleaner, because the bytes name it. [[slnc 300]] Step two: while it is being built, its own read object method runs, and deletes the file. [[slnc 300]] Step three: only now does the server check the type, and refuse the cookie. [[slnc 600]]
But the file is already gone. [[slnc 300]] Checking after the read is too late.
"""
speech = """
Here is the output, one attack per page. [[slnc 400]] The input: the customer's own cart, at one cent. [[slnc 400]] The result: one line, two times one, two cents. [[slnc 300]] A forged price is believed.
[[page]]
The second attack. [[slnc 300]] The input: a TempCleaner, pointing at a marker file. [[slnc 300]] Before reading, the file exists. [[slnc 400]] The stream names one class, and the server builds it. [[slnc 400]] The result: refused, the cookie is not a cart. [[slnc 300]] But the marker file no longer exists. [[slnc 300]] It already ran.
"""
rows = { naive = "active wrong" }
console = [
    ["THE FORGED CART (written by the customer):", "code"],
    ["  KTL-001  x2  1", "muted"],
    ["THE RESULT:", "code"],
    ["  1 line, total 2 cents  <- A FORGED PRICE", "bad"],
    ["  2 x 1 = 2", "muted"],
    ["---", ""],
    ["THE FORGED COOKIE (not a cart at all):", "code"],
    ["  a TempCleaner, path = <a marker file on the server>", "muted"],
    ["THE MARKER FILE BEFORE READING:", "code"],
    ["  exists: true", "muted"],
    ["THE CLASSES THE COOKIE NAMES (each one is built):", "code"],
    ["  TempCleaner", "muted"],
    ["THE RESULT:", "code"],
    ["  refused: the cookie is not a cart", "ok"],
