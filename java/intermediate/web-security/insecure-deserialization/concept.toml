[[act]]
title = "An allow-list filter names the classes of a cart"
summary = "The filter answers ALLOWED for the cart's four classes and REJECTED for TempCleaner before it is built, so the marker file survives; a forged price uses only allowed classes and is still accepted."
detail = """
An ObjectInputFilter is set on the stream before reading. Its allow-list names the classes a cart is made of (Cart, Cart$Line, ArrayList and a few basic types), limits depth, references, array size and bytes, and ends with !*, which refuses everything else.
The filter is asked about every class before it is built. For the honest cart, Cart, ArrayList, Object[] and Cart$Line are all ALLOWED, and the cart reads as before: 2 lines, 9200 cents.
For the TempCleaner cookie, the answer is REJECTED, so the class is never built: "class refused by the filter", and the marker file still exists. The forged price uses only a cart's classes, so it is all ALLOWED and still accepted at 2 cents: a filter stops unknown classes, not lies.
"""
figure = "filter_checks"
figure_title = "The filter answers before each class is built"
figure_speech = """
Third demo: an allow-list filter. [[slnc 400]] At the top, the list. [[slnc 300]] It names the classes a cart is made of, and a few basic types. [[slnc 300]] It limits the depth, the number of objects, the array size, and the bytes. [[slnc 300]] And the last rule, exclamation mark, star, refuses everything else. [[slnc 700]]
The stream asks the filter about each class, before it builds it. [[slnc 600]] On the left, the honest cart. [[slnc 300]] Four classes, all allowed. [[slnc 300]] The cart reads as before. [[slnc 600]]
In the middle, the TempCleaner. [[slnc 300]] Rejected. [[slnc 300]] It is never built, so its code never runs, and the file still exists. [[slnc 600]]
On the right, the forged price. [[slnc 300]] It is made only of a cart's classes, so all four are allowed. [[slnc 300]] The two cent cart is still accepted. [[slnc 300]] A filter stops unknown classes, not lies.
"""
speech = """
Here is the output. [[slnc 400]] The allow-list, with its limits. [[slnc 400]] Then the honest cart, and the filter's answer for each class: allowed, four times. [[slnc 300]] Two lines, nine thousand two hundred cents.
[[page]]
The TempCleaner cookie. [[slnc 300]] The filter's answer: rejected. [[slnc 300]] The result: refused, and the marker file still exists. [[slnc 500]] The forged price: all its classes are allowed. [[slnc 300]] So it is still accepted. [[slnc 300]] A filter stops unknown classes, not lies.
"""
rows = { filter = "active ok", lies = "active amber" }
console = [
    ["THE ALLOW-LIST (checked before each class is built):", "code"],
    ["  Cart Cart$Line ArrayList Object String", "muted"],
    ["  Record Number Long Integer", "muted"],
    ["  maxdepth=5 maxrefs=100", "muted"],
    ["  maxarray=100 maxbytes=2000 !*  (!* = refuse the rest)", "muted"],
    ["THE HONEST CART -> THE FILTER'S ANSWERS:", "code"],
    ["  Cart       -> ALLOWED", "ok"],
    ["  ArrayList  -> ALLOWED", "ok"],
    ["  Object[]   -> ALLOWED", "ok"],
    ["  Cart$Line  -> ALLOWED", "ok"],
    ["  -> 2 lines, total 9200 cents", "ok"],
    ["---", ""],
    ["THE TEMPCLEANER COOKIE -> THE FILTER'S ANSWER:", "code"],
    ["  TempCleaner -> REJECTED", "ok"],
    ["THE RESULT:", "code"],
    ["  refused: class refused by the filter", "ok"],
    ["  marker file exists afterwards: true", "ok"],
    ["THE FORGED PRICE -> THE FILTER'S ANSWERS:", "code"],
    ["  Cart, ArrayList, Object[], Cart$Line -> all ALLOWED", "ok"],
    ["  -> 1 line, total 2 cents  <- STILL ACCEPTED", "amber"],
    ["a filter stops unknown classes, not lies", "amber"],
]

[[act]]
title = "Data only: product codes and quantities, signed"
summary = "The cookie holds v1;KTL-001x2;PAN-002x1 in Base64 and an HMAC-SHA-256 signature; prices come from the server; a quantity changed to x9 gives a different HMAC and is refused, as are a serialized object and unsigned text."
detail = """
The cookie now holds text only, with no classes and no prices: v1;KTL-001x2;PAN-002x1. The text is encoded in Base64 as the body, and the server signs the body with HMAC-SHA-256 and a key only it holds. The cookie is body.signature.
When it comes back, the server recomputes the HMAC of the body and compares it with the cookie's signature in constant time, before parsing anything. Then it reads each line with a strict pattern and looks the prices up itself: 2 x 2500 = 5000, 1 x 4200 = 4200, 9200 cents.
The customer changes x2 to x9. The server's HMAC of the new body is 21AurWKC..., the cookie still carries XJD4Phz3..., so the cookie is refused: bad signature. A serialized object is not a signed cookie at all, and unsigned text fails the signature too.
"""
figure = "signed_cookie"
figure_title = "Plain text, and a signature only the server can make"
figure_speech = """
Fourth demo: data only, signed. [[slnc 400]] At the top left, the text of the cookie. [[slnc 300]] Version one, then each product code with its quantity. [[slnc 300]] No classes, and no prices. [[slnc 600]] The text is encoded as Base sixty-four. [[slnc 300]] That is the body. [[slnc 600]]
Below, the signature. [[slnc 300]] The server computes an H M A C of the body, with S H A two fifty-six and a key only the server knows. [[slnc 300]] The cookie is the body, a dot, and the signature. [[slnc 700]]
Now the customer changes the quantity from two to nine. [[slnc 300]] The server computes the H M A C of the new body. [[slnc 300]] It starts with two, one, A. [[slnc 300]] The signature in the cookie is the old one, starting with X, J, D. [[slnc 300]] They differ, so the cookie is refused, before a single line is read. [[slnc 600]]
And because the cookie never carries a price, there is no price to forge.
"""
speech = """
Here is the output. [[slnc 400]] The input: the text, then the body in Base sixty-four, then its signature. [[slnc 400]] The result: the signature is checked first, then the server looks up each price. [[slnc 300]] Two times two thousand five hundred, and one times four thousand two hundred. [[slnc 300]] Nine thousand two hundred cents.
[[page]]
The changed quantity. [[slnc 300]] The server's H M A C of the new body, and the signature in the cookie. [[slnc 300]] They differ: refused, bad signature. [[slnc 500]] A serialized object is not a signed cookie. [[slnc 300]] And unsigned text fails the signature too.
"""
rows = { signed = "active ok" }
console = [
    ["THE COOKIE TEXT (no classes, no prices):", "code"],
    ["  v1;KTL-001x2;PAN-002x1", "muted"],
    ["THE BODY (the text in Base64):", "code"],
    ["  djE7S1RMLTAwMXgyO1BBTi0wMDJ4MQ", "muted"],
    ["THE SIGNATURE (HMAC-SHA-256 of the body, server's key):", "code"],
    ["  XJD4Phz3L9opviZkyUfrNcyTrXkZnLzk2OjIBaf-zbE", "muted"],
    ["THE COOKIE IS body.signature", "code"],
    ["THE RESULT (signature checked first, then prices looked up):", "code"],
    ["  KTL-001  x2  x 2500 = 5000", "muted"],
    ["  PAN-002  x1  x 4200 = 4200", "muted"],
    ["  2 lines, total 9200 cents", "ok"],
    ["---", ""],
    ["THE QUANTITY CHANGED BY THE CUSTOMER (x2 -> x9):", "code"],
    ["  v1;KTL-001x9;PAN-002x1  (the new text)", "muted"],
    ["  the server's HMAC of the new body:", "muted"],
    ["    21AurWKCMA7UyV16wZ3AKLUrepHf-llmQ9FornieabU", "muted"],
    ["  the signature in the cookie (unchanged):", "muted"],
    ["    XJD4Phz3L9opviZkyUfrNcyTrXkZnLzk2OjIBaf-zbE", "muted"],
    ["  -> refused: bad signature", "ok"],
