[poster]
headline = [["BROKEN", "text"], ["ACCESS CONTROL", "accent"]]
taglines = [["Signed in is not the same as allowed", "gold"]]
before = { code = "GET /orders/1002  ->  200", note = "anyone signed in reads it", tag = "BEFORE" }
after = { code = "GET /orders/1002  ->  404", note = "one policy, deny by default", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "Broken Access Control"
narration = """Hello, and welcome. [[slnc 400]] This video explains broken access control, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] Access control decides what a signed in person may do. [[slnc 300]] When it is broken, a person can read or change things that are not theirs, or do things their role should not allow. [[slnc 300]] It is the number one risk in the O W A S P top ten. [[slnc 600]] Think of a hotel where every key card opens every room, because the lock only checks that the card is a real one. [[slnc 300]] Being a guest is authentication. [[slnc 300]] Opening only your own room is authorization. [[slnc 700]] In this video, the domain is an online store. [[slnc 500]] By the end, you will hear five ways the store's checks fail. [[slnc 300]] Why a hard to guess id is not a permission. [[slnc 300]] And how one policy, that refuses by default, fixes all five."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online store's API:", "orders, addresses, refunds,", "users and a sales report.", "", "Each handler checks", "what its author remembered."]
narration = """Here is the scenario. [[slnc 400]] An online store has an A P I, for orders, delivery addresses, refunds, user management, and a sales report. [[slnc 500]] Customers, support staff, and admins all use it. [[slnc 500]] Each handler checks what its author remembered to check. [[slnc 600]] The attacker is a customer called ana, with nothing more than a browser."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["IDOR: an object reached by changing its id", "Horizontal: another person's data, same role", "Vertical: a higher role's functions", "Deny by default: no rule means no", "Choke point: one place every request passes"]
narration = """Before the demos, the words. [[slnc 500]] I D O R, an insecure direct object reference, is reaching someone else's object by changing its id. [[slnc 500]] Horizontal escalation reaches another person's data, with the same role. [[slnc 500]] Vertical escalation reaches the functions of a higher role. [[slnc 500]] Deny by default means that no rule means no. [[slnc 500]] And a choke point is one place that every request passes through."""

[[scene]]
key = "03-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "04-choke-point"
kind = "figure"
title = "One policy before every handler"
body = "choke_point"
narration = """Let's see the fix on one picture first. [[slnc 400]] Every request carries three things: who is asking, the method, and the path. [[slnc 300]] Here, ana asks to get order one thousand and two. [[slnc 700]] Before any handler runs, the request passes one choke point: the policy. [[slnc 300]] It asks four questions, in order. [[slnc 500]] Is there a rule for this route? [[slnc 300]] If not, four oh three: deny by default. [[slnc 500]] Does the rule need a signed in user, and is there one? [[slnc 300]] If not, four oh one. [[slnc 500]] Does the user's role allow it? [[slnc 300]] If yes, the handler runs. [[slnc 500]] If not, and the rule allows the owner, is this the owner's order? [[slnc 300]] Ana's request fails here. [[slnc 300]] Order one thousand and two is ben's, so the answer is four oh four. [[slnc 700]] Only a request that passes reaches the handler."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "09-ladder"
kind = "bullets"
title = "What Does Not Work, and What Does"
body = ["Hidden links: no", "Unguessable ids: no", "Signed in only: no", "A check in each handler: until one is forgotten", "One policy, deny by default, tested: yes"]
narration = """Let's put it side by side. [[slnc 400]] Hiding links in the page does not work. [[slnc 500]] Ids that are hard to guess do not work, because ids are shared. [[slnc 500]] Checking only that someone is signed in does not work. [[slnc 500]] A check in each handler works, until one is forgotten. [[slnc 500]] One policy, that refuses by default, and a test that every route has a rule, works."""

[[scene]]
key = "11-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["OWASP Top 10: A01", "OWASP API Top 10: API1 and API5", "Bug bounty reports: IDOR, BOLA", "deny all at the end of a config"]
narration = """You have probably met this already. [[slnc 400]] It is first in the O W A S P top ten. [[slnc 500]] It is first and fifth in the O W A S P A P I security top ten, as broken object level, and function level, authorization. [[slnc 500]] Bug bounty reports call it I D O R, or B O L A. [[slnc 500]] And security configurations that end with deny all are this lesson, written down."""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Deny by default", "One policy, before every handler", "Check ownership on the server, every time", "Test that every route has a rule", "Log refusals, never tokens"]
narration = """So, how do you use it? [[slnc 400]] Deny by default. [[slnc 500]] Keep every rule in one policy, that runs before every handler. [[slnc 500]] Check ownership of every object, on the server, every time. [[slnc 500]] Test that every route has a rule. [[slnc 500]] And log every refusal, but never a token."""

[[scene]]
key = "12-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "13-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a route,", "and watch the inventory test fail."]
narration = """That's broken access control. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Signed in is not the same as allowed, so check every request, at one place, and refuse whatever has no rule. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine, with nothing installed except a Java development kit. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a new route, and watch the inventory test fail until it has a rule. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
The access control of an online store's API: reading and changing orders and addresses, refunds, user management and reports, by customers, support staff, admins and people who are signed out.
It covers a signed-in customer who edits ids, methods and paths. It does not cover authentication itself, stolen tokens, or injection.
"""
assets = [
    "Every customer's orders and delivery addresses.",
    "Refunds, which move money.",
    "User accounts.",
    "The sales report, which lists every customer.",
]
actors = [
    "Customers, who may act only on their own orders.",
    "Support staff, who may read any order but not change one.",
    "Admins, who may refund, manage users and read reports.",
    "A signed-in customer who edits requests by hand.",
    "Someone who is not signed in.",
]
boundaries = [
    "Internet to the store's API: every request crosses it, and every part of it can be edited by the sender.",
    "The page to the server: what the page shows or hides is not a control.",
]
assumptions = [
    "Tokens identify their users correctly; authentication is a separate concern.",
    "In the demo, tokens and data are fixed demo values, and attacks target only this project's own code.",
]
out_of_scope = [
    "Authentication and stolen tokens: the beginner identity module and the intermediate identity module.",
    "Injection: the next projects in web-security.",
    "Framework configuration: the Spring Security version of this project.",
]
tests = [
    "`NaiveStoreTest` pins down each weakness of the first version, including that seven of the nine attacks succeed.",
    "`GuardedStoreTest` checks that every attack is refused, every honest request works, the statuses are right, and refusals are logged without tokens.",
    "`RouteInventoryTest` checks that every route has a rule, reports a forgotten one, and that routes match whole segments only.",
    "`HttpFrontTest` checks the same answers over real HTTP and that tokens must match exactly.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next project, sql-injection, attacks the same store through its search box instead of its routes.
"""

[[threat]]
id = "T1"
stride = "I"
threat = "A customer reads another customer's order by changing the id in the path (IDOR, CWE-639, API1)"
where = "`GET /orders/{id}`"
control = "Object-level ownership check in the policy; someone else's order answers 404"
residual = "Every new object type needs its own ownership rule"

[[threat]]
id = "T2"
stride = "E"
threat = "A route that nobody links to has no check, and is reached directly (CWE-862)"
where = "`GET /admin/reports`"
control = "Deny by default: a route with no rule is refused"
residual = "None while the route inventory test runs in the build"

[[threat]]
id = "T3"
stride = "E"
threat = "A function hidden in the page is called directly, because the role was checked only in the page (API5)"
where = "`POST /admin/refunds`"
control = "Role rules on the server, in the policy"
residual = "None for this route; the page's menu is a convenience, not a control"

[[threat]]
id = "T4"
stride = "T"
threat = "A customer changes or cancels another customer's order (horizontal escalation)"
where = "`POST /orders/{id}/address`, `DELETE /orders/{id}`"
control = "Ownership rules; support may read but not change"
residual = "Business rules such as cut-off times are separate checks"

[[threat]]
id = "T5"
stride = "E"
threat = "A method that was not checked, such as DELETE next to a checked GET, deletes an account (verb tampering, CWE-285)"
where = "`DELETE /admin/users/{name}`"
control = "Rules per method and path; unknown methods are not routed"
residual = "A framework that maps methods loosely needs its own tests"

[[threat]]
id = "T6"
stride = "E"
threat = "A new route is added without a rule and the policy is silently incomplete"
where = "`GuardedStore` route table"
control = "Deny by default at run time, and a route inventory test that fails the build"
residual = "A rule that is present but too wide is still possible; rules need review"

[[threat]]
id = "T7"
stride = "R"
threat = "Attacks go unnoticed, or the log itself leaks tokens"
where = "`Policy` denial log"
control = "Every refusal is logged with who and why; tokens are never logged"
residual = "Somebody has to read and alert on the log"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] The handlers are the same in both stores; only where the checks live changes. [[slnc 300]] Here are the classes that matter."""

[[class]]
name = "NaiveStore"
what = "the first version: a check in each route"
[[class.part]]
title = "checks written one by one"
code = """
.add("GET", "/orders/{id}", signedIn(Handlers::orderDetails))
...
.add("GET", "/admin/users", call -> isAdmin(call) ? Handlers.listUsers(call) : forbidden())
...
.add("DELETE", "/admin/users/{name}", Handlers::deleteUser)
"""
speech = """The naive store wraps each handler in its own check. [[slnc 300]] Reading an order only asks: is someone signed in? [[slnc 300]] Listing users asks for the admin role. [[slnc 300]] But deleting a user, added later, has no check at all."""

[[class]]
name = "Policy"
what = "every rule in one table, and one decision"
[[class.part]]
title = "no rule means no"
code = """
Rule rule = rules.get(route);
String who = user.map(User::name).orElse("someone signed out");
if (rule == null) {
    return deny(who, route, 403, "no rule for this route, so it is refused");
}
"""
speech = """The policy looks up the rule for the route. [[slnc 300]] No rule means no: four oh three. [[slnc 300]] That is deny by default, in four lines."""
[[class.part]]
title = "the owner check answers 404"
code = """
if (rule.ownerAllowed()) {
    Optional<Order> order = data.order(params.get("id"));
    if (order.isPresent() && order.get().owner().equals(user.get().name())) {
        return Decision.ALLOW;
    }
    return deny(who, route, 404, "no order " + params.get("id") + " that belongs to " + who);
"""
speech = """For an order, the policy looks up who owns it. [[slnc 300]] The owner is allowed. [[slnc 300]] Anyone else gets four oh four, the same answer as a missing order. [[slnc 300]] And the refusal is logged, with a name, never a token."""

[[class]]
name = "GuardedStore"
what = "the fixed store: the policy first, then the handler"
[[class.part]]
title = "one choke point"
code = """
Policy.Decision decision = policy.decide(m.route(), m.params(), call.user(), data);
return decision.allowed() ? m.handler().handle(call) : Reply.status(decision.status(), decision.reason());
"""
speech = """The guarded store asks the policy first, for every request. [[slnc 300]] Only an allowed request reaches the handler. [[slnc 300]] The handlers themselves have no checks at all."""
[[class.part]]
title = "the route inventory"
code = """
List<Route> routesWithoutRules() {
    return table.routes().stream().filter(r -> policy.rule(r).isEmpty()).toList();
"""
speech = """And this is what the inventory test calls. [[slnc 300]] It lists every route that has no rule. [[slnc 300]] The test fails while the list is not empty."""

[[acronym]]
short = "IDOR"
long = "Insecure Direct Object Reference: reaching an object by changing its id"
say = "I D O R is an insecure direct object reference: reaching someone else's object, just by changing its id."
[[acronym]]
short = "BOLA"
long = "Broken Object Level Authorization: the API name for IDOR"
say = "B O L A is broken object level authorization, the A P I name for the same flaw."
[[acronym]]
short = "OWASP, A01"
long = "Open Worldwide Application Security Project; A01 is its first risk"
say = "O W A S P is the Open Worldwide Application Security Project. A zero one is the first risk in its top ten."
[[acronym]]
short = "API1-API5"
long = "risks one and five in the OWASP API Security Top 10"
say = "A P I one and A P I five are the first and fifth risks in the O W A S P A P I security top ten."
[[acronym]]
short = "API, HTTP"
long = "Application Programming Interface; HyperText Transfer Protocol"
say = "An A P I is an application programming interface: the requests a program accepts. H T T P is the hypertext transfer protocol that carries them."
[[acronym]]
short = "CWE"
long = "Common Weakness Enumeration: a numbered list of software weaknesses"
say = "C W E is the common weakness enumeration, a numbered list of kinds of software weakness."
[[acronym]]
short = "GET, POST, DELETE"
long = "HTTP methods: read, send, remove"
say = "Get, post and delete are H T T P methods: read something, send something, and remove something."
[[acronym]]
short = "200, 401, 403, 404"
long = "HTTP status codes: OK, sign in first, forbidden, not found"
say = "And the status codes. Two hundred means O K. Four oh one means sign in first. Four oh three means forbidden. Four oh four means not found."
