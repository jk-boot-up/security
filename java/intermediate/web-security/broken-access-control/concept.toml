short_title = "Broken Access Control"
package = "accesscontrol"
main_class = "AccessControlDemo"
tagline = "Signed in is not the same as allowed"
bold = "Most access-control bugs are not clever: an order anyone can read by changing a number, a route nobody linked to, a check in the page but not on the server, a DELETE that was copied without its check. The fix is one policy at one choke point, deny by default, with a test that fails when a route has no rule."
domain = "an online store"
domain_note = ""
youtube_description = """Broken access control in Java, the number one risk in the OWASP Top 10. Explained with an online store, like a hotel where every key card opens every door because the lock only checks that the card is a real one. We walk order numbers and read other customers' orders, open an admin report nobody linked to, send a refund that the page only hid, delete an account through a DELETE that was never checked, and change another customer's delivery address. Then we fix all of it with one policy at one choke point, deny by default, object-level ownership checks, a log of every refusal, and a route inventory test that fails the build when a new route has no rule."""
thumb_lines = ["BROKEN", "ACCESS CONTROL"]
thumb_code = "GET /orders/1002  ->  404"
youtube_title = "Broken Access Control in Java (IDOR, BOLA, Deny by Default) - OWASP A01"
