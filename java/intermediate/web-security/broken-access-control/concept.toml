[docs.problem]
scenario = """
An online store's API serves orders, delivery addresses, refunds, user management and a sales report to customers, support staff and admins. Its checks were written inside each handler,
over time, by different people.
"""
naive = """
Check that the caller is signed in, hide the admin links in the page, and trust that nobody will change a number in the address bar or send a request the page does not offer.
"""
deliver = [
    "A naive store with each typical mistake: IDOR, a forgotten route, a check only in the page, an unchecked DELETE, and another customer's data changed.",
    "A guarded store with the same handlers and one policy in front of them: deny by default, roles, and object-level ownership.",
    "A log of every refusal, with who and why and never a token.",
    "A route inventory test that fails when a route has no rule.",
    "The same rules served over real HTTP.",
]

[docs.prerequisites]
required = [
    "Java basics",
    "The beginner project authentication-vs-authorization, or what 401 and 403 mean",
]
not_required = [
    "A web framework: the store uses the JDK's own HTTP server",
    "A database: the orders are kept in memory",
]
install = []

[docs.session]
objectives = [
    "explain IDOR, and why an unguessable id does not fix it",
    "tell horizontal from vertical privilege escalation",
    "say why a check in the page is not a check",
    "design access control as one policy at one choke point, deny by default",
    "keep the policy complete with a test",
]
walkthrough = """
Start with the hotel key cards. Run the demo act by act. After act one, ask what ana needed to know to read ben's order. After act two, ask how ana found the refund route, and lead to the
browser's developer tools. Before act four, ask the group to design the fix. After act five, ask what else the route inventory test could check.
"""
exercises = [
    "Add a support-only route for refund notes, and write its rule first, then its handler.",
    "Change someone else's order to answer 403 instead of 404, and discuss what the support team gains and what an attacker gains.",
    "Make the ownership check part of the lookup itself, so that a handler can only ever load the caller's own orders.",
    "Extend the route inventory test so that it also fails when a rule exists for a route that no longer exists.",
]

[docs.explained]
sentence = """
Broken access control is a server that does what any signed-in caller asks, because the check for whose object it is or which role may act was missing, misplaced or only in the page; the fix is one policy that runs before every handler, refuses whatever it has no rule for, and checks ownership of every object.
"""
verdict = """
Deny by default. Put every rule in one place that runs before any handler, and test that every route has one. Check ownership of each object on the server, every time, and prefer queries that can only return the caller's own data.
Never rely on hidden links, unguessable ids or the method being one the page does not use. Log refusals, without secrets.
"""
recognise = [
    "`anyRequest().denyAll()` or `anyRequest().authenticated()` at the end of a security configuration.",
    "`@PreAuthorize(\"@orders.isOwner(#id, authentication)\")` on a method.",
    "Queries such as `findByIdAndOwner(id, user)` instead of `findById(id)`.",
    "Pen-test findings titled IDOR, BOLA or BFLA.",
]

[spec]
purpose = """
Teach broken access control by attacking a small store API five ways and fixing every attack with one central policy, deny by default, object-level checks and a route inventory test.
"""
nongoals = [
    "Authentication: the beginner identity module.",
    "Framework-specific access control: the Spring Security version of this project.",
    "Attribute-based access control engines and policy languages: the advanced track.",
]
problem = """
Access control is the most common serious weakness in web applications and APIs, and it is usually missing checks rather than clever attacks.
"""
roles = [["The store's business logic, with no checks", "`Handlers`"], ["The first version, checks in each handler", "`NaiveStore`"], ["The rules and the choke point", "`Policy`"], ["The fixed version", "`GuardedStore`"], ["Routes and matching", "`Route`, `RouteTable`"], ["Users, tokens and orders", "`ShopData`"], ["Real HTTP", "`HttpFront`"], ["Entry point", "`AccessControlDemo`"]]
requirements = [
    "Every attack in the list succeeds or fails exactly as stated against each store.",
    "The guarded store refuses all nine attacks and serves all six honest requests.",
    "Someone else's order answers 404, signed out answers 401, the wrong role 403.",
    "Every refusal is logged, and no log line contains a token.",
    "A route with no rule is refused, and the route inventory test reports it.",
    "Tokens are compared in constant time.",
    "The demo prints the same output on every run.",
]

