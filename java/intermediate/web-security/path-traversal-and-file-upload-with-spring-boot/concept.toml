[[scene]]
key = "01-poster"
kind = "poster"
title = "Path Traversal and File Upload with Spring Boot"
narration = "Hello, and welcome. [[slnc 400]] This video explains path traversal and file upload with Spring Boot, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] Spring gives your code the file name exactly as the customer sent it. [[slnc 300]] A name with two dots can climb out of its folder, and an uploaded file can keep a name that overwrites something important. [[slnc 600]] Think of a cloakroom ticket. [[slnc 300]] If the attendant fetches whatever room the ticket names, a rewritten ticket opens the manager's office. [[slnc 600]] Our example is an online store built on Spring Boot, with invoices and product photos."

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online store on Spring Boot:", "  customers download their invoices", "  staff upload product photos", "  everyone returns to a page after signing in", "", "The demo starts the real shop in three versions", "and talks to it over HTTP."]
narration = "Here is the scenario. [[slnc 400]] An online store runs on Spring Boot. [[slnc 300]] Customers download their invoices, staff upload product photos, and everyone returns to a page after signing in. [[slnc 600]] The demo starts the real shop in three versions, over a small folder layout made for the demo, and sends it names, files and addresses over H T T P, just as a browser would."

[[scene]]
key = "02-words"
kind = "bullets"
title = "The Words"
body = ["Path: folder names joined by /", "..: the folder above", "Web root: files the web server hands out", "Magic bytes: the first bytes of a file", "Symbolic link: a file that points elsewhere", "Multipart: a request that carries files"]
narration = """Before the demos, the words. [[slnc 500]] A path is a list of folder names, joined by slashes, that ends at a file. [[slnc 500]] Two dots, in a path, mean the folder above. [[slnc 500]] The web root is the folder whose files the web server hands out, as they are. [[slnc 500]] Magic bytes are the first bytes of a file, which tell what kind of file it really is, whatever its name says. [[slnc 500]] A symbolic link is a small file that points at another file, somewhere else. [[slnc 500]] And a multipart request is how a browser sends a file: each part carries a file name and the file's bytes."""

[[scene]]
key = "02-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "02-climb-out"
kind = "figure"
title = "A name that walks out of its folder"
body = "climb_out"
narration = """Let's see the whole idea on one picture. [[slnc 400]] On the left, the folders on the shop's server. [[slnc 300]] The customer may read files from invoices, and nothing else. [[slnc 700]] The customer sends a name: dot dot, slash, secrets, slash, d b dot t x t. [[slnc 300]] The server joins it to the invoices folder. [[slnc 600]] To the disk, dot dot means one folder up. [[slnc 300]] So the path climbs out of invoices, as the amber arrow shows, and goes down into secrets. [[slnc 600]] The two dots cancel the folder before them. [[slnc 300]] What is left is the secrets file, and the customer reads the database password. [[slnc 700]] That is path traversal. [[slnc 300]] Spring hands the controller that name exactly as it was sent. [[slnc 300]] Checking it is the controller's job."""

[[scene]]
key = "03-acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "04-costs"
kind = "bullets"
title = "What It Costs"
body = ["A name pattern can break old file names", "A real-path check costs a disk lookup", "Checking the bytes knows only a few formats", "Server-made names lose the customer's name", "Size limits protect the server, not the content"]
narration = "Nothing is free. [[slnc 400]] Here is what the defences cost. [[slnc 500]] A strict name pattern can break old file names that do not fit it. [[slnc 500]] Checking where a path really leads costs a lookup on the disk. [[slnc 500]] Checking a file's first bytes only knows a few formats. [[slnc 500]] Names made by the server lose the customer's own name, so it is kept separately if needed. [[slnc 300]] And Spring's upload size limits protect the server, but they say nothing about what is inside the file."

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["getOriginalFilename() passed to a file API", "startsWith on the text of a path", "A returnTo or next parameter after sign-in", "spring.servlet.multipart.max-file-size"]
narration = "You have probably met this already. [[slnc 400]] A call to get original filename, passed straight to a file A P I, is the upload mistake. [[slnc 500]] A starts with check on the text of a path is the mistake from the third demo. [[slnc 500]] A return to, or next, parameter after signing in is the open redirect. [[slnc 500]] And the multipart max file size setting is Spring's size limit, which stops a large upload before your controller runs."

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Use a name pattern, or ids made by the server", "Compare real paths element by element", "Refuse links that leave the folder", "Decide the type from the bytes", "Serve uploads as downloads, with nosniff", "Size limits in Spring and in code", "Redirect only to a path on the site"]
narration = "So, how do you use it? [[slnc 400]] Accept only names that match a pattern, or better, ids made by the server. [[slnc 500]] Compare real paths element by element, and refuse a link that leads out of the folder. [[slnc 500]] Decide a file's type from its bytes, and serve uploads as downloads, with the no sniff header. [[slnc 500]] Set Spring's size limits, and keep a second limit in your own code. [[slnc 300]] And redirect only to a path on your own site."

