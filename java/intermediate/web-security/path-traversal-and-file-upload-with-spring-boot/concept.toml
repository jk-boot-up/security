[project]
slug = "path-traversal-and-file-upload-with-spring-boot"
level = "intermediate"
module = "web-security"
title = "Path Traversal and File Upload with Spring Boot"
short_title = "File Handling with Spring Boot"
package = "uploadspring"
main_class = "FilesSpringDemo"
tagline = "Spring hands you the file name exactly as the customer sent it, and its static handler follows a link out of the folder"
bold = "In a Spring Boot shop the customer's file name arrives untouched in a query parameter or in MultipartFile.getOriginalFilename, so a name with dot-dot leaves the folder, a text prefix check lets a sibling folder through, and an upload keeps the customer's name; Spring's static handler refuses dot-dot but follows a symbolic link, so the fix is a name pattern, a real-path check, server-made names, content checks, multipart limits and a return address that is only ever a path on the site."
domain = "an online store's invoices and product photos"
domain_note = ""
youtube_description = "Path traversal and file upload in Spring Boot 4: query parameters, MultipartFile names, Spring's resource handler, multipart limits, content sniffing and open redirects."
thumb_lines = ["FILES WITH", "SPRING BOOT"]
thumb_code = "toRealPath().startsWith(base)"
youtube_title = "Path Traversal and File Upload in Spring Boot: Multipart, Resource Handler and Open Redirects"
youtube_tags = ["path traversal", "file upload", "spring boot", "multipart", "open redirect", "java", "application security"]

[readme]
intro = """
The plain [path-traversal-and-file-upload](../path-traversal-and-file-upload) project works on files directly. This one puts the same store behind **Spring Boot 4.1** and real HTTP, so the inputs arrive the way they do in production: a **query parameter**, a **multipart upload** and a **redirect parameter**, and the limits are Spring's own.

What it shows:
- **A file name in a query parameter** reaches the controller decoded once, exactly as typed, so `../secrets/db.txt` walks out of the invoice folder, and a check that compares *text* (`startsWith`) lets `invoices-private` through.
- **The fix is layered:** a name pattern, the path resolved and compared element by element, and the real path after symbolic links is still inside the folder.
- **Spring's static resource handler** refuses `..` and an encoded slash (400 or 404), which is good, but it **follows a symbolic link** inside the folder to a file outside it.
- **A multipart upload** gives the controller `getOriginalFilename()` as the client sent it, `../../config/app.properties` included. The naive shop keeps the name, serves a script inline, and overwrites the configuration. The fixed shop makes its own name, decides the type from the bytes, serves a download with `nosniff`, and Spring's `max-file-size` stops a large upload before the controller runs.
- **The "return to" address** becomes a redirect: a naive controller sends the customer anywhere; the fix accepts only a path on this site, and compares a host exactly when an absolute address is really needed.

**Maps to:** OWASP Top 10 (2025) A01 Broken Access Control · CWE-22 · CWE-434 · CWE-601 · OWASP ASVS 5.0 V5 (File Handling) · OWASP File Upload Cheat Sheet.
"""
analogy = """
A filing clerk who fetches "the folder the customer names". If the clerk walks wherever the written path says, "up two floors, then the safe" works. If the clerk only compares the start of the path, the sibling room with a similar name still works. If the clerk checks where they actually end up, a shortcut left in the corridor still needs to be checked too.
"""
scenario = """
An online store lets customers download their invoices and staff upload product photos. The demo starts the real Spring Boot shop in three versions over a temporary folder layout, and sends it files, names and addresses over HTTP.
"""
costs = [
    "**Name patterns break old names,** so know every invoice name the shop has ever made.",
    "**Real-path checks cost a file system call** on every download.",
    "**Content sniffing knows a few formats,** and each new format needs code.",
    "**Server-made names lose the original name,** which the shop must store separately if it matters.",
    "**Multipart limits protect the server, not the content,** and need the code check as a second layer.",
]
too_much = """
Where the files are few and fixed, serve them from object storage with signed addresses and let the shop never open a path. Where they are many, store them under server-made ids and keep names in the database.
"""
met_before = [
    "`@RequestParam String file` passed to `Path.resolve`.",
    "`MultipartFile.getOriginalFilename()` used as a file name.",
    "`spring.servlet.multipart.max-file-size` in `application.properties`.",
    "`response.sendRedirect(request.getParameter(\"next\"))` after a login.",
]
where = """
This is the tools version of [path-traversal-and-file-upload](../path-traversal-and-file-upload), in the [web-security](..) module. It keeps the same files, names and numbers, and adds what Spring and Tomcat do on the way.
"""
twin = """
The shop is a real Spring Boot application; the file system is real, in a temporary folder that is removed at the end, and the symbolic link is a real link. Only the data is small. Ports and temporary paths are never printed.
"""
test_note = "Each test builds its own temporary layout, starts real servers over it and removes it."

[[act]]
title = "Downloading an invoice"
summary = "An honest invoice name returns the invoice."
detail = """
The first version resolves the name from the query parameter against the invoice folder and returns the file. The honest name, invoice-1001.txt, returns Ana's invoice.
"""
speech = """
First demo: downloading an invoice. [[slnc 400]] The name arrives in a query parameter, and the first version resolves it against the invoice folder. [[slnc 300]] The honest name returns Ana's invoice.
"""
rows = { download = "active ok" }
console = [
    ["invoice-1001.txt -> read: Invoice 1001: Ana, 42.50", "ok"],
]

[[act]]
title = "A name with dot-dot leaves the folder"
summary = "../secrets/db.txt returns the database password and ../config/app.properties returns the settings."
detail = """
Spring hands the controller the name exactly as typed. A name with dot-dot segments walks up out of the invoice folder, and the shop returns the demo database password from the secrets folder and the application's settings.
"""
speech = """
Second demo: a name with dot dot leaves the folder. [[slnc 400]] Spring passes the name exactly as the customer typed it. [[slnc 300]] Dot dot slash secrets returns the database password. [[slnc 300]] Dot dot slash config returns the settings.
"""
rows = { traversal = "active wrong" }
console = [
    ["../secrets/db.txt -> read: DB_PASSWORD=demo-not-real", "bad"],
    ["../config/app.properties -> read: admin=ana", "bad"],
]

[[act]]
title = "A text check on the path is not a path check"
summary = "A startsWith on the path text refuses the secrets folder but lets the sibling folder invoices-private through."
detail = """
The second version resolves and normalises the path and then checks that its text starts with the invoice folder's text. The secrets folder is refused, but invoices-private starts with the same letters, so the payroll file is read.
"""
speech = """
Third demo: a text check on the path is not a path check. [[slnc 400]] The second version compares the start of the path as text. [[slnc 300]] The secrets folder is refused. [[slnc 300]] But a sibling folder with a similar name passes, and the payroll file is read.
"""
rows = { prefix = "active wrong" }
console = [
    ["../secrets/db.txt -> refused: outside the invoice folder", "ok"],
    ["../invoices-private/payroll.txt -> read: payroll: demo salaries", "bad"],
]

[[act]]
title = "Names, paths and links, all checked"
summary = "The fixed download checks the name, the path and the real path after links; Spring's static handler refuses dot-dot but follows a link out of the folder."
detail = """
The fixed shop accepts only names shaped like an invoice name, resolves the path and compares it element by element, and then checks that the real path, after symbolic links, is still inside the real folder. Dot-dot, an encoded spelling, the sibling folder and a link all fail, and a missing file says so.
Spring's own static handler for the folder refuses an encoded slash with 400 and a dot-dot segment with 404, but serves a link inside the folder that points at the secrets file: it does not follow the same rule.
"""
speech = """
Fourth demo: names, paths and links, all checked. [[slnc 400]] The fixed shop accepts only names shaped like an invoice name. [[slnc 300]] It compares the path element by element. [[slnc 300]] And it checks where a link really leads. [[slnc 600]] Spring's own static handler refuses dot dot, but it follows a link out of the folder.
"""
rows = { safe = "active ok" }
console = [
    ["../secrets/db.txt -> refused: not an invoice name", "ok"],
    ["invoice-5555.txt (a link) -> refused: link leads outside the invoice folder", "ok"],
    ["Spring's static handler, ..%2f -> 400; %2e%2e/ -> 404", "ok"],
    ["Spring's static handler, the link -> 200 DB_PASSWORD=demo-not-real  <- FOLLOWS THE LINK", "bad"],
]

[[act]]
title = "Uploads"
summary = "The naive shop keeps the customer's name, serves a script inline and overwrites the settings; the fixed shop makes its own name, checks the bytes, forces a download and limits the size."
detail = """
The naive upload keeps getOriginalFilename as sent: a script called page.html is served as text/html inline, and a name with dot-dot overwrites the configuration with admin=mallory. The fixed shop makes its own name, decides the type from the first bytes, and serves the file as a download of
the sniffed type with nosniff, so a script, even one renamed cat.png, is refused and a name with dot-dot is ignored. A photo of 1500 bytes is refused by the code, and one of 5000 bytes by Spring's multipart limit before the controller runs.
"""
speech = """
Fifth demo: uploads. [[slnc 400]] The first version keeps the customer's file name. [[slnc 300]] A script is served as a web page. [[slnc 300]] A name with dot dot overwrites the settings. [[slnc 600]] The fixed shop makes its own name, checks the first bytes, forces a download, and limits the size, partly before the controller runs.
"""
rows = { upload = "active wrong" }
console = [
    ["a script called page.html -> served as text/html, inline", "bad"],
    ["a name with .. -> config now reads: admin=mallory", "bad"],
    ["a script renamed cat.png -> refused: not a PNG or JPEG image", "ok"],
    ["a photo of 5000 bytes -> 413, refused before the controller runs", "ok"],
]

[[act]]
title = "Where to send the customer next"
summary = "A naive return address sends the customer anywhere; the fixed one accepts only a path on this site, and an absolute address only on an exact host match."
detail = """
After an upload the shop redirects to the return address in the request. The naive controller sends the customer to an outside address, a protocol-relative address, a backslash trick or a script address. The fixed controller accepts only a path on this site and sends everything else to the account page.
Where an absolute address must be allowed, the host is compared exactly, so shop.example.evil.example and shop.example@evil.example are both refused.
"""
speech = """
Sixth demo: where to send the customer next. [[slnc 400]] The naive controller redirects anywhere the link says. [[slnc 300]] The fixed one accepts only a path on this site. [[slnc 600]] Where an absolute address must be allowed, the host is compared exactly.
"""
rows = { redirect = "active ok" }
console = [
    ["\"https://evil.example/login\" -> naive: https://evil.example/login, safe: /account", "bad"],
    ["\"//evil.example\" -> naive: //evil.example, safe: /account", "bad"],
    ["shop.example.evil.example -> false", "ok"],
]

