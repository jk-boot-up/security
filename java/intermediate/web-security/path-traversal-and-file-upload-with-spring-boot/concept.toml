bold = "In a Spring Boot shop the customer's file name arrives untouched in a query parameter or in MultipartFile.getOriginalFilename, so a name with dot-dot leaves the folder, a text prefix check lets a sibling folder through, and an upload keeps the customer's name; Spring's static handler refuses dot-dot but follows a symbolic link, so the fix is a name pattern, a real-path check, server-made names, content checks, multipart limits and a return address that is only ever a path on the site."
domain = "an online store's invoices and product photos"
domain_note = ""
youtube_description = "Path traversal and file upload in Spring Boot 4, in Java. Spring hands a controller the customer's file name exactly as it was sent, in a query parameter or from MultipartFile.getOriginalFilename, so a name with two dots walks out of the invoice folder, a text check lets a folder with a similar name through, and an upload keeps a name that overwrites the settings. Explained with an online store, like a cloakroom ticket that someone has rewritten to point at the manager's office. We see that Spring's own static handler refuses two dots but follows a symbolic link out of its folder, then fix the shop with a name pattern, a real-path check, server-made names, a type decided from the bytes, downloads with nosniff and multipart size limits, and a return address that is only ever a path on the site."
