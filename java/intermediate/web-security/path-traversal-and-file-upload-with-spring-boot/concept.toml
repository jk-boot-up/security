[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] The demo starts the real Spring Boot shop, over a real temporary folder. [[slnc 300]] Here are the classes that matter."""

[[class]]
name = "FilesController"
what = "the shop's routes: the name and the file arrive as sent"
[[class.part]]
title = "a parameter, and getOriginalFilename()"
code = """
@GetMapping("/invoices")
String invoice(@RequestParam String name) {
    return downloads.read(name);
...
@PostMapping("/uploads")
String upload(@RequestParam MultipartFile file) throws IOException {
    return uploads.save(file.getOriginalFilename(), file.getBytes());
"""
speech = """The controller passes the query parameter straight to the download. [[slnc 300]] And for an upload, get original filename is whatever the client wrote, dot dots included. [[slnc 300]] Spring decodes, but it never checks."""

[[class]]
name = "PrefixDownloads"
what = "the second download: it compares text"
[[class.part]]
title = "a text prefix"
code = """
var file = layout.invoices().resolve(name).normalize();
if (!file.toString().startsWith(layout.invoices().toString())) {
    throw new Refused("outside the invoice folder");
"""
speech = """The second version removes the dots with normalize. [[slnc 300]] Then it compares strings. [[slnc 300]] A folder whose name starts with the same letters passes."""

[[class]]
name = "SafeDownloads"
what = "the fixed download, in four layers"
[[class.part]]
title = "no second decode; shape, path, real path"
code = """
public String read(String name) {
if (!NAME.matcher(name).matches()) {
...
Path base = layout.invoices().toRealPath();
Path file = base.resolve(name).normalize();
if (!file.startsWith(base)) {
...
Path real = file.toRealPath(); // follows links
if (!real.startsWith(base)) {
"""
speech = """The name arrives already decoded once, by Spring, and the fixed version never decodes it again. [[slnc 300]] It checks the shape with a pattern. [[slnc 300]] Then it compares paths with path dot starts with, which compares whole folder names. [[slnc 300]] Last, to real path follows links, and the real file is compared again."""

[[class]]
name = "StoreConfig"
what = "picks the versions, and maps a folder with Spring's handler"
[[class.part]]
title = "a static resource handler"
code = """
registry.addResourceHandler("/static-invoices/**")
        .addResourceLocations(layout.invoices().toUri().toString());
"""
speech = """This one line maps the invoices folder to a web address. [[slnc 300]] Spring refuses dot dot on that route, but it serves a link inside the folder wherever it points."""

[[class]]
name = "Sniffer"
what = "decides what a file is from its first bytes"
[[class.part]]
title = "magic bytes"
code = """
if (b.length >= 8 && (b[0] & 0xff) == 0x89
        && b[1] == 'P' && b[2] == 'N' && b[3] == 'G') {
    return new Kind("png", "image/png");
...
if (b.length >= 4 && (b[0] & 0xff) == 0xff
        && (b[1] & 0xff) == 0xd8 && (b[2] & 0xff) == 0xff) {
    return new Kind("jpg", "image/jpeg");
"""
speech = """The sniffer looks only at the first bytes, which the customer cannot rename. [[slnc 300]] Eighty nine, then P N G, is a P N G image. [[slnc 300]] eff eff, dee eight, eff eff is a jay peg. [[slnc 300]] Anything else is refused."""

[[class]]
name = "SafeUploads"
what = "the fixed upload: the server decides"
[[class.part]]
title = "the server's own name"
code = """
if (bytes.length == 0 || bytes.length > MAX_BYTES) {
...
Sniffer.Kind kind = Sniffer.of(bytes);
...
String id = String.format("photo-%04d.%s", ++counter, kind.extension());
Path target = layout.uploadsPrivate().resolve(id);
"""
speech = """The fixed upload checks the size, and asks the sniffer for the type. [[slnc 300]] It counts its own name, photo and four digits, and writes the file outside the web root. [[slnc 300]] The customer's file name is never used."""

[[class]]
name = "ReturnLink"
what = "where the customer goes after signing in"
[[class.part]]
title = "only a path on our site"
code = """
if (!returnTo.startsWith("/")) {
    return "does not start with /";
...
if (returnTo.startsWith("//")) {
    return "starts with //: another host";
...
return "https".equals(uri.getScheme())
        && uri.getUserInfo() == null
        && OWN_HOSTS.contains(uri.getHost());
"""
speech = """A return link must start with one slash, and not two. [[slnc 300]] Anything else gets the account page. [[slnc 300]] When a full address is needed, the host must be exactly one of our own, with no user name in front."""

[[acronym]]
short = "PNG"
long = "Portable Network Graphics: an image format; its files start 89 50 4e 47"
say = "P N G is portable network graphics, an image format. Every P N G file starts with the same eight bytes."
[[acronym]]
short = "JPEG"
long = "Joint Photographic Experts Group: a photo format; files start ff d8 ff"
say = "jay peg is named after the joint photographic experts group. It is the usual format for photos."
[[acronym]]
short = "HTML"
long = "HyperText Markup Language: the text of a web page"
say = "H T M L is hypertext markup language: the text a browser shows as a page, scripts included."
[[acronym]]
short = "hex"
long = "hexadecimal: a byte as two digits from 0-9 and A-F"
say = "Hex is hexadecimal: each byte written as two digits, from zero to nine and A to F."
[[acronym]]
short = "%2e, %2f"
long = "percent-encoding: %2e is a dot, %2f is a slash"
say = "Percent encoding writes a character as a percent sign and its hex value. Percent two e is a dot, percent two f is a slash."
[[acronym]]
short = "URL, URI"
long = "Uniform Resource Locator / Identifier: a web address"
say = "U R L is uniform resource locator, and U R I is uniform resource identifier. Both mean a web address."
[[acronym]]
short = "HTTP, HTTPS"
long = "HyperText Transfer Protocol (Secure): how browsers and servers talk"
say = "H T T P is hypertext transfer protocol: how a browser and a server talk. H T T P S is the same, encrypted."
[[acronym]]
short = "GET, POST"
long = "HTTP methods: fetch something; send something"
say = "Get asks the server for something. Post sends something to it, like an uploaded file."
[[acronym]]
short = "200, 302, 400, 404, 413"
long = "HTTP status: OK; redirect; bad request; not found; too large"
say = "Two hundred means O K. Three oh two is a redirect. Four hundred is a bad request, four oh four not found, and four thirteen content too large."
[[acronym]]
short = "CWE"
long = "Common Weakness Enumeration: CWE-22, -434, -601"
say = "C W E is the common weakness enumeration. Twenty two is path traversal, four thirty four unrestricted upload, and six oh one open redirect."
[[acronym]]
short = "KB"
long = "kilobyte: 1024 bytes"
say = "K B is a kilobyte: one thousand and twenty four bytes."
[[acronym]]
short = "API"
long = "Application Programming Interface: the calls a library offers"
say = "A P I is application programming interface: the calls a library offers to your code."
