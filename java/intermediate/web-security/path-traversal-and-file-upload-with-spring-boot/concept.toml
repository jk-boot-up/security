residual = "A file inside the folder that is not meant for this customer"

[[threat]]
id = "T2"
stride = "T"
threat = "An upload keeps the customer's name or type and overwrites a file or serves a script"
where = "`NaiveUploads`"
control = "A server-made name, a type from the bytes, a download with nosniff, and size limits"
residual = "A harmful file that is a valid image"

[[threat]]
id = "T3"
stride = "S"
threat = "A return address sends the customer to an attacker's site"
where = "`ReturnLink.naive`"
control = "Only a path on this site, and an exact host match where an absolute address is needed"
residual = "A path on this site that itself redirects"

