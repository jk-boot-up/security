    { id = "unsafe", label = "UnsafeSearch", sub = ["search(term, sort)"], col = 0, row = 1, colour = "red" },
    { id = "safe", label = "SafeSearch", sub = ["search(term, sort)"], col = 1, row = 1, colour = "client" },
