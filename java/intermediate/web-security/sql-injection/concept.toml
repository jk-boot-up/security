[threatmodel]
scope = """
An online store's product search and sort, and the database user it runs as. It covers input that reaches a SQL statement.
It does not cover a compromised server, stolen database passwords, or injection into other interpreters.
"""
assets = [
    "Customer accounts and password hashes.",
    "Unlisted products and orders.",
    "The products table's integrity.",
]
actors = [
    "An honest customer.",
    "An attacker who can type into the search box and the sort option.",
]
boundaries = [
    "Customer to search page: all input is untrusted.",
    "Search page to database: the statement crosses it, and the database cannot tell the program's text from the customer's.",
]
assumptions = [
    "The driver or framework binds parameters as data.",
    "The database enforces the rights of its users.",
]
out_of_scope = [
    "Injection through ORMs: sql-injection-with-hibernate-and-postgres.",
    "Password storage: the beginner passwords project.",
]
tests = [
    "`SqlInjectionTest` checks the three attacks, the fixed search, the sort list, the refused second statement and the least-privilege user.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next project, server-side-request-forgery, moves from the database to the network: a customer makes the server fetch an address.
"""

[[threat]]
id = "T1"
stride = "T"
threat = "Text typed into the search changes the meaning of the statement"
where = "`UnsafeSearch.search`"
control = "A fixed statement with parameters (`SafeSearch`)"
residual = "Any other place that still joins text into a statement"

[[threat]]
id = "T2"
stride = "I"
threat = "A union appends the users table to the answer"
where = "`UnsafeSearch.search`"
control = "Parameters, and a search user without rights on users"
residual = "A user with wider rights makes a later mistake costly"

[[threat]]
id = "T3"
stride = "T"
threat = "The sort option carries SQL, which a parameter cannot hold"
where = "`SafeSearch`, `SortColumn`"
control = "The column is chosen from a list; anything else falls back"
residual = "The list must follow the schema"

[[threat]]
id = "T4"
stride = "E"
threat = "A vulnerable query runs with more rights than the page needs"
where = "`Shop.searchConnection`"
control = "A database user that may read only products"
residual = "Rights granted later to the same user"

[poster]
headline = [["SQL INJECTION", "text"], ["AND ITS DEFENCES", "accent"]]
taglines = [["Text typed by a customer must never become code", "gold"]]
before = { code = "search 'kettle' -> [Blue Kettle, Red Kettle]", note = "A search that works", tag = "BEFORE" }
after = { code = "WHERE name LIKE ?", note = "Few rights limit the damage", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "SQL Injection and Its Defences"
narration = "Hello, and welcome. [[slnc 400]] This video explains S Q L injection and its defences, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] S Q L injection happens when a program builds a database statement by pasting in text that someone typed. [[slnc 300]] A single quote in that text can end the words, and everything after it is read as a command. [[slnc 600]] Think of a waiter who writes your order on a slip for the kitchen. [[slnc 300]] If you may dictate the slip word for word, you can say: a soup, and also hand over the key to the safe. [[slnc 300]] It arrives in the waiter's handwriting, and the kitchen obeys. [[slnc 300]] With a printed form, you can only fill in the blanks. [[slnc 600]] Our example is an online store and its product search."

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online store has a product search.", "Customers type words and choose a sort order.", "", "The first version pastes those words", "into the database statement.", "", "The demo's small SQL engine is plain Java."]
narration = "Here is the scenario. [[slnc 400]] An online store has a search box for its products, and a choice of sort order. [[slnc 500]] The first version builds the database statement by pasting the customer's words straight into it. [[slnc 600]] To keep everything inside the Java development kit, the demo runs a small S Q L engine written in plain Java. [[slnc 300]] It reads a statement the way a real database does, word by word, and it knows which tables each database user may read."

[[scene]]
key = "02-words"
kind = "bullets"
title = "The Words"
body = ["Statement: the text sent to the database", "Parameter (?): a slot filled with a value", "Comment (--): the rest is ignored", "UNION: adds a second query's rows", "Database user: an account with rights"]
narration = """Before the demos, the words. [[slnc 500]] A statement is the text a program sends to the database. [[slnc 500]] A parameter, written as a question mark, is a slot that is filled with a value, separately. [[slnc 500]] Two dashes start a comment: the database ignores the rest. [[slnc 500]] Union adds the rows of a second query. [[slnc 500]] And a database user is an account, with rights on certain tables."""

[[scene]]
key = "02-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "02-code-and-data"
kind = "figure"
title = "Code and data in one string"
body = "code_vs_data"
narration = """Let's see the whole idea on one picture. [[slnc 400]] The program writes a statement, and leaves a gap between two quotes for the customer's words. [[slnc 700]] An honest word, kettle, stays inside the quotes. [[slnc 300]] The database reads it as data: a name to look for. [[slnc 700]] But the customer can type a quote too. [[slnc 300]] That quote closes the string early. [[slnc 300]] Whatever follows is read as part of the statement: code, written by the customer. [[slnc 700]] That is S Q L injection. [[slnc 300]] The fix is to never put the words into the text at all, and send them separately."""

[[scene]]
key = "03-acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "04-costs"
kind = "bullets"
title = "What It Costs"
body = ["Names cannot be parameters:", "  a sort column needs a fixed list", "Parameters protect values, not the whole design", "Least privilege needs a database user per job", "Detailed error messages help attackers"]
narration = "Nothing is free. [[slnc 400]] Here is what the defences cost. [[slnc 500]] A parameter can carry a value, but never a name. [[slnc 300]] So a sort column or a table name must be picked from a fixed list in the code. [[slnc 500]] Parameters protect the values in a statement, but a query that is built badly in other ways still needs care. [[slnc 500]] Least privilege means a separate database user for each job, and someone has to manage those users. [[slnc 500]] And a detailed database error shown on the page teaches an attacker how the statement looks, so errors stay in the log."

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["A PreparedStatement with ? in the text", "An ORDER BY built from a request value", "A scanner finding: SQL injection, CWE-89", "A shop page that shows a database error"]
narration = "You have probably met this already. [[slnc 400]] A PreparedStatement, with question marks where the values go, is the defence at work. [[slnc 500]] An order by clause built from a value in the request is the place where parameters cannot help. [[slnc 500]] A security scanner's finding called S Q L injection, number eighty-nine in the common weakness list, is this exact flaw. [[slnc 500]] And a shop page that shows a raw database error is often the first clue an attacker gets."

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Every value travels as a parameter", "Every name comes from a fixed list", "One database user per job, with few rights", "Errors go to the log, not the page"]
narration = "So, how do you use it? [[slnc 400]] Send every value as a parameter, with the driver's or the framework's own binding, never by pasting text. [[slnc 500]] Choose every name, like a sort column or a table, from a fixed list in the code. [[slnc 500]] Give each application its own database user, with only the rights it needs. [[slnc 500]] And keep database errors in the log, not on the page."

[[scene]]
key = "12-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a filter by maximum price", "and keep the statement fixed."]
narration = "That's S Q L injection. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] A statement that includes a customer's text can be rewritten by that text, so statements are fixed, values are parameters, names come from a list, and the database user can do very little. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a filter by maximum price, and keep the statement fixed. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] A small S Q L engine in plain Java plays the database, so every run is the same. [[slnc 300]] Here are the classes that matter."""

[[class]]
name = "UnsafeSearch"
what = "the first version: the words pasted into the statement"
[[class.part]]
title = "string concatenation"
code = """
static String statement(String term, String sort) {
    return "SELECT name, price FROM products WHERE name LIKE '%" + term + "%' AND listed = 1 ORDER BY " + sort;
"""
speech = """The first version builds the statement with plus signs. [[slnc 300]] Whatever the customer typed becomes part of the S Q L text, quotes and all."""

[[class]]
name = "SafeSearch"
what = "the fix: a fixed statement and a parameter"
[[class.part]]
title = "a ? and a separate value"
code = """
return db.query(statement(sort), "%" + term + "%");
...
return "SELECT name, price FROM products WHERE name LIKE ? AND listed = 1 ORDER BY " + SortColumn.parse(sort).column();
"""
speech = """The fix keeps the statement fixed, with a question mark. [[slnc 300]] The words are passed as a separate value, so they can never become code. [[slnc 300]] The sort column comes from the list."""

[[class]]
name = "SortColumn"
what = "the only columns a customer may sort by"
[[class.part]]
title = "a fixed list, and a default"
code = """
for (SortColumn c : values()) {
    if (c.name().equals(text == null ? "" : text.toUpperCase(Locale.ROOT))) {
        return c;
    }
}
return NAME;
"""
speech = """A column name cannot be a parameter. [[slnc 300]] So the sort value is compared with a fixed list. [[slnc 300]] Anything not on it gets the default, and no error message that would teach the schema."""

[[class]]
name = "MiniDb"
what = "the small SQL engine, with grants per database user"
[[class.part]]
title = "rights per table"
code = """
if (!grants.contains(table)) {
    throw new SqlException("permission denied for table " + table);
"""
speech = """The engine checks every table a statement reads against the user's grants. [[slnc 300]] The search user is granted only products, so the users table is refused."""

[[acronym]]
short = "SQL"
long = "Structured Query Language: the language of database statements"
say = "S Q L is structured query language: the language a program uses to ask a database for rows."
[[acronym]]
short = "UNION, LIKE, ORDER BY"
long = "SQL words: add another query's rows; match a pattern; sort"
say = "Union adds the rows of another query. Like matches a pattern, where a percent sign stands for any text. Order by sorts the rows."
[[acronym]]
short = "OR, AND, DROP TABLE"
long = "SQL words: either condition; both conditions; delete a whole table"
say = "Or keeps a row when either condition holds. And keeps it only when both hold. Drop table deletes a whole table."
[[acronym]]
short = "CWE"
long = "Common Weakness Enumeration: CWE-89 is SQL injection"
say = "C W E is the common weakness enumeration. Number eighty nine is S Q L injection."
