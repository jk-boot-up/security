# concept.toml: everything about this project that is not Java code.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "sql-injection"
level = "intermediate"
module = "web-security"
title = "SQL Injection and Its Defences"
short_title = "SQL Injection"
package = "sqli"
main_class = "SqlInjectionDemo"
tagline = "Text typed by a customer must never become code"
bold = "A search box that pastes the customer's words into a SQL statement lets a quote turn those words into commands, so the statement must be fixed text, the words must travel as parameters, names must come from a list, and the database user must be able to do very little."
domain = "an online store"
domain_note = ""
youtube_description = "SQL injection and its defences, in Java. When a search page pastes a customer's words into a SQL statement, a single quote can end the text the program opened and turn the rest of the words into commands: a hidden product appears, and a UNION adds the customers' e-mail addresses to the results. Explained with an online store and its product search, like a waiter who lets the customer dictate the kitchen's order slip word for word. We watch a working search fail, then fix it with parameters, choose the sort column from a fixed list, and connect as a database user that can read only products. We finish with the cost: names cannot be parameters, and least privilege needs a separate database user for each job."
thumb_lines = ["SQL INJECTION", "AND ITS DEFENCES"]
thumb_code = "WHERE name LIKE ?"
youtube_title = "SQL Injection and Its Defences in Java"
youtube_tags = ["sql injection", "prepared statements", "owasp top 10", "java", "application security"]

[readme]
intro = """
A database reads a statement as one piece of text and splits it into words and symbols before it acts. If a program builds that text by pasting a
customer's input into it, a single quote closes the string the program opened, and everything after it is read as **SQL code**, not as the customer's words.
That is **SQL injection**: the customer is no longer searching, but writing part of the program.

The defences, in the order this project shows them:
- **Parameters** (prepared statements): the statement is fixed text with `?` holes, and the values travel separately. A value is never parsed as SQL.
- **Allow-lists for names**: a column or table name cannot be a parameter, so a sort column is chosen from a fixed list.
- **Least privilege**: the database user for the search page can read only the product table, so a mistake elsewhere leaks little.
- **No stacked statements**: one call runs one statement.

**Maps to:** OWASP Top 10 (2025) A05 Injection · CWE-89 · OWASP ASVS 5.0, the validation and sanitization chapter (parameterized queries).
"""
analogy = """
Think of a waiter who writes the order on a slip for the kitchen. If the customer may dictate the slip word for word, "a soup, and also give me
the safe's key" ends up on it in the waiter's handwriting, and the kitchen obeys. With a printed form, the customer can only fill the blanks.
"""
scenario = """
An online store has a product search with a sort option. The demo runs a small SQL engine written in plain Java, so the whole story fits the JDK alone: it
tokenizes a statement the way a real database does, supports `UNION`, `--` comments and `?` parameters, and checks which tables a database user may read.
"""
costs = [
    "**Names cannot be parameters.** A sort column or table name must be checked against a list, which has to be kept in step with the schema.",
    "**Parameters do not fix everything.** A `LIKE` pattern still treats `%` and `_` in the customer's text as wildcards unless they are escaped.",
    "**Least privilege needs separate database users** and a schema that does not put everything in one place.",
    "**Dynamic reports are hard.** Queries built from many optional filters need a builder that adds fixed fragments and parameters, never raw text.",
    "**Error messages teach attackers.** Showing the database's message hands out table and column names.",
]
too_much = """
A fixed query with a parameter for every value is enough for most pages. Escaping quotes by hand is not a defence: it is easy to miss one case,
and the right fix is the parameter. Do not add a web application firewall as a substitute for fixing the query.
"""
met_before = [
    "`PreparedStatement` and `?` placeholders in JDBC, and named parameters in `JdbcTemplate`.",
    "`' OR '1'='1` in every list of attack strings.",
    "Breach reports that begin with a search box or a login form.",
    "A finding titled \"SQL Injection\" with CWE-89.",
]
where = """
This project is in [web-security](..) and builds on [input-validation](../../secure-coding/input-validation), which showed why input is checked,
and the beginner [authentication-vs-authorization](../../../beginner/identity/authentication-vs-authorization) project.
"""
twin = """
The database is a small Java SQL engine, not a real product. It has the behaviour that matters for injection: statements are split into tokens first,
`--` ends a statement, `UNION` appends rows, a `;` starts a second statement that is refused, and a database user has a list of readable tables.
"""
test_note = "All data is fixed, so the demo prints the same text on every run."

[[act]]
title = "A search that works"
summary = "The products table holds four products, one of them not for sale; the customer types kettle and price; the statement as built finds the Blue Kettle and the Red Kettle."
detail = """
The products table holds four rows: the Blue Kettle at 2500 cents, the Red Kettle at 2900, the Copper Pan at 4200, all listed, and the Prototype Toaster at 9900, which is not for sale (listed = 0).
The customer types kettle in the search box and chooses price in the sort box. The first version pastes both into the statement: SELECT name, price FROM products WHERE name LIKE '%kettle%' AND listed = 1 ORDER BY price.
The result is the Blue Kettle and the Red Kettle. Nothing looks wrong, which is why the flaw survives testing.
"""
figure = "products_table"
figure_title = "Four products, one search, two kettles"
figure_speech = """
First demo: a search that works. [[slnc 400]] On the left, the products table. [[slnc 300]] Four products, each with a price in cents, and a listed flag. [[slnc 300]] The prototype toaster is not for sale, so its flag is zero. [[slnc 700]]
On the right, the search. [[slnc 300]] The customer types kettle, and chooses to sort by price. [[slnc 300]] The program pastes the word kettle between the two quotes, in the statement. [[slnc 600]] The database keeps rows whose name contains kettle, and whose listed flag is one. [[slnc 300]] Two kettles come back, cheapest first. [[slnc 700]]
Nothing looks wrong. [[slnc 300]] That is why this flaw survives testing.
"""
speech = """
Here is the real output. [[slnc 400]] The table: four products, and the toaster is not for sale. [[slnc 400]] The input: kettle, and price. [[slnc 400]] The statement as built, with kettle pasted between the quotes. [[slnc 400]] And the result: the blue kettle and the red kettle.
"""
rows = { paste = "active ok" }
console = [
    ["THE TABLE products (name, price in cents, listed):", "amber"],
    ["  Blue Kettle         2500  1", "muted"],
    ["  Red Kettle          2900  1", "muted"],
    ["  Copper Pan          4200  1", "muted"],
    ["  Prototype Toaster   9900  0  <- NOT FOR SALE", "amber"],
    ["THE INPUT (search box, sort box):", "code"],
    ["  kettle    price", "muted"],
    ["THE STATEMENT AS BUILT (the input pasted in):", "code"],
    ["  SELECT name, price FROM products", "code"],
    ["  WHERE name LIKE '%kettle%' AND listed = 1", "code"],
    ["  ORDER BY price", "code"],
    ["THE RESULT:", "code"],
    ["  [Blue Kettle, Red Kettle]", "muted"],
]

[[act]]
title = "A quote turns text into code"
summary = "zzz' OR listed = 0 -- reveals the unlisted Prototype Toaster; a UNION with the users table lists customers' e-mail addresses; a second statement after ; is refused only because this engine runs one statement per call."
detail = """
The input zzz' OR listed = 0 -- is pasted in. Its quote closes the string early, OR listed = 0 adds a condition of the attacker's choosing, and -- turns the rest of the statement, %' AND listed = 1 ORDER BY name, into a comment. The result is the Prototype Toaster, which is not for sale.
The input zzz' UNION SELECT email, password_hash FROM users -- closes the string the same way and appends a second query on the users table. The page now lists ana@shop.example and ben@shop.example.
The sort box value price; DROP TABLE products ends the statement and starts another. It is refused with unexpected ';' (one statement only), but only by luck: this engine, like most drivers, runs one statement per call.
"""
figure = "quote_breakout"
figure_title = "Where the customer's text ends up in the statement"
figure_speech = """
Second demo: a quote turns text into code. [[slnc 400]] Each row is one statement, exactly as it was built. [[slnc 300]] White is the program's own text. [[slnc 300]] Red is what the customer typed. [[slnc 300]] Grey is commented out. [[slnc 700]]
In the first, the customer's quote closes the string early. [[slnc 300]] Then or listed equals zero becomes a real condition. [[slnc 300]] And the two dashes turn the rest into a comment, including the check for listed products. [[slnc 300]] The unlisted toaster comes back. [[slnc 700]]
In the second, union select adds a whole second query, on the users table. [[slnc 300]] The page lists customers' e-mail addresses. [[slnc 700]]
In the third, the sort box ends the statement, and starts a new one. [[slnc 300]] It is refused, but only because this engine runs one statement at a time.
"""
speech = """
Here is the output, one attack per page. [[slnc 400]] The input: z z z, quote, or listed equals zero, dash dash. [[slnc 400]] The statement as built: the quote closes the string, and the rest becomes a comment. [[slnc 400]] The result: the prototype toaster, which is not for sale.
[[page]]
The union attack. [[slnc 300]] The statement now ends with a second query on the users table. [[slnc 400]] The result: two customers' e-mail addresses.
[[page]]
The sort box attack. [[slnc 300]] Drop table products is added after a semicolon. [[slnc 400]] It is refused. [[slnc 300]] But only by luck: this engine runs one statement per call.
"""
rows = { inject = "active wrong" }
console = [
    ["THE INPUT (search box, sort box):", "code"],
    ["  zzz' OR listed = 0 --    name", "muted"],
    ["THE STATEMENT AS BUILT (the input pasted in):", "code"],
    ["  SELECT name, price FROM products", "code"],
    ["  WHERE name LIKE '%zzz' OR listed = 0", "code"],
    ["  --%' AND listed = 1 ORDER BY name", "muted"],
    ["THE RESULT:", "code"],
    ["  [Prototype Toaster]  <- AN UNLISTED PRODUCT", "bad"],
    ["---", ""],
    ["THE INPUT (search box, sort box):", "code"],
    ["  zzz' UNION SELECT email, password_hash FROM users --    name", "muted"],
    ["THE STATEMENT AS BUILT (the input pasted in):", "code"],
    ["  SELECT name, price FROM products", "code"],
    ["  WHERE name LIKE '%zzz'", "code"],
    ["  UNION SELECT email, password_hash FROM users", "code"],
    ["  --%' AND listed = 1 ORDER BY name", "muted"],
    ["THE RESULT:", "code"],
    ["  [ana@shop.example, ben@shop.example]  <- CUSTOMERS' E-MAILS", "bad"],
    ["---", ""],
    ["THE INPUT (search box, sort box):", "code"],
    ["  kettle    price; DROP TABLE products", "muted"],
    ["THE STATEMENT AS BUILT (the input pasted in):", "code"],
    ["  SELECT name, price FROM products", "code"],
    ["  WHERE name LIKE '%kettle%' AND listed = 1", "code"],
    ["  ORDER BY price; DROP TABLE products", "code"],
    ["THE RESULT:", "code"],
    ["  refused: unexpected ';' (one statement only)", "ok"],
    ["stopped by luck: this engine runs one statement per call", "amber"],
]

[[act]]
title = "Parameters keep text as text"
summary = "The fixed statement has a ? for the words and a sort column from a list of two: kettle still finds two kettles, both attacks find nothing, and the bad sort value falls back to ORDER BY name."
detail = """
The fixed statement is constant text: SELECT name, price FROM products WHERE name LIKE ? AND listed = 1 ORDER BY a column taken from a list of two, name or price. The customer's words travel separately, as the value of the ?.
kettle still finds the Blue Kettle and the Red Kettle. zzz' OR listed = 0 -- and the UNION input are now just words that no product name contains: no results.
A column name cannot be a ?, so the sort box is checked against the list. price; DROP TABLE products is not on it, so the statement uses ORDER BY name, the default, and the search still answers with the two kettles.
"""
figure = "parameter_slot"
figure_title = "The statement is fixed; the input fills one slot"
figure_speech = """
Third demo: parameters keep text as text. [[slnc 400]] At the top, the statement. [[slnc 300]] It never changes. [[slnc 300]] Where the words used to be pasted, there is a question mark: a slot for one value. [[slnc 700]]
Below, the three inputs. [[slnc 300]] Each one goes into the slot as plain text. [[slnc 300]] Kettle matches two products. [[slnc 300]] The quote attack and the union attack are just long, strange names. [[slnc 300]] No product is called that, so nothing comes back. [[slnc 700]]
On the right, the sort box. [[slnc 300]] A column name cannot be a slot. [[slnc 300]] So it is picked from a list of two. [[slnc 300]] Anything else gets the default: name.
"""
speech = """
Here is the output. [[slnc 400]] The fixed statement, with a question mark for the words. [[slnc 400]] Then the three inputs as the value of the question mark. [[slnc 300]] Two kettles, no results, and no results.
[[page]]
The sort box. [[slnc 300]] Price, semicolon, drop table products is not on the list. [[slnc 300]] So the statement orders by name, the default, and the two kettles come back.
"""
rows = { param = "active ok", allow = "active ok" }
console = [
    ["THE STATEMENT (fixed text; the words travel separately):", "code"],
    ["  SELECT name, price FROM products", "code"],
    ["  WHERE name LIKE ? AND listed = 1", "code"],
    ["  ORDER BY <name or price, from a list>", "code"],
    ["THE INPUTS AND RESULTS (each input is the value of ?):", "code"],
    ["  kettle", "muted"],
    ["    -> [Blue Kettle, Red Kettle]", "ok"],
    ["  zzz' OR listed = 0 --", "muted"],
    ["    -> [no results]", "ok"],
    ["  zzz' UNION SELECT email, password_hash FROM users --", "muted"],
    ["    -> [no results]", "ok"],
    ["---", ""],
    ["THE SORT BOX (a column name cannot be a ?):", "code"],
    ["  price; DROP TABLE products is not on the list", "muted"],
    ["    -> ORDER BY name, the default", "ok"],
    ["    -> [Blue Kettle, Red Kettle]", "ok"],
]

[[act]]
title = "Few rights limit the damage"
summary = "If a statement is still built by pasting, a search user that may read only products gets permission denied for the users table; the quote attack still shows the toaster, because only parameters fix the flaw."
detail = """
Two database users: admin may read products, users and orders; search may read only products, which is all the search page needs.
The union attack, still pasted in: as admin it lists ana@shop.example and ben@shop.example; as search it is refused with permission denied for table users.
The quote attack, as search, still shows the Prototype Toaster, because it only reads the products table. Few rights limit the damage of a mistake; only parameters fix the flaw.
"""
figure = "db_users"
figure_title = "Two database users, and what the same mistake reaches"
figure_speech = """
Fourth demo: few rights limit the damage. [[slnc 400]] Two database users, and the three tables. [[slnc 300]] Admin may read all three. [[slnc 300]] Search may read only products, which is all a search page needs. [[slnc 700]]
Now suppose someone writes a pasted statement again. [[slnc 300]] The union attack, as admin: customers' e-mails. [[slnc 300]] As search: permission denied. [[slnc 600]]
But the quote attack still works as search. [[slnc 300]] It only reads the products table, so the toaster still appears. [[slnc 600]]
Few rights limit what one mistake can reach. [[slnc 300]] Only parameters fix the mistake.
"""
speech = """
Here is the output. [[slnc 400]] The two database users, and the tables each may read. [[slnc 400]] The union attack, still pasted in: e-mails as admin, and permission denied as search. [[slnc 400]] The quote attack as search: still the toaster. [[slnc 400]] Few rights limit the damage. [[slnc 300]] Only parameters fix the flaw.
"""
rows = { grants = "active ok" }
console = [
    ["THE TWO DATABASE USERS (the tables each may read):", "code"],
    ["  admin   products, users, orders", "muted"],
    ["  search  products", "muted"],
    ["THE UNION ATTACK, STILL PASTED IN:", "code"],
    ["  as admin   [ana@shop.example, ben@shop.example]", "muted"],
    ["  as search  refused: permission denied for table users", "muted"],
    ["THE QUOTE ATTACK, AS search:", "amber"],
    ["  [Prototype Toaster]  <- STILL WORKS", "bad"],
    ["few rights limit the damage; only parameters fix the flaw", "amber"],
]

