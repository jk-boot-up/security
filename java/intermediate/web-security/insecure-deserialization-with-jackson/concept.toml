[threatmodel]
scope = """
A JSON cart cookie read by Jackson 3 in an online store. It covers class selection by the data, prices in the data, and the size and depth of the data. It does not cover signing the cookie or the other uses of Jackson in the application.
"""
assets = [
    "The shop's files and processes.",
    "The correctness of order totals.",
    "The server's memory and stack.",
]
actors = [
    "The customer, who controls the cookie.",
    "A developer who adds polymorphic fields or default typing.",
]
boundaries = [
    "The cookie to the mapper: all of it is untrusted, including type ids and prices.",
]
assumptions = [
    "A class with a side effect in a setter or constructor is on the classpath.",
    "Jackson and its validator are current.",
]
out_of_scope = [
    "Real gadget chains in third-party libraries.",
    "Java's built-in serialization.",
]
tests = [
    "`JacksonDeserializationTest` checks each configuration against the gadget, the forged price, the data-only request, the limits and bad input, with a marker file.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next project in this module, path-traversal-and-file-upload, moves to file names that the customer supplies.
"""

[[threat]]
id = "T1"
stride = "E"
threat = "The data names a class and the mapper builds it"
where = "`Cart`, `Mappers.anyClassMayBeNamed`"
control = "Type ids by name from a list on the field, or a validator that lists classes"
residual = "A future field with class-name typing"

[[threat]]
id = "T2"
stride = "T"
threat = "A value such as a price is changed in the cookie"
where = "`Cart`"
control = "Data-only requests, priced by the shop from its own catalogue"
residual = "Any other value the server trusts"

[[threat]]
id = "T3"
stride = "D"
threat = "Deeply nested or huge input exhausts memory or stack"
where = "`Mappers.strictRequest`"
control = "Stream limits for depth, text and number length"
residual = "Many large requests together"

[poster]
headline = [["JACKSON", "text"], ["DESERIALIZATION", "accent"]]
taglines = [["JSON is data until a type id tells Jackson which class to build, and then the cookie is ch", "gold"]]
before = { code = "\"@class\": \"...TempCleaner\"", note = "The cookie names the class", tag = "BEFORE" }
after = { code = "@JsonTypeInfo(use = NAME)", note = "A list of kinds, kept in the code", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "Insecure Deserialization with Jackson"
narration = "Hello, and welcome. [[slnc 400]] This video explains insecure deserialization with Jackson, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] Jackson reads J S O N into Java objects. [[slnc 300]] Usually the code decides which class to build. [[slnc 300]] But if a field is allowed to carry a class name, the data decides, and whoever writes the data chooses which class the server builds. [[slnc 600]] Think of a factory that assembles whatever part is named on the box. [[slnc 300]] If the customer writes the label, the customer chooses the part. [[slnc 600]] Our example is an online store that keeps the cart in a J S O N cookie."

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online store keeps the cart in a JSON cookie:", "lines, prices, and a note.", "", "The note may be of several kinds.", "", "The demo writes forged cookies by hand,", "and reads them with differently set-up", "Jackson 3 mappers."]
narration = "Here is the scenario. [[slnc 400]] An online store keeps each customer's cart in a J S O N cookie: the lines, their prices, and a note, which may be of several kinds. [[slnc 600]] The demo builds an honest cart. [[slnc 300]] Then it writes forged cookies by hand, as anyone who owns a browser could, and reads them with Jackson three mappers that are set up in different ways."

[[scene]]
key = "02-words"
kind = "bullets"
title = "The Words"
body = ["Deserialize: JSON text becomes Java objects", "Mapper: Jackson's reader and writer", "Type id: the part of the JSON that picks a class", "Polymorphic field: may hold several classes", "Validator: decides which classes may be built", "Gadget: a class that does harm when built"]
narration = """Before the demos, the words. [[slnc 500]] To deserialize is to turn J S O N text into Java objects. [[slnc 500]] In Jackson, a mapper does the reading and the writing. [[slnc 500]] A type id is the part of the J S O N that says which class to build. [[slnc 500]] A polymorphic field is one that may hold objects of several classes. [[slnc 500]] A validator decides which of those classes may be built. [[slnc 500]] And a gadget is a class that does harm just by being built."""

[[scene]]
key = "02-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "02-json-names-class"
kind = "figure"
title = "The JSON names the class"
body = "json_names_class"
narration = """Let's see the whole idea on one picture. [[slnc 400]] At the top, an honest note, as J S O N. [[slnc 300]] The amber line is a type id: at class, followed by the name of a Java class. [[slnc 300]] Jackson reads that name, and builds a gift note. [[slnc 700]] But the customer holds the cookie, and can write any name there. [[slnc 300]] Below, a forged note names TempCleaner. [[slnc 300]] Jackson builds that class too, and as it sets the path, the class deletes a file. [[slnc 700]] That is insecure deserialization with Jackson. [[slnc 300]] When the data may carry a class name, whoever writes the data chooses the class the server builds."""

[[scene]]
key = "03-acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "04-costs"
kind = "bullets"
title = "What It Costs"
body = ["Lists of names and classes must keep up with the code", "The default validator is a floor, not a design", "Strict binding refuses clients that send extra fields", "Pricing on the server needs a catalogue", "Tight limits can refuse a large honest request"]
narration = "Nothing is free. [[slnc 400]] Here is what the defences cost. [[slnc 500]] A list of type names, or of allowed classes, has to keep up with the code. [[slnc 500]] Jackson's default validator is a floor to stand on, not a design. [[slnc 500]] Strict binding refuses any client that sends an extra field, even a harmless one. [[slnc 500]] Pricing on the server needs the shop's own catalogue. [[slnc 300]] And tight limits on the stream can refuse a large but honest request."

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["activateDefaultTyping in a mapper's set-up", "@JsonTypeInfo(use = CLASS) on a field", "A Jackson gadget CVE in a security feed"]
narration = "You have probably met this already. [[slnc 400]] A call to activate default typing in a mapper's set-up switches class names on for almost everything. [[slnc 500]] A Jackson type info annotation that uses the class name puts the choice in the data. [[slnc 500]] And the long series of Jackson gadget C V Es in security feeds are all this same idea, with different risky classes."

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Never take class names from client data", "Polymorphic field: short names from a list,", "  or a validator that lists classes", "Bind client requests strictly", "Prices come from the server", "Keep stream limits tight"]
narration = "So, how do you use it? [[slnc 400]] Never let client data carry a class name. [[slnc 500]] When a field really can hold several kinds, use short names from a list kept in the code, or a validator that lists the allowed classes. [[slnc 500]] Better still, send plain data with no types at all. [[slnc 500]] Bind client requests strictly, so an unknown field is refused. [[slnc 300]] Let the server decide prices. [[slnc 300]] And keep the limits on the stream tight."

[[scene]]
key = "12-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a third kind of note", "and see which fix needs a change."]
narration = "That's insecure deserialization with Jackson. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Jackson builds the class that the data names whenever a field is typed by a name or a class, so the type must come from a list kept in the code, and values such as prices must never come from the client. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a third kind of note, and see which of the fixes needs a change. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] Everything is real Jackson three: the type handling, the validator and the limits. [[slnc 300]] Here are the classes that matter."""

[[class]]
name = "Cart"
what = "the first version: a note typed by class name"
[[class.part]]
title = "@JsonTypeInfo(use = CLASS)"
code = """
public record Cart(List<Line> lines,
        @JsonTypeInfo(use = JsonTypeInfo.Id.CLASS) Note gift) {
"""
speech = """The cart is a record with its lines and a note. [[slnc 300]] The note field is typed by class name. [[slnc 300]] So the J S O N says which class to build, and any class that implements Note will do."""

[[class]]
name = "TempCleaner"
what = "the gadget: a note that deletes a file when built"
[[class.part]]
title = "a setter with a side effect"
code = """
public class TempCleaner implements Note {
    public void setPath(String path) {
        try {
            Files.deleteIfExists(Path.of(path));
"""
speech = """TempCleaner stands for a class from another team's plug in. [[slnc 300]] It implements Note. [[slnc 300]] Jackson calls its setter while building it, and the setter deletes the file."""

[[class]]
name = "TypedCart"
what = "fix one: short names from a list on the field"
[[class.part]]
title = "@JsonSubTypes"
code = """
@JsonTypeInfo(use = JsonTypeInfo.Id.NAME, property = "type")
@JsonSubTypes({
        @JsonSubTypes.Type(value = Note.Gift.class, name = "gift"),
        @JsonSubTypes.Type(value = Note.Coupon.class, name = "coupon")})
Note gift) {
"""
speech = """The note is typed by a short name. [[slnc 300]] The list of names lives in the code: gift and coupon. [[slnc 300]] Any other type id is unknown, and refused."""

[[class]]
name = "Mappers"
what = "the Jackson set-ups, each line a decision"
[[class.part]]
title = "any class, or only our notes"
code = """
PolymorphicTypeValidator anything =
        BasicPolymorphicTypeValidator.builder()
        .allowIfSubType(Object.class).build();
return JsonMapper.builder()
        .activateDefaultTyping(anything, DefaultTyping.NON_FINAL).build();
...
.allowIfSubType(Note.Gift.class)
.allowIfSubType(Note.Coupon.class)
"""
speech = """The trap: default typing, with a validator that allows every class. [[slnc 300]] Fix two keeps class names, but the validator allows only the two note classes."""
[[class.part]]
title = "strict binding and tight limits"
code = """
.streamReadConstraints(StreamReadConstraints.builder()
        .maxNestingDepth(10).maxStringLength(64)
        .maxNumberLength(10).build())
...
.enable(DeserializationFeature.FAIL_ON_UNKNOWN_PROPERTIES)
"""
speech = """For the data-only request, the limits are tightened to what a cart needs. [[slnc 300]] And an unknown property, like a price or a class name, is an error."""

[[class]]
name = "OrderRequest"
what = "fix three: codes and quantities only"
[[class.part]]
title = "no price, no type"
code = """
public record OrderRequest(List<Item> items) {
    public record Item(String sku, int qty) {
"""
speech = """The request holds what the customer may decide: which products, and how many. [[slnc 300]] There is no price, and no type, so there is nothing to forge. [[slnc 300]] The catalogue supplies every price."""

