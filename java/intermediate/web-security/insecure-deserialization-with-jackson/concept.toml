[[act]]
title = "A list of kinds, or a list of classes"
summary = "Short names from a list (gift, coupon) make TempCleaner an unknown type id; a validator that lists Note.Gift and Note.Coupon refuses it as a class not allowed; the marker file survives both, and the forged price is still accepted."
detail = """
The first fix types the note by a short name from a list kept on the field: gift means Note.Gift, coupon means Note.Coupon. The honest note's JSON says "type":"gift" and reads back as 2 lines, 9200 cents. A forged note whose type is TempCleaner's class name is an unknown type id: refused, and the marker file still exists.
The second fix keeps class names but gives the mapper a validator that allows only Note.Gift and Note.Coupon. The honest cart still reads; TempCleaner is refused as a class not allowed, and the file survives.
The forged price passes both, because the price is in the cookie: a list of types stops unknown classes, not lies.
"""
figure = "kinds_or_classes"
figure_title = "Two lists: names for kinds, or the allowed classes"
figure_speech = """
Third demo: a list of kinds, or a list of classes. [[slnc 400]] On the left, a list of kinds, kept in the code. [[slnc 300]] Gift means the gift class. [[slnc 300]] Coupon means the coupon class. [[slnc 300]] The honest note says type gift. [[slnc 300]] The forged note puts TempCleaner's class name in the type. [[slnc 300]] It is not on the list, so it is an unknown type. [[slnc 300]] Refused, and the file survives. [[slnc 700]]
On the right, class names stay, but a validator lists the classes that may be built. [[slnc 300]] The honest cart reads. [[slnc 300]] TempCleaner is refused: class not allowed. [[slnc 600]]
But the forged price passes both. [[slnc 300]] Its classes are all allowed. [[slnc 300]] The price is in the cookie, and a list of types cannot see a lie.
"""
