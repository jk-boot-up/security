[[act]]
title = "The cookie decides which class is built"
summary = "A forged price of 1 cent is believed; a note naming TempCleaner is built and deletes the marker file; Jackson 3 refuses an Object base type by default, but global default typing with a permissive validator builds the gadget again."
detail = """
The customer writes "price":1 into the JSON and the cart totals 2 x 1 = 2 cents.
Then a note whose @class is com.jk.explore.security.jacksondeser.TempCleaner, with a path. Jackson loads the class; it implements Note, so the default validator allows it; Jackson sets the path, and setPath deletes the file. The cookie is accepted as a note, and the marker file no longer exists.
Against an Object field, Jackson 3's default validator refuses class names: Object is too general a base type. That is a real protection, and it protects nothing else. With global default typing switched on and a validator that allows any class, as many copied examples do, the same TempCleaner is built from an Object root, and the file is gone again.
"""
figure = "class_name_trap"
figure_title = "Which note types let the cookie choose the class"
figure_speech = """
Second demo: the cookie decides which class is built. [[slnc 400]] At the top left, a lie. [[slnc 300]] The customer writes price one. [[slnc 300]] The cart totals two cents. [[slnc 700]]
Below, a forged note. [[slnc 300]] Its at class names TempCleaner, a class from another team's plug in. [[slnc 300]] Step one: Jackson loads it. [[slnc 300]] Step two: it implements the note interface, so the default validator allows it. [[slnc 300]] Step three: Jackson sets its path, and the setter deletes the file. [[slnc 700]]
On the right, three types for the note. [[slnc 300]] Typed by the shop's own interface: the file is gone. [[slnc 300]] Typed as Object, with Jackson three's defaults: refused, because Object is too general. [[slnc 300]] But with default typing switched on, and a validator that allows anything, the file is gone again.
"""
speech = """
Here is the output, one attack per page. [[slnc 400]] The input: the J S O N, with price one. [[slnc 400]] The result: one line, two times one, two cents. [[slnc 300]] A forged price is believed.
[[page]]
The forged note. [[slnc 300]] The input: at class names TempCleaner, with a path. [[slnc 400]] What Jackson does, in three steps. [[slnc 400]] The file exists before reading. [[slnc 300]] The result: accepted as a note, and the file is gone.
[[page]]
Other types for the note. [[slnc 300]] An Object, with Jackson three's defaults: refused. [[slnc 400]] An Object, with default typing on: accepted, and the file is gone.
"""
