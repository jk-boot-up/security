[[act]]
title = "Limits on the stream"
summary = "Jackson 3 allows 500 levels of nesting by default; the request mapper tightens nesting to 10, text to 64 characters and numbers to 10 digits, and each is refused with a fixed reason."
detail = """
Jackson 3's default limits are 500 levels of nesting, 100,000,000 characters of text and 1,000 digits in a number. A cookie of 5000 nested arrays is refused by the default: nesting deeper than 500.
The request mapper tightens them to what a cart needs: 10 levels, 64 characters, 10 digits. Eleven levels, a 65 character product code and the 11 digit quantity 12345678901 are each refused. These limits protect memory and the stack, not only types.
"""
figure = "stream_limits"
figure_title = "How deep, how long: the limits on the stream"
figure_speech = """
Fifth demo: limits on the stream. [[slnc 400]] On the left, three limits. [[slnc 300]] How deep the J S O N may nest. [[slnc 300]] How long a text may be. [[slnc 300]] And how many digits a number may have. [[slnc 600]] Jackson three's defaults are generous: five hundred levels, a hundred million characters, a thousand digits. [[slnc 300]] The request mapper tightens them to what a cart needs: ten levels, sixty-four characters, ten digits. [[slnc 700]]
On the right, the inputs. [[slnc 300]] Five thousand levels is refused even by the default. [[slnc 300]] Eleven levels, a sixty-five character product code, and an eleven digit quantity are refused by the tightened limits. [[slnc 600]]
Limits protect memory and the stack, whatever the types.
"""
speech = """
Here is the output. [[slnc 400]] The three limits, the default and the tightened value. [[slnc 400]] Then four inputs, each refused with a fixed reason: nesting deeper than five hundred, nesting deeper than ten, text longer than sixty-four, and a number longer than ten digits.
"""
rows = { limits = "active ok" }
console = [
