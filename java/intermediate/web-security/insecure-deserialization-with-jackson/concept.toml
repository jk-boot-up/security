# concept.toml: everything about this project that is not Java code.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "insecure-deserialization-with-jackson"
level = "intermediate"
module = "web-security"
title = "Insecure Deserialization with Jackson"
short_title = "Deserialization with Jackson"
package = "jacksondeser"
main_class = "JacksonDemo"
tagline = "JSON is data until a type id tells Jackson which class to build, and then the cookie is choosing code"
bold = "Jackson 3 reads JSON into objects, and when a field is typed by a class name taken from the data, whoever writes the cookie chooses which class is built; Jackson refuses an Object base type by default, but any other interface, or a global default-typing switch, lets a gadget class run, so the fix is a short list of names, a validator that lists classes, or data-only requests."
domain = "an online store's cart cookie"
domain_note = ""
youtube_description = "Insecure deserialization with Jackson 3: class names in JSON, default typing, type ids by name, a polymorphic type validator, data-only requests and stream limits."
thumb_lines = ["JACKSON", "DESERIALIZATION"]
thumb_code = "@JsonTypeInfo(use = NAME)"
youtube_title = "Insecure Deserialization with Jackson 3: Polymorphic Typing Traps and Their Fixes"
youtube_tags = ["jackson", "deserialization", "polymorphic typing", "gadget", "java", "application security"]

[readme]
intro = """
The plain [insecure-deserialization](../insecure-deserialization) project breaks Java's built-in serialization. This one breaks and fixes the format most Java services use today: **JSON with Jackson 3** (`tools.jackson`, version 3.1.5). The cart cookie is JSON, and the attack is the same idea: the cookie decides which class the server builds.

What it shows:
- **A note typed by class name** (`@JsonTypeInfo(use = CLASS)`) lets the cookie name any class that implements the note interface. A `TempCleaner` class on the classpath, from another team's plug-in, removes a file as a side effect of being built, and the cart never notices.
- **Jackson 3's default validator refuses** an `Object` base type for class names, which is a real protection. It does not refuse an ordinary interface, and the one-line global default typing with a permissive validator ("make polymorphism just work") builds anything.
- **Three fixes:** type ids by short name from a list on the field, a `PolymorphicTypeValidator` that lists the allowed classes, or no types in the data at all. Names and the validator stop the gadget, but a forged price in the cookie is still accepted.
- **Data only, priced by the shop:** a request of product codes and quantities refuses an unknown property (a price, a class name), and the shop prices the order from its own catalogue.
- **Limits on the stream:** nesting depth, string length and number length are bounded.

**Maps to:** OWASP Top 10 (2025) A08 Software or Data Integrity Failures · CWE-502 · CWE-915 · OWASP ASVS 5.0 V1 · OWASP Deserialization Cheat Sheet.
"""
analogy = """
A kitchen that takes written orders. If the order slip can say "make this dish using that appliance" and the kitchen does so for any appliance in the building, a customer can ask for the one that wipes the freezer. If the slip may only name a dish from the menu, the appliance is never the customer's choice.
"""
scenario = """
An online store keeps the shopping cart in a JSON cookie. The demo builds the honest cart, then writes forged cookies by hand, as a browser's owner could, and reads them with differently configured Jackson mappers.
"""
costs = [
    "**Names and validators must be kept in step with the code,** or new kinds of note are refused.",
    "**The default validator is a floor, not a design:** an ordinary interface that a gadget implements is still accepted.",
    "**Strict binding refuses clients that send extra fields,** which breaks sloppy callers.",
    "**Pricing on the server needs a catalogue lookup** for every request.",
    "**Tight stream limits can refuse a large honest request,** so measure what honest carts look like.",
]
too_much = """
For a cart, send only codes and quantities and let the server do the rest. Polymorphic types in data that comes from a client are almost never worth it.
"""
met_before = [
    "`@JsonTypeInfo(use = JsonTypeInfo.Id.CLASS)` in older code.",
    "`activateDefaultTyping(...)` in a copied configuration.",
    "A CVE for a gadget class in a Jackson-using library.",
    "`FAIL_ON_UNKNOWN_PROPERTIES` in configuration.",
]
where = """
This is the tools version of [insecure-deserialization](../insecure-deserialization), in the [web-security](..) module. It keeps the same story, the same `TempCleaner` stand-in for a gadget and the same marker file.
"""
twin = """
Everything is real Jackson 3: the mappers, the type handling, the validator and the stream limits. The gadget is a harmless stand-in that deletes a temporary marker file. Jackson's own messages carry locations, so only fixed reasons are printed.
"""
test_note = "Each test that uses a marker file creates and removes its own. The demo prints the same text on every run."

[[act]]
title = "A cart in a cookie"
summary = "A cart with a note typed by class name round-trips: 2 lines, total 9200 cents."
detail = """
The cart is a JSON cookie: two lines with their prices and a note that names its own class, so new kinds of note need no code change. The honest cart reads back with two lines and a total of 9200 cents.
"""
speech = """
First demo: a cart in a cookie. [[slnc 400]] The cart is J S O N, with two lines, their prices, and a note. [[slnc 300]] The note names its own class, so new kinds need no code change. [[slnc 600]] The honest cart reads back with a total of ninety two dollars.
"""
rows = { cart = "active ok" }
console = [
    ["cart round trip -> 2 lines, total 9200 cents", "ok"],
]

[[act]]
title = "The cookie decides which class is built"
summary = "Jackson 3 refuses class names for an Object base type, but a cookie can name a TempCleaner for a Note and the marker file is gone, and global default typing builds anything."
detail = """
Against an Object field, Jackson 3's default validator refuses class names. That is a real protection, and it protects nothing else. The note field has the shop's own interface as its type, and another team's TempCleaner class implements it, so the cookie that names TempCleaner is accepted as a
note and the file named in the cookie is deleted. The global default typing switch, with the permissive validator many examples use, builds the same class from an Object root. A forged price is accepted too.
"""
speech = """
Second demo: the cookie decides which class is built. [[slnc 400]] Against an Object field, Jackson three refuses class names. That is a real protection. [[slnc 600]] But the note field is typed by the shop's own interface. [[slnc 300]] A class from another team's plug in implements it. [[slnc 300]] The cookie names it, and the marker file is gone. [[slnc 600]] The global default typing switch builds anything.
"""
rows = { trap = "active wrong" }
console = [
    ["an Object field -> refused (the default validator denies class names for an Object)", "ok"],
    ["forged price -> 1 lines, total 2 cents", "bad"],
    ["cookie holds a TempCleaner -> accepted as a note; marker file exists afterwards: false", "bad"],
    ["global default typing, TempCleaner -> accepted as a note; marker file exists afterwards: false", "bad"],
]

[[act]]
title = "A list of kinds, or a list of classes"
summary = "Short names from a list and a validator that lists classes both refuse the gadget and leave the marker file; the forged price is still accepted."
detail = """
Typing the note by a short name from a list on the field (gift, coupon) makes TempCleaner an unknown type id: refused, and the marker file is still there. Keeping class names but giving the mapper a validator that allows only the Gift and Coupon classes refuses it as a class not allowed.
Honest carts round-trip in both. The forged price is still accepted, because the price is in the cookie: a type fix is not an integrity fix.
"""
speech = """
Third demo: a list of kinds, or a list of classes. [[slnc 400]] A short name from a list makes the gadget an unknown type. [[slnc 600]] A validator that names the allowed classes refuses it too. [[slnc 600]] The marker file survives in both. [[slnc 300]] But the forged price is still accepted, because the price is in the cookie.
"""
rows = { fix = "active ok" }
console = [
    ["names: cookie holds a TempCleaner -> refused (unknown type id); marker file exists afterwards: true", "ok"],
    ["validator: cookie holds a TempCleaner -> refused (class not allowed); marker file exists afterwards: true", "ok"],
    ["forged price -> 1 lines, total 2 cents  <- STILL ACCEPTED", "bad"],
]

[[act]]
title = "Data only, priced by the shop"
summary = "A request of codes and quantities, with unknown properties refused: a forged price, a class name, a negative quantity and an unknown product are all refused."
detail = """
The request has only product codes and quantities, and the mapper refuses an unknown property. A forged price is an unknown property, and so is a class name. A quantity of -5 and an unknown product are refused by the shop's own checks, and the total, 9200 cents, comes from the shop's catalogue.
"""
speech = """
Fourth demo: data only, priced by the shop. [[slnc 400]] The request has product codes and quantities, and nothing else. [[slnc 600]] A forged price is an unknown property. So is a class name. [[slnc 600]] A negative quantity and an unknown product are refused. [[slnc 300]] The total comes from the shop's own catalogue.
"""
rows = { data = "active ok" }
console = [
    ["order round trip -> 2 items, total 9200 cents", "ok"],
    ["forged price -> refused (unknown property price)", "ok"],
    ["a class name -> refused (unknown property @class)", "ok"],
    ["quantity -5 -> refused (quantity must be 1 to 99)", "ok"],
]

[[act]]
title = "Limits on the stream"
summary = "Nesting beyond 500 is refused by default and beyond 10 when tightened; text over 64 characters and numbers over 10 digits are refused."
detail = """
A cookie of 5000 nested arrays is refused by Jackson's default limit of 500 levels. The request mapper tightens the limits to what a cart needs: 10 levels, 64 characters of text and 10 digits in a number, and each is refused with a fixed reason. These limits protect memory and stack, not only types.
"""
speech = """
Fifth demo: limits on the stream. [[slnc 400]] A cookie nested five thousand deep is refused by the default limit. [[slnc 600]] The request mapper tightens the limits to what a cart needs. [[slnc 300]] Deep nesting, long text and long numbers are each refused.
"""
rows = { limits = "active ok" }
console = [
    ["default limits, 5000 levels deep -> refused (nesting deeper than 500)", "ok"],
    ["tightened, 11 levels deep -> refused (nesting deeper than 10)", "ok"],
    ["tightened, a 65 character product -> refused (text longer than 64)", "ok"],
    ["tightened, an 11 digit quantity -> refused (number longer than 10)", "ok"],
]

