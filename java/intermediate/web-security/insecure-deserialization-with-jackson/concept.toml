    ["fix", "Names or validator", "gadget refused"],
    ["data", "Data only", "priced by the shop"],
    ["limits", "Limits", "depth, text, numbers"],
]

[docs.problem]
scenario = """
An online store keeps the cart in a JSON cookie and reads it back with Jackson, with a note whose class the cookie names.
"""
naive = """
Let the data say which class to build, so that new kinds work without code changes.
"""
deliver = [
    "Real Jackson 3 mappers for each configuration.",
    "A harmless gadget class and a marker file that shows whether it ran.",
    "Type ids by name, a polymorphic type validator, and a data-only request.",
    "Stream limits for depth, text and numbers.",
]

[docs.prerequisites]
required = [
    "Java basics",
    "The plain insecure-deserialization project, for the attack itself",
]
not_required = [
    "Spring: Jackson is used directly",
    "Knowledge of any real gadget chain",
]
install = []

[docs.session]
objectives = [
    "explain how a type id in JSON lets the data choose a class",
    "say what Jackson 3's default validator protects and what it does not",
    "fix a polymorphic field with names or a validator",
    "keep prices and types out of client data",
]
walkthrough = """
Run act two and ask what protected the Object field and why the note field was not protected. In act three ask what the forged price shows. In act four ask who decides the price.
"""
exercises = [
    "Add a third kind of note and see which fix needs a change.",
    "Write a test that fails if any annotation uses Id.CLASS on a field.",
    "Turn on `MapperFeature` strictness options and see what changes.",
    "Add a signature to the cookie and decide what it fixes and what it does not.",
]

[docs.explained]
sentence = """
Jackson builds the class that the data names whenever a field is typed by name or class, so the type must come from a list kept in the code, and values such as prices must never come from the client.
"""
verdict = """
Do not use class names in client data. Use short names from a list, or a validator that lists classes, or no types at all; bind client requests strictly; price on the server; and keep stream limits tight.
"""
recognise = [
    "`@JsonTypeInfo(use = Id.CLASS)` on a field.",
    "`activateDefaultTyping` in a configuration.",
    "`FAIL_ON_UNKNOWN_PROPERTIES` turned off.",
    "A Jackson gadget CVE in a security feed.",
]

[spec]
purpose = """
Teach insecure deserialization with Jackson 3: class names in JSON, what the default validator does, the three ways to fix a polymorphic field, and data-only requests with limits.
"""
nongoals = [
    "Real gadget chains.",
    "Java's built-in serialization, which the plain project covers.",
    "Signing or encrypting the cookie.",
]
problem = """
Teams let JSON choose the class to build, for convenience, and trust prices and types that come from the client.
"""
roles = [["The cart and notes", "`Cart`, `LooseCart`, `TypedCart`, `Note`, `Line`"], ["The gadget stand-in", "`TempCleaner`"], ["Configuration", "`Mappers`, `Cookies`"], ["The attacker and the shop", "`Attacker`, `OrderRequest`, `Catalogue`"], ["Entry point", "`JacksonDemo`"]]
requirements = [
    "A note typed by class name builds a class the cookie names.",
    "An Object base type is refused by Jackson 3's default validator.",
    "Names from a list and a validator that lists classes both refuse the gadget.",
    "A request without prices or types refuses unknown properties, and the shop prices the order.",
    "Stream limits bound nesting depth, text and numbers.",
    "The demo prints the same output on every run.",
]

