plugins {
    id 'java'
    id 'application'
}

group = 'com.jk.explore.security'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Jackson 3 lives in tools.jackson (its annotations stay in com.fasterxml.jackson.annotation); 3.1.5 is the version Spring Boot 4.1.1 uses.
    implementation platform('tools.jackson:jackson-bom:3.1.5')
    implementation 'tools.jackson.core:jackson-databind'

    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.jk.explore.security.jacksondeser.JacksonDemo'
}

test {
    useJUnitPlatform()
}

// No deprecated or to-be-removed API is allowed in any project: a warning fails the build.
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.addAll(['-Xlint:deprecation', '-Xlint:removal', '-Werror'])
}
