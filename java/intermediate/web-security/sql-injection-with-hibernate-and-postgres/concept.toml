    ["  a hash starts pbkdf2$zed -> [no results]  <- NO", "muted"],
    ["one yes or no per search, letter by letter", "amber"],
    ["---", ""],
    ["THE INPUT (search box, sent to a native SQL query):", "code"],
    ["  zzz' union select email || ' ' || password_hash from users --", "muted"],
    ["THE SQL AS BUILT (the input pasted in):", "code"],
    ["  select name from products", "code"],
