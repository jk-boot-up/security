[threatmodel]
scope = """
The product search of an online store, written with Hibernate 7 against PostgreSQL 18. It covers JPQL, native SQL, Criteria queries and the database user the page connects as.
It does not cover the rest of the application, the network between the application and the database, or injection into other stores.
"""
assets = [
    "Account emails and password hashes.",
    "Unlisted products.",
    "The product table's integrity.",
]
actors = [
    "A customer who types in the search box.",
    "A developer who adds a new query.",
]
boundaries = [
    "The customer's text to the application: untrusted until bound as a parameter.",
    "The application to the database: only the rights of the search user.",
]
assumptions = [
    "The container is local and its admin password is a lab value.",
    "Hibernate and the PostgreSQL driver are current and unmodified.",
]
out_of_scope = [
    "Second-order injection and stored procedures.",
    "Denial of service from expensive queries.",
]
tests = [
    "`SortColumnTest` needs no database and checks the sort allow-list.",
    "`QueryTextTest` needs no database and checks the query text each search builds and how the demo lays it out.",
    "`HibernateTranslationTest` needs no database: Hibernate translates each query into PostgreSQL's SQL with no connection behind it, and the test checks which text became code, that parameters leave only a `?`, and that the SQL printed in the golden output is exactly what Hibernate generates.",
    "`HibernateInjectionTest` (tagged `integration`) checks each payload against the unsafe and the safe searches and the refusal for the search user.",
    "`DemoRunsTest` (tagged `integration`) compares the whole demo with the golden output.",
]
next = """
The next project in this module, cross-site-scripting, moves from the database to the browser: the same untrusted text, this time becoming script.
"""

[[threat]]
id = "T1"
stride = "T"
threat = "Customer text becomes part of a JPQL or native query"
where = "`UnsafeSearch`"
control = "Named parameters, the Criteria API and an allow-list for sort keys"
residual = "A new query written by string concatenation"

[[threat]]
id = "T2"
stride = "I"
threat = "JPQL reads entities the page was never meant to show"
where = "`UnsafeSearch.jpql`"
control = "Constant query text; review of every string reaching createQuery"
residual = "Dynamic queries that need a builder"

[[threat]]
id = "T3"
stride = "E"
threat = "The application's database user can read every table"
where = "The database user"
control = "A search user with select on the product table only"
residual = "Tables the search page legitimately needs to read"

[poster]
headline = [["HIBERNATE", "text"], ["SQL INJECTION", "accent"]]
taglines = [["Hibernate does not make a query safe: only parameters do, and a database user with few rig", "gold"]]
before = { code = "jpql search 'Kettle' -> [Blue Kettle, Red Kettle]", note = "A search that works", tag = "BEFORE" }
after = { code = "where name like :term", note = "Few rights limit the damage", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "SQL Injection with Hibernate and PostgreSQL"
narration = "Hello, and welcome. [[slnc 400]] This video explains S Q L injection with Hibernate and PostgreSQL, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] Hibernate maps Java objects to database tables, and it runs the query text it is given. [[slnc 300]] If that text is built by pasting in a customer's words, a single quote can turn the rest of those words into query language. [[slnc 300]] The mapper is not a shield. [[slnc 600]] Think of a waiter who writes your order on a slip for the kitchen. [[slnc 300]] A smart new kitchen does not help, if the waiter still lets you dictate the slip word for word. [[slnc 300]] Only a printed form, where you fill in the blanks, keeps your words as an order. [[slnc 600]] Our example is an online store's product search, running against a real PostgreSQL database."

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online store's product search.", "", "PostgreSQL 18 runs in a container.", "Hibernate creates the tables.", "Four products, one not yet for sale.", "Two customer accounts.", "", "Two database users: the owner, and shop_search."]
narration = "Here is the scenario. [[slnc 400]] An online store has a product search page. [[slnc 500]] The demo starts PostgreSQL 18 in a container on this machine, and Hibernate creates the tables. [[slnc 500]] It loads four products, one of them not yet for sale, and two customer accounts with their password hashes. [[slnc 600]] Then it runs the search with an attacker's text, written four ways, as two different database users."

[[scene]]
key = "02-words"
kind = "bullets"
title = "The Words"
body = ["Entity: a Java class Hibernate maps to a table", "JPQL: queries written with entity names", "Native query: plain SQL for the database", "Named parameter (:term): a slot for a value", "Database user: an account with rights"]
narration = """Before the demos, the words. [[slnc 500]] An entity is a Java class that Hibernate maps to a table: Product to products, Account to users. [[slnc 500]] J P Q L is a query language that uses those entity names, and Hibernate translates it into S Q L. [[slnc 500]] A native query is plain S Q L, sent to the database as it is. [[slnc 500]] A named parameter, written colon term, is a slot that is filled with a value, separately from the text. [[slnc 500]] And a database user is an account, with rights on certain tables."""

[[scene]]
key = "02-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "02-code-and-data"
kind = "figure"
title = "Hibernate translates the text it is given"
body = "jpql_to_sql"
narration = """Let's see the whole idea on one picture. [[slnc 400]] At the top, a J P Q L query as the program built it, with the customer's word Kettle pasted between two quotes. [[slnc 700]] In the middle, the S Q L that Hibernate sent to PostgreSQL. [[slnc 300]] The entity Product became the table products. [[slnc 300]] The word Kettle was copied across inside its quotes: it is data, a name to look for. [[slnc 700]] At the bottom, the same query, with a quote in the search box. [[slnc 300]] That quote closes the string early, and whatever follows is read as query language. [[slnc 300]] Hibernate translates it faithfully, because it cannot tell which part the customer wrote. [[slnc 700]] The mapper is not a shield. [[slnc 300]] Only a parameter keeps the words out of the text."""

[[scene]]
key = "03-acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "04-costs"
kind = "bullets"
title = "What It Costs"
body = ["Docker is needed for the demo and its tests", "A parameter cannot carry a column or table name", "One database user per job means more setup", "The Criteria API is long-winded", "Every string that reaches createQuery", "  needs a review"]
narration = "Nothing is free. [[slnc 400]] Here is what the defences cost. [[slnc 500]] The demo and its integration tests need Docker, to run a real PostgreSQL. [[slnc 500]] A parameter can carry a value, but never a table name, a column, or a sort direction, so those come from a fixed list. [[slnc 500]] A database user with few rights means a second user, and a second connection to set up. [[slnc 500]] The Criteria A P I is safe, but long-winded. [[slnc 500]] And every string that reaches create query or create native query has to be reviewed by a person."

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["Product, Account: the entities", "Shop: loads the data", "UnsafeSearch: pastes the words in", "SafeSearch: three kinds of parameters", "SortColumn: the fixed list of sort keys", "PostgresLab: starts and stops the database"]
narration = "Here is who does what in the code. [[slnc 400]] Product and Account are the entities that Hibernate maps to tables, and Shop loads the data. [[slnc 500]] UnsafeSearch is the first version, which pastes the customer's words into the query text. [[slnc 500]] SafeSearch is the fixed version, with named parameters in J P Q L, named parameters in native S Q L, and the Criteria A P I. [[slnc 500]] SortColumn is the fixed list that a sort key must come from. [[slnc 300]] And PostgresLab starts the database in a container, and removes it afterwards."

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Bind every value as a parameter", "Build dynamic queries with the Criteria API", "Take sort keys from an enum", "Connect as a database user with few rights", "Review every string passed to createQuery"]
narration = "So, how do you use it? [[slnc 400]] Bind every value as a parameter: named parameters in J P Q L and native S Q L, or the methods that Spring Data writes for you. [[slnc 500]] When a query has to be built at run time, build it with the Criteria A P I. [[slnc 500]] Take sort keys from an enum, never from the request. [[slnc 500]] Connect as a database user who can do only what the page needs. [[slnc 500]] And treat every string passed to create query or create native query as something to review."

[[scene]]
key = "12-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a Spring Data style method", "and check that it binds the parameter."]
narration = "That's S Q L Injection with Hibernate. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Hibernate runs the text it is given: parameters keep the customer's words as data, an allow-list covers the parts a parameter cannot, and a database user with few rights is the second wall. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a Spring Data style repository method and check that it binds the parameter. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] Hibernate seven talks to a real PostgreSQL in a container, so every query in the demo really ran. [[slnc 300]] Here are the classes that matter."""

[[class]]
name = "UnsafeSearch"
what = "the first version: the words pasted into JPQL and native SQL"
[[class.part]]
title = "string concatenation, twice"
code = """
return "select p.name from Product p where p.name like '%" + term + "%' and p.listed = true order by " + sort;
...
return "select name from products where name like '%" + term + "%' and listed = true order by name";
"""
speech = """The first version builds both queries with plus signs. [[slnc 300]] Whatever the customer typed becomes part of the query text, quotes and all. [[slnc 300]] Hibernate is handed a finished string, and has no way to know which part came from the customer."""

[[class]]
name = "SafeSearch"
what = "the fix: named parameters and the Criteria API"
[[class.part]]
title = ":term and setParameter"
code = """
return session.createQuery(jpqlStatement(sort), String.class).setParameter("term", "%" + term + "%").getResultList();
...
return "select p.name from Product p where p.name like :term and p.listed = true order by " + SortColumn.parse(sort).jpql();
"""
speech = """The fix keeps the J P Q L constant, with colon term where the words go. [[slnc 300]] Set parameter hands the words over separately, so they reach PostgreSQL as a value, never as text to parse. [[slnc 300]] The sort key comes from the list."""
[[class.part]]
title = "the Criteria API"
code = """
query.select(p.get("name")).where(cb.like(p.get("name"), "%" + term + "%"), cb.isTrue(p.get("listed")))
"""
speech = """The Criteria A P I builds the query from Java calls instead of text. [[slnc 300]] Hibernate binds the value given to like as a parameter, so a quote in it stays a quote."""

[[class]]
name = "SortColumn"
what = "the only things a customer may sort by"
[[class.part]]
title = "a fixed list, and a default"
code = """
NAME("p.name", "name"), PRICE("p.price", "price");
...
for (SortColumn c : values()) {
    if (c.name().equals(text == null ? "" : text.toUpperCase(Locale.ROOT))) {
        return c;
    }
}
return NAME;
"""
speech = """A sort key cannot be a parameter. [[slnc 300]] So the sort box is compared with a list of two. [[slnc 300]] Anything not on it gets the default, and no error message that would teach the schema."""

[[class]]
name = "SqlLog"
what = "shows the SQL Hibernate really sent"
[[class.part]]
title = "a statement inspector"
code = """
public String inspect(String sql) {
    sent.add(sql);
    return sql;
"""
speech = """Hibernate hands every S Q L statement to this inspector just before it goes to the driver. [[slnc 300]] The demo prints what it kept, and a unit test translates the same queries with no database at all, to check those lines."""

[[class]]
name = "Shop"
what = "the data, and a database user with few rights"
[[class.part]]
title = "create user, grant select"
code = """
statement.execute("create user " + SEARCH_USER + " password '" + SEARCH_PASSWORD + "'");
statement.execute("grant select on products to " + SEARCH_USER);
"""
speech = """Shop creates the tables as the owner, then a second database user for the search page. [[slnc 300]] It may read the products table and nothing else, so PostgreSQL itself refuses any query that reaches users."""

[[acronym]]
short = "SQL"
long = "Structured Query Language: the language of database statements"
say = "S Q L is structured query language: the language a program uses to ask a database for rows."
[[acronym]]
short = "JPQL"
long = "Jakarta Persistence Query Language: queries over entities"
say = "J P Q L is the Jakarta Persistence query language. It names Java entities, and Hibernate translates it into S Q L."
[[acronym]]
short = "API"
long = "Application Programming Interface: the calls a library offers"
say = "A P I is application programming interface: the calls a library offers. The Criteria A P I builds queries from Java calls."
[[acronym]]
short = "union, like, order by, exists"
long = "SQL words: add rows; match a pattern; sort; is there any row"
say = "Union adds the rows of another query. Like matches a pattern, where a percent sign stands for any text. Order by sorts. Exists asks whether a subquery finds any row."
[[acronym]]
short = "or, and"
long = "SQL words: either condition; both conditions"
say = "Or keeps a row when either condition holds. And keeps it only when both hold."
[[acronym]]
short = "PBKDF2"
long = "Password-Based Key Derivation Function 2: a slow password hash"
say = "P B K D F 2 is password based key derivation function two: a slow hash for storing passwords."
[[acronym]]
short = "CWE"
long = "Common Weakness Enumeration: CWE-89 is SQL injection"
say = "C W E is the common weakness enumeration. Number eighty nine is S Q L injection."
