[[act]]
title = "Hibernate does not stop a quote"
summary = "A quote shows the unlisted Prototype Toaster; the same hole asks the users table yes or no questions through the Account entity; a native union returns both e-mail addresses with their password hashes."
detail = """
The input `zzz' or p.listed = false or p.name like 'zzz` is pasted into the JPQL. Its first quote closes the literal early, `or p.listed = false` becomes a real condition, and its last quote opens a literal that the program's own `%'` closes. The result is the Prototype Toaster, which is not for sale.
Because JPQL can name any entity, the same hole can ask about `Account`: `or exists (from Account a where a.passwordHash like 'pbkdf2$ana%')`. Hibernate translates it into a subquery on the users table: `exists(select a1_0.id from users a1_0 where a1_0.password_hash like 'pbkdf2$ana%' escape '')`. With pbkdf2$ana every product comes back (4 products: yes, a hash starts that way); with pbkdf2$zed none do (no). One yes or no per search, and the hash leaks letter by letter.
In the native SQL query, `zzz' union select email || ' ' || password_hash from users --` appends a second query and comments out the rest: the page lists ana@shop.example pbkdf2$ana$9f2c and ben@shop.example pbkdf2$ben$41d0.
"""
figure = "quote_breakout"
figure_title = "Where the customer's text ends up"
figure_speech = """
Second demo: Hibernate does not stop a quote. [[slnc 400]] Three attacks. [[slnc 300]] White is the program's text, red is what the customer typed, and grey is commented out. [[slnc 700]]
In the first, the customer's quote closes the string early. [[slnc 300]] Or p dot listed equals false becomes a real condition, and the toaster, which is not for sale, comes back. [[slnc 700]]
In the second, the J P Q L names the Account entity, which the page never meant to touch. [[slnc 300]] Hibernate turns it into a subquery on the users table. [[slnc 300]] The question is: does any password hash start with p b k d f 2, dollar, a n a? [[slnc 300]] A full page means yes. [[slnc 300]] An empty page means no. [[slnc 300]] One question per search, and the hash leaks letter by letter. [[slnc 700]]
In the third, a native query. [[slnc 300]] Union select adds a second query on the users table, and two dashes hide the rest. [[slnc 300]] The page lists every e-mail address with its password hash.
"""
speech = """
Here is the output, one attack at a time. [[slnc 400]] The input: z z z, quote, or p dot listed equals false, or p dot name like, quote, z z z. [[slnc 400]] The J P Q L as built: the quote closed the string, and the rest is query language. [[slnc 400]] The result: the prototype toaster, which is not for sale.
[[page]]
The question about accounts. [[slnc 300]] The input asks whether any account's hash starts with p b k d f 2, dollar, a n a. [[slnc 400]] The S Q L Hibernate sent has a subquery on the users table, a table this page never names.
[[page]]
The answers. [[slnc 300]] For a n a, four products: yes. [[slnc 300]] For z e d, no results: no. [[slnc 300]] One yes or no per search, so the hash leaks letter by letter.
[[page]]
The native query. [[slnc 300]] The union input is pasted into the S Q L. [[slnc 300]] Two dashes comment out the program's own ending. [[slnc 400]] The result: both e-mail addresses, each with its password hash.
"""
rows = { quote = "active wrong" }
console = [
    ["THE INPUT (search box, then sort box):", "code"],
    ["  zzz' or p.listed = false or p.name like 'zzz", "muted"],
    ["  p.name", "muted"],
    ["THE JPQL AS BUILT (the input pasted in):", "code"],
    ["  select p.name from Product p", "code"],
    ["  where p.name like '%zzz' or p.listed = false", "code"],
    ["    or p.name like 'zzz%' and p.listed = true", "code"],
    ["  order by p.name", "code"],
    ["THE RESULT:", "code"],
    ["  [Prototype Toaster]  <- AN UNLISTED PRODUCT", "bad"],
    ["---", ""],
    ["THE INPUT (search box, then sort box):", "code"],
    ["  zzz' or exists (from Account a where a.passwordHash like", "muted"],
    ["    'pbkdf2$ana%') or p.name like 'zzz", "muted"],
    ["  p.name", "muted"],
    ["THE SQL HIBERNATE SENT (Account became users):", "code"],
    ["  select p1_0.name from products p1_0", "code"],
    ["  where p1_0.name like '%zzz' escape ''", "code"],
    ["    or exists(select a1_0.id from users a1_0", "code"],
    ["    where a1_0.password_hash like 'pbkdf2$ana%' escape '')", "code"],
    ["    or p1_0.name like 'zzz%' escape '' and p1_0.listed=true", "code"],
    ["  order by p1_0.name", "code"],
    ["---", ""],
