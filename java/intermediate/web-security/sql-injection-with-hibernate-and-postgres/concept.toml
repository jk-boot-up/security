    ["params", "Parameters", "JPQL, native, Criteria"],
    ["rights", "Few rights", "shop_search, products only"],
]

[docs.problem]
scenario = """
An online store's product search is written with Hibernate, and the team believes the mapper protects it.
"""
naive = """
Build the JPQL or native query string from the customer's text; the ORM will keep it safe.
"""
deliver = [
    "A real PostgreSQL started in Docker and removed afterwards.",
    "Concatenated JPQL and native queries that leak data, with the payloads shown.",
    "Fixed versions with named parameters, the Criteria API and an allow-list for sort keys.",
    "A database user with read access to one table and the refusal it causes.",
]

[docs.prerequisites]
required = [
    "Java basics",
    "The plain sql-injection project, for the idea of injection",
    "Docker running locally, for the demo and the integration tests",
]
not_required = [
    "Spring: Hibernate is used directly",
    "A PostgreSQL installation: the demo starts and removes its own",
]
install = [
    "Docker, with the image `postgres:18.6-alpine` (pulled on first use)",
]

[docs.session]
objectives = [
    "explain why JPQL and native queries built from strings are injectable",
    "show how JPQL can read entities that the query does not name",
    "fix a query with named parameters, Criteria or an allow-list",
    "explain what a least-privilege database user adds",
]
walkthrough = """
Run act two and ask what the page was supposed to be able to see. Ask why the account question needs no table name in the query. In act four, ask who should own the grant statement.
"""
exercises = [
    "Add a Spring Data style repository method and check that it binds the parameter.",
    "Make `shop_search` read a view instead of the products table and decide what the view should hide.",
    "Add a test that fails if any class in the project calls `createQuery` or `createNativeQuery` with a concatenated string.",
    "Write a native query with an `in` list as a parameter.",
]

[docs.explained]
sentence = """
Hibernate runs the text it is given: parameters keep the customer's words as data, an allow-list covers the parts a parameter cannot, and a database user with few rights is the second wall.
"""
verdict = """
Use derived or annotated queries with bound parameters, the Criteria API where queries are built dynamically, an enum for sort keys, and a least-privilege database user for the application. Treat every string passed to createQuery or createNativeQuery as a code review finding.
"""
recognise = [
    "`createQuery(\"... '\" + value + \"'\")` in a review.",
    "`@Query(nativeQuery = true, value = \"... \" + ...)` or `@Query` text built with `String.format`.",
    "`GRANT ... TO app_user` in a database script.",
    "`javax.persistence`/`jakarta.persistence` imports next to string concatenation.",
]

[spec]
purpose = """
Teach SQL injection through Hibernate 7 and PostgreSQL: concatenated JPQL and native queries, the fixes, and a database user with few rights.
"""
nongoals = [
    "Spring Data repositories (named in the exercises).",
    "Blind and time-based extraction techniques.",
    "Database hardening beyond a read-only user.",
]
problem = """
Teams trust the ORM and build queries as strings, and run the application as a database user that can read everything.
"""
roles = [["Entities and data", "`Product`, `Account`, `Shop`"], ["Vulnerable searches", "`UnsafeSearch`"], ["Fixed searches", "`SafeSearch`, `SortColumn`"], ["The database", "`PostgresLab`"], ["Entry point", "`SqlHibernateDemo`"]]
requirements = [
    "Concatenated JPQL reveals an unlisted product and answers questions about another entity.",
    "Concatenated native SQL returns accounts through a union.",
    "Named parameters and the Criteria API return nothing for every payload.",
    "A sort key outside the list gets the default order.",
    "The search user is refused by PostgreSQL when it reads the account table.",
    "The container is removed after the demo and after every test run.",
    "The demo prints the same output on every run.",
]

