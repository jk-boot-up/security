# concept.toml: everything about this project that is not Java code.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "sql-injection-with-hibernate-and-postgres"
level = "intermediate"
module = "web-security"
title = "SQL Injection with Hibernate and PostgreSQL"
short_title = "SQL Injection with Hibernate"
package = "sqlihibernate"
main_class = "SqlHibernateDemo"
tagline = "Hibernate does not make a query safe: only parameters do, and a database user with few rights limits the damage of a mistake"
bold = "An object-relational mapper is not a shield. A JPQL or native query built by pasting text into it is injectable, JPQL can reach every entity and not just the one it names, and the fix is the same as ever: bind parameters, choose sort keys from a list, and connect as a database user who can only do what the page needs."
domain = "an online store's product search"
domain_note = ""
youtube_description = "SQL injection in Hibernate 7 against PostgreSQL: concatenated JPQL, native queries, parameters, Criteria and least privilege."
thumb_lines = ["HIBERNATE", "SQL INJECTION"]
thumb_code = "where name like :term"
youtube_title = "SQL Injection in Hibernate: JPQL, Native Queries and PostgreSQL Least Privilege"
youtube_tags = ["sql injection", "hibernate", "jpql", "postgresql", "java", "application security"]

[readme]
intro = """
The plain [sql-injection](../sql-injection) project injects into a toy database. This one does it where real Java shops are: **Hibernate ORM 7** talking to a real **PostgreSQL 18** that the demo starts in Docker on the loopback address and removes afterwards.

What it shows:
- **Hibernate is not a shield.** `createQuery("... like '%" + term + "%'")` and `createNativeQuery(...)` take a string, and a quote in the customer's text ends the literal and becomes query language.
- **JPQL reaches further than the entity it names.** One concatenated product search can ask a yes or no question about the *account* table (does any password hash start with `pbkdf2$ana`?), so a hole in the product page leaks data from other entities.
- **Native SQL is the whole database.** A `union select` returns every email and password hash.
- **Parameters fix it in all three styles.** Named parameters in JPQL, named parameters in native SQL and the Criteria API keep every payload as plain text. A sort key is the one thing a parameter cannot carry, so it comes from a fixed list.
- **A database user with few rights limits a mistake.** The search page connects as `shop_search`, who may only read the product table: the same injection is refused by PostgreSQL with `permission denied for table users`.

**Maps to:** OWASP Top 10 (2025) A05 Injection · CWE-89 · OWASP ASVS 5.0 V1 (Encoding and Sanitization) · OWASP API Security API8.
"""
analogy = """
A librarian who fetches books for you. If the slip you hand over is copied word for word into the librarian's own instruction sheet, a slip that says "this book, and also the staff files" is followed. If the slip is only ever read as a title, it cannot give orders. And a
librarian who has no key to the staff room cannot fetch from it even when fooled.
"""
scenario = """
An online store's product search page. The demo starts PostgreSQL 18 in a container, creates the tables with Hibernate, loads four products (one not yet for sale) and two accounts, and runs the search four ways with attacker text, as two different database users.
"""
costs = [
    "**Docker is needed to run the demo and the integration tests;** the unit tests do not need it.",
    "**Parameters cannot carry a table, column or sort direction,** so those come from an enum or an allow-list.",
    "**A least-privilege database user means more than one connection setup:** schema changes use an admin user, the application another.",
    "**The Criteria API is verbose,** which is why teams drift back to string-built JPQL.",
    "**Review is needed for every native query and every string that reaches `createQuery`.**",
]
too_much = """
Almost all application queries should use derived or annotated repository methods with bound parameters, and never need string building. Reserve native queries for things the mapper cannot express, and parameterise those too.
"""
met_before = [
    "`@Query(\"... where p.name like :term\")` in Spring Data repositories.",
    "`entityManager.createNativeQuery(\"... \" + input)` in code reviews.",
    "`GRANT SELECT ON ... TO ...` in a database setup script.",
    "HQL injection write-ups.",
]
where = """
This is the tools version of [sql-injection](../sql-injection), in the [web-security](..) module. It follows the same four acts, so the numbers can be compared one for one.
"""
twin = """
Everything runs for real: Hibernate 7.4 builds and runs the queries and PostgreSQL 18 enforces its permissions. Only the data is small and fixed. The container uses a random loopback port and is removed on exit, so the demo prints the same text on every run.
"""
test_note = "Unit tests need nothing; the PostgreSQL tests are tagged `integration` and run with `./gradlew integrationTest`. They start a container and always remove it."

[[act]]
title = "A search that works"
summary = "Concatenated JPQL answers an honest search for Kettle with two products."
detail = """
The first version of the search builds a JPQL string from the customer's text. For the word Kettle it returns the Blue Kettle and the Red Kettle, the unlisted Prototype Toaster stays hidden, and nothing looks wrong. This is why the hole survives testing.
"""
speech = """
First demo: a search that works. [[slnc 400]] The first version builds a query string from the customer's words. [[slnc 300]] For the word Kettle it returns two kettles, and the unlisted product stays hidden. [[slnc 300]] Nothing looks wrong, which is why the hole survives testing.
"""
rows = { works = "active ok" }
console = [
    ["jpql search 'Kettle' -> [Blue Kettle, Red Kettle]", "ok"],
]

[[act]]
title = "Hibernate does not stop a quote"
summary = "A quote shows the unlisted product, asks questions about the account table in JPQL, and a native union returns every email and password hash."
detail = """
A quote in the search box ends the string literal and the rest is JPQL: the unlisted Prototype Toaster appears. Because JPQL can name any entity, the same hole asks the account table whether any hash starts with `pbkdf2$ana` (every product comes back, so yes) and `pbkdf2$zed`
(nothing comes back, so no): data is read one yes or no at a time from a page that only searches products. In the native query, `union select` returns the emails and password hashes of both accounts.
"""
speech = """
Second demo: Hibernate does not stop a quote. [[slnc 400]] A quote ends the string, and the rest is query language. [[slnc 600]]
The unlisted product appears. [[slnc 300]] The same hole asks the account table yes or no questions, because J P Q L can name any entity. [[slnc 600]]
In the native query, a union returns every email and password hash.
"""
rows = { quote = "active wrong" }
console = [
    ["jpql search \"zzz' or p.listed = false ...\" -> [Prototype Toaster]", "bad"],
    ["jpql guess that a hash starts pbkdf2$ana -> all four products", "bad"],
    ["jpql guess that a hash starts pbkdf2$zed -> [no results]", "muted"],
    ["native search with union select -> [ana@shop.example pbkdf2$ana$9f2c, ben@shop.example pbkdf2$ben$41d0]", "bad"],
]

[[act]]
title = "Parameters keep text as text"
summary = "Named parameters in JPQL and native SQL and the Criteria API return nothing for every payload; a sort key outside the list falls back to the default."
detail = """
The fixed searches have constant query text and send the customer's words as a named parameter, so the payloads are only odd product names that match nothing. The Criteria API binds the values it is given in the same way. The sort key is the one part a parameter cannot carry, so it is
chosen from an enum, and a trick such as `price; drop table products` just gets the default order.
"""
speech = """
Third demo: parameters keep text as text. [[slnc 400]] The query text is constant, and the customer's words travel as a parameter. [[slnc 600]]
Named parameters in J P Q L, named parameters in native S Q L, and the Criteria A P I all return nothing for every payload. [[slnc 600]]
The sort key comes from a list, because a parameter cannot carry it.
"""
rows = { params = "active ok" }
console = [
    ["jpql search 'Kettle' -> [Blue Kettle, Red Kettle]", "ok"],
    ["jpql, native and criteria with the payloads -> [no results]", "ok"],
    ["sort \"price; drop table products\" -> [no results] (default order, nothing dropped)", "ok"],
]

[[act]]
title = "Few rights limit the damage"
summary = "As shop_search, which may only read products, the same injections are refused by PostgreSQL with permission denied for table users."
detail = """
The careless searches run again, this time connected as `shop_search`, who has been granted `select` on the product table and nothing else. The union and the JPQL question about accounts are both refused by PostgreSQL itself with permission denied for table users. The mistake is still
there, but it can read less. This is a second wall, not a replacement for parameters.
"""
speech = """
Fourth demo: few rights limit the damage. [[slnc 400]] The search page connects as a database user who can only read products. [[slnc 600]]
The same injections are refused by PostgreSQL itself. [[slnc 300]] The mistake is still there, but it can read less.
"""
rows = { rights = "active ok" }
console = [
    ["native union as shop_search -> refused: permission denied for table users", "ok"],
    ["jpql guess as shop_search -> refused: permission denied for table users", "ok"],
]

