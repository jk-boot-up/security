    ["  Prototype Toaster   9900  false  <- NOT FOR SALE", "amber"],
    ["THE TABLE users (email, password_hash), another entity:", "code"],
    ["  ana@shop.example   pbkdf2$ana$9f2c", "muted"],
    ["  ben@shop.example   pbkdf2$ben$41d0", "muted"],
    ["THE INPUT (search box, then sort box):", "code"],
    ["  Kettle", "muted"],
    ["  p.price", "muted"],
    ["---", ""],
