[[act]]
title = "Parameters keep text as text"
summary = "The fixed JPQL has :term, which Hibernate sends as ?; every payload becomes a value that matches nothing, in JPQL, native SQL and the Criteria API; a sort key outside the list falls back to order by p.name."
detail = """
The fixed JPQL is constant text: `select p.name from Product p where p.name like :term and p.listed = true order by` a sort key from a list of two. Hibernate sends `select p1_0.name from products p1_0 where p1_0.name like ? escape '' and p1_0.listed=true order by p1_0.name`: the named parameter :term became a `?`, and the customer's words travel separately, as its value.
`%Kettle%` still finds the Blue Kettle and the Red Kettle. The quote input and the account question become values such as `%zzz' or p.listed = false or p.name like 'zzz%`: odd product names that match nothing, so no results.
The native query with `:term` and the Criteria API return no results for the union and the quote inputs too; the Criteria query's SQL also holds a `?` where the value goes. A sort key cannot be a `?`, so `price; drop table products` is checked against the list, is not on it, and gets `order by p.name`, the default: the two kettles again.
"""
figure = "parameter_slot"
figure_title = "The query is fixed; the text fills one slot"
figure_speech = """
Third demo: parameters keep text as text. [[slnc 400]] At the top, the fixed J P Q L. [[slnc 300]] Where the words used to be pasted, it says colon term: a named parameter. [[slnc 500]] Below it, the S Q L Hibernate sent. [[slnc 300]] The named parameter became a question mark: a slot for one value, sent separately from the text. [[slnc 700]]
At the bottom, the values that filled the slot. [[slnc 300]] Kettle, with percent signs around it, matches two products. [[slnc 300]] The quote attack and the account question are now just long, strange product names. [[slnc 300]] No product is called that, so nothing comes back. [[slnc 700]]
On the right, the sort box. [[slnc 300]] A column name cannot be a slot, so it is picked from a list of two. [[slnc 300]] Anything else gets the default. [[slnc 500]] Native S Q L with a named parameter, and the Criteria A P I, give no results for the attacks too.
"""
speech = """
Here is the output. [[slnc 400]] The fixed J P Q L, with colon term. [[slnc 400]] And the S Q L Hibernate sent, with a question mark in its place.
[[page]]
The value of the question mark, and the result. [[slnc 300]] Kettle: two kettles. [[slnc 300]] The quote attack: no results. [[slnc 300]] The account question: no results. [[slnc 400]] The same attacks in native S Q L and with the Criteria A P I: no results.
[[page]]
The S Q L the Criteria query sent has a question mark too. [[slnc 400]] And the sort box: price, semicolon, drop table products is not on the list, so the order is by name, and the two kettles come back.
"""
rows = { params = "active ok" }
console = [
    ["THE JPQL (fixed text; the words travel as :term):", "code"],
    ["  select p.name from Product p", "code"],
    ["  where p.name like :term and p.listed = true", "code"],
    ["  order by <p.name or p.price, from a list>", "code"],
    ["THE SQL HIBERNATE SENT (:term became ?):", "code"],
    ["  select p1_0.name from products p1_0", "code"],
    ["  where p1_0.name like ? escape '' and p1_0.listed=true", "code"],
    ["  order by p1_0.name", "code"],
    ["---", ""],
    ["THE VALUE OF ? AND THE RESULT:", "code"],
    ["  %Kettle%", "muted"],
    ["    -> [Blue Kettle, Red Kettle]", "muted"],
    ["  %zzz' or p.listed = false or p.name like 'zzz%", "muted"],
    ["    -> [no results]", "ok"],
    ["  %zzz' or exists (from Account a where a.passwordHash like", "muted"],
    ["    'pbkdf2$ana%') or p.name like 'zzz%", "muted"],
    ["    -> [no results]", "ok"],
    ["THE SAME PAYLOADS IN NATIVE SQL AND CRITERIA:", "code"],
    ["  native SQL with the union input   -> [no results]", "ok"],
    ["  Criteria API with the quote input -> [no results]", "ok"],
    ["---", ""],
    ["THE SQL THE CRITERIA QUERY SENT (a ? again):", "code"],
    ["  select p1_0.name from products p1_0", "code"],
    ["  where p1_0.name like ? escape '' and p1_0.listed", "code"],
    ["  order by 1", "code"],
    ["THE SORT BOX (a column name cannot be a ?):", "code"],
    ["  price; drop table products is not on the list", "muted"],
    ["    -> order by p.name, the default", "muted"],
    ["    -> [Blue Kettle, Red Kettle]", "muted"],
]

[[act]]
title = "Few rights limit the damage"
summary = "shop_search may read only products, as PostgreSQL reports; the union and the account question are refused with permission denied for table users, but the quote attack still shows the toaster: only parameters fix the flaw."
detail = """
Two database users: `postgres` owns every table; `shop_search` was granted select on products and nothing else, as PostgreSQL's own grant table reports.
The careless searches run again. The union attack returns 2 e-mails and hashes as postgres, and is refused as shop_search with permission denied for table users. The JPQL question about accounts is refused the same way, because its subquery reads users.
The quote attack as shop_search still shows the Prototype Toaster, because it only reads products. Few rights limit the damage of a mistake; only parameters fix the flaw.
"""
figure = "db_users"
figure_title = "Two database users, and what the same mistake reaches"
figure_speech = """
Fourth demo: few rights limit the damage. [[slnc 400]] On the left, two database users. [[slnc 300]] Postgres owns every table. [[slnc 300]] Shop search was granted only the products table, which is all a search page needs. [[slnc 700]]
On the right, the pasted queries run again. [[slnc 300]] The union attack as postgres: e-mails and hashes. [[slnc 300]] As shop search: PostgreSQL itself refuses, with permission denied for table users. [[slnc 500]] The question about accounts is refused too, because its subquery reads the users table. [[slnc 600]]
But the quote attack still works. [[slnc 300]] It reads only the products table, so the toaster still appears. [[slnc 600]]
Few rights limit what one mistake can reach. [[slnc 300]] Only parameters fix the mistake.
"""
speech = """
Here is the output. [[slnc 400]] The two database users, and the tables each may read. [[slnc 400]] The union attack, still pasted in: two e-mails and hashes as postgres, and permission denied as shop search. [[slnc 400]] The account question as shop search: refused. [[slnc 400]] The quote attack as shop search: still the toaster. [[slnc 400]] Few rights limit the damage. [[slnc 300]] Only parameters fix the flaw.
"""
rows = { rights = "active ok" }
console = [
    ["THE TWO DATABASE USERS (the tables each may read):", "code"],
