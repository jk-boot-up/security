    ["  select p.name from Product p", "code"],
    ["  where p.name like '%Kettle%' and p.listed = true", "code"],
    ["  order by p.price", "code"],
    ["THE SQL HIBERNATE SENT (Product became products):", "code"],
    ["  select p1_0.name from products p1_0", "code"],
    ["  where p1_0.name like '%Kettle%' escape ''", "code"],
    ["    and p1_0.listed=true", "code"],
    ["  order by p1_0.price", "code"],
    ["THE RESULT:", "code"],
