# concept.toml: everything about this project that is not Java code.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "sql-injection-with-hibernate-and-postgres"
level = "intermediate"
module = "web-security"
title = "SQL Injection with Hibernate and PostgreSQL"
short_title = "SQL Injection with Hibernate"
package = "sqlihibernate"
main_class = "SqlHibernateDemo"
tagline = "Hibernate does not make a query safe: only parameters do, and a database user with few rights limits the damage of a mistake"
bold = "An object-relational mapper is not a shield. A JPQL or native query built by pasting text into it is injectable, JPQL can reach every entity and not just the one it names, and the fix is the same as ever: bind parameters, choose sort keys from a list, and connect as a database user who can only do what the page needs."
domain = "an online store's product search"
domain_note = ""
youtube_description = "SQL injection in Hibernate 7 against a real PostgreSQL 18, in Java. Hibernate runs the text it is given: a JPQL or native query built by pasting a customer's words into it is injectable just like plain SQL. A quote reveals a product that is not for sale, the same hole asks yes or no questions about the account table because JPQL can name any entity, and a native UNION returns every e-mail address and password hash. Explained with an online store's product search, like a waiter who lets the customer dictate the kitchen's order slip word for word. We fix it three ways with bound parameters (named parameters in JPQL, in native SQL, and the Criteria API), choose the sort key from a fixed list, and connect as a database user who can only read products, so PostgreSQL itself refuses the attack. We finish with the cost: Docker for the demo, more than one database user, and a review of every string that reaches createQuery."
thumb_lines = ["HIBERNATE", "SQL INJECTION"]
thumb_code = "where name like :term"
youtube_title = "SQL Injection in Hibernate: JPQL, Native Queries and PostgreSQL Least Privilege"
youtube_tags = ["sql injection", "hibernate", "jpql", "postgresql", "java", "application security"]

[readme]
intro = """
The plain [sql-injection](../sql-injection) project injects into a toy database. This one does it where real Java shops are: **Hibernate ORM 7** talking to a real **PostgreSQL 18** that the demo starts in Docker on the loopback address and removes afterwards.

What it shows:
- **Hibernate is not a shield.** `createQuery("... like '%" + term + "%'")` and `createNativeQuery(...)` take a string, and a quote in the customer's text ends the literal and becomes query language.
- **JPQL reaches further than the entity it names.** One concatenated product search can ask a yes or no question about the *account* table (does any password hash start with `pbkdf2$ana`?), so a hole in the product page leaks data from other entities.
- **Native SQL is the whole database.** A `union select` returns every email and password hash.
- **Parameters fix it in all three styles.** Named parameters in JPQL, named parameters in native SQL and the Criteria API keep every payload as plain text. A sort key is the one thing a parameter cannot carry, so it comes from a fixed list.
- **A database user with few rights limits a mistake.** The search page connects as `shop_search`, who may only read the product table: the same injection is refused by PostgreSQL with `permission denied for table users`.

**Maps to:** OWASP Top 10 (2025) A05 Injection · CWE-89 · OWASP ASVS 5.0 V1 (Encoding and Sanitization) · OWASP API Security Top 10 (2019) API8 Injection (the 2023 list folds injection into its other categories).
"""
analogy = """
A librarian who fetches books for you. If the slip you hand over is copied word for word into the librarian's own instruction sheet, a slip that says "this book, and also the staff files" is followed. If the slip is only ever read as a title, it cannot give orders. And a
librarian who has no key to the staff room cannot fetch from it even when fooled.
"""
scenario = """
An online store's product search page. The demo starts PostgreSQL 18 in a container, creates the tables with Hibernate, loads four products (one not yet for sale) and two accounts, and runs the search four ways with attacker text, as two different database users.
"""
costs = [
    "**Docker is needed to run the demo and the integration tests;** the unit tests do not need it.",
    "**Parameters cannot carry a table, column or sort direction,** so those come from an enum or an allow-list.",
    "**A least-privilege database user means more than one connection setup:** schema changes use an admin user, the application another.",
    "**The Criteria API is verbose,** which is why teams drift back to string-built JPQL.",
    "**Review is needed for every native query and every string that reaches `createQuery`.**",
]
too_much = """
Almost all application queries should use derived or annotated repository methods with bound parameters, and never need string building. Reserve native queries for things the mapper cannot express, and parameterise those too.
"""
met_before = [
    "`@Query(\"... where p.name like :term\")` in Spring Data repositories.",
    "`entityManager.createNativeQuery(\"... \" + input)` in code reviews.",
    "`GRANT SELECT ON ... TO ...` in a database setup script.",
    "HQL injection write-ups.",
]
where = """
This is the tools version of [sql-injection](../sql-injection), in the [web-security](..) module. It follows the same four acts, so the numbers can be compared one for one.
"""
twin = """
Everything runs for real: Hibernate 7.4 builds and runs the queries and PostgreSQL 18 enforces its permissions. A statement inspector (`SqlLog`) keeps the SQL Hibernate sends, so the demo prints the JPQL as built next to the SQL that reached the database. Only the data is small and fixed. The container uses a random loopback port and is removed on exit, so the demo prints the same text on every run.
"""
test_note = "Unit tests need nothing: they check the query text and let Hibernate translate every query into SQL with no database behind it. The PostgreSQL tests are tagged `integration` and run with `./gradlew integrationTest`. They start a container and always remove it."

[[act]]
title = "A search that works"
summary = "The products table holds four products, one not for sale, and the users table two accounts; the customer types Kettle; the JPQL as built becomes SQL on the products table and finds the Blue Kettle and the Red Kettle."
detail = """
The products table holds four rows: the Blue Kettle at 2500 cents, the Red Kettle at 2900, the Copper Pan at 4200, all listed, and the Prototype Toaster at 9900, which is not for sale (listed = false). The users table, mapped to the `Account` entity, holds ana@shop.example and ben@shop.example with their password hashes.
The customer types Kettle in the search box and the sort box holds p.price. The first version pastes both into a JPQL string: `select p.name from Product p where p.name like '%Kettle%' and p.listed = true order by p.price`.
Hibernate translates it into PostgreSQL's SQL, entity names into table names: `select p1_0.name from products p1_0 where p1_0.name like '%Kettle%' escape '' and p1_0.listed=true order by p1_0.price`. The word Kettle is copied into the SQL inside its quotes. The result is the Blue Kettle and the Red Kettle. Nothing looks wrong, which is why the flaw survives testing.
"""
figure = "products_and_users"
figure_title = "Two tables, one search, two kettles"
figure_speech = """
First demo: a search that works. [[slnc 400]] On the left, the two tables Hibernate created. [[slnc 300]] Products: four products, each with a price in cents, and a listed flag. [[slnc 300]] The prototype toaster is not for sale, so its flag is false. [[slnc 500]] Below it, users: two customer accounts, each with an e-mail address and a password hash. [[slnc 300]] The search page has no reason to ever read this table. [[slnc 700]]
On the right, the search. [[slnc 300]] The customer types Kettle, and the sort box holds p dot price. [[slnc 300]] The first version pastes the word Kettle between two quotes in the J P Q L text. [[slnc 600]] The database keeps the listed products whose name contains Kettle. [[slnc 300]] Two kettles come back, cheapest first. [[slnc 700]]
Nothing looks wrong. [[slnc 300]] That is why this flaw survives testing.
"""
speech = """
Here is the real output. [[slnc 400]] The products table, with the toaster not for sale. [[slnc 400]] The users table, with two e-mail addresses and their hashes. [[slnc 400]] And the input: Kettle, then p dot price.
[[page]]
The J P Q L as built, with Kettle pasted between the quotes. [[slnc 400]] Then the S Q L Hibernate sent. [[slnc 300]] Product became products, and p became p one underscore zero. [[slnc 300]] The quoted word was copied across as it is. [[slnc 300]] Escape, two quotes, is Hibernate's own addition, and means no escape character. [[slnc 400]] The result: the blue kettle and the red kettle.
"""
rows = { works = "active ok" }
