[docs.explained]
sentence = """
Spring Security enforces exactly the rules it is given, so broken access control in a Spring application is usually a missing or too-broad rule; the fix is deny by default in the filter chain, ownership in the query, method security for rules that must hold everywhere, and a test that every mapped route has a rule.
"""
verdict = """
End every SecurityFilterChain with anyRequest().denyAll(). Write one rule per method and path, from one list. Look objects up with the owner in the query. Put rules that must hold for every caller on the service method with @PreAuthorize,
and use @PostAuthorize only when the check cannot be in the query. Publish refusals as events and log them without secrets. Read the handler mapping in a test, and fail the build when a route has no rule.
"""
recognise = [
    "`anyRequest().permitAll()` at the end of a configuration: the first thing to look for in a review.",
    "`requestMatchers(\"/admin/users\")` where `/admin/users/**` was meant.",
    "`findById(id)` in a controller that serves customers.",
    "`@EnableMethodSecurity` and `@PreAuthorize` on services.",
]

[spec]
purpose = """
Teach broken access control in Spring by attacking a real Spring Boot store with three common configuration mistakes and fixing it with deny by default, ownership in the query, method security, a denial log and a route inventory test.
"""
nongoals = [
    "Authentication methods: the beginner identity module and the intermediate identity module.",
    "Cross-site request forgery: its own project (CSRF is off here because the API is stateless with credentials in a header).",
    "Spring Data and a real database: the orders are in memory, looked up the same way.",
]
problem = """
Most access-control bugs in Spring applications are configuration mistakes that the framework enforces faithfully, and they pass every test that does not try another user's data.
"""
roles = [["The rule list", "`AccessRules`"], ["The fixed filter chain", "`GuardedSecurity`"], ["The mistaken filter chain", "`NaiveSecurity`"], ["Who may see which order", "`OrderAccess`"], ["Orders, by id and by owner", "`Orders`"], ["Refunds with method security", "`RefundService`"], ["The denial log", "`DenialLog`"], ["The route inventory", "`RouteInventory`"], ["Entry point", "`AccessControlSpringDemo`"]]
requirements = [
    "The naive store lets exactly seven of the nine attacks through.",
    "The guarded store refuses all nine attacks and serves all six honest requests.",
    "Someone else's order answers 404, signed out answers 401, the wrong role and any route without a rule 403.",
    "The refund service refuses a caller without the role even with no URL in between.",
    "Every refusal is logged, and no log line contains a password or an Authorization header.",
    "The route inventory reports a route without a rule, read from Spring MVC's handler mapping.",
    "The demo prints the same output on every run.",
]

