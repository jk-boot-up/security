[project]
slug = "broken-access-control-with-spring-security"
level = "intermediate"
module = "web-security"
title = "Broken Access Control with Spring Security"
short_title = "Access Control with Spring Security"
package = "accesscontrolspring"
main_class = "AccessControlSpringDemo"
tagline = "A framework enforces exactly the rules it is given"
bold = "Spring Security enforces every rule it is given and nothing else: a sign-in rule where an ownership rule was needed, a pattern that misses a sub-path, and a permitAll() at the end let seven of nine attacks through. Deny by default, the owner in the query, method security, a denial log and a route inventory test close all nine."
domain = "an online store"
domain_note = ""
youtube_description = """Broken access control with Spring Security, OWASP A01, in Java. Explained with an online store, like a building with a good lock on every door the architect drew, and no lock on the doors added later. A real Spring Boot 4 store with three common mistakes lets seven of nine attacks through: a sign-in rule where an ownership rule was needed, a pattern that covers /admin/users but not /admin/users/ben, and permitAll() at the end. Then it is fixed with deny by default in the filter chain, the owner in the query, @PreAuthorize and @PostAuthorize compared, a log of every refusal from AuthorizationDeniedEvent, and a route inventory test that reads Spring MVC's own handler mapping and fails the build when a route has no rule."""
thumb_lines = ["ACCESS CONTROL", "SPRING SECURITY"]
thumb_code = "anyRequest().denyAll()"
youtube_title = "Broken Access Control with Spring Security (Deny by Default, BOLA, Route Inventory) - OWASP A01"
youtube_tags = ["spring security", "broken access control", "idor", "bola", "owasp top 10", "authorization", "spring boot", "java", "application security"]

[readme]
technologies = [
    ["Spring Boot", "4.1.1", "the store's web server and wiring; its BOM pins the Spring versions below"],
    ["Spring Security", "7.1.1", "the filter chain, method security and authorization events"],
    ["Spring Framework", "7.0.9", "Spring MVC, whose handler mapping the route inventory reads"],
]
intro = """
The plain version of this lesson built access control by hand. Real Java services usually get it from **Spring Security**, which is very good at enforcing rules,
and enforces exactly the rules it is given. This project starts a real **Spring Boot 4** store twice. The first time it has three common configuration
mistakes, and seven of the plain project's nine attacks still succeed. The second time it is fixed with the framework's own tools:

- **deny by default** in `authorizeHttpRequests`, with one rule per method and path and `anyRequest().denyAll()` last;
- **object-level checks in the query** (`findByIdAndOwner`), so another customer's order is simply not found;
- **method security**: `@PreAuthorize` on the refund service, and `@PostAuthorize` compared with the query-level check;
- **a log of every refusal**, from Spring Security's `AuthorizationDeniedEvent`;
- **a route inventory test**, which reads Spring MVC's own handler mapping and fails the build when a route has no rule.

It maps to **OWASP Top 10 (2025) A01, Broken Access Control**; **OWASP API Security Top 10 (2023) API1**, broken object level authorization, and **API5**,
broken function level authorization; **CWE-639**, **CWE-862** and **CWE-285**; and the **Authorization** chapter of **OWASP ASVS 5.0**.
"""
analogy = """
Think of a building with a good lock on every door the architect drew. The locks are excellent. But a door added later has no lock until someone fits one, a lock that only checks
for a staff badge cannot tell whose office it is, and a sign saying "all other doors: open" undoes the rest. The fix is a building where every door starts locked, every
office lock checks the name on the door, and someone walks the corridors with the floor plan to find doors that are not on it.
"""
scenario = """
An online store's API serves orders, delivery addresses, refunds, user management and a sales report, with Spring Boot and Spring Security. The demo attacks the store
as a customer called ana, first with a configuration that has three common mistakes, then with one that uses deny by default, ownership in the query and method security.
"""
costs = [
    "**Rules live in two places.** URL rules in the filter chain and annotations on methods are both needed, and both must be read to know who may do what. The route inventory test keeps the URL rules complete.",
    "**Ownership needs the owner in the query.** `findByIdAndOwner` costs nothing extra when it is the query; checking afterwards with `@PostAuthorize` runs the work first and answers 403, which tells the caller the order exists.",
    "**Deny by default refuses honest mistakes too.** A new route answers 403 until someone writes its rule, which is the point, and is a surprise the first time.",
    "**The framework does not know the business.** No configuration can say that an order belongs to ana; that rule is code the store must write and test.",
]
too_much = """
For a single-page tool with one user, a filter chain with one rule is enough. For any store with customers and staff, all of this is the minimum,
and the route inventory test is the cheapest part: it runs in the normal test suite and needs no maintenance until a route is added.
"""
met_before = [
    "`authorizeHttpRequests` with `anyRequest().denyAll()` or `anyRequest().authenticated()` at the end of a `SecurityFilterChain`.",
    "`@PreAuthorize` and `@PostAuthorize` on service methods, switched on by `@EnableMethodSecurity`.",
    "Spring Data methods such as `findByIdAndOwner(id, owner)`.",
    "Pen-test findings titled IDOR, BOLA or BFLA in a Spring application.",
]
where = """
This is the tools version of [broken-access-control](../broken-access-control), in [web-security](..). It uses Spring Security as the beginner project
[least-privilege-with-spring-security](../../../beginner/safe-habits/least-privilege-with-spring-security) did, and applies it to object-level access.
"""
twin = """
Each act starts a real Spring Boot server on a free port on the loopback address and sends real HTTP requests, so every rule is the framework's own. The users,
orders and requests are fixed, and only status codes and counts are printed, so the output is the same on every run. Every attack targets only this project's own code.
"""
test_note = "Every test starts a real Spring Boot server on a free loopback port and checks only status codes, counts and log lines, so the results are exact on every run."

[[act]]
title = "A Spring store with three common mistakes"
summary = "A sign-in rule where ownership was needed, a pattern that misses /admin/users/ben, and permitAll() at the end let seven of nine attacks through."
detail = """
The first store's rules are: /account and /orders/** need a sign-in, /admin/users needs the admin role, and anyRequest().permitAll() covers the rest. Ana reads her own order 1001 and gets 200, and ben's order 1002 and also gets 200:
the rule said signed in, not whose order. Someone signed out reads /admin/reports and gets 200: permitAll let through a route nobody listed. Ana gets 403 for GET /admin/users, but 200 for DELETE /admin/users/ben, because the
pattern /admin/users does not cover /admin/users/ben, and ben's account is gone. Of the plain project's nine attacks, seven succeed; the one handler written carefully refuses ana with 403. The page hid the admin links from ana, which protected nothing.
"""
speech = """
First demo: a Spring store with three common mistakes. [[slnc 400]] Its rules say: orders need a sign in, the user list needs an admin, and everything else is permitted. [[slnc 600]]
Ana reads ben's order. [[slnc 300]] Two hundred. [[slnc 300]] The rule said signed in, not whose order. [[slnc 600]]
Someone signed out reads the sales report. [[slnc 300]] Two hundred. [[slnc 300]] Permit all let through a route nobody listed. [[slnc 600]]
Ana is refused the user list, but deleting ben's account works. [[slnc 300]] The pattern for the list does not cover the path below it. [[slnc 600]]
Seven of the nine attacks succeed, against a real Spring Security configuration.
"""
rows = { chain = "active wrong" }
console = [
    ["its rules: /account and /orders/** need a sign-in, /admin/users needs ADMIN, and anyRequest().permitAll() for the rest", "muted"],
    ["ana reads ben's order 1002: 200  <- THE RULE SAID SIGNED IN, NOT WHOSE ORDER", "bad"],
    ["someone signed out reads /admin/reports: 200  <- permitAll() LET THROUGH A ROUTE NOBODY LISTED", "bad"],
    ["ana: GET /admin/users 403, DELETE /admin/users/ben 200  <- THE PATTERN /admin/users DOES NOT COVER /admin/users/ben", "bad"],
    ["ben's account still exists: false", "bad"],
    ["the nine attacks of the plain project: 7 of 9 succeed; the one handler written carefully refused ana: 403", "amber"],
]

[[act]]
title = "Deny by default in the filter chain"
summary = "One rule per method and path, with denyAll() last: signed out gets 401, the wrong role 403, and a method or path with no rule 403, even for an admin."
detail = """
The guarded store builds its filter chain from one list of rules, one per method and path, and anyRequest().denyAll() is the last rule. Someone signed out reading /admin/reports gets 401; ana gets 403 for the report, the refund,
the user list and the account deletion. A PUT that nobody wrote a rule for gets 403, and so does dave the admin asking for /admin/debug, a path nobody wrote. But the rule for GET /orders/{id} can only say signed in: a URL rule cannot know whose order 1002 is.
"""
speech = """
Second demo: deny by default. [[slnc 400]] Every route has a rule, by method and path, and the last rule denies everything else. [[slnc 600]]
Signed out, the sales report answers four oh one. [[slnc 300]] Ana gets four oh three for the report, the refund, the user list and the deletion. [[slnc 600]]
A method nobody wrote a rule for is refused. [[slnc 300]] Even the admin is refused a path nobody wrote. [[slnc 600]]
But a URL rule can only say signed in. [[slnc 300]] It cannot know whose order is behind the number.
"""
rows = { chain = "active ok" }
console = [
    ["every route has a rule by method and path, and anyRequest().denyAll() is the last rule", "muted"],
    ["someone signed out reads /admin/reports: 401  <- WHO ARE YOU?", "ok"],
    ["ana reads /admin/reports: 403; ana refunds order 1002: 403", "ok"],
    ["ana: GET /admin/users 403, DELETE /admin/users/ben 403", "ok"],
    ["ana sends PUT /orders/1001, a method nobody wrote a rule for: 403  <- NO RULE, NO ACCESS", "ok"],
    ["but the rule for GET /orders/{id} can only say signed in: a URL rule cannot know whose order 1002 is", "amber"],
]

[[act]]
title = "The object-level check, in the query"
summary = "findByIdAndOwner makes ben's order 404 for ana in all four object attacks; @PostAuthorize instead answers 403 after the lookup has run; 0 of 9 attacks succeed, 6 of 6 honest requests work."
detail = """
Ana's four attempts on ben's orders, reading order 1002, reading his gift order from a leaked link, sending it to her address and cancelling it, all answer 404: the lookup is findByIdAndOwner(id, ana), so ben's order is not found, like a missing order.
Sam from support reads order 1002 with 200, because staff may read any order. The same check written with @PostAuthorize instead answers ana's gift link with 403, and the lookup ran: the 403 confirms the order exists, and the work was already done. Ben opens his own link with 200.
Against the guarded store, 0 of the 9 attacks succeed, and all 6 honest requests still work.
"""
speech = """
Third demo: the object level check, in the query. [[slnc 400]] Ana's four attempts on ben's orders all answer four oh four. [[slnc 600]]
The lookup asks for the order with this number and this owner, so ben's order is simply not found. [[slnc 300]] Exactly like a missing one. [[slnc 600]]
Support staff may still read any order. [[slnc 600]]
The same check written as a post authorize rule answers four oh three, after the lookup has run. [[slnc 300]] That confirms the order exists, and the work is already done. [[slnc 600]]
None of the nine attacks succeed now. [[slnc 300]] All six honest requests still work.
"""
rows = { objects = "active ok" }
console = [
    ["ana reads ben's order 1002: 404; his gift order: 404; moves it: 404; cancels it: 404", "ok"],
    ["the lookup is findByIdAndOwner(id, ana), so ben's order is not found: 404, like a missing order", "ok"],
    ["sam from support reads order 1002: 200, staff may read any order", "muted"],
    ["with @PostAuthorize instead: ana opens ben's gift link: 403, and the lookup ran: true  <- 403 CONFIRMS THE ORDER EXISTS", "amber"],
    ["attacks that succeed: 0 of 9; honest requests that still work: 6 of 6", "ok"],
]

[[act]]
title = "Method security, and a log of every refusal"
summary = "@PreAuthorize on the refund service refuses a nightly job running as ana with no URL in between; 22 refusals are logged with who and what, and none contains a password or header."
detail = """
RefundService.refund carries @PreAuthorize("hasAnyRole('SUPPORT', 'ADMIN')"), so the rule travels with the method. A nightly job running as ana that calls the refund service directly, with no URL in between, is refused; the same job running as sam is recorded.
By now 22 refusals are logged, such as "DENY someone signed out GET /admin/reports", "DENY ana DELETE /admin/users/ben", "DENY ana GET /orders/{id}: order 1002 is not theirs" and "DENY ana RefundService.refund". No password or Authorization header appears in the log.
The filter chain and method security publish an AuthorizationDeniedEvent for their refusals; the store logs its object-level refusals itself.
"""
speech = """
Fourth demo: method security, and a log. [[slnc 400]] The refund service carries its own rule: support or admin only. [[slnc 600]]
A nightly job running as ana calls the service directly, with no web address in between. [[slnc 300]] It is refused. [[slnc 300]] The same job running as sam works. [[slnc 600]]
Every refusal so far is logged, twenty two of them, with who asked and for what. [[slnc 300]] No password and no credentials header appears in the log. [[slnc 600]]
Spring Security publishes an event for each refusal it makes, and the store logs the refusals it makes itself.
"""
rows = { methods = "active ok", log = "active ok" }
console = [
    ["a nightly job running as ana calls the refund service directly, with no URL in between: refused", "ok"],
    ["the same job running as sam: recorded", "muted"],
    ["refusals logged so far: 22, for example:", "muted"],
    ["  DENY ana DELETE /admin/users/ben", "muted"],
    ["  DENY ana GET /orders/{id}: order 1002 is not theirs", "muted"],
    ["  DENY ana RefundService.refund", "muted"],
    ["a password or an Authorization header appears in the log: false", "ok"],
]

[[act]]
title = "The route inventory, and the bill"
summary = "The inventory reads 11 routes from Spring MVC's handler mapping and reports GET /admin/export, added without a rule, which even the admin is refused."
detail = """
The route inventory reads every route the controllers serve from Spring MVC's own handler mapping: 11. A developer has added GET /admin/export and forgot its rule, so the routes without a rule are [GET /admin/export], and the route inventory test fails the build.
Until it has one, even dave the admin is refused with 403, denied by default. The bill: rules now live in two places, the route list and the method annotations, and the inventory test keeps the first complete; and every object-level check needs the owner in the query,
with @PostAuthorize as a fallback for when it cannot be there.
"""
speech = """
Fifth demo: the route inventory, and the bill. [[slnc 400]] A test reads every route the controllers serve, straight from Spring's own handler mapping. [[slnc 300]] Eleven routes. [[slnc 600]]
A developer adds an export route and forgets its rule. [[slnc 300]] The test names it, and fails the build. [[slnc 300]] Until it has a rule, even the admin is refused. [[slnc 600]]
And the bill. [[slnc 300]] Rules now live in two places, the route list and the method annotations. [[slnc 300]] And every ownership check needs the owner in the query, with post authorize only as a fallback.
"""
rows = { inventory = "active ok" }
console = [
