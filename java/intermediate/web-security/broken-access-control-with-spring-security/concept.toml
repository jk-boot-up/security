tagline = "A framework enforces exactly the rules it is given"
bold = "Spring Security enforces every rule it is given and nothing else: a sign-in rule where an ownership rule was needed, a pattern that misses a sub-path, and a permitAll() at the end let seven of nine attacks through. Deny by default, the owner in the query, method security, a denial log and a route inventory test close all nine."
domain = "an online store"
domain_note = ""
youtube_description = """Broken access control with Spring Security, OWASP A01, in Java. Explained with an online store, like a building with a good lock on every door the architect drew, and no lock on the doors added later. A real Spring Boot 4 store with three common mistakes lets seven of nine attacks through: a sign-in rule where an ownership rule was needed, a pattern that covers /admin/users but not /admin/users/ben, and permitAll() at the end. Then it is fixed with deny by default in the filter chain, the owner in the query, @PreAuthorize and @PostAuthorize compared, a log of every refusal from AuthorizationDeniedEvent, and a route inventory test that reads Spring MVC's own handler mapping and fails the build when a route has no rule."""
thumb_lines = ["ACCESS CONTROL", "SPRING SECURITY"]
thumb_code = "anyRequest().denyAll()"
youtube_title = "Broken Access Control with Spring Security (Deny by Default, BOLA, Route Inventory) - OWASP A01"
