[[act]]
title = "Method security, and a log of every refusal"
summary = "RefundService.refund carries @PreAuthorize(\"hasAnyRole('SUPPORT', 'ADMIN')\"): a nightly job running as ana is refused with no URL in between, as sam it is recorded; 22 refusals are logged, with no password or Authorization header."
detail = """
RefundService.refund carries @PreAuthorize("hasAnyRole('SUPPORT', 'ADMIN')"), so the rule travels with the method. A nightly job calls the refund service directly, with no URL and no filter chain in between. Running as ana, a CUSTOMER, it is refused; running as sam, from SUPPORT, it is recorded.
22 refusals have been logged so far, for example DENY someone signed out GET /admin/reports, DENY ana DELETE /admin/users/ben, DENY ana GET /orders/{id}: order 1002 is not theirs, and DENY ana RefundService.refund. No password or Authorization header appears in the log.
Spring publishes an AuthorizationDeniedEvent for each refusal of the filter chain and of method security; the store logs the object-level refusals itself.
"""
figure = "method_rule"
figure_title = "A rule on the method holds without any URL"
figure_speech = """
Fourth demo: method security. [[slnc 400]] On the left, a nightly job. [[slnc 300]] It does not send an H T T P request. [[slnc 300]] It calls the refund service directly, so the filter chain never sees it. [[slnc 700]]
In the middle, the refund method. [[slnc 300]] Its rule is written on the method itself: support or admin only. [[slnc 600]] Running as ana, a customer: refused. [[slnc 300]] Running as sam, from support: the refund is recorded. [[slnc 700]]
On the right, the log. [[slnc 300]] Every refusal, from the filter chain, the method rule, and the query, is one line. [[slnc 300]] Who asked, and what for. [[slnc 300]] Never a password.
"""
