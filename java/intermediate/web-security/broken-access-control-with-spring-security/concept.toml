[[act]]
title = "The object-level check, in the query"
summary = "The lookup is findByIdAndOwner(id, ana), so ben's order is simply not found: 404 for all four order attacks. The same check with @PostAuthorize answers 403, which confirms the order exists, after the lookup already ran. 0 of 9 attacks, 6 of 6 honest requests."
detail = """
After the fix, the four attacks on ben's orders answer 404. The lookup is findByIdAndOwner(id, ana), so ben's order is not found, exactly like a missing order. Sam from support reads order 1002 with 200, because staff may read any order.
The same check written with @PostAuthorize runs after the method: ana opens ben's gift link and gets 403, and the lookup had already run. A 403 confirms that the order exists, and the work was already done. Ben opens his own gift link with 200.
In total, 0 of 9 attacks succeed, and 6 of 6 honest requests still work.
"""
figure = "query_vs_post"
figure_title = "Two ways to check the owner: in the query, or after it"
figure_speech = """
Third demo: the object level check. [[slnc 400]] Two ways to check that ana owns order one thousand and two. [[slnc 700]]
At the top, in the query. [[slnc 300]] The lookup asks for order one thousand and two, owned by ana. [[slnc 300]] There is no such row. [[slnc 300]] So the answer is four oh four, exactly like a missing order. [[slnc 300]] Ana learns nothing. [[slnc 700]]
At the bottom, after the method, with post authorize. [[slnc 300]] The lookup asks only for order one thousand and two. [[slnc 300]] It finds ben's order, and loads it. [[slnc 300]] Only then is the owner compared, and the answer is four oh three. [[slnc 300]] Forbidden tells ana the order exists. [[slnc 300]] And the work was already done. [[slnc 700]]
Put the owner in the query, when you can.
"""
speech = """
Here is the output. [[slnc 400]] The four attacks on ben's orders: four oh four, all four. [[slnc 400]] Why four oh four? [[slnc 300]] The lookup includes the owner, so ben's order is not found. [[slnc 300]] Sam from support still reads it, because staff may read any order.
[[page]]
The same check with post authorize: four oh three, and the lookup had already run. [[slnc 400]] Ben still opens his own link. [[slnc 400]] In total: none of the nine attacks succeed, and all six honest requests still work.
"""
