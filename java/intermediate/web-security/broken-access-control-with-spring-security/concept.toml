[[scene]]
key = "01-poster"
kind = "poster"
title = "Broken Access Control with Spring Security"
narration = """Hello, and welcome. [[slnc 400]] This video explains broken access control with Spring Security, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] Spring Security enforces every access rule it is given. [[slnc 300]] And nothing else. [[slnc 600]] Think of a building with a good lock on every door the architect drew. [[slnc 300]] A door added later has no lock. [[slnc 300]] A lock that checks for a staff badge cannot tell whose office it is. [[slnc 300]] And a sign saying, all other doors open, undoes the rest. [[slnc 700]] In this video, the domain is an online store. [[slnc 500]] By the end, you will hear three common configuration mistakes. [[slnc 300]] How deny by default closes them. [[slnc 300]] Why ownership belongs in the query. [[slnc 300]] And how a test finds a route with no rule."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online store on Spring Boot.", "", "Orders, addresses, refunds,", "users and a sales report.", "", "A customer called ana", "tries what she should not."]
narration = """Here is the scenario. [[slnc 400]] An online store runs on Spring Boot and Spring Security. [[slnc 500]] It serves orders, delivery addresses, refunds, user management and a sales report. [[slnc 500]] A customer called ana tries everything she should not be able to do."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["Filter chain: rules by route", "denyAll(): refuse what no rule allows", "Object level: whose record is it?", "Method security: rules on the service", "Route inventory: every route has a rule"]
narration = """Before the demos, the words. [[slnc 500]] The filter chain holds the rules for each route. [[slnc 500]] Deny all, as the last rule, refuses whatever no rule allows. [[slnc 500]] The object level asks whose record it is. [[slnc 500]] Method security puts rules on the service methods themselves. [[slnc 500]] And a route inventory checks that every route has a rule."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "09-ladder"
kind = "bullets"
title = "Three Walls"
body = ["The filter chain: may this person use this route?", "The query: is this record theirs?", "Method security: may this caller do this, from anywhere?", "", "Each catches what the others cannot."]
narration = """Let's put the walls side by side. [[slnc 400]] The filter chain asks whether this person may use this route. [[slnc 500]] The query asks whether this record is theirs. [[slnc 500]] Method security asks whether this caller may do this, wherever the call comes from. [[slnc 600]] Each one catches what the others cannot see."""

[[scene]]
key = "10-roles"
kind = "bullets"
title = "Who Does What"
body = ["AccessRules: one list of route rules", "GuardedSecurity: the chain, denyAll() last", "OrderAccess and Orders: ownership", "RefundService: @PreAuthorize", "RouteInventory and DenialLog"]
narration = """Here is who does what in the code. [[slnc 400]] The access rules class is one list of route rules. [[slnc 500]] The guarded security class builds the filter chain from it, with deny all last. [[slnc 500]] The order access and orders classes decide ownership in the lookup. [[slnc 500]] The refund service carries its own rule. [[slnc 300]] And the route inventory and the denial log keep everything visible."""

[[scene]]
key = "11-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["anyRequest().permitAll() in a review", "requestMatchers(\"/admin/users\") without /**", "findById in a customer's controller", "Pen-test findings: IDOR, BOLA, BFLA"]
narration = """You have probably met this already. [[slnc 400]] Permit all at the end of a configuration is the first thing a reviewer looks for. [[slnc 500]] A pattern for a path, where the path and everything below it was meant. [[slnc 500]] Find by id, in a controller that serves customers. [[slnc 500]] And pen test reports with names like I D O R and B O L A."""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["End the chain with denyAll()", "One rule per method and path", "Owner in the query", "@PreAuthorize on services", "Fail the build on a route without a rule"]
narration = """So, how do you use it? [[slnc 400]] End every filter chain with deny all. [[slnc 500]] Write one rule per method and path, from one list. [[slnc 500]] Put the owner in the query. [[slnc 500]] Put rules that must hold everywhere on the service methods. [[slnc 500]] And fail the build when a route has no rule."""

[[scene]]
key = "13-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a route,", "and watch the inventory test fail."]
narration = """That's broken access control with Spring Security. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] The framework enforces exactly the rules it is given, so deny by default, and put the owner in the query. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine, with nothing installed except a Java development kit. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a route without a rule, and watch the inventory test fail. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
Access control in an online store's Spring Boot API: the filter chain's route rules, the ownership checks on orders, method security on refunds, the denial log and the route inventory. It covers a signed-in customer reaching other customers'
data or staff functions, and someone signed out reaching any route. It does not cover authentication strength, CSRF, or the storage of orders.
"""
assets = [
    "Customers' orders and delivery addresses.",
    "Staff functions: refunds, user management and the sales report.",
    "Customer accounts.",
    "The denial log.",
]
actors = [
    "Customers, who should reach only their own orders.",
    "Support staff and admins, with wider rights.",
    "Someone signed out.",
    "Developers adding routes later.",
]
boundaries = [
    "Internet to the filter chain: every request crosses it.",
    "Controller to service: the method security boundary, which also guards callers with no URL.",
    "Service to the order store: where ownership is decided.",
]
assumptions = [
    "Authentication is sound: a signed-in name is the real person.",
    "Every controller is in the store's own package, so the inventory sees it.",
    "In the demo, every account has the demo password, and every attack targets only this project's own code.",
]
out_of_scope = [
    "Authentication: the identity modules.",
    "Cross-site request forgery: its own project.",
    "Database-level row security: the advanced track.",
]
tests = [
    "`GuardedStoreTest` checks twenty requests' statuses, all nine attacks failing, six honest requests working, @PostAuthorize, the denial log and the route inventory.",
    "`NaiveAndLaterStoreTest` checks the three naive mistakes, and that a later route without a rule is reported and refused.",
    "`OrdersTest` checks that ownership is part of the lookup and that the rule list has no duplicates.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next project in web-security, cross-site-scripting, moves from who may act to what the store sends back to the browser.
"""

[[threat]]
id = "T1"
stride = "I"
threat = "A customer reads or changes another customer's order by changing its number (IDOR, BOLA)"
where = "`OrderAccess`, `Orders`"
control = "The owner is part of the query (findByIdAndOwner), so someone else's order is not found"
residual = "Every new lookup must use the owner too; a findById in a customer path brings the problem back"

[[threat]]
id = "T2"
stride = "E"
threat = "A route nobody listed is reachable by anyone, through permitAll() at the end of the chain"
where = "`NaiveSecurity`"
control = "anyRequest().denyAll() is the last rule of the guarded chain"
residual = "A rule that is too broad, such as permitAll on /**, still opens everything below it"

[[threat]]
id = "T3"
stride = "E"
threat = "A pattern covers a path but not the paths below it, so DELETE /admin/users/ben is unchecked"
where = "`NaiveSecurity`"
control = "One rule per method and exact pattern, and deny by default for anything else"
residual = "Pattern syntax must be read carefully in review; tests per route catch it"

[[threat]]
id = "T4"
stride = "E"
threat = "A staff function is called from somewhere with no URL rule, such as a job or a new controller"
where = "`RefundService`"
control = "@PreAuthorize on the service method holds for every caller"
residual = "Code that skips the Spring proxy, such as a call from inside the same class, is not checked"

[[threat]]
id = "T5"
stride = "E"
threat = "A new route is added without a rule"
where = "`AccessRules`, `RouteInventory`"
control = "Denied by default at run time, and the route inventory test fails the build"
residual = "Controllers outside the store's package are not inventoried"

[[threat]]
id = "T6"
stride = "R"
threat = "Attacks go unnoticed, or credentials end up in the logs"
where = "`DenialLog`"
control = "Every refusal is logged with who and what, from AuthorizationDeniedEvent and from the store; no credentials or headers are logged"
residual = "Someone must read the log and alert on it: the detection module"
