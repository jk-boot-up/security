[[act]]
title = "The route inventory, and the bill"
summary = "The inventory reads 11 routes from Spring MVC's handler mapping; a new GET /admin/export without a rule fails the build and is refused even to the admin; the bill is rules in two places and the owner in every query."
detail = """
The route inventory reads every route the controllers serve from Spring MVC's handler mapping: 11. A developer adds GET /admin/export and forgets its rule; the inventory lists [GET /admin/export] and the build fails. Until it has a rule, even dave the admin is refused with 403: denied by default.
The bill: rules now live in two places, the route list and the method annotations, and the inventory test keeps the route list complete. Every object check needs the owner in the query, and @PostAuthorize is a fallback for when it cannot be there.
"""
figure = "spring_inventory"
figure_title = "Spring lists the routes; a test checks each has a rule"
figure_speech = """
Fifth demo: keeping it right. [[slnc 400]] On the left, the routes that Spring itself knows about. [[slnc 300]] It reads them from the handler mapping, so a route cannot hide. [[slnc 300]] Eleven of them. [[slnc 700]]
Each is checked against the rule list. [[slnc 300]] Ten have a rule. [[slnc 300]] The new export route has none, in red. [[slnc 300]] The test fails, and the build stops. [[slnc 600]] Until someone writes its rule, deny all refuses it, even for the admin. [[slnc 700]]
On the right, the bill. [[slnc 300]] Two places to keep rules, and a test that keeps one of them complete.
"""
speech = """
Here is the output. [[slnc 400]] Spring serves eleven routes. [[slnc 300]] The new export route has no rule, so the build fails. [[slnc 300]] And the admin is refused: deny by default. [[slnc 500]] The bill. [[slnc 300]] Rules live in two places, the route list and the annotations. [[slnc 300]] Every object check needs the owner in the query. [[slnc 300]] And post authorize is the fallback, when it cannot be there.
