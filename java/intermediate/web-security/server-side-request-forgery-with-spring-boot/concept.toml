# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "server-side-request-forgery-with-spring-boot"
level = "intermediate"
module = "web-security"
title = "Server-Side Request Forgery with Spring Boot"
short_title = "SSRF with Spring Boot"
package = "ssrfspring"
main_class = "SsrfSpringDemo"
tagline = "A Spring RestClient fetches whatever it is told, so the address must be judged after resolution and the connection must go to the address that was judged"
bold = "When a Spring Boot shop fetches an image from a customer's address, the server's network position becomes the attacker's; a name blocklist is read one way by the check and another by the network, so the fix is to resolve the name once, judge every resulting address, connect to the address that was judged, revalidate each redirect, and limit the type, size and time of the answer."
domain = "an online store's product image import"
domain_note = ""
youtube_description = "SSRF in Spring Boot 4: RestClient, a blocklist that fails, resolving and pinning the address, redirects, DNS rebinding and limits."
thumb_lines = ["SSRF WITH", "SPRING BOOT"]
thumb_code = "judge the address, then connect to it"
youtube_title = "SSRF in Spring Boot: RestClient, Resolved Addresses, Redirects and DNS Rebinding"
youtube_tags = ["ssrf", "spring boot", "restclient", "dns rebinding", "java", "application security"]

[readme]
intro = """
The plain [server-side-request-forgery](../server-side-request-forgery) project simulates the network. This one uses the real thing: **Spring Boot 4.1** with Spring's **`RestClient`** fetching from real HTTP servers on the loopback address. A small *invented internet* maps public, metadata and intranet addresses onto those servers, so the attacks work for real without leaving the machine.

What it shows:
- **A staff form "import an image from a web address"** lets the server fetch the cloud metadata address, localhost and the office admin page, because the server sits inside the network that the attacker cannot reach.
- **A blocklist of names is read as text,** while the network layer reads an address. A decimal spelling, `127.1`, a mapped IPv6 address, a name that points inside and a redirect from an outside address all walk round it.
- **The fix judges the resolved address.** The name is resolved once, every address it resolves to is checked, and the connection goes to the address that was checked, with the original host in the `Host` header. Each redirect is judged again, user info and odd ports are refused, and the answer must be a small image that arrives in time.
- **Check-then-connect is not enough.** A name server that answers a public address first and a private one next defeats a client that resolves the name twice.

**Maps to:** OWASP Top 10 (2025) A01 Broken Access Control, which now includes server-side request forgery · CWE-918 · OWASP ASVS 5.0 V5 (File Handling) · OWASP SSRF Prevention Cheat Sheet.
"""
analogy = """
A receptionist who will phone any number a visitor writes on a slip. The visitor cannot enter the back office, but the receptionist's phone can reach every extension. If the receptionist checks the slip for the word "payroll" and the visitor writes the extension number instead, the call goes through.
"""
scenario = """
An online store lets staff import a product image from a web address. The demo starts the real shop five times, with a different importer each time, and posts addresses to it. The addresses lead into a small invented internet of local servers.
"""
costs = [
    "**Connecting to a chosen address needs the Host header,** and an HTTPS client must keep the name for the certificate check, which a plain address-literal URL does not.",
    "**Real DNS can change between lookups,** so the lookup and the connection must use the same answer.",
    "**Redirects need judging again** or are not followed at all, and some honest hosts redirect.",
    "**Allow-lists of hosts are stronger than address checks** where the shop knows its image hosts, but staff ask for new ones.",
    "**Egress rules in the network are the second wall,** because code can still be wrong.",
]
too_much = """
If the shop knows which hosts it imports from, keep an allow-list of hosts and let the network refuse everything else. The address checks in this project are for a feature that must accept any public address.
"""
met_before = [
    "`RestClient.get().uri(url)` with a URL from a request parameter.",
    "A cloud metadata address in an incident report.",
    "`InetAddress.isSiteLocalAddress()` in a validation helper.",
    "A webhook or image import form that takes a URL.",
]
where = """
This is the tools version of [server-side-request-forgery](../server-side-request-forgery), in the [web-security](..) module. It follows the same five stories and prints the same lines where the stories match.
"""
twin = """
The shop is a real Spring Boot application, the client is Spring's `RestClient` over the JDK HTTP client, and the answers come from real HTTP servers on loopback. Only the addresses are invented: the demo's name server and router send a connection for an invented address to a local server. Ports are never printed.
"""
test_note = "Each server answers on its own thread, and the timeouts are generous, so the demo prints the same text on every run."

[[act]]
title = "Importing an image from a web address"
summary = "An honest address fetches the image."
detail = """
Staff paste an address into a form. The Spring Boot shop posts it to the importer, which fetches the address with RestClient and returns the image bytes. The honest address gives PNG-cat.
"""
speech = """
First demo: importing an image from a web address. [[slnc 400]] Staff paste an address into a form. [[slnc 300]] The shop fetches it with Spring's Rest Client. [[slnc 300]] The honest address gives a cat picture.
"""
rows = { honest = "active ok" }
console = [
    ["honest address -> imported: PNG-cat", "ok"],
]

[[act]]
title = "The server fetches whatever it is told"
summary = "The metadata address, localhost and the office admin page all answer the importer with their secrets."
detail = """
The first version fetches any address. The cloud metadata address returns a demo access key, localhost returns a demo database password, and the office admin page returns its customer list. None of these can be reached from outside, but the shop's server can.
"""
speech = """
Second demo: the server fetches whatever it is told. [[slnc 400]] The metadata address answers with a key. [[slnc 300]] Localhost answers with a database password. [[slnc 300]] The office page answers with its customer list. [[slnc 600]] The attacker cannot reach them, but the shop's server can.
"""
rows = { naive = "active wrong" }
console = [
    ["metadata address -> imported: AccessKeyId=DEMO-NOT-A-REAL-KEY", "bad"],
    ["localhost -> imported: DB_PASSWORD=demo-not-real", "bad"],
    ["office admin page -> imported: internal admin panel: 3 customers", "bad"],
]

[[act]]
title = "A blocklist of names is easy to walk around"
summary = "The listed name is refused; a decimal spelling, 127.1, a mapped IPv6 address, a name that points inside and a redirect all get through."
detail = """
The second version refuses a list of host names. The metadata address is refused by name. The same address written as the decimal number 2852039166, localhost as 127.1, the metadata address as a mapped IPv6 address, an attacker's name that resolves to the office address, and a redirect from an outside address all
get through, because the list compares text and the network layer reads an address.
"""
speech = """
Third demo: a blocklist of names. [[slnc 400]] The listed name is refused. [[slnc 600]] The same address as a decimal number gets through. [[slnc 300]] So does a short form of localhost, a mapped I P version six address, a name that points inside, and a redirect. [[slnc 600]] The list compares text, and the network reads an address.
"""
rows = { blocklist = "active wrong" }
console = [
    ["metadata address -> refused: blocked host name 169.254.169.254", "ok"],
    ["decimal spelling -> imported: AccessKeyId=DEMO-NOT-A-REAL-KEY", "bad"],
    ["short loopback -> imported: DB_PASSWORD=demo-not-real", "bad"],
    ["redirect from outside -> imported: AccessKeyId=DEMO-NOT-A-REAL-KEY", "bad"],
]

[[act]]
title = "Check the address the connection really uses"
summary = "The importer resolves the name once, judges every address, connects to the judged address and judges each redirect again; every disguise is refused and the honest address still works."
detail = """
The guarded importer resolves the host name once and judges every address it resolves to. The decimal spelling, 127.1, the mapped IPv6 address, the name that points inside, the redirect and a name with two answers (one private) are all refused, with the address they resolved to in the message.
User info in the address is refused. The attacker's own image from a name that rebinds is fetched, and nothing else, because the connection goes to the address that was judged. The honest address still imports.
"""
speech = """
Fourth demo: check the address the connection really uses. [[slnc 400]] The importer resolves the name once and judges every address it resolves to. [[slnc 600]] Every disguise is refused, with the real address in the message. [[slnc 300]] A redirect is judged again from the start. [[slnc 600]] The honest address still works.
"""
rows = { guarded = "active ok" }
console = [
    ["decimal spelling -> refused: 2852039166 resolves to a private address 169.254.169.254", "ok"],
    ["redirect from outside -> refused: 169.254.169.254 resolves to a private address 169.254.169.254", "ok"],
    ["two answers, one private -> refused", "ok"],
    ["honest address -> imported: PNG-cat", "ok"],
]

[[act]]
title = "Limits, and why checking and then connecting is not enough"
summary = "Odd ports, pages that are not images, large answers and slow answers are refused; a client that checks and then connects by name is beaten by a rebinding name server."
detail = """
The guarded importer allows only ports 80 and 443, only images, at most 1024 bytes, and an answer within 1500 milliseconds. A web page, a 5000 byte answer and a slow server are each refused. The last row shows the mistake that looks like a fix: a client that resolves the name, judges it and
then resolves the name again to connect. The attacker's name server answers a public address first and the private office address next, so the office page is imported.
"""
speech = """
Fifth demo: limits, and why checking and then connecting is not enough. [[slnc 400]] Only two ports, only small images, and only an answer that comes in time. [[slnc 600]] Then the mistake that looks like a fix. [[slnc 300]] A client that checks the name and then looks it up again can be given a public address first and a private one next. [[slnc 600]] Connecting to the address that was judged closes that gap.
"""
rows = { limits = "active wrong" }
console = [
    ["a web page, not an image -> refused: not an image (text/html)", "ok"],
    ["an answer of 5000 bytes -> refused: larger than 1024 bytes", "ok"],
    ["an answer that takes 3 seconds -> refused: no answer within 1500 ms", "ok"],
    ["check, then connect by name -> imported: internal admin panel: 3 customers", "bad"],
]

