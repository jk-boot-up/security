    "Network access: everything stays on the loopback address",
]
install = []

[docs.session]
objectives = [
    "explain why a server that fetches a customer's address is reachable from outside",
    "show why a blocklist of names fails against the resolver",
    "judge every resolved address and connect to the judged address",
    "name the limits that go with the address check",
]
walkthrough = """
Run act three and ask what the blocklist compares and what the network connects to. In act four ask which address the connection used. In act five ask what happens if the lookup is repeated.
"""
exercises = [
    "Add an allow-list of image hosts and decide which check comes first.",
    "Make the importer handle HTTPS and keep the host name for the certificate check.",
    "Add a test that every address in the policy table of private ranges is refused.",
    "Add a per-user rate limit on imports.",
]

[docs.explained]
sentence = """
A server that fetches an address for a customer lends out its network position, so the address that is really connected to must be judged, after resolution, and the connection must go to that same address.
"""
verdict = """
Resolve once, judge every address, connect to the judged address, revalidate every redirect, allow only the ports and content you need, cap size and time, prefer an allow-list of hosts where you have one, and add network egress rules as a second wall.
"""
recognise = [
    "`RestClient.get().uri(url)` with a user-supplied URL.",
    "`isSiteLocalAddress()` checks in validation helpers.",
    "A cloud metadata address in an incident report.",
    "\"Import from URL\" in an admin form.",
]

[spec]
purpose = """
Teach server-side request forgery on a real Spring Boot application with RestClient: the naive importer, a blocklist, and the address-pinning fix with limits.
"""
nongoals = [
    "A real cloud metadata service.",
    "HTTPS and certificate handling.",
    "Network-level egress rules, which are described only.",
]
problem = """
Servers fetch customer-supplied addresses from inside a trusted network, and checks on the text of the address do not match what the network connects to.
"""
roles = [["Importers", "`NaiveImporter`, `BlocklistImporter`, `GuardedImporter`, `TwoStepImporter`"], ["Judging and parsing", "`AddressPolicy`, `Target`"], ["Fetching", "`Fetcher`, `Dns`, `Router`"], ["The invented internet", "`Internet`"], ["The web layer and entry point", "`ImportController`, `SsrfSpringDemo`"]]
requirements = [
    "The naive importer reaches the metadata address, localhost and the office page.",
    "A blocklist of names is beaten by a decimal spelling, a short loopback, a mapped IPv6 address, a name that points inside and a redirect.",
    "The guarded importer refuses all of them, judges each redirect and refuses user info and odd ports.",
    "The guarded importer connects to the address it judged and so cannot be rebound.",
    "A check followed by a second lookup is beaten by a rebinding name server.",
    "Type, size and time are limited.",
    "The demo prints the same output on every run.",
]

