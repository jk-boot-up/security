[[scene]]
key = "01-poster"
kind = "poster"
title = "Server-Side Request Forgery with Spring Boot"
narration = "Hello, and welcome. [[slnc 400]] This video explains server-side request forgery, S S R F, with Spring Boot, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] When a server fetches a web address for someone, it fetches it from inside the company network. [[slnc 300]] So whoever chooses the address can reach what the server can reach. [[slnc 600]] Think of a courier who will collect a parcel from any address you write down. [[slnc 300]] Write the address of a locked room inside the courier's own warehouse, and the courier walks straight in, because the courier has the keys. [[slnc 600]] Our example is an online store built on Spring Boot, with a form that imports product images."

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online store lets staff import", "a product image from a web address.", "", "Spring's RestClient fetches it.", "", "The demo starts the real shop four times,", "each with a different importer.", "A small invented internet runs on this machine."]
narration = "Here is the scenario. [[slnc 400]] An online store lets staff import a product image, by pasting its web address into a form. [[slnc 300]] Spring's Rest Client fetches it. [[slnc 500]] The demo starts the real shop four times, each time with a different importer. [[slnc 500]] The addresses lead into a small invented internet of servers on this machine: a public image host, the cloud metadata service, the shop's own settings, and an office admin page. [[slnc 300]] Every secret in it is fake."

[[scene]]
key = "02-words"
kind = "bullets"
title = "The Words"
body = ["Host: a computer; its name or its address", "Lookup: turning a name into addresses", "Host header: the name, sent with the request", "Redirect: an answer that says: go there", "Metadata service: hands a cloud server its keys", "Inside: loopback, link-local, private"]
narration = """Before the demos, the words. [[slnc 500]] A host is a computer on the network, known by a name or by an address. [[slnc 500]] A lookup turns a name into one or more addresses. [[slnc 500]] The host header is a line in the request that carries the name, so one server can answer for many names. [[slnc 500]] A redirect is an answer that says: the thing you want is over there. [[slnc 500]] A cloud server asks the metadata service for its own keys. [[slnc 500]] And inside addresses come in three kinds. [[slnc 300]] Loopback is the server itself. [[slnc 300]] Link local is the local network segment, where the metadata service lives. [[slnc 300]] Private addresses are the office network."""

[[scene]]
key = "02-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "02-inside-reach"
kind = "figure"
title = "The shop stands inside"
body = "inside_reach"
narration = """Let's see the whole idea on one picture. [[slnc 400]] On the left, the staff form that posts an address. [[slnc 300]] In the middle, the Spring Boot shop, which fetches it with Rest Client. [[slnc 300]] The green dashed line is the company network. [[slnc 700]]
On the right, the five hosts of the demo's invented internet. [[slnc 300]] Two are public: an image host, and the attacker's host. [[slnc 300]] Three are inside: the metadata service, the shop's own settings, and an office admin page. [[slnc 700]]
From outside, nobody reaches the red ones. [[slnc 300]] But the shop can, and it fetches whatever address it is given. [[slnc 700]]
That is server side request forgery. [[slnc 300]] The defence is to judge where each request really goes, and send it only there."""

[[scene]]
key = "03-acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "04-costs"
kind = "bullets"
title = "What It Costs"
body = ["Connecting to a chosen address", "  means setting the Host header yourself", "A name can resolve differently each time", "Every redirect must be judged again", "A fixed list of hosts is stronger still", "Network rules for outgoing traffic: the second wall"]
narration = "Nothing is free. [[slnc 400]] Here is what the defences cost. [[slnc 500]] To connect to the address you checked, you send the original host name yourself, in the host header. [[slnc 500]] A real name server can answer differently each time it is asked, so the name must be looked up only once. [[slnc 500]] Every redirect has to be judged again, from the start. [[slnc 500]] Where you can, a fixed list of allowed hosts is stronger than any address check. [[slnc 300]] And network rules that limit the server's outgoing traffic are the second wall."

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["An isSiteLocalAddress() check: it misses", "  loopback and the metadata address", "169.254.169.254 in an incident report", "\"Import from URL\" in an admin form"]
narration = "You have probably met this already. [[slnc 400]] A check that calls is site local address looks safe, but it misses localhost and the cloud metadata address, which are not site local. [[slnc 500]] The address one sixty-nine, two fifty-four, one sixty-nine, two fifty-four in an incident report is the metadata service, and the server's credentials. [[slnc 500]] And a field called import from U R L, in an admin form, is the door this attack walks through."

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Look the name up once", "Judge every address it resolves to", "Connect to the address you judged", "Judge every redirect again", "Only the ports, type, size and time you need", "Allow-list hosts; add network rules"]
narration = "So, how do you use it? [[slnc 400]] Look the name up once. [[slnc 300]] Judge every address it resolves to, and refuse the request if any of them is not public. [[slnc 500]] Connect to the address you judged, not to the name. [[slnc 500]] Judge every redirect again, from the start. [[slnc 500]] Allow only the ports and the kind of content you need, and limit the size and the time. [[slnc 500]] Where you can, keep a fixed list of allowed hosts, and add network rules for outgoing traffic as a second wall."

[[scene]]
key = "12-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add an allow-list of image hosts", "and decide which check comes first."]
narration = "That's S S R F with Spring Boot. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] A server that fetches an address for someone lends out its place in the network, so judge the address after the name is looked up, and connect to that same address. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add an allow-list of image hosts, and decide which check should come first. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] A real Spring Boot shop, Spring's Rest Client, and real servers on this machine. [[slnc 300]] Here are the classes that matter."""

[[class]]
name = "ImportController"
what = "the form's endpoint: one importer behind it"
[[class.part]]
title = "POST /import"
code = """
@PostMapping("/import")
ResponseEntity<String> importImage(@RequestParam String url) {
    try {
        return ResponseEntity.ok(importer.importImage(url));
    } catch (ImportRefused e) {
        return ResponseEntity.status(HttpStatus.BAD_REQUEST).body("refused: " + e.getMessage());
"""
speech = """The controller takes the u r l field of the form. [[slnc 300]] An import answers two hundred, a refusal answers four hundred. [[slnc 300]] Which importer sits behind it is chosen by a Spring profile."""

[[class]]
name = "NaiveImporter"
what = "the first version: look up, connect, follow every redirect"
[[class.part]]
title = "the name is looked up for every hop"
code = """
List<InetAddress> found = dns.resolve(target.host());
InetAddress first = found.get(0);
...
return fetcher.get(router.route(first, target.port()), target.host(), target.path());
"""
speech = """The first version looks the host up and fetches from the first address. [[slnc 300]] Nothing asks whether that address is inside. [[slnc 300]] The blocklist and two-step versions only add a check in front of it."""

[[class]]
name = "GuardedImporter"
what = "the fix: judge every address, connect to the one judged"
[[class.part]]
title = "every answer must be public"
code = """
addresses = dns.resolve(host);
...
for (InetAddress candidate : addresses) {
    if (!AddressPolicy.isPublic(candidate)) {
...
InetAddress chosen = addresses.get(0);
...
return chosen; // the connection goes to this very address: the name is never looked up again
"""
speech = """The guarded importer looks the name up once, and judges every answer. [[slnc 300]] One inside answer refuses the name. [[slnc 300]] It returns the address it judged, so the connection goes there and nowhere else."""
[[class.part]]
title = "connect, then judge the redirect again"
code = """
InetAddress chosen = resolveAndJudge(target.host());
...
reply = fetcher.get(router.route(chosen, target.port()), target.host(), target.path());
...
if (reply.status() / 100 == 3 && reply.location() != null) {
    current = target.redirectTo(reply.location());
"""
speech = """It fetches from the chosen address, and sends the name in the host header. [[slnc 300]] A redirect becomes a new address, and the loop judges it again from the start."""

[[class]]
name = "Fetcher"
what = "one RestClient request: no redirects, few bytes, a timeout"
[[class.part]]
title = "the client is told not to follow"
code = """
.followRedirects(HttpClient.Redirect.NEVER) // the importer decides about every redirect
.connectTimeout(TIMEOUT)
...
factory.setReadTimeout(TIMEOUT);
...
byte[] bytes = in.readNBytes(MAX_BYTES + 1);
"""
speech = """Rest Client runs on the J D K's H T T P client, set never to follow redirects: the importer decides. [[slnc 300]] It reads at most one byte more than the limit, and gives up after the timeout."""

[[class]]
name = "AddressPolicy"
what = "which addresses the shop may fetch from: public ones"
[[class.part]]
title = "judged from the address"
code = """
if (address.isAnyLocalAddress() || address.isLoopbackAddress() || address.isLinkLocalAddress()
        || address.isSiteLocalAddress() || address.isMulticastAddress()) {
    return false;
}
"""
speech = """The policy reads the resolved address, never its spelling. [[slnc 300]] Loopback, link local and private addresses are refused, and a few more ranges further down."""

