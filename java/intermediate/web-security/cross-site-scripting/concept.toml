narration = """Here is the scenario. [[slnc 400]] An online store shows product reviews. [[slnc 500]] The author's name, a short note about fit, and the text, all come from customers. [[slnc 500]] And every visitor's browser reads the page, including visitors who are signed in."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["Cross-site scripting: user text read as page code", "Output encoding: text made safe for one place", "Context: between tags, attribute, URL, script", "Content-Security-Policy: which scripts may run", "Nonce: a random value, new for every page"]
narration = """Before the demos, the words. [[slnc 500]] Cross site scripting means text from a user is read as part of the page. [[slnc 500]] Output encoding makes text safe for the one place it is written. [[slnc 500]] The context is that place: between tags, in an attribute, in a link, or in a script. [[slnc 500]] A content security policy tells the browser which scripts may run. [[slnc 500]] And a nonce is a random value, new for every page."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "09-ladder"
kind = "bullets"
title = "Fixes, Weakest First"
body = ["Filtering input: changes text, misses places", "Encoding by hand: works, easy to forget", "Templates that encode by default", "Plus a strict, nonce-based policy", "Plus HttpOnly session cookies"]
narration = """Let's put the fixes side by side, weakest first. [[slnc 400]] Filtering input changes honest text, and misses places. [[slnc 500]] Encoding by hand works, but one forgotten place is enough. [[slnc 500]] Templates that encode by default make the safe way the easy way. [[slnc 500]] A strict policy with a nonce stops what slips through. [[slnc 500]] And H T T P only cookies keep the session out of any script's reach."""

[[scene]]
key = "10-roles"
kind = "bullets"
title = "Who Does What"
body = ["Encode: one encoder per context", "ReviewPage: unsafe and safe pages", "Markup: how a browser reads the page", "ContentSecurityPolicy: nonce and evaluator", "ShopServer: the real local page"]
narration = """Here is who does what in the code. [[slnc 400]] The encode class has one encoder for each context. [[slnc 500]] The review page builds the page, unsafely and safely. [[slnc 500]] The markup class reads the page the way a browser would. [[slnc 500]] The content security policy class makes nonces, writes the policy, and decides which scripts may run. [[slnc 300]] And the shop server serves the page for real, on this machine."""

[[scene]]
key = "11-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["&lt; and &amp; in page source", "CSP headers in developer tools", "HttpOnly on session cookies", "Advisories that say CWE-79"]
narration = """You have probably met this already. [[slnc 400]] The codes for less than and ampersand in a page's source are encoding at work. [[slnc 500]] Content security policy headers appear in the browser's developer tools. [[slnc 500]] Session cookies are often marked H T T P only. [[slnc 500]] And security advisories that mention C W E seventy nine are about this problem."""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Encode on output, for the context", "Prefer templates that encode by default", "Strict CSP with a fresh nonce", "HttpOnly session cookies", "Never rely on input filtering"]
narration = """So, how do you use it? [[slnc 400]] Encode on output, for the context, every time. [[slnc 500]] Prefer templates that encode by default. [[slnc 500]] Add a strict policy, with a fresh nonce for every response. [[slnc 500]] Mark session cookies H T T P only. [[slnc 500]] And never rely on filtering input as the fix."""

[[scene]]
key = "13-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a fifth context", "and decide how to encode it."]
narration = """That's cross site scripting, and its defences. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Text from a user must stay text, so encode it for the place it goes, and back that up with a strict policy. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine, with nothing installed except a Java development kit. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a fifth context, a style value, and decide how to encode it. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
How an online store's product page shows reviews written by customers: storing them, writing them into the page in four contexts, the policy that limits scripts, and the session cookie.
It covers anyone who can write a review, and signed-in visitors who read it. It does not cover rich-text sanitizing, front-end frameworks, or other injection kinds.
"""
assets = [
    "Visitors' sessions and what they can do while signed in.",
    "The integrity of the product page.",
    "The trust customers place in what the page shows.",
]
actors = [
    "Customers who write reviews, any of whom may be hostile.",
    "Signed-in visitors who read the page.",
    "The store's developers, who add new places that show user text.",
]
boundaries = [
    "Customer to stored review: anything can be written.",
    "Stored review to page: the point where text must be encoded for its context.",
    "Server to browser: the policy and cookie flags travel with the response.",
]
assumptions = [
    "Every place that writes user text uses the encoder for its context.",
    "The nonce comes from a secure random source and is new for every response, and pages carrying it are not cached and shared.",
    "In the demo, the problem is shown with a harmless bold tag and the policy is evaluated in Java.",
]
out_of_scope = [
    "Rich text that must allow some HTML, which needs a maintained sanitizer.",
    "Front-end code that writes HTML in the browser.",
    "SQL and other injection: other projects in this module.",
]
tests = [
    "`EncodeTest` checks each encoder, round trips, and that no value can end its context, in any locale.",
    "`PageAndFilterTest` checks the unsafe and safe pages and the filter's two failures.",
    "`ContentSecurityPolicyTest` checks the evaluator's rules, the nonces, and the real server's policy and cookie.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The tools version shows the same defences in Spring Boot, with a template engine that encodes by default and nonces from Spring Security. The next project in this module is cross-site-request-forgery.
"""

[[threat]]
id = "T1"
stride = "T"
threat = "A review's text is read as markup or script, changing the page or running in visitors' browsers"
where = "`ReviewPage.unsafe`"
control = "Contextual output encoding for every value"
residual = "A place added later without its encoder; caught by the policy and by tests that look for unencoded output"

[[threat]]
id = "T2"
stride = "E"
threat = "A script that slips through runs with the page's authority"
where = "the browser"
control = "A strict policy that allows only scripts carrying this response's nonce"
residual = "Scripts the shop itself loads are trusted, so their sources must be controlled"

[[threat]]
id = "T3"
stride = "T"
threat = "Input filtering changes honest reviews and misses contexts it was not designed for"
where = "`NaiveFilter`"
control = "Store text as written and encode on output"
residual = "None, once the filter is removed"

[[threat]]
id = "T4"
stride = "I"
threat = "A reused or predictable nonce lets injected content carry it"
where = "`ContentSecurityPolicy.newNonce`"
control = "128 random bits from a secure source, new for every response"
residual = "A shared cache that stores a page with its nonce, so such pages must not be cached publicly"

[[threat]]
id = "T5"
stride = "I"
threat = "A script reads the session cookie and sends it away"
where = "the session cookie"
control = "HttpOnly, Secure and SameSite on the session cookie"
residual = "A script can still act as the visitor while the page is open, which is why encoding comes first"
