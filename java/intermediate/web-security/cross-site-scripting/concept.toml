[docs.session]
objectives = [
    "explain why text from a user can become part of a page",
    "choose the right encoding for text between tags, in an attribute, in a URL and in a script",
    "explain why input filtering is not a fix for cross-site scripting",
    "write a strict, nonce-based Content-Security-Policy and say what it does and does not stop",
]
walkthrough = """
Start with the notice board. Run the demo one act at a time. After act one, ask what else a script running as the shop could do. In act two, ask the group to pick the encoder before
showing it. In act three, ask what the filter would need to know to work, and lead to the answer that only the place the text is written knows. In act four, ask what happens if
the nonce is cached with the page.
"""
exercises = [
    "Add a fifth context, a CSS value in a style attribute, and decide whether to encode it or refuse it.",
    "Make the review page show a star rating from a number, and decide which encoder, if any, it needs.",
    "Change the policy to allow one script from a fixed address, and check the evaluator still refuses scripts without the nonce.",
    "Find every place in the page where untrusted text is written, and write a test that fails if one is not encoded.",
]

[docs.explained]
sentence = """
Cross-site scripting happens when untrusted text is read by the browser as part of the page; contextual output encoding keeps the text as text in every place it is written, and a strict, nonce-based Content-Security-Policy stops scripts that slip through anyway.
"""
verdict = """
Encode on output, for the context, every time. Prefer a template engine that does it by default and review every escape hatch. Add a strict, nonce-based policy with a fresh nonce per
response, mark session cookies HttpOnly, and never treat input filtering as the fix.
"""
recognise = [
    "`th:text` against `th:utext`, or `{{ }}` against `{{{ }}}`, in templates.",
    "A `Content-Security-Policy` header with `'nonce-...'` and `'strict-dynamic'`.",
    "`innerHTML` in front-end code, the browser-side form of the same mistake.",
    "Advisories that mention CWE-79.",
]

[spec]
purpose = """
Teach how cross-site scripting arises and how it is prevented, by showing one review change a page and then building contextual encoders, a comparison with input filtering, and a strict, nonce-based policy on a real local page.
"""
nongoals = [
    "Attack payloads and filter evasion: the problem is shown with a harmless bold tag.",
    "HTML sanitizers for rich text.",
    "Template engines: the tools version.",
]
problem = """
Developers often know XSS by name and fix it by filtering input, which breaks honest text and leaves contexts open.
"""
roles = [["Contextual encoders", "`Encode`"], ["A model of how a browser reads the page", "`Markup`"], ["The product page, unsafe and safe", "`ReviewPage`"], ["The tempting filter", "`NaiveFilter`"], ["Nonces, the policy and its evaluator", "`ContentSecurityPolicy`"], ["The real local page", "`ShopServer`"], ["Entry point", "`XssDemo`"]]
requirements = [
    "Unencoded review text adds an element to the page; encoded text adds none and reads back exactly.",
    "Each encoder keeps its value from ending its context, and is the same in every locale.",
    "The input filter changes honest text and misses the attribute context.",
    "Only a script with the response's nonce is allowed; 'unsafe-inline' is ignored when a nonce is listed.",
    "Every real response has a fresh nonce and an HttpOnly session cookie.",
    "The demo prints the same output on every run.",
]

