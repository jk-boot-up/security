    ["THE RESULT (the attributes a browser finds on the div):", "code"],
    ["  class=review  data-fit=x  onclick=steal()", "muted"],
    ["  <- A SCRIPT RUNS WHEN THE REVIEW IS CLICKED", "bad"],
