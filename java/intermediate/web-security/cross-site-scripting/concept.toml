    ["  URL parameter     size%205%20%26%20up", "muted"],
    ["  script string     It\\u0027s \\u0022great\\u0022", "muted"],
    ["---", ""],
    ["HOW EACH CHARACTER IS ENCODED:", "code"],
    ["  char   HTML    URL  script", "muted"],
    ["  <      &lt;    %3C  \\u003c", "muted"],
    ["  >      &gt;    %3E  \\u003e", "muted"],
    ["  &      &amp;   %26  \\u0026", "muted"],
    ["  \"      &quot;  %22  \\u0022", "muted"],
