[[act]]
title = "Encoding for the place the text goes"
summary = "One encoder per place: between tags <b> becomes &lt;b&gt;, in an attribute \" becomes &quot;, in a URL & becomes %26, in a script ' becomes \\u0027; the encoded page reads back as the customer's exact text."
detail = """
The same rule, keep text as text, needs a different encoding in each of four places. Between tags, <b>Great boots</b> becomes &lt;b&gt;Great boots&lt;/b&gt;. In a quoted attribute, Fits 5" boots becomes Fits 5&quot; boots.
In a URL parameter, size 5 & up becomes size%205%20%26%20up. In a script string, It's "great" becomes It\\u0027s \\u0022great\\u0022.
The table shows each risky character in each place. The URL and script codes are the character's number in hexadecimal: " is character 34, which is 2 x 16 + 2, so 22 in hex, giving %22 and \\u0022.
Ben's review, encoded, reads back exactly as he typed it, and Ana's review, encoded, has no b element.
"""
figure = "encoders"
figure_title = "Four places, four encoders"
figure_speech = """
Second demo: encoding for the place the text goes. [[slnc 400]] Each row is one place where the page writes customer text. [[slnc 300]] On the left, the text before encoding. [[slnc 300]] On the right, after. [[slnc 300]] The characters that changed are in green. [[slnc 700]]
Between tags, the angle brackets become ampersand l t, and ampersand g t. [[slnc 300]] The browser shows them, but never reads them as a tag. [[slnc 600]]
In an attribute, the quote mark becomes ampersand quot, so it cannot end the attribute. [[slnc 600]]
In a link, a space becomes percent twenty, and an ampersand becomes percent twenty six. [[slnc 600]]
In a script string, a quote becomes backslash u, and four hex digits. [[slnc 700]]
Four places. [[slnc 300]] Four different encoders. [[slnc 300]] Using the wrong one, or none, is enough to break the page.
"""
speech = """
Here is the output. [[slnc 400]] Before encoding: the place, and the customer's text. [[slnc 400]] After encoding: the same four values, each made safe for its place.
[[page]]
How each character is encoded, in each place. [[slnc 400]] The U R L and script codes are the character's number in hexadecimal. [[slnc 300]] A double quote is character thirty four. [[slnc 300]] Thirty four is two sixteens and two, so twenty two in hex.
[[page]]
Ben's review, on the encoded page. [[slnc 400]] The quote in his fit note is ampersand quot, and the brackets in his text are entities. [[slnc 400]] The result: the browser reads back exactly what Ben typed. [[slnc 300]] And Ana's review, encoded, has no bold element.
"""
rows = { encode = "active ok" }
console = [
