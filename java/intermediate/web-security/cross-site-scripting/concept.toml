key = "01-poster"
kind = "poster"
title = "Cross-Site Scripting: Output Encoding and CSP"
narration = """Hello, and welcome. [[slnc 400]] This video explains cross site scripting, and the defences that work, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] Cross site scripting happens when text from a user is read by the browser as part of the page. [[slnc 600]] Think of a shop's notice board. [[slnc 300]] Customers pin up notes, and the shop pins up signs. [[slnc 300]] If a customer's note looks exactly like a shop sign, people follow it. [[slnc 300]] Encoding puts every customer note behind glass, with a label. [[slnc 700]] In this video, the domain is an online store, and its product reviews. [[slnc 500]] By the end, you will hear how a review can change a page. [[slnc 300]] How to encode text for each place it goes. [[slnc 300]] Why filtering input is not the fix. [[slnc 300]] And how a strict content security policy adds a second line of defence."""

