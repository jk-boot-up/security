[[act]]
title = "Why filtering input is not the fix"
summary = "A filter that deletes < and > changes Ben's honest review and leaves Eve's fit note x\" onclick=\"steal() untouched, which adds an onclick attribute to the page; encoding for the attribute keeps it as text."
detail = """
A tempting fix deletes < and > from every input. Ben's honest review Warm & dry, price < 20 & > 10 becomes Warm & dry, price 20 & 10: his words are changed.
Eve's fit note x" onclick="steal() has no angle brackets, so the filter leaves it untouched. Pasted into the quoted attribute, its quote ends data-fit early, and the browser finds a new attribute: onclick=steal(), a script that runs when the review is clicked.
Encoded for the attribute instead, the quotes become &quot;, and the browser finds only class and data-fit, whose value is Eve's exact text. A filter guesses at the place; an encoder is chosen for it.
"""
figure = "filter_misses"
figure_title = "A filter deletes too much, and misses too much"
figure_speech = """
Third demo: why filtering input is not the fix. [[slnc 400]] The filter deletes every angle bracket. [[slnc 600]]
In the top row, Ben's honest review. [[slnc 300]] Price less than twenty, and more than ten. [[slnc 300]] The filter deletes the two brackets, shown in red, and the sentence no longer makes sense. [[slnc 700]]
In the middle row, Eve's fit note. [[slnc 300]] It has no angle brackets at all. [[slnc 300]] So the filter lets it through, unchanged. [[slnc 700]]
At the bottom, what the browser finds on the review's div. [[slnc 300]] Eve's quote closed the attribute early. [[slnc 300]] Now there is an on click attribute, with her script in it. [[slnc 700]]
Encoded for the attribute instead, her quotes become text, and the div keeps only its two attributes.
"""
speech = """
Here is the output. [[slnc 400]] Before the filter: Ben's review, and Eve's fit note. [[slnc 400]] After the filter: Ben's words are changed, and Eve's attack is untouched. [[slnc 400]] The page as built, and the result: the div now has an on click attribute.
[[page]]
Encoded for the attribute instead. [[slnc 400]] The quotes become ampersand quot. [[slnc 300]] The result: only class and data fit, holding Eve's exact text. [[slnc 300]] And Ben's words read back exactly.
"""
rows = { filter = "active amber" }
console = [
    ["BEFORE THE FILTER (Ben's review, Eve's fit note):", "code"],
