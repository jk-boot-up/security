[project]
slug = "cross-site-scripting"
level = "intermediate"
module = "web-security"
title = "Cross-Site Scripting: Output Encoding and CSP"
short_title = "Cross-Site Scripting"
package = "xss"
main_class = "XssDemo"
tagline = "Text from a customer must stay text"
bold = "Cross-site scripting happens when text from a user is read by the browser as part of the page; the fix is to encode every value for the place it is written, with a strict, nonce-based Content-Security-Policy as the second line of defence."
domain = "an online store"
domain_note = ""
youtube_description = """Cross-site scripting (XSS) explained in Java, with the defences that work: contextual output encoding and a strict Content-Security-Policy. Explained with an online store's product reviews, like a shop notice board where anyone's note could be mistaken for the shop's own sign. We see a review change the page, write an encoder for each place text goes (between tags, in an attribute, in a URL, in a script), see why filtering input is not the fix, serve a page with a fresh nonce and a strict policy that refuses any script without it, and finish with the bill: every output context needs its encoder, and the policy needs care."""
thumb_lines = ["CROSS-SITE SCRIPTING", "ENCODING + CSP"]
thumb_code = "Content-Security-Policy: script-src 'nonce-...'"
youtube_title = "Cross-Site Scripting (XSS) in Java: Output Encoding and a Strict CSP"
youtube_tags = ["xss", "cross-site scripting", "output encoding", "content security policy", "csp nonce", "owasp top 10", "web security", "java", "application security"]

[readme]
intro = """
**Cross-site scripting** (XSS) is what happens when text that came from a user is read by the browser as part of the page. A product review is meant to be shown as
words; if it is pasted into the HTML as it is, any markup in it becomes the shop's markup, and any script in it runs with the shop's authority, in the signed-in
customer's browser. It sits under **Injection (A05)** in the OWASP Top 10 (2025) and is **CWE-79**. The OWASP ASVS covers it in its chapter on encoding and sanitization.

The fix is not to clean the input. It is **contextual output encoding**: every value is encoded for the exact place it is written, which is different between tags, inside an
attribute, in a URL and inside a script. A strict **Content-Security-Policy** with a fresh random **nonce** for every response is the second line of defence: the browser runs only
the scripts that carry that response's nonce. The demo shows the problem once, then builds each defence and checks it.
"""
analogy = """
Think of a shop's notice board. Customers pin up notes, and the shop pins up its own signs. If a customer's note looks exactly like a shop sign, other customers will follow it.
Encoding is putting every customer note behind glass with a "customer note" label: it can say anything, and nobody will mistake it for the shop. The policy is the staff knowing
the shop's own stamp, so an unstamped sign is ignored even if it got onto the board.
"""
scenario = """
An online store shows product reviews. Each review has an author, a short note about fit, and the text, and all three are untrusted. The demo writes them into the product
page unsafely, then encoded for each context, compares encoding with an input filter, and serves the page from a real local server with a strict policy and an HttpOnly cookie.
"""
costs = [
    "**Every output context needs its encoder.** Between tags, inside an attribute, in a URL and in a script are four different encodings, and one forgotten place is enough.",
    "**A policy needs maintenance.** Every inline script must carry the nonce, and every new script source must be added on purpose; a policy loosened to `'unsafe-inline'` with no nonce protects nothing.",
    "**The nonce must be new for every response.** A cached or reused nonce gives an attacker the key.",
    "**Encoding by hand does not scale.** A template engine that escapes by default is the practical answer, with a reviewed escape hatch for the rare raw HTML; see the tools version.",
]
too_much = """
For a page that shows no user text, encoding has nothing to do, but a strict policy is still cheap insurance. For any page that shows text from users, partners or other systems,
both are the baseline. Rich text that must allow some HTML needs a dedicated, maintained sanitizer with an allow-list, which this project does not build.
"""
met_before = [
    "`&lt;` and `&amp;` in a page's source, which are encoding at work.",
    "`Content-Security-Policy` headers in the browser's developer tools.",
    "`HttpOnly` on session cookies.",
    "Bug-bounty reports and advisories that say \"stored XSS\" or \"reflected XSS\".",
]
where = """
This project is in [web-security](..), the first module of the intermediate track. It builds on [http-basics-and-headers](../../../beginner/networking/http-basics-and-headers), which audited the
Content-Security-Policy header from outside; here the policy is generated and checked from inside the application.
"""
twin = """
The pages are built and read in memory by a small model of how a browser parses elements and attributes, and the one real page is served on the loopback interface of the machine
running the demo. Nonces are random, so the demo prints only facts about them: their length, that they change, and whether a script is allowed. The policy is evaluated in Java with
the rules browsers apply, so no browser is needed. The problem is shown with a harmless bold tag; the project contains no attack payloads.
"""
test_note = "The encoders are tested per context, including round trips and a different locale. The policy evaluator is tested against the browser rules it models, including 'unsafe-inline' being ignored when a nonce is present. The real server is tested for a fresh nonce and an HttpOnly cookie on every response. Nonces are random, so the demo prints only facts about them and the golden output is the same on every run."

[[act]]
title = "A review that changes the page"
summary = "Ana's review, pasted into the page as it is, adds a bold element the shop never wrote: the review became part of the page."
detail = """
Ana's review is the text <b>Great boots</b>, pasted into the page as it is. The page now has a bold element, and the shop wrote none: the review became part of the page. The browser cannot tell the shop's markup from the customer's,
so a script in a review would run as the shop's own: it could read the page, act as the signed-in customer, and send what it finds elsewhere.
"""
speech = """
First demo: a review that changes the page. [[slnc 400]] Ana writes a review, with a bold tag in it. [[slnc 600]]
The shop pastes the review into the page as it is. [[slnc 300]] The page now has a bold element, that the shop never wrote. [[slnc 300]] The review became part of the page. [[slnc 600]]
The browser cannot tell the shop's markup from the customer's. [[slnc 300]] So a script in a review would run as if the shop wrote it. [[slnc 300]] It could read the page, and act as the signed in customer.
"""
rows = { unsafe = "active wrong" }
console = [
    ["Ana's review is the text <b>Great boots</b>, pasted into the page as it is", "muted"],
    ["bold elements on the page: 1, and the shop wrote none  <- THE REVIEW BECAME PART OF THE PAGE", "bad"],
    ["the browser cannot tell the shop's markup from the customer's, so a script in a review would run as the shop's own", "amber"],
    ["that script could read the page, act as the signed-in customer, and send what it finds elsewhere", "amber"],
]

[[act]]
title = "Encoding for the place the text goes"
summary = "One encoder per context: between tags, in a quoted attribute, in a URL parameter and in a script string; the encoded page has no bold element and Ben's fit note reads back whole."
detail = """
Between tags, <b>Great boots</b> becomes &lt;b&gt;Great boots&lt;/b&gt;. In a quoted attribute, Fits 5" boots becomes Fits 5&quot; boots. In a URL parameter, size 5 & up becomes size%205%20%26%20up. In a script string, the quotes become \\u0027 and \\u0022.
The encoded page has no bold element, and Ben's fit note reads back whole. Every value shows as the text the customer typed, and none of it is read as markup.
"""
speech = """
Second demo: encoding for the place the text goes. [[slnc 400]] Between tags, the angle brackets become entities, so the bold tag is shown as text. [[slnc 600]]
Inside a quoted attribute, the quote mark is encoded, so it cannot end the attribute. [[slnc 300]] In a link, the value is percent encoded. [[slnc 300]] Inside a script, every risky character becomes a unicode escape. [[slnc 600]]
The encoded page has no bold element. [[slnc 300]] Ben's fit note reads back whole. [[slnc 300]] Every value shows as what the customer typed, and none of it is markup.
"""
rows = { encode = "active ok" }
console = [
    ["between tags: &lt;b&gt;Great boots&lt;/b&gt;", "ok"],
    ["in a quoted attribute: Fits 5&quot; boots", "ok"],
    ["in a URL parameter: size%205%20%26%20up", "ok"],
    ["in a script string: It\\u0027s \\u0022great\\u0022", "ok"],
    ["the encoded page: bold elements 0, and Ben's fit note reads back whole: Fits 5\" boots", "ok"],
]

[[act]]
title = "Why filtering input is not the fix"
summary = "A filter that deletes < and > changes an honest review and still lets a quote end Ben's attribute early; encoding shows the text exactly."
detail = """
An honest review says Warm & dry, price < 20 & > 10. A filter that deletes < and > turns it into Warm & dry, price 20 & 10: the customer's words are changed. Encoded instead, the page shows it exactly. The same filter keeps the quote in Ben's fit note,
so the attribute ends early and reads only Fits 5: the filter did not know the context. A filter guesses at every place text will go; an encoder is chosen for the one place it does go.
"""
speech = """
Third demo: why filtering input is not the fix. [[slnc 400]] An honest review says, price less than twenty, and more than ten. [[slnc 600]]
A filter that deletes angle brackets changes the customer's words. [[slnc 300]] Encoding shows them exactly. [[slnc 600]]
And the same filter keeps the quote mark in Ben's fit note. [[slnc 300]] So the attribute ends early, and reads only, fits five. [[slnc 600]]
A filter guesses at every place the text might go. [[slnc 300]] An encoder is chosen for the one place it does go.
"""
rows = { filter = "active amber" }
console = [
    ["an honest review: Warm & dry, price < 20 & > 10", "muted"],
    ["after a filter that deletes < and >: Warm & dry, price  20 &  10  <- THE CUSTOMER'S WORDS ARE CHANGED", "bad"],
    ["encoded instead, the page shows it exactly: true", "ok"],
    ["the filter keeps the quote in Ben's fit note, so the attribute ends early and reads: Fits 5  <- THE FILTER DID NOT KNOW THE CONTEXT", "bad"],
    ["a filter guesses at every place text will go; an encoder is chosen for the one place it does go", "amber"],
]

[[act]]
title = "A strict Content-Security-Policy, with a fresh nonce for every page"
summary = "A real page carries a policy naming a 24-character random nonce that changes every response; the shop's script may run, a script without the nonce may not, and the session cookie is HttpOnly."
detail = """
The product page, served for real on this machine, answers 200 with a policy. The policy names a nonce, and the shop's own script carries it. The nonce is 24 characters of random text, and the next page has a different one. The shop's script may run;
a script that slipped in without the nonce may not, which is a second line of defence. With no policy, the same script would run, and a policy with 'unsafe-inline' and no nonce protects nothing. The session cookie is HttpOnly, so a script cannot read it.
"""
speech = """
Fourth demo: a strict content security policy. [[slnc 400]] The product page is served for real, on this machine. [[slnc 600]]
Its policy names a nonce: a random value, new for every page. [[slnc 300]] The shop's own script carries it. [[slnc 600]]
So the shop's script may run. [[slnc 300]] A script that slipped in without the nonce may not. [[slnc 300]] That is a second line of defence. [[slnc 600]]
With no policy, or with a policy that allows any inline script, the same script would run. [[slnc 300]] And the session cookie is marked H T T P only, so no script can read it.
"""
rows = { policy = "active ok" }
console = [
    ["the product page answers 200 with a policy: true", "muted"],
    ["the policy names a nonce, and the shop's own script carries it: true", "ok"],
    ["the nonce is 24 characters of random text, and the next page has a different one: true", "ok"],
    ["the shop's script may run: true", "ok"],
    ["a script that slipped in without the nonce may run: false  <- A SECOND LINE OF DEFENCE", "ok"],
    ["a policy with 'unsafe-inline' and no nonce: true, so it protects nothing", "amber"],
    ["the session cookie is HttpOnly, so a script cannot read it: true", "ok"],
]

[[act]]
title = "The bill"
summary = "Four kinds of output context each need their own encoder, the policy needs care, the nonce must be new every time, and a template engine that encodes by default is the practical answer."
detail = """
This one page writes untrusted text into 4 kinds of place, and each needs its own encoder; one forgotten place is enough. The policy needs care: every inline script must carry the nonce, and every new source must be added on purpose. The nonce must be new for
every response, or a page from yesterday hands an attacker today's key. In practice, a template engine that encodes by default does the first part: see the tools version of this project.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] This one page writes untrusted text into four kinds of place. [[slnc 300]] Each needs its own encoder, and one forgotten place is enough. [[slnc 600]]
The policy needs care. [[slnc 300]] Every inline script must carry the nonce, and every new source is added on purpose. [[slnc 600]]
The nonce must be new for every response. [[slnc 600]]
And in practice, a template engine that encodes by default does most of this work, as the tools version shows.
"""
rows = { unsafe = "active amber", policy = "active amber" }
console = [
    ["this one page writes untrusted text into 4 kinds of place, and each needs its own encoder; one forgotten place is enough", "amber"],
    ["the policy needs care: every inline script must carry the nonce, and every new source must be added on purpose", "amber"],
    ["the nonce must be new for every response, or a page from yesterday hands an attacker today's key", "amber"],
    ["in practice, a template engine that encodes by default does the first part: see the tools version of this project", "ok"],
]

