[poster]
headline = [["CROSS-SITE SCRIPTING", "text"], ["ENCODING + CSP", "accent"]]
taglines = [["Text from a customer must stay text", "gold"]]
before = { code = "html + review.text()", note = "the review becomes the page", tag = "BEFORE" }
after = { code = "Encode.htmlBody(text) + nonce CSP", note = "text stays text", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "Cross-Site Scripting: Output Encoding and CSP"
narration = """Hello, and welcome. [[slnc 400]] This video explains cross site scripting, X S S for short, and the defences that work, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] Cross site scripting happens when text from a user is read by the browser as part of the page. [[slnc 600]] Think of a shop's notice board. [[slnc 300]] Customers pin up notes, and the shop pins up signs. [[slnc 300]] If a customer's note looks exactly like a shop sign, people follow it. [[slnc 300]] Encoding puts every customer note behind glass, with a label. [[slnc 700]] In this video, the domain is an online store, and its product reviews. [[slnc 500]] By the end, you will hear how a review can change a page. [[slnc 300]] How to encode text for each place it goes. [[slnc 300]] Why filtering input is not the fix. [[slnc 300]] And how a strict content security policy adds a second line of defence."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online store shows product reviews.", "", "The author, a fit note and the text", "all come from customers.", "", "Every visitor's browser reads the page."]
narration = """Here is the scenario. [[slnc 400]] An online store shows product reviews. [[slnc 500]] The author's name, a short note about fit, and the text, all come from customers. [[slnc 500]] And every visitor's browser reads the page, including visitors who are signed in."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["Cross-site scripting: user text read as page code", "Output encoding: text made safe for one place", "Context: between tags, attribute, URL, script", "Content-Security-Policy: which scripts may run", "Nonce: a random value, new for every page"]
narration = """Before the demos, the words. [[slnc 500]] Cross site scripting means text from a user is read as part of the page. [[slnc 500]] Output encoding makes text safe for the one place it is written. [[slnc 500]] The context is that place: between tags, in an attribute, in a link, or in a script. [[slnc 500]] A content security policy tells the browser which scripts may run. [[slnc 500]] And a nonce is a random value, new for every page."""

[[scene]]
key = "03-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "03-text-or-markup"
kind = "figure"
title = "The same text, pasted or encoded"
body = "text_or_markup"
narration = """Let's see the whole idea on one picture. [[slnc 400]] At the top, Ana's review, exactly as she typed it. [[slnc 700]] On the left, the shop pastes it into the page as it is. [[slnc 300]] The browser reads the angle brackets as a tag. [[slnc 300]] It finds a bold element, and shows great boots in bold. [[slnc 300]] The review has become part of the page. [[slnc 700]] On the right, the shop encodes it first. [[slnc 300]] Each angle bracket becomes a short code, ampersand l t, or ampersand g t. [[slnc 300]] The browser shows those codes as the characters themselves. [[slnc 300]] Ana sees exactly what she typed, and the page has no new element. [[slnc 700]] Same text. [[slnc 300]] Pasted, it is markup. [[slnc 300]] Encoded, it stays text."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "04-costs"
kind = "bullets"
title = "What It Costs"
body = ["Every place needs its own encoder:", "  one forgotten place is enough", "Every inline script must carry the nonce", "The nonce must be new for every response", "In practice: a template that encodes by default"]
narration = """Nothing is free. [[slnc 400]] Here is what the defences cost. [[slnc 500]] This one page writes customer text into four kinds of place, and each needs its own encoder. [[slnc 300]] One forgotten place is enough. [[slnc 500]] The policy needs care. [[slnc 300]] Every inline script must carry the nonce, and every new script source is added on purpose. [[slnc 500]] The nonce must be new for every response, or a page from yesterday hands an attacker today's key. [[slnc 500]] In practice, a template engine that encodes by default does the first part, as the Spring Boot version of this project shows."""

[[scene]]
key = "09-ladder"
kind = "bullets"
title = "Fixes, Weakest First"
body = ["Filtering input: changes text, misses places", "Encoding by hand: works, easy to forget", "Templates that encode by default", "Plus a strict, nonce-based policy", "Plus HttpOnly session cookies"]
narration = """Let's put the fixes side by side, weakest first. [[slnc 400]] Filtering input changes honest text, and misses places. [[slnc 500]] Encoding by hand works, but one forgotten place is enough. [[slnc 500]] Templates that encode by default make the safe way the easy way. [[slnc 500]] A strict policy with a nonce stops what slips through. [[slnc 500]] And H T T P only cookies keep the session out of any script's reach."""

[[scene]]
key = "11-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["&lt; and &amp; in page source", "CSP headers in developer tools", "HttpOnly on session cookies", "Advisories that say CWE-79"]
narration = """You have probably met this already. [[slnc 400]] The codes for less than and ampersand in a page's source are encoding at work. [[slnc 500]] Content security policy headers appear in the browser's developer tools. [[slnc 500]] Session cookies are often marked H T T P only. [[slnc 500]] And security advisories that mention C W E seventy nine are about this problem."""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Encode on output, for the context", "Prefer templates that encode by default", "Strict CSP with a fresh nonce", "HttpOnly session cookies", "Never rely on input filtering"]
narration = """So, how do you use it? [[slnc 400]] Encode on output, for the context, every time. [[slnc 500]] Prefer templates that encode by default. [[slnc 500]] Add a strict policy, with a fresh nonce for every response. [[slnc 500]] Mark session cookies H T T P only. [[slnc 500]] And never rely on filtering input as the fix."""

[[scene]]
key = "12-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "13-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a fifth context", "and decide how to encode it."]
narration = """That's cross site scripting, and its defences. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Text from a user must stay text, so encode it for the place it goes, and back that up with a strict policy. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine, with nothing installed except a Java development kit. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a fifth context, a style value, and decide how to encode it. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
How an online store's product page shows reviews written by customers: storing them, writing them into the page in four contexts, the policy that limits scripts, and the session cookie.
It covers anyone who can write a review, and signed-in visitors who read it. It does not cover rich-text sanitizing, front-end frameworks, or other injection kinds.
"""
assets = [
    "Visitors' sessions and what they can do while signed in.",
    "The integrity of the product page.",
    "The trust customers place in what the page shows.",
]
actors = [
    "Customers who write reviews, any of whom may be hostile.",
    "Signed-in visitors who read the page.",
    "The store's developers, who add new places that show user text.",
]
boundaries = [
    "Customer to stored review: anything can be written.",
    "Stored review to page: the point where text must be encoded for its context.",
    "Server to browser: the policy and cookie flags travel with the response.",
]
assumptions = [
    "Every place that writes user text uses the encoder for its context.",
    "The nonce comes from a secure random source and is new for every response, and pages carrying it are not cached and shared.",
    "In the demo, the examples are only text read by a small browser model, and the policy is evaluated in Java.",
]
out_of_scope = [
    "Rich text that must allow some HTML, which needs a maintained sanitizer.",
    "Front-end code that writes HTML in the browser.",
    "SQL and other injection: other projects in this module.",
]
tests = [
    "`EncodeTest` checks each encoder, round trips, and that no value can end its context, in any locale.",
    "`PageAndFilterTest` checks the unsafe and safe pages and the filter's two failures.",
    "`ContentSecurityPolicyTest` checks the evaluator's rules, the nonces, and the real server's policy and cookie.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The tools version shows the same defences in Spring Boot, with a template engine that encodes by default and nonces from Spring Security. The next project in this module is cross-site-request-forgery.
"""

[[threat]]
id = "T1"
stride = "T"
threat = "A review's text is read as markup or script, changing the page or running in visitors' browsers"
where = "`ReviewPage.unsafe`"
control = "Contextual output encoding for every value"
residual = "A place added later without its encoder; caught by the policy and by tests that look for unencoded output"

[[threat]]
id = "T2"
stride = "E"
threat = "A script that slips through runs with the page's authority"
where = "the browser"
control = "A strict policy that allows only scripts carrying this response's nonce"
residual = "Scripts the shop itself loads are trusted, so their sources must be controlled"

[[threat]]
id = "T3"
stride = "T"
threat = "Input filtering changes honest reviews and misses contexts it was not designed for"
where = "`NaiveFilter`"
control = "Store text as written and encode on output"
residual = "None, once the filter is removed"

[[threat]]
id = "T4"
stride = "I"
threat = "A reused or predictable nonce lets injected content carry it"
where = "`ContentSecurityPolicy.newNonce`"
control = "128 random bits from a secure source, new for every response"
residual = "A shared cache that stores a page with its nonce, so such pages must not be cached publicly"

[[threat]]
id = "T5"
stride = "I"
threat = "A script reads the session cookie and sends it away"
where = "the session cookie"
control = "HttpOnly, Secure and SameSite on the session cookie"
residual = "A script can still act as the visitor while the page is open, which is why encoding comes first"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] Everything runs in plain Java: a small model reads pages the way a browser does, and one real page is served on this machine. [[slnc 300]] Here are the classes that matter."""

[[class]]
name = "ReviewPage"
what = "the product page, pasted or encoded"
[[class.part]]
title = "pasted as it is"
code = """
html.append("<div class=\\"review\\" data-fit=\\"")
    .append(r.fitNote())
    .append("\\"><p>")
    .append(r.text())
    .append("</p><span>")
    .append(r.author())
    .append("</span></div>");
"""
speech = """The unsafe page appends the customer's text straight into the markup. [[slnc 300]] A quote, or an angle bracket, in that text becomes part of the page."""
[[class.part]]
title = "encoded for each place"
code = """
html.append("<div class=\\"review\\" data-fit=\\"")
    .append(Encode.attribute(r.fitNote()))
    .append("\\"><p>")
    .append(Encode.htmlBody(r.text()))
    .append("</p><span>")
    .append(Encode.htmlBody(r.author()))
    .append("</span>")
    .append("<a href=\\"/reviews?author=")
    .append(Encode.urlParameter(r.author()))
"""
speech = """The safe page writes the same values, but each one goes through the encoder for its place. [[slnc 300]] The attribute encoder, the body encoder, and the U R L encoder."""

[[class]]
name = "Encode"
what = "one encoder for each place text is written"
[[class.part]]
title = "between tags and in attributes"
code = """
switch (c) {
    case '&' -> out.append("&amp;");
    case '<' -> out.append("&lt;");
    case '>' -> out.append("&gt;");
    case '"' -> out.append("&quot;");
    case '\\'' -> out.append("&#39;");
    default -> out.append(c);
"""
speech = """Between tags and inside a quoted attribute, five characters are replaced by their H T M L entities. [[slnc 300]] The ampersand comes first in the list, so every code it writes is plain text."""
[[class.part]]
title = "in a URL and in a script"
code = """
return URLEncoder.encode(text, StandardCharsets.UTF_8)
    .replace("+", "%20");
...
out.append(String.format(java.util.Locale.ROOT,
    "\\\\u%04x", (int) c));
"""
speech = """Inside a U R L, a parameter is percent encoded by the J D K. [[slnc 300]] In a script string, any character that is not a letter, digit or space becomes backslash u and four hex digits."""

[[class]]
name = "NaiveFilter"
what = "the tempting fix that is not one"
[[class.part]]
title = "delete two characters"
code = """
static String clean(String text) {
    return text.replace("<", "").replace(">", "");
"""
speech = """The filter deletes angle brackets from every input. [[slnc 300]] It cannot know where the text will go, so it breaks honest text and misses the quote."""

[[class]]
name = "ContentSecurityPolicy"
what = "the nonce, the policy, and what may run"
[[class.part]]
title = "nonce and policy"
code = """
byte[] bytes = new byte[NONCE_BYTES];
RANDOM.nextBytes(bytes);
return Base64.getEncoder().encodeToString(bytes);
...
return "default-src 'self'; script-src 'nonce-"
    + nonce + "' 'strict-dynamic'; object-src 'none';
...
"""
speech = """Sixteen bytes from a secure random source, in base sixty four, make the nonce. [[slnc 300]] The policy puts it in the script source list."""
[[class.part]]
title = "which inline script may run"
code = """
if (scriptNonce != null
        && sources.contains("'nonce-" + scriptNonce + "'")) {
    return true;
}
return sources.contains("'unsafe-inline'") && !hasNonceOrHash;
"""
speech = """A script runs if it carries this response's nonce. [[slnc 300]] Unsafe inline lets any script run, unless a nonce is listed, in which case browsers ignore it."""

[[class]]
name = "ShopServer"
what = "the real page, served on this machine"
[[class.part]]
title = "a new nonce for every response"
code = """
String nonce = ContentSecurityPolicy.newNonce();
byte[] body = ReviewPage.safe(reviews, nonce)
    .getBytes(StandardCharsets.UTF_8);
...
.add("Content-Security-Policy",
     ContentSecurityPolicy.strict(nonce));
...
.add("Set-Cookie", "session=demo-" + nonce.length()
     + "; Path=/; HttpOnly; Secure; SameSite=Lax");
"""
speech = """Every request gets a new nonce. [[slnc 300]] The same value goes into the page's script and into the policy header. [[slnc 300]] The session cookie is H T T P only."""

[[acronym]]
short = "XSS"
long = "Cross-Site Scripting: text from a user read as part of the page"
say = "X S S is cross site scripting: text from a user that the browser reads as part of the page."
[[acronym]]
short = "HTML"
long = "HyperText Markup Language: the markup of a web page"
say = "H T M L is hypertext markup language: the tags that make up a web page."
[[acronym]]
short = "CSP"
long = "Content-Security-Policy: a header listing which scripts may run"
say = "C S P is content security policy: a response header that tells the browser which scripts may run."
[[acronym]]
short = "URL"
long = "Uniform Resource Locator: the address of a page"
say = "U R L is uniform resource locator: the address of a page, with its parameters."
[[acronym]]
short = "HTTP, GET"
long = "HyperText Transfer Protocol; GET asks the server for a page"
say = "H T T P is hypertext transfer protocol. A get request asks the server for a page."
[[acronym]]
short = "HttpOnly"
long = "a cookie flag: scripts on the page cannot read the cookie"
say = "H T T P only is a cookie flag. Scripts on the page cannot read a cookie that carries it."
[[acronym]]
short = "Base64, hex"
long = "Base64: bytes as letters, digits, + and /; hex: base sixteen, 0-9 and a-f"
say = "Base sixty four writes bytes with letters, digits, plus and slash. Hex is base sixteen, with the digits zero to nine and a to f."
[[acronym]]
short = "JDK"
long = "Java Development Kit"
say = "J D K is the Java development kit."
[[acronym]]
short = "CWE"
long = "Common Weakness Enumeration: CWE-79 is cross-site scripting"
say = "C W E is the common weakness enumeration. Number seventy nine is cross site scripting."
