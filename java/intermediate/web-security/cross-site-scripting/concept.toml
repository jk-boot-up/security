[[act]]
title = "A strict Content-Security-Policy, with a fresh nonce"
summary = "The real page answers with a policy that names a 24-character nonce made from 16 random bytes; only the shop's script carries it, so Eve's script without it is blocked, and the session cookie is HttpOnly."
detail = """
The product page is served for real on this machine. The response carries Content-Security-Policy: default-src 'self'; script-src 'nonce-<nonce>' 'strict-dynamic'; object-src 'none'; base-uri 'none'; frame-ancestors 'none', and the shop's own script carries the same nonce.
The nonce is 16 random bytes, 128 bits, written in Base64, which turns every 3 bytes into 4 characters: 16 bytes make 6 groups, the last one short, so 24 characters. With bytes 00 to 0f the result would be AAECAwQFBgcICQoLDA0ODw==. The next page gets a different nonce.
The browser runs the shop's script, which carries the nonce, and blocks Eve's script, which does not. With no policy, the same script would run, and a policy with 'unsafe-inline' and no nonce protects nothing. The session cookie is HttpOnly, so no script can read it.
"""
figure = "csp_nonce"
figure_title = "Only the script that carries this page's nonce runs"
figure_speech = """
Fourth demo: a strict content security policy, with a fresh nonce. [[slnc 400]] On the left, how the nonce is made. [[slnc 300]] Sixteen random bytes. [[slnc 300]] Base sixty four turns every three bytes into four characters. [[slnc 300]] Six groups, so twenty four characters. [[slnc 700]]
At the top right, the response header. [[slnc 300]] Its script source names that nonce. [[slnc 600]]
Below it, two scripts on the page. [[slnc 300]] The shop's own script carries the same nonce, so the browser runs it. [[slnc 300]] Eve's script got onto the page without a nonce. [[slnc 300]] It cannot know the value, because it is new for every page. [[slnc 300]] So the browser blocks it. [[slnc 700]]
Encoding is the fix. [[slnc 300]] The policy is the second line of defence, for the one place encoding was forgotten.
"""
speech = """
Here is the output. [[slnc 400]] The request: get the product page, served for real. [[slnc 400]] The response: status two hundred, the policy, one directive per line, with the nonce shown as a placeholder. [[slnc 300]] An H T T P only cookie, and the shop's script with the same nonce.
[[page]]
How the nonce is made: sixteen random bytes, in base sixty four, so twenty four characters, and different on the next page. [[slnc 400]] And which scripts may run. [[slnc 300]] The shop's script, yes. [[slnc 300]] Eve's, no. [[slnc 300]] With no policy, or with unsafe inline, it would run.
"""
rows = { policy = "active ok" }
console = [
    ["THE REQUEST (to the shop, served for real on this machine):", "code"],
    ["  GET /product", "muted"],
    ["THE RESPONSE (its nonce is shown as <nonce>):", "code"],
    ["  status 200, and the header Content-Security-Policy:", "muted"],
    ["    default-src 'self'", "muted"],
    ["    script-src 'nonce-<nonce>' 'strict-dynamic'", "muted"],
    ["    object-src 'none'", "muted"],
    ["    base-uri 'none'", "muted"],
    ["    frame-ancestors 'none'", "muted"],
    ["  Set-Cookie: session=demo-24; Path=/;", "muted"],
    ["    HttpOnly; Secure; SameSite=Lax", "muted"],
    ["  <script nonce=\"<nonce>\">var firstReviewer = \"Ana\";</script>", "muted"],
    ["---", ""],
    ["HOW THE NONCE IS MADE:", "code"],
    ["  16 random bytes = 128 bits, written in Base64", "muted"],
    ["  Base64 turns every 3 bytes into 4 characters", "muted"],
    ["  16 bytes -> 6 groups (the last one short) -> 24 characters", "muted"],
    ["  example, bytes 00 01 02 ... 0f -> AAECAwQFBgcICQoLDA0ODw==", "muted"],
    ["  this page's nonce: 24 characters; the next page's differs: true", "muted"],
    ["  the script's nonce is the policy's nonce: true", "muted"],
