[[act]]
title = "th:utext, the one switch that turns escaping off"
summary = "The same review written with th:utext reaches the page as <b>Great boots</b>, a b element the shop never wrote; a test searches the templates and allows th:utext only in the one trap template."
detail = """
The template product-unescaped.html writes the same value with th:utext, which means unescaped text. The page now holds <p class="review"><b>Great boots</b></p>, and the browser finds a b element the shop never wrote: the page changed.
th:utext is for markup the shop wrote itself, never for anything a customer typed. A search of the templates finds it in product-unescaped.html and not in product.html, and a test fails if any other template starts to use it.
"""
figure = "utext_trap"
figure_title = "th:utext: the same value becomes part of the page"
figure_speech = """
Second demo: the one switch that turns escaping off. [[slnc 400]] The same value, Ana's review. [[slnc 300]] But this template writes it with th u text, unescaped text, shown in red. [[slnc 700]]
The page now holds Ana's bold tag exactly as she typed it. [[slnc 300]] The browser finds a bold element the shop never wrote. [[slnc 300]] With a script tag instead, it would be a script. [[slnc 700]]
On the right, the guard. [[slnc 300]] A test searches every template for th u text. [[slnc 300]] Only the trap template may use it. [[slnc 300]] If anyone adds another, the build fails.
"""
