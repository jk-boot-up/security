[[act]]
title = "A strict Content-Security-Policy from Spring Security"
summary = "A small filter makes a 24-character nonce from 16 random bytes before Spring Security writes its headers; the policy and the shop's script carry the same nonce, a script without it is blocked, and the session cookie is HttpOnly and SameSite=Strict."
detail = """
The response to GET /product carries Content-Security-Policy: default-src 'self'; script-src 'nonce-<nonce>' 'strict-dynamic'; object-src 'none'; base-uri 'none'; frame-ancestors 'none', a session cookie with HttpOnly and SameSite=Strict, and the shop's script with nonce="<nonce>".
NonceFilter makes 16 random bytes and writes them in Base64: 16 bytes make 6 groups of up to 3, and each group becomes 4 characters, so 24 characters. It runs before Spring Security writes its headers and stores the nonce as the request attribute cspNonce, which both the header writer and the template read. The header's nonce is the script's, and the next page gets a different one.
The shop's script may run; a script without the nonce is blocked.
"""
figure = "nonce_flow"
figure_title = "One nonce per request, in the header and in the page"
figure_speech = """
Fourth demo: a strict content security policy, from Spring Security. [[slnc 400]] Follow one request from left to right. [[slnc 600]]
First, the nonce filter. [[slnc 300]] It makes sixteen random bytes, and writes them in base sixty four: twenty four characters. [[slnc 300]] It stores them on the request, as c s p nonce. [[slnc 700]]
Then two readers. [[slnc 300]] Spring Security's header writer puts the nonce in the policy. [[slnc 300]] The template puts the same nonce on the shop's script. [[slnc 300]] So the header and the page always agree. [[slnc 700]]
At the bottom, the browser's decision. [[slnc 300]] The shop's script carries the nonce, and runs. [[slnc 300]] A script that slipped in has no nonce, and is blocked.
"""
speech = """
Here is the output. [[slnc 400]] The request: get the product page. [[slnc 400]] The response: the policy, one directive per line, with the nonce as a placeholder. [[slnc 300]] The session cookie, H T T P only and same site strict. [[slnc 300]] And the shop's script, with the same nonce.
[[page]]
How the nonce gets there: sixteen random bytes, twenty four characters, made by a filter that runs before the headers are written. [[slnc 400]] The header's nonce is the script's, and the next page's differs. [[slnc 400]] The shop's script may run. [[slnc 300]] A script without the nonce may not.
"""
rows = { policy = "active ok" }
console = [
