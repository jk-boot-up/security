    ["the next page has a different nonce: true", "ok"],
    ["the shop's script may run: true", "ok"],
    ["a script that slipped in without the nonce may run: false  <- A SECOND LINE OF DEFENCE", "ok"],
    ["the nonce comes from a filter that runs before Spring Security writes its headers, so the header and the page always agree", "muted"],
]

[[act]]
title = "The bill"
summary = "The session cookie is HttpOnly and SameSite=Strict; escaping protects only what goes through it; some places need design rather than escaping; the nonce needs a small filter."
detail = """
The session cookie is HttpOnly, so a script cannot read it, and SameSite=Strict. Escaping by default protects only the values written through it: th:utext and HTML built in Java code
skip it. A value placed in an event handler or a style needs more than escaping, so customer text stays out of those places. And Spring Security writes a fixed policy unless the
application supplies the nonce, as this store does with one small filter.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] The session cookie is H T T P only, so a script cannot read it, and same site strict. [[slnc 600]]
Escaping by default protects only the values that go through it. [[slnc 300]] th u text, and H T M L built in Java code, skip it. [[slnc 600]]
Some places, like an event handler or a style, need more than escaping. [[slnc 300]] Keep customer text out of them. [[slnc 600]]
And a fresh nonce needs one small filter, because Spring Security's policy is a fixed string.
"""
rows = { utext = "active amber", policy = "active amber" }
console = [
