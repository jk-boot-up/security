[[scene]]
key = "01-poster"
kind = "poster"
title = "Cross-Site Scripting with Spring Boot"
narration = """Hello, and welcome. [[slnc 400]] This video looks at cross site scripting defences in Spring Boot. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a reminder. [[slnc 300]] Cross site scripting happens when a customer's text is read by the browser as part of the page. [[slnc 300]] The defence is to encode every value for the place it is written. [[slnc 600]] Think of a shop that prints customers' reviews through a printer that always prints plain letters. [[slnc 300]] The printer has one switch that prints a note as the shop's own sign. [[slnc 300]] Flip it for a customer's note, and the note passes as the shop. [[slnc 700]] In this video, the domain is an online store. [[slnc 500]] By the end, you will hear what Thymeleaf escapes for you. [[slnc 300]] The one switch that stops it. [[slnc 300]] How each place a value goes is escaped. [[slnc 300]] And how to send a policy with a fresh nonce from Spring Security."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online store shows product reviews", "with Thymeleaf templates.", "", "Reviews, fit notes and searches", "are written by customers."]
narration = """Here is the scenario. [[slnc 400]] An online store shows product reviews on its pages, using Thymeleaf templates. [[slnc 500]] Reviews, fit notes and searches are all written by customers. [[slnc 600]] Every one of them must stay text."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["Template engine: writes pages from data", "th:text: writes a value, escaped", "th:utext: writes a value as markup", "Nonce: a random value, new for every page", "CSP: the browser's rule for which scripts run"]
narration = """Before the demos, the words. [[slnc 500]] A template engine writes pages from data. [[slnc 500]] th text writes a value, escaped. [[slnc 500]] th u text writes a value as markup, with no escaping. [[slnc 500]] A nonce is a random value, new for every page. [[slnc 500]] And a content security policy tells the browser which scripts may run."""

[[scene]]
key = "03-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "03-pipeline"
kind = "figure"
title = "From the model to the browser"
body = "pipeline"
narration = """Let's see the whole idea on one picture. [[slnc 400]] Follow one value from left to right. [[slnc 600]] The controller puts Ana's review in the model, exactly as she typed it, bold tag and all. [[slnc 600]] The template says where it goes, with th text. [[slnc 600]] Thymeleaf writes the page, and escapes the value on the way: each angle bracket becomes a short code, shown in green. [[slnc 600]] The browser shows those codes as the characters themselves. [[slnc 300]] Ana sees exactly what she typed, and the page has no new element. [[slnc 700]] The encoding happened without anyone writing a line of code for it. [[slnc 300]] That is the point of a template engine that escapes by default."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "04-costs"
kind = "bullets"
title = "What It Costs"
body = ["Escaping covers only values written through it:", "  th:utext and HTML built in Java skip it", "Event handlers and styles need more than escaping", "Spring Security's policy is fixed:", "  the nonce needs a small filter of your own"]
narration = """Nothing is free. [[slnc 400]] Here is what this approach costs. [[slnc 500]] Escaping by default protects only the values written through the template. [[slnc 300]] th u text, and H T M L built in Java code, skip it. [[slnc 500]] A value placed in an event handler or a style needs more than escaping, so keep customer text out of those places. [[slnc 500]] And Spring Security writes a fixed policy. [[slnc 300]] A fresh nonce for every page needs a small filter of your own, like the one in this store."""

[[scene]]
key = "09-ladder"
kind = "bullets"
title = "Two Lines of Defence"
body = ["First: every value escaped for its place", "th:text, th:attr, @{...}, th:inline", "Second: a strict policy with a nonce", "Only the shop's own scripts run"]
narration = """Let's put it side by side. [[slnc 400]] The first line of defence is escaping every value for its place. [[slnc 500]] Thymeleaf does that with th text, th attr, link expressions, and inline javascript. [[slnc 500]] The second line is a strict policy with a nonce. [[slnc 500]] Only the shop's own scripts carry it, so only they run."""

[[scene]]
key = "11-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["th:text and th:utext in templates", "CSP headers with nonces in developer tools", "Session cookie settings in Spring Boot", "\"Why is this th:utext?\" in code review"]
narration = """You have probably met this already. [[slnc 400]] th text and th u text in Thymeleaf templates. [[slnc 500]] Content security policy headers with nonces, in the browser's developer tools. [[slnc 500]] Session cookie settings in Spring Boot. [[slnc 500]] And code reviews that ask, why is this th u text?"""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Write values with th:text and friends", "Treat every th:utext as a finding", "Guard it with a test", "Add a nonce filter and a strict policy", "HttpOnly and SameSite session cookies"]
narration = """So, how do you use it? [[slnc 400]] Write every value with th text, and Thymeleaf's own syntax for attributes, links and scripts. [[slnc 500]] Treat every th u text as a finding to justify. [[slnc 500]] Guard it with a test. [[slnc 500]] Add a nonce filter and a strict policy. [[slnc 500]] And make the session cookie H T T P only and same site."""

[[scene]]
key = "12-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "13-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a second th:utext", "and watch the guard test fail."]
narration = """That's cross site scripting defences in Spring Boot. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Let the template escape every value, and treat th u text as the exception it is. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine, with nothing installed except a Java development kit. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a second template with th u text, and watch the guard test fail. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
An online store's product pages rendered by Thymeleaf in Spring Boot, showing text written by customers, and the policy and cookies sent with them. It covers a customer who writes a
review or note, and the browsers of other customers who read it. It does not cover client-side frameworks, rich-text sanitizing or other injection types.
"""
assets = [
    "The customer's session and what it can do.",
    "The content of the page as the shop meant it.",
    "The shop's own scripts and the nonce that lets them run.",
]
actors = [
    "A customer who writes reviews, notes and searches.",
    "Other customers whose browsers render the page.",
    "Developers who write templates.",
]
boundaries = [
    "Customer text to the template: every value crosses it.",
    "The store to the browser: the page and its policy cross it.",
]
assumptions = [
    "Browsers enforce Content-Security-Policy.",
    "Templates are reviewed, and the guard test runs in the build.",
    "In the demo, reviews are fixed demo values and the problem is shown with a bold tag only.",
]
out_of_scope = [
    "Client-side rendering frameworks.",
    "Rich text that must keep formatting, which needs a sanitizer.",
    "SQL and other injection types.",
]
tests = [
    "`ShopPagesTest` checks escaping in each place, the trap page, fresh matching nonces and the cookie flags on the real server.",
    "`TemplatesTest` fails if a template other than the trap uses th:utext, or if a script lacks the nonce.",
    "`ContentSecurityPolicyTest` checks the policy evaluator against browser rules.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next project, cross-site-request-forgery, looks at a different way another site can act as the customer: by sending requests the customer did not mean.
"""

[[threat]]
id = "T1"
stride = "T"
threat = "Customer text is written as markup and changes the page"
where = "`templates/product-unescaped.html` (th:utext)"
control = "th:text everywhere, and a guard test that lists every th:utext"
residual = "HTML built in Java code bypasses the template and needs the same review"

[[threat]]
id = "T2"
stride = "T"
threat = "A value breaks out of an attribute or a link"
where = "`templates/product.html`"
control = "th:attr and @{...} escape for their place"
residual = "Event handlers, styles and scheme-controlled URLs cannot be made safe by escaping"

[[threat]]
id = "T3"
stride = "E"
threat = "A value inside a script ends the string and becomes code"
where = "the inline script"
control = "th:inline=\"javascript\" writes one escaped string"
residual = "Values in other script positions, such as building code from text, are never safe"

[[threat]]
id = "T4"
stride = "E"
threat = "A script that slipped onto the page runs as the shop's own"
where = "`Shop`, `NonceFilter`"
control = "A strict policy with a fresh nonce for every page"
residual = "A nonce reused across pages, or 'unsafe-inline' without a nonce, removes the protection"

[[threat]]
id = "T5"
stride = "I"
threat = "A script reads the session cookie"
where = "the session cookie"
control = "HttpOnly and SameSite=Strict"
residual = "A script can still act within the page without reading the cookie, so the first line of defence matters most"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] A real Spring Boot store runs on this machine. [[slnc 300]] The templates, which we saw in the demos, do the escaping. [[slnc 300]] Here are the Java classes around them."""

[[class]]
name = "ReviewController"
what = "puts the customers' values in the model"
[[class.part]]
title = "plain values, no encoding"
code = """
model.addAttribute("review", REVIEW);
model.addAttribute("fitNote", FIT_NOTE);
model.addAttribute("search", SEARCH);
model.addAttribute("scriptNote", SCRIPT_NOTE);
model.addAttribute("cspNonce", NonceFilter.nonceOf(request));
"""
speech = """The controller passes the values as they are. [[slnc 300]] It does no encoding of its own: that is the template's job."""

[[class]]
name = "NonceFilter"
what = "a fresh nonce for every request"
[[class.part]]
title = "before the headers are written"
code = """
request.setAttribute(ATTRIBUTE, ContentSecurityPolicy.newNonce());
chain.doFilter(request, response);
"""
speech = """For every request, the filter makes a new nonce, and stores it on the request. [[slnc 300]] Both the policy header and the page read it from there."""

[[class]]
name = "Shop"
what = "Spring Security writes the policy with that nonce"
[[class.part]]
title = "the filter, then the header"
code = """
http.addFilterBefore(new NonceFilter(), HeaderWriterFilter.class)
        .headers(headers -> headers.addHeaderWriter((request, response) -> {
            String nonce = NonceFilter.nonceOf(request);
            if (nonce != null) {
                response.setHeader("Content-Security-Policy",
                        ContentSecurityPolicy.strict(nonce));
"""
speech = """The nonce filter is placed before Spring Security's header writer. [[slnc 300]] The header writer then puts this request's nonce into a strict policy."""

[[class]]
name = "Templates"
what = "the guard that finds every th:utext"
[[class.part]]
title = "search every template"
code = """
static List<String> unescaped() {
    return NAMES.stream().filter(name -> text(name).contains("th:utext")).toList();
"""
speech = """The guard reads every template and lists those that use th u text. [[slnc 300]] A test expects exactly one: the trap template."""

[[acronym]]
short = "XSS"
long = "Cross-Site Scripting: text from a user read as part of the page"
say = "X S S is cross site scripting: text from a user that the browser reads as part of the page."
[[acronym]]
short = "HTML"
long = "HyperText Markup Language: the markup of a web page"
say = "H T M L is hypertext markup language: the tags that make up a web page."
[[acronym]]
short = "CSP"
long = "Content-Security-Policy: a header listing which scripts may run"
say = "C S P is content security policy: a response header that tells the browser which scripts may run."
[[acronym]]
short = "URL"
long = "Uniform Resource Locator: the address of a page"
say = "U R L is uniform resource locator: the address of a page, with its parameters."
[[acronym]]
short = "HTTP, GET"
long = "HyperText Transfer Protocol; GET asks the server for a page"
say = "H T T P is hypertext transfer protocol. A get request asks the server for a page."
[[acronym]]
short = "HttpOnly, SameSite"
long = "cookie flags: no script may read it; not sent from other sites"
say = "H T T P only means no script on the page can read the cookie. Same site strict means the browser does not send it with requests from other sites."
[[acronym]]
short = "JSESSIONID"
long = "the session cookie of a Java web server"
say = "J session I D is the name of the session cookie a Java web server sets."
[[acronym]]
short = "th:text, th:utext"
long = "Thymeleaf: write a value escaped; write it unescaped, as markup"
say = "In Thymeleaf, th text writes a value escaped. th u text writes it unescaped, as markup."
[[acronym]]
short = "Base64, hex"
long = "Base64: bytes as letters, digits, + and /; hex: base sixteen, 0-9 and a-f"
say = "Base sixty four writes bytes with letters, digits, plus and slash. Hex is base sixteen, with the digits zero to nine and a to f."
[[acronym]]
short = "JDK"
long = "Java Development Kit"
say = "J D K is the Java development kit."
