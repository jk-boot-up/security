]

[[act]]
title = "th:utext, the one switch that turns escaping off"
summary = "The same review written with th:utext becomes a bold element the shop never wrote; one of the two templates uses th:utext, and a test fails if another appears."
detail = """
The same review written with th:utext, unescaped text, is written as markup: the page now has one bold element, and the shop wrote none. th:utext is for markup the shop wrote itself,
never for anything a customer typed. A search of the templates finds every place this can happen: one of the two, and a test fails if another one appears.
"""
speech = """
Second demo: the trap. [[slnc 400]] The same review, written with th u text. [[slnc 600]]
Now the tag is markup. [[slnc 300]] The page has a bold element that the shop never wrote. [[slnc 600]]
The u stands for unescaped. [[slnc 300]] It is for markup the shop wrote itself, never for anything a customer typed. [[slnc 600]]
A test lists every template that uses it, and fails if a new one appears.
"""
rows = { utext = "active wrong" }
console = [
    ["the same review written with th:utext: <b>Great boots</b>", "bad"],
    ["bold elements on the page: 1, and the shop wrote none  <- THE REVIEW BECAME PART OF THE PAGE", "bad"],
    ["th:utext means unescaped text: it is for markup the shop wrote itself, never for anything a customer typed", "amber"],
    ["a search of the templates for th:utext finds every place this can happen: 1 of 2 templates, and a test fails if another one appears", "ok"],
]

[[act]]
title = "The other places a value can go"
summary = "Ben's fit note reads back whole from an attribute, the search text stays one link parameter, and a value inside a script is written as one JavaScript string."
detail = """
In an attribute written with th:attr, Ben's fit note with its double quote reads back whole. In a link built with @{/search(q=...)}, the search text "size 5 & up" is encoded as one
parameter, and its ampersand does not start a second one. In a script with th:inline="javascript", the note with quotes is written as one JavaScript string. Each value went through the
escaping for its own place, chosen by how it was written in the template.
"""
speech = """
Third demo: the other places a value can go. [[slnc 400]] In an attribute, Ben's fit note, with its quote, reads back whole. [[slnc 600]]
In a link built by Thymeleaf, the search text stays one parameter. [[slnc 300]] Its ampersand does not start a second one. [[slnc 600]]
Inside a script, with inline javascript, the note is written as one string. [[slnc 600]]
Each value got the escaping for its own place, chosen by how the template wrote it.
"""
rows = { places = "active ok" }
console = [
    ["in an attribute, with th:attr: Ben's fit note reads back whole: Fits 5\" boots  (true)", "ok"],
    ["in a link, with @{/search(q=...)}: /search?q=size%205%20%26%20up", "ok"],
    ["the search text is one parameter, and its & did not start a second one: true", "ok"],
    ["in a script, with th:inline=\"javascript\": const note = \"It's \\\"great\\\"\"", "ok"],
    ["each value went through the escaping for its own place, chosen by how it was written in the template", "muted"],
]

[[act]]
title = "A strict Content-Security-Policy from Spring Security, with a fresh nonce for every page"
summary = "Every page has a policy whose nonce matches the page's own script, the next page has a different nonce, and a script without the nonce may not run."
detail = """
The product page answers with a strict policy. The policy names a nonce, and the shop's own script carries the same one. The next page has a different nonce. The shop's script may run;
a script that slipped in without the nonce may not, which is the second line of defence. The nonce comes from a filter that runs before Spring Security writes its headers, so the
header and the page always agree.
"""
speech = """
Fourth demo: the policy. [[slnc 400]] Every page answers with a strict content security policy. [[slnc 600]]
The policy names a nonce, and the shop's own script carries the same one. [[slnc 300]] The next page has a different nonce. [[slnc 600]]
The shop's script may run. [[slnc 300]] A script without the nonce may not. [[slnc 300]] That is the second line of defence. [[slnc 600]]
A small filter makes the nonce before Spring Security writes its headers, so the header and the page always agree.
"""
rows = { policy = "active ok" }
console = [
    ["the product page answers with a policy: true", "ok"],
