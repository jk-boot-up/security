[[scene]]
key = "01-poster"
kind = "poster"
title = "Cross-Site Scripting with Spring Boot"
narration = """Hello, and welcome. [[slnc 400]] This video looks at cross site scripting defences in Spring Boot. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a reminder. [[slnc 300]] Cross site scripting happens when a customer's text is read by the browser as part of the page. [[slnc 300]] The defence is to encode every value for the place it is written. [[slnc 600]] Think of a shop that prints customers' reviews through a printer that always prints plain letters. [[slnc 300]] The printer has one switch that prints a note as the shop's own sign. [[slnc 300]] Flip it for a customer's note, and the note passes as the shop. [[slnc 700]] In this video, the domain is an online store. [[slnc 500]] By the end, you will hear what Thymeleaf escapes for you. [[slnc 300]] The one switch that stops it. [[slnc 300]] How each place a value goes is escaped. [[slnc 300]] And how to send a policy with a fresh nonce from Spring Security."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online store shows product reviews", "with Thymeleaf templates.", "", "Reviews, fit notes and searches", "are written by customers."]
narration = """Here is the scenario. [[slnc 400]] An online store shows product reviews on its pages, using Thymeleaf templates. [[slnc 500]] Reviews, fit notes and searches are all written by customers. [[slnc 600]] Every one of them must stay text."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["Template engine: writes pages from data", "th:text: writes a value, escaped", "th:utext: writes a value as markup", "Nonce: a random value, new for every page", "CSP: the browser's rule for which scripts run"]
narration = """Before the demos, the words. [[slnc 500]] A template engine writes pages from data. [[slnc 500]] th text writes a value, escaped. [[slnc 500]] th u text writes a value as markup, with no escaping. [[slnc 500]] A nonce is a random value, new for every page. [[slnc 500]] And a content security policy tells the browser which scripts may run."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "09-ladder"
kind = "bullets"
title = "Two Lines of Defence"
body = ["First: every value escaped for its place", "th:text, th:attr, @{...}, th:inline", "Second: a strict policy with a nonce", "Only the shop's own scripts run"]
narration = """Let's put it side by side. [[slnc 400]] The first line of defence is escaping every value for its place. [[slnc 500]] Thymeleaf does that with th text, th attr, link expressions, and inline javascript. [[slnc 500]] The second line is a strict policy with a nonce. [[slnc 500]] Only the shop's own scripts carry it, so only they run."""

[[scene]]
key = "10-roles"
kind = "bullets"
title = "Who Does What"
body = ["Shop: Spring Security and the policy", "NonceFilter: a fresh nonce per request", "ReviewController: the pages", "Templates: the th:utext guard", "Markup: reading the page as a browser would"]
narration = """Here is who does what in the code. [[slnc 400]] The shop class configures Spring Security and the policy header. [[slnc 500]] The nonce filter makes a fresh nonce for every request. [[slnc 500]] The review controller fills the pages. [[slnc 500]] The templates class lists every template that uses th u text. [[slnc 300]] And the markup class reads a page the way a browser would."""

[[scene]]
key = "11-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["th:text and th:utext in templates", "CSP headers with nonces in developer tools", "Session cookie settings in Spring Boot", "\"Why is this th:utext?\" in code review"]
narration = """You have probably met this already. [[slnc 400]] th text and th u text in Thymeleaf templates. [[slnc 500]] Content security policy headers with nonces, in the browser's developer tools. [[slnc 500]] Session cookie settings in Spring Boot. [[slnc 500]] And code reviews that ask, why is this th u text?"""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Write values with th:text and friends", "Treat every th:utext as a finding", "Guard it with a test", "Add a nonce filter and a strict policy", "HttpOnly and SameSite session cookies"]
narration = """So, how do you use it? [[slnc 400]] Write every value with th text, and Thymeleaf's own syntax for attributes, links and scripts. [[slnc 500]] Treat every th u text as a finding to justify. [[slnc 500]] Guard it with a test. [[slnc 500]] Add a nonce filter and a strict policy. [[slnc 500]] And make the session cookie H T T P only and same site."""

