[[act]]
title = "The other places a value can go"
summary = "A fit note in an attribute becomes Fits 5&quot; boots, a search in a link becomes size%205%20%26%20up, and a note in a script becomes \"It's \\\"great\\\"\": each read back whole."
detail = """
Three more values go into the model: the fit note Fits 5" boots, the search size 5 & up, and the script note It's "great". The template writes them with th:attr, with a link expression @{/search(q=${search})}, and with th:inline="javascript".
Thymeleaf writes data-fit="Fits 5&quot; boots", href="/search?q=size%205%20%26%20up" and const note = "It's \\"great\\"";. In the attribute the quote becomes &quot;; in the link a space becomes %20 and & becomes %26, because & is character 38 = 2 x 16 + 6, which is 26 in hex; in the script the quote gets a backslash.
The browser reads the fit note back whole, finds one parameter in the link, and one string in the script with no early end.
"""
figure = "three_places"
figure_title = "Three places, three ways of escaping"
figure_speech = """
Third demo: the other places a value can go. [[slnc 400]] Each row is one value. [[slnc 300]] On the left, the value. [[slnc 300]] In the middle, how the template writes it. [[slnc 300]] On the right, what Thymeleaf wrote, with the escaped characters in green. [[slnc 700]]
In an attribute, the quote mark becomes ampersand quot, so it cannot end the attribute. [[slnc 600]]
In a link, the space becomes percent twenty, and the ampersand becomes percent twenty six. [[slnc 300]] So it cannot start a second parameter. [[slnc 600]]
In a script, the quote marks get a backslash, so they cannot end the string. [[slnc 700]]
Three places. [[slnc 300]] Three different escapes. [[slnc 300]] Thymeleaf picks the right one from how the value is written.
"""
speech = """
Here is the output. [[slnc 400]] The values in the model. [[slnc 400]] And the template: an attribute, a link expression, and an inline script.
[[page]]
What Thymeleaf wrote for each. [[slnc 400]] How the characters were written: an ampersand is character thirty eight, two sixteens and six, so twenty six in hex. [[slnc 400]] And the result: the fit note reads back whole, the link has one parameter, and the script has one string.
"""
rows = { places = "active ok" }
