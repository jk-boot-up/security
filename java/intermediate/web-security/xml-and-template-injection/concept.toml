    { id = "parser", label = "XML parser", sub = "entities, DOCTYPE", col = 1, row = 0, colour = "client" },
    { id = "files", label = "Server files", sub = "reachable by entities", col = 2, row = 0, colour = "green", shape = "store" },
    { id = "engine", label = "Template engine", sub = "expressions", col = 1, row = 1, colour = "amber" },
    { id = "app", label = "Application", sub = "config, secrets", col = 2, row = 1, colour = "green", shape = "store" },
]
edges = [
    { from = "supplier", to = "parser", label = "file", colour = "red", dashed = true },
    { from = "parser", to = "files", label = "reads" },
    { from = "engine", to = "app", label = "reaches" },
]

