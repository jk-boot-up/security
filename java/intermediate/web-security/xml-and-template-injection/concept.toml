[[act]]
title = "A template engine that evaluates expressions"
summary = "Every template can reach customer and app; the owner's template prints Hello Ana; a name of ${app.config.smtpPassword} pasted into the template is walked app -> config() -> smtpPassword() and prints demo-smtp-password; the same name passed as data stays text."
detail = """
The e-mail engine evaluates ${...} by walking properties by reflection, and two names are reachable from every template: customer and app. app.config.smtpPassword is the mail password, here the marker demo-smtp-password.
The owner's template Hello ${customer.name}, your order shipped. prints Hello Ana, your order shipped.
A customer signs up with the name ${app.config.smtpPassword}. The code builds the template by pasting the name in. The engine works it out step by step: app is the App object; .config calls config() and gets an AppConfig; .smtpPassword calls smtpPassword() and gets demo-smtp-password. The e-mail says Hello demo-smtp-password.
${customer.class.name} walks customer -> getClass() -> getName() and prints com.jk.explore.security.xmlinj.Customer: any public method is reachable.
Passed as data to the fixed template Hello ${customer.name}, the same name prints as text: the engine does not evaluate its own output again.
"""
figure = "expression_walk"
figure_title = "The pasted name, one method call at a time"
figure_speech = """
Fourth demo: a template engine that evaluates expressions. [[slnc 400]] At the top, the template as the code built it. [[slnc 300]] The customer's name, in red, was pasted in. [[slnc 300]] The name is: dollar, brace, app dot config dot smtp password. [[slnc 700]]
The engine reads the part between the braces as a path. [[slnc 300]] It starts at app, the running application. [[slnc 300]] Dot config calls the method config, and gets the settings. [[slnc 300]] Dot smtp password calls that method, and gets the mail password. [[slnc 700]]
The second row is another name: customer dot class dot name. [[slnc 300]] It calls get class, then get name, and shows the Java class behind the data. [[slnc 300]] Any public method can be reached this way. [[slnc 600]]
The e-mail says: hello, and the password.
"""
