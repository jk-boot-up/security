[[act]]
title = "Refuse the DOCTYPE"
summary = "The safe parser refuses any DOCTYPE and switches off external DTDs, schemas, XInclude and entity expansion; the honest invoice is accepted, both attacks are refused before any entity is read, and a 10,095-character upload is too large."
detail = """
An invoice has no use for a DOCTYPE, so the safe parser refuses one: the feature disallow-doctype-decl is true. The settings are read back from the parser the code builds.
The other settings are extra layers in case somebody switches the first one off later: secure processing is on, no external DTDs or schemas may be fetched, XInclude is off and entity references are not expanded. Uploads over 10,000 characters are refused before parsing.
The same three files again: the honest invoice is accepted, Ana and 42.50. The external entity and the bomb are both refused with a DOCTYPE is not allowed in an invoice, before any entity is looked at. An invoice of 10,095 characters is refused as too large.
"""
figure = "doctype_refused"
figure_title = "One setting stops both attacks; the rest are extra layers"
figure_speech = """
Third demo: refuse the doctype. [[slnc 400]] On the left, the settings of the safe parser. [[slnc 300]] They are read back from the code, not typed by hand. [[slnc 600]]
The first one is the fix. [[slnc 300]] Disallow doctype declaration: true. [[slnc 300]] An invoice never needs a doctype, so any file that has one is refused. [[slnc 600]]
The others are extra layers, in case someone turns the first one off later. [[slnc 300]] No external D T Ds, no external schemas, no X include, no entity expansion, and at most ten thousand characters. [[slnc 700]]
On the right, the same files again. [[slnc 300]] The honest invoice is accepted. [[slnc 300]] The file entity and the bomb are refused for the same reason, at the first line. [[slnc 300]] And an oversized upload is refused before parsing.
"""
speech = """
Here is the output. [[slnc 400]] The parser settings, read back from the safe parser. [[slnc 300]] The doctype is refused, and every external access is empty.
[[page]]
The same uploads. [[slnc 300]] The honest invoice: accepted. [[slnc 300]] The file entity and the bomb: a doctype is not allowed in an invoice. [[slnc 300]] And ten thousand and ninety-five characters: upload too large.
"""
