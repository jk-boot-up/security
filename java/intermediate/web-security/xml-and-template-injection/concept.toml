[threatmodel]
scope = """
An online store's XML invoice upload and its e-mail templates. It covers the parser's configuration, the template engine and how customer text reaches them.
It does not cover other file types, XML signatures, or who may write the owner's templates.
"""
assets = [
    "Files on the server, and what the server can reach on the network.",
    "The application's configuration and secrets.",
    "The availability of the import and the mail service.",
]
actors = [
    "A supplier who uploads invoices.",
    "A customer whose name appears in e-mails.",
    "The shop owner who writes the templates.",
]
boundaries = [
    "Upload to parser: the file is untrusted, and the parser follows what it says.",
    "Customer text to template: text becomes code if it is pasted in.",
]
assumptions = [
    "The XML parser honours its configuration, and the same configuration is used for every upload.",
    "Templates are written by the owner and kept as fixed files.",
]
out_of_scope = [
    "XML signature wrapping: saml-basics.",
    "Cross-site scripting in the e-mail's HTML: the cross-site-scripting project.",
]
tests = [
    "`XmlTemplateTest` checks both parsers and both engines, including temporary files for the entity, the bomb, size limits and escaping.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next project, insecure-deserialization, moves to objects that a server rebuilds from bytes a customer sends.
"""

[[threat]]
id = "T1"
stride = "I"
threat = "An external entity reads a server file or fetches an address"
where = "`NaiveInvoiceParser`"
control = "`disallow-doctype-decl`, no external DTD or schema access"
residual = "Another parser in the project with default settings"

[[threat]]
id = "T2"
stride = "D"
threat = "An entity bomb exhausts memory and time"
where = "`NaiveInvoiceParser`"
control = "No DOCTYPE, secure processing and a size limit"
residual = "Very large documents that are within the size limit are still parsed in memory"

[[threat]]
id = "T3"
stride = "E"
threat = "Customer text pasted into a template runs and reads the application's objects"
where = "`ExpressionEngine`"
control = "A logic-less engine, and customer text passed as data"
residual = "A developer who builds templates from input for another engine"

[[threat]]
id = "T4"
stride = "T"
threat = "Markup in a value changes the HTML of the e-mail"
where = "`LogicLessEngine`"
control = "Values are escaped for HTML text"
residual = "A value placed in an attribute or URL needs the escaper for that place"

[poster]
headline = [["XXE AND TEMPLATE", "text"], ["INJECTION", "accent"]]
taglines = [["A file or a template is a program for its reader", "gold"]]
before = { code = "<note>&xxe;</note>", note = "The parser reads a server file", tag = "BEFORE" }
after = { code = "disallow-doctype-decl", note = "A logic-less engine keeps data as data", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "XML External Entities and Template Injection"
narration = "Hello, and welcome. [[slnc 400]] This video explains X M L external entities, or X X E, and server-side template injection, or S S T I, in Java. [[slnc 300]] X M L stands for extensible markup language: text with nested tags. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] An X M L parser and a template engine both follow instructions that they find in their input. [[slnc 300]] An X M L file can tell the parser to read a file from the server. [[slnc 300]] And a template can tell the engine to run an expression. [[slnc 300]] If an attacker writes the input, the attacker writes the instructions. [[slnc 600]] Think of a form whose small print says: attach a copy of whatever is in the manager's drawer. [[slnc 300]] A careful clerk ignores the small print. [[slnc 300]] A careless one obeys it. [[slnc 600]] Our example is an online store."

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online store accepts supplier invoices", "as XML files.", "", "It sends customers e-mails from templates,", "with the customer's name filled in.", "", "The demo uses the JDK's own XML parser.", "Every secret in it is fake."]
narration = "Here is the scenario. [[slnc 400]] An online store accepts invoices from its suppliers, as small X M L files. [[slnc 500]] It also sends its customers e-mails from templates, with each customer's name filled in. [[slnc 600]] The demo uses the X M L parser that comes with the Java development kit, and a small template engine written for the demo. [[slnc 300]] A temporary file stands in for a secret file on the server, and every secret in the demo is fake."

[[scene]]
key = "02-words"
kind = "bullets"
title = "The Words"
body = ["Entity: a name the parser replaces by a value", "DOCTYPE: the part of a file that defines entities", "External entity: its value is a file or an address", "Template: a text with holes for values", "Expression: a path the engine works out, ${a.b}", "Escaping: special characters made harmless"]
narration = """Before the demos, the words. [[slnc 500]] An entity is a name, in an X M L file, that the parser replaces by a value. [[slnc 500]] The doctype is the part at the top of a file that may define entities. [[slnc 500]] An external entity is one whose value is fetched from a file or an address. [[slnc 500]] A template is a text with holes, filled with values. [[slnc 500]] An expression is a path, like dollar, brace, a dot b, that some engines work out at run time. [[slnc 500]] And escaping replaces special characters, so a value can only ever be text."""

[[scene]]
key = "02-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "02-core"
kind = "figure"
title = "Two readers that obey their input"
body = "reader_obeys"
narration = """Let's see the whole idea on one picture. [[slnc 400]] At the top, an invoice upload. [[slnc 300]] The red part defines a name, x x e, as a file on the server, and the note uses that name. [[slnc 300]] The X M L parser does what the file says. [[slnc 300]] It opens the file, and the note becomes the server's secret. [[slnc 700]]
At the bottom, an e-mail template. [[slnc 300]] The code pasted a customer's name into it, and the name, in red, is an expression. [[slnc 300]] The template engine does what the template says. [[slnc 300]] It works out the expression, and the e-mail shows the mail password. [[slnc 700]]
Two different readers, one mistake. [[slnc 300]] Input written by an attacker was read as instructions. [[slnc 300]] The fixes: a parser that refuses the doctype, and an engine with no expressions."""

[[scene]]
key = "03-acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "04-costs"
kind = "bullets"
title = "What It Costs"
body = ["Some XML really needs a DOCTYPE", "Every parser library has its own settings", "Logic-less templates are less convenient", "Escaping depends on where the value goes", "Template authors must be trusted people"]
narration = "Nothing is free. [[slnc 400]] Here is what the defences cost. [[slnc 500]] Some X M L formats really need a doctype, and then the other parser settings carry the whole load. [[slnc 500]] Every parser library has its own settings, so each one in the project has to be checked. [[slnc 500]] Logic-less templates are less convenient: the code prepares every value in advance. [[slnc 500]] Escaping depends on where a value goes, H T M L, a link, or plain text. [[slnc 300]] And whoever writes the templates must be a trusted person, because the template is code."

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "How To Use It"
body = ["XML from outside: refuse the DOCTYPE", "  and switch off external entities", "Test every parser's settings", "Templates are fixed files with named holes", "Customer text is data, never template", "Escape every value for where it goes"]
narration = "So, how do you use it? [[slnc 400]] Parse X M L from outside with the doctype refused, and with external entities and external schemas switched off as extra layers. [[slnc 500]] Test the settings of every parser in the project, because each library has its own. [[slnc 500]] Write templates as fixed files with named holes. [[slnc 500]] Never paste a customer's text into a template: pass it in as data. [[slnc 300]] And escape every value for the place it goes."

[[scene]]
key = "12-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Switch off the DOCTYPE refusal", "and see which other settings still stop the attack."]
narration = "That's X M L external entities and template injection. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] A parser or an engine that follows instructions found in its input must be told not to, so refuse the doctype, keep templates fixed and logic-less, and pass the customer's text in as data. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Switch off the doctype refusal in the safe parser, and see which of the other settings still stop the file entity. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] The X M L parser is the one in the Java development kit, so the attack is real. [[slnc 300]] The template engines are small classes written for the demo. [[slnc 300]] Here are the lines that matter."""

[[class]]
name = "NaiveInvoiceParser"
what = "the first version: the JDK's XML parser as it comes"
[[class.part]]
title = "the default factory"
code = """
protected DocumentBuilderFactory factory() {
    return DocumentBuilderFactory.newInstance();
"""
speech = """The first version takes the parser factory with its defaults. [[slnc 300]] The defaults read a doctype, and fetch external entities, for whoever wrote the file."""

[[class]]
name = "SafeInvoiceParser"
what = "the fix: no DOCTYPE, no external access, a size limit"
[[class.part]]
title = "refuse the DOCTYPE, then extra layers"
code = """
f.setFeature("http://apache.org/xml/features/disallow-doctype-decl", true);
f.setFeature(XMLConstants.FEATURE_SECURE_PROCESSING, true);
f.setAttribute(XMLConstants.ACCESS_EXTERNAL_DTD, "");
f.setAttribute(XMLConstants.ACCESS_EXTERNAL_SCHEMA, "");
f.setXIncludeAware(false);
f.setExpandEntityReferences(false);
"""
speech = """The fix is the first line: refuse any doctype. [[slnc 300]] The other lines are extra layers: no external D T Ds or schemas, no X include, and no entity expansion. [[slnc 300]] The demo reads these settings back and prints them."""
[[class.part]]
title = "a size limit before parsing"
code = """
if (xml.length() > MAX_BYTES) {
    throw new InvoiceException("upload too large");
"""
speech = """Before the parser sees anything, an upload over ten thousand characters is refused."""

[[class]]
name = "ExpressionEngine"
what = "the first template engine: ${a.b.c} walked by reflection"
[[class.part]]
title = "every template can reach the application"
code = """
Map<String, Object> context = Map.of("customer", customer, "app", app);
...
for (int i = 1; i < parts.length && value != null; i++) {
    value = method(value, parts[i]).invoke(value);
"""
speech = """Every template starts from two names, customer and app. [[slnc 300]] Each part of the path calls a method on the value before it. [[slnc 300]] That is how a pasted name reaches the mail password."""
[[class.part]]
title = "any public method will do"
code = """
for (Method m : target.getClass().getMethods()) {
    boolean named = m.getName().equals(name) || m.getName().equals(getter);
    if (m.getParameterCount() == 0 && named) {
        return m;
"""
speech = """The lookup takes any public method with no parameters. [[slnc 300]] Get class is one of them, so the template can reach far beyond the data."""

[[class]]
name = "XmlTemplateDemo"
what = "runs the five acts, and makes the mistake behind SSTI"
[[class.part]]
title = "the name pasted into the template"
code = """
String injected = "Hello " + mallory.name() + ", your order shipped.";
"""
speech = """This line is the real mistake. [[slnc 300]] The customer's name becomes part of the template, so the engine treats it as code."""

[[class]]
name = "LogicLessEngine"
what = "the fix: two named holes, escaped values, one pass"
[[class.part]]
title = "a flat list, and escaping"
code = """
Map<String, String> values = Map.of("name", customer.name(), "email", customer.email());
...
m.appendReplacement(out, Matcher.quoteReplacement(value == null ? "" : escape(value)));
"""
speech = """The fixed engine knows two values, and nothing else. [[slnc 300]] There are no paths and no method calls. [[slnc 300]] Every value is escaped, and the output is never read again."""

[[acronym]]
short = "XML"
long = "Extensible Markup Language: text with nested tags"
say = "X M L is extensible markup language: text with nested tags, like an invoice tag that holds a customer and a total."
[[acronym]]
short = "XXE"
long = "XML External Entity: a file or address read through an entity"
say = "X X E is X M L external entity: an attack where an uploaded file makes the parser read a server file or an address."
[[acronym]]
short = "SSTI"
long = "Server-Side Template Injection: text that runs inside a template"
say = "S S T I is server-side template injection: text from a user that runs inside a template, on the server."
[[acronym]]
short = "DTD"
long = "Document Type Definition: the rules and entities a DOCTYPE declares"
say = "D T D is document type definition: the rules and entities that a doctype declares, inline or in an external file."
[[acronym]]
short = "doctype, entity, system"
long = "XML words: start definitions; define a name; read from an address"
say = "Doctype starts the definitions at the top of the file. Entity defines a name. System means the name's value is fetched from an address, like a file."
[[acronym]]
short = "JDK"
long = "Java Development Kit: Java with its standard library and tools"
say = "J D K is the Java development kit: Java, with its standard library, which includes an X M L parser."
[[acronym]]
short = "SMTP"
long = "Simple Mail Transfer Protocol: how a program sends e-mail"
say = "S M T P is simple mail transfer protocol: how a program sends e-mail. The shop's S M T P password is its mail password."
[[acronym]]
short = "HTML"
long = "HyperText Markup Language: the language of web pages and many e-mails"
say = "H T M L is hypertext markup language: the language of web pages, and of many e-mails."
