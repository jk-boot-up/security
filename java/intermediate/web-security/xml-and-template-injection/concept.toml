[[act]]
title = "A logic-less engine keeps data as data"
summary = "The fixed engine has two holes, {{name}} and {{email}}; the pasted expression stays text; markup is escaped character by character: & < > \" ' become &amp; &lt; &gt; &quot; &#39;."
detail = """
The logic-less engine fills {{name}} and {{email}} from a flat list of two values and does nothing else: no expressions, no reflection, one pass over the template.
The owner's template prints Hello Ana, your order shipped. The name pasted into the template stays the text ${app.config.smtpPassword}, and so does the name passed as data.
A name with markup, <script>x</script>, is escaped for HTML: & becomes &amp;, < becomes &lt;, > becomes &gt;, " becomes &quot; and ' becomes &#39;. The e-mail says Hello &lt;script&gt;x&lt;/script&gt;, which a mail reader shows as text.
The better habit is still to keep customer text out of the template and pass it as a value.
"""
figure = "logic_less"
figure_title = "Two holes, no expressions, every value escaped"
figure_speech = """
Fifth demo: a logic-less engine keeps data as data. [[slnc 400]] Top left, the only holes it knows: name and email. [[slnc 300]] There is no path, no dot, no method call. [[slnc 700]]
On the right, the same three templates. [[slnc 300]] The owner's template says hello Ana. [[slnc 300]] The pasted expression stays text, because this engine has no expressions. [[slnc 300]] And the name passed as data stays text too. [[slnc 700]]
Below, a name with markup: a script tag. [[slnc 300]] Each special character is replaced by an entity. [[slnc 300]] Less than becomes ampersand l t. [[slnc 300]] Greater than becomes ampersand g t. [[slnc 300]] The result is shown as text, and never runs.
"""
speech = """
Here is the output. [[slnc 400]] The values: two named holes. [[slnc 300]] What the engine does: it fills each hole from the list, escaped, in one pass. [[slnc 400]] The owner's template: hello Ana. [[slnc 300]] The pasted name and the name passed as data both stay text.
[[page]]
The name with markup. [[slnc 300]] How each character is escaped. [[slnc 300]] And the result: the script tag, as harmless text.
"""
rows = { plain = "active ok" }
console = [
    ["THE VALUES (a flat list; nothing else is reachable):", "code"],
