[[act]]
title = "The parser reads what the file tells it to"
summary = "A DOCTYPE defines the entity xxe as a file on the server, and the note becomes demo-secret-from-the-server; an entity bomb of 464 characters would expand to 3,000,000 and is stopped only by the JDK's default limit."
detail = """
The uploaded file starts with a DOCTYPE, the part of an XML file that may define entities. It defines xxe with the word SYSTEM and the address of a file on the server, and the note is &xxe;.
The parser opens that file and puts its text where &xxe; stands, so the shop stores the note demo-secret-from-the-server. In the demo the file is a temporary file the program writes and deletes.
A second file, the entity bomb, is 464 characters long. a0 is lol; a1 holds ten a0; each level holds ten of the level below, up to a6. a6 is 10 x 10 x 10 x 10 x 10 x 10 = 1,000,000 copies of lol, 3,000,000 characters.
The JDK's default entity expansion limit stops it. That is luck of the library, not a setting of ours.
"""
figure = "entity_fetch"
figure_title = "A name for a server file, and a name that multiplies"
figure_speech = """
Second demo: the parser reads what the file tells it to. [[slnc 400]] At the top, the upload. [[slnc 300]] Its first lines are a doctype. [[slnc 300]] They define a new entity, called x x e. [[slnc 300]] Its value is not text. [[slnc 300]] It is the address of a file, on the server. [[slnc 700]]
The note says: ampersand, x x e. [[slnc 300]] So the parser opens that file, and puts its text into the note. [[slnc 300]] The shop stores the server's secret, and shows it back to the uploader. [[slnc 800]]
Below, a second file: an entity bomb. [[slnc 300]] a zero is the word lol. [[slnc 300]] a one holds ten copies of a zero. [[slnc 300]] Each name holds ten of the name below it, six times. [[slnc 300]] Ten times ten, six times, is one million copies. [[slnc 300]] Three letters each: three million characters, from a file of a few hundred. [[slnc 600]]
The parser stops it, but only because of the Java library's default limit.
"""
speech = """
Here is the output, one file per page. [[slnc 400]] The upload, with a doctype that defines x x e as a file on the server. [[slnc 400]] What the parser does: it opens the file, and puts its text where ampersand x x e stands. [[slnc 400]] The result: the note is the server's secret.
[[page]]
The entity bomb, four hundred and sixty-four characters. [[slnc 400]] Worked out: one million copies of lol, three million characters. [[slnc 400]] The result: refused, by the parser's expansion limit. [[slnc 300]] Stopped by luck, not by our settings.
"""
rows = { xxe = "active wrong" }
console = [
