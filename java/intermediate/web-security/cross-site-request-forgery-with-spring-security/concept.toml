stride = "S"
threat = "A page on another site makes the customer's browser send a state-changing request with the session cookie"
where = "`WebSecurity` web chain"
control = "A token tied to the session, in a form field or a header, checked on every state-changing request"
residual = "Cross-site scripting that reads the token"

[[threat]]
id = "T2"
stride = "S"
threat = "An exempt route accepts a forged request"
where = "`BankController.webhook`, the exemption list"
control = "A signature check on every exempt route and a review of the list"
residual = "A new exemption added without review"

[[threat]]
id = "T3"
stride = "T"
threat = "A route changes state on GET and so is never checked"
where = "`BankController.legacyMove`"
control = "State changes only on POST, PUT and DELETE"
residual = "Old routes that nobody remembers"

