narration = "That's C S R F with Spring Security. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Spring Security refuses a state-changing request without a token that belongs to the session, and the protection is only as strong as the switches, exemptions and G E T routes left in the application. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a Fetch Metadata filter that refuses a cross-site post, and test it beside the token. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"
