[[act]]
title = "Spring Security's default token"
summary = "With the default, the sign-in form, every transfer and logout need a token from the session: the old token, no token and Mallory's token get 403; Ana's own form works; the token is masked differently on every page, and a token masked by hand is accepted."
detail = """
The web chain keeps CSRF on and exempts only /webhooks/**. The sign-in form needs a token too, so that Mallory cannot sign Ana in to his own account: without one 403, with one 302.
Four requests to POST /transfer with Ana's cookie: the token from before she signed in (403, because the token is renewed at sign-in), evil.example with no token (403), evil.example with a real token from Mallory's session (403), and Ana's own form with her token (200 sent 20 to mallory).
How the token is masked: the session's token is a UUID of 36 characters. A page gets 36 random bytes followed by the token XOR those bytes, 72 bytes, written as Base64 URL text: 72 / 3 * 4 = 96 characters. Two pages differ, and the first half XOR the second half gives the same token on both.
One example byte: 0x61 ('a') XOR 0x5c = 0x3d is sent, and 0x3d XOR 0x5c = 0x61 again.
A token masked by hand with TokenMask is accepted (200 sent 20 to mallory). Logging out is a state change too: without a token 403, with one 302. The balances are 960 and 40.
"""
figure = "token_mask"
figure_title = "A new mask on every page"
figure_speech = """
Second demo: Spring Security's default token. [[slnc 400]] This picture shows how the token is hidden on each page. [[slnc 600]]
The session holds one token: a U U I D, thirty six characters. [[slnc 300]] Each page gets thirty six fresh random bytes. [[slnc 300]] Then the token, combined with those bytes by X O R. [[slnc 300]] Seventy two bytes in all. [[slnc 300]] As Base sixty four text, every three bytes become four characters, so ninety six characters. [[slnc 700]]
Here is one byte. [[slnc 300]] The letter a is hex sixty one. [[slnc 300]] X O R with the random byte five c gives three d, and that is sent. [[slnc 300]] X O R with five c again gives sixty one back. [[slnc 700]]
So two pages never show the same text, but both unmask to the same token. [[slnc 300]] And a token masked by hand, with these steps, is accepted by Spring.
"""
speech = """
Here is the output. [[slnc 400]] The configuration keeps the check on, and exempts only webhooks. [[slnc 400]] The sign-in form needs a token too: without one, four oh three.
[[page]]
Four requests, each with Ana's cookie. [[slnc 300]] The token from before she signed in is refused, because it is renewed at sign-in. [[slnc 300]] No token, and Mallory's token, are refused. [[slnc 300]] Ana's own form works.
[[page]]
How the token is masked. [[slnc 300]] Thirty six random bytes, plus the masked token, seventy two bytes, ninety six characters. [[slnc 400]] Two pages differ, and both unmask to the same token. [[slnc 300]] And one example byte.
[[page]]
The token masked by hand is accepted. [[slnc 400]] Logging out is a state change too: without a token, four oh three. [[slnc 300]] With one, it works.
"""
