[threatmodel]
scope = """
A session-cookie web application on Spring Security 7 and the filter chains that protect it. It covers forged state-changing requests from other sites, exemptions and the API chain. It does not cover cross-site scripting or a compromised browser.
"""
assets = [
    "The customer's money.",
    "The customer's session.",
]
actors = [
    "A customer logged in at the bank.",
    "An attacker who controls another site's page.",
    "A developer who changes the configuration.",
]
boundaries = [
    "The browser to the bank: the cookie is attached to requests whatever site caused them.",
    "An exempt route: it has no token and needs its own proof of origin.",
]
assumptions = [
    "No cross-site scripting hole exists in the bank's pages.",
    "The browser does not let one site read another site's cookies or pages.",
]
out_of_scope = [
    "Cross-site scripting and clickjacking.",
    "Attacks from the customer's own device.",
]
tests = [
    "`CsrfSpringTest` starts a real server per mode and checks the forged post, a token from another session, sign-in and logout, masking and renewal, single-page mode, GET, the webhook, an extra exemption, the API chain and SameSite.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next project in this module, server-side-request-forgery, moves from the browser to the server: a request the bank makes on an attacker's behalf.
"""

[[threat]]
id = "T1"
stride = "S"
threat = "A page on another site makes the customer's browser send a state-changing request with the session cookie"
where = "`WebSecurity` web chain"
control = "A token tied to the session, in a form field or a header, checked on every state-changing request"
residual = "Cross-site scripting that reads the token"

[[threat]]
id = "T2"
stride = "S"
threat = "An exempt route accepts a forged request"
where = "`BankController.webhook`, the exemption list"
control = "A signature check on every exempt route and a review of the list"
residual = "A new exemption added without review"

[[threat]]
id = "T3"
stride = "T"
threat = "A route changes state on GET and so is never checked"
where = "`BankController.legacyMove`"
control = "State changes only on POST, PUT and DELETE"
residual = "Old routes that nobody remembers"

[poster]
headline = [["CSRF WITH", "text"], ["SPRING SECURITY", "accent"]]
taglines = [["Spring Security's token check is on by default, and the ways to lose it are a switch, an e", "gold"]]
before = { code = "http.csrf(c -> c.disable())", note = "CSRF protection switched off", tag = "BEFORE" }
after = { code = "csrf.ignoringRequestMatchers(...)", note = "The bill", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "Cross-Site Request Forgery with Spring Security"
narration = "Hello, and welcome. [[slnc 400]] This video explains cross-site request forgery, C S R F, with Spring Security, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A browser sends a site's cookie with every request to that site, even when the request was started by a page on another site. [[slnc 300]] So another site can send a request that the bank believes came from its own customer. [[slnc 300]] Spring Security stops this with a secret token on every request that changes something. [[slnc 600]] Think of a signed cheque. [[slnc 300]] Anyone who holds it could fill in an amount. [[slnc 300]] So the bank also asks for a code that is printed only in the customer's own cheque book. [[slnc 600]] Our example is an online bank."

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online bank on Spring Boot.", "Customers sign in; a session cookie remembers them.", "", "Ana is a customer. Mallory runs evil.example.", "", "The demo starts the real bank five times,", "with different settings, and forges requests."]
narration = "Here is the scenario. [[slnc 400]] An online bank runs on Spring Boot, and remembers a signed-in customer with a session cookie. [[slnc 500]] Ana is a customer. [[slnc 300]] Mallory runs a page on another site, evil dot example. [[slnc 600]] The demo starts the real bank five times, each time with different security settings. [[slnc 300]] A small browser stand-in keeps Ana's cookie and attaches it to every request, which is exactly what makes the attack possible."

[[scene]]
key = "02-words"
kind = "bullets"
title = "The Words"
body = ["Session cookie: remembers who signed in", "CSRF token: a secret only the bank's pages hold", "Masked token: the same token, new text per page", "Filter chain: Spring Security's checks per path", "Exemption: a path the token check skips"]
narration = """Before the demos, the words. [[slnc 500]] A session cookie remembers who signed in. [[slnc 500]] The C S R F token is a secret that only the bank's own pages hold. [[slnc 500]] A masked token is the same token, written differently on every page. [[slnc 500]] A filter chain is the list of checks Spring Security runs for a group of paths. [[slnc 500]] And an exemption is a path that the token check skips."""

[[scene]]
key = "02-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "02-filter"
kind = "figure"
title = "What Spring Security checks"
body = "spring_filter"
narration = """Let's see the whole idea on one picture. [[slnc 400]] On the left, two requests to the transfer. [[slnc 300]] Both carry Ana's session cookie, because the browser adds it to every request to the bank. [[slnc 700]] In the middle, Spring Security's C S R F filter. [[slnc 300]] A GET is not checked, because it must never change anything. [[slnc 300]] A post must carry the token, in a header or a form field. [[slnc 300]] The filter unmasks it, and compares it with the token kept in Ana's session. [[slnc 700]] The page on evil dot example has no token, so it gets four oh three. [[slnc 300]] Ana's own form has it, so the transfer runs. [[slnc 600]] The cookie says who is asking. [[slnc 300]] Only the bank's own page holds the token."""

[[scene]]
key = "03-acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "04-costs"
kind = "bullets"
title = "What It Costs"
body = ["Every form and script call must send the token", "A single-page app needs a readable token cookie", "Each exemption is one line, and easy to misuse", "GET is never checked", "SameSite is not set by default"]
narration = "Nothing is free. [[slnc 400]] Here is what the defence costs. [[slnc 500]] Every form, and every call from the page's own script, must send the token. [[slnc 500]] A single-page app needs the token in a cookie that its script can read, so cross-site scripting could read it too. [[slnc 500]] Each exemption is a single line, and a single line can undo the defence. [[slnc 500]] A request with get is never checked, so get must never change anything. [[slnc 500]] And the session cookie has no same site setting until you add one."

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["csrf().disable() copied from a tutorial", "ignoringRequestMatchers with a wide pattern", "An XSRF-TOKEN cookie in the browser", "403 Forbidden on a POST that worked in curl"]
narration = "You have probably met this already. [[slnc 400]] A line that disables C S R F, copied from a tutorial to make a post work, is the first demo. [[slnc 500]] An exemption with a wide pattern, like every path under slash A P I, is the fourth. [[slnc 500]] A cookie called X S R F token in your browser is the single-page cookie mode. [[slnc 500]] And a four oh three forbidden, on a post that worked fine from the command line, is the token check doing its job."

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Keep CSRF on for every session-cookie chain", "Single-page app: the cookie mode and a header", "Every exemption brings its own proof", "Never change anything on GET", "Add SameSite as a second layer", "Test every route without a token"]
narration = "So, how do you use it? [[slnc 400]] Keep the token check on, for every part of the application that uses a session cookie. [[slnc 500]] For a single-page app, use the cookie mode, and send the token back in a header. [[slnc 500]] Give every exempted route its own proof of where the request came from, like a webhook signature. [[slnc 500]] Never change anything on get. [[slnc 500]] Add same site to the session cookie as a second layer. [[slnc 300]] And write a test that posts to every route without a token, and expects four oh three."

[[scene]]
key = "07-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a Fetch Metadata filter", "and test it beside the token."]
narration = "That's C S R F with Spring Security. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Spring Security refuses a request that changes something unless it carries a token from the customer's own session, and the defence is only as strong as the switches, the exemptions, and the get routes left in the application. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a filter that reads the browser's fetch metadata and refuses a cross-site post, and test it beside the token. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] The demo starts the real Spring Boot bank on this machine, with different settings for each act. [[slnc 300]] Here are the lines that matter."""

[[class]]
name = "WebSecurity"
what = "the security settings: two filter chains, three web modes"
[[class.part]]
title = "the web chain: off, default, or cookie mode"
code = """
http.csrf(AbstractHttpConfigurer::disable);
...
http.csrf(csrf -> csrf.ignoringRequestMatchers(ignored));
...
.csrfTokenRepository(CookieCsrfTokenRepository.withHttpOnlyFalse())
.csrfTokenRequestHandler(new SpaCsrfTokenRequestHandler())
"""
speech = """The web chain uses a session cookie, so it needs the token. [[slnc 300]] The first line switches it off, as in demo one. [[slnc 300]] The second keeps the default, with one exempt path. [[slnc 300]] The last puts the token in a readable cookie, for a single-page app."""
[[class.part]]
title = "the API chain: no session, no cookie"
code = """
http.securityMatcher("/api/**")
        .csrf(AbstractHttpConfigurer::disable)
        .sessionManagement(s -> s.sessionCreationPolicy(SessionCreationPolicy.STATELESS))
        .httpBasic(Customizer.withDefaults())
"""
speech = """The A P I chain keeps no session, and takes the user name and password in a header on every call. [[slnc 300]] A browser never adds that header by itself, so this chain can leave C S R F off."""

[[class]]
name = "TokenMask"
what = "Spring's token masking, redone by hand"
[[class.part]]
title = "first half XOR second half"
code = """
byte[] all = Base64.getUrlDecoder().decode(masked);
int half = all.length / 2;
...
return new String(xor(xored, random), StandardCharsets.UTF_8);
"""
speech = """A teaching class, not part of Spring. [[slnc 300]] It decodes a page's token, splits it in half, and combines the halves with X O R. [[slnc 300]] The tests prove that its result is the session's token, and that Spring accepts a token it masks."""

[[class]]
name = "SpaCsrfTokenRequestHandler"
what = "cookie mode: a header carries the plain token"
[[class.part]]
title = "header or form field"
code = """
String header = request.getHeader(csrfToken.getHeaderName());
return (StringUtils.hasText(header) ? plain : masked).resolveCsrfTokenValue(request, csrfToken);
"""
speech = """The page's script copies the cookie's plain value into a header. [[slnc 300]] A server-rendered form still sends the masked value. [[slnc 300]] So the handler reads a header as plain, and a form field as masked."""

[[class]]
name = "BankController"
what = "the bank's routes, including two risky ones"
[[class.part]]
title = "an exempt webhook, and a GET that acts"
code = """
if (!WEBHOOK_SECRET.equals(signature)) {
    return ResponseEntity.status(HttpStatus.UNAUTHORIZED).body("bad signature");
...
@GetMapping("/legacy/move")
String legacyMove(Principal who, @RequestParam String to, @RequestParam long amount) {
"""
speech = """The webhook is exempt from tokens, so it checks a signature instead. [[slnc 300]] The legacy route moves money on GET, which Spring Security never checks. [[slnc 300]] That is the mistake demo four exploits."""

[[acronym]]
short = "CSRF"
long = "Cross-Site Request Forgery: another site sends your request"
say = "C S R F is cross site request forgery: a page on another site makes your logged in browser send a request you did not mean."
[[acronym]]
short = "XSRF"
long = "another short name for CSRF, used in cookie and header names"
say = "X S R F is just another short name for C S R F. Spring uses it in the cookie and header names."
[[acronym]]
short = "HTTP"
long = "HyperText Transfer Protocol: 200 done, 302 go on; 401, 403, 405 refused"
say = "H T T P is the hypertext transfer protocol. Two hundred means done, three oh two means go to another page. Four oh one means not signed in, four oh three forbidden, and four oh five the wrong method."
[[acronym]]
short = "GET / POST"
long = "HTTP methods: GET reads a page; POST sends a form"
say = "GET and POST are H T T P methods. A GET reads a page, like following a link. A POST sends a form that changes something."
[[acronym]]
short = "API"
long = "Application Programming Interface: an address a program calls"
say = "A P I is an application programming interface: an address that a program calls, rather than a page a person reads."
[[acronym]]
short = "UUID"
long = "Universally Unique Identifier: 36 characters, here the session's token"
say = "U U I D is a universally unique identifier, thirty six characters long. Spring uses one as the session's token."
[[acronym]]
short = "XOR"
long = "exclusive or: a bit is 1 when the two bits differ; twice gives it back"
say = "X O R is exclusive or. A bit of the result is one when the two bits differ. Doing it twice with the same byte gives the original back."
[[acronym]]
short = "URL"
long = "Uniform Resource Locator: a web address"
say = "U R L is a uniform resource locator, a web address. Base sixty four U R L text uses only characters that are safe in an address."
[[acronym]]
short = "ID"
long = "Identifier: JSESSIONID names Ana's session"
say = "I D is an identifier. The J SESSION I D cookie names Ana's session."
