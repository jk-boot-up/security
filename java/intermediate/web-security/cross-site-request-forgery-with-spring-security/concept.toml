[[act]]
title = "What the default does not cover"
summary = "The exempt webhook refuses a forged post without a signature (401); a GET route moves 100 from a link, because GET is never checked; the POST route refuses the link with 405; one extra exemption lets a forged post move 500."
detail = """
Ana is signed in, and no CSRF token is sent. evil.example posts to /webhooks/payments with no signature: 401 bad signature, because the route is exempt from tokens and checks a signature instead. The payment provider, with X-Signature: 200 payment noted.
A link on evil.example, GET /legacy/move?to=mallory&amount=100: 200 sent 100 to mallory, because Spring Security never checks GET for a token. The same link to GET /transfer: 405, because the route needs POST. The balances are 900 and 100.
After one change to make a test pass, csrf.ignore=/webhooks/**,/transfer, a post from evil.example with no token gets 200 sent 500 to mallory: one line undid the defence.
"""
figure = "default_gaps"
figure_title = "The gaps the default leaves"
figure_speech = """
Fourth demo: what the default does not cover. [[slnc 400]] Ana is signed in, and no request carries a token. [[slnc 600]]
First, the payment webhook. [[slnc 300]] It is exempt from tokens, because the payment provider has no session. [[slnc 300]] So it checks a signature instead, and the forged post is refused. [[slnc 300]] The provider, with the signature, is accepted. [[slnc 700]]
Third, a link to a route that moves money on GET. [[slnc 300]] Spring Security never checks GET, so a hundred is gone. [[slnc 300]] Fourth, the same link to the real transfer route, which needs a post: refused. [[slnc 700]]
At the bottom, one line of configuration, added to make a test pass. [[slnc 300]] The transfer route is now exempt, and the forged post moves five hundred.
"""
