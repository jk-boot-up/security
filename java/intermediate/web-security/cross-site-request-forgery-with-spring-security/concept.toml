[[act]]
title = "The bill"
summary = "The session cookie is HttpOnly but has no SameSite by default; the API chain ignores cookies and wants an Authorization header (401 from evil.example, 200 from the app); every web route refuses a token-less post; same-site=lax adds SameSite=Lax."
detail = """
The session cookie by default: Set-Cookie: JSESSIONID=<id>; Path=/; HttpOnly, so HttpOnly is true and no SameSite is set.
The API chain at POST /api/transfer keeps no session. evil.example with Ana's cookie and no Authorization header: 401 Unauthorized. Ana's app sends Authorization: Basic YW5hOmxhYi1wYXNzd29yZA==, which is Base64 of ana:lab-password: 200 sent 20 to mallory. A browser never adds a header it was not given.
Every state-changing web route, posted from evil.example with no token: /transfer 403, /logout 403, /login 403, so 3 of 3 refused.
With server.servlet.session.cookie.same-site=lax the cookie gains SameSite=Lax: one more layer, and the token is still needed.
"""
figure = "the_bill"
figure_title = "Cookies, headers, and every route"
figure_speech = """
Fifth demo: the bill. [[slnc 400]] At the top left, the session cookie by default. [[slnc 300]] It is HttpOnly, but it has no SameSite setting. [[slnc 300]] At the top right, one property adds SameSite Lax: a second layer. [[slnc 700]]
In the middle, the A P I chain. [[slnc 300]] It keeps no session, so a cookie means nothing to it. [[slnc 300]] The forged call from evil dot example has only the cookie, and gets four oh one. [[slnc 300]] Ana's app sends a basic authorization header. [[slnc 300]] Its value is simply the Base sixty four text of the user name, a colon, and the password. [[slnc 300]] Base sixty four hides nothing; it only makes the text safe in a header. [[slnc 700]]
At the bottom, every route that changes state, posted from evil dot example without a token. [[slnc 300]] All three are refused.
"""
speech = """
Here is the output. [[slnc 400]] The session cookie: HttpOnly, and no SameSite. [[slnc 400]] The A P I chain: the forged call with only a cookie gets four oh one. [[slnc 300]] The app with the header works. [[slnc 300]] A browser never adds a header it was not given.
[[page]]
Every state-changing route, without a token: three of three refused. [[slnc 400]] And with same site lax, the cookie gains SameSite Lax: one more layer, while the token is still needed.
"""
