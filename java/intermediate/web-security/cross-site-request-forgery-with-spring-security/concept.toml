    "Add the `__Host-` prefix to the session cookie and see what the server requires.",
    "Move the token from a header to a form field for a server-rendered page.",
]

[docs.explained]
sentence = """
Spring Security refuses a state-changing request without a token that belongs to the session, and the protection is only as strong as the switches, exemptions and GET routes left in the application.
"""
verdict = """
Leave CSRF on for every chain that uses a session cookie, use the cookie mode with the header for single-page apps, give every exemption its own proof of origin, never change state on GET, add SameSite as a second layer, and test every state-changing route without a token.
"""
recognise = [
    "`csrf.disable()` in a copied tutorial.",
    "`ignoringRequestMatchers` with a broad pattern.",
    "An `XSRF-TOKEN` cookie in the browser's storage.",
    "A 403 Forbidden after a POST that worked in curl.",
]

[spec]
purpose = """
Teach CSRF defences with Spring Security 7: the default token, the single-page cookie mode, and the ways the protection is lost.
"""
nongoals = [
    "A real browser or a front-end framework.",
    "OAuth and bearer-token flows, which have their own project.",
    "Cross-site scripting, which is a separate project.",
]
problem = """
Teams disable or exempt Spring Security's CSRF protection to fix a 403, and do not notice what they gave up.
"""
roles = [["The bank", "`Bank`, `BankController`"], ["Security configuration", "`WebSecurity`, `SpaCsrfTokenRequestHandler`"], ["The browser stand-in", "`Browser`"], ["Entry point", "`CsrfSpringDemo`"]]
requirements = [
    "With CSRF off, a forged post from another site moves money.",
    "With the default, a forged post and a post with another session's token are refused.",
    "The sign-in form, logout and every state-changing route need a token.",
    "Single-page mode accepts the cookie value in a header and refuses a post without it.",
    "An exempt route checks its own signature, and a GET is never checked for a token.",
    "The API chain ignores cookies and needs header credentials.",
    "The demo prints the same output on every run.",
]

