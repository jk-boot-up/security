[[act]]
title = "A single-page app"
summary = "CookieCsrfTokenRepository.withHttpOnlyFalse() puts the token in a readable XSRF-TOKEN cookie; the X-XSRF-TOKEN header must equal it: no header and Mallory's value get 403, the bank's own script's copy works."
detail = """
For a single-page app the web chain uses csrf.csrfTokenRepository(CookieCsrfTokenRepository.withHttpOnlyFalse()). The bank sets Set-Cookie: XSRF-TOKEN=<token>; Path=/ with HttpOnly false, so the page's script can read it, and so could a script injected by cross-site scripting.
Three requests to POST /transfer, where the browser adds both cookies: evil.example with no X-XSRF-TOKEN header (403), evil.example with the header set to Mallory's cookie value (403), and the bank's own script, which copies the cookie into the header (200 sent 20 to mallory). The balances are 980 and 20.
evil.example cannot copy the cookie, because a page reads only its own site's cookies.
"""
figure = "spa_cookie"
figure_title = "The script copies the cookie into a header"
figure_speech = """
Third demo: a single-page app. [[slnc 400]] Here the page's own script sends the requests, so the token travels in a cookie. [[slnc 600]]
At the top left, the cookie the bank sets: X S R F token. [[slnc 300]] HttpOnly is false, so the script can read it. [[slnc 300]] That also means a script injected by cross site scripting could read it. [[slnc 700]]
At the top right, the rule. [[slnc 300]] The header must equal the cookie. [[slnc 300]] The browser sends the cookie by itself, but only a page on the bank's own site can read it and copy it into the header. [[slnc 700]]
Below, three requests. [[slnc 300]] No header: refused. [[slnc 300]] Mallory's value: refused. [[slnc 300]] The bank's own script's copy: sent.
"""
