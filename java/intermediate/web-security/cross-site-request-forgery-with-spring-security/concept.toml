# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "cross-site-request-forgery-with-spring-security"
level = "intermediate"
module = "web-security"
title = "Cross-Site Request Forgery with Spring Security"
short_title = "CSRF with Spring Security"
package = "csrfspring"
main_class = "CsrfSpringDemo"
tagline = "Spring Security's token check is on by default, and the ways to lose it are a switch, an exemption and a GET"
bold = "Spring Security protects every state-changing request of a session-cookie application with a token, which is why a forged post from another site is refused; the protection is undone by switching it off, by exempting a route, or by moving money on GET, and a single-page app needs the cookie mode, where the token is readable by the page's own script."
domain = "an online bank"
domain_note = ""
youtube_description = "CSRF in Spring Security 7: the default token, the single-page cookie mode, exemptions, GET, SameSite and what disabling CSRF costs."
thumb_lines = ["CSRF WITH", "SPRING SECURITY"]
thumb_code = "csrf.ignoringRequestMatchers(...)"
youtube_title = "CSRF in Spring Security: Tokens, SPA Cookie Mode and What Disabling CSRF Costs"
youtube_tags = ["csrf", "spring security", "spring boot", "samesite", "java", "application security"]

[readme]
intro = """
The plain [cross-site-request-forgery](../cross-site-request-forgery) project builds the attack and the defences from scratch. This one uses what real Spring Boot banks use: **Spring Security 7** on **Spring Boot 4.1**, in real servers on the loopback address, with a browser stand-in that keeps cookies and attaches them to every request, which is the whole weakness.

What it shows:
- **Switching CSRF off** (a common tutorial step to make a `POST` work) lets a page on evil.example move Ana's money with her own cookie.
- **The default is a token tied to the session.** A forged post gets 403, so does one with a token from Mallory's session, the sign-in form and logout need tokens too, the token is renewed when Ana signs in, and it is masked with a new random value on each page.
- **A single-page app uses the cookie mode:** the token is in a cookie that the page's script reads and sends back in a header. It cannot be `HttpOnly`, so cross-site scripting would read it.
- **What the default does not cover:** a webhook exempted from tokens must check its own signature, `GET` is never checked, and one line that adds `/transfer` to the exemptions undoes the defence.
- **The bill:** the session cookie has no `SameSite` attribute by default, an API chain with credentials in a header can leave CSRF off, and a test should post to every route without a token.

**Maps to:** OWASP Top 10 (2025) A01 Broken Access Control · CWE-352 · OWASP ASVS 5.0 V3 (Web Frontend Security) · OWASP CSRF Prevention Cheat Sheet.
"""
analogy = """
A bank that accepts a signed cheque from anyone who walks in carrying your pen. The pen is your cookie, and the cheque is the forged request. A one-time number printed on the cheque book, which only your own cheque book shows, tells the bank the cheque came from the book on your desk.
"""
scenario = """
An online bank on Spring Boot with a session-cookie login. The demo starts the real application five times, in different configurations, and sends forged requests the way a browser would from another site.
"""
costs = [
    "**Every form and every script call needs the token,** or the bank refuses its own customers.",
    "**Single-page apps need a readable cookie,** so cross-site scripting becomes the next problem to solve.",
    "**Exemptions are one line each,** and each one needs its own proof of origin, such as a signature.",
    "**GET is never checked,** so a route that changes state on GET cannot be protected by the filter.",
    "**Stateless APIs need none of this,** but only if they really have no session and no cookie authentication.",
]
too_much = """
Do not turn the protection off to fix a 403. Find the form or script that lacks the token. For APIs with header credentials and no session, use a separate filter chain without CSRF instead of weakening the web chain.
"""
met_before = [
    "`http.csrf(csrf -> csrf.disable())` in a copied tutorial.",
    "`CookieCsrfTokenRepository.withHttpOnlyFalse()` in single-page app guides.",
    "`<input type=\"hidden\" name=\"_csrf\">` in Thymeleaf forms.",
    "A 403 Forbidden after a POST that worked in curl.",
]
where = """
This is the tools version of [cross-site-request-forgery](../cross-site-request-forgery), in the [web-security](..) module. It follows the same story with the same numbers, on Spring Security.
"""
twin = """
The servers are real Spring Boot applications on Tomcat and the filter chains are Spring Security 7. The browser stand-in is a few lines of Java that keep cookies and add an Origin header. Only statuses, booleans and balances are printed, never tokens, ports or time stamps, so the demo prints the same text on every run.
"""
test_note = "Each test starts a real server on a free loopback port and stops it. Nothing is printed that changes between runs."

[[act]]
title = "CSRF protection switched off"
summary = "With http.csrf disabled, a forged post with Ana's cookie moves 500 to Mallory."
detail = """
A tutorial's advice to make a POST work is to disable CSRF protection. With it off, Ana signs in and her browser keeps the session cookie. A page on evil.example posts a transfer to the bank, and the browser adds the cookie because the request goes to the bank. The bank answers 200 and sends 500 to Mallory.
"""
speech = """
First demo: C S R F protection switched off. [[slnc 400]] Many tutorials disable it to make a post work. [[slnc 600]] Ana signs in, and her browser keeps the cookie. [[slnc 300]] A page on another site posts a transfer, and the browser adds the cookie. [[slnc 600]] The bank sends five hundred to Mallory.
"""
rows = { off = "active wrong" }
console = [
    ["ana signs in: 302, 200 balance 1000", "ok"],
    ["forged post from evil.example with ana's cookie -> 200 sent 500 to mallory", "bad"],
    ["balances now: ana 500, mallory 500", "bad"],
]

[[act]]
title = "Spring Security's default token"
summary = "A forged post and a token from another session both get 403; the sign-in form, logout and every page need tokens, and the token is renewed and masked."
detail = """
By default every post needs a token tied to the session. Without one, even the sign-in form is refused with 403, and the token is renewed when Ana signs in, so one taken before that no longer works. A forged post without a token gets 403, and so does one with a token from Mallory's own
session. Ana's form with her own token works. Each page gets a different masked token, all accepted, which defends against BREACH. Logout is a state change, so it needs a token too.
"""
speech = """
Second demo: Spring Security's default token. [[slnc 400]] Every post needs a token tied to the session. [[slnc 600]] A forged post gets four oh three. [[slnc 300]] So does a post with Mallory's own token. [[slnc 600]] Ana's own form works. [[slnc 300]] The sign in form and logout need tokens too, and each page gets a freshly masked token.
"""
rows = { token = "active ok" }
console = [
    ["sign-in without a token -> 403, with one -> 302", "ok"],
    ["forged post without a token -> 403 Forbidden", "ok"],
    ["with a token from mallory's session -> 403 Forbidden", "ok"],
    ["ana's own form with her token -> 200 sent 20 to mallory", "ok"],
]

[[act]]
title = "A single-page app"
summary = "The token lives in a cookie the page's script reads and sends in a header; a forged post gets 403, and the price is that the cookie cannot be HttpOnly."
detail = """
A single-page app cannot render a hidden field, so the token is in an XSRF-TOKEN cookie that the page's script copies into an X-XSRF-TOKEN header. The forged post has no header and gets 403, and so does one with the value from Mallory's own cookie. The bank's own script works. The cookie cannot be
HttpOnly because the script must read it, so a script injected by cross-site scripting can read it as well.
"""
speech = """
Third demo: a single page app. [[slnc 400]] The token is in a cookie that the page's own script reads. [[slnc 300]] The script copies it into a header. [[slnc 600]] A forged post has no header, and gets four oh three. [[slnc 600]] The price is that the cookie cannot be http only, so cross site scripting could read it.
"""
rows = { spa = "active ok" }
console = [
    ["XSRF-TOKEN cookie set; HttpOnly is false", "amber"],
    ["forged post without the header -> 403 Forbidden", "ok"],
    ["the bank's own script copies the cookie into the header -> 200", "ok"],
]

[[act]]
title = "What the default does not cover"
summary = "An exempt webhook needs its own signature, GET is never checked, and one extra exemption lets a forged transfer through."
detail = """
The payment provider's webhook has no session, so it is exempt from tokens, and a forged post without its signature gets 401: the route checks its own proof. A route that moves money on GET is forged by a link on evil.example, because Spring never checks GET for a token; the same transfer
on a POST-only route gets 405. And a developer who adds /transfer to the exemptions to make a test pass lets a forged post through: one line of configuration undid the defence.
"""
speech = """
Fourth demo: what the default does not cover. [[slnc 400]] A webhook is exempt, so it must check its own signature. [[slnc 600]] A route that moves money on get is never checked, so a link can forge it. [[slnc 600]] And one line that exempts the transfer route undoes the whole defence.
"""
rows = { gaps = "active wrong" }
console = [
    ["forged webhook without the signature -> 401 bad signature", "ok"],
    ["GET /legacy/move from evil.example -> 200 sent 100 to mallory  <- SPRING DOES NOT CHECK GET", "bad"],
    ["a developer exempts /transfer; forged post -> 200 sent 500 to mallory", "bad"],
]

[[act]]
title = "The bill"
summary = "The session cookie has no SameSite attribute by default, an API chain with header credentials ignores cookies, and all 3 state-changing routes refuse a post with no token."
detail = """
The session cookie is HttpOnly by default but has no SameSite attribute; a property adds SameSite=Lax as one more layer. The API chain takes credentials in a header and keeps no session, so Ana's cookie from evil.example gets 401, and the app that holds the credentials gets 200: that chain can leave CSRF
off, because a browser never adds a header it was not given. A final check posts to every state-changing route of the web chain with no token, and all 3 refuse with 403.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] The session cookie has no same site attribute by default. [[slnc 600]] An A P I that takes credentials in a header, and keeps no session, can leave the check off. [[slnc 600]] And a test should post to every route with no token, and expect four oh three each time.
"""
rows = { bill = "active ok" }
console = [
    ["session cookie by default: HttpOnly true, SameSite false", "amber"],
    ["API chain, ana's cookie from evil.example -> 401", "ok"],
    ["3 of 3 state-changing routes refused with 403", "ok"],
]

