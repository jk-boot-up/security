]

[[act]]
title = "A token in every form"
summary = "The bank's form carries a token tied to the session; the forged form without it, or with Mallory's own token, is refused with 403."
detail = """
The bank's own transfer form carries a token tied to Ana's session, and Ana's transfer of 20 with that form works. The page on evil.example posts the
same form without a token and is refused: 403, no form token. With a real token from Mallory's own session it is refused too: the token does not
belong to this session. Another site cannot read Ana's token, because the form lives on the bank's pages and a browser does not let another site read them.
The token is compared in constant time, so the time an answer takes does not reveal how much of a guess was right.
"""
speech = """
Second demo: a token in every form. [[slnc 400]] The bank's own form carries a secret token, tied to Ana's session. [[slnc 300]] Her transfer with that form works. [[slnc 600]]
The forged form has no token, and is refused. [[slnc 300]] With a real token from Mallory's own session, it is refused too. [[slnc 600]]
The other site cannot read Ana's token, because a browser does not let one site read another site's pages. [[slnc 600]]
And the token is compared in constant time, so the time an answer takes gives nothing away.
"""
rows = { token = "active ok" }
console = [
    ["the bank's own transfer form carries a token tied to Ana's session: true", "muted"],
    ["Ana sends 20 with the bank's form: 200 sent 20 to mallory", "ok"],
    ["the page on evil.example posts the same form without a token: 403 no form token", "ok"],
    ["with a real token from Mallory's own session: 403 the form token does not belong to this session", "ok"],
    ["evil.example cannot read Ana's token: a browser does not let another site read the bank's pages", "muted"],
    ["the token is compared in constant time", "muted"],
]

[[act]]
title = "SameSite cookies"
summary = "With Lax the forged post arrives without the cookie (401) while links and the bank's own form still work; Strict also drops links from other sites; no attribute means Lax in a modern browser."
detail = """
With SameSite=Lax the forged post from evil.example arrives without the cookie and the bank answers 401. A link on evil.example to the bank still
opens Ana's account, because Lax allows cookies on top-level links, and the bank's own form still works. With SameSite=Strict even that link arrives without the
cookie, so Ana looks logged out, while typing the bank's address works. With no SameSite attribute at all, a modern browser treats the cookie as Lax.
"""
speech = """
Third demo: SameSite cookies. [[slnc 400]] With SameSite Lax, the forged post arrives without the cookie. [[slnc 300]] The bank sees no session. [[slnc 600]]
A link from the other site still opens Ana's account, because Lax allows cookies on links that open a page. [[slnc 300]] And the bank's own form still works. [[slnc 600]]
With SameSite Strict, even that link arrives without the cookie, so Ana looks logged out. [[slnc 600]]
And with no SameSite at all, a modern browser treats the cookie as Lax.
"""
rows = { samesite = "active ok" }
console = [
    ["SameSite=Lax: the forged post from evil.example arrives without the cookie: 401 not logged in", "ok"],
    ["SameSite=Lax: a link on evil.example to the bank still opens Ana's account: 200 balance 1000", "muted"],
    ["SameSite=Lax: the bank's own form still works: 200 sent 20 to mallory", "ok"],
    ["SameSite=Strict: the same link from evil.example arrives without the cookie: 401 not logged in, so Ana looks logged out", "amber"],
    ["SameSite=Strict: typing the bank's address works: 200 balance 1000", "muted"],
    ["no SameSite at all: a modern browser treats the cookie as Lax: 401 not logged in", "ok"],
]

[[act]]
title = "Where the request came from, and GET"
summary = "Sec-Fetch-Site: cross-site is refused, an older browser is checked by Origin, and a bank that moves money on GET loses 100 to a link even with a Lax cookie."
detail = """
A modern browser says Sec-Fetch-Site: cross-site for the forged post, and the bank refuses it; the bank's own form says same-origin and works. An older browser
sends no Sec-Fetch-Site, so the bank reads Origin, https://evil.example, and refuses. With neither header only the token is left, so these checks add depth and do not
replace it. A bank that moves money on GET loses 100 to a plain link on evil.example even with a Lax cookie, because Lax lets cookies ride on top-level links; the same link
to a bank that needs POST is refused with 405. GET must never change state.
"""
speech = """
Fourth demo: where the request came from. [[slnc 400]] A modern browser labels the forged post as cross site, and the bank refuses it. [[slnc 300]] The bank's own form is labelled same origin, and works. [[slnc 600]]
An older browser sends no label, so the bank reads the origin header instead, and refuses. [[slnc 300]] With neither, only the token is left. [[slnc 600]]
And one rule underneath all of it. [[slnc 300]] A bank that moves money on a plain link loses a hundred, even with a Lax cookie. [[slnc 300]] So a GET request must never change anything.
"""
rows = { origin = "active ok", get = "active wrong" }
console = [
    ["the browser says Sec-Fetch-Site: cross-site, and the bank refuses: 403", "ok"],
    ["the bank's own form says same-origin: 200 sent 20 to mallory", "ok"],
    ["an older browser sends no Sec-Fetch-Site, so the bank reads Origin: 403 Origin is https://evil.example, not the bank", "ok"],
    ["with neither header, only the token is left: these checks add depth, they do not replace it", "amber"],
    ["a bank that moves money on GET, with a Lax cookie: a link on evil.example: 200 sent 100 to mallory  <- GET MUST NEVER CHANGE STATE", "bad"],
    ["the same link to a bank that needs POST: 405 a transfer needs POST", "ok"],
]

[[act]]
title = "The bill"
summary = "SameSite alone fails in an older browser and from a same-site subdomain; tokens stop both but must reach every form; a bearer-token API refuses the forged call with 401."
detail = """
With SameSite as the only defence, an older browser that ignores it sends the forged transfer. With SameSite=Strict, a page on reviews.bank.example, where customers post
content, is the same site, so the cookie is sent and the transfer goes through. The same page with tokens switched on is refused. But a bank page that forgot to include
the token refuses Ana herself, so the token must reach every form and client. Finally, the bank's API takes a token in an Authorization header: a script on evil.example
cannot add a header it does not know, so it is refused with 401, while Ana's own app, which holds the token, works. APIs with bearer tokens are not exposed in the same way,
as long as the token is not kept in a cookie.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] SameSite on its own fails in an older browser, which ignores it. [[slnc 600]]
It also fails from a page on another part of the same site, such as a reviews page where customers post content. [[slnc 300]] That is the same site, so the cookie goes with it. [[slnc 600]]
Tokens stop both. [[slnc 300]] But a page that forgot the token refuses Ana herself, so the token must reach every form. [[slnc 600]]
And an A P I that takes a token in a header is different. [[slnc 300]] Another site's script cannot add a header it does not know, so the forged call is refused.
"""
rows = { samesite = "active amber", token = "active amber", api = "active ok" }
console = [
    ["SameSite as the only defence, in an older browser that ignores it: 200 sent 500 to mallory", "bad"],
    ["SameSite=Strict, and a page on reviews.bank.example: 200 sent 500 to mallory  <- SAME SITE, SO THE COOKIE IS SENT", "bad"],
    ["the same page, with tokens switched on: 403 no form token", "ok"],
    ["a bank page that forgot to include the token refuses Ana herself: 403 no form token", "amber"],
    ["the API with a bearer token, called from evil.example: 401 no API token", "ok"],
    ["Ana's own app, which holds the token: 200 sent 20 to mallory", "ok"],
]

