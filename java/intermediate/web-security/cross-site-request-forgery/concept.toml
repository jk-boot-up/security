The link. [[slnc 300]] A GET, with Ana's cookie, because Lax allows a link. [[slnc 400]] A bank that moves money on GET sends a hundred. [[slnc 300]] A bank that needs a post answers four oh five. [[slnc 300]] So a GET must never change anything.
"""
