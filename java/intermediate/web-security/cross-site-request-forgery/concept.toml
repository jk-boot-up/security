In another tab, she opens a page on another site. [[slnc 300]] Its hidden form posts to the bank: send five hundred to Mallory. [[slnc 600]]
The bank sends it. [[slnc 300]] A transfer Ana never asked for. [[slnc 600]]
The browser added her cookie because the request went to the bank. [[slnc 300]] The cookie proves who is asking, not what she meant.
"""
