say = "I D is an identifier. The session i d names Ana's session at the bank."
[[acronym]]
short = "CWE"
long = "Common Weakness Enumeration: CWE-352 is cross-site request forgery"
say = "C W E is the common weakness enumeration. Number three five two is cross site request forgery."

