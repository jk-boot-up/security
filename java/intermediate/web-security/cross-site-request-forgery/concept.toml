[[act]]
title = "The bill"
summary = "SameSite alone fails in an older browser and from a same-site subdomain; tokens stop both but a page that forgot the token refuses Ana; a bearer-token API refuses the forged call with 401."
detail = """
Four requests to POST /transfer. An older browser, with SameSite=Lax as the only defence, from evil.example: 200 sent 500 to mallory, because SameSite is ignored.
SameSite=Strict as the only defence, from reviews.bank.example, where customers post content: 200 sent 500 to mallory, because it is the same site and the cookie is sent.
The same request with tokens switched on: 403 no form token. And Ana herself, from a bank page that forgot the token: 403 no form token, so the token must reach every form and client.
The bank's API, POST /api/transfer, takes a token in an Authorization header. A script on evil.example has no such header and gets 401 no API token; Ana's own app sends Authorization: Bearer <Ana's API token> and gets 200 sent 20 to mallory.
A browser never adds that header by itself, so a bearer token is safe from CSRF as long as it is not kept in a cookie.
"""
figure = "the_bill"
figure_title = "What each defence still misses"
figure_speech = """
Fifth demo: the bill. [[slnc 400]] Each row is one request, and its response. [[slnc 600]]
First, an older browser, with SameSite as the only defence. [[slnc 300]] It ignores SameSite, so the money goes. [[slnc 600]]
Second, SameSite Strict as the only defence, but the page is on reviews dot bank dot example, where customers post content. [[slnc 300]] That is the same site, so the cookie goes, and so does the money. [[slnc 600]]
Third, the same page with tokens switched on: refused. [[slnc 300]] Fourth, a bank page that forgot to include the token refuses Ana herself. [[slnc 300]] So the token must reach every form. [[slnc 600]]
Last, the bank's A P I, with a token in a header. [[slnc 300]] A script on another site cannot add a header it does not know. [[slnc 300]] Ana's own app can.
"""
speech = """
Here is the output. [[slnc 400]] Four requests. [[slnc 300]] The older browser and the same site page both move five hundred. [[slnc 400]] With tokens, the same page is refused. [[slnc 300]] And a page that forgot the token refuses Ana herself.
