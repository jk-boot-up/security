    "Rotate the token after each transfer and see what happens with two tabs open.",
]

[docs.explained]
sentence = """
A browser attaches a site's cookie to every request sent to it, so any request that changes state must also prove it came from the site's own page, with a per-session token, backed by SameSite cookies and checks of Sec-Fetch-Site and Origin, and no state change on GET.
"""
verdict = """
Use the framework's CSRF protection and keep it on for every cookie-authenticated, state-changing request. Set session cookies to SameSite=Lax (or Strict where usability allows),
Secure and HttpOnly. Check Sec-Fetch-Site and Origin as a second layer. Never change state on GET. For APIs, prefer bearer tokens in headers, and never put them in cookies without CSRF protection.
"""
recognise = [
    "Hidden token fields named `_csrf`, `csrf_token` or `authenticity_token`.",
    "`SameSite=Lax` or `SameSite=Strict` in a `Set-Cookie` header.",
    "Servers that refuse requests with `Sec-Fetch-Site: cross-site`.",
    "A security finding titled \"Cross-Site Request Forgery\" with CWE-352.",
]

[spec]
purpose = """
Teach CSRF and its defences by forging a transfer at an online bank from another site's page, then stopping it with form tokens, SameSite cookies, Fetch Metadata and Origin checks, and a rule against state-changing GET.
"""
nongoals = [
    "Cross-site scripting, which defeats every CSRF defence because it runs on the bank's own page: the cross-site-scripting project.",
    "A real browser engine: the browser is a model of the rules that matter here.",
    "The Spring Security implementation: the tools version.",
]
problem = """
Developers trust a valid session cookie as proof of intent, and so a page on any other site can act as the logged-in customer.
"""
roles = [["Origins and sites", "`Site`"], ["The bank and its defences", "`Bank`, `Protection`"], ["The real local server", "`BankServer`"], ["The browser model", "`Browser`"], ["Entry point", "`CsrfDemo`"]]
requirements = [
    "Without defences, a cross-site form post moves money.",
    "Tokens are required, belong to one session, and are compared in constant time.",
    "The browser model follows SameSite rules (Lax by default, Strict, None only with Secure) and a legacy browser ignores them.",
    "Fetch Metadata and Origin checks refuse cross-site and same-site requests for state changes.",
    "GET never moves money unless the bank is deliberately misconfigured.",
