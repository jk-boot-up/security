tagline = "A cookie proves who is asking, not what they meant"
bold = "A browser attaches the bank's cookie to any request sent to the bank, even one started by another site, so a state-changing request needs proof that it came from the bank's own page: a per-session token, SameSite cookies, and a check of where the request came from."
domain = "an online bank"
domain_note = ""
