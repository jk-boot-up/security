[[act]]
title = "SameSite cookies"
summary = "evil.example and bank.example are different sites, so the request is cross-site; with Lax the forged post arrives without the cookie (401) while a link and the bank's own form still carry it; Strict also drops the link; no attribute means Lax."
detail = """
A browser finds a site from the last two labels of the host: https://evil.example is evil.example and https://bank.example is bank.example, so a request from one to the other is cross-site.
The rule for a cross-site request: None sends the cookie if it is Secure, Lax sends it only on a top-level GET link, and Strict never sends it.
With SameSite=Lax: the forged POST from evil.example goes without the cookie (401 not logged in); a link on evil.example carries it (200 balance 1000); the bank's own form carries it (200 sent 20 to mallory).
With SameSite=Strict: the link from evil.example goes without it (401, so Ana looks logged out); typing the bank's address carries it (200 balance 1000).
With no SameSite attribute, a modern browser reads it as Lax: the forged POST goes without the cookie (401).
"""
figure = "samesite_rules"
figure_title = "When the browser sends the cookie"
figure_speech = """
Third demo: SameSite cookies. [[slnc 400]] At the top left, how the browser finds a site. [[slnc 300]] It takes the last two labels of the host name. [[slnc 300]] Evil dot example and bank dot example differ, so the request is cross site. [[slnc 700]]
At the top right, the rule for a cross site request. [[slnc 300]] None sends the cookie. [[slnc 300]] Lax sends it only on a link that opens a page. [[slnc 300]] Strict never sends it. [[slnc 700]]
Below, six requests. [[slnc 300]] With Lax, the forged post goes without the cookie, and the bank sees nobody. [[slnc 300]] A link, and the bank's own form, still carry it. [[slnc 600]]
With Strict, even the link goes without it, so Ana looks logged out. [[slnc 300]] Typing the address still works. [[slnc 600]]
And with no SameSite at all, a modern browser treats the cookie as Lax.
"""
