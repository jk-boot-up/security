kind = "poster"
title = "Cross-Site Request Forgery and Its Defences"
narration = """Hello, and welcome. [[slnc 400]] This video explains cross site request forgery, and its defences, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A browser sends a site's cookie with every request to that site, whichever page started it. [[slnc 300]] So another site can make a logged in browser act, without the user meaning to. [[slnc 600]] Think of a bank that accepts any signed note brought to the counter. [[slnc 300]] A stranger cannot sign as Ana. [[slnc 300]] But a stranger can slip a note into a pile that Ana signs without reading. [[slnc 700]] In this video, the domain is an online bank, and its transfer form. [[slnc 500]] By the end, you will hear how a forged request works. [[slnc 300]] How tokens, SameSite cookies, and origin checks stop it. [[slnc 300]] And what each of them still misses."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online bank with a transfer form.", "", "Ana is logged in.", "In another tab, she opens", "a page on another site.", "", "Can that page move her money?"]
narration = """Here is the scenario. [[slnc 400]] An online bank has a transfer form. [[slnc 500]] Ana is logged in. [[slnc 300]] In another tab, she opens a page on another site. [[slnc 600]] Can that page move her money?"""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["Session cookie: proof of who is logged in", "CSRF token: a secret only the bank's pages carry", "SameSite: when a cookie may travel cross-site", "Sec-Fetch-Site: where a request came from", "Origin: the site that sent a POST"]
narration = """Before the demos, the words. [[slnc 500]] A session cookie proves who is logged in. [[slnc 500]] A C S R F token is a secret that only the bank's own pages carry. [[slnc 500]] SameSite says when a cookie may travel with a request from another site. [[slnc 500]] Sec Fetch Site is a header in which the browser says where a request came from. [[slnc 500]] And the origin header names the site that sent a post."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "09-ladder"
kind = "bullets"
title = "The Defences, Side by Side"
body = ["Token: works for every browser", "SameSite: free, but not everywhere", "Sec-Fetch-Site and Origin: a second layer", "POST only: links never act", "Together, not one at a time"]
narration = """Let's put the defences side by side. [[slnc 400]] The token works in every browser, as long as every form carries it. [[slnc 500]] SameSite costs nothing, but older browsers and same site pages get past it. [[slnc 500]] Sec Fetch Site and origin are a second layer. [[slnc 500]] And links must never change anything. [[slnc 600]] Used together, each covers what the others miss."""

[[scene]]
key = "10-roles"
kind = "bullets"
title = "Who Does What"
body = ["Bank: the rules and the defences", "BankServer: a real local server", "Browser: real browsers' cookie rules", "Site: origins and sites", "Protection: which defences are on"]
narration = """Here is who does what in the code. [[slnc 400]] The bank class holds the rules and the defences. [[slnc 500]] The bank server puts it on a real server on this machine. [[slnc 500]] The browser class follows real browsers' cookie and header rules. [[slnc 500]] The site class compares origins and sites. [[slnc 300]] And the protection record says which defences are switched on."""

[[scene]]
key = "11-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Hidden _csrf fields in forms", "SameSite=Lax on session cookies", "Sec-Fetch-Site in the network panel", "Findings labelled CWE-352"]
narration = """You have probably met this already. [[slnc 400]] Hidden fields called underscore C S R F appear in the forms of almost every web framework. [[slnc 500]] Session cookies say SameSite Lax. [[slnc 500]] A browser's network panel shows Sec Fetch Site on every request. [[slnc 500]] And security reports list this weakness as C W E three five two."""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Keep the framework's CSRF protection on", "Session cookies: Lax, Secure, HttpOnly", "Check Sec-Fetch-Site and Origin", "Never change state on GET", "APIs: bearer tokens in headers"]
narration = """So, how do you use it? [[slnc 400]] Keep the framework's C S R F protection switched on, for every form that changes something. [[slnc 500]] Set session cookies to SameSite Lax, Secure, and HttpOnly. [[slnc 500]] Check Sec Fetch Site and origin as a second layer. [[slnc 500]] Never change anything on a GET. [[slnc 500]] And for A P Is, send tokens in headers, not in cookies."""

[[scene]]
key = "13-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a second form", "and protect it without copying code."]
narration = """That's cross site request forgery, and its defences. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] A cookie proves who is asking, not what they meant, so every request that changes something needs proof it came from the site's own page. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine, with nothing installed except a Java development kit. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a second form, for changing the e mail address, and protect it without copying code. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
An online bank's cookie-authenticated transfer form and API, used from a browser that also visits other sites. It covers pages on other sites and on same-site subdomains that make the browser send requests.
It does not cover cross-site scripting on the bank's own pages, stolen sessions, or the bank's server being compromised.
"""
assets = [
    "Customers' balances and the transfer function.",
    "Session cookies, and the per-session form tokens.",
    "API tokens.",
]
actors = [
    "Ana, a logged-in customer.",
    "The owner of a page on another site that Ana visits.",
    "A customer who posts content on reviews.bank.example, a subdomain of the same site.",
]
boundaries = [
    "Other sites to Ana's browser: they can make it send requests, not read the answers.",
    "Ana's browser to the bank: the cookie is attached to every request that goes there.",
]
assumptions = [
    "The bank's pages have no cross-site scripting, which would let a script read the token.",
    "The browser enforces the same-origin policy and, when modern, SameSite and Fetch Metadata.",
    "In the demo, sites are logical names on one local server, and passwords are demo values.",
]
out_of_scope = [
    "Cross-site scripting: the cross-site-scripting project.",
    "Session theft and fixation: the session-management project.",
    "Login CSRF and clickjacking, which need their own controls.",
]
tests = [
    "`BankTest` checks tokens, Fetch Metadata and Origin decisions, GET refusals, transfer validation and the API, with hand-made requests.",
    "`BrowserTest` checks the browser model's SameSite rules, legacy behaviour, headers and tokens against the real local server.",
    "`SiteTest` checks origins, sites and Sec-Fetch-Site values.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next project, server-side-request-forgery, turns the direction around: instead of another site making the browser send requests, a customer makes the server send them.
"""

[[threat]]
id = "T1"
stride = "S"
threat = "A page on another site makes Ana's browser send a transfer with her cookie"
where = "`Bank.transfer`"
control = "A per-session form token, SameSite cookies, and Sec-Fetch-Site or Origin checks"
residual = "A bank page with cross-site scripting can read the token and defeat all of these"

[[threat]]
id = "T2"
stride = "T"
threat = "A token from another session, or a guessed token, is accepted"
where = "`Bank.transfer` token check"
control = "Tokens are random, tied to one session, and compared in constant time"
residual = "A token leaked in a URL or a log can be replayed until the session ends"

[[threat]]
id = "T3"
stride = "E"
threat = "An older browser ignores SameSite and sends the cookie on cross-site requests"
where = "`Browser` (legacy)"
control = "Tokens and Origin checks do not depend on the browser enforcing SameSite"
residual = "Without the token, an old browser with no Origin header is unprotected"

[[threat]]
id = "T4"
stride = "T"
threat = "A link moves money because the bank changes state on GET"
where = "`Bank.transfer` with GET"
control = "Transfers need POST; GET is refused with 405"
residual = "Any other endpoint that changes state on GET reopens the hole"

[[threat]]
id = "T5"
stride = "S"
threat = "A page on a same-site subdomain sends a request that SameSite allows"
where = "`Site.sameSite`, `Browser`"
control = "Tokens and a same-origin Sec-Fetch-Site rule refuse it"
residual = "User content on subdomains of the bank's site should be avoided or isolated on another site"
