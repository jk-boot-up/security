[[act]]
title = "Where the request came from, and GET"
summary = "The browser sets Sec-Fetch-Site by comparing the page with the bank: same-origin, same-site or cross-site; the bank refuses cross-site, and reads Origin from an older browser; a bank that moves money on GET loses 100 to a link even with a Lax cookie."
detail = """
The browser picks Sec-Fetch-Site by comparing the page that started the request with the bank: https://bank.example is the same origin (same-origin), https://reviews.bank.example is the same site (same-site), and https://evil.example is another site (cross-site).
Three checked requests: the forged POST from a modern browser says Sec-Fetch-Site: cross-site and is refused with 403; the bank's own form says same-origin and works; an older browser sends no Sec-Fetch-Site, so the bank reads Origin: https://evil.example and refuses with 403.
With neither header, only the token is left, so these checks add depth and do not replace it.
A link on evil.example, GET https://bank.example/transfer?to=mallory&amount=100, carries the Lax cookie because it is a top-level GET. A bank that moves money on GET answers 200 sent 100 to mallory; a bank that needs POST answers 405 a transfer needs POST. GET must never change state.
"""
figure = "where_from"
figure_title = "Headers that say where a request came from"
figure_speech = """
Fourth demo: where the request came from. [[slnc 400]] At the top left, how the browser fills in the Sec Fetch Site header. [[slnc 300]] It compares the page with the bank. [[slnc 300]] The bank's own page is the same origin. [[slnc 300]] The reviews page is a different origin, but the same site. [[slnc 300]] Evil dot example is cross site. [[slnc 700]]
At the top right, three requests the bank checks. [[slnc 300]] The forged post says cross site, and is refused. [[slnc 300]] The bank's own form says same origin, and works. [[slnc 300]] An older browser sends no such header, so the bank reads the origin header instead, and refuses. [[slnc 700]]
At the bottom, a plain link that moves money. [[slnc 300]] A Lax cookie rides along, because a link is a GET that opens a page. [[slnc 300]] If the bank moves money on GET, a hundred is gone. [[slnc 300]] If it needs a post, the link is refused.
"""
speech = """
Here is the output. [[slnc 400]] How the browser picks the header value, for three pages. [[slnc 400]] Then three requests, and their responses: four oh three, two hundred, and four oh three. [[slnc 300]] With neither header, only the token is left.
