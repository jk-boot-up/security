    { label = "The inside", nodes = ["server", "inside"], colour = "green" },
    { label = "Outside", nodes = ["customer", "attacker"], colour = "red" },
]
nodes = [
    { id = "customer", label = "Customer", sub = "gives an address", col = 0, row = 0, colour = "red", threats = ["T1"] },
