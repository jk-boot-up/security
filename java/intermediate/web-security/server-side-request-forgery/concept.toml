[[act]]
title = "A blocklist of names is easy to walk around"
summary = "A blocklist of host names stops the metadata address as written; 2852039166, 127.1, [::ffff:a9fe:a9fe], a name that points inside and a redirect all get through, because each is the same inside address written another way."
detail = """
The blocklist compares the host, as text, with localhost, 127.0.0.1, 169.254.169.254, 0.0.0.0, 10.* and 192.168.*. It refuses request a, the metadata address as written. The other five get through.
b, 2852039166, is the whole address as one number: dividing by 16777216, 65536 and 256 gives 169, 254, 169 and 254. c, 127.1, has two parts, so the last number fills the last three parts: 127.0.0.1.
d, ::ffff:a9fe:a9fe, is an IPv4 address inside IPv6: hex a9 is 169 and fe is 254. e is a name whose DNS answer is 10.0.0.5, and f is a public host that answers 302 and sends the server to 169.254.169.254 after the check.
Java reads each spelling exactly as the worked steps do. The blocklist read the text; the connection used the address.
"""
figure = "many_spellings"
figure_title = "One address, many spellings"
figure_speech = """
Third demo: a blocklist of names. [[slnc 400]] At the top, the list. [[slnc 300]] It compares the host in the address, as text. [[slnc 700]]
Each row is one request. [[slnc 300]] Only the first is blocked, because only the first is written exactly as on the list. [[slnc 600]]
The third column shows the real address behind each spelling. [[slnc 300]] A big number, a short form, an I P version six form: all the metadata service, or the server itself. [[slnc 300]] A name that points inside, and a redirect, end up inside too. [[slnc 700]]
At the bottom, how the big number becomes an address. [[slnc 300]] Divide by two five six, three times. [[slnc 300]] The quotients are one six nine, two five four, one six nine, and the last remainder is two five four. [[slnc 600]]
The list read the text. [[slnc 300]] The connection used the address.
"""
speech = """
Here is the output. [[slnc 400]] The blocklist, and six requests, a to f. [[slnc 300]] The same target, written in different ways.
[[page]]
The responses. [[slnc 300]] Only a is refused. [[slnc 300]] The other five import the key, the password, or the admin page.
[[page]]
How b becomes an address: divide by two five six three times, and the parts are one six nine, two five four, one six nine, two five four. [[slnc 400]] How c becomes an address: the last number fills the missing parts, so one twenty seven dot one is one twenty seven, zero, zero, one. [[slnc 300]] Java reads both the same way.
[[page]]
How d becomes an address: after colon colon f f f f, the hex pairs a nine and f e are one six nine and two five four. [[slnc 400]] Then e and f: a name that looks up to ten dot zero dot zero dot five, and a three oh two redirect to the metadata address.
"""
rows = { block = "active amber" }
console = [
    ["THE BLOCKLIST (compared with the host, as text):", "code"],
    ["  localhost, 127.0.0.1, 169.254.169.254, 0.0.0.0, 10.*, 192.168.*", "muted"],
    ["THE REQUESTS:", "code"],
    ["  a  http://169.254.169.254/latest/meta-data/iam/credentials", "muted"],
    ["  b  http://2852039166/latest/meta-data/iam/credentials", "muted"],
    ["  c  http://127.1/actuator/env", "muted"],
    ["  d  http://[::ffff:a9fe:a9fe]/latest/meta-data/iam/credentials", "muted"],
    ["  e  http://intranet.attacker.example/admin", "muted"],
    ["  f  http://attacker.example/go", "muted"],
    ["---", ""],
    ["THE RESPONSES:", "code"],
    ["  a  refused: blocked host name 169.254.169.254", "ok"],
    ["  b  imported: AccessKeyId=DEMO-NOT-A-REAL-KEY", "bad"],
    ["  c  imported: DB_PASSWORD=demo-not-real", "bad"],
    ["  d  imported: AccessKeyId=DEMO-NOT-A-REAL-KEY", "bad"],
    ["  e  imported: internal admin panel: 3 customers", "bad"],
    ["  f  imported: AccessKeyId=DEMO-NOT-A-REAL-KEY", "bad"],
    ["---", ""],
    ["HOW b, 2852039166, BECOMES AN ADDRESS:", "code"],
    ["  2852039166 / 16777216 = 169, remainder 16689662", "muted"],
    ["  16689662 / 65536 = 254, remainder 43518", "muted"],
    ["  43518 / 256 = 169, remainder 254", "muted"],
    ["  -> 169.254.169.254 (Java reads it the same)", "amber"],
    ["HOW c, 127.1, BECOMES AN ADDRESS:", "code"],
    ["  2 parts given, 2 missing", "muted"],
    ["  the last number, 1, fills the last 3 parts", "muted"],
    ["  -> 127.0.0.1 (Java reads it the same)", "amber"],
    ["---", ""],
    ["HOW d, ::ffff:a9fe:a9fe, BECOMES AN ADDRESS:", "code"],
    ["  ::ffff: means an IPv4 address follows", "muted"],
    ["  a9fe: hex a9 = 169, hex fe = 254", "muted"],
    ["  a9fe: hex a9 = 169, hex fe = 254", "muted"],
    ["  -> 169.254.169.254 (Java reads it the same)", "amber"],
    ["HOW e AND f GET INSIDE:", "code"],
    ["  look up intranet.attacker.example: 10.0.0.5", "muted"],
    ["  GET /go at attacker.example: 302, go to 169.254.169.254", "muted"],
]

[[act]]
title = "Check the address the connection really uses"
summary = "The safe importer checks scheme, port and user info, looks the name up once, refuses any answer that is not public, connects to the checked address and checks every redirect again: the honest image imports and all eight attacks are refused by their real address."
detail = """
The safe importer logs each decision. For request f it allows scheme http on port 80 with no user info, looks up attacker.example once (203.0.113.9), finds it public and connects to it. The 302 redirect to 169.254.169.254 goes through the same checks, and is refused: 169.254.169.254 is link-local.
Every other request is refused by its real address, however it is spelled: 2852039166 is 169.254.169.254, link-local; 127.1 is 127.0.0.1, loopback; intranet.attacker.example is 10.0.0.5, private. images.example@10.0.0.5 is refused for its user info.
dual.attacker.example answers two addresses, 93.184.216.34 and 10.0.0.5; one private answer is enough to refuse the name. The honest image still imports.
"""
