[[act]]
title = "A second lookup can give a different answer"
summary = "A check-then-connect importer looks rebind.attacker.example up twice: the check sees 203.0.113.9, the connection gets 10.0.0.5 and fetches the admin panel; the safe importer looks it up once and only reaches the attacker's own host."
detail = """
The attacker's DNS server answers rebind.attacker.example with 203.0.113.9 the first time and 10.0.0.5 after that (DNS rebinding).
An importer that checks the name and then lets its HTTP client look the name up again sees 203.0.113.9, public, and then connects to 10.0.0.5: it fetches internal admin panel: 3 customers. The check was right; the connection went elsewhere.
The safe importer looks the name up once, checks 203.0.113.9 and connects to 203.0.113.9. The attacker's own host has no admin page: the server answered 404, and nothing inside was reached.
"""
figure = "two_lookups"
figure_title = "Two lookups, two answers"
figure_speech = """
Fifth demo: why checking and then connecting is not enough. [[slnc 400]] The attacker controls the name server for this name. [[slnc 300]] The first answer is a public address. [[slnc 300]] Every answer after that is an inside address. [[slnc 300]] This trick is called D N S rebinding. [[slnc 700]]
On the left, an importer that checks, and then lets its client look the name up again. [[slnc 300]] The check sees the public address, and says yes. [[slnc 300]] The connection gets the inside address, and fetches the admin page. [[slnc 700]]
On the right, the safe importer. [[slnc 300]] It looks the name up once, checks that answer, and connects to that same address. [[slnc 300]] It only reaches the attacker's own host, which has no admin page. [[slnc 600]]
A check is only as good as the address it checked.
"""
speech = """
Here is the output. [[slnc 400]] The request, to the attacker's rebinding name. [[slnc 300]] Check, then connect: lookup one gives a public address, lookup two gives ten dot zero dot zero dot five. [[slnc 300]] The response: the admin page, which was never checked.
[[page]]
The safe importer. [[slnc 300]] One lookup, a public address, connect to it. [[slnc 300]] The attacker's own host answers four oh four. [[slnc 300]] Nothing inside was reached.
"""
rows = { rebind = "active ok" }
console = [
    ["THE REQUEST:", "code"],
    ["  http://rebind.attacker.example/admin", "muted"],
    ["CHECK, THEN CONNECT (the name is looked up twice):", "code"],
