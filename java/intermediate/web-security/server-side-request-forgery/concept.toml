    { id = "inside", label = "Metadata, admin pages", sub = "reachable from the server", col = 2, row = 0, colour = "green", shape = "store", threats = ["T3"] },
    { id = "attacker", label = "Attacker's host and DNS", sub = "redirects and rebinding", col = 1, row = 1, colour = "red", threats = ["T2", "T4"] },
]
edges = [
    { from = "customer", to = "server", label = "address", colour = "red", dashed = true, threats = ["T1"] },
