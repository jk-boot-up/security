    { from = "attacker", to = "server", label = "redirect, DNS answer", colour = "red", dashed = true, threats = ["T2", "T4"] },
]

[threatmodel]
scope = """
An online store's "import an image from an address" feature, and the network position of the server that runs it. It covers addresses, redirects and DNS answers.
It does not cover the content of the fetched file, or other ways a server can be made to send requests.
"""
assets = [
    "The server's cloud credentials from the metadata service.",
    "Internal admin pages and services on the server and the office network.",
    "The server's availability.",
]
actors = [
    "A seller importing an image.",
    "An attacker who controls an address, a web host and the DNS for a name.",
]
boundaries = [
    "Customer to server: the address is untrusted.",
    "Server to inside network: the server is trusted there, the customer is not.",
]
assumptions = [
    "The server can reach internal addresses (that is why they are worth reaching).",
    "The importer controls how it connects, so it can connect to a chosen address.",
]
out_of_scope = [
    "Malicious file contents: the path-traversal-and-file-upload project.",
    "Hardening the metadata service itself.",
]
tests = [
    "`SsrfTest` checks each importer against each spelling and route, the address policy, URL parsing, redirects and rebinding.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next project, xml-and-template-injection, moves to the files and templates the server processes.
"""

[[threat]]
id = "T1"
stride = "E"
threat = "A customer makes the server request an internal address"
where = "`NaiveImporter`, `BlocklistImporter`"
control = "Resolve, then require a public address (`AddressPolicy`)"
residual = "A bug in the policy's ranges; add network egress rules"

[[threat]]
id = "T2"
stride = "S"
threat = "A redirect from an outside host points inside"
where = "`SafeImporter` redirect loop"
control = "Every redirect goes through the same checks; few hops"
residual = "None known in the model"

[[threat]]
id = "T3"
stride = "I"
threat = "The server's credentials and settings are read through the import"
where = "metadata address, localhost"
control = "The import never connects there; the metadata service should also need a session token"
residual = "An application with other server-side fetches that skip the checks"

[[threat]]
id = "T4"
stride = "T"
threat = "DNS gives a public answer for the check and a private one for the connection"
where = "`Dns` (rebinding)"
control = "Resolve once and connect to the checked address"
residual = "A client library that resolves again by itself"
