# concept.toml: everything about this project that is not Java code.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "path-traversal-and-file-upload"
level = "intermediate"
module = "web-security"
title = "Path Traversal, File Upload and Open Redirects"
short_title = "Files and Redirects"
package = "files"
main_class = "FilesDemo"
tagline = "A file name from a customer is a path until proven otherwise"
bold = "A name or a link that a customer sends is not a file or a place you can trust: resolve and compare paths as paths, let the server name uploads and decide their type from the bytes, keep them outside the web root, and send customers only to paths on your own site."
domain = "an online store"
domain_note = ""
youtube_description = "Path traversal, unsafe file upload and open redirects, in Java."
thumb_lines = ["PATH TRAVERSAL AND", "FILE UPLOAD"]
thumb_code = "path.normalize().startsWith(base)"
youtube_title = "Path Traversal, File Upload and Open Redirects in Java"
youtube_tags = ["path traversal", "file upload", "open redirect", "owasp top 10", "java", "application security"]

[readme]
intro = """
Three features take a name or a link from a customer: **download invoice {name}**, **upload a product photo**, and **return to {address} after sign-in**. A file name can contain `..` and walk
out of its folder (**path traversal**). An uploaded file keeps whatever name and contents the customer chose, so it can replace a settings file or be served as a page with a script in it
(**unrestricted file upload**). A "return to" address can send a signed-in customer to another site that looks like yours (**open redirect**).

The defences, in the order this project shows them:
- **Check the name's shape,** then **resolve the path and compare it as a path** (element by element, not as text), and follow symbolic links before trusting the result.
- **Decode once,** at one place, and check after decoding.
- **Uploads:** a size limit, the type decided from the first bytes, a name the server makes, storage outside the web root, and downloads that say the type, force a download and forbid sniffing.
- **Redirects:** only a path on your own site; `//host`, `/\\host` and a scheme are other sites; an exact host match if an absolute address must be allowed.

**Maps to:** OWASP Top 10 (2025) A01 Broken Access Control · CWE-22 · CWE-434 · CWE-601 · OWASP ASVS 5.0, the file handling and validation chapters.
"""
analogy = """
Think of a clerk who fetches a file from the "invoices" drawer when a customer reads out a name. If the customer may say "go up one drawer, and open the one marked secrets", the clerk walks out of the
drawer. And a clerk who files whatever the customer hands over, under any name, will one day file a forged form over the real one.
"""
scenario = """
An online store lets customers download their invoices, upload product photos and return to the page they came from. The demo builds a small server file tree in a temporary folder, with
invoices, a sibling folder with a similar name, secrets, settings and a web root, and runs every attack against it.
"""
costs = [
    "**Strict names are less flexible.** `invoice-NNNN.txt` is easy to check, and a system that must accept arbitrary file names needs ids that the server maps to files.",
    "**Content checks are a floor, not a ceiling.** The first bytes show a PNG, but an image can still hold exploits for its viewer; process images with a hardened library, and re-encode if you can.",
    "**Storage outside the web root needs a download handler,** which has to set the type and the headers itself.",
    "**Links and case-insensitive file systems** add cases; test on the platform you deploy to.",
    "**Allow-listing redirect hosts needs upkeep,** and any redirect that is only for convenience is better replaced by a fixed page.",
]
too_much = """
If the invoice can be fetched by an id from a database, there is no path to check. If the uploaded photo is re-encoded and stored under a generated name, there is no customer name or content to trust.
Do not try to strip `..` from names: `....//` becomes `../` after one pass. Reject, don't repair.
"""
met_before = [
    "`../../etc/passwd` in every list of attack strings.",
    "`new File(base, userInput)` and `Paths.get(base, name)` in older code.",
    "A `next` or `returnUrl` parameter on every login page.",
    "Findings titled \"Path Traversal\" (CWE-22), \"Unrestricted Upload\" (CWE-434) and \"Open Redirect\" (CWE-601).",
]
where = """
This project is in [web-security](..) and follows [insecure-deserialization](../insecure-deserialization): another thing a customer carries to the server.
Its upload checks build on [input-validation](../../secure-coding/input-validation).
"""
twin = """
The file system is real: the demo makes a temporary folder with the layout above, including a symbolic link, and deletes it afterwards. The folder's name is never printed.
The web server is a small class that serves files as they are, which is what a naive static server does.
"""
test_note = "The temporary folder's name is random and never printed, so the demo prints the same text on every run."

[[act]]
title = "Downloading an invoice"
summary = "An honest name reads invoice 1001."
detail = """
The download takes a name and reads that file from the invoices folder. invoice-1001.txt returns "Invoice 1001: Ana, 42.50".
"""
speech = """
First demo: downloading an invoice. [[slnc 400]] The server reads the file with the name the customer gave, from the invoices folder. [[slnc 300]] It works.
"""
rows = { download = "active ok" }
console = [
    ["invoice-1001.txt -> read: Invoice 1001: Ana, 42.50", "ok"],
]

[[act]]
title = "A name with .. leaves the folder"
summary = "../secrets/db.txt returns the database settings and ../config/app.properties returns the application settings."
detail = """
The name is joined to the folder's path and nothing else is checked, so `..` climbs out: `../secrets/db.txt` returns DB_PASSWORD=demo-not-real and `../config/app.properties` returns the settings.
The customer never needed a vulnerability in the database, only a longer name.
"""
speech = """
Second demo: a name with two dots leaves the folder. [[slnc 400]] The name is joined to the folder and nothing else is checked. [[slnc 300]] So dot dot climbs out. [[slnc 600]]
The customer reads the database settings, with nothing more than a longer name.
"""
rows = { naive = "active wrong" }
console = [
    ["../secrets/db.txt -> read: DB_PASSWORD=demo-not-real  <- OUTSIDE THE FOLDER", "bad"],
    ["../config/app.properties -> read: admin=ana", "bad"],
]

[[act]]
title = "A text check on the path is not a path check"
summary = "Comparing the resolved path as text refuses ../secrets but accepts ../invoices-private, whose name starts the same way."
detail = """
The second version resolves the path, normalizes it and checks that the text starts with the invoices folder. `../secrets/db.txt` is refused. But `/…/invoices-private/payroll.txt`
also starts with `/…/invoices`, so the payroll file is read. Comparing paths as text treats a folder's name as a prefix; `Path.startsWith` compares whole elements.
"""
speech = """
Third demo: a text check on the path is not a path check. [[slnc 400]] The second version checks that the text starts with the invoices folder. [[slnc 300]] Secrets are refused. [[slnc 600]]
But a folder called invoices dash private also starts with invoices, and the payroll file is read. [[slnc 300]] Compare paths as paths.
"""
rows = { prefix = "active amber" }
console = [
    ["../secrets/db.txt -> refused: outside the invoice folder", "ok"],
    ["../invoices-private/payroll.txt -> read: payroll: demo salaries  <- SAME PREFIX", "bad"],
]

[[act]]
title = "Names, paths and links, all checked"
summary = "The name must look like an invoice name, the path is compared element by element, and links are followed before being trusted; encoded dots are decoded once and then refused."
detail = """
The fixed version first decodes the name exactly once, then requires `invoice-NNNN.txt`. Then it resolves against the real invoices folder, normalizes and compares as a path. Finally it follows symbolic links
and checks the real file: a link named invoice-5555.txt that points at the secrets file passes the first checks and is refused with "link leads outside the invoice folder", while both older versions read it.
The encoded `%2e%2e%2f` is decoded and refused as not an invoice name.
"""
speech = """
Fourth demo: names, paths and links, all checked. [[slnc 400]] The name must look like an invoice name. [[slnc 300]] The path is compared element by element. [[slnc 300]] And links are followed before they are trusted. [[slnc 600]]
An encoded dot dot is decoded once, and refused. [[slnc 300]] A link that points at the secrets file passes the first checks, and fails the last.
"""
rows = { safe = "active ok" }
console = [
    ["invoice-1001.txt -> read: Invoice 1001: Ana, 42.50", "ok"],
    ["../secrets/db.txt, %2e%2e%2f..., ../invoices-private/... -> refused: not an invoice name", "ok"],
    ["invoice-5555.txt, a link to the secrets file: naive read, prefix read -> read: DB_PASSWORD=demo-not-real", "bad"],
    ["invoice-5555.txt with the safe version -> refused: link leads outside the invoice folder", "ok"],
]

[[act]]
title = "Uploads"
summary = "The naive upload overwrites the settings and serves a script as a page; the fixed one decides from the bytes, names the file itself, stores it outside the web root and serves it as a download."
detail = """
The naive upload saves under the name the customer gave, in the web root. A file named `page.html` with a script in it is served as text/html, inline: a page on the store's own site with the customer's script.
A name of `../../config/app.properties` replaces the settings, which now read admin=mallory. The fixed version limits the size, decides the type from the first bytes (PNG or JPEG only), makes the name itself
(photo-0001.png), ignores the customer's name entirely, stores the file outside the web root, and serves it as image/png with a download header and nosniff. The script renamed cat.png is refused for what it contains,
and a `../..` name is just ignored: the settings still read admin=ana.
"""
speech = """
Fifth demo: uploads. [[slnc 400]] The first version saves the file under the name the customer chose, in the web root. [[slnc 300]] A script is served as a page on the store's own site. [[slnc 300]] A name with dots replaces the settings. [[slnc 600]]
The fixed version looks at the first bytes of the file, makes the name itself, and keeps the file outside the web root. [[slnc 300]] It serves it as a download, with the type it decided.
"""
rows = { upload = "active wrong", safeup = "active ok" }
console = [
    ["a script called page.html -> served as text/html, inline  <- A PAGE ON OUR OWN SITE", "bad"],
    ["a name with .. -> config now reads: admin=mallory", "bad"],
    ["fixed: a photo called cat.png -> /photos/photo-0001.png (image/png, download=true, nosniff=true)", "ok"],
    ["fixed: a script called page.html, or renamed cat.png -> refused: not a PNG or JPEG image", "ok"],
    ["fixed: a name with .. -> ignored; config still reads: admin=ana", "ok"],
    ["fixed: an oversized photo -> refused: size not allowed", "ok"],
]

[[act]]
title = "Where to send the customer next"
summary = "The naive link goes anywhere, including //evil.example and javascript:; the fixed one sends only paths on this site and everything else to /account; absolute hosts are matched exactly."
detail = """
After sign-in or upload, the store sends the customer to the `return to` address. The naive version sends them wherever it says: a look-alike site at https://evil.example/login, `//evil.example` (a browser reads it
as another site), `/\\evil.example` (browsers treat the backslash as a slash) or `javascript:`. The fixed version allows only a path that starts with a single slash, has no backslash or control characters, and has no scheme
or authority; everything else becomes /account. If an absolute address must be allowed, its host is compared exactly: shop.example.evil.example and shop.example@evil.example are refused.
"""
speech = """
Sixth demo: where to send the customer next. [[slnc 400]] The first version sends them wherever the link says. [[slnc 300]] Another site that looks like ours. [[slnc 600]]
Slash slash, and slash backslash, are read by browsers as other sites. [[slnc 300]] The fixed version allows only a path on this site, and everything else goes to the account page. [[slnc 600]]
And a host is matched exactly, never by its beginning or its end.
"""
rows = { redirect = "active ok" }
console = [
    ["/orders?page=2 -> safe: /orders?page=2", "ok"],
    ["https://evil.example/login, //evil.example, /\\evil.example, javascript:steal() -> safe: /account", "ok"],
    ["own host, exact match -> true; shop.example.evil.example -> false; shop.example@evil.example -> false", "ok"],
]

