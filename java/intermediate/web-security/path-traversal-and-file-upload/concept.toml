kind = "poster"
title = "Path Traversal, File Upload and Open Redirects"
narration = "Hello, and welcome. [[slnc 400]] This video explains files and Redirects, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A name or a link that a customer sends is not a file or a place you can trust: resolve and compare paths as paths, let the server name uploads and decide their type from the bytes, keep them outside the web root, and send customers only to paths on your own site. [[slnc 600]] Think of it this way. [[slnc 300]] Think of a clerk who fetches a file from the \"invoices\" drawer when a customer reads out a name. If the customer may say \"go up one drawer, and open the one marked secrets\", the clerk walks out of the drawer. And a clerk who files whatever the customer hands over, under any name, will one day file a forged form over the real one. [[slnc 700]] In this video, the domain is an online store. [[slnc 500]] By the end, you will be able to: [[slnc 300]] Explain how .., encoded dots and symbolic links lead out of a folder. [[slnc 300]] Say why comparing paths as text fails and what Path.startsWith does differently. [[slnc 300]] List what an upload handler should decide for itself and what it must never take from the customer."

