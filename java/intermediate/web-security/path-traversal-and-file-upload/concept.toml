[[scene]]
key = "01-poster"
kind = "poster"
title = "Path Traversal, File Upload and Open Redirects"
narration = "Hello, and welcome. [[slnc 400]] This video explains path traversal, unsafe file uploads and open redirects, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] All three begin when a server takes a name or a link from a customer, and uses it as it is. [[slnc 300]] A file name can climb out of its folder. [[slnc 300]] An uploaded file can pretend to be something else. [[slnc 300]] And a return address can send the customer to another site. [[slnc 600]] Think of a cloakroom ticket. [[slnc 300]] If the attendant fetches whatever room the ticket names, a rewritten ticket opens the manager's office. [[slnc 600]] Our example is an online store."

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online store lets customers:", "  download their invoices", "  upload product photos", "  return to a page after signing in", "", "The demo builds a small server file tree", "in a temporary folder."]
narration = "Here is the scenario. [[slnc 400]] An online store lets customers download their invoices, upload product photos, and return to the page they came from after signing in. [[slnc 600]] The demo builds a small server file tree in a temporary folder: the invoices, a second folder with a similar name, a file of secrets, the settings, and the web root that the store serves pages from."

[[scene]]
key = "02-words"
kind = "bullets"
title = "The Words"
body = ["Path: folder names joined by /", "..: the folder above", "Web root: files the web server hands out", "Magic bytes: the first bytes of a file", "Symbolic link: a file that points elsewhere", "Redirect: \"go to this address next\""]
narration = """Before the demos, the words. [[slnc 500]] A path is a list of folder names, joined by slashes, that ends at a file. [[slnc 500]] Two dots, in a path, mean the folder above. [[slnc 500]] The web root is the folder whose files the web server hands out, as they are. [[slnc 500]] Magic bytes are the first bytes of a file, which tell what kind of file it really is, whatever its name says. [[slnc 500]] A symbolic link is a small file that points at another file, somewhere else. [[slnc 500]] And a redirect is the server telling the browser: go to this address next."""

[[scene]]
key = "02-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "02-climb-out"
kind = "figure"
title = "A name that walks out of its folder"
body = "climb_out"
narration = """Let's see the whole idea on one picture. [[slnc 400]] On the left, the folders on the store's server. [[slnc 300]] The customer may read files from invoices, and nothing else. [[slnc 700]] The customer sends a name: dot dot, slash, secrets, slash, d b dot t x t. [[slnc 300]] The server joins it to the invoices folder. [[slnc 600]] To the disk, dot dot means one folder up. [[slnc 300]] So the path climbs out of invoices, as the amber arrow shows, and goes down into secrets. [[slnc 600]] The two dots cancel the folder before them. [[slnc 300]] What is left is the secrets file, and the customer reads the database password. [[slnc 700]] That is path traversal. [[slnc 300]] The same mistake, trusting what the customer sends, is behind unsafe uploads and open redirects."""

[[scene]]
key = "03-acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "04-costs"
kind = "bullets"
title = "What It Costs"
body = ["Strict file names are less flexible", "A content check is a floor, not a ceiling", "Files outside the web root need a download handler", "Links and case-insensitive disks need extra care", "A list of allowed redirect hosts needs upkeep"]
narration = "Nothing is free. [[slnc 400]] Here is what the defences cost. [[slnc 500]] Strict rules for file names are less flexible for customers. [[slnc 500]] Checking a file's first bytes is a floor, not a ceiling: a real image can still carry other content. [[slnc 500]] Files kept outside the web root need code that serves them as downloads. [[slnc 500]] Symbolic links, and disks that ignore upper and lower case, need extra care. [[slnc 300]] And if a redirect may go to other hosts, the list of those hosts needs upkeep."

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["getOriginalFilename() used to build a path", "A redirect from a parameter named", "  next, url, redirect or returnTo", "Scanner findings CWE-22, CWE-434, CWE-601"]
narration = "You have probably met this already. [[slnc 400]] A call to get original filename, used to build a path on the server, is the upload mistake. [[slnc 500]] A redirect taken from a parameter called next, url, redirect, or return to, is the open redirect. [[slnc 500]] And scanner findings numbered twenty-two, four thirty-four, and six oh one in the common weakness list are these three, in that order."

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Prefer ids to file names", "Names: check the shape, decode once,", "  compare paths as paths, follow links first", "Uploads: size limit, type from the bytes,", "  a server-made name, outside the web root", "Redirects: only a path on your own site"]
narration = "So, how do you use it? [[slnc 400]] Where you can, take an id from the customer and look up the file, instead of taking a name. [[slnc 500]] If you must take a name, check its shape, decode it once, compare paths as paths, and follow links before you trust the result. [[slnc 500]] For uploads, limit the size, decide the type from the first bytes, make the name yourself, and keep the file outside the web root. [[slnc 500]] And after signing in, send the customer only to a path on your own site."

[[scene]]
key = "12-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Make uploads re-encode the image", "and compare the bytes."]
narration = "That's path traversal, file uploads and open redirects. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] A file name or a link from a customer is untrusted, so check its shape, compare paths as paths, let the server name and classify uploads and keep them out of the web root, and redirect only to paths on your own site. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Make the upload re-encode each image, and compare the bytes before and after. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] The demo works on a real temporary folder, so every path, link and upload is real. [[slnc 300]] Here are the classes that matter."""

[[class]]
name = "NaiveDownloads"
what = "the first download: the folder plus the customer's name"
[[class.part]]
title = "resolve, and read"
code = """
return Files.readString(layout.invoices().resolve(name));
"""
speech = """The first version joins the name to the invoices folder, and reads the file. [[slnc 300]] Nothing looks at the name, so dot dot climbs out."""

[[class]]
name = "PrefixDownloads"
what = "the second download: it compares text"
[[class.part]]
title = "a text prefix"
code = """
var file = layout.invoices().resolve(name).normalize();
if (!file.toString().startsWith(layout.invoices().toString())) {
    throw new Refused("outside the invoice folder");
"""
speech = """The second version removes the dots with normalize. [[slnc 300]] Then it compares strings. [[slnc 300]] A folder whose name starts with the same letters passes."""

[[class]]
name = "SafeDownloads"
what = "the fixed download, in four layers"
[[class.part]]
title = "decode, shape, path, real path"
code = """
String name = decodeOnce(rawName);
if (!NAME.matcher(name).matches()) {
...
Path base = layout.invoices().toRealPath();
Path file = base.resolve(name).normalize();
if (!file.startsWith(base)) {
...
Path real = file.toRealPath(); // follows links
if (!real.startsWith(base)) {
"""
speech = """The fixed version decodes the name once, and checks its shape with a pattern. [[slnc 300]] Then it compares paths with path dot starts with, which compares whole folder names. [[slnc 300]] Last, to real path follows links, and the real file is compared again."""

[[class]]
name = "NaiveUploads"
what = "the first upload: the customer's name, in the web root"
[[class.part]]
title = "the customer's name"
code = """
Files.write(layout.webroot().resolve("uploads").resolve(fileName), bytes);
return "/uploads/" + fileName;
"""
speech = """The first upload writes the bytes under the name the customer sent, inside the web root. [[slnc 300]] The name decides the folder, and the web server decides the type from the name."""

[[class]]
name = "Sniffer"
what = "decides what a file is from its first bytes"
[[class.part]]
title = "magic bytes"
code = """
if (b.length >= 8 && (b[0] & 0xff) == 0x89
        && b[1] == 'P' && b[2] == 'N' && b[3] == 'G') {
    return new Kind("png", "image/png");
...
if (b.length >= 4 && (b[0] & 0xff) == 0xff
        && (b[1] & 0xff) == 0xd8 && (b[2] & 0xff) == 0xff) {
    return new Kind("jpg", "image/jpeg");
"""
speech = """The sniffer looks only at the first bytes, which the customer cannot rename. [[slnc 300]] Eighty nine, then P N G, is a P N G image. [[slnc 300]] eff eff, dee eight, eff eff is a jay peg. [[slnc 300]] Anything else is refused."""

[[class]]
name = "SafeUploads"
what = "the fixed upload: the server decides"
[[class.part]]
title = "the server's own name"
code = """
if (bytes.length == 0 || bytes.length > MAX_BYTES) {
...
Sniffer.Kind kind = Sniffer.of(bytes);
...
String id = String.format("photo-%04d.%s", ++counter, kind.extension());
Path target = layout.uploadsPrivate().resolve(id);
"""
speech = """The fixed upload checks the size, and asks the sniffer for the type. [[slnc 300]] It counts its own name, photo and four digits, and writes the file outside the web root. [[slnc 300]] The customer's file name is never used."""

[[class]]
name = "ReturnLink"
what = "where the customer goes after signing in"
[[class.part]]
title = "only a path on our site"
code = """
if (!returnTo.startsWith("/")) {
    return "does not start with /";
...
if (returnTo.startsWith("//")) {
    return "starts with //: another host";
...
return "https".equals(uri.getScheme())
        && uri.getUserInfo() == null
        && OWN_HOSTS.contains(uri.getHost());
"""
speech = """A return link must start with one slash, and not two. [[slnc 300]] Anything else gets the account page, and the reason. [[slnc 300]] When a full address is needed, the host must be exactly one of our own, with no user name in front."""

[[acronym]]
short = "PNG"
long = "Portable Network Graphics: an image format; its files start 89 50 4e 47"
say = "P N G is portable network graphics, an image format. Every P N G file starts with the same eight bytes."
[[acronym]]
short = "JPEG"
long = "Joint Photographic Experts Group: a photo format; files start ff d8 ff"
say = "jay peg is named after the joint photographic experts group. It is the usual format for photos."
[[acronym]]
short = "HTML"
long = "HyperText Markup Language: the text of a web page"
say = "H T M L is hypertext markup language: the text a browser shows as a page, scripts included."
[[acronym]]
short = "hex"
long = "hexadecimal: a byte as two digits from 0-9 and A-F"
say = "Hex is hexadecimal: each byte written as two digits, from zero to nine and A to F."
[[acronym]]
short = "%2e, %2f"
long = "percent-encoding: %2e is a dot, %2f is a slash"
say = "Percent encoding writes a character as a percent sign and its hex value. Percent two e is a dot, percent two f is a slash."
[[acronym]]
short = "URL, URI"
long = "Uniform Resource Locator / Identifier: a web address"
say = "U R L is uniform resource locator, and U R I is uniform resource identifier. Both mean a web address."
[[acronym]]
short = "HTTPS"
long = "HyperText Transfer Protocol Secure: how browsers and servers talk, encrypted"
say = "H T T P S is hypertext transfer protocol secure: how a browser and a server talk, encrypted."
[[acronym]]
short = "CWE"
long = "Common Weakness Enumeration: CWE-22, -434, -601"
say = "C W E is the common weakness enumeration. Twenty two is path traversal, four thirty four unrestricted upload, and six oh one open redirect."
