[docs.session]
objectives = [
    "explain how `..`, encoded dots and symbolic links lead out of a folder",
    "say why comparing paths as text fails and what `Path.startsWith` does differently",
    "list what an upload handler should decide for itself and what it must never take from the customer",
    "explain why `//host` and `/\\host` are other sites, and why the fixed redirect accepts only simple paths",
]
walkthrough = """
Run act three and ask what "starts with" compared. In act four, ask which of the layers stopped each attempt. In act five, ask which part of the customer's upload the fixed version actually used.
"""
exercises = [
    "Add a case-insensitive file system rule to the check and test it with `INVOICE-1001.TXT`.",
    "Make uploads re-encode the image and compare the bytes.",
    "Store the type next to the upload on disk instead of in memory.",
    "Add an allow-list of two partner hosts to the redirect and test look-alike names.",
]

[docs.explained]
sentence = """
A file name or link from a customer is untrusted: check its shape, resolve it and compare paths as paths, let the server name and classify uploads and keep them out of the web root, and redirect only to paths on your own site.
"""
verdict = """
Prefer ids to names, and mapping tables to paths. If you must use names: allow-list the shape, decode once, resolve against the real base folder, compare with `Path.startsWith`, and check the real path after links.
For uploads: size limit, magic-byte type, server-made name, storage outside the web root, `Content-Disposition: attachment` and `X-Content-Type-Options: nosniff`. For redirects: relative paths only, or an exact allow-list.
"""
recognise = [
    "`new File(base, name)`, `Paths.get(base, name)` or `base.resolve(name)` with request data.",
    "`getOriginalFilename()` used to build a path.",
    "A parameter named `next`, `url`, `redirect` or `returnTo` passed to a redirect.",
    "Findings with CWE-22, CWE-434 or CWE-601.",
]

[spec]
purpose = """
Teach path traversal, unrestricted upload and open redirects by attacking a store's invoice download, photo upload and return link in a real temporary folder, then fixing each in layers.
"""
nongoals = [
    "Malware scanning and image processing libraries.",
    "Cloud object storage.",
    "The Spring multipart version: the path-traversal-and-file-upload-with-spring-boot project.",
]
problem = """
Developers join customer text to paths and addresses, and save what customers send, so the customer decides where files go and where people are sent.
"""
roles = [["The file tree", "`Layout`"], ["Downloads", "`Downloads`, `NaiveDownloads`, `PrefixDownloads`, `SafeDownloads`"], ["Uploads and serving", "`Uploads`, `NaiveUploads`, `SafeUploads`, `Sniffer`, `WebRoot`, `Served`"], ["Redirects", "`ReturnLink`"], ["Entry point", "`FilesDemo`"]]
requirements = [
    "The naive download reads files outside the invoices folder.",
    "A text-prefix check still reads a sibling folder with a similar name.",
    "The safe download refuses `..`, encoded dots, other folders and links that lead outside, and still reads honest invoices.",
    "The naive upload replaces a settings file and serves a script inline; the safe one ignores the customer's name, decides by the bytes, limits size and serves as a download.",
    "The safe return link only allows paths on this site, and the host check is exact.",
    "The demo prints the same output on every run.",
]

