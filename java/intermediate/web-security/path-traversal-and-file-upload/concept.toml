[[act]]
title = "A text check is not a path check"
summary = "The second version removes .. and checks that the path's text starts with .../invoices: the secrets file is refused, but .../invoices-private/payroll.txt starts with the same letters and is read; compared as a path, its element invoices-private is not invoices."
detail = """
The second version resolves and normalizes the path, then checks that its text starts with the text of the folder, ".../invoices".
../secrets/db.txt becomes .../secrets/db.txt: as text it does not start with .../invoices, so it is refused with "outside the invoice folder".
../invoices-private/payroll.txt becomes .../invoices-private/payroll.txt. As text it does start with .../invoices, because the folder's name is a prefix of invoices-private, and the payroll is read.
Compared as a path, element by element, the element invoices-private is not invoices, so Path.startsWith says no.
"""
figure = "text_vs_path"
figure_title = "Same letters, different folder"
figure_speech = """
Third demo: a text check is not a path check. [[slnc 400]] The second version removes the dots first, and then checks that the path starts with the invoices folder. [[slnc 300]] Secrets fail that check. [[slnc 700]]
At the top, the check done as text. [[slnc 300]] The folder's letters are on the first line. [[slnc 300]] The path is on the second line: invoices dash private, slash, payroll. [[slnc 300]] Every letter of the folder matches, in green. [[slnc 300]] So the text check says yes, and reads the payroll. [[slnc 700]]
At the bottom, the same pair compared as a path. [[slnc 300]] Here each box is a whole folder name. [[slnc 300]] Invoices dash private is a different box from invoices. [[slnc 300]] So the path check says no. [[slnc 600]]
That is what path dot starts with does in Java: it compares whole names, never letters.
"""
