title = "How To Use It"
body = ["Explain how .., encoded dots and symbolic links lead", "out of a folder", "Say why comparing paths as text fails and what", "Path.startsWith does differently", "List what an upload handler should decide for itself", "and what it must never take from the customer", "Explain why //host and /\\host are other sites, and why", "the fixed redirect accepts only simple paths"]
narration = "So, how do you use it? [[slnc 400]] Prefer ids to names, and mapping tables to paths. [[slnc 500]] If you must use names: allow-list the shape, decode once, resolve against the real base folder, compare with Path.startsWith, and check the real path after links. [[slnc 500]] For uploads: size limit, magic-byte type, server-made name, storage outside the web root, Content-Disposition: attachment and X-Content-Type-Options: nosniff."

