[[act]]
title = "The bill"
summary = "The guided server scanned by its address instead of its name fails the name rule: 127.0.0.1 is not in the certificate, a false alarm. A scan sees the handshake and the page at / at one moment, so it is run by name, after every change and on a schedule."
detail = """
The input is the same guided server, scanned with 127.0.0.1:<port> instead of --ip 127.0.0.1 www.shop.localhost:<port>.
The report: cert_trust HIGH, "certificate does not match supplied URI". Worked out: the name asked for is 127.0.0.1, the certificate lists www.shop.localhost, so it is not listed.
The result: by name the gate passes, by address it fails on the name rule; a false alarm, because the server did not change. A scan does not see the application, the other paths or tomorrow's change, so it is run by name, after every change and on a schedule.
"""
figure = "false_alarm"
figure_title = "The same server, by name and by address"
figure_speech = """
Fifth demo: the bill. [[slnc 400]] The same guided server, scanned twice. [[slnc 500]] At the top, by name. [[slnc 300]] The scan asks for w w w dot shop dot localhost. [[slnc 300]] The certificate lists that name, so the gate passes. [[slnc 700]]
Below, by address. [[slnc 300]] The scan asks for one two seven dot zero dot zero dot one. [[slnc 300]] The certificate does not list an address, so test S S L says high, and the name rule fails. [[slnc 600]]
Nothing about the server changed. [[slnc 300]] Only the name the scan asked for. [[slnc 300]] That is a false alarm, and a gate that raises false alarms soon gets switched off.
"""
