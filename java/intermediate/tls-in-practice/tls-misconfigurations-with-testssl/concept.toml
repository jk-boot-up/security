# concept.toml: everything about this project that is not Java code.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "tls-misconfigurations-with-testssl"
level = "intermediate"
module = "tls-in-practice"
title = "TLS Misconfigurations with testssl.sh"
short_title = "TLS Audit with testssl"
package = "tlsaudit"
main_class = "TlsAuditDemo"
tagline = "Point testssl.sh at servers that are right and servers that are wrong, and turn what it reports into a gate that the shop owns"
bold = "testssl.sh reads a server the way a client does and reports protocols, cipher suites, the certificate and the headers with its own severities; a TLS gate is the shop's own list of rules written over that report, with exceptions that carry a reason, because a copied configuration breaks rules no browser shows, an old protocol is only LOW to the tool and forbidden by the rule, and a scan by address reports a false name problem."
domain = "an online store"
domain_note = ""
youtube_description = "The real testssl.sh 3.2 against five local servers: a nginx configured to the guidance, a configuration copied from the first search result with obsolete suites, no HSTS or security headers and a version in the Server header, a server written with the JDK that speaks TLS 1.0 and 1.1 and has no forward secrecy, an expired certificate, a certificate for another name, and a scan by address that raises a false alarm. The findings become a policy of eleven rules with exceptions that carry a reason."
thumb_lines = ["TLS AUDIT WITH", "TESTSSL.SH"]
thumb_code = "testssl.sh --jsonfile out.json host:443"
youtube_title = "TLS Misconfigurations with testssl.sh: Scanning Local Servers and Writing a Gate (OWASP A02, A04)"
youtube_tags = ["testssl", "testssl.sh", "tls", "ssl", "cipher suites", "hsts", "tls audit", "owasp top 10", "a02", "java"]

[readme]
intro = """
The plain [tls-misconfigurations](../tls-misconfigurations) project reads a server's TLS settings in Java and grades them. This one runs the real scanner, **testssl.sh** (`brew install testssl`), against five real local servers started by the demo, reads its JSON file, and writes the shop's own **policy** over it. It also needs `nginx` and the `step` command (`brew install nginx step`). Nothing is installed globally and no Docker is needed; the tests are tagged `integration` (except the policy tests): `./gradlew integrationTest`.

What it shows:
- **A server that follows the guidance.** TLS 1.2 and 1.3, strong suites with forward secrecy, a certificate that chains to the lab's root, HSTS for two years. testssl itself calls one finding HIGH: no CRL or OCSP URI. The shop's policy has an **exception** for it, with a reason.
- **A configuration copied from the first search result.** Same certificate, same protocols; it breaks four rules no browser shows: obsolete suites, no HSTS, no security headers, a version in the `Server` header.
- **A server that speaks what old clients speak.** Written with the JDK (which refuses to unless told): TLS 1.0 and 1.1, only RSA key exchange. testssl calls the old protocols **LOW**; the shop's rule refuses them.
- **Certificates clients will refuse.** An expired one and one for another name.
- **The bill.** A scan by address reports a name problem that is not real; a scan is a snapshot; an exception without a reason is a switch someone will turn off.

**Maps to:** OWASP Top 10 (2025) A02 Security Misconfiguration and A04 Cryptographic Failures · CWE-326 (inadequate encryption strength), CWE-327, CWE-295 · NIST SP 800-52 · Mozilla's server-side TLS guidelines.
"""
analogy = """
A building inspector with a long checklist. The inspector writes what is there and how worried the code book is about it; the owner decides which items are a condition of opening the shop, and writes down, with a reason, the few that are waived.
"""
scenario = """
An online store runs several services behind TLS and wants to know, before a customer's browser does, which of them are wrong and why. The demo plays the store's operator with a scanner.
"""
costs = [
    "**A scan takes about fifteen seconds per server,** and many more with the vulnerability checks.",
    "**The tool's severities are its own:** the shop's rules decide what blocks a release.",
    "**Every exception needs a reason** and a person who reads it again.",
    "**A scan is a snapshot** of one moment and one path.",
    "**A false alarm costs trust in the gate** as much as a missed finding costs safety.",
]
too_much = """
A single static site on a managed host, with the host's own defaults, gains little from a policy of its own. The gate pays off when the shop runs several servers, changes them often, or must show its auditors what it checks.
"""
met_before = [
    "A report from an online SSL test tool, with a letter grade.",
    "`ssl_protocols` and `ssl_ciphers` lines copied from a blog post.",
    "A scanner step in a pipeline that fails on severity HIGH.",
    "A certificate that expired on a Sunday.",
]
where = """
This is the tools version of [tls-misconfigurations](../tls-misconfigurations), in the [tls-in-practice](..) module. The servers it scans are the kind configured in [tls-servers-in-practice-with-nginx-and-caddy](../tls-servers-in-practice-with-nginx-and-caddy).
"""
twin = """
The servers are real: four nginx instances and one written with the JDK, on free loopback ports, with certificates from a root made with the step command. testssl.sh runs as a program and its JSON file is read back. Ports, dates and counts that change are never printed; the demo takes about a minute.
"""
test_note = "The policy tests need nothing. The scan tests start the servers once for the whole class and need nginx, step and testssl.sh (./gradlew integrationTest)."

[[act]]
title = "A server that follows the guidance"
summary = "TLS 1.2 and 1.3, forward secrecy, a trusted chain and HSTS; testssl calls one finding HIGH and the shop's policy excepts it with a reason."
detail = """
testssl.sh reads the protocols, cipher suites, certificate and headers of one server in about fifteen seconds. The guided server offers TLS 1.2 and 1.3, a chain that passes, strong suites with forward secrecy and HSTS for 730 days. testssl itself calls one finding HIGH: no CRL or OCSP URI is provided. The shop's policy has eleven rules; this server breaks one of them, revocation, which has an exception because the lab authority publishes neither. The gate passes.
"""
speech = """
First demo: a server that follows the guidance. [[slnc 400]] testssl dot s h reads it the way a client does. [[slnc 600]]
It offers T L S one point two and one point three. [[slnc 300]] One finding is high: no revocation information. [[slnc 600]]
The shop's policy excepts it, with a reason, and the gate passes.
"""
rows = { good = "active ok" }
console = [
    ["protocols: TLS 1.2, TLS 1.3; chain passed; HSTS 730 days", "ok"],
    ["testssl: one HIGH, cert_revocation", "bad"],
    ["the shop's gate: pass (one exception, with a reason)", "ok"],
]

[[act]]
title = "A configuration copied from the first search result"
summary = "The same certificate and protocols, without ciphers, headers or server_tokens off, break four rules that no browser shows."
detail = """
The copied configuration has the same certificate and the same protocols but no ssl_ciphers, no headers and no server_tokens off. It breaks four rules: obsolete cipher suites, HSTS, security headers and the version in the Server header. testssl rates them LOW or MEDIUM. Nothing here stops a browser from loading the page: all of it is invisible to the person using it. The guided configuration with the same certificate passes.
"""
speech = """
Second demo: a configuration copied from the first search result. [[slnc 400]] The same certificate, the same protocols. [[slnc 600]]
No cipher list, no headers, and the version in the server header. [[slnc 600]]
A browser loads the page just the same.
"""
rows = { copied = "active wrong" }
console = [
    ["rules broken: obsolete-suites, hsts, headers, banner", "bad"],
    ["testssl: HSTS LOW, headers MEDIUM, obsolete suites LOW", "bad"],
    ["the guided configuration: pass", "ok"],
]

[[act]]
title = "A server that still speaks what old clients speak"
summary = "TLS 1.0 and 1.1 and RSA key exchange only: testssl calls the old protocols LOW and the shop's rule refuses them."
detail = """
A server written with the JDK, which has to be told to do it, offers TLS 1.0, 1.1 and 1.2, and only RSA key exchange. Forward secrecy with strong suites is not offered (MEDIUM): a stolen key opens every recorded session. testssl rates TLS 1.0 and 1.1 as LOW, and the shop's policy refuses them: the rating is the tool's, the rule is yours. It breaks protocols, TLS 1.3, forward secrecy, obsolete suites, HSTS and headers.
"""
speech = """
Third demo: a server that still speaks what old clients speak. [[slnc 400]] T L S one point zero and one point one are offered. [[slnc 600]]
No forward secrecy. [[slnc 300]] The tool calls the old protocols low. The shop's rule refuses them.
"""
rows = { legacy = "active wrong" }
console = [
    ["protocols: TLS 1.0, TLS 1.1, TLS 1.2", "bad"],
    ["forward secrecy: not offered (MEDIUM)", "bad"],
    ["TLS 1.0: LOW for testssl, refused by the shop's rule", "bad"],
]

[[act]]
title = "Certificates that clients will refuse"
summary = "An expired certificate and a certificate for another name are CRITICAL and HIGH, and stop every browser."
detail = """
An expired certificate: the chain is CRITICAL (failed, expired) and so is the expiry. A certificate for pay.shop.localhost on www.shop.localhost is HIGH: it does not match the name asked for. Each breaks its own rule of the policy. Both of these stop every browser, and nothing else about the server matters until they are fixed.
"""
speech = """
Fourth demo: certificates that clients will refuse. [[slnc 400]] An expired certificate is critical. [[slnc 600]]
A certificate for another name is high. [[slnc 300]] Either one stops every browser.
"""
rows = { certs = "active wrong" }
console = [
    ["expired: chain CRITICAL, expiry CRITICAL", "bad"],
    ["pay.shop.localhost on www.shop.localhost: HIGH", "bad"],
]

[[act]]
title = "The bill"
summary = "A scan by address raises a false alarm, a scan is a snapshot, and an exception without a reason is a switch someone will turn off."
detail = """
The same good server scanned by its address instead of its name fails the name rule: a false alarm, because the certificate is not for an address. An exception is a decision written down with its reason. A scan is a snapshot of one moment, of the handshake and of the page at /. The policy is a file under version control, and the scan is rerun after every change and on a schedule, because a certificate runs out without anyone touching it.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] Scanned by its address, the good server fails: a false alarm. [[slnc 600]]
An exception is a decision with a reason. [[slnc 300]] A scan is a snapshot, so it is run again and again.
"""
rows = { bill = "active ok" }
console = [
    ["the good server, scanned by address: fail [name]", "bad"],
    ["exceptions carry a reason", "ok"],
    ["rerun after every change, and on a schedule", "ok"],
]

[animation]
subtitle = "An online store, five servers, and a scanner that reads them like a client."
boxes = [
    ["good", "The guided server", "one exception"],
    ["copied", "The copied one", "four quiet rules"],
    ["legacy", "The legacy one", "old protocols"],
    ["certs", "The certificates", "expired, wrong name"],
    ["bill", "The bill", "false alarms, snapshots"],
]

[docs.problem]
scenario = """
An online store runs several services behind TLS, and the settings come from many hands and many blog posts.
"""
naive = """
Open the site in a browser; if the padlock is there, it is fine.
"""
deliver = [
    "A real scanner against five real servers.",
    "A policy of rules over the scanner's report, with exceptions that carry a reason.",
    "The findings no browser shows.",
    "The ways a scan can be wrong.",
]

[docs.prerequisites]
required = [
    "Java basics",
    "The plain tls-misconfigurations project, for the ideas",
    "testssl, nginx and step: brew install testssl nginx step",
]
not_required = [
    "Docker or a public site",
]
install = ["testssl", "nginx", "step"]

[docs.session]
objectives = [
    "run testssl.sh and read its JSON",
    "write a rule over a finding",
    "write an exception with a reason",
    "say why a scan by address can be wrong",
]
walkthrough = """
Run act three and find the severity testssl gives TLS 1.0, then the rule that refuses it. In act five find the scan that fails although the server is fine.
"""
exercises = [
    "Add a rule that requires an OCSP responder, and remove the exception.",
    "Add the vulnerability checks (-U) and decide which ones the shop requires.",
    "Scan the servers of the previous project with this policy.",
    "Fail a build when a certificate has less than 30 days left.",
]

[docs.explained]
sentence = """
A scanner reports what a server does; a policy says what the shop requires; the gate is the policy applied to the report, with exceptions that someone signed.
"""
verdict = """
Scan by name, keep the policy in version control, make every exception carry a reason, rerun after every change and on a schedule, and trust a finding only after you know what the tool did to find it.
"""
recognise = [
    "`testssl.sh --jsonfile` in a pipeline.",
    "A report with LOW, MEDIUM, HIGH and CRITICAL findings.",
    "An ignore list with no reasons in it.",
    "A certificate that expired unnoticed.",
]

[spec]
purpose = """
Teach scanning TLS servers with testssl.sh and turning the report into a gate.
"""
