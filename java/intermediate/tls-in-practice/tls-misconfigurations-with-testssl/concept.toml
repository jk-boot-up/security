[[act]]
title = "Certificates that clients will refuse"
summary = "A certificate that lived 48 hours and ended before the scan is CRITICAL for its chain and its expiry; one for pay.shop.localhost served as www.shop.localhost is HIGH because the name is not listed. The gate fails each on its own rule."
detail = """
The input is two certificates from the lab's root on otherwise guided nginx servers: one valid from 72 hours ago to 24 hours ago, one for pay.shop.localhost.
The expiry, worked out: not after minus not before is 2161 hours = 90 days for the good certificate (89 days left, at least 60, so OK) and 48 hours for the expired one, which ended before the scan, so the expiry is CRITICAL and the chain fails with it.
The name, worked out: the name asked for is www.shop.localhost and the certificate lists only pay.shop.localhost, so it is not listed and cert_trust is HIGH (a *.shop.localhost wildcard would cover it, one label deep).
The result: the expired certificate fails the chain and expiry rules, the other one fails the name rule, and every browser refuses both.
"""
figure = "cert_checks"
figure_title = "The expiry and the name, worked out"
figure_speech = """
Fourth demo: certificates that clients will refuse. [[slnc 400]] At the top, the expiry. [[slnc 300]] A certificate's lifetime is its not after time, minus its not before time. [[slnc 300]] The good one has two thousand one hundred and sixty one hours: ninety days. [[slnc 300]] Eighty nine days are left, and test S S L wants at least sixty, so it is O K. [[slnc 500]] The expired one lived forty eight hours, and its end is before the scan. [[slnc 300]] So the expiry is critical, and the chain fails too. [[slnc 700]]
Below, the name. [[slnc 300]] The client asked for w w w dot shop dot localhost. [[slnc 300]] The certificate lists only pay dot shop dot localhost. [[slnc 300]] The name is not listed, so test S S L says high. [[slnc 600]]
On the right, the result. [[slnc 300]] Each certificate fails its own rule. [[slnc 300]] And every browser refuses both.
"""
speech = """
The report for the expired certificate: the chain is critical, and so is the expiry. [[slnc 400]] The expiry, worked out. [[slnc 300]] The good certificate lives ninety days, with eighty nine left. [[slnc 300]] The expired one lived forty eight hours, and ended before the scan.
[[page]]
The certificate of another name: cert trust is high. [[slnc 300]] Worked out: the name asked for is not in the certificate's list. [[slnc 300]] A wildcard would cover it, one label deep. [[slnc 400]] The result: the expired one fails chain and expiry, the other one fails the name rule.
