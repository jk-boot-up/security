[poster]
headline = [["TLS AUDIT WITH", "text"], ["TESTSSL.SH", "accent"]]
taglines = [["A scanner reports; the shop's rules decide", "gold"]]
before = { code = "testssl HIGH: [cert_revocation]", note = "A gate on the tool's severity", tag = "BEFORE" }
after = { code = "legacy  fail, 6 rules", note = "The shop's own rules", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "TLS Misconfigurations with testssl.sh"
narration = "Hello, and welcome. [[slnc 400]] This video explains checking servers for T L S mistakes with the test S S L tool, and turning its report into a gate. [[slnc 300]] T L S is transport layer security, the protocol behind the padlock in the browser. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] test S S L dot s h connects to a server the way a client does, and reports its protocols, cipher suites, certificate and headers, each with a severity of its own. [[slnc 300]] A gate is the shop's own list of rules, written over that report, with exceptions that carry a reason. [[slnc 600]] Think of a building inspector's report. [[slnc 300]] The owner still decides which findings stop the opening, and writes down why the others do not. [[slnc 600]] Our example is an online store."

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online store runs several services", "behind TLS, and wants to know which", "are wrong before a customer's browser does.", "", "The demo starts five real local servers,", "runs the real testssl.sh against each,", "and applies the store's own rules."]
narration = "Here is the scenario. [[slnc 400]] An online store runs several services behind T L S, and wants to know which of them are wrong, and why, before a customer's browser finds out. [[slnc 500]] The demo starts five real servers on this machine: nginx set up well, nginx set up from a copied example, an old-style Java server, and two with bad certificates. [[slnc 500]] It runs the real test S S L tool against each one, and applies the store's own rules to the report."

[[scene]]
key = "02-words"
kind = "bullets"
title = "The Words"
body = ["Finding: one JSON row: id, severity, text", "Severity: the tool's own rating, OK to CRITICAL", "Rule: the shop's own check over one finding", "Exception: a broken rule accepted, with a reason", "Gate: pass only when no rule is left broken", "Forward secrecy: a fresh key for each connection"]
narration = """Before the demos, the words. [[slnc 500]] A finding is one row of test S S L's J S O N file: an id, a severity and a text. [[slnc 500]] The severity is the tool's own rating, from O K up to critical. [[slnc 500]] A rule is the shop's own check, written over one finding. [[slnc 500]] An exception is a broken rule the shop accepts, written down with its reason. [[slnc 500]] The gate passes only when no rule is left broken. [[slnc 500]] And forward secrecy means each connection gets a fresh key, so a stolen server key cannot open recorded traffic."""

[[scene]]
key = "02-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "02-one-finding"
kind = "figure"
title = "One finding, from the tool to the gate"
body = "one_finding"
narration = """Let's see the core idea on one real example. [[slnc 400]] At the top, what test S S L dot s h wrote about the guided server. [[slnc 300]] One J S O N row: the id is cert revocation, the severity is high, and the finding says the certificate names neither a C R L nor an O C S P address. [[slnc 600]]
Next, the shop's rule. [[slnc 300]] The rule called revocation reads exactly that id. [[slnc 300]] The severity is high, so the rule is broken. [[slnc 600]]
Then the exception. [[slnc 300]] The shop has decided to accept it, and wrote down why: the lab's authority publishes no revocation list and no responder. [[slnc 600]]
And at the bottom, the gate. [[slnc 300]] One rule is broken, and it is excepted, so the gate passes. [[slnc 300]] The tool reports. [[slnc 300]] The shop decides."""

[[scene]]
key = "03-acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "04-costs"
kind = "bullets"
title = "What It Costs"
body = ["About fifteen seconds of scanning per server", "The tool's severities are its own", "Every exception needs a reason", "A scan is a snapshot", "A false alarm costs trust in the gate"]
narration = "Nothing is free. [[slnc 400]] Here is what it costs. [[slnc 500]] A scan takes about fifteen seconds for each server. [[slnc 500]] The tool's severities are its own, and they are not the shop's. [[slnc 500]] Every exception needs a reason, and someone who owns it. [[slnc 500]] A scan is a snapshot, true only on the day it ran. [[slnc 300]] And a false alarm costs trust in the gate, so people start to ignore it."

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["A scan report with LOW to CRITICAL findings", "An ignore list with no reasons in it", "A certificate that expired unnoticed", "A name warning when scanning an IP address"]
narration = "You have probably met this already. [[slnc 400]] A scan report with findings from low to critical is this tool, or one like it. [[slnc 500]] An ignore list with no reasons in it is an exception nobody can defend. [[slnc 500]] A certificate that expired unnoticed is what a scheduled scan would have caught. [[slnc 500]] And a name warning when you scan an I P address is the false alarm from the last demo."

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Scan by name, not by address", "Keep the policy in version control", "Every exception carries a reason", "Rerun after every change, and on a schedule", "Know what the tool did to find each finding"]
narration = "So, how do you use it? [[slnc 400]] Scan each service by its name, not by its address. [[slnc 500]] Keep the shop's policy in version control, beside the code. [[slnc 300]] Make every exception carry a reason. [[slnc 500]] Run the scan again after every change, and on a schedule. [[slnc 300]] And trust a finding only once you know what the tool did to find it."

[[scene]]
key = "07-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a rule that requires an", "OCSP responder, and remove the exception."]
narration = "That's finding T L S misconfigurations with test S S L. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] A scanner reports what a server does, a policy says what the shop requires, and the gate is the policy applied to the report, with exceptions that someone signed. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a rule that requires an O C S P responder, and remove the exception. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] The servers and the scanner are real programs; the classes start them, read the report, and apply the rules. [[slnc 300]] Here are the ones that matter."""

[[class]]
name = "TestSsl"
what = "runs the real testssl.sh and reads its JSON file"
[[class.part]]
title = "four checks, by name, at the loopback address"
code = """
static final List<String> CHECKS = List.of("-p", "-s", "-S", "-h");
...
return run(name, port, List.of("--ip", "127.0.0.1", name + ":" + port));
"""
speech = """Four checks: protocols, cipher lists, the certificate and the headers. [[slnc 300]] The target is the name a browser would use, and dash dash i p sends the connection to this machine. [[slnc 300]] The J S O N file is read back into a Report."""

[[class]]
name = "Report"
what = "one testssl finding per id: severity and text"
[[class.part]]
title = "read by id"
code = """
String severity(String id) {
    Finding f = findings.get(id);
    return f == null ? "MISSING" : f.severity();
...
List<String> idsAt(String... severities) {
"""
speech = """A report maps each test S S L id to its finding. [[slnc 300]] A rule asks for one id, and gets its severity or its text. [[slnc 300]] ids at lists the ids at a severity, like high or critical."""

[[class]]
name = "Policy"
what = "the shop's eleven rules and its exceptions"
[[class.part]]
title = "a rule reads one testssl id"
code = """
new Rule("protocols", "no protocol older than TLS 1.2", "SSLv2 .. TLS1_1",
        r -> !r.offered("SSLv2") && !r.offered("SSLv3")
                && !r.offered("TLS1") && !r.offered("TLS1_1")),
"""
speech = """Each rule has an id, a sentence, the test S S L ids it reads, and a test over the report. [[slnc 300]] The protocols rule is broken when any version older than T L S one point two is offered, whatever severity the tool gives it."""
[[class.part]]
title = "an exception carries a reason"
code = """
new Exception("revocation", "the lab authority publishes no CRL or OCSP responder"));
...
boolean excepted = EXCEPTIONS.stream().anyMatch(e -> e.ruleId().equals(rule.id()));
if (!rule.holds().test(report) && !excepted) {
"""
speech = """An exception names a rule and its reason. [[slnc 300]] A rule that does not hold makes the gate fail, unless it has an exception."""

[[class]]
name = "WorkedOut"
what = "a teaching class: redoes three checks by hand"
[[class.part]]
title = "the name asked for, against the certificate's names"
code = """
static boolean listed(String asked, String subjectAltNames) {
    return Arrays.stream(subjectAltNames.split(" ")).anyMatch(name -> name.equalsIgnoreCase(asked)
            || name.startsWith("*.") && asked.indexOf('.') > 0
"""
speech = """The name check, by hand: is the name asked for one of the certificate's names? [[slnc 300]] A test checks that it agrees with test S S L on every recorded scan. [[slnc 300]] The same class works out the H S T S days and a certificate's lifetime."""

[[class]]
name = "Nginx and LegacyServer"
what = "the real servers that are scanned"
[[class.part]]
title = "what the JDK must be told"
code = """
static final String[] PROTOCOLS = {"TLSv1", "TLSv1.1", "TLSv1.2"};
...
Security.setProperty("jdk.tls.disabledAlgorithms", "");
...
if (suite.startsWith("TLS_RSA_WITH_") && !suite.contains("NULL")) {
"""
speech = """Nginx starts with the guided or the copied lines. [[slnc 300]] LegacyServer is written with the J D K, which refuses old protocols by default. [[slnc 300]] It has to clear the disabled list, and keep only R S A key exchange suites."""

[[acronym]]
short = "TLS"
long = "Transport Layer Security: the protocol behind HTTPS"
say = "T L S is transport layer security: the protocol that encrypts a connection and proves the server's identity."
[[acronym]]
short = "SSL"
long = "Secure Sockets Layer: TLS's old, broken predecessor"
say = "S S L is secure sockets layer, the old protocol that T L S replaced. Every version of it is broken."
[[acronym]]
short = "HTTP, HTTPS"
long = "Hypertext Transfer Protocol; HTTP over TLS"
say = "H T T P is the hypertext transfer protocol of the web. H T T P S is H T T P inside T L S."
[[acronym]]
short = "HSTS"
long = "HTTP Strict Transport Security: always use HTTPS here"
say = "H S T S is H T T P strict transport security: a header that tells the browser to use only H T T P S for this site, for max-age seconds."
[[acronym]]
short = "JSON"
long = "JavaScript Object Notation: the report's file format"
say = "J S O N is JavaScript object notation, the text format of test S S L's report file."
[[acronym]]
short = "JDK"
long = "Java Development Kit: Java and its own TLS code"
say = "J D K is the Java development kit. It has its own T L S code, which the legacy server uses."
[[acronym]]
short = "CRL"
long = "Certificate Revocation List: certificates withdrawn early"
say = "C R L is a certificate revocation list: the certificates an authority has withdrawn before their end."
[[acronym]]
short = "OCSP"
long = "Online Certificate Status Protocol: ask if one is revoked"
say = "O C S P is the online certificate status protocol: a client asks a responder whether one certificate is revoked."
[[acronym]]
short = "URI, IP"
long = "Uniform Resource Identifier; Internet Protocol (address)"
say = "U R I is a uniform resource identifier, the name a client asks for. I P is the internet protocol, and an I P address is a number like one two seven dot zero dot zero dot one."
[[acronym]]
short = "RSA"
long = "Rivest-Shamir-Adleman: a public-key algorithm"
say = "R S A, after Rivest, Shamir and Adleman, is a public key algorithm. Used as a key exchange, it gives no forward secrecy."
[[acronym]]
short = "ECDHE"
long = "Elliptic Curve Diffie-Hellman Ephemeral key exchange"
say = "E C D H E is elliptic curve Diffie Hellman ephemeral: a fresh key for every connection, which gives forward secrecy."
[[acronym]]
short = "TLS1, TLS1_1"
long = "testssl's ids for TLS 1.0 and TLS 1.1"
say = "T L S one and T L S one underscore one are test S S L's names for T L S one point zero and one point one."
[[acronym]]
short = "SAN, CN"
long = "Subject Alternative Name; Common Name: a certificate's names"
say = "S A N is the subject alternative name, the list of names in a certificate. C N is the common name, the older single name."
