[threatmodel]
scope = """
A step-ca with a token and an ACME provisioner issuing day-long certificates for the store's internal names, and the clients that validate them. It covers who may obtain a certificate, renewal, and revocation. It does not cover hardware-backed keys or the network between services.
"""
assets = [
    "The CA's issuing key and password.",
    "The certificates and keys of the store's services.",
]
actors = [
    "Teams that run services.",
    "An attacker who can reach the CA's address.",
    "An attacker who steals a service's key.",
]
boundaries = [
    "The CA's machine and folder: whoever reads it can issue.",
    "The client's trust store: the root.",
]
assumptions = [
    "Clients receive the root from a source that cannot be changed on the way.",
    "The CA's password is not stored with its key.",
]
out_of_scope = [
    "Compromise of the root key on offline media.",
    "Device attestation.",
]
tests = [
    "`StepCaTest` starts a real step-ca and uses the step command for tokens, ACME, policy, lifetime, renewal, rekeying, revocation and the list, and checks them with the JDK.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next project in this module, tls-servers-in-practice-with-nginx-and-caddy, serves the store with certificates from this CA.
"""

[[threat]]
id = "T1"
stride = "S"
threat = "Someone obtains a certificate for a name that is not theirs"
where = "the CA's provisioners"
control = "One-time tokens for one name, a name policy, ACME challenges"
residual = "Whoever controls the name's address can pass the challenge"

[[threat]]
id = "T2"
stride = "E"
threat = "A long-lived certificate is requested"
where = "the CA"
control = "A maximum lifetime of a day"
residual = "A stolen key works until it ends"

[[threat]]
id = "T3"
stride = "R"
threat = "A revoked certificate is still accepted"
where = "clients"
control = "A signed, fresh list, and clients that fail closed without one"
residual = "Clients that never check"

[[threat]]
id = "T4"
stride = "I"
threat = "The CA's keys are read from its machine"
where = "the CA's folder"
control = "An encrypted root key, a password kept elsewhere"
residual = "The issuing key is online"

[poster]
headline = [["LOCAL CA WITH", "text"], ["STEP-CA", "accent"]]
taglines = [["Tokens, ACME, renewal and revocation", "gold"]]
before = { code = "a second use -> not authorized", note = "A one-time token", tag = "BEFORE" }
after = { code = "renewed: new serial, same key", note = "Renewing before it ends", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "A Local Certificate Authority with step-ca"
narration = "Hello, and welcome. [[slnc 400]] This video explains running a real certificate authority, step C A, for a store's own services. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] step C A is a small, real certificate authority. [[slnc 300]] A service asks it for a certificate with a one-time token, or through A C M E, and gets one only for the names its policy allows, for a day. [[slnc 300]] The service renews it before it ends, and a stolen key can be revoked. [[slnc 300]] But a client that never checks the revocation list still accepts the certificate. [[slnc 600]] Think of a day pass at a building, renewed every morning. [[slnc 300]] Losing one matters for a day, not for a year. [[slnc 600]] Our example is an online store."

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online store runs its services", "on names under shop.localhost,", "and wants certificates for them.", "", "The demo starts a real step-ca", "and uses the step command", "as the store's teams would."]
narration = "Here is the scenario. [[slnc 400]] An online store runs its own services on names under shop dot localhost, and wants certificates for them, without buying any. [[slnc 500]] The demo starts a real step C A, with a token provisioner, an A C M E provisioner, and a name policy. [[slnc 500]] Then it uses the step command, as the store's teams would: to ask for certificates, renew them, and revoke one."

[[scene]]
key = "02-words"
kind = "bullets"
title = "The Words"
body = ["Provisioner: a way the CA lets someone ask", "One-time token: a signed note for one name, used once", "Challenge: the CA calls the name back to check", "Renew, rekey: a new certificate, same or new key", "Revocation list: serials taken back, signed by the CA"]
narration = """Before the demos, the words. [[slnc 500]] A provisioner is one way the C A lets someone ask for a certificate. [[slnc 500]] A one-time token is a short, signed note that allows one request, for one name. [[slnc 500]] A challenge is the C A calling a name back, to check that the asker controls it. [[slnc 500]] Renew gives a new certificate with the same key, and rekey with a new key. [[slnc 500]] And a revocation list names the serials taken back, signed by the C A."""

[[scene]]
key = "02-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "02-token"
kind = "figure"
title = "Inside a one-time token"
body = "token_anatomy"
narration = """Let's open one real token from the demo. [[slnc 400]] It is a J W T, three parts joined by dots: a header, a payload, and a signature. [[slnc 600]] The header says how it is signed: E S two five six, an elliptic curve signature with S H A two fifty six. [[slnc 600]] The payload holds the claims. [[slnc 300]] Sub and sans: the name it is for, w w w dot shop dot localhost. [[slnc 300]] Iss: the provisioner that made it, called tokens. [[slnc 300]] Aud: the C A that may accept it. [[slnc 300]] Exp minus nbf: three hundred seconds, five minutes to use it. [[slnc 300]] Sha: the S H A two fifty six of the root, worked out again by the demo, and it matches. [[slnc 300]] And jti: a random id. [[slnc 600]] The C A checks the signature, then remembers the id, so the same token never works twice."""

[[scene]]
key = "03-acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "04-costs"
kind = "bullets"
title = "What It Costs"
body = ["The CA is a high-value server", "Every service needs a renewal job", "Revocation reaches only clients that check", "ACME proves control of a name, not the right to it", "Every client needs the root"]
narration = "Nothing is free. [[slnc 400]] Here is what it costs. [[slnc 500]] The certificate authority is a high-value server, and its issuing key is online. [[slnc 500]] Every service needs a renewal job that never stops. [[slnc 500]] Revocation reaches only the clients that check the list. [[slnc 500]] A C M E proves that you control a name right now, not that you should have it. [[slnc 300]] And every client must be given the root, from a safe place."

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["step ca certificate, renew or revoke", "A timer or a daemon that renews certificates", "An ACME client asking for a certificate", "\"unknown authority\" in a client's error"]
narration = "You have probably met this already. [[slnc 400]] Step C A certificate, renew, or revoke, in a script, is this tool. [[slnc 500]] A timer or a daemon that renews certificates every day is the renewal job. [[slnc 500]] An A C M E client, like the one in a web server, asking for a certificate, is the third demo. [[slnc 500]] And unknown authority, in a client's error, is a client that was never given the root."

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Short certificates, so renewal replaces revocation", "A name policy and a name constraint", "Protect the issuing key and its password", "Give clients the root from a safe place", "Every service renews on its own"]
narration = "So, how do you use it? [[slnc 400]] Keep certificates short, so renewal does most of the work of revocation. [[slnc 500]] Limit names with a policy, and with a name constraint in the issuing certificate. [[slnc 500]] Protect the issuing key, and the password that opens it, like the most valuable thing you own. [[slnc 500]] Give clients the root from a safe place. [[slnc 300]] And make every service renew on its own."

[[scene]]
key = "12-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a name constraint to the", "issuing authority and test a name outside it."]
narration = "That's a local certificate authority with step C A. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] A local certificate authority decides which names get which certificates, for how long, and for whom, and clients trust it only because they were given its root. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a name constraint to the issuing authority, and ask for a name outside it. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] The C A and the step command are the real programs; the Java code sets them up, runs them, and checks what they hand back. [[slnc 300]] Here are the classes that matter."""

[[class]]
name = "StepCa"
what = "starts a real step-ca with a name policy, and runs the step command"
[[class.part]]
title = "the policy, written into ca.json"
code = """
ObjectNode policy = ((ObjectNode) ca.get("authority")).putObject("policy");
ArrayNode dns = policy.putObject("x509").putObject("allow").putArray("dns");
dns.add("localhost").add("*.shop.localhost");
"""
speech = """Before the C A starts, the demo writes its policy into its configuration file. [[slnc 300]] Only localhost, and names under shop dot localhost, may be certified. [[slnc 300]] The C A enforces it for tokens and for A C M E alike."""
[[class.part]]
title = "renew with the certificate and its key"
code = """
Outcome renew(Path crt, Path key) throws IOException, InterruptedException {
    return step("ca", "renew", crt.toString(), key.toString(), "--force");
"""
speech = """Renewal is one step command. [[slnc 300]] It sends no token: the certificate and its key are the proof, used in the T L S connection to the C A."""

[[class]]
name = "Token"
what = "the one-time token, opened: three base64url parts"
[[class.part]]
title = "header.payload.signature"
code = '''
String[] parts = token.strip().split("\\.");
...
JsonNode payload = JSON.readTree(
        new String(decoder.decode(parts[1]), StandardCharsets.UTF_8));
...
return text("sha").equalsIgnoreCase(sha256(root));
'''
speech = """The token is split at the dots, and the middle part decoded into its claims. [[slnc 300]] The sha claim is compared with the S H A two fifty six of the root, worked out again here. [[slnc 300]] This class needs no tool, so it has its own unit tests."""

[[class]]
name = "Pki"
what = "a client: the JDK checks the chain, then the list if it wants one"
[[class.part]]
title = "no current list means no"
code = """
if (crl == null || crl.getNextUpdate() == null || crl.getNextUpdate().before(when)) {
    return "refused (UNDETERMINED_REVOCATION_STATUS)";
}
...
return crl.isRevoked(chain.get(0)) ? "refused (REVOKED)" : "accepted";
"""
speech = """After the J D K has checked the chain, a client that wants revocation needs a current list. [[slnc 300]] With none, or an old one, it refuses. [[slnc 300]] With one, it looks for the certificate's serial."""

