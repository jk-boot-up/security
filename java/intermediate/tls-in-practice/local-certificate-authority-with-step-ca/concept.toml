[[act]]
title = "A certificate with a token"
summary = "The one-time token is a JWT whose claims name www.shop.localhost, the tokens provisioner, the CA, 300 seconds and the root's SHA-256; it buys a 24-hour EC certificate; a second use, another name, 2000 hours and pay.example are refused."
detail = """
`step ca token www.shop.localhost` makes a one-time token. It is a JWT in 3 parts, header.payload.signature: header alg ES256, typ JWT; claims sub and sans www.shop.localhost, iss tokens (the provisioner that signed it), aud `<ca address>/1.0/sign`, exp - nbf 300 seconds, sha equal to the SHA-256 of the root, and a random 64-character jti.
With it, the service gets a certificate for [www.shop.localhost], 24 hours, key EC, a random serial, issued by the intermediate; a client that trusts the root accepts it.
The CA refuses the same token a second time (not authorized), a token for api.shop.localhost used for www (issued for another name), 2000 hours (longer than the longest lifetime) and pay.example (outside the policy).
"""
figure = "token_flow"
figure_title = "One token, one certificate, four refusals"
figure_speech = """
Second demo: a certificate with a token. [[slnc 400]] On the left, the input: a token for w w w dot shop dot localhost. [[slnc 300]] On the right, the result: a certificate for exactly that name, for twenty four hours, with an elliptic curve key. [[slnc 300]] Its serial is random, and the issuing authority signed it. [[slnc 600]]
Below, four ways to misuse a token. [[slnc 300]] The same token a second time: not authorized, because the C A remembers its id. [[slnc 300]] A token for another name: refused. [[slnc 300]] A valid token asking for two thousand hours: longer than the C A allows. [[slnc 300]] And a valid token for pay dot example: outside the policy. [[slnc 600]]
So the token decides who may ask, and the policy decides which names.
"""
speech = """
Here is the token, opened up. [[slnc 400]] Three parts. [[slnc 300]] The header: E S two five six, a J W T. [[slnc 300]] The claims: the name, the provisioner called tokens, the C A's address, three hundred seconds of life, the root's fingerprint, and a random id.
[[page]]
The certificate: issued, for w w w dot shop dot localhost, twenty four hours, and accepted by a client that trusts the root. [[slnc 400]] Then four refusals: a second use, another name, two thousand hours, and pay dot example.
"""
rows = { token = "active ok" }
console = [
    ["THE TOKEN (step ca token www.shop.localhost):", "code"],
    ["  parts        3: header.payload.signature", "muted"],
    ["  header       alg ES256, typ JWT", "muted"],
    ["  sub          www.shop.localhost", "muted"],
    ["  sans         [www.shop.localhost]", "muted"],
    ["  iss          tokens (the provisioner that signed it)", "muted"],
    ["  aud          <ca address>/1.0/sign", "muted"],
    ["  exp - nbf    300 seconds", "muted"],
    ["  sha          the SHA-256 of the root: true", "ok"],
    ["  jti          <random id, 64 characters>", "muted"],
    ["---", ""],
    ["THE CERTIFICATE (step ca certificate ... --token):", "code"],
    ["  issued, [www.shop.localhost], 24 hours, key EC", "muted"],
    ["  serial <random>, issued by Shop Internal CA Intermediate CA", "muted"],
    ["  a client that trusts the root: accepted", "muted"],
    ["THE TOKENS THE CA REFUSES:", "code"],
    ["  the same token a second time", "muted"],
    ["    -> refused (not authorized)", "ok"],
    ["  a token for api.shop.localhost, used for www", "muted"],
    ["    -> refused (the token was issued for another name)", "ok"],
    ["  a valid token, asking for 2000 hours", "muted"],
    ["    -> refused (longer than the longest lifetime the CA allows)", "ok"],
    ["  a valid token for pay.example", "muted"],
    ["    -> refused (that name is outside what the CA's policy allows)", "ok"],
]

[[act]]
title = "A certificate with ACME"
summary = "Through the ACME provisioner the CA calls www.shop.localhost back on port 80 before it signs a 24-hour certificate; evil.example is refused by the same policy."
detail = """
`step ca certificate --provisioner acme` asks for www.shop.localhost. The CA does not take a token: it calls the name back on port 80 (the challenge), which the step command answers, and only then signs.
The certificate is for [www.shop.localhost], 24 hours, key EC, a random serial, issued by the intermediate, and a client that trusts the root accepts it.
ACME for evil.example is refused: the ACME server will not issue for that name. ACME proves the asker controls a name now; the policy decides which names may be certified at all.
"""
figure = "acme_flow"
figure_title = "ACME: a challenge instead of a token"
figure_speech = """
Third demo: a certificate with A C M E. [[slnc 400]] On the left, the service. [[slnc 300]] On the right, step C A, with its A C M E provisioner. [[slnc 600]]
First, the service places an order for w w w dot shop dot localhost. [[slnc 300]] Second, the C A sends a challenge: it calls that name back, on port eighty. [[slnc 300]] Only whoever answers there controls the name. [[slnc 600]]
Third, after the challenge, the C A signs: twenty four hours, for exactly that name. [[slnc 600]]
Below, an order for evil dot example. [[slnc 300]] It never gets to a challenge. [[slnc 300]] The policy refuses it first.
"""
speech = """
Here is the output. [[slnc 400]] The request, through the A C M E provisioner, and the C A calls the name back on port eighty. [[slnc 400]] The certificate: issued, twenty four hours, accepted by a client that trusts the root. [[slnc 400]] And evil dot example: refused, the A C M E server will not issue for that name.
"""
rows = { acme = "active ok" }
console = [
    ["THE REQUEST (step ca certificate --provisioner acme):", "code"],
    ["  www.shop.localhost; the CA calls it back on port 80", "muted"],
    ["THE CERTIFICATE:", "code"],
    ["  issued, [www.shop.localhost], 24 hours, key EC", "muted"],
    ["  serial <random>, issued by Shop Internal CA Intermediate CA", "muted"],
    ["  a client that trusts the root: accepted", "muted"],
    ["ACME FOR A NAME OUTSIDE THE POLICY (evil.example):", "code"],
    ["  -> refused (the ACME server will not issue for that name)", "ok"],
]

[[act]]
title = "Renewing before it ends"
summary = "step ca renew gives a new serial with the same key and a later end; step ca rekey gives a different key; a service that lost its key cannot renew, because the call to the CA is authenticated by that key."
detail = """
Before the renewal, www.shop.localhost has a random serial, 24 hours and an EC key.
`step ca renew` presents the certificate and its key to the CA: renewed, 24 hours, a new serial true, the same key true, ends later true. `step ca rekey` renews with a new key: a different key true.
A service that has lost its key and tries with another one is refused: the key does not match, so the TLS call to the CA fails. Only the holder of the key renews. With a day of life, a renewal job that stops is noticed within a day.
"""
figure = "renewal"
figure_title = "Before and after a renewal"
figure_speech = """
Fourth demo: renewing before it ends. [[slnc 400]] On the left, the certificate before: a random serial, twenty four hours, an elliptic curve key. [[slnc 600]]
In the middle, after step C A renew. [[slnc 300]] The service shows the C A its certificate, and proves it holds the key, in the T L S connection itself. [[slnc 300]] The result: a new serial, the same key, and a later end. [[slnc 600]]
On the right, after step C A rekey: a different key. [[slnc 600]]
Below, a service that lost its key, and tries with another one. [[slnc 300]] The connection to the C A fails, so it is refused. [[slnc 300]] Only the holder of the key renews.
"""
speech = """
Here is the output. [[slnc 400]] Before: a random serial, twenty four hours. [[slnc 400]] After renew: a new serial, the same key, ends later. [[slnc 400]] After rekey: a different key. [[slnc 400]] And with another key: refused, the T L S call to the C A fails.
"""
rows = { renew = "active ok" }
console = [
    ["BEFORE THE RENEWAL (www.shop.localhost):", "code"],
    ["  serial <random>, 24 hours, key EC", "muted"],
    ["AFTER step ca renew (the certificate and its key):", "code"],
    ["  renewed, 24 hours", "muted"],
    ["  a new serial: true; the same key: true; ends later: true", "ok"],
    ["AFTER step ca rekey:", "code"],
    ["  renewed; a different key: true", "ok"],
    ["A SERVICE THAT LOST ITS KEY (renews with another key):", "code"],
    ["  -> refused (the key does not match: the TLS call fails)", "ok"],
    ["  <- ONLY THE HOLDER OF THE KEY RENEWS", "bad"],
]

[[act]]
title = "Revocation, and the bill"
summary = "The revoked acme certificate cannot be renewed and is the one entry of a list signed by the intermediate, current for 5 minutes; a checking client refuses it, a client that never checks accepts it, one without a list fails closed; both CA keys sit on the CA's disk."
detail = """
`step ca revoke` revokes the acme certificate: revoked true, and a renewal afterwards is refused (not authorized).
The CA's revocation list, from GET /1.0/crl, is signed by Shop Internal CA Intermediate CA (true), has 1 entry, the acme serial (true), and is current for 5 minutes (next update - this update).
A client that checks the list refuses the acme certificate (REVOKED); a client that never checks accepts it; a client that wants to check and has no list refuses (UNDETERMINED_REVOCATION_STATUS), failing closed; www.shop.localhost against the same list is accepted.
The bill: the issuing key is online in `secrets/intermediate_ca_key` and the root key in `secrets/root_ca_key` on the same disk, both encrypted, so the machine and the password are what the whole trust rests on.
"""
figure = "revocation_checks"
figure_title = "A signed list, and four clients"
figure_speech = """
Fifth demo: revocation, and the bill. [[slnc 400]] Top left, the acme certificate's key is reported stolen, and the C A revokes it. [[slnc 300]] A renewal afterwards is refused. [[slnc 600]]
Below, the revocation list the C A publishes. [[slnc 300]] Signed by the issuing authority, one entry, the acme serial. [[slnc 300]] And it is current for only five minutes, so clients must fetch it often. [[slnc 600]]
On the right, four clients. [[slnc 300]] One checks the list, and refuses: revoked. [[slnc 300]] One never checks, and accepts the revoked certificate. [[slnc 300]] One wants to check, has no list, and refuses: it fails closed. [[slnc 300]] And the healthy certificate passes the same list.
"""
speech = """
Here is the output. [[slnc 400]] Revoked, and a renewal afterwards is refused. [[slnc 400]] The list: signed by the issuing authority, one entry, the acme serial, current for five minutes.
[[page]]
The checks. [[slnc 300]] Checking: revoked. [[slnc 300]] Never checking: accepted. [[slnc 300]] No list: refused, it fails closed. [[slnc 300]] The other certificate: accepted. [[slnc 400]] And the bill: both C A keys sit on the C A's own disk, encrypted with one password.
"""
rows = { revoke = "active wrong" }
console = [
    ["THE REVOCATION (step ca revoke, the acme certificate):", "code"],
    ["  revoked: true", "ok"],
    ["  a renewal afterwards", "muted"],
    ["    -> refused (not authorized)", "ok"],
    ["THE REVOCATION LIST (GET /1.0/crl):", "code"],
    ["  signed by    Shop Internal CA Intermediate CA: true", "ok"],
    ["  entries      1; the acme serial: true", "ok"],
    ["  current for  5 minutes (next update - this update)", "muted"],
    ["---", ""],
    ["THE CHECKS:", "code"],
    ["  acme, the client checks the list", "muted"],
    ["    -> refused (REVOKED)", "ok"],
    ["  acme, a client that never checks", "muted"],
    ["    -> accepted  <- A REVOKED CERTIFICATE STILL WORKS", "bad"],
    ["  acme, a client that wants to check but has no list", "muted"],
    ["    -> refused (UNDETERMINED_REVOCATION_STATUS)", "ok"],
    ["    <- NO LIST, SO NO: IT FAILS CLOSED", "amber"],
    ["  www.shop.localhost, the same list", "muted"],
    ["    -> accepted", "ok"],
    ["THE KEYS THE CA HOLDS (the bill):", "code"],
    ["  issuing  secrets/intermediate_ca_key, online, encrypted: true", "ok"],
    ["  root     secrets/root_ca_key, same disk, encrypted: true", "ok"],
]

