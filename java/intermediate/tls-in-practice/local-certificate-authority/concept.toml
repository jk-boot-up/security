Here is the output. [[slnc 400]] The request: the name, and an elliptic curve public key. [[slnc 300]] The private key stays with the team. [[slnc 400]] The authority's five checks, all true. [[slnc 400]] The certificate: serial one thousand and two, with the request's own public key.
[[page]]
The forged request is refused: it is not signed by the key it carries. [[slnc 400]] The web team may not ask for the payments name, alone or mixed with its own. [[slnc 400]] And the orders team gets a client certificate, for calling other services, which the chain check accepts.
