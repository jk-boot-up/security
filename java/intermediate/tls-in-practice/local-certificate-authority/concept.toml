title = "How To Use It"
body = ["Explain what a certificate authority signs and what a", "signing request proves", "Describe how path length and name constraints limit a", "CA", "Explain why revocation depends on the client, and what", "failing closed means for a list", "Compare short-lived certificates with revocation lists"]
narration = "So, how do you use it? [[slnc 400]] Keep the root offline, issue from a constrained authority, apply the policy in the issuer, and prefer short-lived certificates renewed by automation over revocation lists that clients may not check. [[slnc 500]] Use ACME and a maintained C A such as step-ca rather than your own code in production."

