[[act]]
title = "Issuing from a signing request"
summary = "payments-team's request carries only the public key; the authority makes five checks in order and signs serial 1002 with exactly that key; a forged request and another team's names are refused; orders-team gets a client certificate."
detail = """
payments-team makes a key pair and signs a request for payments.shop.internal with its private key. The request carries the names and the public key (EC, 256-bit curve); the private key stays with the team.
The authority checks, in order: the signature verifies with the request's own key (proof of possession), there is at least one name, the name is inside shop.internal, payments-team may ask for it, and 90 days is within the server profile. All true, so it signs serial 1002, whose public key is exactly the request's.
A request carrying payments-team's public key but signed by another key is refused: not signed by the key it carries. web-team asking for payments.shop.internal is refused, and one forbidden name refuses a mixed request. orders-team gets serial 1003 for clientAuth, 30 days, and the chain check accepts it.
"""
figure = "signing_request"
figure_title = "A signing request, the checks, the certificate"
figure_speech = """
Second demo: issuing from a signing request. [[slnc 400]] On the left, the request. [[slnc 300]] The payments team made a key pair. [[slnc 300]] The request carries the name, and the public key. [[slnc 300]] The private key never leaves the team. [[slnc 300]] Instead, the team signs the request with it. [[slnc 700]]
In the middle, the authority's five checks, in order. [[slnc 300]] First, the signature verifies with the key inside the request. [[slnc 300]] That proves the sender holds the matching private key, without ever showing it. [[slnc 300]] Then a name, inside the domain, allowed for this team, for a lifetime the profile allows. [[slnc 600]]
On the right, the certificate: serial one thousand and two, carrying exactly the request's public key. [[slnc 700]]
Below, two refusals. [[slnc 300]] A forged request, with the payments key but someone else's signature. [[slnc 300]] And the web team, asking for a name that belongs to payments.
"""
