[docs.problem]
scenario = """
An online store's internal services need certificates for their own names, and the store wants to issue and take them back itself.
"""
naive = """
Sign whatever is asked for, with one long-lived CA that can name anything, and rely on a revocation list that clients may never fetch.
"""
deliver = [
    "A root and an issuing authority as real X.509 certificates with path length and name constraints.",
    "An issuer that checks proof of possession, names, allow-lists and lifetimes.",
    "Revocation lists read by the JDK's PKIX validator, with and without checking.",
    "A short-lived certificate that renews itself, and an inventory of expiries.",
]

[docs.prerequisites]
required = [
    "Java basics",
    "The beginner tls-handshake project, or an idea of certificates and chains",
]
not_required = [
    "OpenSSL: the authority is plain Java with Bouncy Castle",
    "A network: the clients validate chains in memory",
]
install = []

[docs.session]
objectives = [
    "explain what a certificate authority signs and what a signing request proves",
    "describe how path length and name constraints limit a CA",
    "explain why revocation depends on the client, and what failing closed means for a list",
    "compare short-lived certificates with revocation lists",
]
walkthrough = """
Run act one and ask what stops a stolen issuer from naming pay.example. In act three, ask which client is protected and which is not. In act four, ask what the store must automate to live with 24-hour certificates.
"""
exercises = [
    "Add an OCSP-style status check and compare its failure modes with the list.",
    "Add a profile for 7-day certificates and decide which services should use it.",
    "Make the inventory send a warning 14 days before expiry and test it on the fixed clock.",
    "Add a second issuing authority limited to a different domain and show that neither can name the other's domain.",
]

[docs.explained]
sentence = """
A certificate authority is a signing policy plus a key: the policy decides what may be said, the name constraint limits the key's reach, and short lifetimes make taking a certificate back almost unnecessary.
"""
verdict = """
Keep the root offline, issue from a constrained authority, apply the policy in the issuer, and prefer short-lived certificates renewed by automation over revocation lists that clients may not check. Use ACME and a maintained CA such as step-ca rather than your own code in production.
"""
recognise = [
    "`basicConstraints: CA:TRUE, pathlen:0` in an intermediate certificate.",
    "`X509v3 Name Constraints: Permitted: DNS:...` in `openssl x509 -text`.",
    "`CRL Distribution Points` and `Authority Information Access` in a certificate.",
    "A certificate-expiry outage in an incident report.",
]

[spec]
purpose = """
Teach how an internal certificate authority issues, constrains and revokes certificates, and why short-lived certificates beat revocation.
"""
nongoals = [
    "A production CA, an HSM or an ACME server (the -with-step-ca version covers the tooling).",
    "OCSP, certificate transparency and the public web PKI.",
    "Cross-signing and multiple roots.",
]
problem = """
Teams issue certificates by hand with no policy, long lifetimes and no plan for taking one back.
"""
roles = [["The authority and its policy", "`CertificateAuthority`, `Profile`, `RefusedException`"], ["Requests and keys", "`Csr`, `Keys`, `Issued`"], ["Clients", "`Validator`, and `ChainSteps`, which redoes its checks by hand"], ["Lifetime", "`ShortLived`, `Inventory`"], ["Entry point", "`LocalCaDemo`"]]
requirements = [
    "A request must prove possession of the key it carries.",
    "The issuer enforces names, allow-lists and the profile's maximum lifetime.",
    "The issuing authority cannot create authorities and cannot name anything outside shop.internal.",
    "A revoked certificate is refused by clients that check a current list, and an out-of-date list fails closed.",
    "A short-lived certificate renews at two thirds of its life with a new key and expires if the job stops.",
    "The demo prints the same output on every run.",
]

