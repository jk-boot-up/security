# concept.toml: everything about this project that is not Java code.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "local-certificate-authority"
level = "intermediate"
module = "tls-in-practice"
title = "A Local Certificate Authority"
short_title = "Local CA"
package = "ca"
main_class = "CaDemo"
tagline = "A certificate is a signed claim about a name, and revocation is only as good as the list the client has"
bold = "A certificate authority signs the claim that a key belongs to a name; a client trusts the authority's root, checks the chain, the dates, the name in the subject alternative name and a current revocation list, and short-lived certificates make most revocation unnecessary."
domain = "a shop's private certificate authority"
domain_note = ""
youtube_description = "A small certificate authority in Java: real X.509 certificates, chain validation, renewal, revocation lists and short-lived certificates."
thumb_lines = ["BUILD A LOCAL", "CERTIFICATE AUTHORITY"]
thumb_code = "CertPathValidator + CRL"
youtube_title = "Build a Local Certificate Authority in Java (X.509, CRL, Renewal)"
youtube_tags = ["certificate authority", "x509", "crl", "pki", "tls", "java", "application security"]

[readme]
intro = """
A **certificate** is a signed statement: "this public key belongs to shop.example". The signer is a **certificate authority (CA)**, and a client that trusts the CA's **root certificate** can trust every certificate that CA signs.
This project builds a small CA in plain Java, with real **X.509 version 3 certificates** and **version 2 revocation lists (CRLs)** written as DER bytes by hand and read back by the JDK's own PKIX code, so every check is the one a real client performs.

What the CA does, and what a client does with it, in the order this project shows them:
- **Issue** a server certificate with a serial number, dates, a **subject alternative name** list and the *server authentication* usage; the CA key never leaves the CA.
- **Verify** like a client: the chain to a trusted root, the dates at a given moment, the signature, whether each certificate may sign others (**basic constraints**), the name in the SAN (never the common name), and the usage.
- **Revoke** a certificate and **publish a list**. A client with no current list refuses (**hard fail**); a client that accepts "no list" is trusting a stolen key.
- **Renew** before expiry, for the same key and names, with a new serial number.
- **Short-lived certificates** (hours, not months) cut the exposure window without any list.

**Maps to:** OWASP Top 10 (2025) A04 Cryptographic Failures · CWE-295 · CWE-299 · RFC 5280 (X.509 and CRL profile) · RFC 6125 (names in certificates) · NIST SP 800-57.
"""
analogy = """
A passport office stamps a passport that says this photo belongs to this name. A border guard trusts the office, not the traveller. The guard also checks that the passport is not expired, that the name matches, that the stamp is genuine, and that the passport
is not on this morning's list of lost ones. A passport that lasts one day would need no list.
"""
scenario = """
A shop runs its own internal services on names like shop.example and wants TLS between them without a public CA. The demo builds a root CA, issues and renews certificates, and runs a client verifier against honest and dishonest certificates,
using a fixed clock so that expiry and revocation are exact.
"""
costs = [
    "**The root key is the whole system.** Keep it offline and use an intermediate for daily issuing; this project keeps one key to stay small.",
    "**Revocation lists must be fetched and fresh.** A client that cannot get one either fails (safe, but an outage) or ignores it (unsafe). Browsers moved away from CRLs for this reason.",
    "**Short-lived certificates need automation:** renewal must be unattended and monitored, or short lives become outages.",
    "**Every client must be given the root,** and removing it later is hard. Scope it: one root for one purpose, and constrain names where the tools allow.",
    "**Wildcards widen the damage of one stolen key** to every name under the domain.",
]
too_much = """
For public websites use a public CA and ACME; do not run your own. Run a private CA for internal service-to-service TLS, device identity and tests, and prefer an existing tool (step-ca, Vault PKI) to this teaching code in production.
"""
met_before = [
    "The padlock and \"Certificate details\" in a browser.",
    "`keytool -genkeypair`, `openssl req -x509` and `-----BEGIN CERTIFICATE-----`.",
    "\"Your connection is not private\" with NET::ERR_CERT_DATE_INVALID or a name mismatch.",
    "CRL and OCSP in the certificate's authority information.",
]
where = """
This project is in [tls-in-practice](..) and builds on the beginner [tls-handshake](../../../beginner/transport-security/tls-handshake) project, which explained certificates and the chain of trust from the client's side.
The with-step-ca version runs the same ideas against a real CA with ACME.
"""
twin = """
The certificates and lists are real DER built by the project's own small encoder and read back by `CertificateFactory`; chain and revocation checking is the JDK's PKIX `CertPathValidator`. Keys are ECDSA P-256 and are random; the clock is fixed so the output is exact.
"""
test_note = "Keys are random and never printed, serial numbers count from 1000, and the clock is fixed, so the demo prints the same text on every run."

[[act]]
title = "Issue a certificate and trust the root"
summary = "The CA issues a 90-day certificate for shop.example and *.shop.example, and the client that trusts the root accepts it."
detail = """
The root is self-signed and valid for 3650 days. The CA signs a leaf certificate with serial 1000, valid for 90 days, for the names shop.example and *.shop.example. A client that was given the root certificate checks the chain,
the dates and the name, with a fresh revocation list, and accepts.
"""
speech = """
First demo: issue a certificate and trust the root. [[slnc 400]] The authority has a root key and a self-signed root certificate. [[slnc 300]] It signs a certificate for the shop's names, valid for ninety days. [[slnc 600]] A client that trusts the root accepts it.
"""
rows = { issue = "active ok" }
console = [
    ["root: CN=Demo Root CA, self-signed, valid 3650 days", "muted"],
    ["leaf: CN=shop.example, issuer=CN=Demo Root CA, serial 1000, valid 90 days", "muted"],
    ["connect to shop.example -> accepted", "ok"],
]

[[act]]
title = "What a client refuses"
summary = "A wildcard covers one label, not two; other names, expired, other-authority, forged, self-signed certificates and a leaf that signs another certificate are all refused."
detail = """
www.shop.example matches the wildcard, a.b.shop.example does not (the wildcard covers one label), and evil.example is not in the certificate. 100 days later the certificate has expired. A certificate from another authority, one that claims our
authority's name but is signed by another key, and a self-signed server certificate are not trusted. A leaf certificate cannot sign another certificate, because its basic constraints say it is not a CA.
"""
speech = """
Second demo: what a client refuses. [[slnc 400]] A wildcard covers one label only. [[slnc 300]] Another name is refused. [[slnc 300]] An expired certificate is refused. [[slnc 600]]
A certificate from another authority, a forged signature, and a self-signed certificate are all refused. [[slnc 300]] And a leaf certificate cannot sign other certificates.
"""
rows = { refuse = "active ok" }
console = [
    ["connect to www.shop.example (wildcard) -> accepted", "ok"],
    ["connect to a.b.shop.example -> refused: name is not in the certificate", "ok"],
    ["100 days later (expired) -> refused: certificate expired", "ok"],
    ["issued by another authority -> refused: not issued by a trusted authority", "ok"],
    ["claims our CA, signed by another key -> refused: signature does not match the issuer", "ok"],
    ["a leaf that signs another certificate -> refused: a certificate in the chain may not sign certificates", "ok"],
]

[[act]]
title = "Revocation"
summary = "On day 10 the key is stolen and the CA revokes serial 1000: the client refuses with the new list, and also with a stale list or no list at all."
detail = """
The CA revokes serial 1000 on day 10 and publishes list number 2. A client with that list refuses the certificate. A client that has only the list from day 0 (now stale), no list at all, or the new list two days after its next update
cannot know the status, and refuses as well: hard fail. A client that treated a missing list as "fine" would keep trusting the stolen key. The cost is that a CA outage becomes a connection outage.
"""
speech = """
Third demo: revocation. [[slnc 400]] On day ten the key is stolen, and the authority revokes the certificate and publishes a new list. [[slnc 600]]
A client with the new list refuses it. [[slnc 300]] A client with only an old list, or no list, cannot know, and refuses too. [[slnc 600]]
Accepting a missing list would keep trusting the stolen key. The price is that a list outage becomes a connection outage.
"""
rows = { revoke = "active ok" }
console = [
    ["with the new list -> refused: certificate revoked", "ok"],
    ["with the list from day 0 (a stale one) -> refused: revocation status unknown (no current list)", "ok"],
    ["with no list at all -> refused: revocation status unknown (no current list)", "ok"],
]

[[act]]
title = "Renewal"
summary = "Serial 1000 is renewed as serial 1001 with the same key; on day 100 the old certificate is expired and the renewed one is accepted."
detail = """
Renewal is a new certificate for the same key and the same names with a new serial number and new dates, issued before the old one expires (here on day 80). On day 100 the old certificate is refused as expired and the renewed one is accepted.
Renewing with the same key is easy, but renewing with a new key limits the damage of an unnoticed theft.
"""
speech = """
Fourth demo: renewal. [[slnc 400]] Before the certificate expires, the authority issues a new one for the same key and names, with a new serial number. [[slnc 600]]
On day one hundred the old one is expired, and the renewed one is accepted. [[slnc 300]] A new key at each renewal limits the damage of an unnoticed theft.
"""
rows = { renew = "active ok" }
console = [
    ["serial 1000 renewed as serial 1001, same key: true", "muted"],
    ["old certificate on day 100 -> refused: certificate expired", "ok"],
    ["renewed certificate on day 100 -> accepted", "ok"],
]

[[act]]
title = "Short-lived certificates instead of revocation"
summary = "With daily lists a stolen key works up to 24 hours after the theft is noticed; with 8-hour certificates it stops after at most 8 hours with no list; a nine-hour-old certificate is expired."
detail = """
If the CA publishes a list every 24 hours, a stolen key can be used until clients fetch the new list: up to 24 hours after the theft is noticed. If the certificates themselves last 8 hours, the stolen key stops working after at most 8 hours
whatever anyone fetches. The 8-hour certificate is accepted now and refused as expired nine hours later. This is why modern private CAs favour short lives and automatic renewal.
"""
speech = """
Fifth demo: short-lived certificates instead of revocation. [[slnc 400]] With a list every day, a stolen key can work for a day. [[slnc 600]]
With certificates that last eight hours, it stops after at most eight hours, whatever anyone fetches. [[slnc 300]] The certificate is accepted now, and expired nine hours later.
"""
rows = { short = "active ok" }
console = [
    ["revocation: the stolen key is usable up to 24 hours after the theft is noticed", "amber"],
    ["8-hour certificates: the stolen key stops working after at most 8 hours", "ok"],
    ["short-lived certificate, 9 hours later -> refused: certificate expired", "ok"],
]

[animation]
subtitle = "A small certificate authority, and everything a client checks before it trusts a name."
boxes = [
    ["issue", "Issue", "sign a key, a name and dates"],
    ["refuse", "What a client refuses", "name, dates, issuer, signature, CA flag"],
    ["revoke", "Revoke", "a list the client must have"],
    ["renew", "Renew", "a new serial, before expiry"],
    ["short", "Short lives", "expiry does the revoking"],
]

[docs.problem]
scenario = """
A shop runs internal services that talk TLS to each other, and wants certificates for its own names without buying them from a public CA.
"""
naive = """
Create one self-signed certificate and tell every client to trust it, forever.
"""
deliver = [
    "A CA with a root key that signs real X.509 certificates built as DER.",
    "A client verifier using the JDK's PKIX validator with a fixed clock, revocation lists and name checks.",
    "Issue, renew, revoke and publish a list.",
    "A comparison of revocation with short-lived certificates.",
]

[docs.prerequisites]
required = [
    "Java basics",
    "The beginner tls-handshake project, or an idea of certificates and the chain of trust",
]
not_required = [
    "OpenSSL or keytool",
    "Bouncy Castle: the certificates are built by hand",
]
install = []

[docs.session]
objectives = [
    "name the parts of an X.509 certificate and say what each protects",
    "explain what a client checks when it validates a chain",
    "explain why the subject alternative name, not the common name, is used",
    "describe CRLs, hard fail and why short-lived certificates are attractive",
]
walkthrough = """
Run act two and ask which check refused each certificate. In act three, ask what a client should do when it cannot fetch the list, and what each answer costs. In act five, compare the two exposure windows.
"""
exercises = [
    "Add an intermediate CA between the root and the leaf and validate the three-certificate chain.",
    "Add a `pathLen` constraint to the intermediate and test that it cannot issue another intermediate.",
    "Add name constraints so that the CA can only issue for *.shop.example.",
    "Make renewal use a new key and compare what it protects against.",
]

[docs.explained]
sentence = """
A certificate authority signs a key-to-name claim; clients check the chain, dates, name, usage and a current revocation list, and short lifetimes shrink the damage of a stolen key more reliably than revocation.
"""
verdict = """
Use a public CA with ACME for public names. For private names, run a CA with an offline root and an intermediate for issuing, short lifetimes with automatic renewal, name constraints, and clients that hard-fail on missing revocation data where they check it.
"""
recognise = [
    "`-----BEGIN CERTIFICATE-----` files and `keytool -importcert`.",
    "`X509v3 Subject Alternative Name` and `X509v3 Basic Constraints: CA:TRUE` in `openssl x509 -text`.",
    "ACME clients renewing every 60 days.",
    "A finding titled \"Improper Certificate Validation\" with CWE-295.",
]

[spec]
purpose = """
Teach how a certificate authority works by building one with real X.509 and CRL bytes, then validating honest and dishonest certificates like a client, and comparing revocation with short lifetimes.
"""
nongoals = [
    "Production CA operations: key ceremonies, HSMs, auditing.",
    "OCSP and certificate transparency.",
    "ACME and the step-ca version: local-certificate-authority-with-step-ca.",
]
problem = """
Teams run private CAs with long-lived certificates and no revocation plan, and clients that ignore the checks that make a certificate meaningful.
"""
roles = [["DER encoding", "`Der`"], ["Certificate and CRL building", "`Certificates`"], ["The CA", "`LocalCa`"], ["The client's checks", "`Verifier`"], ["Entry point", "`CaDemo`"]]
requirements = [
    "The CA issues X.509 v3 certificates with SAN, server-auth usage and basic constraints that the JDK reads and validates.",
    "The client refuses wrong names, expired, unknown-issuer, forged, self-signed and leaf-signed certificates.",
    "Revoked certificates are refused with a current list, and a stale or missing list is refused too.",
    "Renewal keeps the key and names and changes serial and dates.",
    "The demo prints the same output on every run.",
]

[[diagram]]
name = "architecture-diagram"
kind = "flow"
title = "A private CA and the clients that trust it"
caption = "Clients are given the root once; after that every certificate the CA signs is trusted until it expires or is listed."
nodes = [
    { id = "ca", label = "Certificate authority", sub = "root key, serial numbers", col = 0, row = 0, colour = "green" },
    { id = "server", label = "Shop server", sub = "key + certificate", col = 1, row = 0, colour = "client" },
    { id = "client", label = "Client", sub = "trusts the root", col = 2, row = 0, colour = "accent" },
    { id = "crl", label = "Revocation list", sub = "signed, with a next update", col = 1, row = 1, colour = "amber", shape = "store" },
]
edges = [
    { from = "ca", to = "server", label = "signs certificate" },
    { from = "server", to = "client", label = "presents it in TLS" },
    { from = "ca", to = "crl", label = "publishes", dashed = true },
    { from = "client", to = "crl", label = "fetches", dashed = true },
]

[[diagram]]
name = "class-diagram"
kind = "class"
title = "The classes and what they hold"
caption = "The CA builds; the client verifies; the DER encoder is shared."
nodes = [
    { id = "ca", label = "LocalCa", sub = ["issue()", "renew()", "revoke()", "publishCrl()"], col = 0, row = 0, colour = "green" },
    { id = "certs", label = "Certificates", sub = ["build(spec, key, signer)", "crl(...)"], col = 1, row = 0, colour = "accent" },
    { id = "der", label = "Der", sub = ["tlv, oid, integer, time"], col = 2, row = 0, colour = "amber" },
    { id = "ver", label = "Verifier", sub = ["check(chain, host, crls, at)"], col = 1, row = 1, colour = "client" },
]
edges = [
    { from = "ca", to = "certs", label = "uses" },
    { from = "certs", to = "der", label = "encodes with" },
    { from = "ver", to = "ca", label = "trusts the root of" },
]

[[diagram]]
name = "data-flow-diagram"
kind = "flow"
title = "What a client checks, in order"
caption = "Any failure ends the connection."
nodes = [
    { id = "chain", label = "Chain", sub = "signatures to a trusted root, CA flags", col = 0, row = 0, colour = "client" },
    { id = "dates", label = "Dates", sub = "valid at this moment", col = 1, row = 0, colour = "accent" },
    { id = "revoked", label = "Revocation", sub = "a current list says no", col = 2, row = 0, colour = "amber" },
    { id = "name", label = "Name and use", sub = "SAN, server authentication", col = 3, row = 0, colour = "green" },
]
edges = [
    { from = "chain", to = "dates" },
    { from = "dates", to = "revoked" },
    { from = "revoked", to = "name" },
]

[[diagram]]
name = "sequence-diagram"
kind = "sequence"
title = "Issuing and using a certificate"
participants = ["Shop server", "CA", "Client"]
steps = [
    ["Shop server", "CA", "public key + names"],
    ["CA", "Shop server", "certificate (serial 1000, 90 days)", "reply"],
    ["Client", "Shop server", "TLS connection to shop.example"],
    ["Shop server", "Client", "certificate"],
    ["note", "Client", "chain, dates, list, name: accepted"],
]

[[diagram]]
name = "uml-diagram"
kind = "sequence"
title = "Revocation after a theft"
participants = ["Operator", "CA", "Client"]
steps = [
    ["Operator", "CA", "key stolen: revoke serial 1000"],
    ["CA", "CA", "sign list number 2"],
    ["Client", "CA", "fetch the list"],
    ["CA", "Client", "list with serial 1000", "reply"],
    ["note", "Client", "refuses the certificate"],
]

[[diagram]]
name = "uml-diagram-2"
kind = "sequence"
title = "A leaf cannot sign certificates"
participants = ["Attacker", "Client"]
steps = [
    ["Attacker", "Client", "bank.example certificate signed by the shop's leaf key + the shop's leaf"],
    ["note", "Client", "the leaf's basic constraints: not a CA"],
    ["Client", "Attacker", "refused", "reply"],
]

[[diagram]]
name = "threat-model-diagram"
kind = "flow"
title = "Threat model: trust boundaries and threats"
caption = "Dashed boxes are trust boundaries. Rose tags show where each threat in the table applies."
zones = [
    { label = "The CA", nodes = ["ca"], colour = "green" },
    { label = "Services", nodes = ["server", "client"], colour = "amber" },
    { label = "Outside", nodes = ["attacker"], colour = "red" },
]
nodes = [
    { id = "ca", label = "CA and root key", sub = "signs everything", col = 0, row = 0, colour = "green", threats = ["T1"] },
    { id = "server", label = "Shop server", sub = "holds its key", col = 1, row = 0, colour = "client", threats = ["T2"] },
    { id = "client", label = "Client", sub = "validates", col = 2, row = 0, colour = "accent", threats = ["T3", "T4"] },
    { id = "attacker", label = "Attacker", sub = "forged and self-signed certificates", col = 1, row = 1, colour = "red", threats = ["T3", "T4"] },
]
edges = [
    { from = "ca", to = "server", label = "certificate" },
    { from = "server", to = "client", label = "TLS", threats = ["T2"] },
    { from = "attacker", to = "client", label = "bad certificates", colour = "red", dashed = true, threats = ["T3", "T4"] },
]

[threatmodel]
scope = """
A private certificate authority and the clients that trust its root. It covers issuing, validation, renewal and revocation of server certificates.
It does not cover the physical security of the root key, OCSP, or certificate transparency.
"""
assets = [
    "The root private key.",
    "The trust that clients place in the root.",
    "The servers' private keys.",
]
actors = [
    "The operator running the CA.",
    "A client validating a server.",
    "An attacker with a self-made certificate, a stolen server key, or a leaf key.",
]
boundaries = [
    "CA to servers: certificates go out, keys never do.",
    "Server to client: a certificate is untrusted until validated.",
]
assumptions = [
    "The root key is not compromised, and clients have the genuine root certificate.",
    "Clients have a reasonably correct clock.",
]
out_of_scope = [
    "A stolen root key: the whole system must be rebuilt.",
    "Public CAs and certificate transparency.",
]
tests = [
    "`CaTest` checks the DER encodings, what the JDK reads back, names, dates, issuers, forged signatures, CA flags, revocation with current, stale and missing lists, and renewal.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next project, tls-misconfigurations, checks the TLS servers that use these certificates for weak settings.
"""

[[threat]]
id = "T1"
stride = "E"
threat = "The CA key signs a certificate for a name the requester does not control"
where = "`LocalCa.issue`"
control = "Issue only after the requester proves control of the name; offline root, name constraints"
residual = "The demo CA signs whatever it is asked: a real one needs an approval step"

[[threat]]
id = "T2"
stride = "I"
threat = "A server's private key is stolen and used to impersonate it"
where = "Shop server"
control = "Short-lived certificates, revocation, new key at renewal"
residual = "Exposure until expiry or until clients have the new list"

[[threat]]
id = "T3"
stride = "S"
threat = "A forged, self-signed, other-authority or leaf-signed certificate is accepted"
where = "`Verifier.check`"
control = "Chain to the trusted root, signature, basic constraints, usage and name checks through the PKIX validator"
residual = "A client that skips validation"

[[threat]]
id = "T4"
stride = "R"
threat = "A revoked certificate stays trusted because the client has no current list"
where = "`Verifier.check` revocation"
control = "Hard fail on a missing or stale list; short lifetimes"
residual = "Hard fail turns a list outage into a connection outage"
