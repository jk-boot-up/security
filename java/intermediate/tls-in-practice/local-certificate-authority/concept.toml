[[scene]]
key = "01-poster"
kind = "poster"
title = "A Local Certificate Authority"
narration = "Hello, and welcome. [[slnc 400]] This video explains how a certificate authority, or C A, works, by building a small one, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A certificate is a signed statement that a public key belongs to a name. [[slnc 300]] A certificate authority is whoever signs those statements, and every client that trusts it believes them. [[slnc 300]] So the authority must apply its own policy, limit its own reach, and have a way to take a certificate back. [[slnc 600]] Think of the office that issues staff badges. [[slnc 300]] It checks who you are before printing one, and a lost badge is only stopped at doors that check the lost list. [[slnc 600]] Our example is an online store's internal services."

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online store's internal services:", "  www, payments, orders, cart", "call each other over TLS.", "", "The demo runs an offline root, an issuing CA,", "four teams asking for certificates,", "and clients built on the JDK's own validator."]
narration = "Here is the scenario. [[slnc 400]] An online store's internal services, the web site, payments, orders and the cart, call each other over T L S. [[slnc 500]] The store runs its own certificate authority: an offline root, and an issuing authority below it. [[slnc 500]] Four teams ask for certificates, and clients check them with the J D K's own certificate validator, on a fixed clock, so every day of the story can be replayed."

[[scene]]
key = "02-words"
kind = "bullets"
title = "The Words"
body = ["Certificate: a signed claim that a key belongs to a name", "Chain: certificate, issuing CA, root", "Signing request: a name and a public key, self-signed", "Path length, name constraint: limits on a CA", "Revocation list: serials taken back, with a next update"]
narration = """Before the demos, the words. [[slnc 500]] A certificate is a signed claim that a public key belongs to a name. [[slnc 500]] A chain links a certificate to the issuing C A that signed it, and that one to the root. [[slnc 500]] A signing request carries a name and a public key, and is signed with the matching private key. [[slnc 500]] Path length and name constraint are limits written into a C A's own certificate: how many authorities may sit below it, and which names it may use. [[slnc 500]] And a revocation list names the serials taken back, with the date of its next update."""

[[scene]]
key = "02-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "02-chain"
kind = "figure"
title = "Three certificates in a chain"
body = "chain_of_trust"
narration = """Let's see the whole idea on one picture. [[slnc 400]] Three certificates, from the demo. [[slnc 600]] On the left, the root. [[slnc 300]] It signs itself, lives twenty years, and may certify one level below it. [[slnc 300]] Then it goes offline. [[slnc 600]] In the middle, the issuing C A, signed by the root. [[slnc 300]] Path length zero: it may not create more authorities. [[slnc 300]] And a name constraint: only names under shop dot internal. [[slnc 600]] On the right, the certificate for w w w dot shop dot internal, signed by the issuing C A. [[slnc 300]] Ninety days, for a T L S server, and not an authority. [[slnc 600]] A client trusts only the root. [[slnc 300]] It believes the right hand certificate because each signature leads back to it, and every limit on the way holds."""

[[scene]]
key = "03-acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "04-costs"
kind = "bullets"
title = "What It Costs"
body = ["The root key must stay offline", "Revocation needs publishing and checking", "Short-lived certificates need automation", "Name constraints help only clients that check", "The authority is a high-value target"]
narration = "Nothing is free. [[slnc 400]] Here is what it costs. [[slnc 500]] The root key must stay offline, which makes every use of it a ceremony. [[slnc 500]] Revocation lists must be published, and checked by every client. [[slnc 500]] Short-lived certificates need automation that never stops. [[slnc 500]] A name constraint helps only clients that check it. [[slnc 300]] And the authority itself becomes a high-value target."

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["A padlock, and \"issued by\" in the browser", "CRL distribution points in a certificate", "An outage caused by an expired certificate", "Let's Encrypt certificates renewed by ACME"]
narration = "You have probably met this already. [[slnc 400]] The padlock in a browser, and the issued by line behind it, is a certificate authority's signature. [[slnc 500]] The C R L distribution point, inside a certificate, says where its revocation list lives. [[slnc 500]] An outage caused by an expired certificate is the renewal that stopped. [[slnc 500]] And Let's Encrypt certificates, which last weeks and are renewed by A C M E, are the short lives this project ends with."

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Keep the root offline", "Issue from a constrained authority", "The issuer applies the policy", "Short-lived certificates, renewed automatically", "ACME and a maintained CA in production"]
narration = "So, how do you use it? [[slnc 400]] Keep the root key offline. [[slnc 300]] Issue from an authority limited by a name constraint and a path length. [[slnc 500]] Let the issuer apply the policy, never the requester. [[slnc 500]] Prefer short-lived certificates, renewed by automation, over revocation lists that clients may not check. [[slnc 500]] And in production, use A C M E, and a maintained authority such as step C A, rather than your own code."

[[scene]]
key = "12-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add an OCSP-style status check", "and compare how it fails with the list."]
narration = "That's a local certificate authority. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] A certificate authority is a signing policy plus a key: the policy decides what may be said, the name constraint limits the key's reach, and short lifetimes make taking a certificate back almost unnecessary. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add an O C S P style status check, and compare how it fails with the revocation list. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] Bouncy Castle builds the certificates, and the J D K's own validator checks them, on a fixed clock. [[slnc 300]] Here are the classes that matter."""

[[class]]
name = "CertificateAuthority"
what = "the issuer: the policy, and the limits in its own certificate"
[[class.part]]
title = "the policy, applied by the issuer"
code = """
if (!Csr.provesPossession(request)) {
    throw new RefusedException("not signed by the key it carries");
}
...
if (!inDomain(lower)) {
    throw new RefusedException(name + " is outside " + DOMAIN);
}
if (!allowed.contains(lower)) {
    throw new RefusedException("may not ask for " + name);
}
"""
speech = """Every request goes through one method. [[slnc 300]] It checks proof of possession first, then that each name is inside the domain, and on this team's list. [[slnc 300]] Any failure refuses the whole request, and goes into the audit log."""
[[class.part]]
title = "path length 0 and a name constraint"
code = """
case ISSUING -> {
    builder.addExtension(Extension.basicConstraints, true, new BasicConstraints(0));
    ...
    GeneralSubtree permitted = new GeneralSubtree(new GeneralName(GeneralName.dNSName, DOMAIN));
    builder.addExtension(Extension.nameConstraints, true,
            new NameConstraints(new GeneralSubtree[] {permitted}, null));
"""
speech = """When the root signs the issuing C A, it writes two limits into that certificate. [[slnc 300]] Path length zero, and names only under shop dot internal. [[slnc 300]] Both are marked critical, so every client must enforce them."""

[[class]]
name = "Csr"
what = "signing requests and proof of possession"
[[class.part]]
title = "the request's own key verifies its signature"
code = """
return request.isSignatureValid(
        new JcaContentVerifierProviderBuilder().build(request.getSubjectPublicKeyInfo()));
"""
speech = """Proof of possession is one line. [[slnc 300]] The request's signature must verify with the public key inside the request. [[slnc 300]] Only the holder of the private key can make that true."""

[[class]]
name = "Validator"
what = "a client: the JDK's PKIX validator against the one root"
[[class.part]]
title = "a fixed date, revocation on or off"
code = """
parameters.setDate(Date.from(when));
parameters.setRevocationEnabled(revocation);
...
CertPathValidator.getInstance("PKIX").validate(path, parameters);
"""
speech = """The client is the J D K's own validator. [[slnc 300]] The date is set, so the demo can jump to day eleven or day twenty. [[slnc 300]] Revocation checking is a switch, which is why one client refuses a revoked certificate and another does not."""

[[class]]
name = "ChainSteps"
what = "the same chain check by hand, one printed step at a time"
[[class.part]]
title = "the name constraint step"
code = """
String permitted = permittedDomain(issuing);
boolean inside = names.stream()
        .allMatch(n -> permitted == null || n.toLowerCase(Locale.ROOT).endsWith("." + permitted));
steps.add(new Step(String.join(", ", names) + " is inside " + permitted,
        inside, "INVALID_NAME"));
"""
speech = """This teaching class redoes the validator's checks, in the J D K's order, so each one can be printed. [[slnc 300]] Here is step four: every name must end with the permitted domain. [[slnc 300]] A test proves its verdict matches the J D K's exactly."""

[[class]]
name = "ShortLived"
what = "a service that renews its own 24-hour certificate"
[[class.part]]
title = "renew at two thirds of the life"
code = """
return from.plus(Duration.between(from, to).multipliedBy(2).dividedBy(3));
"""
speech = """The renewal time comes from the certificate itself: two thirds of the way from not before to not after. [[slnc 300]] For twenty four hours, that is sixteen. [[slnc 300]] Each renewal makes a new key."""

[[acronym]]
short = "CA"
long = "Certificate Authority: whoever signs certificates"
say = "C A is certificate authority: whoever signs certificates, and is trusted by the clients."
[[acronym]]
short = "TLS"
long = "Transport Layer Security: the encrypted connection that uses certificates"
say = "T L S is transport layer security: the encrypted connection between services, which uses these certificates."
[[acronym]]
short = "JDK"
long = "Java Development Kit: Java, its tools and libraries"
say = "J D K is the Java development kit."
[[acronym]]
short = "PKIX"
long = "Public Key Infrastructure using X.509: the chain-checking rules"
say = "P K I X is public key infrastructure using X dot five oh nine: the rules a client follows to check a chain."
[[acronym]]
short = "X.509"
long = "the standard format of certificates and revocation lists"
say = "X dot five oh nine is the standard format of certificates and revocation lists."
[[acronym]]
short = "CRL"
long = "Certificate Revocation List: signed list of serials taken back"
say = "C R L is certificate revocation list: a signed list of serial numbers taken back, with a next update date."
[[acronym]]
short = "EC"
long = "Elliptic Curve: the kind of key pair used here, on a 256-bit curve"
say = "E C is elliptic curve: the kind of key pair every service uses here."
[[acronym]]
short = "ACME"
long = "Automatic Certificate Management Environment: automated issuing"
say = "A C M E is the automatic certificate management environment: a protocol that requests and renews certificates without a person."
[[acronym]]
short = "OCSP"
long = "Online Certificate Status Protocol: ask about one certificate"
say = "O C S P is the online certificate status protocol: a client asks about one certificate instead of fetching a list."
