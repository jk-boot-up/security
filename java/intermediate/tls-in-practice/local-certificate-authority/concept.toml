[[act]]
title = "Short-lived certificates instead of revocation"
summary = "A 24-hour certificate is renewed at two thirds of its life, 16 hours: renewals at hours 16, 32, 48 and 64, five different keys, no failed check; when the job stops, the last one ends at hour 88 and is refused as EXPIRED."
detail = """
cart.shop.internal gets serial 1004, valid 2026-02-04 09:00 to 2026-02-05 09:00. The renewal time is worked out from the certificate itself: a lifetime of 24 hours, two thirds is 24 x 2 / 3 = 16 hours, so it renews at 2026-02-05 01:00.
Over 72 hours, checked every hour, it renews at hours 16, 32, 48 and 64: 5 certificates, 5 different keys, 0 failed checks.
The job stops. The last certificate, serial 1008, ends 2026-02-08 01:00; 25 hours after it began it is refused (EXPIRED), with no list at all.
The inventory on day 65 flags the two 90-day certificates as RENEW_NOW with 25 days left, and the stopped cart certificate as EXPIRED. A stolen 24-hour key works for at most a day; a stolen 90-day key, for up to 90 days unless every client checks.
"""
figure = "renewal_timeline"
figure_title = "Twenty-four-hour certificates, renewed at sixteen hours"
figure_speech = """
Fourth demo: short lived certificates instead of revocation. [[slnc 400]] At the top, how the renewal time is worked out. [[slnc 300]] The certificate lives twenty four hours. [[slnc 300]] Two thirds of that is twenty four, times two, divided by three: sixteen hours. [[slnc 300]] So the first one, issued at nine in the morning, is renewed at one the next night. [[slnc 700]]
Below, each bar is one certificate, and the amber mark is its renewal time. [[slnc 300]] A new certificate starts at hours sixteen, thirty two, forty eight and sixty four, each with a new key. [[slnc 300]] They overlap, so no check ever fails. [[slnc 700]]
Then the renewal job stops. [[slnc 300]] The last certificate ends at hour eighty eight. [[slnc 300]] An hour later it is refused, as expired. [[slnc 600]]
No list is needed. [[slnc 300]] A stolen key is only useful for a day.
"""
speech = """
Here is the output. [[slnc 400]] The first certificate, serial one thousand and four, valid twenty four hours. [[slnc 400]] Two thirds is sixteen hours, so it renews at one in the morning. [[slnc 400]] Four renewals in seventy two hours, five different keys, and no failed check. [[slnc 400]] The job stops, and the last certificate is refused as expired.
[[page]]
The inventory on day sixty five. [[slnc 300]] Both ninety day certificates should be renewed now, with twenty five days left. [[slnc 300]] The cart certificate has expired. [[slnc 400]] A stolen short lived key works for at most a day.
"""
