[[act]]
title = "Revocation: taking a certificate back"
summary = "The day-10 list revokes serial 1002 until day 17; on day 11 a checking client refuses it and a client that never checks accepts it; on day 20 the stale list makes a strict client refuse even www, until a fresh list arrives."
detail = """
payments.shop.internal's key is reported stolen on day 10. The issuing CA signs a revocation list: this update 2026-01-15 (day 10), next update 2026-01-22 (day 17), revoked serial 1002 for key compromise. The root's own list (day 0 to day 365) revokes nothing, so it covers the issuing CA.
On day 11 a client that checks the lists refuses payments (REVOKED) and accepts www; a client that never checks still accepts the revoked certificate.
On day 20 the day-10 list is past its next update. A strict client refuses even the healthy www certificate (UNDETERMINED_REVOCATION_STATUS): with no current list it fails closed. With a fresh list from day 20 it accepts again.
"""
figure = "revocation_timeline"
figure_title = "Revocation lists over twenty days"
figure_speech = """
Third demo: revocation, taking a certificate back before it expires. [[slnc 400]] Across the top, days zero to twenty one. [[slnc 300]] Each bar is a revocation list, and how long it stays current. [[slnc 600]]
The root's list starts on day zero and lasts a year. [[slnc 300]] It revokes nothing, so the issuing C A is fine. [[slnc 300]] On day ten, the payments key is reported stolen. [[slnc 300]] The issuing C A signs a list with serial one thousand and two, current until day seventeen. [[slnc 700]]
On day eleven, a client that checks the list refuses payments, and still accepts w w w. [[slnc 300]] But a client that never checks accepts the revoked certificate. [[slnc 700]]
On day twenty, the day ten list has run out. [[slnc 300]] A strict client cannot know, so it refuses even the healthy certificate. [[slnc 300]] It fails closed, until a fresh list arrives.
"""
speech = """
Here is the output. [[slnc 400]] The issuing C A's list: from day ten to day seventeen, revoking serial one thousand and two, for key compromise. [[slnc 400]] The root's list, from day zero to day three hundred and sixty five, revokes nothing.
[[page]]
Day eleven. [[slnc 300]] With the lists, payments is refused, revoked, and w w w is accepted. [[slnc 300]] Without checking, payments is accepted. [[slnc 500]] Day twenty, with only the old list: refused, revocation status undetermined. [[slnc 300]] With a fresh list: accepted.
"""
