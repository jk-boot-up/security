slug = "local-certificate-authority"
level = "intermediate"
module = "tls-in-practice"
title = "A Local Certificate Authority"
short_title = "Local Certificate Authority"
package = "localca"
main_class = "LocalCaDemo"
tagline = "A certificate is a signed claim about a name; taking it back is the hard part"
bold = "A small certificate authority shows what issuing really involves: the authority applies the policy itself, proves the requester holds the key, limits its own reach with name constraints, and then faces the hard part, taking a certificate back, where short-lived certificates beat revocation lists."
domain = "an online store's internal services"
domain_note = ""
youtube_description = "A local certificate authority in Java with real X.509 certificates, checked by the JDK's own validator: an offline root and a constrained issuing authority, a policy the issuer applies (lifetime, names, teams), signing requests that prove key possession, a name constraint that holds even when the policy is skipped, revocation lists that only help clients that check them and fail closed when stale, and 24-hour certificates renewed by automation instead."
thumb_lines = ["LOCAL", "CERT AUTHORITY"]
thumb_code = "CA + CRL + 24h certs"
