main_class = "LocalCaDemo"
tagline = "A certificate is a signed claim about a name, and revocation is only as good as the list the client has"
bold = "A small certificate authority shows what issuing really involves: the authority applies the policy itself, proves the requester holds the key, limits its own reach with name constraints, and then faces the hard part, taking a certificate back, where short-lived certificates beat revocation lists."
domain = "an online store's internal services"
domain_note = ""
