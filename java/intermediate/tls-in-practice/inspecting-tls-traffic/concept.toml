[[act]]
title = "Reading the capture with the key log"
summary = "The capture's client random finds both lines of the log. The secret gives the AES key by HKDF-Expand-Label(secret, \"key\", 16) and the IV by Expand-Label(secret, \"iv\", 12); each record's nonce is the IV XOR its number. AES-128-GCM then opens both records, and the password appears."
detail = """
The input is the capture and the key log. The capture's client random 3bd68db30791... is looked up in the log, and both lines are found: CLIENT_TRAFFIC_SECRET_0 7c6da57caa88... and SERVER_TRAFFIC_SECRET_0 ea2a4ed1b2fa....
From secret to key, worked out for the client direction: the key is HKDF-Expand-Label(secret, "key", 16) = cfeb456056d9d85d..., the IV is HKDF-Expand-Label(secret, "iv", 12) = 6d3d06a138e98f67..., and the nonce of each record is the IV XOR the record number, so record 0 ends db a7 and record 1 would end db a6. AES-128-GCM opens the record and checks the header with it.
The result: both records open, with the login, the password and the session.
"""
figure = "secret_to_key"
figure_title = "From the logged secret to the text"
figure_speech = """
Third demo: reading the capture with the key log. [[slnc 400]] At the top, the lookup. [[slnc 300]] The client random from the capture finds the line, and the line gives the secret. [[slnc 600]]
In the middle, how the secret becomes a key, worked out. [[slnc 300]] H K D F expand label, with the word key, gives sixteen bytes: the A E S key. [[slnc 300]] With the letters I V, it gives twelve bytes: the initial value. [[slnc 300]] Each record's nonce is that value, X O R the record number. [[slnc 300]] So record zero ends in hex a seven, and record one ends in hex a six. [[slnc 600]]
At the bottom, A E S one twenty eight G C M opens the record, and checks the header too. [[slnc 300]] The login and the password appear.
"""
speech = """
The lookup: the capture's client random finds both lines, client and server. [[slnc 300]] So both secrets are in hand.
[[page]]
From secret to key: the key, the I V, and a nonce for each record number. [[slnc 400]] The result: both records open. [[slnc 300]] The login, with the password, and the server's session.
"""
