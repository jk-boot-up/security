objectives = [
    "say what a packet capture of TLS 1.3 reveals and what it hides",
    "describe the key log format and what a line allows",
    "explain forward secrecy with a leaked long-term key",
    "list the controls that keep key logs out of production",
]
walkthrough = """
Run act one and ask what an observer learns from the sizes alone. In act four, ask what a developer would have to collect to debug a long session. In act five, ask which of the two connections an attacker with a year-old recording would choose to attack, and why.
"""
exercises = [
    "Add a second record to each direction and check that sequence numbers matter when records are reordered.",
    "Add a TLS 1.3 key update that changes the traffic secret after N records, and extend the key log with a second label.",
    "Make the decryptor report which direction it could not open and why.",
    "Write a check that fails a startup health test when SSLKEYLOGFILE is present in the process environment of a production container.",
]

[docs.explained]
sentence = """
A TLS capture is unreadable without keys; a key log holds the traffic secrets of exactly the connections it lists and must stay out of production; and forward secrecy means a stolen long-term server key cannot open recorded ephemeral connections.
"""
verdict = """
Use key logs only for your own traffic in development and delete them after use. Make the setting fail loudly in production. Offer only ephemeral key exchange (TLS 1.3, or ECDHE in TLS 1.2), so that a future key theft does not unlock recordings.
"""
recognise = [
    "`SSLKEYLOGFILE` in an environment, a Dockerfile or a run script.",
    "Lines starting `CLIENT_RANDOM`, `CLIENT_TRAFFIC_SECRET_0` or `SERVER_TRAFFIC_SECRET_0`.",
    "Wireshark's TLS protocol preference \"(Pre)-Master-Secret log filename\".",
    "A finding about private keys or secrets written to log files, CWE-532.",
]

