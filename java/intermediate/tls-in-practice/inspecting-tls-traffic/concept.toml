[[act]]
title = "Why the server's own key is a different matter"
summary = "A recording made last year with static RSA key exchange carries the client's secret encrypted to the server key (256 bytes); when that key leaks, both records open. An ECDHE recording carries only two 32-byte public values; the same leaked key opens nothing. That is forward secrecy."
detail = """
The input is two recordings from last year. With static RSA key exchange the client's secret crossed the wire encrypted to the server's long-term key, 256 bytes. With ECDHE only two public values of 32 bytes crossed (8d0e655ac863... and 2af6fb559353...); the shared secret was never sent. Today the server's long-term RSA private key leaks.
The result: the static RSA recording opens, login and password included; the ECDHE recording opens nothing.
Why, worked out: with static RSA the key decrypts the 256 bytes and gets the secret; with ECDHE the secret needs a private value of the handshake, thrown away when it ended.
"""
figure = "forward_secrecy"
figure_title = "One leaked key, two recordings"
figure_speech = """
Fifth demo: the server's own key. [[slnc 400]] Two recordings from last year, and today the server's long term private key leaks. [[slnc 600]]
On the left, static R S A. [[slnc 300]] The client chose the secret and sent it encrypted to the server's key: two hundred and fifty six bytes on the wire. [[slnc 300]] The leaked key decrypts them, and from the secret everything follows. [[slnc 300]] The login and the password open. [[slnc 700]]
On the right, E C D H E. [[slnc 300]] Only two public values crossed the wire, thirty two bytes each. [[slnc 300]] The shared secret needs a private value of that handshake, and it was thrown away when the handshake ended. [[slnc 300]] The leaked key opens nothing. [[slnc 500]] That is forward secrecy.
"""
speech = """
The recordings. [[slnc 300]] Static R S A sent the client's secret encrypted to the server key: two hundred and fifty six bytes. [[slnc 300]] E C D H E sent two public values, and never the secret. [[slnc 300]] Then the leak: the server's long term key.
[[page]]
The result: the static R S A recording opens, password and all. [[slnc 300]] The E C D H E recording opens nothing. [[slnc 400]] Why: the key decrypts the static R S A secret, but the E C D H E secret needed a private value that no longer exists.
"""
rows = { fs = "active ok" }
console = [
    ["THE RECORDINGS (made last year):", "code"],
    ["  static RSA  the client's secret, encrypted to the server key:", "muted"],
    ["              256 bytes on the wire", "muted"],
    ["  ECDHE       two public values of 32 and 32 bytes:", "muted"],
    ["              8d0e655ac863... and 2af6fb559353...", "muted"],
    ["              the shared secret is never sent", "muted"],
    ["THE LEAK (today): the server's long-term RSA private key", "code"],
    ["---", ""],
    ["THE RESULT:", "code"],
    ["  static RSA, opened with the leaked key:", "muted"],
    ["    client: POST /login HTTP/1.1 | user=ana&password=hunter2", "muted"],
    ["    server: HTTP/1.1 200 OK | session=7f3a", "muted"],
    ["  ECDHE, opened with the same key:", "muted"],
    ["    [] (nothing opens)", "muted"],
    ["WHY, WORKED OUT:", "code"],
    ["  static RSA  the key decrypts the 256 bytes: the secret", "muted"],
    ["  ECDHE       the secret needs a private value of the", "muted"],
    ["              handshake, thrown away when it ended", "muted"],
]

