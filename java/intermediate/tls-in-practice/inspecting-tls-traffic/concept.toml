[threatmodel]
scope = """
Encrypted connections between a client and a server, a capture of them, and the key material that can open them: a key log and the server's long-term key.
It does not cover the application's own data protection, or metadata such as sizes and timing.
"""
assets = [
    "The contents of login requests and replies, including passwords and sessions.",
    "The traffic secrets of live and recorded connections.",
    "The server's long-term private key.",
]
actors = [
    "A developer debugging their own client.",
    "A network observer who records traffic.",
    "An attacker who later obtains a key log or the server's private key.",
]
boundaries = [
    "The client process to the file system: a key log is a copy of the secrets outside the process.",
    "The network: everything on it can be recorded.",
]
assumptions = [
    "The cryptography (X25519, HKDF, AES-GCM, RSA-OAEP) is sound.",
    "Recordings are kept for a long time.",
]
out_of_scope = [
    "Traffic analysis from sizes and timing.",
    "Attacks on the client machine that read secrets from memory.",
]
tests = [
    "`TlsLogTest` checks HKDF against the RFC test vector, record sealing and its failures, wire contents, key schedule determinism, key log scope and format, the static RSA and ephemeral cases, the production check and the encodings.",
    "`DemoRunsTest` compares the whole demo with the golden output and checks that it is repeatable.",
]
next = """
The next project, certificate-pinning, covers the opposite control: a client that accepts only a known key, which also stops this kind of inspection by a proxy.
"""

[[threat]]
id = "T1"
stride = "I"
threat = "A key log file is read by someone other than the developer"
where = "`KeyLog`, the file"
control = "Development only (the variable is refused in production), restricted file permissions, delete after use"
residual = "Developers' laptops are not production but hold real credentials too"

[[threat]]
id = "T2"
stride = "I"
threat = "A capture and a key log together reveal passwords and sessions"
where = "`Decryptor.withKeyLog`"
control = "Keep the two apart, use test accounts, and rotate any credential seen in a log"
residual = "Anything seen in a capture is exposed to everyone who saw it"

[[threat]]
id = "T3"
stride = "I"
threat = "A recorded connection is decrypted after the server's long-term key leaks"
where = "`Decryptor.withServerLongTermKey`"
control = "Ephemeral key exchange only (forward secrecy)"
residual = "Static RSA suites that remain enabled for old clients"

[poster]
headline = [["INSPECTING TLS", "text"], ["WITH A KEY LOG", "accent"]]
taglines = [["A key log opens what it lists, and nothing more", "gold"]]
before = { code = "17 03 03 00 41 ... (70 bytes)", note = "What the wire shows", tag = "BEFORE" }
after = { code = "client: POST /login HTTP/1.1", note = "Read with the key log", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "Inspecting TLS Traffic with a Key Log"
narration = "Hello, and welcome. [[slnc 400]] This video explains how T L S traffic is inspected with a key log, in Java. [[slnc 300]] T L S is transport layer security, the protocol behind the padlock in the browser. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A recording of encrypted traffic is unreadable without keys. [[slnc 300]] A key log is a file that holds the secrets of each connection, so a developer can read what their own app sent. [[slnc 300]] It opens exactly the connections it lists, which makes it a debugging tool that must never run in production. [[slnc 300]] And forward secrecy is why a stolen server key cannot open old recordings. [[slnc 600]] Think of a spare key, cut for one locker at a time. [[slnc 600]] Our example is an online shop's sign-in."

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["A customer signs in to a shop", "over an encrypted connection,", "and a developer records the traffic.", "", "Three people look at the recording:", "  an observer with no keys", "  a developer with the key log", "  an attacker who later steals the server key"]
narration = "Here is the scenario. [[slnc 400]] A customer signs in to an online shop over an encrypted connection, and a developer records the traffic. [[slnc 500]] The demo builds the connections itself, with repeatable keys, so every byte can be shown. [[slnc 500]] Then three people look at the same recording: an observer with no keys, a developer with the key log, and an attacker who steals the server's long-term key a year later."

[[scene]]
key = "02-words"
kind = "bullets"
title = "The Words"
body = ["Capture: a recording of the bytes on the network", "Record: one encrypted unit of TLS data", "Client random: 32 bytes sent in the clear", "Traffic secret: the secret of one direction", "Key log: a file of traffic secrets", "Forward secrecy: a stolen key opens no old session"]
narration = """Before the demos, the words. [[slnc 500]] A capture is a recording of the bytes that crossed the network. [[slnc 500]] A record is one encrypted unit of T L S data. [[slnc 500]] The client random is thirty two bytes the client sends in the clear when the connection starts. [[slnc 500]] A traffic secret is the secret of one direction of one connection. [[slnc 500]] A key log is a file of those secrets. [[slnc 500]] And forward secrecy means a key stolen later cannot open a session recorded earlier."""

[[scene]]
key = "02-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "02-three-holders"
kind = "figure"
title = "One recording, three people"
body = "three_holders"
narration = """Let's see the core idea on one real example. [[slnc 400]] At the top, the recording of one login: two records, seventy and fifty two bytes. [[slnc 300]] Inside is the password, but the bytes do not show it. [[slnc 600]]
Below, four ways to look at it. [[slnc 300]] An observer with no key reads nothing. [[slnc 300]] A developer with the key log reads the login and the answer. [[slnc 500]] Then an attacker steals the server's long term key. [[slnc 300]] With an old static R S A connection, the login opens. [[slnc 300]] With an E C D H E connection, nothing opens. [[slnc 600]]
So the key log is a secret file that opens what it lists, and forward secrecy protects old recordings from a stolen server key."""

[[scene]]
key = "03-acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "04-costs"
kind = "bullets"
title = "What It Costs"
body = ["A key log is a plaintext secret", "Debugging in production is tempting, and wrong", "Forward secrecy needs ephemeral key exchange", "Reading others' traffic is a privacy matter", "One key log line per connection and direction"]
narration = "Nothing is free. [[slnc 400]] Here is what it costs. [[slnc 500]] A key log is a secret, written in plain text, that opens every connection it lists. [[slnc 500]] Turning it on in production, just to debug, is tempting, and wrong. [[slnc 500]] Forward secrecy needs an ephemeral key exchange, so old static R S A must be switched off. [[slnc 500]] Reading other people's traffic, even your customers', is a privacy matter. [[slnc 300]] And a key log must hold a line for every connection and direction you want to read."

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["SSLKEYLOGFILE in an environment or a Dockerfile", "Wireshark's TLS key log setting", "Secrets written to a log file: CWE-532", "\"Perfect forward secrecy\" in a scan report"]
narration = "You have probably met this already. [[slnc 400]] An S S L key log file variable, in an environment, a Dockerfile, or a run script, is a key log being written. [[slnc 500]] Wireshark's T L S key log setting is where the file is read. [[slnc 500]] A finding about secrets written to log files, C W E 532, is this file left lying around. [[slnc 500]] And perfect forward secrecy, in a scan report, is the last demo."

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Key logs only for your own traffic, in development", "Delete them after use", "Fail loudly if one is set in production", "Only ephemeral key exchange", "  (TLS 1.3, or ECDHE in TLS 1.2)"]
narration = "So, how do you use it? [[slnc 400]] Use key logs only for your own traffic, in development, and delete them after use. [[slnc 500]] Make the setting fail loudly, and refuse to start, in production. [[slnc 500]] And offer only ephemeral key exchange, T L S one point three, or E C D H E in T L S one point two, so that a key stolen in the future does not unlock today's recordings."

[[scene]]
key = "07-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a second record to each", "direction and check that reordering is caught."]
narration = "That's inspecting T L S traffic with a key log. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Any T L S recording is unreadable without keys, a key log opens exactly the connections it lists and must stay out of production, and forward secrecy means a stolen server key cannot open recorded ephemeral sessions. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a second record in each direction, and check that the sequence numbers catch records that are reordered. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] Everything a tool like Wireshark does is written out here in plain Java, so nothing is a black box. [[slnc 300]] Here are the classes that matter."""

[[class]]
name = "KeyLog"
what = "writes and reads key log lines, and guards the setting"
[[class.part]]
title = "one line per direction"
code = """
String random = Hex.of(c.clientRandom());
return "CLIENT_TRAFFIC_SECRET_0 " + random + " " + Hex.of(s.client()) + "\\n"
        + "SERVER_TRAFFIC_SECRET_0 " + random + " " + Hex.of(s.server()) + "\\n";
"""
speech = """A key log line is a label, the client random, and the secret, in hex. [[slnc 300]] The client random is how a tool finds the line for a connection."""
[[class.part]]
title = "refused in production"
code = """
String env = environment.getOrDefault("APP_ENV", "");
if ("production".equalsIgnoreCase(env)) {
    throw new IllegalStateException(
            "SSLKEYLOGFILE is set in production; refusing to start");
"""
speech = """The shop's client reads the variable, but in production it refuses to start. [[slnc 300]] A key log there would be a copy of every customer's session secrets."""

[[class]]
name = "Secrets"
what = "the TLS 1.3 key schedule, down to the traffic secrets"
[[class.part]]
title = "from the shared secret to one secret per direction"
code = """
byte[] handshake = Hkdf.extract(
        Hkdf.deriveSecret(early, "derived", emptyHash), sharedSecret);
byte[] master = Hkdf.extract(
        Hkdf.deriveSecret(handshake, "derived", emptyHash), Hkdf.ZEROS);
byte[] client = Hkdf.deriveSecret(master, "c ap traffic", transcriptHash);
byte[] server = Hkdf.deriveSecret(master, "s ap traffic", transcriptHash);
"""
speech = """The shared secret is mixed into the handshake secret, then the master secret. [[slnc 300]] From the master secret come two traffic secrets, one for each direction. [[slnc 300]] These are exactly what a key log holds."""

[[class]]
name = "Records"
what = "seals and opens one record with AES-128-GCM"
[[class.part]]
title = "key, IV and nonce from the secret"
code = """
return Hkdf.expandLabel(secret, "key", new byte[0], 16);
...
return Hkdf.expandLabel(secret, "iv", new byte[0], 12);
...
iv[11 - i] ^= (byte) (seq >> (8 * i));
"""
speech = """The key and the I V are expanded from the traffic secret. [[slnc 300]] The nonce is the I V with the record number X O R ed into its last bytes. [[slnc 300]] A test opens a record by hand with these values."""

[[class]]
name = "Decryptor"
what = "opens a capture with what the analyst holds"
[[class.part]]
title = "a leaked server key, against each kind of connection"
code = """
if (c.ecdhe()) {
    return List.of();
...
byte[] premaster = cipher.doFinal(c.clientKeyShare());
"""
speech = """With the server's long term key, an E C D H E connection gives nothing: that key only signed the handshake. [[slnc 300]] A static R S A connection gives up its secret, because the key decrypts it straight from the capture."""

[[acronym]]
short = "TLS"
long = "Transport Layer Security: the protocol behind HTTPS"
say = "T L S is transport layer security: the protocol that encrypts a connection and proves the server's identity."
[[acronym]]
short = "HTTP, HTTPS"
long = "Hypertext Transfer Protocol; HTTP over TLS"
say = "H T T P is the hypertext transfer protocol of the web. H T T P S is H T T P inside T L S."
[[acronym]]
short = "SSLKEYLOGFILE"
long = "the variable that makes a client write a key log"
say = "S S L key log file is the environment variable that tells a client where to write its key log."
[[acronym]]
short = "APP_ENV"
long = "the application's environment: dev or production"
say = "App env is the variable that says where the application runs: development or production."
[[acronym]]
short = "HKDF"
long = "HMAC-based Key Derivation Function"
say = "H K D F is the hash based key derivation function: it stretches one secret into keys with labels."
[[acronym]]
short = "HMAC, SHA"
long = "Hash-based Message Authentication Code; Secure Hash Algorithm"
say = "H M A C is a hash based message authentication code. S H A is the secure hash algorithm."
[[acronym]]
short = "AES, GCM"
long = "Advanced Encryption Standard; Galois/Counter Mode"
say = "A E S is the advanced encryption standard, and G C M is Galois counter mode, which encrypts and detects changes in one step."
[[acronym]]
short = "IV, XOR"
long = "Initialization Vector; exclusive or"
say = "An I V is an initialization vector, the starting value of each nonce. X O R is exclusive or, which flips the bits where two values differ."
[[acronym]]
short = "RSA"
long = "Rivest-Shamir-Adleman: a public-key algorithm"
say = "R S A, after Rivest, Shamir and Adleman, is a public key algorithm. Used as a key exchange, it gives no forward secrecy."
[[acronym]]
short = "ECDHE, X25519"
long = "Elliptic Curve Diffie-Hellman Ephemeral; the curve it uses here"
say = "E C D H E is elliptic curve Diffie Hellman ephemeral: a fresh key for every connection. X twenty five five nineteen is the curve used here."
[[acronym]]
short = "SSL"
long = "Secure Sockets Layer: TLS's old name, kept in SSLKEYLOGFILE"
say = "S S L is secure sockets layer, the old name of T L S, still used in the variable's name."
[[acronym]]
short = "CWE"
long = "Common Weakness Enumeration: a numbered list of weaknesses"
say = "C W E is the common weakness enumeration, a numbered list of software weaknesses."
[[acronym]]
short = "NSS"
long = "Network Security Services: the library whose log format this is"
say = "N S S is network security services, the library that defined the key log format."
