figure_title = "Three tries with a key log"
figure_speech = """
Fourth demo: what a key log opens. [[slnc 400]] A second customer connects, with a different client random. [[slnc 600]] First try: session two, with session one's key log. [[slnc 300]] No line names its client random, so nothing opens. [[slnc 500]] Second try: add session two's own two lines. [[slnc 300]] Both of its records open. [[slnc 500]] Third try: session one, with only its client line. [[slnc 300]] The client's login opens, but the server's record stays closed. [[slnc 600]]
So one line opens one direction of one connection, and nothing more.
"""
