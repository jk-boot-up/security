narration = "So, how do you use it? [[slnc 400]] Use key logs only for your own traffic in development and delete them after use. [[slnc 500]] Make the setting fail loudly in production. [[slnc 500]] Offer only ephemeral key exchange (T L S 1 point 3, or E C D H E in T L S 1 point 2), so that a future key theft does not unlock recordings."

