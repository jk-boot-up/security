[readme]
intro = """
When a developer needs to see what an HTTPS client really sent, a packet capture alone shows only encrypted records. The standard answer is a **key log**: browsers, curl and many libraries write the connection's traffic secrets to the file named by the
`SSLKEYLOGFILE` environment variable, and tools such as Wireshark read it to decrypt the capture. It is a very useful tool and a dangerous file: it is a recording key for every connection it lists.

This project builds the whole thing in plain Java so that nothing is a black box: a **TLS 1.3 style key schedule** (HKDF-SHA-256 with the real `tls13 ` labels, X25519 key exchange), **AES-128-GCM records** with the real nonce and header rules, a **capture** of what a network observer sees, the **NSS key log format**, and a
**decryptor** that works on a capture with different things in hand: nothing, a key log, or the server's long-term private key.

What it shows, in order:
- A capture without keys: lengths and the hello values in the clear, but no plaintext.
- The key log lines, and a client that refuses to write them in production.
- The capture decrypted with the log: a login request with its password.
- A log opens only the connections whose lines it holds, and one direction at a time.
- **Forward secrecy:** a leaked long-term server key opens recorded *static RSA* sessions, and nothing from ephemeral key exchange.

**Maps to:** OWASP Top 10 (2025) A04 Cryptographic Failures · CWE-312 · CWE-532 · RFC 8446 (TLS 1.3), RFC 5869 (HKDF), RFC 8448 (example traces) · the NSS key log format.
"""
analogy = """
A recorded phone call is noise until somebody has the key to the scrambler. A key log is a note with that key for specific calls: it lets an engineer listen to the call they are debugging, and it lets anyone who finds the note listen to the same calls.
A phone company that uses a fresh scrambler key for each call, and throws it away, cannot be forced to decode last year's recordings even if its master key is stolen.
"""
scenario = """
A customer logs in to a shop over an encrypted connection, and a developer captures the traffic. The demo creates connections with repeatable keys, captures what the wire shows, and plays three roles: an observer with no keys, a developer with the key log,
and an attacker who later steals the server's long-term key.
"""
costs = [
    "**A key log is a plaintext secret.** Anyone who can read the file and the capture can read the sessions; protect it like a password file and delete it after use.",
    "**Debugging in production is tempting and wrong.** Make the setting impossible there, as the demo's check does, and monitor for the variable.",
    "**Forward secrecy needs ephemeral key exchange,** which every TLS 1.3 connection has; older configurations that still offer static RSA give it up.",
    "**Decrypting traffic you may not read is a privacy matter** as well as a technical one: inspect only your own test traffic.",
    "**Key logs are per connection,** so long captures need many lines, and a log that is missing a line for a resumed or renegotiated session gives an incomplete picture.",
]
too_much = """
If you only need to know what a library sent, log at the application layer (the request object) in a test, and leave TLS alone. A proxy you control and your own test CA is another way to see your client's traffic without writing secrets to disk.
"""
met_before = [
    "Wireshark's \"Pre-Master-Secret log filename\" setting.",
    "`SSLKEYLOGFILE=/tmp/keys.log` before starting a browser or `curl`.",
    "Java's `-Djavax.net.debug=ssl` output, which prints handshake detail (and in some versions secrets).",
    "The advice to turn off static RSA cipher suites.",
]
where = """
This project is in [tls-in-practice](..) and follows [tls-misconfigurations](../tls-misconfigurations), which flags suites without forward secrecy. It builds on the beginner
[tls-handshake](../../../beginner/transport-security/tls-handshake) project, and on the hashing and key-exchange ideas in the beginner cryptography track.
"""
twin = """
The key exchange (X25519, RSA-OAEP), HKDF, AES-GCM and the key log format are real and standard; the handshake messages are reduced to the values the key schedule needs (random values, key shares and a hash of the hellos), and certificates are left out because the lesson is about keys.
Keys come from a labelled generator so that the bytes, and the demo's output, are the same on every run. That generator must never be used for real keys.
"""
test_note = "Keys come from a labelled generator and the RSA key is never printed, so the demo prints the same text on every run."

[[act]]
title = "What the wire shows"
summary = "A login is sent over a TLS 1.3 style connection. The capture shows the two hello randoms in the clear and two records of 70 and 52 bytes; the header 17 03 03 00 41 says application data, version 3.3, length 65 = 48 text + 1 inner type + 16 tag. With no key, the word password is nowhere and nothing opens."
detail = """
The input is one login to an online store: the client sends "POST /login HTTP/1.1 | user=ana&password=hunter2" and the server answers "HTTP/1.1 200 OK | session=7f3a".
The capture holds the client random (3bd68db307915645...) and the server random (363791a138986206...) in the clear, then a 70-byte record from the client and a 52-byte record from the server.
The record header, worked out: 17 is type 23, application data; 03 03 is version 3.3, the same in every TLS 1.3 record; 00 41 is a length of 65 = 48 bytes of text + 1 inner content type + 16 bytes of GCM tag; 5 header bytes + 65 = 70.
The result with no key: the word "password" is not in the bytes, and nothing decrypts.
"""
figure = "record_bytes"
figure_title = "The seventy bytes of one record"
figure_speech = """
First demo: what the wire shows. [[slnc 400]] This is the client's record, seventy bytes, exactly as a recording holds it. [[slnc 500]] Only the first five bytes are readable: the header. [[slnc 300]] One seven, in hex, is type twenty three: application data. [[slnc 300]] Zero three, zero three is version three point three, which every T L S one point three record says. [[slnc 300]] Zero zero, four one is the length: sixty five bytes. [[slnc 600]]
Those sixty five bytes are the forty eight bytes of the login, plus one byte for the real content type, hidden inside, plus a sixteen byte tag that detects any change. [[slnc 300]] Five plus sixty five is seventy. [[slnc 600]]
The login, the password and even the real type are all encrypted. [[slnc 300]] With no key, nothing opens.
"""
speech = """
Here is the real output. [[slnc 400]] The input: the login the client sends, and the server's answer. [[slnc 400]] The capture: the two random values from the hellos, in the clear. [[slnc 300]] Then two records, of seventy and fifty two bytes, both starting with one seven, zero three, zero three.
[[page]]
The record header, worked out: application data, version three point three, and a length of sixty five. [[slnc 300]] Forty eight bytes of text, one byte of type, and a sixteen byte tag. [[slnc 400]] The result: the word password is not in the bytes, and nothing decrypts.
"""
rows = { wire = "active ok" }
console = [
    ["THE CONNECTION (an online store's login, TLS 1.3 style):", "code"],
    ["  client sends  POST /login HTTP/1.1 | user=ana&password=hunter2", "muted"],
    ["  server sends  HTTP/1.1 200 OK | session=7f3a", "muted"],
    ["THE CAPTURE (what anyone on the network records):", "code"],
    ["  client random     3bd68db307915645... (in the clear)", "muted"],
    ["  server random     363791a138986206... (in the clear)", "muted"],
    ["  client -> server  70 bytes, 17 03 03 00 41 ...", "muted"],
    ["  server -> client  52 bytes, 17 03 03 00 2f ...", "muted"],
    ["---", ""],
    ["THE RECORD HEADER, WORKED OUT (client -> server):", "code"],
    ["  17       type 23: application data", "muted"],
    ["  03 03    version 3.3, the same in every TLS 1.3 record", "muted"],
    ["  00 41    length 65 = 48 text + 1 inner type + 16 tag", "muted"],
    ["  total    5 header + 65 = 70 bytes", "muted"],
    ["THE RESULT (with no key):", "code"],
    ["  contains \"password\"?  false", "muted"],
    ["  decrypted             []", "muted"],
]

[[act]]
title = "Writing a key log"
summary = "SSLKEYLOGFILE makes a client write two lines per connection, CLIENT_TRAFFIC_SECRET_0 and SERVER_TRAFFIC_SECRET_0, each with the 32-byte client random and the 32-byte secret of one direction. The shop's client honours it in development and refuses to start with it in production."
detail = """
The input is the client's environment. Without SSLKEYLOGFILE there is no key log; with SSLKEYLOGFILE=/tmp/keys.log and APP_ENV=dev the client writes to /tmp/keys.log; with APP_ENV=production it refuses to start.
The result is two lines in the NSS key log format: a label, the client random and the secret. The line part by part: the label CLIENT_TRAFFIC_SECRET_0 names the client-to-server direction, the client random 3bd68db30791... (32 bytes) is the same as the capture's, and it is how a tool matches the line to a connection, and the secret 7c6da57caa88... (32 bytes) opens that one direction.
"""
figure = "keylog_line"
figure_title = "One key log line, part by part"
figure_speech = """
Second demo: writing a key log. [[slnc 400]] At the top, one real line of the file. [[slnc 300]] It has three parts. [[slnc 500]] In amber, the label: client traffic secret zero, the direction from the client to the server. [[slnc 300]] In cyan, the client random: thirty two bytes, the same value the capture shows in the clear. [[slnc 300]] That is how a tool finds the line for a connection. [[slnc 300]] In green, the secret: thirty two bytes that open that one direction. [[slnc 700]]
At the bottom, when a client may write the file. [[slnc 300]] With no setting, there is no key log. [[slnc 300]] In development, it writes to the path given. [[slnc 300]] In production, the shop's client refuses to start.
"""
speech = """
The input: three environments. [[slnc 300]] Not set, no key log. [[slnc 300]] Development, a file. [[slnc 300]] Production, the client refuses to start. [[slnc 400]] The result: two lines for this connection, one for each direction.
[[page]]
The line, part by part. [[slnc 300]] The label, the client random, which is the same as the capture's, and a thirty two byte secret for one direction.
"""
