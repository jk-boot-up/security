The output. [[slnc 400]] The app's pin, and the new key's pin, are different. [[slnc 300]] By hand, none of the renewed chain's keys is pinned. [[slnc 300]] So the bank's own app refuses the bank. [[slnc 400]] And the fleet: ten thousand fail on day zero, fifteen hundred still fail a week later.
"""
