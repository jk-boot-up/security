[[act]]
title = "Why browsers stopped letting servers set pins"
summary = "A meddler's Public-Key-Pins header with max-age 31536000 seconds (365 days) blocks the genuine bank on day 30 and expires by day 400; a site that pins its own keys and then changes key is blocked until day 365."
detail = """
Browsers once let a server set pins with a header (HPKP). A meddler who answers one first visit sends Public-Key-Pins with the pins of its own keys and max-age=31536000. Worked out, 31536000 s / 86400 s a day = 365 days.
By hand: on day 30, 30 < 365, so the meddler's pins still apply; on day 400, 400 > 365, so they have expired. PinStore agrees: the genuine bank server is blocked for every returning visitor on day 30, and accepted again on day 400.
The same trap catches the site itself: it pins its own leaf and backup keys, then renews with a new key that is neither, and is blocked until day 365, with no way to undo it.
"""
figure = "hpkp_year"
figure_title = "One header, a year of lockout"
figure_speech = """
Fifth demo: why browsers stopped letting servers set pins. [[slnc 400]] For a few years, a server could send pins in a header, called H P K P, and the browser kept them. [[slnc 700]]
At the top, the header a meddler sends, when it answers one first visit. [[slnc 300]] Two pins, both for the meddler's own keys, and a max age. [[slnc 600]]
The max age, worked out. [[slnc 300]] Thirty one million, five hundred and thirty six thousand seconds, divided by eighty six thousand four hundred seconds in a day, is three hundred and sixty five days. [[slnc 700]]
On the timeline, the genuine bank server. [[slnc 300]] Day thirty is less than three hundred and sixty five, so the meddler's pins still apply, and every returning visitor is blocked from the real bank. [[slnc 300]] Day four hundred is past the expiry, and the bank is accepted again. [[slnc 600]]
A site could do the same to itself, by pinning its own keys and then losing them. [[slnc 300]] That is why browsers removed the feature.
"""
speech = """
The output. [[slnc 400]] The meddler's header, with a max age of three hundred and sixty five days.
[[page]]
By hand: day thirty is inside the year, day four hundred is outside. [[slnc 400]] The result agrees: blocked on day thirty, accepted on day four hundred. [[slnc 400]] And a site that pins its own keys, then changes key, is blocked until day three hundred and sixty five.
"""
rows = { hpkp = "active wrong" }
console = [
    ["THE HEADER (a meddler answers one first visit, HPKP):", "code"],
    ["  Public-Key-Pins: pin-sha256=\"uY0GG0fH8UUc...\";", "muted"],
    ["    pin-sha256=\"wwq5cMyuB4F8...\"; max-age=31536000", "muted"],
    ["THE max-age, WORKED OUT:", "code"],
    ["  31536000 s / 86400 s a day = 365 days", "muted"],
    ["---", ""],
    ["THE CHECK, BY HAND (is the visit within 365 days?):", "code"],
    ["  day 30   30 < 365: the meddler's pins still apply", "bad"],
    ["  day 400  400 > 365: the pins have expired", "ok"],
    ["THE RESULT (the genuine bank server):", "code"],
    ["  day 30   blocked for every returning visitor", "bad"],
    ["  day 400  accepted again", "ok"],
    ["THE SITE'S OWN PINS (leaf + backup), THEN A NEW KEY:", "code"],
    ["  day 80   blocked until day 365  <- NO WAY TO UNDO IT", "bad"],
]

