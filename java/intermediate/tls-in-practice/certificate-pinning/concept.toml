[[act]]
title = "An app that pins the server's key"
summary = "The pin is the SHA-256 of the leaf's 91-byte SubjectPublicKeyInfo, in Base64 (44 characters); the app refuses any chain with no pinned key, so the interceptor is refused even though its root is on the phone."
detail = """
The input is the leaf's public key, an EC P-256 key, as SubjectPublicKeyInfo: 91 bytes, a 26-byte header naming the algorithm and the curve and the 65-byte point. Its SHA-256 hash is 32 bytes, and the hash in Base64 is the 44-character pin.
PinSteps does the Base64 by hand: the first three bytes of the hash, 2f 3a bf, are 24 bits, cut into four 6-bit values (11, 51, 42, 63), which are the letters L, z, q and /. 32 bytes are 10 groups of 3 and 2 left over, so 11 groups of 4 letters: 44 characters, the last one '='. The result is the same as the JDK's Base64.
By hand, the genuine chain contains the pinned leaf key, and the interception chain contains none of its two keys. So the app accepts the genuine server, refuses the interception by pin, and on a phone without the proxy's root, validation refuses it first.
"""
figure = "pin_worked_out"
figure_title = "How a pin is made"
figure_speech = """
Second demo: an app that pins the server's key. [[slnc 400]] First, what a pin is, worked out with the real values. [[slnc 700]]
The input is the leaf's public key, in a standard form called subject public key info. [[slnc 300]] Ninety one bytes: twenty six bytes of header, which name the algorithm and the curve, and the sixty five byte point itself. [[slnc 600]]
Those bytes go through S H A two fifty six, which gives thirty two bytes. [[slnc 300]] And the thirty two bytes are written in base sixty four, which gives forty four characters. [[slnc 300]] That is the pin. [[slnc 700]]
At the bottom, base sixty four by hand. [[slnc 300]] Take three bytes: two f, three a, b f. [[slnc 300]] That is twenty four bits. [[slnc 300]] Cut them into four groups of six bits, which are eleven, fifty one, forty two and sixty three. [[slnc 300]] In the base sixty four alphabet, those are capital L, small z, small q, and slash. [[slnc 300]] The first four letters of the pin. [[slnc 600]]
Thirty two bytes make ten groups of three, with two left over, so eleven groups of four letters: forty four.
"""
speech = """
The output. [[slnc 400]] Ninety one bytes of key. [[slnc 300]] Thirty two bytes of hash. [[slnc 300]] Forty four characters of pin.
[[page]]
The first group by hand: three bytes, four groups of six bits, four letters. [[slnc 400]] The same as the J D K's base sixty four.
[[page]]
Now the check by hand. [[slnc 300]] The genuine chain holds the pinned leaf key. [[slnc 300]] The interceptor's chain holds none. [[slnc 400]] So the app accepts the bank, and refuses the interceptor by pin. [[slnc 300]] On a clean phone, validation refuses it first.
"""
rows = { pin = "active ok" }
console = [
    ["THE INPUT (the leaf's public key, EC P-256):", "code"],
    ["  SubjectPublicKeyInfo  91 bytes = 26 header + 65 point", "muted"],
    ["THE PIN, WORKED OUT:", "code"],
    ["  SHA-256 of the 91 bytes  32 bytes  2f3abf264f56...", "muted"],
    ["  Base64 of the hash  44 chars, the pin:", "muted"],
    ["    Lzq/Jk9WKkUdfAIkFfeRw+9Of4eKCEcGlfwZSm7fewM=", "muted"],
    ["---", ""],
    ["THE BASE64, BY HAND (3 bytes -> 4 letters of 6 bits):", "code"],
    ["  bytes    2f 3a bf", "muted"],
    ["  6 bits   001011 110011 101010 111111", "muted"],
    ["  values   11     51     42     63", "muted"],
    ["  letters  L      z      q      /", "muted"],
    ["  32 bytes = 10 x 3 + 2 left -> 11 groups x 4 = 44 chars", "muted"],
