[[act]]
title = "Pins chosen so that rotation does not break the app"
summary = "Pinning the issuing CA's key survives the renewal and still refuses the interceptor; a backup pin lets the server switch keys; report-only mode accepts and records one report."
detail = """
Three apps ship different pins. The issuer pin is the Public Issuing CA's key, which a leaf renewal does not change. Leaf + backup pins the leaf key and a spare key that was generated in advance and kept offline. Report-only pins the leaf key but only reports a mismatch.
By hand: the renewed chain contains the issuer's key; the interception chain contains none; when the server switches to the backup key, the chain contains the backup key; the renewed chain contains no key of the report-only app.
The results: ACCEPTED, REFUSED_BY_PIN, ACCEPTED, and ACCEPTED_REPORT_ONLY with one report collected, which tells the team what would have broken.
"""
figure = "rotation_pins"
figure_title = "Pins that survive a renewal"
figure_speech = """
Fourth demo: pins chosen so that a key change does not break the app. [[slnc 400]] Three choices, each checked by hand. [[slnc 700]]
First, pin the issuing authority's key instead of the leaf. [[slnc 300]] The renewal changed the leaf, not the issuer, so the renewed chain still holds a pinned key, and it is accepted. [[slnc 300]] And the interceptor's chain still holds none, so it is still refused. [[slnc 700]]
Second, pin the leaf and a backup key, made in advance and kept offline. [[slnc 300]] When the server switches to the backup key, the chain holds a pinned key, and it is accepted. [[slnc 700]]
Third, report only. [[slnc 300]] No key matches, but the app accepts, and sends one report. [[slnc 300]] The team learns what would have broken, before it breaks.
"""
speech = """
The output. [[slnc 400]] The three pin choices, and the check by hand: which key of each chain is pinned.
[[page]]
And the results. [[slnc 300]] The issuer pin accepts the renewal and refuses the interceptor. [[slnc 300]] The backup pin accepts the switched key. [[slnc 300]] Report only accepts, and collects one report.
"""
