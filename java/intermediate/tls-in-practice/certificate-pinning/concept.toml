[[act]]
title = "The server renews with a new key"
summary = "On day 80 the bank renews with a new key, whose pin is different; the app refuses its own bank, and of 10000 installs, 1500 are still locked out a week later."
detail = """
On day 80 the bank renews its certificate and makes a new key, as many renewals do. The app's pin and the new key's pin differ, so by hand none of the renewed chain's two keys is pinned, and the app refuses the bank's own server with REFUSED_BY_PIN.
The fleet worked out: 10000 installs all fail on day 0. If 85% update within a week, 10000 - 10000 x 85 / 100 = 1500 are still locked out after a week.
"""
figure = "renewal_outage"
figure_title = "The day the key changes"
figure_speech = """
Third demo: the bank renews its certificate. [[slnc 400]] Day eighty, a new certificate, and a new key, as many renewals do. [[slnc 700]]
At the top, the pin the app ships, and the pin of the new key. [[slnc 300]] They are different. [[slnc 300]] So none of the keys in the new chain is pinned, and the app refuses its own bank. [[slnc 300]] Nothing is wrong with the certificate. [[slnc 300]] The pin did exactly what it was told. [[slnc 700]]
At the bottom, what that means for the bank. [[slnc 300]] Ten thousand installed copies of the app. [[slnc 300]] On day zero, all ten thousand fail at once. [[slnc 300]] Say eighty five percent update within a week. [[slnc 300]] Ten thousand, minus ten thousand times eighty five over a hundred, leaves one thousand five hundred customers who still cannot log in, a week later.
"""
