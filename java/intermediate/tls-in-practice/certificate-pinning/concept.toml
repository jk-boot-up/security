[docs.problem]
scenario = """
A mobile banking app talks to the bank's API, on devices whose trust stores the bank does not control.
"""
naive = """
Rely on ordinary TLS validation: a valid chain means we are talking to the bank.
"""
deliver = [
    "Real certificate chains for a public hierarchy and for an interception proxy.",
    "A client that validates and then checks SPKI pins, with report-only mode.",
    "A calculation of the fleet lockout when the key changes.",
    "A model of server-set (HPKP-style) pins and the lockouts they cause.",
]

[docs.prerequisites]
required = [
    "Java basics",
    "The beginner tls-handshake project, or an idea of certificates and chains",
]
not_required = [
    "Android or iOS: the client is plain Java",
    "A real proxy: the interceptor is a second certificate chain",
]
install = []

[docs.session]
objectives = [
    "explain what a pin adds to certificate validation and what it does not replace",
    "choose between pinning a leaf, an issuing CA and a backup key",
    "describe the rotation outage and how to plan for it",
    "explain why server-set pins were dropped by browsers",
]
walkthrough = """
Run act two and ask who the pin protects against, and who it does not. In act three, ask what the bank could have done before the change. In act five, ask who controls the response that sets the pin.
"""
exercises = [
    "Add a pin set with an enforcement date, and refuse the policy once the date has passed without an update.",
    "Add a signed remote switch that turns enforcement off, and decide what an attacker can do with it.",
    "Write the rotation procedure for the bank: which key is generated when, and which app release carries which pin.",
    "Add Certificate Transparency checking as an alternative and compare the failure modes.",
]

[docs.explained]
sentence = """
A pin narrows trust from every authority on the device to a key you chose, so it stops interception by a trusted-but-unexpected root, and costs a planned rotation, backup pins and an update path.
"""
verdict = """
Use pinning in apps where the threat is real and you control updates: pin the issuing CA's key or the leaf with a backup key, keep a report-only mode and a tested rotation, and have a way to update users. Never accept server-set pins for a website; use Certificate Transparency, CAA and short-lived certificates.
"""
recognise = [
    "`CertificatePinner.Builder().add(host, \"sha256/...\")` in OkHttp.",
    "`<pin-set expiration=\"...\"><pin digest=\"SHA-256\">` in Android network security configuration.",
    "`Public-Key-Pins` headers in old captures.",
    "\"SSL pinning bypass\" in a mobile security report.",
]

[spec]
purpose = """
Teach certificate pinning by showing it stop an interceptor with a trusted root, then measuring the rotation outage it causes, and the choices that soften it.
"""
nongoals = [
    "Android or iOS APIs.",
    "Bypassing pins on a device.",
    "Certificate Transparency and CAA, which are mentioned as alternatives.",
]
problem = """
Teams rely on the device's trust store, which an interceptor may have extended, or pin one key and cannot change it without breaking their users.
"""
roles = [["Certificates and pins", "`Pki`, `Der`, `Spki`, `PinPolicy`"], ["The client and its outcomes", "`PinnedClient`, `Outcome`"], ["Rotation cost and header pins", "`Fleet`, `PinStore`"], ["Entry point", "`PinningDemo`"]]
requirements = [
    "A pin adds to validation: a bad chain is refused whatever it contains, and a valid chain without a pinned key is refused by the pin.",
    "An interceptor with a root the device trusts is stopped by a pin.",
    "Renewing with a new key breaks a leaf pin and not an issuer pin; a backup pin allows a switch.",
    "Report-only mode accepts and records.",
    "Header-set pins lock out the genuine site until they expire.",
    "The demo prints the same output on every run.",
]

