[[act]]
title = "Moving the legacy server to a policy"
summary = "The intermediate policy sets TLSv1.2 and TLSv1.3, nine forward-secret suites, server preference, no compression and secure renegotiation: 9 of the 13 findings are fixed, grade F (score 0) becomes D (score 51), and weak-key, weak-signature, no-https-redirect and short-hsts are left for a new certificate and HTTP settings."
detail = """
Before the policy, legacy.shop.example has grade F, score 0 and 13 findings. The intermediate policy sets the protocols TLSv1.2 and TLSv1.3, nine suites that are all forward secret and none broken, and the features: server picks, compression off, secure renegotiation.
After the policy the server has grade D, score 51 and 4 findings. Fixed by the policy: broken-cipher, insecure-renegotiation, old-protocol-tlsv1, old-protocol-tlsv1_1, tls-compression, no-forward-secrecy, cbc-suites, client-chooses-cipher and no-tls13. Left to fix by hand: weak-key, weak-signature, no-https-redirect and short-hsts, because they are not protocol settings.
The policy also writes the nginx settings: ssl_protocols, the six ECDHE suites in OpenSSL names, server preference, no session tickets and a two-year Strict-Transport-Security header.
"""
figure = "policy_before_after"
figure_title = "Which findings a policy fixes, and which it cannot"
figure_speech = """
Fourth demo: moving the legacy server to a policy. [[slnc 400]] A policy is a published list of protocols and suites. [[slnc 300]] Here it is Mozilla's intermediate profile. [[slnc 600]]
On the left, before the policy: the thirteen findings of the legacy server. [[slnc 300]] The green ones are the ones the policy fixes. [[slnc 300]] Old protocols, broken suites, missing forward secrecy, compression, and who picks the suite. [[slnc 300]] Nine of the thirteen. [[slnc 700]]
On the right, after the policy: four findings are left, in amber. [[slnc 300]] The weak key and the old signature need a new certificate. [[slnc 300]] The missing redirect and the short H S T S need new H T T P settings. [[slnc 300]] So the grade only rises from F to D.
"""
speech = """
Before the policy: grade F, score zero, thirteen findings. [[slnc 400]] The policy sets T L S one point two and one point three, nine forward secret suites, and safe features. [[slnc 400]] After the policy: grade D, score fifty one, four findings. [[slnc 300]] Nine were fixed by the policy, and four are left to fix by hand.
[[page]]
The policy also writes the matching nginx settings. [[slnc 300]] The protocols, the six suites in Open S S L names, the server's own preference, no session tickets, and a two year H S T S header.
"""
rows = { policy = "active ok" }
