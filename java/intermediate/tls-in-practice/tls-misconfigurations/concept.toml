[threatmodel]
scope = """
The TLS and HTTPS configuration of a shop's servers. It covers protocols, suites, certificates and HSTS-related settings as seen by a client.
It does not cover application bugs, the TLS library's own vulnerabilities, or the certificate authority's operation.
"""
assets = [
    "The confidentiality and integrity of customers' traffic.",
    "The identity of the shop's servers.",
]
actors = [
    "A customer's browser.",
    "A network attacker who can read and change traffic, or record it for later.",
    "The operator who sets up the server.",
]
boundaries = [
    "Client to server across an untrusted network.",
]
assumptions = [
    "The profile is an accurate result of a scan.",
    "The clients the shop must support all handle the policy's protocols and suites.",
]
out_of_scope = [
    "Library vulnerabilities, which need patching.",
    "Issuance and revocation: local-certificate-authority.",
]
tests = [
    "`TlsCheckTest` checks every rule on both sides of its boundary, wildcard matching, the cipher classification, the grading rules, the worst-first order and the policy.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next project, inspecting-tls-traffic, shows what a key log file gives away about an encrypted connection.
"""

[[threat]]
id = "T1"
stride = "T"
threat = "A downgrade to an old protocol or a broken suite lets the attacker read or change traffic"
where = "`Checker` protocol and cipher rules"
control = "Offer TLS 1.2 and 1.3 only, with AEAD suites, server preference"
residual = "Clients that need old protocols are cut off by design"

[[threat]]
id = "T2"
stride = "I"
threat = "Recorded traffic is decrypted later after the server key leaks"
where = "suites without forward secrecy"
control = "ECDHE or TLS 1.3 only"
residual = "Session tickets kept too long can weaken forward secrecy"

[[threat]]
id = "T3"
stride = "S"
threat = "Clients reject or misjudge the certificate: expired, wrong name, incomplete chain, weak key"
where = "`Checker` certificate rules"
control = "Monitoring, full chain, modern keys and signatures, renewal automation"
residual = "Expiry between scans"

[[threat]]
id = "T4"
stride = "T"
threat = "A first plain HTTP request is intercepted and the connection never reaches HTTPS"
where = "`Checker` HTTP rules"
control = "Redirect, HSTS with subdomains and preload where suitable, Secure cookies"
residual = "The very first visit before HSTS is known"

