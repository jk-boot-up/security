    { id = "profile", label = "Server profile", sub = "facts only", col = 1, row = 0, colour = "accent" },
    { id = "checker", label = "Checker", sub = "rules with ids", col = 2, row = 0, colour = "amber" },
    { id = "report", label = "Report", sub = "findings, score, grade", col = 3, row = 0, colour = "green", shape = "store" },
]
edges = [
    { from = "scan", to = "profile" },
    { from = "profile", to = "checker" },
    { from = "checker", to = "report" },
]

