# concept.toml: everything about this project that is not Java code.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "tls-misconfigurations"
level = "intermediate"
module = "tls-in-practice"
title = "Finding TLS Misconfigurations"
short_title = "TLS Misconfigurations"
package = "tlscheck"
main_class = "TlsCheckDemo"
tagline = "A server's TLS is a set of choices, and a checker can read all of them"
bold = "Most TLS failures are settings, not algorithms: old protocols, weak or non-forward-secret suites, an expired or incomplete certificate chain, a missing name, no HSTS; a checker with stable rule ids and a grade finds them all, and a policy fixes the ones a configuration can fix."
domain = "an online shop's servers"
domain_note = ""
youtube_description = "A TLS configuration checker in Java: protocols, cipher suites, certificates, HSTS and a grade."
thumb_lines = ["FINDING TLS", "MISCONFIGURATIONS"]
thumb_code = "rule: no-forward-secrecy"
youtube_title = "Finding TLS Misconfigurations in Java (Protocols, Ciphers, Certificates, HSTS)"
youtube_tags = ["tls", "ssl labs", "cipher suites", "hsts", "certificate chain", "misconfiguration", "java", "application security"]

[readme]
intro = """
A server that "has HTTPS" can still be badly set up. Old protocol versions (SSL 3, TLS 1.0 and 1.1), cipher suites that are broken (RC4, 3DES, export grades, NULL, anonymous) or that give no **forward secrecy**, a certificate that expired last week, one for the wrong name,
a chain missing its **intermediate certificate**, a weak key or a SHA-1 signature, no **HSTS**, a session cookie without `Secure`: each is a setting somebody chose or forgot to choose.

This project writes the checker that finds them. It takes a *profile* of a server (what a scan learned), applies rules with stable ids and severities, and produces a **report**: findings worst first, a score and a grade A to F. Then it moves a legacy server to a
**policy** (after Mozilla's "intermediate" profile) and generates the matching nginx settings.

The rules, grouped:
- **Protocols:** SSL 3, TLS 1.0, TLS 1.1 enabled; no TLS 1.2 or 1.3 at all; no TLS 1.3.
- **Cipher suites:** broken suites, suites without forward secrecy, CBC suites, a server that lets the client choose.
- **Certificate:** expired, not yet valid, expiring within 14 days, wrong name (wildcards cover one label), self-signed or untrusted, incomplete chain, weak key, weak signature.
- **HTTP on top:** HSTS missing, short or without subdomains; no redirect from HTTP; session cookie without `Secure`.
- **Protocol features:** TLS compression, insecure renegotiation.

**Maps to:** OWASP Top 10 (2025) A02 Security Misconfiguration and A04 Cryptographic Failures · CWE-326 · CWE-327 · CWE-295 · OWASP ASVS 5.0, the communications security requirements · Mozilla server-side TLS guidelines.
"""
analogy = """
Think of a building inspector with a checklist: door locks, fire exits, the age of the wiring, the date on the extinguisher. Each item has a name, a severity and a fix, and the report ends in a grade. The inspector does not break in; they read what is there.
"""
scenario = """
An online shop runs four servers: one that follows the guidance, a legacy one, one whose certificate is broken, and one whose owner forgot the HTTP settings. The profiles are fixed data, shaped like the results of a real scan, so every run gives the same report.
"""
costs = [
    "**Old clients break.** Turning off TLS 1.0, 1.1 and 3DES is right for the public web, and wrong for a factory device that cannot be updated: write down who they are.",
    "**Grades are blunt.** A single rule can matter more or less in your setting, which is why findings have ids a team can accept with a reason.",
    "**A scan is a snapshot.** Certificates expire and settings drift; run the checker on a schedule and in the pipeline.",
    "**Real scans are slower and messier than this model:** they try every protocol and suite, and servers behave differently by client.",
    "**HSTS is hard to undo.** A long max-age on a site that later loses HTTPS locks visitors out; start short and raise it.",
]
too_much = """
If you terminate TLS at a managed load balancer or CDN, use its vetted policy and check it with this kind of tool, rather than hand-picking suites. Do not hand-tune cipher lists from memory: start from a published profile.
"""
met_before = [
    "A grade A+ to F from SSL Labs.",
    "`ssl_protocols`, `ssl_ciphers` and `Strict-Transport-Security` in nginx and Apache configurations.",
    "Browser errors: NET::ERR_CERT_DATE_INVALID, ERR_CERT_COMMON_NAME_INVALID and \"incomplete chain\".",
    "`testssl.sh` and `nmap --script ssl-enum-ciphers`.",
]
where = """
This project is in [tls-in-practice](..). It checks the servers that use certificates like those issued in [local-certificate-authority](../local-certificate-authority), and prepares the testssl version
(tls-misconfigurations-with-testssl). The handshake itself is in the beginner [tls-handshake](../../../beginner/transport-security/tls-handshake) project.
"""
twin = """
The servers are described by fixed profiles, so the project is about the rules and the report, not about network scanning. The rules follow the Mozilla server-side TLS guidance and the usual scanner checks; the cipher classification works on IANA suite names.
"""
test_note = "Everything is fixed data and a fixed date, so the demo prints the same text on every run."

[[act]]
title = "A server that follows the guidance"
summary = "TLS 1.2 and 1.3 with forward-secret AEAD suites, a valid complete certificate and HSTS: grade A, no findings."
detail = """
shop.example offers TLS 1.2 and 1.3, only ECDHE and TLS 1.3 AEAD suites, chooses the suite itself, has no compression, supports secure renegotiation, a valid EC certificate with a complete chain, a name that matches, HSTS for two years including subdomains,
a redirect from HTTP, and a Secure cookie. The report is grade A, score 100, no findings.
"""
speech = """
First demo: a server that follows the guidance. [[slnc 400]] Modern protocols, forward secret suites, a valid certificate with its whole chain, and a strict transport security header. [[slnc 300]] Grade A, and no findings.
"""
rows = { good = "active ok" }
console = [
    ["shop.example: grade A (score 100), 0 finding(s)", "ok"],
]

[[act]]
title = "A legacy server"
summary = "13 findings, grade F: old protocols, RC4 and 3DES, no forward secrecy, a 1024-bit SHA-1 certificate, compression, no secure renegotiation, no redirect and a one-day HSTS."
detail = """
legacy.shop.example still offers TLS 1.0 and 1.1, RC4 and 3DES suites, a static RSA suite with no forward secrecy and CBC suites, lets the client choose the suite, enables compression, lacks secure renegotiation, uses a 1024-bit RSA key with a SHA-1 signature, has no
redirect from HTTP and an HSTS of one day. Thirteen findings, worst first: six rated high plus the rest, and the grade is F.
"""
speech = """
Second demo: a legacy server. [[slnc 400]] Old protocols are still on. [[slnc 300]] Broken suites, no forward secrecy, compression, and an old weak certificate. [[slnc 600]]
Thirteen findings, listed worst first, and the grade is F.
"""
rows = { legacy = "active wrong" }
console = [
    ["legacy.shop.example: grade F (score 0), 13 finding(s)", "bad"],
    ["HIGH old-protocol-tlsv1, old-protocol-tlsv1_1, broken-cipher, tls-compression, weak-key, weak-signature, insecure-renegotiation", "bad"],
    ["MEDIUM no-forward-secrecy, no-https-redirect; LOW cbc-suites, client-chooses-cipher, no-tls13, short-hsts", "amber"],
]

[[act]]
title = "A certificate that clients will refuse, and a forgotten HTTP setup"
summary = "pay.shop.example has an expired certificate for the wrong name with no intermediate (F); blog.shop.example is modern but has an incomplete chain, an expiry in 10 days and no HSTS, redirect or Secure cookie (D)."
detail = """
pay.shop.example expired 10 days ago, is issued for www.other.example, and does not send its intermediate: two critical findings and a high one, grade F no matter how good the protocols are. blog.shop.example has a valid but incomplete chain, expires in 10 days,
has no HSTS, no redirect and a cookie without Secure: five findings and a D. A checker finds in seconds what users find as an error page.
"""
speech = """
Third demo: a certificate that clients will refuse, and a forgotten http setup. [[slnc 400]] The pay server's certificate expired ten days ago, is for another name, and misses its intermediate. [[slnc 300]] Grade F. [[slnc 600]]
The blog is modern, but its chain is incomplete, its certificate expires in ten days, and it has none of the http settings. [[slnc 300]] Grade D.
"""
rows = { cert = "active wrong", http = "active amber" }
console = [
    ["pay.shop.example: grade F (score 0), 3 finding(s)", "bad"],
    ["CRITICAL cert-expired, name-mismatch; HIGH incomplete-chain", "bad"],
    ["blog.shop.example: grade D (score 52), 5 finding(s)", "amber"],
    ["HIGH incomplete-chain; MEDIUM cert-expires-soon, cookie-not-secure, no-hsts, no-https-redirect", "amber"],
]

[[act]]
title = "Moving the legacy server to a policy"
summary = "The intermediate policy removes 9 of the 13 findings and generates the nginx settings; weak-key, weak-signature, no-https-redirect and short-hsts must be fixed by hand."
detail = """
A policy replaces the protocol list and the suite list, makes the server choose the suite, and turns off compression and insecure renegotiation. Applied to the legacy server it removes nine of the thirteen findings. Four remain, because they are not protocol settings:
the weak key, the SHA-1 signature, the missing redirect and the short HSTS. The policy also generates an nginx fragment with the same protocols, suites, server preference and a two-year HSTS header.
"""
speech = """
Fourth demo: moving the legacy server to a policy. [[slnc 400]] A policy replaces the protocols and the suites, and turns off the risky features. [[slnc 300]] Nine of the thirteen findings are gone. [[slnc 600]]
Four are left, because they are not protocol settings: the weak key, the old signature, the missing redirect, and the short strict transport security.
"""
rows = { policy = "active ok" }
console = [
    ["findings before: 13, after the intermediate policy: 4", "ok"],
    ["left to fix by hand: weak-key, weak-signature, no-https-redirect, short-hsts", "amber"],
    ["ssl_protocols TLSv1.2 TLSv1.3;", "muted"],
]

[animation]
subtitle = "Four servers, one checklist, and the grade that comes out."
boxes = [
    ["good", "A good server", "modern, complete, strict"],
    ["legacy", "A legacy server", "old protocols, broken suites"],
    ["cert", "A bad certificate", "expired, wrong name, no intermediate"],
    ["http", "Forgotten HTTP settings", "no HSTS, no redirect"],
    ["policy", "A policy", "fixes what configuration can fix"],
]

[docs.problem]
scenario = """
An online shop runs several HTTPS servers set up at different times by different people, and nobody knows which of them would pass a security review.
"""
naive = """
If the browser shows a padlock, TLS is fine.
"""
deliver = [
    "A server profile model and four fixed servers.",
    "A checker with stable rule ids, severities, a score and a grade.",
    "Cipher suite classification by IANA name.",
    "Policies after the Mozilla profiles that fix protocols and suites, and an nginx fragment generator.",
]

[docs.prerequisites]
required = [
    "Java basics",
    "The beginner tls-handshake project, or an idea of protocol versions, cipher suites and certificates",
]
not_required = [
    "A real TLS server or scanner: the profiles are fixed data",
    "nginx",
]
install = []

[docs.session]
objectives = [
    "list the settings that make a TLS server weak, with a reason for each",
    "explain forward secrecy and why a suite without it is a finding",
    "explain why an incomplete chain breaks some clients and not others",
    "describe what a policy can and cannot fix",
]
walkthrough = """
Run act two and ask which findings a policy file can fix, and which need a new certificate. In act three, ask why a good protocol list does not rescue the pay server. In act four, ask what to check next, a month later.
"""
exercises = [
    "Add a rule for certificates valid for more than 398 days.",
    "Add a rule for a missing OCSP stapling flag, and decide its severity.",
    "Make the build fail when a report has a finding that is not on an accepted list with a reason.",
    "Add a TLS 1.3-only profile for internal services and check it with the modern policy.",
]

[docs.explained]
sentence = """
TLS security is mostly configuration, so check protocols, suites, certificates and HTTP settings with named rules on a schedule, start from a published policy, and fix the certificate and header problems that no policy can.
"""
verdict = """
Offer TLS 1.2 and 1.3 only, with forward-secret AEAD suites, from a published profile. Send the complete chain, watch expiry with an alert well before the date, set HSTS with a growing max-age, redirect HTTP, mark cookies Secure, and run a checker in CI and on a schedule.
"""
recognise = [
    "`ssl_protocols`, `ssl_ciphers` and `ssl_prefer_server_ciphers` in nginx.",
    "`Strict-Transport-Security: max-age=...; includeSubDomains`.",
    "Reports from SSL Labs, testssl.sh and Qualys.",
    "A finding titled \"Weak SSL/TLS Configuration\" with CWE-326 or CWE-327.",
]

[spec]
purpose = """
Teach TLS configuration review by writing a checker with stable rules and a grade, running it against four fixed servers, and moving a legacy server to a published policy.
"""
nongoals = [
    "Network scanning: the profiles are fixed data.",
    "testssl.sh: the tls-misconfigurations-with-testssl project.",
    "TLS implementation attacks beyond configuration (the library must be patched).",
]
problem = """
Servers are set up once and never reviewed, so old settings, expiring certificates and missing headers stay until a user or an auditor finds them.
"""
roles = [["The profile", "`ServerProfile`, `CertFacts`, `HttpFacts`"], ["The checker and its report", "`Checker`, `Finding`, `Severity`, `Report`, `CipherSuites`"], ["Policies", "`Policy`"], ["Demo servers", "`Profiles`"], ["Entry point", "`TlsCheckDemo`"]]
requirements = [
    "Each rule has a stable id and severity, and reports are sorted worst first.",
    "Old protocols, broken and non-forward-secret suites, certificate faults and HTTP faults are found, with boundary tests.",
    "Wildcards match one label only.",
    "Grades follow the score, and any critical finding gives F while any high finding caps the grade at C.",
    "A policy fixes protocol and suite findings and nothing else, and generates an nginx fragment.",
    "The demo prints the same output on every run.",
]

