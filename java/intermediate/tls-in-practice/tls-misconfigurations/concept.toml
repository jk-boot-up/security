[threatmodel]
scope = """
The TLS and HTTPS configuration of a shop's servers. It covers protocols, suites, certificates and HSTS-related settings as seen by a client.
It does not cover application bugs, the TLS library's own vulnerabilities, or the certificate authority's operation.
"""
assets = [
    "The confidentiality and integrity of customers' traffic.",
    "The identity of the shop's servers.",
]
actors = [
    "A customer's browser.",
    "A network attacker who can read and change traffic, or record it for later.",
    "The operator who sets up the server.",
]
boundaries = [
    "Client to server across an untrusted network.",
]
assumptions = [
    "The profile is an accurate result of a scan.",
    "The clients the shop must support all handle the policy's protocols and suites.",
]
out_of_scope = [
    "Library vulnerabilities, which need patching.",
    "Issuance and revocation: local-certificate-authority.",
]
tests = [
    "`TlsCheckTest` checks every rule on both sides of its boundary, wildcard matching, the cipher classification, the grading rules, the score bands, the suite name parts, the worst-first order and the policy.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next project, inspecting-tls-traffic, shows what a key log file gives away about an encrypted connection.
"""

[[threat]]
id = "T1"
stride = "T"
threat = "A downgrade to an old protocol or a broken suite lets the attacker read or change traffic"
where = "`Checker` protocol and cipher rules"
control = "Offer TLS 1.2 and 1.3 only, with AEAD suites, server preference"
residual = "Clients that need old protocols are cut off by design"

[[threat]]
id = "T2"
stride = "I"
threat = "Recorded traffic is decrypted later after the server key leaks"
where = "suites without forward secrecy"
control = "ECDHE or TLS 1.3 only"
residual = "Session tickets kept too long can weaken forward secrecy"

[[threat]]
id = "T3"
stride = "S"
threat = "Clients reject or misjudge the certificate: expired, wrong name, incomplete chain, weak key"
where = "`Checker` certificate rules"
control = "Monitoring, full chain, modern keys and signatures, renewal automation"
residual = "Expiry between scans"

[[threat]]
id = "T4"
stride = "T"
threat = "A first plain HTTP request is intercepted and the connection never reaches HTTPS"
where = "`Checker` HTTP rules"
control = "Redirect, HSTS with subdomains and preload where suitable, Secure cookies"
residual = "The very first visit before HSTS is known"

[poster]
headline = [["FINDING TLS", "text"], ["MISCONFIGURATIONS", "accent"]]
taglines = [["A checker reads every TLS setting a server chose", "gold"]]
before = { code = "legacy.shop.example  grade F (score 0)", note = "A legacy server", tag = "BEFORE" }
after = { code = "ssl_protocols TLSv1.2 TLSv1.3;", note = "Moved to a policy", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "Finding TLS Misconfigurations"
narration = "Hello, and welcome. [[slnc 400]] This video explains how to find T L S misconfigurations, in Java. [[slnc 300]] T L S is transport layer security, the protocol behind the padlock in the browser. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A server that has the padlock can still be set up badly. [[slnc 300]] Old protocol versions, weak cipher suites, a certificate that expired or names the wrong site, a missing intermediate certificate. [[slnc 300]] Each one is a setting someone chose, or forgot. [[slnc 300]] A checker can read them all, and a policy fixes most of them. [[slnc 600]] Think of a home inspection: the house has a lock, but the inspector checks every window too, and writes a grade. [[slnc 600]] Our example is an online shop's servers."

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online shop runs four servers:", "  one that follows the guidance", "  a legacy one", "  one with a broken certificate", "  one whose HTTP settings were forgotten", "", "Each server is a fixed profile,", "shaped like the result of a real scan."]
narration = "Here is the scenario. [[slnc 400]] An online shop runs four servers. [[slnc 300]] One follows the guidance, one is a legacy server, one has a broken certificate, and on one the owner forgot the H T T P settings. [[slnc 500]] Each server is described by a fixed profile, shaped like the result of a real scan, so every run gives the same report. [[slnc 500]] The checker applies its rules, takes off points for each finding, and grades each server from A to F."

[[scene]]
key = "02-words"
kind = "bullets"
title = "The Words"
body = ["Protocol version: SSL 3, TLS 1.0 ... TLS 1.3", "Cipher suite: the algorithms of one connection", "Forward secrecy: a fresh key for each connection", "Certificate chain: server, intermediate, root", "Finding: a broken rule, with an id and a severity", "Policy: a published set of good settings"]
narration = """Before the demos, the words. [[slnc 500]] A protocol version is the edition of the protocol: S S L three is very old, T L S one point three is the newest. [[slnc 500]] A cipher suite names the algorithms one connection uses. [[slnc 500]] Forward secrecy means each connection gets a fresh key, so a stolen server key cannot open recorded traffic. [[slnc 500]] A certificate chain runs from the server's certificate, through an intermediate, to a root the client trusts. [[slnc 500]] A finding is one broken rule, with a stable id and a severity. [[slnc 500]] And a policy is a published set of good settings."""

[[scene]]
key = "02-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "02-suite-name"
kind = "figure"
title = "What a cipher suite name says"
body = "suite_name"
narration = """Let's see the core idea on one example: a cipher suite name. [[slnc 400]] The name lists the parts of the connection, in a fixed order. [[slnc 600]] At the top, a good suite. [[slnc 300]] E C D H E is the key exchange: a fresh key for every connection. [[slnc 300]] R S A is how the server proves who it is. [[slnc 300]] A E S one twenty eight is the cipher, and G C M is the mode: it encrypts and checks in one step. [[slnc 300]] S H A two fifty six is the hash. [[slnc 700]]
At the bottom, a broken suite. [[slnc 300]] The key exchange is plain R S A: one server key protects every session, so there is no forward secrecy. [[slnc 300]] And the cipher is R C four, a stream cipher that is broken. [[slnc 600]] A checker reads exactly these words in each name."""

[[scene]]
key = "03-acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "04-costs"
kind = "bullets"
title = "What It Costs"
body = ["Turning off old protocols breaks old clients", "A grade hides detail: read the findings", "A scan is a snapshot", "Real scans are slower and messier", "HSTS is hard to undo"]
narration = "Nothing is free. [[slnc 400]] Here is what it costs. [[slnc 500]] Turning off old protocols breaks the old clients that still use them. [[slnc 500]] A single grade hides detail, so read the findings, not just the letter. [[slnc 500]] A scan is a snapshot, true only on the day it ran. [[slnc 500]] Real scans of real servers are slower and messier than this model. [[slnc 300]] And H S T S, once a browser has seen it, is hard to undo."

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["A grade from A+ to F on a scanning site", "ssl_protocols and ssl_ciphers in nginx", "A browser error: certificate expired or wrong name", "testssl.sh and nmap's ssl-enum-ciphers"]
narration = "You have probably met this already. [[slnc 400]] A public scanning site that grades a server from A plus to F runs this kind of checker. [[slnc 500]] The ssl protocols and ssl ciphers lines in an nginx file are the settings it reads. [[slnc 500]] A browser error that says a certificate has expired, or is for another name, is a finding that reached a customer. [[slnc 500]] And tools like test s s l and nmap list every protocol and suite a server offers."

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "How To Use It"
body = ["TLS 1.2 and 1.3 only", "Forward-secret AEAD suites from a published profile", "Send the complete chain", "Alert well before a certificate expires", "HSTS, a redirect, Secure cookies", "Run the checker on a schedule"]
narration = "So, how do you use it? [[slnc 400]] Offer only T L S one point two and one point three. [[slnc 300]] Use forward secret A E A D suites, from a published profile like Mozilla's. [[slnc 500]] Send the complete certificate chain, and alert well before a certificate expires. [[slnc 500]] Send H S T S, redirect plain H T T P, and mark session cookies secure. [[slnc 300]] And run a checker in your pipeline, and on a schedule against the live servers."

[[scene]]
key = "12-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a rule for certificates", "valid for more than 398 days."]
narration = "That's finding T L S misconfigurations. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] T L S security is mostly configuration, so check protocols, suites, certificates and H T T P settings with named rules, on a schedule, start from a published policy, and fix by hand what no policy can. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a rule for certificates that are valid for more than three hundred and ninety eight days. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] The servers are fixed data, so the classes are all about the rules. [[slnc 300]] Here are the ones that matter."""

[[class]]
name = "Checker"
what = "the rules, the points and the grade"
[[class.part]]
title = "a rule with an id and a severity"
code = """
if (c.dnsNames().stream().noneMatch(n -> nameMatches(n, s.host()))) {
    f.add(new Finding("name-mismatch", Severity.CRITICAL,
            s.host() + " is not in " + c.dnsNames()));
"""
speech = """Each rule is a plain if. [[slnc 300]] When it fails, it adds a finding with a stable id, a severity and a message. [[slnc 300]] A build can fail on the id, without parsing the text."""
[[class.part]]
title = "points, then a grade"
code = """
int score = Math.max(0, 100 - f.stream().mapToInt(x -> x.severity().penalty()).sum());
...
if (f.stream().anyMatch(x -> x.severity() == Severity.CRITICAL)) {
    return 'F';
"""
speech = """The score is one hundred minus each finding's penalty, and never below zero. [[slnc 300]] Any critical finding gives F, whatever the score."""

[[class]]
name = "Severity"
what = "what each kind of finding costs"
[[class.part]]
title = "the penalties"
code = """
INFO(0), LOW(2), MEDIUM(7), HIGH(20), CRITICAL(60);
"""
speech = """Five severities, each with its penalty in points. [[slnc 300]] One critical finding alone takes sixty."""

[[class]]
name = "CipherSuites"
what = "reads a cipher suite by its name"
[[class.part]]
title = "forward secrecy from the name"
code = """
public static boolean lacksForwardSecrecy(String suite) {
    return !tls13(suite) && !suite.contains("_ECDHE_")
            && !suite.contains("_DHE_");
"""
speech = """A suite gives forward secrecy when its key exchange is E C D H E or D H E, or when it is a T L S one point three suite. [[slnc 300]] The name says which."""

[[class]]
name = "SuiteName"
what = "a teaching class: a suite name split into its parts"
[[class.part]]
title = "split at _WITH_"
code = """
String[] sides = suite.substring("TLS_".length()).split("_WITH_");
String[] kx = sides[0].split("_", 2);
"""
speech = """Before the word with: the key exchange and the authentication. [[slnc 300]] After it: the cipher, the mode and the hash. [[slnc 300]] A test checks that the key exchange part agrees with the forward secrecy rule."""

[[class]]
name = "Policy"
what = "a published profile, applied to a server"
[[class.part]]
title = "replace protocols and suites, keep the rest"
code = """
public ServerProfile applyTo(ServerProfile s) {
    return new ServerProfile(s.host(), protocols, cipherSuites, true, false, true,
            s.certificate(), s.http());
"""
speech = """A policy replaces the protocols and the suites, and sets the three safe features. [[slnc 300]] The certificate and the H T T P settings are kept as they were. [[slnc 300]] That is why four findings stay."""

[[acronym]]
short = "TLS"
long = "Transport Layer Security: the protocol behind HTTPS"
say = "T L S is transport layer security: the protocol that encrypts a connection and proves the server's identity."
[[acronym]]
short = "SSL"
long = "Secure Sockets Layer: TLS's old, broken predecessor"
say = "S S L is secure sockets layer, the old protocol that T L S replaced. Every version of it is broken."
[[acronym]]
short = "HTTP, HTTPS"
long = "Hypertext Transfer Protocol; HTTP over TLS"
say = "H T T P is the hypertext transfer protocol of the web. H T T P S is H T T P inside T L S."
[[acronym]]
short = "HSTS"
long = "HTTP Strict Transport Security: always use HTTPS here"
say = "H S T S is H T T P strict transport security: a header that tells the browser to use only H T T P S for this site, for max-age seconds."
[[acronym]]
short = "RSA"
long = "Rivest-Shamir-Adleman: a public-key algorithm"
say = "R S A, after Rivest, Shamir and Adleman, is a public key algorithm. Used as a key exchange, it gives no forward secrecy."
[[acronym]]
short = "EC, ECDSA"
long = "Elliptic Curve keys; Elliptic Curve Digital Signature Algorithm"
say = "E C means elliptic curve keys. E C D S A is the elliptic curve digital signature algorithm."
[[acronym]]
short = "ECDHE, DHE"
long = "(Elliptic Curve) Diffie-Hellman Ephemeral key exchange"
say = "E C D H E and D H E are Diffie Hellman ephemeral key exchanges: a fresh key for every connection, which gives forward secrecy."
[[acronym]]
short = "AES, AES128, AES256"
long = "Advanced Encryption Standard, with 128- or 256-bit keys"
say = "A E S is the advanced encryption standard, the usual block cipher, with a key of one hundred twenty eight or two hundred fifty six bits."
[[acronym]]
short = "GCM, CBC"
long = "Galois/Counter Mode; Cipher Block Chaining: cipher modes"
say = "G C M is Galois counter mode, which encrypts and checks in one step. C B C is cipher block chaining, an older mode that needs care."
[[acronym]]
short = "AEAD"
long = "Authenticated Encryption with Associated Data"
say = "A E A D is authenticated encryption with associated data: a mode like G C M that encrypts and detects changes."
[[acronym]]
short = "RC4"
long = "Rivest Cipher 4: a broken stream cipher"
say = "R C four is Rivest cipher four, a stream cipher with known biases. It is broken."
[[acronym]]
short = "DES, 3DES"
long = "Data Encryption Standard; triple DES: broken old ciphers"
say = "D E S is the old data encryption standard, and triple D E S runs it three times. Both are too weak today."
[[acronym]]
short = "SHA, SHA-1, SHA256, SHA384"
long = "Secure Hash Algorithm; SHA-1 is broken"
say = "S H A is the secure hash algorithm. S H A one is broken for signatures; S H A two fifty six is fine."
