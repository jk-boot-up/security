# concept.toml: everything about this project that is not Java code.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "inspecting-tls-traffic-with-wireshark"
level = "intermediate"
module = "tls-in-practice"
title = "Inspecting TLS Traffic with Wireshark"
short_title = "TLS Traffic with tshark"
package = "tlscapture"
main_class = "TlsCaptureDemo"
tagline = "A capture shows a name, times and sizes, a key log opens exactly the connections it lists, and a leaked server key opens only what never used an ephemeral key"
bold = "A capture of a real TLS 1.3 login shows the server name, the cipher the server chose and encrypted records, and nothing of the password; tshark with the key log the client wrote opens that connection (and its encrypted certificate) and no other, a log with only the client's lines opens only requests, and a leaked server key opens a recording made with RSA key exchange but not one made with ephemeral keys."
domain = "an online store"
domain_note = ""
youtube_description = "A real nginx, the openssl client with a key log file, a tap that writes a capture file of a login, and tshark 4.6: what the capture shows without secrets (the server name, the cipher, encrypted records), what the key log opens (the request, the form, the cookie, the encrypted certificate), why one connection's key log opens no other, a log with only the client's lines, and the difference between a leaked server key on a recording made with ephemeral keys and one made with RSA key exchange."
thumb_lines = ["TLS TRAFFIC", "WITH TSHARK"]
thumb_code = "tshark -o tls.keylog_file:keys.log"
youtube_title = "Inspecting TLS Traffic with Wireshark and tshark: Key Logs and Leaked Keys (OWASP A04)"
youtube_tags = ["wireshark", "tshark", "tls", "key log", "sslkeylogfile", "tls 1.3", "forward secrecy", "owasp top 10", "a04", "java"]

[readme]
intro = """
The plain [inspecting-tls-traffic](../inspecting-tls-traffic) project decrypts a recorded TLS 1.3 session in Java with HKDF. This one uses the real tools: **nginx**, the **openssl** client with `-keylogfile`, and **tshark** (`brew install nginx step wireshark`). Nothing is captured from a network card, which needs rights a test should not ask for: a small **tap** in Java sits between the client and the server on loopback, forwards every byte and writes a capture file (pcap) of what went through, which is all that a machine on the path would see. The tests are tagged `integration` (the capture-file test is not): `./gradlew integrationTest`.

What it shows:
- **What the wire shows.** The Client Hello names the shop in the clear, the Server Hello picks `TLS_AES_256_GCM_SHA384`, the rest is encrypted records: no certificate, no HTTP, no password.
- **A key log.** `openssl s_client -keylogfile` writes five lines (the client random and a secret each), the same format a browser writes when `SSLKEYLOGFILE` is set. It holds no private key.
- **The same capture with the key log.** tshark shows `POST /login`, the form fields, the cookie, and the encrypted certificate.
- **One connection only.** A second login is closed to the first login's key log; one file with both logs opens both; a log with only the client's lines opens the requests and not the responses.
- **The server's own key.** A TLS 1.2 certificate is visible in the clear. With the server's private key, a recording made with ECDHE stays closed and a recording made with RSA key exchange opens, password and all.

**Maps to:** OWASP Top 10 (2025) A04 Cryptographic Failures · CWE-312 (cleartext storage of sensitive information), CWE-532 · RFC 8446 (TLS 1.3) · the NSS key log format.
"""
analogy = """
Sealed envelopes carried past a watcher. The watcher sees the address on the outside, the times and the sizes. A note from the sender with that one envelope's key opens that envelope and no other; the post office's master key opens old envelopes only if they were sealed the old way.
"""
scenario = """
An online store's shopper logs in over TLS 1.3. The demo plays a person with a capture file and the tools to read it, and shows what they can and cannot learn.
"""
costs = [
    "**A key log is as good as the password it protects,** so where it is written and when it is deleted matter.",
    "**Names, times and sizes stay visible** even with TLS 1.3.",
    "**A capture on a real network needs rights** that are rightly hard to get.",
    "**Debugging with decryption tempts a team to leave logging on.**",
]
too_much = """
If you can read the application's own logs, you rarely need to decrypt the wire. Decrypt traffic when the bug is between the machines: a proxy, a handshake, a header added on the way.
"""
met_before = [
    "An environment variable `SSLKEYLOGFILE` in a developer's shell.",
    "A Wireshark screen full of `Application Data`.",
    "A `.pcap` attached to a bug report.",
    "Someone saying \"just turn off TLS in test\".",
]
where = """
This is the tools version of [inspecting-tls-traffic](../inspecting-tls-traffic), in the [tls-in-practice](..) module. The certificates come from the kind of authority built in [local-certificate-authority-with-step-ca](../local-certificate-authority-with-step-ca).
"""
twin = """
nginx, openssl and tshark are the real programs; the tap writes a real pcap file. Secrets, ports and packet counts are never printed; the demo takes about half a minute.
"""
test_note = "The capture-file writer is tested with no program. The other tests need nginx, openssl, step and tshark (./gradlew integrationTest)."

[[act]]
title = "What the wire shows"
summary = "The capture shows the server name, the chosen cipher and encrypted records; the certificate, the request and the password are not there."
detail = """
A login to the shop over TLS 1.3 is copied by a tap and read with tshark and no secrets. The Client Hello names www.shop.localhost in the clear and the Server Hello chooses TLS_AES_256_GCM_SHA384. The certificate is not in the capture, no HTTP request can be read, and the encrypted application data records are there. The bytes of the capture do not contain the word password. A watcher still learns the name, the times and the sizes.
"""
speech = """
First demo: what the wire shows. [[slnc 400]] The client hello names the shop in the clear. [[slnc 600]]
After that, only encrypted records. [[slnc 300]] No certificate, no request, no password.
"""
rows = { wire = "active ok" }
console = [
    ["Client Hello: SNI www.shop.localhost", "bad"],
    ["Server Hello: TLS_AES_256_GCM_SHA384", "ok"],
    ["HTTP requests tshark can read: 0", "ok"],
]

[[act]]
title = "A key log: the secrets of one connection"
summary = "The client writes five lines, each tied to one connection by its client random, and no private key."
detail = """
openssl s_client -keylogfile writes five lines, as a browser does when SSLKEYLOGFILE is set: the handshake and traffic secrets of both sides and the exporter secret. Each line is a label, the connection's client random (32 bytes) and a secret (48 bytes), which ties it to one connection and nothing else. The file holds no private key.
"""
speech = """
Second demo: a key log. [[slnc 400]] The client writes five lines. [[slnc 600]]
Each line names one connection by its client random. [[slnc 300]] There is no private key in the file.
"""
rows = { keylog = "active ok" }
console = [
    ["5 lines: handshake, traffic and exporter secrets", "ok"],
    ["each tied to one client random", "ok"],
    ["no private key in the file", "ok"],
]

[[act]]
title = "The same capture, read with the key log"
summary = "tshark with the key log shows the request, the form fields, the cookie and the certificate."
detail = """
With the key log, tshark shows POST /login with the form fields user and password, ana and hunter2; the response 200 with the Set-Cookie header and the page; and the encrypted handshake opens too, so the certificate, for www.shop.localhost, is visible. In TLS 1.3 the certificate is encrypted, and the key log opens it.
"""
speech = """
Third demo: the same capture, read with the key log. [[slnc 400]] Now tshark shows the post to slash login. [[slnc 600]]
The form fields, the cookie, and even the certificate, which T L S one point three encrypts.
"""
rows = { read = "active wrong" }
console = [
    ["POST /login: user=ana, password=hunter2", "bad"],
    ["200 with Set-Cookie: session=7f3a; Secure; HttpOnly", "ok"],
    ["the encrypted certificate is visible", "ok"],
]

[[act]]
title = "A key log opens its own connection and no other"
summary = "A second login is closed to the first key log; one file with both opens both; a log with only the client's lines opens only requests."
detail = """
A second login read with the first login's key log has 0 HTTP packets; with its own key log it opens. One file with both logs opens both captures. A log with only the client's lines opens the requests and not the responses.
"""
speech = """
Fourth demo: a key log opens its own connection and no other. [[slnc 400]] The second login stays closed to the first log. [[slnc 600]]
A log with only the client's lines opens the requests, and not the responses.
"""
rows = { own = "active ok" }
console = [
    ["login two with log one: 0 HTTP packets", "ok"],
    ["one file with both logs opens both", "ok"],
    ["client lines only: requests open, responses closed", "ok"],
]

[[act]]
title = "The server's own key is a different matter"
summary = "A TLS 1.2 certificate is in the clear; a leaked server key opens an RSA key exchange recording and not an ECDHE one."
detail = """
Over TLS 1.2 the certificate is visible without any secret; over TLS 1.3 it is not. A recording made with ephemeral key exchange (ECDHE) stays closed when the server's private key leaks: 0 HTTP packets opened. A recording made with RSA key exchange opens, password and all: a leaked key opens everything recorded before. A key log is as good as the password it protects. Nothing here needed a network card.
"""
speech = """
Fifth demo: the server's own key is a different matter. [[slnc 400]] With ephemeral keys, a leaked server key opens nothing. [[slnc 600]]
With R S A key exchange, it opens every recording. [[slnc 300]] That is why forward secrecy matters.
"""
rows = { serverkey = "active ok" }
console = [
    ["ECDHE recording + leaked server key: closed", "ok"],
    ["RSA key exchange recording + leaked server key: opened", "bad"],
]

[animation]
subtitle = "An online store, a tap on the wire, and what a capture can show."
boxes = [
    ["wire", "The wire", "name, times, sizes"],
    ["keylog", "The key log", "one connection's secrets"],
    ["read", "Reading it", "request, cookie, certificate"],
    ["own", "One only", "no other connection"],
    ["serverkey", "The server key", "ephemeral or not"],
]

[docs.problem]
scenario = """
An online store has a bug between a client and a server, and someone wants to read the traffic; or an attacker has a recording and wants the passwords in it.
"""
naive = """
Turn off TLS in test, or assume that a recording of TLS traffic is useless to everyone.
"""
deliver = [
    "A real capture of a real TLS 1.3 login.",
    "What it shows with and without secrets.",
    "Why a key log is limited to one connection.",
    "Why forward secrecy protects old recordings.",
]

[docs.prerequisites]
required = [
    "Java basics",
    "The plain inspecting-tls-traffic project, for the ideas",
    "nginx, step and tshark: brew install nginx step wireshark",
    "The openssl command (version 3 or later)",
]
not_required = [
    "Rights to capture from a network card",
]
install = ["nginx", "step", "wireshark"]

[docs.session]
objectives = [
    "read a capture with and without a key log",
    "say what a key log contains and what it does not",
    "explain why one key log opens one connection",
    "explain what a leaked server key opens",
]
walkthrough = """
Run act one and list what the watcher learns. In act three find what TLS 1.3 encrypts that TLS 1.2 does not. In act five find which recording stays closed.
"""
exercises = [
    "Add a third login and a key log with only its server lines.",
    "Capture a TLS 1.2 login with ECDHE and open it with a key log.",
    "Put the key log under a mode of 600 and check who can read it.",
    "Find the packet sizes in the capture and guess which one is the login.",
]

[docs.explained]
sentence = """
Encryption hides the content and not the conversation, and the secrets that open it are kept per connection by whoever wrote them down.
"""
verdict = """
Keep key logs out of production and delete them, prefer ephemeral key exchange so that a leaked server key opens nothing old, remember that names, times and sizes stay visible, and treat a capture as sensitive even if it is encrypted.
"""
recognise = [
    "`SSLKEYLOGFILE` in an environment.",
    "A `.pcap` file in a ticket.",
    "A Wireshark screen of `Application Data` records.",
    "`tls.keylog_file` in a Wireshark preference.",
]

[spec]
purpose = """
Teach what a TLS capture shows and what opens it, with real tools and a tap that writes the capture.
"""
nongoals = [
    "Capturing from a network card.",
    "Breaking TLS.",
    "Decrypting QUIC.",
]
problem = """
People either think a TLS recording is useless or that it can be read at will; both are wrong in specific ways.
"""
roles = [["The tap", "`Tap`, `Pcap`"], ["The servers", "`Nginx`, `LegacyServer`"], ["The client", "`Client`"], ["The reader", "`Tshark`"], ["Entry point", "`TlsCaptureDemo`"]]
requirements = [
    "A tap forwards a connection and writes a valid capture file.",
    "tshark reads the capture with and without secrets.",
    "A key log opens only its own connection.",
    "A server key opens an RSA key exchange recording and not an ECDHE one.",
    "The demo prints the same output on every run.",
]

