[threatmodel]
scope = """
Recorded TLS traffic of the shop's login, the key logs and server keys that could open it, and the choices that decide what they open. It does not cover capturing on a real network.
"""
assets = [
    "The shoppers' passwords and sessions.",
    "The server's private key and any key logs.",
]
actors = [
    "A watcher on the path who records traffic.",
    "A developer who debugs with a key log.",
    "A thief who later obtains a key.",
]
boundaries = [
    "The network: everything on it is recorded.",
    "The files where secrets are written.",
]
assumptions = [
    "Key logs are written only on development machines.",
    "Servers use ephemeral key exchange.",
]
out_of_scope = [
    "Breaking the cipher itself.",
    "Traffic analysis beyond sizes and times.",
]
tests = [
    "`PcapTest` reads back the capture file the tap writes, byte by byte.",
    "`ClientHelloTest`, `KeyLogTest` and `SuitesTest` check the by-hand classes with no program; `ClientHelloTest` parses a Client Hello the JDK writes.",
    "`TlsCaptureTest` runs nginx, the openssl client, a tap and tshark for what the capture shows, the key log, one connection only and the server key.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next project in this module is certificate-pinning, then the secure-coding module.
"""

[[threat]]
id = "T1"
stride = "I"
threat = "A watcher learns who talks to whom, when and how much"
where = "the network"
control = "Encrypted Client Hello, padding, fewer names"
residual = "Times and sizes"

[[threat]]
id = "T2"
stride = "I"
threat = "A recording is opened later with a stolen server key"
where = "key exchange"
control = "Ephemeral key exchange (ECDHE) only"
residual = "None for sessions that used it"

[[threat]]
id = "T3"
stride = "I"
threat = "A key log opens a connection"
where = "the client's key log file"
control = "No SSLKEYLOGFILE in production, short-lived files, restricted access"
residual = "Developer machines"

[[threat]]
id = "T4"
stride = "E"
threat = "Keys are read from a server's disk"
where = "the server's files"
control = "File permissions, hardware keys"
residual = "Anyone with the server's rights"

[poster]
headline = [["TLS TRAFFIC", "text"], ["WITH TSHARK", "accent"]]
taglines = [["A key log opens one connection; a leaked key opens only RSA", "gold"]]
before = { code = "server name www.shop.localhost", note = "What the wire shows", tag = "BEFORE" }
after = { code = "tshark -o tls.keylog_file:keys.log", note = "What a key log opens", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "Inspecting TLS Traffic with Wireshark"
narration = "Hello, and welcome. [[slnc 400]] This video explains inspecting T L S, transport layer security, traffic with Wireshark's command line tool, tshark. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A recording of a real T L S login shows the shop's name, the times, and the sizes, but not the password. [[slnc 300]] With the key log that the client wrote, tshark opens that one connection, and no other. [[slnc 300]] A stolen server key opens only recordings made without one time keys. [[slnc 600]] Think of a sealed envelope. [[slnc 300]] Anyone sees the address and the weight, but only the right letter opener reads it. [[slnc 600]] Our example is an online store."

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["A shopper signs in to an online store", "over TLS 1.3.", "", "The demo runs a real nginx, the openssl client", "with a key log, and a small tap", "that records every byte to a capture file.", "", "tshark reads the file, with and without keys."]
narration = "Here is the scenario. [[slnc 400]] A shopper signs in to an online store over T L S one point three. [[slnc 500]] The demo runs a real nginx, and the open S S L client, which writes a key log. [[slnc 300]] A small tap, written in Java, sits between them and records every byte to a capture file, so no network card or special rights are needed. [[slnc 500]] Then tshark reads that file, with no keys, with the key log, and with the server's own key."

[[scene]]
key = "02-words"
kind = "bullets"
title = "The Words"
body = ["Capture: a file of every packet that passed", "Client Hello: the client's first message, in the clear", "Client random: 32 new bytes in every Client Hello", "Key log: the secrets of a connection, written down", "Key exchange: how both sides get the same secret"]
narration = """Before the demos, the words. [[slnc 500]] A capture is a file of every packet that passed, as a watcher on the path would record it. [[slnc 500]] The client hello is the client's first message, sent before any key exists, so it is in the clear. [[slnc 500]] The client random is thirty two new bytes in every client hello. [[slnc 500]] A key log is a file where the client writes down the secrets of a connection. [[slnc 500]] And the key exchange is how client and server end up with the same secret."""

[[scene]]
key = "02-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "02-wire-and-key-log"
kind = "figure"
title = "The same login, two ways"
body = "wire_and_key_log"
narration = """Let's see the whole idea on one picture. [[slnc 400]] At the top, the login the shopper's client sends: a post to slash login, with user ana and password hunter two, inside T L S one point three. [[slnc 700]] On the left, the capture read with no secrets. [[slnc 300]] The server name, in the clear. [[slnc 300]] The cipher the server chose. [[slnc 300]] No certificate, no H T T P, and a login record of one hundred and eighty bytes. [[slnc 700]] On the right, the very same bytes, read with the key log the client wrote. [[slnc 300]] The request, the password, the response, the session cookie, and even the certificate. [[slnc 700]] Every value here comes from the demo's real output. [[slnc 300]] Without the log, a name, a cipher and sizes. [[slnc 300]] With it, everything."""

[[scene]]
key = "03-acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "04-costs"
kind = "bullets"
title = "What It Costs"
body = ["A key log opens every connection it lists", "Names, times and sizes stay visible", "Capturing a real network needs rights", "Decryption tempts teams to leave logging on"]
narration = "Nothing is free. [[slnc 400]] Here is what it costs. [[slnc 500]] A key log opens every connection it lists, so it is as sensitive as the passwords inside them. [[slnc 500]] Encryption hides the content, but the names, the times and the sizes stay visible. [[slnc 500]] Recording a real network needs rights that a test should not ask for. [[slnc 300]] And once decryption makes debugging easy, a team is tempted to leave key logging on."

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["SSLKEYLOGFILE in an environment", "Wireshark showing only \"Application Data\"", "A capture file attached to a support ticket", "\"(Pre)-Master-Secret log filename\" in Wireshark"]
narration = "You have probably met this already. [[slnc 400]] An S S L key log file variable, in an environment, is a client writing its secrets down. [[slnc 500]] A Wireshark screen full of application data records is a capture without keys. [[slnc 500]] A capture file attached to a support ticket is sensitive, even when it is encrypted. [[slnc 500]] And the pre master secret log setting in Wireshark is where the key log is read."

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Keep key logs out of production; delete them", "Ephemeral key exchange only", "Names, times and sizes stay visible", "Treat every capture as sensitive"]
narration = "So, how do you use it? [[slnc 400]] Keep key logs out of production, and delete them after use. [[slnc 500]] Offer only ephemeral key exchange, so a leaked server key opens nothing that was recorded. [[slnc 500]] Remember that names, times, and sizes stay visible to anyone on the path. [[slnc 300]] And treat every capture as sensitive, even when it is encrypted."

[[scene]]
key = "12-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a third login and a key", "log with only its server lines."]
narration = "That's inspecting T L S traffic with Wireshark. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Encryption hides the content and not the conversation, and the secrets that open it are kept per connection, by whoever wrote them down. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a third login, and a key log with only its server lines, and see which half opens. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] Three small classes redo by hand what tshark decides: the client hello, the key log match, and the key exchange. [[slnc 300]] Around them, a tap that writes the capture, and the real tools. [[slnc 300]] Here they are."""

[[class]]
name = "ClientHello"
what = "reads the first record by hand, as anyone on the path can"
[[class.part]]
title = "the random and the server name"
code = '''
int recordType = b.get() & 0xff;
...
byte[] random = new byte[32];
b.get(random);
...
if (type == SERVER_NAME) {
...
name = new String(host, StandardCharsets.US_ASCII);
'''
speech = """It walks the bytes of the first record: the record type, the message type, then thirty two bytes of random. [[slnc 300]] It skips the session, the suites and the compression, then reads the extensions until it finds the server name. [[slnc 300]] A test proves it gives the same random and name as tshark."""

[[class]]
name = "KeyLog"
what = "the key log file, and which connection a line opens"
[[class.part]]
title = "a log names connections by client random"
code = '''
boolean opens(String clientRandom) {
    return lines.stream()
            .anyMatch(l -> l.clientRandom().equalsIgnoreCase(clientRandom));
}
...
KeyLog only(String prefix) {
'''
speech = """Each line is a label, a client random and a secret. [[slnc 300]] A log opens a capture only when one of its lines carries that capture's client random. [[slnc 300]] Only keeps the lines of one side, for the half log of the fourth demo."""

[[class]]
name = "Suites"
what = "what a suite name says about the key exchange"
[[class.part]]
title = "ephemeral, or RSA"
code = '''
if (!name.contains("_WITH_")) {
    return "ephemeral: a new key pair per connection";
}
...
static boolean serverKeyOpens(String name) {
    return name.startsWith("TLS_RSA_WITH_");
}
...
return Integer.parseInt(hash(name).substring(3)) / 8;
'''
speech = """The name of a T L S one point three suite has no key exchange in it, because it is always ephemeral. [[slnc 300]] A server key opens a recording only for names that start with T L S R S A with. [[slnc 300]] And a secret is as long as the hash: three eighty four bits divided by eight."""

[[class]]
name = "Tap"
what = "forwards every byte and writes it to a capture file"
[[class.part]]
title = "copy, then forward"
code = '''
while ((n = in.read(buffer)) > 0) {
    pcap.data(fromClient, buffer, n);
    out.write(buffer, 0, n);
'''
speech = """The tap sits between the client and the server on loopback. [[slnc 300]] Every chunk it reads is written to the capture, then passed on. [[slnc 300]] Pcap wraps the chunks in I P and T C P headers, so tshark reads it like any recording."""

[[class]]
name = "Tshark"
what = "runs tshark on a capture, with or without secrets"
[[class.part]]
title = "a key log, or the server's key"
code = '''
static List<String> keyLog(Path keys) {
    return List.of("tls.keylog_file:" + keys);
}
...
return List.of("uat:rsa_keys:\"" + key + "\",\"\"");
'''
speech = """tshark is given one extra setting. [[slnc 300]] The key log file, for the third and fourth demos. [[slnc 300]] Or the server's private key, for the fifth."""

[[class]]
name = "Client"
what = "the openssl client with a key log, and a JDK client for RSA"
[[class.part]]
title = "write the secrets, or offer only RSA"
code = '''
command.addAll(List.of("-keylogfile", keyLog.toString()));
...
String[] rsaOnly = {"TLS_RSA_WITH_AES_128_CBC_SHA"};
socket.setEnabledCipherSuites(rsaOnly);
'''
speech = """The open S S L client writes its secrets when it is given dash keylogfile. [[slnc 300]] The second client is the J D K's, told to offer only R S A key exchange, for the old style server."""

