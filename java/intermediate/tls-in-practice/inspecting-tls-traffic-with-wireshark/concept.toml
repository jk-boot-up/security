# concept.toml: everything about this project that is not Java code.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "inspecting-tls-traffic-with-wireshark"
level = "intermediate"
module = "tls-in-practice"
title = "Inspecting TLS Traffic with Wireshark"
short_title = "TLS Traffic with tshark"
package = "tlscapture"
main_class = "TlsCaptureDemo"
tagline = "A capture shows a name, times and sizes, a key log opens exactly the connections it lists, and a leaked server key opens only what never used an ephemeral key"
bold = "A capture of a real TLS 1.3 login shows the server name, the cipher the server chose and encrypted records, and nothing of the password; tshark with the key log the client wrote opens that connection (and its encrypted certificate) and no other, a log with only the client's lines opens only requests, and a leaked server key opens a recording made with RSA key exchange but not one made with ephemeral keys."
domain = "an online store"
domain_note = ""
youtube_description = "A real nginx, the openssl client with a key log file, a tap that writes a capture file of a login, and tshark 4.6: what the capture shows without secrets (the server name, the cipher, encrypted records), what the key log opens (the request, the form, the cookie, the encrypted certificate), why one connection's key log opens no other, a log with only the client's lines, and the difference between a leaked server key on a recording made with ephemeral keys and one made with RSA key exchange."
thumb_lines = ["TLS TRAFFIC", "WITH TSHARK"]
thumb_code = "tshark -o tls.keylog_file:keys.log"
youtube_title = "Inspecting TLS Traffic with Wireshark and tshark: Key Logs and Leaked Keys (OWASP A04)"
youtube_tags = ["wireshark", "tshark", "tls", "key log", "sslkeylogfile", "tls 1.3", "forward secrecy", "owasp top 10", "a04", "java"]

[readme]
intro = """
The plain [inspecting-tls-traffic](../inspecting-tls-traffic) project decrypts a recorded TLS 1.3 session in Java with HKDF. This one uses the real tools: **nginx**, the **openssl** client with `-keylogfile`, and **tshark** (`brew install nginx step wireshark`). Nothing is captured from a network card, which needs rights a test should not ask for: a small **tap** in Java sits between the client and the server on loopback, forwards every byte and writes a capture file (pcap) of what went through, which is all that a machine on the path would see. The tests that run the tools are tagged `integration` (`./gradlew integrationTest`); `./gradlew test` checks the capture writer and three small classes that redo by hand what tshark reads: the Client Hello, the key log match and the key exchange.

What it shows:
- **What the wire shows.** The Client Hello, read by hand, names the shop in the clear; the Server Hello picks `TLS_AES_256_GCM_SHA384`; the rest is encrypted records: no certificate, no HTTP, no password. The size still shows: a 163-byte request becomes a 163 + 1 + 16 = 180-byte record.
- **A key log.** `openssl s_client -keylogfile` writes five lines (a label, the client random and a secret each; the secret is 384 / 8 = 48 bytes for a SHA-384 suite), the same format a browser writes when `SSLKEYLOGFILE` is set. It holds no private key.
- **The same capture with the key log.** tshark shows `POST /login`, the form fields, the cookie, and the encrypted certificate.
- **One connection only.** A second login is closed to the first login's key log; one file with both logs opens both; a log with only the client's lines opens the requests and not the responses.
- **The server's own key.** A TLS 1.2 certificate is visible in the clear. With the server's private key, a recording made with ECDHE stays closed and a recording made with RSA key exchange opens, password and all.

**Maps to:** OWASP Top 10 (2025) A04 Cryptographic Failures · CWE-312 (cleartext storage of sensitive information), CWE-532 · RFC 8446 (TLS 1.3) · the NSS key log format.
"""
analogy = """
Sealed envelopes carried past a watcher. The watcher sees the address on the outside, the times and the sizes. A note from the sender with that one envelope's key opens that envelope and no other; the post office's master key opens old envelopes only if they were sealed the old way.
"""
scenario = """
An online store's shopper logs in over TLS 1.3. The demo plays a person with a capture file and the tools to read it, and shows what they can and cannot learn.
"""
costs = [
    "**A key log is as good as the password it protects,** so where it is written and when it is deleted matter.",
    "**Names, times and sizes stay visible** even with TLS 1.3.",
    "**A capture on a real network needs rights** that are rightly hard to get.",
    "**Debugging with decryption tempts a team to leave logging on.**",
]
too_much = """
If you can read the application's own logs, you rarely need to decrypt the wire. Decrypt traffic when the bug is between the machines: a proxy, a handshake, a header added on the way.
"""
met_before = [
    "An environment variable `SSLKEYLOGFILE` in a developer's shell.",
    "A Wireshark screen full of `Application Data`.",
    "A `.pcap` attached to a bug report.",
    "Someone saying \"just turn off TLS in test\".",
]
where = """
This is the tools version of [inspecting-tls-traffic](../inspecting-tls-traffic), in the [tls-in-practice](..) module. The certificates come from the kind of authority built in [local-certificate-authority-with-step-ca](../local-certificate-authority-with-step-ca).
"""
twin = """
nginx, openssl and tshark are the real programs; the tap writes a real pcap file. Secrets, randoms, ports and packet counts are never printed, only their sizes and whether they match; the demo takes about half a minute.
"""
test_note = "The unit tests (./gradlew test) need no program: the capture-file writer, the Client Hello read by hand from one the JDK writes, the key log match and the suite rules. The other tests need nginx, openssl, step and tshark (./gradlew integrationTest), and check the by-hand values against tshark."

[[act]]
title = "What the wire shows"
summary = "With no secrets, the capture shows the server name, the chosen cipher and encrypted records of known sizes; the certificate, the request and the password are not there."
detail = """
The shopper's client sends POST /login with user=ana&password=hunter2, inside TLS 1.3. A tap copies the connection to login.pcap, and tshark reads it with no secrets. The Client Hello names www.shop.localhost and the Server Hello chooses TLS_AES_256_GCM_SHA384; the certificate is not visible, no HTTP request can be read, and the word password is not in the file's bytes.
ClientHello reads the first record by hand: record type 22 (handshake), message type 1 (Client Hello), a 32-byte random that is new for every connection, and the server_name extension, in the clear.
The size still shows: the request is 163 bytes; TLS 1.3 adds one content-type byte and a 16-byte AES-GCM tag, so its record is 163 + 1 + 16 = 180 bytes, which is exactly the largest record tshark finds from the client.
"""
figure = "client_hello_bytes"
figure_title = "The first record, and the size of the login"
figure_speech = """
First demo: what the wire shows. [[slnc 400]] Before any key exists, the client sends its client hello, and anyone on the path can read it. [[slnc 600]]
Here it is, read by hand from the capture's bytes. [[slnc 300]] A record type of twenty two, which means handshake. [[slnc 300]] A message type of one, which means client hello. [[slnc 300]] Thirty two random bytes, new for every connection. [[slnc 300]] Remember them, they come back in the key log. [[slnc 300]] And the server name: w w w dot shop dot localhost, in the clear. [[slnc 700]]
Encryption hides the bytes, but not how many there are. [[slnc 300]] The login request is one hundred and sixty three bytes. [[slnc 300]] T L S one point three adds one byte for the content type, and a sixteen byte A E S G C M tag. [[slnc 300]] One hundred and sixty three, plus one, plus sixteen, is one hundred and eighty. [[slnc 400]] And tshark finds a record of exactly one hundred and eighty bytes from the client. [[slnc 300]] A watcher can tell that a login happened.
"""
speech = """
Here is the real output. [[slnc 400]] The login, as the client sends it inside T L S. [[slnc 400]] Then the capture, read by tshark with no secrets. [[slnc 300]] It sees the name and the cipher. [[slnc 300]] No certificate, no readable request, and the word password is nowhere in the file.
[[page]]
The client hello, by hand: type twenty two, type one, thirty two random bytes, and the name in the clear. [[slnc 400]] And the size worked out: one hundred and sixty three, plus one, plus sixteen, is one hundred and eighty, which is what tshark sees on the wire.
"""
rows = { wire = "active ok" }
console = [
    ["THE LOGIN (what the client sends, inside TLS 1.3):", "code"],
    ["  POST /login  Host: www.shop.localhost", "muted"],
    ["  user=ana&password=hunter2", "muted"],
    ["THE CAPTURE, READ WITH NO SECRETS (tshark -r login.pcap):", "code"],
    ["  Client Hello  server name www.shop.localhost", "muted"],
    ["  Server Hello  TLS_AES_256_GCM_SHA384", "muted"],
    ["  certificate   not visible", "ok"],
    ["  HTTP          0 requests readable", "ok"],
    ["  the word password in the file's bytes: no", "ok"],
    ["---", ""],
    ["THE CLIENT HELLO, BY HAND (the first record's bytes):", "code"],
    ["  record type   22 (handshake)", "muted"],
    ["  message type  1 (Client Hello)", "muted"],
    ["  random        32 bytes, new for every connection", "muted"],
    ["  server_name   www.shop.localhost  <- IN THE CLEAR", "bad"],
    ["THE REQUEST'S SIZE, WORKED OUT (what a watcher still sees):", "code"],
    ["  request 163 + type 1 + tag 16 = 180 bytes", "muted"],
    ["  on the wire (tshark)  180 bytes", "muted"],
]

[[act]]
title = "A key log: the secrets of one connection"
summary = "The openssl client writes five lines; each is a label, the connection's client random and a 48-byte secret, and none is a private key."
detail = """
openssl s_client -keylogfile keys.log writes five lines, as a browser does when SSLKEYLOGFILE is set. In TLS 1.3 each side has a handshake secret and a traffic secret: CLIENT_HANDSHAKE_TRAFFIC_SECRET, SERVER_HANDSHAKE_TRAFFIC_SECRET, CLIENT_TRAFFIC_SECRET_0 and SERVER_TRAFFIC_SECRET_0; EXPORTER_SECRET opens no traffic.
One line taken apart: the label, the client random (32 bytes, 64 hex digits) and the secret (48 bytes, 96 hex digits). The secret is as long as the suite's hash: TLS_AES_256_GCM_SHA384 uses SHA-384, and 384 / 8 = 48 bytes.
KeyLog checks by hand whose connection it is: every line carries the same client random, and it is the random from the Client Hello in the capture. There is no private key in the file.
"""
figure = "key_log_line"
figure_title = "One line of a key log, taken apart"
figure_speech = """
Second demo: a key log. [[slnc 400]] The open S S L client was started with dash keylogfile. [[slnc 300]] A browser does the same when the S S L key log file variable is set. [[slnc 700]]
Here is one line, taken apart. [[slnc 300]] First a label, which says which secret this is. [[slnc 300]] Then the client random: the same thirty two bytes the client hello carried in the clear. [[slnc 300]] That is how a line names its connection. [[slnc 300]] Then the secret itself. [[slnc 700]]
Why forty eight bytes? [[slnc 300]] The server chose T L S A E S two fifty six G C M S H A three eighty four. [[slnc 300]] In T L S one point three, a secret is as long as the suite's hash. [[slnc 300]] S H A three eighty four gives three hundred and eighty four bits, divided by eight, forty eight bytes. [[slnc 700]]
At the bottom, the five labels. [[slnc 300]] Each side has a handshake secret, and a traffic secret for its data. [[slnc 300]] The exporter secret opens no traffic at all.
"""
speech = """
The output. [[slnc 400]] Five lines in the key log. [[slnc 300]] Two handshake secrets, two traffic secrets, one for each side, and the exporter secret.
[[page]]
One line taken apart: a label, thirty two bytes of client random, and forty eight bytes of secret. [[slnc 400]] Forty eight, because S H A three eighty four divided by eight is forty eight. [[slnc 400]] And the match by hand: one client random in every line, the same as the client hello's. [[slnc 300]] No private key anywhere in the file.
"""
rows = { keylog = "active ok" }
console = [
    ["THE INPUT (openssl s_client -keylogfile keys.log):", "code"],
    ["  5 lines, as a browser writes with SSLKEYLOGFILE set", "muted"],
    ["THE KEY LOG (each label, and what its secret opens):", "code"],
    ["  CLIENT_HANDSHAKE_TRAFFIC_SECRET  the client's handshake", "muted"],
    ["  SERVER_HANDSHAKE_TRAFFIC_SECRET  the server's handshake", "muted"],
    ["  CLIENT_TRAFFIC_SECRET_0          the client's data", "muted"],
    ["  SERVER_TRAFFIC_SECRET_0          the server's data", "muted"],
    ["  EXPORTER_SECRET                  no traffic", "muted"],
    ["---", ""],
    ["ONE LINE, TAKEN APART:", "code"],
    ["  label          CLIENT_TRAFFIC_SECRET_0", "muted"],
    ["  client random  32 bytes (64 hex digits)", "muted"],
    ["  secret         48 bytes (96 hex digits)", "muted"],
    ["THE SECRET'S SIZE, WORKED OUT (from the suite's hash):", "code"],
    ["  TLS_AES_256_GCM_SHA384 -> SHA384 -> 384 / 8 = 48 bytes", "muted"],
    ["THE MATCH, BY HAND (whose connection is it?):", "code"],
    ["  one client random in all lines  yes", "ok"],
    ["  the Client Hello's random       yes", "ok"],
    ["  a private key in the file       no", "muted"],
]

[[act]]
title = "The same capture, read with the key log"
