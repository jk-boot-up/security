At the top, the request, opened with the client's traffic secret. [[slnc 300]] A post to slash login, user ana, password hunter two. [[slnc 600]]
In the middle, the response, opened with the server's traffic secret. [[slnc 300]] Two hundred, welcome ana, and the session cookie. [[slnc 300]] Whoever holds this cookie is logged in as ana. [[slnc 600]]
At the bottom, the certificate, opened with the server's handshake secret. [[slnc 300]] In T L S one point three, the certificate travels encrypted. [[slnc 300]] So without the log, a watcher could not even see it. [[slnc 300]] With the log, it is all there: w w w dot shop dot localhost, issued by Shop Lab Root.
"""
