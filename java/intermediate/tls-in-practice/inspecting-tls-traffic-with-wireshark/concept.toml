[[act]]
title = "The server's own key is a different matter"
summary = "A TLS 1.2 certificate travels in the clear; a leaked server key opens a recording made with RSA key exchange, password and all, and nothing of one made with ECDHE."
detail = """
Three recordings and the suite each Server Hello chose: TLS 1.3 nginx with TLS_AES_256_GCM_SHA384, TLS 1.2 nginx with TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384, and an old-style TLS 1.2 server (LegacyServer, in the JDK) with TLS_RSA_WITH_AES_128_CBC_SHA. Over TLS 1.2 the certificate is visible with no secret; over TLS 1.3 it is not.
Suites reads the key exchange from the name. TLS 1.3 is always ephemeral. ECDHE: both sides make a one-time key and the server's key only signs, so the secret never crosses the wire. RSA: the client sends the secret locked to the server's public key. So by hand, a leaked server key opens the RSA recording and nothing of the ECDHE one.
tshark with the server's private key (rsa.key) agrees: the ECDHE recording stays closed (0 HTTP packets) and the RSA recording opens, password hunter2. A leaked key opens everything ever recorded with RSA key exchange.
"""
figure = "key_exchange"
figure_title = "Ephemeral keys, or a secret that travels"
figure_speech = """
Fifth demo: the server's own private key. [[slnc 400]] Suppose it leaks, a year after a watcher recorded the traffic. [[slnc 700]]
On the left, nginx over T L S one point two, with E C D H E. [[slnc 300]] Each side makes a one time key, and the server's key only signs its part. [[slnc 300]] Each side works out the secret, and the secret never crosses the wire. [[slnc 300]] So the leaked key opens nothing: zero H T T P packets. [[slnc 700]]
On the right, an old style server with R S A key exchange. [[slnc 300]] The client picks the secret, locks it with the server's public key, and sends it. [[slnc 300]] The secret is in the recording, locked. [[slnc 300]] And the leaked private key unlocks it. [[slnc 300]] tshark opens the login, password hunter two. [[slnc 700]]
That is forward secrecy. [[slnc 300]] T L S one point three always uses one time keys, so it has no R S A key exchange at all.
"""
speech = """
The output. [[slnc 400]] Three recordings, and the suite each server chose. [[slnc 400]] Over T L S one point two, the certificate is visible, with no secret. [[slnc 300]] Over one point three, it is not.
[[page]]
The key exchange, read by hand from the name. [[slnc 400]] Only the R S A one sends the secret across the wire, so only it should open. [[slnc 400]] And tshark, with the leaked key, agrees: the E C D H E recording stays closed, the R S A recording opens, password and all.
"""
rows = { serverkey = "active ok" }
console = [
    ["THE RECORDINGS (the suite each Server Hello chose):", "code"],
    ["  TLS 1.3, nginx  TLS_AES_256_GCM_SHA384", "muted"],
    ["  TLS 1.2, nginx  TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384", "muted"],
    ["  TLS 1.2, old    TLS_RSA_WITH_AES_128_CBC_SHA", "muted"],
    ["THE CERTIFICATE, WITH NO SECRETS:", "code"],
    ["  TLS 1.3  not visible", "ok"],
    ["  TLS 1.2  visible", "bad"],
    ["---", ""],
    ["THE KEY EXCHANGE, BY HAND (read from the suite's name):", "code"],
    ["  TLS 1.3, nginx  ephemeral: a new key pair per connection", "ok"],
    ["  TLS 1.2, nginx  ephemeral (ECDHE): the server key only signs", "ok"],
    ["  TLS 1.2, old    RSA: the secret is sent locked to the server key", "bad"],
    ["THE RULE, BY HAND (did the secret cross the wire?):", "code"],
    ["  TLS 1.2, nginx  no, so the key opens nothing", "ok"],
    ["  TLS 1.2, old    yes, so the key opens it", "bad"],
    ["THE LEAK (tshark with the server's private key, rsa.key):", "code"],
    ["  TLS 1.2, nginx  closed: 0 HTTP packets", "ok"],
    ["  TLS 1.2, old    opened: password hunter2  <- THE PAST IS OPEN", "bad"],
]

