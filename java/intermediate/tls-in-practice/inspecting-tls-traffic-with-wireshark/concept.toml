[[act]]
title = "A key log opens its own connection and no other"
summary = "A second login stays closed to the first login's key log, because the client random does not match; one file with both logs opens both; the client's two lines open only the requests."
detail = """
A second login writes login2.pcap and keys2.log. KeyLog matches by hand: keys.log does not carry login2's client random, keys2.log does, and both.log (the two logs in one file) does.
tshark agrees: keys.log on login2.pcap opens 0 HTTP packets, keys2.log opens it, and both.log opens both captures.
Before: with all the lines of keys.log, requests and responses open. After: with only its two CLIENT_ lines, the requests open and the responses stay closed, because each side encrypts with its own secret.
"""
figure = "one_connection"
figure_title = "A log matches by client random"
figure_speech = """
Fourth demo: a key log opens its own connection, and no other. [[slnc 400]] The shopper logs in a second time, and the client writes a second key log. [[slnc 700]]
On each row, a log, and the question asked by hand: does it carry the second login's client random? [[slnc 300]] The first log does not. [[slnc 300]] tshark agrees: zero H T T P packets, closed. [[slnc 300]] The second log does, and it opens. [[slnc 300]] Both logs in one file carry it, and open both logins. [[slnc 700]]
At the bottom, half a log. [[slnc 300]] Before, with all five lines, requests and responses open. [[slnc 300]] After, with only the client's two lines, the requests open, and the responses stay closed. [[slnc 300]] Each side encrypts with its own secret. [[slnc 300]] A key log opens exactly what it lists.
"""
speech = """
The output. [[slnc 400]] The two logins and their logs. [[slnc 400]] By hand, only the second log, and the joined file, carry the second login's client random.
[[page]]
And tshark agrees: the first log opens nothing of the second login, its own log opens it, the joined file opens both. [[slnc 400]] With only the client's lines, the responses stay closed.
"""
