[[diagram]]
name = "threat-model-diagram"
kind = "flow"
title = "Threat model: trust boundaries and threats"
caption = "Dashed boxes are trust boundaries. Rose tags show where each threat in the table applies."
zones = [
    { label = "The network", nodes = ["attacker"], colour = "red" },
    { label = "The server", nodes = ["server", "cert"], colour = "green" },
]
nodes = [
    { id = "attacker", label = "Attacker", sub = "on the path", col = 0, row = 0, colour = "red", threats = ["T1", "T2"] },
    { id = "server", label = "nginx or Caddy", sub = "TLS settings, headers", col = 1, row = 0, colour = "accent", threats = ["T1", "T2", "T3"] },
    { id = "cert", label = "Certificate", sub = "files, renewal", col = 1, row = 1, colour = "amber", shape = "store", threats = ["T4"] },
]
edges = [
    { from = "attacker", to = "server", label = "downgrade, strip https", colour = "red", dashed = true, threats = ["T1", "T2"] },
    { from = "cert", to = "server", label = "read at start or reload", threats = ["T4"] },
]

[threatmodel]
scope = """
An nginx and a Caddy serving the shop over https, with the certificates they use. It covers protocol versions, redirects, HSTS, information in headers, stapling and renewal. It does not cover the application behind them.
"""
assets = [
    "The shoppers' sessions and pages.",
    "The servers' private keys.",
]
actors = [
    "A shopper's browser.",
    "A network attacker who can downgrade or strip https.",
    "The operator who edits the configuration.",
]
boundaries = [
    "The network between the browser and the server.",
    "The files the server reads its certificate from.",
]
assumptions = [
    "Clients have the root of the authority that signed.",
    "The operator's configuration is reviewed like code.",
]
out_of_scope = [
    "Vulnerabilities in the web servers themselves.",
    "The application's own authentication.",
]
tests = [
    "`TlsServersTest` starts a real nginx and Caddy and checks, as a client, the certificate and name, redirects, version, protocols, HSTS, the add_header trap, stapling, the reload and Caddy's authority.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next project in this module, tls-misconfigurations-with-testssl, checks servers like these with testssl.sh.
"""

[[threat]]
id = "T1"
stride = "T"
threat = "A downgrade to an old protocol version"
where = "the server's protocol list"
control = "ssl_protocols with TLS 1.2 and 1.3, or 1.3 only"
residual = "Clients that cannot speak 1.3"

[[threat]]
id = "T2"
stride = "T"
threat = "A first visit over plain http is stripped"
where = "redirects and HSTS"
control = "Redirect to https and send HSTS on every page"
residual = "The very first visit, before the header is seen"

[[threat]]
id = "T3"
stride = "I"
threat = "The server announces its exact version"
where = "the Server header"
control = "server_tokens off"
residual = "Other ways to fingerprint a server"

[[threat]]
id = "T4"
stride = "D"
threat = "An expired certificate because a renewal never reloaded"
where = "the certificate files"
control = "A renewal job that ends with a reload, or a server that renews itself"
residual = "A job that fails quietly"

