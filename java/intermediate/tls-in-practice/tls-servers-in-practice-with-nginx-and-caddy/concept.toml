    { id = "nginx", label = "nginx", sub = "lab root", col = 1, row = 0, colour = "accent" },
    { id = "caddy", label = "Caddy", sub = "its own root", col = 1, row = 1, colour = "green" },
    { id = "ca", label = "Local root", sub = "step certificate create", col = 2, row = 0, colour = "amber", shape = "store" },
]
edges = [
    { from = "client", to = "nginx", label = "https" },
    { from = "client", to = "caddy", label = "https" },
    { from = "ca", to = "nginx", label = "signs" },
]

[[diagram]]
name = "class-diagram"
kind = "class"
title = "The classes and what they hold"
