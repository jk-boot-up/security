Here is the output. [[slnc 400]] The site block, all of it. [[slnc 400]] The chain Caddy made: the certificate, the intermediate that was sent, and the root. [[slnc 400]] And the lifetime, worked out: twelve hours.
[[page]]
The requests. [[slnc 300]] Caddy's root works; the lab's root is refused; one point two is served. [[slnc 400]] Plain http gets three oh eight. [[slnc 400]] Before the fix, the server header says only Caddy, and there is no H S T S. [[slnc 400]] One header line adds it.
"""
