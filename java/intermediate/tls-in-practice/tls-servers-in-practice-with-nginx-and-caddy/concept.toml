    { id = "caddy", label = "Caddy", sub = ["caddyfile()", "start()", "root()"], col = 1, row = 0, colour = "green" },
    { id = "ca", label = "LocalCa", sub = ["issue()", "root()"], col = 2, row = 0, colour = "amber" },
    { id = "https", label = "Https", sub = ["get()", "plain()"], col = 1, row = 1, colour = "client" },
]
edges = [
    { from = "https", to = "nginx", label = "asks" },
    { from = "https", to = "caddy", label = "asks" },
    { from = "ca", to = "nginx", label = "certificate" },
]

[[diagram]]
name = "data-flow-diagram"
kind = "flow"
title = "What a client checks"
caption = "Version, root, name, then the headers."
nodes = [
    { id = "ver", label = "Protocol", sub = "1.2 or 1.3", col = 0, row = 0, colour = "client" },
    { id = "root", label = "Root", sub = "who signed", col = 1, row = 0, colour = "accent" },
    { id = "name", label = "Name", sub = "in the certificate", col = 2, row = 0, colour = "amber" },
    { id = "hdr", label = "Headers", sub = "HSTS, Server", col = 3, row = 0, colour = "green" },
]
edges = [
    { from = "ver", to = "root" },
