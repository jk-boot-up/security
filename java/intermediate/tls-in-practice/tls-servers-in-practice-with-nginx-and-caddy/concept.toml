[[act]]
title = "Caddy makes its own certificates"
summary = "A short site block gives a local authority, a 12-hour certificate, a 308 redirect and Server: Caddy; TLS 1.2 is accepted by default and HSTS needs a header line."
detail = """
The Caddyfile's site block is four lines: the name, bind 127.0.0.1, respond "the shop" and the closing brace; local_certs and the ports are global options. Caddy made a whole chain by itself: the certificate for www.shop.localhost, signed by Caddy Local Authority - ECC Intermediate, signed by Caddy Local Authority - <year> ECC Root. The server sends the first two; the root stays in Caddy's data folder.
The certificate's lifetime is not after minus not before: 43200 seconds, 12 hours, and Caddy renews it on its own.
A client that trusts Caddy's root gets 200 over TLSv1.3; one that trusts only the lab's root is refused; a client that offers only TLS 1.2 is served by default. Plain http gets 308, with a Location on https that leaves out the lab's https port. The headers say only Server: Caddy and carry no HSTS until a header line in the site block adds it.
"""
figure = "caddy_chain"
figure_title = "A short Caddyfile, a whole chain behind it"
figure_speech = """
Fourth demo: Caddy makes its own certificates. [[slnc 400]] On the left, the site block of the Caddyfile. [[slnc 300]] A name, an address, and a reply. [[slnc 300]] Nothing about certificates. [[slnc 700]]
On the right, what Caddy made by itself. [[slnc 300]] A certificate for w w w dot shop dot localhost. [[slnc 300]] Signed by Caddy's intermediate. [[slnc 300]] Signed by Caddy's own root, which stays in its data folder. [[slnc 700]]
The lifetime, worked out: not after, minus not before, is forty three thousand two hundred seconds. [[slnc 300]] That is twelve hours, and Caddy renews it on its own. [[slnc 700]]
Below, what clients see. [[slnc 300]] Caddy's root is needed: the lab's root is refused. [[slnc 300]] And a client that offers only T L S one point two is still served.
"""
