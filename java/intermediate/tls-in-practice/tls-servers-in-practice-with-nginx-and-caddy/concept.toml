[threatmodel]
scope = """
An nginx and a Caddy serving the shop over https, with the certificates they use. It covers protocol versions, redirects, HSTS, information in headers, stapling and renewal. It does not cover the application behind them.
"""
assets = [
    "The shoppers' sessions and pages.",
    "The servers' private keys.",
]
actors = [
    "A shopper's browser.",
    "A network attacker who can downgrade or strip https.",
    "The operator who edits the configuration.",
]
boundaries = [
    "The network between the browser and the server.",
    "The files the server reads its certificate from.",
]
assumptions = [
    "Clients have the root of the authority that signed.",
    "The operator's configuration is reviewed like code.",
]
out_of_scope = [
    "Vulnerabilities in the web servers themselves.",
    "The application's own authentication.",
]
tests = [
    "`TlsServersTest` starts a real nginx and Caddy and checks, as a client, the certificate and name, redirects, version, protocols, HSTS, the add_header trap, stapling, the reload and Caddy's authority.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next project in this module, tls-misconfigurations-with-testssl, checks servers like these with testssl.sh.
"""

[[threat]]
id = "T1"
stride = "T"
threat = "A downgrade to an old protocol version"
where = "the server's protocol list"
control = "ssl_protocols with TLS 1.2 and 1.3, or 1.3 only"
residual = "Clients that cannot speak 1.3"

[[threat]]
id = "T2"
stride = "T"
threat = "A first visit over plain http is stripped"
where = "redirects and HSTS"
control = "Redirect to https and send HSTS on every page"
residual = "The very first visit, before the header is seen"

[[threat]]
id = "T3"
stride = "I"
threat = "The server announces its exact version"
where = "the Server header"
control = "server_tokens off"
residual = "Other ways to fingerprint a server"

[[threat]]
id = "T4"
stride = "D"
threat = "An expired certificate because a renewal never reloaded"
where = "the certificate files"
control = "A renewal job that ends with a reload, or a server that renews itself"
residual = "A job that fails quietly"

[poster]
headline = [["TLS WITH", "text"], ["NGINX AND CADDY", "accent"]]
taglines = [["Every TLS choice is a line you write, or a default", "gold"]]
before = { code = "Server: nginx/<version>", note = "One line per choice", tag = "BEFORE" }
after = { code = "ssl_protocols TLSv1.3;", note = "Written, tested, reloaded", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "TLS Servers in Practice with nginx and Caddy"
narration = "Hello, and welcome. [[slnc 400]] This video explains setting up T L S, transport layer security, on two real web servers, nginx and Caddy. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] Every T L S server is a handful of choices: which certificate, which protocol versions, whether to redirect plain http, and whether to send H S T S. [[slnc 300]] In nginx, each choice is a line you write. [[slnc 300]] Caddy makes most of them for you, including its own certificates. [[slnc 600]] Think of two shops: one where you fit every lock yourself, and one that arrives with locks fitted, and you must still know which. [[slnc 600]] Our example is an online store."

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online store wants its pages", "served only over HTTPS,", "with certificates from its own authority.", "", "The demo starts real nginx and real Caddy", "in front of the same shop,", "and changes one line at a time."]
narration = "Here is the scenario. [[slnc 400]] An online store wants its pages served only over https, with certificates from its own authority. [[slnc 500]] The demo starts a real nginx and a real Caddy in front of the same small shop. [[slnc 500]] A small https client, written with the J D K, reads what a visitor would see, while the demo changes one line at a time."

[[scene]]
key = "02-words"
kind = "bullets"
title = "The Words"
body = ["Certificate: a name and a key, signed by an authority", "Root: an authority the client already trusts", "Handshake: client and server agree, before any page", "Redirect: an answer that says go to this address", "Response header: a line of extra facts with a page"]
narration = """Before the demos, the words. [[slnc 500]] A certificate is a name and a public key, signed by an authority. [[slnc 500]] A root is an authority that the client already trusts, kept in its own list. [[slnc 500]] The handshake is where client and server agree on a version and check the certificate, before any page is sent. [[slnc 500]] A redirect is an answer that says: ask at this other address. [[slnc 500]] And a response header is a line of extra facts sent with a page, like strict transport security."""

[[scene]]
key = "02-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "02-two-servers"
kind = "figure"
title = "The same choices on two servers"
body = "two_servers"
narration = """Let's see the whole idea on one picture. [[slnc 400]] Each row is one choice a T L S server makes. [[slnc 300]] In the middle, nginx: each choice is a line you write, from the certificate files to the add header line for H S T S. [[slnc 700]] On the right, Caddy, where nobody wrote a line. [[slnc 300]] It made its own certificate, for twelve hours. [[slnc 300]] It serves T L S one point two. [[slnc 300]] It redirects with three oh eight, and says only Caddy. [[slnc 300]] And it sends no H S T S. [[slnc 700]] Every value here comes from the demo's real output. [[slnc 300]] The same five choices, made by hand or by default."""

[[scene]]
key = "02-hsts-year"
kind = "figure"
title = "What the HSTS header promises"
body = "hsts_year"
narration = """One more picture before the demos, for the header that is hardest to take back. [[slnc 400]] Over https, the response carries strict transport security, with a max age. [[slnc 300]] Over plain http, nothing: there it would be ignored anyway. [[slnc 700]] The max age is in seconds. [[slnc 300]] Thirty one million, five hundred and thirty six thousand seconds, divided by eighty six thousand four hundred seconds in a day, is three hundred and sixty five days. [[slnc 700]] For a year, a browser that saw it will use only https for this name, and for every name under it. [[slnc 300]] That is why you test it before you send it."""


[[scene]]
key = "03-acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "04-costs"
kind = "bullets"
title = "What It Costs"
body = ["nginx: every choice is a line to get right", "nginx serves a new certificate only after a reload", "Caddy: its defaults decide for you", "HSTS is a promise you cannot quickly take back", "Stapling needs a responder in the certificate"]
narration = "Nothing is free. [[slnc 400]] Here is what it costs. [[slnc 500]] In nginx, every choice is a line you must write, and get right. [[slnc 500]] nginx serves a new certificate only after a reload. [[slnc 500]] Caddy decides for you, so you must know what its defaults are. [[slnc 500]] H S T S is a promise to browsers that you cannot quickly take back. [[slnc 300]] And stapling a revocation answer needs a responder named in the certificate."

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Server: nginx/1.x in a response", "nginx -s reload after a renewal", "A Caddyfile with only a site name", "Strict-Transport-Security in a response"]
narration = "You have probably met this already. [[slnc 400]] A server header with nginx and its exact version is a server that never turned the version off. [[slnc 500]] Nginx dash s reload, after a certificate renewal, is the reload from the last demo. [[slnc 500]] A Caddyfile with nothing but a site name is Caddy deciding the rest. [[slnc 500]] And a strict transport security header is H S T S, telling the browser to use https only."

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "How To Use It"
body = ["TLS 1.2 and 1.3 only; 1.3 where you can", "Redirect http to https", "HSTS on every page; watch add_header", "Hide the server version", "Renew automatically, and reload", "Test as a client sees it"]
narration = "So, how do you use it? [[slnc 400]] Serve only T L S one point two and one point three, and only one point three where every client can. [[slnc 500]] Redirect plain http to https. [[slnc 300]] Send H S T S on every page, and repeat it in any nginx location that adds its own headers. [[slnc 500]] Hide the server version. [[slnc 300]] Renew certificates automatically, and reload. [[slnc 500]] And test the result the way a client sees it."

[[scene]]
key = "12-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add ssl_ciphers and see", "what a TLS 1.2 client negotiates."]
narration = "That's T L S servers in practice, with nginx and Caddy. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Every T L S server is a handful of choices, and each choice is either a line you wrote, or a default someone else made. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add an S S L ciphers line, and see what a T L S one point two client agrees on. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] Two classes run the real servers, one is a small client, and three small classes redo by hand what the client and the servers decide. [[slnc 300]] Here they are."""

[[class]]
name = "Https"
what = "a small client that checks the name it asks for"
[[class.part]]
title = "server name and name check"
code = """
p.setServerNames(List.of(new SNIHostName(name)));
p.setEndpointIdentificationAlgorithm("HTTPS");
...
if (protocols.length > 0) {
    p.setProtocols(protocols);
}
...
socket.startHandshake();
"""
speech = """The client connects to the loopback address, and sends the name it wants in the handshake. [[slnc 300]] Endpoint identification makes the J D K check that name against the certificate. [[slnc 300]] The protocols line limits what the client offers, to play the old client."""

[[class]]
name = "ChainCheck"
what = "the client's two checks, redone by hand"
[[class.part]]
title = "who signed it, and whom it names"
code = """
boolean named = root.getSubjectX500Principal().equals(issuer);
if (named && signedBy(top, root)) {
    trusted = true;
}
...
boolean listed = names(chain.get(0)).contains(name);
...
cert.verify(issuer.getPublicKey());
"""
speech = """A root is trusted when its name is the certificate's issuer, and its public key verifies the signature. [[slnc 300]] The name check looks in the certificate's list of names. [[slnc 300]] A test proves the result matches the J D K's own validator."""

[[class]]
name = "Negotiation"
what = "the protocol version both sides agree on"
[[class.part]]
title = "the highest version in common"
code = """
for (String version : VERSIONS) {
    if (server.contains(version) && client.contains(version)) {
        return Optional.of(version);
    }
}
return Optional.empty();
"""
speech = """The versions are listed newest first. [[slnc 300]] The first one that both sides speak wins. [[slnc 300]] If there is none, the handshake fails."""

[[class]]
name = "Headers"
what = "the add_header rule, and what a max-age means"
[[class.part]]
title = "a location's own lines win"
code = """
return location.isEmpty() ? server : location;
...
Matcher m = Pattern.compile("max-age=(\\\\d+)").matcher(hsts);
"""
speech = """One line holds nginx's rule: the server's add header lines reach a location only when it has none of its own. [[slnc 300]] The max age is read in seconds, and the demo divides it by a day."""

[[class]]
name = "Nginx"
what = "writes nginx.conf for each case, and runs nginx"
[[class.part]]
title = "one line per choice, and a reload"
code = """
ssl_certificate %5$s;
ssl_certificate_key %6$s;
ssl_protocols %7$s;
...
static final String HSTS = "add_header Strict-Transport-Security"
        + " \\"max-age=31536000; includeSubDomains\\" always;";
...
Procs.run(command("-s", "reload"));
"""
speech = """The configuration is a text block, with one line for each choice the lesson changes. [[slnc 300]] The H S T S line is added to the server block, the account location, or both. [[slnc 300]] A reload runs nginx dash s reload, which is when nginx reads the certificate file again."""

[[class]]
name = "Caddy"
what = "writes a Caddyfile and runs Caddy with its own data folder"
[[class.part]]
title = "only the site, and local certificates"
code = """
local_certs
...
www.shop.localhost {
    bind 127.0.0.1
    %s
    respond "the shop"
}
...
pb.environment().put("XDG_DATA_HOME", dir.resolve("data").toString());
"""
speech = """The Caddyfile names only the site. [[slnc 300]] Local certs tells Caddy to be its own authority. [[slnc 300]] Its data folder holds the keys of that authority, so it must be kept."""

[[acronym]]
short = "TLS"
long = "Transport Layer Security: the encrypted, checked connection under https"
say = "T L S is transport layer security: the encrypted and checked connection that https runs on."
[[acronym]]
short = "HTTP, HTTPS"
long = "Hypertext Transfer Protocol; HTTPS is HTTP over TLS"
say = "H T T P is the hypertext transfer protocol, the language of web pages. H T T P S is the same, inside T L S."
[[acronym]]
short = "HSTS"
long = "HTTP Strict Transport Security: a header that says use https only"
say = "H S T S is H T T P strict transport security: a header that tells the browser to use https only, for a time."
[[acronym]]
short = "OCSP"
long = "Online Certificate Status Protocol: asks if a certificate is revoked"
say = "O C S P is the online certificate status protocol. A responder answers whether a certificate has been revoked."
[[acronym]]
short = "SSL"
long = "Secure Sockets Layer: TLS's old name, kept in nginx's ssl_ lines"
say = "S S L is secure sockets layer, the old name of T L S. nginx still uses it in the names of its lines."
[[acronym]]
short = "JDK"
long = "Java Development Kit: Java's own TLS client is used here"
say = "J D K is the Java development kit. Its own T L S client is used in this demo."
[[acronym]]
short = "SNI"
long = "Server Name Indication: the name a client asks for in the handshake"
say = "S N I is server name indication: the name the client sends in the handshake."
[[acronym]]
short = "ECC"
long = "Elliptic Curve Cryptography: the kind of key Caddy's authority uses"
say = "E C C is elliptic curve cryptography, the kind of key that Caddy's local authority uses."
[[acronym]]
short = "URL"
long = "Uniform Resource Locator: a web address"
say = "U R L is uniform resource locator: a web address."
