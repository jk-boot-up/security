# concept.toml: everything about this project that is not Java code.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "tls-servers-in-practice-with-nginx-and-caddy"
level = "intermediate"
module = "tls-in-practice"
title = "TLS Servers in Practice with nginx and Caddy"
short_title = "TLS with nginx and Caddy"
package = "tlsservers"
main_class = "TlsServersDemo"
tagline = "The same shop behind nginx, where every TLS choice is a line you write, and behind Caddy, which makes its own certificates and renews them"
bold = "A real nginx serves the shop with a certificate from a local root and needs a line for each choice (protocol versions, hiding the version, HSTS, a reload after each new certificate), where a location's own add_header silently replaces the server's HSTS; a real Caddy makes its own local authority and 12-hour certificates, redirects and renews by itself; and neither staples an OCSP answer when the certificate names no responder."
domain = "an online store"
domain_note = ""
youtube_description = "A real nginx 1.31 and a real Caddy 2.11 on loopback ports in front of the same shop: a certificate from a local root made with the step command, a client that needs the root and the right name, the redirect from http, the Server header and server_tokens, TLS 1.2 against a TLS 1.3 only setting, HSTS and the add_header inheritance trap, Caddy's own local authority with 12-hour certificates and automatic redirects, OCSP stapling that needs a responder, and nginx serving the old certificate until it is reloaded."
thumb_lines = ["TLS WITH", "NGINX AND CADDY"]
thumb_code = "ssl_protocols TLSv1.3;"
youtube_title = "TLS Servers in Practice with nginx and Caddy: Protocols, HSTS, Redirects and Renewal (OWASP A02, A04)"
youtube_tags = ["nginx", "caddy", "tls", "hsts", "ocsp stapling", "automatic https", "tls 1.3", "owasp top 10", "a02", "java"]

[readme]
intro = """
This project puts the same small shop behind two real servers, **nginx** and **Caddy** (`brew install nginx caddy`), both started by the demo on loopback ports, and reads the result with a small HTTPS client written with the JDK. For nginx, the certificate comes from a local root made with the `step` command. Caddy makes its own. Nothing is installed globally and no Docker is needed; the tests are tagged `integration`: `./gradlew integrationTest`.

What it shows:
- **nginx with a certificate from a local authority.** A client that trusts the lab's root gets `200` over TLS 1.3; a client with only its default roots refuses; a name the certificate does not carry is refused; http is sent on with a `301`; the `Server` header gives the exact version until `server_tokens off`.
- **Protocol versions.** The default accepts a client that offers only TLS 1.2; `ssl_protocols TLSv1.3` refuses it.
- **HSTS, and a trap.** The header is absent by default and sent over https only; a `location` with its own `add_header` **replaces** the server's, and the page loses HSTS until the line is repeated.
- **Caddy.** The Caddyfile names only the site; Caddy made a root, an intermediate and **12-hour** certificates and renews them; it redirects with `308`, says only `Caddy`, accepts TLS 1.2 by default and sends HSTS only when told.
- **The bill.** OCSP stapling needs a responder named in the certificate; a new certificate is served by nginx only after a reload.

**Maps to:** OWASP Top 10 (2025) A02 Security Misconfiguration and A04 Cryptographic Failures · CWE-319 (cleartext transmission), CWE-326 · RFC 6797 (HSTS), RFC 6066 (OCSP stapling).
"""
analogy = """
Two shops with locks on their doors. One lock is fitted by hand, bolt by bolt, and each bolt is yours to remember; the other comes with a locksmith who changes the key every morning but chooses the lock for you.
"""
scenario = """
An online store wants its pages served only over https, with certificates from its own authority. The demo starts both servers, asks them what a client sees, and changes one line at a time.
"""
costs = [
    "**nginx has no defaults you can forget:** every protocol, header and certificate is a line, and a line in the wrong block does nothing or undoes another.",
    "**A new certificate needs a reload,** so a renewal job must end with one.",
    "**Caddy decides for you,** which is safe until you need something it does not do.",
    "**HSTS is a promise to browsers** that is hard to take back.",
    "**Stapling and revocation need a responder** that local authorities often do not run.",
]
too_much = """
A site that only serves static pages from a managed host gets https from the host. Do this when you run the server yourself, or when the certificate comes from your own authority.
"""
met_before = [
    "`ssl_certificate` and `ssl_protocols` in an nginx configuration.",
    "A Caddyfile that is only a domain name and a `reverse_proxy` line.",
    "`add_header Strict-Transport-Security` copied from a blog post.",
    "A cron job that runs `nginx -s reload` after a renewal.",
]
where = """
This is a tools project of the [tls-in-practice](..) module without a plain twin. The authority behind it is the subject of [local-certificate-authority-with-step-ca](../local-certificate-authority-with-step-ca); the checks of the result are in [tls-misconfigurations](../tls-misconfigurations) and its testssl version.
"""
twin = """
nginx and Caddy are the real programs, in temporary folders, on free loopback ports. Names under .localhost need no resolver because the client connects to 127.0.0.1 and sends the name as the server name. Ports, serial numbers and dates are never printed; the demo takes about half a minute.
"""
test_note = "The tests start one nginx and one Caddy for the whole class (./gradlew integrationTest). They need nginx, caddy and the step command."

[[act]]
title = "nginx with a certificate from the local authority"
summary = "A client with the lab's root gets the page over TLS 1.3; the default roots, a wrong name and plain http each get their own answer."
detail = """
nginx serves www.shop.localhost with a certificate signed by the lab's root. A client that trusts the root gets 200 over TLS 1.3. A client that trusts only its default roots refuses. The same client asking for pay.shop.localhost, which the certificate does not name, is refused. Plain http is answered with 301 to the https address. By default the Server header gives nginx's exact version; with server_tokens off it says only nginx.
"""
speech = """
First demo: nginx with a certificate from the local authority. [[slnc 400]] A client that trusts the root gets the page over T L S one point three. [[slnc 600]]
A client with only its default roots refuses, and so does a name the certificate does not carry. [[slnc 600]]
Plain http is sent on to https.
"""
rows = { nginx = "active ok" }
console = [
    ["trusts the lab's root: 200 over TLSv1.3", "ok"],
    ["default roots: refused; another name: refused", "ok"],
    ["Server: nginx/1.x until server_tokens off", "bad"],
]

[[act]]
title = "Which protocol versions it speaks"
summary = "The default accepts a client that offers only TLS 1.2; one line makes the server refuse it."
detail = """
The default accepts a client that offers only TLS 1.2, and one that offers 1.3. With ssl_protocols TLSv1.3, the client that offers only 1.2 is refused with no protocol version in common, and the one that offers 1.3 is served. The price of the stricter setting is every client that cannot speak 1.3; the setting is one line, and a change needs a reload.
"""
speech = """
Second demo: which protocol versions it speaks. [[slnc 400]] By default a client that offers only T L S one point two is served. [[slnc 600]]
With one line, it is refused. [[slnc 300]] The price is every client that cannot speak one point three.
"""
rows = { protocols = "active ok" }
console = [
    ["default: TLS 1.2 client served", "ok"],
    ["ssl_protocols TLSv1.3: TLS 1.2 client refused", "ok"],
]

[[act]]
title = "HSTS, and the add_header trap"
summary = "The header is absent by default and sent over https only; a location's own add_header replaces the server's, and the page loses HSTS."
detail = """
By default there is no Strict-Transport-Security header. An add_header in the server block sends it over https and not over plain http. A location, /account, with its own add_header (X-Frame-Options) replaces the server's headers: the page has X-Frame-Options and no HSTS. Repeating the line in the location brings it back. A browser that has seen the header refuses plain http to the name for the max-age.
"""
speech = """
Third demo: H S T S, and the add header trap. [[slnc 400]] The header is added in the server block, and sent over https. [[slnc 600]]
A location with an add header of its own replaces the server's headers. [[slnc 300]] The page quietly loses H S T S.
"""
rows = { hsts = "active wrong" }
console = [
    ["server-level add_header: HSTS on /", "ok"],
    ["/account has its own add_header: HSTS gone", "bad"],
    ["repeated in the location: back", "ok"],
]

[[act]]
title = "Caddy makes its own certificates"
summary = "A Caddyfile that names only the site gives a local authority, 12-hour certificates, a redirect and automatic renewal."
detail = """
The Caddyfile names only the site. Caddy made a root, an intermediate and a certificate by itself, issued by Caddy Local Authority; the certificate lasts 12 hours and Caddy renews it on its own. A client that trusts nginx's root but not Caddy's is refused. Plain http gets 308 to https. The Server header says only Caddy and there is no HSTS by default. A client that offers only TLS 1.2 is accepted by default. A header line in the Caddyfile adds HSTS.
"""
speech = """
Fourth demo: Caddy makes its own certificates. [[slnc 400]] The Caddyfile names only the site. [[slnc 600]]
Caddy makes a local authority and certificates that last twelve hours, and renews them. [[slnc 300]] A client needs Caddy's root, not nginx's.
"""
rows = { caddy = "active ok" }
console = [
    ["Caddy Local Authority; 12-hour certificate", "ok"],
    ["http: 308 to https; Server: Caddy", "ok"],
    ["no HSTS until a header line says so", "bad"],
]

[[act]]
title = "The bill"
summary = "Stapling needs a responder; nginx serves the old certificate until it is reloaded; every client needs the right root."
detail = """
With ssl_stapling on, a client that asks for a stapled OCSP answer receives none, and nginx says it found no responder URL in the certificate. Caddy's local certificates carry no responder either. A new certificate written over the old file is not served by nginx until nginx -s reload. nginx needs a renewal job that ends with a reload; Caddy swaps by itself and needs its data folder kept. Every client needs the root of whichever authority signed.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] Stapling needs a responder named in the certificate. [[slnc 600]]
A new certificate is served by nginx only after a reload. [[slnc 600]]
Every client needs the root of whichever authority signed.
"""
rows = { bill = "active ok" }
console = [
    ["ssl_stapling on: 0 stapled answers, no responder URL", "bad"],
    ["new certificate on disk: nginx still serves the old one", "bad"],
    ["after nginx -s reload: the new one", "ok"],
]

