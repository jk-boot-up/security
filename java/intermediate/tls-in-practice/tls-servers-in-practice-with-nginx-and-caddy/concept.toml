[docs.session]
objectives = [
    "read an nginx TLS configuration line by line",
    "say what a client sees for each setting",
    "find the add_header trap in a configuration",
    "plan renewal for each server",
]
walkthrough = """
Run act two and find the line that changes the protocol. In act three ask which page lost HSTS and why. In act five ask what a renewal job for nginx must end with.
"""
exercises = [
    "Add ssl_ciphers and see what a TLS 1.2 client negotiates.",
    "Add Strict-Transport-Security with preload and read what that promises.",
    "Put Caddy in front of nginx and decide which one does TLS.",
    "Use the certificates from the step-ca project in nginx.",
]

[docs.explained]
sentence = """
A TLS server is a handful of choices, and each choice is either a line you wrote or a default someone else made.
"""
verdict = """
Serve only TLS 1.2 and 1.3 (1.3 where you can), send HSTS on every page, hide the version, renew automatically and reload, test the result as a client sees it, and know which of these your server decides for you.
"""
recognise = [
    "`ssl_certificate`, `ssl_protocols` and `add_header` in nginx.",
    "A Caddyfile with only a site name.",
    "`nginx -s reload` after a renewal.",
    "`Strict-Transport-Security` in a response.",
]

[spec]
purpose = """
Teach what nginx and Caddy do for TLS, as seen by a client, and what remains the operator's job.
"""
nongoals = [
    "Reverse proxying and load balancing.",
    "A public certificate authority.",
    "HTTP/2 and HTTP/3.",
]
problem = """
TLS servers are configured by copying lines, and the effect of each line is rarely checked from the client.
"""
roles = [["The client", "`Https`"], ["The local root", "`LocalCa`"], ["nginx", "`Nginx`"], ["Caddy", "`Caddy`"], ["Entry point", "`TlsServersDemo`"]]
requirements = [
    "Both servers start on free loopback ports and stop at the end.",
    "The client checks the certificate and the name, and reports what it got.",
    "Each setting is changed alone and its effect shown.",
    "A new certificate is shown to need a reload.",
    "The demo prints the same output on every run.",
]

