[[act]]
title = "Which protocol versions it speaks"
summary = "The default ssl_protocols TLSv1.2 TLSv1.3 serves an old client that offers only 1.2; ssl_protocols TLSv1.3 leaves nothing in common with it, and it is refused."
detail = """
Two clients: the old one offers only TLSv1.2, the new one only TLSv1.3. Client and server agree on the highest version both speak, which Negotiation redoes by hand.
Before the change, the line is ssl_protocols TLSv1.2 TLSv1.3. The old client agrees on TLSv1.2 and the new one on TLSv1.3: both get 200.
After the change, ssl_protocols TLSv1.3, the old client has no version in common and is refused; the new one still gets 200 over TLSv1.3. The price of the stricter line is every client that cannot speak 1.3.
"""
figure = "protocol_overlap"
figure_title = "The highest version both sides speak"
figure_speech = """
Second demo: which protocol versions it speaks. [[slnc 400]] In a handshake, the client says which versions it can speak. [[slnc 300]] The server picks the highest one that both of them know. [[slnc 700]]
On the left, the default line: T L S one point two and one point three. [[slnc 300]] The old client offers only one point two. [[slnc 300]] One point two is in common, so it is served. [[slnc 300]] The new client offers one point three, and gets one point three. [[slnc 700]]
On the right, one changed line: one point three only. [[slnc 300]] For the old client, nothing is in common. [[slnc 300]] The handshake fails before a single page is sent. [[slnc 300]] That is the price of the stricter line: every client that cannot speak one point three.
"""
speech = """
Here is the output. [[slnc 400]] The two clients, and the default line. [[slnc 400]] The agreement worked out by hand: one point two for the old client, one point three for the new one. [[slnc 400]] And the real responses: two hundred for both.
[[page]]
After the change, to one point three only. [[slnc 400]] By hand, the old client has nothing in common. [[slnc 400]] And the real server refuses it: no protocol version in common.
"""
rows = { protocols = "active ok" }
console = [
    ["THE CLIENTS (what each one offers):", "code"],
    ["  old client  [TLSv1.2]", "muted"],
    ["  new client  [TLSv1.3]", "muted"],
    ["BEFORE THE CHANGE (the default line):", "code"],
    ["  ssl_protocols TLSv1.2 TLSv1.3;", "muted"],
