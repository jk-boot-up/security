[[act]]
title = "HSTS, and the add_header trap"
summary = "One add_header line in the server block sends HSTS for 365 days; a location with an add_header of its own drops it, until the line is repeated there."
detail = """
Before the fix there is no Strict-Transport-Security header. One line in the server block, add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always, sends it over https; plain http only redirects and does not carry it. max-age is in seconds: 31536000 / 86400 = 365 days, and includeSubDomains covers every name under the host.
The trap: the /account location has an add_header of its own, X-Frame-Options DENY. nginx applies the server's add_header lines to a location only when the location has none (Headers.effective redoes the rule), so /account answers with X-Frame-Options and no HSTS. Repeating the line in the location brings it back.
"""
figure = "header_trap"
figure_title = "A location's own add_header replaces the server's"
figure_speech = """
Third demo: H S T S, and the add header trap. [[slnc 400]] On the left, the server block, with one add header line for strict transport security. [[slnc 300]] Inside it, the account location, with an add header line of its own, for X frame options. [[slnc 700]]
On the right, the rule. [[slnc 300]] nginx gives a location the server's add header lines only when the location has none. [[slnc 300]] The account location has one, so only its own line applies. [[slnc 700]]
The real response proves it. [[slnc 300]] X frame options is there. [[slnc 300]] Strict transport security is gone, without any warning. [[slnc 600]]
After the fix, the line is repeated in the location, and both headers come back.
"""
speech = """
Here is the output. [[slnc 400]] Before the fix, no strict transport security. [[slnc 400]] The line added to the server block. [[slnc 400]] After it, the header comes back over https, and not over plain http. [[slnc 400]] Its max age, worked out: thirty one million, five hundred and thirty six thousand seconds, divided by the seconds in a day, is three hundred and sixty five days.
[[page]]
The trap: the account location, with its own add header line. [[slnc 400]] The rule worked out by hand: the location's own list wins.
[[page]]
The real response: X frame options, and no strict transport security. [[slnc 400]] With the line repeated in the location, both are there.
"""
rows = { hsts = "active wrong" }
console = [
    ["BEFORE THE FIX (no add_header line):", "code"],
    ["  GET / over https  Strict-Transport-Security: (none)", "bad"],
    ["THE LINE ADDED TO THE SERVER BLOCK:", "code"],
    ["  add_header Strict-Transport-Security", "muted"],
    ["    \"max-age=31536000; includeSubDomains\" always;", "muted"],
    ["AFTER THE FIX (Strict-Transport-Security in the response):", "code"],
    ["  GET / over https  max-age=31536000; includeSubDomains", "muted"],
    ["  GET / over http   (none)", "muted"],
    ["THE max-age, WORKED OUT:", "code"],
    ["  31536000 s / 86400 s a day = 365 days", "muted"],
    ["  includeSubDomains: yes, so every name under www.shop.localhost too", "muted"],
    ["---", ""],
    ["THE TRAP (/account has an add_header of its own):", "code"],
    ["  location /account {", "muted"],
    ["      add_header X-Frame-Options DENY always;", "muted"],
    ["  }", "muted"],
    ["THE RULE, BY HAND (a location's own lines replace the server's):", "code"],
    ["  server    [Strict-Transport-Security]", "muted"],
    ["  location  [X-Frame-Options]", "muted"],
    ["  applied   [X-Frame-Options]", "muted"],
    ["---", ""],
    ["THE RESPONSE FROM GET /account:", "code"],
    ["  X-Frame-Options: DENY", "muted"],
