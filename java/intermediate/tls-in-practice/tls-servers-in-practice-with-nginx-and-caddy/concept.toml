[[page]]
The three requests, the checks done by hand, and the responses. [[slnc 400]] Only the first passes both checks, and gets two hundred over T L S one point three. [[slnc 400]] The by-hand checks agree with the real handshakes.
[[page]]
Plain http is answered with three oh one, and a location on https. [[slnc 500]] Before the fix, the server header gives nginx and its exact version. [[slnc 300]] After server tokens off, it says only nginx.
