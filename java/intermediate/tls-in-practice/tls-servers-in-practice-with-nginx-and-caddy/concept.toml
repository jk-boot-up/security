[[act]]
title = "The bill"
summary = "ssl_stapling on staples nothing, because neither certificate names an OCSP responder; a new certificate on disk is served by nginx only after nginx -s reload."
detail = """
Stapling means the server attaches a signed answer from the authority's OCSP responder, saying the certificate is not revoked. With ssl_stapling on and the root as ssl_trusted_certificate, the client receives 0 stapled answers: neither nginx's certificate nor Caddy's names a responder (the Authority Information Access extension is absent), and nginx's error log says "ssl_stapling" ignored, no OCSP responder URL in the certificate.
A new certificate is written over the old file. On disk it is the new one, but nginx still serves the old serial: it reads the file only when it starts or reloads. After nginx -s reload it serves the new one. A renewal job for nginx must end with a reload; Caddy renews and swaps by itself.
"""
figure = "renewal_reload"
figure_title = "No responder, nothing stapled; no reload, the old certificate"
figure_speech = """
Fifth demo: the bill. [[slnc 400]] At the top, stapling. [[slnc 300]] The server could attach a signed answer that says: this certificate is not revoked. [[slnc 300]] To get one, it needs a responder named in the certificate. [[slnc 300]] Neither nginx's certificate nor Caddy's names one. [[slnc 300]] So nothing is stapled, and nginx says so in its error log. [[slnc 700]]
Below, a renewal. [[slnc 300]] A new certificate is written over the old file. [[slnc 300]] On disk, it is the new one. [[slnc 300]] But nginx still sends the old one. [[slnc 600]]
After nginx dash s reload, it sends the new one. [[slnc 300]] So a renewal job for nginx must end with a reload. [[slnc 300]] Caddy renews and swaps by itself.
"""
speech = """
Here is the output. [[slnc 400]] The stapling lines. [[slnc 400]] Does a certificate name an O C S P responder? No, and no. [[slnc 400]] So zero answers are stapled, and the error log says why.
[[page]]
The renewal. [[slnc 300]] The new serial is on disk, but nginx serves the old one. [[slnc 400]] After the reload, it serves the new one.
"""
rows = { bill = "active ok" }
console = [
    ["THE LINES (stapling: the server attaches a revocation answer):", "code"],
    ["  ssl_stapling on;", "muted"],
    ["  ssl_trusted_certificate <work>/ca/root.crt;", "muted"],
