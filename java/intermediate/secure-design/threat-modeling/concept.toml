required = [
    "Java basics",
    "The beginner projects' threat models, or a rough idea of what a trust boundary is",
]
not_required = [
    "Any threat modeling tool",
    "A formal risk method",
]
install = []

[docs.session]
objectives = [
    "draw a system as elements, flows and trust boundaries",
    "apply STRIDE per element and explain each category",
    "rate a threat and choose between mitigate, accept, transfer and avoid",
    "turn a mitigation into a check that runs when the design changes",
]
walkthrough = """
Start with the architect's walk-through. Draw the bank on a whiteboard before running anything, and ask the group where the boundaries are. Run act one and compare. In act two, ask which threats the group missed. In act three, argue about one rating out loud. In act four, ask the group to propose a design change and predict which check fails.
"""
exercises = [
    "Add a web shop next to the mobile app and find the new threats and checks.",
    "Change one rating and see how the highest risks reorder.",
    "Write a check for the accepted risk, then move it from accept to mitigate.",
    "Add a review step that fails when an accepted risk is past its review day.",
]

[docs.explained]
sentence = """
A threat model draws the system as elements, flows and trust boundaries, asks the six STRIDE questions of every part, rates and decides each threat, and turns every mitigation into a check, so the model stays true as the design changes.
"""
verdict = """
Model early, keep it small, and keep it in the repository next to the code. Decide every threat explicitly, give accepted risks an owner and a date, and make mitigations testable. Revisit the model with every design change, using the four questions.
"""
recognise = [
    "A data-flow diagram with dashed trust boundaries in a design document.",
    "A risk register with owners, decisions and review dates.",
    "A pull request template that asks whether the threat model changed.",
    "OWASP Threat Dragon, pytm or the Microsoft Threat Modeling Tool.",
]

