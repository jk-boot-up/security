[[scene]]
key = "01-poster"
kind = "poster"
title = "Threat Modeling with STRIDE"
narration = """Hello, and welcome. [[slnc 400]] This video explains threat modeling with STRIDE, in Java. [[slnc 300]] STRIDE is six kinds of threat: spoofing, tampering, repudiation, information disclosure, denial of service, and elevation of privilege. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] Threat modeling is asking, on purpose and early, how a design could be attacked, and what to do about it. [[slnc 600]] Think of an architect walking through a building plan with a security consultant, before a wall is built. [[slnc 300]] At every door, the same six questions. [[slnc 300]] And when a side entrance is added, the walk through happens again. [[slnc 700]] In this video, the domain is an online bank."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online bank:", "a mobile app, an API gateway,", "a payments service, two stores,", "and a card processor outside.", "", "How could the design be attacked?"]
narration = """Here is the scenario. [[slnc 400]] An online bank has a mobile app, an A P I gateway, a payments service, two data stores, and a card processor outside its walls. [[slnc 600]] Every feature is reviewed for bugs. [[slnc 300]] But nobody asks, in a repeatable way, how the design itself could be attacked."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["Data-flow model: boxes and arrows", "Zone, trust: where a box sits, how far it is trusted", "Trust boundary: where trust changes", "Risk: likelihood times impact", "Decision: mitigate, accept, transfer, avoid", "Check: code that proves a mitigation"]
narration = """Before the demos, the words. [[slnc 500]] A data flow model is the system as boxes and arrows. [[slnc 500]] Each box sits in a zone, and each zone has a trust level. [[slnc 500]] A trust boundary is where what is trusted on one side cannot be trusted on the other. [[slnc 500]] Risk is likelihood times impact. [[slnc 500]] Every threat gets a decision: mitigate, accept, transfer, or avoid. [[slnc 500]] And a check is code that proves a mitigation is in place."""

[[scene]]
key = "03-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "03-one-flow"
kind = "figure"
title = "Six questions asked of one flow"
body = "one_flow"
narration = """Let's see the core idea on one example: one flow, and the six questions. [[slnc 400]] At the top, the input. [[slnc 300]] The mobile app sends a payment request with a token to the A P I gateway. [[slnc 300]] The app sits in the device zone, trust zero. [[slnc 300]] The gateway sits in the D M Z, trust one. [[slnc 300]] Between them, the internet boundary. [[slnc 700]]
At the bottom, the result: the six questions. [[slnc 300]] Tampering: yes, because the flow crosses the internet boundary. [[slnc 300]] Repudiation: yes, because it moves money. [[slnc 300]] Elevation of privilege: yes, because it goes from trust zero to trust one. [[slnc 600]] Spoofing, disclosure and denial of service are asked of other kinds of element, so here they say no. [[slnc 300]] Three threats, from one arrow."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "09-ladder"
kind = "bullets"
title = "The Four Questions"
body = ["What is being built?", "What can go wrong?", "What is being done about it?", "Was it done well enough?"]
narration = """Here is the whole method in four questions. [[slnc 400]] What is being built? That is the model. [[slnc 500]] What can go wrong? That is STRIDE. [[slnc 500]] What is being done about it? Those are the decisions. [[slnc 500]] And was it done well enough? Those are the checks, run again with every change."""

[[scene]]
