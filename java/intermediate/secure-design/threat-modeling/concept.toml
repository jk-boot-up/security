]

[[act]]
title = "Rating and deciding"
summary = "The highest risks score 5 x 5 = 25 at the internet boundary; the 20 threats are decided as mitigate 17, accept 1, transfer 1 and avoid 1, with none undecided."
detail = """
Each threat is rated: likelihood follows the least trusted zone it touches, impact follows what is at stake, and risk is their product. The highest risks are at the internet boundary, 5 times 5, 25. Then people decide: mitigate 17, accept 1, transfer 1, avoid 1.
The accepted risk, a card processor denying a charge, is covered by signed receipts and the contract, with an owner and a review on day 90. Denial of service on the gateway is transferred to the hosting provider's protection under contract. Disclosure from the audit log is avoided: card numbers and secrets are never written to it. No threat is left undecided.
"""
speech = """
Third demo: rating and deciding. [[slnc 400]] Each threat gets a likelihood and an impact, from one to five. [[slnc 300]] Risk is the two multiplied. [[slnc 600]]
The highest risks sit at the internet boundary, where an attacker starts. [[slnc 300]] Five times five, twenty five. [[slnc 600]]
Then people decide. [[slnc 300]] Seventeen are mitigated. [[slnc 300]] One is accepted, with an owner and a review date. [[slnc 300]] One is transferred to a provider, under contract. [[slnc 300]] And one is avoided, by never storing the data at all. [[slnc 600]]
No threat is left without a decision.
"""
rows = { decide = "active ok" }
