body = ["An online bank:", "a mobile app, an API gateway,", "a payments service, two stores,", "and a card processor outside.", "", "How could the design be attacked?"]
narration = """Here is the scenario. [[slnc 400]] An online bank has a mobile app, an A P I gateway, a payments service, two data stores, and a card processor outside its walls. [[slnc 600]] Every feature is reviewed for bugs. [[slnc 300]] But nobody asks, in a repeatable way, how the design itself could be attacked."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["Data-flow model: boxes and arrows", "Trust boundary: where trust changes", "STRIDE: six kinds of threat", "Risk: likelihood times impact", "Decision: mitigate, accept, transfer, avoid"]
narration = """Before the demos, the words. [[slnc 500]] A data flow model is the system as boxes and arrows. [[slnc 500]] A trust boundary is where what is trusted on one side cannot be trusted on the other. [[slnc 500]] STRIDE is six kinds of threat. [[slnc 500]] Risk is likelihood times impact. [[slnc 500]] And every threat gets a decision: mitigate, accept, transfer, or avoid."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "09-ladder"
kind = "bullets"
title = "The Four Questions"
body = ["What is being built?", "What can go wrong?", "What is being done about it?", "Was it done well enough?"]
narration = """Here is the whole method in four questions. [[slnc 400]] What is being built? That is the model. [[slnc 500]] What can go wrong? That is STRIDE. [[slnc 500]] What is being done about it? Those are the decisions. [[slnc 500]] And was it done well enough? Those are the checks, run again with every change."""

[[scene]]
key = "10-roles"
kind = "bullets"
title = "Who Does What"
body = ["Model: elements, flows, boundaries", "StrideRules: candidate threats", "Rating: likelihood times impact", "Register: one decision per threat", "Checks: mitigations as tests"]
narration = """Here is who does what in the code. [[slnc 400]] The model holds elements, flows and trust boundaries, and checks the picture. [[slnc 500]] The STRIDE rules produce candidate threats. [[slnc 500]] The rating ranks them. [[slnc 500]] The register records one decision for each. [[slnc 300]] And the checks turn every mitigation into a test."""

[[scene]]
key = "11-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Design reviews with dashed boundaries", "Risk registers with owners and dates", "Threat Dragon, pytm", "\"Did the threat model change?\" in a pull request"]
narration = """You have probably met this already. [[slnc 400]] Design reviews with dashed trust boundaries on the diagram. [[slnc 500]] Risk registers with owners and review dates. [[slnc 500]] Tools such as Threat Dragon and pytm. [[slnc 500]] And pull request templates that ask whether the threat model changed."""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Model early, keep it small", "Decide every threat explicitly", "Give accepted risks an owner and a date", "Make mitigations testable", "Revisit with every design change"]
narration = """So, how do you use it? [[slnc 400]] Model early, and keep the model small. [[slnc 500]] Decide every threat explicitly. [[slnc 500]] Give every accepted risk an owner and a date. [[slnc 500]] Make mitigations testable. [[slnc 500]] And revisit the model with every design change."""

[[scene]]
key = "13-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a web shop", "and find the new threats."]
narration = """That's threat modeling with STRIDE. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] A threat model is only useful when it is small, decided, and tested every time the design changes. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine, with nothing installed except a Java development kit. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a web shop next to the mobile app, and find the new threats and checks. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
The threat modeling practice itself: the model kept in the repository, the rules, the register and the checks, and how they stay true as the real system changes. It does not cover the bank's own threats, which are the subject of the demo.
"""
assets = [
    "The model and register, which the team relies on to know what is covered.",
    "The checks, which stand between a design change and a release.",
    "The accepted risks and their review dates.",
]
actors = [
    "The team, who draw, decide and update.",
    "An attacker, who finds what the model missed.",
]
boundaries = [
    "The model to the real system: the model is only true while it matches the design.",
    "The rules to the team's judgement: rules find candidates, people decide.",
]
assumptions = [
    "The team updates the model in the same change as the design.",
    "The checks run in the build, so a failing check blocks a release.",
    "In the demo, the bank, the scales and the decisions are illustrative.",
]
out_of_scope = [
    "Quantitative risk methods: the advanced track.",
    "Tool-specific diagrams: the -with-pytm version.",
]
tests = [
    "`ModelTest` checks completeness, crossings and boundaries, and the draft's problems.",
    "`StrideTest` checks the generated threats, their order, and the ratings.",
    "`ChecksTest` checks that every threat is decided and every mitigation proven, and that a design change fails the right check.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next project, attack-trees-and-abuse-cases, takes one threat and breaks it into the attacker's steps, to find which defence cuts the cheapest path.
"""

[[threat]]
id = "T1"
stride = "T"
threat = "The model drifts from the real system, so its threats and checks describe something that no longer exists"
where = "`Model`, `BankModel`"
control = "The model lives in the repository and its checks run in the build"
residual = "A change made outside the model, such as a manual firewall rule, is still invisible to it"

[[threat]]
id = "T2"
stride = "I"
threat = "A threat is missed because no rule asks the right question"
where = "`StrideRules`"
control = "Rules cover every element and boundary crossing, and the team reviews the list"
residual = "STRIDE finds common candidates only; logic and abuse cases need the next project"

[[threat]]
id = "T3"
stride = "R"
threat = "A risk is accepted and forgotten"
where = "`Register`"
control = "Every accepted risk has an owner and a review day, and the demo reports one past its date"
residual = "An owner who leaves the team leaves the risk without one, unless ownership moves with the role"

[[threat]]
id = "T4"
stride = "T"
threat = "A mitigation is claimed but never verified"
where = "`Register.unproven`"
control = "Every mitigation must name a check that exists"
residual = "A check proves only what the model says, not what the running system does"

[[threat]]
id = "T5"
stride = "E"
threat = "An attacker exploits a design gap the model never showed"
where = "the real system"
control = "Review the model on every design change, and test the running system too"
residual = "No model is complete; penetration tests and monitoring remain necessary"
