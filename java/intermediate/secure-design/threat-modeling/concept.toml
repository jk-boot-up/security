narration = """That's threat modeling with STRIDE. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] A threat model is only useful when it is small, decided, and tested every time the design changes. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine, with nothing installed except a Java development kit. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a web banking portal next to the mobile app, and find the new threats and checks. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
The threat modeling practice itself: the model kept in the repository, the rules, the register and the checks, and how they stay true as the real system changes. It does not cover the bank's own threats, which are the subject of the demo.
"""
assets = [
    "The model and register, which the team relies on to know what is covered.",
    "The checks, which stand between a design change and a release.",
    "The accepted risks and their review dates.",
]
actors = [
    "The team, who draw, decide and update.",
    "An attacker, who finds what the model missed.",
]
boundaries = [
    "The model to the real system: the model is only true while it matches the design.",
    "The rules to the team's judgement: rules find candidates, people decide.",
]
assumptions = [
    "The team updates the model in the same change as the design.",
    "The checks run in the build, so a failing check blocks a release.",
    "In the demo, the bank, the scales and the decisions are illustrative.",
]
out_of_scope = [
    "Quantitative risk methods: the advanced track.",
    "Tool-specific diagrams: the -with-pytm version.",
]
tests = [
    "`ModelTest` checks completeness, crossings and boundaries, and the draft's problems.",
    "`StrideTest` checks the generated threats, their order, and the ratings.",
    "`ChecksTest` checks that every threat is decided and every mitigation proven, and that a design change fails the right check.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next project, attack-trees-and-abuse-cases, takes one threat and breaks it into the attacker's steps, to find which defence cuts the cheapest path.
"""

[[threat]]
id = "T1"
stride = "T"
threat = "The model drifts from the real system, so its threats and checks describe something that no longer exists"
where = "`Model`, `BankModel`"
control = "The model lives in the repository and its checks run in the build"
residual = "A change made outside the model, such as a manual firewall rule, is still invisible to it"

[[threat]]
id = "T2"
stride = "I"
threat = "A threat is missed because no rule asks the right question"
where = "`StrideRules`"
control = "Rules cover every element and boundary crossing, and the team reviews the list"
residual = "STRIDE finds common candidates only; logic and abuse cases need the next project"

[[threat]]
id = "T3"
stride = "R"
threat = "A risk is accepted and forgotten"
where = "`Register`"
control = "Every accepted risk has an owner and a review day, and the demo reports one past its date"
residual = "An owner who leaves the team leaves the risk without one, unless ownership moves with the role"

[[threat]]
id = "T4"
stride = "T"
threat = "A mitigation is claimed but never verified"
where = "`Register.unproven`"
control = "Every mitigation must name a check that exists"
residual = "A check proves only what the model says, not what the running system does"

[[threat]]
id = "T5"
stride = "E"
threat = "An attacker exploits a design gap the model never showed"
where = "the real system"
control = "Review the model on every design change, and test the running system too"
residual = "No model is complete; penetration tests and monitoring remain necessary"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] The bank is a model in code, not a running system, so every result is exact. [[slnc 300]] Here are the classes that matter."""

[[class]]
name = "Model"
what = "elements in zones, flows, and trust boundaries"
[[class.part]]
title = "checking the picture"
code = """
if (crosses(f) && boundaryOf(f).isEmpty()) {
    problems.add(f.id() + " goes from " + zoneOf(f.from())
            + " to " + zoneOf(f.to()) + ", skipping a boundary");
"""
speech = """A flow that changes zone must cross exactly one drawn boundary. [[slnc 300]] If none separates its two zones, the picture is wrong, and the threats on the missing boundary would be hidden."""

[[class]]
name = "StrideRules"
what = "turns the model into candidate threats"
[[class.part]]
title = "rules that follow the shape of the diagram"
code = """
if (model.crosses(f)) {
    threats.add(new Threat(Stride.TAMPERING, f.id(),
            "the " + f.data() + " is changed in transit"));
}
if (f.money()) {
    threats.add(new Threat(Stride.REPUDIATION, f.id(),
            "whoever sent the " + f.data() + " denies it"));
"""
speech = """Each rule is a plain if over the model. [[slnc 300]] A flow that crosses a boundary could be changed; a flow that moves money could be denied. [[slnc 300]] The rules find candidates; they decide nothing."""

[[class]]
name = "Rating"
what = "likelihood times impact, from the model"
[[class.part]]
title = "the weaker end sets the likelihood"
code = """
return new Rating(likelihoodOf(weakerZone(model, f)), f.money() ? 5 : 3);
...
return model.trust(from) <= model.trust(to) ? from : to;
"""
speech = """A flow's likelihood comes from its less trusted end, where an attacker would start. [[slnc 300]] Its impact is five if it moves money, and three if not."""

[[class]]
name = "Register"
what = "one decision for each threat"
[[class.part]]
title = "an accepted risk has an owner and a day"
code = """
d.put("R:F6", Decision.accept("signed receipts and the contract cover it",
        "payments lead", ACCEPTED_REVIEW_DAY));
"""
speech = """The register is where people decide. [[slnc 300]] An accepted risk must name a reason, an owner and a review day. [[slnc 300]] A threat with no entry here counts as undecided."""

[[class]]
name = "Checks"
what = "mitigations as code that runs over the model"
[[class.part]]
title = "the TLS check"
code = """
checks.put(TLS, m -> m.flows().stream().filter(m::crosses).filter(f -> !f.encrypted())
        .map(f -> f.id() + " " + f.data() + " is not encrypted").toList());
"""
speech = """Each check returns what breaks it, so an empty list means it passes. [[slnc 300]] When the refund flow is added, this one returns F nine, and the build fails."""

