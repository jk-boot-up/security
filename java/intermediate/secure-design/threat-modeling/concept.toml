[[act]]
title = "STRIDE per element"
summary = "Rules turn the model into 20 candidate threats: spoofing 4, tampering 5, repudiation 4, information disclosure 2, denial of service 1, elevation of privilege 4."
detail = """
STRIDE per element turns the model into questions nobody forgets to ask. The rules find 20 candidate threats: S 4, T 5, R 4, I 2, D 1, E 4. Spoofing for every external entity and every process that receives a flow across a boundary; tampering for every flow that crosses a boundary;
repudiation for every flow that moves money; information disclosure for every store; denial of service for every public-facing process; elevation of privilege for every flow into a more trusted zone. Each category is the opposite of a property: spoofing against authenticity, tampering against integrity, and so on.
"""
speech = """
Second demo: STRIDE per element. [[slnc 400]] STRIDE is six questions. [[slnc 300]] Spoofing, tampering, repudiation, information disclosure, denial of service, and elevation of privilege. [[slnc 600]]
Simple rules ask them of every part of the model. [[slnc 300]] Every flow that crosses a boundary could be changed. [[slnc 300]] Every flow that moves money could be denied. [[slnc 300]] Every store could be read by the wrong person. [[slnc 600]]
The rules find twenty candidate threats. [[slnc 300]] Each category is the opposite of a property the bank needs.
"""
rows = { stride = "active amber" }
console = [
    ["the rules find 20 candidate threats: S 4, T 5, R 4, I 2, D 1, E 4", "amber"],
