[[act]]
title = "Mitigations as tests"
summary = "8 checks, one for every mitigation, pass on the bank as built; adding an unencrypted refund flow fails the TLS check and brings 2 undecided threats, and the old draft fails 3 checks."
detail = """
Every mitigation names a check that runs over the model: 8 checks, and every mitigation names one. On the bank as built, none fails. Then a design change adds F9: the payments service sends refunds to the card processor, unencrypted. One check fails now, TLS on every flow that crosses a boundary, naming F9, before the release.
The rules also find 2 new threats with no decision, tampering and repudiation on F9. The earlier draft fails 3 checks, so it would never have shipped either.
"""
speech = """
Fourth demo: mitigations as tests. [[slnc 400]] Every mitigation names a check that runs over the model. [[slnc 300]] There are eight, and on the bank as built, they all pass. [[slnc 600]]
Then the design changes. [[slnc 300]] Refunds are sent to the card processor, and the new flow is not encrypted. [[slnc 600]]
The encryption check fails, and names the new flow, before the release. [[slnc 300]] The rules also find two new threats that nobody has decided yet. [[slnc 600]]
The model is no longer a document. It is a test.
"""
