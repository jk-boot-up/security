main_class = "ThreatModelDemo"
tagline = "Find the threats on paper, before an attacker finds them in production"
bold = "A threat model is a small, checked picture of the system: STRIDE rules turn every element and boundary into questions, people rate and decide each threat, and every mitigation becomes a test, so a design change that breaks one fails before release instead of after a breach."
domain = "an online bank"
domain_note = ""
youtube_description = """Threat modeling with STRIDE in Java, for OWASP Top 10 A06, insecure design. Explained with an online bank, like an architect who walks through a building plan asking where a burglar would get in, before the walls are built. The bank's mobile app, gateway, payments service, stores and card processor become a data-flow model with trust boundaries, checked for gaps; STRIDE rules turn it into twenty candidate threats; each one is rated and decided: mitigate, accept with an owner and a review date, transfer, or avoid; every mitigation becomes an executable check, so adding an unencrypted refund flow fails a test before release; and the bill: a model is only worth what its last update was, and an accepted risk has an expiry date."""
thumb_lines = ["THREAT MODELING", "WITH STRIDE"]
thumb_code = "S T R I D E"
youtube_title = "Threat Modeling with STRIDE in Java (OWASP A06, Insecure Design)"
