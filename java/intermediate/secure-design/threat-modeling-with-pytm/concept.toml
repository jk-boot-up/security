[docs.problem]
scenario = """
A bank is designed by several teams, and nobody has asked systematically what could go wrong at each element and flow.
"""
naive = """
Draw a picture and write down the threats that come to mind.
"""
deliver = [
    "The bank's design as a pytm model, written by a program.",
    "113 threats checked against every element and flow.",
    "The effect of each honest answer.",
    "A diagram and a report from the same model.",
]

[docs.prerequisites]
required = [
    "Java basics",
    "The plain threat-modeling project, for the ideas",
    "python3 with pip, and Graphviz: brew install graphviz",
]
not_required = [
    "Python knowledge: the model is generated",
]
install = ["python3", "graphviz"]

[docs.session]
objectives = [
    "describe a system for pytm",
    "read pytm's findings and their severities",
    "explain why an answer changes the findings",
    "name three things pytm does not do",
]
walkthrough = """
Run act three and find the stage that removes the most findings. In act four read the report template. In act five find what pytm cannot know.
"""
exercises = [
    "Add the refund flow to the answers: encrypt it, and see which five findings go.",
    "Add a template line for the mitigations pytm gives each finding.",
    "Write a test that fails when an answer is true in the model and false in the code.",
    "Add the plain project's decisions (owner, accept, review day) next to the findings.",
]

[docs.explained]
sentence = """
A threat model tool asks the same questions of every element and flow, and the answers decide what it finds.
"""
verdict = """
Describe the system once and generate the model from it, give each answer an owner and a test, start from the worst case and earn each finding away, keep decisions in a register, and rerun the tool at every design change.
"""
recognise = [
    "`from pytm import` in a repository.",
    "A `--dfd` diagram in a design document.",
    "A list of CAPEC ids next to a design.",
    "Findings sorted by severity in a report.",
]

[spec]
purpose = """
Teach threat modeling with pytm: a model, its answers, its findings and what remains for people.
"""
nongoals = [
    "Replacing the register of decisions.",
    "Writing pytm's threat library.",
    "Sequence diagrams.",
]
problem = """
Threat modeling by hand is slow and forgets questions; a tool asks them all but needs honest answers.
"""
roles = [["The design", "`Design`"], ["The answers", "`Answers`"], ["The model file", "`Writer`"], ["pytm", "`Pytm`"], ["Entry point", "`PytmDemo`"]]
requirements = [
    "The Python model is written from the Java design.",
    "pytm runs in a virtual environment installed on the first use.",
    "Findings are sorted before they are printed.",
    "The diagram and the report come from the same model.",
    "The demo prints the same output on every run.",
]

