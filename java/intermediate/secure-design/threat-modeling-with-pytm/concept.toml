short = "AC05, AC06, AC14, AC17, AC18, AC21"
long = "pytm threat ids of the access control family"
say = "Ids such as A C zero six name one threat of pytm's library: letters for a family, here access control, and a number."
[[acronym]]
short = "INP02, INP05, INP07, INP19, INP23"
long = "pytm threat ids of the input family"
say = "I N P is the family of pytm's threats about input, such as I N P nineteen."
[[acronym]]
short = "AA01, CR06, CR08, DE01, DE02, DE03, HA01, SC02"
long = "more pytm threat ids"
say = "The other ids work the same way: letters for a family of threats, and a number."
[[acronym]]
short = "TLS"
long = "Transport Layer Security: the encryption inside HTTPS"
say = "T L S is transport layer security, the encryption inside H T T P S."
[[acronym]]
short = "OWASP"
long = "Open Worldwide Application Security Project"
say = "OWASP is the open worldwide application security project."
