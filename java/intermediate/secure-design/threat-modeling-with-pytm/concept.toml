# concept.toml: everything about this project that is not Java code.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "threat-modeling-with-pytm"
level = "intermediate"
module = "secure-design"
title = "Threat Modeling with pytm"
short_title = "Threat Modeling with pytm"
package = "pytmmodel"
main_class = "PytmDemo"
tagline = "Describe the bank once, let pytm check its 113 threats against every element and flow, and watch each honest answer remove findings"
bold = "A program writes the bank's data-flow design as a Python model for pytm 1.4, which checks 113 threats from its library against every element and flow: with no answers it finds 170, and four stages of answers (encryption, authentication, access control and input handling, resilience) bring it to 94; the same model draws the diagram with Graphviz and fills a report template; but the findings are a function of the answers, pytm accepts a draft that skips a boundary, holds no decisions, and catches a design change only if the model is changed."
domain = "a bank"
domain_note = ""
youtube_description = "The bank's data-flow design (a customer, a mobile app, an API gateway, a payments service, two stores and a card processor across four trust boundaries) written as a pytm 1.4 model by a Java program: the 113 threats of pytm's library checked against every element and flow, 170 findings when nothing is said, 167, 159, 111 and 94 as encryption, authentication, access control and input handling, and resilience are declared, a diagram drawn by Graphviz, a report from a template, a draft with a flow that skips a boundary that pytm accepts, and a refund flow over plain http that adds findings."
thumb_lines = ["THREAT MODELING", "WITH PYTM"]
thumb_code = "f2.controls.isEncrypted = True"
youtube_title = "Threat Modeling with pytm: 113 Threats, Answers That Change the Findings, Diagrams and Reports (OWASP A06)"
youtube_tags = ["pytm", "threat modeling", "stride", "capec", "data flow diagram", "graphviz", "secure design", "owasp top 10", "a06", "java"]

[readme]
intro = """
The plain [threat-modeling](../threat-modeling) project writes a data-flow model of an online bank, runs STRIDE rules over it and keeps a register of decisions. This one gives the same bank to a real tool, **pytm 1.4**, "pythonic threat modeling": a Java program writes the design as a Python model, pytm checks the 113 threats of its library against every element and flow, and the findings, a diagram and a report come out of the same model. It needs `python3` with `pip` (pytm is installed into a virtual environment under `build/` the first time, which needs a network) and Graphviz (`brew install graphviz`); the tests are tagged `integration`: `./gradlew integrationTest`.

What it shows:
- **The bank, written for pytm.** 7 elements, 8 flows and 4 boundaries, 66 lines of Python. A draft with a card vault and a flow from the app that skips a boundary is **accepted without a complaint** (the plain model check reported 2 problems): pytm judges the answers about each element, not the shape of the picture.
- **What pytm finds when nothing is said.** 170 findings from 73 different threats (16 Very High, 59 High, 85 Medium), starting from the worst case; the plain STRIDE rules gave 20 candidates.
- **Every answer changes the findings.** Declaring encryption: 167. Authentication: 159. Access control, least privilege and input handling: 111. Hardening, limits and logging: **94**. An answer that is not true makes a finding disappear.
- **A diagram and a report.** `--dfd` and Graphviz draw 7 nodes, 8 arrows and 4 trust boundaries; `--report` fills a template of our own with the 94 findings.
- **The bill.** A refund flow over plain http takes 94 findings to 99; findings about XML appear in a bank that parses none; pytm keeps no owner, no decision and no review date.

**Maps to:** OWASP Top 10 (2025) A06 Insecure Design · NIST SSDF PW.1 (design software to meet security requirements) · CAPEC (the source of pytm's threats) · STRIDE.
"""
analogy = """
A building inspector with a very long checklist who starts by assuming every door is unlocked. Each lock you can honestly show them crosses items off, and a lock you claim but do not have only hides the item.
"""
scenario = """
The online bank of the plain threat-modeling project. The demo describes it once, in Java, and asks pytm what could go wrong at each stage of what the team can honestly say about it.
"""
costs = [
    "**The answers are claims,** and a false one hides a finding.",
    "**A generic library of threats gives candidates,** many of which do not apply.",
    "**The model is a second copy of the design** unless it is generated from the first.",
    "**pytm has no place for decisions,** owners and review dates.",
    "**It needs Python and Graphviz,** one more toolchain.",
]
too_much = """
A small internal tool with one user and no sensitive data does not need a tool. Use one when a design has several parties and boundaries, or when the model must be rerun at every change.
"""
met_before = [
    "A `tm.py` file in a repository.",
    "A data-flow diagram in a design document.",
    "A STRIDE spreadsheet.",
    "A list of findings sorted by severity that nobody has read.",
]
where = """
This is the tools version of [threat-modeling](../threat-modeling), in the [secure-design](..) module. The next project turns the same bank into attack trees and abuse cases: [attack-trees-and-abuse-cases-with-threat-dragon](../attack-trees-and-abuse-cases-with-threat-dragon).
"""
twin = """
pytm is the real library, installed with pip into a virtual environment; Graphviz is the real dot. The model is written by the program from a Java description of the bank. Findings are sorted before they are printed, so the output is the same on every run.
"""
test_note = "The design and the generated Python are tested with no tool. The rest run pytm and Graphviz (./gradlew integrationTest); the first run installs pytm with pip and needs a network."

[[act]]
title = "The bank, written for pytm"
summary = "A Java design of 7 elements, 8 flows and 4 boundaries becomes 66 lines of pytm Python; a draft that skips a boundary is accepted."
detail = """
The design has 7 elements, 8 flows and 4 boundaries, written by the program as 66 lines of Python for pytm 1.4.0: boundaries, then actors, processes, servers, stores and external entities, then flows with their protocol and port. pytm's library has 113 threats, each with a condition over the answers given about an element or a flow. The draft of the plain project, with a card vault and a flow from the app that skips a boundary, runs without a complaint and gets 9 findings about the new store and flow; the plain project's model check reported 2 problems for the same draft. pytm judges the answers about each element, not the shape of the picture.
"""
speech = """
First demo: the bank, written for pytm. [[slnc 400]] A Java design of seven elements and eight flows becomes sixty six lines of Python. [[slnc 600]]
Pytm's library has a hundred and thirteen threats. [[slnc 300]] A draft that skips a boundary runs without a complaint.
"""
rows = { model = "active ok" }
console = [
    ["7 elements, 8 flows, 4 boundaries: 66 lines of Python", "ok"],
    ["pytm 1.4.0 library: 113 threats", "ok"],
    ["the draft that skips a boundary: no complaint", "bad"],
]

[[act]]
title = "What pytm finds when nothing is said"
summary = "170 findings from 73 threats, starting from the worst case."
detail = """
With no answers, pytm reports 170 findings from 73 different threats: 16 Very High, 59 High, 85 Medium, 8 Low and 2 Very Low. They are spread over every element and flow, 44 each for the API gateway and the payments service. The most severe are using malicious files, catching an exception from a privileged block, and session hijacking, server side and client side. The plain project's STRIDE rules gave 20 candidates for the same bank; pytm checks each of its 113 threats against every element and flow it applies to, and starts from the worst case when nothing is said.
"""
speech = """
Second demo: what pytm finds when nothing is said. [[slnc 400]] A hundred and seventy findings from seventy three threats. [[slnc 600]]
It starts from the worst case. [[slnc 300]] The plain stride rules gave twenty.
"""
rows = { nothing = "active wrong" }
console = [
    ["170 findings from 73 threats", "bad"],
    ["16 Very High, 59 High, 85 Medium, 8 Low, 2 Very Low", "bad"],
    ["API gateway 44, Payments service 44", "bad"],
]

[[act]]
title = "Every answer changes the findings"
summary = "Four stages of honest answers take 170 findings down to 94."
detail = """
With no answers 170 findings. Declaring that traffic and stores are encrypted: 167, 3 gone. That callers and services are authenticated: 159, 8 gone. Access control, least privilege and input handling: 111, 48 gone. Hardening, limits and logging: 94, 17 gone. The findings are a function of the answers: an answer that is not true makes a finding disappear, which is why each answer needs an owner and a test.
"""
speech = """
Third demo: every answer changes the findings. [[slnc 400]] Encryption, authentication, access control and input handling, hardening and logging. [[slnc 600]]
A hundred and seventy, down to ninety four. [[slnc 300]] An answer that is not true makes a finding disappear.
"""
rows = { answers = "active ok" }
console = [
    ["170 -> 167 -> 159 -> 111 -> 94", "ok"],
    ["access control and input handling remove 48", "ok"],
    ["an untrue answer hides a finding", "bad"],
]

[[act]]
title = "A diagram and a report"
summary = "The same model draws 7 nodes, 8 arrows and 4 boundaries and fills a report of 94 findings."
detail = """
--dfd writes a graph for Graphviz; rendered, the picture has 7 nodes, 8 arrows and 4 trust boundaries. --report fills a template of our own: 94 findings listed, each with its element and severity, from 102 lines of Markdown. The diagram and the report come from the same model as the findings, so they cannot disagree with it.
"""
speech = """
Fourth demo: a diagram and a report. [[slnc 400]] The same model draws seven nodes, eight arrows and four boundaries. [[slnc 600]]
And fills a report with the ninety four findings. [[slnc 300]] They cannot disagree with the model.
"""
rows = { outputs = "active ok" }
console = [
    ["dot: 7 nodes, 8 arrows, 4 trust boundaries", "ok"],
    ["report: 94 findings in 102 lines of Markdown", "ok"],
]

[[act]]
title = "The bill"
summary = "A design change is caught only if the model is changed, generic findings need a person, and pytm keeps no decisions."
detail = """
A design change, refunds sent to the card processor over plain http: 94 findings become 99, 5 of them about the new flow. The model catches the change only if the model is changed. 5 findings mention XML in a bank that parses none: a library of generic threats gives candidates, and a person says which apply. pytm holds no decision: no owner, no accept or transfer, no review date, no check that a mitigation exists; those stay in the register of the plain project. The Python model is a second copy of the design, so here it is written from the Java design and regenerated with every change.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] A refund flow over plain http adds five findings, but only if the model is changed. [[slnc 600]]
Generic threats give candidates, and a person says which apply. [[slnc 300]] Pytm keeps no decisions.
"""
rows = { bill = "active wrong" }
