stride = "R"
threat = "An untrue answer hides a finding"
where = "the model's answers"
control = "Each answer has an owner and a test"
residual = "Answers nobody tests"

[[threat]]
id = "T2"
stride = "T"
threat = "The system changes and the model does not"
where = "the design"
control = "Generate the model from one description, and rerun on every change"
residual = "Changes made outside the description"

[[threat]]
id = "T3"
stride = "I"
threat = "Hundreds of generic findings bury the ones that matter"
where = "the findings"
control = "Start from the worst case and earn findings away; rank by severity"
residual = "Findings nobody reads"

[[threat]]
id = "T4"
stride = "R"
threat = "A finding is accepted without a decision on record"
where = "after the tool"
control = "A register with owner, decision and review day"
residual = "Decisions that expire unnoticed"

