[[scene]]
key = "01-poster"
kind = "poster"
title = "Threat Modeling with pytm"
narration = "Hello, and welcome. [[slnc 400]] This video explains threat modeling with pytm, a threat modeling tool written in Python. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A threat model is a picture of a system, its parts, and the data that flows between them, with a list of what could go wrong. [[slnc 300]] pytm checks a library of a hundred and thirteen known threats against every part and every flow. [[slnc 300]] Each threat has a condition over what the team says about a part, and each honest answer, like this flow is encrypted, turns off the threats it covers. [[slnc 600]] Think of a building inspector with a long checklist, who crosses off each item as you show the proof. [[slnc 600]] Our example is a bank."

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online bank:", "  a customer and a mobile app", "  an API gateway and a payments service", "  two data stores and a card processor", "  across four trust boundaries", "", "A Java program writes it as a pytm model,", "and adds the team's answers in four stages."]
narration = "Here is the scenario. [[slnc 400]] An online bank: a customer and a mobile app, an A P I gateway, a payments service, two data stores, and a card processor, across four trust boundaries. [[slnc 500]] A Java program describes the bank once, and writes it out as a pytm model. [[slnc 500]] Then it adds what the team can honestly say about the design, in four stages, and asks pytm what could still go wrong after each one."

[[scene]]
key = "02-words"
kind = "bullets"
title = "The Words"
body = ["Element: a box: actor, process, server, store", "Flow: an arrow, with protocol and port", "Trust boundary: a dashed box; trust changes", "Threat: a library entry with a condition", "Answer: a control set to True in the model", "Finding: a threat whose condition is True"]
narration = """Before the demos, the words. [[slnc 500]] An element is one box of the picture: an actor such as the customer, a process, a server, a data store, or an external entity. [[slnc 500]] A flow is an arrow between two elements, with its protocol and port. [[slnc 500]] A trust boundary is a dashed box around elements that trust each other; data crossing it changes hands. [[slnc 500]] A threat is one entry of pytm's library, with a condition. [[slnc 500]] An answer is what the team says about an element, written as a control set to true. [[slnc 500]] And a finding is a threat whose condition is true for one element or flow."""

[[scene]]
key = "02-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "02-one-threat"
kind = "figure"
title = "One threat, one element, one answer"
body = "one_threat"
narration = """Let's see the core idea on one real example. [[slnc 400]] At the top, one threat from pytm's library. [[slnc 300]] A C zero six, using malicious files, very high, for every server. [[slnc 300]] Its condition: is hardened is false, or has access control is false. [[slnc 600]]
On the left, the A P I gateway before the answer. [[slnc 300]] The team has said it has access control, but not that it is hardened. [[slnc 300]] So the first test is true and the second is false. [[slnc 300]] True or false is true. [[slnc 300]] pytm reports the threat. [[slnc 600]]
On the right, after one more line in the model: gateway controls is hardened equals true. [[slnc 300]] Now both tests are false. [[slnc 300]] False or false is false. [[slnc 300]] The finding is gone. [[slnc 300]] If that line is not true in the real system, the finding is gone all the same."""

[[scene]]
key = "03-acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "04-costs"
kind = "bullets"
title = "What It Costs"
body = ["Each answer is a claim, and can be untrue", "A generic threat library gives candidates", "The model is a second copy of the design", "pytm keeps no decisions or owners", "It needs Python and Graphviz"]
narration = "Nothing is free. [[slnc 400]] Here is what it costs. [[slnc 500]] Each answer is a claim, and an untrue one quietly hides a finding. [[slnc 500]] A generic threat library gives candidates, and some will not apply, like X M L threats in a bank that parses none. [[slnc 500]] The model is a second copy of the design, which must be kept in step with it. [[slnc 500]] pytm keeps no owner, no decision, and no review date. [[slnc 300]] And it needs Python and Graphviz installed."

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["from pytm import ... in a repository", "A data-flow diagram in a design document", "CAPEC ids next to a design", "A threat list sorted by severity"]
narration = "You have probably met this already. [[slnc 400]] From pytm import, in a repository, is a threat model kept as code. [[slnc 500]] A data-flow diagram with dashed trust boundaries, in a design document, is the picture pytm draws. [[slnc 500]] A list of CAPEC ids next to a design names known attack patterns. [[slnc 500]] And a threat list sorted by severity is pytm's report."

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Generate the model from one description", "Answer only what is true, and test it", "Read findings as candidates", "Keep decisions, owners and dates elsewhere", "Regenerate and rerun at every design change"]
narration = "So, how do you use it? [[slnc 400]] Generate the model from one description of the design, so there is only one copy. [[slnc 500]] Answer only what is true, and give each answer a test. [[slnc 500]] Read the findings as candidates, and let a person decide which apply. [[slnc 300]] Keep decisions, owners, and review dates in a register of their own. [[slnc 500]] And regenerate the model and run pytm again at every design change."

[[scene]]
key = "07-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Encrypt the refund flow", "and see which of its five findings go."]
narration = "That's threat modeling with pytm. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] A tool can check a long list of known threats against every part of a design, but only as honestly as the answers it is given, and the decisions are still the team's. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add the refund flow to the answers, encrypt it, and see which of its five findings go. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] The bank is described once in Java; the classes write it for pytm, run pytm, and redo its conditions by hand. [[slnc 300]] Here are the ones that matter."""

[[class]]
name = "Design"
what = "the bank as plain data: elements, flows, boundaries"
[[class.part]]
title = "one element, one flow"
code = """
public record Element(String id, String name, Kind kind, String boundary) {
...
new Element("gateway", "API gateway", Kind.SERVER, "DMZ"),
...
new Flow("f2", "app", "gateway", "Payment request with token", "payment", "HTTPS", 443),
"""
speech = """An element has a variable name, the name the diagram shows, a pytm kind and a boundary. [[slnc 300]] A flow has its two ends, a label, a protocol and a port. [[slnc 300]] The draft and the refund change are the same bank with one more element or flow."""

[[class]]
name = "Answers"
what = "what the team says, in four stages"
[[class.part]]
title = "a stage adds control lines"
code = """
if (s >= Stage.ENCRYPTION.ordinal() && TLS_FLOWS.contains(f.id())) {
    lines.add(f.id() + ".controls.isEncrypted = True");
"""
speech = """Each stage includes the ones before it. [[slnc 300]] From the encryption stage on, the flows on the list get is encrypted equals true. [[slnc 300]] A flow on no list, like the refund flow, gets no answers at all."""

[[class]]
name = "Writer"
what = "writes the Python model pytm reads"
[[class.part]]
title = "one line per element and per flow"
code = """
out.add(e.id() + " = " + e.kind().pytm + "(\\"" + e.name() + "\\")");
out.add(e.id() + ".inBoundary = " + e.boundary().toLowerCase());
...
out.add(f.id() + " = Dataflow(" + f.from() + ", " + f.to() + ", \\"" + f.label() + "\\")");
...
out.add("tm.process()");
"""
speech = """The Writer turns the design and the answers of a stage into Python. [[slnc 300]] There is one description of the bank, so the model is never a second copy. [[slnc 300]] tm dot process at the end makes pytm do its work."""

[[class]]
name = "Pytm"
what = "runs the real pytm in its own virtual environment"
[[class.part]]
title = "the findings of one model"
code = """
public List<Finding> findings(String name, String python) throws IOException, InterruptedException {
    Path json = work.resolve(name + ".json");
    Run r = model(name, python, "--json", json.toString());
"""
speech = """pytm is installed with pip at pinned versions, the first time. [[slnc 300]] A model is run with dash dash j s o n, and each finding is read back: the threat, the element, the severity and the title. [[slnc 300]] The tests replay a recording of these answers, so they need no Python."""

[[class]]
name = "Condition"
what = "a teaching class: redoes pytm's conditions by hand"
[[class.part]]
title = "or, and, not, as in Python"
code = """
private boolean or(Set<String> answers) {
    boolean value = and(answers);
    while (at < tokens.size() && tokens.get(at).equals("or")) {
...
public boolean holds(Set<String> trueAnswers) {
    return trueAnswers.contains(answer) == value;
"""
speech = """A condition is read like Python: not first, then and, then or. [[slnc 300]] Each test compares one answer with true or false; an answer that was never given is false. [[slnc 300]] A test checks that it gives pytm's exact result in all seven hundred and thirty cases."""

