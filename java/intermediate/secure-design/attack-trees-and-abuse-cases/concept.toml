headline = [["ATTACK TREES", "text"], ["AND ABUSE CASES", "accent"]]
taglines = [["Price each step, cut the cheapest path, look again", "gold"]]
before = { code = "cheapest way in: 50 EUR", note = "The tree as it is", tag = "BEFORE" }
