[docs.problem]
scenario = """
An online bank has a list of threats and a budget that covers some of them. The team must decide which defences to build first.
"""
naive = """
Build the defence that sounds strongest or is in the news this month.
"""
deliver = [
    "An attack tree with AND and OR gates, costs and chances, and an analysis of the cheapest path and the success chance.",
    "Eight defences with prices and their effects on the leaves.",
    "A planner that cuts the cheapest path and recomputes.",
    "Eight abuse cases as executable checks against a model of the bank's configuration.",
]

[docs.prerequisites]
required = [
    "Java basics",
    "The threat-modeling project, or an idea of what a threat is",
]
not_required = [
    "Probability theory beyond multiplying and adding chances",
    "A threat modeling tool",
]
install = []

[docs.session]
objectives = [
    "read an attack tree and find its cheapest path",
    "explain how costs and chances combine at AND and OR gates",
    "say why one defence rarely fixes a tree, and why you recompute after each",
    "write an abuse case that fails now and passes when the defence exists",
]
walkthrough = """
Run act two and ask which branch the team has probably been defending. In act three, ask why the passkey did not move the cheapest path. In act four, ask which defence would be next, and what it costs. In act five, ask what a test for the unchecked step would look like.
"""
exercises = [
    "Add a branch for the support desk resetting a password for a caller, and decide its cost and chance.",
    "Share a leaf between two branches (the leaked password) and see how the success chance changes.",
    "Replace the greedy plan with a search over subsets under a budget of 30,000 EUR.",
    "Write a real abuse case against the transfer endpoint of the broken-access-control project.",
]

[docs.explained]
sentence = """
An attack tree prices every way to a goal so that you can cut the cheapest path first, recompute, and repeat; abuse cases turn each step into a test that fails until the defence exists.
"""
verdict = """
Draw a tree for each goal that matters, estimate the numbers with the people who know the system, rank the defences by what they do to the cheapest path, plan in rounds, and write an abuse case for every step you can test. Revisit the tree when the system or the attackers change.
"""
recognise = [
    "Tree diagrams in threat modeling reports, with AND and OR nodes.",
    "\"As an attacker I want to...\" user stories.",
    "Security test names such as `shouldNotAllowTransferFromAnotherUsersAccount`.",
    "A security backlog sorted by attacker cost rather than severity labels.",
]

[spec]
purpose = """
Teach attack trees and abuse cases by building a tree for an online bank, computing the cheapest attack path, ranking and sequencing defences by what they do to it, and running abuse cases that fail until the defences exist.
"""
nongoals = [
    "A graphical tool or file format for attack trees.",
    "Formal probabilistic analysis with shared leaves.",
    "The pytm and Threat Dragon versions: the attack-trees-and-abuse-cases-with-threat-dragon project.",
]
problem = """
Security spending follows fashion and fear, and nobody has priced the attacker's alternatives.
"""
roles = [["The tree", "`Node`, `Analysis`, `BankTree`"], ["Defences and planning", "`Defence`, `Planner`"], ["Abuse cases", "`AbuseCase`, `BankConfig`"], ["Entry point", "`AttackTreeDemo`"]]
requirements = [
    "Costs add along AND and the cheapest child wins at OR; chances multiply along AND and combine at OR; a step with no chance blocks its branch.",
    "The baseline tree has a cheapest path of 50 EUR and a success chance of 97%.",
    "No single defence fixes the tree; the ownership check is the only one that moves the cheapest path.",
    "The greedy plan is OWN, CSRF, PASSKEY, CSP and reaches a cheapest path of 6,000 EUR for 55,000 EUR.",
    "Every abuse case fails on the weak bank and passes with all defences; 13 of 14 steps have one.",
    "The demo prints the same output on every run.",
]

