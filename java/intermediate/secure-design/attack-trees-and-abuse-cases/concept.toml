narration = "That's attack Trees. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] An attack tree prices every way to a goal so that you can cut the cheapest path first, recompute, and repeat; abuse cases turn each step into a test that fails until the defence exists. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a branch for the support desk resetting a password for a caller, and decide its cost and chance. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"
