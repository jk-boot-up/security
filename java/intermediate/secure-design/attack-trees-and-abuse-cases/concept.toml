# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "attack-trees-and-abuse-cases"
level = "intermediate"
module = "secure-design"
title = "Attack Trees and Abuse Cases"
short_title = "Attack Trees"
package = "attacktree"
main_class = "AttackTreeDemo"
tagline = "Draw how the attacker wins, price each step, then cut the cheapest path and look again"
bold = "An attack tree lays out every way an attacker can reach one goal, with a cost and a chance on each step; it shows which defence cuts the cheapest path, why one defence is never enough, and, with abuse cases written as failing tests, turns each step into something the build can check."
domain = "an online bank"
domain_note = ""
youtube_description = "Attack trees and abuse cases in Java: cost and likelihood of each attacker step, which defence cuts the cheapest path, and abuse cases that fail until the defence exists."
thumb_lines = ["ATTACK TREES", "AND ABUSE CASES"]
thumb_code = "cheapest path: 50 EUR"
youtube_title = "Attack Trees and Abuse Cases: Which Defence Cuts the Cheapest Path? (Java)"
youtube_tags = ["attack trees", "abuse cases", "threat modeling", "security requirements", "defence in depth", "java", "application security"]

[readme]
intro = """
A threat model lists what can go wrong. An **attack tree** answers a sharper question: *by which ways can an attacker reach this one goal, and which is the cheapest?* The goal is the root ("move money out of Ana's account"). Below it are the ways in. An **OR** gate means any child is enough; an **AND** gate means every
child is needed. The leaves are single steps, each with a **cost to the attacker** and a **chance that it works** against the system as it is.

From those numbers the tree computes two things: the **cheapest path** (costs add along AND, the cheapest wins at OR) and the **chance that some path succeeds** (probabilities multiply along AND and combine at OR). In this bank's tree the cheapest path costs 50 EUR: change the account number in the transfer request.
That is a missing ownership check, and no password policy or one-time code would have mattered.

The project then does the thing that makes trees useful in practice:
- **Price the defences** (ownership check, CSRF tokens, breached-password check, app-based one-time codes, passkeys, a strict content security policy, fast patching, dual control) and see what each one does to the tree on its own: no single one fixes it.
- **Cut the cheapest path, then look again.** After the ownership check, the cheapest path moves to leaked-password reuse and CSRF at 100 EUR; after passkeys, to a script injection at 2,000 EUR; after a content security policy, to a software flaw at 6,000 EUR. Each round shows the next weakest door.
- **Write abuse cases as tests.** "As Mallory I transfer from Ana's account by changing the account number" is a check that *fails* on the weak bank and passes when the ownership check exists. Eight abuse cases cover thirteen of the tree's fourteen steps.

**Maps to:** OWASP Top 10 (2025) A06 Insecure Design · OWASP ASVS 5.0, V1 architecture and design requirements · Bruce Schneier, *Attack Trees* (1999) · NIST SSDF PW.1 (design software to meet security requirements) · OWASP Threat Modeling.
"""
analogy = """
A burglar's map of a house, drawn from their side: the front door (a strong lock), the back window (latched with a butter knife), the garage (open), the neighbour with a spare key. The cheapest way in is not the front door. Fixing the window moves the cheapest way to the garage; the map is only done when the cheapest way is expensive.
"""
scenario = """
The online bank, one goal and fourteen attacker steps, eight defences with prices, and eight abuse cases that run against a model of the bank's configuration. All numbers are teaching estimates, chosen so that the lesson is visible; a real tree uses the team's own estimates and argues about them.
"""
costs = [
    "**The numbers are guesses,** and a tree is only as good as the argument about them. Their value is that they make the argument explicit; check them against incidents and red-team results.",
    "**Independence is assumed.** The same weakness (a reused password) can feed several branches, which a tree with shared leaves would show; the probabilities here are a first approximation.",
    "**Trees grow fast.** Keep one tree per goal and prune branches that no attacker in your threat model would take.",
    "**Greedy plans are not optimal.** Choosing the defence that most raises the cheapest path is easy to explain; with budgets and overlaps a search can find a cheaper set.",
    "**Abuse cases test the design, not the attacker.** A passing abuse case shows that this abuse is refused, not that no abuse exists.",
]
too_much = """
For a small system a checklist and a conversation are enough; reach for a tree when the goal is valuable, the paths are many and you need to decide where to spend. Do not draw trees for goals nobody would attack.
"""
met_before = [
    "Attack trees in threat modeling books and in the automotive and safety-critical industries.",
    "Misuse cases and evil user stories in agile security practice.",
    "\"As an attacker I want to...\" stories in a backlog.",
    "OWASP SAMM threat assessment and the STRIDE method.",
]
where = """
This project is in [secure-design](..) and follows [threat-modeling](../threat-modeling) (what can go wrong) and [security-requirements-with-asvs](../security-requirements-with-asvs) (what the system must do about it). Its steps point at projects in this track: access control, CSRF, passkeys, XSS, dependency updates.
"""
twin = """
The tree is a small Java data structure; the analysis is exact arithmetic over it. The abuse cases run against a model of the bank's configuration (a set of switched-on defences), not against a running bank: each is a predicate that is false until the defence exists. That is enough to show the loop between the tree, the defence and the test.
"""
test_note = "Everything is fixed data, so the demo prints the same text on every run."

[[act]]
title = "The tree"
summary = "One goal, 14 attacker steps in four branches: log in as Ana, abuse the transfer call, bribe an employee, or break in through the software."
detail = """
The root is "move money out of Ana's account". Logging in as her can be done by phishing her password and one-time code, reusing a leaked password, a SIM swap, or stealing her session with an injected script. The transfer call can be abused by changing the account number or forging a request from another site.
An employee can be bribed. The software can be exploited through an unpatched library and a move to the database. Each leaf carries a cost and a chance.
"""
speech = """
First demo: the tree. [[slnc 400]] The goal at the top: move money out of Ana's account. [[slnc 300]] Four ways in. [[slnc 300]] Log in as her. Abuse the transfer call. Bribe an employee. Break in through the software. [[slnc 600]]
Each step has a cost to the attacker, and a chance that it works.
"""
rows = { tree = "active ok" }
console = [
    ["OR: Move money out of Ana's account", "muted"],
    ["- [B1] change the account number in the request to Ana's  (50 EUR, 90%)", "bad"],
    ["- [A2a] buy a list of leaked passwords (100 EUR, 80%) AND [A2b] she reuses one (0 EUR, 15%)", "amber"],
    ["- [C] bribe an employee who can approve transfers  (20,000 EUR, 20%)", "muted"],
]

[[act]]
title = "What the tree says about the attacker"
summary = "The cheapest way in costs 50 EUR (change the account number), and the chance that some way works is 97%."
detail = """
Costs add along AND gates and the cheapest child wins at OR gates, so the cheapest path to the goal is the single step B1 at 50 euros. The chance that at least one path succeeds is 97%. Branch by branch: logging in as Ana costs 100 euros and works 35% of the time, abusing the transfer call costs 50 and works 95%,
the insider costs 20,000 and works 20%, and the software break-in costs 6,000 and works 9%.
"""
speech = """
Second demo: what the tree says about the attacker. [[slnc 400]] The cheapest way in costs fifty euros: change the account number in the request. [[slnc 600]]
The chance that some way works is ninety seven percent. [[slnc 300]] The expensive ideas, the bribe and the software break in, are not where the risk is.
"""
rows = { analysis = "active wrong" }
console = [
    ["cheapest way in: 50 EUR via [B1]", "bad"],
    ["chance that some way works: 97%", "bad"],
    ["Log in as Ana: 100 EUR, 35%; Abuse the transfer call: 50 EUR, 95%; insider: 20,000 EUR, 20%; software: 6,000 EUR, 9%", "amber"],
]

[[act]]
title = "Each defence on its own"
summary = "The ownership check raises the cheapest path from 50 to 100 EUR for 2,000 EUR; no other defence alone moves it, and the passkey, the most expensive, leaves it at 50."
detail = """
Applying each of eight defences to the baseline tree, one at a time: only the ownership check changes the cheapest path, because only it closes B1. Passkeys at 40,000 euros close three login branches and leave the cheapest way in untouched. A decision based on "which defence is the strongest" would have bought the wrong one first.
"""
speech = """
Third demo: each defence on its own. [[slnc 400]] Only the ownership check changes the cheapest way in, from fifty to a hundred euros. [[slnc 600]]
Passkeys cost forty thousand euros, and close three ways to log in, and the cheapest way in stays at fifty. [[slnc 300]] The strongest defence is not the first one to buy.
"""
rows = { defences = "active amber" }
console = [
    ["OWN      check that the account belongs to the signed-in user  2,000 EUR  -> cheapest 100 EUR, 75%", "ok"],
    ["CSRF     form tokens and SameSite cookies  3,000 EUR  -> cheapest 50 EUR, 95%", "amber"],
    ["PASSKEY  passkeys for sign-in and payments  40,000 EUR  -> cheapest 50 EUR, 96%", "amber"],
]

[[act]]
title = "A plan: always cut the cheapest path, then look again"
summary = "Ownership check (2,000 EUR) → 100 EUR; CSRF tokens (5,000 EUR in all) → still 100 EUR via the leaked-password path; passkeys (45,000 EUR) → 2,000 EUR via a script injection; a strict CSP (55,000 EUR) → 6,000 EUR via the software."
detail = """
Greedy planning: choose the defence that raises the cheapest path most (ties by lower chance of success, then price), apply it, recompute. The ownership check moves the cheapest path to 100 euros, tied between the leaked-password and CSRF paths. Closing CSRF leaves it at 100 (leaked passwords) but cuts the chance
to 52%. Passkeys then close the leaked password and phishing paths and the cheapest becomes a script injection at 2,000. A strict content security policy triples that to 6,000, where the software break-in becomes the cheapest path, above the target. The abuse cases still failing fall from 8 to 2 along the way (the insider and the unpatched library).
"""
speech = """
Fourth demo: a plan, always cut the cheapest path, then look again. [[slnc 400]] The ownership check. The cheapest way moves to a hundred euros, in two places. [[slnc 600]]
Close the forged request. Then passkeys. The cheapest way becomes a script injection at two thousand. [[slnc 300]] A strict content security policy, and the cheapest way is now six thousand euros, through the software. [[slnc 600]]
Fifty five thousand euros in all, and the abuse cases failing fall from eight to two.
"""
rows = { plan = "active ok" }
console = [
    ["0 (none)   0 EUR    50 EUR [B1]            97%  abuse cases failing: 8 of 8", "bad"],
    ["1 OWN      2,000 EUR   100 EUR [A2a, A2b]   75%  abuse cases failing: 7 of 8", "amber"],
    ["2 CSRF     5,000 EUR   100 EUR [A2a, A2b]   52%  abuse cases failing: 6 of 8", "amber"],
    ["3 PASSKEY  45,000 EUR  2,000 EUR [A4a, A4b] 31%  abuse cases failing: 3 of 8", "ok"],
    ["4 CSP      55,000 EUR  6,000 EUR [A4a, A4b] 28%  abuse cases failing: 2 of 8", "ok"],
]

[[act]]
title = "Abuse cases as tests"
summary = "All 8 abuse cases fail on the bank as it is; after the plan 2 still fail (the insider and the unpatched library); 13 of the tree's 14 steps have an executable abuse case."
detail = """
Each abuse case is written as a story ("as Mallory I transfer from Ana's account by changing the account number") and as a check that passes only when the abuse is refused. On the weak bank all eight fail, which is the point: the tests describe the defences that do not exist yet. After the planned defences, six turn green and two stay red:
the insider approving their own transfer and the library flaw that was fixed last month. Those are the next items for the backlog, with their cost from the tree. Thirteen of the tree's fourteen steps have a test; the fourteenth (moving from the web server to the database) is a judgement that no test checks.
"""
speech = """
Fifth demo: abuse cases as tests. [[slnc 400]] Each abuse case is a story, and a check that passes only when the abuse is refused. [[slnc 300]] On the bank as it is, all eight fail. [[slnc 600]]
After the plan, six are green. [[slnc 300]] Two are still red: the insider, and the library flaw. [[slnc 300]] Those are the next items on the backlog, with a price from the tree.
"""
rows = { abuse = "active ok" }
console = [
    ["AC5 FAILS   As Mallory I transfer from Ana's account by changing the account number", "bad"],
    ["after the plan: AC7 FAILS (insider), AC8 FAILS (unpatched library)", "amber"],
    ["13 of 14 steps of the tree have an executable abuse case", "ok"],
]

