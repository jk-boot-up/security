narration = "That's attack trees and abuse cases. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Draw how the attacker wins, price each step, cut the cheapest path, and look again, with an abuse case that checks every step in the build. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a branch for the support desk resetting a password for a caller, and decide its cost and its chance. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] The tree is plain Java data, and the analysis is exact arithmetic over it. [[slnc 300]] Here are the classes that matter."""

[[class]]
name = "Node and BankTree"
what = "the tree: leaves with a cost and a chance, AND and OR gates"
[[class.part]]
title = "a leaf, and a gate"
code = """
record Leaf(String id, String name, double cost, double probability, String abuseCase) implements Node {
...
enum Kind { AND, OR }
...
leaf("B1", "change the account number to Ana's", 50, 0.9, "AC5"),
"""
speech = """A leaf has an id, a cost in euros, a chance, and the abuse case that tests it. [[slnc 300]] A gate is AND or OR over its children. [[slnc 300]] BankTree builds the bank's tree from them."""

[[class]]
name = "Analysis"
what = "the cheapest path and the chance some path works"
[[class.part]]
title = "OR and AND, recursively"
code = """
none *= 1.0 - a.probability();
if (a.minCost() < best.minCost()) {
    best = a;
...
cost += a.minCost();
p *= a.probability();
"""
speech = """At an OR gate, the cheapest child wins, and the chance that none works is multiplied up. [[slnc 300]] At an AND gate, the costs add and the chances multiply. [[slnc 300]] It runs from the leaves up to the root."""

[[class]]
name = "GateSteps"
what = "a teaching class: writes one gate's arithmetic out"
[[class.part]]
title = "the steps, as the demo prints them"
code = """
cost = Math.min(cost, a.minCost());
p *= 1.0 - a.probability();
chances.add("(1-" + AttackTreeDemo.decimal(a.probability()) + ")");
"""
speech = """GateSteps redoes one gate by hand, and writes each step out with the real numbers. [[slnc 300]] A test checks that every gate of the tree gives exactly what Analysis gives."""

[[class]]
name = "Defence and Planner"
what = "priced defences, and the plan that cuts the cheapest path"
[[class.part]]
title = "pick the best, apply it, look again"
code = """
while (Analysis.of(current).minCost() < target && !left.isEmpty()) {
...
current = best.defence().applyTo(current);
"""
speech = """A defence multiplies the cost or the chance of the steps it names, or removes them. [[slnc 300]] The planner picks the defence that raises the cheapest path most, applies it, and looks again, until the target is met."""

[[class]]
name = "AbuseCase and BankConfig"
what = "abuse cases as checks against the bank's settings"
[[class.part]]
title = "passes only when refused"
code = """
new AbuseCase("AC5", "As Mallory I change the account number to Ana's", c -> c.has("ownership")),
...
public boolean passes(BankConfig c) {
    return refused.test(c);
"""
speech = """Each abuse case is a story and a check. [[slnc 300]] It passes only when the bank refuses the abuse: here, when the ownership check is on. [[slnc 300]] So a missing defence is a failing test."""

