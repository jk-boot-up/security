[[scene]]
key = "01-poster"
kind = "poster"
title = "Attack Trees and Abuse Cases"
narration = "Hello, and welcome. [[slnc 400]] This video explains attack trees and abuse cases, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] An attack tree puts the attacker's goal at the top, and every way to reach it below, step by step, each with a cost and a chance that it works. [[slnc 300]] It shows the cheapest way in, and which defence cuts it. [[slnc 300]] Abuse cases turn each step into a check that fails until the defence exists. [[slnc 600]] Think of a burglar planning a break-in: they try the cheapest door first, so that is the door to lock first. [[slnc 600]] Our example is an online bank."

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online bank, and one goal:", "  move money out of Ana's account", "", "Fourteen attacker steps, each with", "a cost and a chance; eight defences", "with prices; eight abuse cases.", "", "All numbers are teaching estimates."]
narration = "Here is the scenario. [[slnc 400]] An online bank, and one attacker goal: move money out of Ana's account. [[slnc 500]] The tree has fourteen attacker steps, each with a cost to the attacker and a chance that it works. [[slnc 300]] There are eight defences, each with a price, and eight abuse cases that run against a model of the bank's settings. [[slnc 500]] All the numbers are teaching estimates. [[slnc 300]] A real tree uses the team's own, and argues about them."

[[scene]]
key = "02-words"
kind = "bullets"
title = "The Words"
body = ["Goal: the root, what the attacker wants", "Step: a leaf, with a cost and a chance", "OR gate: any one child is enough", "AND gate: every child is needed", "Defence: changes or removes some steps", "Abuse case: a test that passes when refused"]
narration = """Before the demos, the words. [[slnc 500]] The goal is the root of the tree: what the attacker wants. [[slnc 500]] A step is a leaf: one thing the attacker does, with what it costs them and the chance it works. [[slnc 500]] An OR gate needs any one of its children. [[slnc 500]] An AND gate needs every one of them. [[slnc 500]] A defence makes some steps dearer or less likely, or removes them. [[slnc 500]] And an abuse case is a story from the attacker's side, written as a test that passes only when the bank refuses the abuse."""

[[scene]]
key = "02-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "02-two-gates"
kind = "figure"
title = "Two rules, worked out on one branch"
body = "two_gates"
narration = """Let's see the core idea on one real example. [[slnc 400]] On the left, an AND gate: phish Ana's password and one-time code. [[slnc 300]] Both steps are needed. [[slnc 300]] A page that relays the code costs three hundred euros and works ninety percent of the time. [[slnc 300]] Ana typing into it costs fifty, and happens twenty percent of the time. [[slnc 300]] So the costs add, to three hundred and fifty euros, and the chances multiply, to eighteen percent. [[slnc 600]]
On the right, an OR gate: log in as Ana, with four AND gates under it. [[slnc 300]] Any one is enough, so the cheapest wins: a hundred euros, the leaked password. [[slnc 300]] And the chance that some way works is one minus the chance that none does: thirty five percent."""

[[scene]]
key = "03-acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "04-costs"
kind = "bullets"
title = "What It Costs"
body = ["The numbers are estimates", "Steps are treated as independent", "A tree covers one goal at a time", "A greedy plan is not always the cheapest", "Abuse cases are tests to maintain"]
narration = "Nothing is free. [[slnc 400]] Here is what it costs. [[slnc 500]] The costs and chances are estimates, and the answer is only as good as they are. [[slnc 500]] The maths treats steps as independent, which real attacks often are not. [[slnc 500]] One tree covers one goal, so a system needs several. [[slnc 500]] Choosing the best defence one step at a time is easy to explain, but not always the cheapest set. [[slnc 300]] And abuse cases are tests, which must be kept up like any others."

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Tree diagrams in threat modeling workshops", "\"As an attacker, I want to...\" stories", "A security test that should fail today", "A budget argument about which defence first"]
narration = "You have probably met this already. [[slnc 400]] Tree diagrams on a whiteboard, in a threat modeling workshop, are attack trees. [[slnc 500]] Stories that begin, as an attacker, I want to, are abuse cases. [[slnc 500]] A security test that is expected to fail today, until the fix lands, is an abuse case as code. [[slnc 500]] And a budget argument about which defence to buy first is what the tree's numbers are for."

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "How To Use It"
body = ["One tree for each goal that matters", "Cost and chance on every step", "Cut the cheapest path first, then look again", "No single defence is enough", "Every step: an abuse case that runs in the build"]
narration = "So, how do you use it? [[slnc 400]] Draw one tree for each goal that matters. [[slnc 300]] Put a cost and a chance on every step, and argue about them as a team. [[slnc 500]] Cut the cheapest path first, then look again, because the next weakest door is now the cheapest. [[slnc 500]] Expect no single defence to be enough. [[slnc 300]] And give every step an abuse case that runs in the build."

