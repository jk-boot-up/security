narration = "That's abuse Cases in Threat Dragon. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] A threat model file is a diagram with threats pinned to it; the file is only worth what is true of the system. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Open the model in the editor and move a flow; see what changes in the file. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"
