title = "Attack Trees and Abuse Cases in Threat Dragon"
short_title = "Abuse Cases in Threat Dragon"
package = "dragonmodel"
main_class = "ThreatDragonDemo"
tagline = "Put the bank's abuse cases in a model file that OWASP Threat Dragon opens, check it with the editor's own validator, and let the plan turn threats from Open to Mitigated"
bold = "A Java program writes the bank's eight abuse cases from the attack tree as an OWASP Threat Dragon 2.6 model (13 cells, 8 threats with a STRIDE type, a severity from the tree's cost and chance, and a status); the editor's own schema and Ajv, taken from the real image, validate it and refuse four ways of breaking it; the plan of the plain project takes the open threats from 8 to 2 in the file, in step with the failing abuse cases; checks the schema cannot make find a mitigated threat with no defence, a stale flag, a lost flow end and a wrong threat count; but the model is flat threats, the tree's AND and OR have no place in it, and nothing in it is a test."
domain = "a bank"
domain_note = ""
youtube_description = "The online bank's attack tree turned into an OWASP Threat Dragon 2.6 threat model by a Java program: one diagram with two trust boundaries, actors, processes, a store and flows, and one STRIDE threat for each of the eight abuse cases with a severity and a score from the tree; the real threat-dragon image's own schema and Ajv validating the file and refusing four broken variants; the plan of four defences taking the open threats from 8 to 2 in the file, in step with the abuse case tests; checks the schema does not make; and the editor's server running from the image on a loopback port."
thumb_lines = ["ABUSE CASES IN", "THREAT DRAGON"]
