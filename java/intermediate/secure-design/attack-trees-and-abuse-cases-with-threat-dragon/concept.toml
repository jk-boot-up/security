[[scene]]
key = "01-poster"
kind = "poster"
title = "Attack Trees and Abuse Cases in Threat Dragon"
narration = """Hello, and welcome. [[slnc 400]] This video puts attack trees and abuse cases into OWASP Threat Dragon, in Java. [[slnc 300]] OWASP is the Open Worldwide Application Security Project. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] Threat Dragon is OWASP's threat modeling tool: a diagram of a system, with each threat pinned on the part it hits, and a status, open or mitigated. [[slnc 600]] Think of a floor plan of the bank's building, with a sticky note on every weak door, and a tick on the ones that have been fixed. [[slnc 700]] In this video, the domain is an online bank."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["The online bank, and Ana's account.", "", "The plain project has an attack tree,", "eight abuse cases and a plan of defences.", "", "Can a reviewer see them on a diagram,", "and trust what it says?"]
narration = """Here is the scenario. [[slnc 400]] The online bank, and the attacker's goal of moving money out of Ana's account. [[slnc 500]] The plain project already has an attack tree, eight abuse cases as tests, and a plan of defences. [[slnc 500]] Reviewers want to see the threats on a diagram of the bank, where they hit. [[slnc 300]] And they want to trust what the diagram says."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["Model file: the diagram and its threats, as JSON", "Cell: a box, a flow or a trust boundary", "Threat: type, severity, status, mitigation", "Schema: the shape a valid file must have", "Abuse case: an attack, written as a test"]
narration = """Before the demos, the words. [[slnc 500]] A model file is the diagram and its threats, saved as J S O N. [[slnc 500]] A cell is one thing on the diagram: a box, a flow, or a trust boundary. [[slnc 500]] A threat has a type, a severity, a status, and a mitigation. [[slnc 500]] A schema is the shape a valid file must have. [[slnc 500]] And an abuse case is an attack, written as a test that fails until a defence stops it."""

[[scene]]
key = "03-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "03-one-case"
kind = "figure"
title = "One abuse case becomes one threat"
body = "one_case"
narration = """Let's see the core idea on one example: abuse case A C one, a phisher who relays Ana's password and one time code. [[slnc 400]] At the top left, the input: the two steps of the attack tree, joined by an and gate, so the attacker needs both. [[slnc 300]] Building the phishing page costs three hundred euros and works ninety percent of the time. [[slnc 300]] Ana falling for it costs fifty euros, and happens twenty percent of the time. [[slnc 700]]
Below, how the score is worked out. [[slnc 300]] The costs add up: three hundred and fifty euros. [[slnc 300]] The chances multiply: ninety times twenty percent is eighteen percent. [[slnc 300]] Three hundred and fifty is at most five hundred, so the severity is high. [[slnc 700]]
On the right, the result: a threat in the file, on the sign in flow, of type spoofing, severity high, status open, with the score as text. [[slnc 300]] And after the plan, it turns mitigated, naming the defence in place: passkeys."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "09-costs"
kind = "bullets"
title = "What It Costs"
body = ["A flat list of threats loses the tree", "A status is a claim in a file", "Files edited by hand and by program drift", "Layout is data too", "A shared editor needs a login provider"]
narration = """Nothing is free. [[slnc 400]] Here is what it costs. [[slnc 500]] Threat Dragon keeps a flat list of threats, so the tree's gates and arithmetic must live elsewhere. [[slnc 500]] A status of mitigated is a claim in a file, not a test. [[slnc 500]] A file edited both by hand and by a program can drift, so it needs checks of its own. [[slnc 500]] The diagram's layout is data too, and changes with every move. [[slnc 300]] And a shared editor needs a login provider."""

[[scene]]
key = "10-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["A threat with a status, severity and mitigation", "A STRIDE type on each threat", "A threat model saved as JSON in a repository", "A \"Local Session\" button on a login page"]
narration = """You have probably met this already. [[slnc 400]] A threat with a status, a severity, and a mitigation. [[slnc 500]] A stride type on each threat, like spoofing or tampering. [[slnc 500]] A threat model saved as J S O N, in a repository, and reviewed like code. [[slnc 500]] And a local session button on a login page: Threat Dragon's editor running without a login provider."""

[[scene]]
key = "11-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Generate the model from what you can calculate", "Validate every file with the editor's own schema", "Add the checks a schema cannot make", "Mitigated must name its defence", "Keep the abuse cases as the real tests"]
narration = """So, how do you use it? [[slnc 400]] Generate the model from what you can calculate, like the tree, instead of drawing it twice. [[slnc 500]] Validate every file with the editor's own schema. [[slnc 300]] Add the checks a schema cannot make. [[slnc 500]] Let a threat be mitigated only when it names its defence. [[slnc 300]] And keep the abuse cases as the real tests, because nothing in the file is one."""

[[scene]]
key = "12-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "13-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a second diagram for the", "approval console and write its threats."]
narration = """That's attack trees and abuse cases in Threat Dragon. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] A threat model file is worth keeping when a program writes it from what can be calculated, a validator and your own rules check it, and every mitigated threat names the defence and the test behind it. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine, with Docker. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a second diagram for the approval console, and write its threats. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] The tree, the plan and the abuse cases come from the plain project. [[slnc 300]] Here are the classes that turn them into a Threat Dragon file and check it."""

[[class]]
name = "Cases"
what = "places each abuse case and scores it from the tree"
[[class.part]]
title = "costs add up, chances multiply"
code = """
double cost = leaves.stream().mapToDouble(Node.Leaf::cost).sum();
double chance = leaves.stream().mapToDouble(Node.Leaf::probability)
        .reduce(1.0, (a, b) -> a * b);
"""
speech = """The leaves of one abuse case are all needed, so their costs add up and their chances multiply. [[slnc 300]] For A C one, that is three hundred and fifty euros, and eighteen percent."""
[[class.part]]
title = "the severity rule"
code = """
if (cost <= 500 || chance >= 0.5) {
    return "High";
}
return cost <= 5000 ? "Medium" : "Low";
"""
speech = """Cheap or likely is high. [[slnc 300]] Up to five thousand euros is medium, and anything dearer is low."""

[[class]]
name = "ModelBuilder"
what = "writes the Threat Dragon file"
[[class.part]]
title = "stable ids, so the file diffs cleanly"
code = """
byte[] name = ("dragon-bank-" + key).getBytes(StandardCharsets.UTF_8);
return UUID.nameUUIDFromBytes(name).toString();
"""
speech = """Every cell and threat gets an id made from its name, not a random one. [[slnc 300]] The same bank always gives the same file, so a reviewer's diff shows only what changed."""
[[class.part]]
title = "a threat's status comes from the defences in place"
code = """
boolean mitigated = !inPlace.isEmpty();
...
t.put("status", mitigated ? "Mitigated" : "Open");
t.put("severity", entry.severity());
t.put("type", entry.stride());
...
t.put("mitigation", mitigated ? "In place: " + String.join(", ", inPlace) : "");
"""
speech = """A threat is mitigated only when a defence that answers it is switched on, and then its mitigation names that defence. [[slnc 300]] The same switches drive the abuse case tests, so the file and the tests agree."""

[[class]]
name = "Dragon"
what = "the real Threat Dragon image: validator and server"
[[class.part]]
title = "the editor's own schema, in the image"
code = """
List<String> command = new ArrayList<>(List.of("docker", "run", "--rm",
        "-v", work + ":/m:ro", "--entrypoint", "node",
        IMAGE, "/m/validate-model.js"));
"""
speech = """The files are mounted read only into the image. [[slnc 300]] A small script finds the schema in the editor's own code and checks every file with the checker the image ships."""

[[class]]
name = "ModelChecks"
what = "the rules a schema cannot make"
[[class.part]]
title = "a mitigated threat names its defence"
code = """
boolean mitigated = t.get("status").asString().equals("Mitigated");
if (mitigated && t.get("mitigation").asString().isBlank()) {
    problems.add(new Problem("mitigated-names-its-defence", where));
}
"""
speech = """Each rule is a plain if over the file. [[slnc 300]] The schema accepts an empty mitigation; this rule does not."""

