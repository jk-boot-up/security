[readme]
intro = """
The plain [attack-trees-and-abuse-cases](../attack-trees-and-abuse-cases) project prices the attacker's steps in a tree, plans defences, and keeps abuse cases as failing tests. This one puts the same bank in **OWASP Threat Dragon 2.6**, the project's own threat-modeling tool, as a model file: a diagram with trust boundaries, actors, processes, a store and flows, and the eight abuse cases as threats. It uses the real `owasp/threat-dragon` image for two things, its **own validator** (the model schema in the editor's bundle and the Ajv the image ships) and its **server**. It needs Docker; the tests are tagged `integration` (the model tests are not): `./gradlew integrationTest`.

What it shows:
- **The tree as a model.** 13 cells (2 trust boundaries, 2 actors, 3 processes, 1 store, 5 flows) and 8 threats, one for each abuse case, placed on the element or flow it hits (sign-in, the text-message code, the web app, the transfer API, the transfer request, the approval console), typed in STRIDE terms, with a severity and a score from the tree's cost and chance (AC5 changing the account number: High, 50 EUR, 90%).
- **Checked by Threat Dragon's validator.** The bank's file is valid; four breakages (no title, a diagram type that is too short, a cell with no id, a shape that is too small) are each refused with the editor's own message, so a generated file is checked before anyone opens it.
- **The plan, in the file.** OWN, CSRF, PASSKEY, CSP: the open threats go 8, 7, 6, 3, 2, in step with the abuse cases failing. The two left are the insider and the library flaw, as in the plain project. Every file is valid.
- **Checks the schema cannot make.** A mitigated threat that names no defence, a stale `hasOpenThreats` flag, a flow that ends at a missing cell and a wrong `threatTop` are each found by a rule of its own.
- **The editor.** The image's server starts with generated keys on a loopback port; it offers only a local session, and its model API answers 401 without signing in. The model is opened in the browser from a file.

**Maps to:** OWASP Top 10 (2025) A06 Insecure Design · NIST SSDF PW.1 · OWASP Threat Dragon model schema 2.x · STRIDE.
"""
analogy = """
A floor plan with sticky notes. The tree is the burglar's route written on a long sheet of paper; the model file pins each note to the door, window or corridor it concerns, so that the people who walk the building see the risks where they are.
"""
scenario = """
The online bank and Ana's account. The demo takes the abuse cases of the attack tree, builds the diagram and the threats, validates the file, and applies the plan of defences to it.
"""
costs = [
    "**A flat model loses the tree:** the AND and OR gates and the arithmetic stay elsewhere.",
    "**Status is a claim in a file:** only a test says it is true.",
    "**A file edited by hand and by program can drift:** it needs checks of its own.",
    "**Layout is data too:** positions and sizes must be sensible for the picture to be useful.",
    "**The editor needs a login provider** for anything beyond a local session.",
]
too_much = """
A one-page design with three threats can live as a list in the pull request. Use a model file when the diagram is the point: boundaries, flows and the threats that sit on them, reviewed by several people.
"""
met_before = [
    "A threat model JSON file in a repository.",
    "A diagram with red numbers on the flows.",
    "A status column with Open, Mitigated and N/A.",
    "A \"Report\" button in a threat modeling tool.",
]
where = """
This is the tools version of [attack-trees-and-abuse-cases](../attack-trees-and-abuse-cases), in the [secure-design](..) module, after [threat-modeling-with-pytm](../threat-modeling-with-pytm), which asked the same bank 113 questions.
"""
twin = """
The model file is written by the program with stable identifiers, so it diffs cleanly. The validator is the real one from the real image, run in a container; the server is the real server, started with generated keys. Ports, container names and keys are never printed; the demo takes about half a minute.
"""
test_note = "The model, its rules and the tree are tested with no Docker. The validator and the server tests run the owasp/threat-dragon image (./gradlew integrationTest)."

[[act]]
title = "The tree, as a Threat Dragon model"
summary = "Thirteen cells and eight threats, one for each abuse case, with a STRIDE type and a severity from the tree's cost and chance."
detail = """
The attack tree of the plain project: the cheapest way in costs 50 EUR via B1, some way works with a chance of 97%, and there are 8 abuse cases. The model file for Threat Dragon 2.6.2 has one diagram of 13 cells: 2 trust boundaries, 2 actors, 3 processes, 1 store and 5 flows, and 8 threats, all Open. Each abuse case is a threat on the element or flow it hits, with a STRIDE type, a severity (High if it is cheap or likely, Medium up to 5,000 EUR, Low beyond) and a score such as cost 50 EUR, chance 90%. The tree's AND and OR stay in the plain project, because a model of flat threats has no place for them.
"""
speech = """
First demo: the tree, as a Threat Dragon model. [[slnc 400]] Thirteen cells and eight threats. [[slnc 600]]
Each abuse case sits on the flow or the process it hits, with a stride type and a severity from the tree.
"""
rows = { tree = "active ok" }
console = [
    ["13 cells: 2 boundaries, 2 actors, 3 processes, 1 store, 5 flows", "ok"],
    ["8 threats, one per abuse case, all Open", "bad"],
    ["AC5 Elevation of privilege on the transfer API: High, 50 EUR, 90%", "bad"],
]

[[act]]
title = "Checked by Threat Dragon's own validator"
summary = "The image's schema and Ajv accept the bank's file and refuse four ways of breaking it, each with the editor's own message."
detail = """
The image carries the schema in its editor bundle and the Ajv that checks it; both are used as they are. The bank's model is valid. With no summary title it is refused: .summary should have required property 'title'. With a diagram type that is too short: should NOT be shorter than 3 characters. With a cell that has no id: should have required property 'id'. With a size of 5: should be >= 10. The editor refuses a file that fails these checks when it is opened, so a file generated by a program is checked the same way before anyone opens it.
"""
speech = """
Second demo: checked by Threat Dragon's own validator. [[slnc 400]] The image carries the schema and the validator that checks it. [[slnc 600]]
The bank's file is valid. Four ways of breaking it are each refused, with the editor's own message.
"""
rows = { validate = "active ok" }
console = [
    ["bank.json: valid", "ok"],
    ["no title: should have required property 'title'", "ok"],
    ["a cell without an id; a width of 5: refused", "ok"],
]

[[act]]
title = "The plan, step by step, in the file"
summary = "OWN, CSRF, PASSKEY and CSP take the open threats from 8 to 2, in step with the failing abuse cases, and every file stays valid."
detail = """
Step 0 has 8 open threats in the file and 8 abuse cases failing; after OWN, 7 and 7; after CSRF, 6 and 6; after PASSKEY, 3 and 3; after CSP, 2 and 2. Every file is valid for the editor. After the plan the threats AC1 to AC6 are Mitigated, each naming the defence in place; still open are AC7 and AC8, the insider and the library flaw, as in the plain project. The file and the tests agree because both come from the same configuration; the file is the picture of the tests, and it is what a reviewer opens.
"""
speech = """
Third demo: the plan, step by step, in the file. [[slnc 400]] Own, C S R F, passkey, and C S P. [[slnc 600]]
The open threats go eight, seven, six, three, two, in step with the failing abuse cases. [[slnc 300]] The insider and the library flaw stay open.
"""
rows = { plan = "active ok" }
console = [
    ["open threats in the file: 8, 7, 6, 3, 2", "ok"],
    ["abuse cases failing: 8, 7, 6, 3, 2", "ok"],
    ["still open: AC7 (insider), AC8 (library flaw)", "bad"],
]

[[act]]
title = "Checks the schema cannot make"
summary = "A mitigated threat with no defence, a stale flag, a lost flow end and a wrong count are each found by a rule of their own."
detail = """
Rules over the file: complete threats, known status and severity, a STRIDE type, a mitigated threat names its defence, the open flag of a cell matches its threats, flows end at cells that exist, threatTop is the highest number, and every abuse case has a threat. The model before the plan has 0 problems and so has the model after. A mitigated threat with an empty mitigation breaks mitigated-names-its-defence; a cell whose hasOpenThreats is false while it has an open threat breaks open-flag-matches-threats; a flow whose target is not a cell breaks flow-ends-exist; threatTop of 3 against a highest number of 8 breaks threat-top-is-highest-number.
"""
speech = """
Fourth demo: checks the schema cannot make. [[slnc 400]] A mitigated threat must name its defence. [[slnc 600]]
A cell's open flag must match its threats. A flow must end at a cell that exists. [[slnc 300]] A file that a program writes can be wrong in ways a schema does not know.
"""
rows = { rules = "active ok" }
console = [
    ["before and after the plan: 0 problems", "ok"],
    ["no mitigation: mitigated-names-its-defence", "bad"],
    ["stale flag; lost end; bad count: each found", "bad"],
]

[[act]]
title = "The editor, and the bill"
summary = "The image's server starts on a loopback port with a local session only; threats are flat, and nothing in the file is a test."
detail = """
The editor's server started from the image, with generated keys, on a loopback port: health 200, the page 200 titled OWASP Threat Dragon. The providers it offers are only a local session: bitbucket, github, gitlab and google are all disabled. Its model API without signing in answers 401; a model is opened in the browser from a file, in a local session, and saved back to a file or a repository. The threats are flat and typed by STRIDE: cost, chance and the AND and OR of the tree live in the description and the score text. Threat Dragon stores no tests: whether a Mitigated threat is true is what the abuse cases in the code say.
"""
speech = """
Fifth demo: the editor, and the bill. [[slnc 400]] The editor's server starts from the image, offering only a local session. [[slnc 600]]
The threats are flat, so the tree stays where it can be calculated. [[slnc 300]] And nothing in the file is a test.
"""
rows = { editor = "active wrong" }
