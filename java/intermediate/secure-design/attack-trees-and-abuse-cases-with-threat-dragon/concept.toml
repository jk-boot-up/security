[[act]]
title = "From the tree's numbers to a severity"
summary = "AC1 needs both of its steps (an AND): cost 300 + 50 = 350 EUR, chance 90% x 20% = 18%, so High, because cost <= 500 EUR. All 8: High 4 (AC1, AC2, AC5, AC6), Medium 3 (AC3, AC4, AC8), Low 1 (AC7)."
detail = """
The input is the tree's steps for AC1, joined by an AND, so both are needed: A1a, build a phishing page that relays the code, 300 EUR and 90%; A1b, she enters the password and the code, 50 EUR and 20%. Costs add up: 300 + 50 = 350 EUR. Chances multiply: 90% x 20% = 18%. The severity rule is High if the cost is at most 500 EUR or the chance at least 50%, Medium up to 5,000 EUR, and Low beyond; AC1 is High, because 350 EUR <= 500 EUR.
The result for all eight: AC1 350 EUR 18% High, AC2 100 EUR 12% High, AC3 1,600 EUR 5% Medium, AC4 2,000 EUR 5% Medium, AC5 50 EUR 90% High, AC6 100 EUR 48% High, AC7 20,000 EUR 20% Low, AC8 5,000 EUR 15% Medium. In the file AC1 reads "type": "Spoofing", "severity": "High", "status": "Open", "score": "cost 350 EUR, chance 18%".
"""
figure = "severity_map"
figure_title = "Eight cases by cost and chance"
figure_speech = """
Second demo: from the tree's numbers to a severity. [[slnc 400]] The input is each abuse case's cost to the attacker, and its chance of working. [[slnc 300]] Here, cost runs along the bottom, from ten euros to fifty thousand, and the chance goes up the side. [[slnc 700]]
On the right, the rule. [[slnc 300]] High if the attack costs five hundred euros or less, or works half the time or more: the rose area. [[slnc 300]] Medium if it costs up to five thousand euros: the amber area. [[slnc 300]] Low beyond that: the green area. [[slnc 700]]
The result. [[slnc 300]] A C five, changing the account number, costs fifty euros and works ninety percent of the time: high. [[slnc 300]] A C seven, bribing an insider, costs twenty thousand: low. [[slnc 300]] Four cases are high, three medium, and one low.
"""
speech = """
Here is the real output. [[slnc 400]] The input: the two steps of A C one, joined by an and, so the attacker needs both. [[slnc 300]] How the score is worked out: the costs add up, three hundred plus fifty is three hundred and fifty euros. [[slnc 300]] The chances multiply: ninety percent times twenty percent is eighteen percent. [[slnc 300]] So the severity is high, because the cost is at most five hundred euros.
[[page]]
The severity rule, in three lines. [[slnc 300]] Then the result for all eight cases: cost, chance, severity, and which part of the rule decided it.
[[page]]
And the result for A C one, as the file holds it. [[slnc 300]] The type, the severity, the status, and the score. [[slnc 300]] The score is only text: the arithmetic stays in the tree.
"""
