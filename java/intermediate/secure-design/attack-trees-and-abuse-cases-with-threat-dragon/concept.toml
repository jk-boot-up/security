bold = "A Java program writes the bank's eight abuse cases from the attack tree as an OWASP Threat Dragon 2.6 model (13 cells, 8 threats with a STRIDE type, a severity from the tree's cost and chance, and a status); the editor's own schema and Ajv, taken from the real image, validate it and refuse four ways of breaking it; the plan of the plain project takes the open threats from 8 to 2 in the file, in step with the failing abuse cases; checks the schema cannot make find a mitigated threat with no defence, a stale flag, a lost flow end and a wrong threat count; but the model is flat threats, the tree's AND and OR have no place in it, and nothing in it is a test."
domain = "a bank"
domain_note = ""
