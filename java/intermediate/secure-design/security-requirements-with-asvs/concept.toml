narration = """Here is the scenario. [[slnc 400]] An online store is asked to show that it is secure enough for the data it holds. [[slnc 600]] Which security requirements apply? [[slnc 300]] Which are met? [[slnc 300]] And will that still be true after the next release?"""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["ASVS: a verification standard", "Level: L1, L2 or L3", "Requirement: a checkable statement", "Verification: test, configuration, or a person", "Coverage: met, failed, manual, not applicable"]
narration = """Before the demos, the words. [[slnc 500]] The A S V S is a standard that lists what a secure application must do, in chapters. [[slnc 500]] A level says how much of it applies: one, two, or three. [[slnc 500]] A requirement is a statement that can be checked. [[slnc 500]] Verification says how: by a test, by a configuration check, or by a person. [[slnc 500]] And coverage says which requirements are met, failed, still manual, or not applicable."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "09-ladder"
kind = "bullets"
title = "From Standard to Gate"
body = ["Choose a level, with reasons", "Write requirements down, in your own words", "Automate every check that can be automated", "Report what is left for people", "Refuse a release that regresses"]
narration = """Let's put it in order. [[slnc 400]] Choose a level, and write down why. [[slnc 500]] Write the requirements down, in your own words, next to the code. [[slnc 500]] Automate every check that can be automated. [[slnc 500]] Keep the manual ones visible in the report. [[slnc 500]] And refuse a release that makes a met requirement fail."""

[[scene]]
key = "10-roles"
kind = "bullets"
title = "Who Does What"
body = ["LevelChooser: picks L1, L2 or L3", "RequirementsFile: the list as data", "SampleApp: the store being checked", "Checks: pass or fail questions", "Assessment: coverage and the gate"]
narration = """Here is who does what in the code. [[slnc 400]] The level chooser picks the level and keeps its reasons. [[slnc 500]] The requirements file holds the list as data. [[slnc 500]] The sample app is the store being checked. [[slnc 500]] The checks ask it pass or fail questions. [[slnc 300]] And the assessment counts the coverage, and finds what newly fails."""

[[scene]]
key = "11-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Requirements in a contract or tender", "Pen-test reports citing ASVS", "Met, failed, not applicable", "A build that fails a security check"]
narration = """You have probably met this already. [[slnc 400]] Security requirements in a contract or a tender. [[slnc 500]] Penetration test reports that cite the standard. [[slnc 500]] Compliance reports with met, failed, and not applicable. [[slnc 500]] And builds that fail because a security check failed."""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Start from the threat model", "Use the standard as the floor", "Keep requirements next to the code", "Gate releases on the checks", "Review the mapping when the standard changes"]
narration = """So, how do you use it? [[slnc 400]] Start from the threat model. [[slnc 500]] Use the standard as the floor, not the ceiling. [[slnc 500]] Keep the requirements next to the code, in your own words. [[slnc 500]] Gate every release on the checks. [[slnc 500]] And review the mapping when the standard is revised."""

[[scene]]
key = "13-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a requirement", "and write its check."]
narration = """That's security requirements with the verification standard. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] A requirement is only useful when it can be checked, and checked again on every release. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine, with nothing installed except a Java development kit. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a requirement from the authorization chapter, and write its check. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
The requirements practice itself: the chosen level, the requirements file in the repository, the checks, the coverage report and the release gate. It does not cover the store's own threats, which the checks are about.
"""
assets = [
    "The requirements file, which says what the store promises.",
    "The checks and the gate, which stand between a regression and a release.",
    "The coverage report, which partners and auditors rely on.",
]
actors = [
    "The team, who choose the level and write and review the requirements.",
    "A partner or auditor, who reads the report.",
    "An attacker, who finds what was never required.",
]
boundaries = [
    "The standard to the team's file: paraphrases can drift from what the standard means.",
    "The report to its readers: a green report can be read as more than it says.",
]
assumptions = [
    "The checks run in the build, and a failing check blocks a release.",
    "Manual requirements are reviewed by someone who knows the system.",
    "In the demo, the store, the requirements and the profiles are illustrative.",
]
out_of_scope = [
    "The store's threats: the threat-modeling project.",
    "Certification and formal audit.",
]
tests = [
    "`LevelAndRequirementsTest` checks the level model, unique ids, known checks, and the requirements file and its refusals.",
    "`ChecksAndAssessmentTest` checks every check on the store, the regression, the counts at each level and the chapter report.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next project, attack-trees-and-abuse-cases, takes one threat and breaks it into the attacker's steps, to find which defence cuts the cheapest path.
"""

[[threat]]
id = "T1"
stride = "I"
threat = "A threat that no requirement covers goes unchecked, because the standard was treated as the whole list"
where = "`Catalogue`"
control = "The threat model comes first, and its mitigations are added as requirements"
residual = "Threats nobody has thought of are still not covered"

[[threat]]
id = "T2"
stride = "T"
threat = "A requirement is weakened or deleted from the file so that a failing check no longer blocks the release"
where = "`RequirementsFile`, the release gate"
control = "The file lives in the repository and changes to it are reviewed like code"
residual = "A reviewer who approves without reading still lets it through"

[[threat]]
id = "T3"
stride = "S"
threat = "A check passes for the wrong reason, so a requirement looks met when it is not"
where = "`Checks`"
control = "Every check has a test that makes it fail, such as the fast-hash and debug builds"
residual = "A check can only be as good as the question it asks"

[[threat]]
id = "T4"
stride = "R"
threat = "Nobody can say why the level was chosen, so it is lowered under deadline pressure"
where = "`LevelChooser`"
control = "The level is chosen by a model that records its reasons"
residual = "The model is a simplification; the team still owns the decision"

[[threat]]
id = "T5"
stride = "I"
threat = "The mapping ages when the standard is revised, and requirements point at chapters that have moved"
where = "`Requirement.edition`"
control = "Every requirement records its edition, and old editions are flagged for review"
residual = "A paraphrase can still drift from what the standard means"
