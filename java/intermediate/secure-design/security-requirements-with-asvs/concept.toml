[[scene]]
key = "01-poster"
kind = "poster"
title = "Security Requirements with OWASP ASVS"
narration = """Hello, and welcome. [[slnc 400]] This video explains security requirements with the A S V S from O W A S P, in Java. [[slnc 300]] O W A S P is the Open Worldwide Application Security Project, and A S V S is its application security verification standard. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A security requirement is a statement about what an application must do, written so that it can be checked. [[slnc 600]] Think of a building inspector's checklist. [[slnc 300]] A careful builder picks the rules that apply, and checks most of them every evening, instead of waiting for the inspector at the end. [[slnc 700]] In this video, the domain is an online store, with an online bank for comparison."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online store must show it is", "secure enough for its data.", "", "Which requirements apply?", "Which are met?", "Is that still true next release?"]
narration = """Here is the scenario. [[slnc 400]] An online store is asked to show that it is secure enough for the data it holds. [[slnc 600]] Which security requirements apply? [[slnc 300]] Which are met? [[slnc 300]] And will that still be true after the next release?"""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["ASVS: a verification standard", "Level: L1, L2 or L3", "Requirement: a checkable statement", "Verification: test, configuration, or a person", "Coverage: met, failed, manual, not applicable"]
narration = """Before the demos, the words. [[slnc 500]] The A S V S is a standard that lists what a secure application must do, in chapters. [[slnc 500]] A level says how much of it applies: one, two, or three. [[slnc 500]] A requirement is a statement that can be checked. [[slnc 500]] Verification says how: by a test, by a configuration check, or by a person. [[slnc 500]] And coverage says which requirements are met, failed, still manual, or not applicable."""

[[scene]]
key = "03-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "03-one-requirement"
kind = "figure"
title = "One requirement, from a row to a verdict"
body = "one_requirement"
narration = """Let's see the core idea on one example: requirement S R three, about passwords. [[slnc 400]] At the top, the input: one row of the team's list. [[slnc 300]] Its id, its level, level one, how it is verified, by an automated test, and its chapter, authentication. [[slnc 700]]
In the middle, the check it names, and the question that check asks the running store: is a password a slow, salted hash? [[slnc 700]]
At the bottom, the result, twice. [[slnc 300]] Before: the store today keeps P B K D F two, at six hundred thousand rounds, with a random salt. [[slnc 300]] The check passes, so S R three is met. [[slnc 300]] After: a build that switched to plain S H A two five six. [[slnc 300]] The check fails, and the build is stopped before anyone ships it. [[slnc 300]] A sentence in a list became a test that runs on every build."""

