[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] The store runs in the same process, so every check is exact. [[slnc 300]] Here are the classes that matter."""

[[class]]
name = "LevelChooser"
what = "picks L1, L2 or L3 and keeps the reasons"
[[class.part]]
title = "each step up has a reason"
code = """
if (p.holdsAccounts() || p.data() != Profile.Sensitivity.LOW) {
    level = Level.L2;
    reasons.add("it holds customer accounts or personal data");
}
if (p.movesMoney() && p.regulated() && p.data() == Profile.Sensitivity.HIGH) {
    level = Level.L3;
"""
speech = """Every application starts at level one. [[slnc 300]] Each rule that raises the level adds its reason, because a level nobody can explain is a level nobody will defend in a review."""

[[class]]
name = "Requirement"
what = "one requirement, as the team writes it down"
[[class.part]]
title = "a manual requirement names no check"
code = """
record Requirement(String id, String chapter, Level level, Verification verification,
                   String check, String edition, String statement) {
...
if ((verification == Verification.MANUAL) != check.isEmpty()) {
"""
speech = """Seven fields, the same seven as in the file. [[slnc 300]] An automated or configuration requirement must name its check, and a manual one must not, so the list cannot claim a test that does not exist."""

[[class]]
name = "Checks"
what = "questions the running store answers with pass or fail"
[[class.part]]
title = "the password check reads the stored value"
code = """
String[] parts = app.storedPasswordFor(SAMPLE_PASSWORD).split("\\\\$");
return parts.length == 4 && parts[0].equals("pbkdf2-sha256")
        && Integer.parseInt(parts[1]) >= PBKDF2_MINIMUM_ROUNDS;
"""
speech = """The check asks the store to keep a sample password, then reads what it stored. [[slnc 300]] Four parts, the right scheme, and enough rounds, or it fails."""

[[class]]
name = "Assessment"
what = "coverage at one level, and the release gate"
[[class.part]]
title = "four outcomes per requirement"
code = """
if (!level.covers(r.level())) {
    status = Status.NOT_APPLICABLE;
} else if (r.verification() == Verification.MANUAL) {
    status = Status.MANUAL;
} else {
    status = Checks.named(r.check()).passes().test(app) ? Status.MET : Status.FAILED;
"""
speech = """A requirement above the chosen level does not apply. [[slnc 300]] A manual one stays visible as manual, never counted as met. [[slnc 300]] The rest are met or failed by their check."""
[[class.part]]
title = "the release gate"
code = """
List<String> before = earlier.failing();
return failing().stream().filter(id -> !before.contains(id)).toList();
"""
speech = """The gate compares two assessments. [[slnc 300]] A requirement that failed before is a known gap; one that newly fails is a regression, and the release is refused."""

[[acronym]]
short = "OWASP"
long = "Open Worldwide Application Security Project"
say = "OWASP is the Open Worldwide Application Security Project."
[[acronym]]
short = "ASVS"
long = "Application Security Verification Standard"
say = "A S V S is the application security verification standard: OWASP's list of what a secure application must do."
[[acronym]]
short = "L1-L3"
long = "the three verification Levels of ASVS"
say = "L one, L two and L three are the standard's three levels: each one includes the ones below it."
[[acronym]]
short = "SR-01 to SR-14"
long = "the team's own Security Requirement ids"
say = "S R one to S R fourteen are the team's own security requirement ids."
[[acronym]]
short = "TSV"
long = "Tab-Separated Values: a plain text table"
say = "T S V is tab separated values, a plain text table."
[[acronym]]
short = "CSP"
long = "Content Security Policy: which scripts a page may run"
say = "C S P is content security policy, which tells the browser which scripts a page may run."
[[acronym]]
short = "TLS"
long = "Transport Layer Security: encryption for data in transit"
say = "T L S is transport layer security, which encrypts data on its way."
[[acronym]]
short = "MFA"
long = "Multi-Factor Authentication: a second factor at sign-in"
say = "M F A is multi factor authentication: a second factor at sign in, such as a code from an app."
[[acronym]]
short = "PBKDF2"
long = "Password-Based Key Derivation Function 2: a slow, salted hash"
say = "P B K D F two is password based key derivation function two: a hash made slow on purpose, with a salt."
[[acronym]]
short = "SHA-256"
long = "Secure Hash Algorithm, 256-bit: a fast hash"
say = "S H A two five six is the secure hash algorithm with a two hundred and fifty six bit result: fast, which is wrong for passwords."
[threatmodel]
scope = """
The requirements practice itself: the chosen level, the requirements file in the repository, the checks, the coverage report and the release gate. It does not cover the store's own threats, which the checks are about.
"""
assets = [
    "The requirements file, which says what the store promises.",
    "The checks and the gate, which stand between a regression and a release.",
    "The coverage report, which partners and auditors rely on.",
]
actors = [
    "The team, who choose the level and write and review the requirements.",
    "A partner or auditor, who reads the report.",
    "An attacker, who finds what was never required.",
]
boundaries = [
    "The standard to the team's file: paraphrases can drift from what the standard means.",
    "The report to its readers: a green report can be read as more than it says.",
]
assumptions = [
    "The checks run in the build, and a failing check blocks a release.",
    "Manual requirements are reviewed by someone who knows the system.",
    "In the demo, the store, the requirements and the profiles are illustrative.",
]
out_of_scope = [
    "The store's threats: the threat-modeling project.",
    "Certification and formal audit.",
]
tests = [
    "`LevelAndRequirementsTest` checks the level model, unique ids, known checks, and the requirements file and its refusals.",
    "`ChecksAndAssessmentTest` checks every check on the store, the regression, the counts at each level and the chapter report.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next project, attack-trees-and-abuse-cases, takes one threat and breaks it into the attacker's steps, to find which defence cuts the cheapest path.
"""

[[threat]]
id = "T1"
stride = "I"
threat = "A threat that no requirement covers goes unchecked, because the standard was treated as the whole list"
where = "`Catalogue`"
control = "The threat model comes first, and its mitigations are added as requirements"
residual = "Threats nobody has thought of are still not covered"

[[threat]]
id = "T2"
stride = "T"
threat = "A requirement is weakened or deleted from the file so that a failing check no longer blocks the release"
where = "`RequirementsFile`, the release gate"
control = "The file lives in the repository and changes to it are reviewed like code"
residual = "A reviewer who approves without reading still lets it through"

[[threat]]
id = "T3"
stride = "S"
threat = "A check passes for the wrong reason, so a requirement looks met when it is not"
where = "`Checks`"
control = "Every check has a test that makes it fail, such as the fast-hash and debug builds"
residual = "A check can only be as good as the question it asks"

[[threat]]
id = "T4"
stride = "R"
threat = "Nobody can say why the level was chosen, so it is lowered under deadline pressure"
where = "`LevelChooser`"
control = "The level is chosen by a model that records its reasons"
residual = "The model is a simplification; the team still owns the decision"

[[threat]]
id = "T5"
stride = "I"
threat = "The mapping ages when the standard is revised, and requirements point at chapters that have moved"
where = "`Requirement.edition`"
control = "Every requirement records its edition, and old editions are flagged for review"
residual = "A paraphrase can still drift from what the standard means"
