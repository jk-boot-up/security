tagline = "Turn a verification standard into requirements that check themselves"
bold = "A verification standard says what a secure application must do; a team chooses a level, writes the requirements down as data in its own words, verifies most of them with checks that run on every build, and reports what is met, what failed and what still needs a person."
domain = "an online store"
domain_note = "The bank appears as the second profile, to show how the level changes what applies."
youtube_description = """Security requirements with OWASP ASVS, in Java, for OWASP Top 10 A06, insecure design. Explained with an online store and an online bank, like a building inspector's checklist that the builder runs every evening instead of once at the end. A small decision model puts a brochure site at L1, the store at L2 and the bank at L3, with its reasons; fourteen requirements are written down as data, each with its chapter, level and how it is verified; ten checks ask the running store questions, and nine pass; a coverage report shows what is met, failed and still manual, and a release with the debug flag on is refused; and the bill: a standard is a starting point, not a threat model, and people still review what no test can."""
