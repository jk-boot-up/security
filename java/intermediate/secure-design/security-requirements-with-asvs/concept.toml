]
install = []

[docs.session]
objectives = [
    "explain what the three ASVS levels are and choose one for an application",
    "write a security requirement that can be verified, and say how",
    "turn a requirement into an automated or configuration check",
    "read a coverage report and explain what met, failed, not applicable and manual mean",
]
walkthrough = """
Start with the building inspector's checklist. Ask the group which level the store and the bank need before running act one. In act two, ask the group to rewrite one statement so it can be tested. In act three, ask which checks a code review would have caught. In act four, introduce another regression and predict which requirement fails.
"""
exercises = [
    "Add a requirement from the Authorization chapter and write a check for it against the store.",
    "Change the store's profile so it moves money, and see which requirements now apply.",
    "Introduce a regression of your own, such as dropping HttpOnly, and watch the release gate refuse it.",
    "Map SR-14 to the current edition and add a test that fails when any requirement names an old edition.",
]

[docs.explained]
sentence = """
A team chooses an ASVS level for its application, writes the requirements that apply down as data in its own words, verifies most of them with checks that run on every build, and reports what is met, failed, not applicable and still manual, so a regression is refused before release.
"""
verdict = """
Choose a level and write down why. Keep the requirements in the repository, in your own words, with the chapter and edition they map to. Automate every requirement that can be checked, run the checks in the build as a release gate, and keep the manual ones visible. Start from the threat model, and treat the standard as the floor, not the ceiling.
"""
recognise = [
    "A requirements list in a repository with ids such as SR-01 and a chapter for each.",
    "A build that fails because a security check failed.",
    "A security report with met, failed and not applicable counts.",
    "A supplier questionnaire that asks which ASVS level an application meets.",
]

