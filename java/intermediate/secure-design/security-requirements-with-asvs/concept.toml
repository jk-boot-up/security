[[act]]
title = "Checks that ask the running store"
summary = "Ten checks ask the store questions; 9 of 10 pass, and staff-mfa fails. The password check reads the stored value scheme$rounds$salt$hash and needs pbkdf2-sha256 with rounds >= 600,000: the store passes, a build with plain SHA-256 fails, and its unsalted hash is the same 64 hex digits on every store."
detail = """
The input is ten questions, one per check, such as password-storage: is a password a slow, salted hash? The store as configured today answers: headers, cookies, password-storage, session-rotation, error-leak, debug-off, tls, audit-log and no-store pass; staff-mfa fails. 9 of 10 pass.
How the password check decides: the stored value has the shape scheme$rounds$salt$hash, and it needs pbkdf2-sha256 with rounds >= 600,000. Before, the store today stores pbkdf2-sha256$600000$ followed by a 16-byte salt and a 32-byte hash: pbkdf2-sha256, 600,000 >= 600,000 rounds, pass. After, a build that uses plain SHA-256 stores sha256$c4bbcb1fbec99d65bf59d85c...: no rounds and no salt, FAIL; the same password gives the same 64 hex digits on every store.
"""
figure = "answers"
figure_title = "Ten questions, and the password check worked out"
figure_speech = """
Third demo: checks that ask the running store. [[slnc 400]] On the left, the input: ten questions, one for each check, and the store's answers. [[slnc 300]] Nine pass. [[slnc 300]] One fails: staff do not sign in with a second factor. [[slnc 700]]
On the right, one check worked out: the password check. [[slnc 300]] A stored password has four parts: the scheme, the rounds, the salt, and the hash. [[slnc 300]] The check needs P B K D F two, and at least six hundred thousand rounds. [[slnc 600]]
Before: the store today keeps P B K D F two, six hundred thousand rounds, with a random salt. [[slnc 300]] It passes. [[slnc 300]] After: a build that uses plain S H A two five six. [[slnc 300]] No rounds, no salt, and it fails. [[slnc 300]] Without a salt, the same password gives the same hash on every store, so one cracked list cracks them all.
"""
speech = """
Here is the real output. [[slnc 400]] The input: ten questions, one per check, each one asked of the store as it runs.
[[page]]
