title = "Coverage and gaps"
summary = "The store at L2: met 8, failed 1 (SR-09), not applicable 2 (SR-11 SR-13), manual 3 (SR-08 SR-10 SR-14), shown by chapter. A release with the debug flag on fails SR-05 SR-06 SR-09: newly failing SR-05 SR-06, so the release gate refuses it. With staff signing in with a second factor, failing 0 and SR-08 SR-10 SR-14 are left to people."
