[[act]]
title = "Coverage and gaps"
summary = "At L2 the store has 8 met, 1 failed, 3 manual and 2 not applicable; a release with the debug flag on makes SR-05 and SR-06 newly fail and is refused; with staff MFA, nothing fails and 3 remain for people."
detail = """
The store at L2: met 8, failed 1, still manual 3, not applicable 2, reported chapter by chapter. The gap is SR-09: staff sign in without a second factor. A release that ships with the debug flag on makes SR-05 and SR-06 newly fail, error pages that show stack traces and an open debug endpoint, and the release gate refuses it.
Once staff sign in with a second factor, nothing fails, and the report says what is left for people to check: 3 requirements.
"""
speech = """
Fourth demo: coverage and gaps. [[slnc 400]] The store, judged at level two. [[slnc 300]] Eight requirements met. [[slnc 300]] One failed. [[slnc 300]] Three still need a person. [[slnc 300]] Two do not apply at this level. [[slnc 600]]
The gap is staff sign in without a second factor. [[slnc 600]]
