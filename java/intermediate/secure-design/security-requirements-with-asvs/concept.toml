[[act]]
title = "Checks that ask the running store"
summary = "Ten checks ask the running store questions and nine pass; staff sign-in without a second factor fails, and a build that stores passwords as plain SHA-256 fails the password check."
detail = """
Each check asks the running store a question and answers pass or fail. Does a page carry a CSP, nosniff and a framing policy? Is the session cookie Secure and HttpOnly? Is a password kept as a slow, salted hash? Does sign-in issue a new session id? Does an error page hide the stack trace? Is the debug endpoint closed, and is the oldest TLS version 1.2 or later?
Are security events logged, and are account pages marked no-store? All of these pass. Do staff sign in with a second factor? That one fails. Nine of ten checks pass on the store as it is configured today. And the same password check on a build that stores passwords as plain SHA-256 fails: a check catches what a review might miss.
"""
speech = """
Third demo: checks that ask the running store. [[slnc 400]] Each check asks the store one question, and answers pass or fail. [[slnc 600]]
Does every page carry a content security policy? [[slnc 300]] Is the session cookie secure? [[slnc 300]] Is a password kept as a slow, salted hash? [[slnc 300]] Does sign in issue a new session id? [[slnc 300]] Does an error page hide the stack trace? [[slnc 600]]
Nine of ten checks pass. [[slnc 300]] The one that fails: staff sign in without a second factor. [[slnc 600]]
And a build that stores passwords as plain S H A two fifty six fails the password check. [[slnc 300]] A check catches what a review might miss.
"""
