server.port=0
server.address=127.0.0.1
bank.mode=closed
spring.main.banner-mode=off
logging.level.root=OFF
# The bank's rules for the fraud check: a budget for every call, one retry, and a breaker that opens after three failed payments.
bank.fraud.budget-ms=500
bank.fraud.attempts=2
bank.breaker.threshold=3
bank.breaker.cool-down-seconds=30
bank.alert.refusals=5
