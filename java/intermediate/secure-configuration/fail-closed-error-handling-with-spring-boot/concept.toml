[[act]]
title = "The bill, and how to pay it"
summary = "During a slow outage 10 coffees are refused: with one retry each, 10 x 2 = 20 calls reach the struggling fraud check; a breaker that opens after 3 failed payments cuts that to 3 x 2 = 6 and refuses the other 7 at once, the counters raise an alert, and after the cool-down the breaker closes."
detail = """
The outage: the fraud check needs 2000 ms and the budget is 150 ms; 10 customers each pay 4.50 for a coffee. Without a breaker, with 2 attempts per payment, 0 of 10 are approved and 10 payments x 2 =
20 calls reach the fraud check. With a breaker that opens after 3 failed payments, 0 of 10 are approved, 3 payments x 2 = 6 calls reach it, the other 7 are refused at once, and the breaker is OPEN.
The Micrometer counters by reason: breaker open 7, fraud check too slow 3; the total of 10 is at least the alert threshold of 5, so an alert is raised. After the 30 s cool-down, with the fraud check back,
one trial call approves a coffee and the breaker is CLOSED. An open breaker still says no: it fails fast, not open.
"""
figure = "breaker_calls"
figure_title = "Ten coffees in an outage: calls that reach the fraud check"
figure_speech = """
Fifth demo: the bill. [[slnc 400]] Failing closed costs availability. [[slnc 300]] The fraud check needs two seconds, and the budget is a hundred and fifty milliseconds. [[slnc 300]] Ten customers each buy a coffee. [[slnc 700]]
Each amber block is one call that reached the struggling fraud check. [[slnc 300]] Without a breaker, every payment tries twice: ten times two is twenty calls. [[slnc 600]]
With a breaker that opens after three failed payments, only three payments try: three times two is six calls. [[slnc 300]] The other seven are refused at once. [[slnc 600]]
At the bottom, the refusal counters by reason raise an alert. [[slnc 300]] After the cool down, one trial call works, and the breaker closes.
"""
