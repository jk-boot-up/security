[threatmodel]
scope = """
A Spring Boot bank that approves card payments through an outside fraud service, moves money in a ledger and answers customers. It covers failures of the outside service, half-done transfers and what error responses and logs reveal. It does not cover the fraud service's own logic.
"""
assets = [
    "The money in the ledger.",
    "The card numbers.",
    "The availability of payments.",
]
actors = [
    "A customer, or an attacker who can make the fraud service slow or broken.",
    "Support staff who read the log.",
    "A developer who changes the error and transaction settings.",
]
boundaries = [
    "The bank to the fraud service: anything can come back, or nothing.",
    "The bank to the customer: the response is public.",
    "The bank to the log: support may read it.",
]
assumptions = [
    "The log is readable only by support staff.",
    "The ledger database is trusted and reachable.",
]
out_of_scope = [
    "Attacks on the fraud service itself.",
    "Transactions across several databases.",
]
tests = [
    "`FailClosedSpringTest` starts a real bank and fraud server for each case: every kind of broken check, the time budget, the breaker and its states, the doubling of calls by a retry, the alert, the four transfers, the error responses and the log.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
This is the last project in the secure-configuration module. The next module, api-security, moves from how the store fails to who may call it and how often.
"""

[[threat]]
id = "T1"
stride = "E"
threat = "A broken or stalled fraud check turns into an approval"
where = "`OpenPaymentService`, `ClosedPaymentService`"
control = "The decision starts as no; only a check that ran and passed approves"
residual = "A fraud service that answers low risk wrongly"

[[threat]]
id = "T2"
stride = "T"
threat = "A failed transfer leaves the money half moved"
where = "`Transfers`"
control = "A unit of work with rollbackFor, called through the proxy"
residual = "Transfers across systems, which need reconciliation"

[[threat]]
id = "T3"
stride = "I"
threat = "The error response reveals servers, card numbers or code"
where = "Boot's error response, `ErrorHandling`"
control = "One error handler, error details off, a reference for support"
residual = "A new exception path that nobody mapped"

[[threat]]
id = "T4"
stride = "I"
threat = "The log holds a full card number"
where = "`SecurityLog`"
control = "Log the reference, the reason and the last four digits only"
residual = "A developer who logs the request body"

[[threat]]
id = "T5"
stride = "D"
threat = "A slow or failing service holds every payment up"
where = "`FraudClient`, `Breaker`"
control = "A time budget, a limited retry, a breaker and an alert on refusals"
residual = "A long outage that is refused correctly and still hurts"

[poster]
headline = [["FAILING CLOSED", "text"], ["WITH SPRING BOOT", "accent"]]
taglines = [["When something breaks, the answer must be no", "gold"]]
before = { code = "catch (Exception e) { }", note = "an error became a yes", tag = "BEFORE" }
after = { code = "start from no + budget + breaker", note = "a 503 with a reference", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "Failing Closed with Spring Boot"
narration = "Hello, and welcome. [[slnc 400]] This video explains failing closed with Spring Boot, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] Failing closed means that when something goes wrong, the answer is no. [[slnc 300]] A check that cannot run must not turn into a yes, half-done work must be undone, and an error must not tell a stranger how the system is built. [[slnc 600]] Think of a bank vault whose lock loses power. [[slnc 300]] A safe lock stays shut until the power is back. [[slnc 300]] A careless one swings open. [[slnc 600]] Our example is an online bank built on Spring Boot."

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online bank on Spring Boot:", "  approves card payments by asking", "  a fraud-check service", "  moves money between accounts", "  answers with error responses", "", "The demo breaks the fraud service", "in four ways, and watches the bank."]
narration = "Here is the scenario. [[slnc 400]] An online bank on Spring Boot approves card payments by asking a separate fraud-check service. [[slnc 300]] It also moves money between accounts, and answers with error responses when something fails. [[slnc 600]] The demo starts the real bank several times, breaks the fraud service in four different ways, and watches what the bank does each time."

[[scene]]
key = "02-words"
kind = "bullets"
title = "The Words"
body = ["Fail open: an error becomes a yes", "Fail closed: an error becomes a no", "Time budget: how long a call may take", "Retry: one more attempt after a failure", "Breaker: stops calling a failing service", "Transaction: changes that happen together or not at all"]
narration = """Before the demos, the words. [[slnc 500]] To fail open is to let an error become a yes. [[slnc 500]] To fail closed is to let an error become a no. [[slnc 500]] A time budget is how long a call may take, before it counts as no answer. [[slnc 500]] A retry is one more attempt after a failure. [[slnc 500]] A breaker stops calling a service that keeps failing. [[slnc 500]] And a transaction is a set of changes that happen together, or not at all."""

[[scene]]
key = "02-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "02-open-or-closed"
kind = "figure"
title = "The same failure, two answers"
body = "open_vs_closed"
narration = """Let's see the whole idea on one picture. [[slnc 400]] At the top, one payment: fifteen hundred at an unknown electronics shop. [[slnc 300]] The fraud check drops the connection. [[slnc 700]]
On the left, the first version starts from yes. [[slnc 300]] The call throws, an empty catch swallows it, and the yes is still there. [[slnc 300]] The bank answers two hundred: approved. [[slnc 700]]
On the right, the fixed version starts from no. [[slnc 300]] The call throws, and nothing turned the no into a yes. [[slnc 300]] The bank answers five oh three, with a reference. [[slnc 700]]
That is the whole difference between failing open and failing closed. [[slnc 300]] Where the decision starts."""

[[scene]]
key = "03-acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "04-costs"
kind = "bullets"
title = "What It Costs"
body = ["Failing closed costs availability", "Time budgets and retries need tuning", "A breaker can hide an outage without alerts", "Transactions have rules you must know", "Generic messages slow support down"]
narration = "Nothing is free. [[slnc 400]] Here is what failing closed costs. [[slnc 500]] When the fraud service is down, honest customers are refused too, so availability suffers. [[slnc 500]] Time budgets and retries need tuning, or they refuse too much, or wait too long. [[slnc 500]] A breaker can quietly hide an outage, unless refusals raise an alert. [[slnc 500]] Spring's transactions have rules, and getting one wrong leaves money half moved. [[slnc 300]] And a short, generic error message means support needs the reference to find the detail."

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["catch (Exception e) with an empty body", "@Transactional on a method called from", "  inside the same class", "An HTTP client with no timeout", "An error page that names a server or a card"]
narration = "You have probably met this already. [[slnc 400]] A catch block for every exception, with nothing inside it, is how an error becomes a yes. [[slnc 500]] A transactional method called from inside its own class skips Spring's proxy, so there is no transaction at all. [[slnc 500]] An H T T P client with no timeout waits for ever. [[slnc 500]] And an error page that names an internal server, or shows a card number, is telling a stranger too much."

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Every decision starts as no", "Every outside call: a time budget,", "  one retry, a breaker", "Transfers: rollbackFor = Exception.class,", "  called from outside the class", "One error handler: a reference for the customer", "Alert when refusals rise"]
narration = "So, how do you use it? [[slnc 400]] Start every decision as no, and turn it into yes only when the check ran, in time, and said yes. [[slnc 500]] Give every call to another service a time budget, a limited retry, and a breaker. [[slnc 500]] Mark transfers to roll back on every exception, and call them from outside their class. [[slnc 500]] Use one error handler that gives the customer a reference, and keeps the reason in the log. [[slnc 300]] And raise an alert when refusals start to rise."

[[scene]]
key = "07-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a daily-limit check", "that fails closed when its value cannot be read."]
narration = "That's failing closed with Spring Boot. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] A Spring Boot bank must start every decision as no, put a limit on every outside call, undo half-done work, and tell the customer no more than a reference. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a daily limit check that fails closed when its value cannot be read, and test it. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] The bank is a real Spring Boot application, and the fraud service is a real H T T P server on this machine. [[slnc 300]] Here are the classes that matter."""

[[class]]
name = "OpenPaymentService"
what = "the mistake: starts from yes and swallows errors"
[[class.part]]
title = "an empty catch keeps the yes"
code = """
try {
    if (fraud.looksFraudulent(payment)) {
        return new Decision(false, "looks fraudulent");
    }
} catch (Exception e) {
    // the fraud service is having a bad day; do not bother the customer
}
return new Decision(true, "approved");
"""
speech = """When the fraud call throws, the empty catch does nothing. [[slnc 300]] The code falls through to the last line, and the payment is approved."""

[[class]]
name = "ClosedPaymentService"
what = "the fix: starts from no, with a breaker and one retry"
[[class.part]]
title = "only a low-risk answer is a yes"
code = """
risky = breaker.call(() -> checked(payment));
...
if (risky) {
...
    return new Decision(false, "looks fraudulent");
}
return new Decision(true, "approved");
...
return retry.execute(() -> fraud.looksFraudulent(payment));
"""
speech = """The fraud call goes through the breaker and a retry template with one retry. [[slnc 300]] Any failure becomes an exception that the error handler turns into a refusal. [[slnc 300]] Only an answer of low risk reaches approved."""

[[class]]
name = "FraudClient"
what = "the fraud call, with a time budget"
[[class.part]]
title = "connect and read timeouts"
code = """
factory.setReadTimeout(Duration.ofMillis(budgetMs));
...
throw new CallFailedException(spentMs >= budgetMs * 9 / 10, e);
...
default -> throw new IllegalStateException("unknown risk " + verdict.risk());
"""
speech = """The client gets a read timeout, and a connect timeout, both set to the budget. [[slnc 300]] An answer it cannot read, like a maintenance page, is an exception too, never a guess."""

[[class]]
name = "Transfers"
what = "four versions of the same transfer"
[[class.part]]
title = "rollbackFor, and the proxy"
code = """
@Transactional
...
@Transactional(rollbackFor = Exception.class)
...
this.unitOfWork(from, to, cents);
"""
speech = """Plain transactional rolls back only on unchecked exceptions, and the frozen account exception is checked. [[slnc 300]] Roll back for every exception fixes that. [[slnc 300]] But a call through this skips Spring's proxy, so there is no transaction at all."""

[[class]]
name = "Breaker"
what = "refuses at once after a run of failures"
[[class.part]]
title = "open means no"
code = """
if (state() == State.OPEN) {
    throw new CheckFailedException("breaker open", "breaker open", null);
}
"""
speech = """While the breaker is open, the fraud service is not called at all. [[slnc 300]] The payment is refused at once: failing fast, and still failing closed."""

[[class]]
name = "ErrorHandling"
what = "one handler: a reference outside, the reason in the log"
[[class.part]]
title = "a ProblemDetail with a reference"
code = """
@ExceptionHandler(CheckFailedException.class)
...
return answer(HttpStatus.SERVICE_UNAVAILABLE, e.why, request);
...
String reference = references.next();
...
log.refusal(reference, why, card == null ? "" : card.toString());
"""
speech = """Every failure ends here. [[slnc 300]] The customer gets a five oh three and a short message with a reference. [[slnc 300]] The security log gets the reason, and keeps only the last four digits of the card."""

