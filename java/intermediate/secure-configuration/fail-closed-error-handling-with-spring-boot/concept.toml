[readme]
intro = """
The plain [fail-closed-error-handling](../fail-closed-error-handling) project builds the ideas from scratch. This one uses what a real Spring Boot bank has: **Spring Boot 4.1** with **Spring Framework 7**, a real fraud-check server on the loopback address that can be told to fail in four ways, an in-memory **H2** ledger, and **Micrometer** counters.

What it shows:
- **Failing open.** A `catch (Exception e) { }` around the fraud check approves a risky 1500.00 payment when the fraud service drops the connection, answers 500, answers with a maintenance page or takes too long.
- **Failing closed.** The decision starts as no. The fraud call has a **time budget**, **one retry** with Spring Framework 7's own `RetryTemplate`, and a **breaker**. Every failure becomes a **503** with a reference, and a slow check is cut off at its budget.
- **Failing halfway.** The same transfer to a frozen account written four ways. Without a transaction the debit stays. With `@Transactional` and a **checked exception** it stays too, because Spring rolls back unchecked exceptions only. Called from **inside the same class** the proxy is skipped and it stays again. Only `@Transactional(rollbackFor = Exception.class)` called from outside undoes it.
- **What the customer is told.** With Boot's debugging settings (`spring.web.error.include-*`) the error response names the internal server, the full card number and code lines. One `@RestControllerAdvice` gives a generic answer with a reference, and the log keeps the reason and the last four digits only.
- **The bill.** Ten coffees while the fraud check is slow: 20 calls reach it without a breaker and 6 with one. Refusals are counted by reason, an alert fires, and after the cool-down the breaker closes.

**Maps to:** OWASP Top 10 (2025) A10 Mishandling of Exceptional Conditions · CWE-636 · CWE-755 · CWE-209 · OWASP ASVS 5.0 (error handling and logging).
"""
analogy = """
A bank vault with an electronic lock. When the power fails, the door can lock itself or open itself. A vault that opens in a power cut is opened by cutting the power. Failing closed is the vault that locks, and the price is that nobody gets in until the power is back, which is why the bank also has a generator and an alarm.
"""
scenario = """
An online bank on Spring Boot approves card payments by asking a fraud-check service, moves money between accounts, and shows error responses. The demo starts the real application several times, breaks the fraud service in turn, and watches what the code does.
"""
costs = [
    "**Failing closed costs availability.** When the fraud check is down, no payment goes through, and ten coffees during a slow outage are all refused.",
    "**Budgets and retries need tuning.** A budget that is too short refuses healthy calls, and a retry doubles the load on a struggling service: 20 calls instead of 10.",
    "**A breaker can hide an outage.** Refusing fast is better than waiting, but only if the refusal counters raise an alert.",
    "**Transactions have rules.** Rollback on unchecked exceptions only, and only through the proxy; each rule is a way to lose money quietly.",
    "**Generic messages slow support down.** The reference only helps if support can search the log for it.",
]
too_much = """
For a check that protects nothing important, failing open can be an acceptable business choice, as long as it is a written decision and not an accident. For payments, access control and anything that moves money or data, fail closed, and pay for it with budgets, breakers and alerts.
"""
met_before = [
    "`catch (Exception e) { }` and logs full of swallowed exceptions.",
    "`@Transactional` on a method that is called from the same class.",
    "A JSON error response with a `trace` field in production.",
    "`RestClient` or `RestTemplate` with no timeout at all.",
]
where = """
This is the tools version of [fail-closed-error-handling](../fail-closed-error-handling), in the [secure-configuration](..) module. It follows the same story, a bank that must say no when it cannot say yes, on a real framework.
"""
twin = """
The bank is a real Spring Boot application, the fraud service is a real HTTP server on the loopback interface, and the ledger is an in-memory H2 database. The breaker reads a clock the demo can move forward, so a 30-second cool-down takes no time to wait for. Only statuses, booleans, balances and counts are printed, never ports or time stamps.
"""
test_note = "Each test starts a real bank and a real fraud-check server on free loopback ports and stops them. Nothing is printed that changes between runs."

[[act]]
title = "Failing open"
summary = "A catch-all around the fraud check approves a risky 1500.00 payment when the service drops the connection, answers 500, answers with a maintenance page or takes too long."
detail = """
The risky payment is refused while the fraud check works. Then the fraud service is told to drop the connection, answer 500, answer with a maintenance page, and take 2 seconds against a budget of 500 ms. Each time the catch-all swallows the exception and the payment is approved. The decision started as yes, and a check that never ran took nothing away.
"""
speech = """
First demo: failing open. [[slnc 400]] The bank asks the fraud service about a risky payment, and the service says no. [[slnc 600]]
Now the fraud service drops the connection. [[slnc 300]] The payment is approved. [[slnc 600]]
It answers with an error, a maintenance page, or takes too long. [[slnc 300]] Approved every time. [[slnc 600]]
An error became a yes.
"""
rows = { open = "active wrong" }
console = [
    ["risky payment, fraud check working -> refused", "ok"],
    ["fraud check drops the connection -> APPROVED", "bad"],
    ["fraud check answers 500, or a maintenance page, or is slow -> APPROVED", "bad"],
]

[[act]]
title = "Failing closed"
summary = "The decision starts as no; a time budget, one retry and a breaker turn every kind of broken check into a 503 with a reference, and a slow check is cut off at its budget."
detail = """
A coffee is approved when the check ran and said low risk. The risky payment is refused with 403 when the check works. When the fraud check answers 500, answers with a maintenance page or drops the connection, the payment is refused with 503 and a reference such as REF-0002. A coffee while the fraud check takes 2 seconds against a budget of 500 ms is refused too, and the answer comes before the fraud check finishes. Every refusal is in the log with its reference: 5 lines.
"""
speech = """
Second demo: failing closed. [[slnc 400]] The decision starts as no. [[slnc 600]]
Only a fraud check that ran, in time, and said low risk, turns it into yes. [[slnc 600]]
When the check fails in any way, the payment is refused with a reference the customer can quote. [[slnc 600]]
A slow check is cut off at its budget, so the customer is not left waiting. [[slnc 300]] Every refusal is in the log.
"""
rows = { closed = "active ok" }
console = [
    ["coffee, fraud check working -> 200 APPROVED", "ok"],
    ["fraud check answers 500 -> 503, reference REF-0002", "ok"],
    ["fraud check takes 2 seconds, budget 500 ms -> 503 in time", "ok"],
    ["every refusal is in the log with its reference: 5 lines", "ok"],
]

[[act]]
title = "Failing halfway"
summary = "The same transfer to a frozen account written four ways: without a transaction, with a checked exception, called from the same class, and as a real unit of work. Only the last undoes the debit."
detail = """
Ana sends 250.00 to Ben, whose account is frozen. Without a transaction the debit stays: Ana has 750.00 and the bank is 250.00 short. With `@Transactional` and a checked exception the debit stays as well, because Spring rolls back on unchecked exceptions only. Called from inside the same class, the proxy is skipped and the debit stays again. With `@Transactional(rollbackFor = Exception.class)` called from outside, Ana keeps 1000.00.
"""
speech = """
Third demo: failing halfway. [[slnc 400]] Ana sends two hundred and fifty to Ben, whose account is frozen. [[slnc 600]]
Without a transaction, the debit stays, and the bank is short. [[slnc 600]]
With a transaction annotation and a checked exception, the debit stays too, because Spring rolls back unchecked exceptions only. [[slnc 600]]
Called from inside the same class, the proxy is skipped, and the debit stays again. [[slnc 600]]
Only a real unit of work puts the money back.
"""
rows = { half = "active wrong" }
console = [
    ["no transaction: ana 750.00, money in the bank 750.00", "bad"],
    ["@Transactional, checked exception: ana 750.00", "bad"],
    ["called from the same class: ana 750.00", "bad"],
    ["rollbackFor = Exception.class: ana 1000.00", "ok"],
]

[[act]]
title = "What the customer is told"
summary = "Boot's error response with the debugging settings names the server, the card and code lines; one error handler gives a reference and the log keeps the reason and the last four digits."
detail = """
With the debugging profile the 500 response names the internal server, shows the full card number and shows code lines. With one `@RestControllerAdvice` the same failure gives 503 and a short message with a reference, and none of those three. The log line has the reference, the reason and the last four digits, and not the full card number, so support can find the detail from the reference.
"""
speech = """
Fourth demo: what the customer is told. [[slnc 400]] With the debugging settings on, the error response names the internal server, shows the full card number, and shows lines of code. [[slnc 600]]
With one error handler, the customer sees a short message and a reference. [[slnc 600]]
The log keeps the reason and the last four digits, never the whole number. [[slnc 300]] Support finds the detail from the reference.
"""
rows = { told = "active ok" }
console = [
    ["debugging settings: the response names the server, the card and code lines", "bad"],
    ["one error handler: 503, quoting reference REF-0001", "ok"],
    ["log: reference, reason, last four digits, no full number", "ok"],
]

[[act]]
title = "The bill, and how to pay it"
summary = "Ten coffees while the fraud check is slow: 20 calls reach it without a breaker and 6 with one; refusals are counted by reason, an alert fires, and the breaker closes after the cool-down."
detail = """
Failing closed costs availability: ten coffees while the fraud check is slow are all refused, and with a retry each, 20 calls reach the fraud check. With a breaker that opens after 3 failed payments, 6 calls reach it and the other 7 payments are refused at once. The refusal counters give {fraud check too slow=3, fraud check unavailable, breaker open=7} and an alert is raised. After the cool-down, with the fraud check back, a coffee is approved and the breaker is closed again.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] Failing closed costs availability. [[slnc 600]]
Ten coffees while the fraud check is slow are all refused, and twenty calls reach the struggling service. [[slnc 600]]
With a breaker, only six calls get through, and the rest are refused at once. [[slnc 600]]
