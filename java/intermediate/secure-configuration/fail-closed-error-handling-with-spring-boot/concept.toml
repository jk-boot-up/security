[threatmodel]
scope = """
A Spring Boot bank that approves card payments through an outside fraud service, moves money in a ledger and answers customers. It covers failures of the outside service, half-done transfers and what error responses and logs reveal. It does not cover the fraud service's own logic.
"""
assets = [
    "The money in the ledger.",
    "The card numbers.",
    "The availability of payments.",
]
actors = [
    "A customer, or an attacker who can make the fraud service slow or broken.",
    "Support staff who read the log.",
    "A developer who changes the error and transaction settings.",
]
boundaries = [
    "The bank to the fraud service: anything can come back, or nothing.",
    "The bank to the customer: the response is public.",
    "The bank to the log: support may read it.",
]
assumptions = [
    "The log is readable only by support staff.",
    "The ledger database is trusted and reachable.",
]
out_of_scope = [
    "Attacks on the fraud service itself.",
    "Transactions across several databases.",
]
tests = [
    "`FailClosedSpringTest` starts a real bank and fraud server for each case: every kind of broken check, the time budget, the breaker and its states, the doubling of calls by a retry, the alert, the four transfers, the error responses and the log.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
This is the last project in the secure-configuration module. The next module, api-security, moves from how the store fails to who may call it and how often.
"""

[[threat]]
id = "T1"
stride = "E"
threat = "A broken or stalled fraud check turns into an approval"
where = "`OpenPaymentService`, `ClosedPaymentService`"
control = "The decision starts as no; only a check that ran and passed approves"
residual = "A fraud service that answers low risk wrongly"

[[threat]]
id = "T2"
stride = "T"
threat = "A failed transfer leaves the money half moved"
where = "`Transfers`"
control = "A unit of work with rollbackFor, called through the proxy"
residual = "Transfers across systems, which need reconciliation"

[[threat]]
id = "T3"
stride = "I"
threat = "The error response reveals servers, card numbers or code"
where = "Boot's error response, `ErrorHandling`"
control = "One error handler, error details off, a reference for support"
residual = "A new exception path that nobody mapped"

[[threat]]
id = "T4"
stride = "I"
threat = "The log holds a full card number"
where = "`SecurityLog`"
control = "Log the reference, the reason and the last four digits only"
residual = "A developer who logs the request body"

[[threat]]
id = "T5"
stride = "D"
threat = "A slow or failing service holds every payment up"
where = "`FraudClient`, `Breaker`"
control = "A time budget, a limited retry, a breaker and an alert on refusals"
residual = "A long outage that is refused correctly and still hurts"

