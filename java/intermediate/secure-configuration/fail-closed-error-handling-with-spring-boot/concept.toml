[[act]]
title = "Failing halfway"
summary = "The same 250.00 transfer to a frozen account in four versions: no transaction, @Transactional with a checked exception, and @Transactional called from the same class all leave 250.00 missing; only rollbackFor = Exception.class called from outside undoes the debit."
detail = """
Before: ana has 1000.00, ben has 0.00 and his account is frozen; the bank holds 1000.00. Ana sends 250.00 to ben, in four versions of the same code. With no transaction, the debit stays: ana 750.00,
total 750.00. With @Transactional and a checked exception, Spring does not roll back, because by default it rolls back on unchecked exceptions only: total 750.00. With @Transactional called from the
same class, the call does not go through Spring's proxy, so there is no transaction at all: total 750.00. With @Transactional(rollbackFor = Exception.class) called from outside, the failed credit
undoes the debit: total 1000.00. The loss, worked out: 1000.00 - 750.00 = 250.00 vanished, in 3 of 4 versions.
"""
figure = "four_transfers"
figure_title = "One transfer, four versions, three losses"
figure_speech = """
Third demo: failing halfway. [[slnc 400]] Ana sends two hundred and fifty to Ben, whose account is frozen. [[slnc 300]] The debit works, and the credit fails. [[slnc 700]]
The same transfer is written four ways. [[slnc 300]] With no transaction, the debit stays, and the total drops to seven hundred and fifty. [[slnc 600]]
With transactional, but a checked exception, Spring does not roll back. [[slnc 300]] By default, it rolls back only on unchecked exceptions. [[slnc 600]]
With transactional, called from the same class, the call skips Spring's proxy, so there is no transaction at all. [[slnc 600]]
Only the last version, roll back for every exception, called from outside, undoes the debit. [[slnc 300]] The total stays a thousand.
"""
speech = """
Here is the output. [[slnc 400]] The accounts before: a thousand, nothing, and Ben's account is frozen. [[slnc 400]] The transfer: two hundred and fifty, in four versions of the same code. [[slnc 400]] No transaction: seven hundred and fifty left in the bank. [[slnc 300]] Transactional with a checked exception: seven hundred and fifty again.
[[page]]
Called from the same class: seven hundred and fifty. [[slnc 300]] Only the last version keeps a thousand. [[slnc 400]] The loss, worked out: a thousand minus seven hundred and fifty, two hundred and fifty vanished, in three of four.
"""
rows = { half = "active amber" }
console = [
    ["THE ACCOUNTS BEFORE (ben's account is frozen):", "code"],
    ["  ana 1000.00  ben 0.00  total 1000.00", "muted"],
