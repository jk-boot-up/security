title = "How To Use It"
body = ["Explain why a decision must start as no", "Give every call to another service a budget, a limited", "retry and a breaker", "Name the two rules that make @Transactional leave a", "transfer half done", "Give the customer a reference and keep the reason in", "the log"]
narration = "So, how do you use it? [[slnc 400]] Start from no, put a time budget on every outside call, limit retries, open a breaker on repeated failure, annotate transfers with rollbackFor and call them from outside the class, use one error handler, switch the error details off, and alert on rising refusals."

