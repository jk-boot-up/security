]

[docs.explained]
sentence = """
A Spring Boot bank must start every decision as no, bound every outside call, undo half-done work, and tell the customer as little as the log tells support.
"""
verdict = """
Start from no, put a time budget on every outside call, limit retries, open a breaker on repeated failure, annotate transfers with rollbackFor and call them from outside the class, use one error handler, switch the error details off, and alert on rising refusals.
"""
recognise = [
    "`catch (Exception e)` with an empty body.",
    "`@Transactional` on a private method or a method called from `this`.",
    "`spring.web.error.include-stacktrace=always` in a shared properties file.",
    "A client with no timeout.",
]

[spec]
purpose = """
Teach failing closed in Spring Boot: decisions that start as no, bounded calls, transaction rules and error responses.
"""
nongoals = [
    "A full resilience library.",
    "Distributed transactions across systems.",
    "Real payment processing.",
]
problem = """
Teams catch exceptions to keep requests flowing, trust a transaction annotation without its rules, and leave debugging details in error responses.
"""
roles = [["Payments", "`OpenPaymentService`, `ClosedPaymentService`, `PaymentController`"], ["Fraud call", "`FraudClient`, `Breaker`, `BankConfig`"], ["Transfers", "`Ledger`, `Transfers`"], ["Errors", "`ErrorHandling`, `SecurityLog`, `References`"], ["Test double", "`FraudServer`"], ["Entry point", "`FailClosedSpringDemo`"]]
requirements = [
    "The open version approves a risky payment when the check is broken.",
    "The closed version refuses on every kind of broken check, with a reference.",
    "A slow check is cut off at its time budget.",
    "A breaker stops calls to a failing service and closes after the cool-down.",
    "Only a unit of work with rollbackFor, called from outside, undoes a failed transfer.",
    "The error response gives no server, card or code details, and the log has the last four digits only.",
    "The demo prints the same output on every run.",
]

