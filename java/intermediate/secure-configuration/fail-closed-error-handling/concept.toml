[docs.problem]
scenario = """
An online bank approves card payments with the help of a fraud-check service and a daily limit, and moves money between accounts. Every one of those dependencies fails sometimes: it is slow,
it is down, or it returns something the code cannot read.
"""
naive = """
Write the checks for the happy path, and wrap them in a catch-all so that a flaky dependency does not block customers. The catch-all turns every failure into an approval.
"""
deliver = [
    "A payment check that approves by accident, and the same check rebuilt to start from no.",
    "Time budgets that turn a slow answer into a refusal.",
    "A transfer that is all or nothing, and connections released on every path.",
    "A safe error page with a reference, and a log that keeps the detail without the card number.",
    "A circuit breaker that refuses fast, a limited retry, and an alert on refusals.",
    "The same output on every run.",
]

[docs.prerequisites]
required = [
    "Java basics, including exceptions and try-with-resources",
    "The beginner project authentication-vs-authorization, or an idea of what an authorization check is",
]
not_required = [
    "A resilience library: the breaker is written in the project",
    "A database: the ledger and the pool are simulations",
]
install = []

[docs.session]
objectives = [
    "explain failing open and failing closed, with an example of each",
    "describe why a decision should start as no",
    "make a two-step change all or nothing, and release resources on every path",
    "write an error response that helps support and not an attacker",
    "explain what a circuit breaker, a time budget and a retry each add",
]
walkthrough = """
Start with the vault in a power cut. Run the demo one act at a time. After act one, ask the group to find a catch-all in their own code. After act two, ask what the customer at the till
sees and how support helps them. In act three, ask what would happen if the undo itself failed. In act five, ask who should be woken up when refusals rise.
"""
exercises = [
    "Add a balance service that can also fail, and make the payment check refuse when it cannot be reached.",
    "Make the transfer idempotent with a request id, so a retried transfer is not applied twice.",
    "Add exponential back-off to the retry, on the simulated clock, and cap the total time.",
    "Write a test that fails if any class in the project has an empty catch block.",
]

[docs.explained]
sentence = """
Failing closed means that when a check cannot run, times out or throws, the answer is a refusal, half-finished changes are undone, resources are released, and the customer gets a reference instead of the error, with budgets, breakers and alerts to keep the cost in availability bearable.
"""
verdict = """
Start every security decision as no, and approve only on an explicit, successful check. Give every call a time budget, and treat a late answer as no answer. Never write an empty catch, and
map unexpected exceptions to a refusal. Make related changes one unit of work, and use try-with-resources. Show the customer a reference, log the detail without secrets, and alert on refusals.
"""
recognise = [
    "`catch (Exception e) { }` and `catch (Exception e) { return true; }` in code reviews.",
    "Timeouts, retries and circuit breakers in service clients, and their dashboards.",
    "Error pages that say \"something went wrong, reference ABC-123\".",
    "Post-incident reports that say a check \"failed open\" during an outage.",
]

[spec]
purpose = """
Teach failing closed by breaking a bank's payment check, transfer and error page in each way that real dependencies fail, on a simulated clock, and rebuilding each to refuse, undo, release and stay quiet.
"""
nongoals = [
    "A resilience library: the tools version.",
    "Distributed transactions across systems.",
    "Logging and alerting pipelines: the detection-and-response module.",
]
problem = """
Security checks are tested for the case where everything works; the failure cases are where requests slip through, money is lost and internals leak.
"""
roles = [["Simulated clock", "`SimClock`"], ["Fraud service with faults", "`FraudService`"], ["Failing open", "`NaiveAuthorizer`"], ["Failing closed", "`SafeAuthorizer`"], ["Transfers", "`Ledger`, `Transfers`"], ["Connections", "`ConnectionPool`"], ["Error pages and log", "`ErrorPages`, `SecurityLog`"], ["Breaker and retry", "`CircuitBreaker`, `ResilientAuthorizer`"], ["Entry point", "`FailClosedDemo`"]]
requirements = [
    "The naive check approves when the fraud check is down and skips the limit on a bad value.",
    "The safe check refuses on any error, timeout or unreadable value, with a reference and a log line.",
    "An atomic transfer leaves the total unchanged on failure; try-with-resources leaks no connection.",
    "The safe page has no internals, and the log has no full card number.",
    "An open breaker refuses without calling the service, and closes after a successful trial.",
    "The demo prints the same output on every run.",
]

