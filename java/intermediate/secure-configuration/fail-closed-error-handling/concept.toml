[[act]]
title = "Failing halfway"
summary = "A transfer of 250.00 to a frozen account makes 250.00 vanish; as one unit of work nothing moves; three failed updates leak all three connections, and try-with-resources gives them back."
detail = """
Before: ana has 1000.00, ben has 0.00 and his account is frozen; the bank holds 1000.00. Ana sends 250.00 to ben. Debit then credit: the debit works, 1000.00 - 250.00 = 750.00, and the credit
fails because ben's account is frozen. Now ana has 750.00, ben 0.00, and the total is 750.00: 1000.00 - 750.00 = 250.00 vanished. As one unit of work, the transfer is checked first; ben accepts
no credit, so nothing moves and the total stays 1000.00. A pool of three connections: three failed updates that give a connection back only on success leave 2, 1, then 0 free, and the next
update fails with no connection available. With try-with-resources, 3 stay free after each failure.
"""
figure = "half_transfer"
figure_title = "Half a transfer, and connections that never come back"
figure_speech = """
Third demo: failing halfway. [[slnc 400]] On the left, Ana sends two hundred and fifty to Ben, whose account is frozen. [[slnc 700]]
Before: Ana has a thousand, Ben has nothing, and the bank holds a thousand. [[slnc 300]] Debit, then credit: the money leaves Ana's account, then the credit to Ben fails. [[slnc 300]] Now the total is seven hundred and fifty. [[slnc 300]] Two hundred and fifty vanished. [[slnc 600]]
As one unit of work, the transfer is checked first. [[slnc 300]] Ben cannot receive money, so nothing moves, and the total stays a thousand. [[slnc 700]]
On the right, a pool of three database connections. [[slnc 300]] A filled square is a free connection. [[slnc 300]] When a connection is given back only on success, each failure loses one: two, one, none. [[slnc 300]] Then the bank stops. [[slnc 300]] With try with resources, all three come back every time.
"""
speech = """
Here is the output. [[slnc 400]] The accounts before, and the transfer. [[slnc 400]] Debit then credit: the debit, worked out, leaves seven hundred and fifty. [[slnc 300]] The credit fails. [[slnc 300]] A thousand minus seven hundred and fifty: two hundred and fifty vanished.
[[page]]
As one unit of work: checked first, and nothing moves. [[slnc 400]] The connection pool. [[slnc 300]] Three failed updates without try with resources: two, one, then zero free, and the next update fails. [[slnc 400]] With try with resources: three free, every time.
"""
