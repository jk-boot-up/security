[[act]]
title = "Failing halfway"
summary = "A transfer of 250.00 to a frozen account makes 250.00 vanish; as one unit of work nothing changes; three failed updates leak all three connections, and try-with-resources gives them back."
detail = """
Ana sends 250.00 to Ben, whose account is frozen. The transfer fails after the debit, so Ana has 750.00, Ben has nothing, and the bank's total falls from 1000.00 to 750.00: 250.00 vanished. As
one unit of work, checked first and undone if the second half fails, the transfer is refused and nothing changes. Three failed updates that give a connection back only on success leave no free
connections, and the next update fails. The same three failures with try-with-resources leave all three connections free.
"""
speech = """
Third demo: failing halfway. [[slnc 400]] Ana sends money to Ben, whose account is frozen. [[slnc 600]]
The money leaves Ana's account, and the credit to Ben fails. [[slnc 300]] The money vanished. [[slnc 600]]
As one unit of work, checked first, and undone if the second half fails, nothing changes. [[slnc 600]]
Resources fail halfway too. [[slnc 300]] Three failed updates that only give a connection back on success leave none free, and the bank stops. [[slnc 300]] With try with resources, every connection comes back.
"""
rows = { halfway = "active amber" }
console = [
    ["ana sends 250.00 to ben, whose account is frozen: done false, ana now has 750.00, ben has 0.00", "bad"],
