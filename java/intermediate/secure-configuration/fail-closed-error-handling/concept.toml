    { from = "attacker", to = "fraud", label = "overloads it", colour = "red", dashed = true, threats = ["T1", "T6"] },
    { from = "attacker", to = "auth", label = "sends bad values", colour = "red", dashed = true, threats = ["T2"] },
]

[poster]
headline = [["FAILING CLOSED", "text"], ["SECURE ERROR HANDLING", "accent"]]
taglines = [["When something breaks, the answer must be no", "gold"]]
before = { code = "catch (Exception e) { }", note = "an error became a yes", tag = "BEFORE" }
after = { code = "start from no + budgets", note = "refuse, undo, release, alert", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "Failing Closed: Secure Error Handling"
narration = """Hello, and welcome. [[slnc 400]] This video explains failing closed, and secure error handling, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] Failing closed means that when something goes wrong, the answer is no. [[slnc 300]] Failing open means that an error becomes a yes. [[slnc 300]] It is number ten in the O W A S P top ten. [[slnc 600]] Think of a bank vault with an electronic lock. [[slnc 300]] When the power fails, the door either locks itself, or opens itself. [[slnc 300]] A vault that opens in a power cut can be opened by cutting the power. [[slnc 700]] In this video, the domain is an online bank. [[slnc 500]] By the end, you will hear how an error turns into an approval. [[slnc 300]] How to start every decision from no. [[slnc 300]] How to keep half done changes and leaked resources from hurting. [[slnc 300]] And how to pay for the lost availability."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online bank approves card payments", "with a fraud check and a daily limit,", "and moves money between accounts.", "", "Every dependency fails sometimes."]
narration = """Here is the scenario. [[slnc 400]] An online bank approves card payments, with the help of a fraud check and a daily limit. [[slnc 500]] It also moves money between accounts. [[slnc 500]] And every one of those dependencies fails sometimes. [[slnc 300]] It is slow, it is down, or it returns something the code cannot read."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["Fail open: an error becomes a yes", "Fail closed: an error becomes a no", "Time budget: how long a call may take", "Unit of work: changes that happen together or not at all", "Circuit breaker: stops calling a failing service"]
narration = """Before the demos, the words. [[slnc 500]] To fail open is to let an error become a yes. [[slnc 500]] To fail closed is to let an error become a no. [[slnc 500]] A time budget is how long a call may take before it counts as no answer. [[slnc 500]] A unit of work is a set of changes that happen together, or not at all. [[slnc 500]] And a circuit breaker stops calling a service that keeps failing."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "09-ladder"
kind = "bullets"
title = "Every Path Ends Somewhere"
body = ["Passed in time: yes", "Risky or over the limit: no", "Slow, down or unreadable: no", "Breaker open: no, at once", "Half done: undone"]
narration = """Let's put the paths side by side. [[slnc 400]] A check that passed, in time, is the only yes. [[slnc 500]] A risky payment, or one over the limit, is a no. [[slnc 500]] A check that was slow, down, or could not read its value is also a no. [[slnc 500]] An open breaker is a no, at once. [[slnc 500]] And a change that only half happened is undone."""

[[scene]]
key = "10-roles"
kind = "bullets"
title = "Who Does What"
body = ["NaiveAuthorizer: starts from yes", "SafeAuthorizer: starts from no", "Transfers and ConnectionPool: halfway failures", "ErrorPages and SecurityLog: what is said, and where", "CircuitBreaker: refuses fast"]
narration = """Here is who does what in the code. [[slnc 400]] The naive authorizer starts from yes, and is the mistake. [[slnc 500]] The safe authorizer starts from no. [[slnc 500]] The transfers and the connection pool show failures halfway through. [[slnc 500]] The error pages and the security log decide what is said, and where. [[slnc 300]] And the circuit breaker refuses fast while a service is down."""

[[scene]]
key = "11-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Empty catch blocks in code reviews", "Checks that failed open during an outage", "Stack traces on error pages", "Timeouts, retries and breakers in service clients"]
narration = """You have probably met this already. [[slnc 400]] Empty catch blocks, in code reviews. [[slnc 500]] Outage reports that say a check failed open. [[slnc 500]] Error pages that show a stack trace. [[slnc 500]] And timeouts, retries and circuit breakers in service clients."""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Start every security decision as no", "A time budget for every call", "No empty catch blocks", "One unit of work; try-with-resources", "A reference outside, detail inside, an alert on refusals"]
narration = """So, how do you use it? [[slnc 400]] Start every security decision as no. [[slnc 500]] Give every call a time budget. [[slnc 500]] Never write an empty catch block. [[slnc 500]] Make related changes one unit of work, and release resources with try with resources. [[slnc 500]] And show a reference outside, keep the detail inside, and alert when refusals rise."""

[[scene]]
key = "13-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Make the transfer", "idempotent with a request id."]
narration = """That's failing closed. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] When something breaks, the answer must be no, and the cost of that no is paid with budgets, breakers and alerts. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine, with nothing installed except a Java development kit. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Make the transfer idempotent with a request id, so a retried transfer is not applied twice. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
An online bank's payment check, its transfers between accounts, its connection pool and its error pages, when a dependency is slow, down or returns a value that cannot be read. It covers
attackers who cause or exploit failures, and attackers who read error pages. It does not cover the fraud model itself, distributed transactions, or the logging pipeline.
"""
assets = [
    "The bank's money and the correctness of every balance.",
    "The decision to approve a payment.",
    "Internal details: host names, versions, code paths.",
    "Card numbers and other secrets that pass through errors.",
    "The bank's availability.",
]
actors = [
    "Customers paying and transferring money.",
    "An attacker who overloads a dependency or sends values that break parsing, to make a check fail.",
    "An attacker who reads error pages for internal details.",
    "Support staff who look up references in the log.",
]
boundaries = [
    "The bank to its dependencies: every answer may be late, missing or wrong.",
    "The bank to the customer: what an error page says crosses this line.",
    "The bank to its log: the detail stays inside, without secrets.",
]
assumptions = [
    "The fraud check and the limit are correct when they answer.",
    "The ledger's undo succeeds; across systems that needs reconciliation.",
    "In the demo, time runs on a simulated clock, and the card number is a well-known test number.",
]
out_of_scope = [
    "The fraud model's accuracy.",
    "Distributed transactions and sagas across services.",
    "Shipping, storing and alerting on logs: the detection-and-response module.",
]
tests = [
    "`AuthorizerTest` checks the naive check's two failures, the safe check's refusals on errors, timeouts and bad values, and the references.",
    "`PartialFailureTest` checks lost money in the naive transfer, all-or-nothing transfers, refusals of bad amounts, and connection leaks.",
    "`ErrorsAndBreakerTest` checks the safe and raw error pages, card number redaction, the breaker's states, refusals without calls, and the single retry.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next module, api-security, applies the same habits to an API: explicit request and response models, budgets for every client, and protection of sessions.
"""

[[threat]]
id = "T1"
stride = "E"
threat = "A dependency failure turns into an approval, because a catch-all swallows the error"
where = "`NaiveAuthorizer`"
control = "Start from no; only an explicit, successful check approves"
residual = "A check that answers wrongly but on time is still believed"

[[threat]]
id = "T2"
stride = "T"
threat = "An unreadable value makes the code skip a check"
where = "`NaiveAuthorizer`, the limit check"
control = "Strict parsing, and an unreadable value is a refusal"
residual = "Values that parse but are wrong need validation at the source"

[[threat]]
id = "T3"
stride = "T"
threat = "A change fails halfway, and money is lost or created"
where = "`Transfers.naive`"
control = "Check first, then change both sides, and undo if the second fails"
residual = "Across systems, an undo can fail too, and needs reconciliation"

[[threat]]
id = "T4"
stride = "D"
threat = "Errors leak connections until the bank stops"
where = "`ConnectionPool.naiveUpdate`"
control = "try-with-resources releases on every path"
residual = "Pool size and timeouts still need monitoring"

[[threat]]
id = "T5"
stride = "I"
threat = "Error pages and logs reveal internals and card numbers"
where = "`ErrorPages.naive`, `SecurityLog`"
control = "A generic page with a reference; the log redacts card numbers"
residual = "Redaction catches card numbers, not every secret; secrets should not reach messages at all"

[[threat]]
id = "T6"
stride = "D"
threat = "Failing closed during an outage refuses every customer"
where = "`SafeAuthorizer`, `ResilientAuthorizer`"
control = "Time budgets, a limited retry, a breaker that refuses fast, and an alert on refusals"
residual = "Customers are still refused until the dependency is back; that is the chosen cost"
