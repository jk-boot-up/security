[[act]]
title = "The bill, and how to pay it"
summary = "During a slow outage 10 coffees are refused: without a breaker 10 calls wait 10 x 300 ms = 3000 ms; a breaker that opens after 3 failures makes only 3 calls (900 ms), refuses 7 at once, raises an alert, and closes again when the service is back."
detail = """
The outage: the fraud check needs 5000 ms and the budget is 300 ms; 10 customers each pay 4.50 for a coffee. Without a breaker, 0 of 10 are approved and the struggling fraud check is called 10
times, waiting 10 x 300 ms = 3000 ms. With a circuit breaker that opens after 3 failures, still 0 of 10 are approved, but the fraud check is called only 3 times, the waiting is 3 x 300 ms = 900 ms,
and the breaker is OPEN. The refusals are counted by reason: breaker open 7, fraud check too slow 3; the total of 10 is at least the alert threshold of 5, so an alert is raised. After the 30000 ms
cool-down, with the fraud check back, one trial call approves a coffee and the breaker is CLOSED. An open breaker still says no: it fails fast, not open.
"""
figure = "breaker_bill"
figure_title = "Ten coffees in an outage, with and without a breaker"
figure_speech = """
Fifth demo: the bill. [[slnc 400]] Failing closed costs availability. [[slnc 300]] During this outage, the fraud check needs five seconds, and the budget is three hundred milliseconds. [[slnc 300]] Ten customers each buy a coffee. [[slnc 700]]
Each amber block is a call that waited three hundred milliseconds. [[slnc 300]] Without a breaker, all ten coffees call the struggling service, and all ten are refused. [[slnc 600]]
With a breaker, the first three calls fail, and the breaker opens. [[slnc 300]] The other seven coffees are refused at once, shown as thin bars. [[slnc 300]] Still no coffee, but the service is left alone to recover. [[slnc 600]]
On the right, the refusals are counted by reason, and an alert is raised. [[slnc 300]] At the bottom, after the cool down, one trial call works, and the breaker closes again.
"""
