# concept.toml: everything about this project that is not Java code.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "security-misconfiguration"
level = "intermediate"
module = "secure-configuration"
title = "Security Misconfiguration"
short_title = "Security Misconfiguration"
package = "misconfig"
main_class = "MisconfigDemo"
tagline = "The settings nobody changed are the first thing an attacker checks"
bold = "Most breaches of this kind need no clever attack: a default password, a debug page, a directory listing or a stack trace is simply left on, so secure defaults, a startup gate and a checker that runs on every change matter as much as the code."
domain = "an online store"
domain_note = ""
youtube_description = """Security misconfiguration in Java, OWASP Top 10 A02: the settings nobody changed. Explained with an online store, like a shop that fits a strong lock and leaves the spare key in the door. We start the store with its shipped defaults and let a checker find a default admin password, a debug page that prints the secret, a directory listing that shows a backup file, and stack traces in error pages; harden it with secure defaults and a gate that refuses to start with a default secret; catch development settings that drift into production; remove version banners, the TRACE method and a settings file anyone can read; and finish with the bill: a baseline that must be checked on every change, at every startup, and against the live store."""
thumb_lines = ["SECURITY", "MISCONFIGURATION"]
thumb_code = "admin.password=admin"
youtube_title = "Security Misconfiguration in Java (OWASP A02: Defaults, Debug Pages, Drift)"
youtube_tags = ["security misconfiguration", "owasp top 10", "a02", "secure defaults", "hardening", "debug endpoint", "directory listing", "java", "application security"]

[readme]
intro = """
**Security misconfiguration** is number two in the OWASP Top 10 (2025, A02). It needs no clever attack. A product ships with settings that are comfortable for a developer, such as a
**default admin password**, a **debug page** that prints the configuration, a **directory listing** of the static folder, **detailed error pages** with stack traces, a **version banner** and the
**TRACE** method, and nobody turns them off. Scanners try every one of them within minutes of a server going online. The fixes are not new code but a habit. **Secure defaults**: every
setting stated, every risky one off. A **startup gate** that refuses to start a production store with a default secret. A **drift check** that compares production with the baseline. And a
**checker** that tests the live store from outside, as an attacker would.

The demo starts an online store with its shipped settings, lets a checker find what is wrong, hardens it, catches drift from development, and ends with what hardening costs.

Maps to: OWASP Top 10 2025 A02 (Security Misconfiguration); CWE-16 (Configuration), CWE-1188 (insecure default initialization of a resource), CWE-209 (error messages containing sensitive information), CWE-548 (exposure of information through directory listing); OWASP ASVS 5.0, the configuration chapter.
"""
analogy = """
Think of a shop that fits an expensive lock and leaves the spare key hanging in the door, the alarm code written on the wall, and the stockroom door propped open because the
delivery person finds it easier. None of it is a broken lock. Every one of them is a setting someone forgot to change, and a burglar checks those first.
"""
scenario = """
An online store is deployed with the settings it shipped with. The demo checks it from the outside, as an attacker's scanner would, then hardens it, tries to deploy a production profile
that was copied from development, and looks at the smaller leaks: a version banner, the TRACE method and a settings file that other users can read.
"""
costs = [
    "**Hardening is a baseline, not a one-off.** Every new feature adds settings, and every setting has an insecure value, so the baseline and its checks grow with the store.",
    "**A gate can stop a deployment at the worst time.** A store that refuses to start is safer than one that starts insecure, but it needs a clear message and someone on call who can fix the setting.",
    "**Developers lose conveniences.** No debug page, no stack traces in the browser, no directory listing: logs and local profiles have to replace them.",
    "**A passing score is not a secure store.** The checker proves its eight checks pass. Anything it does not check is still open.",
]
too_much = """
For a laptop demo, the shipped settings are fine, and that is exactly why they ship. For anything reachable from a network, the hardened profile, the startup gate and the drift check are
the minimum, and running the checker against the live store on a schedule is cheap insurance.
"""
met_before = [
    "Routers, cameras and databases that ship with `admin`/`admin` and are found by scanners within minutes.",
    "Spring Boot's actuator, Tomcat's manager and other admin consoles left reachable.",
    "Error pages that show a stack trace with class names and versions.",
    "Benchmarks such as the CIS Benchmarks, which are long lists of exactly these settings.",
]
where = """
This project is the first in the intermediate track's **secure-configuration** module ([secure-configuration](..)). It builds on the beginner projects
[http-basics-and-headers](../../../beginner/networking/http-basics-and-headers) and [patching-and-dependency-hygiene](../../../beginner/safe-habits/patching-and-dependency-hygiene).
"""
twin = """
The store is a real HTTP server on the loopback interface of the machine running the demo, on a random port that is never printed. Its settings are properties files written to a temporary
folder, with explicit POSIX permissions, so the output is the same on every run. The production secret is a fixed demo value and is never printed.
"""
test_note = "The store runs on a random loopback port that is never printed, settings files get explicit permissions, and the production secret is a fixed demo value, so the golden output is the same on every run."

[[act]]
title = "The store started with its shipped defaults"
summary = "The default admin password works, the debug page shows the secret, the static folder lists a backup file, errors show stack traces, and the checker scores the store 0 of 8."
detail = """
The store is started with its shipped settings. An admin login with the default password admin succeeds. GET /debug/config answers and the page shows the admin password. GET /static/ lists three files,
including backup-orders.csv. GET /orders?id=abc fails with a stack trace in the page. The checker scores the shipped store 0 of 8: every default is a finding.
"""
speech = """
First demo: the store started with its shipped defaults. [[slnc 400]] An admin login with the default password succeeds. [[slnc 300]] Anyone can log in as admin. [[slnc 600]]
The debug page answers, and it shows the admin password. [[slnc 600]]
The static folder lists its files, including a backup of the orders. [[slnc 600]]
And a bad order number shows a stack trace. [[slnc 600]]
The checker scores the store zero out of eight. [[slnc 300]] Every default is a finding.
"""
rows = { defaults = "active wrong" }
console = [
    ["admin login with the default password admin: 200  <- ANYONE CAN LOG IN AS ADMIN", "bad"],
    ["GET /debug/config: 200, and the page shows the admin password: true", "bad"],
    ["GET /static/: 200, a list of 3 files, including backup-orders.csv: true", "bad"],
    ["GET /orders?id=abc: 500, and the page shows a stack trace: true", "bad"],
    ["the checker scores the shipped store 0 of 8  <- EVERY DEFAULT IS A FINDING", "bad"],
]

[[act]]
title = "Secure defaults, and a gate at startup"
summary = "The hardened profile passes all 8 checks, and the startup gate refuses to start a production store whose admin password is a default or empty."
detail = """
The same store with the hardened profile passes all eight checks: the default password fails, there is no debug page and no listing, errors show only a reference, the Server header names nothing,
TRACE is refused, the settings file is owner-only, and the profile is production with no test settings. The startup gate refuses to start a production store whose admin password is set back to admin, or left empty.
"""
speech = """
Second demo: secure defaults. [[slnc 400]] The same store, with every setting stated and every risky one off. [[slnc 600]]
It passes all eight checks. [[slnc 600]]
And a gate runs before the store opens its port. [[slnc 300]] Set the admin password back to the default, and the store refuses to start. [[slnc 300]] Leave it empty, and it refuses again. [[slnc 600]]
A store that will not start is safer than one that starts insecure.
"""
rows = { hardened = "active ok" }
console = [
    ["the default admin password does not work: pass (POST /admin/login with admin: 401)", "ok"],
    ["no debug page: pass  |  no directory listing: pass  |  errors show no internals: pass", "ok"],
    ["no version in the Server header: pass  |  TRACE is refused: pass  |  owner-only settings file: pass", "ok"],
    ["the checker scores the hardened store 8 of 8", "ok"],
    ["the hardened profile with the admin password set back to admin: refused to start", "ok"],
    ["with an empty admin password: refused to start", "ok"],
]

[[act]]
title = "Drift: development settings that reach production"
summary = "A production file copied from development still has the debug page and detailed errors on and a test setting present; the drift check fails the deployment, and the gate would refuse to start it."
detail = """
Production is made by copying the development file and changing five settings. The drift check finds two settings that still have their development value, debug.endpoint and errors.detailed, and one
development-only setting, test.fake-payments, so it fails the deployment. If it were deployed anyway, the store would refuse to start because a debugging switch is on. The hardened profile, compared the same way, shows no drift.
"""
speech = """
Third demo: drift. [[slnc 400]] Production is made by copying the development file, and changing what someone remembered to change. [[slnc 600]]
Two settings still have their development value. [[slnc 300]] The debug page, and detailed errors. [[slnc 300]] And a test setting for fake payments is still there. [[slnc 600]]
The drift check fails the deployment. [[slnc 300]] And if it were deployed anyway, the gate would refuse to start it. [[slnc 600]]
The hardened profile shows no drift at all.
"""
rows = { drift = "active amber" }
console = [
    ["production made by copying the development file and changing 5 settings", "muted"],
    ["settings that still have their development value: debug.endpoint, errors.detailed", "bad"],
    ["development-only settings present in production: test.fake-payments", "bad"],
    ["the drift check fails the deployment: true", "ok"],
    ["and if it were deployed anyway, the store: refused to start (a debugging switch is on in production)", "ok"],
    ["the hardened profile compared the same way: drift found false", "ok"],
]

[[act]]
title = "Banners, methods and file permissions"
summary = "The shipped store names its product and version and echoes requests to TRACE; the hardened one names nothing and refuses TRACE; a settings file with rw-r--r-- is readable by other users, rw------- is not."
detail = """
The shipped store sends Server: ShopServer/1.4.2 (Java 25), which tells an attacker which advisories to look up; the hardened store sends no Server header. TRACE on the shipped store answers 200 and
echoes the request headers back; the hardened store refuses it with 405. A settings file written with rw-r--r-- is readable by other users on the machine, and it holds the admin secret; written with rw------- it is not.
"""
speech = """
Fourth demo: the smaller leaks. [[slnc 400]] The shipped store names its product and version in every reply. [[slnc 300]] That tells an attacker which advisories to look up. [[slnc 300]] The hardened store names nothing. [[slnc 600]]
The shipped store answers the trace method, and echoes the request back. [[slnc 300]] The hardened one refuses it. [[slnc 600]]
And the settings file holds the admin secret. [[slnc 300]] With the usual permissions, other users on the machine can read it. [[slnc 300]] With owner only permissions, they cannot.
"""
rows = { leaks = "active amber" }
console = [
    ["Server header, shipped: ShopServer/1.4.2 (Java 25)  <- TELLS AN ATTACKER WHICH ADVISORIES TO LOOK UP", "bad"],
    ["Server header, hardened: none", "ok"],
    ["TRACE /, shipped: 200, and the reply echoes the request headers back: true", "bad"],
    ["TRACE /, hardened: 405, the method is refused", "ok"],
    ["the settings file written with rw-r--r--: readable by other users on the machine: true  <- IT HOLDS THE ADMIN SECRET", "bad"],
    ["written with rw-------: readable by other users: false", "ok"],
]

[[act]]
title = "The bill: a baseline that must be checked again and again"
summary = "A new feature adds a setting the baseline has never seen, which is flagged for review; checks belong in CI, at startup and against the live store; a passing score means only that the checks pass."
detail = """
A new feature adds a setting the baseline has never seen, uploads.max-size, and the drift check flags it for review. Every feature adds settings, and every setting has an insecure value, so the baseline
grows with the store. The same checks belong in CI on every change, at every startup, and against the live store on a schedule. A passing score means these eight checks pass, not that the store is secure.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] A new feature adds a setting the baseline has never seen. [[slnc 300]] The drift check flags it for review. [[slnc 600]]
Every feature adds settings. [[slnc 300]] And every setting has an insecure value. [[slnc 300]] So the baseline grows with the store. [[slnc 600]]
The same checks belong in every build, at every startup, and against the live store on a schedule. [[slnc 600]]
And a passing score means these eight checks pass. [[slnc 300]] Not that the store is secure.
"""
rows = { defaults = "active amber", hardened = "active amber" }
console = [
    ["a new feature adds a setting the baseline has never seen: uploads.max-size, flagged for review: true", "amber"],
    ["every feature adds settings, and every setting has an insecure value, so the baseline grows with the store", "amber"],
    ["the same checks belong in CI on every change, at every startup, and against the live store on a schedule", "muted"],
    ["a passing score means these 8 checks pass, not that the store is secure", "amber"],
]

