[poster]
headline = [["SECURITY", "text"], ["MISCONFIGURATION", "accent"]]
taglines = [["The settings nobody changed are the first thing an attacker checks", "gold"]]
before = { code = "admin.password=admin", note = "debug on, listing on, traces on", tag = "BEFORE" }
after = { code = "hardened profile + gate", note = "every setting stated, checked", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "Security Misconfiguration"
narration = """Hello, and welcome. [[slnc 400]] This video explains security misconfiguration, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A misconfiguration is a setting left at an insecure value. [[slnc 300]] A default password. [[slnc 300]] A debug page. [[slnc 300]] A stack trace in an error page. [[slnc 300]] It is number two in the O W A S P top ten: the open worldwide application security project's list of the ten biggest risks for web applications. [[slnc 600]] Think of a shop that fits an expensive lock, and leaves the spare key hanging in the door. [[slnc 300]] Nothing is broken. [[slnc 300]] Someone just forgot to change a setting, and a burglar checks those first. [[slnc 700]] In this video, the domain is an online store. [[slnc 500]] By the end, you will hear what a scanner tries first. [[slnc 300]] How secure defaults and a startup gate stop it. [[slnc 300]] How settings drift from development into production. [[slnc 300]] And why the checks must run again and again."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online store goes online", "with the settings it shipped with.", "", "Within minutes, scanners try", "its admin login, its debug pages,", "its folders and its error pages."]
narration = """Here is the scenario. [[slnc 400]] An online store goes online with the settings it shipped with. [[slnc 500]] Within minutes, automated scanners on the internet try its admin login. [[slnc 300]] Its debug pages. [[slnc 300]] Its folders. [[slnc 300]] And its error pages."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["Default: the value a product ships with", "Secure default: a safe value nobody has to remember", "Hardening: turning risky settings off", "Drift: production settings that no longer match the baseline", "Baseline: the agreed secure settings"]
narration = """Before the demos, the words. [[slnc 500]] A default is the value a product ships with. [[slnc 500]] A secure default is a safe value that nobody has to remember to set. [[slnc 500]] Hardening is turning risky settings off. [[slnc 500]] A baseline is the agreed list of secure settings. [[slnc 500]] And drift is when production no longer matches the baseline."""

[[scene]]
key = "03-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "03-two-files"
kind = "figure"
title = "One store, two settings files"
body = "two_files"
narration = """Let's see the whole idea on one picture. [[slnc 400]] On the left, the settings file the store ships with. [[slnc 300]] On the right, the hardened file for production. [[slnc 700]] The keys are the same. [[slnc 300]] Only the values differ. [[slnc 600]] Shipped: the admin password is admin. [[slnc 300]] The debug page, the folder listing, detailed errors and the trace method are all on. [[slnc 300]] The banner names the product and its version. [[slnc 300]] And a test setting for fake payments is still there. [[slnc 600]] Hardened: a long secret, every switch false, an empty banner, and no test settings. [[slnc 700]] Not one line of code changed. [[slnc 300]] A misconfiguration is a value nobody changed, and the fix is to state every value on purpose."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "11-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["admin / admin on routers and databases", "Admin consoles left reachable", "Stack traces in error pages", "Hardening benchmarks"]
narration = """You have probably met this already. [[slnc 400]] Routers, cameras and databases that ship with admin, admin. [[slnc 500]] Admin consoles left reachable from the internet. [[slnc 500]] Error pages that show a stack trace. [[slnc 500]] And hardening benchmarks, which are long lists of exactly these settings."""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["State every setting in production", "Turn off debug, listings, traces, banners", "Refuse to start with a default secret", "Compare with the baseline before deploying", "Check the live store on a schedule"]
narration = """So, how do you use it? [[slnc 400]] State every setting in the production profile. [[slnc 500]] Turn off debug pages, listings, stack traces and banners. [[slnc 500]] Refuse to start with a default or empty secret. [[slnc 500]] Compare production with the baseline before every deployment. [[slnc 500]] And check the live store on a schedule."""

[[scene]]
key = "12-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "13-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a check for a missing", "content security policy, and make the store pass it."]
narration = """That's security misconfiguration. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] The settings nobody changed are the first thing an attacker checks, so state every setting, refuse insecure defaults, and check again on every change. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine, with nothing installed except a Java development kit. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a check for a missing content security policy, and make the hardened store pass it. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
The settings of an online store: the profile it runs with, its admin secret, its debugging switches, its error pages, its banners and methods, and the file that holds them. It covers
internet scanners, other users on the store's host, and a delivery pipeline that builds production settings. It does not cover the operating system, TLS or the application's code.
"""
assets = [
    "The admin account and its password.",
    "The store's configuration and internal details: classes, paths, versions.",
    "Files in the static folder that were never meant to be public, such as a backup of orders.",
    "The production settings file.",
]
actors = [
    "Automated internet scanners that try every default.",
    "Another user on the same machine.",
    "The delivery pipeline and the people who edit settings files.",
]
boundaries = [
    "Internet to the store: every request crosses it.",
    "Settings file to the other users of the host: file permissions are the guard.",
    "Development to production: the pipeline that copies and edits settings.",
]
assumptions = [
    "The production secret is injected at deployment and is long and random; in the demo it is a fixed demo value that is never printed.",
    "The store's host is maintained; operating system hardening is out of scope.",
    "The checker's eight checks are a baseline, not a complete audit.",
]
out_of_scope = [
    "Framework settings such as Spring Boot's actuator: the tools version.",
    "Operating system and container hardening.",
    "TLS configuration.",
]
tests = [
    "`StoreAndCheckerTest` checks that the shipped store fails all eight checks and the hardened store passes them, and each leak on its own.",
    "`GateAndDriftTest` checks the startup gate, the drift check, settings parsing, password comparison and file permissions.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next project, fail-closed-error-handling, looks at what happens when something goes wrong at run time: errors that leak, and checks that fail open.
"""

[[threat]]
id = "T1"
stride = "S"
threat = "Someone logs in as admin with the default password"
where = "`StoreServer` admin login"
control = "The startup gate refuses an empty, short or known default admin password in production"
residual = "A strong password can still leak: the admin console should also be unreachable from the internet and use a second factor"

[[threat]]
id = "T2"
stride = "I"
threat = "A debug page reveals the configuration and its secrets"
where = "`/debug/config`"
control = "Off in the hardened profile, refused by the gate in production, and checked from outside"
residual = "Other diagnostic endpoints added later need the same treatment"

[[threat]]
id = "T3"
stride = "I"
threat = "A directory listing or a detailed error page reveals files and internals"
where = "`/static/`, error pages"
control = "No listing; errors show a reference only, with details in the logs"
residual = "Files that should not be public must not be in the static folder at all"

[[threat]]
id = "T4"
stride = "T"
threat = "Development settings drift into production"
where = "`ProfileDrift`, the pipeline"
control = "The drift check fails the deployment, and the gate refuses to start"
residual = "The check knows only the settings in its baseline; new settings are flagged for review, not judged"

[[threat]]
id = "T5"
stride = "I"
threat = "Banners and methods tell an attacker what the store runs and echo requests"
where = "Server header, TRACE"
control = "No product or version in headers; TRACE and unknown methods refused"
residual = "Products can still be fingerprinted in other ways, so patching matters more than hiding"

[[threat]]
id = "T6"
stride = "I"
threat = "Another user on the host reads the settings file and its secret"
where = "`ConfigFile`"
control = "The settings file is readable by its owner only"
residual = "Secrets are better injected from a secrets manager than kept in a file at all"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] The store is a real web server from the Java development kit, on this machine only, and its settings are plain properties files. [[slnc 300]] Here are the classes that matter."""

[[class]]
name = "StoreServer"
what = "the store: what it exposes depends only on its settings"
[[class.part]]
title = "a debug page and detailed errors, behind a switch"
code = """
} else if (path.equals("/debug/config") && config.debugEndpoint()) {
    send(exchange, 200, debugPage());
...
if (config.detailedErrors()) {
    ...
    send(exchange, 500, "<h1>Error</h1><pre>" + trace + "</pre>");
} else {
    send(exchange, 500, SAFE_ERROR);
...
return "profile=" + config.profile() + "\\nadmin.password=" + config.adminPassword()
"""
speech = """The store has no bug in the usual sense. [[slnc 300]] The debug page and the stack trace are features, each behind a switch. [[slnc 300]] With the switch off, an error shows only a reference number."""

[[class]]
name = "ConfigChecker"
what = "eight checks from outside, the way a scanner works"
[[class.part]]
title = "one check: send a request, judge the reply"
code = """
Reply debug = send("GET", "/debug/config", null);
checks.add(new Check("debug page", debug.status() == 404,
        "GET /debug/config -> " + debug.status()));
...
static int score(List<Check> checks) {
    return (int) checks.stream().filter(Check::passed).count();
"""
speech = """Each check sends one real request and judges the reply. [[slnc 300]] The debug page must answer four oh four. [[slnc 300]] The score is the number of checks that passed."""

[[class]]
name = "StartupGate"
what = "refuses to start production with a weak secret or a debugging switch"
[[class.part]]
title = "runs before the port opens"
code = """
if (!"prod".equals(config.profile())) {
    return;
}
String weakness = Secrets.weakness(config.adminPassword());
if (!weakness.isEmpty()) {
    throw new InsecureConfigException("admin password " + weakness);
}
if (config.debugEndpoint() || config.detailedErrors() || config.traceAllowed()) {
    throw new InsecureConfigException("a debugging switch is on in production");
"""
speech = """The gate runs before the server opens its port, and only for the production profile. [[slnc 300]] A weak password or any debugging switch throws, so the store never starts."""

[[class]]
name = "Secrets"
what = "the rules for a production admin password"
[[class.part]]
title = "empty, a known default, or too short"
code = """
if (lower.isEmpty()) {
    return "is empty";
}
if (KNOWN_DEFAULTS.contains(lower)) {
    return "is a known default";
}
if (lower.length() < MIN_LENGTH) {
    return "has " + lower.length() + " characters, under " + MIN_LENGTH;
"""
speech = """The password rules return the reason, not just yes or no. [[slnc 300]] So the person on call reads exactly which setting to fix."""

[[class]]
name = "ProfileDrift"
what = "compares production with development and the baseline"
[[class.part]]
title = "three kinds of drift"
code = """
if (prod != null && prod.equals(development.getProperty(key))) {
    still.add(key);
...
if (key.startsWith("test.")) {
    devOnly.add(key);
} else if (!baseline.containsKey(key)) {
    unreviewed.add(key);
"""
speech = """Drift comes in three kinds. [[slnc 300]] A setting that still has its development value. [[slnc 300]] A development only key. [[slnc 300]] And a key the baseline has never seen, which someone must review."""

[[class]]
name = "ConfigFile"
what = "the settings file on disk, and who may read it"
[[class.part]]
title = "explicit permissions"
code = """
Files.setPosixFilePermissions(file, PosixFilePermissions.fromString(permissions));
...
Set<PosixFilePermission> p = Files.getPosixFilePermissions(file);
return p.contains(GROUP_READ) || p.contains(OTHERS_READ);
"""
speech = """The file is written with explicit permissions, never the machine's default. [[slnc 300]] If the group or others may read it, they may read the admin secret."""

[[acronym]]
short = "OWASP"
long = "Open Worldwide Application Security Project (Top 10 web risks)"
say = "O W A S P is the open worldwide application security project. Its top ten lists the biggest risks for web applications. Misconfiguration is number two."
[[acronym]]
short = "HTTP"
long = "HyperText Transfer Protocol: GET reads, POST sends, TRACE echoes"
say = "H T T P is the hypertext transfer protocol, the language of the web. Get reads a page, post sends a form, and trace echoes the request back."
[[acronym]]
short = "200, 401, 404, 405, 500"
long = "status codes: OK, wrong login, not found, bad method, error"
say = "Status codes: two hundred is O K. Four oh one, not authorised. Four oh four, not found. Four oh five, method not allowed. Five hundred, a server error."
[[acronym]]
short = "CSV"
long = "Comma-Separated Values: a plain-text table"
say = "C S V is comma separated values: a table in plain text, like the backup of the orders."
[[acronym]]
short = "CI"
long = "Continuous Integration: every change built and checked"
say = "C I is continuous integration: every change is built and checked automatically, before it is deployed."

