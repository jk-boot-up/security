[[act]]
title = "Drift: development settings that reach production"
summary = "Production is the development file with 5 settings changed; debug.endpoint and errors.detailed are still true in both, test.fake-payments is still there; the drift check fails the deployment and the gate would refuse it; the hardened profile shows no drift."
detail = """
Production is made by copying the development file and changing 5 settings: profile=prod, the production secret, static.listing=false, an empty server.banner and http.trace=false.
The drift check goes setting by setting through the six that must differ from development: admin.password, static.listing, server.banner and http.trace changed, but debug.endpoint and errors.detailed are true in both. Then key by key: test.fake-payments is a development-only key.
Drift found: true, so the deployment fails. If it were deployed anyway, the gate refuses it: a debugging switch is on in production. The hardened profile, checked the same way, shows no drift.
"""
figure = "drift_table"
figure_title = "A production file copied from development"
figure_speech = """
Third demo: drift. [[slnc 400]] Production is made by copying the development file, and changing what someone remembered to change. [[slnc 700]]
Each row is one setting. [[slnc 300]] The development value, the value in the production copy, and the drift check's verdict. [[slnc 600]]
The password, the listing, the banner and trace were changed. [[slnc 300]] Green. [[slnc 300]] But the debug page and detailed errors are still true, exactly as in development. [[slnc 300]] And the fake payments test setting came along with the copy. [[slnc 700]]
So the drift check fails the deployment. [[slnc 300]] And even if someone deployed it anyway, the gate refuses to start it.
"""
speech = """
