[docs.problem]
scenario = """
An online store goes online with the settings it shipped with. Within minutes, automated scanners on the internet try its admin login, its debug paths, its static folders and its error pages.
"""
naive = """
Deploy the settings that worked on the developer's laptop, and change the ones someone remembers. Each forgotten setting is an open door, and the developer's comfort is the attacker's map.
"""
deliver = [
    "A real store on loopback whose behaviour depends only on its settings.",
    "A checker that tests the live store from outside and its settings file from inside, with a score.",
    "A hardened production profile in which every setting is stated.",
    "A startup gate that refuses to start production with a default secret or a debugging switch.",
    "A drift check that compares production with development and the baseline.",
    "The same output on every run.",
]

[docs.prerequisites]
required = [
    "Java basics",
    "The beginner project http-basics-and-headers, or an idea of HTTP requests, statuses and headers",
]
not_required = [
    "Any framework: the server is the JDK's own",
    "A scanner: the checker is written in the project",
]
install = []

[docs.session]
objectives = [
    "name the common misconfigurations a scanner tries first",
    "explain secure defaults and why every setting should be stated",
    "describe a startup gate and a drift check, and when each runs",
    "explain why a passing checker is not proof of security",
]
walkthrough = """
Start with the spare key in the door. Run the demo one act at a time. After act one, ask which finding an attacker would try first. After act two, ask what the team on call needs when the
gate refuses to start. In act three, ask how production files are made in the group's own projects. In act five, ask which settings the checker does not cover.
"""
exercises = [
    "Add a check for a missing `Content-Security-Policy` header and make the hardened store pass it.",
    "Add an `allowed.origins` setting with a wildcard default and teach the gate to refuse it in production.",
    "Make the checker fail when the Server header names the product even without a version.",
    "Write the drift check as a test that fails the build when production differs from the baseline.",
]

[docs.explained]
sentence = """
Security misconfiguration is a setting left at an insecure value, such as a default password, a debug page or a stack trace, and the defence is secure defaults, a gate that refuses to start production with them, a drift check against a baseline, and a checker that runs on every change.
"""
verdict = """
State every setting in the production profile. Turn off debug pages, listings, detailed errors, version banners and unused methods. Refuse to start with a default or empty secret. Compare
production with the baseline before every deployment, run the checker against the live service on a schedule, and keep settings files readable by their owner only.
"""
recognise = [
    "Scanner reports that list `admin`/`admin`, `/actuator`, `/debug` or directory listings.",
    "Error pages with class names, file paths and versions.",
    "`Server` and `X-Powered-By` headers with product versions.",
    "CIS Benchmark results and hardening guides.",
]

[spec]
purpose = """
Teach security misconfiguration by starting a real store with its shipped settings, checking it from outside, hardening it with secure defaults, a startup gate and a drift check, and showing the smaller leaks.
"""
nongoals = [
    "Framework-specific settings such as Spring Boot's actuator: the tools version.",
    "Operating system hardening: the platform-hardening module.",
    "TLS settings: the tls-in-practice module.",
]
problem = """
Teams fix code and forget settings; most misconfigurations are defaults that nobody changed, and they are found by scanners first.
"""
roles = [["Settings", "`StoreConfig`, `Profiles`"], ["The store", "`StoreServer`"], ["Outside checks and score", "`ConfigChecker`"], ["Startup gate", "`StartupGate`"], ["Drift check", "`ProfileDrift`"], ["Settings file permissions", "`ConfigFile`"], ["Secret comparison", "`Secrets`"], ["Entry point", "`MisconfigDemo`"]]
requirements = [
    "The shipped store fails all eight checks and the hardened store passes them all.",
    "The startup gate refuses a production store with an empty, short or default admin password, a debugging switch or a test setting.",
    "The drift check finds development values, development-only settings and unreviewed settings.",
    "Errors show a reference and no internals; TRACE and unknown methods are refused.",
    "The demo prints the same output on every run.",
]

