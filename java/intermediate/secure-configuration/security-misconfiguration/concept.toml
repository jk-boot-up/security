narration = """Let's put the checks in order. [[slnc 400]] In the build, the drift check compares production with the baseline. [[slnc 500]] At startup, the gate refuses default secrets and debugging switches. [[slnc 500]] Against the live store, the checker tests from outside, as an attacker would. [[slnc 500]] And on a schedule, the same checker runs again, because settings change."""

[[scene]]
key = "10-roles"
kind = "bullets"
title = "Who Does What"
body = ["StoreConfig and Profiles: the settings", "StoreServer: the store", "ConfigChecker: eight outside checks", "StartupGate: refuses production defaults", "ProfileDrift: production against the baseline"]
narration = """Here is who does what in the code. [[slnc 400]] The store config and profiles classes hold the settings. [[slnc 500]] The store server behaves exactly as the settings say. [[slnc 500]] The config checker runs eight checks from outside, and scores them. [[slnc 500]] The startup gate refuses to start production with defaults. [[slnc 300]] And the profile drift class compares production with the baseline."""

[[scene]]
key = "11-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["admin / admin on routers and databases", "Admin consoles left reachable", "Stack traces in error pages", "Hardening benchmarks"]
narration = """You have probably met this already. [[slnc 400]] Routers, cameras and databases that ship with admin, admin. [[slnc 500]] Admin consoles left reachable from the internet. [[slnc 500]] Error pages that show a stack trace. [[slnc 500]] And hardening benchmarks, which are long lists of exactly these settings."""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["State every setting in production", "Turn off debug, listings, traces, banners", "Refuse to start with a default secret", "Compare with the baseline before deploying", "Check the live store on a schedule"]
narration = """So, how do you use it? [[slnc 400]] State every setting in the production profile. [[slnc 500]] Turn off debug pages, listings, stack traces and banners. [[slnc 500]] Refuse to start with a default or empty secret. [[slnc 500]] Compare production with the baseline before every deployment. [[slnc 500]] And check the live store on a schedule."""

[[scene]]
key = "13-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a check for a missing", "content security policy, and make the store pass it."]
narration = """That's security misconfiguration. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] The settings nobody changed are the first thing an attacker checks, so state every setting, refuse insecure defaults, and check again on every change. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine, with nothing installed except a Java development kit. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a check for a missing content security policy, and make the hardened store pass it. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
The settings of an online store: the profile it runs with, its admin secret, its debugging switches, its error pages, its banners and methods, and the file that holds them. It covers
internet scanners, other users on the store's host, and a delivery pipeline that builds production settings. It does not cover the operating system, TLS or the application's code.
"""
assets = [
    "The admin account and its password.",
    "The store's configuration and internal details: classes, paths, versions.",
    "Files in the static folder that were never meant to be public, such as a backup of orders.",
    "The production settings file.",
]
actors = [
    "Automated internet scanners that try every default.",
    "Another user on the same machine.",
    "The delivery pipeline and the people who edit settings files.",
]
boundaries = [
    "Internet to the store: every request crosses it.",
    "Settings file to the other users of the host: file permissions are the guard.",
    "Development to production: the pipeline that copies and edits settings.",
]
assumptions = [
    "The production secret is injected at deployment and is long and random; in the demo it is a fixed demo value that is never printed.",
    "The store's host is maintained; operating system hardening is out of scope.",
    "The checker's eight checks are a baseline, not a complete audit.",
]
out_of_scope = [
    "Framework settings such as Spring Boot's actuator: the tools version.",
    "Operating system and container hardening.",
    "TLS configuration.",
]
tests = [
    "`StoreAndCheckerTest` checks that the shipped store fails all eight checks and the hardened store passes them, and each leak on its own.",
    "`GateAndDriftTest` checks the startup gate, the drift check, settings parsing, password comparison and file permissions.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next project, fail-closed-error-handling, looks at what happens when something goes wrong at run time: errors that leak, and checks that fail open.
"""

[[threat]]
id = "T1"
stride = "S"
threat = "Someone logs in as admin with the default password"
where = "`StoreServer` admin login"
control = "The startup gate refuses an empty, short or known default admin password in production"
residual = "A strong password can still leak: the admin console should also be unreachable from the internet and use a second factor"

[[threat]]
id = "T2"
stride = "I"
threat = "A debug page reveals the configuration and its secrets"
where = "`/debug/config`"
control = "Off in the hardened profile, refused by the gate in production, and checked from outside"
residual = "Other diagnostic endpoints added later need the same treatment"

[[threat]]
id = "T3"
stride = "I"
threat = "A directory listing or a detailed error page reveals files and internals"
where = "`/static/`, error pages"
control = "No listing; errors show a reference only, with details in the logs"
residual = "Files that should not be public must not be in the static folder at all"

[[threat]]
id = "T4"
stride = "T"
threat = "Development settings drift into production"
where = "`ProfileDrift`, the pipeline"
control = "The drift check fails the deployment, and the gate refuses to start"
residual = "The check knows only the settings in its baseline; new settings are flagged for review, not judged"

[[threat]]
id = "T5"
stride = "I"
threat = "Banners and methods tell an attacker what the store runs and echo requests"
where = "Server header, TRACE"
control = "No product or version in headers; TRACE and unknown methods refused"
residual = "Products can still be fingerprinted in other ways, so patching matters more than hiding"

[[threat]]
id = "T6"
stride = "I"
threat = "Another user on the host reads the settings file and its secret"
where = "`ConfigFile`"
control = "The settings file is readable by its owner only"
residual = "Secrets are better injected from a secrets manager than kept in a file at all"
