[[act]]
title = "Banners, methods and file permissions"
summary = "The shipped store's Server header names ShopServer/1.4.2 (Java 25), the hardened one sends none; TRACE with a cookie is echoed back by the shipped store and refused with 405 by the hardened one; a settings file with rw-r--r-- lets other users read the secret, rw------- does not."
detail = """
GET / to both stores: the shipped one answers with Server: ShopServer/1.4.2 (Java 25), which names the version an attacker can look up advisories for; the hardened one sends no Server header.
TRACE / with the customer's cookie, session=c0ffee42: the shipped store answers 200 and echoes Cookie: session=c0ffee42 back in the body; the hardened store answers 405 method not allowed.
The settings file's mode is three groups of three letters, for the owner, the group and others. rw-r--r-- gives the group and others r, read, so other users on the machine can read the admin secret; rw------- gives them nothing.
"""
figure = "small_leaks"
figure_title = "Three small leaks"
figure_speech = """
Fourth demo: three small leaks. [[slnc 400]] On the left, the server header. [[slnc 300]] The shipped store names its product and its exact version, in every reply. [[slnc 300]] An attacker looks up the advisories for that version. [[slnc 300]] The hardened store sends nothing. [[slnc 700]]
In the middle, the trace method. [[slnc 300]] We send it with the customer's session cookie. [[slnc 300]] The shipped store echoes the request back, cookie included. [[slnc 300]] A script that can send trace can read a cookie it was never meant to see. [[slnc 300]] The hardened store refuses: four oh five. [[slnc 700]]
On the right, the settings file's mode. [[slnc 300]] Three letters for the owner, three for the group, three for everyone else. [[slnc 300]] With r in the group and others, any user on the machine can read the admin secret. [[slnc 300]] With dashes, nobody else can.
"""
speech = """
Here is the output. [[slnc 400]] The request to both stores: get slash. [[slnc 300]] The server header: a product and version from the shipped store, nothing from the hardened one. [[slnc 400]] Then trace, with a session cookie. [[slnc 300]] The shipped store echoes the cookie. [[slnc 300]] The hardened one answers four oh five.
[[page]]
The settings file on disk. [[slnc 300]] Read and write for the owner, read for the group, read for others: other users can read the secret. [[slnc 300]] Read and write for the owner, and nothing for anyone else: they cannot.
"""
rows = { leaks = "active amber" }
console = [
