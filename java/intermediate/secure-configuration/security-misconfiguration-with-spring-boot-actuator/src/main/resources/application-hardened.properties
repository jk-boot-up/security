# Operations on their own loopback port, an explicit list of endpoints, and a read-only switch for the one that can change things.
management.server.port=0
management.server.address=127.0.0.1
management.endpoints.web.exposure.include=health,info,loggers
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=OPS
management.endpoint.loggers.access=read-only
