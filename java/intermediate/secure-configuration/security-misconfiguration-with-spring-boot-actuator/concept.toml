    "run a checker against a live store and read its findings",
]
walkthrough = """
Run act one and ask which endpoint hurts most. In act two ask why masking does not help once a heap dump is allowed. In act three ask which of the four settings you would lose first in a rushed deployment.
"""
exercises = [
    "Add a ninth check: the info endpoint shows no build or git details to strangers.",
    "Put the operations port behind a second interface address and test that the customers' address refuses it.",
    "Add a custom `@Endpoint` that lists open refunds, and decide its role and its access level.",
    "Write a test that fails whenever a new endpoint appears in the operator's list.",
]

[docs.explained]
sentence = """
Actuator is a window into the running store, so the settings that decide who can look through it, and at what, are the security of the store.
"""
verdict = """
Never expose everything on a port that customers can reach. Put operations on their own port, list the endpoints you need, require a role for all but health, show details only to that role, make read-only what must not change, leave the heap dump and shutdown off, and run the checker on every change.
"""
recognise = [
    "`exposure.include=*` in a copied tutorial.",
    "Health details shown to everyone because a load balancer needed them.",
    "A heap dump sent to a support team.",
    "A `management.endpoint.*.access=unrestricted` line with no comment.",
]

[spec]
purpose = """
Teach the security settings of Spring Boot Actuator: exposure, values, access, port and login rules.
"""
nongoals = [
    "Monitoring, metrics dashboards or alerting.",
    "Securing the store's own business routes beyond what the demo needs.",
    "Kubernetes probes and service meshes.",
]
problem = """
Teams copy a tutorial's actuator settings into production, and a stranger can read secrets, map the routes, download memory and stop the store.
"""
roles = [["The store", "`StoreApp`, `ShopController`"], ["Security rules", "`StoreSecurity`"], ["The checker", "`ActuatorChecker`"], ["Running stores", "`Running`, `Wire`"], ["Entry point", "`ActuatorSpringDemo`"]]
requirements = [
    "With the tutorial setting, a stranger reads the payment key from the environment and from a heap dump.",
    "With no settings, only health is offered and it shows a status.",
    "With include=* alone, values are masked and heapdump and shutdown stay off.",
    "The hardened store uses a separate port, a short list, role rules and read-only loggers.",
    "A customer login is not an operator login.",
    "The checker changes nothing in the store it checks.",
    "The demo prints the same output on every run.",
]

