[readme]
intro = """
The plain [security-misconfiguration](../security-misconfiguration) project builds the settings checker from scratch. This one uses the part of a real Spring Boot store that was made to be looked into: **Spring Boot Actuator 4.1**, in real servers on the loopback address.

What it shows:
- **The setting from a tutorial**, `management.endpoints.web.exposure.include=*`, with values shown, health details on and two switches turned on. A stranger reads the **payment key and the database password** from `/actuator/env`, sees the unlisted refund route in `/actuator/mappings`, downloads a **heap dump** that contains the key, changes a log level and stops the store with `POST /actuator/shutdown`. The checker scores it 0 of 8.
- **What Spring Boot already does.** With no settings the list offers `health` only and shows a status, not components. With `include=*` alone values are masked as `******`, and `heapdump` and `shutdown` stay off until their access is set. But names and routes are still open, and once the dump is allowed it contains the key that the environment page masked.
- **The hardened store.** Operations on their **own loopback port**, an explicit list (`health`, `info`, `loggers`), Spring Security rules (health open, everything else for the `OPS` role), health details only for that role, and `loggers` set to **read-only access**. The checker scores it 8 of 8.
- **Who may read and who may change.** A customer login is not an operator login, and an operator who posts a new log level gets 405.
- **The bill.** One line of `include=*` added "to debug something" costs a check, and the login rules still keep strangers out, which is why the port, the list, the rules and the access levels are four separate settings.

**Maps to:** OWASP Top 10 (2025) A02 Security Misconfiguration · CWE-16 · CWE-200 · CWE-215 (sensitive information in debugging code) · OWASP ASVS 5.0, the configuration chapter · Spring Boot's own production-ready features guide.
"""
analogy = """
A shop where the staff-only door has a sign that says "STAFF" and no lock, and behind it hang the safe's combination, the plan of every back room and a camera feed of the stockroom. The sign is a setting. The lock is another one.
"""
scenario = """
An online store on Spring Boot with Actuator for its health checks. The demo starts the real application five times, in different configurations, and talks to it over HTTP the way a scanner would.
"""
costs = [
    "**A separate port needs a firewall rule or a network policy,** and the monitoring system must be told where to look.",
    "**Operators need accounts,** and every account is something to rotate and to remove when someone leaves.",
    "**A short list means a request to add an endpoint,** and someone must review it, which is slower than typing `*`.",
    "**Read-only access removes conveniences** such as changing a log level on a running store; a deployment or a restart replaces them.",
    "**A passing score is not a secure store.** The checker proves its eight checks pass; anything else is still open.",
]
too_much = """
For a laptop demo, exposing everything is fine, and that is exactly why tutorials do it. For anything reachable from a network, the separate port, the list and the rules are the minimum, and the checker is cheap enough to run on every change.
"""
met_before = [
    "`management.endpoints.web.exposure.include=*` in a copied tutorial.",
    "`/actuator/health` used as a load balancer check, with details switched on.",
    "A heap dump attached to a support ticket.",
    "An internal URL that was never meant to be internal, found by a scanner.",
]
where = """
This is the tools version of [security-misconfiguration](../security-misconfiguration), in the [secure-configuration](..) module. It follows the same story, an online store whose shipped settings give too much away, on a real framework.
"""
twin = """
The stores are real Spring Boot applications on Tomcat, with Actuator and Spring Security 7. The secrets are fixed demo values. Only statuses and booleans are printed, never ports, paths or disk sizes, so the demo prints the same text on every run.
"""
test_note = "Each test starts a real store on free loopback ports and stops it. Nothing is printed that changes between runs."

[[act]]
title = "Expose everything"
summary = "With the tutorial setting, a stranger reads the payment key and the database password, lists the unlisted refund route, downloads a heap dump containing the key, changes a log level and stops the store; the checker scores 0 of 8."
detail = """
The store starts with `include=*`, values shown, health details on, and the heap dump and shutdown switches turned on. The list at `/actuator` offers env, heapdump, mappings and shutdown, and the customers' port and the operations port are the same port. `/actuator/env` shows the payment key and the database password. `/actuator/mappings` lists `/internal/refunds`. The health page shows its components. The heap dump downloads with status 200 and contains the payment key. A post to the loggers endpoint changes a level with no login. The checker scores the store 0 of 8, and a post to `/actuator/shutdown` returns 200 and the store stops answering.
"""
speech = """
First demo: the store with the settings from a tutorial. [[slnc 400]] Expose everything. [[slnc 600]]
A stranger reads the payment key and the database password from the environment page. [[slnc 600]]
The route map lists a refund route that customers are never told about. [[slnc 600]]
The heap dump downloads, and the payment key is inside it. [[slnc 600]]
A log level changes with no login. [[slnc 300]] The checker scores the store zero out of eight. [[slnc 600]]
And one post to shutdown stops the store.
"""
rows = { all = "active wrong" }
console = [
    ["GET /actuator/env/shop.payment.api-key -> the page shows the payment key", "bad"],
    ["GET /actuator/heapdump -> 200, and the dump contains the payment key", "bad"],
    ["the checker scores the store 0 of 8", "bad"],
    ["POST /actuator/shutdown -> 200, and the store stops answering", "bad"],
]

[[act]]
title = "What Spring Boot already does"
summary = "With no settings only health is listed, with include=* values are masked and the heap dump and shutdown stay off, but names and routes are open and an allowed heap dump contains the key that env masked."
detail = """
With no settings at all the list offers `health` only, `/actuator/env` is 404 and health shows a status, not components. With `include=*` and nothing else the payment key is shown as `******`, but the property names and the route map are still open, and `/actuator/heapdump` and `POST /actuator/shutdown` answer 404 until their access is set. With one more line, heapdump access unrestricted, the key is masked in the environment page and yet the dump contains it: masking hides values, not memory.
"""
speech = """
Second demo: what Spring Boot already does. [[slnc 400]] With no settings, only health is listed, and it shows a status and nothing more. [[slnc 600]]
With everything exposed, values are masked. [[slnc 300]] But the property names and the route map are still open. [[slnc 600]]
The heap dump and shutdown stay off until someone turns them on. [[slnc 600]]
Turn on the heap dump, and the key that the environment page masked is inside it. [[slnc 300]] Masking hides values, not memory.
"""
rows = { boot = "active ok" }
console = [
    ["no settings: the list offers health only", "ok"],
    ["include=*: the payment key is shown as ******", "ok"],
    ["the property names and the route map are still open", "amber"],
    ["heapdump access unrestricted: the dump contains the key", "bad"],
]

[[act]]
title = "Hardened: another port, a short list, rules"
summary = "Operations sit on their own loopback port with health, info and loggers only; strangers see a status, nothing else is reachable even for an operator, and the checker scores 8 of 8."
detail = """
The hardened store puts operations on a different port from the customers. `GET /products` works on the customers' port, and `/actuator/health` there is refused whether or not the caller has a login. On the operations port health answers 200 with status UP and no components, and env, heapdump, mappings, beans and shutdown are refused even for an operator. The checker scores the store 8 of 8.
"""
speech = """
Third demo: hardened. [[slnc 400]] Operations are on their own port, not the customers' port. [[slnc 600]]
Only health, info and loggers are on the list. [[slnc 600]]
A stranger sees a status and nothing else. [[slnc 600]]
Environment, heap dump, route map and shutdown are refused, even for an operator. [[slnc 300]] The checker scores the store eight out of eight.
"""
rows = { hard = "active ok" }
console = [
    ["the operations port is a different port", "ok"],
    ["GET /actuator/health on the customers' port -> 401", "ok"],
    ["GET /actuator/env as an operator -> 403", "ok"],
    ["the checker scores the hardened store 8 of 8", "ok"],
]

[[act]]
title = "Who may read, and who may change"
summary = "Loggers are for operators only, health details too, and the loggers endpoint is read-only: an operator who posts a new level gets 405 and the level stays."
detail = """
`GET /actuator/loggers/ROOT` answers 401 with no login, 403 for a customer and 200 for an operator. Health shows its components to the operator and not to the customer. The operator posts DEBUG to the loggers endpoint and gets 405, and the level is still OFF, because `management.endpoint.loggers.access=read-only` removes the write operation even for the role that may read.
"""
speech = """
Fourth demo: who may read, and who may change. [[slnc 400]] The loggers page needs a login. [[slnc 300]] A customer is refused. [[slnc 300]] An operator may read it. [[slnc 600]]
Health details are shown to the operator only. [[slnc 600]]
And the operator cannot change a log level, because the endpoint is read only. [[slnc 300]] The answer is four oh five.
"""
rows = { roles = "active ok" }
console = [
    ["GET /actuator/loggers/ROOT: no login 401, customer 403, operator 200", "ok"],
    ["health components: customer false, operator true", "ok"],
    ["the operator posts DEBUG -> 405, the level is still OFF", "ok"],
]

[[act]]
title = "The bill"
summary = "One line of include=* added to the hardened store costs a check, the login rules still keep strangers out, and the checker belongs in CI."
detail = """
A developer adds `include=*` to the hardened store to debug something. The checker scores 7 of 8: the route map is now readable by an operator. A stranger asking for `/actuator/env` still gets 401, because the port, the list, the rules and the access levels are four separate settings and one of them failed while the others held. The same checks belong in CI on every change, because a dependency can add endpoints and a property can switch them on. A passing score means these 8 checks pass, not that the store is secure.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] A developer adds one line, expose everything, to debug something. [[slnc 600]]
The checker now scores seven out of eight. [[slnc 600]]
A stranger still gets nothing, because the port, the list, the rules and the access levels are four separate settings. [[slnc 600]]
The checks belong in the build, on every change. [[slnc 300]] A passing score means eight checks pass, not that the store is secure.
"""
rows = { bill = "active ok" }
console = [
    ["include=* added to the hardened store -> 7 of 8", "amber"],
    ["found: route map hidden, even from an operator (200)", "bad"],
    ["GET /actuator/env without a login -> 401", "ok"],
]

