[threatmodel]
scope = """
A Spring Boot store with Actuator, on loopback ports. It covers what the actuator endpoints reveal and allow, and the settings that control them. It does not cover the store's business logic or the host.
"""
assets = [
    "The payment key and the database password.",
    "The memory of the running store.",
    "The availability of the store.",
]
actors = [
    "A stranger who can reach the store's ports.",
    "A customer with a login.",
    "An operator with a login.",
    "A developer who changes the configuration.",
]
boundaries = [
    "The customers' port to the store.",
    "The operations port to the store: a role is required for all but health.",
]
assumptions = [
    "The operations port is not reachable from the internet.",
    "Operator passwords are kept and rotated outside this project.",
]
out_of_scope = [
    "Attacks on the host or the network.",
    "Secrets stored in a vault, which have their own project.",
]
tests = [
    "`ActuatorSpringTest` starts a real store per configuration and checks the leaks, the defaults, the hardened ports, roles, read-only access, the cost of `include=*` and that the checker changes nothing.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next project in this module, fail-closed-error-handling-with-spring-boot, moves from what the store shows to what it does when something breaks.
"""

[[threat]]
id = "T1"
stride = "I"
threat = "A stranger reads secrets from the environment, configuration or heap endpoints"
where = "`/actuator/env`, `/actuator/configprops`, `/actuator/heapdump`"
control = "A short exposure list, masked values, no heap dump, a role for every endpoint but health"
residual = "A secret in memory of a store that an attacker already controls"

[[threat]]
id = "T2"
stride = "T"
threat = "A stranger changes the store with a write operation"
where = "`/actuator/loggers`, `/actuator/shutdown`"
control = "Read-only access, shutdown left off, a role for operations"
residual = "An operator account that is stolen"

[[threat]]
id = "T3"
stride = "I"
threat = "A stranger maps the routes and the components behind the store"
where = "`/actuator/mappings`, `/actuator/beans`, health details"
control = "A short list, health details for the OPS role only, operations on their own port"
residual = "Routes that can be found by guessing"

[[threat]]
id = "T4"
stride = "E"
threat = "One setting is loosened and the others are not reviewed"
where = "`application-*.properties`"
control = "Four separate settings and a checker in the build"
residual = "A change that no check covers"

[poster]
headline = [["ACTUATOR", "text"], ["MISCONFIGURATION", "accent"]]
taglines = [["One line can hand a stranger the store's secrets", "gold"]]
before = { code = "exposure.include=*", note = "the key, the heap, shutdown", tag = "BEFORE" }
after = { code = "include=health,info,loggers", note = "own port, rules, read-only", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "Security Misconfiguration with Spring Boot Actuator"
narration = "Hello, and welcome. [[slnc 400]] This video explains security misconfiguration with Spring Boot Actuator, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A security misconfiguration is a setting that leaves a door open, even when the code itself is fine. [[slnc 300]] Spring Boot Actuator is the part of an application built to be looked into: its health, its settings, its memory. [[slnc 300]] So whoever reaches it, sees inside. [[slnc 600]] Think of the back office of a shop, with the safe, the staff rota and the alarm switch. [[slnc 300]] It is meant for staff. [[slnc 300]] Leave its door onto the shop floor open, and any customer can walk in. [[slnc 600]] Our example is an online store built on Spring Boot."

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online store on Spring Boot,", "with Actuator for its health checks.", "", "The demo starts the real store five times,", "each with different settings,", "and talks to it the way a scanner would.", "", "A checker scores each set-up out of 8."]
narration = "Here is the scenario. [[slnc 400]] An online store runs on Spring Boot, with Actuator turned on for its health checks. [[slnc 500]] The demo starts the real store five times, each time with different settings, and talks to it over H T T P, the way a stranger's scanner would. [[slnc 500]] A small checker then scores each set-up, with eight checks."

[[scene]]
key = "02-words"
kind = "bullets"
title = "The Words"
body = ["Actuator: the store's built-in operations pages", "Endpoint: one of them, under /actuator", "Exposed: reachable over the web", "Heap dump: a copy of the store's memory", "Role: what a login is allowed to do", "Read-only access: may look, may not change"]
narration = """Before the demos, the words. [[slnc 500]] Actuator is the part of Spring Boot that adds operations pages to the store. [[slnc 500]] Each page is an endpoint, under slash actuator. [[slnc 500]] An exposed endpoint is one you can reach over the web. [[slnc 500]] A heap dump is a copy of everything in the store's memory. [[slnc 500]] A role says what a login may do. [[slnc 500]] And read only access means you may look, but not change."""

[[scene]]
key = "02-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "02-one-port"
kind = "figure"
title = "One port, open to everyone"
body = "one_port"
narration = """Let's see the whole idea on one picture. [[slnc 400]] The shipped store has one port. [[slnc 300]] Customers use it to look at products. [[slnc 600]] But the actuator lives on the same port, and with the tutorial's settings it asks for no login. [[slnc 300]] So a stranger can ask for the list of endpoints, for the environment, and for the heap dump. [[slnc 600]] Ask the environment for the payment key, and the reply carries the live key, in plain text. [[slnc 700]] Actuator was built to be looked into. [[slnc 300]] So the settings that decide who can look are the security of the store."""

[[scene]]
key = "03-acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "04-costs"
kind = "bullets"
title = "What It Costs"
body = ["A separate port needs a firewall rule", "Operators need their own accounts", "A short list means asking to add an endpoint", "Read-only access removes some conveniences", "A passing score is not a secure store"]
narration = "Nothing is free. [[slnc 400]] Here is what the defences cost. [[slnc 500]] A separate port for operations only helps if a firewall rule, or a network policy, keeps customers away from it. [[slnc 500]] Operators need their own accounts and their own role. [[slnc 500]] A short list of endpoints means someone has to ask before a new one is added. [[slnc 500]] Read-only access removes conveniences, like changing a log level on the fly. [[slnc 300]] And a checker that passes means its eight checks pass, not that the store is secure."

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["exposure.include=* copied from a tutorial", "Health details shown to everyone", "  because a load balancer wanted them", "A heap dump sent to a support team", "/actuator in a scanner's findings"]
narration = "You have probably met this already. [[slnc 400]] The setting that exposes every endpoint, copied from a tutorial, is the first demo. [[slnc 500]] Health details shown to everyone, because a load balancer wanted them, is a smaller version of the same mistake. [[slnc 500]] A heap dump sent to a support team carries every secret that was in memory. [[slnc 500]] And slash actuator, in a scanner's report, is how strangers find all of this."

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Never expose everything to customers", "Operations on their own port", "A short list: health, info, loggers", "A role for everything but health", "Read-only where nothing should change", "Heap dump and shutdown stay off", "Run the checker on every change"]
narration = "So, how do you use it? [[slnc 400]] Never expose every endpoint on a port that customers can reach. [[slnc 500]] Put operations on their own port, and list only the endpoints you need. [[slnc 500]] Require an operator role for everything except health, and show health details only to that role. [[slnc 500]] Make endpoints read only where nothing should change, and leave the heap dump and shutdown off. [[slnc 300]] And run the checker on every change, in the build."

[[scene]]
key = "07-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a ninth check:", "no build or git details for strangers."]
narration = "That's security misconfiguration with Spring Boot Actuator. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Actuator is a window into the running store, so the settings that decide who can look through it, and at what, are the security of the store. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a ninth check: the info endpoint shows no build or git details to strangers. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] The store is a real Spring Boot application, started on free loopback ports with a different profile in each demo. [[slnc 300]] Here are the classes that matter."""

[[class]]
name = "ShopController"
what = "the store's own pages, with the payment key in memory"
[[class.part]]
title = "a key injected from the settings"
code = """
ShopController(@Value("${shop.payment.api-key}") String paymentKey) {
    this.paymentKey = paymentKey;
...
@GetMapping("/internal/refunds/{id}")
"""
speech = """The payment key is injected from the settings, the way a real store does it. [[slnc 300]] So it is in the environment, and in the memory. [[slnc 300]] The refund route is never linked from a page, but the route map lists it."""

[[class]]
name = "StoreSecurity"
what = "the rules: health for everyone, the rest for operators"
[[class.part]]
title = "first match wins"
code = """
.requestMatchers(EndpointRequest.to(HealthEndpoint.class)).permitAll()
.requestMatchers(EndpointRequest.toAnyEndpoint()).hasRole("OPS")
.requestMatchers("/products", "/orders/**").permitAll()
.anyRequest().denyAll())
"""
speech = """The rules are checked in order, and the first match wins. [[slnc 300]] Health is open. [[slnc 300]] Any other exposed endpoint needs the operations role. [[slnc 300]] And anything not named is denied."""

[[class]]
name = "Running"
what = "starts the store with a profile and extra settings"
[[class.part]]
title = "one profile per demo"
code = """
SpringApplicationBuilder builder = new SpringApplicationBuilder(StoreApp.class).profiles(profile);
String[] args = Arrays.stream(properties).map(p -> "--" + p).toArray(String[]::new);
ConfigurableApplicationContext context = builder.run(args);
"""
speech = """Each demo starts the real store with one profile, which picks one properties file. [[slnc 300]] An extra line, like expose everything, is passed on the command line, and beats the file."""

[[class]]
name = "ActuatorChecker"
what = "eight checks from outside, the way a scanner works"
[[class.part]]
title = "one check: send a request, judge the reply"
code = """
static int score(List<Finding> findings) {
    return (int) findings.stream().filter(Finding::pass).count();
...
private static Finding refused(String name, String request, int status) {
    return new Finding(name, status != 200, request + " -> " + status);
"""
speech = """Each check sends one real request, as a stranger or as the operator, and judges the status. [[slnc 300]] Anything but two hundred counts as refused. [[slnc 300]] The score is the number of checks that pass."""

[[class]]
name = "Wire"
what = "the HTTP client, which also searches a heap dump"
[[class.part]]
title = "searching a download without holding it"
code = """
byte[] pattern = needle.getBytes(StandardCharsets.ISO_8859_1);
...
if (indexOf(buf, end, pattern) >= 0) {
    return true;
"""
speech = """A heap dump is large, so the client reads it in pieces and searches each piece for the key's bytes. [[slnc 300]] That is how the demo proves the key is in the memory."""

