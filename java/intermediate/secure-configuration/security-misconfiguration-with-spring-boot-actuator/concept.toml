main_class = "ActuatorSpringDemo"
tagline = "One line that exposes every actuator endpoint hands a stranger the environment, the route map and the memory of the store"
bold = "Spring Boot Actuator is the part of a store that was built to be looked into, so a stranger who reaches it can read the payment key, list the unlisted routes, download the heap and stop the store; Spring Boot hides values and keeps the dangerous endpoints off by default, and the rest is the store's job: another port, a short list, login rules, read-only access and a checker that runs on every change."
domain = "an online store"
domain_note = ""
youtube_description = "Security misconfiguration with Spring Boot Actuator, OWASP Top 10 A02, in an online store on Spring Boot 4.1: the tutorial setting that exposes everything, a payment key read from the environment endpoint and found again in a heap dump, what Spring Boot already hides and what it cannot, a hardened store with its own loopback port, a short endpoint list, login rules and a read-only loggers endpoint, and one added line that costs a check."
