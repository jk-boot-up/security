[[scene]]
key = "07-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Name what each Actuator endpoint gives a stranger", "Explain what Spring Boot hides by default and what it", "cannot hide", "Separate operations from customers by port, list,", "login rules and access level", "Run a checker against a live store and read its", "findings"]
narration = "So, how do you use it? [[slnc 400]] Never expose everything on a port that customers can reach. [[slnc 500]] Put operations on their own port, list the endpoints you need, require a role for all but health, show details only to that role, make read-only what must not change, leave the heap dump and shutdown off, and run the checker on every change."

