[[act]]
title = "The bill"
summary = "One added line, include=*, makes the hardened store score 7 of 8: the route map is open to the operator again; the login rules still answer 401 to strangers; four separate layers, and checks in CI on every change."
detail = """
A developer adds management.endpoints.web.exposure.include=* to the hardened store to debug something. The checker scores 7 of 8: route map hidden fails, GET /actuator/mappings as ops answers 200.
The login rules still held: GET /actuator/env without a login answers 401. That is why the port, the list, the rules and the access levels are four settings and four layers.
A dependency can add endpoints and a property can expose them, so the checks run in CI, on every change. Passing means these 8 checks pass, not that the store is safe.
"""
figure = "one_line"
figure_title = "One line costs one check"
figure_speech = """
Fifth demo: the bill. [[slnc 400]] At the top, one line added to the hardened store, to debug something: expose everything. [[slnc 300]] The score drops to seven out of eight. [[slnc 300]] The route map is open to the operator again. [[slnc 700]]
