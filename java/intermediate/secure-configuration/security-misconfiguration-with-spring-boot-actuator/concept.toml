[threatmodel]
scope = """
A Spring Boot store with Actuator, on loopback ports. It covers what the actuator endpoints reveal and allow, and the settings that control them. It does not cover the store's business logic or the host.
"""
assets = [
    "The payment key and the database password.",
    "The memory of the running store.",
    "The availability of the store.",
]
actors = [
    "A stranger who can reach the store's ports.",
    "A customer with a login.",
    "An operator with a login.",
    "A developer who changes the configuration.",
]
boundaries = [
    "The customers' port to the store.",
    "The operations port to the store: a role is required for all but health.",
]
assumptions = [
    "The operations port is not reachable from the internet.",
    "Operator passwords are kept and rotated outside this project.",
]
out_of_scope = [
    "Attacks on the host or the network.",
    "Secrets stored in a vault, which have their own project.",
]
tests = [
    "`ActuatorSpringTest` starts a real store per configuration and checks the leaks, the defaults, the hardened ports, roles, read-only access, the cost of `include=*` and that the checker changes nothing.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next project in this module, fail-closed-error-handling-with-spring-boot, moves from what the store shows to what it does when something breaks.
"""

[[threat]]
id = "T1"
stride = "I"
threat = "A stranger reads secrets from the environment, configuration or heap endpoints"
where = "`/actuator/env`, `/actuator/configprops`, `/actuator/heapdump`"
control = "A short exposure list, masked values, no heap dump, a role for every endpoint but health"
residual = "A secret in memory of a store that an attacker already controls"

[[threat]]
id = "T2"
stride = "T"
threat = "A stranger changes the store with a write operation"
where = "`/actuator/loggers`, `/actuator/shutdown`"
control = "Read-only access, shutdown left off, a role for operations"
residual = "An operator account that is stolen"

[[threat]]
id = "T3"
stride = "I"
threat = "A stranger maps the routes and the components behind the store"
where = "`/actuator/mappings`, `/actuator/beans`, health details"
control = "A short list, health details for the OPS role only, operations on their own port"
residual = "Routes that can be found by guessing"

[[threat]]
id = "T4"
stride = "E"
threat = "One setting is loosened and the others are not reviewed"
where = "`application-*.properties`"
control = "Four separate settings and a checker in the build"
residual = "A change that no check covers"

