[[act]]
title = "A look-alike site gets nothing it can use"
summary = "On bank-example.test the phone has no passkey for that name; the browser works out that bank-example.test is neither bank.example nor ends with .bank.example; a browser that skipped the rule still signs the real origin, which the bank refuses; a typed password works at the bank."
detail = """
Ana opens https://bank-example.test, a copy of the bank's page. Request one asks for a passkey for its own name, bank-example.test, and gets
nothing: the phone has no passkey for that name. Request two passes on the bank's real challenge and asks for bank.example. The browser works out
its rule: is bank-example.test equal to bank.example? No. Does it end with .bank.example? No. So bank.example is not this page's site, and nothing
comes back. Request three: even a browser that skipped that rule writes the page's real origin, https://bank-example.test, into the signed client
data, and the bank, which expects https://bank.example, refuses it. The same page asking for Ana's password gets a password that works at the bank.
"""
figure = "origin_check"
figure_title = "The site rule and the signed origin, worked out"
figure_speech = """
Third demo: a look-alike site. [[slnc 400]] The page lives at bank dash example dot test. [[slnc 300]] It looks almost like the bank. [[slnc 700]]
The top panel is the browser's rule. [[slnc 300]] The page asks for a passkey with the relying party id bank dot example. [[slnc 300]] The browser compares the page's host with that name. [[slnc 300]] Are they equal? [[slnc 200]] No. [[slnc 300]] Does the host end with dot bank dot example? [[slnc 200]] No. [[slnc 300]] So the browser refuses, and the phone is never asked. [[slnc 700]]
The bottom panel imagines a faulty browser that skipped that rule. [[slnc 300]] It still writes the page's real origin into the client data, and the phone signs it. [[slnc 300]] The bank expects its own origin, so it refuses. [[slnc 700]]
The page cannot choose the origin. [[slnc 300]] That is why a passkey cannot be phished.
"""
speech = """
Here is the real output. [[slnc 400]] The page. [[slnc 300]] Request one, for its own name: nothing, the phone has no passkey for it. [[slnc 400]] Request two, for the bank's name: not equal, does not end with it, so nothing.
[[page]]
Request three, through a browser that skipped the rule. [[slnc 300]] The signed origin is the look-alike's address, the bank expects its own, and refuses. [[slnc 400]] Then the same page asks for Ana's password, and she types it. [[slnc 300]] Replayed at the bank, it is accepted. [[slnc 300]] A password can be phished. [[slnc 300]] A passkey cannot.
"""
