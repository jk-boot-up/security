[[act]]
title = "A look-alike site gets nothing it can use"
summary = "On bank-example.test the phone has no passkey for that name, the browser will not ask for bank.example, and even a relayed answer carries the real origin, which the bank refuses; a typed password, by contrast, works at the bank."
detail = """
Ana opens https://bank-example.test, a copy of the bank's page. It asks for a passkey for its own name, bank-example.test, and gets nothing: the
phone has no passkey for that name. It passes on the bank's real challenge and asks for bank.example, and gets nothing: the browser will not use
bank.example for a page at bank-example.test. Even a browser that skipped that rule writes the page's real origin into the client data, and the
bank refuses it: the origin is not https://bank.example. The same page asking for Ana's password gets a password that works at the bank. A password
can be phished; a passkey cannot.
"""
speech = """
Third demo: a look-alike site. [[slnc 400]] Ana opens a copy of the bank's page, on a name that looks almost the same. [[slnc 600]]
It asks for a passkey for its own name. [[slnc 300]] The phone has none. [[slnc 300]] Nothing comes back. [[slnc 600]]
It passes on the bank's real challenge, and asks for the bank's name. [[slnc 300]] The browser refuses, because the page is not on the bank's site. [[slnc 600]]
Even a browser that skipped that rule writes the page's real address into the signed data. [[slnc 300]] And the bank refuses it. [[slnc 600]]
Now the same page asks for Ana's password. [[slnc 300]] She types it in. [[slnc 300]] And it works at the real bank. [[slnc 300]] A password can be phished. [[slnc 300]] A passkey cannot.
