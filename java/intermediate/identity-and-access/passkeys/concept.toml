[[scene]]
key = "01-poster"
kind = "poster"
title = "Passkeys and WebAuthn"
narration = """Hello, and welcome. [[slnc 400]] This video explains passkeys, and the web authentication standard behind them, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A passkey is a key pair, made by a phone or a security key, for one site only. [[slnc 300]] The site keeps the public key, and the device keeps the private key. [[slnc 600]] Think of a house key cut to fit one front door. [[slnc 300]] It simply does not turn in any other lock. [[slnc 300]] And a copy of the lock tells a burglar nothing, because the lock holds no key. [[slnc 700]] In this video, the domain is an online bank. [[slnc 500]] By the end, you will see what the bank stores. [[slnc 300]] Exactly which bytes a phone signs. [[slnc 300]] Why a look-alike site gets nothing. [[slnc 300]] And what is left to guard."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online bank replaces passwords with passkeys.", "", "Passwords and codes can be typed", "into a copy of the bank's page.", "", "Passkeys cannot."]
narration = """Here is the scenario. [[slnc 400]] An online bank replaces passwords with passkeys. [[slnc 500]] Passwords and one time codes can be typed into a copy of the bank's page. [[slnc 500]] Passkeys cannot. [[slnc 500]] The demos show why, with the real bytes. [[slnc 400]] Every random value in the demo comes from a fixed seed, so you can run it and see the same values."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["Relying party: the site that checks", "Authenticator: the phone or security key", "Challenge: a fresh random value, used once", "Origin: the page's real address", "User verification: a PIN or a fingerprint"]
narration = """Before the demos, the words. [[slnc 500]] The relying party is the site that checks the passkey. [[slnc 500]] The authenticator is the phone, laptop or security key that holds it. [[slnc 500]] A challenge is a fresh random value, used once. [[slnc 500]] The origin is the real address of the page that asked. [[slnc 500]] And user verification means a P I N or a fingerprint, not only a touch."""

[[scene]]
key = "03-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "03-one-key"
kind = "figure"
title = "One key, one site"
body = "one_key_one_site"
narration = """Let's see the whole idea on one picture. [[slnc 400]] In the middle, Ana's phone. [[slnc 300]] It holds a key that was made for one name only: bank dot example. [[slnc 300]] The private key never leaves the phone. [[slnc 700]] At the top, the real bank's page asks the phone to sign a challenge, for bank dot example. [[slnc 300]] The phone has a key for that name, so it signs, and the bank accepts. [[slnc 700]] At the bottom, a look-alike page, on bank dash example dot test. [[slnc 300]] It looks the same to a person. [[slnc 300]] But the phone has no key for that name, so nothing comes back. [[slnc 700]] A password would have worked on both pages. [[slnc 300]] A passkey only turns in one lock."""

[[scene]]
key = "04-acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "09-ladder"
kind = "bullets"
title = "The Checks, In Order"
body = ["Challenge: known, unused, fresh", "Type and origin", "Relying party id hash", "Flags: presence, and verification for payments", "Signature and counter"]
narration = """Let's put the checks in order. [[slnc 400]] First, the challenge: one the bank issued, not used before, and fresh. [[slnc 500]] Then the type, and the origin of the page. [[slnc 500]] Then the hash of the bank's own name. [[slnc 500]] Then the flags: the user was present, and verified for payments. [[slnc 500]] And last, the signature over the sixty nine bytes, with the stored public key, and the counter."""

[[scene]]
key = "11-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Sign in with a passkey buttons", "Security keys that must be touched", "Passkeys synced to a new phone", "A fingerprint before a payment"]
narration = """You have probably met this already. [[slnc 400]] Sign in with a passkey buttons, with a fingerprint prompt instead of a password field. [[slnc 500]] Security keys that must be touched. [[slnc 500]] Passkeys that appear on a new phone, because they were synced. [[slnc 500]] And bank apps that ask for a fingerprint again before a payment."""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Passkeys as the main way in", "Verification for payments", "Two passkeys per customer", "Guarded recovery, one-time codes", "Passwords switched off when possible"]
narration = """So, how do you use it? [[slnc 400]] Offer passkeys as the main way in, with a maintained library making the checks. [[slnc 500]] Require user verification for payments. [[slnc 500]] Encourage two passkeys per customer. [[slnc 500]] Guard the recovery flow, with one time codes. [[slnc 500]] And switch passwords off, once they are no longer needed."""

[[scene]]
key = "12-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "13-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a second site", "and show its keys cannot be used for the bank."]
narration = """That's passkeys and web authentication. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] A passkey only signs for the real site, so the weak points that remain are recovery, and every older way in. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine, with nothing installed except a Java development kit. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a second site, and show that its keys cannot be used for the bank. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
Passwordless sign-in at an online bank with passkeys: registration, sign-in, payments with user verification, copied keys, recovery and the
remaining password. It covers a look-alike site, a replayed answer, a copied database or key, and the fallback paths. It does not cover malware
in control of the customer's device or browser, attestation, or the platform that syncs passkeys.
"""
assets = [
    "Customers' accounts and money.",
    "The private keys inside customers' authenticators.",
    "The bank's passkey records: public keys and counters.",
    "Recovery codes and any remaining passwords.",
]
actors = [
    "Customers and their devices.",
    "A look-alike site that relays the bank's challenges.",
    "A thief who copies the bank's records, a device's key, or a recovery code.",
]
boundaries = [
    "Customer's device to the bank: every answer crosses it and is checked.",
    "Web page to the browser: the page cannot choose the origin or another site's relying party id.",
    "Authenticator to everything else: the private key never leaves it.",
]
assumptions = [
    "The customer's browser enforces the WebAuthn rules.",
    "The bank's clock is correct to within the challenge lifetime.",
    "In the demo, keys and challenges come from a fixed seed so the output repeats; the password and recovery code are demo values.",
]
out_of_scope = [
    "Malware that controls the customer's device or browser.",
    "Attestation of authenticator models.",
    "The security of the account a synced passkey syncs through.",
]
tests = [
    "`EncodingTest` checks base64url against RFC 4648, SHA-256 against the abc vector, the byte layouts of client data and authenticator data, and that a signature over the 69 signed bytes verifies with the library fed the two parts separately.",
    "`RelyingPartyTest` checks every refusal with its exact reason: used and expired challenges, another customer, type, origin, relying party id, flags, unknown credential, a stranger's key, a copied key, synced passkeys, the browser's site rule, passwords and recovery codes.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next project, saml-basics, looks at the older single sign-on standard that many banks still run beside OpenID Connect.
"""

[[threat]]
id = "T1"
stride = "S"
threat = "A look-alike site captures the customer's sign-in"
where = "the browser, `Browser.rpIdAllowedFor`, `RelyingParty` origin check"
control = "The authenticator signs only for its relying party id, the browser allows only the page's own site, and the bank checks the origin in the signed client data"
residual = "A password or recovery path that is still enabled can be phished instead"

[[threat]]
id = "T2"
stride = "S"
threat = "An earlier answer is replayed"
where = "`RelyingParty` challenge store"
control = "Challenges are random, single-use and expire after five minutes"
residual = "The bank must keep the challenge store on the server, not in a cookie the client can resend"

[[threat]]
id = "T3"
stride = "I"
threat = "The bank's passkey records are copied"
where = "the passkey records"
control = "Only public keys, credential ids and counters are stored; none can sign"
residual = "Records still reveal which customers use which devices; protect them as personal data"

[[threat]]
id = "T4"
stride = "S"
threat = "A device-bound key is copied and used"
where = "`RelyingParty` counter check"
control = "A counter that does not rise is refused and the passkey suspended"
residual = "Synced passkeys report zero, so their copies cannot be detected this way"

[[threat]]
id = "T5"
stride = "E"
threat = "The attacker uses the weakest remaining way in: a password or the recovery path"
where = "`RelyingParty.passwordSignIn`, `RelyingParty.recover`"
control = "One-time recovery codes stored as hashes, two passkeys per customer, passwords switched off"
residual = "Recovery by a person (a call centre) remains open to persuasion and needs its own checks"

[[threat]]
id = "T6"
stride = "E"
threat = "An unattended, unlocked device approves a payment with only a touch"
where = "`RelyingParty.startSignIn(user, forPayment)`"
control = "User verification is required for payments"
residual = "Malware on an unlocked device is out of scope"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] Everything runs in plain Java: a model bank, browser and phone, laid out the way the web authentication standard lays them out. [[slnc 300]] Here are the classes that matter."""

[[class]]
name = "RelyingParty"
what = "the bank: single-use challenges, and every check in order"
[[class.part]]
title = "the checks, in order"
code = """
Pending waiting = pending.remove(clientData.challenge());
...
if (!clientData.origin().equals(origin)) {
...
if (!MessageDigest.isEqual(data.rpIdHash(), Sha256.of(rpId))) {
...
if (waiting.requireVerification() && !data.has(AuthenticatorData.USER_VERIFIED)) {
"""
speech = """The bank removes the challenge as it reads it, so it can be used only once. [[slnc 300]] Then it compares the origin, and the hash of its own name. [[slnc 300]] For a payment, it insists on the verified flag."""
[[class.part]]
title = "signature, then counter"
code = """
if (!verify(credential.publicKey, assertion)) {
...
if ((count != 0 || credential.signCount != 0) && count <= credential.signCount) {
    credential.suspended = true;
"""
speech = """The signature is checked with the stored public key. [[slnc 300]] A counter that did not go up means two devices hold the key, so the passkey is suspended."""

[[class]]
name = "Browser"
what = "the site rule, and the real origin in the client data"
[[class.part]]
title = "a page may only ask for its own site"
code = """
return host.equals(id) || host.endsWith("." + id);
...
byte[] clientData = new ClientData(ClientData.GET, challenge, pageOrigin).json();
"""
speech = """The host must be the relying party id, or end with a dot and that id. [[slnc 300]] And the browser, not the page, writes the origin into the client data."""

[[class]]
name = "Authenticator"
what = "the phone: one key pair per site, signatures and a counter"
[[class.part]]
title = "the sixty-nine signed bytes"
code = """
generator.initialize(new ECGenParameterSpec("secp256r1"), random);
...
static byte[] signedBytes(byte[] authenticatorData, byte[] clientDataJson) {
...
signer.update(signedBytes(authenticatorData, clientDataJson));
"""
speech = """The phone makes a P two five six key pair for each site. [[slnc 300]] It signs the authenticator data followed by the hash of the client data: thirty seven plus thirty two bytes."""

[[class]]
name = "AuthenticatorData"
what = "the 37 bytes the phone writes"
[[class.part]]
title = "hash, flags, counter"
code = """
ByteBuffer out = ByteBuffer.allocate(37 + extra);
out.put(rpIdHash).put((byte) flags).putInt((int) signCount);
"""
speech = """Thirty two bytes of the site name's hash, one flags byte, and a four byte counter. [[slnc 300]] All of it goes inside the signature."""

[[class]]
name = "ClientData"
what = "the JSON the browser writes"
[[class.part]]
title = "type, challenge, origin"
code = """
record ClientData(String type, String challenge, String origin) {
...
static final String GET = "webauthn.get";
...
byte[] json() {
"""
speech = """The client data holds the type of call, the bank's challenge and the page's origin. [[slnc 300]] The phone signs its hash, so none of them can be changed afterwards."""

[[class]]
name = "FixedRandom"
what = "demo only: the same random bytes on every run"
[[class.part]]
title = "a fixed seed"
code = """
public void nextBytes(byte[] bytes) {
    source.nextBytes(bytes);
"""
speech = """The demo passes this to the bank and the phones, so its challenges, keys and signatures repeat. [[slnc 300]] It is predictable, so real code uses a secure random source instead."""

[[acronym]]
short = "WebAuthn"
long = "Web Authentication: the standard for passkeys in browsers"
say = "Web authn is web authentication: the standard that lets a browser use passkeys."
[[acronym]]
short = "rp id"
long = "relying party id: the site's name a passkey is made for"
say = "R P id is the relying party id: the name of the site a passkey is made for, here bank dot example."
[[acronym]]
short = "SHA-256"
long = "Secure Hash Algorithm, 256 bits: a 32-byte fingerprint of data"
say = "S H A two fifty six is the secure hash algorithm with two hundred and fifty six bits: a thirty two byte fingerprint of any data."
[[acronym]]
short = "P-256"
long = "the elliptic curve a passkey's key pair lives on"
say = "P two five six is the elliptic curve that the passkey's key pair lives on."
[[acronym]]
short = "ES256"
long = "ECDSA signatures on P-256, with SHA-256"
say = "E S two five six means E C D S A signatures on that curve, with S H A two fifty six."
[[acronym]]
short = "ECDSA"
long = "Elliptic Curve Digital Signature Algorithm"
say = "E C D S A is the elliptic curve digital signature algorithm."
