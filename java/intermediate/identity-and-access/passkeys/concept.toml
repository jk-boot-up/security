[[act]]
title = "User verification for payments, and counters against copies"
summary = "A payment with only a touch is refused and accepted with a fingerprint; a copied key signs with counter 7 after the real phone already reached 7, so it is refused and the passkey suspended; synced passkeys always report 0."
detail = """
A payment of 900 with only a touch is refused: payments need user verification. With Ana's fingerprint as well, it is accepted. Ana's phone counts
its signatures, and the bank has now seen counter 6. An attacker copies the phone's key. The real phone signs in first, with counter 7. Then the copy
signs in with counter 7, which is not above 7, and is refused as a possible cloned authenticator; the passkey is suspended until Ana confirms it,
even for the real phone. A synced passkey, shared between Ana's devices, reports counter 0 every time and is accepted: a copy of it cannot be spotted
by its counter, so its protection is the account it syncs through.
"""
speech = """
Fourth demo: payments, and copies. [[slnc 400]] A payment with only a touch is refused. [[slnc 300]] Payments need user verification. [[slnc 300]] With Ana's fingerprint as well, it is accepted. [[slnc 600]]
Ana's phone counts every signature, and the bank remembers the last count it saw. [[slnc 600]]
Now an attacker copies the phone's key. [[slnc 300]] The real phone signs in, and its count goes up. [[slnc 300]] Then the copy signs in, with a count that is not higher. [[slnc 300]] The bank refuses it, and suspends the passkey until Ana confirms it. [[slnc 600]]
A synced passkey, shared between Ana's devices, always reports zero. [[slnc 300]] So a copy cannot be spotted by its counter. [[slnc 300]] Its protection is the account it syncs through.
"""
rows = { verify = "active amber" }
console = [
    ["a payment of 900 with only a touch: refused (user verification required)", "ok"],
    ["the same payment with her fingerprint as well: accepted", "ok"],
    ["ana's phone counts its signatures; the bank has now seen counter 6", "muted"],
    ["an attacker copies the phone's key; the real phone signs in first: accepted", "muted"],
    ["then the copy signs in: refused (counter 7 is not above 7: possible cloned authenticator)", "ok"],
    ["the passkey is now suspended until ana confirms it, even for the real phone: refused", "amber"],
    ["a synced passkey, counter 0: accepted, twice; a copy cannot be spotted by its counter", "amber"],
]

[[act]]
title = "The bill: recovery, lost devices and the move away from passwords"
summary = "Ben's lost phone leaves his security key and a one-time recovery code; recovery is now the weakest way in, and Ana's password still works until the bank switches it off."
detail = """
Ben registers 2 passkeys, his phone and a security key, and keeps 1 recovery code of 20 characters. His phone is lost, and his new laptop has no
passkey yet. The security key from his drawer signs him in. The recovery code works once and is refused the second time. Recovery is now the
weakest way in, so it needs the same care as the passkeys themselves. And Ana's password still works alongside her passkeys: the weakest way in
sets the level. Once Ana has two passkeys and the bank switches her password off, the password is refused. A real bank uses a maintained WebAuthn
library, which is the `-with-spring-security` version.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] Ben registers two passkeys, his phone and a security key, and keeps one recovery code. [[slnc 600]]
His phone is lost. [[slnc 300]] His new laptop has no passkey yet. [[slnc 300]] The security key from his drawer signs him in. [[slnc 600]]
The recovery code works once, and never again. [[slnc 300]] Recovery is now the weakest way in, so it needs the same care. [[slnc 600]]
And Ana's password still works, next to her passkeys. [[slnc 300]] The weakest way in sets the level. [[slnc 300]] Once the bank switches her password off, it is refused. [[slnc 600]]
A real bank uses a maintained library for all of these checks.
"""
