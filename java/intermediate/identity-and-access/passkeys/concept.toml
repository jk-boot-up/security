[poster]
headline = [["PASSKEYS", "text"], ["AND WEBAUTHN", "accent"]]
taglines = [["A key that only signs for the real site", "gold"]]
before = { code = "password typed anywhere", note = "can be phished and copied", tag = "BEFORE" }
after = { code = "origin + rpIdHash + signature", note = "nothing usable to steal", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "Passkeys and WebAuthn"
narration = """Hello, and welcome. [[slnc 400]] This video explains passkeys, and the web standard behind them, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A passkey is a key pair, made by a phone or a security key, for one site only. [[slnc 300]] The site keeps the public key, and the device keeps the private key. [[slnc 600]] Think of a house key cut to fit one front door. [[slnc 300]] It simply does not turn in any other lock. [[slnc 300]] And a copy of the lock tells a burglar nothing, because the lock holds no key. [[slnc 700]] In this video, the domain is an online bank. [[slnc 500]] By the end, you will hear what the bank stores. [[slnc 300]] What it checks on every sign in. [[slnc 300]] Why a look-alike site gets nothing. [[slnc 300]] And what is left to guard."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online bank replaces passwords with passkeys.", "", "Passwords and codes can be typed", "into a copy of the bank's page.", "", "Passkeys cannot."]
narration = """Here is the scenario. [[slnc 400]] An online bank replaces passwords with passkeys. [[slnc 500]] Passwords and one time codes can be typed into a copy of the bank's page. [[slnc 500]] Passkeys cannot. [[slnc 500]] The demos show why."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["Relying party: the site that checks", "Authenticator: the phone or security key", "Challenge: a fresh random value, used once", "Origin: the page's real address", "User verification: a PIN or a fingerprint"]
narration = """Before the demos, the words. [[slnc 500]] The relying party is the site that checks the passkey. [[slnc 500]] The authenticator is the phone, laptop or security key that holds it. [[slnc 500]] A challenge is a fresh random value, used once. [[slnc 500]] The origin is the real address of the page that asked. [[slnc 500]] And user verification means a PIN or a fingerprint, not only a touch."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "09-ladder"
kind = "bullets"
title = "The Checks, In Order"
body = ["Challenge: known, unused, fresh", "Type and origin", "Relying party id hash", "Flags: presence, and verification for payments", "Signature and counter"]
narration = """Let's put the checks in order. [[slnc 400]] First, the challenge: one the bank issued, not used before, and fresh. [[slnc 500]] Then the type, and the origin of the page. [[slnc 500]] Then the hash of the bank's own name. [[slnc 500]] Then the flags: the user was present, and verified for payments. [[slnc 500]] And last, the signature, with the stored public key, and the counter."""

[[scene]]
key = "10-roles"
kind = "bullets"
title = "Who Does What"
body = ["RelyingParty: the bank's checks", "Browser: the site rule, and the origin", "Authenticator: keys, signatures, counters", "ClientData and AuthenticatorData: the signed bytes"]
narration = """Here is who does what in the code. [[slnc 400]] The relying party makes the bank's checks. [[slnc 500]] The browser enforces the rule that a page may only ask for its own site's passkeys, and writes the real origin. [[slnc 500]] The authenticator holds the keys, signs, and counts. [[slnc 500]] And the client data and authenticator data classes are the bytes that get signed."""

[[scene]]
key = "11-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Sign in with a passkey buttons", "Security keys that must be touched", "Passkeys synced to a new phone", "A fingerprint before a payment"]
narration = """You have probably met this already. [[slnc 400]] Sign in with a passkey buttons, with a fingerprint prompt instead of a password field. [[slnc 500]] Security keys that must be touched. [[slnc 500]] Passkeys that appear on a new phone, because they were synced. [[slnc 500]] And bank apps that ask for a fingerprint again before a payment."""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Passkeys as the main way in", "Verification for payments", "Two passkeys per customer", "Guarded recovery, one-time codes", "Passwords switched off when possible"]
narration = """So, how do you use it? [[slnc 400]] Offer passkeys as the main way in, with a maintained library making the checks. [[slnc 500]] Require user verification for payments. [[slnc 500]] Encourage two passkeys per customer. [[slnc 500]] Guard the recovery flow, with one time codes. [[slnc 500]] And switch passwords off, once they are no longer needed."""

[[scene]]
key = "13-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a second site", "and show its keys cannot be used for the bank."]
narration = """That's passkeys and web authentication. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] A passkey only signs for the real site, so the weak points that remain are recovery, and every older way in. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine, with nothing installed except a Java development kit. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a second site, and show that its keys cannot be used for the bank. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
Passwordless sign-in at an online bank with passkeys: registration, sign-in, payments with user verification, copied keys, recovery and the
remaining password. It covers a look-alike site, a replayed answer, a copied database or key, and the fallback paths. It does not cover malware
in control of the customer's device or browser, attestation, or the platform that syncs passkeys.
"""
assets = [
    "Customers' accounts and money.",
    "The private keys inside customers' authenticators.",
    "The bank's passkey records: public keys and counters.",
    "Recovery codes and any remaining passwords.",
]
actors = [
    "Customers and their devices.",
    "A look-alike site that relays the bank's challenges.",
    "A thief who copies the bank's records, a device's key, or a recovery code.",
]
boundaries = [
    "Customer's device to the bank: every answer crosses it and is checked.",
    "Web page to the browser: the page cannot choose the origin or another site's relying party id.",
    "Authenticator to everything else: the private key never leaves it.",
]
assumptions = [
    "The customer's browser enforces the WebAuthn rules.",
    "The bank's clock is correct to within the challenge lifetime.",
    "In the demo, keys and challenges are random and never printed, and the password and recovery code are demo values.",
]
out_of_scope = [
    "Malware that controls the customer's device or browser.",
    "Attestation of authenticator models.",
    "The security of the account a synced passkey syncs through.",
]
tests = [
    "`EncodingTest` checks base64url against RFC 4648, SHA-256 against the abc vector, and the byte layouts of client data and authenticator data.",
    "`RelyingPartyTest` checks every refusal with its exact reason: used and expired challenges, another customer, type, origin, relying party id, flags, unknown credential, a stranger's key, a copied key, synced passkeys, the browser's site rule, passwords and recovery codes.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next project, saml-basics, looks at the older single sign-on standard that many banks still run beside OpenID Connect.
"""

[[threat]]
id = "T1"
stride = "S"
threat = "A look-alike site captures the customer's sign-in"
where = "the browser, `Browser.rpIdAllowedFor`, `RelyingParty` origin check"
control = "The authenticator signs only for its relying party id, the browser allows only the page's own site, and the bank checks the origin in the signed client data"
residual = "A password or recovery path that is still enabled can be phished instead"

[[threat]]
id = "T2"
stride = "S"
threat = "An earlier answer is replayed"
where = "`RelyingParty` challenge store"
control = "Challenges are random, single-use and expire after five minutes"
residual = "The bank must keep the challenge store on the server, not in a cookie the client can resend"

[[threat]]
id = "T3"
stride = "I"
threat = "The bank's passkey records are copied"
where = "the passkey records"
control = "Only public keys, credential ids and counters are stored; none can sign"
residual = "Records still reveal which customers use which devices; protect them as personal data"

[[threat]]
id = "T4"
stride = "S"
threat = "A device-bound key is copied and used"
where = "`RelyingParty` counter check"
control = "A counter that does not rise is refused and the passkey suspended"
residual = "Synced passkeys report zero, so their copies cannot be detected this way"

[[threat]]
id = "T5"
stride = "E"
threat = "The attacker uses the weakest remaining way in: a password or the recovery path"
where = "`RelyingParty.passwordSignIn`, `RelyingParty.recover`"
control = "One-time recovery codes stored as hashes, two passkeys per customer, passwords switched off"
residual = "Recovery by a person (a call centre) remains open to persuasion and needs its own checks"

[[threat]]
id = "T6"
stride = "E"
threat = "An unattended, unlocked device approves a payment with only a touch"
where = "`RelyingParty.startSignIn(user, forPayment)`"
control = "User verification is required for payments"
residual = "Malware on an unlocked device is out of scope"
