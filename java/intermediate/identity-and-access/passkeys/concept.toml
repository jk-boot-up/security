[[act]]
title = "Signing in: a fresh challenge, signed once"
summary = "The phone signs 37 bytes of authenticator data and the hash of the client data; the bank accepts it once, then refuses the same answer, an answer 301 seconds late, and an answer whose flags were changed after signing."
detail = """
Ana touches her phone, which signs 37 bytes of authenticator data and the SHA-256 of the client data. The bank checks the challenge, the type, the
origin, the relying party id hash, the flags, the signature and the counter, and Ana is signed in. The same answer sent again is refused: its
challenge was single-use. An answer that arrives 301 seconds after its challenge is refused: challenges last five minutes. And an answer whose
user-verified flag was switched on after signing is refused, because the flags are inside the signed bytes.
"""
speech = """
Second demo: signing in. [[slnc 400]] The bank sends a fresh challenge. [[slnc 300]] Ana touches her phone. [[slnc 600]]
The phone signs a short block of data: the hash of the bank's name, its flags, and a counter. [[slnc 300]] It also signs the hash of the client data, which the browser wrote. [[slnc 600]]
The bank checks every part, in order, and Ana is signed in. [[slnc 600]]
The same answer sent again is refused. [[slnc 300]] Its challenge was used once, and is gone. [[slnc 300]] An answer that arrives after five minutes is refused too. [[slnc 600]]
And an answer whose flags were changed after signing is refused. [[slnc 300]] The flags are inside the signature.
"""
