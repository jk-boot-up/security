install = []

[docs.session]
objectives = [
    "explain what a passkey is and what the site stores",
    "list the checks a relying party makes on every answer, in order",
    "explain why a look-alike site gets nothing from a passkey",
    "explain user verification and the signature counter, and what synced passkeys change",
    "describe why recovery and old passwords become the weak points",
]
walkthrough = """
Start with the house key and the lock. Run the acts. After act one, ask what a thief who copies the bank's database could do with it. After act
three, ask the group to say exactly which of the three refusals would stop a real phishing page, and which only matters if the browser is faulty.
In act five, ask what the bank's recovery flow should require before it lets someone register a new passkey.
"""
exercises = [
    "Add a second relying party, shop.example, and show that one authenticator holds separate keys for both, which cannot be used for each other.",
    "Make the challenge lifetime one minute and write the boundary tests first.",
    "Let a recovery code register a new passkey only after a waiting period and a message to the customer's other devices.",
    "Add a check that a credential id is not longer than WebAuthn allows, and refuse it otherwise.",
]

[docs.explained]
sentence = """
A passkey is a key pair made for one site: the site stores only the public key, and signs in by checking a fresh, single-use challenge signed together
with the site's own name and the page's real origin, so the key cannot be used anywhere else.
"""
verdict = """
Offer passkeys as the main way in, with a maintained library making the checks. Require user verification for payments and changes to the account.
Encourage two passkeys per customer, issue one-time recovery codes, guard the recovery flow, and switch passwords off once they are no longer needed.
"""
recognise = [
    "`navigator.credentials.create` and `navigator.credentials.get` in a site's JavaScript.",
    "A server that stores `credentialId`, `publicKey` and `signCount` per user.",
    "Library settings named `rpId`, `origins` and `userVerification`.",
    "Account settings pages listing several passkeys by device name.",
]

[spec]
purpose = """
Teach how passkeys work and why they resist phishing, by building a model relying party, browser and authenticator with the JDK, laid out as WebAuthn
lays them out, and proving each check with a refusal.
"""
nongoals = [
    "CBOR, COSE keys and attestation formats.",
    "A real browser or authenticator.",
    "Passkeys in a framework: the -with-spring-security version.",
]
problem = """
Learners hear that passkeys are phishing-resistant but rarely see why: which bytes are signed, who writes the origin, and what the site must check.
"""
roles = [["Base64url", "`B64`"], ["SHA-256", "`Sha256`"], ["Client data", "`ClientData`"], ["Authenticator data", "`AuthenticatorData`"], ["The device", "`Authenticator`"], ["The browser's rules", "`Browser`"], ["The bank", "`RelyingParty`"], ["Simulated time", "`SimClock`"], ["Repeatable demo randomness", "`FixedRandom`"], ["Entry point", "`PasskeysDemo`"]]
requirements = [
    "The bank stores only a credential id, a public key and a counter.",
    "Every answer is refused for a used or expired challenge, a wrong type or origin, another relying party id, missing flags, an unknown credential, a bad signature or a counter that did not rise.",
    "The browser refuses a relying party id that is not the page's own site.",
    "Payments require user verification.",
    "The demo prints the same output on every run.",
]

