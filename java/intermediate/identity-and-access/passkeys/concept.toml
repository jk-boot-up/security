[[act]]
title = "The bill: recovery, lost devices and the move away from passwords"
summary = "Ben's lost phone leaves his security key and a one-time recovery code; recovery is now the weakest way in, and Ana's password still works until the bank switches it off."
detail = """
Ben registers 2 passkeys, his phone and a security key, and keeps 1 recovery code of 20 characters, of which the bank keeps only the SHA-256.
His phone is lost, and his new laptop has no passkey for bank.example. The security key from his drawer signs him in. The recovery code works once
and is refused the second time. Recovery is now the weakest way in, so it needs the same care as the passkeys themselves. Ana's old password, still
switched on, is accepted: the weakest way in sets the level. Once Ana has two passkeys and the bank switches her password off, it is refused. A real
bank uses a maintained WebAuthn library, which is the `-with-spring-security` version.
"""
figure = "ways_in"
figure_title = "Every way in, and the weakest one still switched on"
figure_speech = """
Fifth demo: the bill. [[slnc 400]] On the left, Ben. [[slnc 300]] He has two passkeys, his phone and a security key, and one recovery code. [[slnc 600]]
His phone is lost. [[slnc 300]] His new laptop has no passkey yet, so nothing. [[slnc 300]] The security key from his drawer signs him in. [[slnc 300]] The recovery code works once, and then never again. [[slnc 700]]
On the right, Ana's old password. [[slnc 300]] Here a green answer is the bad news. [[slnc 300]] While it is still switched on, it is accepted, and a look-alike page can collect it. [[slnc 300]] Once the bank switches it off, it is refused. [[slnc 700]]
The account is only as strong as its weakest way in. [[slnc 300]] After passkeys, that is recovery, and any password left on.
"""
