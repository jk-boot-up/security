[[act]]
title = "Signing in: a fresh challenge, signed once"
summary = "The phone signs 69 bytes: 37 bytes of authenticator data (relying party id hash, flags 01, counter 1) and the SHA-256 of the 133-byte client data; the bank verifies with the stored public key and accepts once, then refuses a replay, a late answer and edited flags."
detail = """
A fresh 32-byte challenge. Step one: the browser writes 133 bytes of client data with the type webauthn.get, the challenge and the origin.
Step two: the SHA-256 of those bytes, 32 bytes. Step three: the phone writes 37 bytes of authenticator data: the SHA-256 of bank.example, a flags
byte 01 (user present, not verified) and a counter of 1. Step four: the signed bytes are the authenticator data followed by the client data hash,
37 + 32 = 69 bytes. Step five: the phone signs them with its private key (ES256), a 71-byte signature. The bank checks the signature with the
stored public key over the same 69 bytes, then every other field, and Ana is signed in. The same answer sent again is refused (its challenge was
single-use), an answer 301 seconds after its challenge is refused (the limit is 300), and an answer whose flags were changed from 01 to 05 after
signing is refused: the flags are inside the signed bytes.
"""
figure = "signed_bytes"
figure_title = "How the signature is made, byte by byte"
figure_speech = """
Second demo: signing in. [[slnc 400]] This picture shows exactly what Ana's phone signs. [[slnc 700]]
Box one, top left: the client data, written by the browser. [[slnc 300]] The type, the bank's fresh challenge, and the page's real origin. [[slnc 600]]
Box two: its S H A two fifty six hash, thirty two bytes. [[slnc 700]]
Row three: the authenticator data, written by the phone. [[slnc 300]] Thirty two bytes of hash of the name bank dot example. [[slnc 300]] One flags byte, zero one, which means the user was present. [[slnc 300]] And a four byte counter, now one. [[slnc 300]] Thirty seven bytes in all. [[slnc 700]]
Step four: put the two together. [[slnc 300]] Thirty seven plus thirty two is sixty nine bytes. [[slnc 600]]
Step five: the phone signs those sixty nine bytes with its private key. [[slnc 300]] The bank checks the signature with the public key it stored, over the same sixty nine bytes. [[slnc 600]]
So the challenge, the origin, the name, the flags and the counter are all inside one signature. [[slnc 300]] Change any one, and the signature fails.
"""
speech = """
Here is the real output. [[slnc 400]] The fresh challenge. [[slnc 300]] Step one, the client data. [[slnc 300]] Step two, its hash, in hex.
[[page]]
Step three, the authenticator data: the start of the name hash, the flags byte zero one, and the counter, one. [[slnc 400]] Step four: sixty nine signed bytes. [[slnc 300]] Step five: a seventy one byte signature. [[slnc 400]] The bank's check: the signature is valid, and Ana is signed in.
[[page]]
The same answer sent again is refused: its challenge was used once, and is gone. [[slnc 400]] An answer three hundred and one seconds late is refused: the limit is three hundred. [[slnc 400]] And flags changed from zero one to zero five after signing: the signature does not match.
"""
rows = { signin = "active ok" }
console = [
