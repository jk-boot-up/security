[[act]]
title = "User verification for payments, and counters against copies"
summary = "A payment with flags 01 is refused and with flags 05 accepted; the bank has seen counter 6, the real phone signs with 7 and is accepted, the copied key signs with 7 and is refused, and the passkey is suspended; a synced passkey always reports 0."
detail = """
A payment of 900 asks for user verification. With only a touch, the flags byte is 01 (user present) and the payment is refused. With a fingerprint
as well, the flags byte is 05 (01 for present plus 04 for verified) and it is accepted. The bank has now seen counter 6. An attacker copies the
phone's key. The real phone signs with counter 7: 7 is above 6, accepted. The copy signs with counter 7: 7 is not above 7, refused as a possible
cloned key, and the passkey is suspended, so even the real phone with counter 8 is refused until Ana confirms it. A synced passkey, shared between
Ana's devices, reports counter 0 every time and is accepted: a copy of it cannot be spotted by its counter.
"""
figure = "counters"
figure_title = "The flags byte, and the counter that catches a copy"
figure_speech = """
Fourth demo: payments, and copies. [[slnc 400]] On the left, the flags byte, for a payment. [[slnc 300]] Zero one means a touch: the user was present. [[slnc 300]] Zero four means verified, with a fingerprint or a pin. [[slnc 300]] Together they make zero five. [[slnc 300]] The bank asks for verification on payments, so zero one is refused, and zero five is accepted. [[slnc 700]]
On the right, the counter. [[slnc 300]] The bank remembers the last count it saw: six. [[slnc 300]] An attacker has copied the phone's key. [[slnc 300]] The real phone signs first, with seven. [[slnc 300]] Seven is above six: accepted. [[slnc 300]] Then the copy signs, also with seven. [[slnc 300]] Seven is not above seven: refused. [[slnc 600]]
Now the bank knows two devices hold the key, but not which is real. [[slnc 300]] So it suspends the passkey, even for the real phone, until Ana confirms it.
"""
speech = """
Here is the real output. [[slnc 400]] The payment with only a touch, flags zero one: refused. [[slnc 300]] With a fingerprint, flags zero five: accepted. [[slnc 400]] The counters: the bank has seen six. [[slnc 300]] The real phone with seven is accepted. [[slnc 300]] The copy with seven is refused. [[slnc 300]] The real phone with eight is refused too: the passkey is suspended.
[[page]]
A synced passkey, shared between Ana's devices, always reports zero, and is accepted. [[slnc 300]] So a copy of it cannot be spotted by its counter. [[slnc 300]] Its protection is the account it syncs through.
"""
rows = { verify = "active amber" }
console = [
    ["A PAYMENT OF 900 (the bank asks for user verification):", "code"],
    ["  touch only, flags 01:", "muted"],
    ["    refused (user verification required)", "ok"],
    ["  touch and fingerprint, flags 05:", "muted"],
    ["    accepted (signed in as ana with ana's phone)", "ok"],
    ["THE COUNTERS (the bank keeps the last one it saw):", "code"],
    ["  the bank has seen 6", "muted"],
    ["  real phone:  counter 7, 7 > 6?  yes", "muted"],
    ["    accepted (signed in as ana with ana's phone)", "ok"],
    ["  copied key:  counter 7, 7 > 7?  no", "muted"],
    ["    refused (counter 7 is not above 7: a cloned key?)", "ok"],
    ["  real phone again, counter 8:", "muted"],
    ["    refused (passkey suspended after a counter went backwards)", "ok"],
    ["---", ""],
    ["A SYNCED PASSKEY (shared between ana's devices):", "code"],
    ["  counter 0: accepted (signed in as ana with ana's synced passkey)", "ok"],
    ["  counter 0: accepted (signed in as ana with ana's synced passkey)", "ok"],
