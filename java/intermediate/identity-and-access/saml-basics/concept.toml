[threatmodel]
scope = """
A shop's SAML service provider that accepts responses through the customer's browser. It covers the validation of signed assertions.
It does not cover the identity provider's security, SAML logout or encryption, or the customer's device.
"""
assets = [
    "The shop's accounts, and the identity they are given to.",
    "The identity provider's signing key.",
]
actors = [
    "A customer signing in.",
    "An attacker who can edit and replay the response on its way through their own browser.",
]
boundaries = [
    "Identity provider to shop, through the customer's browser: everything in the response is untrusted until validated.",
]
assumptions = [
    "The identity provider's public key was obtained out of band and pinned.",
    "The shop's clock is correct to within the allowed skew.",
]
out_of_scope = [
    "A compromised identity provider.",
    "SAML logout, encrypted assertions and attribute mapping.",
]
tests = [
    "`SamlTest` checks every provider against genuine, self-signed, edited, wrapped, replayed, expired, misdirected and malformed responses and unsigned or misplaced signatures.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next module, tls-in-practice, looks at the certificates and channels underneath all of these exchanges, starting with a local certificate authority.
"""

[[threat]]
id = "T1"
stride = "S"
threat = "A response signed by the attacker's own key is accepted"
where = "`TrustingServiceProvider`"
control = "Pin the identity provider's key; ignore KeyInfo"
residual = "A compromised or mis-pinned key"

[[threat]]
id = "T2"
stride = "T"
threat = "Signature wrapping: the signed element is not the one that is read"
where = "`PinnedKeyServiceProvider`"
control = "One assertion, signature inside it, validated reference equals the element read, unique ID"
residual = "Parser differences between the signature library and the code that reads the document"

[[threat]]
id = "T3"
stride = "R"
threat = "A captured response is replayed, or used for another shop or request"
where = "`StrictServiceProvider`"
control = "Audience, recipient, InResponseTo, validity period and remembered assertion ids"
residual = "Replay state lost on restart; keep it as long as the assertion is valid"

[[threat]]
id = "T4"
stride = "D"
threat = "Entities in the response read files or exhaust memory"
where = "`Xml.parse`"
control = "DOCTYPE refused, secure processing on"
residual = "Very large documents within the size limit of the web server"

[poster]
headline = [["SAML SIGNATURE", "text"], ["WRAPPING", "accent"]]
taglines = [["Read only what the bank signed", "gold"]]
before = { code = "read Assertion[0]", note = "checked one, read another", tag = "BEFORE" }
after = { code = "read #a1, the signed one", note = "pinned key, one assertion", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "SAML Single Sign-On and Signature Wrapping"
narration = "Hello, and welcome. [[slnc 400]] This video explains SAML single sign on, and the signature wrapping attack, in Java. [[slnc 300]] SAML is the security assertion markup language. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] With SAML, a customer signs in at their bank, and the bank sends the shop a signed X M L statement: this is Ana. [[slnc 300]] The shop must trust only the bank's own key, and then read only the part of the document that the signature covers. [[slnc 300]] A valid signature somewhere in the document says nothing about the part the code happens to read. [[slnc 600]] Think of a notary's stamp on one page of a bundle. [[slnc 300]] A clerk who sees a genuine stamp somewhere, and then reads the first page, is fooled by a forged page on top. [[slnc 600]] Our example is an online shop that signs customers in through their bank."

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online shop lets customers sign in", "through their bank.", "", "The demo builds real SAML-style responses,", "signed with the JDK's XML signature API,", "and runs three shops against them:", "  trusting, pinned-key, and strict."]
narration = "Here is the scenario. [[slnc 400]] An online shop lets customers sign in through their bank. [[slnc 500]] The demo builds real SAML style responses, and signs them with the J D K's own X M L signature A P I. [[slnc 500]] Then it runs three versions of the shop against genuine, self-signed, edited, wrapped, replayed, and expired responses: one that trusts the key in the message, one that pins the bank's key, and a strict one."

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["Identity provider: the bank, which signs", "Service provider: the shop, which checks", "Assertion: the signed statement, this is Ana", "Signature: covers one element, by its ID", "Wrapping: sign one element, read another"]
narration = "Before the demos, the words. [[slnc 500]] The identity provider is the bank: it signs. [[slnc 500]] The service provider is the shop: it checks. [[slnc 500]] The assertion is the signed statement: this is Ana. [[slnc 500]] An X M L signature covers one element, named by its I D. [[slnc 500]] And signature wrapping means the signature covers one element, while the code reads another."

[[scene]]
key = "03-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "03-two-questions"
kind = "figure"
title = "A signature answers two questions"
body = "two_questions"
narration = """Let's see the whole idea on one picture. [[slnc 400]] A signature answers two questions. [[slnc 300]] Whose key made it? [[slnc 300]] And which element does it cover? [[slnc 700]] The table shows three shops. [[slnc 300]] The trusting shop takes the key from the message, so a self-signed response signs the attacker in as admin. [[slnc 500]] The pinned-key shop uses the bank's key, but reads the first assertion in the file, so a wrapped response signs the attacker in too. [[slnc 500]] The strict shop uses the bank's key, and reads only the element the signature covers. [[slnc 300]] Both attacks are refused. [[slnc 600]] That is the core of this video: trust only the bank's key, and read only what that key signed."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "04-costs"
kind = "bullets"
title = "What It Costs"
body = ["XML signatures are hard to use correctly", "A pinned key needs a rotation plan", "Clocks must roughly agree", "Replay protection needs state", "Encryption, logout and attributes are more work"]
narration = "Nothing is free. [[slnc 400]] Here is what it costs. [[slnc 500]] X M L signatures are hard to use correctly, which is why a maintained library is the right choice. [[slnc 500]] Pinning the bank's key needs a plan for when the bank changes it. [[slnc 500]] The clocks of the bank and the shop must roughly agree. [[slnc 500]] Refusing a replayed assertion means remembering every id for a while. [[slnc 300]] And encrypted assertions, logout, and attribute mapping are more work again."

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Signing in at work through another site", "A SAMLResponse field in the network tab", "Advisories about \"XML signature wrapping\"", "A KeyInfo element inside a signature"]
narration = "You have probably met this already. [[slnc 400]] Signing in to a work tool through another site, and coming back, is often SAML. [[slnc 500]] A SAML response field, in the browser's network tab, is the signed statement on its way. [[slnc 500]] Security advisories about X M L signature wrapping are the fourth demo, in real products. [[slnc 500]] And a key info element inside a signature is the key the trusting shop wrongly believed."

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Use a maintained SAML library", "Pin the bank's key; ignore the one in the message", "Exactly one assertion, signed itself", "Read only the element the signature covers", "Check expiry, audience, request; refuse replay", "Refuse any DOCTYPE"]
narration = "So, how do you use it? [[slnc 400]] Use a maintained SAML library, and keep it patched. [[slnc 300]] Pin the bank's key, and ignore any key in the message. [[slnc 500]] Require exactly one assertion, with its own signature. [[slnc 300]] Read only the element that the signature covers. [[slnc 500]] Check the expiry, the audience, and the request it answers, and refuse a replay. [[slnc 300]] And refuse any doc type, before the document is read."

[[scene]]
key = "07-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Put the forged assertion after", "the genuine one, and see which shops read it."]
narration = "That's SAML single sign on and signature wrapping. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] A valid signature is not the same as the statement you believed, so trust only the bank's key, and read only what that key signed. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine, with nothing installed except a Java development kit. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Put the forged assertion after the genuine one, and see which shops read it. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] Everything runs in one Java process, with a fixed clock and fixed assertion ids, so every run prints the same text. [[slnc 300]] Here are the classes that matter."""

[[class]]
name = "Idp"
what = "the bank: signs the assertion, puts its key in KeyInfo"
[[class.part]]
title = "an enveloped signature over #ID"
code = """
String uri = "#" + assertion.getAttribute("ID");
DigestMethod sha256 = f.newDigestMethod(DigestMethod.SHA256, null);
...
Reference ref = f.newReference(uri, sha256, transforms, null, null);
...
KeyInfo ki = kif.newKeyInfo(List.of(kif.newKeyValue(signer.getPublic())));
...
f.newXMLSignature(si, ki).sign(ctx);
"""
speech = """The identity provider plays the bank. [[slnc 300]] Its reference points at the assertion by its I D, with an S H A two fifty six digest. [[slnc 300]] It puts its public key into key info, as many identity providers do, and signs."""

[[class]]
name = "SignatureSteps"
what = "a teaching class: the digest and the RSA check, by hand"
[[class.part]]
title = "the digest, then the signature"
code = """
byte[] canonical = readAll(ref.getDigestInputStream());
MessageDigest sha256 = MessageDigest.getInstance("SHA-256");
String byHand = Base64.getEncoder().encodeToString(sha256.digest(canonical));
...
Signature rsa = Signature.getInstance("SHA256withRSA");
rsa.initVerify(key);
rsa.update(signedInfo);
boolean signatureByHand = rsa.verify(value);
"""
speech = """This class redoes the second demo by hand. [[slnc 300]] It hashes the canonical bytes of the assertion, and verifies signed info with R S A. [[slnc 300]] A test proves it gives exactly the library's verdict."""

[[class]]
name = "SignatureCheck"
what = "validates one XML signature; who supplies the key is the difference"
[[class.part]]
title = "the key from the message, or the pinned key"
code = """
if (o instanceof KeyValue kv) {
...
static KeySelector pinned(PublicKey trusted) {
    return KeySelector.singletonKeySelector(trusted);
}
"""
speech = """The embedded key selector takes the key out of the message: that is the trusting shop. [[slnc 300]] The pinned selector only ever returns the bank's key, which the shop was given in advance."""

[[class]]
name = "PinnedKeyServiceProvider"
what = "pins the bank's key, but reads the first assertion"
[[class.part]]
title = "two questions, two different elements"
code = """
SignatureCheck.validate(doc, (Element) sigs.get(0), pinned(idpKey));
// the FIRST assertion in the document, signed or not
Element assertion = (Element) Xml.byName(doc, Xml.SAML, "Assertion").item(0);
return Xml.text(assertion, Xml.SAML, "NameID");
"""
speech = """This is the wrapping bug. [[slnc 300]] The first signature is validated with the bank's key. [[slnc 300]] Then the first assertion in the document is read, whether or not that signature covers it."""

[[class]]
name = "StrictServiceProvider"
what = "reads only what the signature covers, then checks the statement"
[[class.part]]
title = "one assertion, the one that was signed"
code = """
if (assertions.getLength() != 1) {
    throw new SamlRefused("exactly one assertion is required");
}
...
Element signature = (Element) sigs.get(0);
SignatureCheck.Result checked = SignatureCheck.validate(doc, signature, pinned(idpKey));
String id = assertion.getAttribute("ID");
if (id.isEmpty() || !id.equals(checked.coveredId()) || countIds(doc, id) != 1) {
"""
speech = """The strict provider requires exactly one assertion. [[slnc 300]] It validates with the pinned key. [[slnc 300]] And the element it reads must be the very element the signature covers, with an I D that appears only once."""
[[class.part]]
title = "then the statement itself"
code = """
if (!AUDIENCE.equals(Xml.text(conditions, Xml.SAML, "Audience"))) {
...
if (!pendingRequestId.equals(confirmation.getAttribute("InResponseTo"))) {
...
if (!usedAssertions.add(id)) {
"""
speech = """Then the statement. [[slnc 300]] The audience must be this shop. [[slnc 300]] It must answer the request this browser made. [[slnc 300]] And an assertion I D is accepted only once."""

[[class]]
name = "Attacks"
what = "the forgeries, made the way an attacker would"
[[class.part]]
title = "signature wrapping"
code = """
forged.setAttribute("ID", "forged-1");
forged.getElementsByTagNameNS(Xml.SAML, "NameID").item(0).setTextContent(forgedName);
...
extensions.appendChild(signed);
response0.insertBefore(forged, response0.getFirstChild());
"""
speech = """The wrapping attack copies the assertion, removes its signature, and changes the name. [[slnc 300]] The genuine assertion moves into extensions, and the forged copy goes first."""

[[acronym]]
short = "SAML"
long = "Security Assertion Markup Language: signed sign-in statements in XML"
say = "SAML is the security assertion markup language: the bank's signed statement about who signed in, written in X M L."
[[acronym]]
short = "XML"
long = "Extensible Markup Language: nested elements in angle brackets"
say = "X M L is the extensible markup language: text made of nested elements in angle brackets."
[[acronym]]
short = "SSO"
long = "Single Sign-On: sign in once, at the bank, for many sites"
say = "S S O is single sign on: you sign in once, at the bank, and many sites accept it."
[[acronym]]
short = "IdP"
long = "Identity Provider: the bank, which signs the assertion"
say = "I d P is the identity provider. Here, the bank, which signs the assertion."
[[acronym]]
