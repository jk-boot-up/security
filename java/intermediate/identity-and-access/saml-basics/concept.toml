[threatmodel]
scope = """
A shop's SAML service provider that accepts responses through the customer's browser. It covers the validation of signed assertions.
It does not cover the identity provider's security, SAML logout or encryption, or the customer's device.
"""
assets = [
    "The shop's accounts, and the identity they are given to.",
    "The identity provider's signing key.",
]
actors = [
    "A customer signing in.",
    "An attacker who can edit and replay the response on its way through their own browser.",
]
boundaries = [
    "Identity provider to shop, through the customer's browser: everything in the response is untrusted until validated.",
]
assumptions = [
    "The identity provider's public key was obtained out of band and pinned.",
    "The shop's clock is correct to within the allowed skew.",
]
out_of_scope = [
    "A compromised identity provider.",
    "SAML logout, encrypted assertions and attribute mapping.",
]
tests = [
    "`SamlTest` checks every provider against genuine, self-signed, edited, wrapped, replayed, expired, misdirected and malformed responses and unsigned or misplaced signatures.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next module, tls-in-practice, looks at the certificates and channels underneath all of these exchanges, starting with a local certificate authority.
"""

[[threat]]
id = "T1"
stride = "S"
threat = "A response signed by the attacker's own key is accepted"
where = "`TrustingServiceProvider`"
control = "Pin the identity provider's key; ignore KeyInfo"
residual = "A compromised or mis-pinned key"

[[threat]]
id = "T2"
stride = "T"
threat = "Signature wrapping: the signed element is not the one that is read"
where = "`PinnedKeyServiceProvider`"
control = "One assertion, signature inside it, validated reference equals the element read, unique ID"
residual = "Parser differences between the signature library and the code that reads the document"

[[threat]]
id = "T3"
stride = "R"
threat = "A captured response is replayed, or used for another shop or request"
where = "`StrictServiceProvider`"
control = "Audience, recipient, InResponseTo, validity period and remembered assertion ids"
residual = "Replay state lost on restart; keep it as long as the assertion is valid"

[[threat]]
id = "T4"
stride = "D"
threat = "Entities in the response read files or exhaust memory"
where = "`Xml.parse`"
control = "DOCTYPE refused, secure processing on"
residual = "Very large documents within the size limit of the web server"

