[[act]]
title = "How the bank signs the assertion"
summary = "The bank drops the Signature element, canonicalizes the assertion to 614 bytes, hashes them with SHA-256 into the DigestValue, puts that into a 640-byte SignedInfo and signs SignedInfo with RSA-SHA256; the shop redoes the digest and the RSA check by hand and gets the library's verdict."
detail = """
The input is the assertion a1 as XML. Step 1 (the enveloped transform): the Signature element itself is left out. Step 2: exclusive XML
canonicalization writes the assertion in one exact form, 614 bytes, so that spaces and namespace prefixes cannot change the result. Step 3: the
DigestValue is the SHA-256 of those bytes, in base64; it is the same on every run because the ids and the clock are fixed. Step 4: SignedInfo
holds the Reference URI #a1 and that DigestValue, 640 bytes once canonicalized. Step 5: the SignatureValue is RSA-SHA256 over SignedInfo with the
bank's private key, 256 bytes; the key is new on every run, so the value is shown as a placeholder. The shop checks it in reverse, by hand: the
SHA-256 of the same bytes equals the DigestValue, and RSA verification of SignedInfo with the bank's public key succeeds; the library's
XMLSignature.validate agrees. The signature covers #a1 and nothing else.
"""
figure = "digest_steps"
figure_title = "How the signature is made, step by step"
figure_speech = """
Second demo: how the bank's signature is made. [[slnc 400]] At the top, before signing: the assertion, as X M L. [[slnc 600]]
Step one. The signature will sit inside the assertion, so it leaves itself out. [[slnc 300]] Step two. The assertion is written in one exact form, called canonical X M L. [[slnc 300]] That is six hundred and fourteen bytes. [[slnc 300]] Step three. Those bytes are hashed with S H A two fifty six. [[slnc 300]] That gives the digest value. [[slnc 300]] Step four. The digest value and the I D a one go into a small element called signed info. [[slnc 300]] Step five. The bank signs signed info with its private R S A key. [[slnc 700]]
The digest is the same on every run, because the ids and the clock are fixed. [[slnc 300]] The signature value is not, because the demo makes a new key each time. [[slnc 500]] At the bottom, the shop redoes both checks by hand, and they agree with the library.
"""
speech = """
Here is the output. [[slnc 400]] The assertion, before signing, starts like this. [[slnc 300]] Six hundred and fourteen bytes, once canonical. [[slnc 400]] Then the five steps. [[slnc 300]] The digest value, in base sixty four. [[slnc 300]] Signed info, six hundred and forty bytes. [[slnc 300]] And the signature value: two hundred and fifty six bytes, shown as a placeholder.
[[page]]
After signing, the signature sits inside the assertion. [[slnc 300]] It carries the reference, the digest, the value, and the signer's public key. [[slnc 500]] The shop checks it by hand. [[slnc 300]] The hash of the same bytes equals the digest value. [[slnc 300]] R S A verification with the bank's key is true. [[slnc 300]] And the library agrees. [[slnc 400]] The signature covers a one, and nothing else.
"""
rows = { genuine = "active ok" }
console = [
    ["BEFORE SIGNING (the assertion, as XML):", "code"],
    ["  <saml:Assertion xmlns:saml=\"urn:oasis:names:tc:SAML:2.0:as...", "muted"],
    ["  <saml:Issuer>https://idp.bank.example</saml:Issuer><saml:S...", "muted"],
    ["  (614 bytes once canonicalized)", "muted"],
    ["HOW THE BANK SIGNS IT (step by step):", "code"],
    ["  1. drop the Signature element itself (enveloped)", "muted"],
    ["  2. canonicalize: exclusive XML c14n -> 614 bytes", "muted"],
    ["  3. DigestValue = base64(SHA-256(those bytes))", "muted"],
    ["     Wx5yAVx5mk5fBilLz82ytRLo9aaIj/66yEPlHDlh7zM=", "muted"],
    ["  4. SignedInfo = Reference #a1 + DigestValue -> 640 bytes", "muted"],
    ["  5. SignatureValue = RSA-SHA256(bank's private key, SignedInfo)", "muted"],
    ["     256 bytes = <random: a new RSA key on every run>", "muted"],
    ["---", ""],
    ["AFTER SIGNING (inside the assertion, after the Issuer):", "code"],
    ["  <ds:Signature> Reference URI #a1, DigestValue, SignatureValue,", "muted"],
    ["                 KeyInfo: the signer's RSA public key", "muted"],
    ["HOW THE SHOP CHECKS IT (redone by hand, with the bank's key):", "code"],
    ["  1. SHA-256 of the same bytes again = DigestValue: true", "muted"],
    ["  2. RSA verify of SignedInfo, the bank's public key: true", "muted"],
    ["  3. the library's XMLSignature.validate agrees: true", "muted"],
    ["THE RESULT:", "code"],
    ["  the signature covers #a1 and nothing else", "muted"],
]

[[act]]
title = "A valid signature is not the same as the bank's signature"
summary = "A response the attacker signs with their own key is valid with the key in its KeyInfo, so the trusting provider signs them in as admin; with the bank's pinned key it is not valid and is refused; editing the name in a genuine response changes the digest and is refused too."
detail = """
The input: the same XML shape with NameID admin@bank.example, signed with the attacker's own key, whose public half sits in KeyInfo. Before the
fix, the trusting provider validates with the key the message carries: the signature is valid, and the attacker is signed in as
admin@bank.example. After the fix, the pinned-key provider validates with the bank's key, known in advance: the signature is not valid, and the
response is refused. Then one name is edited in a genuine response: the DigestValue in SignedInfo still says what the bank signed, but the SHA-256
of the edited assertion is different, so the signature is not valid.
"""
figure = "whose_key"
figure_title = "Whose key made the signature?"
figure_speech = """
Third demo: whose key made the signature? [[slnc 400]] At the top, the input. [[slnc 300]] The attacker builds the same X M L, names the admin, and signs it with their own key. [[slnc 300]] The public half of that key travels inside the message, in key info. [[slnc 700]]
On the left, before the fix. [[slnc 300]] The trusting shop checks the signature with the key the message carries. [[slnc 300]] Of course it is valid. [[slnc 300]] The attacker is signed in as the admin. [[slnc 600]]
On the right, after the fix. [[slnc 300]] The shop checks with the bank's key, which it was given in advance. [[slnc 300]] Not valid: refused. [[slnc 700]]
At the bottom, a name edited in a genuine response. [[slnc 300]] The digest the bank signed and the digest of the edited assertion are different. [[slnc 300]] So any edit breaks the signature.
"""
speech = """
Here is the output. [[slnc 400]] The attacker's response names the admin, and carries the attacker's key. [[slnc 400]] Before the fix: valid with the key it carries, and signed in as admin. [[slnc 300]] Anyone can sign. [[slnc 400]] After the fix: not valid with the bank's key. [[slnc 300]] Refused.
[[page]]
Now a genuine response, with one name edited. [[slnc 400]] The digest value as signed, and the hash of the edited assertion. [[slnc 300]] They differ. [[slnc 300]] Refused: the signature is not valid.
"""
