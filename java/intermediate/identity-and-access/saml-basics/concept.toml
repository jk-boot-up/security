    ["    saml:Assertion ID forged-1, NameID admin@bank.example, unsigned", "muted"],
    ["    samlp:Extensions", "muted"],
    ["      saml:Assertion ID a1, NameID ana@bank.example", "muted"],
    ["        ds:Signature covers #a1", "muted"],
    ["BEFORE THE FIX (pinned-key provider):", "code"],
    ["  1. first signature, the bank's key: valid true, covers #a1", "muted"],
    ["  2. first assertion read: ID forged-1, NameID admin@bank.example", "muted"],
    ["  -> signed in as admin@bank.example", "bad"],
    ["  <- CHECKED ONE ELEMENT, READ ANOTHER", "amber"],
    ["---", ""],
    ["AFTER THE FIX (strict provider: read only what is signed):", "code"],
