[[act]]
title = "Signature wrapping: one assertion checked, another read"
summary = "The attacker moves the genuine signed assertion a1 into an Extensions element and puts an unsigned copy forged-1 naming admin first; the pinned-key provider validates the signature over #a1, reads forged-1 and signs in admin; the strict provider counts two assertions and refuses, and it also refuses the self-signed and edited responses."
detail = """
The input: the attacker keeps the genuine signed assertion a1 untouched but moves it into samlp:Extensions, and puts an unsigned copy with ID
forged-1 and NameID admin@bank.example first in the response. Before the fix, the pinned-key provider asks "is the first signature valid with the
bank's key?" (yes, it covers #a1) and then reads the first assertion in the document: forged-1, admin@bank.example. After the fix, the strict
provider requires exactly one assertion, directly under the response, with its own signature inside it, whose validated reference is that same
element. The wrapped response has two assertions and is refused. The strict provider refuses the self-signed and the edited responses as well.
"""
figure = "wrapping_tree"
figure_title = "The signature covers one element; the code reads another"
figure_speech = """
Fourth demo: signature wrapping. [[slnc 400]] At the top, the input: the wrapped response. [[slnc 300]] The attacker keeps the bank's signed assertion, a one, exactly as it was, and tucks it into an extensions element. [[slnc 300]] Then an unsigned copy, forged one, naming the admin, goes first. [[slnc 700]]
Before the fix, the pinned-key shop asks two separate questions. [[slnc 300]] Is the first signature valid, with the bank's key? [[slnc 300]] Yes: it covers a one. [[slnc 300]] Then, what does the first assertion say? [[slnc 300]] It reads forged one, and signs in the admin. [[slnc 700]]
After the fix, the strict shop requires exactly one assertion, with the signature inside it, and reads only the element the signature covers. [[slnc 300]] There are two assertions, so it refuses.
"""
speech = """
Here is the output. [[slnc 400]] The wrapped response: forged one first, unsigned. [[slnc 300]] Then the extensions element, with a one and its signature inside. [[slnc 500]] Before the fix: the first signature is valid, and covers a one. [[slnc 300]] The first assertion read is forged one. [[slnc 300]] Signed in as admin. [[slnc 300]] Checked one element, read another.
[[page]]
After the fix: two assertions in the document. [[slnc 300]] Refused. [[slnc 400]] And the strict provider refuses the other two attacks as well: the self-signed response and the edited one.
"""
rows = { wrap = "active wrong", strict = "active ok" }
console = [
    ["THE WRAPPED RESPONSE (the attacker moves the signed one):", "code"],
