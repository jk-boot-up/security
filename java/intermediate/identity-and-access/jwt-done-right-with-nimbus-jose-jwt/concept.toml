# concept.toml: everything about this project that is not Java code.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "jwt-done-right-with-nimbus-jose-jwt"
level = "intermediate"
module = "identity-and-access"
title = "JWT Done Right with Nimbus JOSE + JWT"
short_title = "JWT with Nimbus"
package = "jwtnimbus"
main_class = "NimbusJwtDemo"
tagline = "A standard library does the parsing, the signature and most claims; the algorithm, the type, the key set URL and the policy are still the API's to set"
bold = "With Nimbus JOSE + JWT an API verifies a bearer token by fixing the algorithm and the type, taking keys only from the one key set URL in its settings, and letting the library check the signature, expiry, issuer, audience and required claims; but the scope, the lifetime policy, the cache time of the key set and the fact that a token cannot be taken back remain the API's own decisions."
domain = "an online bank"
domain_note = ""
youtube_description = "JWT validation with Nimbus JOSE + JWT 10 in Java 25, the same checks as the plain project with a standard library and a real key set endpoint: decoding versus verifying, a fixed algorithm and type against none, HS256 key confusion and the wrong type, expiry with clock skew, issuer, audience and scope, keys by id from a published set with caching and rotation, a retired key that lives on in the cache, a minimum time between refetches, jku and jwk headers that are never followed, and why a token cannot be taken back."
thumb_lines = ["JWT WITH", "NIMBUS JOSE"]
thumb_code = "new JWSVerificationKeySelector<>(ES256, keys)"
youtube_title = "JWT Validation with Nimbus JOSE + JWT: Algorithms, Claims, JWKS Caching and Rotation (OWASP A07)"
youtube_tags = ["jwt", "nimbus jose jwt", "jwks", "es256", "token validation", "key rotation", "owasp top 10", "a07", "java", "identity"]

[readme]
intro = """
The plain [jwt-done-right](../jwt-done-right) project builds a token validator from scratch. This one uses the library most Java stacks already contain, **Nimbus JOSE + JWT 10.10** (the one behind Spring Security's resource server), against a **real key set endpoint** on the loopback address, with **ES256** tokens. It needs no Docker.

What it shows:
- **Parsing is not verifying.** `SignedJWT.parse` reads the claims of a token whose claims were edited to `sub=mallory`; the processor refuses it with `Invalid signature`.
- **The server chooses the algorithm and the type.** A token with `alg: none` and the right type (`Unsecured (plain) JWTs are rejected`), an HS256 token signed with the bank's public key as the secret (`Another algorithm expected`), and a correctly signed token of type `id+jwt` are all refused, because `JWSVerificationKeySelector` is built for ES256 and the type verifier for `at+jwt`.
- **Every claim.** Expiry with 30 seconds of clock skew, not-before, exact issuer, audience and required claims are checked by `DefaultJWTClaimsVerifier` (with a clock the demo can move); the scope and the 15-minute lifetime policy are two checks of our own.
- **Keys by id, from one URL.** 100 tokens cost **one** fetch of the key set. An unknown key id makes the library ask once more and then it is rate limited. A **`jku` header** pointing at the attacker's own key set is never followed (the attacker's server is asked 0 times), and a `jwk` header is ignored. A new key is **published before it is used**, and a **retired key lives on in the cache** until it expires.
- **The bill.** Ana's access token still works two minutes after her access was removed, her refresh token (a random string looked up on the server) does not, and a token that asks for 24 hours is refused.

**Maps to:** OWASP Top 10 (2025) A07 Authentication Failures · CWE-347 (improper verification of cryptographic signature) · CWE-345 · RFC 7519 (JWT), RFC 7515 (JWS), RFC 7517 (JWK), RFC 8725 (JWT best current practice), RFC 9068 (JWT access tokens).
"""
analogy = """
A bank teller who has to check a cheque. The printing, the signature and the date can be checked by anyone with the right stamp and a reference book, and a library is that stamp and that book. Whether this cheque is for this bank, today, for this much, is still the teller's decision.
"""
scenario = """
An online bank's authorization server signs access tokens and publishes its keys at a URL. The accounts API verifies each bearer token with Nimbus. The demo runs a real key set server on a loopback port and sends the API good tokens and every kind of bad one.
"""
costs = [
    "**A cache means a retired key lives on.** Until the cache expires, a token signed with a key the bank has stopped publishing is still accepted, so the cache time is part of a key compromise plan.",
    "**A rate limit on refetches protects the key set endpoint** and also delays the first use of a key that was published late; publish a new key before you sign with it.",
    "**Clock skew is a tolerance an attacker also enjoys.** The 30 seconds should be as small as the clocks allow.",
    "**The library does not know your policy.** Scope, maximum lifetime and which type of token this API takes are your code.",
    "**An access token cannot be taken back,** so short lives and a revocable refresh token are the answer.",
]
too_much = """
For one service that is the only issuer and the only verifier, a shared secret and a few lines may do, but the day a second service verifies tokens it should have the public half only, and a key set endpoint is how it gets it.
"""
met_before = [
    "`NimbusJwtDecoder.withJwkSetUri(...)` in Spring Security's resource server.",
    "`/.well-known/jwks.json` on an identity provider.",
    "A token with `\"alg\":\"none\"` in a pen test report.",
    "`kid` in a JWT header.",
]
where = """
This is the tools version of [jwt-done-right](../jwt-done-right), in the [identity-and-access](..) module. It follows the same five acts with the same checks, on a standard library and a real key set endpoint.
"""
twin = """
The key set server is a real HTTP server on the loopback interface, and the keys are generated fresh on every run and never printed. The demo takes its time from a clock it can move, so a token's life of five minutes takes no time to wait for; only the cache of the key set uses real time, in a second or two, and it is shown on purpose.
"""
test_note = "Every test generates new keys and starts its own key set server on a free loopback port. The key set cache tests wait a fraction of a second on purpose."

[[act]]
title = "Decoding is not verifying"
summary = "A token is three base64url parts; anyone can read the claims, and a reader that only parses says mallory for a token whose claims were edited, while the processor refuses it."
detail = """
The bank issues ana an access token of 347 characters in 3 parts. The header says ES256, type at+jwt and key id bank-2026-01. The claims name the issuer, the subject ana, the audience accounts-api, the scope, and the times. The third part is a 64-byte ES256 signature. The claims are readable by anyone: base64url is an encoding, not encryption. With the claims edited to sub mallory and ana's signature kept, a reader that only parses says mallory, and the validator refuses it: Invalid signature.
"""
speech = """
First demo: decoding is not verifying. [[slnc 400]] A token has three parts, and anyone can read the claims. [[slnc 600]]
The third part is a sixty four byte signature. [[slnc 600]]
Edit the claims to say mallory, keep ana's signature, and a reader that only parses says mallory. [[slnc 300]] The processor refuses it, because the signature does not match.
"""
rows = { decode = "active wrong" }
console = [
    ["header: kid bank-2026-01, typ at+jwt, alg ES256", "ok"],
    ["the claims edited to sub=mallory: parse says mallory", "bad"],
    ["the validator -> refused (Signed JWT rejected: Invalid signature)", "ok"],
]

[[act]]
title = "The server chooses the algorithm"
summary = "A token with alg none, an HS256 token signed with the public key as the secret, and a correctly signed token of the wrong type are all refused, because the algorithm and the type are settings of the API."
detail = """
Ana's token with the bank's key is accepted. The same claims with a header that says none and no signature are refused: Unsecured JWTs are rejected, even though the header names the right type. A token whose header says HS256, signed with the bank's public key as the shared secret, is refused: another algorithm was expected. A correctly signed token of type id+jwt, offered as an access token, is refused: type not allowed. The algorithm and the type are settings of the API.
"""
speech = """
Second demo: the server chooses the algorithm. [[slnc 400]] A token that says none, with no signature, is refused. [[slnc 600]]
A token that says H S two five six, signed with the bank's public key as the secret, is refused. [[slnc 600]]
A correctly signed token of the wrong type is refused too. [[slnc 300]] The algorithm and the type belong to the A P I, not to the token.
"""
rows = { algorithm = "active ok" }
console = [
    ["alg none, no signature -> refused (Unsecured JWTs are rejected)", "ok"],
    ["HS256 signed with the public key -> refused (Another algorithm expected)", "ok"],
    ["type id+jwt -> refused (type not allowed)", "ok"],
]

[[act]]
title = "Every claim that matters"
summary = "Expiry with 30 seconds of skew, not-before, issuer and audience are checked by the library; the scope is one check of our own."
detail = """
At the moment of issue the token is accepted. 20 seconds after exp, inside the 30 seconds of clock skew, it is accepted. 31 seconds after exp it is refused: Expired JWT. A token that starts in 2 minutes is refused: before use time. A token from another authorization server is refused for its issuer, and one meant for the loyalty API is refused for its audience. A token with only the scope cards:read is refused for a missing scope accounts:read. A valid signature proves who wrote the token; only the claims say whether it is for this API, now.
"""
speech = """
Third demo: every claim that matters. [[slnc 400]] Twenty seconds after expiry, a token is still accepted, inside the clock skew. [[slnc 600]]
Thirty one seconds after, it is refused. [[slnc 600]]
A token that starts later is refused, and so is one from another issuer, or meant for another A P I. [[slnc 600]]
A missing scope is refused by a check of our own. [[slnc 300]] A valid signature says who wrote the token, only the claims say whether it is for this A P I, now.
"""
rows = { claims = "active ok" }
console = [
    ["20 seconds after exp -> accepted (inside the skew)", "ok"],
    ["31 seconds after exp -> refused (Expired JWT)", "ok"],
    ["another issuer, another audience -> refused", "ok"],
    ["only the scope cards:read -> refused (missing scope accounts:read)", "ok"],
]

[[act]]
title = "Keys by id, from one URL"
summary = "100 tokens cost one fetch of the key set; unknown key ids, jku and jwk headers never make the API trust an attacker's key; a new key is published before it is used, and a retired key lives on in the cache."
detail = """
The bank publishes 1 key. The first token fetches the key set and 100 more tokens come from the cache: the endpoint was asked 1 time. A token naming a key id the API has never seen makes the library ask once more and is refused, and 100 more of them cause 0 more fetches, because of the minimum time between refetches. A token signed with another key under the bank's key id is refused for its signature. A token whose header points at the attacker's own key set is refused and the attacker's server is asked 0 times, and a token that carries its own public key is refused too. The bank publishes a new key before using it; after the cache time the API trusts 2 keys. When the old key is retired, the old token is still accepted inside the cache time, and refused after it.
"""
speech = """
Fourth demo: keys by id, from one U R L. [[slnc 400]] A hundred tokens cost one fetch of the key set. [[slnc 600]]
A token naming an unknown key is refused, and a hundred more cause no more fetches. [[slnc 600]]
A token whose header points at the attacker's own key set is refused, and the attacker's server is never asked. [[slnc 600]]
A new key is published before it is used. [[slnc 300]] A retired key lives on in the cache until the cache expires.
"""
rows = { keys = "active ok" }
console = [
    ["100 tokens -> the key set endpoint was asked 1 time", "ok"],
    ["a jku header -> refused; the attacker's server was asked 0 times", "ok"],
    ["a new key is published before it is used", "ok"],
    ["the old key retired: still accepted inside the cache time", "amber"],
]

[[act]]
title = "The bill: a token cannot be taken back"
summary = "Ana's access token works two minutes after her access was removed, her refresh token is revoked at once, the token expires after 5 minutes 31 seconds, and a lifetime of 24 hours is refused."
detail = """
Ana's access is removed 2 minutes after her token was issued. Her access token is still accepted: it works until it expires. Her refresh token, which the server looks up, is refused as revoked. At 5 minutes and 31 seconds the access token is refused: Expired JWT. A token that asks to live for 24 hours is refused by the lifetime policy of 15 minutes, which is one of our own checks. The library does the parsing, the signature and the claims, and the policy stays ours.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] Ana's access is removed, but her access token still works until it expires. [[slnc 600]]
Her refresh token, which the server looks up, is refused at once. [[slnc 600]]
So access tokens live for minutes, and a token that asks to live for a day is refused. [[slnc 300]] The library does the checks. The policy is ours.
"""
rows = { bill = "active ok" }
console = [
    ["2 minutes after removal: the access token -> accepted", "bad"],
    ["her refresh token -> refused (revoked)", "ok"],
    ["at 5 minutes 31 seconds -> refused (Expired JWT)", "ok"],
    ["a lifetime of 24 hours -> refused (policy)", "ok"],
]

