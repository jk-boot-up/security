[docs.session]
objectives = [
    "configure a Nimbus processor with a fixed algorithm, type, key source and claims verifier",
    "explain why jku and jwk headers are never followed",
    "plan a key rotation around the cache time",
    "name the checks the library does not do",
]
walkthrough = """
Run act two and find the two lines of configuration that refuse the token. In act four ask how long a stolen key keeps working after the bank retires it. In act five ask which of your own APIs needs a revocation list.
"""
exercises = [
    "Add a jti check against a small deny list and decide how long to keep an entry.",
    "Make the key cache time 10 minutes and write down the compromise plan it implies.",
    "Accept two token types and two algorithms for a migration, and then remove one.",
    "Replace ES256 with EdDSA and see which extra dependency Nimbus needs.",
]

[docs.explained]
sentence = """
A standard library verifies the signature and most claims, and the API still decides the algorithm, the type, where keys come from, the scope and the lifetime.
"""
verdict = """
Fix the algorithm and the type, give the library one key set URL and never anything from the token, verify before you believe, check issuer and audience exactly, keep access tokens short, check your own policy, publish a new key before using it, and know how long a retired key lives in your cache.
"""
recognise = [
    "`JWSVerificationKeySelector` and `DefaultJWTProcessor` in the code.",
    "`/.well-known/jwks.json` in a configuration file.",
    "A `kid` header in a decoded token.",
    "A token that still works after the user was disabled.",
]

