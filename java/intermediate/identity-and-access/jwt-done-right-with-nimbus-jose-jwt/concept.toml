First demo: the bank signs a token, with Nimbus. [[slnc 400]] At the top, the steps, with the real sizes. [[slnc 300]] The header and the claims are J S O N: fifty one and one hundred and forty three bytes. [[slnc 300]] Base64url makes them sixty eight and one hundred and ninety one characters. [[slnc 600]]
Joined by a dot, they are the signing input: two hundred and sixty bytes. [[slnc 300]] E S two five six first hashes it with S H A two five six, into thirty two bytes. [[slnc 300]] Then E C D S A, on the curve P two five six, signs the hash with the bank's private key. [[slnc 300]] The result is two numbers, R and S, sixty four bytes in all. [[slnc 700]]
