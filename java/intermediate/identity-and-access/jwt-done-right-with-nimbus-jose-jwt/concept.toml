body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Try the first exercise", "in docs/session.md."]
narration = "That's J W T with Nimbus. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] A standard library verifies the signature and most claims, and the A P I still decides the algorithm, the type, where keys come from, the scope and the lifetime. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a jti check against a small deny list and decide how long to keep an entry. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"
