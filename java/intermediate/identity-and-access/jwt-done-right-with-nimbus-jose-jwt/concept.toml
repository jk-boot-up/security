[[scene]]
key = "01-poster"
kind = "poster"
title = "JWT Done Right with Nimbus JOSE + JWT"
narration = "Hello, and welcome. [[slnc 400]] This video explains checking J W T access tokens with the Nimbus library, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A JSON web token, or J W T, is a signed note that says who the caller is and what they may do. [[slnc 300]] Nimbus parses it, checks the signature, and checks most of its claims. [[slnc 300]] But the algorithm, the type, where the keys come from, and the policy are still the A P I's to set. [[slnc 600]] Think of a cash machine that reads any bank card. [[slnc 300]] It still has to be told which banks to trust, and what the daily limit is. [[slnc 600]] Our example is an online bank."

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["The bank's sign-in server signs", "access tokens with ES256,", "and publishes its public keys at one URL.", "", "The accounts API checks every token", "with Nimbus JOSE + JWT.", "", "The demo runs a real key set server", "and sends good tokens and bad ones."]
narration = "Here is the scenario. [[slnc 400]] An online bank's sign-in server signs short access tokens, with E S two five six, and publishes its public keys at one U R L. [[slnc 500]] The accounts A P I checks every token it receives with Nimbus J O S E plus J W T, the library behind Spring Security's resource server. [[slnc 500]] The demo runs a real key set server on this machine, and sends the A P I good tokens, and every kind of bad one."

[[scene]]
key = "02-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "02-anatomy"
kind = "figure"
title = "One real token, three parts"
body = "token_anatomy"
narration = """Let's see the whole idea on one real token. [[slnc 400]] At the top, Ana's access token, three hundred and forty seven characters. [[slnc 300]] The dots split it into three parts. [[slnc 700]] Part one, in yellow, is the header: the key id, the type, and the algorithm, E S two five six. [[slnc 600]] Part two, in blue, is the claims: the subject Ana, the audience, the scope, the issuer, and three times in seconds. [[slnc 600]] Part three, in red, is the signature: two numbers, R and S, sixty four bytes, made with the bank's private key. [[slnc 300]] It changes on every run, so it is shown as a placeholder. [[slnc 700]] Anyone can decode parts one and two. [[slnc 300]] Only part three, checked with the bank's public key, proves the bank wrote them."""

[[scene]]
key = "03-acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "04-costs"
kind = "bullets"
title = "What It Costs"
body = ["A cached key lives on after it is retired", "A refetch limit protects the key set server", "Clock skew helps an attacker too", "The library does not know your policy", "An access token cannot be taken back"]
narration = "Nothing is free. [[slnc 400]] Here is what it costs. [[slnc 500]] Keys are cached, so a retired key is still trusted until the cache expires. [[slnc 500]] A limit on refetches protects the key set server, but delays a brand new key. [[slnc 500]] Thirty seconds of clock skew helps honest servers, and an attacker with a stolen token too. [[slnc 500]] The library does not know your scopes or your lifetime rules. [[slnc 300]] And an access token cannot be taken back before it expires."

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["DefaultJWTProcessor and a key selector", "A kid header in a decoded token", "A jku or jwk header in a token", "Still signed in after being disabled"]
narration = "You have probably met this already. [[slnc 400]] A default J W T processor with a key selector, in a Java service, is this library at work. [[slnc 500]] A kid header, in a decoded token, names the key the A P I should look up. [[slnc 500]] A jku or jwk header, in a token, is the token offering its own key, which must never be used. [[slnc 500]] And a user who still has access minutes after being disabled is an access token that cannot be taken back."

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Fix the algorithm and the type", "Keys from one configured URL only", "Exact issuer and audience; required claims", "Your own scope and lifetime checks", "Short access tokens; revocable refresh tokens", "Publish a new key before using it"]
narration = "So, how do you use it? [[slnc 400]] Fix the algorithm and the type in the processor, and never take them from the token. [[slnc 500]] Take keys only from the one key set U R L in your settings, never from a header. [[slnc 500]] Check the issuer and the audience exactly, and require the claims you need. [[slnc 300]] Add your own checks for scope and lifetime. [[slnc 500]] Keep access tokens short, and refresh tokens on the server, where they can be revoked. [[slnc 300]] And publish a new key before you sign with it, knowing how long the old one stays cached."

[[scene]]
key = "07-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a jti deny list and", "decide how long to keep each entry."]
narration = "That's checking J W T access tokens with Nimbus. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] A standard library checks the signature and most claims, and the A P I still decides the algorithm, the type, where keys come from, the scope and the lifetime. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a check of the token's id against a small deny list, and decide how long to keep each entry. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] Nimbus does the parsing, the signature and most claims. [[slnc 300]] Here are the classes that set it up, and the checks that stay ours."""

[[class]]
name = "AccessTokenValidator"
what = "Nimbus set up by the API, then our own checks"
[[class.part]]
title = "keys from one URL, cached"
code = """
JWKSource<SecurityContext> keys = JWKSourceBuilder.<SecurityContext>create(jwks)
        .cache(cacheMillis, 1_000L)
        .refreshAheadCache(false)
        .rateLimited(minRefetchMillis)
"""
speech = """The key source is built from the one key set U R L in the settings. [[slnc 300]] It caches the keys, and limits how often an unknown key id may cause a new fetch."""
[[class.part]]
title = "the algorithm and the type, fixed"
code = """
processor.setJWSTypeVerifier(
        new DefaultJOSEObjectTypeVerifier<>(BankIssuer.ACCESS_TOKEN));
processor.setJWSKeySelector(
        new JWSVerificationKeySelector<>(JWSAlgorithm.ES256, keys));
"""
speech = """These two lines refuse none, H S two five six and the I D token. [[slnc 300]] The type must be at J W T, and only E S two five six keys are selected."""
[[class.part]]
title = "the claims: the library's, then ours"
code = """
Set.of(audience),
new JWTClaimsSet.Builder().issuer(BankIssuer.ISSUER).build(),
Set.of("sub", "iss", "aud", "exp", "iat", "nbf", "scope"),
...
claims.setMaxClockSkew(CLOCK_SKEW_SECONDS);
...
if (!List.of(scope.split(" ")).contains(requiredScope)) {
    throw new Refused("missing scope " + requiredScope);
"""
speech = """The claims verifier takes the audience, the exact issuer, and the claims that must be present, with thirty seconds of skew. [[slnc 300]] The scope and the lifetime are checked by our own code, after the library."""

[[class]]
name = "BankIssuer"
what = "the bank's authorization server: signs with the current key"
[[class.part]]
title = "an ES256 header with a key id"
code = """
JWSHeader.Builder header = new JWSHeader.Builder(JWSAlgorithm.ES256)
        .type(type);
...
SignedJWT jwt = new SignedJWT(header, claims);
jwt.sign(signer);
return jwt.serialize();
"""
speech = """The bank builds a header with E S two five six, the type, and the key id. [[slnc 300]] Nimbus signs the header and the claims, and writes the three parts."""

[[class]]
name = "JwksServer"
what = "the key set, served over HTTP on the loopback"
[[class.part]]
title = "public halves only, and a counter"
code = """
body = new JWKSet(keys.stream()
        .map(JWK::toPublicJWK)
        .map(JWK.class::cast)
        .toList()).toString();
...
requests.incrementAndGet();
"""
speech = """The key set server publishes only the public halves of the keys. [[slnc 300]] It counts every request, so the demo can show how many fetches the cache saved."""

[[class]]
name = "DemoKeys"
what = "fixed P-256 keys from a seed, so the key set repeats"
[[class.part]]
title = "a fixed seed instead of random bytes"
code = """
return new ECKeyGenerator(Curve.P_256)
        .keyID(kid)
        .secureRandom(new FixedRandom(seed))
        .generate();
"""
speech = """For a repeatable demo, the keys come from a fixed seed. [[slnc 300]] Real keys come from real randomness, and this class must never leave a demo."""

