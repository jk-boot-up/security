[[act]]
title = "Parsing is not verifying"
summary = "The claims part is replaced to say sub mallory with ana's signature kept: SignedJWT.parse alone returns mallory, while DefaultJWTProcessor verifies the signature first, gets false, and refuses with Invalid signature."
detail = """
Only the claims part is replaced: "sub":"ana" becomes "sub":"mallory", so part 2 grows from 191 to 196 characters, while the header and Ana's
86-character signature stay. SignedJWT.parse alone reads the claims and checks nothing: getSubject() returns mallory. The validator, a
DefaultJWTProcessor, verifies part 3 over parts 1 and 2 with the public key of bank-2026-01 first: false. It refuses the token with Signed JWT rejected:
Invalid signature. Anyone can read the claims, since base64url is an encoding, not encryption, so no secret belongs in them.
"""
figure = "forged_token"
figure_title = "Ana's signature on mallory's claims"
figure_speech = """
Second demo: parsing is not verifying. [[slnc 400]] At the top, the edit. [[slnc 300]] Someone changes sub, ana, into sub, mallory. [[slnc 600]]
The token sent keeps part one, the header, and part three, Ana's signature. [[slnc 300]] Only part two, the claims, is new. [[slnc 700]]
On the left, the library's parse method alone. [[slnc 300]] Parsing reads the claims of any token, and checks nothing. [[slnc 300]] Get subject says mallory. [[slnc 600]]
On the right, the validator: the library's J W T processor. [[slnc 300]] Before it trusts any claim, it checks the signature over parts one and two, with the bank's public key. [[slnc 300]] The answer is false. [[slnc 300]] Refused: invalid signature.
"""
speech = """
Here is the output. [[slnc 400]] The edit, and the token sent. [[slnc 400]] Parse alone says mallory. [[slnc 400]] The processor's signature check gives false, and the token is refused. [[slnc 400]] Anyone can read the claims, so no secret belongs in them.
"""
rows = { decode = "active ok" }
console = [
    ["THE EDIT (only the claims part is replaced):", "code"],
