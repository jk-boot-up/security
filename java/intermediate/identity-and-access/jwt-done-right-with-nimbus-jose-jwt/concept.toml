[[acronym]]
short = "HS256, HMAC, SHA"
long = "HMAC with SHA-256, a keyed hash; Secure Hash Algorithm"
say = "S H A is the secure hash algorithm. H S two five six is H Mac with S H A two five six, a hash based message authentication code made with a shared secret."
[[acronym]]
short = "base64url"
long = "64 characters, 6 bits each, safe in a web address"
say = "Base64url writes bytes with sixty four characters, six bits each, all safe in a web address."
[[acronym]]
short = "iss, sub, aud"
long = "claims: issuer, subject, audience"
say = "In the claims, i s s is the issuer, sub is the subject, and aud is the audience."
[[acronym]]
short = "iat, nbf, exp"
long = "claims: issued at, not before, expires, in seconds"
say = "I a t is issued at, n b f is not before, and e x p is the expiry, all in seconds since nineteen seventy."
[[acronym]]
short = "kid, typ, alg"
long = "header: key id, token type, algorithm"
say = "In the header, kid is the key id, typ is the token type, and alg is the algorithm."
[[acronym]]
short = "at+jwt, ID"
long = "access token type; an ID (identity) token is for the app"
say = "At plus J W T marks an access token. An I D token, short for identity token, is meant for the app, not for an A P I."
[[acronym]]
short = "UTC, ASCII, ms"
long = "Coordinated Universal Time; American text code; milliseconds"
say = "U T C is coordinated universal time. A S C I I is the American standard code for information interchange. And m s means milliseconds."
[[acronym]]
short = "hex"
long = "hexadecimal: one byte as two digits, 0-9 and a-f"
say = "Hex is hexadecimal: each byte written as two digits, from zero to nine and a to f."
