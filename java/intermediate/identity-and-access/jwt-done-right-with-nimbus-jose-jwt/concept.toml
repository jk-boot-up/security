[[act]]
title = "The bill: a token cannot be taken back"
summary = "Ana's access is removed at 120 seconds: at 240 her access token is still accepted while her refresh token is refused; at 331 the access token is refused as expired; a 24-hour token breaks our 900-second policy."
detail = """
Ana holds an access token, which stops working after 300 + 30 = 330 seconds, and a refresh token, 43 random characters the bank keeps and looks up. At
120 seconds the bank removes her access and revokes the refresh token. At 240 the access token is still accepted, because the API checks the token and
not the bank's records, while the refresh token is refused as revoked. At 331 the access token is refused (Expired JWT). Our own policy allows at most
900 seconds, 15 minutes, so a token with exp = iat + 86400 is refused: lifetime longer than the policy allows. The library parses, verifies and checks
the claims; the policy is ours.
"""
figure = "revocation_timeline"
figure_title = "After the bank revokes, until the token expires"
figure_speech = """
Sixth demo: the bill. [[slnc 400]] Ana holds two tokens. [[slnc 300]] The access token is self-contained: the A P I checks it with the library, without asking the bank. [[slnc 300]] The refresh token is a random string that the bank looks up every time. [[slnc 700]]
At one hundred and twenty seconds, the bank removes Ana's access. [[slnc 300]] The refresh token stops at once. [[slnc 300]] Nothing can reach the access token. [[slnc 600]]
At two hundred and forty, it is still accepted. [[slnc 300]] At three hundred and thirty one, it finally expires. [[slnc 700]]
No library can change this. [[slnc 300]] So access tokens must live for minutes, and our own policy refuses anything longer than fifteen.
"""
speech = """
Here is the output. [[slnc 400]] What Ana holds, and the event at one hundred and twenty. [[slnc 400]] At two hundred and forty, the access token still works, and the refresh token is refused. [[slnc 300]] At three hundred and thirty one, the access token expires. [[slnc 400]] And a token asking for a whole day breaks our fifteen minute policy.
"""
rows = { bill = "active amber" }
console = [
    ["WHAT ana HOLDS (seconds after issue):", "code"],
    ["  the access token, which stops working after 300 + 30 = 330", "muted"],
    ["  a refresh token <43 random characters>, kept by the bank", "muted"],
    ["THE EVENT:", "code"],
    ["  at 120 the bank removes ana's access and revokes the refresh token", "muted"],
    ["THE RESULTS:", "code"],
    ["  at 240 the access token:  accepted for ana  <- STILL WORKS", "bad"],
    ["  at 240 the refresh token: refused (revoked)", "ok"],
    ["  at 331 the access token:  refused (Expired JWT)", "ok"],
    ["THE POLICY THAT FOLLOWS (ours: at most 900 seconds = 15 minutes):", "code"],
    ["  a token with exp = iat + 86400 (24 hours):", "muted"],
    ["  -> refused (lifetime longer than the policy allows)", "ok"],
    ["the library parses, verifies and checks claims; the policy is ours", "amber"],
]

