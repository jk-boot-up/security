narration = "So, how do you use it? [[slnc 400]] Fix the algorithm and the type, give the library one key set U R L and never anything from the token, verify before you believe, check issuer and audience exactly, keep access tokens short, check your own policy, publish a new key before using it, and know how long a retired key lives in your cache."

