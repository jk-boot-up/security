[[act]]
title = "Decoding is not verifying"
summary = "The claims part is replaced to say sub mallory while ana's signature is kept: a reader that only decodes says mallory; the validator verifies the signature over parts 1 and 2 first, gets false, and refuses."
detail = """
Only the claims part is replaced: "sub":"ana" becomes "sub":"mallory", so part 2 grows from 191 to 196 characters, while the header and Ana's
86-character signature stay as they were. A reader that only decodes splits the token at the dots, decodes part 2, reads sub and says mallory. The
validator first verifies part 3 over parts 1 and 2 with the public key of bank-2026-01: false, because the signature was made over Ana's claims. It refuses
the token: the signature does not match. Anyone can read the claims, since base64url is an encoding and not encryption, so no secret belongs in them.
"""
figure = "forged_token"
figure_title = "Ana's signature on mallory's claims"
figure_speech = """
Second demo: decoding is not verifying. [[slnc 400]] At the top, the edit. [[slnc 300]] Someone changes sub, ana, into sub, mallory. [[slnc 600]]
The token sent keeps part one, the header, unchanged. [[slnc 300]] Part two, the claims, is new, and five characters longer. [[slnc 300]] Part three is still Ana's signature. [[slnc 700]]
On the left, a reader that only decodes. [[slnc 300]] It splits at the dots, decodes part two, and reads the subject. [[slnc 300]] It says mallory. [[slnc 600]]
On the right, the validator. [[slnc 300]] Before it reads any claim, it checks the signature over parts one and two, with the bank's public key. [[slnc 300]] The answer is false. [[slnc 300]] The signature was made over Ana's claims, so it cannot match mallory's. [[slnc 300]] Refused.
"""
speech = """
Here is the output. [[slnc 400]] The edit, and the token sent: header and signature unchanged, claims replaced. [[slnc 400]] The reader that only decodes says mallory. [[slnc 400]] The validator's signature check gives false, and the token is refused. [[slnc 400]] And remember: anyone can read the claims, so no secret belongs in them.
"""
rows = { parts = "active ok" }
console = [
    ["THE EDIT (only the claims part is replaced):", "code"],
    ["  \"sub\":\"ana\"  ->  \"sub\":\"mallory\"", "muted"],
    ["THE TOKEN SENT:", "code"],
    ["  part 1, the header     68 characters, unchanged", "muted"],
    ["  part 2, the claims     196 characters, was 191", "muted"],
    ["  part 3, the signature  86 characters, ana's, unchanged", "muted"],
    ["A READER THAT ONLY DECODES (splits, decodes part 2, reads sub):", "code"],
    ["  -> mallory  <- DECODING IS NOT VERIFYING", "bad"],
    ["THE VALIDATOR (verifies part 3 over parts 1 and 2 first):", "code"],
    ["  Ed25519 verify with bank-2026-01's public key -> false", "ok"],
    ["  -> refused (signature does not match)", "ok"],
    ["anyone can read the claims: base64url is an encoding, not", "amber"],
    ["encryption, so no secret belongs in them", "amber"],
]

[[act]]
title = "The server chooses the algorithm, never the token"
summary = "The API accepts only alg EdDSA and typ at+jwt, checked against RFC 8037; headers saying none, HS256, or id+jwt are refused, and Ana's real token is accepted."
detail = """
The API's settings are fixed in Policy: algorithm EdDSA, type at+jwt. The Ed25519 code is first checked against the published example of RFC 8037,
appendix A: it verifies with the published public key, signing it again gives the same 64 bytes, and the public key derived from the private key matches.
Four headers are sent, all with Ana's claims. EdDSA with at+jwt, Ana's real token, is accepted. none with no signature is refused (algorithm none is not
EdDSA); HS256 is refused (algorithm HS256 is not EdDSA); an ID token, typ id+jwt, offered as an access token is refused (type id+jwt is not at+jwt).
The header is only checked against the API's own settings.
"""
figure = "header_check"
figure_title = "Four headers against the API's own settings"
figure_speech = """
Third demo: the algorithm. [[slnc 400]] At the top left, the A P I's settings. [[slnc 300]] Algorithm Ed D S A, type at J W T. [[slnc 300]] They are written in the code, not read from the token. [[slnc 600]]
On the right, the signature code is checked against the example published in R F C eight oh three seven. [[slnc 300]] All three checks are true. [[slnc 700]]
Below, four headers, all with Ana's claims. [[slnc 300]] Green means the value matches the A P I's settings. [[slnc 300]] The first is Ana's real token: accepted. [[slnc 600]]
The second says none, and carries no signature at all. [[slnc 300]] A validator that obeyed the header would skip the check. [[slnc 300]] This one refuses. [[slnc 300]] The third says H S two five six. [[slnc 300]] Refused. [[slnc 300]] The fourth is an I D token, meant for the app, offered as an access token. [[slnc 300]] Refused by its type.
"""
