[[act]]
title = "The bill: a token cannot be taken back"
summary = "Ana's access is removed at 120 seconds: at 240 her access token is still accepted while her refresh token rt-1 is refused; the access token stops at 330; a token lasting 3600 seconds breaks the 900-second policy."
detail = """
Ana holds an access token, which stops working at 300 + 30 of skew = 330 seconds after issue, and a refresh token rt-1, which the bank looks up each time.
At 120 seconds the bank removes Ana's access and revokes rt-1. At 240 the access token is still accepted: it still works, because the API checks the
token, not the bank's records. The refresh token is refused as revoked. At 330 the access token is refused as expired. So the policy allows at most 900
seconds, 15 minutes, and a token with exp = iat + 3600 is refused: lifetime longer than the policy allows. In production, use a maintained library,
configured strictly.
"""
figure = "revocation_timeline"
figure_title = "After the bank revokes, until the token expires"
figure_speech = """
Sixth demo: the bill. [[slnc 400]] Ana holds two tokens. [[slnc 300]] The access token is self-contained: the A P I checks it without asking the bank. [[slnc 300]] The refresh token is only a handle, which the bank looks up every time. [[slnc 700]]
At one hundred and twenty seconds, the bank removes Ana's access. [[slnc 300]] The refresh token stops at once. [[slnc 300]] But nothing can reach the access token. [[slnc 600]]
At two hundred and forty, the access token is still accepted. [[slnc 300]] At three hundred and thirty, it finally expires. [[slnc 700]]
That is the price of a token that needs no lookup. [[slnc 300]] So access tokens must live for minutes, not hours.
"""
speech = """
Here is the output. [[slnc 400]] What Ana holds, and the event at one hundred and twenty. [[slnc 400]] At two hundred and forty, the access token still works, and the refresh token is refused. [[slnc 300]] At three hundred and thirty, the access token expires. [[slnc 400]] And a token asking for an hour breaks the fifteen minute policy.
"""
rows = { revoke = "active amber" }
console = [
    ["WHAT ana HOLDS (seconds after issue):", "code"],
    ["  the access token, which stops working at 300 + 30 of skew = 330", "muted"],
    ["  the refresh token rt-1, which the bank looks up each time", "muted"],
    ["THE EVENT:", "code"],
    ["  at 120 the bank removes ana's access and revokes rt-1", "muted"],
    ["THE RESULTS:", "code"],
    ["  at 240 the access token:  accepted for ana  <- STILL WORKS", "bad"],
    ["  at 240 the refresh token: refused (revoked)", "ok"],
    ["  at 330 the access token:  refused (expired)", "ok"],
    ["THE POLICY THAT FOLLOWS (at most 900 seconds = 15 minutes):", "code"],
    ["  a token with exp = iat + 3600:", "muted"],
    ["  -> refused (lifetime longer than the policy allows)", "ok"],
    ["in production, use a maintained library, configured strictly", "amber"],
]

