[poster]
headline = [["JWT", "text"], ["DONE RIGHT", "accent"]]
taglines = [["Decoding a token is not verifying it", "gold"]]
before = { code = "decode, trust sub", note = "believes anything", tag = "BEFORE" }
after = { code = "alg fixed, kid known, aud, exp", note = "every check, in order", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "JWT Done Right"
narration = """Hello, and welcome. [[slnc 400]] This video explains how to check JSON web tokens properly, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A J W T is a small set of claims, such as who a token is for and until when, signed by the server that issued it. [[slnc 300]] A P Is receive them with every request. [[slnc 600]] Think of a cinema ticket. [[slnc 300]] Anyone can read what is printed on it. [[slnc 300]] What makes it valid is the box office's stamp, checked by an usher who also checks the film and the date. [[slnc 700]] In this video, the domain is an online bank. [[slnc 500]] By the end, you will hear why decoding is not verifying. [[slnc 300]] Why the server, not the token, chooses the algorithm. [[slnc 300]] Which claims must be checked. [[slnc 300]] And why a token must not live long."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online bank's accounts API", "receives access tokens from customers' apps.", "", "Every byte arrives from the customer's side,", "so every byte must be checked."]
narration = """Here is the scenario. [[slnc 400]] An online bank's accounts A P I receives access tokens from customers' apps. [[slnc 500]] The bank's own server issued them. [[slnc 300]] But they arrive from the customer's side. [[slnc 500]] So every byte must be checked."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["Claims: what the token says", "Signature: who wrote it", "Key id: which key signed it", "Audience: which API it is for", "Expiry: until when it works"]
narration = """Before the demos, the words. [[slnc 500]] The claims are what the token says. [[slnc 500]] The signature shows who wrote it. [[slnc 500]] The key id says which key signed it. [[slnc 500]] The audience says which A P I it is for. [[slnc 500]] And the expiry says until when it works."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "09-ladder"
kind = "bullets"
title = "The Checks, In Order"
body = ["Shape: three strict parts", "Header: algorithm and type fixed by the API", "Key: from the API's own set", "Signature", "Claims: expiry, issuer, audience, scope"]
narration = """Let's put the checks in order. [[slnc 400]] First, the shape: three parts, read strictly. [[slnc 500]] Then the header, against the A P I's own algorithm and type. [[slnc 500]] Then a key, from the A P I's own set. [[slnc 500]] Then the signature. [[slnc 500]] And only then, the claims: expiry, issuer, audience and scope."""

[[scene]]
key = "10-roles"
kind = "bullets"
title = "Who Does What"
body = ["Validator: every check, in order", "Policy: the API's settings", "KeySet: public keys by key id", "Jws and Ed25519: the format and the signature", "NaiveReader: the mistake, kept for the tests"]
narration = """Here is who does what in the code. [[slnc 400]] The validator makes every check, in order. [[slnc 500]] The policy holds the A P I's settings, including the one algorithm it accepts. [[slnc 500]] The key set holds public keys by key id. [[slnc 500]] The J W S and Ed twenty five five one nine classes handle the format and the signature. [[slnc 300]] And the naive reader is the mistake, kept so the tests can show what it lets in."""

[[scene]]
key = "11-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Authorization: Bearer eyJ...", "JWKS documents with key ids", "Library settings for algorithms and audience", "Advisories about alg none"]
narration = """You have probably met this already. [[slnc 400]] Every A P I call with a header that says Bearer, followed by text starting with e y J, carries a J W T. [[slnc 500]] Identity providers publish their keys as a J W K S document, with key ids. [[slnc 500]] Libraries have settings for the allowed algorithms and the audience. [[slnc 500]] And security advisories about the none algorithm are about exactly these checks."""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["One algorithm, chosen by the server", "A known key set, never fetched from a token", "Check issuer, audience, expiry and scope", "Short lifetimes; refresh tokens on the server", "A maintained library, configured strictly"]
narration = """So, how do you use it? [[slnc 400]] Accept one algorithm, chosen by the server. [[slnc 500]] Use a key set the server already knows, and never fetch a key because a token asked. [[slnc 500]] Check the issuer, the audience, the expiry and the scope. [[slnc 500]] Keep access tokens short, and refresh tokens on the server. [[slnc 500]] And use a maintained library, configured strictly."""

[[scene]]
key = "13-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Rotate the key twice", "and list which tokens still work."]
narration = """That's J W T done right. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Decoding a token is not verifying it, and the server, not the token, decides how it is checked. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine, with nothing installed except a Java development kit. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Rotate the key twice, and list which tokens still work after each step. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
The validation of access tokens by an online bank's accounts API: reading the token, choosing the key, verifying the signature and checking the claims,
plus key rotation and token lifetime. It does not cover how tokens are issued (OAuth flows), how they are stored in browsers, or encrypted tokens.
"""
assets = [
    "Customers' accounts behind the API.",
    "The authorization server's private signing keys.",
    "The API's key set and settings.",
    "Access and refresh tokens in customers' hands.",
]
actors = [
    "Customers' apps presenting tokens.",
    "An attacker who edits, forges or replays tokens, or steals one.",
    "Operators who rotate keys.",
]
boundaries = [
    "Customer's app to the accounts API: every token crosses it and may have been changed.",
    "Authorization server to the key set: only the bank publishes keys.",
]
assumptions = [
    "The private signing keys stay inside the authorization server.",
    "The API's clock is close to the authorization server's, within the configured skew.",
    "In the demo, the first key is the published RFC 8037 test key and the others come from fixed seeds; none of them protects anything.",
]
out_of_scope = [
    "Issuing tokens through OAuth 2.0 and OpenID Connect flows.",
    "Token storage in browsers.",
    "Encrypted tokens (JWE) and token introspection.",
]
tests = [
    "`Rfc8037Test` checks the Ed25519 code against RFC 8037 appendix A.",
    "`ValidatorTest` checks every refusal with its exact reason, including the skew boundaries and the locale-free type check.",
    "`NaiveReaderTest` shows, for each missing check, a token the naive reader believes and the validator refuses.",
    "`KeysTest` checks rotation, unknown and missing key ids, and that a token cannot pick another key from the set.",
    "`JsonAndBase64UrlTest` checks the strict readers; `RefreshTokensTest` checks server-side revocation.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next project, oauth2-authorization-code-pkce, shows how a customer's app obtains these tokens safely in the first place.
"""

[[threat]]
id = "T1"
stride = "S"
threat = "Edited claims are believed because the token was decoded but not verified"
where = "`NaiveReader`, `Validator.validate`"
control = "The signature is verified before any claim is read"
residual = "Any code path that reads claims before validation reintroduces the flaw; keep one validator at one choke point"

[[threat]]
id = "T2"
stride = "S"
threat = "A token chooses a weak or absent algorithm (`none`, HS256 with a public key as the secret)"
where = "the token header"
control = "One algorithm, fixed in `Policy`; the header is only compared with it"
residual = "A library left on its defaults may still honour the header; configure it strictly"

[[threat]]
id = "T3"
stride = "E"
threat = "A valid token is used where it was not meant: another API, another token type, too wide a scope, after expiry"
where = "`Validator` claim checks"
control = "Explicit type, issuer, audience, scope, expiry with a small skew, not-before and a maximum lifetime"
residual = "Every API must configure its own audience and scope; a shared default undoes the check"

[[threat]]
id = "T4"
stride = "S"
threat = "A token points to a key of the attacker's choosing, or the API fetches one because the token asked"
where = "`KeySet`, the `kid` header"
control = "Keys come only from the API's own set; an unknown key id is refused"
residual = "The key set itself must be loaded from a trusted source and kept current"

[[threat]]
id = "T5"
stride = "I"
threat = "A signing key leaks and every token it signed must be distrusted"
where = "the authorization server"
control = "Key ids and rotation with a changeover: a new key is trusted first, the old one removed"
residual = "Until the old key is removed from every API, its forgeries are accepted"

[[threat]]
id = "T6"
stride = "R"
threat = "A stolen or revoked customer's access token keeps working"
where = "the customer's app, `Validator`"
control = "Short lifetimes and a cap on them; refresh tokens checked on the server"
residual = "A stolen access token works until it expires; sender-constrained tokens (DPoP) are the tokens-in-the-browser project"
