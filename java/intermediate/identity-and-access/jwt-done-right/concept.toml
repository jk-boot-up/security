short_title = "JWT Done Right"
package = "jwt"
main_class = "JwtDemo"
tagline = "Decoding a token is not verifying it"
bold = "A JSON Web Token is only as trustworthy as the checks around it: the server fixes the algorithm and the type, picks the key from a set it already holds, verifies the signature, and only then believes expiry, issuer, audience and scope. And because a token cannot be taken back, it must not live long."
domain = "an online bank"
domain_note = ""
youtube_description = """JSON Web Tokens done right, in Java with only the JDK. Explained with an online bank's accounts API, like a cinema ticket that anyone can read but only the box office can stamp. We take a bank access token apart into its three parts, show that a reader which only decodes believes a forged subject, fix the algorithm and token type on the server so that a header saying none or HS256 is refused, check expiry with a small clock skew, not-before, issuer, audience and scope, choose keys by key id from a set the API already holds and rotate them without downtime, and finish with the bill: an access token cannot be revoked before it expires, so lifetimes are minutes and refresh tokens stay on the server. Checked against the published Ed25519 example in RFC 8037."""
