[[act]]
title = "Every claim that matters is checked"
summary = "Ana's token (iat and nbf 1800000000, exp 1800000300) is accepted at issue and at exp + 20, refused at exp + 30 = 1800000330; tokens with a later nbf, another iss, another aud or scope cards:read are refused."
detail = """
The API expects the issuer https://auth.bank.example, the audience accounts-api and the scope accounts:read, with 30 seconds of clock skew. Ana's token
has iat and nbf 1800000000 and exp 1800000300, so it is accepted while now is before exp + 30 = 1800000330. At 1800000000, the moment of issue, it is
accepted; at 1800000320 (exp + 20) it is still accepted; at 1800000330 (exp + 30) it is refused as expired. Then one claim is changed per token, each
signed by the bank: nbf 1800000120 (it starts in 2 minutes) is refused as not valid yet, iss https://auth.partner.example as another issuer, aud
loyalty-api as another audience, and scope cards:read as missing scope accounts:read. The signature proves who wrote the token; only the claims say
whether it is for this API, now.
"""
figure = "clock_line"
figure_title = "The clock, and one changed claim at a time"
figure_speech = """
Fourth demo: the claims. [[slnc 400]] At the top, Ana's token on a time line, in seconds after it was issued. [[slnc 300]] It may be used from zero, and it expires at three hundred. [[slnc 600]]
Servers' clocks differ a little, so the A P I allows thirty seconds of skew: the amber band. [[slnc 300]] From three hundred and thirty, it is refused. [[slnc 600]]
Three moments are tried. [[slnc 300]] At zero, accepted. [[slnc 300]] At three hundred and twenty, inside the skew, still accepted. [[slnc 300]] At three hundred and thirty, refused: expired. [[slnc 700]]
