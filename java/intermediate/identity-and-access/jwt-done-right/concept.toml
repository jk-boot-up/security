[[scene]]
key = "01-poster"
kind = "poster"
title = "JWT Done Right"
narration = """Hello, and welcome. [[slnc 400]] This video explains how to check JSON web tokens properly, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A JSON web token, or J W T, is a small set of claims, such as who a token is for and until when, signed by the server that issued it. [[slnc 300]] A P Is receive them with every request. [[slnc 600]] Think of a cinema ticket. [[slnc 300]] Anyone can read what is printed on it. [[slnc 300]] What makes it valid is the box office's stamp, checked by an usher who also checks the film and the date. [[slnc 700]] In this video, the domain is an online bank. [[slnc 500]] By the end, you will hear why decoding is not verifying. [[slnc 300]] Why the server, not the token, chooses the algorithm. [[slnc 300]] Which claims must be checked. [[slnc 300]] And why a token must not live long."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online bank's accounts API", "receives access tokens from customers' apps.", "", "Every byte arrives from the customer's side,", "so every byte must be checked."]
narration = """Here is the scenario. [[slnc 400]] An online bank's accounts A P I receives access tokens from customers' apps. [[slnc 500]] The bank's own server issued them. [[slnc 300]] But they arrive from the customer's side. [[slnc 500]] So every byte must be checked."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["Claims: what the token says", "Signature: who wrote it", "Key id: which key signed it", "Audience: which API it is for", "Expiry: until when it works"]
narration = """Before the demos, the words. [[slnc 500]] The claims are what the token says. [[slnc 500]] The signature shows who wrote it. [[slnc 500]] The key id says which key signed it. [[slnc 500]] The audience says which A P I it is for. [[slnc 500]] And the expiry says until when it works."""

[[scene]]
key = "03-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "03-anatomy"
kind = "figure"
title = "One real token, three parts"
body = "token_anatomy"
narration = """Let's see the whole idea on one real token. [[slnc 400]] At the top, Ana's access token, three hundred and forty seven characters. [[slnc 300]] The dots split it into three parts. [[slnc 700]] Part one, in yellow, is the header. [[slnc 300]] Decoded, it says the algorithm, the type, and the id of the key that signed it. [[slnc 600]] Part two, in blue, is the claims. [[slnc 300]] The issuer, the subject Ana, the audience, the scope, and three times in seconds. [[slnc 600]] Part three, in red, is the signature: sixty four bytes, made with the bank's private key over the first two parts. [[slnc 700]] Anyone can decode parts one and two. [[slnc 300]] Only part three, checked with the bank's public key, proves the bank wrote them. [[slnc 300]] Decoding is not verifying."""

