[readme]
intro = """
A **JSON Web Token (JWT)** is a set of **claims** (who it is for, who issued it, which API it is for, until when) in JSON, signed as a **JWS**
(RFC 7515). Bank APIs and almost every OAuth 2.0 deployment carry their **access tokens** this way. The format is simple, and most of the damage comes
from validators that check too little. **RFC 8725, JSON Web Token Best Current Practices**, lists the checks: let the server, not the token, choose the
algorithm; verify the signature before believing anything; check the issuer, the audience and the expiry; type tokens explicitly so one kind cannot
be used as another; and use keys the server already trusts.

This project maps to **OWASP Top 10 (2025) A07 Authentication Failures**; to **CWE-347**, improper verification of a cryptographic signature,
**CWE-345**, insufficient verification of data authenticity, and **CWE-613**, insufficient session expiration; and to the **self-contained tokens**
chapter of **OWASP ASVS 5.0**.

The demo builds a strict validator with the JDK alone, using **Ed25519** signatures (`EdDSA` in JOSE, RFC 8037), and checks it against the example
token that RFC 8037 publishes. Each check a naive validator skips is shown as a token the naive reader believes and the validator refuses.
"""
analogy = """
Think of a cinema ticket. Anyone can read what is printed on it: the film, the seat, the time. That is decoding. What makes it valid is the box office's
stamp, checked by an usher who knows what the stamp looks like, and who also checks that it is for this cinema, this film and tonight. An usher who
lets in anyone holding a piece of paper with a film name on it has decoded the ticket and verified nothing. And a ticket cannot be taken back once
sold, which is why it is only good for one evening.
"""
scenario = """
An online bank's authorization server issues access tokens for its accounts API. The demo reads one token, forges and alters others, rotates the
bank's signing key, and removes a customer's access, and shows for each what a naive reader believes and what the strict validator does.
"""
costs = [
    "**A token cannot be taken back.** Until it expires, an access token works even after the customer's access is removed. Keep lifetimes to minutes, and keep refresh tokens on the server, where they can be revoked.",
    "**Clock skew is a trade-off.** Servers' clocks differ, so a few seconds of leeway are needed; every second of leeway is a second an expired token still works.",
    "**Keys need operations.** A key set must be updated before a new key is used and kept until the last token signed with the old key has expired.",
    "**Claims are readable by anyone.** A JWS is signed, not encrypted: never put secrets or personal data in it that the holder should not see.",
    "**A hand-written validator is for learning.** Production code should use a maintained library configured as strictly as this one; see the `-with-nimbus-jose-jwt` version.",
]
too_much = """
For a single application with server-side sessions, a JWT adds nothing but risk: a session cookie is simpler and can be revoked at once. JWTs earn
their place when an API must check a token without calling the server that issued it, which is the usual case for OAuth 2.0 access tokens.
"""
met_before = [
    "`Authorization: Bearer eyJ...` headers in API calls; every token starting with `eyJ` is base64url of `{\"`.",
    "OAuth 2.0 and OpenID Connect providers such as Keycloak, and their `/.well-known/jwks.json` key sets.",
    "Debugging sites that decode a JWT: they show the claims without checking anything, which is exactly the point of act one.",
    "Advisories about `alg: none` and algorithm confusion in JWT libraries.",
]
where = """
This is the first project of [identity-and-access](..) in the [intermediate track](../..). It builds on the beginner projects
[digital-signatures](../../../beginner/cryptography/digital-signatures) and [authentication-vs-authorization](../../../beginner/identity/authentication-vs-authorization).
"""
twin = """
Everything runs in memory with a simulated clock in whole seconds. Ed25519 signatures are deterministic, so the same key and claims always give the
same token, and the demo prints exact tokens. The bank's first signing key is the RFC 8037 test key, so its signatures can be checked by anyone; the
other keys come from fixed seeds and protect nothing. No key is ever fetched over a network.
"""
test_note = "The Ed25519 code is checked against RFC 8037 appendix A: the published token verifies, signing its input gives the published signature, and the published public key is derived from the published private key. Every refusal is a test with its exact reason."

[[act]]
title = "Three parts, and decoding is not verifying"
summary = "A bank access token is a header, claims and a 64-byte Ed25519 signature; anyone can read the claims, and a reader that only decodes believes claims edited to sub=mallory, which the validator refuses."
detail = """
The bank's authorization server issues Ana an access token of 347 characters in 3 parts. The header says the algorithm is EdDSA, the type is at+jwt
and the key id is bank-2026-01. The claims name the issuer, the subject ana, the audience accounts-api, the scope accounts:read, and the times of issue,
start and expiry. The third part is a 64-byte Ed25519 signature over the first two. Anyone can read the claims, because base64url is an encoding, not
encryption. When the claims are edited to sub=mallory and Ana's signature is kept, a reader that only decodes says mallory. The validator refuses it:
the signature does not match.
"""
speech = """
First demo: three parts. [[slnc 400]] The bank issues Ana an access token. [[slnc 300]] It has three parts, separated by dots. [[slnc 600]]
The first is a header: the algorithm, the type, and the key id. [[slnc 300]] The second is the claims: who it is for, who issued it, which A P I, and until when. [[slnc 300]] The third is a signature over the first two. [[slnc 600]]
Anyone can read the claims. [[slnc 300]] Base sixty four url is an encoding, not encryption. [[slnc 600]]
Now edit the claims to say mallory, and keep Ana's signature. [[slnc 300]] A reader that only decodes says mallory. [[slnc 300]] Decoding is not verifying. [[slnc 600]]
The validator refuses it. [[slnc 300]] The signature does not match.
"""
rows = { parts = "active amber" }
console = [
    ["the bank's authorization server issues ana an access token of 347 characters in 3 parts", "muted"],
    ["header: {\"alg\":\"EdDSA\",\"typ\":\"at+jwt\",\"kid\":\"bank-2026-01\"}", "muted"],
    ["claims: {\"iss\":\"https://auth.bank.example\",\"sub\":\"ana\",\"aud\":\"accounts-api\",\"scope\":\"accounts:read\",...}", "muted"],
    ["the third part is a 64-byte Ed25519 signature over the first two", "muted"],
    ["anyone can read the claims: base64url is an encoding, not encryption, so no secret belongs in them", "amber"],
    ["the claims edited to sub=mallory, with ana's signature kept: a reader that only decodes says mallory  <- DECODING IS NOT VERIFYING", "bad"],
    ["the validator: refused (signature does not match)", "ok"],
]

[[act]]
title = "The server chooses the algorithm, never the token"
summary = "The RFC 8037 example verifies and re-signs exactly; Ana's token is accepted; a header saying none, a header saying HS256 and a correctly signed token of another type are all refused."
detail = """
The published RFC 8037 example token verifies with its published key, signing it again gives the same signature, and the JDK derives the published
public key from the published private key. Ana's token is accepted with the bank's key. The same claims with a header that says none and no signature
are refused: the algorithm none is not EdDSA. A header that says HS256 is refused the same way. A correctly signed token of another type, an ID token
offered as an access token, is refused because its type id+jwt is not at+jwt. The algorithm and the type are settings of the API; the header is only
checked against them.
"""
speech = """
Second demo: the algorithm. [[slnc 400]] The validator is first checked against the example token published in R F C eight oh three seven. [[slnc 300]] It verifies. [[slnc 300]] And signing it again gives exactly the same signature. [[slnc 600]]
Ana's token, with the bank's key, is accepted. [[slnc 600]]
Now the same claims, with a header that says none, and no signature at all. [[slnc 300]] Refused. [[slnc 300]] A header that says H S two five six. [[slnc 300]] Refused. [[slnc 600]]
And a correctly signed token of another type, an I D token offered as an access token. [[slnc 300]] Refused, by its type. [[slnc 600]]
The algorithm and the type are settings of the A P I. [[slnc 300]] The header is only checked against them.
"""
rows = { algorithm = "active ok" }
console = [
    ["the RFC 8037 example token verifies with its published key: true, and signing it again gives the same signature: true", "ok"],
    ["the JDK derives the published public key from the published private key: true", "ok"],
    ["ana's token with the bank's key: accepted for ana", "ok"],
    ["the same claims with a header that says none and no signature: refused (algorithm none is not EdDSA)", "ok"],
    ["a header that says HS256: refused (algorithm HS256 is not EdDSA)", "ok"],
    ["a correctly signed token of another type, offered as an access token: refused (type id+jwt is not at+jwt)", "ok"],
    ["the algorithm and the type are settings of the API; the header is only checked against them", "muted"],
]

[[act]]
title = "Every claim that matters is checked"
summary = "Accepted at issue and 20 seconds after expiry within the 30-second skew, refused 30 seconds after; refused before its start time, from another issuer, for another audience, and without the required scope."
detail = """
At the moment of issue the token is accepted. Twenty seconds after its expiry time it is still accepted, inside the 30 seconds allowed for clock skew;
30 seconds after, it is refused as expired. A token that starts in 2 minutes, presented now, is refused as not valid yet. A token issued by another
authorization server is refused, and so is one meant for the loyalty API but sent to the accounts API, and one with only the scope cards:read. A valid
signature proves who wrote the token; only the claims say whether it is for this API, now.
"""
speech = """
Third demo: the claims. [[slnc 400]] At the moment of issue, the token is accepted. [[slnc 600]]
Twenty seconds after it expires, it is still accepted. [[slnc 300]] Servers' clocks differ, so thirty seconds of leeway are allowed. [[slnc 300]] Thirty seconds after, it is refused. [[slnc 600]]
A token that starts in two minutes is refused now. [[slnc 300]] A token from another issuer is refused. [[slnc 300]] A token for another A P I is refused. [[slnc 300]] And a token without the right scope is refused. [[slnc 600]]
A valid signature proves who wrote the token. [[slnc 300]] Only the claims say whether it is for this A P I, now.
"""
rows = { claims = "active ok" }
console = [
    ["at the moment of issue: accepted for ana", "ok"],
    ["20 seconds after exp, inside the 30 seconds allowed for clock skew: accepted for ana", "amber"],
    ["30 seconds after exp: refused (expired)", "ok"],
    ["a token that starts in 2 minutes, presented now: refused (not valid yet)", "ok"],
    ["issued by another authorization server: refused (another issuer)", "ok"],
    ["meant for the loyalty API, sent to the accounts API: refused (another audience)", "ok"],
    ["with only the scope cards:read: refused (missing scope accounts:read)", "ok"],
]

[[act]]
title = "Keys by id, from a set the API already holds"
summary = "During a changeover two keys are trusted and tokens from both work; after the old key is retired its token is refused; an unknown key id and a forged signature under the bank's key id are refused, and nothing is fetched."
detail = """
During the changeover the API trusts 2 keys, bank-2026-01 and bank-2026-07, and tokens signed with either are accepted. After the old key is retired,
the old token is refused with an unknown key id. A token naming a key id the API has never seen is refused, and so is a token signed with another key but
naming the bank's key id, because its signature does not match. An unknown key id is refused; the API never fetches a key because a token asked it to.
"""
speech = """
Fourth demo: keys. [[slnc 400]] Each token names its key, by a key id. [[slnc 300]] The A P I keeps its own set of keys. [[slnc 600]]
During a changeover, it trusts two keys. [[slnc 300]] Tokens signed with either one are accepted. [[slnc 600]]
After the old key is retired, the old token is refused. [[slnc 600]]
A token that names a key the A P I has never seen is refused. [[slnc 300]] A token signed with another key, but naming the bank's key id, is refused, because the signature does not match. [[slnc 600]]
And the A P I never fetches a key because a token asked it to.
"""
rows = { keys = "active ok" }
console = [
    ["during the changeover the API trusts 2 keys: bank-2026-01 and bank-2026-07", "muted"],
    ["a token signed with the old key: accepted for ana", "ok"],
    ["a token signed with the new key: accepted for ana", "ok"],
    ["after the old key is retired, the old token: refused (unknown key id bank-2026-01)", "ok"],
    ["a token naming a key id the API has never seen: refused (unknown key id attacker-key)", "ok"],
    ["a token signed with another key but naming the bank's key id: refused (signature does not match)", "ok"],
    ["an unknown key id is refused; the API never fetches a key because a token asked it to", "muted"],
]

[[act]]
title = "The bill: a token cannot be taken back"
summary = "Two minutes after Ana's access is removed her access token still works, while her server-side refresh token is refused; the access token stops at five and a half minutes, and a fifteen-minute cap refuses longer lifetimes."
detail = """
Ana's access is removed 2 minutes after her token was issued. Two minutes later her access token is still accepted: it still works until it expires.
Her refresh token, which the server looks up every time, is refused as revoked. At 5 minutes and 30 seconds the access token is refused as expired. So
access tokens live for minutes, and a token asking for more than 15 minutes is refused by policy. Where a browser should keep tokens is the subject of
the tokens-in-the-browser project, and in production a maintained library should do this work.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] Ana's access is removed, two minutes after her token was issued. [[slnc 600]]
Two minutes later, her access token still works. [[slnc 300]] The A P I checks the token, not the bank's records. [[slnc 300]] It works until it expires. [[slnc 600]]
Her refresh token is refused, because the server looks it up every time. [[slnc 600]]
At five and a half minutes, the access token stops working. [[slnc 600]]
So access tokens live for minutes. [[slnc 300]] A token asking for more than fifteen is refused. [[slnc 300]] And in production, a maintained library should do this work.
"""
rows = { revoke = "active amber" }
console = [
    ["ana's access is removed 2 minutes after her token was issued", "muted"],
    ["2 minutes later her access token: accepted for ana  <- STILL WORKS UNTIL IT EXPIRES", "bad"],
    ["her refresh token, which the server looks up: refused (revoked)", "ok"],
    ["at 5 minutes and 30 seconds the access token: refused (expired)", "ok"],
    ["so access tokens live for minutes, and a token asking for more than 15 is refused: refused (lifetime longer than the policy allows)", "amber"],
