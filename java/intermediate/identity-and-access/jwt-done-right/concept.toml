]
install = []

[docs.session]
objectives = [
    "take a JWT apart and say what each part is for",
    "explain why the algorithm must be chosen by the server",
    "list the claims an API must check, and why each matters",
    "describe key rotation with key ids, and why keys are never fetched on a token's say-so",
    "explain why access tokens must be short-lived",
]
walkthrough = """
Start with the cinema ticket. Decode a real token from act one by hand, with any base64url tool, to show that anyone can read it. Then run the acts. After
act two, ask what would happen if the validator took the algorithm from the header. After act three, ask which claim stops a token for one API being
used at another. In act five, ask how long a stolen access token is useful, and how the bank could shorten that.
"""
exercises = [
    "Add a `jti` (token id) claim and a small deny-list for tokens reported stolen; measure what it costs to check on every request.",
    "Require the `scope` claim to contain two scopes for a payment endpoint, and write the refusal test first.",
    "Add a third key, rotate twice, and list which tokens still work after each step.",
    "Change the skew to zero and to five minutes, and write down what each choice costs.",
]

[docs.explained]
sentence = """
A JWT is believable only after the server has checked it against its own settings: its algorithm and type, a key it already holds, the signature, and
then the expiry, issuer, audience and scope; and since it cannot be taken back, it must expire soon.
"""
verdict = """
Use a maintained library, configured strictly: one allowed algorithm, an explicit token type, a fixed issuer and audience, a required expiry with a small
skew, a key set loaded from configuration or from the issuer's own JWKS address, never from the token. Keep access tokens short and refresh tokens on the
server. Never put secrets in claims.
"""
recognise = [
    "`Authorization: Bearer eyJ...` in API requests.",
    "A JWKS document at `/.well-known/jwks.json` with `kid` values.",
    "Library settings named `allowedAlgorithms`, `expectedAudience`, `clockSkew`.",
    "Advisories titled \"JWT signature bypass\" or \"algorithm confusion\".",
]

[spec]
purpose = """
Teach how to validate JWT access tokens correctly by building a strict validator with the JDK, checked against RFC 8037, and showing for each check what a
naive reader lets through.
"""
nongoals = [
    "Issuing tokens through OAuth 2.0 flows: the oauth2-authorization-code-pkce project.",
    "Encrypted tokens (JWE).",
    "Storing tokens in a browser: the tokens-in-the-browser project.",
]
problem = """
Learners use JWTs through libraries and rarely see which checks the library is making; the common bugs are checks that were never switched on.
"""
roles = [["Strict base64url", "`Base64Url`"], ["Strict JSON", "`Json`"], ["Ed25519 keys and signatures", "`Ed25519`"], ["Compact JWS", "`Jws`"], ["Keys by id", "`KeySet`"], ["The API's settings", "`Policy`"], ["The validator", "`Validator`"], ["The mistake", "`NaiveReader`"], ["Server-side refresh tokens", "`RefreshTokens`"], ["Entry point", "`JwtDemo`"]]
requirements = [
    "The RFC 8037 example token verifies, re-signs to the same signature, and its public key is derived from its private key.",
    "Any algorithm other than EdDSA, a missing or wrong type, a critical header and an unknown key id are refused before the claims are read.",
    "Expiry and not-before allow exactly the configured skew; issuer, audience, scope, subject and lifetime are checked.",
    "Duplicate JSON members, padding and other base64 alphabets are refused.",
    "The demo prints the same output on every run.",
]

