[docs.session]
objectives = [
    "explain what OpenID Connect adds to OAuth 2.0",
    "list the checks a relying party makes on an ID token, and what each stops",
    "explain discovery, and why the metadata must name the configured issuer",
    "explain why a customer is identified by issuer and subject, not by email",
    "describe RP-initiated and back-channel logout",
]
walkthrough = """
Start with the hotel desk: key card and passport. Run act one and ask what the access token proves. After act two, ask which check stops a token from
another login, and which stops a token for another app. In act three, ask what an attacker gains by serving the store a different metadata document.
In act four, ask which sign-in providers the group uses and whether those sites link accounts by email.
"""
exercises = [
    "Add `max_age` to the sign-in request and refuse an ID token whose `auth_time` is older than it.",
    "Add a third provider and a rule that only the bank may be used for payments, by `iss` and `acr`.",
    "Make the store cache the key set and reload it only when an unknown key id appears, with a limit on how often.",
    "Add `prompt=login` for a payment and check `auth_time` is newer than the request.",
]

[docs.explained]
sentence = """
OpenID Connect adds a signed ID token to OAuth 2.0 that says who signed in, and a relying party must check it against the provider it discovered from
one configured issuer: exact issuer, its own audience, the time and its own nonce, then identify the customer by issuer and subject.
"""
verdict = """
Use OpenID Connect for sign-in, never a bare OAuth access token. Configure each provider by its issuer, load metadata and keys through discovery, and
let a certified library validate ID tokens. Bind state and nonce to the browser, identify customers by issuer and subject, never link accounts on an
email claim, and implement sign-out at both ends.
"""
recognise = [
    "`scope=openid` in authorization requests, and an `id_token` in token responses.",
    "`/.well-known/openid-configuration` documents and `jwks.json` key sets.",
    "Library settings for the issuer, client id and allowed clock skew.",
    "`end_session_endpoint` and `backchannel_logout_uri` in provider configuration.",
]

