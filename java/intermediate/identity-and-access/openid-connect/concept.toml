[poster]
headline = [["OPENID", "text"], ["CONNECT", "accent"]]
taglines = [["Access is not identity", "gold"]]
before = { code = "access token = signed in", note = "key card as a passport", tag = "BEFORE" }
after = { code = "id_token: iss, aud, nonce", note = "checked, then iss + sub", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "OpenID Connect"
narration = """Hello, and welcome. [[slnc 400]] This video explains Open I D Connect, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] O Auth lets an app act on a user's behalf. [[slnc 300]] Open I D Connect adds who the user is, in a signed I D token, meant for the app itself. [[slnc 600]] Think of a hotel. [[slnc 300]] An access token is a room key card. [[slnc 300]] An I D token is the passport shown at the desk. [[slnc 300]] A desk that takes a key card as a passport has misunderstood both. [[slnc 700]] In this video, the domain is an online store, and the bank its customers sign in with. [[slnc 500]] By the end, you will hear what an I D token says. [[slnc 300]] Which checks make it trustworthy. [[slnc 300]] Why the customer is never found by email. [[slnc 300]] And how signing out works."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online store lets customers", "sign in with their bank.", "", "Tokens arrive through the browser,", "from providers the store must recognise,", "for a customer it must identify every time."]
narration = """Here is the scenario. [[slnc 400]] An online store lets customers sign in with their bank. [[slnc 500]] Tokens arrive through the customer's browser. [[slnc 300]] From providers the store must recognise. [[slnc 300]] For a customer the store must identify correctly, every time."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["Relying party: the app that trusts the sign-in", "ID token: who signed in, for this app", "Issuer and subject: who the user is", "Nonce: ties a token to one sign-in", "Discovery: where the metadata and keys are"]
narration = """Before the demos, the words. [[slnc 500]] The relying party is the app that trusts the sign-in. [[slnc 500]] The I D token says who signed in, for this app. [[slnc 500]] The issuer and the subject, together, are who the user is. [[slnc 500]] The nonce ties a token to one sign-in. [[slnc 500]] And discovery is how the app finds the provider's metadata and keys."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "09-ladder"
kind = "bullets"
title = "The Checks, In Order"
body = ["Header and a published key", "Signature", "The exact issuer", "This app in the audience", "Time, and this browser's nonce"]
narration = """Let's put the checks in order. [[slnc 400]] First, the header, and a key the provider published. [[slnc 500]] Then the signature. [[slnc 500]] Then the issuer, exactly as configured. [[slnc 500]] Then this app, in the audience. [[slnc 500]] And last, the time, and the nonce this browser was given."""

[[scene]]
key = "10-roles"
kind = "bullets"
title = "Who Does What"
body = ["Provider: the bank, and a second provider", "Discovery: metadata and keys from one issuer", "IdTokenValidator: every check, in order", "Store: state, nonce, accounts, sign-out", "LoopbackProvider: discovery over real HTTP"]
narration = """Here is who does what in the code. [[slnc 400]] The provider class plays the bank, and a second provider. [[slnc 500]] The discovery class loads metadata and keys from one configured issuer. [[slnc 500]] The I D token validator makes every check, in order. [[slnc 500]] The store keeps state and nonce, finds accounts, and signs customers out. [[slnc 300]] And the loopback provider serves discovery over real H T T P."""

[[scene]]
key = "11-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["\"Sign in with ...\" buttons", "/.well-known/openid-configuration", "id_token and nonce in redirects", "Account takeover through email claims"]
narration = """You have probably met this already. [[slnc 400]] Every sign in with button on a website uses this flow, or one like it. [[slnc 500]] Providers publish their metadata at a well known address. [[slnc 500]] Redirects carry codes, states and nonces. [[slnc 500]] And security news has reported account takeovers through unverified email claims."""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Sign in with an ID token, never an access token", "Configure each provider by its issuer", "Let a certified library validate", "Identify by issuer and subject", "Sign out at both ends"]
narration = """So, how do you use it? [[slnc 400]] Sign customers in with an I D token, never with an access token. [[slnc 500]] Configure each provider by its issuer, and discover the rest. [[slnc 500]] Let a certified library do the validation. [[slnc 500]] Identify customers by issuer and subject. [[slnc 500]] And sign them out at both ends."""

[[scene]]
key = "13-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add max_age", "and refuse an old sign-in."]
narration = """That's Open I D Connect. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Access is not identity, and an I D token is only trusted after the store has checked who issued it, for whom, when, and for which sign-in. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine, with nothing installed except a Java development kit. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a maximum age to the sign-in request, and refuse a sign-in that is too old. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
An online store as an OpenID Connect relying party: starting a sign-in, redeeming the code, validating the ID token, discovering providers and their
keys, identifying customers, and signing them out. It does not cover the provider's own security, the customer's device, or the store's other features.
"""
assets = [
    "Customers' store accounts and orders.",
    "The store's sessions.",
    "The trust the store places in each provider's issuer and keys.",
    "ID tokens, which carry personal data.",
]
actors = [
    "Customers signing in through their browsers.",
    "The bank and other providers.",
    "An attacker who replays, forges or substitutes tokens, poses as a provider, or controls an account at a provider with someone else's email.",
]
boundaries = [
    "Browser to store: codes and state arrive from the customer's side.",
    "Provider to store: tokens, metadata and keys come from outside the store.",
    "One provider to another: the store must never let one provider's user stand for another's.",
]
assumptions = [
    "The providers keep their private signing keys secret.",
    "The store's connection to each provider uses TLS, which the demo does not model.",
    "In the demo, keys come from fixed seeds and protect nothing; all names and addresses are fictional.",
]
out_of_scope = [
    "Front-channel logout and session-management iframes.",
    "Dynamic client registration and pairwise subjects.",
    "The provider's own sign-in and account security.",
]
tests = [
    "`IdTokenValidatorTest` checks each ID token refusal with its reason, and Ed25519 against RFC 8032 test 1.",
    "`DiscoveryTest` checks the mix-up refusal, keys on another site, a provider without EdDSA, origin comparison and discovery over real HTTP.",
    "`StoreTest` checks the full flow, state binding, single-use codes, registered redirects, account keys, userinfo and both kinds of logout.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next project, tokens-in-the-browser, asks where these tokens should live when the app is a single-page application.
"""

[[threat]]
id = "T1"
stride = "S"
threat = "An access token, a logout token or a token for another app is accepted as proof of sign-in"
where = "`Store.signIn`, `IdTokenValidator`"
control = "Token type, exact issuer, this client in the audience, and azp when there are several"
residual = "Every relying party must configure its own client id; a shared default undoes the audience check"

[[threat]]
id = "T2"
stride = "S"
threat = "An ID token from another sign-in is replayed into this browser, or a callback is pushed into another browser"
where = "`Store.beginLogin`, `Store.callback`"
control = "State and nonce bound to the browser, compared in constant time; codes used once"
residual = "Code interception is also covered by PKCE, shown in oauth2-authorization-code-pkce"

[[threat]]
id = "T3"
stride = "T"
threat = "An expired or altered ID token is accepted"
where = "`IdTokenValidator`"
control = "Signature with a published key before any claim is read; expiry and issue time within a small skew"
residual = "Skew lets a token live a few seconds longer; keep it small"

[[threat]]
id = "T4"
stride = "S"
threat = "A provider poses as another, or the store loads keys from somewhere an attacker controls"
where = "`Discovery`"
control = "Metadata must name the configured issuer; keys only from the issuer's own site; keys never taken from a token"
residual = "If the issuer's own site is compromised, its keys are too; this is the provider's risk to manage"

[[threat]]
id = "T5"
stride = "E"
threat = "Someone with an unverified email at another provider takes over a customer's account"
where = "`Store` account keys"
control = "Accounts keyed by issuer and subject; unverified email never stored or used for linking"
residual = "Linking accounts across providers needs the customer to prove both, which costs a step"

[[threat]]
id = "T6"
stride = "R"
threat = "A customer signs out but other sessions stay alive"
where = "`Store.logout`, `Store.backchannelLogout`"
control = "RP-initiated logout at the provider, and back-channel logout tokens validated and applied per session"
residual = "Applications that ignore logout tokens stay signed in until their sessions expire"
