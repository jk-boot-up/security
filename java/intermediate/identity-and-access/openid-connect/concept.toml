[[act]]
title = "Checking the ID token, as OpenID Connect Core requires"
summary = "The bank signs a header and twelve claims with Ed25519 into a 510-character token; the store checks the algorithm, the key id, the signature, the exact issuer, the audience, the time and the nonce; then one thing is changed at a time and each change is refused, except a second audience with azp store-web and a token twenty-nine seconds past expiry."
detail = """
Before signing: the header {"alg":"EdDSA","typ":"JWT","kid":"bank-2026-a"} and the claims as JSON. The bank base64url-encodes each, joins them with
a dot into the signing input, and signs that with the Ed25519 private key bank-2026-a: 64 bytes, 86 characters in base64url. The token is the three
parts joined by dots. The store checks in this order: alg is EdDSA (its own choice), the key id is published, the Ed25519 signature verifies, iss
equals https://bank.example exactly, aud contains store-web, now is before exp plus 30 seconds of skew, and the nonce is the one this browser was
given. Then one thing at a time: a foreign key, an issuer with an extra slash, another issuer, another audience, two audiences without azp, a nonce
from another sign-in, no nonce and a header saying alg none are refused; two audiences with azp store-web are accepted. Twenty-nine seconds past exp
the token is accepted (exp + 30 is still after now); thirty seconds past it is refused as expired.
"""
figure = "token_anatomy"
figure_title = "How the ID token is made, and checked"
figure_speech = """
Second demo: what an I D token is made of. [[slnc 400]] At the top left, before signing: a small header, and the claims, both as J S O N. [[slnc 600]]
The bank turns the header into text with base sixty four U R L. [[slnc 300]] That is the header part. [[slnc 300]] It does the same with the claims. [[slnc 300]] That is the claims part. [[slnc 300]] It joins them with a dot, and signs those bytes with its private key, using Ed twenty five five one nine. [[slnc 300]] That gives sixty four bytes: the signature. [[slnc 300]] The token is the three parts, joined by dots. [[slnc 700]]
On the right, how the store checks it, in order. [[slnc 300]] The algorithm is the one the store chose, not the one the token asks for. [[slnc 300]] The key is one the bank published. [[slnc 300]] The signature verifies. [[slnc 300]] Only then are the claims believed: the exact issuer, this store in the audience, the time, and the nonce.
"""
speech = """
Here is the output. [[slnc 400]] The header and the claims, before signing: twelve claims, two hundred and sixty nine bytes. [[slnc 400]] Then the four steps. [[slnc 300]] Header part. [[slnc 300]] Claims part. [[slnc 300]] The signing input, four hundred and twenty three bytes. [[slnc 300]] And the signature: sixty four bytes, eighty six characters.
[[page]]
After signing, the token is five hundred and ten characters. [[slnc 400]] The store's checks, in order, all true. [[slnc 300]] Note step six: now is before expiry plus thirty seconds. [[slnc 400]] The result: accepted.
[[page]]
Now one thing changed at a time. [[slnc 400]] A key the bank never published: refused. [[slnc 300]] One extra slash in the issuer: refused, the match is exact. [[slnc 300]] Another issuer: refused. [[slnc 300]] Another audience: refused. [[slnc 300]] Two audiences and no authorized party: refused. [[slnc 300]] With the authorized party naming the store: accepted.
[[page]]
A nonce from another sign-in: refused, so a token cannot be replayed into this login. [[slnc 300]] No nonce: refused. [[slnc 300]] A header that says none: refused. [[slnc 500]] And the time. [[slnc 300]] Twenty nine seconds late, expiry plus thirty is still after now: accepted. [[slnc 300]] Thirty seconds late, it equals now: refused.
"""
rows = { validate = "active ok" }
console = [
    ["BEFORE SIGNING (a header and the claims, as JSON):", "code"],
    ["  header  {\"alg\":\"EdDSA\",\"typ\":\"JWT\",\"kid\":\"bank-2026-a\"}", "muted"],
    ["  claims  {\"iss\":\"https://bank.example\",\"sub\":\"ana-0001\",\"...", "muted"],
