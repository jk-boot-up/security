    "Customers signing in through their browsers.",
    "The bank and other providers.",
    "An attacker who replays, forges or substitutes tokens, poses as a provider, or controls an account at a provider with someone else's email.",
]
boundaries = [
    "Browser to store: codes and state arrive from the customer's side.",
    "Provider to store: tokens, metadata and keys come from outside the store.",
    "One provider to another: the store must never let one provider's user stand for another's.",
]
assumptions = [
    "The providers keep their private signing keys secret.",
    "The store's connection to each provider uses TLS, which the demo does not model.",
    "In the demo, keys come from fixed seeds and protect nothing; all names and addresses are fictional.",
]
out_of_scope = [
    "Front-channel logout and session-management iframes.",
    "Dynamic client registration and pairwise subjects.",
    "The provider's own sign-in and account security.",
]
tests = [
    "`IdTokenValidatorTest` checks each ID token refusal with its reason, and Ed25519 against RFC 8032 test 1.",
    "`DiscoveryTest` checks the mix-up refusal, keys on another site, a provider without EdDSA, origin comparison and discovery over real HTTP.",
    "`StoreTest` checks the full flow, state binding, single-use codes, registered redirects, account keys, userinfo and both kinds of logout.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next project, tokens-in-the-browser, asks where these tokens should live when the app is a single-page application.
"""

[[threat]]
id = "T1"
stride = "S"
threat = "An access token, a logout token or a token for another app is accepted as proof of sign-in"
where = "`Store.signIn`, `IdTokenValidator`"
control = "Token type, exact issuer, this client in the audience, and azp when there are several"
residual = "Every relying party must configure its own client id; a shared default undoes the audience check"

[[threat]]
id = "T2"
stride = "S"
threat = "An ID token from another sign-in is replayed into this browser, or a callback is pushed into another browser"
where = "`Store.beginLogin`, `Store.callback`"
control = "State and nonce bound to the browser, compared in constant time; codes used once"
residual = "Code interception is also covered by PKCE, shown in oauth2-authorization-code-pkce"

[[threat]]
id = "T3"
stride = "T"
threat = "An expired or altered ID token is accepted"
where = "`IdTokenValidator`"
control = "Signature with a published key before any claim is read; expiry and issue time within a small skew"
residual = "Skew lets a token live a few seconds longer; keep it small"

[[threat]]
id = "T4"
stride = "S"
threat = "A provider poses as another, or the store loads keys from somewhere an attacker controls"
where = "`Discovery`"
control = "Metadata must name the configured issuer; keys only from the issuer's own site; keys never taken from a token"
residual = "If the issuer's own site is compromised, its keys are too; this is the provider's risk to manage"

[[threat]]
id = "T5"
stride = "E"
threat = "Someone with an unverified email at another provider takes over a customer's account"
where = "`Store` account keys"
control = "Accounts keyed by issuer and subject; unverified email never stored or used for linking"
residual = "Linking accounts across providers needs the customer to prove both, which costs a step"

[[threat]]
id = "T6"
stride = "R"
threat = "A customer signs out but other sessions stay alive"
where = "`Store.logout`, `Store.backchannelLogout`"
control = "RP-initiated logout at the provider, and back-channel logout tokens validated and applied per session"
residual = "Applications that ignore logout tokens stay signed in until their sessions expire"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] Everything runs in one Java process, with a simulated clock and fixed keys, so every run is the same. [[slnc 300]] Here are the classes that matter."""

[[class]]
name = "Store"
what = "the online store as the relying party"
[[class.part]]
title = "a state and a nonce per browser"
code = """
Pending pending = new Pending(issuer, randomValue(), randomValue());
browser.pending = pending;
"""
speech = """Before the browser leaves for the bank, the store makes a random state and a random nonce. [[slnc 300]] It keeps both for this browser, and sends them along with the request."""
[[class.part]]
title = "the account key: issuer and subject"
code = """
String email = token.emailVerified() ? token.email() : null;
String key = accountKey == AccountKey.EMAIL
        ? String.valueOf(token.email())
        : token.identity();
"""
speech = """When the browser comes back, the I D token has been validated against this browser's nonce. [[slnc 300]] An unverified email is dropped. [[slnc 300]] And the account key is the issuer and the subject, unless the demo asks for the broken email key."""

[[class]]
name = "Jws"
what = "the token format: header.payload.signature"
[[class.part]]
title = "sign the two parts, joined by a dot"
code = """
String headerPart = Base64Url.encode(headerJson);
String payloadPart = Base64Url.encode(payload);
String signingInput = headerPart + "." + payloadPart;
byte[] input = signingInput.getBytes(StandardCharsets.US_ASCII);
byte[] signature = Ed25519.sign(key, input);
return signingInput + "." + Base64Url.encode(signature);
"""
speech = """This is the signing from the second demo. [[slnc 300]] Each part is encoded, the two are joined by a dot, and those bytes are signed. [[slnc 300]] The token is the three parts, joined by dots."""

[[class]]
name = "IdTokenValidator"
what = "the checks of OpenID Connect Core"
[[class.part]]
title = "the key, then the signature"
code = """
if (!"EdDSA".equals(parts.header().get("alg"))) {
...
PublicKey key = provider.keys().find(kid)
        .orElseThrow(() -> new InvalidTokenException("unknown key id"));
if (!Ed25519.verify(key, parts.signingInput(), parts.signature())) {
"""
speech = """The algorithm is fixed by the validator, never read from the token. [[slnc 300]] The key is found by its id in the bank's published set. [[slnc 300]] And the signature is verified before any claim is read."""
[[class.part]]
title = "then the claims"
code = """
if (!provider.issuer().equals(claims.get("iss"))) {
...
if (!audience.contains(clientId)) {
...
if (now >= exp + SKEW_SECONDS) {
...
if (!MessageDigest.isEqual(given, expected)) {
"""
speech = """Then the claims. [[slnc 300]] The issuer must be equal, character for character. [[slnc 300]] The audience must include the store. [[slnc 300]] The time allows thirty seconds of skew. [[slnc 300]] And the nonce must be the one this browser was given."""

[[class]]
name = "Discovery"
what = "metadata and keys from one configured issuer"
[[class.part]]
title = "the same issuer, keys at home"
code = """
String document = fetch(fetcher, metadataUrl(configuredIssuer));
Map<String, Object> metadata = Json.parseObject(document);
if (!configuredIssuer.equals(metadata.get("issuer"))) {
...
if (!sameOrigin(configuredIssuer, jwksUri)) {
"""
speech = """Discovery reads the metadata from the well known address of the configured issuer. [[slnc 300]] The document must name that same issuer. [[slnc 300]] And the key set must be on the issuer's own site."""

[[class]]
name = "Provider"
what = "the bank: metadata, keys, codes and signed tokens"
[[class.part]]
title = "the logout token"
code = """
c.put("jti", "lt-" + (++counter));
c.put("events", Map.of(LOGOUT_EVENT, Map.of()));
c.put("sub", subject);
c.put("sid", sid);
return sign("logout+jwt", c);
"""
speech = """The provider plays the bank. [[slnc 300]] Its logout token carries the logout event, the subject and the session id. [[slnc 300]] Its own type, logout plus J W T, and no nonce, keep it from passing as an I D token."""

[[acronym]]
short = "OAuth"
long = "Open Authorization: lets an app act for a user"
say = "O Auth is open authorization. It lets an app act on a user's behalf, with an access token."
[[acronym]]
short = "OIDC"
long = "OpenID Connect: who signed in, on top of OAuth"
say = "O I D C is Open I D Connect. It adds who signed in, in an I D token, on top of O Auth."
[[acronym]]
short = "ID"
long = "identity: an ID token says who signed in"
say = "I D means identity. An I D token says who signed in, and for which app."
[[acronym]]
short = "JWT"
long = "JSON Web Token: header.claims.signature"
say = "J W T is a JSON web token: a header, the claims, and a signature, joined by dots."
[[acronym]]
short = "JSON"
long = "JavaScript Object Notation: text with names and values"
say = "J S O N is JavaScript object notation: text made of names and values."
[[acronym]]
short = "API"
long = "Application Programming Interface"
say = "A P I is an application programming interface: here, the bank's service for other programs."
[[acronym]]
short = "URL, URI"
long = "Uniform Resource Locator / Identifier: an address"
say = "U R L is a uniform resource locator, and U R I a uniform resource identifier. Both are addresses on the web."
[[acronym]]
short = "HTTP"
long = "Hypertext Transfer Protocol: how the web talks"
say = "H T T P is the hypertext transfer protocol, the way browsers and servers talk."
[[acronym]]
short = "JWKS"
long = "JSON Web Key Set: the provider's public keys"
say = "J W K S is a JSON web key set: the list of public keys a provider publishes."
[[acronym]]
short = "EdDSA, Ed25519"
long = "Edwards-curve Digital Signature Algorithm, on curve 25519"
say = "E D D S A is the Edwards curve digital signature algorithm. Ed twenty five five one nine is that algorithm on one well known curve."
[[acronym]]
short = "OKP"
long = "Octet Key Pair: the JWKS key type for Ed25519"
say = "O K P means octet key pair: the key type a key set uses for Ed twenty five five one nine keys."
[[acronym]]
short = "base64url"
long = "bytes as letters, digits, - and _, safe in an address"
say = "Base sixty four U R L writes bytes as letters, digits, dash and underscore, so they are safe in an address."
[[acronym]]
short = "iss, sub, aud"
long = "issuer, subject, audience: who says, who signed in, for whom"
say = "I S S is the issuer, who says so. Sub is the subject, who signed in. Aud is the audience, which app the token is for."
[[acronym]]
short = "iat, exp"
long = "issued at, expires: seconds since 1970"
say = "I A T is issued at, and exp is the expiry, both in seconds since nineteen seventy."
[[acronym]]
short = "azp, acr, amr"
long = "authorized party; authentication class; authentication methods"
say = "A Z P is the authorized party. A C R is the authentication context class, how strong the sign-in was. A M R lists the methods used, such as a password and a one time code."
[[acronym]]
short = "sid, jti"
long = "session id at the provider; a token's own unique id"
say = "S I D is the provider's session id. J T I is a token's own unique id."
[[acronym]]
short = "RP"
long = "Relying Party: the app that trusts the sign-in"
say = "R P is the relying party: the app that relies on the sign-in, here the store."
[[acronym]]
short = "typ, alg, kid"
long = "token type; signing algorithm; key id"
say = "In the header, typ is the token type, alg is the signing algorithm, and kid is the key id."
