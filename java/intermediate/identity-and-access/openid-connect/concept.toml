[[act]]
title = "Signing out, and the bill"
summary = "Ana's sign-out ends the store's session and sends her to the bank's logout with id_token_hint; a back-channel logout token ends the laptop's session and leaves the phone's; a token with a nonce, without the event, or an ID token is refused."
detail = """
Ana signs out at the store: the store's session ends, and her browser is sent to https://bank.example/logout with id_token_hint,
post_logout_redirect_uri and state. Ana is then signed in on a laptop and a phone: 2 store sessions. The bank ends the laptop's session and sends a
back-channel logout token, typed logout+jwt, with the logout event, a sid and no nonce: accepted. One store session is left; the laptop is signed out
and the phone still signed in. A logout token with a nonce is refused, so is one without the logout event, and so is an ID token sent as a logout
token. The bill: OpenID Connect has many checks and options, so production code uses a certified library and a real provider; the ID token is for
the store only; and signing out must reach every party.
"""
speech = """
Fifth demo: signing out. [[slnc 400]] Ana signs out at the store. [[slnc 300]] The store's session ends. [[slnc 300]] Her browser is sent to the bank, to sign out there too. [[slnc 600]]
Now Ana is signed in on a laptop and a phone. [[slnc 300]] The bank ends the laptop's session, and tells the store directly, with a logout token. [[slnc 600]]
The logout token is typed, carries a logout event and a session id, and has no nonce. [[slnc 300]] The laptop is signed out. [[slnc 300]] The phone is not. [[slnc 600]]
A logout token with a nonce, one without the event, or an I D token in its place. [[slnc 300]] All refused. [[slnc 600]]
And the bill. [[slnc 300]] Open I D Connect has many checks, so use a certified library and a real provider. [[slnc 300]] Keep the I D token in the store. [[slnc 300]] And make sign out reach every application.
"""
