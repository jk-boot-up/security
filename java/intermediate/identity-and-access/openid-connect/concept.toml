[[act]]
title = "Signing out, and the bill"
summary = "Ana's sign-out ends the store's session and sends her browser to the bank's logout with id_token_hint, an encoded post_logout_redirect_uri and a state; a back-channel logout token for sid-3 ends the laptop's session and leaves the phone's; a token with a nonce, without the event, or an ID token is refused."
detail = """
Ana signs out at the store (RP-initiated logout): the store's session ends, and her browser is sent to https://bank.example/logout with
id_token_hint, post_logout_redirect_uri https%3A%2F%2Fshop.example%2Fsigned-out (the address, URL-encoded) and a random state. Then Ana is signed in on
a laptop (sid-3) and a phone (sid-5): two store sessions. The bank ends the laptop's session and sends a logout token: header typ logout+jwt, alg
EdDSA, kid bank-2026-a; claims iss, aud store-web, sub ana-0001, sid sid-3, jti lt-7, the back-channel logout event, and no nonce. It is accepted;
one store session is left, the laptop is signed out and the phone is not. A logout token with a nonce, one without the event, and an ID token sent as
a logout token are refused. The bill: use a certified library, keep the ID token in the store, and make sign-out reach every party.
"""
figure = "backchannel_logout"
figure_title = "A logout token ends one session"
figure_speech = """
Fifth demo: signing out. [[slnc 400]] First, Ana signs out at the store. [[slnc 300]] The store ends its own session, and sends her browser to the bank, to sign out there too. [[slnc 700]]
Now the picture. [[slnc 300]] Before: Ana is signed in on two devices. [[slnc 300]] The laptop's session at the bank is s i d three. [[slnc 300]] The phone's is s i d five. [[slnc 700]]
The bank ends the laptop's session, and tells the store directly, server to server, with a logout token. [[slnc 300]] Its type says logout. [[slnc 300]] It carries the logout event, and the session id s i d three. [[slnc 300]] And it has no nonce, so it can never pass as an I D token. [[slnc 700]]
After: only the laptop is signed out. [[slnc 300]] The phone stays signed in.
"""
speech = """
Here is the output. [[slnc 400]] Ana signs out at the store. [[slnc 300]] The session ends, and her browser goes to the bank's logout address, with three parameters. [[slnc 300]] The return address is U R L encoded: each colon and slash becomes a percent code.
[[page]]
Before: two sessions. [[slnc 400]] The logout token: its header, and its claims, with the laptop's session id and the logout event, and no nonce. [[slnc 400]] After: accepted. [[slnc 300]] One session left. [[slnc 300]] The laptop is signed out; the phone is not.
[[page]]
Broken logout tokens. [[slnc 300]] With a nonce: refused. [[slnc 300]] Without the event: refused. [[slnc 300]] An I D token in its place: refused. [[slnc 500]]
And the bill. [[slnc 300]] Open I D Connect has many checks, so use a certified library. [[slnc 300]] Keep the I D token in the store. [[slnc 300]] And make sign out reach every application.
"""
