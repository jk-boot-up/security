[[act]]
title = "Checking the ID token, as OpenID Connect Core requires"
summary = "The bank's own token is accepted; a foreign signature, an issuer with an extra slash or another issuer, another audience, two audiences without azp, thirty seconds past expiry, another sign-in's nonce, no nonce and alg none are each refused."
detail = """
The bank's own ID token is accepted. The same claims signed with a key the bank never published, under the bank's key id, are refused: the signature
does not match. The issuer https://bank.example/, with one extra slash, is refused, because the issuer must equal the configured issuer exactly, and
so is https://wallet.example signed by the bank. The audience budget-app is refused. Audiences store-web and budget-app with no azp are refused;
with azp store-web they are accepted. Twenty-nine seconds past its expiry the token is accepted, inside the 30-second skew; thirty seconds past, it is
refused. A nonce from another sign-in is refused, so a token from another login cannot be replayed into this one, and so is a token with no nonce at
all. A header saying alg none is refused before anything else is read.
"""
speech = """
Second demo: checking the I D token. [[slnc 400]] The bank's own token is accepted. [[slnc 600]]
The same claims, signed with a key the bank never published. [[slnc 300]] Refused. [[slnc 600]]
The issuer with one extra slash at the end. [[slnc 300]] Refused. [[slnc 300]] The issuer must match exactly. [[slnc 600]]
Another audience. [[slnc 300]] Refused. [[slnc 300]] Two audiences, with no authorized party naming the store. [[slnc 300]] Refused. [[slnc 600]]
Twenty nine seconds past expiry, inside the skew. [[slnc 300]] Accepted. [[slnc 300]] Thirty seconds past. [[slnc 300]] Refused. [[slnc 600]]
A nonce from another sign-in. [[slnc 300]] Refused. [[slnc 300]] So a token from one login cannot be replayed into another. [[slnc 600]]
And a header that says none. [[slnc 300]] Refused, before anything else is read.
"""
rows = { validate = "active ok" }
console = [
    ["the bank's own ID token: accepted", "ok"],
    ["the same claims signed with a key the bank never published, under the bank's key id: refused (signature does not match)", "ok"],
    ["issuer https://bank.example/ with one extra slash: refused (issuer is not the configured issuer)", "ok"],
    ["audience budget-app: refused (audience does not include this client)", "ok"],
    ["audiences store-web and budget-app, with no azp: refused; with azp store-web: accepted", "ok"],
    ["twenty-nine seconds past its expiry: accepted, inside the 30 second skew; thirty seconds past: refused (expired)", "amber"],
    ["a nonce from another sign-in: refused  <- A TOKEN FROM ANOTHER LOGIN CANNOT BE REPLAYED INTO THIS ONE", "ok"],
    ["a header saying alg none: refused (algorithm is not EdDSA)", "ok"],
]

[[act]]
title = "Discovery and keys"
summary = "From one configured issuer the store reads the metadata and keys; a document naming another issuer or keys on another site is refused; a second key is added, the old one retired, and the same discovery works over real HTTP."
detail = """
The store is configured with one value, the issuer https://bank.example. It reads https://bank.example/.well-known/openid-configuration, which names
the issuer https://bank.example, and loads the key bank-2026-a from https://bank.example/jwks.json. A document at that address naming the issuer
https://wallet.example is refused, so one provider cannot pose as another, and so is a document whose keys are on https://keys.example. The bank adds
a second key and signs new tokens with it; after a reload the store holds bank-2026-a and bank-2026-b, and tokens signed with either are accepted.
The bank retires bank-2026-a; after a reload, the old key's token is refused as an unknown key id and a new token is accepted. Over real HTTP on this
machine, metadata and keys load and an ID token from that provider is accepted.
"""
speech = """
Third demo: discovery and keys. [[slnc 400]] The store is configured with one value: the bank's issuer. [[slnc 600]]
It reads the bank's metadata from a well known address under that issuer. [[slnc 300]] The document must name exactly that issuer. [[slnc 300]] It does. [[slnc 600]]
A document at that address that names another issuer. [[slnc 300]] Refused. [[slnc 300]] One provider cannot pose as another. [[slnc 300]] A document whose keys live on another site. [[slnc 300]] Refused. [[slnc 600]]
The bank adds a second key, and signs new tokens with it. [[slnc 300]] After a reload, tokens signed with either key are accepted. [[slnc 600]]
The bank retires the old key. [[slnc 300]] After the next reload, the old key's token is refused. [[slnc 600]]
And the same discovery works over real H T T P, on this machine.
"""
rows = { discovery = "active ok" }
console = [
    ["the store is configured with one value, the issuer https://bank.example", "muted"],
    ["it reads https://bank.example/.well-known/openid-configuration, which names the issuer https://bank.example: accepted", "ok"],
    ["keys loaded from https://bank.example/jwks.json: bank-2026-a", "muted"],
    ["a document at that address naming the issuer https://wallet.example: refused  <- ONE PROVIDER CANNOT POSE AS ANOTHER", "ok"],
    ["a document whose keys are on https://keys.example: refused (the key set is not on the issuer's own site)", "ok"],
    ["the bank adds a second key; the store reloads the key set: bank-2026-a, bank-2026-b", "muted"],
    ["the bank retires bank-2026-a; after a reload, the old key's token: refused (unknown key id); a new token: accepted", "amber"],
    ["over real HTTP on this machine: metadata and keys loaded: true, an ID token from that provider accepted: true", "ok"],
]

[[act]]
