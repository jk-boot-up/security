[[act]]
title = "PKCE: a code is useless without the verifier"
summary = "The verifier dBjftJeZ... becomes 43 ASCII bytes, SHA-256 gives 32 bytes starting 13 d3 1e, and base64url gives E9Me... and the published challenge; a thief redeeming a leaked code with no verifier is refused and the failed try burns the code, so the real app is refused too; a made-up verifier is a Code mismatch; plain and missing challenges are refused at Keycloak."
detail = """
The verifier is the RFC 7636 example, dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk. The S256 challenge is made in steps: the 43 characters as 43 ASCII
bytes (64 42 6a 66 ...); SHA-256 of those bytes, 32 bytes (13 d3 1e 96 ...); base64url, where 13 d3 1e is 000100 111101 001100 011110, the numbers
4 61 12 30, the characters E9Me; all 32 bytes give E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM, the published value. Only the challenge travels through
the browser. A thief who redeems a leaked code with no verifier is refused with invalid_grant, PKCE code verifier not specified, and the failed try burns
the code: the budgeting app with the real verifier then gets Code not valid, and Ana signs in again. A new code with a made-up verifier of 43 x's is
refused with PKCE verification failed: Code mismatch; with the real verifier, tokens are issued. Keycloak refuses code_challenge_method=plain and a request
with no code_challenge with invalid_request.
"""
figure = "s256_steps"
figure_title = "From the verifier to the challenge, step by step"
figure_speech = """
Second demo: P K C E, said pixie. [[slnc 400]] For every sign in, the app makes a secret, the verifier. [[slnc 300]] Here it is the example published in the standard, forty three characters. [[slnc 700]]
Step one. [[slnc 300]] Each character becomes one byte, its A S C I I code. [[slnc 300]] The small d is six four in hex. [[slnc 600]]
Step two. [[slnc 300]] S H A two five six turns those bytes into thirty two bytes. [[slnc 300]] Nobody can turn them back into the verifier. [[slnc 600]]
Step three. [[slnc 300]] Base sixty four U R L writes the bytes as letters that are safe in an address. [[slnc 300]] Three bytes are twenty four bits, cut into four groups of six: four, sixty one, twelve, and thirty. [[slnc 300]] Capital E, nine, capital M, and small e. [[slnc 600]]
Step four. [[slnc 300]] All thirty two bytes give forty three characters, with no padding. [[slnc 300]] Keycloak redoes these steps with the verifier, and compares.
"""
speech = """
Here is the output. [[slnc 400]] The verifier, forty three characters. [[slnc 400]] Then the A S C I I bytes, and the thirty two bytes of the hash, in hex.
[[page]]
The first three bytes, worked out bit by bit, give E nine M e. [[slnc 400]] The whole hash gives the challenge the standard publishes. [[slnc 400]] Only the challenge travels through the browser, never the verifier.
[[page]]
Now a thief redeems a leaked code first, with no verifier: refused. [[slnc 300]] Then the real app tries the same code: refused too. [[slnc 300]] Keycloak burns a code at the first failed try, so the leak is useless, and Ana simply signs in again. [[slnc 400]] A made up verifier is a mismatch. [[slnc 300]] The real verifier gets tokens.
[[page]]
And Keycloak refuses weaker requests: the plain method, which would send the verifier itself, and a request with no challenge at all.
"""
rows = { pkce = "active ok" }
console = [
    ["THE VERIFIER (made by the app for one sign-in, kept secret):", "code"],
    ["  dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk", "muted"],
    ["  43 characters from A-Z a-z 0-9 - . _ ~ (the RFC 7636 example)", "muted"],
