[[class]]
name = "OAuthClient"
what = "the budgeting app and the browser"
[[class.part]]
title = "the challenge, and the state check"
code = """
byte[] ascii = verifier.getBytes(StandardCharsets.US_ASCII);
byte[] hash = MessageDigest.getInstance("SHA-256").digest(ascii);
return Base64.getUrlEncoder().withoutPadding().encodeToString(hash);
...
static String codeIfStateMatches(Outcome outcome, String expectedState) {
    Map<String, String> p = outcome.parameters();
    if (!expectedState.equals(p.get("state"))) {
        throw new IllegalStateException("invalid_state: this browser did not start this sign-in");
"""
speech = """The app hashes its verifier into the challenge. [[slnc 300]] And on every callback it compares the state with the one it gave this browser, before it touches the code. [[slnc 300]] Keycloak cannot do this check for the app."""

[[class]]
name = "ChallengeSteps"
what = "the same challenge, worked out by hand for the demo"
[[class.part]]
title = "every 3 bytes become 4 characters of 6 bits"
code = """
for (int i = 0; i < bytes.length; i += 3) {
    int n = Math.min(3, bytes.length - i);
    ...
    for (int k = 0; k <= n; k++) {
        out.append(ALPHABET.charAt((bits >> (18 - 6 * k)) & 63));
"""
speech = """This teaching class redoes the base sixty four step by hand: three bytes, twenty four bits, four letters of six bits. [[slnc 300]] A test, which needs no Docker, proves it matches the library."""

[[class]]
name = "ApiSecurity"
what = "the accounts API: a Spring Security resource server"
[[class.part]]
title = "the key, the issuer, the audience and the dates"
code = """
NimbusJwtDecoder decoder = NimbusJwtDecoder
        .withJwkSetUri(issuer + "/protocol/openid-connect/certs").build();
JwtTimestampValidator timestamps = new JwtTimestampValidator(Duration.ofSeconds(30));
...
OAuth2TokenValidator<Jwt> audience =
        new JwtClaimValidator<List<String>>("aud", aud -> aud != null && aud.contains(AUDIENCE));
OAuth2TokenValidator<Jwt> issuedHere = new JwtIssuerValidator(issuer);
decoder.setJwtValidator(new DelegatingOAuth2TokenValidator<>(issuedHere, audience, timestamps));
"""
speech = """The A P I fetches Keycloak's public keys, and checks every token's signature, issuer, audience and dates, with thirty seconds for clock differences. [[slnc 300]] It never asks Keycloak about the session, which is why a revoked session goes unseen until the token expires."""
[[class.part]]
title = "the scope decides what a token may do"
code = """
.requestMatchers(HttpMethod.GET, "/accounts").hasAuthority("SCOPE_accounts.read")
.requestMatchers(HttpMethod.POST, "/payments").hasAuthority("SCOPE_payments.write")
.anyRequest().denyAll())
"""
speech = """Reading accounts needs the accounts dot read scope, paying needs payments dot write, and anything else is denied."""

[[acronym]]
short = "OAuth"
long = "Open Authorization: limited access without the password"
say = "O Auth is open authorization: a standard way for a customer to give an app limited access to an account, without the password."
[[acronym]]
short = "PKCE"
long = "Proof Key for Code Exchange, said 'pixie'"
say = "P K C E is proof key for code exchange, said pixie. The app proves it is the one that asked for the code."
[[acronym]]
short = "SHA-256, S256"
long = "Secure Hash Algorithm, 256-bit result; S256 in PKCE"
say = "S H A two five six is the secure hash algorithm with a two hundred and fifty six bit result. S two five six is P K C E's name for using it."
[[acronym]]
short = "ASCII"
long = "American Standard Code for Information Interchange"
say = "A S C I I is the American standard code for information interchange. Each letter or digit becomes one byte."
[[acronym]]
short = "hex, base64url"
long = "a byte as 2 digits 0-9 a-f; 6 bits per URL-safe letter"
say = "Hex writes a byte as two digits from zero to f. Base sixty four U R L writes six bits per letter, using dash and underscore so it is safe in a web address."
[[acronym]]
short = "JWT"
long = "JSON Web Token: signed claims such as iss, aud, sub, exp"
say = "J W T is a JSON web token: a set of signed claims, such as the issuer, the audience, the subject and the expiry time."
[[acronym]]
short = "JSON"
long = "JavaScript Object Notation: text with names and values"
say = "JSON is JavaScript object notation: text made of names and values."
[[acronym]]
short = "ID token"
long = "OpenID Connect's token that says who signed in"
say = "An I D token is the OpenID Connect token that tells the app who signed in. It is not for the A P I."
[[acronym]]
short = "RFC"
long = "Request for Comments: numbered internet standards"
say = "R F C means request for comments: the numbered internet standards. Seven six three six is P K C E, and nine seven hundred is the current best practice."
[[acronym]]
short = "URI, URL"
long = "Uniform Resource Identifier / Locator: a web address"
say = "U R I and U R L mean uniform resource identifier and locator: a web address."
[[acronym]]
short = "HTTP"
long = "Hypertext Transfer Protocol; status 200, 302, 401, 403"
say = "H T T P is the hypertext transfer protocol. Two hundred means O K, three oh two sends the browser elsewhere, four oh one means no valid token, and four oh three means not allowed."
[[acronym]]
short = "API"
long = "Application Programming Interface: the bank's service"
say = "A P I means application programming interface: here, the bank's accounts service."
[[acronym]]
short = "A1, A2, R1, R2"
long = "the demo's names for access and refresh tokens"
say = "A one and A two are access tokens, and R one and R two are refresh tokens, numbered in the order they are issued."
[[acronym]]
short = "TLS"
long = "Transport Layer Security: encrypted web traffic"
say = "T L S is transport layer security, which encrypts web traffic."
