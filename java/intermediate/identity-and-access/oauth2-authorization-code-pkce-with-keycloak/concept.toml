title = "How To Use It"
body = ["Name the parts of the authorization code flow and what", "each one protects", "Explain what PKCE stops and why a failed try burns the", "code", "List the client settings that make the flow safe", "Explain what an online check sees that a local check", "cannot"]
narration = "So, how do you use it? [[slnc 400]] Use the authorization code flow with S256 P K C E for every client, register exact redirect addresses, switch off the implicit flow and the password grant, rotate refresh tokens, keep access tokens short, check the state in the app, and have the A P I check the issuer, audience, dates and scope of every token."

