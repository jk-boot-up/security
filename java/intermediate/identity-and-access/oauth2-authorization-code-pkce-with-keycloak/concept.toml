slug = "oauth2-authorization-code-pkce-with-keycloak"
level = "intermediate"
module = "identity-and-access"
title = "OAuth 2.0 Authorization Code with PKCE and Keycloak"
short_title = "OAuth 2.0 with Keycloak"
package = "oauthkeycloak"
main_class = "OAuthKeycloakDemo"
tagline = "The same flow against a real authorization server: the checks that make it safe are settings on the client, and Keycloak enforces them"
bold = "Against a real Keycloak the authorization code flow with PKCE is a handful of client settings, exact redirect addresses, S256 required, no implicit flow, no password grant, rotated refresh tokens and short code and token lives, and the app still has to check the state; a reused code or a reused refresh token ends the session at Keycloak, which a resource server that validates tokens locally cannot see until the token expires."
domain = "an online bank"
domain_note = ""
youtube_description = "OAuth 2.0 authorization code flow with PKCE against a real Keycloak 26 in Docker, with a Spring Security 7 resource server: the flow step by step with a consent screen, PKCE that burns a code at the first wrong try, exact redirect addresses (a path trick, a lookalike host, a query, upper case and a trailing slash are all refused), the state check Mallory's link fails, a code that works once and ends the session when reused, a code that expires, scopes the client was not registered for, refresh token rotation and reuse detection, the implicit flow and the password grant switched off, and a confidential client that still needs PKCE."
thumb_lines = ["OAUTH 2.0 + PKCE", "WITH KEYCLOAK"]
thumb_code = "pkce.code.challenge.method = S256"
youtube_title = "OAuth 2.0 Authorization Code + PKCE with Keycloak: Redirects, State, Code Reuse, Refresh Rotation"
