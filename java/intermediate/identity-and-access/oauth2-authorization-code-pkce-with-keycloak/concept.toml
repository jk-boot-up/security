key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Try the first exercise", "in docs/session.md."]
narration = "That's OAuth 2 point 0 with Keycloak. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] The authorization code flow lets an app act for a user without their password, and it is safe only because the client's settings, the redirect check, P K C E, the state and one-time codes are all enforced. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Register a second redirect address and test the lookalikes of it. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"
