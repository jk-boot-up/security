[[act]]
title = "Current practice, and the bill"
summary = "The implicit flow and the password grant are refused with unauthorized_client because they are switched off on the client; the confidential statements-service is refused with a wrong secret, with a code it was never given, and with a real code but no verifier; the API checks the key, issuer, audience, dates and scope of every token."
detail = """
The implicit flow, response_type=token, is refused: Client is not allowed to initiate browser login with given response_type, Implicit flow is disabled
for the client. The password grant is refused: Client not allowed for direct access grants. Both are removed by RFC 9700 and by OAuth 2.1, and here they
are switched off on the client. The statements service is a confidential client: a wrong client secret is refused with Invalid client or Invalid client
credentials; the right secret with a code it was never given gets Code not valid; and the right secret with a real code but no verifier gets PKCE code
verifier not specified, because a secret does not replace PKCE. The accounts API keeps no session and checks Keycloak's signing key, the issuer, the
audience accounts-api, the dates and the scope of every token. In production: TLS, backups, key rotation and monitoring of logins.
"""
figure = "grants_today"
figure_title = "What current practice removes, and what it keeps"
figure_speech = """
Fifth demo: current practice, and the bill. [[slnc 400]] At the top, two older ways to get a token. [[slnc 300]] The implicit flow put the token straight into the address bar. [[slnc 300]] The password grant gave the app the customer's password. [[slnc 300]] Both are switched off on this client, so Keycloak refuses both. [[slnc 700]]
Below, a confidential client, which runs on a server and has a secret. [[slnc 300]] A wrong secret is refused. [[slnc 300]] And even the right secret, with a real code, is refused without the verifier. [[slnc 300]] A secret does not replace P K C E. [[slnc 600]]
On the right, what the A P I checks on every token. [[slnc 300]] Keycloak's key, the issuer, the audience, the dates, and the scope.
