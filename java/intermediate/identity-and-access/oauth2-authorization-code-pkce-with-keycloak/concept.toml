[readme]
intro = """
The plain [oauth2-authorization-code-pkce](../oauth2-authorization-code-pkce) project builds an authorization server from scratch. This one runs the same five acts against a real **Keycloak 26.8** in Docker, with a **Spring Security 7** resource server checking the tokens. It needs Docker; its tests are tagged `integration`: `./gradlew integrationTest`.

What it shows:
- **The flow, step by step.** The budgeting app's request (response type `code`, `state`, an S256 `code_challenge`), Ana signing in at Keycloak and agreeing on the **consent page** (the app never sees her password), the redirect with `code`, `state` and `iss`, the token exchange made by the app directly, and an access token for 300 seconds with audience `accounts-api`, accepted by the API.
- **PKCE.** The RFC 7636 example gives the published challenge. A thief with a leaked code and **no verifier is refused, and the failed try burns the code**, so the real app is refused too and Ana signs in again. A wrong verifier is a `PKCE verification failed`. A `plain` challenge or no challenge at all is refused at the authorization endpoint.
- **Exact redirects, state and one-time codes.** Of six addresses only the registered one gets a code; the path trick, the lookalike host, the query, the upper-case host and the trailing slash get an error page and **no redirect**. A callback carrying Mallory's code fails the app's own state check. A **reused code ends the session**: Keycloak's userinfo says 401, while the API that validates the signature itself still says 200. A code lives 5 seconds in this realm.
- **Scopes and refresh tokens.** `POST /payments` with an `accounts.read` token is `403 insufficient_scope`; asking for `payments.write` is `invalid_scope`. A refresh token is rotated; **using the old one again ends the session**, so the thief and the real app both lose.
- **Current practice.** The implicit flow and the password grant are switched off on the client, a confidential client needs its secret and **still needs PKCE**.

**Maps to:** OWASP Top 10 (2025) A07 Authentication Failures · RFC 6749 (OAuth 2.0), RFC 7636 (PKCE), RFC 9700 (OAuth 2.0 Security Best Current Practice), RFC 9207 (issuer identification) · OAuth 2.1 draft.
"""
analogy = """
A coat check run by a hotel, not by the shop. You show the hotel your room key, never the shop, and the hotel gives the shop a numbered ticket that works once, and only for the person who holds the matching stub. If someone tries a ticket with the wrong stub, the hotel tears the ticket up.
"""
scenario = """
A budgeting app wants to read Ana's accounts at the bank. The demo starts a real Keycloak and the bank's accounts API in Docker and on a loopback port, drives the authorization code flow as a browser would, and then tries the mistakes: a leaked code, a wrong redirect address, a replayed code, a thief with an old refresh token.
"""
costs = [
    "**Keycloak is a service to run:** its database, its keys, its upgrades and its logins are now part of the bank's security.",
    "**An exact redirect address is one more thing to register** for every environment and every app version, and a wildcard is the shortcut to avoid.",
    "**Reuse detection can sign a real user out** when a retry looks like a replay, so the app must handle a refused refresh by asking Ana to sign in again.",
    "**Short lives mean refreshing,** and a refresh token is worth more than an access token, so it needs the most care.",
    "**A resource server that checks tokens locally cannot see a revoked session** until the token expires; checking online costs a call for every request.",
]
too_much = """
For one app and one API that you own together, a session cookie is simpler. Use OAuth when a third party app must act for a user, or when many apps and APIs share one place to sign in.
"""
met_before = [
    "A \"Sign in with\" button, and a consent screen asking to read your accounts.",
    "`code_challenge` and `code_verifier` in a mobile app's network log.",
    "\"Invalid parameter: redirect_uri\" from Keycloak when a callback address was mistyped.",
    "`spring.security.oauth2.client` and `oauth2ResourceServer` in a Spring Boot project.",
]
where = """
This is the tools version of [oauth2-authorization-code-pkce](../oauth2-authorization-code-pkce), in the [identity-and-access](..) module. It follows the same five acts, against a real authorization server, and ends with the resource server that real banks run.
"""
twin = """
Keycloak is a real container bound to 127.0.0.1 on a free port, with the bank realm imported from infra/bank-realm.json and removed at the end. The resource server is a real Spring Boot application. The browser is a few lines of Java that keep Keycloak's cookies and follow its pages. Codes, tokens, ports and session ids are never printed.
"""
test_note = "The tests that need Keycloak are tagged integration and start one container for the whole class (./gradlew integrationTest). The realm file and PKCE tests need no Docker."

[[act]]
title = "The flow, step by step"
summary = "The budgeting app sends Ana to Keycloak with a state and a PKCE challenge, she signs in and agrees there, the app exchanges the code for an access token, and the API accepts it."
detail = """
Ana's browser goes to Keycloak's authorization endpoint with response type code, the client id, the exact registered redirect address, the scope, a state and an S256 code challenge. Ana signs in at Keycloak, never at the app, and a consent page asks whether budget-app may read her accounts. Keycloak redirects the browser to the registered address with the state, a session state, the issuer and the code. The app checks the state, then calls the token endpoint directly with the code and the verifier. Keycloak answers with an access token for 300 seconds, a refresh token and an ID token. The accounts API accepts the access token: 200, ana, 2 accounts. The token is for accounts-api, asked for by budget-app, carries Ana's id and no password or e-mail, and without a token the API answers 401.
"""
speech = """
First demo: the authorization code flow, step by step. [[slnc 400]] The budgeting app sends Ana's browser to Keycloak with a state and a challenge. [[slnc 600]]
Ana signs in at Keycloak, never at the app, and agrees on the consent page. [[slnc 600]]
Keycloak sends the browser back with a code. [[slnc 300]] The app checks the state, and then calls Keycloak directly with the code and the verifier. [[slnc 600]]
It gets an access token for three hundred seconds, and the A P I accepts it. [[slnc 300]] The app never saw Ana's password.
"""
rows = { flow = "active ok" }
console = [
    ["Ana signs in at Keycloak and agrees on the consent page", "ok"],
    ["302 to the registered address with state, iss and code", "ok"],
    ["token endpoint: 300 seconds, scope openid accounts.read", "ok"],
    ["GET /accounts with the access token -> 200, ana: 2 accounts", "ok"],
]

[[act]]
title = "PKCE: a code is useless without the verifier"
summary = "A leaked code with no verifier is refused and burned, a wrong verifier is refused, a plain challenge or none is refused at the authorization endpoint."
detail = """
The RFC 7636 example verifier gives the published S256 challenge. Only the challenge travels through the browser. A code leaks, and another app redeems it with no verifier: refused, PKCE code verifier not specified. Then the budgeting app, with the real verifier, is refused too: Code not valid, because a failed try burns the code. The leak is useless, and Ana signs in again. A new code with a verifier the thief made up is refused: PKCE verification failed. A new code with the real verifier gives tokens. A request with the plain method, or with no challenge at all, is refused with invalid_request.
"""
speech = """
Second demo: P K C E. [[slnc 400]] Only the challenge travels through the browser. [[slnc 600]]
A thief with a leaked code and no verifier is refused. [[slnc 300]] The failed try burns the code, so the real app is refused as well, and Ana signs in again. [[slnc 600]]
A wrong verifier is refused. [[slnc 300]] A plain challenge, or none at all, is refused at the authorization endpoint.
"""
rows = { pkce = "active ok" }
console = [
    ["RFC 7636 example: the published challenge", "ok"],
    ["leaked code, no verifier -> refused (PKCE code verifier not specified)", "ok"],
    ["then the real verifier -> refused (Code not valid): the code is burned", "amber"],
    ["plain method, or no challenge -> refused (invalid_request)", "ok"],
]

[[act]]
title = "Exact redirects, state, and codes that work once"
summary = "Only the registered redirect address gets a code, the state check stops Mallory's code, a reused code ends the session at Keycloak but not at a local check, and a code lives 5 seconds."
detail = """
The app registered exactly https://budget.example/callback. That address gets a code. The path trick, the lookalike host, the query, the upper-case host and the trailing slash are refused by Keycloak with an error page and no redirect. A prefix or wildcard match would have sent Ana's code to the others. Mallory's link carries her own code; the app checks the state against Ana's browser session and refuses it. A code is redeemed once and the access token works. The same code redeemed again is refused, and Keycloak's own check of the first access token now gives 401, a reused code ends the session. The API, which checks the signature and dates itself, still gives 200: a local check cannot know. A code redeemed after 6 seconds, in a realm that gives codes 5, is refused.
"""
speech = """
Third demo: exact redirects, state, and codes that work once. [[slnc 400]] Only the exact registered address gets a code. [[slnc 300]] A path trick, a lookalike host, a query, and a trailing slash are all refused. [[slnc 600]]
Mallory's link fails the state check. [[slnc 600]]
A code works once. [[slnc 300]] Use it twice, and Keycloak ends the session. [[slnc 300]] But an A P I that checks tokens itself cannot know. [[slnc 600]]
And a code expires after five seconds in this realm.
"""
rows = { redirects = "active ok" }
console = [
    ["https://budget.example/callback -> a code is sent there", "ok"],
    ["a path trick, a lookalike host, a query, upper case, a trailing slash -> refused", "ok"],
    ["the same code redeemed again -> refused; Keycloak's check of the first token -> 401", "ok"],
    ["the API's local check of that token -> 200", "amber"],
]

[[act]]
title = "Scopes and refresh tokens"
summary = "An accounts.read token cannot pay, an unregistered scope is refused, a refresh token is rotated, and using the old one again ends the session so the thief and the real app both lose."
detail = """
The token carries openid accounts.read. GET /accounts is 200, and POST /payments with the same token is 403 insufficient_scope. Asking for payments.write, which the app never registered, is refused with invalid_scope. The app refreshes the token and gets a new access token and a new refresh token. The old refresh token, copied by a thief and used again, is refused: the maximum allowed reuse was exceeded. The newest refresh token, held by the real app, is refused too, the session no longer has the client, and the newest access token fails Keycloak's own check with 401. One reuse ends the session, so the theft is contained. An access token 5 minutes and 31 seconds old is refused by the API.
"""
speech = """
Fourth demo: scopes and refresh tokens. [[slnc 400]] A token for reading accounts cannot make payments. [[slnc 600]]
Asking for a scope the app never registered is refused. [[slnc 600]]
A refresh token is rotated. [[slnc 300]] If the old one is used again, the session ends, so the thief and the real app both lose. [[slnc 600]]
And an access token that is five minutes old is refused.
"""
rows = { scopes = "active ok" }
console = [
    ["POST /payments with an accounts.read token -> 403 insufficient_scope", "ok"],
    ["payments.write requested -> refused (invalid_scope)", "ok"],
    ["the old refresh token used again -> refused; the session ends", "ok"],
    ["an access token 5 minutes 31 seconds old -> 401", "ok"],
]

[[act]]
title = "Current practice, and the bill"
summary = "The implicit flow and the password grant are off, a confidential client needs its secret and still needs PKCE, and the resource server holds no passwords and no session."
detail = """
The implicit flow, which put the access token in the address bar, is refused: the client is not allowed to initiate browser login with that response type. The password grant, which gives the app Ana's password, is refused: the client is not allowed direct access grants. Both are removed by OAuth 2.0 Security Best Current Practice, RFC 9700, and by OAuth 2.1. The statements service is a confidential client, so it also authenticates; with a wrong secret it is refused. With its secret and a code it does not have, it is refused. With its secret and a real code but no verifier, it is refused too: a secret does not replace PKCE. A public app on a phone cannot keep a secret, which is why PKCE protects its code.
"""
speech = """
Fifth demo: current practice. [[slnc 400]] The implicit flow is switched off. [[slnc 300]] So is the password grant. [[slnc 600]]
A confidential client needs its secret, and with a wrong secret it is refused. [[slnc 600]]
With the secret and a real code but no verifier, it is refused as well, a secret does not replace P K C E. [[slnc 600]]
A public app on a phone cannot keep a secret, which is why P K C E protects its code.
"""
rows = { practice = "active ok" }
console = [
    ["implicit flow (response_type=token) -> refused (unauthorized_client)", "ok"],
    ["password grant -> refused (Client not allowed for direct access grants)", "ok"],
    ["wrong client secret -> refused (unauthorized_client)", "ok"],
    ["secret and a code but no verifier -> refused (PKCE code verifier not specified)", "ok"],
]

