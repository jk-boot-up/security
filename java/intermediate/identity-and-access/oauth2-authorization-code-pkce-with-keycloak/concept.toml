[[scene]]
key = "01-poster"
kind = "poster"
title = "OAuth 2.0 Authorization Code with PKCE and Keycloak"
narration = "Hello, and welcome. [[slnc 400]] This video explains the O Auth two authorization code flow, with P K C E, against a real Keycloak, in Java. [[slnc 300]] O Auth stands for open authorization, and P K C E for proof key for code exchange. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] The authorization code flow lets an app act for a customer without ever seeing the customer's password. [[slnc 300]] Keycloak runs the flow, and what makes it safe is a handful of settings on each client: exact redirect addresses, P K C E required, old flows switched off, and short, rotated tokens. [[slnc 300]] The app still has to check the state itself. [[slnc 600]] Think of a valet key that only starts the car, works for one driver, and only for a short while. [[slnc 600]] Our example is an online bank."

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["A budgeting app wants to read", "Ana's accounts at the bank.", "", "The demo starts a real Keycloak in Docker", "and the bank's accounts API on Spring Boot,", "drives the flow as a browser would,", "then tries every mistake."]
narration = "Here is the scenario. [[slnc 400]] A budgeting app wants to read Ana's accounts at her bank. [[slnc 500]] The demo starts a real Keycloak in Docker, and the bank's accounts A P I on Spring Boot. [[slnc 300]] It drives the flow as a browser would, step by step. [[slnc 500]] Then it tries the mistakes: a leaked code, a wrong redirect address, a forged callback, a reused code, and a reused refresh token."

[[scene]]
key = "02-words"
kind = "bullets"
title = "The Words"
body = ["Keycloak: the bank's authorization server", "Realm: one set of users, clients and rules", "Client: an app registered in the realm", "Code: a short-lived ticket the browser carries", "Access token: a signed JWT the API checks", "Verifier and challenge: a secret and its hash"]
narration = """Before the demos, the words. [[slnc 500]] Keycloak is the bank's authorization server: it signs Ana in and issues tokens. [[slnc 500]] A realm is one set of users, clients and rules; here, the bank realm. [[slnc 500]] A client is an app registered in the realm, with its own settings. [[slnc 500]] The code is a short lived ticket that the browser carries back. [[slnc 500]] The access token is a signed J W T that the A P I checks itself. [[slnc 500]] And the verifier is a secret the app makes for each sign in; the challenge is its hash."""

[[scene]]
key = "02-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "02-pkce-idea"
kind = "figure"
title = "Two roads: the hash through the browser, the secret direct"
body = "pkce_idea"
narration = """Let's see the whole idea on one picture. [[slnc 400]] On the left, the app makes a secret for this one sign in: the verifier. [[slnc 300]] It hashes it with S H A two five six, and writes the result as letters. [[slnc 300]] That is the challenge. [[slnc 700]] On the right, the two roads. [[slnc 300]] The challenge travels through the browser in step one, where addresses end up in histories and logs. [[slnc 300]] That is fine: a hash cannot be turned back into the secret. [[slnc 600]] The verifier travels in step four, directly from the app to Keycloak. [[slnc 300]] Keycloak hashes it, and compares with the challenge it stored. [[slnc 700]] A thief who copies the code has no verifier. [[slnc 300]] Keycloak refuses the thief, and burns the code."""

[[scene]]
key = "03-acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "04-costs"
kind = "bullets"
title = "What It Costs"
body = ["Keycloak is one more service to run", "Every redirect address must be registered", "Reuse detection can sign a real customer out", "Short tokens mean more refreshing", "A local token check cannot see a revoked session"]
narration = "Nothing is free. [[slnc 400]] Here is what it costs. [[slnc 500]] Keycloak is one more service to run, patch, and back up. [[slnc 500]] Every redirect address must be registered exactly, one by one. [[slnc 500]] Reuse detection protects the customer, and can also sign a real customer out. [[slnc 500]] Short access tokens mean more refreshing. [[slnc 300]] And an A P I that checks tokens itself cannot see that Keycloak has ended a session, until the token expires."

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["A \"Sign in with your bank\" button", "A consent page listing what an app may do", "oauth2ResourceServer in Spring Security", "implicitFlowEnabled or", "  directAccessGrantsEnabled set to true"]
narration = "You have probably met this already. [[slnc 400]] A sign in with your bank button, that sends you to the bank's own page, is this flow. [[slnc 500]] So is a consent page that lists what an app may do for you. [[slnc 500]] An O Auth two resource server line, in a Spring Security configuration, is the A P I side of it. [[slnc 500]] And a Keycloak client with the implicit flow or direct access grants switched on is an old flow left open."

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Authorization code with S256 PKCE, always", "Exact redirect addresses", "No implicit flow, no password grant", "The app checks the state", "Rotate refresh tokens; short access tokens", "The API checks issuer, audience, dates, scope"]
narration = "So, how do you use it? [[slnc 400]] Use the authorization code flow with S two five six P K C E, for every client. [[slnc 500]] Register exact redirect addresses. [[slnc 300]] Switch off the implicit flow and the password grant. [[slnc 500]] Have the app check the state on every callback. [[slnc 500]] Rotate refresh tokens, and keep access tokens short. [[slnc 300]] And have the A P I check the issuer, the audience, the dates, and the scope of every token."

