narration = "So, how do you use it? [[slnc 400]] Use a backend for the frontend for a bank's web app, give the browser a __Host- cookie and an X S R F header, refresh on the server, and where a token must reach the browser, use DPoP and keep scripts off the page with a strict Content-Security-Policy."

