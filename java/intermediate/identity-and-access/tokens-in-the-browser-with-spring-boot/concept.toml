narration = "Here is the scenario. [[slnc 400]] An online bank has a single-page app that calls its accounts A P I. [[slnc 400]] The demo starts a real Keycloak, the real A P I and a real B F F, lets a third-party script on the page do what scripts do, and compares what each design leaves it."

