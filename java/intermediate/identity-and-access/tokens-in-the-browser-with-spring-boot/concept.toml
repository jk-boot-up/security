[readme]
intro = """
The plain [tokens-in-the-browser](../tokens-in-the-browser) project builds a BFF and DPoP from scratch. This one runs them with **Spring Boot 4.1**, **Spring Security 7.1** (whose resource server now checks DPoP proofs) and a real **Keycloak 26.8** in Docker, with three real parts on the loopback address: Keycloak, the bank's accounts API and the bank's backend for the frontend. It needs Docker; its tests are tagged `integration`: `./gradlew integrationTest`.

What it shows:
- **Tokens kept in the browser.** A single-page app keeps its tokens in `localStorage`. A third-party script takes **2 tokens**, the stolen access token reads the balance from elsewhere, it expires after five minutes, and the stolen **refresh token** gets a new access token from Keycloak.
- **A backend for the frontend.** Spring Security's `oauth2Login` and `OAuth2AuthorizedClientManager` keep the tokens in the server. The browser gets a `__Host-bff` cookie (`Path=/; Secure; HttpOnly; SameSite=Strict`) and an `XSRF-TOKEN` cookie. A script reading `document.cookie` takes **0 tokens**; while the page is open it can still ask the BFF for the balance. Six minutes later the BFF **refreshes the token on the server**.
- **Requests started by another site.** `SameSite=Strict` keeps the cookie off a link or hidden form from evil.example. An older browser that ignores it still needs the XSRF header (403), the preflight names no allowed origin, and the bank's own page sends the transfer with the header (201).
- **DPoP.** Keycloak issues a token bound to the app's key (`cnf.jkt`). The accounts API accepts it with a fresh proof and refuses it as a plain bearer token, with a proof from another key, **a proof used twice**, a proof for another request, an old proof, or a proof that does not hash the token. A stolen refresh token needs the key too.
- **The bill.** A second BFF server does not know the first one's sessions, every call has one more hop, clearing the browser's storage loses the key, and a script on the open page can still ask the key for a proof.

**Maps to:** OWASP Top 10 (2025) A07 Authentication Failures · OAuth 2.0 for Browser-Based Applications (BCP) · RFC 9449 (DPoP) · RFC 9700 · RFC 6750 · CWE-922 (insecure storage of sensitive information).
"""
analogy = """
A hotel safe against a note in your pocket. The BFF is the safe at the front desk: the key card in your pocket opens nothing by itself and is useless anywhere else. DPoP is a key card that only works with the ring on your finger.
"""
scenario = """
An online bank has a single-page app that calls its accounts API. The demo starts a real Keycloak, the real API and a real BFF, lets a third-party script on the page do what scripts do, and compares what each design leaves it.
"""
costs = [
    "**The BFF is another server to run,** scale, patch and keep alive, and every API call passes through it.",
    "**Its sessions need a shared store** as soon as there are two of them.",
    "**Cookies bring CSRF back:** SameSite, a header and a preflight are needed, and they are three more things to get right.",
    "**DPoP needs support at the authorization server and at every resource server,** and a key that survives only as long as the browser's storage.",
    "**Neither stops a script on the open page,** which can use the session or ask the key for a proof; only keeping scripts off the page does.",
]
too_much = """
A site with no third-party scripts, a strict content security policy and short-lived tokens may accept tokens in memory. A bank should use a BFF, and add DPoP where tokens must reach the browser.
"""
met_before = [
    "`localStorage.setItem(\"access_token\", ...)` in a tutorial.",
    "A cookie named `__Host-` something, `HttpOnly` and `SameSite=Strict`.",
    "`TokenRelay` or an API gateway that adds the access token to calls.",
    "`Authorization: DPoP ...` and a `DPoP:` header in a request log.",
]
where = """
This is the tools version of [tokens-in-the-browser](../tokens-in-the-browser), in the [identity-and-access](..) module. It follows the same five acts, on real servers, and ends with what the design still cannot do.
"""
twin = """
Keycloak is a real container bound to 127.0.0.1 on a free port, with the bank realm imported from infra/ and the BFF's port written into a temporary copy. The accounts API and the BFF are real Spring Boot applications. The browser is a few lines of Java that keep cookies with their HttpOnly and SameSite attributes. The proofs are signed with real keys. Ports, tokens and keys are never printed.
"""
test_note = "The tests that need Keycloak are tagged integration and share one container, one API and one BFF per class (./gradlew integrationTest). The realm file, proof and cookie tests need no Docker."

[[act]]
title = "Tokens kept in the browser"
summary = "A third-party script takes 2 tokens from localStorage, the stolen access token reads the balance until it expires, and the stolen refresh token gets a new one from Keycloak."
detail = """
The banking app signs Ana in and keeps its access token and refresh token in localStorage. The app reads her balance: 200. A third-party script on the page reads what scripts can read: 2 tokens taken. It sends them to its own server and Ana closes the page. From elsewhere, the stolen access token reads the balance: 200. Five minutes later the API refuses it as expired. The stolen refresh token gets a new access token from Keycloak, which reads the balance: one page visit, for as long as the session lives. Anything a script can read, a script can send away.
"""
speech = """
First demo: tokens kept in the browser. [[slnc 400]] The app keeps its access token and refresh token in local storage. [[slnc 600]]
A third party script on the page reads what scripts can read, and takes both. [[slnc 600]]
The stolen access token reads the balance from elsewhere, until it expires. [[slnc 600]]
The stolen refresh token gets a new access token from Keycloak. [[slnc 300]] One page visit, for as long as the session lives.
"""
rows = { stored = "active wrong" }
console = [
    ["a third-party script reads localStorage: 2 tokens taken", "bad"],
    ["the stolen access token reads the balance -> 200", "bad"],
    ["five minutes later -> 401 (expired)", "ok"],
    ["the stolen refresh token gets a new access token -> true", "bad"],
]

[[act]]
title = "A backend for the frontend keeps the tokens on the server"
summary = "The BFF signs Ana in on the server, the browser gets a __Host-bff cookie, the script takes 0 tokens, a script on the open page can still act as Ana, and the BFF refreshes the token itself."
detail = """
The BFF signs Ana in on the server; the browser gets a session cookie __Host-bff with Path=/, Secure, HttpOnly and SameSite=Strict, and an XSRF-TOKEN cookie its script copies into a header. The cookie keeps the __Host- rules, and the BFF holds 2 tokens, an access token and a refresh token, that the browser never sees. The app reads the balance through the BFF: 200. The same third-party script reads document.cookie: only the XSRF cookie, 0 tokens taken. While the page is open, the script can still ask the BFF for the balance: 200, a script on the page can still act as Ana. Once the page is closed, what it took works nowhere else: 401. Six minutes later Ana opens the app again and the BFF refreshes the token on the server: 200, with a new access token.
"""
speech = """
Second demo: a backend for the frontend. [[slnc 400]] The B F F signs Ana in on the server. [[slnc 300]] The browser gets one cookie, http only, same site strict. [[slnc 600]]
The same script reads the cookies it can read, and takes no tokens. [[slnc 600]]
While the page is open, it can still ask the B F F for the balance, so it can still act as Ana. [[slnc 600]]
Six minutes later, the B F F refreshes the token on the server.
"""
rows = { bff = "active ok" }
console = [
    ["cookie: __Host-bff; Path=/; Secure; HttpOnly; SameSite=Strict", "ok"],
    ["document.cookie: [XSRF-TOKEN]: 0 tokens taken", "ok"],
    ["the script on the open page asks the BFF -> 200", "amber"],
    ["six minutes later: the BFF refreshes the token -> 200", "ok"],
]

[[act]]
title = "Requests started by another site"
summary = "SameSite=Strict keeps the cookie off a link or form from evil.example, an older browser still needs the XSRF header, the preflight names no allowed origin, and the bank's own page transfers with the header."
detail = """
A link or a hidden form on evil.example reaches the BFF, and SameSite=Strict keeps the cookie off both: the link gets 401, the form's transfer 403 with no session and no CSRF token. In an older browser that ignores SameSite, the cookie goes but the bank's request header does not: 403. A script on evil.example tries to add the header itself: the browser asks first, and the BFF names no allowed origin, so the request is never sent. The bank's own page sends the transfer with the header: 201. One transfer was made, and only the one the bank's own page asked for.
"""
speech = """
Third demo: requests started by another site. [[slnc 400]] A link or a hidden form on another site reaches the B F F without the cookie. [[slnc 600]]
An older browser that ignores same site sends the cookie, but not the bank's request header, so the answer is four oh three. [[slnc 600]]
A script on the other site cannot add the header, because the preflight names no allowed origin. [[slnc 600]]
The bank's own page sends the transfer with the header, and one transfer is made.
"""
rows = { sites = "active ok" }
console = [
    ["link -> 401, hidden form -> 403 (the cookie is kept off)", "ok"],
    ["older browser: cookie sent, no header -> 403", "ok"],
    ["preflight: no allowed origin, so the request is never sent", "ok"],
    ["the bank's own page, with the header -> 201", "ok"],
]

[[act]]
title = "Tokens bound to a key, with DPoP"
summary = "Keycloak binds the token to the app's key, and Spring Security's resource server refuses it as a bearer token, with another key's proof, with a reused, old or mismatched proof; a stolen refresh token needs the key too."
detail = """
The app holds a key that scripts cannot read, and the token carries the key's thumbprint in cnf.jkt; the token type is DPoP. The app sends the token with a fresh proof signed by its key: 200. A script takes the token and sends it as a plain bearer token: 401 invalid_token. With a proof from a key of its own: 401. The app's own request copied and sent again: 401, the proof was already used. The app's proof for reading the balance, used for a transfer: 401. A proof made two minutes ago, with the token still valid: 401. A proof that does not hash the token: 401. The stolen refresh token with the thief's key is refused: the DPoP confirmation does not match the proof. With no key at all it is refused; presented by the app, with its own key, it gives new tokens.
"""
speech = """
Fourth demo: tokens bound to a key, with D Po P. [[slnc 400]] The token carries the thumbprint of the app's key. [[slnc 600]]
With a fresh proof signed by that key, the A P I answers two hundred. [[slnc 600]]
As a plain bearer token, it is refused. [[slnc 300]] With a proof from another key, refused. [[slnc 300]] A proof used twice, refused. [[slnc 600]]
A stolen refresh token needs the key too.
"""
rows = { dpop = "active ok" }
console = [
    ["the token carries the key's thumbprint (cnf.jkt), type DPoP", "ok"],
    ["token + fresh proof from the app's key -> 200", "ok"],
    ["as a bearer token / another key / copied / old proof -> 401", "ok"],
    ["the stolen refresh token with the thief's key -> refused", "ok"],
]

[[act]]
title = "The bill"
summary = "A second BFF does not know the first one's sessions, every call has one more hop, clearing storage loses the DPoP key, and a script on the open page can still ask the key for a proof."
detail = """
Two BFF servers, each with its own session store: the second one answers Ana's cookie with 401, so the sessions need a shared store. Every API call now passes through one more server, which must be run, scaled and kept up to date. Clearing the browser's storage loses the DPoP key; the old token with a new key gets 401, so Ana signs in again. A script on the open page can still ask the key for a proof and read the balance: 200. DPoP stops theft, not use while the page is open. So keep scripts off the page with a strict Content-Security-Policy, and keep tokens out of it with the BFF.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] Two B F F servers need a shared session store. [[slnc 600]]
Every call has one more hop to run and keep up to date. [[slnc 600]]
Clearing the browser's storage loses the D Po P key, and Ana signs in again. [[slnc 600]]
And a script on the open page can still ask the key for a proof. [[slnc 300]] So keep scripts off the page, and tokens out of it.
"""
rows = { bill = "active ok" }
console = [
    ["the second BFF answers Ana's cookie with 401", "amber"],
    ["the old token with a new key -> 401", "ok"],
    ["a script on the open page asks the key for a proof -> 200", "bad"],
    ["keep scripts off the page and tokens out of it", "ok"],
]

