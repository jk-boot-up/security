[[act]]
title = "The bill"
summary = "A second BFF with its own session store answers Ana's cookie with 401; every call takes one more hop; a cleared browser loses its DPoP key, and the new key's thumbprint does not match; and a script on the open page can still ask the key for a proof: 200."
detail = """
Two BFF servers, each with its own session store: Ana signs in on the first, her cookie reaches the second, which answers 401, so the sessions need a shared store. Every API call passes
through one more server, which must be run, scaled and kept up to date. Clearing the browser's storage loses the DPoP key: the token is bound to lq6Aws5FE-qf..., the new key's thumbprint is
Vr-SIKG4_2B7..., so the API answers 401 invalid_dpop_proof and Ana signs in again. And a script on the open page can still ask the key for a proof and read the balance: 200. DPoP stops theft,
not use while the page is open; keep scripts off the page with a strict Content-Security-Policy, and keep tokens out of it with the BFF.
"""
figure = "the_bill"
figure_title = "What the defences cost"
figure_speech = """
Fifth demo: the bill. [[slnc 400]] Four costs, each with the demo's own answer. [[slnc 600]]
Top left: two backend servers, each with its own session store. [[slnc 300]] Ana signs in on the first. [[slnc 300]] The second does not know her cookie. [[slnc 300]] So the sessions need a shared store. [[slnc 600]]
Top right: one more server, on every call. [[slnc 300]] Someone has to run it, scale it, and keep it up to date. [[slnc 600]]
Bottom left: the browser's storage is cleared, and the D Pop key is gone. [[slnc 300]] The token names the old key's thumbprint, and the new key has a different one. [[slnc 300]] So Ana signs in again. [[slnc 600]]
Bottom right: a script on the open page asks the key for a proof. [[slnc 300]] It works. [[slnc 300]] D Pop stops theft, not use while the page is open.
"""
speech = """
Here is the output. [[slnc 400]] The second server answers Ana's cookie with four oh one, so the sessions need a shared store. [[slnc 400]] And every call passes through one more server.
[[page]]
The storage cleared: the two thumbprints differ, so the old token is refused, and Ana signs in again. [[slnc 400]] A script on the open page still reads the balance. [[slnc 400]] So keep scripts off the page, and keep tokens out of it.
"""
rows = { bill = "active ok" }
