narration = "Nothing is free. [[slnc 400]] Here is what it costs. [[slnc 500]] The B F F is another server to run. [[slnc 500]] Its sessions need a shared store. [[slnc 500]] Cookies bring C S R F back. [[slnc 500]] DPoP needs support at the authorization server and at every resource server. [[slnc 500]] Neither stops a script on the open page."

