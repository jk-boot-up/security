[[scene]]
key = "01-poster"
kind = "poster"
title = "Tokens in the Browser with Spring Boot: a BFF and DPoP"
narration = "Hello, and welcome. [[slnc 400]] This video explains keeping tokens out of the browser, with a backend for the frontend and D Po P, on Spring Boot, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A web page that keeps tokens in local storage hands them to every script on the page. [[slnc 300]] A backend for the frontend, a B F F, keeps the tokens on the server, and gives the browser only a cookie that scripts cannot read. [[slnc 300]] And where a token must reach the browser, D Po P binds it to a key, so a copy alone is useless. [[slnc 600]] Think of leaving your house key with the concierge, instead of under the doormat. [[slnc 600]] Our example is an online bank."

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online bank's single-page app", "calls its accounts API.", "", "The demo starts a real Keycloak in Docker,", "the real accounts API and a real BFF,", "and lets a third-party script on the page", "do what scripts do."]
narration = "Here is the scenario. [[slnc 400]] An online bank has a single-page web app that calls its accounts A P I. [[slnc 500]] The demo starts a real Keycloak in Docker, the real accounts A P I, and a real backend for the frontend, all on Spring Boot. [[slnc 500]] It lets a third-party script on the page do what such scripts can do, and compares what each design leaves it."

[[scene]]
key = "02-words"
kind = "bullets"
title = "The Words"
body = ["localStorage: browser storage any script can read", "HttpOnly cookie: sent by the browser, unreadable by scripts", "BFF: a backend that holds the tokens", "DPoP: a token bound to a client key", "Proof: a signed note for one request"]
narration = """Before the demos, the words. [[slnc 500]] Local storage is browser storage that any script on the page can read. [[slnc 500]] An H T T P only cookie is sent by the browser, but scripts cannot read it. [[slnc 500]] A backend for the frontend is a server that holds the tokens for the page. [[slnc 500]] D Pop binds a token to a key held by the client. [[slnc 500]] And a proof is a small signed note, made for one request."""

[[scene]]
key = "02-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "02-what-scripts-read"
kind = "figure"
title = "What a script on the page can read"
body = "what_scripts_read"
narration = """Let's see the whole idea on one picture. [[slnc 400]] The same third party script runs on the bank's page, twice. [[slnc 700]] On the left, the app keeps the tokens Keycloak gave it in local storage. [[slnc 300]] Any script on the page can read local storage. [[slnc 300]] So the script takes both tokens, and sends them to its own server. [[slnc 700]] On the right, the tokens stay on the backend for the frontend. [[slnc 300]] Local storage is empty. [[slnc 300]] The session cookie is H T T P only, so document dot cookie shows only the X S R F token, which is no token at all. [[slnc 300]] The script takes nothing. [[slnc 700]] Anything a script on the page can read, it can send away. [[slnc 300]] So the safest token is one the page never holds."""

[[scene]]
key = "03-acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "04-costs"
kind = "bullets"
title = "What It Costs"
body = ["The BFF is another server to run", "Two BFFs need a shared session store", "Cookies bring request forgery back", "DPoP needs support at Keycloak and every API", "Neither stops a script on the open page"]
narration = "Nothing is free. [[slnc 400]] Here is what it costs. [[slnc 500]] The B F F is another server to run, and one more hop on every call. [[slnc 500]] Two B F F servers need a shared session store. [[slnc 500]] Cookies bring cross-site request forgery back, so the B F F needs its defences. [[slnc 500]] D Po P needs support at the sign-in server, and at every A P I. [[slnc 300]] And neither design stops a script that runs on the open page."

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Tokens in localStorage in the browser's tools", "A cookie named __Host- something", "An XSRF-TOKEN cookie and an X-XSRF-TOKEN header", "Authorization: DPoP and a DPoP header"]
narration = "You have probably met this already. [[slnc 400]] A token in local storage, seen in the browser's developer tools, is the first demo. [[slnc 500]] A cookie whose name starts with host and two underscores is locked to one site, with no domain. [[slnc 500]] An X S R F token cookie, sent back in a header, is Spring's defence against forged requests. [[slnc 500]] And an authorization header that says D Po P, with a D Po P proof beside it, is a token bound to a key."

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "How To Use It"
body = ["A BFF for a bank's web app", "A __Host- cookie: Secure, HttpOnly, SameSite", "An XSRF header for every change", "Refresh on the server", "DPoP where a token must reach the browser", "A strict Content-Security-Policy"]
narration = "So, how do you use it? [[slnc 400]] Use a backend for the frontend for a bank's web app. [[slnc 500]] Give the browser one host cookie: secure, http only, and same site strict. [[slnc 300]] Ask for the X S R F header on every request that changes something. [[slnc 500]] Refresh tokens on the server. [[slnc 500]] Where a token must reach the browser, bind it to a key with D Po P. [[slnc 300]] And keep untrusted scripts off the page, with a strict content security policy."

[[scene]]
key = "07-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Move the BFF's tokens to a", "shared store and run two BFF servers."]
narration = "That's tokens in the browser, with a backend for the frontend and D Po P. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] A page that holds tokens gives them to every script on it, so keep the tokens on a server, use cookies with the right attributes, and bind any token that must reach the browser to a key. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Move the B F F's tokens from memory to a shared store, and run two B F F servers behind one address. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] Keycloak runs in Docker; the accounts A P I and the backend for the frontend are real Spring Boot apps. [[slnc 300]] Here are the classes that matter."""

[[class]]
name = "Running"
what = "starts the BFF, with the session cookie's rules"
[[class.part]]
title = "the __Host-bff cookie"
code = """
"--server.servlet.session.cookie.name=__Host-bff",
"--server.servlet.session.cookie.path=/",
"--server.servlet.session.cookie.secure=true",
"--server.servlet.session.cookie.http-only=true",
"--server.servlet.session.cookie.same-site=strict");
"""
speech = """The session cookie's rules are five Spring Boot settings. [[slnc 300]] The host prefix, the root path, secure, H T T P only, and same site strict."""

[[class]]
name = "BffSecurity"
what = "the BFF signs Ana in, and checks the XSRF header"
[[class.part]]
title = "oauth2Login, and a CSRF token in a cookie"
code = """
.oauth2Login(o -> o.authorizationEndpoint(
        a -> a.authorizationRequestResolver(resolver)))
.csrf(c -> c.csrfTokenRepository(CookieCsrfTokenRepository.withHttpOnlyFalse())
        .csrfTokenRequestHandler(new CsrfTokenRequestAttributeHandler()))
"""
speech = """O Auth login signs Ana in on the server, with P K C E. [[slnc 300]] The C S R F token goes into a cookie the page may read. [[slnc 300]] A change must send it back in a header, which another site cannot do."""

[[class]]
name = "BffController"
what = "passes each call on, with the token added on the server"
[[class.part]]
title = "the token never leaves the server"
code = """
String accessToken = client.getAccessToken().getTokenValue();
...
        .headers(h -> h.setBearerAuth(accessToken));
"""
speech = """The authorized client manager gives the access token, refreshed when it has run out. [[slnc 300]] The server adds it to the call to the A P I. [[slnc 300]] The browser never sees it."""

[[class]]
name = "ApiSecurity"
what = "the accounts API: scopes, and DPoP switched on"
[[class.part]]
title = "one line for DPoP"
code = """
.requestMatchers(HttpMethod.GET, "/accounts").hasAuthority("SCOPE_accounts.read")
.requestMatchers(HttpMethod.POST, "/transfers").hasAuthority("SCOPE_payments.write")
...
.oauth2ResourceServer(o -> o
        .jwt(Customizer.withDefaults())
        .dPoP(Customizer.withDefaults()));
"""
speech = """Each address needs its scope. [[slnc 300]] And D Pop is one line in Spring Security seven. [[slnc 300]] A bound token then needs a fresh proof from its key."""

[[class]]
name = "DpopKey"
what = "the browser's key: its thumbprint, and the proofs it signs"
[[class.part]]
title = "the thumbprint, by hand"
code = '''
return "{\"crv\":\"" + key.getCurve().getName() + "\",\"kty\":\"EC\""
        + ",\"x\":\"" + key.getX() + "\",\"y\":\"" + key.getY() + "\"}";
...
byte[] hash = sha256(canonical().getBytes(StandardCharsets.UTF_8));
return Base64.getUrlEncoder().withoutPadding().encodeToString(hash);
'''
speech = """The thumbprint is the S H A two fifty six of a fixed text: four members, in alphabetical order, with no spaces. [[slnc 300]] A test shows it equals the library's own."""
[[class.part]]
title = "one proof for one request"
code = """
JWTClaimsSet.Builder claims = new JWTClaimsSet.Builder().jwtID(jti)
        .claim("htm", method).claim("htu", url).issueTime(Date.from(issuedAt));
if (accessToken != null) {
    byte[] hash = sha256(accessToken.getBytes(StandardCharsets.US_ASCII));
    claims.claim("ath", Base64.getUrlEncoder().withoutPadding().encodeToString(hash));
}
"""
speech = """Each proof carries a random id, the method, the address and the time. [[slnc 300]] And the hash of the access token, so it works only with that token."""

[[acronym]]
short = "SPA"
long = "Single-Page Application: one page that calls APIs from the browser"
say = "S P A is a single page application: one web page that calls A P Is from the browser."
[[acronym]]
short = "API"
long = "Application Programming Interface: here, the bank's accounts service"
say = "A P I is an application programming interface. Here, the bank's accounts service."
[[acronym]]
short = "OAuth, OAuth2"
long = "Open Authorization 2.0: the standard for handing out access tokens"
say = "O Auth is open authorization: the standard way to hand out access tokens."
[[acronym]]
short = "BFF"
long = "Backend For the Frontend: a server that holds the tokens for the page"
say = "B F F is a backend for the frontend: a server that holds the tokens for the page."
[[acronym]]
short = "DPoP"
long = "Demonstrating Proof of Possession (RFC 9449): a token bound to a key"
say = "D Pop is demonstrating proof of possession: a token that works only with a fresh proof from one key."
[[acronym]]
short = "JWT, JWK, JSON"
long = "JSON Web Token; JSON Web Key; JavaScript Object Notation"
say = "J W T is a J son web token, a signed token in three parts. J W K is a J son web key. J son is JavaScript object notation."
[[acronym]]
short = "SHA-256"
long = "Secure Hash Algorithm, 256 bits: 32 bytes from any text"
say = "S H A two fifty six is the secure hash algorithm: it turns any text into thirty two bytes."
[[acronym]]
short = "ES256, P-256, EC"
long = "ECDSA with SHA-256 on the P-256 elliptic curve (EC)"
say = "E S two fifty six is an elliptic curve signature with S H A two fifty six, on the curve called P two fifty six."
[[acronym]]
short = "ECDSA"
long = "Elliptic Curve Digital Signature Algorithm"
say = "E C D S A is the elliptic curve digital signature algorithm."
[[acronym]]
short = "base64url"
long = "bytes written with letters, digits, - and _, safe in a URL"
say = "Base sixty four U R L writes bytes with letters, digits, a dash and an underscore."
[[acronym]]
short = "iat, exp, sub, azp, jti"
long = "issued at, expires, subject, authorized party, token id"
say = "In a token, i a t is issued at, e x p is expires, s u b is the subject, a z p the client it was issued to, and j t i a unique id."
[[acronym]]
short = "cnf.jkt, htm, htu, ath"
long = "key thumbprint; a proof's method, URL, token hash"
say = "c n f dot j k t is the bound key's thumbprint. In a proof, h t m is the method, h t u the address, and a t h the hash of the access token."
[[acronym]]
short = "CSRF, XSRF"
long = "Cross-Site Request Forgery; XSRF-TOKEN is Spring's cookie against it"
say = "C S R F, also written X S R F, is cross site request forgery: another site making the browser send a request."
[[acronym]]
short = "PKCE"
long = "Proof Key for Code Exchange: a secret that ties the sign-in to the client"
say = "P K C E is proof key for code exchange."
[[acronym]]
short = "HTTP, HTTPS"
long = "Hypertext Transfer Protocol, and its encrypted form"
say = "H T T P is the hypertext transfer protocol. H T T P S is its encrypted form."
[[acronym]]
short = "URL, UUID"
long = "Uniform Resource Locator; Universally Unique Identifier"
say = "U R L is a uniform resource locator, a web address. U U I D is a universally unique identifier."
[[acronym]]
short = "CORS"
long = "Cross-Origin Resource Sharing: the browser asks first"
say = "Cors is cross origin resource sharing. The browser asks the server first, in a preflight, before some requests from another site."
[[acronym]]
short = "CSP"
long = "Content Security Policy: which scripts a page may run"
say = "C S P is a content security policy: the list of scripts a page may run."
[[acronym]]
short = "RFC"
long = "Request for Comments: an internet standard"
say = "R F C is request for comments: the name of an internet standard."
