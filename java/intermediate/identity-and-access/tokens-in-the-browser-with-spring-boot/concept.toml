[[act]]
title = "Tokens bound to a key, with DPoP"
summary = "The app's P-256 key, written in RFC 7638 order and hashed with SHA-256, gives the thumbprint Keycloak puts in cnf.jkt; Spring's resource server accepts the token only with a fresh proof from that key, and refuses the token alone, another key's proof, a replay, a proof for another request, an old proof and a proof without ath."
detail = """
The app's key is a P-256 key made from a fixed seed, so the thumbprint is the same on every run. Its public half written as crv, kty, x and y, with no spaces, is 126 characters; SHA-256 of that,
in base64url, is lq6Aws5FE-qf5LOaH8K26iRrqGPFaWQ0v8IwPTXG6UU, the same as Nimbus's computeThumbprint. Keycloak, asked by the client bank-spa-dpop with a proof, returns token type DPoP and puts
that value in cnf.jkt. Each request carries a proof: a JWT of type dpop+jwt, signed with ES256, with a random jti, htm, htu, iat and ath, the hash of the access token. With a fresh proof:
200. The token alone: 401 invalid_token. A proof from the thief's key, the app's request sent again, the proof for GET /accounts used for a transfer, a proof made 120 seconds ago and a proof
with no ath: 401 invalid_dpop_proof. At Keycloak the refresh token is refused with the thief's key and with no key, and gives new tokens with the app's key.
"""
figure = "thumbprint"
figure_title = "The key's thumbprint, and one proof"
figure_speech = """
Fourth demo: tokens bound to a key, with D Pop. [[slnc 400]] On the left, how the token names the key. [[slnc 300]] The app's public key is a point on the P two fifty six curve: two numbers, x and y. [[slnc 300]] It is written as a short J son text, with the members in alphabetical order and no spaces, so everyone gets the same text. [[slnc 600]]
That text goes through S H A two fifty six, which gives thirty two bytes. [[slnc 300]] In base sixty four U R L, forty three characters: the thumbprint. [[slnc 300]] Our hand-made value equals the library's. [[slnc 300]] And Keycloak writes the same value into the access token, as c n f dot j k t. [[slnc 700]]
