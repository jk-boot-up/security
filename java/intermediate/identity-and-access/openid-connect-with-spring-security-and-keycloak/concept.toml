[readme]
intro = """
The plain [openid-connect](../openid-connect) project builds the checks of an ID token from scratch. This one is the login most Spring Boot stores really run: **Spring Security 7** `oauth2Login()` against a real **Keycloak 26.8** in Docker, with two realms (the bank and a wallet). It needs Docker; its tests are tagged `integration`: `./gradlew integrationTest`.

What it shows:
- **Access is not identity.** The store sends Ana to the bank with scope `openid email`, a state, a nonce and a PKCE challenge, and Spring Security keeps them for her browser. The reply holds an ID token (typ `ID`, audience `store-web`) and an access token (typ `Bearer`, no audience). The access token offered as a sign-in is refused by Spring's decoder, and a request without the `openid` scope gets no ID token. A callback from another sign-in carried to Ana's browser is refused.
- **Checking the ID token.** With `OidcIdTokenDecoderFactory` and a local provider that signs claims Keycloak would never issue: a key the bank never published, an issuer with an extra slash, another issuer, another audience, two audiences with no `azp`, expiry (29 seconds past accepted, 31 refused, with a 30 second skew), no subject and `alg: none`.
- **Discovery and keys.** `ClientRegistrations.fromIssuerLocation` refuses a document that names another issuer, but **accepts one whose keys are on another site**; the issuer address must be trusted. When Keycloak adds a second signing key the store reloads the key set by itself.
- **Who signed in.** The wallet says its user `mal` has Ana's e-mail address, unverified. A store that keys accounts by e-mail gives **Mallory Ana's account**; keyed by issuer and subject it gives her a new one. Userinfo answers to the access token and not to the ID token.
- **Signing out.** RP-initiated logout sends the browser to Keycloak with `id_token_hint`. **Back-channel logout** from Keycloak ends the laptop's session and leaves the phone's. Spring Security posts to its own logout address to do it, and by default builds that from the request, so the store must be told its address. A made-up logout token and an ID token posted as one are both refused.

**Maps to:** OWASP Top 10 (2025) A07 Authentication Failures · OpenID Connect Core 1.0, OpenID Connect Discovery 1.0, RP-Initiated Logout 1.0, Back-Channel Logout 1.0 · RFC 9700 · CWE-287, CWE-639.
"""
analogy = """
A shop that lets customers show a library card as proof of who they are. The card says who issued it and carries a number; it does not matter what name is printed on it. A shop that files its customers by name will, one day, file two people under one name.
"""
scenario = """
An online store lets shoppers sign in with their bank login, and with a wallet login. The demo starts a real Keycloak with the two realms and the real store, signs Ana and Mallory in, and tries the tokens and logouts that go wrong.
"""
costs = [
    "**Every provider is a trust decision:** its issuer address, its keys, and what it claims about e-mail addresses.",
    "**A library does the checks only for the flows it knows,** so the store's own account lookup is where the mistakes are made.",
    "**Back-channel logout needs the store to be reachable by Keycloak,** and to know its own address.",
    "**Sessions on the provider and in the store must be kept in step,** or signing out at one leaves the other signed in.",
    "**Key rotation depends on the cache:** a retired key lives on until the store reloads the key set.",
]
too_much = """
A store with one provider that it also runs can use a session cookie of its own. Use OpenID Connect when customers already have a login elsewhere, or when several applications should share one sign-in and one sign-out.
"""
met_before = [
    "`spring.security.oauth2.client.registration` and `provider.*.issuer-uri` in an application.yml.",
    "A \"Sign in with\" button.",
    "`http.oauth2Login()` and `http.oidcLogout()` in a security configuration.",
    "An account table with an `email` column used as the key.",
]
where = """
This is the tools version of [openid-connect](../openid-connect), in the [identity-and-access](..) module. It follows the same five acts, on Spring Security and a real provider.
"""
twin = """
Keycloak is a real container bound to 127.0.0.1 on a free port; its realms are imported from infra/, with the store's port written into a temporary copy. The store is a real Spring Boot application on a loopback port. The browser is a few lines of Java that keep cookies per address. Keycloak reaches the store through host.docker.internal for back-channel logout. Ports, codes, tokens and session ids are never printed.
"""
test_note = "The tests that need Keycloak are tagged integration and share one container per class (./gradlew integrationTest). The realm file tests and the ID token checks against a local provider need no Docker."

[[act]]
title = "OAuth gives access; OpenID Connect adds who signed in"
summary = "The store sends Ana to the bank with openid scope, state, nonce and PKCE; the reply holds an ID token for the store and an access token for the API; an access token is refused as a sign-in."
detail = """
The store sends Ana to Keycloak with the scope openid email and a state, a nonce and a PKCE challenge kept for her browser. She signs in at Keycloak, never at the store, and the store redeems the code itself. The ID token's claims include acr, at_hash, aud, auth_time, azp, email, email_verified, exp, iat, iss, nonce, sid, sub and typ. Ana is signed in to the store as the bank realm and her subject, with her e-mail address, verified. The nonce in her ID token is the one the store sent. The reply holds two tokens: an ID token for the store, typ ID, audience store-web, and an access token for the bank's API, typ Bearer, with no audience claim. The access token handed to the store as proof of sign-in is refused by Spring's decoder: its audience is missing. A sign-in without the openid scope gets no ID token. A callback from another sign-in, carried to Ana's browser, is refused.
"""
speech = """
First demo: O Auth gives access, Open I D Connect adds who signed in. [[slnc 400]] The store sends Ana to the bank with the openid scope, a state, a nonce, and a P K C E challenge. [[slnc 600]]
She signs in at Keycloak, never at the store. [[slnc 300]] The store redeems the code itself, and checks the I D token. [[slnc 600]]
The access token is for the bank's A P I. [[slnc 300]] Offered as a sign in, it is refused. [[slnc 600]]
And a callback from another sign in is refused too.
"""
rows = { signin = "active ok" }
console = [
    ["state, nonce and a PKCE challenge kept for her browser", "ok"],
    ["the ID token: typ ID, audience store-web", "ok"],
    ["the access token as a sign-in -> refused (aud=null)", "ok"],
    ["a callback from another sign-in -> refused", "ok"],
]

[[act]]
title = "Checking the ID token"
summary = "Spring Security's decoder refuses a key never published, an issuer with an extra slash, another issuer or audience, a missing azp, an expired token, no subject and alg none."
detail = """
Against a local provider that signs claims Keycloak would never issue: the bank's own ID token is accepted. The same claims signed with a key the bank never published, under the bank's key id: refused, invalid signature. Issuer https://bank.example/ with one extra slash, and issuer https://wallet.example signed by the bank: refused. Audience budget-app: refused. Audiences store-web and budget-app with no azp: refused; with azp store-web: accepted. 29 seconds past its expiry, inside the 30 second skew: accepted; 31 seconds past: refused as expired. No subject: refused. A header saying alg none: refused. The nonce is checked by the sign-in itself, against the one kept in the browser's session.
"""
speech = """
Second demo: checking the I D token. [[slnc 400]] A key the bank never published is refused. [[slnc 600]]
An issuer with one extra slash is refused, and so is another issuer, or another audience. [[slnc 600]]
Two audiences need an authorized party that names this client. [[slnc 600]]
Twenty nine seconds past expiry is accepted, thirty one is refused. [[slnc 300]] And a token with alg none is refused.
"""
rows = { check = "active ok" }
console = [
    ["a key the bank never published -> refused (Invalid signature)", "ok"],
    ["issuer with an extra slash -> refused (iss)", "ok"],
    ["two audiences, no azp -> refused; with azp -> accepted", "ok"],
    ["29 seconds past expiry -> accepted; 31 -> refused", "ok"],
]

[[act]]
title = "Discovery and keys"
summary = "The store is configured with one issuer; discovery refuses a document that names another issuer but not one whose keys are elsewhere; a second signing key is picked up by itself."
detail = """
The store is configured with one value, the issuer. It reads the discovery document, which names the issuer it asked for, and the authorization, token and key addresses all start with the issuer's own address. A document at that address naming the issuer https://wallet.example is refused: one provider cannot pose as another. A document whose keys are on https://keys.example is accepted by Spring Security, which checks the issuer and not where the keys are, so the issuer address must be https and trusted. Keycloak publishes 1 signing key. The bank adds a second key and signs new tokens with it; it now publishes 2, and the store, which has not seen the new key id, reloads the key set on its own: tokens signed with the old key and with the new key are both accepted.
"""
speech = """
Third demo: discovery and keys. [[slnc 400]] The store is configured with one value, the issuer. [[slnc 600]]
A discovery document that names another issuer is refused. [[slnc 600]]
A document whose keys are on another site is accepted, because Spring Security checks the issuer and not where the keys are. [[slnc 600]]
When the bank adds a second key, the store reloads the key set by itself.
"""
rows = { keys = "active ok" }
console = [
    ["a document naming another issuer -> refused", "ok"],
    ["a document with keys on another site -> accepted", "amber"],
    ["Keycloak adds a second signing key: 2 published", "ok"],
    ["old and new tokens are accepted after the reload", "ok"],
]

[[act]]
title = "Who signed in: issuer and subject, never the email"
summary = "A wallet user with Ana's unverified e-mail address takes over her account in a store that keys accounts by e-mail; keyed by issuer and subject Mallory gets a new account."
detail = """
The bank says Ana's subject has the e-mail address ana@mail.example, verified. The wallet says its user also has the e-mail address ana@mail.example, not verified. A store that keys accounts by e-mail address gives Mallory, who signed in with the wallet, the account of Ana: account takeover. Keyed by issuer and subject, Ana gets the account of Ana and Mallory gets a new account for wallet and her own subject. Userinfo with Ana's access token answers 200 with the same subject as the ID token. Userinfo with the ID token instead is refused with 401.
"""
speech = """
Fourth demo: who signed in. [[slnc 400]] The wallet says its user has Ana's e-mail address, not verified. [[slnc 600]]
A store that keys its accounts by e-mail gives Mallory the account of Ana. [[slnc 300]] That is account takeover. [[slnc 600]]
Keyed by issuer and subject, Mallory gets a new account. [[slnc 600]]
Userinfo answers to the access token, and not to the I D token.
"""
rows = { who = "active wrong" }
console = [
    ["the wallet: mal has ana@mail.example, verified: false", "amber"],
    ["keyed by e-mail: Mallory gets the account of Ana", "bad"],
    ["keyed by issuer and subject: Mallory gets a new account", "ok"],
    ["userinfo with the ID token -> refused (401)", "ok"],
]

[[act]]
title = "Signing out, and the bill"
summary = "Sign-out at the store reaches Keycloak with id_token_hint; Keycloak's back-channel logout ends the laptop's session and leaves the phone's; a made-up logout token and an ID token are refused."
detail = """
Ana signs out at the store: the store's session ended. Her browser is sent to Keycloak's logout endpoint with id_token_hint and post_logout_redirect_uri, Keycloak ends its session and sends the browser back to the store, and signing in again asks for her password. Ana is signed in on a laptop and a phone, two Keycloak sessions. Keycloak ends the laptop's session through the admin API and sends the store a back-channel logout token: the laptop is signed out and the phone stays signed in. A made-up logout token is refused with 400, and an ID token sent as a logout token is refused too, with a 500 from this version of Spring Security, and the phone stays signed in. Back-channel logout makes the store post to its own logout address, which by default is built from the request and so names host.docker.internal; the store is told its own address.
"""
speech = """
Fifth demo: signing out. [[slnc 400]] Ana signs out at the store, and her browser is sent to Keycloak, which ends its session. [[slnc 600]]
Ana is signed in on a laptop and a phone. [[slnc 300]] Keycloak ends the laptop's session, and sends the store a back channel logout token. [[slnc 600]]
The laptop is signed out. [[slnc 300]] The phone stays signed in. [[slnc 600]]
A made up logout token, or an I D token sent as one, ends nothing.
"""
rows = { out = "active ok" }
console = [
    ["sign-out at the store: id_token_hint sent to Keycloak", "ok"],
    ["Keycloak ends the laptop's session -> the laptop signed out", "ok"],
    ["the phone stays signed in", "ok"],
    ["a made-up logout token -> refused (400)", "ok"],
]

