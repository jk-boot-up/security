[[act]]
title = "Checking the ID token"
summary = "A test provider signs an ID token with RS256 (a 42-character header part, a 132-character claims part, a 256-byte signature); Spring Security checks the signature, the time with 30 seconds of skew, then iss, sub, aud and azp; one thing changed at a time is refused, except azp store-web and 29 seconds past expiry."
detail = """
The store's settings: issuer https://bank.example, client_id store-web, the provider's key lab-key, 30 seconds of clock skew. Before signing: the
header {"kid":"lab-key","alg":"RS256"} and the claims aud, exp, iat, iss, sub, with exp = iat + 300 seconds. The header part is base64url(header),
42 characters; the claims part 132 characters; the signing input is the two joined by a dot; the signature is RSA over the SHA-256 of that input,
which with a 2048-bit key is 256 bytes, 342 base64url characters. Spring Security checks the signature with the published key named by kid, then exp
and iat with 30 seconds of skew, then iss exactly, sub, aud and azp: accepted. One thing changed at a time: a key never published (Invalid
signature), iss with an extra slash, another iss, aud budget-app, two audiences without azp, no sub, and alg none are refused; two audiences with azp
store-web are accepted. 29 seconds past exp is accepted, 31 seconds past is refused as expired. The nonce is checked by the sign-in itself, with the
state, as act one showed.
"""
figure = "decoder_checks"
figure_title = "What the store checks every ID token against"
figure_speech = """
Second demo: checking the I D token. [[slnc 400]] Keycloak only issues good tokens, so a small test provider signs bad ones. [[slnc 600]]
Top left, the store's settings: the issuer, the client, the provider's key, and thirty seconds of clock skew. [[slnc 600]]
Below, how a token is signed. [[slnc 300]] The header becomes the header part, in base sixty four U R L. [[slnc 300]] The claims become the claims part. [[slnc 300]] The two are joined with a dot. [[slnc 300]] And the private key signs the S H A two five six of those bytes, with R S A. [[slnc 300]] A two thousand and forty eight bit key gives a two hundred and fifty six byte signature. [[slnc 700]]
On the right, what Spring Security checks, in order. [[slnc 300]] The signature, with the published key. [[slnc 300]] The time. [[slnc 300]] Then the claims. [[slnc 300]] And below, the changes it refuses.
"""
