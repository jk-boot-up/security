One thing changed at a time. [[slnc 300]] A key never published: invalid signature. [[slnc 300]] An extra slash in the issuer, or another issuer: refused. [[slnc 300]] Another audience: refused. [[slnc 300]] Two audiences without an authorized party: refused; with it: accepted.
