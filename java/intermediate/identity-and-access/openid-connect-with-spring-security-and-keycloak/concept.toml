[[act]]
title = "Discovery and keys"
summary = "From one issuer-uri Spring Security reads Keycloak's metadata and checks that it names that issuer; forged metadata naming another issuer is refused, but keys on another site are accepted, so the issuer address must be https and trusted; Keycloak adds a key and the store fetches it on its own."
detail = """
The store is configured with one value, issuer-uri <keycloak>/realms/bank. It reads <keycloak>/realms/bank/.well-known/openid-configuration, which
names the issuer, the authorization, token, jwks_uri and end-session addresses, all under the issuer. Spring Security checks that the issuer equals the
configured one, and the addresses start with the issuer's own address. A test provider serves forged metadata: one naming https://wallet.example is
refused; one whose jwks_uri is https://keys.example/jwks.json is accepted, because Spring Security checks the issuer, not where the keys are, so the
issuer address must be https and trusted. Key rotation on the real Keycloak: it publishes 1 signing key; the bank adds a second and signs new tokens
with it, so 2 keys are published and the new token's kid is new; the store reloads the key set on its own, and tokens signed with either key are
accepted.
"""
figure = "discovery_rotation"
figure_title = "From one issuer to the metadata, and a key rotation"
figure_speech = """
Third demo: discovery and keys. [[slnc 400]] Top left, the configuration: one value, the issuer U R I of the bank realm. [[slnc 600]]
From it, Spring Security reads the metadata at the well known address. [[slnc 300]] The document names the issuer again, and that must match. [[slnc 300]] It names the authorize, token, key set and logout addresses, all under the issuer. [[slnc 700]]
On the right, key rotation, on the real Keycloak. [[slnc 300]] At first, one signing key. [[slnc 300]] The bank adds a second, and signs new tokens with it. [[slnc 300]] A new token names a key id the store has never seen. [[slnc 300]] So the store fetches the key set again, on its own. [[slnc 300]] Old and new tokens are both accepted.
"""
