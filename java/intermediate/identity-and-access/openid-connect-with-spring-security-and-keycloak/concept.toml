title = "OpenID Connect with Spring Security and Keycloak"
short_title = "OIDC with Spring Security"
package = "oidcspring"
main_class = "OidcSpringDemo"
tagline = "Spring Security checks the ID token and keeps the state and nonce; what it leaves to the store is who the customer is, and how sign-out reaches every session"
bold = "OpenID Connect login in Spring Security 7 against Keycloak gives the store a checked ID token, a state, a nonce and PKCE kept in the shopper's session, discovery that insists on the right issuer, and back-channel logout; the store still has to key its customers by issuer and subject and never by e-mail address, to keep the ID token away from APIs, and to tell the library its own logout address."
domain = "an online store"
domain_note = ""
youtube_description = "OpenID Connect login with Spring Security 7 and a real Keycloak 26 in Docker: the authorization request with state, nonce and PKCE, the ID token against the access token, what Spring's validator refuses (a key never published, a wrong issuer, a wrong audience, azp, expiry with skew, no subject, alg none), discovery that checks the issuer and not where the keys are, key rotation, an account takeover by e-mail address through a second provider, userinfo, RP-initiated logout, and real back-channel logout from Keycloak that ends one of Ana's two sessions."
thumb_lines = ["OPENID CONNECT", "WITH SPRING SECURITY"]
thumb_code = "oauth2Login().oidcLogout()"
youtube_title = "OpenID Connect with Spring Security and Keycloak: ID Token Checks, Account Takeover, Back-Channel Logout"
