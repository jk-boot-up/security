Here is the output. [[slnc 400]] The configuration, the request, and the response: the issuer and four addresses, each starting with the issuer.
[[page]]
Both checks hold. [[slnc 400]] Then forged metadata, from a test provider. [[slnc 300]] Another issuer: refused. [[slnc 300]] Keys on another site: accepted. [[slnc 300]] Spring Security checks the issuer, not where the keys are. [[slnc 300]] So the issuer address must be H T T P S, and trusted.
[[page]]
Key rotation, step by step. [[slnc 300]] One key at first. [[slnc 300]] Then two, and the new token's key id is new. [[slnc 300]] The store fetches the key set again on its own, and both tokens are accepted.
"""
