[[scene]]
key = "01-poster"
kind = "poster"
title = "OpenID Connect with Spring Security and Keycloak"
narration = "Hello, and welcome. [[slnc 400]] This video explains Open I D Connect sign in, with Spring Security and Keycloak, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] O Auth gives an app access. [[slnc 300]] Open I D Connect adds an I D token, a signed note that says who signed in. [[slnc 300]] Spring Security checks that token, and keeps the state, the nonce and P K C E for the shopper. [[slnc 300]] What it leaves to the store is who the customer is, and how signing out reaches every session. [[slnc 600]] Think of a passport. [[slnc 300]] The border checks the stamp, but it must look up the passport number, not the name, to know who you are. [[slnc 600]] Our example is an online store."

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online store lets shoppers sign in", "with their bank login, or a wallet login.", "", "The demo starts a real Keycloak in Docker", "with the two sign-in providers,", "and the real store on Spring Boot.", "Ana and Mallory sign in; then tokens", "and sign-outs go wrong."]
narration = "Here is the scenario. [[slnc 400]] An online store lets shoppers sign in with their bank login, or with a wallet login. [[slnc 500]] The demo starts a real Keycloak in Docker, with those two sign-in providers, and the real store on Spring Boot. [[slnc 500]] Ana and Mallory sign in. [[slnc 300]] Then the demo tries the forged tokens, the shared e-mail address, and the sign-outs that go wrong."

[[scene]]
key = "02-words"
kind = "bullets"
title = "The Words"
body = ["Relying party: the store, which trusts the sign-in", "ID token: who signed in, for this store", "Issuer and subject: who the customer is", "State and nonce: tie a reply to one sign-in", "Realm: one provider inside Keycloak"]
narration = """Before the demos, the words. [[slnc 500]] The relying party is the app that trusts the sign-in: here, the store. [[slnc 500]] The I D token says who signed in, for this store. [[slnc 500]] The issuer and the subject, together, are who the customer is. [[slnc 500]] The state and the nonce tie a reply to one sign-in, in one browser. [[slnc 500]] And a realm is one provider inside Keycloak: here, the bank and the wallet."""

[[scene]]
key = "02-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "02-two-tokens"
kind = "figure"
title = "One sign-in, two tokens"
body = "two_tokens"
narration = """Let's see the whole idea on one picture. [[slnc 400]] One sign-in at Keycloak gives the store two tokens. [[slnc 600]] On the left, the I D token. [[slnc 300]] Its type is I D, and its audience is the store. [[slnc 300]] It names the issuer, the bank realm, and the subject, Ana's id at the bank. [[slnc 300]] And it carries the nonce from this sign-in. [[slnc 300]] It answers one question: who signed in. [[slnc 700]] On the right, the access token. [[slnc 300]] Its type is bearer, and it is meant for the bank's A P I. [[slnc 300]] It says what the store may do, not who is at the browser. [[slnc 700]] So when the access token is offered to the store as a sign-in, Spring Security refuses it. [[slnc 300]] Access is not identity."""

[[scene]]
key = "03-acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "04-costs"
kind = "bullets"
title = "What It Costs"
body = ["Every provider is a trust decision", "The library checks only the flows it knows", "Back-channel logout: Keycloak must reach the store", "Two sessions to keep in step", "Key rotation waits on the key cache"]
narration = "Nothing is free. [[slnc 400]] Here is what it costs. [[slnc 500]] Every provider you accept is a trust decision, because it decides who your customers are. [[slnc 500]] The library checks only the flows it knows about. [[slnc 500]] Back-channel logout needs Keycloak to be able to reach the store. [[slnc 500]] The session at the provider and the session in the store must be kept in step. [[slnc 300]] And key rotation waits on the store's cache of keys."

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Sign in with your bank, or with Google", "An e-mail column as the unique key for accounts", "A sid claim in an ID token", "A sign-out that clears only the store's cookie"]
narration = "You have probably met this already. [[slnc 400]] A sign in with your bank, or with Google, button is Open I D Connect. [[slnc 500]] An e-mail column used as the unique key for accounts is the takeover from the fourth demo. [[slnc 500]] A sid claim in an I D token names the provider's session, which back-channel logout uses. [[slnc 500]] And a sign-out that clears only the store's own cookie leaves the provider's session alive."

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "How To Use It"
body = ["A tested library; a trusted issuer over HTTPS", "Key customers by issuer and subject", "E-mail is an attribute, not an identity", "ID token for the store; access token for APIs", "Sign-out at the store and at the provider", "Back-channel logout for every other session"]
narration = "So, how do you use it? [[slnc 400]] Use a well tested library, and the issuer address of a provider you trust, over H T T P S. [[slnc 500]] Key customers by issuer and subject. [[slnc 300]] Treat the e-mail address as an attribute, never as the identity. [[slnc 500]] Keep the I D token in the store, and send only access tokens to A P I's. [[slnc 500]] Sign out at the store and at the provider. [[slnc 300]] And use back-channel logout, so a sign-out reaches every other session."

[[scene]]
key = "07-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a third provider and decide", "what happens when two claim one e-mail address."]
narration = "That's Open I D Connect with Spring Security and Keycloak. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Open I D Connect tells the store who signed in, as an issuer and a subject, in a token the library checks, and everything after that, the account, the session and the sign-out, is the store's own work. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a third provider, and decide what the store does when two providers claim the same verified e-mail address. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] Spring Security does the protocol; the store's own classes are small. [[slnc 300]] Here are the ones that matter."""

[[class]]
name = "StoreSecurity"
what = "sign-in and sign-out"
[[class.part]]
title = "sign-in with PKCE, sign-out at both ends"
code = """
logout.setPostLogoutRedirectUri("{baseUrl}/");
...
.oauth2Login(o -> o.authorizationEndpoint(a -> a.authorizationRequestResolver(resolver)))
.logout(l -> l.logoutSuccessHandler(logout))
"""
speech = """One filter chain does the protocol. [[slnc 300]] O Auth two login sends the shopper to Keycloak with a state, a nonce and P K C E, and checks the I D token that comes back. [[slnc 300]] Logout ends the store's session, then sends the browser to Keycloak to end its session too."""

[[class]]
name = "StoreController"
what = "who is signed in, as the store sees it"
[[class.part]]
title = "issuer and subject from the checked ID token"
code = """
Map<String, Object> me(@AuthenticationPrincipal OidcUser user) {
...
me.put("issuer", user.getIssuer().toString());
me.put("subject", user.getSubject());
"""
speech = """After sign-in, Spring Security hands the store an O I D C user, built from the checked I D token. [[slnc 300]] The store reads the issuer and the subject from it: together, they are the customer."""

[[class]]
name = "StoreAccounts"
what = "the store's customers, keyed two ways"
[[class.part]]
title = "by e-mail address, and by issuer and subject"
code = """
synchronized String byEmail(String email) {
    return byEmail.computeIfAbsent(email, e -> "new account for " + e);
...
