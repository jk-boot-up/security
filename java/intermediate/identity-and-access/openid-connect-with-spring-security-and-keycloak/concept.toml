key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["An email column used as a unique key for accounts", "A sid claim in an ID token", "A logout that only clears the store's own cookie"]
narration = "You have probably met this already. [[slnc 400]] An email column used as a unique key for accounts. [[slnc 500]] A sid claim in an I D token. [[slnc 500]] A logout that only clears the store's own cookie."

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Explain the difference between an ID token and an", "access token", "Name what Spring Security checks in an ID token and", "what the store must still do", "Key customers by issuer and subject", "Configure back-channel logout and say why the store", "needs its own address"]
narration = "So, how do you use it? [[slnc 400]] Use a certified library and the discovery address of a provider you trust over https, key customers by issuer and subject, treat e-mail as an attribute, keep the I D token away from A P I, and make sign-out reach the store, the provider and every other application."

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Try the first exercise", "in docs/session.md."]
narration = "That's O I D C with Spring Security. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] OpenID Connect tells the store who signed in as an issuer and a subject, in a token the library checks, and everything after that, the account, the session and the logout, is the store's own work. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a third provider and decide what the store does when two providers claim the same verified e-mail address. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"
