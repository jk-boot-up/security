[[scene]]
key = "01-poster"
kind = "poster"
title = "OpenID Connect with Spring Security and Keycloak"
narration = "Hello, and welcome. [[slnc 400]] This video explains O I D C with Spring Security, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] OpenID Connect login in Spring Security 7 against Keycloak gives the store a checked I D token, a state, a nonce and P K C E kept in the shopper's session, discovery that insists on the right issuer, and back-channel logout; the store still has to key its customers by issuer and subject and never by e-mail address, to keep the I D token away from A P I, and to tell the library its own logout address. [[slnc 600]] Think of it this way. [[slnc 300]] A shop that lets customers show a library card as proof of who they are. The card says who issued it and carries a number; it does not matter what name is printed on it. A shop that files its customers by name will, one day, file two people under one name. [[slnc 700]] In this video, the domain is an online store. [[slnc 500]] By the end, you will be able to: [[slnc 300]] Explain the difference between an I D token and an access token. [[slnc 300]] Name what Spring Security checks in an I D token and what the store must still do. [[slnc 300]] Key customers by issuer and subject."

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online store lets shoppers sign in with", "their bank login, and with a wallet login.", "The demo starts a real Keycloak with the two", "realms and the real store, signs Ana and", "Mallory in, and tries the tokens and logouts", "that go wrong."]
narration = "Here is the scenario. [[slnc 400]] An online store lets shoppers sign in with their bank login, and with a wallet login. [[slnc 400]] The demo starts a real Keycloak with the two realms and the real store, signs Ana and Mallory in, and tries the tokens and logouts that go wrong."

[[scene]]
key = "03-acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "04-costs"
kind = "bullets"
title = "What It Costs"
body = ["Every provider is a trust decision", "A library does the checks only for the flows it knows", "Back-channel logout needs the store to be reachable by", "Keycloak", "Sessions on the provider and in the store must be kept", "in step", "Key rotation depends on the cache"]
narration = "Nothing is free. [[slnc 400]] Here is what it costs. [[slnc 500]] Every provider is a trust decision. [[slnc 500]] A library does the checks only for the flows it knows. [[slnc 500]] Back-channel logout needs the store to be reachable by Keycloak. [[slnc 500]] Sessions on the provider and in the store must be kept in step. [[slnc 500]] Key rotation depends on the cache."

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["The provider: KeycloakLab, infra/-realm.json", "The store: StoreSecurity, StoreController,", "StoreAccounts", "The browser: Shopper", "The tokens: Tokens, LocalProvider", "Entry point: OidcSpringDemo"]
narration = "Here is who does what in the code. [[slnc 400]] The provider is in KeycloakLab and infra/-realm.json. [[slnc 500]] The store is in StoreSecurity and StoreController and StoreAccounts. [[slnc 500]] The browser is in Shopper. [[slnc 500]] The tokens is in Tokens and LocalProvider. [[slnc 500]] Entry point is in OidcSpringDemo."

