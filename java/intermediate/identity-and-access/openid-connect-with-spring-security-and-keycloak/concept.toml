[[act]]
title = "Signing out, and the bill"
summary = "Ana's sign-out ends the store's session and sends her browser to Keycloak's logout with id_token_hint and post_logout_redirect_uri; Keycloak ends the laptop's session and posts a logout token, which ends only the laptop's store session; a made-up token and an ID token are refused."
detail = """
Ana signs out at the store with a CSRF-protected POST: the store's session ends, and her browser is sent to
<keycloak>/realms/bank/protocol/openid-connect/logout with id_token_hint and post_logout_redirect_uri. Keycloak ends its session and sends her back;
signing in again asks for her password. Then Ana is signed in on a laptop and a phone, with two Keycloak sessions and two sids. Keycloak ends the
laptop's session (its admin API answers 204) and posts a logout token with that sid to the store's /logout/connect/back-channel/bank: the laptop is
signed out and the phone is not. A made-up logout token is refused with 400 and an ID token sent as a logout token with 500; the phone stays signed
in. The bill: use a certified library, keep the ID token in the store, and make sign-out reach every party.
"""
figure = "logout_paths"
figure_title = "Two ways out: through the browser, and server to server"
figure_speech = """
Fifth demo: signing out. [[slnc 400]] On the left, R P initiated logout, through the browser. [[slnc 300]] Ana signs out at the store, and the store's session ends. [[slnc 300]] Her browser is sent to Keycloak's logout address, with her I D token as a hint, and the address to come back to. [[slnc 300]] Keycloak ends its own session, and sends her back. [[slnc 300]] Signing in again asks for her password. [[slnc 700]]
On the right, back-channel logout, server to server. [[slnc 300]] Ana is signed in on a laptop and a phone. [[slnc 300]] Keycloak ends the laptop's session, and posts a logout token with that session id straight to the store. [[slnc 300]] The laptop is signed out. [[slnc 300]] The phone stays signed in.
"""
speech = """
Here is the output. [[slnc 400]] The store's session ended. [[slnc 300]] The browser goes to Keycloak's logout address, with both parameters. [[slnc 300]] Keycloak's session ends too, and the next sign-in asks for her password.
[[page]]
Two devices, two sessions. [[slnc 300]] Keycloak ends the laptop's, and posts a logout token to the store's back-channel address. [[slnc 300]] After it: the laptop is signed out, the phone is not.
[[page]]
Broken logout tokens. [[slnc 300]] A made-up one: refused. [[slnc 300]] An I D token in its place: refused. [[slnc 300]] The phone stays signed in both times. [[slnc 500]] And the bill. [[slnc 300]] Use a certified library. [[slnc 300]] Keep the I D token in the store. [[slnc 300]] And make sign out reach every application.
"""
rows = { out = "active amber" }
