subtitle = "An online bank, a phone, and a key that never leaves it."
boxes = [
    ["register", "Registering", "a public key and a counter"],
    ["signin", "Signing in", "a challenge, signed once"],
    ["lookalike", "A look-alike", "origin and relying party id"],
    ["counters", "Counters", "verification and clones"],
    ["bill", "The bill", "lost devices, passwords"],
]

[docs.problem]
scenario = """
An online bank wants customers to sign in with something that cannot be phished, and has to decide what the library leaves to the bank.
"""
naive = """
Add the passkey dependency and the configuration line, and assume that every check a bank would want is on.
"""
deliver = [
    "Spring Security's WebAuthn endpoints in a real bank.",
    "An authenticator in software that builds real CBOR, COSE keys and signatures.",
    "The defaults, and a wrapper that requires user verification and detects clones.",
    "Lost devices and the end of the password.",
]

[docs.prerequisites]
required = [
    "Java basics",
    "The plain passkeys project, for the protocol",
]
not_required = [
    "A phone, a security key or a browser: the authenticator is in software",
    "Docker or any server",
]
install = []

[docs.session]
objectives = [
    "explain what the bank stores for a passkey and why it cannot sign",
    "explain why a look-alike site cannot use a passkey",
    "name what Spring Security's WebAuthn support does not check by default",
    "plan the loss of a device and the end of the password",
]
walkthrough = """
Run act three and list the three places a look-alike is stopped. In act four ask which of your own sign-ins would accept a clone. In act five ask what a customer does when the only passkey is on a lost phone.
"""
exercises = [
    "Store the credentials in a database with the JDBC repositories that Spring Security provides.",
    "Require user verification only for sign-ins that start a payment.",
    "Add attestation verification and allow only security keys of one vendor.",
    "Write the recovery path: a second passkey, a code, and a waiting period.",
]

[docs.explained]
sentence = """
A passkey proves that a customer holds a private key made for the bank's name, so it cannot be phished, and a bank that uses it still decides about user verification, copies, recovery and the password.
"""
verdict = """
Use a maintained WebAuthn library, require user verification, compare the counter and suspend a passkey that goes backwards, treat synced passkeys as the account they sync through, offer two passkeys before switching passwords off, and design recovery as carefully as sign-in.
"""
recognise = [
    "`navigator.credentials.create` and `get` in front-end code.",
    "`http.webAuthn()` in a Spring Security configuration.",
    "A `PublicKeyCredentialRequestOptions` with `userVerification: preferred`.",
    "An `rpId` that is a registrable domain.",
]

[spec]
purpose = """
Teach passkey sign-in with Spring Security's WebAuthn support, and the decisions it leaves to the bank.
"""
nongoals = [
    "A browser extension or real authenticator hardware.",
    "Attestation verification of device makers.",
    "Federated sign-in.",
]
problem = """
Teams add passkeys with a few lines of configuration and keep the defaults, a password and no clone detection.
"""
roles = [["Security", "`PasskeySecurity`, `HardenedRelyingParty`, `PasswordSwitchOffFilter`"], ["Controller", "`PasskeyController`"], ["The browser and page", "`PasskeyBrowser`"], ["The phone", "`SoftwareAuthenticator`, `Cbor` (writes and reads the COSE key), `B64`"], ["Entry point", "`PasskeysSpringDemo`"]]
requirements = [
    "Registration stores a public key and a counter, and nothing that can sign.",
    "A challenge is used once, and only by the browser it was given to.",
    "A look-alike origin, a foreign relying party id and another key are refused.",
    "The hardened bank requires user verification.",
    "The hardened bank suspends a passkey whose counter does not go up, after the signature is proved.",
    "A passkey can be removed.",
    "The password is switched off for a customer with two passkeys.",
    "The demo prints the same output on every run.",
]

