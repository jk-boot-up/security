[threatmodel]
scope = """
Passkey registration and sign-in at an online bank using Spring Security's WebAuthn support, and the account recovery and password decisions around it. It does not cover the security of the customer's device.
"""
assets = [
    "The customer's account.",
    "The customer's private key, in the authenticator.",
]
actors = [
    "A customer with one or more authenticators.",
    "A phisher with a look-alike site.",
    "A thief who has copied a key or stolen a phone.",
]
boundaries = [
    "The customer's device: the private key never crosses it.",
    "The browser to the bank: the origin and the signed answer.",
]
assumptions = [
    "The browser enforces the relying party id rules and writes the real origin into the client data.",
    "The customer has a second way to sign in if a device is lost.",
]
out_of_scope = [
    "Malware on the customer's device.",
    "Theft of the cloud account that a synced passkey syncs through.",
]
tests = [
    "`PasskeysSpringTest` starts a real bank for each case and checks registration, the CSRF token, sign-in, the single use of a challenge, another key, the origin and the relying party id hash, the browser's and authenticator's rules, a flipped flag, the defaults, user verification, a clone and its suspension, a forged signature, a synced passkey, removing a passkey and the end of the password.",
    "`CborTest` and `SoftwareAuthenticatorTest` check the bytes the authenticator builds, the COSE key read back label by label and the 69 signed bytes, and `DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next project in this module, saml-basics-with-keycloak, looks at the older single sign-on standard that many companies still run.
"""

[[threat]]
id = "T1"
stride = "S"
threat = "A look-alike site collects a credential that works at the bank"
where = "the relying party id, the origin check"
control = "A passkey is made for one relying party id; the browser and the bank check the origin"
residual = "A password kept beside the passkeys"

[[threat]]
id = "T2"
stride = "S"
threat = "A copy of the private key signs in"
where = "`HardenedRelyingParty`"
control = "The signature counter is compared and a passkey that goes backwards is suspended"
residual = "Synced passkeys, which always report 0"

[[threat]]
id = "T3"
stride = "S"
threat = "A stolen phone signs in without the customer"
where = "the user verification flag"
control = "User verification is required, so a fingerprint or PIN is needed"
residual = "A thief who also has the PIN"

[[threat]]
id = "T4"
stride = "E"
threat = "Recovery or the password gives a way around the passkeys"
where = "`PasswordSwitchOffFilter`, the recovery path"
control = "Two passkeys before the password is switched off, and a recovery path as strong as the passkeys"
residual = "A recovery path that the bank forgets to design"

