[[scene]]
key = "01-poster"
kind = "poster"
title = "Passkeys with Spring Security"
narration = "Hello, and welcome. [[slnc 400]] This video explains passkeys with Spring Security, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] Spring Security's WebAuthn support, built on WebAuthn4J, creates and checks the challenges, keeps the public keys and refuses a look-alike origin, a replayed or foreign answer and a wrong key; but by default it only asks for user verification, never compares the signature counter, and leaves the password you keep beside the passkeys, so a bank has to wrap it to require a fingerprint and suspend a cloned passkey, and to switch passwords off once a customer has two passkeys. [[slnc 600]] Think of it this way. [[slnc 300]] A hotel key card that is cut for one hotel only. A copy of the hotel's records does not open a door, a card cut for another hotel opens nothing here, and a fake lobby can collect a guest's name and room number but not the card's secret. [[slnc 700]] In this video, the domain is an online bank. [[slnc 500]] By the end, you will be able to: [[slnc 300]] Explain what the bank stores for a passkey and why it cannot sign. [[slnc 300]] Explain why a look-alike site cannot use a passkey. [[slnc 300]] Name what Spring Security's WebAuthn support does not check by default."

