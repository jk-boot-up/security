[[act]]
title = "User verification, and counters against copies"
summary = "With Spring Security's defaults (user verification preferred) a touch with flags 01, a counter that went back from 3 to 1 and a copied key are all accepted; the hardened bank requires verification, refuses flags 01, accepts 05, and after counter 6 refuses a copy signing with 7 and suspends the passkey; a synced passkey (flags 1d) reports 0."
detail = """
Spring Security's defaults ask for user verification (preferred) but do not require it: a touch only, flags 01, is accepted. A phone that had reached
counter 3 and was restored from a backup signs with counter 1 and is accepted, and a copied key is accepted too: the counter is stored, never compared.
The hardened bank wraps Spring Security's relying party in HardenedRelyingParty and sets user verification to required: a touch only (flags 01) is
refused, a touch and a fingerprint (flags 05) accepted. The bank has seen counter 6. The real phone signs with 7: 7 is above 6, accepted. The copy
signs with 7: 7 is not above 7, refused, and the passkey is suspended, so the real phone with counter 8 is refused too. A synced passkey sets flags
1d (present, verified, backup eligible, backed up) and always reports counter 0, so a copy of it cannot be spotted by its counter.
"""
figure = "counters"
figure_title = "The defaults, and a bank that insists"
figure_speech = """
Fourth demo: user verification, and copies. [[slnc 400]] On the left, Spring Security's defaults. [[slnc 300]] User verification is only preferred. [[slnc 300]] So a touch alone, flags zero one, is accepted. [[slnc 300]] A counter that went back from three to one is accepted. [[slnc 300]] And a copied key is accepted. [[slnc 300]] Spring stores the counter, but does not compare it. [[slnc 700]]
On the right, the hardened bank. [[slnc 300]] A small wrapper requires verification, so a touch alone is refused, and a fingerprint is accepted. [[slnc 600]] Then the counter. [[slnc 300]] The bank has seen six. [[slnc 300]] The real phone signs with seven: accepted. [[slnc 300]] The copy also signs with seven. [[slnc 300]] Seven is not above seven, so it is refused, and the passkey is suspended until Ana confirms it.
"""
speech = """
Here is the real output. [[slnc 400]] The defaults: a touch only, accepted. [[slnc 300]] A counter going back, accepted. [[slnc 300]] A copied key, accepted, and not noticed. [[slnc 400]] The hardened bank: user verification required. [[slnc 300]] A touch only, refused. [[slnc 300]] With a fingerprint, accepted.
[[page]]
The counters. [[slnc 300]] Seen six. [[slnc 300]] The real phone with seven, accepted. [[slnc 300]] The copy with seven, refused. [[slnc 300]] The real phone with eight, refused: the passkey is suspended. [[slnc 400]] A synced passkey, flags one d, counter zero, accepted twice. [[slnc 300]] A copy of it cannot be spotted.
"""
