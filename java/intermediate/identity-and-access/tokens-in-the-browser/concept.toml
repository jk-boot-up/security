[docs.session]
objectives = [
    "explain why tokens in localStorage are readable by every script on the page",
    "describe how a backend for the frontend keeps tokens on the server",
    "list what stops a request started by another site",
    "explain what a DPoP proof contains and what it stops",
    "say what neither the BFF nor DPoP stops",
]
walkthrough = """
Start with the hotel key. Run the demo one act at a time. After act one, ask why the refresh token is worse to lose than the access token. After act two, ask what
the script can still do, and when it stops. In act four, ask which part of the proof stops each refusal. End with act five and the open page.
"""
exercises = [
    "Shorten the refresh token's life to one day and rerun act one.",
    "Add a check that the BFF refuses any request whose Origin header is not the app's own.",
    "Bind the BFF's own tokens to a server key with DPoP, so a token copied from the BFF's store is useless too.",
    "Add a server-supplied nonce (RFC 9449 section 8) to the proofs and refuse proofs without the current one.",
]

[docs.explained]
sentence = """
Tokens kept in a browser are readable by every script on the page, so a backend for the frontend keeps them on the server and gives the browser only an HttpOnly
cookie, and DPoP binds any token that must be used from the client to a key that never leaves it.
"""
verdict = """
For browser apps that hold OAuth tokens, use a backend for the frontend: a confidential client on the server, a __Host- cookie with Secure, HttpOnly and
SameSite=Strict, and a request header on state-changing calls. Where tokens must be used from the client, bind them with DPoP. In both cases, keep third-party
scripts to a minimum and enforce a strict Content-Security-Policy, because code on the open page can still act as the user.
"""
recognise = [
    "`localStorage.setItem(\"access_token\", ...)` in a single-page app.",
    "A session cookie named `__Host-...` on a banking app, and no token in the browser's storage.",
    "`Authorization: DPoP` and `DPoP:` headers, and `cnf` with `jkt` in an access token.",
    "Library settings called \"token handler\", \"BFF\" or \"sender-constrained tokens\".",
]

[spec]
purpose = """
Teach where a single-page app's OAuth tokens should live by stealing them from browser storage, moving them behind a backend for the frontend, and binding
them to a client key with DPoP, all with the JDK and a model browser.
"""
nongoals = [
    "The OAuth flow itself: the oauth2-authorization-code-pkce project.",
    "Real JavaScript, WebCrypto or a real browser.",
    "Cross-site scripting itself: the cross-site-scripting project.",
]
problem = """
Single-page apps often keep OAuth tokens in localStorage because tutorials do; learners rarely see that every script on the page can read them, or what the alternatives cost.
"""
roles = [["The authorization server", "`AuthServer`"], ["The bank's API", "`BankApi`"], ["The backend for the frontend", "`Bff`"], ["A model browser", "`Browser`, `Cookie`"], ["A script on the page", "`PageScript`"], ["DPoP keys and proofs", "`DpopKey`, `DpopVerifier`"], ["Compact JWS and JSON", "`Jws`, `Json`, `Base64Url`, `Ed25519`"], ["Entry point", "`BffDemo`"]]
requirements = [
    "A script on the page takes tokens kept in localStorage, and a stolen refresh token works later.",
    "With the BFF, the browser holds no token and only a __Host- cookie that scripts cannot read.",
    "The BFF refuses state-changing requests without its request header, and the browser refuses a cross-site preflight for it.",
    "A DPoP-bound token is refused without a fresh, matching proof from the bound key, and each proof id is accepted once.",
    "The JWK thumbprint matches RFC 8037 appendix A.3.",
    "The demo prints the same output on every run.",
]

