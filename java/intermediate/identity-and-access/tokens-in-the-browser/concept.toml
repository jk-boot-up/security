[[act]]
title = "Tokens bound to a key, with DPoP"
summary = "The thumbprint of the app's key, SHA-256 over its canonical JWK, is in the token's cnf.jkt; each request carries a proof signed by the key; the token alone, another key's proof, a replay, a proof for another request or an old proof all get 401."
detail = """
When tokens must be in the browser, DPoP binds them to a key that scripts can use but cannot read. The key's public half, as a JWK, is written with its members crv, kty and x in
alphabetical order and no spaces, 79 characters; SHA-256 of that text, in base64url, is the thumbprint, and the access token carries it in cnf.jkt. Each request carries a proof:
a small JWT signed by the key, with a random jti, the method (htm), the URL (htu), the time (iat) and ath, the SHA-256 of the access token. With a fresh proof: 200. The token
alone: 401. With a proof from the thief's key: 401. The app's request sent again: 401, the proof was already used. A proof for GET /accounts used for a transfer: 401. A proof
made 120 seconds ago: 401, too old. The refresh token is bound to the same key: refused with the thief's key, new tokens with the app's.
"""
figure = "thumbprint"
figure_title = "The key's thumbprint, and one proof"
figure_speech = """
Fourth demo: tokens bound to a key, with D Pop. [[slnc 400]] On the left, how the token names the key. [[slnc 300]] The app's public key is written as a short J S O N text: the curve, the key type, and the key's thirty two bytes. [[slnc 300]] Members in alphabetical order, with no spaces, so everyone gets the same text. [[slnc 600]]
That text goes through S H A two fifty six, which gives thirty two bytes. [[slnc 300]] In base sixty four U R L, that is forty three characters: the thumbprint. [[slnc 300]] The bank writes it into the access token, as c n f dot j k t. [[slnc 700]]
On the right, one proof. [[slnc 300]] A small token signed by the key. [[slnc 300]] A random id, used once. [[slnc 300]] The method and the address of this one request. [[slnc 300]] The time. [[slnc 300]] And the hash of the access token. [[slnc 600]]
To use the token, you need a fresh proof from the key it names.
"""
speech = """
Here is the output. [[slnc 400]] The app's public key, in the text the thumbprint hashes. [[slnc 400]] The thumbprint, worked out. [[slnc 400]] And the access token carries exactly that value.
[[page]]
The proof for one request, field by field. [[slnc 400]] The ath is the hash of the access token. [[slnc 400]] With the token and the proof, the app reads the balance: two hundred.
[[page]]
The attacks, each refused with its reason. [[slnc 300]] The token alone. [[slnc 300]] A proof from the thief's key. [[slnc 300]] A copy of the app's request. [[slnc 300]] A proof for another request. [[slnc 300]] And a proof that is too old.
[[page]]
The refresh token is bound to the same key. [[slnc 300]] With the thief's key: refused. [[slnc 300]] With the app's key: new tokens. [[slnc 400]] A stolen token is useless without the key.
"""
rows = { dpop = "active ok" }
console = [
    ["THE APP'S PUBLIC KEY (Ed25519; scripts may sign, not read it):", "code"],
    ["  {\"crv\":\"Ed25519\",\"kty\":\"OKP\",", "muted"],
    ["  \"x\":\"NjY5EYSpJoFzZeY6YIUgousxxLUbHJoSuOceQYJUmLM\"}", "muted"],
