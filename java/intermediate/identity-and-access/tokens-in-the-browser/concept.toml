[[scene]]
key = "01-poster"
kind = "poster"
title = "Tokens in the Browser"
narration = """Hello, and welcome. [[slnc 400]] This video explains where a single page app should keep its O Auth tokens, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A single page app runs in the browser and calls A P Is directly. [[slnc 300]] To do that with O Auth, it needs an access token, and often a refresh token. [[slnc 600]] Think of a hotel guest. [[slnc 300]] Leaving the room key on the restaurant table means anyone can take it. [[slnc 300]] Leaving it at reception means the key never leaves the desk. [[slnc 700]] In this video, the domain is an online bank. [[slnc 500]] By the end, you will hear why tokens in the browser are readable by every script on the page. [[slnc 300]] How a backend for the frontend keeps them on the server. [[slnc 300]] How D Pop binds a token to a key. [[slnc 300]] And what neither of them stops."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online bank's single-page app", "signs customers in with OAuth.", "", "It includes third-party scripts.", "Any one of them could be compromised."]
narration = """Here is the scenario. [[slnc 400]] An online bank's banking app is a single page that calls the bank's A P I. [[slnc 500]] It signs customers in with O Auth. [[slnc 500]] It includes third party scripts, for analytics and chat. [[slnc 300]] Any one of them could be compromised."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["localStorage: browser storage any script can read", "HttpOnly cookie: sent by the browser, unreadable by scripts", "BFF: a backend that holds the tokens", "DPoP: a token bound to a client key", "Proof: a signed note for one request"]
narration = """Before the demos, the words. [[slnc 500]] Local storage is browser storage that any script on the page can read. [[slnc 500]] An H T T P only cookie is sent by the browser, but scripts cannot read it. [[slnc 500]] A backend for the frontend is a server that holds the tokens for the page. [[slnc 500]] D Pop binds a token to a key held by the client. [[slnc 500]] And a proof is a small signed note, made for one request."""

[[scene]]
key = "03-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "03-what-scripts-read"
kind = "figure"
title = "What a script on the page can read"
body = "what_scripts_read"
narration = """Let's see the whole idea on one picture. [[slnc 400]] The same third party script runs on the bank's page, twice. [[slnc 700]] On the left, the app keeps its tokens in local storage. [[slnc 300]] The access token, and the refresh token. [[slnc 300]] Any script on the page can read local storage. [[slnc 300]] So the script takes both tokens, and sends them to its own server. [[slnc 700]] On the right, the tokens stay on a server: the backend for the frontend. [[slnc 300]] Local storage is empty. [[slnc 300]] The browser holds one cookie, marked H T T P only, which scripts cannot read. [[slnc 300]] The script takes nothing. [[slnc 700]] Anything a script on the page can read, it can send away. [[slnc 300]] So the safest token is one the page never holds."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "09-ladder"
kind = "bullets"
title = "Where Tokens Can Live, Best Last"
body = ["localStorage: every script reads them", "Memory only: gone on reload, still readable", "Bound with DPoP: useless without the key", "On a BFF: never in the browser", "", "Code on the open page can still act."]
narration = """Let's put the places side by side, worst first. [[slnc 400]] In local storage, every script on the page reads them. [[slnc 500]] In memory only, they are gone when the page reloads, and scripts can still reach them. [[slnc 500]] Bound with D Pop, a copy is useless without the key. [[slnc 500]] On a backend for the frontend, they are never in the browser at all. [[slnc 600]] And in every case, code running on the open page can still act as the user."""

[[scene]]
key = "11-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Banking apps with no token in storage", "__Host- session cookies", "Authorization: DPoP headers", "Advisories about compromised third-party scripts"]
narration = """You have probably met this already. [[slnc 400]] Banking apps that sign in on their own domain and never show a token. [[slnc 500]] Session cookies whose names start with the host prefix. [[slnc 500]] Requests with an authorization header that says D Pop. [[slnc 500]] And news about a compromised analytics script on a popular site."""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["A BFF for browser apps that hold tokens", "A __Host- cookie: Secure, HttpOnly, SameSite=Strict", "A request header on every change", "DPoP where tokens must be in the client", "Few third-party scripts, a strict CSP"]
narration = """So, how do you use it? [[slnc 400]] Use a backend for the frontend for browser apps that hold O Auth tokens. [[slnc 500]] Give the browser a host prefixed cookie: secure, H T T P only, same site strict. [[slnc 500]] Require the app's own request header on every change. [[slnc 500]] Bind tokens with D Pop where they must be used from the client. [[slnc 500]] And keep third party scripts few, with a strict content security policy."""

[[scene]]
key = "12-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "13-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Shorten the refresh token's life", "and rerun the first demo."]
narration = """That's tokens in the browser. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Anything a script on the page can read, it can send away, so keep tokens on the server, and bind the rest to a key. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine, with nothing installed except a Java development kit. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Shorten the refresh token's life, and rerun the first demo. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
Where an online bank's single-page app keeps its OAuth tokens, and how the bank's API and a backend for the frontend accept requests from it. It covers
scripts running on the page, sites that start requests in the customer's browser, and thieves who replay what was taken. It does not cover how the page
came to run a bad script, the OAuth flow itself, or the authorization server's internals.
"""
assets = [
    "Ana's access token and refresh token.",
    "The BFF session cookie.",
    "The client's DPoP private key.",
    "Ana's balance and her ability to move money.",
]
actors = [
    "Ana, using the bank's page.",
    "A third-party script included in the page.",
    "Another site Ana visits.",
    "A thief using tokens away from Ana's browser.",
]
boundaries = [
    "Page to scripts: anything scripts can read is shared with every script on the page.",
    "Browser to BFF: the cookie goes automatically, so the BFF must tell its own page from other sites.",
    "Client to API: a bearer token works for whoever holds it, unless it is bound to a key.",
]
assumptions = [
    "The BFF, the API and the authorization server are run by the bank and keep their keys safe.",
    "Browsers apply HttpOnly and the CORS preflight; older ones may ignore SameSite.",
    "In the demo, keys come from fixed seeds and the browser and script are models.",
]
out_of_scope = [
    "Preventing scripts from being injected: the cross-site-scripting project.",
    "The OAuth code flow and PKCE: the oauth2-authorization-code-pkce project.",
    "Mobile apps, which keep tokens in the operating system's secure storage.",
]
tests = [
    "`DpopTest` checks the RFC 8037 thumbprint, good proofs, every refusal reason, replays, and that a refused proof does not use up its id.",
    "`BffAndBrowserTest` checks the cookie, what scripts can read, the request header, SameSite, the preflight, server-side refresh and the closed page.",
    "`TokensTest` checks expiry, issuer keys, refresh rotation, bound refresh tokens and bound access tokens.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next projects in this module are passkeys, which removes the password, and openid-connect, which adds identity on top of OAuth.
"""

[[threat]]
id = "T1"
stride = "I"
threat = "A script on the page reads tokens kept in the browser and sends them away"
where = "`Browser.readableByScripts`, `PageScript.collect`"
control = "A backend for the frontend keeps the tokens on the server; the browser holds only an HttpOnly cookie"
residual = "A script on the open page can still make requests as the user, so scripts must be kept off the page"

[[threat]]
id = "T2"
stride = "S"
threat = "A stolen access or refresh token is replayed from elsewhere"
where = "`BankApi.handle`, `AuthServer.refresh`"
control = "DPoP binds tokens to a key; proofs are checked for method, address, time, token hash and a single-use id"
residual = "Bearer tokens without binding still work for whoever holds them until they expire"

[[threat]]
id = "T3"
stride = "T"
threat = "Another site starts a state-changing request that carries the session cookie"
where = "`Bff.handle`"
control = "SameSite=Strict, a request header required on every change, and no cross-origin preflight allowed"
residual = "A script running on the bank's own page can send the header, which is threat T1 again"

[[threat]]
id = "T4"
stride = "E"
threat = "A script on the open page uses the non-extractable DPoP key to sign its own requests"
where = "`Browser.keyForThisPage`"
control = "None that DPoP itself can give: keep scripts off the page with a strict Content-Security-Policy"
residual = "Use while the page is open stays possible; theft of the key does not"

[[threat]]
id = "T5"
stride = "D"
threat = "Sessions stop working when requests reach a BFF instance that does not have them"
where = "`Bff` session store"
control = "A shared session store for every instance"
residual = "The store becomes a dependency to run and protect"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] Everything runs in one Java process, with a model browser and a simulated clock, so every run is the same. [[slnc 300]] Here are the classes that matter."""

[[class]]
name = "Browser"
what = "the model browser: what a script on the page can read"
[[class.part]]
title = "localStorage, and cookies without HttpOnly"
code = """
Map<String, String> view = new LinkedHashMap<>(localStorage);
for (Cookie c : cookies.values()) {
    if (!c.httpOnly()) {
        view.put("cookie " + c.name(), c.value());
    }
}
"""
speech = """The model browser decides what a script can read. [[slnc 300]] Everything in local storage, and every cookie that is not H T T P only. [[slnc 300]] The third party script reads exactly this view."""

[[class]]
name = "Bff"
what = "keeps the tokens, gives the browser a cookie"
[[class.part]]
title = "sign in: keep the tokens, hand out a cookie"
code = """
sessions.put(key, new Session(subject, tokens));
...
return COOKIE + "=" + sessionId + "; Path=/; Secure; HttpOnly; SameSite=Strict";
"""
speech = """At sign in, the server keeps the tokens in its own session store. [[slnc 300]] The browser gets only a cookie, with a random session id and the four rules."""
[[class.part]]
title = "every call: check the header, add the token"
code = """
if (request.changesState() && !"1".equals(request.header(REQUEST_HEADER))) {
    return Response.of(403, "a change needs the bank's own request header");
}
...
Request onward = Request.of(request.method(), target);
return api.handle(onward.withHeader("Authorization", "Bearer " + access.get()));
"""
speech = """A change without the bank's own request header is refused. [[slnc 300]] Otherwise the server adds the access token itself, on the way to the bank's A P I."""

[[class]]
name = "AuthServer"
what = "issues the tokens, and binds them to a key"
[[class.part]]
title = "five minutes, and the key's thumbprint"
code = """
claims.put("exp", clock.now() + ACCESS_SECONDS);
...
if (keyThumbprint != null) {
    claims.put("cnf", Map.of("jkt", keyThumbprint));
}
"""
speech = """The access token expires three hundred seconds after it is issued. [[slnc 300]] When the client has a key, the token carries the key's thumbprint, in c n f dot j k t."""

[[class]]
name = "DpopKey"
what = "the browser's key: its thumbprint, and the proofs it signs"
[[class.part]]
title = "the thumbprint"
code = '''
byte[] text = canonical(jwk).getBytes(StandardCharsets.UTF_8);
return Base64Url.encode(Bytes.sha256(text));
...
return "{\"crv\":\"" + jwk.get("crv")
        + "\",\"kty\":\"" + jwk.get("kty")
        + "\",\"x\":\"" + jwk.get("x") + "\"}";
'''
speech = """The thumbprint is the S H A two fifty six of a fixed text. [[slnc 300]] Three members, in alphabetical order, with no spaces. [[slnc 300]] A test checks it against the example in the standard."""
[[class.part]]
title = "one proof for one request"
code = """
claims.put("htm", method);
claims.put("htu", DpopVerifier.target(url));
claims.put("iat", issuedAt);
...
claims.put("ath", Bytes.sha256Base64Url(accessToken));
"""
speech = """Each proof names the method, the address, and the time. [[slnc 300]] And the hash of the access token, so the proof works only with that token."""

[[class]]
name = "BankApi"
what = "a bound token needs a proof from its key"
[[class.part]]
title = "compare the proof's key with the token's"
code = """
String proof = request.header("DPoP");
String signedBy = dpop.verify(proof, request.method(), request.url(), token);
if (!Bytes.same(signedBy, boundTo)) {
    return Response.of(401, "the proof's key is not the key the token is bound to");
"""
speech = """When the token is bound to a key, the A P I checks the proof first. [[slnc 300]] Then it compares the thumbprint of the key that signed with the one in the token. [[slnc 300]] Different keys: four oh one."""

[[class]]
name = "DpopVerifier"
what = "checks each proof: this request, recent, used once"
[[class.part]]
title = "this request, and only once"
code = """
if (!method.equals(claims.get("htm")) || !target(url).equals(claims.get("htu"))) {
...
if (seen.putIfAbsent(id, issuedAt) != null) {
    throw new InvalidTokenException("the proof was already used");
"""
speech = """A proof must name this method and this address. [[slnc 300]] And its random id is remembered, so a copied request is refused the second time."""

[[acronym]]
short = "SPA"
long = "Single-Page Application: one page that calls APIs from the browser"
say = "S P A is a single page application: one web page that calls A P Is from the browser."
[[acronym]]
short = "API"
long = "Application Programming Interface: here, the bank's web service"
say = "A P I is an application programming interface. Here, the bank's web service."
[[acronym]]
short = "OAuth"
long = "Open Authorization: the standard for handing out access tokens"
say = "O Auth is open authorization: the standard way to hand out access tokens."
[[acronym]]
short = "BFF"
long = "Backend For the Frontend: a server that holds the tokens for the page"
say = "B F F is a backend for the frontend: a server that holds the tokens for the page."
[[acronym]]
short = "DPoP"
long = "Demonstrating Proof of Possession (RFC 9449): a token bound to a key"
say = "D Pop is demonstrating proof of possession: a token that works only with a fresh proof from one key."
[[acronym]]
short = "JWT"
long = "JSON Web Token: a signed token in three base64url parts"
say = "J W T is a J son web token: header, claims and signature, in three parts."
[[acronym]]
short = "JSON"
long = "JavaScript Object Notation: text like {\"kty\":\"OKP\"}"
say = "J son is JavaScript object notation: names and values written as text."
[[acronym]]
short = "JWK"
long = "JSON Web Key: a public key written as JSON"
say = "J W K is a J son web key: a public key written as J son."
[[acronym]]
short = "SHA-256"
long = "Secure Hash Algorithm, 256 bits: 32 bytes from any text"
say = "S H A two fifty six is the secure hash algorithm: it turns any text into thirty two bytes."
[[acronym]]
short = "EdDSA, DSA, Ed25519"
long = "Edwards-curve Digital Signature Algorithm, curve Ed25519"
say = "E d D S A is the Edwards curve digital signature algorithm. Ed twenty five five nineteen is its curve."
[[acronym]]
short = "base64url"
long = "bytes written with letters, digits, - and _, safe in a URL"
say = "Base sixty four U R L writes bytes with letters, digits, a dash and an underscore."
[[acronym]]
short = "iat, exp, sub, jti"
long = "token claims: issued at, expires, subject, token id"
say = "In a token, i a t is issued at, e x p is expires, s u b is the subject, and j t i is a unique id."
[[acronym]]
short = "cnf.jkt, htm, htu, ath"
long = "key thumbprint; a proof's method, URL, token hash"
say = "c n f dot j k t is the bound key's thumbprint. In a proof, h t m is the method, h t u the address, and a t h the hash of the access token."
[[acronym]]
short = "HTTP, HTTPS"
long = "Hypertext Transfer Protocol, and its encrypted form"
say = "H T T P is the hypertext transfer protocol. H T T P S is its encrypted form."
[[acronym]]
short = "URL"
long = "Uniform Resource Locator: a web address"
say = "U R L is a uniform resource locator: a web address."
[[acronym]]
short = "CORS"
long = "Cross-Origin Resource Sharing: the browser asks first"
say = "Cors is cross origin resource sharing. The browser asks the server first, in a preflight, before some requests from another site."
[[acronym]]
short = "CSP"
long = "Content Security Policy: which scripts a page may run"
say = "C S P is a content security policy: the list of scripts a page may run."
[[acronym]]
short = "RFC"
long = "Request for Comments: an internet standard"
say = "R F C is request for comments: the name of an internet standard."
