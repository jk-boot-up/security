[docs.problem]
scenario = """
A single-page banking app gets an access token after sign-in, and must keep it somewhere between API calls.
"""
naive = """
Put the token in local storage, because it is easy and survives a reload: our own scripts are the only ones on the page.
"""
deliver = [
    "A model of a page, its storage and cookies, and what an injected script can reach.",
    "A BFF with a session cookie, an origin check and a custom header.",
    "Real DPoP proofs (ES256, JWK thumbprints) and an API that checks them, with a replay cache.",
    "An honest account of what each design does not stop.",
]

[docs.prerequisites]
required = [
    "Java basics",
    "An idea of what an access token and a cookie are",
]
not_required = [
    "A browser or JavaScript: the page is a model",
    "A real authorization server: the token table is a stand-in",
]
install = []

[docs.session]
objectives = [
    "explain why a token in web storage is lost to one injected script",
    "describe how a BFF keeps tokens off the browser and what it needs against CSRF",
    "say what an HttpOnly cookie does and does not protect",
    "explain what a DPoP proof contains and which attacks each field stops",
]
walkthrough = """
Run act two and ask what the attacker needed besides the token. In act three, ask what an injected script can still do and why that does not make the BFF pointless. In act four, ask which field of the proof stops each refused call.
"""
exercises = [
    "Add a nonce from the API that every proof must include, and see what it adds to the iat check.",
    "Rotate the BFF session id after sign-in and after a privilege change.",
    "Make the BFF refuse sessions older than eight hours or idle for 30 minutes.",
    "Add an HttpOnly refresh token to the BFF, and decide what happens when the access token expires.",
]

[docs.explained]
sentence = """
A token that a script can read is a token an attacker can take, so keep tokens on a backend behind an HttpOnly cookie, or bind them to a key with DPoP, and still fix the cross-site scripting that put the script there.
"""
verdict = """
For a first-party single-page app, prefer a BFF with a `__Host-` HttpOnly SameSite cookie and CSRF protection. When tokens must be in the browser, bind them with DPoP and keep the private key non-extractable. Never store long-lived tokens in
web storage, and keep scripts out of the page with a strict Content-Security-Policy.
"""
recognise = [
    "`localStorage.setItem` or `sessionStorage.setItem` holding a token.",
    "A `/bff/` or `/api` proxy path that adds the `Authorization` header on the server.",
    "`Authorization: DPoP` and a `DPoP` header.",
    "`Set-Cookie: __Host-...; HttpOnly; Secure; SameSite=Lax`.",
]

[spec]
purpose = """
Teach where a single-page app should keep its tokens by stealing one from local storage, then comparing a backend for the frontend with a DPoP-bound token.
"""
nongoals = [
    "A real browser, WebCrypto or a real authorization server.",
    "Refresh tokens and token rotation: oauth2-authorization-code-pkce.",
    "The Spring BFF version: the tokens-in-the-browser-with-spring-boot project.",
]
problem = """
Developers keep bearer tokens where every script can read them, and an attacker needs only one script.
"""
roles = [["The page", "`BrowserPage`"], ["The BFF", "`Bff`"], ["Tokens and API", "`AuthServer`, `ResourceApi`, `ApiReply`"], ["DPoP", "`DpopProof`, `Jwk`, `MiniJson`, `B64`, `SimClock`"], ["Entry point", "`TokensDemo`"]]
requirements = [
    "An injected script reads a token in web storage and non-HttpOnly cookies, and not HttpOnly cookies.",
    "A stolen bearer token works from another computer.",
    "The BFF refuses requests without its cookie, and state-changing requests without the app's origin and custom header, and ends sessions on sign-out.",
    "A DPoP-bound token is refused as a bearer token and without a proof, and every proof check (signature, key, method, address, time, token hash, replay) has a test.",
    "The demo prints the same output on every run.",
]

