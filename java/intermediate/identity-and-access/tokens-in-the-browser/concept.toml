[[scene]]
key = "01-poster"
kind = "poster"
title = "Tokens in the Browser"
narration = """Hello, and welcome. [[slnc 400]] This video explains where a single page app should keep its O Auth tokens, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A single page app runs in the browser and calls A P Is directly. [[slnc 300]] To do that with O Auth, it needs an access token, and often a refresh token. [[slnc 600]] Think of a hotel guest. [[slnc 300]] Leaving the room key on the restaurant table means anyone can take it. [[slnc 300]] Leaving it at reception means the key never leaves the desk. [[slnc 700]] In this video, the domain is an online bank. [[slnc 500]] By the end, you will hear why tokens in the browser are readable by every script on the page. [[slnc 300]] How a backend for the frontend keeps them on the server. [[slnc 300]] How D Pop binds a token to a key. [[slnc 300]] And what neither of them stops."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online bank's single-page app", "signs customers in with OAuth.", "", "It includes third-party scripts.", "Any one of them could be compromised."]
narration = """Here is the scenario. [[slnc 400]] An online bank's banking app is a single page that calls the bank's A P I. [[slnc 500]] It signs customers in with O Auth. [[slnc 500]] It includes third party scripts, for analytics and chat. [[slnc 300]] Any one of them could be compromised."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["localStorage: browser storage any script can read", "HttpOnly cookie: sent by the browser, unreadable by scripts", "BFF: a backend that holds the tokens", "DPoP: a token bound to a client key", "Proof: a signed note for one request"]
narration = """Before the demos, the words. [[slnc 500]] Local storage is browser storage that any script on the page can read. [[slnc 500]] An H T T P only cookie is sent by the browser, but scripts cannot read it. [[slnc 500]] A backend for the frontend is a server that holds the tokens for the page. [[slnc 500]] D Pop binds a token to a key held by the client. [[slnc 500]] And a proof is a small signed note, made for one request."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "09-ladder"
kind = "bullets"
title = "Where Tokens Can Live, Best Last"
body = ["localStorage: every script reads them", "Memory only: gone on reload, still readable", "Bound with DPoP: useless without the key", "On a BFF: never in the browser", "", "Code on the open page can still act."]
narration = """Let's put the places side by side, worst first. [[slnc 400]] In local storage, every script on the page reads them. [[slnc 500]] In memory only, they are gone when the page reloads, and scripts can still reach them. [[slnc 500]] Bound with D Pop, a copy is useless without the key. [[slnc 500]] On a backend for the frontend, they are never in the browser at all. [[slnc 600]] And in every case, code running on the open page can still act as the user."""

[[scene]]
key = "10-roles"
kind = "bullets"
title = "Who Does What"
body = ["AuthServer: issues and refreshes tokens", "BankApi: checks tokens and proofs", "Bff: holds tokens, gives a cookie", "Browser and PageScript: the model page", "DpopKey and DpopVerifier: the proofs"]
narration = """Here is who does what in the code. [[slnc 400]] The authorization server issues and refreshes tokens. [[slnc 500]] The bank's A P I checks every token, and every proof. [[slnc 500]] The backend for the frontend holds the tokens, and gives the browser a cookie. [[slnc 500]] The browser and the page script are the model page. [[slnc 300]] And the D Pop key and verifier make and check the proofs."""

[[scene]]
key = "11-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Banking apps with no token in storage", "__Host- session cookies", "Authorization: DPoP headers", "Advisories about compromised third-party scripts"]
narration = """You have probably met this already. [[slnc 400]] Banking apps that sign in on their own domain and never show a token. [[slnc 500]] Session cookies whose names start with the host prefix. [[slnc 500]] Requests with an authorization header that says D Pop. [[slnc 500]] And news about a compromised analytics script on a popular site."""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["A BFF for browser apps that hold tokens", "A __Host- cookie: Secure, HttpOnly, SameSite=Strict", "A request header on every change", "DPoP where tokens must be in the client", "Few third-party scripts, a strict CSP"]
narration = """So, how do you use it? [[slnc 400]] Use a backend for the frontend for browser apps that hold O Auth tokens. [[slnc 500]] Give the browser a host prefixed cookie: secure, H T T P only, same site strict. [[slnc 500]] Require the app's own request header on every change. [[slnc 500]] Bind tokens with D Pop where they must be used from the client. [[slnc 500]] And keep third party scripts few, with a strict content security policy."""

[[scene]]
key = "13-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Shorten the refresh token's life", "and rerun the first demo."]
narration = """That's tokens in the browser. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Anything a script on the page can read, it can send away, so keep tokens on the server, and bind the rest to a key. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine, with nothing installed except a Java development kit. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Shorten the refresh token's life, and rerun the first demo. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
Where an online bank's single-page app keeps its OAuth tokens, and how the bank's API and a backend for the frontend accept requests from it. It covers
scripts running on the page, sites that start requests in the customer's browser, and thieves who replay what was taken. It does not cover how the page
came to run a bad script, the OAuth flow itself, or the authorization server's internals.
"""
assets = [
    "Ana's access token and refresh token.",
    "The BFF session cookie.",
    "The client's DPoP private key.",
    "Ana's balance and her ability to move money.",
]
actors = [
    "Ana, using the bank's page.",
    "A third-party script included in the page.",
    "Another site Ana visits.",
    "A thief using tokens away from Ana's browser.",
]
boundaries = [
    "Page to scripts: anything scripts can read is shared with every script on the page.",
    "Browser to BFF: the cookie goes automatically, so the BFF must tell its own page from other sites.",
    "Client to API: a bearer token works for whoever holds it, unless it is bound to a key.",
]
assumptions = [
    "The BFF, the API and the authorization server are run by the bank and keep their keys safe.",
    "Browsers apply HttpOnly and the CORS preflight; older ones may ignore SameSite.",
    "In the demo, keys come from fixed seeds and the browser and script are models.",
]
out_of_scope = [
    "Preventing scripts from being injected: the cross-site-scripting project.",
    "The OAuth code flow and PKCE: the oauth2-authorization-code-pkce project.",
    "Mobile apps, which keep tokens in the operating system's secure storage.",
]
tests = [
    "`DpopTest` checks the RFC 8037 thumbprint, good proofs, every refusal reason, replays, and that a refused proof does not use up its id.",
    "`BffAndBrowserTest` checks the cookie, what scripts can read, the request header, SameSite, the preflight, server-side refresh and the closed page.",
    "`TokensTest` checks expiry, issuer keys, refresh rotation, bound refresh tokens and bound access tokens.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next projects in this module are passkeys, which removes the password, and openid-connect, which adds identity on top of OAuth.
"""

[[threat]]
id = "T1"
stride = "I"
threat = "A script on the page reads tokens kept in the browser and sends them away"
where = "`Browser.readableByScripts`, `PageScript.collect`"
control = "A backend for the frontend keeps the tokens on the server; the browser holds only an HttpOnly cookie"
residual = "A script on the open page can still make requests as the user, so scripts must be kept off the page"

[[threat]]
id = "T2"
stride = "S"
threat = "A stolen access or refresh token is replayed from elsewhere"
where = "`BankApi.handle`, `AuthServer.refresh`"
control = "DPoP binds tokens to a key; proofs are checked for method, address, time, token hash and a single-use id"
residual = "Bearer tokens without binding still work for whoever holds them until they expire"

[[threat]]
id = "T3"
stride = "T"
threat = "Another site starts a state-changing request that carries the session cookie"
where = "`Bff.handle`"
control = "SameSite=Strict, a request header required on every change, and no cross-origin preflight allowed"
residual = "A script running on the bank's own page can send the header, which is threat T1 again"

[[threat]]
id = "T4"
stride = "E"
threat = "A script on the open page uses the non-extractable DPoP key to sign its own requests"
where = "`Browser.keyForThisPage`"
control = "None that DPoP itself can give: keep scripts off the page with a strict Content-Security-Policy"
residual = "Use while the page is open stays possible; theft of the key does not"

[[threat]]
id = "T5"
stride = "D"
threat = "Sessions stop working when requests reach a BFF instance that does not have them"
where = "`Bff` session store"
control = "A shared session store for every instance"
residual = "The store becomes a dependency to run and protect"
