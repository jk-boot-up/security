[[act]]
title = "Requests started by another site"
summary = "A hidden form on evil.example gets 401 because SameSite=Strict keeps the cookie off; an older browser sends the cookie but not the request header, so 403; adding the header needs a preflight the BFF refuses; one transfer is made, the bank's own."
detail = """
A cookie that is sent automatically invites cross-site request forgery. A hidden form on evil.example posts a transfer to the BFF without the X-Bank-Request header, which a form
cannot add. In a modern browser SameSite=Strict keeps the cookie off it: 401. In an older browser that ignores SameSite, the cookie goes, but the header does not: 403. A script on
evil.example that adds the header itself must first ask in a CORS preflight, which the BFF refuses for every other origin, so the request is never sent. The bank's own page
sends the transfer with the cookie and the header: 201. Transfers made: 1.
"""
figure = "cross_site"
figure_title = "Who starts the transfer, and what goes with it"
figure_speech = """
Third demo: requests started by another site. [[slnc 400]] Each row is one attempt to post a transfer, while Ana is signed in. [[slnc 300]] The middle columns say what the browser attaches: the cookie, and the bank's own request header. [[slnc 700]]
First row: a hidden form on another site, in a modern browser. [[slnc 300]] Same site strict keeps the cookie off. [[slnc 300]] Not signed in. [[slnc 600]]
Second row: an older browser sends the cookie anyway. [[slnc 300]] But a form cannot add a header, so the server refuses the change. [[slnc 600]]
Third row: a script on the other site tries to add the header. [[slnc 300]] The browser first asks the server, and the server says no. [[slnc 300]] The request is never sent. [[slnc 600]]
Last row: the bank's own page sends both. [[slnc 300]] One transfer is made.
"""
speech = """
