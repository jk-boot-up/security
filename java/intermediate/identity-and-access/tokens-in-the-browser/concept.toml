[[act]]
title = "A backend for the frontend keeps the tokens on the server"
summary = "The BFF signs Ana in on the server and gives the browser one __Host- cookie (Secure, HttpOnly, SameSite=Strict); the BFF holds 2 tokens, the browser 0; the script takes nothing, but can still read the balance while the page is open."
detail = """
The BFF signs Ana in on the server; the browser gets one cookie, __Host-bff, whose value is a random session id, with Path=/, Secure, HttpOnly and SameSite=Strict. Secure means
it is sent over HTTPS only, HttpOnly that scripts on the page cannot read it, SameSite=Strict that it is not sent when another site starts the request, and the __Host- prefix
that it must be Secure, have Path=/ and no Domain. The BFF's session store holds 2 tokens; the browser holds 0 tokens and 1 cookie. The app reads the balance through the BFF:
200. The same third-party script takes 0 tokens. While the page is open it can still ask the BFF for the balance: 200. Once the page is closed, the script is no longer
running. Six minutes later, after the access token has expired, the browser sends only the cookie and the BFF refreshes the token on the server: 200.
"""
figure = "bff_layout"
figure_title = "A cookie in the browser, the tokens on the server"
figure_speech = """
Second demo: a backend for the frontend. [[slnc 400]] At the top, three parts. [[slnc 300]] Ana's browser holds no tokens, and one cookie. [[slnc 300]] The backend for the frontend holds the two tokens, in its session store. [[slnc 300]] It adds the access token on the way to the bank's A P I. [[slnc 700]]
Bottom left, the cookie. [[slnc 300]] Its value is a random session id. [[slnc 300]] Secure: it travels over H T T P S only. [[slnc 300]] H T T P only: scripts on the page cannot read it. [[slnc 300]] Same site strict: it stays home when another site starts the request. [[slnc 300]] And the host prefix: no other host can set it. [[slnc 700]]
Bottom right, the same script on the page. [[slnc 300]] While the page is open, it can still ask for the balance. [[slnc 300]] Once the page is closed, it has nothing that works anywhere else.
"""
speech = """
Here is the output. [[slnc 400]] The sign in: one cookie, with a random value. [[slnc 400]] The cookie's four rules, each with what it means. [[slnc 400]] And where the tokens are: two on the server, none in the browser.
[[page]]
The app's own request carries only the cookie: two hundred. [[slnc 400]] The script takes nothing. [[slnc 300]] But while the page is open, it can still read the balance. [[slnc 400]] Six minutes later the access token has expired, and the server refreshes it, out of sight.
"""
