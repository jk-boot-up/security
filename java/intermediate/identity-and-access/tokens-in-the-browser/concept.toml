[project]
slug = "tokens-in-the-browser"
level = "intermediate"
module = "identity-and-access"
title = "Tokens in the Browser: BFF and DPoP"
short_title = "Tokens in the Browser"
package = "tokens"
main_class = "TokensDemo"
tagline = "A token a script can read is a token an attacker can take"
bold = "A single-page app that keeps an access token where its scripts can read it loses the token to one injected script, and the stolen bearer token works from anywhere; keep the token on a backend behind an HttpOnly session cookie, or bind it to a key the browser holds with DPoP."
domain = "a single-page banking app"
domain_note = ""
youtube_description = "Where should a single-page app keep its tokens? Local storage, a backend for the frontend, and DPoP, in Java."
thumb_lines = ["TOKENS IN THE", "BROWSER"]
thumb_code = "Authorization: DPoP + proof"
youtube_title = "Tokens in the Browser: Why BFF and DPoP (Java)"
youtube_tags = ["bff", "backend for frontend", "dpop", "oauth", "local storage", "xss", "java", "application security"]

[readme]
intro = """
A single-page app (SPA) gets an **access token** after sign-in and sends it to the API. The easy place to keep it is `localStorage`. But every script on the page can read web storage,
and one **cross-site scripting** bug, or one compromised third-party script, is enough to copy the token. A **bearer token** is accepted from whoever presents it, so the attacker uses it from their own computer,
long after the page is closed.

The ways out, in the order this project shows them:
- **A backend for the frontend (BFF).** The tokens stay on a server the customer's browser never sees. The browser holds only a session cookie (`__Host-` prefix, `HttpOnly`, `Secure`, `SameSite`). An injected script cannot read the cookie, so it cannot take the session away,
  though it can still use the session *while the page is open*, which is why XSS must also be fixed.
- **Proof of possession (DPoP, RFC 9449).** The token is bound to a key pair made in the browser. Each request carries a small signed proof for that method, address, time and token. A stolen token without the private key is useless.

**Maps to:** OAuth 2.0 for Browser-Based Applications (IETF BCP draft) · RFC 9449 (DPoP) · RFC 9700 (OAuth security best current practice) · OWASP Top 10 (2025) A07 · OWASP ASVS 5.0, the OAuth and session management chapters.
"""
analogy = """
A bearer token is cash: whoever holds it can spend it, and a pickpocket in the crowd (an injected script) is enough. A BFF is a bank that keeps your cash in its vault and gives you a numbered claim ticket that only works at its own counter.
DPoP is a cheque that also needs your signature: a stolen cheque without the pen that signs it is paper.
"""
scenario = """
A single-page banking app at app.bank.example calls an API at api.bank.example. The demo models a page and what an injected script can reach, a small BFF, an authorization server's token table, and a resource API that accepts
bearer tokens and DPoP-bound tokens. DPoP proofs use real ES256 (P-256) signatures from the JDK.
"""
costs = [
    "**A BFF is another server to run,** with sessions to store, expire and revoke, and it sits on the path of every API call.",
    "**A BFF does not fix XSS.** While the page is open, an injected script can still make requests through the session; the cookie only stops the script from carrying the token away.",
    "**A BFF needs CSRF protection** because it uses cookies: the origin check and the custom header here are examples.",
    "**DPoP needs a key the script cannot export** (a non-extractable WebCrypto key), or XSS can copy the key as easily as the token. Even then, an injected script can ask the key to sign while the page is open.",
    "**DPoP adds a signature to every request and a replay cache to the API,** and clock and nonce handling to get right.",
]
too_much = """
If the app is server-rendered, with its own session cookie and no token in the browser, there is nothing to protect in storage. For a small internal tool, a BFF may be the simplest sound choice. DPoP matters most when tokens must reach
the browser, or when tokens pass through places that log them.
"""
met_before = [
    "`localStorage.setItem('access_token', ...)` in single-page app tutorials.",
    "The advice \"never store tokens in localStorage\" and the argument over cookies versus storage.",
    "`Authorization: DPoP ...` and a `DPoP:` header in newer OAuth libraries.",
    "A BFF (backend for the frontend) in the OAuth working group's browser-apps guidance.",
]
where = """
This project is in [identity-and-access](..) and builds on [oauth2-authorization-code-pkce](../oauth2-authorization-code-pkce) and [openid-connect](../openid-connect), which get the tokens; here the question is where they live afterwards.
It relies on [session-management](../../api-security/session-management) for the cookie and [cross-site-scripting](../../web-security/cross-site-scripting) for how a script gets onto the page.
"""
twin = """
The page, its storage and its cookies are a small Java model that follows the rule that matters: scripts read web storage and non-HttpOnly cookies, and the browser attaches HttpOnly cookies to requests without showing them.
The DPoP proofs are real: ES256 over P-256, JWK thumbprints per RFC 7638, and the checks in RFC 9449 (typ, alg, key, method, address, time, token hash, replay).
"""
test_note = "Tokens, session ids and keys are random, so the demo prints only statuses and messages."

[[act]]
title = "A token in local storage"
summary = "The app stores its access token in local storage and calls the API with it: 200."
detail = """
After sign-in the app keeps the access token in localStorage and sends it as a bearer token. The API answers 200 with Ana's balance. It is the simplest design, and every tutorial shows it.
"""
speech = """
First demo: a token in local storage. [[slnc 400]] The app keeps its token in web storage, and sends it with each call. [[slnc 300]] It works, and it is the simplest design.
"""
rows = { storage = "active ok" }
console = [
    ["the app calls the API with its token -> 200 balance of ana: 125000 cents", "ok"],
]

[[act]]
title = "One injected script takes the token away"
summary = "A script injected into the page reads localStorage and sends the token to the attacker, who uses it from their own computer: 200."
detail = """
An injected script (cross-site scripting, or a compromised third-party library) can read everything in web storage. It copies the access token to its owner. The attacker's own computer presents it as a bearer token and the API answers 200,
because a bearer token is accepted from whoever holds it. Closing the page does not help: the token is already gone.
"""
speech = """
Second demo: one injected script takes the token away. [[slnc 400]] A script on the page can read everything in web storage. [[slnc 300]] It copies the token to the attacker. [[slnc 600]]
The attacker's own computer uses it, and the api answers. [[slnc 300]] A bearer token is accepted from whoever holds it.
"""
rows = { steal = "active wrong" }
console = [
    ["what the injected script can read -> [localStorage.access_token]", "bad"],
    ["the attacker's own computer uses it -> 200 balance of ana: 125000 cents  <- NO KEY, NO PAGE, STILL WORKS", "bad"],
]

[[act]]
title = "A backend for the frontend keeps the token"
summary = "The script finds nothing to read; the attacker's computer gets 401; a cross-site form post gets 403; the script can still use the session while the page is open; sign-out kills the cookie."
detail = """
The BFF signs Ana in, keeps the access token in its own memory and gives the page only an HttpOnly session cookie. The injected script reads nothing: the list of what it can steal is empty. The attacker's computer, with no cookie, gets 401.
A form post from evil.example carries the cookie but not the app's origin or custom header, so the BFF refuses it with 403. The honest limit: a script running in the page can still call the BFF through the browser while the page is open,
so XSS still has to be fixed. After sign-out the same cookie is dead.
"""
speech = """
Third demo: a backend for the frontend keeps the token. [[slnc 400]] The browser holds only a session cookie that scripts cannot read. [[slnc 300]] The injected script finds nothing to steal. [[slnc 600]]
The attacker's computer has no cookie, and is refused. [[slnc 300]] A form post from another site is refused too. [[slnc 600]]
The honest limit: a script in the page can still use the session while the page is open. [[slnc 300]] So the cross-site scripting bug must still be fixed.
"""
rows = { bff = "active ok", ride = "active amber" }
console = [
    ["what the injected script can read -> []", "ok"],
    ["the attacker's computer with no cookie -> 401 not signed in", "ok"],
    ["a form post from evil.example (cookie) -> 403 cross-site request refused", "ok"],
    ["the script rides the session in the page -> 200 ...  <- WHILE THE PAGE IS OPEN", "amber"],
    ["after sign-out, the same cookie -> 401 not signed in", "ok"],
]

[[act]]
title = "A token that needs the key as well (DPoP)"
summary = "A bound token works only with a fresh proof signed by its own key: replays, bearer use, no proof, another key, another method and old proofs are all 401; the real key gets 200."
detail = """
The app makes an ES256 key pair, and the authorization server binds the token to the key's thumbprint. Each call carries `Authorization: DPoP token` and a proof: a signed statement of the method, address, time, a unique id and the token's hash.
The API checks the signature, the key against the token's binding, the method, the address, the time window and the token hash, and remembers each proof id. The honest call gets 200. The same proof again is "already used". The stolen token as a bearer token
is refused, the token without a proof is refused, a proof from the attacker's own key is "signed with another key", a proof for a transfer cannot be used for a balance, and a proof saved for later is too old. A fresh proof from the real key works.
"""
speech = """
Fourth demo: a token that needs the key as well. [[slnc 400]] The token is bound to a key made in the browser. [[slnc 300]] Each call carries a small signed proof, for that method, address and time. [[slnc 600]]
A stolen token as a bearer token is refused. [[slnc 300]] With no proof, refused. [[slnc 300]] With a proof from another key, refused. [[slnc 600]]
A proof used twice, a proof for another request, and an old proof are all refused. [[slnc 300]] Only the real key, with a fresh proof, gets in.
"""
rows = { dpop = "active ok" }
console = [
    ["the app: token + a proof from its key -> 200 balance of ana: 125000 cents", "ok"],
    ["the same proof sent again (replay) -> 401 proof already used", "ok"],
    ["the stolen token as a bearer token -> 401 this token needs a proof of possession", "ok"],
    ["the stolen token, a proof from their key -> 401 proof was signed with another key", "ok"],
    ["a proof meant for a transfer / saved for later -> 401", "ok"],
    ["a fresh proof from the real key -> 200", "ok"],
]

