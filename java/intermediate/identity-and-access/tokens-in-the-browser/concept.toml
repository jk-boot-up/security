[[act]]
title = "A backend for the frontend keeps the tokens on the server"
summary = "The BFF signs Ana in on the server and gives the browser one __Host- cookie (Secure, HttpOnly, SameSite=Strict); the script takes 0 tokens; it can still read the balance while the page is open, and nothing after it closes."
detail = """
The BFF signs Ana in on the server; the browser gets one cookie, __Host-bff, with Path=/, Secure, HttpOnly and SameSite=Strict, which keeps the __Host-
rules. The BFF holds the 2 tokens and the browser never sees them. The app reads the balance through the BFF: 200. The same third-party script now takes
0 tokens, and cannot read the cookie. While the page is open it can still ask the BFF for the balance: 200, because a script on the page can still act as
Ana. Once the page is closed, the script is no longer running, and nothing it took works anywhere else. Six minutes later the BFF refreshes the token on the
server without the browser noticing: 200.
"""
speech = """
Second demo: a backend for the frontend. [[slnc 400]] Now the O Auth client lives on a server. [[slnc 300]] It signs Ana in, and keeps the tokens itself. [[slnc 600]]
The browser gets one cookie. [[slnc 300]] Secure, H T T P only, same site strict, with the host prefix. [[slnc 600]]
The same third party script reads what scripts can read. [[slnc 300]] It takes nothing. [[slnc 600]]
While the page is open, it can still ask the server for Ana's balance. [[slnc 300]] A script on the page can still act as Ana. [[slnc 600]]
But once the page is closed, nothing it took works anywhere else. [[slnc 300]] And when the access token expires, the server refreshes it, out of reach.
"""
rows = { bff = "active ok" }
console = [
    ["the BFF signs Ana in on the server; the browser gets one cookie: __Host-bff; Path=/; Secure; HttpOnly; SameSite=Strict", "ok"],
    ["the cookie keeps the __Host- rules: true, and the BFF holds 2 tokens the browser never sees", "ok"],
    ["the same third-party script reads what scripts can read: 0 tokens taken, and the cookie is not readable", "ok"],
    ["while the page is open, the script can still ask the BFF for the balance: 200  <- A SCRIPT ON THE PAGE CAN STILL ACT AS ANA", "amber"],
    ["once the page is closed: the script is no longer running, and nothing it took works anywhere else", "ok"],
]

[[act]]
title = "Requests started by another site"
summary = "A hidden form on evil.example gets 401 because SameSite=Strict keeps the cookie off; an older browser sends the cookie but not the request header, so 403; adding the header needs a preflight the BFF refuses; one transfer is made, the bank's own."
detail = """
A cookie that is sent automatically invites cross-site request forgery. A hidden form on evil.example posts a transfer to the BFF, and SameSite=Strict keeps
the cookie off it: 401. In an older browser that ignores SameSite, the cookie goes, but the bank's request header does not: 403. A script on evil.example
that tries to add the header itself must first ask in a CORS preflight, which the BFF refuses for every other origin, so the request is never sent. The
bank's own page sends the transfer with the header: 201. Transfers made: 1, the one the bank's own page asked for.
"""
speech = """
Third demo: requests started by another site. [[slnc 400]] A cookie that is sent automatically invites forged requests. [[slnc 600]]
A hidden form on another site posts a transfer. [[slnc 300]] Same site strict keeps the cookie off it. [[slnc 600]]
An older browser sends the cookie anyway. [[slnc 300]] But not the bank's own request header, so it is refused. [[slnc 600]]
And a script on the other site cannot add that header, because the browser asks first, and the server says no. [[slnc 600]]
One transfer is made: the one the bank's own page asked for.
"""
rows = { csrf = "active ok" }
console = [
    ["a hidden form on evil.example posts a transfer to the BFF; SameSite=Strict keeps the cookie off it: 401 (not signed in)", "ok"],
    ["in an older browser that ignores SameSite, the cookie goes, but the bank's request header does not: 403", "ok"],
    ["a script on evil.example tries to add the header itself: never sent: the browser's preflight was refused", "ok"],
    ["the bank's own page sends the transfer with the header: 201", "muted"],
    ["transfers made: 1, and only the one the bank's own page asked for", "ok"],
]

[[act]]
title = "Tokens bound to a key, with DPoP"
summary = "The token carries the browser key's thumbprint; with a fresh proof it works; as a plain bearer token, with another key's proof, replayed, for another request or two minutes late it is refused; a bound refresh token works only with the app's key."
detail = """
When tokens must be in the browser, DPoP binds them to a key that scripts cannot read: the access token carries the key's thumbprint in cnf.jkt, and each
request carries a proof, a small JWT signed by that key, naming the method, the URL, the time, a unique id and the token's hash. With a fresh proof: 200.
A script that takes the token from localStorage and sends it as a plain bearer token: 401. With a proof from a key of its own: 401, the key does not match.
The app's own request copied and sent again: 401, the proof was already used. The proof for reading the balance used for a transfer: 401. A proof made two
minutes ago, with the token still valid: 401, too old. The stolen refresh token with the thief's key is refused; presented by the app with its own key, it
gives new tokens. A stolen token is useless without the key, and the key never leaves the browser.
"""
speech = """
Fourth demo: tokens bound to a key, with D Pop. [[slnc 400]] The browser holds a key that scripts cannot read. [[slnc 300]] The access token carries the key's thumbprint. [[slnc 600]]
Every request carries a proof: a small signed token naming the method, the address, the time, a unique id, and the access token's hash. [[slnc 600]]
A script takes the access token and sends it on its own. [[slnc 300]] Refused. [[slnc 300]] With a proof from its own key. [[slnc 300]] Refused. [[slnc 600]]
A copied request sent again is refused, because each proof is used once. [[slnc 300]] A proof for one request does not work for another, and an old proof is too old. [[slnc 600]]
A stolen token is useless without the key. [[slnc 300]] And the key never leaves the browser.
"""
rows = { dpop = "active ok" }
console = [
    ["the app sends the token with a fresh proof signed by its key: 200", "ok"],
    ["a script takes the token from localStorage and sends it as a plain bearer token: 401 (this token is bound to a key: a DPoP proof is required)", "ok"],
    ["with a proof from a key of its own: 401 (the proof's key is not the key the token is bound to)", "ok"],
    ["the app's own request copied and sent again: 401 (the proof was already used)", "ok"],
    ["a proof made two minutes ago, with the token still valid: 401 (the proof is too old)", "ok"],
    ["the stolen refresh token with the thief's key: refused", "ok"],
]

[[act]]
title = "The bill"
summary = "A second BFF with its own store answers Ana's cookie with 401; every call takes one more hop; a cleared browser loses its DPoP key and Ana signs in again; and a script on the open page can still use the key."
detail = """
Two BFF servers, each with its own session store: the second answers Ana's cookie with 401, so the sessions need a shared store. Every API call now passes
through one more server, which must be run, scaled and kept up to date. Clearing the browser's storage loses the DPoP key; the old token with a new key is
refused, so Ana signs in again. And a script on the open page can still ask the key for a proof and read the balance: 200. DPoP stops theft, not use while
the page is open. So keep scripts off the page with a strict Content-Security-Policy, and keep tokens out of it with the BFF.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] Two backend servers, each with its own session store. [[slnc 300]] The second does not know Ana's cookie. [[slnc 300]] So the sessions need a shared store. [[slnc 600]]
Every call now passes through one more server, which must be run and kept up to date. [[slnc 600]]
Clearing the browser's storage loses the D Pop key, and Ana signs in again. [[slnc 600]]
And a script on the open page can still ask the key for a proof. [[slnc 300]] D Pop stops theft, not use while the page is open. [[slnc 600]]
So keep scripts off the page, and keep tokens out of it.
"""
rows = { bill = "active amber" }
console = [
