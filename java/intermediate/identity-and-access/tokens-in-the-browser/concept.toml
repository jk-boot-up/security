package = "bff"
main_class = "BffDemo"
tagline = "Keep tokens out of the page, and bind the rest to a key"
bold = "A single-page app that keeps OAuth tokens in the browser hands them to every script on the page. A backend for the frontend keeps them on the server and gives the browser only an HttpOnly cookie, and DPoP binds a token to a key that never leaves the browser, so a stolen token is useless on its own."
domain = "an online bank"
domain_note = ""
youtube_description = """Where should a single-page app keep its OAuth tokens? In Java with only the JDK, explained with an online bank's banking app, like a hotel guest who leaves the room key on the restaurant table instead of at reception. We put the access and refresh tokens in localStorage and let a third-party script on the page read them and use the refresh token ten days later, move the OAuth client to a backend for the frontend that keeps the tokens on the server and gives the browser only a __Host- cookie, stop requests started by another site with SameSite and a request header, bind tokens to a browser key with DPoP so a stolen token is refused without a fresh proof, and finish with the bill: one more server to run, a shared session store, and a script on the open page that can still act as the user. Checked against the RFC 8037 thumbprint example."""
