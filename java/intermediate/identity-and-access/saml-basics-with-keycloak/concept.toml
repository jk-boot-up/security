key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Try the first exercise", "in docs/session.md."]
narration = "That's SAML with Keycloak. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] A SAML service provider believes a statement only if the identity provider's own key signed it, the shop asked for it, it is for this shop, and it is still current. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Make the shop reload the identity provider's metadata every hour and test the rotation again. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"
