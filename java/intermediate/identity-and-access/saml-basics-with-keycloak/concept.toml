[docs.session]
objectives = [
    "name the parts of a SAML response and which are signed",
    "explain why a valid signature is not enough",
    "list the checks on the statement itself",
    "plan a key rotation with a service provider that reads metadata once",
]
walkthrough = """
Run act two and ask what the shop compares the signature with. In act four ask what a replay would need to succeed. In act five ask who must be told before the bank rotates its key.
"""
exercises = [
    "Make the shop reload the identity provider's metadata every hour and test the rotation again.",
    "Make the bank sign the authentication request too, and register the shop's certificate.",
    "Add single logout and test that one sign-out reaches both sides.",
    "Map the attributes of the assertion to the shop's roles and test a role that the bank did not send.",
]

[docs.explained]
sentence = """
A SAML service provider believes a statement only if the identity provider's own key signed it, the shop asked for it, it is for this shop, and it is still current.
"""
verdict = """
Use a maintained library, trust only the key in the identity provider's metadata, read only the signed assertion, keep each request single-use, check the audience and the dates, refuse a DOCTYPE, and plan key rotation with the shop's metadata reload.
"""
recognise = [
    "`saml2Login()` and `assertingparty.metadata-uri` in a Spring Boot application.",
    "A `SAMLResponse` field in a browser's network tab.",
    "`invalid_signature` or `invalid_in_response_to` in a log.",
    "A metadata file with an `X509Certificate`.",
]

[spec]
purpose = """
Teach what a SAML service provider must check, with a real library and a real identity provider.
"""
nongoals = [
    "Single logout.",
    "Encrypted assertions.",
    "Running an identity provider in production.",
]
problem = """
Teams add SAML single sign-on with a library and never find out which attacks the library stops and which operational risks it leaves.
"""
roles = [["The identity provider", "`KeycloakLab`, `infra/*-realm.json`"], ["The shop", "`ShopApp`, `ShopSecurity`, `ShopController`, `Refusals`"], ["The browser", "`Shopper`"], ["The attacker's tools", "`SamlTools`"], ["Entry point", "`SamlKeycloakDemo`"]]
requirements = [
    "The shop signs a shopper in only for a response signed by the key in the bank's metadata.",
    "An edited, self-signed, wrapped, unsigned or foreign-signed response is refused.",
    "A DOCTYPE is refused.",
    "A response is accepted once, for the request the shop made.",
    "An expired assertion and one for another audience are refused.",
    "A key rotation at the identity provider is an outage until the metadata is read again.",
    "The demo prints the same output on every run.",
]

