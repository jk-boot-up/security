[threatmodel]
scope = """
A SAML 2.0 service provider in Spring Security against one identity provider. It covers the response, its signatures, the statement's request, audience and dates, and the provider's key rotation. It does not cover single logout or the provider's own security.
"""
assets = [
    "The shoppers' identities at the shop.",
    "The bank's signing key.",
]
actors = [
    "A shopper, who carries the messages.",
    "An attacker who can post any XML to the shop's address.",
    "The bank's operator, who rotates keys.",
]
boundaries = [
    "The browser to the shop: the SAMLResponse is untrusted until checked.",
    "The metadata: where the shop learns the bank's key.",
]
assumptions = [
    "The metadata is fetched over a trusted channel.",
    "The bank's private key is not stolen.",
]
out_of_scope = [
    "Compromise of the bank.",
    "Encrypted assertions.",
]
tests = [
    "`SamlFlowTest` starts a real Keycloak and the shop and checks the genuine sign-in, the signatures, the request, an edited name, a self-signed response, an unsigned one, wrapping in both orders, a DOCTYPE, replay, another audience, an expired assertion and a wallet response.",
    "`SamlToolsTest` and `RealmFilesTest` check the attacker's tools and the realm files without Docker.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
This is the last project of the identity-and-access module; the next module is tls-in-practice.
"""

[[threat]]
id = "T1"
stride = "S"
threat = "A forged or edited response signs the attacker in as someone else"
where = "signature validation"
control = "Trust only the key in the identity provider's metadata, and require every assertion to be signed by it"
residual = "A stolen signing key"

[[threat]]
id = "T2"
stride = "S"
threat = "Signature wrapping makes the shop read an unsigned assertion"
where = "assertion selection"
control = "A maintained library that validates every assertion it reads"
residual = "A library bug"

[[threat]]
id = "T3"
stride = "S"
threat = "A genuine response is replayed, or is meant for another shop or time"
where = "InResponseTo, audience and dates"
control = "A single-use request, an exact audience and a short validity"
residual = "Clock skew set too wide"

[[threat]]
id = "T4"
stride = "D"
threat = "A key rotation at the identity provider refuses every shopper"
where = "the shop's metadata"
control = "Reload metadata on a schedule and before a rotation, and announce rotations"
residual = "The hours between a rotation and a reload"

[poster]
headline = [["SAML WITH", "text"], ["KEYCLOAK", "accent"]]
taglines = [["Only the bank's key, only what it signed", "gold"]]
before = { code = "any valid signature", note = "self-signed, wrapped, replayed", tag = "BEFORE" }
after = { code = "saml2Login() + metadata key", note = "refused, each with a reason", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "SAML Basics with Keycloak"
narration = "Hello, and welcome. [[slnc 400]] This video explains SAML single sign on, with Spring Security and Keycloak, in Java. [[slnc 300]] SAML is the security assertion markup language. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] With SAML, a shop lets its shoppers sign in at their bank, and the bank sends back a signed X M L statement that says who they are. [[slnc 300]] Spring Security trusts only the key in the bank's published metadata, and checks that the statement answers the shop's own request, is for this shop, and is still current. [[slnc 300]] The cost is that a new key at the bank must reach the shop before the bank signs with it. [[slnc 600]] Think of a letter of introduction. [[slnc 300]] A seal proves nothing unless it is the bank's seal, on this letter, addressed to you. [[slnc 600]] Our example is an online shop that signs shoppers in through their bank."

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online shop signs shoppers in", "through the bank's SAML identity provider.", "", "The demo starts a real Keycloak in Docker,", "with a bank and a wallet,", "and the real shop on Spring Boot.", "", "Ana signs in; then every kind of forged,", "replayed or misdirected response is posted."]
narration = "Here is the scenario. [[slnc 400]] An online shop signs its shoppers in through their bank's SAML identity provider. [[slnc 500]] The demo starts a real Keycloak in Docker, with a bank and a wallet, and the real shop on Spring Boot. [[slnc 500]] Ana signs in. [[slnc 300]] Then the demo posts to the shop every kind of response an attacker, or an accident, could produce: edited, forged, wrapped, replayed, and addressed to someone else."

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["Identity provider: the bank, in Keycloak", "Service provider: the shop, on Spring Security", "Assertion: the signed statement, this is Ana", "Metadata: the bank's address and signing key", "Realm: one identity provider inside Keycloak"]
narration = "Before the demos, the words. [[slnc 500]] The identity provider is the bank, running in Keycloak. [[slnc 500]] The service provider is the shop, on Spring Security. [[slnc 500]] The assertion is the signed statement: this is Ana. [[slnc 500]] Metadata is the document where the bank publishes its address and its signing key. [[slnc 500]] And a realm is one identity provider inside Keycloak: here, the bank, and the wallet."

[[scene]]
key = "03-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "03-trust"
kind = "figure"
title = "One key the shop trusts"
body = "trust_anchor"
narration = """Let's see the whole idea on one picture. [[slnc 400]] When the shop starts, it reads the bank's metadata, and takes one key from it. [[slnc 600]] Then three responses arrive, each with a valid X M L signature. [[slnc 300]] The bank's own response: its key is the metadata key, so Ana is signed in. [[slnc 500]] The attacker's response, signed with the attacker's own key: refused. [[slnc 500]] A genuine response from the wallet, signed by the wallet's key: refused too. [[slnc 600]] A signature is only worth the key behind it, and the shop believes exactly one key."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "04-costs"
kind = "bullets"
title = "What It Costs"
body = ["XML signatures are subtle; keep the library patched", "Metadata is read once, at start-up here", "Clocks and assertion lifetimes must agree", "Every shop must be registered at the bank", "Single logout is a second protocol"]
narration = "Nothing is free. [[slnc 400]] Here is what it costs. [[slnc 500]] X M L signatures are subtle, so the library must be kept patched. [[slnc 500]] In this set up, the bank's metadata is read once, at start up. [[slnc 500]] The clocks, and the lifetime of each assertion, must agree between the bank and the shop. [[slnc 500]] Every shop must be registered at the bank. [[slnc 300]] And signing out everywhere is a second protocol, with its own checks."

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Signing in to a work or shop site at another site", "A SAMLResponse field in the browser's network tab", "A metadata file with an X509Certificate", "Everyone locked out after a certificate change"]
narration = "You have probably met this already. [[slnc 400]] Being sent to another site to sign in, and then back, at work or at a shop, is often SAML. [[slnc 500]] A SAML response field, in the browser's network tab, is the signed statement on its way. [[slnc 500]] A metadata file with an X 5 0 9 certificate in it is the key the shop trusts. [[slnc 500]] And everyone locked out after a certificate change is the key rotation from the last demo."

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "How To Use It"
body = ["A maintained SAML library, kept patched", "Trust only the key in the bank's metadata", "Read only the signed assertion", "Each request answered once", "Check the audience and the dates", "Refuse a DOCTYPE; plan key rotation"]
narration = "So, how do you use it? [[slnc 400]] Use a maintained SAML library, and keep it patched. [[slnc 500]] Trust only the key in the identity provider's metadata. [[slnc 300]] Read only the assertion that key signed. [[slnc 500]] Let each request of the shop be answered once. [[slnc 300]] Check the audience and the dates. [[slnc 500]] Refuse any doc type. [[slnc 300]] And plan key rotation, so the shop reads the new metadata before the bank signs with the new key."

[[scene]]
key = "07-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Reload the bank's metadata", "every hour and test the rotation again."]
narration = "That's SAML with Spring Security and Keycloak. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] A SAML service provider believes a statement only if the identity provider's own key signed it, the shop asked for it, it is for this shop, and it is still current. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine, with Docker. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Make the shop reload the bank's metadata every hour, and test the key rotation again. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] Keycloak runs in Docker; the shop is a real Spring Boot application in the same Java process as the demo. [[slnc 300]] Here are the classes that matter."""

[[class]]
name = "Running"
what = "starts the shop, pointed at the bank's metadata"
[[class.part]]
title = "the one key the shop trusts"
code = """
registration + "entity-id=http://127.0.0.1:" + port + ENTITY_PATH,
registration + "assertingparty.metadata-uri=" + keycloak.metadata(realm),
registration + "assertingparty.singlesignon.sign-request=false"};
"""
speech = """The shop is configured with its own entity I D, and with the address of the bank's metadata. [[slnc 300]] Spring Security reads the bank's signing certificate from there, once, when the shop starts. [[slnc 300]] That is the only key it trusts."""

[[class]]
name = "ShopSecurity"
what = "Spring Security's SAML 2.0 login, on OpenSAML"
[[class.part]]
title = "a tight clock, and a reason for every refusal"
code = """
Duration skew = Duration.ofSeconds(skewSeconds);
validator.setValidationContextParameters(p ->
        p.put(SAML2AssertionValidationParameters.CLOCK_SKEW, skew));
...
String code = exception instanceof Saml2AuthenticationException s
        ? s.getSaml2Error().getErrorCode()
        : exception.getClass().getSimpleName();
refusals.add(code);
"""
speech = """The open SAML provider does the checking. [[slnc 300]] The shop allows one second of clock difference, instead of the default five minutes. [[slnc 300]] Every refusal keeps its reason, such as invalid signature, for the log."""

[[class]]
name = "SignatureByHand"
what = "a teaching class: each signature checked with the plain JDK"
[[class.part]]
title = "the digest, then RSA with the metadata key"
code = """
byte[] digest = MessageDigest.getInstance("SHA-256").digest(canonical);
boolean digestMatches = MessageDigest.isEqual(digest, ref.getDigestValue());
...
Signature rsa = Signature.getInstance("SHA256withRSA");
rsa.initVerify(key);
rsa.update(readAll(sig.getSignedInfo().getCanonicalizedData()));
boolean rsaVerifies = rsa.verify(sig.getSignatureValue().getValue());
"""
speech = """This class redoes, by hand, what open SAML does with each signature. [[slnc 300]] It hashes the signed element again, and verifies signed info with R S A and the key from the bank's metadata. [[slnc 300]] The shop never uses it: it only lets the demo print each step."""

[[class]]
name = "SamlTools"
what = "the attacker's tools: edit, strip, wrap and re-sign"
[[class.part]]
title = "a valid signature, with the attacker's key"
code = """
KeyValue publicKey = keyInfoFactory.newKeyValue(key.getPublic());
KeyInfo keyInfo = keyInfoFactory.newKeyInfo(List.of(publicKey));
...
factory.newXMLSignature(signedInfo, keyInfo).sign(context);
"""
speech = """The attacker's tools sign an element correctly, with the attacker's own key, and put that public key into key info. [[slnc 300]] The X M L is perfectly valid. [[slnc 300]] It is refused only because the key is not the bank's."""

[[class]]
name = "KeycloakLab"
what = "starts Keycloak in Docker, and rotates the bank's key"
[[class.part]]
title = "a new signing key, with a higher priority"
code = """
URI components = URI.create(base() + "/admin/realms/" + realm + "/components");
...
.POST(HttpRequest.BodyPublishers.ofString(body)).build();
return http.send(create, HttpResponse.BodyHandlers.discarding()).statusCode();
"""
speech = """For the last demo, the lab adds a new R S A key to the bank's realm, with a higher priority. [[slnc 300]] Keycloak signs with it at once. [[slnc 300]] The shop still holds the old key, so every shopper is refused until it reads the metadata again."""

[[acronym]]
short = "SAML"
long = "Security Assertion Markup Language: signed sign-in statements in XML"
say = "SAML is the security assertion markup language: the bank's signed statement about who signed in, written in X M L."
[[acronym]]
short = "XML"
long = "Extensible Markup Language: nested elements in angle brackets"
say = "X M L is the extensible markup language: text made of nested elements in angle brackets."
[[acronym]]
short = "SSO"
long = "Single Sign-On: sign in once, at the bank, for many sites"
say = "S S O is single sign on: you sign in once, at the bank, and many sites accept it."
[[acronym]]
short = "IdP"
long = "Identity Provider: the bank's realm in Keycloak"
say = "I d P is the identity provider. Here, the bank's realm in Keycloak."
[[acronym]]
short = "SP"
long = "Service Provider: the shop, on Spring Security"
say = "S P is the service provider. Here, the shop, on Spring Security."
[[acronym]]
short = "ID"
long = "identifier: of a request, an element or a shop (entity id)"
say = "I D is an identifier: of a request, of an element, or of the shop itself, its entity I D."
[[acronym]]
short = "SHA-256"
long = "Secure Hash Algorithm, 256 bits: the digest of a signed element"
say = "S H A two fifty six is the secure hash algorithm with two hundred and fifty six bits. It makes the digest of a signed element."
[[acronym]]
short = "RSA"
long = "Rivest, Shamir, Adleman: the public-key signature the bank uses"
say = "R S A is named after Rivest, Shamir and Adleman. It is the public key signature the bank uses."
[[acronym]]
short = "X.509"
long = "the standard format of the certificate in the metadata"
say = "X 5 0 9 is the standard format of a certificate. The bank's metadata carries its key in one."
[[acronym]]
short = "c14n"
long = "canonicalization: one exact form of the XML"
say = "C fourteen N is short for canonicalization: writing the X M L in one exact form, so the same document always gives the same bytes."
[[acronym]]
short = "DOCTYPE"
long = "document type declaration: can define entities; refused"
say = "A doc type is a document type declaration. It can define entities that read files, so the shop refuses it."
[[acronym]]
short = "HTTP"
long = "Hypertext Transfer Protocol: 201 means created"
say = "H T T P is the hypertext transfer protocol. Status two oh one means created."
[[acronym]]
short = "JDK"
long = "Java Development Kit"
say = "J D K is the Java development kit."

