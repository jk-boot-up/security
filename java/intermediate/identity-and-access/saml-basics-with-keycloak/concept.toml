narration = "So, how do you use it? [[slnc 400]] Use a maintained library, trust only the key in the identity provider's metadata, read only the signed assertion, keep each request single-use, check the audience and the dates, refuse a DOCTYPE, and plan key rotation with the shop's metadata reload."

