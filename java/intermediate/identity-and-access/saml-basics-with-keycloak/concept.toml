[readme]
intro = """
The plain [saml-basics](../saml-basics) project builds a service provider with a trusting, a pinned and a strict reader. This one uses what a real Spring Boot shop uses: **Spring Security 7**'s `saml2Login()` on **OpenSAML 5**, against a real **Keycloak 26.8** SAML identity provider in Docker. It needs Docker; its tests are tagged `integration`: `./gradlew integrationTest`.

What it shows:
- **Signing in.** The shop's authentication request (unsigned, from the shop's entity id, naming its assertion consumer address) goes to the bank; Ana signs in there; the bank's response is signed as a whole and its assertion is signed on its own (2 signatures), answers the shop's request, is addressed to the shop and is for the shop's entity id only.
- **A valid signature is not the bank's signature.** The name edited to `admin`, a response **self-signed with a valid key of the attacker's**, and a **genuine response from the wallet realm**, signed by the wallet, are all refused with `invalid_signature`: the shop trusts the key in the bank's metadata and no other.
- **Signature wrapping.** An unsigned admin assertion before or after the bank's signed one, no signature at all, and a response with a DOCTYPE that reads a file are refused (`invalid_signature`, `malformed_response_data`).
- **The statement itself.** A response replayed from another browser or the same one (`invalid_in_response_to`: the shop's request is used once), an assertion four seconds old when it lasts two (`invalid_assertion`), and a response the bank signed for **another shop** (`invalid_assertion`, the audience).
- **The bill.** The shop reads the bank's metadata when it starts. When the bank adds a signing key, **every shopper is refused** (`invalid_signature`) until the shop restarts and reads the metadata again.

**Maps to:** OWASP Top 10 (2025) A07 Authentication Failures · OASIS SAML 2.0 Core, Bindings and Profiles · CWE-347, CWE-611 (XXE), CWE-290 · XML Signature Wrapping.
"""
analogy = """
A passport control that checks the stamp, not the passport's owner's story. The stamp must be from the country the officer was told to trust, on the page the officer is reading, for this border, today. A beautiful stamp from another country, or a real stamp on another page, is still no entry.
"""
scenario = """
A shop signs shoppers in through the bank's SAML identity provider. The demo starts a real Keycloak with the bank and wallet realms and the real shop, signs Ana in, and then posts to the shop every kind of response an attacker or an accident could produce.
"""
costs = [
    "**XML signatures are subtle,** so the shop depends on a library and on patching it.",
    "**Metadata is read once at startup in this configuration,** so a key rotation at the bank is an outage at the shop unless the shop reloads in time.",
    "**Clock skew and assertion lifetimes need agreeing,** or real shoppers are refused.",
    "**Every shop must be registered** at the bank with its entity id and exact address.",
    "**Single logout is a second protocol** that has to be set up on both sides, and is not covered here.",
]
too_much = """
A new application with a choice should use OpenID Connect, which is simpler. SAML is for the partners and products that only speak it.
"""
met_before = [
    "An XML blob with `<saml2p:Response>` in a browser's network tab.",
    "`saml2Login()` in a Spring Security configuration.",
    "An identity provider's metadata file with an `X509Certificate`.",
    "An error such as \"Invalid InResponseTo\" or \"Invalid signature\" after a key change.",
]
where = """
This is the tools version of [saml-basics](../saml-basics), in the [identity-and-access](..) module. It follows the same four attacks and adds the key rotation, against a real identity provider.
"""
twin = """
Keycloak is a real container bound to 127.0.0.1 on a free port, with a bank realm and a wallet realm imported from infra/ and the shop's port written into a temporary copy. The shop is a real Spring Boot application. The browser keeps cookies and submits the pages' automatic forms. The attacker's changes use the JDK's own XML and XML signature tools. Ports, ids, keys and signatures are never printed.
"""
test_note = "The tests that need Keycloak are tagged integration and share one container and one shop per class (./gradlew integrationTest). The attacker's tools and the realm files are tested without Docker."

[[act]]
title = "Signing in through the bank"
summary = "The shop sends an unsigned authentication request; the bank answers with a response signed as a whole and an assertion signed on its own, for this shop and this request only."
detail = """
The shop sends the shopper to the bank with an authentication request from the shop's entity id, naming its assertion consumer address, unsigned, with an id of its own. Ana signs in at the bank, never at the shop. The bank answers with a response signed as a whole and an assertion signed on its own: 2 signatures. The response answers the shop's request, is addressed to the shop's address and comes from the bank's realm. The assertion names ana, is for the shop's entity id only, and lasts seconds. The shopper's browser posts it to the shop and she is signed in as ana, with her e-mail address.
"""
speech = """
First demo: signing in through the bank. [[slnc 400]] The shop sends the shopper to the bank with an authentication request. [[slnc 600]]
Ana signs in at the bank, never at the shop. [[slnc 600]]
The bank answers with a signed response and a signed assertion, for this shop and this request. [[slnc 600]]
The browser posts it to the shop, and she is signed in.
"""
rows = { signin = "active ok" }
console = [
    ["the response and the assertion are both signed: 2 signatures", "ok"],
    ["the response answers the shop's request", "ok"],
    ["the assertion is for the shop's entity id only", "ok"],
    ["the shop signs ana in", "ok"],
]

[[act]]
title = "A valid signature is not the same as the bank's signature"
summary = "An edited name, a response self-signed with a valid key of the attacker's, and a genuine response signed by the wallet are all refused as invalid_signature."
detail = """
The bank's response with the name edited to admin is refused: invalid_signature. Admin, signed correctly with the attacker's own key, two valid XML signatures, is refused: invalid_signature. A genuine response from the wallet, signed by the wallet and answering the shop's own request, is refused: invalid_signature. The shop trusts the key in the bank's metadata, and no other key, however valid the signature.
"""
speech = """
Second demo: a valid signature is not the bank's signature. [[slnc 400]] A name edited to admin breaks the signature. [[slnc 600]]
Admin, signed with the attacker's own key, is a valid signature, but not the bank's. [[slnc 600]]
A genuine response from the wallet is refused too. [[slnc 300]] The shop trusts the key in the bank's metadata, and no other.
"""
rows = { signer = "active ok" }
console = [
    ["the name edited to admin -> refused (invalid_signature)", "ok"],
    ["signed with the attacker's own key -> refused (invalid_signature)", "ok"],
    ["a genuine response from the wallet -> refused (invalid_signature)", "ok"],
]

[[act]]
title = "A valid signature on one assertion, and another one read"
summary = "An unsigned admin assertion beside the bank's signed one, no signature at all, and a DOCTYPE are all refused."
detail = """
With the response unsigned, an admin assertion first and the bank's signed one second, the response is refused: invalid_signature. With the bank's signed assertion first and an admin one second, it is refused too. With no signature anywhere, admin is refused. A response with a DOCTYPE that reads a file is refused as malformed. The shop reads the assertion that a trusted key signed, and only that one; a library does this and is kept patched.
"""
speech = """
Third demo: a valid signature on one assertion, and another one read. [[slnc 400]] An admin assertion before or after the bank's signed one is refused. [[slnc 600]]
No signature at all is refused. [[slnc 600]]
A response with a doc type that reads a file is refused as malformed. [[slnc 300]] A library does this, and is kept patched.
"""
rows = { wrapping = "active ok" }
console = [
    ["an unsigned admin assertion first or second -> refused", "ok"],
    ["no signature anywhere -> refused (invalid_signature)", "ok"],
    ["a DOCTYPE that reads a file -> refused (malformed_response_data)", "ok"],
]

[[act]]
title = "The statement itself is checked"
summary = "A replayed response, an expired assertion and a response signed for another shop are refused even though their signatures are the bank's."
detail = """
A genuine response, first time: signed in as ana. The same response replayed from another browser is refused: invalid_in_response_to, because the shop's request was used up. Replayed from the same browser, it is refused too. A response posted 4 seconds after it was issued, to an assertion that lasts 2, is refused: invalid_assertion. A genuine response the bank signed for another shop is refused: invalid_assertion, because the signature is the bank's and the audience is not this shop. A signature says who wrote the statement; the other checks say whether it is for this shop, this request, now.
"""
speech = """
Fourth demo: the statement itself is checked. [[slnc 400]] A genuine response works once. [[slnc 600]]
Replayed from another browser, or the same one, it is refused, because the shop's request was used up. [[slnc 600]]
An assertion four seconds old, that lasts two, is refused. [[slnc 600]]
And a response the bank signed for another shop is refused, because of its audience.
"""
rows = { statement = "active ok" }
console = [
    ["genuine response, first time -> signed in as ana", "ok"],
    ["replayed -> refused (invalid_in_response_to)", "ok"],
    ["4 seconds old, lasting 2 -> refused (invalid_assertion)", "ok"],
    ["signed for another shop -> refused (invalid_assertion)", "ok"],
]

[[act]]
title = "The bill: keys, metadata and XML"
summary = "The shop reads the bank's metadata once; when the bank adds a signing key every shopper is refused until the shop reads the metadata again."
detail = """
The shop reads the bank's metadata once, when it starts; a sign-in works. The bank adds a new signing key and signs with it from now on; the next sign-in is refused: invalid_signature, and so is every shopper's. The shop restarts and reads the metadata again; the next sign-in works. So a bank that rotates its key needs the shop to reload its metadata first, and a plan for the hours between. XML signatures are hard to get right, which is why the shop uses OpenSAML through Spring Security, and why its patches matter.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] The shop reads the bank's metadata once, when it starts. [[slnc 600]]
The bank adds a new signing key and signs with it. [[slnc 300]] Every shopper is refused. [[slnc 600]]
The shop reads the metadata again, and sign in works. [[slnc 600]]
So a key rotation needs a plan.
"""
rows = { bill = "active ok" }
console = [
    ["the shop reads the metadata once: a sign-in works", "ok"],
    ["the bank adds a signing key -> every shopper refused", "bad"],
    ["the shop reloads the metadata -> works again", "ok"],
]

