[[act]]
title = "Signature wrapping: one assertion checked, another read"
summary = "An unsigned admin assertion placed before the bank's signed one, or after it, no signature at all, and a response with a DOCTYPE are all refused by Spring Security with OpenSAML (invalid_signature, malformed_response_data)."
detail = """
The input: a genuine response with its own signature removed, an unsigned copy of the assertion naming admin put first, and the bank's signed
assertion for ana second. A reader that takes the first assertion would sign in admin; OpenSAML refuses it (invalid_signature), because every
assertion it reads must be signed by the trusted key. Then one thing at a time: the bank's signed assertion first and an unsigned admin one second
(invalid_signature), no signature anywhere with NameID admin (invalid_signature), and a response with a DOCTYPE that reads a file
(malformed_response_data). The shop reads only what a trusted key signed, which is why the library is kept patched.
"""
figure = "wrapping_tree"
figure_title = "A signed assertion, and an unsigned one beside it"
figure_speech = """
Third demo: signature wrapping, against the real library. [[slnc 400]] At the top, the input. [[slnc 300]] The attacker takes a genuine response, removes the response's own signature, and puts an unsigned assertion naming admin in front of the bank's signed one. [[slnc 300]] A careless reader would read the first assertion, and sign in the admin. [[slnc 700]]
On the right, the result: refused. [[slnc 300]] Open SAML reads only assertions the bank's key signed. [[slnc 700]]
At the bottom, the other forgeries, one at a time. [[slnc 300]] The unsigned one placed second. [[slnc 300]] No signature at all. [[slnc 300]] And a doc type that tries to read a file. [[slnc 300]] All refused.
"""
speech = """
Here is the output. [[slnc 400]] The wrapped response: the response's own signature removed, an unsigned admin assertion first, and the bank's signed one second. [[slnc 300]] Refused: invalid signature.
[[page]]
One thing at a time. [[slnc 300]] The admin assertion second: refused. [[slnc 300]] No signature anywhere: refused. [[slnc 300]] A doc type: refused as malformed. [[slnc 400]] The shop reads only what a trusted key signed, so keep the library patched.
"""
rows = { wrapping = "active ok" }
console = [
