[[act]]
title = "The bill: keys, metadata and XML"
summary = "The shop reads the bank's metadata once at start and signs Ana in; the bank adds a new signing key (HTTP 201) and every shopper is refused with invalid_signature until the shop reloads the metadata and signs Ana in again."
detail = """
Before the key change, the shop has read the bank's metadata once, at start, and a sign-in works. The bank adds a new RSA signing key with a higher
priority (HTTP 201) and signs with it from then on: the next sign-in is refused (invalid_signature), and so is every shopper's. After the shop
restarts and reads the metadata again, the next sign-in works. So a key rotation needs the shop to reload the metadata first, and a plan for the
hours between; and because XML signatures are hard, the shop uses OpenSAML through Spring Security, whose patches matter.
"""
figure = "key_rotation"
figure_title = "A key rotation at the bank, seen from the shop"
figure_speech = """
Fifth demo: the bill. [[slnc 400]] On the left, the shop has read the bank's metadata once, at start, and trusts key one. [[slnc 300]] The bank signs with key one. [[slnc 300]] Ana is signed in. [[slnc 700]]
In the middle, the bank adds key two, and signs with it at once. [[slnc 300]] The shop still trusts only key one. [[slnc 300]] Every shopper is refused. [[slnc 700]]
On the right, the shop reloads the metadata, and trusts key two. [[slnc 300]] Ana is signed in again. [[slnc 500]] So rotate keys only after every shop has read the new metadata.
"""
speech = """
Here is the output. [[slnc 400]] Before the key change: signed in. [[slnc 400]] The bank adds a new signing key: H T T P two oh one, created. [[slnc 300]] The next sign-in: invalid signature. [[slnc 300]] Every shopper is refused. [[slnc 400]] After the shop reloads the metadata: signed in. [[slnc 400]] The bill: plan the rotation, and keep the library patched.
"""
rows = { bill = "active wrong" }
console = [
    ["BEFORE THE KEY CHANGE (metadata read once, at start):", "code"],
    ["  a sign-in -> signed in as ana", "ok"],
    ["THE BANK ADDS A NEW SIGNING KEY (HTTP 201) AND USES IT:", "code"],
    ["  the next sign-in -> refused (invalid_signature)", "ok"],
    ["  <- EVERY SHOPPER IS REFUSED", "amber"],
    ["AFTER THE SHOP RELOADS THE BANK'S METADATA:", "code"],
    ["  the next sign-in -> signed in as ana", "ok"],
    ["THE BILL:", "code"],
    ["  a key rotation needs the shop to reload metadata first,", "muted"],
    ["    and a plan for the hours between", "muted"],
    ["  XML signatures are hard: the shop uses OpenSAML through", "muted"],
    ["    Spring Security, and its patches matter", "muted"],
]

