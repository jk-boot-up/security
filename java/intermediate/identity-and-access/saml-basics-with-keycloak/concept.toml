In the middle, the attacker's response. [[slnc 300]] The attacker names the admin, and signs everything again with their own key. [[slnc 300]] With that key, R S A verifies. [[slnc 300]] With the bank's key, it does not. [[slnc 300]] Refused. [[slnc 700]]
At the bottom, a genuine response from the wallet, another identity provider in the same Keycloak. [[slnc 300]] It even answers the shop's request. [[slnc 300]] But the wallet's key is not the bank's key. [[slnc 300]] Refused.
