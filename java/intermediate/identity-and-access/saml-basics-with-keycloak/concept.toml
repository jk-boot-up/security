title = "SAML Basics with Keycloak"
short_title = "SAML with Keycloak"
package = "samlkeycloak"
main_class = "SamlKeycloakDemo"
tagline = "A SAML service provider against a real identity provider: the library refuses every signature that is not the bank's, and a key rotation at the bank locks the shop out"
bold = "Spring Security's SAML 2.0 service provider, on OpenSAML, trusts only the key in the identity provider's metadata, reads only assertions that key signed, and checks the request it answers, its audience and its dates; edited, self-signed, wrapped, unsigned and foreign-signed responses are all refused, and the cost is that metadata is read once, so a key rotation at the bank must reach the shop before the bank starts signing with it."
domain = "single sign-on through a bank"
domain_note = ""
youtube_description = "SAML 2.0 single sign-on with Spring Security 7 and a real Keycloak 26 in Docker: the authentication request and the signed response, an edited name, a response self-signed with a valid key of the attacker's, a genuine response signed by another realm, signature wrapping with an unsigned admin assertion before or after the signed one, no signature, a DOCTYPE, replay, an assertion that has expired, a response the bank signed for another shop, and a key rotation at the bank that refuses every shopper until the shop reloads its metadata."
thumb_lines = ["SAML WITH", "KEYCLOAK"]
thumb_code = "saml2Login()"
youtube_title = "SAML with Spring Security and Keycloak: Signature Wrapping, Replay, Audience and Key Rotation"
