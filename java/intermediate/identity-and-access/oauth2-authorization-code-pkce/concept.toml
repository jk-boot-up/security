[docs.session]
objectives = [
    "draw the authorization code flow and say which party sees which secret",
    "explain what PKCE protects against and why S256 is required",
    "explain why redirect URIs must match exactly and why state is bound to the browser",
    "describe refresh token rotation and what reuse detection does",
    "name the two grants that current practice removes, and why",
]
walkthrough = """
Start with the hotel key card. Run the demo one act at a time. After act one, ask who saw the password, who saw the code and who saw the token. After act
two, ask where a code can leak in a real phone or browser. In act three, ask what a prefix match would have allowed. In act four, ask why the honest app
loses its tokens too when a thief reuses a refresh token, and whether that is the right trade.
"""
exercises = [
    "Add a second registered redirect address for a test environment and check that each still matches only itself.",
    "Make codes last 10 minutes instead of 60 seconds and write the test that shows the risk.",
    "Add a `prompt=consent` option that forces the consent question again, and store what each customer agreed to.",
    "Change the bank API to accept self-contained JWT access tokens from the jwt-done-right project, and list what is lost when it stops calling the server.",
]

[docs.explained]
sentence = """
In the authorization code flow with PKCE, the customer signs in at the bank, the browser carries only a short-lived single-use code to an exactly registered
address, and the app swaps it directly for tokens by proving it holds the verifier it made for that sign-in, so neither the app nor anyone on the way ever
sees the password, and a leaked code is worthless.
"""
verdict = """
Use the authorization code flow with PKCE for every client, public or confidential. Register exact redirect URIs. Bind state to the browser session, or use
PKCE and OpenID Connect's nonce together. Keep codes single-use and short-lived. Ask for the narrowest scopes. Rotate refresh tokens or bind them to the
client. Never use the implicit flow or the password grant. And use a maintained authorization server and client library.
"""
recognise = [
    "`response_type=code` and `code_challenge_method=S256` in an authorization address.",
    "`?code=...&state=...` in the address after signing in.",
    "`invalid_grant`, `invalid_scope` and `unsupported_grant_type` in token endpoint errors.",
    "\"Connect your account\" consent pages that list what an app may do.",
]

