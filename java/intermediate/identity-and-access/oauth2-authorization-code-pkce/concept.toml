[[act]]
title = "Exact redirect addresses, state, and codes that work once"
summary = "Of five requested redirect addresses, exact matching sends a code only to the registered one, while a prefix check on https://budget.example would send it away 3 times; a callback with Mallory's code and state is refused as invalid_state; a code used twice is refused and its first access token turns 401; a code 61 seconds old is refused."
