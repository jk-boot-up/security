[[scene]]
key = "01-poster"
kind = "poster"
title = "OAuth 2.0 Authorization Code Flow with PKCE"
narration = """Hello, and welcome. [[slnc 400]] This video explains the O Auth authorization code flow, with P K C E, in Java. [[slnc 300]] O Auth stands for open authorization, and P K C E for proof key for code exchange. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] O Auth lets a customer give an app limited access to an account, without giving it the password. [[slnc 600]] Think of a hotel. [[slnc 300]] A guest never hands the cleaning company the master key. [[slnc 300]] The front desk checks the guest, then issues a key card for one room, for one stay. [[slnc 700]] In this video, the domain is an online bank, and a budgeting app. [[slnc 500]] By the end, you will have seen every message of the flow, with real values. [[slnc 300]] How the P K C E challenge is worked out from its secret. [[slnc 300]] Why redirect addresses must match exactly. [[slnc 300]] And how a stolen refresh token is contained."""

