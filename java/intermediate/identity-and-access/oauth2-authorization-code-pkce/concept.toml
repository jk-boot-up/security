[[act]]
title = "Current practice, and the bill"
summary = "The implicit flow is refused with unsupported_response_type and the password grant with unsupported_grant_type, as RFC 9700 and OAuth 2.1 require; the confidential statements-service is refused with a wrong secret, and with the right secret still needs a real code; a phone app relies on PKCE; production needs a real authorization server."
detail = """
The implicit flow, response_type=token, which put the access token in the address bar, is refused with unsupported_response_type: only the authorization
code flow is offered. The password grant, which would give the app Ana's password, is refused with unsupported_grant_type. Both are removed by RFC 9700,
the OAuth 2.0 Security Best Current Practice, and by OAuth 2.1. The statements service is a confidential client that runs on a server, so it also proves
who it is: with a wrong client secret it is refused with invalid_client, and with the right secret but a code it was never given it is refused with
invalid_grant, unknown code. A phone app cannot keep a secret, so PKCE protects its code. This small server leaves out discovery, signed tokens, consent
records and key rotation: in production, run a real authorization server, as in the -with-keycloak version.
"""
figure = "grants_today"
figure_title = "What current practice removes, and what it keeps"
figure_speech = """
Fifth demo: current practice, and the bill. [[slnc 400]] At the top, two older ways to get a token. [[slnc 300]] The implicit flow put the token straight into the address bar, where histories and logs could keep it. [[slnc 300]] The password grant gave the app the customer's password. [[slnc 300]] Current best practice removes both, and the bank refuses both. [[slnc 700]]
Below, two kinds of client. [[slnc 300]] A confidential client runs on a server, and proves who it is with a secret. [[slnc 300]] A wrong secret is refused. [[slnc 300]] And even the right secret does not turn a code it was never given into tokens. [[slnc 600]]
A public client, like an app on a phone, cannot keep a secret. [[slnc 300]] Anyone can unpack the app. [[slnc 300]] So it relies on the code flow with P K C E, and a fresh verifier for every sign in.
"""
speech = """
Here is the output. [[slnc 400]] The implicit flow: refused, as an unsupported response type. [[slnc 300]] The password grant: refused, as an unsupported grant type. [[slnc 300]] Both are removed by the current best practice, and by O Auth two point one.
[[page]]
The confidential client: a wrong secret is refused, and the right secret with a code it was never given is refused too. [[slnc 400]] A phone app has no secret, so P K C E protects its code. [[slnc 400]] And the bill: this small server leaves out discovery, signed tokens, consent records, and key rotation. [[slnc 300]] In production, run a real authorization server.
"""
