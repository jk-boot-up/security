]

[[act]]
title = "PKCE: a code is useless without the verifier"
summary = "The RFC 7636 verifier gives the published S256 challenge; only the challenge travels through the browser; a leaked code redeemed with no verifier or a made-up one is refused; plain and missing challenges are refused."
detail = """
The RFC 7636 example verifier gives the S256 challenge E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM, the published value. Only the challenge travels
through the browser: the request carries it, and not the verifier. When the code leaks, say through a log or a browser history, another app that redeems
it with no verifier, or with one it made up, is refused because PKCE verification fails. The budgeting app redeems it with the real verifier. A request with
the plain method, which would send the verifier itself, is refused, and so is a request with no challenge at all.
"""
speech = """
Second demo: P K C E, often said pixie. [[slnc 400]] For every sign in, the app makes a secret, called the verifier. [[slnc 300]] It sends only a hash of it, called the challenge. [[slnc 600]]
The published example from the standard gives exactly the published challenge. [[slnc 600]]
Now suppose the code leaks, through a log, or a browser history. [[slnc 300]] Another app tries to redeem it. [[slnc 300]] Without the verifier, it is refused. [[slnc 300]] With a verifier it made up, it is refused. [[slnc 600]]
The real app, holding the verifier, gets its tokens. [[slnc 600]]
And the bank refuses the plain method, which would send the verifier itself, and refuses a request with no challenge at all.
"""
rows = { pkce = "active ok" }
console = [
    ["the RFC 7636 example verifier dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk", "muted"],
    ["gives the S256 challenge E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM: the published value: true", "ok"],
    ["only the challenge travels through the browser: the request carries it: true, and the verifier: false", "ok"],
    ["a leaked code redeemed with no verifier: refused (invalid_grant: PKCE verification failed)", "ok"],
    ["with a verifier it made up: refused (invalid_grant: PKCE verification failed)", "ok"],
    ["the budgeting app redeems it with the real verifier: tokens issued", "ok"],
    ["code_challenge_method=plain: refused (invalid_request: only the S256 code challenge method is accepted)", "ok"],
]

[[act]]
title = "Exact redirect addresses, state, and codes that work once"
summary = "Only the exact registered redirect address gets a code; a forced sign-in into Mallory's account is refused by the state check; a reused code is refused and revokes the token it gave; a code 61 seconds old is refused."
detail = """
The budgeting app registered exactly https://budget.example/callback. That address gets a code; a path that climbs out with `..`, a host that only starts
with the same name, an added query and a change of letter case are all refused at the bank, with no redirect. A prefix or wildcard match would have sent
Ana's code to three of them. Mallory sends Ana a link to the app's callback carrying Mallory's own code, to sign Ana into Mallory's account; the app checks
the state against Ana's browser session and refuses it. A code redeemed once works; the same code redeemed again is refused, and the access token from the
first redemption is revoked, because a reused code means it leaked. A code redeemed 61 seconds after it was issued is refused as expired.
"""
speech = """
Third demo: exact addresses, state, and codes that work once. [[slnc 400]] The app registered one redirect address. [[slnc 300]] Only that exact address gets a code. [[slnc 600]]
A path that climbs out, a look alike host, an extra parameter, and even a change of letter case are refused at the bank. [[slnc 300]] A prefix match would have sent Ana's code away. [[slnc 600]]
Next, Mallory sends Ana a link, carrying Mallory's own code, to sign Ana into Mallory's account. [[slnc 300]] The app checks the state against Ana's browser, and refuses it. [[slnc 600]]
A code works once. [[slnc 300]] Used again, it is refused. [[slnc 300]] And the token from the first use is revoked, because a reused code means it leaked. [[slnc 600]]
And a code more than a minute old is refused.
"""
rows = { redirect = "active ok" }
console = [
    ["https://budget.example/callback: a code is sent there", "ok"],
    ["https://budget.example/callback/../steal: refused at the bank, no redirect", "ok"],
    ["https://budget.example.evil.test/callback: refused at the bank, no redirect", "ok"],
    ["the app checks the state against Ana's browser session: refused (invalid_state: this browser did not start this sign-in)", "ok"],
    ["the same code redeemed again: refused (invalid_grant: the code was already used, so the tokens issued from it are revoked)", "ok"],
    ["and the access token from the first redemption is now: 401  <- A REUSED CODE MEANS IT LEAKED, SO EVERYTHING FROM IT IS REVOKED", "amber"],
    ["a code redeemed 61 seconds after it was issued: refused (invalid_grant: the code has expired)", "ok"],
]

[[act]]
title = "Scopes and refresh tokens"
summary = "The token carries only accounts.read, so a payment is 403; asking for payments.write is refused; refresh tokens rotate, and reusing an old one revokes the whole family; an access token 300 seconds old is 401."
detail = """
The app asked for accounts.read, Ana agreed to that, and the token carries only that scope. GET /accounts answers 200; POST /payments with the same token
answers 403 insufficient_scope. Asking for payments.write too, which the app never registered, is refused as an invalid scope. When the access token runs
out, the app refreshes it and gets a new access token and a new refresh token. The old refresh token, copied by a thief and used again, is refused, and the
whole family is revoked: the newest refresh token held by the real app is refused too, and the newest access token answers 401. One reuse contains the
theft. An access token 300 seconds old answers 401.
"""
speech = """
Fourth demo: scopes and refresh tokens. [[slnc 400]] The app asked only to read the accounts. [[slnc 300]] So its token can read, and cannot pay. [[slnc 300]] A payment is refused. [[slnc 600]]
Asking for payments too, which the app never registered, is refused. [[slnc 600]]
When the access token runs out, the app swaps its refresh token for a new pair. [[slnc 300]] The old refresh token is now spent. [[slnc 600]]
If a thief copied it and uses it again, the bank refuses it, and revokes the whole family. [[slnc 300]] Even the real app's newest tokens stop working. [[slnc 300]] The theft is contained, at the price of Ana signing in again. [[slnc 600]]
And every access token expires after five minutes.
"""
rows = { scope = "active ok" }
console = [
    ["the app asked for accounts.read, Ana agreed to that, and the token carries: accounts.read", "muted"],
    ["POST /payments with the same token: 403 insufficient_scope", "ok"],
    ["asking for payments.write too, which the app never registered: refused (invalid_scope: ...)", "ok"],
    ["the access token runs out, so the app refreshes it: a new access token, and a new refresh token: true", "muted"],
    ["the old refresh token, copied by a thief and used again: refused (invalid_grant: the refresh token was used twice, so every token in its family is revoked)", "ok"],
    ["and the newest access token: 401  <- ONE REUSE REVOKES THE WHOLE FAMILY, SO THE THEFT IS CONTAINED", "amber"],
    ["an access token 300 seconds old: 401", "ok"],
]

[[act]]
title = "Current practice, and the bill"
summary = "The implicit flow and the password grant are refused, as RFC 9700 and OAuth 2.1 require; a confidential client must authenticate; and production needs a real authorization server."
detail = """
The implicit flow, which put the access token in the address bar, is refused as an unsupported response type. The password grant, which gives the app Ana's
password, is refused as an unsupported grant type. Both are removed by OAuth 2.0 Security Best Current Practice, RFC 9700, and by OAuth 2.1. The
statements service is a confidential client, so it also authenticates: with a wrong secret it is refused, and with its secret it still needs a real code and
verifier. A public app on a phone cannot keep a secret, which is why PKCE, not a secret, protects its code. This server leaves out discovery, signed tokens,
consent records, key rotation and account recovery: in production, run a real authorization server, as in the -with-keycloak version.
"""
speech = """
Fifth demo: current practice, and the bill. [[slnc 400]] The implicit flow, which put the token in the address bar, is refused. [[slnc 300]] The password grant, which hands the app the password, is refused. [[slnc 300]] The current best practice removes both. [[slnc 600]]
A service that runs on a server is a confidential client, so it also proves who it is with a secret. [[slnc 300]] An app on a phone cannot keep a secret, which is why P K C E protects its code instead. [[slnc 600]]
And the bill. [[slnc 300]] This small server leaves out discovery, signed tokens, consent records, and key rotation. [[slnc 300]] In production, run a real authorization server.
"""
rows = { practice = "active amber" }
console = [
    ["the implicit flow (response_type=token): refused (unsupported_response_type: only the authorization code flow is offered)", "ok"],
    ["the password grant: refused (unsupported_grant_type: the password grant is not offered)", "ok"],
    ["both are removed by OAuth 2.0 Security Best Current Practice, RFC 9700, and by OAuth 2.1", "muted"],
    ["the statements service is a confidential client: with a wrong secret: refused (invalid_client: client authentication failed)", "ok"],
    ["a public app on a phone cannot keep a secret, which is why PKCE, not a secret, protects its code", "amber"],
    ["in production, run a real authorization server, as in the -with-keycloak version", "amber"],
]

