[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] The bank, the app and the browser are small Java classes, so every message can be printed. [[slnc 300]] Here are the classes that matter."""

[[class]]
name = "Pkce"
what = "the verifier, its S256 challenge, and the check"
[[class.part]]
title = "a hash of the secret, compared in constant time"
code = """
byte[] ascii = verifier.getBytes(StandardCharsets.US_ASCII);
return base64Url(MessageDigest.getInstance("SHA-256").digest(ascii));
...
static boolean matches(String challenge, String verifier) {
    ...
    byte[] stored = challenge.getBytes(StandardCharsets.US_ASCII);
    byte[] fromVerifier = challenge(verifier).getBytes(StandardCharsets.US_ASCII);
    return MessageDigest.isEqual(stored, fromVerifier);
"""
speech = """The challenge is the S H A two five six of the verifier, in base sixty four U R L. [[slnc 300]] To check a verifier, the bank hashes it again and compares, in constant time, so the time taken gives nothing away."""

[[class]]
name = "ChallengeSteps"
what = "the same challenge, worked out by hand for the demo"
[[class.part]]
title = "every 3 bytes become 4 characters of 6 bits"
code = """
for (int i = 0; i < bytes.length; i += 3) {
    int n = Math.min(3, bytes.length - i);
    ...
    for (int k = 0; k <= n; k++) {
        out.append(ALPHABET.charAt((bits >> (18 - 6 * k)) & 63));
"""
speech = """This teaching class redoes the base sixty four step by hand. [[slnc 300]] It packs three bytes into twenty four bits, and cuts them into four numbers of six bits, each one a letter. [[slnc 300]] A test proves it gives exactly the library's challenge."""

[[class]]
name = "BudgetApp"
what = "the client: a state and a verifier per browser session"
[[class.part]]
title = "the callback must carry this browser's state"
code = """
pendingBySession.put(browserSession, new Pending(state, verifier));
...
Pending pending = pendingBySession.remove(browserSession);
String state = query.get("state");
if (pending == null || !sameText(pending.state(), state)) {
    throw new OAuthException("invalid_state", "this browser did not start this sign-in");
"""
speech = """The app remembers a state and a verifier for each browser session that starts a sign in. [[slnc 300]] A callback with any other state is refused, which stops Mallory's link."""

[[class]]
name = "ClientRegistration"
what = "what the bank knows about a client before any request"
[[class.part]]
title = "exact redirect matching"
code = """
boolean registered(String redirectUri) {
    return redirectUri != null && redirectUris.contains(redirectUri);
"""
speech = """A redirect address is accepted only if it is one of the registered strings, exactly. [[slnc 300]] No prefixes, no wildcards, no changes of case."""

[[class]]
name = "AuthorizationServer"
what = "the bank's authorization and token endpoints"
[[class.part]]
title = "a code works once"
code = """
if (grant.used) {
    grant.issued.forEach(this::revokeAccess);
    throw new OAuthException("invalid_grant", "code already used; its tokens are now revoked");
"""
speech = """Redeeming a code runs the checks in order. [[slnc 300]] First, a code that was already used is refused. [[slnc 300]] A second use means the code leaked, so what its first use issued is revoked too."""
[[class.part]]
title = "in time, and with the verifier"
code = """
if (clock.now() > grant.expiresAt) {
    throw new OAuthException("invalid_grant", "the code has expired");
}
...
if (!Pkce.matches(grant.challenge, form.get("code_verifier"))) {
    throw new OAuthException("invalid_grant", "PKCE verification failed");
"""
speech = """Then the code must be younger than sixty seconds. [[slnc 300]] And the verifier must match the challenge the bank stored with the code. [[slnc 300]] Only then are tokens issued."""
[[class.part]]
title = "refresh token rotation and reuse detection"
code = """
if (old.used) {
    revokeFamily(old.family);
    throw new OAuthException("invalid_grant", "refresh token used twice; its whole family is revoked");
}
old.used = true;
return issue(old.clientId, old.user, old.scope, old.family);
"""
speech = """Each refresh token works once and is replaced by a new one in the same family. [[slnc 300]] If a spent one comes back, it must be a copy, so the whole family is revoked."""

[[class]]
name = "BankApi"
what = "the resource server: checks the token and its scope on every call"
[[class.part]]
title = "read is not pay"
code = """
if (!info.active()) {
    return new Answer(401, "invalid_token");
}
...
if (!info.scope().contains(needed)) {
    return new Answer(403, "insufficient_scope");
"""
speech = """The A P I asks the bank about every token. [[slnc 300]] An inactive token gets four oh one. [[slnc 300]] A token without the scope the call needs gets four oh three."""

[[acronym]]
short = "OAuth"
long = "Open Authorization: limited access without the password"
say = "O Auth is open authorization: a standard way for a customer to give an app limited access to an account, without the password."
[[acronym]]
short = "PKCE"
long = "Proof Key for Code Exchange, said 'pixie'"
say = "P K C E is proof key for code exchange, said pixie. The app proves it is the one that asked for the code."
[[acronym]]
short = "SHA-256, S256"
long = "Secure Hash Algorithm, 256-bit result; S256 in PKCE"
say = "S H A two five six is the secure hash algorithm with a two hundred and fifty six bit result. S two five six is P K C E's name for using it."
[[acronym]]
short = "ASCII"
long = "American Standard Code for Information Interchange"
say = "A S C I I is the American standard code for information interchange. Each letter or digit becomes one byte."
[[acronym]]
short = "hex, base64url"
long = "a byte as 2 digits 0-9 a-f; 6 bits per URL-safe letter"
say = "Hex writes a byte as two digits from zero to f. Base sixty four U R L writes six bits per letter, using dash and underscore so it is safe in a web address."
[[acronym]]
short = "RFC"
long = "Request for Comments: numbered internet standards"
say = "R F C means request for comments: the numbered internet standards. Six seven four nine is O Auth, seven six three six is P K C E, and nine seven hundred is the current best practice."
[[acronym]]
short = "URI, URL"
long = "Uniform Resource Identifier / Locator: a web address"
say = "U R I and U R L mean uniform resource identifier and locator: a web address."
[[acronym]]
short = "HTTP"
long = "Hypertext Transfer Protocol; status 200, 302, 401, 403"
say = "H T T P is the hypertext transfer protocol. Get reads, post sends. Two hundred means O K, three oh two sends the browser elsewhere, four oh one means no valid token, and four oh three means not allowed."
[[acronym]]
short = "API"
long = "Application Programming Interface: the bank's service"
say = "A P I means application programming interface: here, the bank's service that apps call for accounts and payments."
[[acronym]]
short = "A1, A2, R1, R2"
long = "the demo's names for access and refresh tokens"
say = "A one and A two are access tokens, and R one and R two are refresh tokens, numbered in the order the bank issues them."
[[acronym]]
short = "JDK"
long = "Java Development Kit"
say = "J D K is the Java development kit."

[threatmodel]
scope = """
The OAuth 2.0 authorization code flow between a customer's browser, a public budgeting app, the bank's authorization server and the bank's accounts API:
authorization requests, redirects, the token endpoint, refresh tokens and API calls. It covers an attacker who can read logs and browser histories, send
links, change request parameters and copy tokens. It does not cover the bank's sign-in page itself, a compromised device, or OpenID Connect.
"""
assets = [
    "Ana's password, which only the bank may see.",
    "Authorization codes, access tokens and refresh tokens.",
    "The registered redirect URIs and the confidential client's secret.",
    "Ana's accounts, and the ability to move money.",
]
actors = [
    "Ana, the customer, using a browser.",
    "The budgeting app, a public client.",
    "The bank's statements service, a confidential client.",
    "An attacker who reads logs, sends links and copies tokens.",
]
boundaries = [
    "Browser to authorization server: everything in the address bar is visible and changeable.",
    "App to token endpoint: the only place codes become tokens.",
    "App to bank API: every request carries a token that the API must check.",
]
assumptions = [
    "All real traffic uses TLS; the demo's loopback HTTP is for the lab only.",
    "The bank's sign-in page authenticates Ana correctly.",
    "Codes, tokens, states and verifiers come from a secure random source.",
]
out_of_scope = [
    "OpenID Connect and ID tokens: the openid-connect project.",
    "Tokens in single-page apps: the tokens-in-the-browser project.",
    "A compromised device or browser.",
]
tests = [
    "`PkceTest` checks the RFC 7636 appendix B example, verifier rules and mismatches.",
    "`AuthorizationServerTest` checks exact redirects, PKCE, single-use and expiring codes, revocation on reuse, scopes, refresh rotation, removed grants and client authentication.",
    "`BudgetAppTest` checks states per browser session, forced callbacks and errors from the bank.",
    "`LoopbackTest` runs the whole flow over a real local HTTP server.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next project, openid-connect, adds sign-in on top of this flow: ID tokens, nonce, discovery and logout.
"""

[[threat]]
id = "T1"
stride = "I"
threat = "An authorization code leaks through a log, a browser history or a referrer and is redeemed by someone else"
where = "`AuthorizationServer.token`"
control = "PKCE with S256: the code is bound to a challenge and redeemed only with its verifier"
residual = "A device that is itself compromised can read the verifier too"

[[threat]]
id = "T2"
stride = "S"
threat = "A changed redirect URI sends the code to an attacker's address"
where = "`ClientRegistration.registered`"
control = "Exact string matching of registered redirect URIs; errors about the redirect are shown at the bank, never redirected"
residual = "A registered address that itself has an open redirect would still leak codes"

[[threat]]
id = "T3"
stride = "T"
threat = "A forced callback signs the customer into the attacker's account (login forgery)"
where = "`BudgetApp.callback`"
control = "A state made for each sign-in, bound to the browser session, checked in constant time and used once"
residual = "An app that skips the state check is exposed; OpenID Connect adds a nonce as well"

[[threat]]
id = "T4"
stride = "E"
threat = "An app uses its token for more than the customer agreed to"
where = "`BankApi.call`, `AuthorizationServer.authorize`"
control = "Scopes limited to what the client registered, shown at consent and enforced by the API on every call"
residual = "A customer may agree to more than the app needs; consent screens must be clear"

[[threat]]
id = "T5"
stride = "S"
threat = "A stolen refresh token gives an attacker lasting access"
where = "`AuthorizationServer.token` (refresh)"
control = "Rotation on every use, and reuse detection that revokes the whole family"
residual = "The attacker keeps access until the next real refresh; short access tokens limit the window"

[[threat]]
id = "T6"
stride = "I"
threat = "The implicit flow or the password grant exposes tokens or passwords"
where = "`AuthorizationServer.authorize`, `AuthorizationServer.token`"
control = "Both are refused; confidential clients authenticate; public clients rely on PKCE"
residual = "A real deployment must keep these off as it adds clients and features"
