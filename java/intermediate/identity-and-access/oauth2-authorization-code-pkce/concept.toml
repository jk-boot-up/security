narration = """Before the demos, the words. [[slnc 500]] The authorization server is the bank's sign in and token service. [[slnc 500]] The client is the app asking for access. [[slnc 500]] The code is a short lived ticket that the browser carries back. [[slnc 500]] The access token is what the app shows the bank's A P I. [[slnc 500]] A refresh token is swapped for a new access token when the old one runs out. [[slnc 500]] The scope is what the access allows, such as reading accounts. [[slnc 500]] And the verifier is a secret the app makes for each sign in. [[slnc 300]] The challenge is its hash."""

