    ["Ana signs in at the bank, never at the app, and is asked: budget-app wants to read your accounts (accounts.read). Ana agrees", "muted"],
    ["the bank sends the browser back: 302 https://budget.example/callback?code=<code>&state=<state>", "muted"],
    ["the code is 43 random characters and works for 60 seconds, once", "amber"],
