    ["note", "Authorization server", "token one was already used: revoke the family"],
    ["Authorization server", "Thief", "400 invalid_grant", "reply"],
    ["Budgeting app", "Authorization server", "refresh with token two"],
    ["Authorization server", "Budgeting app", "400 invalid_grant: Ana signs in again", "reply"],
]

