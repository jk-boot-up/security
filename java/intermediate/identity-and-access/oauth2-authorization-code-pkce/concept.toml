[[scene]]
key = "01-poster"
kind = "poster"
title = "OAuth 2.0 Authorization Code Flow with PKCE"
narration = """Hello, and welcome. [[slnc 400]] This video explains the O Auth authorization code flow, with P K C E, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] O Auth lets a customer give an app limited access to an account, without giving it the password. [[slnc 600]] Think of a hotel. [[slnc 300]] A guest never hands the cleaning company the master key. [[slnc 300]] The front desk checks the guest, then issues a key card for one room, for one stay. [[slnc 700]] In this video, the domain is an online bank, and a budgeting app. [[slnc 500]] By the end, you will hear every message of the flow. [[slnc 300]] Why a leaked code is useless with P K C E. [[slnc 300]] Why redirect addresses must match exactly. [[slnc 300]] And how a stolen refresh token is contained."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["A budgeting app wants to read", "Ana's bank accounts.", "", "It must never see the password,", "never move money,", "and never keep access for ever."]
narration = """Here is the scenario. [[slnc 400]] A budgeting app, written by another company, wants to read Ana's bank accounts. [[slnc 500]] It must never see the password. [[slnc 300]] It must never move money. [[slnc 300]] And it must not keep access for ever."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["Authorization server: the bank's sign-in and token service", "Client: the app asking for access", "Code: a short-lived ticket the browser carries", "Access token: what the app shows the API", "Scope: what the access allows"]
narration = """Before the demos, the words. [[slnc 500]] The authorization server is the bank's sign in and token service. [[slnc 500]] The client is the app asking for access. [[slnc 500]] The code is a short lived ticket that the browser carries back. [[slnc 500]] The access token is what the app shows the bank's A P I. [[slnc 500]] And the scope is what the access allows, such as reading accounts."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "09-ladder"
kind = "bullets"
title = "Who Sees What"
body = ["The bank sees the password", "The browser sees only the code and state", "The app sees the code, verifier and tokens", "The API sees only the access token", "Nobody else sees anything useful"]
narration = """Let's put it side by side. [[slnc 400]] Only the bank sees the password. [[slnc 500]] The browser sees only the code and the state. [[slnc 500]] The app sees the code, its own verifier, and the tokens. [[slnc 500]] The A P I sees only the access token. [[slnc 500]] And anyone who reads a log or a history finds a code that is useless without the verifier."""

[[scene]]
key = "10-roles"
kind = "bullets"
title = "Who Does What"
body = ["AuthorizationServer: codes and tokens", "ClientRegistration: exact redirects, secrets", "Pkce: verifier and challenge", "BankApi: checks scope on every call", "BudgetApp: state and verifier per sign-in"]
narration = """Here is who does what in the code. [[slnc 400]] The authorization server issues codes and tokens, and checks every rule. [[slnc 500]] The client registration holds the exact redirect addresses, and a secret for server side clients. [[slnc 500]] The P K C E class makes and checks the verifier and challenge. [[slnc 500]] The bank A P I checks the scope on every call. [[slnc 300]] And the budgeting app keeps a state and a verifier for each sign in."""

[[scene]]
key = "11-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["\"Connect your bank account\" buttons", "\"Sign in with\" buttons", "Addresses ending in ?code=...&state=...", "Consent pages listing what an app may do"]
narration = """You have probably met this already. [[slnc 400]] Connect your bank account buttons in budgeting apps use it. [[slnc 500]] Sign in with buttons are built on it. [[slnc 500]] Addresses that end in code, and state, after signing in somewhere, are this flow. [[slnc 500]] And consent pages that list what an app may do are its second step."""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Code flow with PKCE, S256, for every client", "Exact redirect URIs", "State bound to the browser", "Short, single-use codes; narrow scopes", "Rotating refresh tokens; a real server"]
narration = """So, how do you use it? [[slnc 400]] Use the code flow with P K C E for every client. [[slnc 500]] Register exact redirect addresses. [[slnc 500]] Bind the state to the browser. [[slnc 500]] Keep codes short lived and single use, and ask for the narrowest scopes. [[slnc 500]] Rotate refresh tokens, and in production, use a real authorization server."""

[[scene]]
key = "13-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Register a second", "redirect address and test it."]
narration = """That's the O Auth authorization code flow with P K C E. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] The customer signs in at the bank, the browser carries only a short lived code, and P K C E makes that code useless to anyone but the app that asked for it. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine, with nothing installed except a Java development kit. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Register a second redirect address for a test environment, and check that each one matches only itself. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
The OAuth 2.0 authorization code flow between a customer's browser, a public budgeting app, the bank's authorization server and the bank's accounts API:
authorization requests, redirects, the token endpoint, refresh tokens and API calls. It covers an attacker who can read logs and browser histories, send
links, change request parameters and copy tokens. It does not cover the bank's sign-in page itself, a compromised device, or OpenID Connect.
"""
assets = [
    "Ana's password, which only the bank may see.",
    "Authorization codes, access tokens and refresh tokens.",
    "The registered redirect URIs and the confidential client's secret.",
    "Ana's accounts, and the ability to move money.",
]
actors = [
    "Ana, the customer, using a browser.",
    "The budgeting app, a public client.",
    "The bank's statements service, a confidential client.",
    "An attacker who reads logs, sends links and copies tokens.",
]
boundaries = [
    "Browser to authorization server: everything in the address bar is visible and changeable.",
    "App to token endpoint: the only place codes become tokens.",
    "App to bank API: every request carries a token that the API must check.",
]
assumptions = [
    "All real traffic uses TLS; the demo's loopback HTTP is for the lab only.",
    "The bank's sign-in page authenticates Ana correctly.",
    "Codes, tokens, states and verifiers come from a secure random source.",
]
out_of_scope = [
    "OpenID Connect and ID tokens: the openid-connect project.",
    "Tokens in single-page apps: the tokens-in-the-browser project.",
    "A compromised device or browser.",
]
tests = [
    "`PkceTest` checks the RFC 7636 appendix B example, verifier rules and mismatches.",
    "`AuthorizationServerTest` checks exact redirects, PKCE, single-use and expiring codes, revocation on reuse, scopes, refresh rotation, removed grants and client authentication.",
    "`BudgetAppTest` checks states per browser session, forced callbacks and errors from the bank.",
    "`LoopbackTest` runs the whole flow over a real local HTTP server.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next project, openid-connect, adds sign-in on top of this flow: ID tokens, nonce, discovery and logout.
"""

[[threat]]
id = "T1"
stride = "I"
threat = "An authorization code leaks through a log, a browser history or a referrer and is redeemed by someone else"
where = "`AuthorizationServer.token`"
control = "PKCE with S256: the code is bound to a challenge and redeemed only with its verifier"
residual = "A device that is itself compromised can read the verifier too"

[[threat]]
id = "T2"
stride = "S"
threat = "A changed redirect URI sends the code to an attacker's address"
where = "`ClientRegistration.registered`"
control = "Exact string matching of registered redirect URIs; errors about the redirect are shown at the bank, never redirected"
residual = "A registered address that itself has an open redirect would still leak codes"

[[threat]]
id = "T3"
stride = "T"
threat = "A forced callback signs the customer into the attacker's account (login forgery)"
where = "`BudgetApp.callback`"
control = "A state made for each sign-in, bound to the browser session, checked in constant time and used once"
residual = "An app that skips the state check is exposed; OpenID Connect adds a nonce as well"

[[threat]]
id = "T4"
stride = "E"
threat = "An app uses its token for more than the customer agreed to"
where = "`BankApi.call`, `AuthorizationServer.authorize`"
control = "Scopes limited to what the client registered, shown at consent and enforced by the API on every call"
residual = "A customer may agree to more than the app needs; consent screens must be clear"

[[threat]]
id = "T5"
stride = "S"
threat = "A stolen refresh token gives an attacker lasting access"
where = "`AuthorizationServer.token` (refresh)"
control = "Rotation on every use, and reuse detection that revokes the whole family"
residual = "The attacker keeps access until the next real refresh; short access tokens limit the window"

[[threat]]
id = "T6"
stride = "I"
threat = "The implicit flow or the password grant exposes tokens or passwords"
where = "`AuthorizationServer.authorize`, `AuthorizationServer.token`"
control = "Both are refused; confidential clients authenticate; public clients rely on PKCE"
residual = "A real deployment must keep these off as it adds clients and features"
