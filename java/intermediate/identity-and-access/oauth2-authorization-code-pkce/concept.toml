[[act]]
title = "PKCE: a code is useless without the verifier"
summary = "The verifier dBjftJeZ4... becomes 43 ASCII bytes, SHA-256 gives 32 bytes starting 13 d3 1e, base64url turns 13 d3 1e into E9Me and all 32 bytes into the published challenge E9Melhoa...; only the challenge travels through the browser; a leaked code with no verifier or a made-up one is refused; plain and missing challenges are refused."
detail = """
The verifier is the RFC 7636 example, dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk: 43 characters from A-Z, a-z, 0-9 and - . _ ~. The S256 challenge is made
in steps: the 43 characters as 43 ASCII bytes (64 42 6a 66 ...); SHA-256 of those bytes, always 32 bytes (13 d3 1e 96 ...); then base64url, where every 3
bytes become 4 characters of 6 bits: 13 d3 1e is 000100 111101 001100 011110, the numbers 4 61 12 30, the characters E9Me. All 32 bytes become 43
characters with no = padding: E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM, the value RFC 7636 publishes and the value Java's Base64 gives.
Only the challenge travels through the browser. When the code leaks, another app redeeming it with no verifier, or with a verifier it made up, is refused
with invalid_grant, PKCE verification failed; the budgeting app with the real verifier gets tokens. code_challenge_method=plain, which would send the verifier
itself, and a request with no code_challenge are refused with invalid_request.
"""
figure = "s256_steps"
figure_title = "From the verifier to the challenge, step by step"
figure_speech = """
Second demo: P K C E, said pixie. [[slnc 400]] For every sign in, the app makes a secret, the verifier. [[slnc 300]] Here it is the example published in the standard, forty three characters. [[slnc 700]]
Step one. [[slnc 300]] Each character becomes one byte, its A S C I I code. [[slnc 300]] The small d is six four in hex. [[slnc 600]]
Step two. [[slnc 300]] S H A two five six turns those bytes into thirty two bytes. [[slnc 300]] Nobody can turn them back into the verifier. [[slnc 600]]
Step three. [[slnc 300]] Base sixty four U R L writes the bytes as letters that are safe in an address. [[slnc 300]] Three bytes are twenty four bits. [[slnc 300]] Cut into four groups of six bits, they are the numbers four, sixty one, twelve, and thirty. [[slnc 300]] In the alphabet, those are capital E, nine, capital M, and small e. [[slnc 600]]
Step four. [[slnc 300]] All thirty two bytes become forty three characters, and the equals signs of padding are dropped. [[slnc 300]] That is the challenge.
"""
speech = """
Here is the output. [[slnc 400]] The verifier, forty three characters. [[slnc 400]] Then the steps: the A S C I I bytes, and the thirty two bytes of the hash, in hex.
[[page]]
The first three bytes, worked out bit by bit, give E nine M e. [[slnc 400]] The whole hash gives the challenge. [[slnc 300]] It is the value the standard publishes, and the value Java's own base sixty four gives. [[slnc 400]] Only the challenge travels through the browser, never the verifier.
[[page]]
Now the code leaks. [[slnc 300]] Another app tries it with no verifier: refused. [[slnc 300]] With a verifier it made up: refused. [[slnc 300]] The budgeting app, with the real verifier, gets its tokens.
[[page]]
The bank also refuses weaker requests. [[slnc 300]] It refuses the plain method, which would send the verifier itself, and a request with no challenge at all.
"""
rows = { pkce = "active ok" }
console = [
