short_title = "OAuth 2.0 with PKCE"
package = "oauth"
main_class = "OAuthDemo"
tagline = "Give an app access without giving it your password"
bold = "The authorization code flow lets an app read a customer's bank accounts without ever seeing the password: the customer signs in at the bank, the browser carries only a short-lived code, and PKCE makes that code useless to anyone but the app that asked for it. Exact redirect addresses, a state bound to the browser, single-use codes, narrow scopes and rotating refresh tokens close the remaining gaps."
domain = "an online bank"
domain_note = ""
youtube_description = """The OAuth 2.0 authorization code flow with PKCE, in Java with only the JDK. Explained with an online bank and a budgeting app, like a hotel key card that the front desk issues for one room and one stay, without ever handing over the master key. We walk through every message of the flow, show that a leaked authorization code is useless without the PKCE code verifier, checked against the published example in RFC 7636, register exact redirect addresses so a code cannot be sent anywhere else, bind the state to the browser to stop login forgery, make codes single-use and short-lived, limit the app with scopes, rotate refresh tokens so that a stolen one revokes the whole family, and finish with current practice from RFC 9700: no implicit flow, no password grant, and a real authorization server in production."""
thumb_lines = ["OAUTH 2.0", "CODE FLOW + PKCE"]
