title = "Two roads: the hash through the browser, the secret direct"
body = "pkce_idea"
narration = """Let's see the whole idea on one picture. [[slnc 400]] On the left, the app makes a secret for this one sign in: the verifier. [[slnc 300]] It hashes it with S H A two five six, and writes the result as letters. [[slnc 300]] That is the challenge. [[slnc 700]] On the right, the two roads. [[slnc 300]] The challenge travels through the browser in step one, where addresses end up in histories and logs. [[slnc 300]] That is fine: a hash cannot be turned back into the secret. [[slnc 600]] The verifier travels in step four, directly from the app to the bank. [[slnc 300]] The bank hashes it, and compares with the challenge it stored. [[slnc 700]] A thief who copies the code from the browser has no verifier. [[slnc 300]] So the code is useless to the thief."""

