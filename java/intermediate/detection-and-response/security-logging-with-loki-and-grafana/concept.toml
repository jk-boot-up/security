[[act]]
title = "Alerting"
summary = "The rule PasswordGuessing counts failures per address over 5 minutes and fires at 3 or more: with ana's 2 failures (2 >= 3? no) nothing fires; after 4 failures from 203.0.113.9 (4 >= 3? yes) it fires; the rule with the typo outcom counts nothing and stays inactive/ok without an error."
detail = """
The input is two rules, evaluated every 2 seconds: PasswordGuessing, sum by (source_ip) (count_over_time({app="bank"} | json | outcome="failure" [5m])) >= 3, and PasswordGuessingTypo, the same with the field misspelt outcom.
Before: both rules are inactive/ok; 198.51.100.66 has 2 failures, 2 >= 3? no, so nothing fires. Then 4 failed logins as ben from 203.0.113.9 are shipped. After a moment: 203.0.113.9 has 4, 4 >= 3? yes, so PasswordGuessing fires for 203.0.113.9, with the text
"203.0.113.9 failed to log in 3 times or more in 5 minutes". The typo rule counts nothing, because no line has a field outcom, and stays inactive/ok: no error, and it never fires. So a rule must be tested with a known bad event.
"""
figure = "alert_threshold"
figure_title = "Failures per address against the rule's threshold"
figure_speech = """
Fourth demo: alerting. [[slnc 400]] The rule counts failed logins per address, over five minutes. [[slnc 300]] At three or more, it fires. [[slnc 300]] The red line is that threshold. [[slnc 600]]
On the left, before. [[slnc 300]] Ana's address has two failures. [[slnc 300]] Two is less than three, so nothing fires. [[slnc 600]]
On the right, after four failed logins from a new address. [[slnc 300]] Four is three or more, so the rule fires for that address, with its text. [[slnc 600]]
At the bottom, the second rule, with a typo in the field name. [[slnc 300]] No line has that field, so it counts nothing. [[slnc 300]] It reports no error, and it will never fire.
