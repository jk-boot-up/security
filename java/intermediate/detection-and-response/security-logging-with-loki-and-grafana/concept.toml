narration = "That's logging with Loki. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] A log store is useful when it can answer a question about the whole system in one line, and a rule is useful when someone has proved that it fires. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a rule for a login success from an address that failed three times before. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"
