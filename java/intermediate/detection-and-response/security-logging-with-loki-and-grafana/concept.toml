[poster]
headline = [["LOGGING WITH", "text"], ["LOKI AND GRAFANA", "accent"]]
taglines = [["Ship the bank's security events to a real Loki, ask who moved the money in one line of Log", "gold"]]
before = { code = "401 no org id", note = "a push with no tenant", tag = "BEFORE" }
after = { code = "firing PasswordGuessing 203.0.113.9", note = "a tested rule fires", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "Security Logging with Loki and Grafana"
narration = "Hello, and welcome. [[slnc 400]] This video explains security logging with Loki and Grafana. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A security log is only useful if someone can ask it questions, and something watches it at night. [[slnc 300]] Loki stores log lines, and answers questions in a short query language, Log Q L. [[slnc 300]] Grafana shows the answers, and a rule can fire an alert, for example on password guessing. [[slnc 600]] Think of a bank's security camera recordings: worth little until someone can search them, and an alarm watches them live. [[slnc 600]] Our example is a bank."

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["A bank's security events from one morning:", "  sign-ins, failures, a transfer", "", "The demo ships them to a real Loki", "with Grafana, in Docker,", "asks an investigator's questions,", "and sets the rule a night operator relies on."]
narration = "Here is the scenario. [[slnc 400]] A bank's security events from one morning: sign-ins, failed sign-ins, and a transfer of five hundred. [[slnc 500]] The demo ships them to a real Loki, with Grafana, both in Docker. [[slnc 300]] It asks the questions an investigator would ask. [[slnc 500]] Then it sets an alert rule, the kind a night operator relies on, and checks that it really fires."

[[scene]]
key = "02-words"
kind = "bullets"
title = "The Words"
body = ["Tenant: whose logs a request is about", "Label: a name and value that picks a stream", "Stream: all lines with the same labels", "LogQL: Loki's query language", "Rule: a query checked again and again", "Data source: Grafana's door to Loki"]
narration = """Before the demos, the words. [[slnc 500]] A tenant says whose logs a request is about: here, the bank or the shop. [[slnc 500]] A label is a name and a value, such as app equals bank, that Loki uses to pick lines quickly. [[slnc 500]] A stream is all the lines with the same labels. [[slnc 500]] Log Q L is Loki's query language. [[slnc 500]] A rule is a query that Loki checks again and again, and that fires an alert. [[slnc 500]] And a data source is Grafana's door to Loki, with a tenant behind it."""

[[scene]]
key = "02-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "02-query-parts"
kind = "figure"
title = "A LogQL query, part by part"
body = "query_parts"
narration = """Let's see the core idea on one example: one Log Q L query. [[slnc 400]] The question is: who moved five hundred or more? [[slnc 600]]
First, the part in curly braces picks streams by their labels: the bank's money movements. [[slnc 300]] That is the fast part, because labels are indexed. [[slnc 300]] Then the json step reads each line's fields. [[slnc 300]] Then two filters keep only transfers, of five hundred or more. [[slnc 600]]
At the bottom, what comes back: one line, read by its fields. [[slnc 300]] Ana's login, from one nine eight dot five one dot one hundred dot six six, from Ana's account to an unknown one, success, request six. [[slnc 500]] Labels choose where to look, and the line's own fields answer the question."""

[[scene]]
key = "03-acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "04-costs"
kind = "bullets"
title = "What It Costs"
body = ["Labels are an index: choose few", "A rule can be silently wrong", "Tenants separate data, not people", "Logs need a retention", "The store does not prove a line is true"]
narration = "Nothing is free. [[slnc 400]] Here is what it costs. [[slnc 500]] Labels are an index, so only a few, always-used fields can be labels. [[slnc 500]] An alert rule can be silently wrong, and never fire. [[slnc 500]] Tenants keep one team's data apart from another's, but they do not check who a person is. [[slnc 500]] Logs need a retention, an end date. [[slnc 300]] And the log store does not prove that a line is true, only that it arrived."

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["{app=\"bank\"} | json in a query", "X-Scope-OrgID in a request", "A rule file with alert: and expr:", "An alert that has never fired"]
narration = "You have probably met this already. [[slnc 400]] A query in curly braces, piped to json, is Log Q L selecting a stream and reading its fields. [[slnc 500]] An X scope org I D header is the tenant, saying whose logs these are. [[slnc 500]] A rule file with alert and expr lines is an alert rule. [[slnc 500]] And an alert that has never fired may be quiet because all is well, or because it has a typo."

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Ship every security event, with a tenant", "Few labels; the rest in the line", "Write the investigator's questions in advance", "Prove every alert rule fires", "Protect the data source like the logs", "Set a retention"]
narration = "So, how do you use it? [[slnc 400]] Ship every security event, as a structured line, with a tenant. [[slnc 500]] Keep labels few, and put users and addresses in the line. [[slnc 500]] Write the investigator's questions in advance, as saved queries. [[slnc 300]] Prove that every alert rule fires, with a test event. [[slnc 500]] Protect the Grafana data source like the logs themselves. [[slnc 300]] And set a retention."

[[scene]]
key = "07-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a rule for a sign-in from", "an address that failed three times before."]
narration = "That's security logging with Loki and Grafana. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] A security log earns its keep when it answers who did what in one query, and when a tested rule watches it while nobody else does. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a rule for a successful sign-in from an address that failed three times before. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] Loki and Grafana do the storing and the asking; the Java classes ship events and ask questions over H T T P. [[slnc 300]] Here are the ones that matter."""

[[class]]
name = "Event"
what = "one security event, written as one JSON line"
[[class.part]]
title = "fixed fields, in a fixed order"
code = """
fields.put("request_id", requestId);
fields.put("event_type", eventType);
fields.put("actor", actor);
...
return JSON.writeValueAsString(fields);
"""
speech = """Every event becomes the same fields in the same order, written by Jackson as one J S O N line. [[slnc 300]] Jackson escapes any line break, so typed text cannot start a new line."""

[[class]]
name = "Loki"
what = "Loki's HTTP API for one tenant"
[[class.part]]
title = "every request names its tenant"
code = """
if (tenant != null) {
    request.header("X-Scope-OrgID", tenant);
}
"""
speech = """Every request to Loki carries the tenant header. [[slnc 300]] Without it, Loki answers four oh one."""
[[class.part]]
title = "a push: labels, a time, and the line"
code = """
long nanos = at.getEpochSecond() * 1_000_000_000L + at.getNano();
String body = JSON.writeValueAsString(Map.of("streams", List.of(Map.of("stream", labels,
        "values", List.of(List.of(String.valueOf(nanos), line))))));
"""
speech = """A push names the stream by its labels, and sends each line with its time in nanoseconds. [[slnc 300]] The labels decide the stream; the line is stored as it is."""

[[class]]
name = "Streams"
what = "a teaching class: the stream count, worked out"
[[class.part]]
title = "one stream per distinct label set"
code = """
Set<Map<String, String>> distinct = new HashSet<>(labelSets);
return distinct.size();
"""
speech = """Loki keeps one stream per different set of labels. [[slnc 300]] So the count can be worked out before sending: one hundred and fifty users as a label make one hundred and fifty streams. [[slnc 300]] The demo prints it next to Loki's own count."""

[[class]]
name = "Lab"
what = "starts Loki and Grafana in Docker, with the rules"
[[class.part]]
title = "the alert rule"
code = """
- alert: PasswordGuessing
  expr: sum by (source_ip) (count_over_time({app="bank"} | json | outcome="failure" [5m])) >= 3
"""
speech = """The rule is a Log Q L metric with a threshold. [[slnc 300]] Loki's ruler checks it every two seconds, and it fires for each address at three failures or more."""

[[class]]
name = "Grafana"
what = "a data source per tenant, and a query through it"
[[class.part]]
title = "the tenant header lives in the data source"
code = """
Map<String, Object> source = Map.of("name", name, "type", "loki", "access", "proxy", "url", "http://loki:3100",
        "jsonData", Map.of("httpHeaderName1", "X-Scope-OrgID"),
        "secureJsonData", Map.of("httpHeaderValue1", tenant));
"""
speech = """Grafana's data source stores the tenant header. [[slnc 300]] Anyone allowed to use this data source reads that tenant's logs, so access to Grafana is access to the logs."""

[[acronym]]
short = "JSON"
long = "JavaScript Object Notation: text made of named fields"
say = "J S O N is JavaScript object notation: a text format of named fields."
[[acronym]]
short = "LogQL, QL"
long = "Log Query Language: Loki's query language"
say = "Log Q L is the log query language of Loki: pick streams by label, then read and filter the lines."
[[acronym]]
short = "HTTP"
long = "Hypertext Transfer Protocol: how the programs talk"
say = "H T T P is the hypertext transfer protocol: requests and numbered answers, like two oh four or four oh one."
[[acronym]]
short = "204, 401, 404, 400"
long = "HTTP answers: stored, no tenant, no such route, refused"
say = "Two oh four means stored, with nothing to return. Four oh one means who are you. Four oh four means no such route. Four hundred means a bad request."
[[acronym]]
short = "X-Scope-OrgID"
long = "the header that names the tenant (organisation id)"
say = "X scope org I D is the request header that names the tenant: the organisation whose logs these are."
[[acronym]]
short = "id, ip"
long = "identifier; Internet Protocol (source_ip: the address)"
say = "An id is an identifier. I P is the internet protocol; a source I P is the address a request came from."
[[acronym]]
short = "OWASP, A09"
long = "Open Worldwide Application Security Project, Top 10 item 9"
say = "O W A S P is the open worldwide application security project. Item nine of its top ten is security logging and alerting failures."
[[acronym]]
short = "API"
long = "Application Programming Interface: the requests a program accepts"
say = "A P I is an application programming interface: the requests a program accepts from other programs."
