[docs.problem]
scenario = """
A bank writes security events to files on many machines, and an investigator needs to follow one address across all of them, and someone needs to be told when a guessing attack starts.
"""
naive = """
Log in to each machine and grep.
"""
deliver = [
    "A real Loki and Grafana in Docker.",
    "Shipping, tenants and refusals.",
    "Questions in LogQL that the old logger could not answer.",
    "A rule that fires, and a rule that does not.",
]

[docs.prerequisites]
required = [
    "Java basics",
    "The plain security-logging project, for the ideas",
    "Docker, with the grafana/loki:3.7.9 and grafana/grafana:13.2.4 images (pulled on first use)",
]
not_required = [
    "Any previous knowledge of Loki or Grafana",
]
install = ["docker"]

[docs.session]
objectives = [
    "push log lines to Loki with labels and a tenant",
    "write LogQL that answers an investigator's question",
    "choose what is a label and what stays in the line",
    "write an alert rule and prove that it fires",
]
walkthrough = """
Run act two and read the story from one address. In act three compare the number of streams. In act four find the rule that never fires and say why.
"""
exercises = [
    "Add a rule for a login success from an address that failed three times before.",
    "Ship the same events from a Logback JSON appender instead of a push.",
    "Add a third tenant and give it a rule of its own.",
    "Make Grafana show the failures per address as a table.",
]

[docs.explained]
sentence = """
A log store is useful when it can answer a question about the whole system in one line, and a rule is useful when someone has proved that it fires.
"""
verdict = """
Ship structured events with few labels, keep the rest in the line, separate tenants, test every rule with a known bad event, control who can use a data source, refuse or bound old events, and let the sender prove the lines were not changed.
"""
recognise = [
    "`{app=\"...\"} | json | field=\"value\"` in a query.",
    "`X-Scope-OrgID` in a request.",
    "A rule file with `alert:` and `expr:`.",
    "A Grafana data source with a custom header.",
]

[spec]
purpose = """
Teach shipping, querying and alerting on security logs with a real Loki and Grafana.
"""
nongoals = [
    "Running Loki in production.",
    "Shipping agents.",
    "Alert routing and paging.",
]
problem = """
Logs on many machines cannot answer a question about the whole system, and nobody is told when an attack begins.
"""
roles = [["The servers", "`Lab`"], ["The events", "`Event`"], ["Loki's API", "`Loki`"], ["Grafana's API", "`Grafana`"], ["Entry point", "`LokiLogsDemo`"]]
requirements = [
