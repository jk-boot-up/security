# concept.toml: everything about this project that is not Java code.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "security-logging-with-loki-and-grafana"
level = "intermediate"
module = "detection-and-response"
title = "Security Logging with Loki and Grafana"
short_title = "Logging with Loki"
package = "lokilogs"
main_class = "LokiLogsDemo"
tagline = "Ship the bank's security events to a real Loki, ask who moved the money in one line of LogQL, and let a rule watch for password guessing"
bold = "A real Loki 3 holds the bank's eight security events as JSON lines with two labels, answers who moved 500 and what else came from that address in LogQL, shows through Grafana the same lines for the same tenant and none for another, evaluates a rule that fires on four failed logins from one address, and does it per tenant; but a user as a label makes a stream for each user, a rule with a typo runs in silence, an old event is refused, Loki neither signs nor lets you change a line, and access to Grafana is access to the logs."
domain = "a bank"
domain_note = ""
youtube_description = "A real Loki 3.7 and Grafana 13 in Docker with the bank's eight security events as JSON lines: pushes answered with 204 and refused without a tenant, LogQL for the transfer, everything from the same address and failures counted by address, the cost of putting the user in a label (150 streams against 1), the Loki ruler firing on four failed logins from one address and a rule with a typo that never does, tenant isolation, an event ten days old refused, no delete API, and Grafana reading the same data through a data source that sends the tenant."
thumb_lines = ["LOGGING WITH", "LOKI AND GRAFANA"]
thumb_code = "{app=\"bank\"} | json | outcome=\"failure\""
youtube_title = "Security Logging with Loki and Grafana: LogQL, Labels, Alert Rules and Tenants (OWASP A09)"
youtube_tags = ["loki", "grafana", "logql", "security logging", "log alerting", "multi tenancy", "structured logs", "siem", "owasp top 10", "a09", "java"]

[readme]
intro = """
The plain [security-logging](../security-logging) project writes a security log that answers who, what, when, where from and how it ended, keeps secrets out, and shows when it was changed. Its last line says "a log that nobody reads is evidence only after the fact: the -with-loki-and-grafana version ships, queries and alerts." This is that version, against a real **Loki 3.7** (with its rule evaluator) and a real **Grafana 13**, both in Docker on a private network. It needs Docker; the tests are tagged `integration`: `./gradlew integrationTest`.

What it shows:
- **Shipping.** The morning's eight events are pushed as JSON lines with two labels (`app`, `event_type`); every push needs a tenant (`X-Scope-OrgID`), and a push without one gets `401 no org id`.
- **Asking in LogQL.** Which events mention ANA-1; who moved 500 or more (`ana` from `198.51.100.66`, request `req-0006`); everything from that address in time order (`login failure, login failure, login success, money-movement success`); failures counted by address. The question the old logger could not answer is one line.
- **Labels and content.** 150 users as a label make 150 streams; the same users in the line make one. Labels are for what you always select by.
- **Alerting.** A rule fires when one address has 3 failed logins in 5 minutes. Ana's two do not; four from `203.0.113.9` do, and the alert names the address. A second rule with a typo in a field name stays `inactive/ok` for ever: **test your rules**.
- **The bill.** Another tenant sees none of the bank's lines; an event ten days old is refused; there is no delete route; Grafana reads the same data through a data source that sends the tenant, and whoever can use that data source sees the logs.

**Maps to:** OWASP Top 10 (2025) A09 Security Logging and Alerting Failures · ASVS V16 Security Logging and Error Handling · CWE-778 (insufficient logging) · NIST CSF 2.0 Detect.
"""
analogy = """
A security office with a filing room and a night guard. The filing room (Loki) keeps every event in an order that can be searched; the guard (the rule) rings a bell when one visitor has failed at the door three times; and a guard who looks for the wrong colour of coat never rings at all.
"""
scenario = """
A bank's security events from one morning, shipped to a log store. The demo asks the questions an investigator asks, then sets a rule that a night operator would rely on.
"""
costs = [
    "**Labels are an index:** every value makes a stream, and too many streams make the store slow and expensive.",
    "**A rule can be silently wrong** and nothing says so.",
    "**Tenants separate data but do not authenticate people:** that is the job of what sits in front.",
    "**Logs need a retention,** and what is old is refused or removed.",
    "**The store does not prove the lines are true:** the sender signs or chains them.",
]
too_much = """
A single service on a single machine with a week of logs can read them with grep. Use a log store when logs come from many places, when more than one team reads them, or when a rule must watch them all the time.
"""
met_before = [
    "A Grafana dashboard with an \"Explore\" button.",
    "A `{app=\"...\"}` selector in a query.",
    "A log agent such as Promtail or Alloy configured with labels.",
    "A page at night because of an alert rule.",
]
where = """
This is the tools version of [security-logging](../security-logging), in the [detection-and-response](..) module. What goes into the lines is the subject of [secrets-in-errors-and-logs-with-logback](../../secure-coding/secrets-in-errors-and-logs-with-logback); what the rules look for next is in [detecting-attacks](../detecting-attacks) and its OpenSearch version.
"""
twin = """
Loki and Grafana are the real servers in Docker on loopback ports, with a rule file for the tenant bank. The events carry the time of the run, so times are never printed; counts, names and addresses are, and they are the same on every run. The demo takes about twenty seconds.
"""
test_note = "The event tests run with no server. The rest start Loki and Grafana once for the whole class and remove them (./gradlew integrationTest). They need Docker."

[[act]]
title = "Shipping the events"
summary = "Eight JSON lines with two labels are pushed and answered with 204; a push with no tenant is refused with 401."
detail = """
The morning's 8 events are pushed as JSON lines to a real Loki, each answered with 204, with two labels: app=bank and event_type. The label names Loki now knows are app, event_type and service_name (which it adds itself); there are 4 streams, one for each of the 4 event types. A push with no tenant header gets 401 no org id: every request names whose logs it is about.
"""
speech = """
First demo: shipping the events. [[slnc 400]] Eight events go to a real Loki as Jason lines, with two labels. [[slnc 600]]
Every push has to say whose logs they are. [[slnc 300]] Without a tenant, Loki says no.
"""
rows = { ship = "active ok" }
console = [
    ["8 events pushed: 204, 204, 204 ...", "ok"],
    ["labels: app, event_type; streams: 4", "ok"],
    ["a push with no tenant: 401 no org id", "ok"],
]

[[act]]
title = "Asking questions in LogQL"
summary = "Who moved 500 or more, everything from that address in order, and failures by address: the old logger's question in one line."
detail = """
A text filter for ANA-1 finds 3 events. Who moved 500 or more: ana from 198.51.100.66, ANA-1->MAL-9, success, request req-0006. Everything from that address, in time order: login failure, login failure, login success, money-movement success: someone with ana's password, not ana. Failures by address, counted by Loki: 198.51.100.66 has 2.
"""
speech = """
Second demo: asking questions in Log Q L. [[slnc 400]] Who moved five hundred or more? Ana, from one address, request six. [[slnc 600]]
Everything from that address: two failures, a success, and the transfer. [[slnc 300]] Someone with ana's password, not ana.
"""
rows = { ask = "active ok" }
console = [
    ["ana from 198.51.100.66, ANA-1->MAL-9, request req-0006", "ok"],
    ["login failure, login failure, login success, money-movement success", "bad"],
    ["failures by address: 198.51.100.66 = 2", "ok"],
]

[[act]]
title = "Labels and content"
summary = "A user as a label makes 150 streams; the same users in the line make one, and both answer the question."
detail = """
150 more logins, once with the user as a label and once as part of the line: 150 streams against 1. Asking for one user gives 1 line either way. Every label value makes a stream of its own and an entry in the index, so labels are for the few things you always select by, the application and the kind of event, and the rest stays in the line.
"""
speech = """
Third demo: labels and content. [[slnc 400]] A hundred and fifty users as a label make a hundred and fifty streams. [[slnc 600]]
The same users inside the line make one. [[slnc 300]] Both answer the question.
"""
rows = { labels = "active wrong" }
console = [
    ["user as a label: 150 streams", "bad"],
    ["user in the line: 1 stream", "ok"],
    ["one user: 1 line either way", "ok"],
]

[[act]]
title = "Alerting"
summary = "A rule fires for four failed logins from one address; a rule with a typo runs without complaint and never fires."
detail = """
Two rules are loaded for the tenant, evaluated every 2 seconds: PasswordGuessing and PasswordGuessingTypo, both inactive and ok. With ana's two failed logins in the logs, nothing is firing. Four failed logins from 203.0.113.9 are shipped; a moment later PasswordGuessing 203.0.113.9 is firing, with the text 203.0.113.9 failed to log in 3 times or more in 5 minutes. The rule with the typo in the field name, outcom, is still inactive and ok: it runs without a complaint and never fires. A rule is code: test it with a known bad event.
"""
speech = """
Fourth demo: alerting. [[slnc 400]] A rule watches for three failed logins from one address. [[slnc 600]]
Four arrive, and the alert fires, naming the address. [[slnc 300]] A second rule, with a typo, runs for ever and never fires.
"""
rows = { alert = "active ok" }
console = [
    ["ana's 2 failures: nothing firing", "ok"],
    ["4 from 203.0.113.9: PasswordGuessing 203.0.113.9 firing", "ok"],
    ["PasswordGuessingTypo: inactive/ok, never fires", "bad"],
]

[[act]]
title = "The bill"
summary = "Tenants separate data, old events are refused, there is no delete route, and access to Grafana is access to the logs."
detail = """
Another tenant, shop, asking for the bank's lines gets 0 of 12 and sees no labels. An event stamped ten days ago is refused with 400: the timestamp is too old. Asking Loki to delete the bank's lines through its API gets 404: the route is not there until retention and deletion are configured. Grafana, with a data source that sends the tenant bank, has a healthy connection and gives the same count as Loki; through the shop's data source it gives 0. Whoever can use a data source sees that tenant's logs. Loki does not prove that a line was not changed before it was sent.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] Another tenant sees none of the bank's lines. An event ten days old is refused. [[slnc 600]]
Grafana reads the same data through a data source that names the tenant. [[slnc 300]] Whoever can use it sees the logs.
"""
rows = { bill = "active wrong" }
console = [
    ["tenant shop: 0 of 12 lines, no labels", "ok"],
    ["an event ten days old: 400, too old", "bad"],
    ["Grafana: the same count through the bank's data source", "ok"],
]

