[[act]]
title = "The bill"
summary = "Another tenant sees 0 of the bank's 12 lines; an event 10 days old is refused because the limit is 168h = 7 days; there is no delete route (404); Grafana finds the same 6 failures through the bank's data source and 0 lines through the shop's; and access, proof and retention stay the team's job."
detail = """
The input: the tenant shop asks for {app="bank"}. The result: 0 lines, while the tenant bank sees 12, and no labels at all. An event stamped ten days ago meets the limit reject_old_samples_max_age 168h = 168 / 24 = 7 days; 10 > 7, so it is refused with 400, timestamp too old.
Asking Loki to delete the bank's lines is answered 404: the route is not there until deletion is configured, and no route changes a line once stored.
Grafana, with one data source per tenant header: bank, connection OK and 6 failures, the same as Loki's own 6; shop, connection OK and 0 bank lines. Left to the team: who may use a data source (that is who reads the logs), proof that a line was not changed before it was sent, retention, index size and keeping secrets out of the lines.
"""
figure = "tenants"
figure_title = "Tenants, an old event, a delete, and Grafana"
figure_speech = """
Fifth demo: the bill. [[slnc 400]] At the top left, another tenant, the shop, asks for the bank's lines. [[slnc 300]] It gets none: tenants keep the data apart. [[slnc 600]]
At the top right, Grafana. [[slnc 300]] Each data source sends one tenant header. [[slnc 300]] Through the bank's data source, Grafana finds the same six failures as Loki. [[slnc 300]] Through the shop's, nothing. [[slnc 300]] So whoever may use the bank's data source can read the bank's logs. [[slnc 600]]
In the middle, an event stamped ten days ago. [[slnc 300]] The limit is one hundred sixty eight hours, which is seven days, so it is refused. [[slnc 300]] And asking Loki to delete lines gets four oh four: the route is not there. [[slnc 600]]
At the bottom, what stays the team's job.
"""
speech = """
Here is the output. [[slnc 300]] The shop tenant asks for the bank's lines and gets zero; the bank itself sees twelve. [[slnc 400]] An event ten days old: the limit is one hundred sixty eight hours, divided by twenty four, seven days. [[slnc 300]] Ten is more than seven, so it is refused with four hundred. [[slnc 400]] A delete request gets four oh four.
[[page]]
Grafana, with a data source per tenant: the bank's finds six failures, like Loki itself, and the shop's finds no bank lines. [[slnc 400]] Still the team's job: who may use a data source, proof that a line was not changed before it was sent, retention, index size, and keeping secrets out of the lines.
"""
