[poster]
headline = [["SECURITY", "text"], ["LOGGING", "accent"]]
taglines = [["Who did it, with no secrets, and proof it was not changed", "gold"]]
before = { code = "INFO transfer done amount=500", note = "no who, no where, card in the clear", tag = "BEFORE" }
after = { code = "{\"actor\":\"ana\",\"source\":...,\"prev\":...}", note = "structured, redacted, chained", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "Security Logging"
narration = """Hello, and welcome. [[slnc 400]] This video explains security logging, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A security log is a record of security events, written so that it can answer, later, who did what, when, from where, and how it ended. [[slnc 600]] Think of a bank's visitor book. [[slnc 300]] It records every visit in the same columns. [[slnc 300]] It never records the combination of the safe. [[slnc 300]] And a copy goes to head office every evening. [[slnc 700]] In this video, the domain is an online bank. [[slnc 500]] By the end, you will hear what to log, and what never to log. [[slnc 300]] How typed text can forge a log line, and how to stop it. [[slnc 300]] How a log shows that it was changed. [[slnc 300]] And what logging costs."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["Five hundred leaves Ana's account.", "", "Ana says it was not her.", "", "Who did it, from where, and how?", "And can the bank prove the log", "was not changed?"]
narration = """Here is the scenario. [[slnc 400]] Five hundred leaves Ana's account, for an account nobody knows. [[slnc 500]] Ana says it was not her. [[slnc 500]] The bank must find out who did it, from where, and how. [[slnc 500]] And it must be able to prove that its log was not changed."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["Security event: one login, decision, payment or change", "Request id: ties every line of one request together", "Redaction: removing secrets before writing", "Log injection: typed text that writes a line", "Hash chain: each line names the one before"]
narration = """Before the demos, the words. [[slnc 500]] A security event is one login, one access decision, one money movement, or one admin change. [[slnc 500]] A request id ties together every line that one request wrote. [[slnc 500]] Redaction removes secrets before anything is written. [[slnc 500]] Log injection is typed text that writes a line of its own. [[slnc 500]] And a hash chain makes each line carry the hash of the line before it."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "09-ladder"
kind = "bullets"
title = "Four Properties of a Good Log"
body = ["Answerable: the same fields every time", "Safe: no secrets in it", "Honest: text cannot write lines", "Evident: a change shows", "", "Plus: it leaves the host."]
narration = """Let's put it together. [[slnc 400]] A good security log is answerable. The same fields, every time. [[slnc 500]] It is safe. It holds no secrets. [[slnc 500]] It is honest. Typed text cannot write lines. [[slnc 500]] And it is evident. A change shows. [[slnc 600]] And one more thing. It leaves the host, as it is written."""

[[scene]]
key = "10-roles"
kind = "bullets"
title = "Who Does What"
body = ["SecurityEvent: one structured event", "Redactor: removes and masks secrets", "Json: escaped lines, written and read", "SecurityLog: chains each line", "ChainCheck and Retention: verify and prune"]
narration = """Here is who does what in the code. [[slnc 400]] The security event record holds one event, with fixed fields. [[slnc 500]] The redactor removes secrets by name, and masks card numbers and tokens by their shape. [[slnc 500]] The J S O N class writes and reads lines, escaping every control character. [[slnc 500]] The security log chains each line to the one before. [[slnc 300]] And the chain check and retention classes verify the chain, and prune old lines without breaking it."""

[[scene]]
key = "11-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Audit logs in banking and card payments", "JSON lines with a trace id", "\"Attackers were inside for months\"", "Tokens found in log files"]
narration = """You have probably met this already. [[slnc 400]] Banking and card payment rules require audit logs that say who accessed what, and when. [[slnc 500]] Cloud log services store J S O N lines with a trace id. [[slnc 500]] Breach reports often say the attackers were inside for months, and nobody noticed. [[slnc 500]] And many incidents begin with passwords or tokens found in a log file."""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Structured events with a request id", "Redact by name and by shape, and test it", "Write JSON, never pasted text", "Chain lines, publish the head, ship off the host", "Set retention, budget volume, and watch it"]
narration = """So, how do you use it? [[slnc 400]] Log security events with fixed fields and a request id. [[slnc 500]] Redact by field name and by shape, and test the redactor with every secret you handle. [[slnc 500]] Write J S O N, never pasted text. [[slnc 500]] Chain the lines, publish the latest hash elsewhere, and ship every line off the host. [[slnc 500]] Set a retention period, budget the volume, and make sure someone watches it."""

[[scene]]
key = "13-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a redaction rule", "for a national id number."]
narration = """That's security logging. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] A security log must answer who did it, must hold no secrets, must not let typed text write it, and must show when it was changed. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine, with nothing installed except a Java development kit. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a redaction rule for a national id number, and a test that sends one through every field. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
The security log of an online bank: what each event records, how secrets are kept out, how typed text is written, how the log is chained, stored, shipped and pruned. It covers an attacker who types text into forms, a thief who reads
the log, and an intruder on the host who wants to hide what was done. It does not cover alerting on the log, or the log store's own security.
"""
assets = [
    "The record of who did what, which an investigation and a dispute depend on.",
    "The secrets the application handles: passwords, tokens, session ids and card numbers.",
    "The personal data in the log: names, account numbers and addresses.",
]
actors = [
    "Customers and staff whose actions are logged.",
    "An attacker who types text into forms, hoping to forge or hide records.",
    "A thief who gets a copy of the log file.",
    "An intruder on the host with the application's account, or with root.",
]
boundaries = [
    "Form input to the log writer: every typed character crosses it.",
    "The application to its log file on the host.",
    "The host to the separate log store, where shipped lines and the published head live.",
]
assumptions = [
    "The separate log store is outside the intruder's reach.",
    "The clock is trusted; in the demo it is simulated.",
    "In the demo all names, addresses and secrets are fictional, and no secret is printed.",
]
out_of_scope = [
    "Alerting and detection rules: the detecting-attacks project.",
    "The log store's own access control.",
    "Signing the head hash: an exercise.",
]
tests = [
    "`JsonAndRedactorTest` checks escaping and parsing of any text, refusals of malformed lines, and redaction by name and by shape.",
    "`SecurityLogTest` checks that no secret reaches the log, the fields of every line, forged lines, the chain against deletion, edits, garbling and truncation, file permissions and retention.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next project, detecting-attacks, reads the security log and raises alerts for password spraying, impossible travel and privilege changes.
"""

[[threat]]
id = "T1"
stride = "R"
threat = "An action cannot be traced to who did it, from where, because the log does not record it"
where = "`SecurityLog.record`, `SecurityEvent`"
control = "Structured events with fixed fields and a request id for logins, access decisions, money movements and admin changes"
residual = "Events the application never sends are still missing, so the event list needs review with each feature"

[[threat]]
id = "T2"
stride = "I"
threat = "Passwords, tokens, session ids or card numbers end up in the log and are stolen with it"
where = "`Redactor`"
control = "Removal by field name, masking by shape in free text, and tests that feed every known secret through the log"
residual = "A new kind of secret in an unexpected field needs a new rule"

[[threat]]
id = "T3"
stride = "T"
threat = "Typed text forges a log line or a field, misleading an investigation"
where = "`Json.write`"
control = "JSON lines with every control character and quote escaped, and text kept whole"
residual = "Tools that render log text unescaped, such as a web viewer, need their own output encoding"

[[threat]]
id = "T4"
stride = "T"
threat = "An intruder deletes or edits lines to hide what was done"
where = "`ChainCheck`, the log file"
control = "A hash chain that breaks at the first changed or missing line, and a published head for the last line"
residual = "An intruder with root can rebuild the whole chain, so only the shipped copy and the published head are trustworthy"

[[threat]]
id = "T5"
stride = "D"
threat = "The log is destroyed with the host"
where = "the local file"
control = "Every line shipped to a separate store as it is written"
residual = "Lines written in the moment before shipping can be lost"

[[threat]]
id = "T6"
stride = "I"
threat = "The log is read by someone who should not see personal data, or kept longer than needed"
where = "the log file, `Retention`"
control = "Owner-only permissions and a retention period with an anchor so pruning keeps the chain checkable"
residual = "Copies in backups and shipped stores need the same retention"
