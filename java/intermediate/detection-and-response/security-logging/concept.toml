[[act]]
title = "A log that shows it was changed"
summary = "Each line's prev is the SHA-256 of the line before; editing line 6's amount from 500 to 50 changes its hash, so the chain breaks at line 7, deleting it breaks it at line 6, and an edited last line is found only against the head kept elsewhere."
detail = """
The input is the morning's 8 lines, written to an owner-only file by appending. Each line's prev field is the SHA-256 of the line before (line 1 starts from all zeros), and the head, the SHA-256 of line 8, is kept elsewhere.
The result: the untouched log is intact. Editing line 6's amount from 500 to 50 changes line 6's hash (3d32ec7f52d2 becomes 347bfe928ef5) while line 7's prev still names the old one, so the chain is broken at line 7. Deleting line 6 breaks it at line 6.
Editing line 8 leaves the chain intact, because nothing follows it; compared with the head, it does not match, so the change is found. Root can still rewrite the file and its whole chain, which is why the log must also leave the host.
"""
figure = "chain"
figure_title = "Eight lines chained by SHA-256, and an edit to line 6"
figure_speech = """
Fourth demo: a log that shows it was changed. [[slnc 400]] At the top, the morning's eight lines. [[slnc 300]] Each line has a field called prev: the S H A two fifty six hash of the line before it. [[slnc 300]] Line one starts from all zeros. [[slnc 300]] And the hash of the last line, the head, is kept somewhere else. [[slnc 600]]
In the middle, an edit. [[slnc 300]] Someone changes line six's amount from five hundred to fifty. [[slnc 300]] Line six's hash changes completely. [[slnc 300]] But line seven still names the old hash. [[slnc 300]] So the chain is broken at line seven. [[slnc 600]]
At the bottom, the last line. [[slnc 300]] Nothing follows it, so an edit there breaks no link. [[slnc 300]] Compared with the head kept elsewhere, it does not match, and the change is found.
"""
speech = """
Here is the chain, with the first twelve hex digits of each hash. [[slnc 300]] Line one's prev is all zeros. [[slnc 300]] Every other line's prev is the S H A two fifty six of the line before. [[slnc 300]] The head is the hash of line eight, kept elsewhere.
[[page]]
How an edit is found: line six's hash before and after the edit differ, and line seven's prev is still the old one. [[slnc 400]] The checks: the untouched log is intact. [[slnc 300]] Deleting line six breaks the chain at line six, and editing it breaks the chain at line seven. [[slnc 300]] Editing line eight looks intact, but it does not match the head.
[[page]]
The file is written by appending only, and only its owner can read or write it. [[slnc 300]] But an attacker with root can rewrite the file and its whole chain. [[slnc 300]] So the log must also leave the host.
"""
rows = { tamper = "active ok" }
console = [
    ["THE CHAIN (each line's prev, the first 12 hex digits):", "code"],
    ["  line 1  prev 000000000000  (the start: all zeros)", "muted"],
    ["  line 2  prev 2c83d7c10ac6  = SHA-256 of line 1", "muted"],
    ["  line 3  prev 5b8481140de9  = SHA-256 of line 2", "muted"],
    ["  line 4  prev 7e141784e039  = SHA-256 of line 3", "muted"],
    ["  line 5  prev 575f79ee5769  = SHA-256 of line 4", "muted"],
    ["  line 6  prev 357222acfa26  = SHA-256 of line 5", "muted"],
    ["  line 7  prev 3d32ec7f52d2  = SHA-256 of line 6", "muted"],
    ["  line 8  prev a6e4a60a06e9  = SHA-256 of line 7", "muted"],
    ["  head         c588e90f2f57  = SHA-256 of line 8, kept elsewhere", "muted"],
    ["---", ""],
    ["HOW AN EDIT IS FOUND (line 6's amount, 500 -> 50):", "code"],
    ["  SHA-256 of line 6 before  3d32ec7f52d2", "muted"],
    ["  SHA-256 of line 6 after   347bfe928ef5", "muted"],
    ["  line 7's prev             3d32ec7f52d2  <- NO LONGER EQUAL", "bad"],
    ["THE CHECKS (the log as found, and the result):", "code"],
    ["  the morning's 8 lines     intact", "muted"],
    ["  line 6 deleted            broken at line 6", "ok"],
    ["  line 6 amount 500 -> 50   broken at line 7", "ok"],
    ["  line 8 amount 80 -> 8     intact  <- NOTHING FOLLOWS IT", "amber"],
    ["  line 8, against the head  does not match: found", "ok"],
    ["---", ""],
    ["THE FILE:", "code"],
    ["  written by   appending only", "muted"],
