[docs.problem]
scenario = """
An online bank sees 500 leave a customer's account for an unknown one. The customer says it was not her. The bank must find out who did it, from where and how, from its logs, and prove the logs were not changed.
"""
naive = """
Log free-text messages for developers, include whatever the code has at hand, card numbers and tokens included, and keep the file on the server. The log then cannot answer the question, holds secrets, accepts forged lines, and disappears with the server.
"""
deliver = [
    "A structured security event with the same fields every time and a request id.",
    "A redactor that removes secrets by field name and masks card numbers and tokens by their shape.",
    "JSON lines written and read without a library, with every control character escaped.",
    "A hash-chained log, a chain checker, and a published head hash.",
    "Shipping to a second store, retention with an anchor, and a volume estimate.",
    "The same output on every run.",
]

[docs.prerequisites]
required = [
    "Java basics",
    "The beginner project hashing-and-integrity, or an idea of what SHA-256 is",
]
not_required = [
    "A logging framework: the log is written by the project's own small writer",
    "A log server: the -with-loki-and-grafana version adds one",
]
install = []

[docs.session]
objectives = [
    "list the fields a security event needs, and the event types a bank must log",
    "name the values that must never be logged, and two ways to keep them out",
    "explain log injection and why structured output prevents it",
    "explain what a hash chain detects, what it cannot, and why logs must leave the host",
]
walkthrough = """
Start with the visitor book. Run the demo one act at a time. After act one, ask the group what other questions an investigator would ask. After act two, ask where else in their own systems a token could end up in a log. In act three, ask what
a forged line could make an investigator believe. In act four, ask who could still rewrite the log, and where the published head should live.
"""
exercises = [
    "Add an event type for changes to a customer's contact details and log it from a new demo step.",
    "Add a redaction rule for a national id number and a test that feeds one through every field.",
    "Make the chain checker report every broken line, not only the first.",
    "Sign the published head with an Ed25519 key, as in the digital-signatures project, and verify it before trusting the chain.",
]

[docs.explained]
sentence = """
A security log records every security event with the same fields, never holds secrets, escapes the text it records, and carries a hash chain whose latest hash is kept elsewhere, so that it can answer who did what, cannot be used to steal or forge, and shows when it was changed.
"""
verdict = """
Log logins, access decisions, money movements and admin changes as structured events with a request id. Redact by field name and by shape, and test the redactor with every secret the application handles. Write JSON, never pasted text.
Chain the lines, publish the head elsewhere, ship every line off the host as it is written, set a retention period, and budget the volume. Then watch the log, because a log nobody reads is only evidence.
"""
recognise = [
    "JSON log lines with `trace_id` or `request_id` fields.",
    "Audit-log requirements in payment and banking standards.",
    "Log masking settings for card numbers and tokens.",
    "Write-once log storage and log-shipping agents.",
]

[spec]
purpose = """
Teach security logging by logging one morning at an online bank: what to record, what never to record, how to keep user text from writing the log, how to show a change, and what logging costs.
"""
nongoals = [
    "A logging framework and a log server: the -with-loki-and-grafana version.",
    "Detection rules and alerts: the detecting-attacks project.",
    "Signing the head hash: an exercise.",
]
problem = """
Learners log for debugging, and only discover during an incident that the log cannot answer the questions, holds secrets, or can be changed.
"""
roles = [["A security event", "`SecurityEvent`"], ["The security log and its chain", "`SecurityLog`"], ["What may be written down", "`Redactor`"], ["Escaped JSON lines", "`Json`"], ["Checking the chain", "`ChainCheck`"], ["Retention with an anchor", "`Retention`"], ["The old logger", "`PlainLogger`"], ["The bank's morning", "`BankDay`"], ["Entry point", "`SecurityLoggingDemo`"]]
requirements = [
    "Every line has the same fields and a request id, and the transfer can be traced to its source address.",
    "No secret from the bank's events appears in the log, whether in a named field or in free text.",
    "Any text round-trips through a log line without breaking it or adding a field.",
    "A deleted, edited or garbled line breaks the chain; an edited or removed last line is found by the published head.",
    "Pruned logs still check from their anchor.",
    "The demo prints the same output on every run.",
]

