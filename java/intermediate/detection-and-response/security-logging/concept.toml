[threatmodel]
scope = """
The security log of an online bank: what each event records, how secrets are kept out, how typed text is written, how the log is chained, stored, shipped and pruned. It covers an attacker who types text into forms, a thief who reads
the log, and an intruder on the host who wants to hide what was done. It does not cover alerting on the log, or the log store's own security.
"""
assets = [
    "The record of who did what, which an investigation and a dispute depend on.",
    "The secrets the application handles: passwords, tokens, session ids and card numbers.",
    "The personal data in the log: names, account numbers and addresses.",
]
actors = [
    "Customers and staff whose actions are logged.",
    "An attacker who types text into forms, hoping to forge or hide records.",
    "A thief who gets a copy of the log file.",
    "An intruder on the host with the application's account, or with root.",
]
boundaries = [
    "Form input to the log writer: every typed character crosses it.",
    "The application to its log file on the host.",
    "The host to the separate log store, where shipped lines and the published head live.",
]
assumptions = [
    "The separate log store is outside the intruder's reach.",
    "The clock is trusted; in the demo it is simulated.",
    "In the demo all names, addresses and secrets are fictional, and no secret is printed.",
]
out_of_scope = [
    "Alerting and detection rules: the detecting-attacks project.",
    "The log store's own access control.",
    "Signing the head hash: an exercise.",
]
tests = [
    "`JsonAndRedactorTest` checks escaping and parsing of any text, refusals of malformed lines, and redaction by name and by shape.",
    "`SecurityLogTest` checks that no secret reaches the log, the fields of every line, forged lines, the chain against deletion, edits, garbling and truncation, file permissions and retention.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next project, detecting-attacks, reads the security log and raises alerts for password spraying, impossible travel and privilege changes.
"""

[[threat]]
id = "T1"
stride = "R"
threat = "An action cannot be traced to who did it, from where, because the log does not record it"
where = "`SecurityLog.record`, `SecurityEvent`"
control = "Structured events with fixed fields and a request id for logins, access decisions, money movements and admin changes"
residual = "Events the application never sends are still missing, so the event list needs review with each feature"

[[threat]]
id = "T2"
stride = "I"
threat = "Passwords, tokens, session ids or card numbers end up in the log and are stolen with it"
where = "`Redactor`"
control = "Removal by field name, masking by shape in free text, and tests that feed every known secret through the log"
residual = "A new kind of secret in an unexpected field needs a new rule"

[[threat]]
id = "T3"
stride = "T"
threat = "Typed text forges a log line or a field, misleading an investigation"
where = "`Json.write`"
control = "JSON lines with every control character and quote escaped, and text kept whole"
residual = "Tools that render log text unescaped, such as a web viewer, need their own output encoding"

[[threat]]
id = "T4"
stride = "T"
threat = "An intruder deletes or edits lines to hide what was done"
where = "`ChainCheck`, the log file"
control = "A hash chain that breaks at the first changed or missing line, and a published head for the last line"
residual = "An intruder with root can rebuild the whole chain, so only the shipped copy and the published head are trustworthy"

[[threat]]
id = "T5"
stride = "D"
threat = "The log is destroyed with the host"
where = "the local file"
control = "Every line shipped to a separate store as it is written"
residual = "Lines written in the moment before shipping can be lost"

[[threat]]
id = "T6"
stride = "I"
threat = "The log is read by someone who should not see personal data, or kept longer than needed"
where = "the log file, `Retention`"
control = "Owner-only permissions and a retention period with an anchor so pruning keeps the chain checkable"
residual = "Copies in backups and shipped stores need the same retention"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] There is no logging library: a few small classes do the work. [[slnc 300]] Here are the ones that matter."""

[[class]]
name = "SecurityLog"
what = "one event becomes one chained JSON line"
[[class.part]]
title = "fixed fields, then the chain"
code = """
fields.put("prev", head);
...
Redactor.details(event.details())
        .forEach((name, value) -> fields.put("detail." + name, value));
String line = Json.write(fields);
for (LogSink sink : sinks) {
    sink.write(line);
}
head = Hashes.sha256(line);
"""
speech = """Every event becomes the same fields, and the first one, prev, is the hash of the line before. [[slnc 300]] The details pass through the redactor. [[slnc 300]] The line goes to every sink, the local file and the shipped store, and its hash becomes the new head."""

[[class]]
name = "Redactor"
what = "decides what of an event may be written down"
[[class.part]]
title = "removed by the field's name"
code = """
private static final Set<String> SECRET_NAMES = Set.of("password",
        "passcode", "pin", "otp", "secret", "token", "authorization",
        "cookie", "session", "session-id");
...
details.forEach((name, value) ->
        out.put(name, isSecretName(name) ? REMOVED : text(value)));
"""
speech = """A field whose name is on this list is replaced by removed, whatever its value. [[slnc 300]] Every other value still goes through the shape checks."""
[[class.part]]
title = "card numbers caught by their shape"
code = '''
private static final Pattern CARD =
        Pattern.compile("\\b(?:\\d[ -]?){12,18}\\d\\b");
...
String digits = card.group().replaceAll("[ -]", "");
card.appendReplacement(masked, "*".repeat(digits.length() - 4)
        + digits.substring(digits.length() - 4));
'''
speech = """Thirteen to nineteen digits, with optional spaces or hyphens, is the shape of a card number. [[slnc 300]] The digits are counted, and all but the last four become stars."""

[[class]]
name = "Json"
what = "writes and reads one line, escaping every control character"
[[class.part]]
title = "escape, never trust"
code = '''
case '"' -> out.append("\\\"");
case '\\' -> out.append("\\\\");
case '\n' -> out.append("\\n");
'''
speech = """A quote, a backslash and a line break are each written as a backslash sequence. [[slnc 300]] So typed text can never end a field or start a new line."""

[[class]]
name = "ChainCheck"
what = "walks the chain and names the first line that does not follow"
[[class.part]]
title = "each prev must be the hash of the line before"
code = """
if (!expected.equals(fields.get("prev"))) {
    return new Result(false, i + 1, expected);
}
expected = Hashes.sha256(line);
"""
speech = """The check starts from the anchor, all zeros for a fresh log. [[slnc 300]] Each line's prev must equal the hash of the line before. [[slnc 300]] The first line where it does not is where the chain is broken."""

[[class]]
name = "Retention"
what = "removes old lines and keeps the rest checkable"
[[class.part]]
title = "the first kept line's prev is the anchor"
code = """
if (Instant.parse(Json.parse(line).get("time")).isBefore(cutoff)) {
    removed++;
} else {
    if (anchor == null) {
        anchor = Json.parse(line).get("prev");
    }
"""
speech = """Lines older than the cutoff are removed. [[slnc 300]] The prev of the first kept line becomes the new anchor, written down when the old lines go. [[slnc 300]] The kept lines check from it."""

[[acronym]]
short = "JSON"
long = "JavaScript Object Notation: text made of named fields"
say = "J S O N is JavaScript object notation: a text format of named fields, with quotes and backslashes escaped."
[[acronym]]
short = "SHA-256"
long = "Secure Hash Algorithm, 256 bits: a fingerprint of data"
say = "S H A two fifty six is the secure hash algorithm with a two hundred fifty six bit result: change one character, and the whole hash changes."
[[acronym]]
short = "hex"
long = "hexadecimal: digits 0 to 9 and a to f, four bits each"
say = "Hex is hexadecimal: the digits zero to nine and a to f, each one standing for four bits."
[[acronym]]
short = "id"
long = "identifier: a value that names one thing"
say = "An id is an identifier: a value that names one thing, such as one session or one request."
[[acronym]]
short = "T, Z"
long = "in 2026-10-18T09:05:00Z: T starts the time, Z means UTC"
say = "In the timestamps, T separates the date from the time, and Z means the time is in U T C."
[[acronym]]
short = "UTC"
long = "Coordinated Universal Time: one clock for every server"
say = "U T C is coordinated universal time: one clock for every server, so logs from different places line up."
[[acronym]]
short = "OWASP, A09"
long = "Open Worldwide Application Security Project, Top 10 item 9"
say = "O W A S P is the open worldwide application security project. Item nine of its top ten is security logging and alerting failures."
