[[act]]
title = "What never to log"
summary = "The old logger wrote the full card number; the redactor removes the tried password, the session id and the Authorization header by their field names, masks card numbers to the last four by their shape, even in a free-text note, and 0 of 5 fake secrets reach the security log."
detail = """
The input: the old logger's card payment line holds the full card number, so a leaked log leaks the card; and the events' details hold five fake secrets: a tried password, a session id, a bearer token in the Authorization header, a card number, and the same card
number typed into a free-text note.
The result: after the redactor, the password, the session and the authorization are [removed], by their field names. The card numbers are caught by their shape, 13 to 19 digits: 4111111111111111 has 16 digits, so 12 stars and the last four, ************1111,
and the note's hyphenated number is masked the same way. A search finds 0 of the 5 secrets in the security log.
"""
figure = "redaction"
figure_title = "Five secrets, before and after the redactor"
figure_speech = """
Second demo: what never to log. [[slnc 400]] On the left, before the redactor: secrets the bank's code holds while it handles the morning. [[slnc 300]] They are fake test values. [[slnc 300]] A password tried in a failed login. [[slnc 300]] A session id. [[slnc 300]] A bearer token in the authorization header. [[slnc 300]] A card number. [[slnc 300]] And the same card number, typed by a customer into a free text note. [[slnc 600]]
On the right, after the redactor: the same fields, as the security log writes them. [[slnc 300]] The password, the session and the authorization are removed, because of their field names. [[slnc 300]] The card number is caught by its shape: sixteen digits. [[slnc 300]] It keeps only its last four: twelve stars, then one one one one. [[slnc 300]] The note is caught the same way, even with hyphens between the groups.
"""
speech = """
Here is the output. [[slnc 300]] The old log wrote the card payment with the full card number. [[slnc 300]] A leaked log leaks the card. [[slnc 400]] Before the redactor: five fake secrets in the events' details. [[slnc 300]] The bearer token is long, so it is on a line of its own.
[[page]]
After the redactor: three values are removed, and the two card numbers keep only their last four digits. [[slnc 400]] How each one was caught: three by field name, and the card numbers by their shape. [[slnc 300]] Sixteen digits, minus the last four, is twelve stars. [[slnc 400]] The search: zero of the five secrets are found in the security log.
