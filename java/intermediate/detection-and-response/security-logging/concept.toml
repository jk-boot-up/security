The volume, worked out. [[slnc 300]] The morning's eight lines are two thousand three hundred twenty five bytes: about two hundred ninety one bytes a line. [[slnc 300]] Times two million logins, that is about five hundred eighty two megabytes a day, for logins alone. [[slnc 400]] And a log nobody reads explains a breach only afterwards. [[slnc 300]] Watching it is the next project.
"""
