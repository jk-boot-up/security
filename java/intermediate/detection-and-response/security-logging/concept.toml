[[act]]
title = "The bill"
summary = "A shipped copy keeps all 8 lines when the local log is deleted; keeping 30 days removes 10 of 40 daily lines while the 30 kept still check from their anchor; and 291 bytes a line times 2000000 logins is about 582 megabytes a day."
detail = """
The input: every line goes to two stores as it is written, and the attacker deletes the local log. The result: local 0 lines, shipped 8 lines, chain intact.
Retention: one login a day for 40 days from 2026-01-01, keeping 30 days. Today is 2026-02-10 (day 41), so the cutoff is today - 30 days = 2026-01-11: 10 lines (day 1 to 10) are removed and 30 kept, and the kept lines check from the anchor, the first kept line's prev.
The volume: the morning's 8 lines are 2325 bytes, 2325 / 8 = 291 bytes a line; 2000000 logins a day x 291 = 582000000 bytes, about 582 megabytes a day for logins alone. And a log nobody reads explains a breach only afterwards: the -with-loki-and-grafana version ships, queries and alerts.
"""
figure = "bill"
figure_title = "A copy that survives, a period to keep, and the bytes"
figure_speech = """
Fifth demo: the bill. [[slnc 400]] At the top left, two stores. [[slnc 300]] Each line is written to the local log and shipped to a second store at the same moment. [[slnc 300]] The attacker deletes the local log: zero lines. [[slnc 300]] The shipped copy still has all eight, and its chain is intact. [[slnc 600]]
At the top right, retention. [[slnc 300]] A log with names and addresses is personal data, so it is kept only for a fixed time. [[slnc 300]] One login a day for forty days, and thirty days are kept. [[slnc 300]] The first ten lines, in red, go. [[slnc 300]] The thirty in green stay, and they still check from an anchor written down when the old ones went. [[slnc 600]]
At the bottom, the volume. [[slnc 300]] The morning's lines average two hundred ninety one bytes. [[slnc 300]] Two million logins a day write about five hundred eighty two megabytes a day. [[slnc 300]] So logging needs a budget.
"""
speech = """
Here is the output. [[slnc 300]] Before the attacker, each store has eight lines. [[slnc 300]] After the attacker deletes the local log, the local store has zero lines, and the shipped one still has eight, with an intact chain.
[[page]]
Retention. [[slnc 300]] The first line is from January the first, and today is day forty one. [[slnc 300]] The cutoff is today minus thirty days: January the eleventh. [[slnc 300]] Ten lines are removed, and thirty are kept. [[slnc 300]] The anchor is the first kept line's prev, and the kept lines check from it.
