[[act]]
title = "What never to log"
summary = "The old logger wrote the full card number; the security log removes the tried password, the session id and the Authorization header, masks card numbers to the last four, even in a free-text note, and holds 0 of 5 secrets."
detail = """
The old logger's card payment line holds the full card number, so a breach of the log is a breach of the cards. The security log's redactor removes the password tried in a failed login, the session id of the new login and the transfer's
Authorization header, and masks the card to ************1111, including a card number typed into a free-text note. Of the 5 secrets in the morning's events, 0 are found anywhere in the security log. Secrets are removed by field name, and card numbers and tokens also by their shape.
"""
speech = """
Second demo: what never to log. [[slnc 400]] The old logger wrote the full card number into its file. [[slnc 300]] A breach of the log is a breach of the cards. [[slnc 600]]
The security log passes every event through a redactor. [[slnc 300]] The password tried in a failed login is removed. [[slnc 300]] So is the session id, and the token in the authorization header. [[slnc 600]]
The card number keeps only its last four digits. [[slnc 300]] Even when a customer types it into a free text note. [[slnc 600]]
Of the five secrets in the morning's events, none is found in the security log.
"""
rows = { never = "active ok" }
console = [
    ["the old logger's card payment line holds the full card number: true  <- A BREACH OF THE LOG IS A BREACH OF THE CARDS", "bad"],
    ["the password tried in a failed login: [removed]", "ok"],
    ["the session id of the new login: [removed]", "ok"],
    ["the transfer's Authorization header: [removed]", "ok"],
    ["the card payment: card ************1111, and a card number typed into the note: \"paid with ************1111\"", "ok"],
    ["secrets from the morning's events found anywhere in the security log: 0 of 5", "ok"],
]

[[act]]
title = "Text that tries to write the log"
summary = "A username with a line break forges a second line in the old logger's file; the security log writes one line whose actor is exactly what was typed, and a quote with a fake field cannot change the outcome."
detail = """
A username typed into the login form contains a line break followed by text that looks like a log line: "INFO login ok user=admin". In the old logger's file it becomes a second line, a forged record of an admin login. The security log
writes one JSON line, with the line break escaped; read back, the actor is exactly what was typed and the outcome is failure. A username carrying a quote and a fake outcome field cannot change the outcome either. Structured output escapes
text instead of trusting it, and keeps it whole, so investigators see exactly what was sent.
"""
speech = """
Third demo: text that tries to write the log. [[slnc 400]] Someone types a username with a line break in it, followed by text that looks like a log line. [[slnc 600]]
In the old logger's file, that becomes a second line. [[slnc 300]] A forged record of an admin login. [[slnc 600]]
The security log writes one line, with the line break escaped. [[slnc 300]] Read back, the name is exactly what was typed, and the outcome is still failure. [[slnc 600]]
A quote with a fake outcome field does not change the outcome either. [[slnc 300]] The text is escaped, and kept whole, so nothing is hidden from an investigator.
"""
rows = { injection = "active amber" }
console = [
    ["a username typed into the login form: \"mallory\\n2026-10-18T09:09:00Z INFO login ok user=admin\"", "muted"],
    ["the old logger's file now has 2 lines; the second reads: 2026-10-18T09:09:00Z INFO login ok user=admin  <- A FORGED LINE", "bad"],
    ["the security log wrote 1 line; read back, the actor is exactly what was typed: true, and the outcome is failure", "ok"],
    ["a username carrying a quote and a fake field: the outcome still reads failure, and the actor is the text as typed: true", "ok"],
]

[[act]]
title = "A log that shows it was changed"
summary = "Each line carries the SHA-256 of the line before; deleting line 6 breaks the chain at line 6, editing it breaks it at line 7, and an edited last line is found only by comparing with the latest hash published elsewhere."
detail = """
Each line carries the SHA-256 of the line before it, and the morning's 8 lines form an intact chain. Deleting line 6, the transfer, breaks the chain at line 6. Editing line 6's amount from 500 to 50 breaks it at line 7, the line after the edit.
An edited last line leaves the chain intact, because nothing follows it; comparing with the latest hash, published somewhere else as each line is written, finds the change. The file is written by appending only, with permissions rw-------. An attacker
with root can still rewrite the whole file and its chain, which is why the log must also leave the host.
"""
speech = """
Fourth demo: a log that shows it was changed. [[slnc 400]] Each line carries the S H A two five six hash of the line before it. [[slnc 300]] The morning's lines form an unbroken chain. [[slnc 600]]
Delete the transfer, and the chain breaks at that line. [[slnc 300]] Edit its amount from five hundred to fifty, and the chain breaks at the next line. [[slnc 600]]
Edit the last line, and the chain alone still looks intact, because nothing follows it. [[slnc 300]] Compared with the latest hash, published somewhere else, the change is found. [[slnc 600]]
The file is owner only, and written by appending. [[slnc 300]] But anyone with root can rewrite the whole chain, so the log must also leave the host.
"""
rows = { tamper = "active ok" }
console = [
    ["each line carries the SHA-256 of the line before it; the morning's 8 lines: intact", "ok"],
    ["line 6, the transfer, deleted: broken at line 6", "ok"],
    ["line 6's amount edited from 500 to 50: broken at line 7", "ok"],
    ["the last line edited: intact  <- NOTHING FOLLOWS THE LAST LINE TO GIVE IT AWAY", "amber"],
    ["compared with the latest hash, published somewhere else as each line is written: does not match, so the change is found", "ok"],
    ["the file is written by appending only, with permissions rw-------", "muted"],
]

[[act]]
title = "The bill"
summary = "A shipped copy survives the local log's deletion; keeping 30 days removes 10 old lines while the rest still check from their anchor; 2000000 logins a day are about 582 megabytes; and a log nobody reads protects nothing."
detail = """
Every line is also shipped to a second store as it is written; when the attacker deletes the local log, the local copy has 0 lines and the shipped one has all 8, with its chain intact. Names and addresses make the log personal data, so it is kept for a fixed time:
keeping 30 days, on day 41, 10 old lines go and 30 stay, and the kept lines still check from the anchor written down when the old ones went. The morning's lines average 291 bytes, so 2000000 logins a day write about 582 megabytes a day for logins alone. And
a log that nobody reads is evidence only after the fact: the -with-loki-and-grafana version ships, queries and alerts.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] Every line is shipped to a second store as it is written. [[slnc 300]] The attacker deletes the local log. [[slnc 300]] The shipped copy still has every line, and its chain is intact. [[slnc 600]]
The log holds names and addresses, so it is personal data, kept for a fixed time. [[slnc 300]] With thirty days kept, ten old lines go, and the rest still check from an anchor written down when the old ones went. [[slnc 600]]
Each line is about three hundred bytes. [[slnc 300]] Two million logins a day is more than half a gigabyte, for logins alone. [[slnc 300]] So logging needs a budget. [[slnc 600]]
And a log that nobody reads only explains a breach afterwards. [[slnc 300]] Watching it, and alerting, is the next step.
"""
rows = { what = "active amber", tamper = "active amber" }
