[[scene]]
key = "01-poster"
kind = "poster"
title = "Detecting Attacks in Logs"
narration = "Hello, and welcome. [[slnc 400]] This video explains how to detect attacks in logs, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A log records what happened. [[slnc 300]] A detection rule decides which of it looks like an attack, like many failed passwords for one account. [[slnc 300]] Each rule is a guess about an attacker, and it must be measured against a normal day, because a rule that catches the attack and buries the analyst in false alarms is not detection. [[slnc 600]] Think of a smoke alarm that goes off every time someone makes toast. [[slnc 300]] Soon nobody listens to it. [[slnc 600]] Our example is an online bank's sign-in and admin logs. [[slnc 500]] By the end, you will see how five rules decide, why password spraying escapes a per-account rule, how to work out a threshold from the normal day, and how context turns twenty nine alerts into nine."

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["One Monday of logs for an online bank", "with 200 accounts:", "  768 sign-ins and 4 admin role grants", "  113 events belong to four attacks", "", "The day is generated with a fixed seed,", "so every run is the same, and the", "scoring knows which events are attacks."]
narration = "Here is the scenario. [[slnc 400]] One Monday of logs for an online bank with two hundred accounts: seven hundred sixty eight sign-ins, and four admin role grants. [[slnc 500]] One hundred thirteen of those events belong to four attacks: password spraying, brute force, impossible travel, and a privilege change. [[slnc 500]] The day is generated with a fixed seed, so every run is the same, and the scoring knows which events are attacks. [[slnc 300]] The rules do not."

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["Detection rule: a guess about an attacker", "True alert: about a real attack", "False alert: about a look-alike", "Threshold: the number a rule must reach", "Brute force: many guesses, one account", "Spraying: few guesses, many accounts"]
narration = "Before the demos, the words. [[slnc 500]] A detection rule is a guess about an attacker, written as code: if this happens, raise an alert. [[slnc 500]] A true alert is about a real attack. [[slnc 300]] A false alert is about a look-alike: normal behaviour that resembles an attack. [[slnc 500]] A threshold is the number a rule must reach before it fires. [[slnc 500]] Brute force is many password guesses against one account. [[slnc 300]] And password spraying is a few guesses each, against many accounts."

[[scene]]
key = "03-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "03-one-rule"
kind = "figure"
title = "One rule, two accounts"
body = "one_rule"
narration = """Let's see the core idea on one example: the brute force rule. [[slnc 400]] At the top, the rule. [[slnc 300]] Ten failed logins, for one account, within five minutes. [[slnc 300]] That is a guess about an attacker: someone guessing a password fails many times, quickly. [[slnc 600]]
In the middle, two real accounts from the Monday. [[slnc 300]] In amber, account ten. [[slnc 300]] Its owner came back from holiday and forgot the password: six failures. [[slnc 300]] In red, account forty two, under attack: thirty failures. [[slnc 600]]
The white line is the threshold, at ten. [[slnc 300]] The normal account stays under it. [[slnc 300]] The attack crosses it, and the rule raises one alert. [[slnc 600]]
Where to put the line is not a guess. [[slnc 300]] It is measured on a normal day."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "04-costs"
kind = "bullets"
title = "What It Costs"
body = ["Every threshold is a trade", "Allow-lists, like VPN addresses, need owners", "Context removes more false alarms than thresholds", "Some false alarms are worth reviewing", "Attackers adapt to your rules"]
narration = "Nothing is free. [[slnc 400]] Here is what it costs. [[slnc 500]] Every threshold trades missed attacks against false alarms. [[slnc 500]] Allow-lists, like the V P N's addresses, need an owner who keeps them current. [[slnc 500]] Context, like who may approve a change, removes more false alarms than any threshold. [[slnc 500]] Some false alarms, like an emergency admin grant at night, are worth reviewing anyway. [[slnc 300]] And attackers adapt, so rules need measuring again."

[[scene]]
key = "05-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Sigma rules and SIEM correlation searches", "MITRE T1110 (brute force), T1078 (valid accounts)", "An \"impossible travel\" alert from a VPN user", "Alert fatigue in an incident review"]
narration = "You have probably met this already. [[slnc 400]] Sigma rules, and correlation searches in a S I E M, are detection rules, written for a product. [[slnc 500]] In MITRE's attack catalogue, technique T eleven ten is brute force, and T ten seventy eight is valid accounts: the attacks these rules look for. [[slnc 500]] An impossible travel alert for a colleague on the V P N is the false alarm from the third demo. [[slnc 500]] And alert fatigue, in an incident review, is an analyst who stopped reading."

[[scene]]
key = "06-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Write each rule as a guess about an attacker", "Measure it on a normal day", "Count accounts per address to catch spraying", "Pick thresholds between normal and attack", "Add context: VPN lists, approvers, tickets", "Measure again when things change"]
narration = "So, how do you use it? [[slnc 400]] Write each rule as a guess about an attacker. [[slnc 300]] Measure it on a normal day before trusting it. [[slnc 500]] Count accounts per address, because spraying tries each account only once or twice. [[slnc 500]] Put each threshold between the worst normal day and the weakest attack you care about. [[slnc 300]] Add context, like the V P N's addresses, approvers, and change tickets. [[slnc 500]] And measure again whenever the business or the attackers change."

[[scene]]
key = "07-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a rule for a sign-in from a", "country the account has never used."]
narration = "That's detecting attacks in logs. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] A detection rule is a guess about an attacker, and it is only as good as the alerts it raises on a normal day. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine, with nothing installed except a Java development kit. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a rule for a sign-in from a country the account has never used, and measure it on the same day. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] There is no detection product: every rule is one small class with the same shape. [[slnc 300]] Here are the ones that matter."""

[[class]]
name = "Rule"
what = "one guess about an attacker: reads the log, returns alerts"
[[class.part]]
title = "the shape every rule has"
code = """
public interface Rule {
    String name();
...
    String describe();
    List<Alert> evaluate(List<Event> log);
}
"""
speech = """Every rule has a name, a short description with its numbers, and one method. [[slnc 300]] It reads the whole log, in time order, and returns its alerts. [[slnc 300]] So any rule can be scored the same way."""

[[class]]
name = "BruteForceRule"
what = "failed logins for one account inside a sliding window"
[[class.part]]
title = "a window per account"
code = """
Deque<Event> q = recent.computeIfAbsent(e.user(), k -> new ArrayDeque<>());
while (!q.isEmpty() && Duration.between(q.peekFirst().time(), e.time())
        .compareTo(window) > 0) {
    q.removeFirst();
}
if (e.success()) {
    q.clear();
...
q.addLast(e);
if (q.size() >= threshold && !firing.getOrDefault(e.user(), false)) {
"""
speech = """Each account has its own queue of recent failures. [[slnc 300]] Failures older than the window fall out of the front, and a success empties it. [[slnc 300]] When the queue reaches the threshold, the rule raises one alert for the whole run."""

[[class]]
name = "SprayingRule"
what = "different accounts failing from one address"
[[class.part]]
title = "a window per address, counting accounts"
code = """
Deque<Event> q = byIp.computeIfAbsent(e.ip(), k -> new ArrayDeque<>());
...
q.addLast(e);
long users = q.stream().map(Event::user).distinct().count();
if (users >= distinctUsers && alerted.add(e.ip())) {
"""
speech = """The same window, but kept per address. [[slnc 300]] It counts different accounts, not failures. [[slnc 300]] So two guesses on each of forty accounts, which the brute force rule never sees, add up here."""

[[class]]
name = "ImpossibleTravelRule"
what = "two logins too far apart for the time between them"
[[class.part]]
title = "distance over time"
code = """
static double kmPerHour(Event prev, Event next) {
    double hours = Math.max(Duration.between(prev.time(), next.time())
            .toSeconds() / 3600.0, 1.0 / 3600);
    return prev.city().kmTo(next.city()) / hours;
}
...
if (!e.type().equals("login") || !e.success() || knownEgress.contains(e.ip())) {
    continue;
}
"""
speech = """The speed is the distance between the two cities, divided by the hours between the logins. [[slnc 300]] Over nine hundred kilometres an hour, the rule fires. [[slnc 300]] Addresses on the known list, like the bank's V P N, are skipped."""

[[class]]
name = "PrivilegeChangeRule"
what = "an admin grant needs an approver and a ticket"
[[class.part]]
title = "context, not a threshold"
code = """
boolean byApprover = approvers.contains(e.actor());
boolean ticketed = !e.ticket().isEmpty();
if (!byApprover || (requireTicket && !ticketed)) {
"""
speech = """This rule has no number at all. [[slnc 300]] It uses context: who may approve admin grants, and whether a change ticket exists. [[slnc 300]] The sprayed account granting itself admin fails both."""

[[class]]
name = "Peaks"
what = "measures the normal day before a threshold is chosen"
[[class.part]]
title = "the most failures each account reached"
code = """
q.addLast(e);
peak.merge(e.user(), q.size(), Math::max);
"""
speech = """Peaks runs the brute force rule's own window over a log and keeps, for each account, the largest count it reached. [[slnc 300]] Run on the normal day, it gives six. [[slnc 300]] Run on the attack, thirty. [[slnc 300]] The threshold goes between them."""

[[class]]
name = "Alert"
what = "what a rule reports, with the events behind it"
[[class.part]]
title = "true when its evidence holds an attack event"
code = """
public boolean isTruePositive() {
    return evidence.stream().anyMatch(e -> e.attackId() != null);
}
"""
speech = """Every alert carries the events that made it fire. [[slnc 300]] An alert is true when one of those events belongs to a real attack. [[slnc 300]] Only the scoring reads that label; no rule does."""

