narration = "That's detecting Attacks. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Detection turns logs into a few alerts that people trust, so write each rule as a hypothesis about an attacker, measure it against a normal day, add context to remove the false positives, and review what it misses. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a rule for a login from a country the account has never used, and measure it on the day. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"
