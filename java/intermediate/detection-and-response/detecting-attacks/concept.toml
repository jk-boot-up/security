# concept.toml: everything about this project that is not Java code.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "detecting-attacks"
level = "intermediate"
module = "detection-and-response"
title = "Detecting Attacks in Logs"
short_title = "Detecting Attacks"
package = "detect"
main_class = "DetectionDemo"
tagline = "A detection rule is a hypothesis about an attacker, and it must be measured against a normal day"
bold = "Logs only help if rules turn them into alerts: brute force, password spraying, impossible travel, takeover and privilege changes each need a rule, and each rule must be measured against a normal day of the same logs, because a threshold that catches the attack and buries the analyst in false alarms is not detection."
domain = "a company's sign-in and admin logs"
domain_note = ""
youtube_description = "Detection rules over a log stream in Java: brute force, password spraying, impossible travel, takeover and privilege change, with precision measured against a synthetic day."
thumb_lines = ["DETECTING", "ATTACKS IN LOGS"]
thumb_code = "5 rules, 9 alerts, 1 false"
youtube_title = "Detecting Attacks in Logs: Rules, Thresholds and False Positives (Java)"
youtube_tags = ["detection engineering", "password spraying", "impossible travel", "siem", "false positives", "java", "application security"]

[readme]
intro = """
Logging records what happened. **Detection** decides which of it is an attack. The two are different jobs: a log with every event and no rules is a library no one reads. This project writes five **detection rules** over the sign-in and admin events of a company with 200 accounts, runs them on one
synthetic Monday that contains both ordinary behaviour and four real attacks, and *measures* them, because a rule is only as good as the alerts it produces on a normal day.

The rules, each a hypothesis about an attacker:
- **Brute force:** at least N failed logins for one account within five minutes. Someone is guessing that account's password.
- **Password spraying:** failures against many *different* accounts from one address. The attacker tries one or two common passwords per account, so the per-account rule never fires. The rule counts accounts per address.
- **Impossible travel:** two successful logins by one account from places that no aeroplane connects in that time. Needs a list of the VPN's addresses, which otherwise look like the VPN's city.
- **Success after failures:** a success from an address that has just failed repeatedly and has never succeeded for that account before: the guesses worked.
- **Privilege change:** the admin role granted by someone who is not an approver, or without a change ticket.

The day has the usual noise: typing mistakes, two people back from holiday who forget their passwords, five staff on the VPN, a break-glass admin grant at 3 a.m., and a phone whose carrier address is placed in the wrong city. The scoring compares every alert with ground truth: true positives, false positives and which attacks were noticed at all.

**Maps to:** OWASP Top 10 (2025) A09 Security Logging and Alerting Failures · NIST CSF Detect (DE.CM, DE.AE) · MITRE ATT&CK T1110 (brute force, including password spraying) and T1078 (valid accounts) · OWASP ASVS 5.0, the logging and monitoring chapter.
"""
analogy = """
A night guard watching one hundred doors. A rule that rings an alarm at every rattled handle will ring all night and be switched off; a rule that waits for three handles on the same door in a minute, and ignores the cleaners' door, rings rarely and means it.
The guard's value is the alarms people act on, not the doors watched.
"""
scenario = """
One Monday of logs for a company with 200 accounts: 768 logins and 4 role grants, 113 events of which belong to four attacks (spraying, brute force, impossible travel, privilege change). The data is synthetic and generated with a fixed random seed, so every run is the same and the ground truth is known.
"""
costs = [
    "**Every threshold is a trade.** Lower finds more attacks and more noise; higher is quiet and blind. The right value depends on your normal day, which is why you measure.",
    "**Allow-lists need owners.** A VPN address list that is not kept up to date silently turns the rule off, or turns it back into noise.",
    "**Context cuts false positives most:** knowing an account's usual addresses, roles and change tickets (the history and ticket data here) is worth more than a smarter threshold.",
    "**Some false positives are healthy.** A break-glass grant should alert; it is a false positive for an attack and a true positive for a review.",
    "**Attackers adapt.** Low and slow guessing, residential proxies near the victim, and logins at the victim's usual hours defeat simple rules, so rules need layers and review.",
]
too_much = """
Do not write a hundred rules before the first ten are tuned and owned. Start with the attacks that matter to your system, measure each rule on a week of real logs, and keep a short list that people trust. A rules engine, a SIEM or an OpenSearch alert is where these rules run in production.
"""
met_before = [
    "SIEM correlation rules and \"detection as code\" repositories (Sigma rules).",
    "Cloud sign-in alerts such as \"unfamiliar sign-in properties\" and \"atypical travel\".",
    "Account lockout, which stops brute force but is itself a denial of service for spraying.",
    "MITRE ATT&CK technique pages for brute force and valid accounts.",
]
where = """
This project is in [detection-and-response](..) and builds on [security-logging](../security-logging), which makes the events these rules read. The with-OpenSearch version expresses the same rules as saved queries and alerts. The next project, incident-response, takes over when an alert is real.
"""
twin = """
The events are objects, the rules are classes with sliding windows, and the scenario is generated by a seeded random generator, so the ground truth is exact. The rules are written the way a detection engineer would write them, and could be translated to queries. Nothing reads real logs.
"""
test_note = "The day of logs is synthetic with a fixed seed, so the demo prints the same text on every run."

[[act]]
title = "One Monday of logs"
summary = "772 events: 768 logins and 4 role grants; 113 of them belong to 4 real attacks (spraying, brute force, impossible travel, privilege change)."
detail = """
The log is a normal Monday with 200 accounts, plus four attacks that the scoring knows about: password spraying from one address against forty accounts (one guess works), thirty guesses at one account in four minutes followed by a success, a valid login from Sydney twenty-five minutes after one in Paris, and the compromised account making itself an administrator.
"""
speech = """
First demo: one Monday of logs. [[slnc 400]] Seven hundred and seventy two events. [[slnc 300]] Two hundred accounts, ordinary logins, some typing mistakes, a few admin grants. [[slnc 600]]
And four real attacks hidden in it, which the scoring knows about and the rules do not.
"""
rows = { day = "active ok" }
console = [
    ["772 events: 768 logins, 4 role grants; 113 of them belong to 4 real attacks", "muted"],
    ["A: spraying, B: brute force, C: impossible travel, D: privilege change", "muted"],
]

[[act]]
title = "A first version of each rule"
summary = "The first versions notice all four attacks but raise 29 alerts, 21 of them false: impossible travel flags the VPN, success-after-failures flags every typo."
detail = """
With a brute-force threshold of three failures, an impossible-travel rule that knows nothing of the VPN, and a takeover rule that fires on a single failure before a success, the rules do see the attacks. They also produce a lot of alerts a person would have to read: the five VPN users and the phone with a wrong location,
two people who forgot their passwords, ordinary typing mistakes. The analyst who gets twenty-nine alerts, most of them false, soon stops reading them.
"""
speech = """
Second demo: a first version of each rule. [[slnc 400]] They notice the attacks. [[slnc 300]] They also raise twenty nine alerts, and most are false. [[slnc 600]]
The VPN users look like they teleport. [[slnc 300]] Every typing mistake looks like a takeover. [[slnc 300]] An analyst who reads twenty nine alerts a day soon stops reading them.
"""
rows = { first = "active wrong" }
console = [
    ["brute-force(3)  3 alerts, 1 true, 2 false", "amber"],
    ["impossible-travel  14 alerts, 3 true, 11 false", "bad"],
    ["success-after-failures  9 alerts, 2 true, 7 false", "bad"],
    ["spraying(8) 1 alert, 1 true; privilege-change 2 alerts, 1 true, 1 false", "amber"],
]

[[act]]
title = "Tuning one threshold"
summary = "Brute-force thresholds of 3 and 5 raise 2 false alarms (two people who forgot their password); 10 and 25 catch the attack with none; 40 misses it."
detail = """
The two false alarms at a threshold of 3 or 5 are the people back from holiday, who fail six times in three minutes. At 10 and 25 the rule catches the attacker's thirty guesses and nothing else. At 40 the rule is quiet and blind: the attack never reaches the threshold. The
right threshold sits between the worst normal day and the weakest attack you care about, and it is a measurement, not a guess. A real attacker may go slower than five minutes, which is what the other rules and a rate limit are for.
"""
speech = """
Third demo: tuning one threshold. [[slnc 400]] At three or five failures, two false alarms: people who forgot their password after a holiday. [[slnc 600]]
At ten or twenty five, the attack is caught and nothing else. [[slnc 300]] At forty, the rule is quiet, and blind. [[slnc 600]]
The right threshold sits between the worst normal day and the weakest attack you care about.
"""
rows = { tune = "active amber" }
console = [
    ["brute-force(3)  3 alerts, 1 true, 2 false", "amber"],
    ["brute-force(10) 1 alert, 1 true, 0 false", "ok"],
    ["brute-force(40) 0 alerts: the attack is missed", "bad"],
]

[[act]]
title = "The tuned set, and what it tells the analyst"
summary = "Five tuned rules give 9 alerts for the day, 7 true and 2 false, and every attack (A, B, C, D) is noticed; the false ones are a break-glass admin grant and a phone placed in the wrong city."
detail = """
The tuned rules use a threshold of 10 for brute force, eight distinct accounts for spraying, the VPN address list for travel, a change ticket and a list of approvers for admin grants, and each account's usual addresses for the takeover rule. Together they raise nine alerts: seven true and two false.
The false ones are explainable and healthy: the 3 a.m. break-glass admin grant that should be reviewed anyway, and a phone whose carrier address a geolocation database places in Frankfurt. All four attacks are noticed, some by more than one rule (the spraying success is seen by the spraying rule, the impossible-travel rule and the privilege-change rule).
"""
speech = """
Fourth demo: the tuned set. [[slnc 400]] Nine alerts for the day. [[slnc 300]] Seven are real. [[slnc 300]] Two are not: an emergency admin grant, which should be reviewed anyway, and a phone placed in the wrong city. [[slnc 600]]
All four attacks are noticed, some of them by more than one rule. [[slnc 300]] An analyst can read nine alerts.
"""
rows = { tuned = "active ok" }
console = [
    ["together: 9 alerts for the day, 7 true, 2 false; attacks noticed: [A, B, C, D] of [A, B, C, D]", "ok"],
    ["03:00 privilege-change  admin granted to u060 by ops1, no ticket   <- FALSE POSITIVE", "amber"],
    ["10:02 spraying(8)  8 different accounts failed from 203.0.113.50 within 20 minutes", "ok"],
    ["10:40 privilege-change  admin granted to u117 by u117 (not an approver), no ticket", "ok"],
    ["15:25 impossible-travel+vpn-list  Madrid to Sydney, 17685 km in 25 minutes", "ok"],
]

