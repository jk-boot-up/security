On the right, the attack: thirty failures in five minutes. [[slnc 600]]
The green band between them is the safe range: seven to thirty. [[slnc 300]] A threshold in it fires on the attack, and on nothing else. [[slnc 300]] Ten is chosen, with room on both sides. [[slnc 600]]
The marks below are the thresholds tried. [[slnc 300]] Three and five sit in the normal day: false alarms. [[slnc 300]] Ten and twenty five sit in the band: clean. [[slnc 300]] Forty is past the attack: the rule is quiet, and blind.
