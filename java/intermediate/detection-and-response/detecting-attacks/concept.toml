[docs.problem]
scenario = """
A company logs every sign-in and admin change, and has no one who reads the logs. It wants alerts for the attacks that matter and few enough that they will be read.
"""
naive = """
Alert on every failed login, every login from a new place and every role change.
"""
deliver = [
    "A synthetic day of logs with ground truth: noise, four attacks and the usual look-alikes.",
    "Five rules: brute force, spraying, impossible travel, success after failures and privilege change.",
    "Scoring: alerts, true and false positives and attacks noticed, per rule.",
    "A tuning experiment and a tuned rule set.",
]

[docs.prerequisites]
required = [
    "Java basics",
    "The security-logging project, or an idea of audit events",
]
not_required = [
    "A SIEM or OpenSearch",
    "Statistics",
]
install = []

[docs.session]
objectives = [
    "explain what each rule assumes about an attacker",
    "say why password spraying escapes a per-account rule",
    "choose a threshold by looking at the normal day and the attack",
    "name the context that removes false positives better than thresholds",
]
walkthrough = """
Run act two and ask which alerts a person would actually read. In act three, ask what the right threshold would be if the attacker went ten times slower. In act four, ask whether the two false alerts should be removed from the rule or left in.
"""
exercises = [
    "Add a rule for a login from a country the account has never used, and measure it on the day.",
    "Add a low-and-slow brute-force variant with a one-hour window, and see what it costs in false positives.",
    "Add an off-hours admin login rule, and decide how to treat the break-glass account.",
    "Write the spraying rule as a query over a log store with a group-by.",
]

[docs.explained]
sentence = """
Detection turns logs into a few alerts that people trust, so write each rule as a hypothesis about an attacker, measure it against a normal day, add context to remove the false positives, and review what it misses.
"""
verdict = """
Start from the attacks that matter, write one rule for each, measure every rule on real logs before enabling it, keep allow-lists and thresholds owned and reviewed, send alerts to somebody who acts on them, and test the rules with replayed attacks.
"""
recognise = [
    "Sigma rules and SIEM correlation searches.",
    "Cloud \"impossible travel\" and \"unfamiliar sign-in\" alerts.",
    "ATT&CK technique IDs T1110 and T1078 in detection documentation.",
    "Alert fatigue as a finding in an incident review.",
]

[spec]
purpose = """
Teach detection engineering by writing five rules over a synthetic day of sign-in and admin logs, scoring them against ground truth, tuning a threshold, and arriving at a rule set whose alerts an analyst can read.
"""
nongoals = [
    "A SIEM, streaming or storage: the detecting-attacks-with-opensearch project.",
    "Machine-learning detection.",
    "Responding to alerts: the incident-response project.",
]
problem = """
Logs are kept and never turned into alerts, or turned into so many alerts that nobody reads them.
"""
roles = [["Data", "`Event`, `City`, `Scenario`"], ["Rules", "`Rule`, `BruteForceRule`, `SprayingRule`, `ImpossibleTravelRule`, `TakeoverRule`, `PrivilegeChangeRule`"], ["Results", "`Alert`, `Score`"], ["Entry point", "`DetectionDemo`"]]
requirements = [
    "Each rule fires on its attack in a hand-made log and not on its near misses.",
    "The scenario is repeatable and contains four attacks with ground truth.",
    "First versions notice the attacks with many false alerts; tuning removes them; a threshold above the attack misses it.",
    "The tuned set notices all four attacks with 9 alerts, 7 of them true.",
    "The demo prints the same output on every run.",
]

