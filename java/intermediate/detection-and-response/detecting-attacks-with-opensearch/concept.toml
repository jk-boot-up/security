title = "One Monday of logs, in OpenSearch"
summary = "772 events loaded with the bulk API under a mapping of keywords and a date."
detail = """
772 events are loaded with the bulk API: 768 logins and 4 role grants; 113 of them belong to 4 real attacks (A: spraying, B: brute force, C: impossible travel, D: privilege change). The attack label is in the index only so that this lesson can score its rules; no rule reads it. The fields the rules filter and group by are keywords and the time is a date, set by a mapping before the first event.
"""
speech = """
First demo: one Monday of logs, in OpenSearch. [[slnc 400]] Seven hundred and seventy two events, loaded with the bulk A P I. [[slnc 600]]
The mapping says which fields are keywords and which is the time.
"""
rows = { load = "active ok" }
console = [
    ["772 events: 768 logins, 4 role grants", "ok"],
    ["113 belong to 4 real attacks (scoring only)", "ok"],
    ["keywords and a date, set by a mapping", "ok"],
]

[[act]]
title = "A first version of each rule, as a query"
summary = "A filter, a group by the subject, a bucket of time and a threshold: three alerts for brute force at 3, of which one is true."
detail = """
Brute-force(3): 3 alerts, 1 true, 2 false (the two people back from holiday). Spraying(8): 1 alert, true. Privilege-change: 2 alerts, 1 true. Success-after-failures(1): 23 alerts, 2 true. A rule is a query: a filter, a group by the subject, a bucket of time, and a threshold that keeps the buckets worth looking at.
"""
speech = """
Second demo: a first version of each rule, as a query. [[slnc 400]] A filter, a group by the subject, a bucket of time, and a threshold. [[slnc 600]]
The first version of brute force has three alerts, and only one is an attack.
"""
rows = { queries = "active wrong" }
console = [
    ["brute-force(3): 3 alerts, 1 true, 2 false", "bad"],
    ["spraying(8): 1 alert, true", "ok"],
    ["success-after-failures(1): 23 alerts, 2 true", "bad"],
]

[[act]]
title = "Tuning one threshold"
summary = "At 10 the false alerts go away; at 40 the attack is lost."
detail = """
brute-force at 3, 5, 10, 25 and 40: 3 alerts with 1 true at 3 and 5; 1 alert, true, at 10 and 25; nothing at 40, where the attack is lost. Changing the threshold is changing one number in the query; the table says what it costs and what it misses.
"""
speech = """
Third demo: tuning one threshold. [[slnc 400]] At three and five, two false alerts. At ten, only the attack. [[slnc 600]]
At forty, the attack is lost.
"""
rows = { tuning = "active ok" }
console = [
    ["3 and 5: 3 alerts, 1 true", "bad"],
    ["10 and 25: 1 alert, true", "ok"],
    ["40: 0 alerts, the attack is lost", "bad"],
]

[[act]]
title = "The tuned set as monitors of the alerting plugin"
summary = "Four monitors and one rule in code give 10 alerts, 8 true, and notice all four attacks; impossible travel needs the previous login, which a query cannot say."
detail = """
The tuned set is saved as monitors of the alerting plugin, each with a schedule of one minute, and each is run once with dryrun, so that nothing is sent. brute-force(10): 1 alert, true; spraying(8): 1, true; success-after-failures(20): 2, true; privilege-change: 2, 1 true. Impossible travel compares each login with the same person's last one: a query cannot say the previous one, so the events are read back from OpenSearch in order and a few lines of code decide: 4 alerts, 3 true. Together: 10 alerts for the day, 8 true, 2 false; all four attacks noticed.
"""
speech = """
Fourth demo: the tuned set as monitors. [[slnc 400]] Four monitors, run once with dry run. [[slnc 600]]
Impossible travel needs the previous login, which a query cannot say, so a few lines of code do it. [[slnc 300]] Ten alerts, eight true, and all four attacks.
"""
rows = { monitors = "active ok" }
console = [
    ["brute-force(10): 1; spraying(8): 1; success-after-failures(20): 2", "ok"],
    ["privilege-change: 2 (one false); impossible-travel (code): 4", "ok"],
    ["10 alerts, 8 true, 2 false; attacks A, B, C, D noticed", "ok"],
]

[[act]]
title = "The bill"
summary = "A mapping decides what a rule can say, fixed buckets split an attack at their edge, and a console change leaves no trace in the code."
detail = """
The same events loaded with no mapping, grouped by user: 400, text fields are not optimised for aggregations. Grouped by user.keyword, which dynamic mapping adds next to the text: 200 and 3 groups. Thirty failures in four minutes that cross a five-minute boundary at 13:30, with the rule at least 20: fixed buckets give 0 alerts, a sliding window gives 1. The monitors run on a schedule, so an attack is noticed up to a minute and a bucket later. Keep the queries as files under version control, test each with a known bad day, and treat the thresholds as tuned for this one Monday.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] With no mapping, a rule cannot even group by user. [[slnc 600]]
An attack that crosses the edge of two time buckets is split in half and missed. [[slnc 300]] Keep the queries as files, and test each one.
"""
rows = { bill = "active wrong" }
console = [
    ["no mapping: 400, text fields cannot be aggregated", "bad"],
    ["30 failures across a bucket edge, threshold 20: 0 alerts (a sliding window: 1)", "bad"],
    ["queries as files, tested with a known bad day", "ok"],
]

