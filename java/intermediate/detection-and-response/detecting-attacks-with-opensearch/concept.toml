short = "API"
long = "Application Programming Interface: requests a program can send"
say = "A P I is an application programming interface: the requests a program can send to a server."
[[acronym]]
short = "HTTP"
long = "HyperText Transfer Protocol: how the requests travel"
say = "H T T P is the hypertext transfer protocol: how the demo's requests travel to OpenSearch."
[[acronym]]
short = "JSON"
long = "JavaScript Object Notation: the text form of queries and documents"
say = "J S O N is JavaScript object notation: the text form of every query, document and answer."
[[acronym]]
short = "VPN"
long = "Virtual Private Network: staff traffic leaves from the bank's address"
say = "V P N is a virtual private network: staff connect through it, so their logins come from the bank's own address and city."
[[acronym]]
short = "SIEM"
long = "Security Information and Event Management: a log store with rules"
say = "S I E M is security information and event management: a product that collects logs and runs detection rules on them."
