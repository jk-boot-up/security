# concept.toml: everything about this project that is not Java code.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "detecting-attacks-with-opensearch"
level = "intermediate"
module = "detection-and-response"
title = "Detecting Attacks with OpenSearch"
short_title = "Detection with OpenSearch"
package = "searchdetect"
main_class = "OpenSearchDetectDemo"
tagline = "The same four detections as saved queries and monitors in a real OpenSearch, scored against one Monday of logs, and the one detection a query cannot say"
bold = "A real OpenSearch 3.9 holds one Monday of 772 events and answers the plain project's detections as filter, group, time bucket and threshold: brute force (1 true alert at a threshold of 10), spraying (1), success after failures (2) and privilege change (2, one false), as monitors of the alerting plugin that are run once for repeatable results; impossible travel compares a login with the person's previous one, which a query cannot say, so the events are read back and a few lines of code decide; together the day gives 10 alerts, 8 true, and all four attacks are noticed, but a mapping decides what a rule can say, fixed time buckets miss an attack that crosses their edge, and a monitor changed in a console leaves no trace in the code."
domain = "an online bank's sign-in and admin logs"
domain_note = ""
youtube_description = "A real OpenSearch 3.9 with its alerting plugin in Docker, loaded with the 772 events of one synthetic Monday that hide four attacks: brute force, spraying, impossible travel and a privilege change. The detections written as queries (a filter, a terms aggregation, a date histogram and a threshold), tuned one threshold at a time and scored against the truth, then saved as bucket-level and query-level monitors and run once with dryrun; impossible travel done in code from the events read back; a mapping mistake that stops a rule, and an attack that falls between two fixed time buckets."
thumb_lines = ["DETECTION WITH", "OPENSEARCH"]
thumb_code = "date_histogram + bucket_selector"
youtube_title = "Detecting Attacks with OpenSearch: Queries, Monitors, Tuning and What a Query Cannot Say (OWASP A09)"
youtube_tags = ["opensearch", "detection", "alerting", "siem", "brute force", "password spraying", "impossible travel", "threat detection", "owasp top 10", "a09", "java"]

[readme]
intro = """
The plain [detecting-attacks](../detecting-attacks) project writes detection rules in Java and scores them on one synthetic Monday of 772 events with four hidden attacks. This one puts the same Monday in a real **OpenSearch 3.9** (Docker, with the alerting plugin; the security plugin is off because this is a lab) and writes the detections as **queries**. It needs Docker; the tests are tagged `integration`: `./gradlew integrationTest`.

What it shows:
- **The day in an index.** 772 events through the bulk API (768 logins, 4 role grants), with a mapping: keywords for what a rule filters or groups by, a date for the time. An `attack` label is indexed only so the lesson can score; no rule reads it.
- **A rule is a query.** A filter, a terms aggregation for the subject (account or address), a date histogram for the window, and a pipeline aggregation or `min_doc_count` that keeps the buckets over a threshold. First versions: brute-force(3) 3 alerts, 1 true; spraying(8) 1; privilege-change 2, 1 true; success-after-failures(1) 23 alerts, 2 true.
- **Tuning.** `brute-force` at 3, 5, 10, 25, 40: the false alerts go away at 10 and the attack is lost at 40.
- **Monitors.** The tuned set as bucket-level and query-level monitors of the alerting plugin, each run once with `dryrun`: brute-force(10) 1, spraying(8) 1, success-after-failures(20) 2, privilege-change 2. **Impossible travel** compares a login with the same person's previous one, which a query cannot say: the events are read back in order and the plain project's rule decides (4 alerts, 3 true). Together: **10 alerts, 8 true, 2 false, all four attacks**.
- **The bill.** With no mapping an aggregation on a text field is refused; thirty failures that cross a five-minute boundary are 15 and 15 in fixed buckets and no alert at a threshold of 20, but one for a sliding window; monitors changed in a console leave no trace in the code.

**Maps to:** OWASP Top 10 (2025) A09 Security Logging and Alerting Failures · NIST CSF 2.0 Detect · MITRE ATT&CK (T1110 brute force, T1078 valid accounts, T1098 account manipulation).
"""
analogy = """
A night guard with a clipboard of questions: how many times has someone failed at this door, how many different doors has one visitor tried. A clipboard is good for counting. It cannot answer "did this person leave Paris an hour ago", which needs someone to remember the last visit.
"""
scenario = """
An online bank's audit log for one Monday: 772 events, four attacks. The demo writes the guard's clipboard as queries, tunes it, saves it as monitors, and finds the question that the clipboard cannot hold.
"""
costs = [
    "**Every rule needs a mapping that lets it say what it means.**",
    "**Fixed time buckets have edges,** and attackers do not respect them.",
    "**Thresholds are tuned to one day** and drift with the business.",
    "**A query cannot remember:** rules about sequences and \"the previous event\" need code or a different engine.",
    "**A monitor in a console is configuration that nobody reviews.**",
]
too_much = """
A small bank with one server and a few hundred events a day can read its log. A search engine and alerting pay off when events come from many places, when several rules watch them, and when the rules must be tuned over time.
"""
met_before = [
    "A Kibana or OpenSearch Dashboards \"Discover\" screen.",
    "A saved search with a count and a threshold.",
