[docs.prerequisites]
required = [
    "Java basics",
    "The plain detecting-attacks project, for the ideas",
    "Docker, with the opensearchproject/opensearch:3.9.0 image (pulled on first use)",
]
not_required = [
    "Previous knowledge of OpenSearch or Elasticsearch",
]
install = ["docker"]

[docs.session]
objectives = [
    "write a detection as a query with a bucket and a threshold",
    "tune a threshold and read the table",
    "save a query as a monitor",
    "say which detections need code",
]
walkthrough = """
Run act three and find the threshold where the false alerts go and the attack stays. In act four find the detection that is not a monitor. In act five find the attack that falls between two buckets.
"""
exercises = [
    "Add a query for logins from a city a user has never used.",
    "Change the spraying window to ten minutes and see what happens.",
    "Run a monitor without dryrun and read the alert in the plugin's index.",
    "Store the queries as JSON files and load them from the files.",
]

[docs.explained]
sentence = """
A detection is a question asked of the log on a schedule; a query can count and group, but it cannot remember the previous event.
"""
verdict = """
Map the fields before loading, write each detection as a query with a threshold, tune against known attacks, run monitors on a schedule and keep their definitions in version control, do sequences in code or in an engine that has them, and test each rule with a known bad day.
"""
recognise = [
    "`date_histogram` and `bucket_selector` in a saved search.",
    "A monitor with a trigger in an alerting plugin.",
    "A threshold that someone tuned last year.",
    "An alert that fires every Monday at three.",
]

[spec]
purpose = """
Teach writing, tuning and scheduling detections in a real OpenSearch, and knowing which ones need code.
"""
nongoals = [
    "Sizing or running OpenSearch.",
    "Notification channels and routing.",
    "Machine-learning detectors.",
]
problem = """
Logs hold attacks that nobody sees, and alerts that nobody trusts are as bad as none.
"""
roles = [["The server", "`Lab`, `OpenSearch`"], ["The queries", "`Detections`, `QueryParts`, `Buckets`, `Hit`"], ["The monitors", "`Monitors`"], ["The scenario and the code rule", "`Scenario`, `Event`, `ImpossibleTravelRule`"], ["Entry point", "`OpenSearchDetectDemo`"]]
requirements = [
    "The day is loaded under an explicit mapping.",
    "Each detection is a query with a filter, a subject, a time bucket and a threshold.",
    "The tuned detections run as monitors of the alerting plugin, once with dryrun.",
    "Detections a query cannot express are done in code from the events read back.",
    "The demo prints the same output on every run.",
]

