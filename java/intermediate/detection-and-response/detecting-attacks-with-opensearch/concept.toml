[threatmodel]
scope = """
The audit events of one day in an OpenSearch index, the detections over them, and the alerts that reach an analyst. It does not cover the security of the OpenSearch cluster itself, which runs here with its security plugin off.
"""
assets = [
    "The accounts and the privileges they hold.",
    "The audit log as evidence.",
]
actors = [
    "An attacker who guesses, sprays or uses stolen credentials.",
    "An analyst who reads alerts.",
]
boundaries = [
    "The index: whoever can write to it can hide an attack.",
]
assumptions = [
    "The application writes every login and role grant.",
    "The clocks of the writers agree.",
]
out_of_scope = [
    "Securing the cluster.",
    "Response to an alert.",
]
tests = [
    "`QueryShapeTest` checks the scenario, the documents, the shape of the queries and monitors, their four parts as `QueryParts` reads them, and the fixed buckets worked out by hand (15 and 15), with no server.",
    "`OpenSearchTest` runs a real OpenSearch for the index, every detection, the tuning, the monitors, the read-back for impossible travel, the mapping and the bucket edge.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next project in this module, incident-response, comes after the alert; the next module is secure-design.
"""

[[threat]]
id = "T1"
stride = "S"
threat = "Guessed or sprayed passwords go unnoticed"
where = "login events and the queries over them"
control = "Queries by account and by address, tuned thresholds"
residual = "Slow attacks that stay under the threshold"

[[threat]]
id = "T2"
stride = "S"
threat = "Stolen credentials are used from far away"
where = "successful logins"
control = "A code rule on the previous login, with a list of known egress addresses"
residual = "A VPN or a phone carrier that shows the wrong city"

[[threat]]
id = "T3"
stride = "R"
threat = "Events are missing or have no ticket or approver"
where = "the application's audit log"
control = "Log every login and grant with its actor and ticket"
residual = "Events the application never writes"

[[threat]]
id = "T4"
stride = "D"
threat = "False alerts teach the analyst to ignore alerts"
where = "thresholds and rules"
control = "Tune against known days, test rules, review thresholds"
residual = "Thresholds tuned to one Monday"

[poster]
headline = [["DETECTION WITH", "text"], ["OPENSEARCH", "accent"]]
taglines = [["A rule is a filter, a group, a bucket and a threshold", "gold"]]
before = { code = "29 alerts, 24 false", note = "the first queries", tag = "BEFORE" }
after = { code = "10 alerts, 2 false, 4 of 4 attacks", note = "the tuned monitors", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "Detecting Attacks with OpenSearch"
narration = "Hello, and welcome. [[slnc 400]] This video explains detecting attacks with OpenSearch. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A detection rule in a log store is a query: filter the events, group them by account or address, cut time into buckets, and alert when a bucket passes a threshold. [[slnc 300]] OpenSearch runs those queries on a schedule, as monitors. [[slnc 300]] But some questions, like comparing a sign-in with the same person's previous one, a query cannot say. [[slnc 600]] Think of a guard's clipboard of questions, checked every minute. [[slnc 600]] Our example is an online bank's sign-in and admin logs."

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online bank's audit log", "for one Monday:", "  772 events, four hidden attacks", "", "The demo loads them into a real OpenSearch,", "writes the detections as queries,", "tunes them, saves them as monitors,", "and scores every alert against the truth."]
narration = "Here is the scenario. [[slnc 400]] An online bank's audit log, for one Monday: seven hundred seventy two events, with four hidden attacks. [[slnc 500]] The demo loads them into a real OpenSearch in Docker. [[slnc 300]] It writes the detections as queries, tunes them one threshold at a time, and saves them as monitors of the alerting plugin. [[slnc 500]] Every alert is scored against the truth, which only the scoring knows."

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["Index: where OpenSearch keeps documents", "Mapping: each field's type", "Aggregation: groups and counts documents", "Bucket: one group, such as 5 minutes of u042", "Monitor: a saved query on a schedule", "Trigger: the condition that makes an alert"]
narration = "Before the demos, the words. [[slnc 500]] An index is where OpenSearch keeps documents, one per event. [[slnc 500]] A mapping gives each field its type, such as a date, or a keyword that can be grouped. [[slnc 500]] An aggregation groups and counts documents. [[slnc 300]] Each group is a bucket: for example, five minutes of one account's failures. [[slnc 500]] A monitor is a saved query that runs on a schedule. [[slnc 300]] And its trigger is the condition that turns a bucket into an alert."

[[scene]]
key = "03-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "03-one-query"
kind = "figure"
title = "One rule as a query"
body = "one_query"
narration = """Let's see the core idea on one example: brute force, as a query. [[slnc 400]] A query has four parts, from left to right. [[slnc 600]]
The filter keeps only failed logins. [[slnc 300]] The group by puts each account's failures together. [[slnc 300]] The bucket cuts each account's failures into five-minute pieces of the clock. [[slnc 300]] And the threshold keeps only the buckets with enough failures in them. [[slnc 600]]
Below, the buckets it returns at a threshold of three. [[slnc 300]] Account forty two, at noon: thirty failures, the attack. [[slnc 300]] And accounts ten and eleven, at nine ten: six each, two people who forgot their password. [[slnc 600]]
Every rule in this video is these four parts, with different fields and numbers."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "04-costs"
kind = "bullets"
title = "What It Costs"
body = ["Every rule needs the right field mapping", "Fixed time buckets have edges", "Thresholds are tuned to one kind of day", "A query cannot remember the last event", "Monitors in a console go unreviewed"]
narration = "Nothing is free. [[slnc 400]] Here is what it costs. [[slnc 500]] Every rule needs a field mapping that lets it group by what it means. [[slnc 500]] Fixed time buckets have edges, and an attack that crosses one is split in half. [[slnc 500]] Thresholds are tuned to one kind of day. [[slnc 500]] A query cannot remember a person's previous event. [[slnc 300]] And a monitor clicked together in a console is configuration that nobody reviews."

[[scene]]
key = "05-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["A monitor with a trigger in an alerting plugin", "A terms aggregation with min_doc_count", "A threshold someone tuned last year", "An alert that fires every Monday at three"]
narration = "You have probably met this already. [[slnc 400]] A monitor with a trigger, in an alerting plugin, is a detection rule on a schedule. [[slnc 500]] A terms aggregation with a minimum document count is the group and threshold of a rule. [[slnc 500]] A threshold someone tuned last year was tuned to last year's normal day. [[slnc 500]] And an alert that fires every Monday at three is a false alarm that nobody has fixed."

[[scene]]
key = "06-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Set a mapping: keywords and a time field", "Write each rule as filter, group, bucket, threshold", "Tune on a normal day, and an attack day", "Keep queries as files, tested with a bad day", "Use sliding windows where edges matter", "Write in code what a query cannot say"]
narration = "So, how do you use it? [[slnc 400]] Set a mapping first: keywords for what you group by, and a time field. [[slnc 500]] Write each rule as a filter, a group, a bucket, and a threshold. [[slnc 300]] Tune it on a normal day and on a day with the attack. [[slnc 500]] Keep the queries as files in version control, each tested with a known bad day. [[slnc 300]] Use sliding windows where bucket edges matter. [[slnc 500]] And write in code what a query cannot say."

[[scene]]
key = "07-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a query for sign-ins", "from a city a user has never used."]
narration = "That's detecting attacks with OpenSearch. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Most detections are a filter, a group, a bucket and a threshold, tuned on a normal day, and the few that need memory belong in code. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine, with Docker. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a query for sign-ins from a city a user has never used before. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] The rules are plain maps that become J S O N, sent over H T T P to OpenSearch. [[slnc 300]] Here are the classes that matter."""

[[class]]
name = "Detections"
what = "the rules as OpenSearch queries"
[[class.part]]
title = "brute force: filter, group, bucket, threshold"
code = """
public static Map<String, Object> bruteForce(int n) {
    return Map.of("size", 0, "query", failures(), "aggs",
        Map.of("subject", Map.of("terms", Map.of("field", "user", "size", 1000), "aggs",
        Map.of("window", Map.of("date_histogram", Map.of("field", "time",
            "fixed_interval", "5m", "min_doc_count", n),
"""
speech = """The query filters the failed logins. [[slnc 300]] A terms aggregation groups them by user. [[slnc 300]] A date histogram cuts each user's failures into five-minute buckets. [[slnc 300]] And the minimum document count is the threshold: buckets with fewer failures are dropped."""

[[class]]
name = "QueryParts"
what = "reads a query back as its four parts"
[[class.part]]
title = "what OpenSearch receives, in words"
code = """
parts.put("filter", filter(at(search, "query")));
Map<String, Object> subject = at(search, "aggs", "subject");
parts.put("group by", at(subject, "terms").get("field") + " (terms)");
"""
speech = """QueryParts walks the same map that is sent to OpenSearch. [[slnc 300]] So the four parts the demo prints are exactly the query that runs, not a description of it."""

[[class]]
name = "Monitors"
what = "the tuned rules as monitors of the alerting plugin"
[[class.part]]
title = "a schedule, a query and a trigger"
code = """
m.put("schedule", Map.of("period", Map.of("interval", 1, "unit", "MINUTES")));
m.put("inputs", List.of(Map.of("search", Map.of("indices", List.of("audit"),
        "query", query))));
m.put("triggers", List.of(trigger));
"""
speech = """A monitor is the query, saved in the cluster with a schedule of one minute. [[slnc 300]] Its trigger is a small script, such as count at least ten, that decides which buckets become alerts. [[slnc 300]] The demo runs each one once with dry run, so nothing is sent."""

[[class]]
name = "OpenSearch"
what = "the HTTP API: index, bulk, search, monitors"
[[class.part]]
title = "the mapping, before the first event"
code = """
props.put("time", Map.of("type", "date"));
for (String keyword : List.of("type", "user", "ip", "city", "actor", "role",
        "ticket", "attack")) {
    props.put(keyword, Map.of("type", "keyword"));
}
"""
speech = """Every field a rule groups by is a keyword, and the time is a date. [[slnc 300]] Without this mapping, user would be text, and the last demo shows OpenSearch refusing to group by it."""

[[class]]
name = "Buckets"
what = "redoes a fixed date histogram by hand"
[[class.part]]
title = "a time rounded down to the interval"
code = """
long ms = interval.toMillis();
return Instant.ofEpochMilli(Math.floorDiv(time.toEpochMilli(), ms) * ms);
"""
speech = """A fixed bucket starts at the event's time, rounded down to a whole interval. [[slnc 300]] The edges never move. [[slnc 300]] So thirty failures from thirteen twenty eight are counted fifteen and fifteen, and a test checks that OpenSearch agrees."""

[[class]]
name = "ImpossibleTravelRule"
what = "the one rule a query cannot say"
[[class.part]]
title = "the same person's previous login"
code = """
Event prev = last.put(e.user(), e);
if (prev == null) {
    continue;
}
double km = prev.city().kmTo(e.city());
"""
speech = """This rule needs each person's previous login, which a query cannot say. [[slnc 300]] So the events are read back from OpenSearch in time order, and this code remembers the last login per user and works out the distance."""

