[[act]]
title = "The bill"
summary = "Grouping by user without a mapping is refused with status 400 (text fields are not optimised for it), and user.keyword gives 200; 30 failures from 13:28:00 to 13:31:52 fall 15 and 15 into two fixed buckets, so a rule of at least 20 gives 0 alerts, while a sliding window fires at 13:30:32; a monitor notices up to a minute and a bucket late, and a console edit leaves no trace."
detail = """
The first input is 50 events in an index with no mapping, grouped by user. The result: status 400, "Text fields are not optimised for operations that require per-document field data". Grouped by user.keyword, which dynamic mapping adds next to the text, the result is status 200 and 3 groups. The mapping decides what a rule can say.
The second input is 30 failures for u077, one every 8 seconds, from 13:28:00 to 13:31:52, crossing 13:30. In fixed 5-minute buckets they are 15 in 13:25-13:30 and 15 in 13:30-13:35, each under 20, the same counts worked out by hand, so the rule gives 0 alerts: the attack falls between two buckets.
A sliding window of 5 minutes, the plain project's rule, gives 1 alert at 13:30:32, the 20th failure (13:28:00 + 19 x 8 s). And a monitor runs every minute on fixed buckets, so it notices up to a minute and a bucket late; a stopped schedule or a query edited in the console leaves no trace in the code.
"""
figure = "straddle"
figure_title = "Thirty failures, two buckets, and a sliding window"
figure_speech = """
Fifth demo: the bill. [[slnc 400]] At the top, a mapping mistake. [[slnc 300]] Fifty events in an index with no mapping. [[slnc 300]] Group them by user, and OpenSearch refuses: status four hundred, text fields cannot be grouped. [[slnc 300]] Group by user dot keyword, and it works. [[slnc 600]]
Below, thirty failures for one account, one every eight seconds, from thirteen twenty eight. [[slnc 300]] The white line is thirteen thirty, a bucket edge. [[slnc 600]]
Fixed buckets count fifteen before the edge, and fifteen after it. [[slnc 300]] Neither reaches twenty. [[slnc 300]] No alert. [[slnc 600]]
A sliding window of five minutes moves with the events. [[slnc 300]] At thirteen thirty thirty two, it holds twenty failures, and fires.
"""
speech = """
Here is the output. [[slnc 300]] The input: fifty events, no mapping, grouped by user. [[slnc 300]] The result: status four hundred, text fields are not optimised for it. [[slnc 300]] By user dot keyword: status two hundred, three groups. [[slnc 300]] The mapping decides what a rule can say.
