[docs.session]
objectives = [
    "name the phases of incident handling and the evidence each needs",
    "explain why isolating is better than rebooting during an incident",
    "list the ways back in an attacker leaves, and how to find them",
    "say why a rebuild from a known-good image beats cleaning in place",
]
walkthrough = """
Run the three responses and, for each action, ask what the responder knew when they took it. In the review, find the first decision that separates B from C. Then ask which preparation would have shortened the 15,000 rows.
"""
exercises = [
    "Add a rate limit on the database account in the preparation, and see how many rows it saves.",
    "Add a tabletop step where the team decides who tells customers and regulators, and when the clock starts.",
    "Add the restore of a backup and decide which backup is safe given the scope.",
    "Add a fourth foothold the logs do not show, and see what the monitoring period catches.",
]

[docs.explained]
sentence = """
Handle an incident by preparing the six basics in advance, then containing without destroying evidence, scoping from logs, closing every way back in, rebuilding from a known-good image, watching for return, and learning from a blameless review.
"""
verdict = """
Write a short runbook with names, keep logs centrally for weeks, alert on the actions that matter, practise with a tabletop exercise, isolate rather than reboot, capture evidence with hashes, rebuild from images, rotate every credential the attacker could have seen, and hold a blameless review with owners for the follow-ups.
"""
recognise = [
    "The NIST SP 800-61 lifecycle diagram.",
    "Runbooks and on-call rotations; blameless postmortems.",
    "\"Isolate, do not power off\" in forensic guidance.",
    "Breach notifications that mention persistence mechanisms.",
]

[spec]
purpose = """
Teach the incident lifecycle by replaying one scripted breach under three levels of preparation and response, and comparing the outcomes in a review.
"""
nongoals = [
    "A forensic tool, or legal and regulatory advice.",
    "Real malware analysis.",
    "Detection: the detecting-attacks project.",
]
problem = """
Teams improvise during incidents, and the improvised steps destroy evidence, miss footholds and let the attacker return.
"""
roles = [["Preparation", "`Preparation`"], ["The systems and attacker", "`World`"], ["The actions", "`Responder`"], ["The three responses", "`Playbooks`"], ["The review", "`Outcome`"], ["Entry point", "`IncidentDemo`"]]
requirements = [
    "The attacker copies 1000 rows a minute from minute 20 until the route is cut.",
    "Isolation keeps memory and stops the copying; a reboot destroys memory evidence and keeps the persistence.",
    "Scoping needs central logs that reach back to the start, and an unknown account cannot be disabled.",
    "A rebuild from an image removes the host's persistence; rebuilding by hand is slower.",
    "Any way back in that remains is used within two hours.",
    "The three responses give different reviews, and only the playbook recovers.",
    "The demo prints the same output on every run.",
]

