summary = "01:00 entry through a flaw, 01:05 the database password, 01:20 copying starts at 1000 rows a minute out of 50000, 01:40 three ways back in."
detail = """
The attacker exploits the application on web01, reads the database password from its configuration, connects to db01 and copies the customer table from 01:20, and at 01:40 installs a cron job and an SSH key on web01 and creates a hidden admin account called svc-backup in the shop's admin panel.
"""
speech = """
First demo: the attack. [[slnc 400]] At one in the morning, an attacker gets into the web server through a flaw. [[slnc 300]] They read the database password. [[slnc 300]] From twenty past one they copy the customer table. [[slnc 300]] And at twenty to two they leave three ways back in.
"""
rows = { attack = "active wrong" }
console = [
    ["01:00 an attacker gets into web01 through a flaw in the application", "bad"],
    ["01:20 starts copying the customer table from db01, 1000 rows a minute, 50000 customers in all", "bad"],
    ["01:40 adds three ways back in: a cron job and an SSH key on web01, and a hidden admin account called svc-backup", "bad"],
]

[[act]]
title = "What was prepared"
summary = "Nothing: 0 of 6; an alert only: 1 of 6; everything: 6 of 6."
detail = """
Three organisations face the same attack. The first has nothing in place: no runbook, no alert on database reads, no central logs, no snapshots, no images, untested backups. The second has one alert. The third has all six: a written runbook and contacts, the alert, logs kept
centrally for 30 days, a way to snapshot memory and disk, a known-good image, and tested backups.
"""
speech = """
Second demo: what was prepared. [[slnc 400]] The first organisation has nothing. [[slnc 300]] The second has one alert. [[slnc 300]] The third has six things in place: a runbook, an alert, central logs, snapshots, a known good image, and tested backups. [[slnc 600]]
The same attack will now meet three very different organisations.
"""
rows = { prepare = "active amber" }
console = [
    ["nothing 0 of 6 in place; missing: no written runbook and contact list, no alert on unusual database reads, ...", "bad"],
    ["alert only 1 of 6 in place", "amber"],
    ["full 6 of 6 in place", "ok"],
]

[[act]]
title = "Response A: nothing prepared, and a panicked fix"
summary = "A customer finds the breach on day 3; the fix is a reboot and a changed password, and two hours after going back online the attacker returns through the cron job."
detail = """
Without monitoring the breach is discovered three days later, when a customer says their data is being sold; all 50,000 rows left on the first night. The responders reboot web01 (which destroys the memory evidence and leaves the cron job and SSH key in place), rotate the database password, and reconnect. Four ways back in
are still open, and the attacker returns using the cron job. Nothing is known about what they did.
"""
speech = """
Third demo: response A, nothing prepared. [[slnc 400]] A customer finds the breach, three days later. [[slnc 300]] All fifty thousand rows left on the first night. [[slnc 600]]
The responders reboot the server, which destroys the memory evidence and leaves the cron job and the key. [[slnc 300]] They change one password, and go back online. [[slnc 300]] Two hours later, the attacker is back.
"""
rows = { a = "active wrong" }
console = [
    ["day 3 01:00 detect: a customer reports that their data is being sold", "bad"],
    ["day 3 01:03 reboot web01: memory evidence lost; cron job and SSH key survive the reboot", "bad"],
    ["day 3 01:23 reconnect web01: back in service with 4 way(s) back in still open", "bad"],
    ["day 3 03:23 monitor for 2 hours: THE ATTACKER IS BACK, using the cron job on web01", "bad"],
]

[[act]]
title = "Response B: an alert, but no plan"
summary = "The alert comes at 01:30 and isolation at 01:35 stops the copying at 15000 rows; but a hand rebuild, no scope, an unrotated password and an unpatched flaw leave three ways in, and the attacker returns."
detail = """
With an alert on database reads the breach is found 30 minutes in, and isolating web01 at 01:35 stops the copying after 15,000 rows. But there are no central logs, so nobody knows about the hidden admin account; there is no image, so the rebuild takes two hours by hand and nobody is sure it is clean;
the password is not rotated and the flaw is not patched. The shop returns to service at 03:45 with three ways back in open, and the attacker returns through the hidden account.
"""
speech = """
Fourth demo: response B, an alert but no plan. [[slnc 400]] The alert comes after thirty minutes, and isolating the server stops the copying at fifteen thousand rows. [[slnc 600]]
But there are no logs, so nobody knows about the hidden account. [[slnc 300]] There is no image, so the rebuild takes two hours. [[slnc 300]] The password is not rotated and the flaw is not patched. [[slnc 600]]
The attacker comes back through the account nobody knew about.
"""
rows = { b = "active amber" }
console = [
    ["day 0 01:35 isolate web01: network rule blocks it, memory kept; the route to db01 is cut", "ok"],
    ["day 0 03:35 rebuild web01: by hand, with no image: slow, and nobody is sure it is clean", "amber"],
    ["day 0 03:45 reconnect web01: back in service with 3 way(s) back in still open", "bad"],
    ["day 0 05:45 monitor for 2 hours: THE ATTACKER IS BACK, using the hidden admin account svc-backup", "bad"],
]

[[act]]
title = "Response C: the playbook"
summary = "Isolate and kill sessions (15000 rows), capture evidence, scope from logs, rotate the password, disable svc-backup, patch, rebuild from the image, reconnect, and two quiet hours."
detail = """
The alert arrives at 01:30. The playbook contains first (isolate web01 at 01:35, which keeps the memory, and end the attacker's database session), then captures memory, disk and logs with hashes, and scopes the incident from the central logs: the start at 01:00, the two hosts, and the hidden account created at 01:40.
It then closes every way back in: rotates the database password, disables svc-backup, patches the flaw, and rebuilds web01 from the known-good image (which removes the cron job and the key). At 03:45 web01 is reconnected, and two hours of monitoring are quiet.
"""
speech = """
Fifth demo: response C, the playbook. [[slnc 400]] Contain first, by cutting the network, which keeps the memory. [[slnc 300]] Then capture the evidence, and scope the incident from the logs. [[slnc 600]]
Then close every way back in: the password, the hidden account, the flaw, and a rebuild from the known good image. [[slnc 600]]
The shop is back at a quarter to four, and the two hours of monitoring are quiet.
"""
rows = { c = "active ok" }
console = [
    ["day 0 01:35 isolate web01; 01:37 kill database sessions", "ok"],
    ["day 0 01:52 capture evidence: memory and disk of web01 snapshotted, logs collected with hashes", "ok"],
    ["day 0 02:12 scope from logs: start 01:00, web01 and db01 involved, svc-backup created at 01:40", "ok"],
    ["day 0 02:22 rotate database password; 02:25 disable svc-backup; 02:55 patch the flaw", "ok"],
    ["day 0 03:35 rebuild web01: from the known-good image: cron job and SSH key are gone", "ok"],
    ["day 0 05:45 monitor for 2 hours: quiet", "ok"],
]

[[act]]
title = "The review"
summary = "A was found after 3 days with all data copied and 4 ways in open; B and C stopped the copying at 15000 rows, but only C kept evidence, knows the root cause, left no way in, and recovered."
detail = """
The table compares the three responses. A: found after three days, the copying never stopped by the response (all 50,000 rows had already gone), four ways back in, no evidence, no root cause, the attacker came back, not recovered. B: found in 30 minutes and 15,000 rows copied before it was stopped, but three ways in are open, no evidence, no root cause,
130 minutes out of service, the attacker came back. C: the same 15,000 rows, no ways in left, evidence kept, the root cause known, 130 minutes out of service, the attacker did not come back, recovered.
The next step of "learn" is a blameless review: which preparation would have saved the 15,000 rows? (An alert in five minutes, or a rate limit on the database account.)
"""
speech = """
Sixth demo: the review. [[slnc 400]] Response A: found after three days, everything copied, four ways in left open, the attacker came back. [[slnc 600]]
Response B: found in thirty minutes, fifteen thousand rows copied, three ways in left open, the attacker came back. [[slnc 600]]
Response C: the same fifteen thousand rows, no way in left, the evidence kept, the cause known, and recovered. [[slnc 300]] Then the team asks what would have saved those fifteen thousand rows.
"""
rows = { review = "active ok" }
console = [
    ["found after: 3 days / 30 min / 30 min", "muted"],
    ["rows copied before it was stopped: never / 15000 / 15000", "amber"],
    ["ways back in left open: 4 / 3 / 0", "amber"],
    ["evidence kept: no / no / yes; root cause known: no / no / yes", "amber"],
    ["recovered: no / no / yes", "ok"],
]

