narration = "Here is the scenario. [[slnc 400]] The shop's web server (web01) and database (db01), one attacker with a scripted behaviour, and three responses to the same incident. [[slnc 400]] The simulation counts minutes from 01:00 on day 0; each response action has a duration and an effect on the systems, and the engine records a timeline and a review."

