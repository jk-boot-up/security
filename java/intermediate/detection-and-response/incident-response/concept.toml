[[scene]]
key = "01-poster"
kind = "poster"
title = "Incident Response: Prepare, Contain, Eradicate, Recover, Learn"
narration = "Hello, and welcome. [[slnc 400]] This video explains incident Response, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] The same breach ends very differently depending on what was prepared (alerts, central logs, snapshots, images) and on the order of the response: contain without destroying evidence, scope from logs, close every way back in, rebuild from a known-good image, and watch, because an attacker with one way back in will use it. [[slnc 600]] Think of it this way. [[slnc 300]] A house fire. If there are smoke alarms, an exit plan and a fire extinguisher in the kitchen, the fire is small and the family is outside in a minute. If someone turns on the lights and runs around opening windows, they feed the fire. And when the firemen leave, someone must check the walls, because a smouldering beam restarts the fire at night. [[slnc 700]] In this video, the domain is an online shop's breach. [[slnc 500]] By the end, you will be able to: [[slnc 300]] Name the phases of incident handling and the evidence each needs. [[slnc 300]] Explain why isolating is better than rebooting during an incident. [[slnc 300]] List the ways back in an attacker leaves, and how to find them."

