[threatmodel]
scope = """
The response to a breach of a web server that leads to a theft of customer data. It covers what the responders do between the first alert and the return to service, and what they decide before.
It does not cover how the flaw is fixed in the code, legal duties, or public communication.
"""
assets = [
    "Customer data.",
    "The integrity of the shop's systems.",
    "The evidence needed to know what happened.",
]
actors = [
    "The attacker, with three footholds.",
    "The incident responders.",
    "Customers, regulators and management who must be told.",
]
boundaries = [
    "The shop's systems to the attacker: every foothold is a trust boundary that stayed open.",
    "Evidence to the response: actions that change systems can destroy it.",
]
assumptions = [
    "The attacker's behaviour is fixed and scripted.",
    "The responders' actions take the stated times.",
]
out_of_scope = [
    "Notification duties and public statements.",
    "Attribution of the attacker.",
]
tests = [
    "`IncidentTest` checks the preparation checklist, detection times, the copying rate and the minute it stops, the effect of a reboot, a rebuild with and without an image, scoping with enough and too little log history, the account that cannot be disabled when unknown, the way the attacker returns, the action that closes each way back in, the step where B and C part ways, and the three outcomes.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next module, secure-design, steps back from incidents to the design decisions that shape them, starting with threat modeling and requirements.
"""

[[threat]]
id = "T1"
stride = "I"
threat = "The theft continues while the team decides what to do"
where = "`Responder.isolateWeb01`, `killDatabaseSessions`"
control = "An alert on unusual reads, a runbook that names who may isolate, containment by network rule first"
residual = "Rows already copied before the alert"

[[threat]]
id = "T2"
stride = "E"
threat = "The attacker returns through a way back in that the response missed"
where = "`World.footholdsLeft`"
control = "Scope from logs, rotate every seen credential, rebuild from an image, patch the flaw, monitor after recovery"
residual = "Footholds that the logs do not show"

[[threat]]
id = "T3"
stride = "R"
threat = "Evidence is destroyed or never kept, so the cause and extent are unknown"
where = "`Responder.rebootWeb01`, `Preparation.logsShippedCentrally`"
control = "Isolate instead of rebooting, snapshot memory and disk, central logs with retention, hashes for chain of custody"
residual = "Attackers who delete or alter the central logs; keep them append-only"

