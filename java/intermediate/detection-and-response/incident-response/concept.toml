level = "intermediate"
module = "detection-and-response"
title = "Incident Response: Prepare, Contain, Eradicate, Recover, Learn"
short_title = "Incident Response"
package = "ir"
main_class = "IncidentDemo"
tagline = "The outcome of an incident is mostly decided before it starts, and by the order of the first hour"
bold = "The same breach ends very differently depending on what was prepared (alerts, central logs, snapshots, images) and on the order of the response: contain without destroying evidence, scope from logs, close every way back in, rebuild from a known-good image, and watch, because an attacker with one way back in will use it."
domain = "an online shop's breach"
domain_note = ""
youtube_description = "Incident response in Java: one simulated breach handled three ways, with the NIST phases, evidence, containment, eradication and recovery."
thumb_lines = ["INCIDENT", "RESPONSE"]
thumb_code = "contain, then capture"
youtube_title = "Incident Response: One Breach, Three Responses (NIST 800-61, Java)"
