[[scene]]
key = "07-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Name the phases of incident handling and the evidence", "each needs", "Explain why isolating is better than rebooting during", "an incident", "List the ways back in an attacker leaves, and how to", "find them", "Say why a rebuild from a known-good image beats", "cleaning in place"]
narration = "So, how do you use it? [[slnc 400]] Write a short runbook with names, keep logs centrally for weeks, alert on the actions that matter, practise with a tabletop exercise, isolate rather than reboot, capture evidence with hashes, rebuild from images, rotate every credential the attacker could have seen, and hold a blameless review with owners for the follow-ups."

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Try the first exercise", "in docs/session.md."]
narration = "That's incident Response. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Handle an incident by preparing the six basics in advance, then containing without destroying evidence, scoping from logs, closing every way back in, rebuilding from a known-good image, watching for return, and learning from a blameless review. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a rate limit on the database account in the preparation, and see how many rows it saves. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"
