[project]
slug = "webhook-security"
level = "intermediate"
module = "api-security"
title = "Webhook Security: Signatures, Replays and Idempotency"
short_title = "Webhook Security"
package = "webhooks"
main_class = "WebhookDemo"
tagline = "A message to a public address proves nothing until it is verified"
bold = "A webhook endpoint is a public address that anyone can post to, so the store must verify every message: a signature over the exact raw bytes, a signed time inside a short window, a record of events already processed, and handlers that are idempotent and check the order's state."
domain = "an online store"
domain_note = ""
youtube_description = """Webhook security in Java: a payment provider tells an online store "payment succeeded" by posting to a public address, and anyone can post to that address. A forged message marks an order paid that was never paid; then an HMAC-SHA256 signature over the exact raw body stops forgeries and changed bodies, a signed timestamp and a record of processed events stop a real refund message from being replayed and paid twice, idempotent handlers cope with retries and events out of order, and two secrets overlap while the secret is changed. The bill: keep the raw bytes, store and rotate the secret, and still confirm critical events with the provider's API. Mapped to the OWASP API Security Top 10 API8 and API10 and CWE-345."""
thumb_lines = ["WEBHOOK SECURITY", "SIGN, TIME, REMEMBER"]
thumb_code = "t=...,v1=HMAC(t.body)"
youtube_title = "Webhook Security in Java (HMAC Signatures, Replay Protection, Idempotency)"
youtube_tags = ["webhooks", "hmac", "webhook signature", "replay attack", "idempotency", "api security", "owasp api top 10", "java", "application security"]

[readme]
intro = """
A **webhook** is a message that another service posts to your application when something happens: a payment provider tells an online store that a
payment succeeded, or that a refund went through. The store's webhook address is public, so anyone can post to it. A message that arrives there
proves nothing about who sent it, whether it was changed, or whether it is new.

The defences, in the order this project builds them:
- An **HMAC-SHA256 signature** over the signed time and the **exact raw body**, with a secret shared with the provider, compared in constant time.
- A **signed timestamp** inside a short window, and a **record of processed event ids**, so a real message cannot be replayed.
- **Idempotent handlers** that check the order's state, because providers retry and events arrive late, twice or out of order.
- **Secret rotation** with two valid secrets during a changeover.

**Maps to:** OWASP API Security Top 10 (2023) API8 Security Misconfiguration and API10 Unsafe Consumption of APIs · CWE-345 Insufficient
Verification of Data Authenticity · CWE-294 Authentication Bypass by Capture-replay · CWE-347 · OWASP ASVS 5.0, the web services and API chapter.
"""
analogy = """
Think of a shop that ships whenever a note saying "paid" is pushed through its letterbox. Anyone can push a note. A wax seal that only the bank owns
stops forged notes; a date in the seal stops someone from pushing yesterday's real note again; a list of note numbers already handled stops the same
note being acted on twice; and for anything valuable, the shop still phones the bank before it ships.
"""
scenario = """
An online store sells through a payment provider. The provider posts payment and refund events to the store's webhook address. The demo runs the store's
endpoint in process and on a real local HTTP server, with the provider simulated, a clock that moves only when told, and two orders: A-1001 for 4200 cents
and A-1002 for 1999 cents.
"""
costs = [
    "**The secret must be kept and rotated.** Anyone with the shared secret can forge any event, so it lives outside the code, and a change needs a window in which both secrets are accepted.",
    "**The raw bytes must be kept.** The signature covers the exact body; a framework that parses and re-serializes it first will see every real event fail.",
    "**Clocks must be roughly right.** The time window refuses messages from a clock that is too far ahead or behind, so servers need time synchronization.",
    "**The record of events grows.** Processed event ids must be kept at least as long as the provider retries, and in a store shared by every server.",
    "**A signature is not the provider's final word.** For anything valuable, such as shipping goods, confirm the event with the provider's API.",
]
too_much = """
Every webhook endpoint that changes state needs signature verification and replay protection; there is no small version. A purely informational webhook
that only triggers a fresh fetch from the provider's API needs less, because the store then trusts the API answer and not the message.
"""
met_before = [
    "`Stripe-Signature`, `X-Hub-Signature-256` and similar headers on webhooks from payment providers and code hosts.",
    "Webhook settings pages that show a signing secret and a \"roll secret\" button.",
    "Delivery logs that show the same event retried several times.",
    "Incident reports where orders were marked paid by forged callbacks.",
]
where = """
This project is in [api-security](..) and builds on [hashing-and-integrity](../../../beginner/cryptography/hashing-and-integrity), which introduced HMAC,
and [keystore-basics](../../../beginner/cryptography/keystore-basics), which introduced key rotation by name.
"""
twin = """
The store's endpoint runs in process and on a real HTTP server on the loopback address of this machine; the port is never printed. The payment provider is
simulated in Java, and the clock moves only when the demo moves it, so every signature and every answer is the same on every run.
"""
test_note = "The HMAC is checked against RFC 4231 test case two, and the header against a value the test computes independently with the JDK's Mac class. The clock is simulated, so every signature and answer is the same on every run."

[[act]]
title = "An endpoint that trusts whatever is posted"
summary = "Anyone posts a payment-succeeded event with no signature, and the store marks order A-1001 paid, while the provider has no payment for it."
detail = """
Anyone posts a "payment succeeded" event for order A-1001 to the store's webhook address, with no signature. The store answers 200 and marks the order
paid. The provider's own records for A-1001 say: no payment. The webhook address is public, so a message to it proves nothing about who sent it.
"""
speech = """
First demo: an endpoint that trusts whatever is posted to it. [[slnc 400]] Anyone posts a message saying payment succeeded for an order. [[slnc 300]] With no signature. [[slnc 600]]
The store marks the order paid. [[slnc 600]]
The provider's own records say: no payment. [[slnc 300]] The order is marked paid, and was never paid. [[slnc 600]]
The webhook address is public, so a message to it proves nothing about who sent it.
"""
rows = { trust = "active wrong" }
console = [
    ["anyone posts {\"type\":\"payment.succeeded\",\"order\":\"A-1001\"} to the store's webhook address, with no signature", "muted"],
    ["the store answers: 200 order A-1001 is now paid", "bad"],
    ["the provider's own records for A-1001: no payment  <- MARKED PAID, NEVER PAID", "bad"],
    ["the webhook address is public, so a message to it proves nothing about who sent it", "amber"],
]

[[act]]
title = "A signature over the exact bytes"
summary = "An HMAC-SHA256 of the signed time and raw body accepts the real event and refuses a changed body, a missing signature and another secret, compared in constant time."
detail = """
The provider signs an HMAC-SHA256 of the timestamp and the raw body with the secret it shares with the store. The real event, as signed, is accepted. The same
signature on a body changed to order A-1002 is refused with 401; a forged event with no signature is refused with 400; and one signed with a secret that is not the
provider's is refused with 401. The comparison takes the same time however many bytes match. Over the local HTTP server the answers are the same: 200, 401 and 400.
"""
speech = """
Second demo: a signature over the exact bytes. [[slnc 400]] The provider signs each message with a secret it shares with the store. [[slnc 300]] An H MAC, over the time and the raw body. [[slnc 600]]
The real event is accepted. [[slnc 600]]
The same signature on a body changed to another order is refused. [[slnc 300]] A message with no signature is refused. [[slnc 300]] A message signed with any other secret is refused. [[slnc 600]]
The comparison takes the same time however many bytes match, so timing gives nothing away. [[slnc 300]] And the real server gives the same answers.
"""
rows = { sign = "active ok" }
console = [
    ["the provider signs HMAC-SHA256 of the timestamp and the raw body with the secret it shares with the store", "muted"],
    ["the real event, as signed: 200 order A-1001 is now paid", "ok"],
    ["the same signature on a body changed to order A-1002: 401 refused: the signature does not match", "ok"],
    ["a forged event with no signature: 400 refused: no signature", "ok"],
    ["a forged event signed with a secret that is not the provider's: 401 refused: the signature does not match", "ok"],
    ["the same checks over the local HTTP server: real event 200, changed body 401, no signature 400", "ok"],
]

[[act]]
title = "A real message sent again"
summary = "With signatures only, a real refund replayed an hour later pays 8400 cents for a 4200-cent order; a signed time window and a record of event ids stop it."
detail = """
With signatures only, a real refund is applied and pays back 4200 cents. Someone who saw that message sends a copy an hour later; it is still correctly signed, so it is
applied again: two refunds, 8400 cents for a 4200-cent order. With a 300-second window on the signed time and a record of processed event ids, the real refund is applied;
the same message after 30 seconds is answered "already processed, nothing changed"; an hour later it is refused as signed too long ago; and with its time edited to now
the signature no longer matches, because the time is part of what is signed. One refund, 4200 cents.
"""
speech = """
Third demo: a real message sent again. [[slnc 400]] With signatures only, a real refund pays the customer back. [[slnc 600]]
Someone who saw that message sends a copy an hour later. [[slnc 300]] It is still correctly signed. [[slnc 300]] So it is paid again. [[slnc 300]] Two refunds, for one order. [[slnc 600]]
Now add a short window on the signed time, and a record of the events already processed. [[slnc 600]]
The same message after thirty seconds changes nothing. [[slnc 300]] An hour later it is refused. [[slnc 300]] And editing its time breaks the signature, because the time is signed too. [[slnc 600]]
One refund, as it should be.
"""
rows = { replay = "active amber" }
console = [
    ["with signatures only, a real refund: 200 order A-1001 is now refunded, 4200 cents paid back", "muted"],
    ["someone who saw that message sends a copy an hour later: 200 order A-1001 is now refunded, 4200 cents paid back", "bad"],
    ["refunds paid for A-1001: 2, 8400 cents for a 4200-cent order  <- A REAL MESSAGE, REPLAYED", "bad"],
    ["with a 300-second window on the signed time, and a record of processed event ids:", "muted"],
    ["  the same message again after 30 seconds: 200 already processed evt_1001refund, nothing changed", "ok"],
    ["  the same message again an hour later: 400 refused: signed too long ago", "ok"],
    ["  the same message with its time edited to now: 401 refused: the signature does not match", "ok"],
    ["  refunds paid for A-1001: 1, 4200 cents", "ok"],
]

[[act]]
title = "Twice, out of order, and a new secret"
summary = "A retried event changes the order once; a refund before its payment is answered 409 and applied on retry; old and new secrets both work during a changeover."
detail = """
The provider retries the payment event, so it arrives twice: the order changes once, and A-1001 is paid. A refund for A-1002 arrives before its payment and is answered
409, "not applied: order is new, try again later", and is not recorded as processed; then the payment is applied, and the provider's retry of the refund is applied.
When the secret changes, the store accepts both for a while, so messages signed with the old and the new secret both get 200; once the old secret is removed, a message
signed with it is refused with 401.
"""
speech = """
Fourth demo: the same event twice, events out of order, and a new secret. [[slnc 400]] Providers retry, so the same event can arrive twice. [[slnc 300]] The order changes once. [[slnc 600]]
A refund arrives before its payment. [[slnc 300]] The store answers, not yet, try again, and does not record it as done. [[slnc 600]]
Then the payment arrives. [[slnc 300]] And the retried refund is applied. [[slnc 600]]
When the secret is changed, the store accepts both for a while. [[slnc 300]] Once the old one is removed, a message signed with it is refused.
"""
rows = { idempotent = "active ok", rotate = "active ok" }
console = [
    ["the provider retries the payment event, so it arrives twice: order changes 1 time, A-1001 is paid", "ok"],
    ["a refund for A-1002 arrives before its payment: 409 not applied: order is new, try again later", "amber"],
    ["then the payment: 200 order A-1002 is now paid", "ok"],
    ["then the provider's retry of the refund: 200 order A-1002 is now refunded, 1999 cents paid back", "ok"],
    ["changing the secret: old secret 200, new secret 200 during the changeover", "ok"],
    ["after the old secret is removed, a message signed with it: 401 refused: the signature does not match", "ok"],
]

[[act]]
title = "The bill"
summary = "A re-serialized body fails the signature, so raw bytes must be kept; critical events are confirmed with the provider's API; the secret is kept and rotated; handlers stay idempotent."
detail = """
A framework that parses the body and writes it again with other spacing, then checks the signature, refuses the real event with 401: the raw bytes must be kept, and checked,
before anything parses them. The real event is accepted. Before shipping, the store asks the provider's API about A-1001, and the answer, payment.succeeded 4200, matches the event.
The shared secret lives outside the code, is changed on a schedule with a changeover, and a leak is a forged-payment risk. Events can arrive late, twice or out of order, so every
handler must be idempotent and check the order's state.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] A framework that parses the body and writes it again, before checking, breaks every real signature. [[slnc 300]] So keep the raw bytes, and check them first. [[slnc 600]]
For anything valuable, like shipping goods, still ask the provider's own A P I. [[slnc 600]]
The shared secret lives outside the code, and is changed on a schedule. [[slnc 300]] A leaked secret lets anyone forge a payment. [[slnc 600]]
And because events arrive late, twice, or out of order, every handler must be safe to run again.
"""
rows = { bill = "active amber" }
console = [
    ["a framework that parses the body and writes it again with other spacing, then checks the signature: 401 refused", "bad"],
    ["so the raw bytes must be kept, and checked, before anything parses them", "amber"],
    ["before shipping, the store asks the provider's API about A-1001: payment.succeeded 4200, which matches the event", "ok"],
    ["the shared secret lives outside the code, is changed on a schedule with a changeover, and leaks are a forged-payment risk", "amber"],
    ["events can arrive late, twice or out of order, so every handler must be idempotent and check the order's state", "amber"],
]

