[[act]]
title = "The bill"
summary = "The same event written again by a framework is 88 bytes instead of 79, so its v1 differs and it is refused with 401; the raw body passes; the provider's API confirms A-1001 before shipping."
detail = """
The raw body, as signed, is 79 bytes. The same event, parsed and written again with other spacing, is 88 bytes. With the same header, whose v1 is dc14c6ef9d7ef5d1...,
the re-written body computes 909d1bd03dc6ecc1... and is refused with 401; the raw body computes dc14c6ef9d7ef5d1... and gets 200. So the raw bytes must be kept, and checked,
before anything parses them. Before shipping, the store asks the provider's API about A-1001: payment.succeeded 4200, which matches the event. The secret lives outside the code
and is changed on a schedule; events come late, twice or out of order, so handlers are idempotent.
"""
figure = "raw_bytes"
figure_title = "The same event, different bytes, a different v1"
figure_speech = """
Sixth demo: the bill. [[slnc 400]] Top, the raw body, exactly as the provider signed it. [[slnc 300]] Seventy nine bytes. [[slnc 300]] The store computes the same v one as the header: accepted. [[slnc 700]]
Below, the same event, after a framework has parsed it and written it out again, with spaces. [[slnc 300]] It means the same, but it is eighty eight bytes. [[slnc 300]] So its v one is different, and the real event is refused. [[slnc 700]]
That is the first cost. [[slnc 300]] Keep the raw bytes, and check them before anything parses them. [[slnc 700]]
And for anything valuable, like shipping goods, the store still asks the provider's own A P I. [[slnc 300]] Here it confirms the payment.
"""
speech = """
Here is the output. [[slnc 400]] The raw body, and the same event written again. [[slnc 400]] With the same header, the written copy is refused, and the raw body is accepted.
[[page]]
The provider's A P I confirms the payment before shipping. [[slnc 400]] Keep the raw bytes. [[slnc 300]] Keep the secret outside the code, and change it on a schedule. [[slnc 300]] And make every handler safe to run twice.
"""
