[[act]]
title = "The store checks the signature"
summary = "The store recomputes v1 from the bytes it received and compares in constant time: the real event 200, a body changed to A-1002 401, no header 400, another secret 401; the same over the local HTTP server."
detail = """
The store's steps: read t and v1 from the header, compute the HMAC of t, a dot and the raw body received, and compare it with v1 in constant time (MessageDigest.isEqual).
The real event, as signed: v1 sent dc14c6ef9d7ef5d1..., computed dc14c6ef9d7ef5d1..., 200 order A-1001 is now paid. The body changed to A-1002 with the same header:
computed 8dfb52122bf9f611..., 401 refused: the signature does not match. A forged event with no header: 400 refused: no signature. A forged event signed with another
secret: 401. Over the local HTTP server (POST only, at most 4096 bytes) the answers are the same: 200, 401, 400.
"""
figure = "signature_checks"
figure_title = "The v1 sent, the v1 computed, and the answer"
figure_speech = """
Third demo: the store checks the signature. [[slnc 400]] The store has the same secret. [[slnc 300]] So it makes v one again, from the time and the bytes it actually received. [[slnc 300]] Then it compares that with the v one in the header. [[slnc 700]]
Row one, the real event. [[slnc 300]] Both values are the same. [[slnc 300]] Two hundred, accepted. [[slnc 700]]
Row two, the same header, but the body now says order A ten oh two. [[slnc 300]] One changed character gives a completely different value. [[slnc 300]] Four oh one, refused. [[slnc 700]]
Row three has no header at all: four hundred. [[slnc 300]] Row four is signed with a secret that is not the provider's: four oh one. [[slnc 700]]
The comparison takes the same time however many bytes match, so timing gives nothing away.
"""
speech = """
Here is the output. [[slnc 400]] The store's three steps. [[slnc 400]] Then the real event: the sent and computed values match, two hundred. [[slnc 400]] And the changed body: they differ, four oh one.
[[page]]
No header: four hundred. [[slnc 300]] Another secret: four oh one. [[slnc 400]] And the real H T T P server on this machine gives the same three answers.
"""
