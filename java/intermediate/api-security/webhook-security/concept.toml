[threatmodel]
scope = """
An online store's webhook endpoint for payment and refund events from a payment provider: verification of each message, replay protection, idempotent handling and the shared
secret. It does not cover the provider's own security, the store's other APIs, or the transport, which is assumed to be HTTPS in production.
"""
assets = [
    "Orders and their payment state, which decide whether goods ship.",
    "Refunds, which move money out of the store.",
    "The shared signing secret.",
    "The record of processed event ids.",
]
actors = [
    "The payment provider, the only legitimate sender.",
    "Anyone on the internet who can post to the webhook address.",
    "Someone who has seen a real message, for example in a log or a proxy.",
]
boundaries = [
    "Internet to the webhook endpoint: every message crosses it, and none is trusted until verified.",
    "Endpoint to orders and refunds: only verified, fresh, state-appropriate events cross it.",
]
assumptions = [
    "The secret is known only to the provider and the store.",
    "Server clocks are synchronized to within the time window.",
    "In the demo, the provider is simulated and the secrets are demo values.",
]
out_of_scope = [
    "Transport security, which HTTPS provides: the transport-security module.",
    "Asymmetric webhook signatures and key distribution.",
    "Denial of service against the endpoint beyond the body size limit.",
]
tests = [
    "`SignaturesTest` checks the HMAC against RFC 4231, the header against an independent computation, strict parsing, and matching under any listed secret.",
    "`ReceiverTest` checks refusals, the time window both ways, replays, idempotency, events out of order, wrong amounts, rotation and re-serialized bodies.",
    "`ServerTest` checks the real loopback endpoint: POST only, the body limit and the same verification.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next projects in api-security look at the rest of an API's surface: request and response shapes, rate limits, sessions and cross-origin access.
"""

[[threat]]
id = "T1"
stride = "S"
threat = "A forged event claims to come from the provider"
where = "`Receiver.receive`"
control = "An HMAC-SHA256 signature with the shared secret, required on every message"
residual = "Anyone who obtains the secret can forge events, so the secret is stored and rotated with care"

[[threat]]
id = "T2"
stride = "T"
threat = "A real event's body is changed, for example to another order"
where = "`Signatures.matchesAny`"
control = "The signature covers the exact raw body and is compared in constant time"
residual = "A framework that verifies a re-serialized body breaks verification, so raw bytes are kept"

[[threat]]
id = "T3"
stride = "S"
threat = "A real, correctly signed message is replayed, paying a refund twice"
where = "`Receiver.receive`, `Orders.apply`"
control = "A signed time inside a 300-second window, a record of processed event ids, and state checks"
residual = "The record must be shared by every server and kept as long as the provider retries"

[[threat]]
id = "T4"
stride = "I"
threat = "The shared secret leaks from code, configuration or logs"
where = "the secret store"
control = "The secret is kept outside the code and rotated with a changeover in which both secrets work"
residual = "Between a leak and a rotation, forged events are possible; confirm valuable events with the provider's API"

[[threat]]
id = "T5"
stride = "D"
threat = "Oversized or malformed messages exhaust the endpoint"
where = "`WebhookServer`, `Event.parse`"
control = "POST only, a 4096-byte body limit, and a strict parser that refuses anything unexpected"
residual = "A flood of small messages needs rate limiting in front of the endpoint"

[[threat]]
id = "T6"
stride = "T"
threat = "Events out of order, such as a refund before its payment, leave an order in a wrong state"
where = "`Orders.apply`"
control = "Only allowed state changes are applied; others are answered 409 and retried by the provider"
residual = "Events the provider stops retrying need monitoring and manual review"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] Everything runs inside the Java development kit, with a simulated clock, so every run is the same. [[slnc 300]] Here are the classes that matter."""

[[class]]
name = "Signatures"
what = "the header: t, and v1 over t and the body"
[[class.part]]
title = "what is signed, and the header"
code = """
static String header(byte[] secret, long timestamp, byte[] rawBody) {
    byte[] mac = hmacSha256(secret, signedContent(timestamp, rawBody));
    return "t=" + timestamp + ",v1=" + HexFormat.of().formatHex(mac);
"""
speech = """The header carries the time and v one. [[slnc 300]] V one is the H mac of the time, a dot, and the body exactly as it was sent."""
[[class.part]]
title = "a constant-time comparison, under any secret"
code = """
byte[] content = signedContent(parsed.timestamp(), rawBody);
for (byte[] secret : secrets) {
    any |= MessageDigest.isEqual(hmacSha256(secret, content), parsed.mac());
}
"""
speech = """The store makes v one again from the bytes it received. [[slnc 300]] It compares in constant time, and tries every secret it accepts, which is how a changeover works."""

[[class]]
name = "HmacSteps"
what = "the HMAC by hand, checked against the JDK"
[[class.part]]
title = "pad, mix, hash twice"
code = """
byte[] padded = Arrays.copyOf(key.length > BLOCK ? sha256(key) : key, BLOCK);
byte[] innerKey = xor(padded, 0x36);
byte[] inner = sha256(concat(innerKey, message));
byte[] outerKey = xor(padded, 0x5c);
byte[] mac = sha256(concat(outerKey, inner));
"""
speech = """The key is padded to one block of sixty four bytes. [[slnc 300]] Mixed with three six for the inner hash, and with five c for the outer hash. [[slnc 300]] The outer hash is the H mac."""

[[class]]
name = "Receiver"
what = "the store's endpoint: the checks, in order"
[[class.part]]
title = "signature, time, then event id"
code = """
long age = Math.abs(clock.now() - parsed.get().timestamp());
if (policy.toleranceSeconds() > 0 && age > policy.toleranceSeconds()) {
    return new Reply(400, "refused: signed too long ago");
}
if (!Signatures.matchesAny(secrets, parsed.get(), rawBody)) {
    return new Reply(401, "refused: the signature does not match");
...
if (policy.rememberEvents() && processed.contains(event.get().id())) {
"""
speech = """The receiver refuses a message signed too long ago, then one whose signature does not match. [[slnc 300]] Only then does it parse the body. [[slnc 300]] An event id it has already processed changes nothing."""
[[class.part]]
title = "not yet: try again later"
code = """
if (outcome.startsWith("not applied")) {
    ...
    return new Reply(409, outcome + ", try again later");
}
...
processed.add(event.get().id());
"""
speech = """An event that arrives too early gets four oh nine, and is not remembered. [[slnc 300]] So the provider's retry can still apply it. [[slnc 300]] An event is remembered only once it has been applied."""

[[class]]
name = "Orders"
what = "new to paid, paid to refunded, nothing else"
[[class.part]]
title = "a state check"
code = """
State expected = payment ? State.NEW : State.PAID;
State now = order.state();
if (now != expected) {
    return "not applied: order is " + now.name().toLowerCase(Locale.ROOT);
"""
speech = """A payment moves an order only from new to paid. [[slnc 300]] A refund only from paid to refunded. [[slnc 300]] So a second refund can never be paid."""

[[class]]
name = "WebhookServer"
what = "the real local endpoint: the raw bytes"
[[class.part]]
title = "keep the raw bytes"
code = """
body = in.readNBytes(MAX_BODY + 1);
...
String signature = exchange.getRequestHeaders().getFirst(Signatures.HEADER);
reply = body.length > MAX_BODY ? new Reply(413, "refused: body too large")
        : receiver.receive(body, signature);
"""
speech = """The server reads at most four thousand and ninety six bytes. [[slnc 300]] It hands the receiver the raw bytes and the signature header, untouched."""

