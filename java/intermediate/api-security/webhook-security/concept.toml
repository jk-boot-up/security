[docs.session]
objectives = [
    "explain why a message to a public address proves nothing on its own",
    "verify an HMAC signature over raw bytes, in constant time",
    "explain why the time must be signed, and how a window and an event record stop replays",
    "make a handler idempotent and safe for events out of order",
    "rotate a shared secret without refusing real events",
]
walkthrough = """
Start with the letterbox. Run act one and ask what the store would ship. In act two, ask why the body must be the raw bytes. In act three, ask why the signature alone did not stop the
second refund. In act four, ask what the provider does after a 409. In act five, ask which events are worth a call to the provider's API.
"""
exercises = [
    "Add a third event type, payment.disputed, with the state changes it allows.",
    "Keep the processed event ids for a limited time, and find the shortest time that is still safe given the provider's retry schedule.",
    "Make the receiver accept a header with two v1 values, as some providers send during rotation.",
    "Move the record of processed events into a store shared by two receivers, and show that a replay to the second one is still caught.",
]

[docs.explained]
sentence = """
A webhook endpoint is a public address, so every message must be verified: an HMAC signature over the signed time and exact raw body, a short time window and a record of processed
events against replays, idempotent state-checked handlers for retries and disorder, a rotated secret, and the provider's API for anything valuable.
"""
verdict = """
Verify the provider's signature on the raw body before parsing, with a constant-time comparison. Refuse messages outside a few minutes, remember processed event ids, and make
every handler idempotent. Keep the secret in a secret store and rotate it with an overlap. For high-value actions, confirm with the provider's API before acting.
"""
recognise = [
    "A webhook handler that reads the raw request body before deserializing it.",
    "Signature headers with a `t=` timestamp and a `v1=` HMAC.",
    "Tables of processed event ids with an expiry.",
    "Security findings titled \"missing webhook signature verification\", CWE-345.",
]

[spec]
purpose = """
Teach how to receive webhooks safely by forging and replaying events against an online store's endpoint, then verifying signatures over raw bytes, refusing replays, handling
retries and disorder idempotently, and rotating the shared secret.
"""
nongoals = [
    "Sending webhooks: the provider side is only simulated.",
    "Asymmetric signatures on webhooks, which some providers use: the digital-signatures project covers the idea.",
    "A message queue or a database for the processed events: the record is in memory.",
]
problem = """
Webhook endpoints are public, and teams often act on any well-formed message, verify a parsed copy instead of the raw bytes, or forget replays and retries.
"""
roles = [["Signature format and checks", "`Signatures`"], ["The event and its strict parser", "`Event`"], ["Orders and refunds", "`Orders`"], ["The endpoint's checks", "`Receiver`"], ["The local HTTP endpoint", "`WebhookServer`"], ["The simulated provider", "`Provider`"], ["Entry point", "`WebhookDemo`"]]
requirements = [
    "An unsigned, wrongly signed or changed message changes nothing.",
    "The HMAC matches RFC 4231 test case two, and the header matches an independently computed value.",
    "Messages outside the time window are refused, and a processed event is not applied again.",
    "An event that arrives before its order is ready is answered 409 and applied on a later retry.",
    "Two secrets work during a changeover, and only the new one after.",
    "The demo prints the same output on every run.",
]

