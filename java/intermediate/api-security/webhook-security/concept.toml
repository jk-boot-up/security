[[scene]]
key = "01-poster"
kind = "poster"
title = "Webhook Security"
narration = """Hello, and welcome. [[slnc 400]] This video explains webhook security, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A webhook is a message that another service posts to your application when something happens. [[slnc 300]] A payment provider tells a store that a payment succeeded. [[slnc 600]] Think of a shop that ships whenever a note saying paid is pushed through its letterbox. [[slnc 300]] Anyone can push a note. [[slnc 300]] A seal, a date, and a list of notes already handled are what make the note worth trusting. [[slnc 700]] In this video, the domain is an online store. [[slnc 500]] By the end, you will hear how to verify a signature. [[slnc 300]] How to stop a real message being replayed. [[slnc 300]] How to cope with retries and events out of order. [[slnc 300]] And how to change the secret without refusing real events."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online store sells through a payment provider.", "", "The provider posts payment and refund events", "to the store's public webhook address.", "", "The store ships goods and pays refunds on them."]
narration = """Here is the scenario. [[slnc 400]] An online store sells through a payment provider. [[slnc 500]] The provider posts payment and refund events to the store's webhook address. [[slnc 500]] That address is public. [[slnc 300]] And the store ships goods, and pays refunds, because of what arrives there."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["Webhook: a message posted when something happens", "HMAC: a keyed hash that proves who sent it", "Replay: a real message sent again", "Idempotent: safe to run twice", "Rotation: changing the secret"]
narration = """Before the demos, the words. [[slnc 500]] A webhook is a message posted to your application when something happens. [[slnc 500]] An H MAC is a keyed hash, which only someone with the secret can make. [[slnc 500]] A replay is a real message, sent again. [[slnc 500]] Idempotent means safe to run twice. [[slnc 500]] And rotation means changing the secret."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "09-ladder"
kind = "bullets"
title = "Four Questions for Every Message"
body = ["Is it from the provider? the signature", "Is it unchanged? the raw bytes", "Is it new? the time and the event id", "Is it safe to apply? the order's state"]
narration = """Let's put it in order. [[slnc 400]] Is it from the provider? The signature answers that. [[slnc 500]] Is it unchanged? Only if the signature covers the raw bytes. [[slnc 500]] Is it new? The signed time and the record of events answer that. [[slnc 500]] And is it safe to apply now? The order's state answers that."""

[[scene]]
key = "10-roles"
kind = "bullets"
title = "Who Does What"
body = ["Signatures: the header and the HMAC", "Event: a strict parser", "Receiver: the checks, in order", "Orders: the allowed state changes", "WebhookServer: the real local endpoint"]
narration = """Here is who does what in the code. [[slnc 400]] The signatures class writes and checks the signature header. [[slnc 500]] The event class parses exactly one shape of message. [[slnc 500]] The receiver runs the checks, in order. [[slnc 500]] The orders class allows only the right state changes. [[slnc 300]] And the webhook server is the real endpoint on this machine."""

[[scene]]
key = "11-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Signature headers on provider webhooks", "\"Roll secret\" buttons", "Retried deliveries in delivery logs", "Forged callback incidents"]
narration = """You have probably met this already. [[slnc 400]] Payment providers and code hosts put a signature header on every webhook. [[slnc 500]] Their settings pages have a button to roll the signing secret. [[slnc 500]] Their delivery logs show the same event retried several times. [[slnc 500]] And incident reports describe orders marked paid by forged callbacks."""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Verify the signature on the raw body first", "Refuse old messages; remember event ids", "Make every handler idempotent", "Rotate the secret with an overlap", "Confirm valuable events with the API"]
narration = """So, how do you use it? [[slnc 400]] Verify the signature on the raw body, before parsing anything. [[slnc 500]] Refuse messages signed too long ago, and remember the events already processed. [[slnc 500]] Make every handler safe to run twice. [[slnc 500]] Rotate the secret, with a period where both work. [[slnc 500]] And for anything valuable, confirm with the provider's A P I."""

[[scene]]
key = "13-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a disputed event", "and decide which state changes it allows."]
narration = """That's webhook security. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] A message to a public address proves nothing until its signature, its time, and its event id have been checked. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine, with nothing installed except a Java development kit. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a disputed event, and decide which state changes it allows. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
An online store's webhook endpoint for payment and refund events from a payment provider: verification of each message, replay protection, idempotent handling and the shared
secret. It does not cover the provider's own security, the store's other APIs, or the transport, which is assumed to be HTTPS in production.
"""
assets = [
    "Orders and their payment state, which decide whether goods ship.",
    "Refunds, which move money out of the store.",
    "The shared signing secret.",
    "The record of processed event ids.",
]
actors = [
    "The payment provider, the only legitimate sender.",
    "Anyone on the internet who can post to the webhook address.",
    "Someone who has seen a real message, for example in a log or a proxy.",
]
boundaries = [
    "Internet to the webhook endpoint: every message crosses it, and none is trusted until verified.",
    "Endpoint to orders and refunds: only verified, fresh, state-appropriate events cross it.",
]
assumptions = [
    "The secret is known only to the provider and the store.",
    "Server clocks are synchronized to within the time window.",
    "In the demo, the provider is simulated and the secrets are demo values.",
]
out_of_scope = [
    "Transport security, which HTTPS provides: the transport-security module.",
    "Asymmetric webhook signatures and key distribution.",
    "Denial of service against the endpoint beyond the body size limit.",
]
tests = [
    "`SignaturesTest` checks the HMAC against RFC 4231, the header against an independent computation, strict parsing, and matching under any listed secret.",
    "`ReceiverTest` checks refusals, the time window both ways, replays, idempotency, events out of order, wrong amounts, rotation and re-serialized bodies.",
    "`ServerTest` checks the real loopback endpoint: POST only, the body limit and the same verification.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next projects in api-security look at the rest of an API's surface: request and response shapes, rate limits, sessions and cross-origin access.
"""

[[threat]]
id = "T1"
stride = "S"
threat = "A forged event claims to come from the provider"
where = "`Receiver.receive`"
control = "An HMAC-SHA256 signature with the shared secret, required on every message"
residual = "Anyone who obtains the secret can forge events, so the secret is stored and rotated with care"

[[threat]]
id = "T2"
stride = "T"
threat = "A real event's body is changed, for example to another order"
where = "`Signatures.matchesAny`"
control = "The signature covers the exact raw body and is compared in constant time"
residual = "A framework that verifies a re-serialized body breaks verification, so raw bytes are kept"

[[threat]]
id = "T3"
stride = "S"
threat = "A real, correctly signed message is replayed, paying a refund twice"
where = "`Receiver.receive`, `Orders.apply`"
control = "A signed time inside a 300-second window, a record of processed event ids, and state checks"
residual = "The record must be shared by every server and kept as long as the provider retries"

[[threat]]
id = "T4"
stride = "I"
threat = "The shared secret leaks from code, configuration or logs"
where = "the secret store"
control = "The secret is kept outside the code and rotated with a changeover in which both secrets work"
residual = "Between a leak and a rotation, forged events are possible; confirm valuable events with the provider's API"

[[threat]]
id = "T5"
stride = "D"
threat = "Oversized or malformed messages exhaust the endpoint"
where = "`WebhookServer`, `Event.parse`"
control = "POST only, a 4096-byte body limit, and a strict parser that refuses anything unexpected"
residual = "A flood of small messages needs rate limiting in front of the endpoint"

[[threat]]
id = "T6"
stride = "T"
threat = "Events out of order, such as a refund before its payment, leave an order in a wrong state"
where = "`Orders.apply`"
control = "Only allowed state changes are applied; others are answered 409 and retried by the provider"
residual = "Events the provider stops retrying need monitoring and manual review"
