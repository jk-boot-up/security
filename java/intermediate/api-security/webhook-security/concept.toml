[[act]]
title = "A real message sent again"
summary = "With signatures only, a real refund sent again an hour later pays 8400 cents for a 4200-cent order; with a 300-second window and a record of event ids, copies are ignored or refused, and editing t breaks the signature."
detail = """
The message: a real refund for A-1001, signed at t=1800000000. With signatures only, the real refund at t + 0 is applied, and a copy sent again at t + 3600 is applied too:
two refunds, 8400 cents for a 4200-cent order. With a 300-second window on the signed time and a record of processed event ids: the real refund is applied; the copy at
t + 30 (age 30 <= 300, id already seen) gets 200 already processed, nothing changed; the copy at t + 3630 (age 3630 > 300) gets 400 refused: signed too long ago; and the
copy with its t edited to 1800003630 gets 401, because the time is part of what is signed. One refund, 4200 cents.
"""
figure = "replay_timeline"
figure_title = "One real refund, sent again"
figure_speech = """
Fourth demo: a real message sent again. [[slnc 400]] Someone has seen a real refund message, in a log perhaps. [[slnc 300]] Its signature is genuine. [[slnc 700]]
Top row, a store that checks signatures only. [[slnc 300]] The real refund is paid. [[slnc 300]] An hour later, the same message is sent again. [[slnc 300]] It is still correctly signed, so it is paid again. [[slnc 300]] Eight thousand four hundred cents, for a four thousand two hundred cent order. [[slnc 700]]
Bottom row, with two more checks. [[slnc 300]] The age of a message is now, minus its signed time, and it must be at most three hundred seconds. [[slnc 300]] And the store remembers every event id it has processed. [[slnc 700]]
After thirty seconds, the age is fine, but the id is known: nothing changes. [[slnc 300]] After an hour, the age is far too large: refused. [[slnc 300]] And if someone edits the time to now, the signature no longer matches, because the time is signed too.
"""
