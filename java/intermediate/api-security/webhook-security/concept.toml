[[act]]
title = "How the provider signs a message"
summary = "The provider signs t, a dot and the raw body with HMAC-SHA256 and the shared secret: the key is padded to 64 bytes and mixed with 36 and 5c, two SHA-256 hashes give v1, and the header is t=1800000000,v1=dc14c6ef..."
detail = """
The inputs: the shared secret whsec-demo-shop-2026 (20 bytes), the time t = 1800000000 seconds since 1 January 1970, and the raw body of 79 bytes.
Step 1: what is signed is t, a dot, and the raw body: 1800000000.{"id":"evt_1001paid",...}. Step 2: the secret is padded with zeros to one 64-byte block; each byte
XOR 36 gives the inner key, each byte XOR 5c the outer key. Step 3: inner = SHA-256(inner key + what is signed), and v1 = SHA-256(outer key + inner).
The header sent with the body is Shop-Signature: t=1800000000,v1=dc14c6ef9d7ef5d1fd993788607f660adf0d0e8e177d6a0e2f5748dcce6c5cc3. The hand-made value equals the JDK's Mac.
"""
figure = "hmac_steps"
figure_title = "An HMAC, step by step, with the real values"
figure_speech = """
Second demo: how the provider signs a message. [[slnc 400]] Top left, the inputs. [[slnc 300]] A secret, shared only by the provider and the store. [[slnc 300]] The time, in seconds since nineteen seventy. [[slnc 300]] And the raw body, exactly as it will be sent. [[slnc 700]]
Step one. [[slnc 300]] What is signed is the time, a dot, and the raw body, joined together. [[slnc 700]]
Step two, on the right. [[slnc 300]] The secret is padded with zeros to one block of sixty four bytes. [[slnc 300]] Each byte is mixed with the value three six, to make an inner key. [[slnc 300]] And with five c, to make an outer key. [[slnc 700]]
Step three. [[slnc 300]] An S H A two fifty six hash of the inner key and the signed text. [[slnc 300]] Then a second hash, of the outer key and that first result. [[slnc 300]] That second hash is v one, the signature. [[slnc 700]]
At the bottom, the header sent with the body: the time, and v one. [[slnc 300]] Without the secret, nobody can make that value.
"""
speech = """
Here is the output. [[slnc 400]] The inputs: the secret, the time, and the seventy nine byte body. [[slnc 400]] Step one, the text that is signed. [[slnc 400]] Step two, the padded key, and the two mixed keys. [[slnc 300]] Only the first eight bytes are shown.
[[page]]
Step three, the two hashes, with all thirty two bytes in hex. [[slnc 400]] Then the header, with the time and v one. [[slnc 400]] And a check: the value made by hand is the same as the one from the Java library.
"""
