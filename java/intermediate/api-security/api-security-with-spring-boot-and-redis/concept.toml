[[act]]
title = "The budget runs out, and refills"
summary = "Each caller's bucket in Redis holds 50 tokens and refills 1 a second; of 1000 requests at one moment 50 are answered and 950 get 429 with Retry-After: 1, worked out as ceil((1 - 0) / 0.001) = 1000 ms = 1 second; ben has his own bucket."
detail = """
A filter takes one token from the signed-in caller's bucket before the controller runs. The bucket lives in Redis under `rate:<caller>`, holds 50 tokens and refills 1 a second, and a Lua script reads, refills, takes and writes it back in one step.
1000 requests at one moment: 50 are answered, 950 get 429 with `Retry-After: 1`. The wait is the missing token over the refill rate: ceil((1 - 0) / 0.001) = 1000 ms, and the header is ceil(1000 / 1000) = 1 second.
One second later the bucket holds 0 + 1 = 1 token, the call is answered and 0 are left. Ben has his own bucket; Redis holds the keys rate:ana and rate:ben.
"""
figure = "redis_bucket"
figure_title = "A bucket per caller, kept in Redis"
figure_speech = """
Fourth demo: the budget runs out, and refills. [[slnc 400]] Each caller has a bucket of tokens, kept in Redis. [[slnc 300]] It holds fifty, and refills one a second. [[slnc 300]] Every request takes one, in a small script that Redis runs as a single step, so two servers can never take the same token. [[slnc 700]]
The bar shows a thousand requests, all at one moment. [[slnc 300]] Fifty are answered. [[slnc 300]] Nine hundred and fifty get four two nine, too many requests. [[slnc 700]]
How long to wait? [[slnc 300]] One missing token, divided by a refill of zero point zero zero one a millisecond, is a thousand milliseconds. [[slnc 300]] Retry after is in whole seconds: one. [[slnc 600]]
One second later, one token has refilled, and the call works. [[slnc 300]] Ben has a bucket of his own.
"""
speech = """
Here is the output, in two pages. [[slnc 400]] The budget: fifty tokens, one a second. [[slnc 300]] Of a thousand requests, fifty answered, and nine hundred and fifty refused with four two nine. [[slnc 400]] The wait, worked out: a thousand milliseconds, so one second.
[[page]]
One second later the call works: zero, plus one refilled, minus one taken. [[slnc 400]] Ben is not affected. [[slnc 300]] And Redis holds one key for each caller.
"""
rows = { budget = "active ok" }
console = [
    ["THE BUDGET (one bucket per caller, kept in Redis):", "code"],
