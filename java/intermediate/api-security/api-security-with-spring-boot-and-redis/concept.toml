    ["  1000 requests as ana, every other one to server B", "muted"],
    ["  -> 25 + 25 = 50 answered", "muted"],
    ["REDIS STOPS ANSWERING (the container is paused):", "code"],
    ["  GET /accounts/acc-0001 -> 503, no budget, no answer", "muted"],
    ["REDIS ANSWERS AGAIN:", "code"],
    ["  GET /accounts/acc-0001 -> 200", "muted"],
    ["a budget protects the service, not the data:", "amber"],
    ["it does not replace the request or the response model", "amber"],
]

