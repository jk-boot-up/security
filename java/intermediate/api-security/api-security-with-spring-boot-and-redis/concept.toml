title = "How To Use It"
body = ["Explain mass assignment and fix it with a request", "record that fails on unknown fields", "Return only what a caller may see and give every list", "a ceiling", "Write a rate limiter that every server shares", "Decide what the API does when the limiter cannot", "answer"]
narration = "So, how do you use it? [[slnc 400]] Never bind a body to a stored record or return one; use a request record and a response record, set fail-on-unknown-properties, validate values, cap every page, budget every caller in a store shared by every server, and decide in writing what the A P I does when the counter is down."

