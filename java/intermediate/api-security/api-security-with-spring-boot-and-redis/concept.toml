[threatmodel]
scope = """
A Spring Boot bank API called by authenticated customers. It covers what a body may set, what a response may show, how much a caller may ask for and the counter that limits it. It does not cover access to other customers' objects, which belongs to broken-access-control.
"""
assets = [
    "The customers' roles, credit limits and risk scores.",
    "The card numbers and PIN hashes.",
    "The availability of the API.",
]
actors = [
    "A customer with a valid login who sends crafted bodies.",
    "An attacker who scripts requests with a stolen login.",
    "A developer who adds a field to the record.",
]
boundaries = [
    "The caller to the API: the body, the query and the headers are all untrusted.",
    "The API to Redis: a password on the loopback address.",
]
assumptions = [
    "Callers have valid logins; the lesson is about what they can do with one.",
    "Redis is reachable only from the API servers.",
]
out_of_scope = [
    "Reading another customer's account, which has its own project.",
    "Attacks on Redis itself.",
]
tests = [
    "`ApiSpringTest` starts real servers and checks mass assignment, the whole-record response, the unlimited loop, unknown fields, validation, partial updates, the view and the masked card, the page ceiling, the 429 and Retry-After, the refill, the cap, separate callers and the budget per server.",
    "`RedisLimiterTest` uses a real Redis for the shared budget, the exact count under concurrency, the bucket's expiry and the refusal when Redis stops answering.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next module, identity-and-access, moves from limits on what a caller may do to proving who the caller is: tokens, OAuth 2.0 and OpenID Connect.
"""

[[threat]]
id = "T1"
stride = "E"
threat = "A caller sets a field that is not theirs to set"
where = "`NaiveAccountsController.update`"
control = "A request record, fail-on-unknown-properties, and a controller that copies named fields only"
residual = "A field added to the request record without review"

[[threat]]
id = "T2"
stride = "I"
threat = "A response carries fields or records the caller should not see"
where = "`NaiveAccountsController.one`, `list`"
control = "A response record, a masked card, a directory with id and name only"
residual = "A new field added to a view"

[[threat]]
id = "T3"
stride = "D"
threat = "A caller asks for everything, or for ever"
where = "`list`, the whole API"
control = "A page ceiling and a budget per caller"
residual = "A caller who spreads requests over many logins"

[[threat]]
id = "T4"
stride = "D"
threat = "The budget is per server, or the counter is down and the API runs without one"
where = "`LocalRateLimiter`, `RedisRateLimiter`, `RateLimitFilter`"
control = "One atomic script in a store every server shares, and a refusal when it cannot answer"
residual = "A long Redis outage that stops the API"

[poster]
headline = [["API SECURITY", "text"], ["WITH REDIS", "accent"]]
taglines = [["What a caller may set, may see, and may ask for", "gold"]]
before = { code = "{\"role\":\"admin\"} -> 200 role admin", note = "The first version", tag = "BEFORE" }
after = { code = "429 Retry-After: 1", note = "One budget in Redis", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "API Security with Spring Boot and Redis"
narration = "Hello, and welcome. [[slnc 400]] This video explains A P I security with Spring Boot and Redis, in Java. [[slnc 300]] A P I stands for application programming interface: the door an app uses to talk to a server. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] An A P I owes its callers three limits: what they may set, what they may see, and how much they may ask for. [[slnc 300]] In Spring Boot, each limit is a choice you make in code. [[slnc 300]] If you make none, Jackson binds whatever the caller sends, the controller returns whatever it holds, and nobody counts. [[slnc 600]] Think of a bank counter where customers fill in their own credit limit, the clerk hands over the whole file, and the queue never ends. [[slnc 600]] Our example is a bank's A P I, running on Spring Boot, with Redis keeping count."

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["A bank API on Spring Boot:", "  update my profile", "  read accounts", "", "The demo starts the real API in two versions,", "and calls it the way an app would.", "", "Then two servers share one Redis."]
narration = "Here is the scenario. [[slnc 400]] A bank's A P I runs on Spring Boot, and lets a customer update a profile and read accounts. [[slnc 500]] The demo starts the real A P I in two versions, and calls it the way a mobile app would. [[slnc 600]] Then it starts two servers side by side, with one Redis, a fast shared store, keeping count of every caller's requests."

[[scene]]
key = "02-words"
kind = "bullets"
title = "The Words"
body = ["Mass assignment: every key becomes a field", "Request record: the fields a caller may set", "Response record: the fields a caller may see", "Token bucket: a budget that refills over time", "Redis: a fast store every server can share"]
narration = """Before the demos, the words. [[slnc 500]] Mass assignment means copying every key of a request onto a stored record, whatever the key is. [[slnc 500]] A request record names the fields a caller may set, with their limits. [[slnc 500]] A response record names the fields a caller may see. [[slnc 500]] A token bucket is a budget: each request takes a token, and the bucket slowly refills. [[slnc 500]] And Redis is a fast store in memory that every server can share."""

[[scene]]
key = "02-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "02-three-gates"
kind = "figure"
title = "Four checks on one request"
body = "three_gates"
narration = """Let's see the whole idea on one picture. [[slnc 400]] A request travels from the app, through four checks, to the answer. [[slnc 700]] First, Spring Security asks who is calling. [[slnc 300]] With no login, the answer is four oh one. [[slnc 600]] Then a filter asks how much this caller has asked for already, and counts in Redis. [[slnc 300]] With an empty bucket, the answer is four two nine, with a retry after header. [[slnc 600]] Then Jackson and Bean Validation ask what may be set. [[slnc 300]] A field the request record does not name is four hundred, unknown field. [[slnc 600]] Finally, the response record decides what may be seen. [[slnc 300]] The card number leaves the bank as four stars and the last four digits. [[slnc 600]] The first version has none of these, except the login."""

[[scene]]
key = "03-acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "04-costs"
kind = "bullets"
title = "What It Costs"
body = ["Every allowed field is a line in a record", "Validation messages need care", "A page ceiling means clients must page", "Redis is part of every request", "A limit that is too tight refuses real customers"]
narration = "Nothing is free. [[slnc 400]] Here is what the defences cost. [[slnc 500]] Every field a caller may set, or see, is a line you write in a record. [[slnc 500]] Validation messages need care: helpful to the app, but not to an attacker. [[slnc 500]] A ceiling on page size means clients must ask page by page. [[slnc 500]] Redis is now part of every request, so it has to stay up. [[slnc 300]] And a limit that is too tight refuses real customers."

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["@RequestBody on an entity class", "A JSON answer with a password or token field", "A size parameter with no maximum", "A Retry-After header in a client's retry code"]
narration = "You have probably met this already. [[slnc 400]] A request body annotation on an entity class is mass assignment waiting to happen. [[slnc 500]] An answer in J S O N with a password or token field in it is data exposure. [[slnc 500]] A size parameter with no maximum is a list with no end. [[slnc 500]] And a retry after header, read by a client's retry code, is a rate limit doing its job politely."

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Never bind a body to a stored record", "A request record; unknown fields refused", "A response record; never the entity", "A ceiling on every page", "One budget per caller, shared by every server", "Decide what happens when the counter is down"]
narration = "So, how do you use it? [[slnc 400]] Never bind a request body to a stored record, and never return one. [[slnc 500]] Use a request record, refuse unknown fields, and validate every value. [[slnc 500]] Use a response record, and put a ceiling on every page. [[slnc 500]] Give each caller one budget, kept where every server can see it. [[slnc 300]] And decide in advance what the A P I does when the counter cannot answer. [[slnc 300]] This one refuses."

[[scene]]
key = "12-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Give the PATCH route", "a smaller budget than the GET routes."]
narration = "That's A P I security with Spring Boot and Redis. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] An A P I names the fields it accepts, names the fields it returns, caps what a caller may ask for, and keeps the count where every server can see it. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Give the patch route a smaller budget than the get routes. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] It is a real Spring Boot application, and the budget lives in a real Redis in a container. [[slnc 300]] Here are the classes that matter."""

[[class]]
name = "NaiveAccountsController"
what = "the first version: the body bound to the stored record"
[[class.part]]
title = "@RequestBody on the entity"
code = """
@PatchMapping("/accounts/me")
Account update(Principal who, @RequestBody Account patch) {
...
if (patch.getRole() != null && !patch.getRole().equals("customer")) {
    mine.setRole(patch.getRole());
...
return mine;
"""
speech = """The first version lets Jackson fill an Account from the body, so any field the caller names is read. [[slnc 300]] Then it copies those fields onto the stored record, the role included, and returns the record itself."""

[[class]]
name = "UpdateProfileRequest"
what = "the request record: two fields and their limits"
[[class.part]]
title = "named fields, Bean Validation"
code = """
record UpdateProfileRequest(
        @Size(min = 1, max = 40) String displayName,
        @Email @Size(max = 80) String email) {
"""
speech = """The request record names the only two fields a customer may change, each with its limits. [[slnc 300]] A setting in the properties file makes Jackson refuse any other field, so the body never reaches the controller."""

[[class]]
name = "AccountView"
what = "the response record: five fields, the card masked"
[[class.part]]
title = "what the app may see"
code = """
record AccountView(String id, String displayName, String email,
                   long balanceCents, String cardLast4) {
...
String masked = "****" + card.substring(card.length() - 4);
"""
speech = """The response record has five fields. [[slnc 300]] The card number is masked before it ever leaves the server. [[slnc 300]] A field added to the database later does not appear here by accident."""

[[class]]
name = "SafeAccountsController"
what = "the fixed controller: records in and out, a page ceiling"
[[class.part]]
title = "validate, and cap the page"
code = """
AccountView update(Principal who, @Valid @RequestBody UpdateProfileRequest request) {
...
List<DirectoryEntry> list(@RequestParam(defaultValue = "20") @Min(1) int size) {
    return bank.all().stream()
            .limit(Math.min(size, maxPage))
            .map(a -> new DirectoryEntry(a.getId(), a.getDisplayName()))
"""
speech = """The fixed controller takes the request record, validated, and returns the response record. [[slnc 300]] The list takes the smaller of the asked size and the ceiling, and returns only ids and names."""

[[class]]
name = "RateLimitFilter"
what = "one token per request, before the controller"
[[class.part]]
title = "429, or 503 when the counter is down"
code = """
verdict = limiter.take(who.getName());
} catch (RuntimeException e) {
    response.sendError(HttpServletResponse.SC_SERVICE_UNAVAILABLE);
...
if (!verdict.allowed()) {
    long seconds = RateLimiter.retryAfterSeconds(verdict.retryAfterMillis());
    response.setHeader("Retry-After", Long.toString(seconds));
    response.sendError(429);
"""
speech = """The filter takes one token for the signed-in caller. [[slnc 300]] If the limiter cannot answer, it refuses with five oh three. [[slnc 300]] If the bucket is empty, it answers four two nine, with the wait in whole seconds."""

[[class]]
name = "RedisRateLimiter"
what = "the bucket in Redis, in one Lua script"
[[class.part]]
title = "refill, take, or say how long"
code = """
tokens = math.min(capacity, tokens + math.max(0, now - at) * perMilli)
...
if tokens >= 1 then
  tokens = tokens - 1
  allowed = 1
else
  wait = math.ceil((1 - tokens) / perMilli)
end
redis.call('HSET', KEYS[1], 'tokens', tostring(tokens), 'at', tostring(now))
"""
speech = """The bucket is a small Lua script that Redis runs as one step. [[slnc 300]] It refills for the time that has passed, takes a token if there is one, or works out the wait. [[slnc 300]] Then it writes the bucket back, so every server sees the same count."""

[[acronym]]
short = "API"
long = "Application Programming Interface: the calls an app makes to a server"
say = "A P I is application programming interface: the set of calls an app can make to a server."
[[acronym]]
short = "JSON"
long = "JavaScript Object Notation: text like {\"role\":\"admin\"}"
say = "J S O N is JavaScript object notation: the text format of keys and values that the app sends."
[[acronym]]
short = "HTTP"
long = "Hypertext Transfer Protocol: GET reads, PATCH changes part of a record"
say = "H T T P is the hypertext transfer protocol. A get request reads. A patch request changes part of a record."
[[acronym]]
short = "200, 400, 401, 429, 503"
long = "status codes: OK; bad request; no login; too many; unavailable"
say = "Two hundred means O K. Four hundred, bad request. Four oh one, not logged in. Four two nine, too many requests. Five oh three, service unavailable."
[[acronym]]
short = "PIN"
long = "Personal Identification Number: the card's secret code"
say = "PIN is personal identification number: the secret code of a bank card."
[[acronym]]
short = "OWASP"
long = "Open Worldwide Application Security Project"
say = "OWASP is the open worldwide application security project, which keeps lists of the most common flaws."
[[acronym]]
short = "Lua"
long = "a small scripting language that Redis runs as one atomic step"
say = "Lua is a small scripting language. Redis runs a Lua script as one step, with no other request in between."

