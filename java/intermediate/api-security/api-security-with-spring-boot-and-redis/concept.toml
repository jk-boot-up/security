[[act]]
title = "The bill"
summary = "Two servers with a budget each in memory answer 50 + 50 = 100 of 1000 requests, twice the budget; with one budget in Redis, 25 + 25 = 50; when Redis stops answering the API refuses with 503, and answers again when Redis is back."
detail = """
Two servers with a budget each in their own memory answer 50 + 50 = 100 of 1000 requests that alternate between them: each server's budget is a budget per server, not per caller. With the budget in Redis, the same 1000 requests get 25 + 25 = 50.
Redis is now part of every request. When its container is paused, the API refuses with 503 rather than run with no budget; when Redis answers again, so does the API. A budget protects the service, not the data: it does not replace the request or the response model.
"""
figure = "shared_budget"
figure_title = "One budget for every server"
figure_speech = """
Fifth demo: the bill. [[slnc 400]] On the left, two servers, each with a bucket of fifty in its own memory. [[slnc 300]] A thousand requests alternate between them. [[slnc 300]] Each server answers fifty: one hundred in all, twice the budget. [[slnc 300]] With ten servers it would be ten times. [[slnc 700]]
On the right, the same two servers share one bucket in Redis. [[slnc 300]] Twenty five on each: fifty in all, exactly the budget. [[slnc 700]]
The price is that Redis is part of every request. [[slnc 300]] When it stops answering, the A P I refuses with five oh three, service unavailable, rather than run without a budget. [[slnc 300]] When Redis is back, so is the A P I.
"""
speech = """
Here is the output. [[slnc 400]] Two servers with their own budgets: fifty plus fifty, one hundred answered. [[slnc 400]] One budget in Redis: twenty five plus twenty five, fifty. [[slnc 400]] Redis paused: five oh three. [[slnc 300]] Redis back: two hundred. [[slnc 400]] A budget protects the service, not the data.
"""
rows = { bill = "active ok" }
console = [
    ["TWO SERVERS, A BUDGET IN EACH ONE'S MEMORY:", "code"],
