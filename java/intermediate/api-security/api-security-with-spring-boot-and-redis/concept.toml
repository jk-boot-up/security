# concept.toml: everything about this project that is not Java code.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "api-security-with-spring-boot-and-redis"
level = "intermediate"
module = "api-security"
title = "API Security with Spring Boot and Redis"
short_title = "API Security with Redis"
package = "apispring"
main_class = "ApiSpringDemo"
tagline = "Bind a body to the stored record and a caller sets their own role; return the record and they read everyone's; count nothing and they never stop"
bold = "A Spring Boot API owes its callers three limits: Jackson binds whatever the body names unless a request record, FAIL_ON_UNKNOWN_PROPERTIES and Bean Validation say otherwise, a controller returns whatever object it is given unless a response record says what a caller may see and a page has a ceiling, and a rate limiter that lives in one server's memory gives a caller one budget per server, so the count belongs in Redis, kept in one atomic script."
domain = "a bank API"
domain_note = ""
youtube_description = "API security with Spring Boot 4.1 and Redis, from the OWASP API Top 10: a bank API that binds the request body to the stored account so a customer promotes themselves to admin, returns the whole record and every customer on a huge page, and answers a thousand requests in a loop; then request records with Bean Validation and unknown fields refused, response records and a page ceiling, and a token bucket in Redis written as one Lua script that gives one budget to every server, refuses with 429 and a Retry-After, and fails closed when Redis stops answering."
thumb_lines = ["API SECURITY", "WITH REDIS"]
thumb_code = "@RequestBody Account patch"
youtube_title = "API Security with Spring Boot: Mass Assignment, Response Models and a Redis Rate Limiter"
youtube_tags = ["api security", "mass assignment", "bean validation", "rate limiting", "redis", "lua", "spring boot", "owasp api top 10", "java"]

[readme]
intro = """
The plain [api-security](../api-security) project builds the three limits from scratch. This one uses what a real Spring Boot bank has: **Spring Boot 4.1**, **Jackson 3**, **Bean Validation**, **Spring Security 7**, and a real **Redis 8** in Docker for the budget. It needs Docker for the Redis parts; its tests are tagged `integration` for those: `./gradlew integrationTest`.

What it shows:
- **The first version.** `@RequestBody Account patch` binds every field the caller sends, so `{"role":"admin","creditLimitCents":100000000}` makes Ana an admin with a huge credit limit. The controller returns the stored record with nine fields including the full card number and the PIN hash, a page size of 1,000,000 returns all 300 customers, and 1,000 requests in a loop are all answered.
- **A request model.** An `UpdateProfileRequest` record names the two fields a customer may change, with limits (`@Size`, `@Email`). `spring.jackson.deserialization.fail-on-unknown-properties=true` turns any other field into a **400 `unknown field`**, and nothing is applied from a refused body.
- **A response model and a ceiling.** `AccountView` returns five fields with the card as `****0001`; the directory returns id and name only; a page is capped at 50 and `size=0` is refused.
- **A budget in Redis.** A token bucket per signed-in caller, written as one **Lua script** so taking a token is atomic: 50 answered, then **429 with `Retry-After`**, a refill from the clock, and a separate bucket for each caller.
- **The bill.** Two servers with in-memory budgets answer **100** of 1,000 requests; with the budget in Redis, **50**. When Redis stops answering the API refuses with 503.

**Maps to:** OWASP API Security Top 10 (2023) API3 Broken Object Property Level Authorization, API4 Unrestricted Resource Consumption, API6 Unrestricted Access to Sensitive Business Flows · CWE-915 (mass assignment) · CWE-213 · CWE-770 · OWASP ASVS 5.0 V4 (API and Web Service).
"""
analogy = """
A bank counter with a form that has every field on it, including the ones marked "staff only", and a clerk who types in whatever the customer wrote, reads out the whole file in reply, and never closes the queue. The fixes are a shorter form, a shorter reply, and a ticket machine that every counter in the bank shares.
"""
scenario = """
A bank API on Spring Boot lets a customer update a profile and read accounts. The demo starts the real application in two versions, calls it as an app would, and then starts two servers against one Redis to share a budget.
"""
costs = [
    "**Every field is a line in a record,** so adding a field to the API is a visible change, which is the point and a little more work.",
    "**Validation messages need care:** short and fixed, so they say what was wrong and never what the server is.",
    "**A page ceiling means clients must page,** and some will complain.",
    "**Redis is in every request,** so its latency is the API's latency, and its failure is the API's failure.",
    "**A limit that is too tight refuses real customers,** and one that is too loose protects nothing: the numbers need watching.",
]
too_much = """
An internal API with one trusted caller does not need a Redis budget, but it still needs the request and response records. A public API with many servers needs all of it, and a gateway in front of it may already hold the budget.
"""
met_before = [
    "`@RequestBody` on an entity or a JPA class.",
    "A response that includes `password`, `ssn` or a token field.",
    "`?size=1000000` in a pen test report.",
    "`429 Too Many Requests` and a `Retry-After` header.",
]
where = """
This is the tools version of [api-security](../api-security), in the [api-security](..) module. It follows the same story and the same three limits, on a real framework, with the budget moved into Redis.
"""
twin = """
The bank is a real Spring Boot application with Spring Security, and the budget is a real Redis in a container bound to 127.0.0.1 on a free port, protected by a password and removed at the end. The limiter takes its time from a clock the demo can move, so a thousand requests happen at one moment and a refill takes no time to wait for. Only statuses, field names and counts are printed.
"""
test_note = "Most tests run without Docker with the budget in memory; the tests of the Redis budget and the full demo start a real Redis and are tagged integration (./gradlew integrationTest). Nothing printed changes between runs."

[[act]]
title = "The first version"
summary = "Binding the body to the stored record lets a customer become an admin, the response is the whole record, a page size of a million returns every customer, and a thousand requests are all answered."
detail = """
The PATCH of displayName works, with role customer and a credit limit of 50000. Whatever the caller sends becomes a field: a body with role admin and a credit limit of 100000000 is applied and the answer has role admin. The record comes back whole, with nine fields including the card number and the PIN hash. A page size of 1000000 returns 300 accounts, every field. A thousand requests in a loop are all answered, none slowed down.
"""
speech = """
First demo: the first version of the A P I. [[slnc 400]] Update my profile works. [[slnc 600]]
Whatever the caller sends becomes a field. [[slnc 300]] Ana sends role admin and a huge credit limit, and the bank applies both. [[slnc 600]]
The answer is the whole record, with the card number and the pin hash. [[slnc 600]]
A page size of a million returns every customer. [[slnc 300]] And a thousand requests in a loop are all answered.
"""
rows = { first = "active wrong" }
console = [
    ["PATCH role, creditLimit -> 200, role=admin, creditLimitCents=100000000", "bad"],
    ["GET /accounts/acc-0001 -> nine fields, with cardNumber and pinHash", "bad"],
    ["GET /accounts?size=1000000 -> 300 accounts, every field", "bad"],
    ["1000 requests in a loop -> 1000 answered", "bad"],
]

[[act]]
title = "A request model"
summary = "A record names the two fields a customer may change, unknown fields are a 400, values are validated, and nothing is applied from a refused body."
detail = """
An UpdateProfileRequest record names displayName and email. The same displayName update returns the five-field view. The body with role and creditLimitCents gets 400 unknown field, and afterwards the role is customer and the credit limit 50000. An email that is not an email, a name of 41 letters and an empty name are each a 400 with the field named, and a body that is not JSON is a 400 unreadable body.
"""
speech = """
Second demo: a request model. [[slnc 400]] A record names the two fields a customer may change. [[slnc 600]]
A body with any other field is refused with four hundred, unknown field. [[slnc 300]] The role stays customer. [[slnc 600]]
A bad email, a name that is too long, and an empty name are each refused, with the field named.
"""
rows = { request = "active ok" }
console = [
    ["PATCH role, creditLimit -> 400 unknown field", "ok"],
    ["role afterwards -> customer, credit limit 50000", "ok"],
    ["PATCH email not an email -> 400 invalid email", "ok"],
    ["PATCH body is not JSON -> 400 unreadable body", "ok"],
]

[[act]]
title = "A response model and a page ceiling"
summary = "A response record has five fields and a masked card, the directory shows id and name only, a page is capped at 50, and size 0 and no login are refused."
detail = """
GET /accounts/acc-0001 returns id, displayName, email, balanceCents and cardLast4, with the card as ****0001: no role, no limit, no risk score, no PIN hash. GET /accounts?size=1000000 returns 50 accounts with id and displayName only. A size of 0 is a 400 invalid parameter, and a request with no login is a 401.
"""
speech = """
Third demo: a response model and a page ceiling. [[slnc 400]] The account comes back with five fields, and the card is masked. [[slnc 600]]
The directory shows an id and a name, nothing else. [[slnc 600]]
A page size of a million returns fifty. [[slnc 300]] A size of zero is refused. [[slnc 300]] And no login means no answer.
"""
rows = { response = "active ok" }
console = [
    ["GET /accounts/acc-0001 -> five fields, card ****0001", "ok"],
    ["GET /accounts?size=1000000 -> 50 accounts, id and name only", "ok"],
    ["GET /accounts?size=0 -> 400 invalid parameter", "ok"],
    ["GET /accounts, no login -> 401", "ok"],
]

[[act]]
title = "The budget runs out, and refills"
summary = "A token bucket per caller in Redis, taken by one Lua script: 50 answered, then 429 with Retry-After 1s, a refill from the clock, and a separate bucket for each caller."
detail = """
Each signed-in caller has a bucket of 50 tokens that refills at one a second. A thousand requests in a loop get 50 answered, then 429 with Retry-After 1s. After the clock moves on by one second, one more request is answered. Ben, meanwhile, gets his own full bucket and a page of 5 accounts. The buckets are the keys rate:ana and rate:ben in Redis, and the script that takes a token runs in one step so two servers cannot take the same one.
"""
speech = """
Fourth demo: the budget runs out, and refills. [[slnc 400]] Each caller has a bucket of fifty tokens in Redis. [[slnc 600]]
A thousand requests in a loop get fifty answers, and then four twenty nine, with a retry after of one second. [[slnc 600]]
When the time passes, a request is answered again. [[slnc 600]]
And another customer has a bucket of their own.
"""
rows = { budget = "active ok" }
console = [
    ["1000 requests in a loop -> 50 answered, then 429 Retry-After 1s", "ok"],
    ["after waiting 1 second -> 200", "ok"],
    ["another customer meanwhile -> 200", "ok"],
    ["buckets in Redis: rate:ana, rate:ben", "ok"],
]

[[act]]
title = "The bill"
summary = "Two servers with in-memory budgets answer 100 of 1000 requests, with the budget in Redis 50; when Redis stops answering the API refuses with 503."
detail = """
Two servers, each with its own budget in memory: of 1000 requests alternating between them, 100 are answered, a budget per server and not per caller. With the budget in Redis, 50 are answered. When Redis stops answering, the API refuses with 503 rather than run without a budget, and answers again when Redis does. A budget protects the service and the other callers, not the data: it does not replace the request model or the response model.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] Two servers with their own budgets in memory answer a hundred of a thousand requests. [[slnc 300]] That is a budget per server, not per caller. [[slnc 600]]
With the budget in Redis, fifty. [[slnc 600]]
When Redis stops answering, the A P I refuses. [[slnc 300]] An A P I that cannot count does not guess. [[slnc 600]]
And a budget never replaces the request and response models.
"""
rows = { bill = "active ok" }
console = [
    ["two servers, local budget -> 100 of 1000 answered", "bad"],
    ["two servers, Redis budget -> 50 of 1000 answered", "ok"],
    ["Redis stops answering -> 503, the API refuses", "ok"],
    ["Redis answers again -> 200", "ok"],
]

