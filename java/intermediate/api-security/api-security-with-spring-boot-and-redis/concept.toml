[docs.session]
objectives = [
    "explain mass assignment and fix it with a request record that fails on unknown fields",
    "return only what a caller may see and give every list a ceiling",
    "write a rate limiter that every server shares",
    "decide what the API does when the limiter cannot answer",
]
walkthrough = """
Run act one and find the field you would least like a customer to set. In act four ask why the script takes the time as an argument. In act five ask what a refused request costs the customer, and what an unbounded one costs the bank.
"""
exercises = [
    "Add a fourth field, phone, to the request record with a pattern, and test good and bad numbers.",
    "Give the PATCH route a smaller budget than the GET routes.",
    "Make the limiter fail open for reads and closed for writes, and test both.",
    "Add a per-IP bucket for callers who are not signed in.",
]

[docs.explained]
sentence = """
An API names the fields it accepts, names the fields it returns, caps what a caller may ask for, and keeps the count of requests where every server can see it.
"""
verdict = """
Never bind a body to a stored record or return one; use a request record and a response record, set fail-on-unknown-properties, validate values, cap every page, budget every caller in a store shared by every server, and decide in writing what the API does when the counter is down.
"""
recognise = [
    "`@RequestBody` on an entity class.",
    "A JSON response with a `password` or `token` field.",
    "A `size` parameter with no maximum.",
    "A `Retry-After` header in a client's retry code.",
]

[spec]
purpose = """
Teach three API limits in Spring Boot: what a caller may set, what they may see, and how much they may ask for.
"""
nongoals = [
    "A full API gateway.",
    "Object-level authorization across accounts, which has its own projects.",
    "Distributed rate limiting across data centres.",
]
problem = """
Teams bind bodies to entities, return entities, and rate-limit in one server's memory, and each of the three gives an attacker something.
"""
roles = [["Controllers", "`NaiveAccountsController`, `SafeAccountsController`"], ["Models", "`Account`, `UpdateProfileRequest`, `AccountView`, `DirectoryEntry`"], ["Errors", "`ErrorHandling`"], ["The budget", "`RateLimiter`, `RedisRateLimiter`, `LocalRateLimiter`, `RateLimitFilter`, `ManualClock`"], ["Test support", "`RedisLab`, `Client`, `Running`"], ["Entry point", "`ApiSpringDemo`"]]
requirements = [
    "The first version applies any field a body names and returns the whole record.",
    "The second version refuses unknown fields and invalid values with a short fixed answer.",
    "The second version returns only the fields of a view and masks the card.",
    "A page is capped, and a size below one is refused.",
    "Each signed-in caller has a bucket that refills with the clock.",
    "Servers sharing a Redis share one budget, and taking a token is atomic.",
    "The API refuses with 503 when the limiter cannot answer.",
    "The demo prints the same output on every run.",
]

