    "Make the allow-list come from a property and fail startup if it contains a star.",
]

[docs.explained]
sentence = """
CORS decides which pages may read an answer from the browser, and Spring Boot enforces the list you give it, so the list must be exact and registered before the login check.
"""
verdict = """
Use an exact list of origins for anything with credentials, never reflect an origin or list null, write patterns that cannot match a lookalike, register the policy in Spring Security so the preflight is answered, send Vary: Origin, and keep logins and tokens for the callers CORS cannot see.
"""
recognise = [
    "`allowedOriginPatterns(\"*\")` next to `allowCredentials(true)`.",
    "`@CrossOrigin` with no arguments.",
    "A preflight that returns 401 or 403.",
    "A wildcard on an endpoint that also takes a cookie.",
]

[spec]
purpose = """
Teach CORS in Spring Boot: the browser's rules, Spring's CorsConfiguration, and where the policy is registered.
"""
nongoals = [
    "A real browser or a front-end framework.",
    "Cross-site request forgery tokens, which have their own projects.",
    "Authentication design beyond what the demo needs.",
]
problem = """
Teams silence a CORS error by reflecting the origin or allowing every pattern, and give every site on the web the right to read their customers' data.
"""
roles = [["The bank", "`BankController`, `Processed`"], ["The policy", "`CorsSettings`"], ["Security and registration", "`BankSecurity`"], ["The browser stand-in", "`Browser`, `FetchResult`"], ["Entry point", "`CorsSpringDemo`"]]
requirements = [
    "With no policy a page can send a simple request but cannot read the answer.",
    "A wildcard with credentials is refused by Spring.",
    "A reflecting pattern, a null entry and a pattern without a dot each give a lookalike access.",
    "An exact list lets only the listed origin read, and Spring refuses the rest before the controller.",
    "The preflight is answered only if the policy is registered in Spring Security.",
    "A request with no Origin header is not affected by the policy.",
    "The demo prints the same output on every run.",
]

