[threatmodel]
scope = """
A bank API on Spring Boot called from browsers on other origins. It covers who may read a response, how the policy is built and where it is registered. It does not cover forged requests, which are the subject of the CSRF projects, or non-browser callers.
"""
assets = [
    "The customer's account data in the response.",
    "The customer's credentials, which the browser attaches.",
]
actors = [
    "A customer using a partner's page.",
    "An attacker who controls a page on another origin.",
    "A developer who changes the policy.",
]
boundaries = [
    "Origin to origin: the browser's same-origin rule.",
    "The preflight to the login check: the preflight carries no credentials.",
]
assumptions = [
    "The browser enforces the CORS rules.",
    "Customers visit pages that the attacker controls.",
]
out_of_scope = [
    "Callers that are not browsers.",
    "Forged requests, covered by the CSRF projects.",
]
tests = [
    "`CorsSpringTest` starts a real bank per policy and checks no policy, the star with credentials, a reflecting pattern, null, the lookalike pattern, the exact list, Spring's 403, `Vary`, public rates, the two registration places, the preflight and a caller with no `Origin` header.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next project in this module, api-security-with-spring-boot-and-redis, moves from which pages may read the answer to how often anyone may ask: validation, response shaping and a Redis-backed rate limiter.
"""

[[threat]]
id = "T1"
stride = "I"
threat = "A page on another origin reads the customer's data"
where = "`CorsSettings.accounts`"
control = "An exact list of origins, no reflection, no null, a pattern with a dot, and a test for each"
residual = "A listed partner whose own site is compromised"

[[threat]]
id = "T2"
stride = "T"
threat = "A simple cross-site request changes state"
where = "`BankController.transferSimple`"
control = "A login and a token on every state-changing route; the policy does not stop it"
residual = "Callers that send no Origin header"

[[threat]]
id = "T3"
stride = "D"
threat = "A legitimate partner's request is refused because the preflight meets the login check"
where = "`BankSecurity.chain`"
control = "Register the policy with http.cors() so the preflight is answered first"
residual = "A second filter that sits ahead of the CORS filter"

[[threat]]
id = "T4"
stride = "I"
threat = "A cache serves one origin's answer to another"
where = "`/account` responses"
control = "Vary: Origin on every response that depends on the origin"
residual = "A cache that ignores Vary"

[poster]
headline = [["CORS WITH", "text"], ["SPRING BOOT", "accent"]]
taglines = [["Spring's CORS answers 403 before your code runs, refuses a wildcard with credentials, and ", "gold"]]
before = { code = "allowedOriginPatterns [*]", note = "Every origin reads", tag = "BEFORE" }
after = { code = "allowedOrigins [https://partner.example]", note = "An exact list, in http.cors", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "CORS with Spring Boot"
narration = "Hello, and welcome. [[slnc 400]] This video explains CORS with Spring Boot, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A browser lets a page on any site send many requests to your A P I, but lets it read the answer only if your A P I names that page's origin. [[slnc 300]] Spring Boot names origins with a CORS configuration. [[slnc 300]] It enforces the list well, so the mistakes are in the list itself, and in where you register it. [[slnc 600]] Think of a guest list at a bank's private event. [[slnc 300]] The doorman is strict, but a list that says anyone, or a name that a stranger can copy, lets the stranger in. [[slnc 600]] Our example is a bank's A P I, on Spring Boot."

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["A bank API on Spring Boot:", "  /account needs a login", "  /transfer moves money", "  /rates is public", "", "The demo starts the real bank several times,", "once for each CORS policy.", "A browser stand-in calls it as pages", "from different sites would."]
narration = "Here is the scenario. [[slnc 400]] A bank's A P I runs on Spring Boot. [[slnc 300]] Its account route needs a login, its transfer route moves money, and its rates route is public. [[slnc 500]] The browser attaches the customer's login itself, so it counts as credentials, just like a cookie. [[slnc 500]] The demo starts the real bank several times, once for each CORS policy, and a browser stand-in calls it over real H T T P, as pages from different sites would."

[[scene]]
key = "02-words"
kind = "bullets"
title = "The Words"
body = ["Origin: scheme + host + port of a page", "Simple request: sent without asking first", "Preflight: an OPTIONS request that asks first", "Credentials: the login the browser attaches", "CorsConfiguration: Spring's CORS policy", "http.cors: the policy inside Spring Security"]
narration = """Before the demos, the words. [[slnc 500]] An origin is the scheme, the host and the port of a page's address. [[slnc 500]] A simple request is one the browser sends without asking first. [[slnc 500]] A preflight is an options request the browser sends first, to ask whether the real request is allowed. [[slnc 500]] Credentials are the login or cookie the browser attaches by itself. [[slnc 500]] Cors configuration is the Spring class that holds a policy. [[slnc 500]] And http dot cors registers that policy inside Spring Security."""

[[scene]]
key = "02-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "02-filter-order"
kind = "figure"
title = "Where Spring checks CORS, and where it refuses"
body = "filter_order"
narration = """Let's see the whole idea on one picture. [[slnc 400]] Every request to the bank passes four stops, in order. [[slnc 300]] In Spring Security: the cors filter, then the login check. [[slnc 300]] In Spring M V C: the cors mapping, then the controller, which is the bank's own code. [[slnc 700]] A page that is not on the list is stopped at the first stop, with four oh three. [[slnc 300]] The controller never runs. [[slnc 700]] A preflight never carries a login. [[slnc 300]] If the policy sits in M V C, the login check refuses the preflight with four oh one, before the policy is ever asked. [[slnc 700]] If the policy sits in Spring Security, the cors filter answers it with two hundred. [[slnc 300]] So where you register the policy matters as much as what it says."""

[[scene]]
key = "03-acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "04-costs"
kind = "bullets"
title = "What It Costs"
body = ["An exact list needs upkeep", "A preflight adds a round trip", "Credentials need exact origins", "Two places to register a policy", "No help against callers that are not browsers"]
narration = "Nothing is free. [[slnc 400]] Here is what it costs. [[slnc 500]] An exact list needs upkeep whenever a partner changes its sites. [[slnc 500]] A preflight adds a round trip before every request that is not simple. [[slnc 500]] With credentials, Spring needs exact origins, so no easy wildcard. [[slnc 500]] Spring has two places to register a policy, and only one of them sees the preflight before the login check. [[slnc 300]] And CORS does nothing about callers that are not browsers."

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["@CrossOrigin with no arguments", "allowedOriginPatterns(\"*\") with credentials", "A preflight answered with 401 or 403", "A wildcard on a route that takes a login"]
narration = "You have probably met this already. [[slnc 400]] A cross origin annotation with no arguments allows every origin. [[slnc 500]] An allowed origin pattern of star, with credentials, reflects every origin, as the second demo shows. [[slnc 500]] A preflight answered with four oh one or four oh three is usually a policy registered after the login check. [[slnc 500]] And a wildcard on a route that takes a login is either refused, or quietly replaced by a reflection."

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "How To Use It"
body = ["An exact list for anything with credentials", "Never reflect; never list null", "Patterns that cannot match a lookalike", "Register CORS in Spring Security", "Vary: Origin on every answer", "Logins and tokens for every other caller"]
narration = "So, how do you use it? [[slnc 400]] Use an exact list of origins for anything that takes credentials. [[slnc 300]] Never reflect an origin, and never list null. [[slnc 500]] If you need a pattern, write one that cannot match a lookalike name. [[slnc 500]] Register the policy with Spring Security, so the preflight is answered before the login check. [[slnc 300]] Send vary origin. [[slnc 500]] And keep logins and tokens for the callers that CORS never sees."

[[scene]]
key = "12-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a second partner and a test", "for it, its lookalike and its null origin."]
narration = "That's CORS with Spring Boot. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] CORS decides which pages may read an answer in the browser, and Spring Boot enforces the list you give it, so the list must be exact and registered before the login check. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a second partner, and a test for it, its lookalike, and its null origin. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] The bank is a real Spring Boot application, and a small browser stand-in calls it over real H T T P. [[slnc 300]] Here are the classes that matter."""

[[class]]
name = "CorsSettings"
what = "one Spring CorsConfiguration for each policy in the demos"
[[class.part]]
title = "the unsafe policies, and the exact list"
code = """
case "reflect" -> c.setAllowedOriginPatterns(List.of("*"));
case "exact-and-null" ->
        c.setAllowedOrigins(List.of(PARTNER, "null"));
case "suffix" ->
        c.setAllowedOriginPatterns(List.of("https://*bank.example"));
case "exact" -> c.setAllowedOrigins(List.of(PARTNER));
...
c.setAllowedMethods(List.of("GET", "POST", "PUT"));
c.setAllowedHeaders(List.of("Content-Type"));
c.setAllowCredentials(true);
c.setMaxAge(600L);
"""
speech = """Each policy is one Spring cors configuration. [[slnc 300]] An origin pattern of star reflects, null lets sandboxed frames in, and the star in the pattern matches a look-alike. [[slnc 300]] The exact list names one partner, with only the methods and header it needs."""

[[class]]
name = "BankSecurity"
what = "the login, and the two places a policy can be registered"
[[class.part]]
title = "http.cors, or addCorsMappings"
code = """
if (cors.inSecurity()) {
    http.cors(c -> c.configurationSource(cors.source()));
}
...
if (cors.inMvc()) {
    registry.addMapping("/rates").combine(cors.publicData());
    registry.addMapping("/**").combine(cors.accounts());
}
"""
speech = """The same policy can be registered in two places. [[slnc 300]] With http dot cors, it runs inside Spring Security, before the login check. [[slnc 300]] With add cors mappings, it runs in Spring M V C, after the login check, where a preflight never arrives."""

[[class]]
name = "Browser"
what = "a stand-in for the browser's rules, over real HTTP"
[[class.part]]
title = "simple requests, and the read check"
code = """
return SIMPLE_METHODS.contains(method)
        && (contentType == null || SIMPLE_TYPES.contains(contentType));
...
if (withCredentials) { // "*" is refused with credentials
    return allow.equals(pageOrigin)
            && "true".equals(r.header("access-control-allow-credentials"));
}
return allow.equals("*") || allow.equals(pageOrigin);
"""
speech = """The browser stand-in sends a simple request at once, and anything else after a preflight. [[slnc 300]] With credentials, the page may read only when allow origin names it and allow credentials is true. [[slnc 300]] Without credentials, a star is enough."""

[[class]]
name = "BankController"
what = "the bank's code, which logs every call it runs"
[[class.part]]
title = "the log behind every route"
code = """
@PostMapping("/transfer")
String transferSimple() {
    processed.add("POST /transfer");
    return "sent 500 to mallory";
}
"""
speech = """Every route adds itself to the log before it answers. [[slnc 300]] That log is how the demo proves that a request ran, or that Spring stopped it before the controller."""

[[acronym]]
short = "CORS"
long = "Cross-Origin Resource Sharing: how an API lets other origins read"
say = "Cors, C O R S, is cross-origin resource sharing: how an A P I tells the browser which other origins may read its answers."
[[acronym]]
short = "API"
long = "Application Programming Interface: calls a program offers"
say = "A P I is application programming interface: the calls a program offers to other programs."
[[acronym]]
short = "HTTP, HTTPS"
long = "HyperText Transfer Protocol (Secure): how browsers talk to servers"
say = "H T T P is hypertext transfer protocol, how a browser talks to a server. H T T P S is the secure version, over an encrypted connection."
[[acronym]]
short = "MVC"
long = "Model-View-Controller: Spring MVC routes requests to controllers"
say = "M V C is model view controller. Spring M V C is the part of Spring that sends each request to a controller."
[[acronym]]
short = "JSON"
long = "JavaScript Object Notation: a text format for data"
say = "Jay son, J S O N, is JavaScript object notation: a text format for data."
[[acronym]]
short = "CSRF"
long = "Cross-Site Request Forgery: a forged request sent with the victim's login"
say = "C S R F is cross-site request forgery: another site makes the browser send a request, with the victim's login."
