[project]
slug = "cors-with-spring-boot"
level = "intermediate"
module = "api-security"
title = "CORS with Spring Boot"
short_title = "CORS with Spring Boot"
package = "corsspring"
main_class = "CorsSpringDemo"
tagline = "Spring's CORS answers 403 before your code runs, refuses a wildcard with credentials, and still reflects every origin if you ask it to"
bold = "A browser lets any page send many requests to your API but lets it read the answer only if your API names that page's origin; Spring Boot gives a CorsConfiguration for that, and the ways to get it wrong are a reflecting origin pattern, a null origin, a pattern that matches a lookalike, a policy registered after the login check, and treating a browser rule as a defence against callers that are not browsers."
domain = "a bank API"
domain_note = ""
youtube_description = "CORS in Spring Boot 4.1 with Spring Security 7: a bank API with no policy where a page can send but not read, the policies that look like fixes (a wildcard with credentials, a reflecting origin pattern, a list that allows null, a pattern that matches a lookalike), an exact allow-list that Spring enforces with a 403 before the controller, the preflight that Spring Security answers only if the policy is registered there, and why CORS is a browser rule and not a defence."
thumb_lines = ["CORS WITH", "SPRING BOOT"]
thumb_code = "allowedOriginPatterns(\"*\")"
youtube_title = "CORS in Spring Boot: Reflecting Origins, null, Lookalikes and the Preflight (OWASP A02)"
youtube_tags = ["cors", "spring boot", "spring security", "preflight", "allowedOriginPatterns", "owasp top 10", "a02", "java", "api security"]

[readme]
intro = """
The plain [cors](../cors) project models the browser's rules and the bank's policy from scratch. This one uses what a real Spring Boot bank has: **Spring Boot 4.1**, **Spring Framework 7** `CorsConfiguration` and **Spring Security 7** `http.cors()`, in real servers on the loopback address. A browser stand-in speaks real HTTP to them and applies the browser's rules to the real headers.

What it shows:
- **No policy.** A page on evil.example can **send** a simple `POST /transfer` that the bank processes, but cannot read the answer. A `PUT` with JSON never reaches the bank because the preflight is refused.
- **Policies that look like fixes.** `allowedOrigins("*")` with credentials is refused by Spring at the first cross-origin request (a 500). The usual way round it, `allowedOriginPatterns("*")`, **reflects every origin**, including evil.example, the lookalike evilbank.example and `null`. An exact list that also lists `null` lets sandboxed frames read. A pattern `https://*bank.example` matches the lookalike, because it has no dot.
- **An exact allow-list.** Only partner.example reads and writes. Spring answers any other origin with **403 `Invalid CORS request` before the controller runs**, sends `Vary: Origin`, and leaves the bank's own page alone.
- **Where the policy is registered.** The same list registered in Spring MVC fails for a JSON `PUT`, because Spring Security asks for a login before MVC sees the **preflight** (401). Registered with `http.cors()` it is answered first (200).
- **The bill.** A wildcard is fine for public data without credentials and is refused with them. A `POST` with no `Origin` header, from a server or a script, still moves money: CORS is a browser rule, not a defence.

**Maps to:** OWASP Top 10 (2025) A02 Security Misconfiguration · CWE-942 (overly permissive cross-domain whitelist) · CWE-346 (origin validation error) · OWASP ASVS 5.0 V3 · MDN's CORS guide.
"""
analogy = """
A bank counter with a guest list at the door. The door staff decide which visitors may carry the answer away, but the clerk behind the counter has already heard every question. The list only helps if its names are exact, and it helps nobody who comes in by the back door.
"""
scenario = """
A bank API on Spring Boot with an account page, a transfer endpoint and public rates. The demo starts the real application several times with different CORS policies, and a browser stand-in calls it as pages on different origins would.
"""
costs = [
    "**An exact list is maintenance.** Every new partner or environment is a change to the list, and each one needs a test.",
    "**Preflights add a round trip,** which `maxAge` softens at the price of slower policy changes.",
    "**Credentials force exact origins,** so the convenience of a wildcard is gone for anything with a login.",
    "**Two places to register a policy** (Spring MVC and Spring Security) means two places to get it wrong.",
    "**CORS says nothing about non-browser callers,** so logins and tokens are still needed.",
]
too_much = """
A public, read-only API with no login can use a wildcard without credentials. Anything that takes a cookie, a token the browser attaches or HTTP authentication needs an exact list, registered where the preflight can reach it.
"""
met_before = [
    "`@CrossOrigin(origins = \"*\")` on a controller.",
    "`allowedOriginPatterns(\"*\")` pasted from a Stack Overflow answer after an \"allowCredentials\" error.",
    "A preflight that fails with 401 while the same call works in curl.",
    "A browser console message: \"has been blocked by CORS policy\".",
]
where = """
This is the tools version of [cors](../cors), in the [api-security](..) module. It follows the same story and the same cast of origins, on a real framework.
"""
twin = """
The bank is a real Spring Boot application with Spring Security, and the browser stand-in is a few lines of Java that apply the browser's CORS rules to real responses. Only statuses, booleans and short messages are printed, never ports, so the demo prints the same text on every run.
"""
test_note = "Each test starts a real bank on a free loopback port and stops it. Nothing is printed that changes between runs."

[[act]]
title = "No policy: a page may send, but not read"
summary = "With no CORS policy, the bank's own page reads the account, evil.example cannot read it, its simple POST still moves money, and its JSON PUT never reaches the bank."
detail = """
The bank's own page reads /account. A page on evil.example reads /account with the customer's credentials: the request reaches the bank and the answer is blocked. It POSTs /transfer as a simple request: it reaches the bank and the bank processes it. Its PUT with JSON needs a preflight, which gets no approval, so it never reaches the bank. The bank processed [GET /account, POST /transfer]: CORS did not stop the POST.
"""
speech = """
First demo: no policy. [[slnc 400]] The bank's own page reads the account with no trouble. [[slnc 600]]
A page on another site sends the same request, and the bank answers, but the browser blocks the page from reading it. [[slnc 600]]
A simple post to the transfer route still reaches the bank, and the bank processes it. [[slnc 600]]
C O R S did not stop the post.
"""
rows = { none = "active wrong" }
console = [
    ["bank's own page reads /account -> readable", "ok"],
    ["evil.example reads /account -> reached the bank, answer blocked", "amber"],
    ["evil.example POSTs /transfer -> reached the bank", "bad"],
    ["evil.example PUTs JSON -> never reached the bank (preflight)", "ok"],
]

[[act]]
title = "Policies that look like fixes"
summary = "A wildcard with credentials is refused by Spring, the usual workaround reflects every origin, a list with null lets sandboxed frames read, and a pattern without a dot matches the lookalike."
detail = """
allowedOrigins("*") with credentials is refused: Spring answers the first cross-origin request with 500 and sends no Allow-Origin header. The workaround allowedOriginPatterns("*") with credentials reflects any origin, so evil.example, evilbank.example and the null origin all read the account. An exact list that also lists null lets the null origin read. A pattern https://*bank.example lets evilbank.example read, because it needs no dot before bank.
"""
speech = """
Second demo: policies that look like fixes. [[slnc 400]] A wildcard with credentials is refused by Spring. [[slnc 600]]
The workaround, an origin pattern of star, reflects every origin, and every page can read the account. [[slnc 600]]
A list that also allows null lets sandboxed frames read. [[slnc 600]]
And a pattern that ends with bank dot example matches the lookalike site too.
"""
rows = { fixes = "active wrong" }
console = [
    ["allowedOrigins(\"*\") with credentials -> 500, no Allow-Origin header", "amber"],
    ["allowedOriginPatterns(\"*\"): evil, evilbank and null all read", "bad"],
    ["exact list plus null: null reads", "bad"],
    ["https://*bank.example: evilbank.example reads", "bad"],
]

[[act]]
title = "An exact allow-list"
summary = "Only partner.example reads and writes; every other origin gets a 403 from Spring before the controller runs; public rates are readable by all; Vary: Origin is sent."
detail = """
With an exact list, partner.example reads /account and PUTs JSON. evil.example, evilbank.example and null are blocked, and none of them reaches the controller, because Spring answers 403 Invalid CORS request first. evil.example reads the public /rates, which carries a wildcard without credentials. The bank's own page PUTs JSON without trouble, and the Vary header on /account is Origin, so caches keep one copy for each origin.
"""
speech = """
Third demo: an exact allow-list. [[slnc 400]] The partner reads the account and sends its J S O N. [[slnc 600]]
Evil dot example, the lookalike, and the null origin are all blocked. [[slnc 300]] Spring answers four oh three before the controller runs. [[slnc 600]]
The public rates are readable by anyone, because they carry no credentials. [[slnc 600]]
And the answer varies by origin, so caches keep one copy for each.
"""
rows = { exact = "active ok" }
console = [
    ["partner.example reads and PUTs JSON -> readable", "ok"],
    ["evil, evilbank and null -> never reached the bank", "ok"],
    ["Spring's own answer: 403 Invalid CORS request", "ok"],
    ["Vary header on /account -> Origin", "ok"],
]

[[act]]
title = "Where the policy is registered"
summary = "The same exact list fails for a JSON PUT when it is registered in Spring MVC, because the preflight meets the login check first (401), and works when it is registered with http.cors() (200)."
detail = """
The exact list is registered first in Spring MVC with addCorsMappings. partner.example's preflight for PUT gets 401, because Spring Security asks for a login before Spring MVC sees the request, and a preflight never carries credentials. The simple GET works, since it needs no preflight, but the JSON PUT never reaches the bank. Registered with http.cors() the preflight is answered by a CORS filter before the login check, gets 200, and the PUT succeeds.
"""
speech = """
Fourth demo: where the policy is registered. [[slnc 400]] The same list in Spring M V C. [[slnc 600]]
The preflight for the J S O N put gets four oh one, because Spring Security asks for a login first, and a preflight never carries credentials. [[slnc 600]]
The same list registered with http dot cors is answered before the login check, and the put succeeds.
"""
rows = { where = "active ok" }
console = [
    ["registered in Spring MVC: preflight for PUT -> 401", "bad"],
    ["registered in Spring MVC: PUT never reached the bank", "bad"],
    ["registered with http.cors(): preflight -> 200", "ok"],
    ["registered with http.cors(): PUT readable", "ok"],
]

[[act]]
title = "The bill"
summary = "A wildcard is fine for public data without credentials and refused with them; a POST with no Origin header still moves money, because CORS is a browser rule and not a defence."
detail = """
The public /rates sends Allow-Origin *. The browser accepts it without credentials and refuses it with credentials. With the exact list in place, evil.example's simple POST is stopped by Spring's 403, but the same POST with no Origin header, from a script on a server, gets 200 and moves the money: only that one request was processed. Every allowed origin needs a test, and so do the lookalike, the null origin and the preflight. A policy decides who may read an answer, and who may act still needs a login and a token.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] A wildcard is fine for public data, without credentials. [[slnc 600]]
With credentials, the browser refuses it. [[slnc 600]]
A post with no origin header, from a script on a server, still moves the money. [[slnc 300]] C O R S is a browser rule, not a defence. [[slnc 600]]
Every allowed origin needs a test, and so do the lookalike, and the null origin.
"""
rows = { bill = "active ok" }
console = [
    ["public /rates sends Allow-Origin *", "ok"],
    ["browser accepts * without credentials: true, with credentials: false", "ok"],
    ["POST with no Origin header -> 200 sent 500 to mallory", "bad"],
]

