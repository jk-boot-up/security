[[act]]
title = "Four policies that look like fixes"
summary = "allowedOrigins * with credentials makes Spring answer 500; allowedOriginPatterns * reflects every origin; a list with null lets the null origin read; the pattern https://*bank.example matches evilbank.example."
detail = """
allowedOrigins [*] with allowCredentials true is refused by Spring: the first cross-origin request gets 500 and no Access-Control-Allow-Origin. The usual workaround, allowedOriginPatterns [*], sends each origin back, so evil.example, evilbank.example and the null origin all get 200 and read the balance.
A list of https://partner.example and null: Spring answers evil.example and evilbank.example with 403, but sends null back to the null origin, which a sandboxed frame has, so it reads the balance.
The pattern https://*bank.example: the * may be any text, so https://evilbank.example matches (CorsConfiguration.checkOrigin says so), while https://partner.example and https://evil.example do not. The look-alike reads the balance.
"""
figure = "bad_policies"
figure_title = "Four policies, three origins, who reads the balance"
figure_speech = """
Second demo: four policies that look like fixes. [[slnc 400]] At the top, policy one: allowed origins star, with credentials. [[slnc 300]] Spring refuses that combination, and answers five hundred, with no allow origin. [[slnc 700]]
Below, three more policies, one per column, and three pages, one per row. [[slnc 300]] Each cell shows the allow origin value Spring sends back, and the status. [[slnc 700]]
Policy two, an origin pattern of star, sends every origin back. [[slnc 300]] Every page reads. [[slnc 600]]
Policy three lists the partner, and null. [[slnc 300]] Null is the origin of a sandboxed frame, which an attacker can make. [[slnc 300]] So the null page reads. [[slnc 600]]
Policy four is a pattern. [[slnc 300]] Its star may be any text, even the word evil. [[slnc 300]] So evil bank dot example matches, and reads.
"""
