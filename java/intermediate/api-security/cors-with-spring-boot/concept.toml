body = ["Explain what CORS lets a page read and what it does", "not stop", "Write an exact CorsConfiguration for a credentialed", "API", "Name the policies that look like fixes and what each", "one gives away", "Register the policy where the preflight can reach it"]
narration = "So, how do you use it? [[slnc 400]] Use an exact list of origins for anything with credentials, never reflect an origin or list null, write patterns that cannot match a lookalike, register the policy in Spring Security so the preflight is answered, send Vary: Origin, and keep logins and tokens for the callers CORS cannot see."

