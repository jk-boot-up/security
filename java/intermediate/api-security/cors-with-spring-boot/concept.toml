[[act]]
title = "CORS is a browser rule, not a defence"
summary = "The public /rates sends *, which the browser accepts without credentials and refuses with them; a POST from evil.example's page never reaches the bank, but the same POST from a server script with no Origin header gets 200 and moves money."
detail = """
The public /rates sends Access-Control-Allow-Origin: *. The browser accepts it for a request without credentials and refuses it for one with credentials.
With the exact list in place, a simple POST /transfer from a page on https://evil.example never reaches the bank. The same POST from a script on a server, which sends no Origin header and is not a browser, gets 200 sent 500 to mallory, and the bank's log shows [POST /transfer].
CORS decides who may read an answer inside a browser. Who may act still needs a login and a CSRF token.
"""
figure = "the_bill"
figure_title = "A browser rule, and a caller with no browser"
figure_speech = """
Fifth demo: cors is a browser rule, not a defence. [[slnc 400]] At the top, the public rates. [[slnc 300]] Spring sends a star. [[slnc 300]] Without credentials, the browser accepts it. [[slnc 300]] With credentials, it refuses it. [[slnc 700]]
Below, the same post to transfer, twice. [[slnc 300]] From a page on evil dot example, Spring refuses it, and it never reaches the bank. [[slnc 600]]
From a script on a server, there is no browser, and no origin header. [[slnc 300]] Spring has nothing to check, the request carries a valid login, and the money moves. [[slnc 700]]
Cors only works inside a browser. [[slnc 300]] Logins and C S R F tokens decide who may act.
"""
