[[act]]
title = "The policy must sit before the login check"
summary = "Registered in Spring MVC, the partner's preflight meets the login check first and gets 401, so its JSON PUT is never sent; registered with http.cors in Spring Security, the preflight gets 200 and the PUT works."
detail = """
A request goes through Spring Security first, where http.cors runs before the login check, and then Spring MVC, where addCorsMappings runs before the controller.
Registered in Spring MVC, the same exact list never sees the preflight: a preflight carries no login, so the login check answers 401. The simple GET works, since it needs no preflight, but the JSON PUT never reaches the bank.
Registered with http.cors, the preflight is answered by the CORS filter before the login check: 200, and the PUT sends 500 to mallory.
"""
figure = "where_registered"
figure_title = "The same list, registered in two places"
figure_speech = """
Fourth demo: the policy must sit before the login check. [[slnc 400]] The same exact list, registered in two places. [[slnc 700]]
On the left, in Spring M V C. [[slnc 300]] A preflight carries no login. [[slnc 300]] So Spring Security's login check refuses it with four oh one, before M V C ever sees it. [[slnc 300]] The partner's get still works, because it is simple. [[slnc 300]] But its put is never sent. [[slnc 700]]
On the right, registered with http dot cors, in Spring Security. [[slnc 300]] The cors filter answers the preflight before the login check. [[slnc 300]] Two hundred, and the put goes through.
"""
speech = """
Here is the output. [[slnc 400]] The order: Spring Security first, then Spring M V C. [[slnc 400]] Registered in M V C: the preflight gets four oh one, and the put never reaches the bank. [[slnc 400]] Registered in Spring Security: two hundred, and the put works. [[slnc 300]] A preflight never carries a login, so it must pass before one.
"""
