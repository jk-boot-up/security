[[scene]]
key = "01-poster"
kind = "poster"
title = "API Security: Mass Assignment, Data Exposure and Resource Limits"
narration = "Hello, and welcome. [[slnc 400]] This video explains three A P I security flaws and their defences, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] An A P I owes its callers three limits. [[slnc 300]] What they may set. [[slnc 300]] What they may see. [[slnc 300]] And how much they may ask for. [[slnc 300]] Leave any one of them to chance, and a customer can promote themselves, read other people's data, or wear the service out. [[slnc 600]] Think of a bank counter where customers fill in their own credit limit, the clerk hands over the whole file, and the queue never ends. [[slnc 600]] Our example is a bank's A P I for its mobile app."

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["A bank API for its mobile app:", "  change my profile", "  show an account", "  list the branch directory", "", "300 accounts, all made up.", "Ownership is checked in every version."]
narration = "Here is the scenario. [[slnc 400]] A bank's mobile app talks to its A P I with three calls: change my profile, show an account, and list the branch directory. [[slnc 500]] The demo runs the calls in plain Java, against three hundred made-up accounts. [[slnc 300]] Every version checks that the account belongs to the caller, so this video is about the three other limits."

[[scene]]
key = "03-acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "04-costs"
kind = "bullets"
title = "What It Costs"
body = ["Explicit models mean more code", "Refusing unknown fields breaks clients", "  that send extras", "Limits need real numbers", "Rate limits need a shared store", "  across servers", "Cost is not only the number of requests"]
narration = "Nothing is free. [[slnc 400]] Here is what the defences cost. [[slnc 500]] A request model and a response model for every call is more code to write. [[slnc 500]] Refusing unknown fields breaks any client that sends extras, even harmless ones. [[slnc 500]] Page caps and budgets need real numbers, chosen from real use. [[slnc 500]] When the A P I runs on several servers, the budgets must live somewhere they all share. [[slnc 300]] And cost is not only the number of requests: a list of a thousand rows costs more than one row."

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["Account, Bank: the data", "NaiveApi: binds and returns everything", "Api: the fixed version", "UpdateProfileRequest: what may be set", "AccountView, DirectoryEntry: what may be seen", "RateLimiter: each caller's budget"]
narration = "Here is who does what in the code. [[slnc 400]] Account and Bank hold the data. [[slnc 500]] NaiveApi is the first version: it copies in every field, and returns everything. [[slnc 300]] Api is the fixed version. [[slnc 500]] UpdateProfileRequest lists the fields a caller may set. [[slnc 300]] AccountView and DirectoryEntry list the fields a caller may see. [[slnc 500]] And RateLimiter gives each caller a bucket of tokens, that refills over time."

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["A controller that returns a database entity", "A page size parameter with no maximum", "An app's network log showing fields", "  the screen never uses", "Findings API3, API4 or API6"]
narration = "You have probably met this already. [[slnc 400]] A controller that returns a database entity straight to the client is the data exposure. [[slnc 500]] A page size parameter with no maximum is the list with no end. [[slnc 500]] An app's network traffic that carries fields the screen never shows is the same leak, seen from the phone. [[slnc 500]] And findings marked A P I three, four, or six in the OWASP A P I list are these flaws, by name."

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "How To Use It"
body = ["A request model for every write;", "  unknown fields refused", "A response model for every read;", "  never return the entity", "A maximum page size", "A budget for every caller", "429 with Retry-After"]
narration = "So, how do you use it? [[slnc 400]] Write a request model for every call that changes something, and refuse any field it does not name. [[slnc 500]] Write a response model for every call that reads something, and never return the database entity itself. [[slnc 500]] Cap the page size. [[slnc 500]] Give every caller a budget, and charge more for expensive calls. [[slnc 300]] And when the budget runs out, answer too many requests, and say when to try again."

