[[act]]
title = "The budget runs out, and refills"
summary = "Ana's read bucket holds 100 tokens; 1 + 50 were used, so of 1000 requests 49 are answered and 951 get 429 with Retry-After: 1, worked out as ceil((1 - 0.00) / 1.67) = 1; one second later she has 1.67 tokens and the call works; user2 has her own bucket."
detail = """
Each caller has a token bucket for reads: it holds 100 tokens and refills 100 a minute, 1.67 a second. One account costs 1 token and a list costs 1 per row, so Ana's earlier calls used 1 + 50 and left her 100 - 1 - 50 = 49.
Of the next 1000 requests, made at the same instant, 49 are answered and 951 get 429 Too Many Requests with `Retry-After: 1`. The wait is the missing token divided by the refill rate, rounded up: ceil((1 - 0.00) / 1.67) = ceil(0.60) = 1 second.
One second later the bucket holds 0.00 + 1.67 = 1.67 tokens, so the call is answered and 0.67 are left. user2 has her own bucket: a list of 5 leaves her 95.
"""
figure = "token_bucket"
figure_title = "A bucket of tokens per caller"
figure_speech = """
Fifth demo: the budget runs out, and refills. [[slnc 400]] Each caller gets a bucket of read tokens. [[slnc 300]] It holds one hundred, and refills one hundred a minute, which is one point six seven a second. [[slnc 300]] One account costs one token. [[slnc 300]] A list costs one token for every row. [[slnc 700]]
The bar shows Ana's bucket. [[slnc 300]] Her earlier calls cost one, and fifty for the page of fifty. [[slnc 300]] One hundred minus one minus fifty leaves forty nine. [[slnc 700]]
Then a thousand requests arrive at once. [[slnc 300]] Forty nine are answered. [[slnc 300]] The other nine hundred and fifty one get four two nine, too many requests, with a retry after header. [[slnc 600]]
How long to wait? [[slnc 300]] One missing token, divided by one point six seven a second, is zero point six. [[slnc 300]] Rounded up, one second. [[slnc 300]] One second later, the bucket has refilled enough, and the call works.
"""
speech = """
Here is the output, in two pages. [[slnc 400]] The budget: one hundred tokens, refilled at one point six seven a second. [[slnc 300]] Ana has forty nine left. [[slnc 400]] Of a thousand requests, forty nine are answered, and nine hundred and fifty one get four two nine.
[[page]]
The retry after value, worked out: one missing token, over one point six seven, rounded up to one second. [[slnc 400]] One second later the call works, with zero point six seven tokens left. [[slnc 400]] And user two has her own bucket, so she is not affected.
"""
rows = { budget = "active ok" }
console = [
    ["THE BUDGET (one bucket of read tokens per caller):", "code"],
    ["  holds 100 tokens, refills 100 a minute = 1.67 a second", "muted"],
    ["  one account costs 1 token; a list costs 1 per row", "muted"],
    ["ANA'S TOKENS BEFORE THE LOOP:", "code"],
    ["  100 - 1 (one account) - 50 (a page of 50) = 49", "muted"],
    ["THE REQUESTS:", "code"],
    ["  1000 x GET /accounts/acc-0001, in a loop", "muted"],
    ["THE RESPONSES:", "code"],
    ["  49 answered with 200", "muted"],
    ["  951 refused with 429, Retry-After: 1", "muted"],
    ["---", ""],
    ["HOW Retry-After IS WORKED OUT:", "code"],
    ["  tokens 0.00, a call costs 1, refill 1.67 a second", "muted"],
    ["  wait = ceil((1 - 0.00) / 1.67) = ceil(0.60) = 1 second", "muted"],
    ["THE REQUEST, 1 SECOND LATER:", "code"],
    ["  GET /accounts/acc-0001", "muted"],
    ["THE RESPONSE:", "code"],
    ["  200; tokens 0.00 + 1.67 = 1.67, minus 1 = 0.67 left", "muted"],
    ["ANOTHER CUSTOMER MEANWHILE (user2, own bucket):", "code"],
    ["  GET /accounts?size=5 -> 200, 5 accounts; 95 tokens left", "muted"],
]

