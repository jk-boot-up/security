# concept.toml: everything about this project that is not Java code.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "api-security"
level = "intermediate"
module = "api-security"
title = "API Security: Mass Assignment, Data Exposure and Resource Limits"
short_title = "API Security"
package = "apisec"
main_class = "ApiSecurityDemo"
tagline = "An API owes its callers three limits: what they may set, what they may see, and how much they may ask for"
bold = "An API that binds every field the caller sends, returns the whole record and answers any request count and size lets a customer promote themselves, read other people's data and exhaust the service, so use explicit request and response models, cap page sizes, and give each caller a budget."
domain = "a bank API"
domain_note = ""
youtube_description = "API security in Java: mass assignment, excessive data exposure, and unrestricted resource consumption, from the OWASP API Security Top 10. A bank's JSON API that copies every field the app sends into the account lets a customer make herself an admin with a huge credit limit; one that returns the whole record sends the card number and PIN hash to the phone; and one that answers any page size, any number of times, hands over every customer and never slows down. Explained with a bank API, like a bank counter where the customer fills in their own credit limit, the clerk passes over the whole file, and the queue has no end. We fix it with explicit request and response models, a cap on page size, and a token bucket for each caller that answers 429 with Retry-After. We finish with the cost: more code, and limits that need real numbers."
thumb_lines = ["API SECURITY", "THREE LIMITS"]
thumb_code = "UpdateProfileRequest.parse(body)"
youtube_title = "API Security in Java: Mass Assignment, Data Exposure and Rate Limits"
youtube_tags = ["api security", "mass assignment", "rate limiting", "owasp api top 10", "java", "application security"]

[readme]
intro = """
A bank's mobile app talks to a JSON API. Three habits make it easy to build and easy to attack:
- **Binding every field** the app sends into the database record (**mass assignment**, API3): a caller adds `"role": "admin"` and it works.
- **Returning the record itself** (**excessive data exposure**, also API3): the response carries the full card number, the PIN hash and the risk score because they are in the entity.
- **Answering anything, any number of times** (**unrestricted resource consumption**, API4): a page size of a million returns every customer, and a loop of requests is never slowed.

The defences, in the order this project shows them:
- **An explicit request model:** a few named fields, with types and lengths, and unknown fields refused.
- **An explicit response model:** the app gets what the app needs, with the card number masked.
- **Caps and budgets:** a maximum page size, and a token bucket for each caller that returns 429 with `Retry-After`.

**Maps to:** OWASP API Security Top 10 (2023) API3 Broken Object Property Level Authorization and API4 Unrestricted Resource Consumption · API6 Unrestricted Access to Sensitive Business Flows · CWE-915 · CWE-213 · CWE-770.
"""
analogy = """
Think of a counter clerk who, to update your address, hands you your whole file and lets you cross out and rewrite anything in it, including the line that says "customer".
The fixed counter has a form with two boxes, shows you a card with the few things you need, and serves a limited number of customers per minute.
"""
scenario = """
A bank API has three calls: change my profile, show an account, and list the branch directory. The demo runs the calls in plain Java against 300 fixed accounts, and measures what each version lets a signed-in customer do.
Ownership of accounts is checked in every version, because that is a different lesson (broken-access-control); this one is about what an owner-or-not caller may set, see and ask for.
"""
costs = [
    "**Explicit models are more code,** and they must be kept in step with the database. Tests that compare the fields of a response with the model catch drift.",
    "**Refusing unknown fields breaks clients that send extras,** which is why older clients need a version, and why a refusal is better than silently ignoring: silence hides bugs and attacks.",
    "**Limits need numbers,** and the numbers come from measuring real use. Too low breaks real apps; too high protects nothing.",
    "**Rate limits live somewhere shared.** With several servers, the buckets must be in a shared store; the with-Redis version shows that.",
    "**Cost is not only request count.** A call that returns a hundred rows costs more than one that returns one, and so the budget charges per row here.",
]
too_much = """
A rate limit in front of every call is not a substitute for authorization, and a response model is not a substitute for deciding which fields a caller may read in the first place.
Do not log full request bodies to detect mass assignment; log the names of refused fields.
"""
met_before = [
    "A `PATCH` that copies a JSON map onto an entity with a mapper or `BeanUtils.copyProperties`.",
    "`return repository.findAll()` and `return entity` in a controller.",
    "A `limit` or `pageSize` parameter with no upper bound.",
    "HTTP 429 and the `Retry-After` header.",
]
where = """
This project is in [api-security](..) and follows the web-security projects. It builds on [broken-access-control](../../web-security/broken-access-control) for ownership,
and prepares the Redis-backed rate limiter in api-security-with-spring-boot-and-redis.
"""
twin = """
There is no HTTP server: the API is a Java interface whose calls take the user and the parsed JSON, which keeps the focus on the rules. The clock is simulated, so the rate limiter's numbers are exact
and the demo prints the same text on every run.
"""
test_note = "Time is simulated and the data is fixed, so the demo prints the same text on every run."

[[act]]
title = "A profile call that works"
summary = "Ana changes her display name and gets her account back."
detail = """
Ana's app sends `{"displayName": "Ana Ruiz"}` and the API answers 200 with the updated account. Nothing looks wrong, but look at what came back: eight fields.
"""
speech = """
First demo: a profile call that works. [[slnc 400]] Ana's app changes her display name. [[slnc 300]] The API answers with the updated account. [[slnc 300]] Look at what came back: eight fields.
"""
rows = { call = "active ok" }
console = [
    ["PATCH displayName -> 200 fields [displayName, email, role, balanceCents, creditLimitCents, riskScore, cardNumber, pinHash]", "amber"],
]

[[act]]
title = "Whatever the caller sends becomes a field"
summary = "Adding role and creditLimitCents to the JSON makes Ana an admin with a limit of a million dollars."
detail = """
The same call with two extra keys, `role` and `creditLimitCents`, copies them onto the account. Ana is now an admin with a credit limit of 100,000,000 cents. The API never decided that these fields were the caller's to change;
it only copied what it was given.
"""
speech = """
Second demo: whatever the caller sends becomes a field. [[slnc 400]] The same call, with two extra keys. [[slnc 300]] Role, and credit limit. [[slnc 600]]
Ana is now an admin with a very large credit limit. [[slnc 300]] The API never decided those fields were hers to change.
"""
rows = { mass = "active wrong" }
console = [
    ["PATCH role, creditLimit -> 200 ... role=admin, creditLimitCents=100000000  <- NOT HERS TO CHANGE", "bad"],
]

[[act]]
title = "The response is the whole record, and a list has no end"
summary = "The account response includes the card number and PIN hash; a page size of a million returns 300 accounts; 1000 requests are all answered."
detail = """
The API returns the account entity: the full card number, the PIN hash, the risk score. Anything stored becomes anything shown. The branch directory takes the page size from the caller, so size=1,000,000 returns
all 300 accounts with every field. A loop of 1000 requests is answered 1000 times without slowing down.
"""
speech = """
Third demo: the response is the whole record, and a list has no end. [[slnc 400]] The account response includes the full card number and the PIN hash. [[slnc 600]]
A page size of a million returns every customer, with every field. [[slnc 300]] And a thousand requests in a loop are all answered.
"""
rows = { expose = "active wrong" }
console = [
    ["GET /accounts/acc-0001 -> 200 ... cardNumber, pinHash, riskScore", "bad"],
    ["GET /accounts?size=1000000 -> 200 300 accounts, every field  <- EVERY CUSTOMER", "bad"],
    ["1000 requests in a loop -> 1000 answered, none slowed down", "bad"],
]

[[act]]
title = "Explicit models, a page cap and a budget"
summary = "Unknown fields are refused with 400 and nothing changes; the response shows five fields with the card masked; a page is capped at 50 and shows only ids and names."
detail = """
The fixed API reads a request into `UpdateProfileRequest` with two named fields, checks their type and length, and refuses anything else with 400 and no change: Ana's role afterwards is still customer. The response is an
`AccountView` with five fields and the card as ****0001. The list is capped at 50 whatever the caller asks for, and shows the directory view: ids and display names, not balances or cards.
"""
speech = """
Fourth demo: explicit models, a page cap and a budget. [[slnc 400]] The request has two named fields, and anything else is refused. [[slnc 300]] The role is still customer. [[slnc 600]]
The response has five fields, with the card masked. [[slnc 300]] The list is capped at fifty, and shows only names.
"""
rows = { models = "active ok", cap = "active ok" }
console = [
    ["PATCH displayName -> 200 fields [id, displayName, email, balanceCents, cardLast4], card ****0001", "ok"],
    ["PATCH role, creditLimit -> 400 unknown field; role afterwards: customer", "ok"],
    ["GET /accounts?size=1000000 -> 200 50 accounts, id and name only", "ok"],
]

[[act]]
title = "The budget runs out, and refills"
summary = "Of 1000 requests in a loop 49 are answered and the rest get 429 with Retry-After 1s; after waiting the call works again, and another customer is not affected."
detail = """
Each caller has a token bucket: a burst of 100 rows, refilled at 100 a minute, and a list costs a token per row. The earlier calls used 51 of them; of the next 1000 requests, 49 are answered, and then the API says 429
with `Retry-After: 1`. After waiting that long the call works again. Another customer has their own bucket and is not affected.
"""
speech = """
Fifth demo: the budget runs out, and refills. [[slnc 400]] Each caller has a bucket of tokens. [[slnc 300]] A list costs a token for every row. [[slnc 600]]
Of a thousand requests, forty-nine are answered, and then the API says too many requests, and tells the app how long to wait. [[slnc 300]] After waiting, the call works. [[slnc 300]] And another customer is not affected.
"""
rows = { budget = "active ok" }
console = [
    ["1000 requests in a loop -> 49 answered, then 429 with Retry-After 1s", "ok"],
    ["after waiting that long -> 200 ...", "ok"],
    ["another customer meanwhile -> 200 5 accounts, id and name only", "ok"],
]

