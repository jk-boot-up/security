[[act]]
title = "Whatever the caller sends becomes a field"
summary = "The same call with role and creditLimitCents added by hand makes Ana an admin with a limit of 100000000 cents, because the API copies every key onto the record."
detail = """
Ana adds two keys by hand: `"role": "admin"` and `"creditLimitCents": 100000000`. Before the call her role is customer and her limit is 50000 cents. The API copies every key it receives onto the record, so after the call
she is an admin with a limit of 100000000 cents, a million dollars. The API never decided which fields were hers to set; it copied what it was given. This is mass assignment.
"""
figure = "mass_assignment"
figure_title = "Two keys added by hand, copied onto the record"
figure_speech = """
Second demo: whatever the caller sends becomes a field. [[slnc 400]] On the left, the request. [[slnc 300]] The same call, but Ana has written it by hand. [[slnc 300]] Next to her display name, she adds two keys: role, admin. [[slnc 300]] And credit limit, one hundred million cents. [[slnc 700]]
On the right, her record. [[slnc 300]] Before the call: role customer, and a limit of fifty thousand cents. [[slnc 300]] After the call: role admin, and a limit of one hundred million cents, a million dollars. [[slnc 700]]
The A P I copied every key it was given onto the record. [[slnc 300]] Nobody ever decided which fields were hers to set. [[slnc 300]] This is called mass assignment.
"""
speech = """
Here is the output. [[slnc 400]] The request, with the two keys added by hand. [[slnc 400]] The record before: customer, and fifty thousand cents. [[slnc 400]] The response: admin, and one hundred million cents. [[slnc 300]] Neither was hers to set.
"""
