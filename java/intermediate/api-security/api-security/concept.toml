title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Charge a transfer more tokens", "than a read, and loop some transfers."]
narration = "That's A P I security. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] An A P I should decide in code which fields a caller may set, which fields it may see, and how much it may ask for, and never leave those choices to whatever the database record happens to hold. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Charge a transfer more tokens than a read, and see what happens to a loop of transfers. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"
