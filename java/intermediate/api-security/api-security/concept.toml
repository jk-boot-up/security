    "Java basics",
    "An idea of what a JSON API and an HTTP status code are",
]
not_required = [
    "A web framework: the API is a Java interface",
    "Redis: that comes in the next project",
]
install = []

[docs.session]
objectives = [
    "explain mass assignment and how an explicit request model stops it",
    "explain excessive data exposure and why a response model is a security control",
    "choose a page cap and say why a list costs more than one row",
    "describe a token bucket, 429 and Retry-After",
]
walkthrough = """
Run act two and ask who decided that "role" was a field the caller could set. In act three, count the fields in the response and ask which the app really uses. In act five, ask what a caller who
sends one request every 0.6 seconds would see.
"""
exercises = [
    "Add a `phone` field to the request model with a pattern, and refuse an unknown country code.",
    "Charge a transfer more tokens than a read, and show the effect on a loop of transfers.",
    "Return a JSON error with the name of the refused field, and decide whether that is safe to show.",
    "Add a maximum request body size and refuse larger bodies with 413.",
]

[docs.explained]
sentence = """
An API should say which fields a caller may set, which fields it may see, and how much it may ask for, in code, and not leave those decisions to whatever the database record happens to contain.
"""
verdict = """
Write a request model for every write, refuse unknown fields, write a response model for every read, never return an entity, cap page sizes, and put a budget on every caller and every expensive or business-sensitive call.
Return 429 with `Retry-After` and keep the numbers in configuration.
"""
recognise = [
    "`BeanUtils.copyProperties(request, entity)` or `objectMapper.readerForUpdating(entity)`.",
    "Controllers that return repository entities.",
    "`@RequestParam int size` with no maximum.",
    "Findings with API3, API4 or API6.",
]

[spec]
purpose = """
Teach three API weaknesses by promoting a customer through extra JSON keys, reading a whole record and all customers, and hammering the API, then fixing each with an explicit model, a cap and a budget.
"""
nongoals = [
    "Object-level authorization (ownership): the broken-access-control project.",
    "A real HTTP server or a shared rate-limit store: the with-Spring-Boot-and-Redis version.",
    "Authentication.",
]
problem = """
Developers let the shape of the database record decide what an API accepts and returns, and let callers decide how much work a request does.
"""
roles = [["The data", "`Account`, `Bank`"], ["The API and its answers", "`Api`, `ApiResponse`, `NaiveApi`, `SafeApi`"], ["Models", "`UpdateProfileRequest`, `AccountView`, `DirectoryEntry`"], ["Limits", "`RateLimiter`, `SimClock`"], ["Entry point", "`ApiSecurityDemo`"]]
requirements = [
    "The naive API sets any field, returns every field and any number of rows, and answers any number of requests.",
    "The safe API refuses unknown or invalid fields with 400 and changes nothing.",
    "The safe API returns only the view fields, with the card masked, and a directory view in lists.",
    "The page size is capped, and calls are limited per caller, charging per row, with 429 and Retry-After.",
    "Ownership is still checked in both versions.",
    "The demo prints the same output on every run.",
]

