[threatmodel]
scope = """
A bank's customer-facing JSON API: profile update, account view and directory list. It covers the fields accepted and returned and the amount of work a caller can cause.
It does not cover ownership checks, authentication, or the network.
"""
assets = [
    "Roles, limits and balances.",
    "Card numbers, PIN hashes and risk scores.",
    "The API's availability for other customers.",
]
actors = [
    "Ana, a customer using the official app.",
    "A customer who sends hand-made requests.",
]
boundaries = [
    "Caller to API: the JSON, the page size and the request rate are untrusted.",
    "API to records: the shape of the record must not decide the shape of the API.",
]
assumptions = [
    "Authentication and ownership are enforced elsewhere (and are checked in the demo).",
    "One server instance; shared limits come with the Redis version.",
]
out_of_scope = [
    "Object-level authorization: broken-access-control.",
    "Distributed rate limiting: api-security-with-spring-boot-and-redis.",
]
tests = [
    "`ApiSecurityTest` checks both APIs: mass assignment, response shape, masking, page caps, validation, ownership, the budget, 429 and refill.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next project, cors, covers which other sites a browser lets read these answers.
"""

[[threat]]
id = "T1"
stride = "E"
threat = "A caller sets fields it may not change, such as role and credit limit"
where = "`NaiveApi.patchProfile`"
control = "An explicit request model that refuses unknown fields"
residual = "A field added to the model later without a decision about who may set it"

[[threat]]
id = "T2"
stride = "I"
threat = "Responses reveal fields the app does not need: full card, PIN hash, risk score"
where = "`NaiveApi.getAccount`, `listAccounts`"
control = "Response models and a directory view"
residual = "A view that grows fields over time; compare responses with the model in tests"

[[threat]]
id = "T3"
stride = "D"
threat = "Huge pages and request loops exhaust the service and scrape data"
where = "`NaiveApi.listAccounts`"
control = "A page cap and per-caller token buckets charged per row, with 429 and Retry-After"
residual = "Many accounts together (distributed callers); monitor totals and block patterns"

[poster]
headline = [["API SECURITY", "text"], ["THREE LIMITS", "accent"]]
taglines = [["What a caller may set, may see, and may ask for", "gold"]]
before = { code = "{\"role\": \"admin\"} -> 200 role admin", note = "Whatever the caller sends becomes a field", tag = "BEFORE" }
after = { code = "UpdateProfileRequest.parse(body)", note = "400 unknown field", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "API Security: Mass Assignment, Data Exposure and Resource Limits"
narration = "Hello, and welcome. [[slnc 400]] This video explains three A P I security flaws and their defences, in Java. [[slnc 300]] A P I stands for application programming interface: the door an app uses to talk to a server. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] An A P I owes its callers three limits. [[slnc 300]] What they may set. [[slnc 300]] What they may see. [[slnc 300]] And how much they may ask for. [[slnc 300]] Leave any one of them to chance, and a customer can promote themselves, read other people's data, or wear the service out. [[slnc 600]] Think of a bank counter where customers fill in their own credit limit, the clerk hands over the whole file, and the queue never ends. [[slnc 600]] Our example is a bank's A P I for its mobile app."

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["A bank API for its mobile app:", "  change my profile", "  show an account", "  list the branch directory", "", "300 accounts, all made up.", "Ownership is checked in every version."]
narration = "Here is the scenario. [[slnc 400]] A bank's mobile app talks to its A P I with three calls: change my profile, show an account, and list the branch directory. [[slnc 500]] The demo runs the calls in plain Java, against three hundred made-up accounts. [[slnc 300]] Every version checks that the account belongs to the caller, so this video is about the three other limits."

[[scene]]
key = "02-words"
kind = "bullets"
title = "The Words"
body = ["Mass assignment: every key becomes a field", "Request model: the fields a caller may set", "Response model: the fields a caller may see", "Page size: how many rows one call returns", "Token bucket: a budget that refills over time"]
narration = """Before the demos, the words. [[slnc 500]] Mass assignment means copying every key of a request onto a record, whatever the key is. [[slnc 500]] A request model is a small class that names the fields a caller may set. [[slnc 500]] A response model names the fields a caller may see. [[slnc 500]] The page size is how many rows one call to a list returns. [[slnc 500]] And a token bucket is a budget: each call takes tokens, and the bucket slowly refills."""

[[scene]]
key = "02-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "02-three-limits"
kind = "figure"
title = "Three limits on one record"
body = "three_limits"
narration = """Let's see the whole idea on one picture. [[slnc 400]] This is Ana's account record, as the bank stores it. [[slnc 300]] Eight fields. [[slnc 700]] The first column asks: may Ana set this field herself? [[slnc 300]] Her display name and her e-mail, yes. [[slnc 300]] Her role, her balance, her credit limit, her risk score, her card and her PIN hash: no. [[slnc 700]] The second column asks: may her app see it? [[slnc 300]] Her id, name, e-mail and balance, yes. [[slnc 300]] Only the last four digits of the card. [[slnc 300]] Never the role, the limit, the risk score, or the PIN hash. [[slnc 700]] The third limit is how much she may ask for: at most fifty rows a page, and a budget of calls. [[slnc 500]] The first version of the A P I leaves all three to chance. [[slnc 300]] The fixed version writes each one down, in code."""

[[scene]]
key = "03-acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "04-costs"
kind = "bullets"
title = "What It Costs"
body = ["Explicit models mean more code", "Refusing unknown fields breaks clients", "  that send extras", "Limits need real numbers", "Rate limits need a shared store", "  across servers", "Cost is not only the number of requests"]
narration = "Nothing is free. [[slnc 400]] Here is what the defences cost. [[slnc 500]] A request model and a response model for every call is more code to write. [[slnc 500]] Refusing unknown fields breaks any client that sends extras, even harmless ones. [[slnc 500]] Page caps and budgets need real numbers, chosen from real use. [[slnc 500]] When the A P I runs on several servers, the budgets must live somewhere they all share. [[slnc 300]] And cost is not only the number of requests: a list of a thousand rows costs more than one row."

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["A controller that returns a database entity", "A page size parameter with no maximum", "An app's network log showing fields", "  the screen never uses", "Findings API3, API4 or API6"]
narration = "You have probably met this already. [[slnc 400]] A controller that returns a database entity straight to the client is the data exposure. [[slnc 500]] A page size parameter with no maximum is the list with no end. [[slnc 500]] An app's network traffic that carries fields the screen never shows is the same leak, seen from the phone. [[slnc 500]] And findings marked A P I three, four, or six in the OWASP A P I list are these flaws, by name."

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "How To Use It"
body = ["A request model for every write;", "  unknown fields refused", "A response model for every read;", "  never return the entity", "A maximum page size", "A budget for every caller", "429 with Retry-After"]
narration = "So, how do you use it? [[slnc 400]] Write a request model for every call that changes something, and refuse any field it does not name. [[slnc 500]] Write a response model for every call that reads something, and never return the database entity itself. [[slnc 500]] Cap the page size. [[slnc 500]] Give every caller a budget, and charge more for expensive calls. [[slnc 300]] And when the budget runs out, answer too many requests, and say when to try again."

[[scene]]
key = "12-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Charge a transfer more tokens", "than a read, and loop some transfers."]
narration = "That's A P I security. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] An A P I should decide in code which fields a caller may set, which fields it may see, and how much it may ask for, and never leave those choices to whatever the database record happens to hold. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Charge a transfer more tokens than a read, and see what happens to a loop of transfers. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] There is no web server: the A P I is a plain Java interface, and the clock is simulated, so every run is the same. [[slnc 300]] Here are the classes that matter."""

[[class]]
name = "NaiveApi"
what = "the first version: every key copied, the whole record returned"
[[class.part]]
title = "mass assignment"
code = """
// every key the caller sends becomes a field: "role", "creditLimitCents", ...
body.forEach(account.get()::set);
return ApiResponse.ok(account.get().all());
"""
speech = """The first version copies every key of the J S O N body onto the account. [[slnc 300]] Then it returns all of the record's fields. [[slnc 300]] Two lines, and two of the three flaws."""

[[class]]
name = "UpdateProfileRequest"
what = "the request model: the only fields a customer may set"
[[class.part]]
title = "unknown fields refused"
code = """
static final List<String> FIELDS = List.of("displayName", "email");
...
for (String key : body.keySet()) {
    if (!FIELDS.contains(key)) {
        throw new BadRequest("unknown field");
"""
speech = """The request model names two fields. [[slnc 300]] Any other key is refused with a bad request, before anything is changed. [[slnc 300]] It also checks each value's type and length."""

[[class]]
name = "AccountView"
what = "the response model: what the app may see, card masked"
[[class.part]]
title = "five fields, last four digits"
code = """
public record AccountView(String id, String displayName, String email,
                          long balanceCents, String cardLast4) {
...
String last4 = card.substring(card.length() - 4);
"""
speech = """The response model is a record with five fields. [[slnc 300]] The card number is cut to its last four digits. [[slnc 300]] A field added to the database later does not appear here by accident."""

[[class]]
name = "SafeApi"
what = "the fixed API: a page cap, and a budget charged per row"
[[class.part]]
title = "cap the page, then charge for it"
code = """
int effective = size == 0 ? DEFAULT_SIZE : Math.min(size, MAX_SIZE);
...
int wait = reads.tryTake(user, Math.max(1, to - from));
if (wait > 0) {
    return new ApiResponse(429, "too many requests", wait);
"""
speech = """The list takes the smaller of the asked size and the cap of fifty. [[slnc 300]] Then it asks the rate limiter for one token per row. [[slnc 300]] If the bucket is short, it answers four two nine, with the wait in seconds."""

[[class]]
name = "RateLimiter"
what = "a token bucket per caller"
[[class.part]]
title = "refill, take, or say how long to wait"
code = """
double tokens = Math.min(capacity, b.tokens() + (now - b.at()) * perSecond);
if (tokens >= cost) {
    buckets.put(key, new Bucket(tokens - cost, now));
    return 0;
}
buckets.put(key, new Bucket(tokens, now));
return (int) Math.ceil((cost - tokens) / perSecond);
"""
speech = """First the bucket refills for the time that has passed, up to its capacity. [[slnc 300]] If there are enough tokens, they are taken. [[slnc 300]] If not, the wait is the missing tokens divided by the refill rate, rounded up."""

[[acronym]]
short = "API"
long = "Application Programming Interface: the calls an app makes to a server"
say = "A P I is application programming interface: the set of calls an app can make to a server."
[[acronym]]
short = "JSON"
long = "JavaScript Object Notation: text like {\"role\": \"admin\"}"
say = "J S O N is JavaScript object notation: the text format of keys and values that the app sends."
[[acronym]]
short = "HTTP"
long = "Hypertext Transfer Protocol: GET reads, PATCH changes part of a record"
say = "H T T P is the hypertext transfer protocol. A get request reads. A patch request changes part of a record."
[[acronym]]
short = "200, 400, 429"
long = "HTTP status codes: OK; bad request; too many requests"
say = "Two hundred means O K. Four hundred means bad request. Four two nine means too many requests."
[[acronym]]
short = "PIN"
long = "Personal Identification Number: the card's secret code"
say = "PIN is personal identification number: the secret code of a bank card."
[[acronym]]
short = "OWASP"
long = "Open Worldwide Application Security Project"
say = "OWASP is the open worldwide application security project, which keeps lists of the most common flaws."
[[acronym]]
short = "API3, API4, API6"
long = "OWASP API Top 10 (2023): fields; resources; business flows"
say = "In the OWASP A P I top ten, number three is about which fields a caller may read and write, number four is about unlimited resource use, and number six is about business flows that need limits."

