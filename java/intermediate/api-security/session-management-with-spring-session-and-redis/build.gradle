plugins {
    id 'java'
    id 'application'
}

group = 'com.jk.explore.security'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot 4.1.1's BOM pins Spring Framework 7.0.9, Spring Security 7.1.1, Spring Session and Lettuce.
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.1.1')
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-session-data-redis'

    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.jk.explore.security.sessionredis.SessionRedisDemo'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-parameters'
}

test {
    useJUnitPlatform {
        excludeTags 'integration'
    }
}

// Tests that need Docker (a real Redis started and removed by the test): ./gradlew integrationTest
tasks.register('integrationTest', Test) {
    description = 'Runs the tests that start a Redis container.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'integration'
    }
    shouldRunAfter test
}

// No deprecated or to-be-removed API is allowed in any project: a warning fails the build.
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.addAll(['-Xlint:deprecation', '-Xlint:removal', '-Werror'])
}
