slug = "session-management-with-spring-session-and-redis"
level = "intermediate"
module = "api-security"
title = "Session Management with Spring Session and Redis"
short_title = "Sessions in Redis"
package = "sessionredis"
main_class = "SessionRedisDemo"
tagline = "Moving sessions into Redis makes them survive a restart and a second server, and makes Redis the place where a stolen key is a live session"
bold = "Spring Session keeps the session in Redis so any server can serve any request, and Spring Security still gives a new id at sign-in; but the id is stored as itself so Redis needs a password, an idle limit is enforced by Spring while the absolute limit is yours to add, ended sessions linger in Redis for five minutes, an unauthenticated request can create a record unless the request cache is off, and a bank that cannot reach Redis must refuse."
domain = "an online bank"
domain_note = ""
youtube_description = "Session management with Spring Session and Redis in Spring Boot 4.1: a bank whose sessions live in a password-protected Redis, why a stolen copy of the keys is a set of live sessions, session fixation and Spring Security's new id at sign-in, the idle timeout and the absolute timeout that Spring Session does not have, signing out, signing out everywhere, a password change and a limit on sessions, two servers sharing one store, a bank that fails closed when Redis stops answering, and a stranger filling Redis through the request cache."
thumb_lines = ["SESSIONS IN", "REDIS"]
thumb_code = "spring:session:sessions:<id>"
youtube_title = "Sessions in Redis with Spring Session: Fixation, Timeouts, Sign-Out Everywhere (OWASP A07)"
youtube_tags = ["spring session", "redis", "session management", "session fixation", "spring security", "owasp top 10", "a07", "java", "api security"]

[readme]
intro = """
The plain [session-management](../session-management) project builds ids, rotation, timeouts and sign-out from scratch, and ends with the bill: two servers need a shared store. This one pays that bill with **Spring Session 4** and a real **Redis 8** in Docker, on **Spring Boot 4.1** and **Spring Security 7**, all on the loopback address. It needs Docker, and its tests are tagged `integration`: `./gradlew integrationTest`.

What it shows:
- **The session lives in Redis.** Redis refuses a client with no password. The cookie is the Redis key's id, encoded, so a stolen copy of the keys, turned into cookies, **opens live sessions**: unlike the plain store, which kept only a hash of each id.
- **A new id at every sign-in.** With the id kept, a planted id becomes ana's and the stranger reads her account. With Spring Security's default `changeSessionId` it does not, and the old record is no longer live.
- **How long a session lives.** Spring Session ends an idle session, and Redis keeps the dead record five more minutes. It has **no absolute timeout**, so a 20-line filter of our own ends a busy session at 8 hours.
- **Signing out, everywhere, and the limit.** Sign-out ends the session on the server. `FindByIndexNameSessionRepository` finds every session of a customer to end them all, and a password change ends the others and renews this one. A limit of 3 sessions ends the oldest.
- **The bill.** Two servers with separate stores refuse a request that lands on the other; with one Redis they allow it. **A Redis that stops answering makes the bank refuse**, never allow. And with Spring Security's default request cache, 20 requests from strangers create 20 session records in Redis.

**Maps to:** OWASP Top 10 (2025) A07 Authentication Failures · CWE-384 (session fixation) · CWE-613 (insufficient session expiration) · CWE-614 (cookie without Secure) · OWASP ASVS 5.0 V7 (Session Management).
"""
analogy = """
A coat check that used to keep tickets in one cloakroom and now keeps them in a safe shared by every branch. Any branch can return your coat, which is the point, and anyone who copies the safe's list holds every ticket, which is the price.
"""
scenario = """
An online bank on Spring Boot signs customers in with a form and keeps each session in Redis. The demo starts the real application, sometimes twice, against a real Redis, and a device stand-in that keeps the session cookie signs in, waits, signs out and tries copies of cookies.
"""
costs = [
    "**Redis is now in every request.** If it is slow the bank is slow, and if it is down the bank refuses.",
    "**Redis holds every live id as itself.** Its password, its address and its backups are as sensitive as the cookie jar.",
    "**Spring Session keeps ended sessions five more minutes,** and has no absolute timeout, so the second rule is yours to write and to test.",
    "**A short idle timeout annoys customers** who stop to read a statement.",
    "**Operations work moves to Redis:** persistence, memory limits and failover are now the bank's sessions.",
]
too_much = """
A single server that restarts rarely can keep sessions in memory. Move them to Redis when a second server arrives or when a deployment must not sign everyone out, and protect Redis as you would the cookie jar.
"""
met_before = [
    "`@EnableRedisIndexedHttpSession` or `spring-session-data-redis` in a pom.",
    "Keys such as `spring:session:sessions:<uuid>` in a Redis browser.",
    "A customer signed out on every device after a password change.",
    "Load balancers with sticky sessions that Redis makes unnecessary.",
]
where = """
This is the tools version of [session-management](../session-management), in the [api-security](..) module. It follows the same story and picks up where the plain project's bill left off.
"""
twin = """
The bank servers are real Spring Boot applications, and Redis is a real container bound to 127.0.0.1 on a free port, protected by a password and removed at the end. The device stand-in reads the Set-Cookie header and sends the cookie back, which is what a browser does over https. Only statuses, booleans and counts are printed, never ids or ports.
"""
test_note = "The tests start a real Redis in Docker and real bank servers and remove the container afterwards. Run them with ./gradlew integrationTest; nothing printed changes between runs."

[[act]]
title = "The session lives in Redis"
summary = "Redis needs a password, the cookie carries the Redis key's id, and a stolen copy of the keys turned into cookies opens live sessions."
detail = """
A client with no password is refused by Redis. Ana signs in and the cookie `__Host-session` has Path=/, Secure, HttpOnly and SameSite=Strict, with 0 problems. Redis holds 1 session record and an index entry for ana. The cookie is the id in the Redis key, encoded. A stolen copy of Redis's 1 session key, turned into a cookie, opens 1 session: the id is stored as itself. The plain project kept only a hash of each id; here the protection is Redis's password, its loopback address and short timeouts.
"""
speech = """
First demo: the session lives in Redis. [[slnc 400]] Redis refuses a client with no password. [[slnc 600]]
Ana signs in, and the cookie has every protection. [[slnc 600]]
The cookie is the id in the Redis key, encoded. [[slnc 300]] A stolen copy of the keys, turned into cookies, opens live sessions. [[slnc 600]]
So Redis needs the same care as the cookie jar.
"""
rows = { stored = "active wrong" }
console = [
    ["a client with no password is refused by Redis", "ok"],
    ["ana signs in: 200, cookie problems 0", "ok"],
    ["the cookie is the Redis key's id, encoded", "amber"],
    ["a stolen copy of the keys opens 1 session", "bad"],
]

[[act]]
title = "A new id at every sign-in"
summary = "With the id kept, a planted id becomes ana's and the stranger reads her account; with Spring Security's default the ids differ and the stranger's copy is refused."
detail = """
A stranger gets an id from the bank's welcome page and puts it into ana's browser. With a bank that keeps the id at sign-in, ana's id after signing in is the planted one, and the stranger's copy reads her account: session fixation. With Spring Security's default, changeSessionId, the ids differ, the stranger's copy is refused with 401, ana's new id is allowed, and the planted id is no longer a live record in Redis.
"""
speech = """
Second demo: a new id at every sign in. [[slnc 400]] A stranger gets an id from the welcome page and puts it into ana's browser. [[slnc 600]]
If the bank keeps the id at sign in, the stranger reads her account. [[slnc 300]] That is session fixation. [[slnc 600]]
With Spring Security's default, the id changes at sign in, and the stranger's copy is refused.
"""
rows = { fixation = "active ok" }
console = [
    ["the id is kept at sign-in: the stranger's copy reads ana's account", "bad"],
    ["changeSessionId: the ids differ", "ok"],
    ["the stranger's copy -> refused (401)", "ok"],
    ["the planted id is no longer live in Redis", "ok"],
]

[[act]]
title = "How long a session lives"
summary = "Spring Session enforces the idle timeout and Redis keeps the dead record five more minutes; there is no absolute timeout, so a small filter of our own ends a busy session at 8 hours."
detail = """
With an idle timeout of 2 seconds for the demo, Redis keeps the record for the idle timeout plus five minutes. Ana idle for 1 second is allowed. Idle for 2.5 seconds she is refused, and the dead record stays in Redis for five more minutes while the bank still refuses its id. An absolute timeout of 8 hours: 7 hours 59 minutes after sign-in she is allowed; two minutes later she is refused, though she was busy. Spring Session has no absolute timeout, so this is a 20-line filter of our own.
"""
speech = """
Third demo: how long a session lives. [[slnc 400]] Spring Session enforces the idle timeout. [[slnc 600]]
After an idle pause, ana is refused, but Redis keeps the dead record for five more minutes. [[slnc 600]]
Spring Session has no absolute timeout. [[slnc 300]] A busy session would live for ever, so a small filter of our own ends it at eight hours.
"""
rows = { timeouts = "active ok" }
console = [
    ["idle for 1 second -> allowed", "ok"],
    ["idle for 2.5 seconds -> refused (401)", "ok"],
    ["the dead record stays in Redis for five more minutes", "amber"],
    ["busy for 8 hours 1 minute -> refused (401)", "ok"],
]

[[act]]
title = "Signing out, everywhere, and the limit"
summary = "Sign-out ends the session on the server, sign-out everywhere ends 3 sessions, a password change ends the others and renews this one, and a limit of 3 ends the oldest."
detail = """
Sign-out returns 200, tells the browser to forget the cookie, and the record is no longer live in Redis. A copy of the cookie made before sign-out is refused with 401: the server ended the session, not only the browser. Ana is signed in on her phone, laptop and tablet: 3 live records and 3 in her index. Sign out everywhere ends 3 sessions. After a password change on the laptop, 2 other sessions are ended, the laptop goes on with a new id, and the old laptop id and the phone are refused. With a limit of 3 sessions, a fourth sign-in ends the oldest, the phone's.
"""
speech = """
Fourth demo: signing out, everywhere, and the limit. [[slnc 400]] Sign out ends the session on the server, so a copy of the cookie is refused. [[slnc 600]]
Ana is signed in on three devices. [[slnc 300]] Sign out everywhere ends all three. [[slnc 600]]
A password change ends the other sessions, and gives this one a new id. [[slnc 600]]
And a limit of three sessions ends the oldest when a fourth sign in arrives.
"""
rows = { ending = "active ok" }
console = [
    ["sign-out: the copy of the cookie -> refused (401)", "ok"],
    ["sign out everywhere ended 3 sessions", "ok"],
    ["password change: 2 other sessions ended, the laptop gets a new id", "ok"],
    ["a fourth sign-in ends the phone's session", "ok"],
]

[[act]]
title = "The bill"
summary = "Two servers need one shared store, a Redis that stops answering makes the bank refuse, and with the request cache on, 20 strangers create 20 session records."
detail = """
Two servers with separate session stores: ana signs in on A and her next request lands on B and is refused. Both servers using the same Redis allow it, and back on A too. When Redis stops answering, a request with a valid cookie is refused with 500 and so is a sign-in: the bank fails closed. When Redis answers again the same cookie is allowed. With Spring Security's default request cache, 20 requests from strangers with no cookie leave 20 session records in Redis; with it off, 0.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] Two servers need one shared store, or a request that lands on the other is refused. [[slnc 600]]
With one Redis, either server serves her. [[slnc 600]]
When Redis stops answering, the bank refuses. [[slnc 300]] It fails closed. [[slnc 600]]
And with the default request cache, twenty strangers leave twenty session records in Redis.
"""
rows = { bill = "active ok" }
console = [
    ["separate stores: the request on B -> refused (401)", "bad"],
    ["one shared Redis: the request on B -> allowed", "ok"],
    ["Redis stops answering -> refused (500), never allowed", "ok"],
    ["request cache on: 20 strangers leave 20 records in Redis", "bad"],
]

