[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] The bank is a real Spring Boot application, with Spring Security and Spring Session, and Redis runs in Docker. [[slnc 300]] Here are the classes that matter."""

[[class]]
name = "BankSecurity"
what = "the cookie, a new id, the request cache"
[[class.part]]
title = "the session cookie"
code = """
cookie.setCookieName("__Host-session");
cookie.setCookiePath("/");
cookie.setUseSecureCookie(true);
cookie.setUseHttpOnlyCookie(true);
cookie.setSameSite("Strict");
"""
speech = """Spring Session writes the cookie through a cookie serializer. [[slnc 300]] Here it gets the double underscore Host name, path slash, secure, H T T P only, and same site strict."""
[[class.part]]
title = "a new id at sign-in"
code = """
if (fixation.equals("none")) {
    s.sessionFixation(f -> f.none());
} else {
    s.sessionFixation(f -> f.changeSessionId());
"""
speech = """Change session id is Spring Security's default. [[slnc 300]] The demo can switch it to none, only to show session fixation working."""
[[class.part]]
title = "the request cache"
code = """
.requestCache(c -> {
    if (!saveRequests) {
        c.disable();
"""
speech = """The request cache remembers the page a stranger asked for, in a new session. [[slnc 300]] For an A P I it is turned off, so strangers cannot fill Redis."""

[[class]]
name = "AbsoluteTimeoutFilter"
what = "the 8-hour limit Spring Session lacks"
[[class.part]]
title = "too old, however busy"
code = """
if (session != null && tooOld(session)) {
    session.invalidate();
...
Instant created = Instant.ofEpochMilli(session.getCreationTime());
return created.plus(limit).isBefore(clock.instant());
"""
speech = """On every request, the filter adds eight hours to the session's creation time. [[slnc 300]] If that is already past, the session is ended, however recently it was used."""

[[class]]
name = "BankController"
what = "the bank's pages"
[[class.part]]
title = "sign out everywhere"
code = """
var mine = sessions.findByPrincipalName(who.getName());
List<String> ids = List.copyOf(mine.keySet());
ids.forEach(sessions::deleteById);
"""
speech = """Spring Session's index finds every session of a customer by name. [[slnc 300]] Deleting them from Redis ends them on every device at once."""

[[class]]
name = "SessionKeys"
what = "names in Redis and in the cookie"
[[class.part]]
title = "the cookie is the id in Base64"
code = """
static String cookieFor(String id) {
    byte[] bytes = id.getBytes(StandardCharsets.UTF_8);
    return Base64.getEncoder().encodeToString(bytes);
...
for (int i = 0; i < bits.length(); i += 6) {
    groups.add(bits.substring(i, i + 6));
"""
speech = """The cookie is just the id, in Base sixty four. [[slnc 300]] The by hand version cuts the bits into groups of six, and a test proves it matches the library."""

[[acronym]]
short = "Base64"
long = "a way to write bytes with 64 characters: A-Z, a-z, 0-9, + and /"
say = "Base sixty four writes every six bits as one of sixty four characters: letters, digits, plus and slash."
[[acronym]]
short = "hex"
long = "hexadecimal: each byte written as two characters, 0-9 and a-f"
say = "Hex, short for hexadecimal, writes each byte as two characters, from zero to nine and a to f."
[[acronym]]
short = "HTTP, HTTPS"
long = "Hypertext Transfer Protocol; HTTPS is HTTP over an encrypted connection"
say = "H T T P is the hypertext transfer protocol, the language of the web. H T T P S is the same, over an encrypted connection."
[[acronym]]
short = "OK"
long = "status 200 means OK; 401 means not signed in; 500 means a server error"
say = "Status two hundred means O K. Four oh one means not signed in. Five hundred means the server failed."
[[acronym]]
short = "API"
long = "Application Programming Interface: pages made for programs, not people"
say = "A P I is application programming interface: pages made for programs to call, not for people to read."
[[acronym]]
short = "TTL"
long = "time to live: how long Redis keeps a key before deleting it"
say = "T T L is time to live: how long Redis keeps a key before it deletes it."
[[acronym]]
short = "UUID"
long = "Universally Unique Identifier: 128 bits written as 36 characters"
say = "U U I D is universally unique identifier: a random hundred and twenty eight bit value, written as thirty six characters."
[[acronym]]
short = "PING, NOAUTH"
long = "Redis words: are you there?; refused, no password given"
say = "Ping asks Redis: are you there? No auth is its answer when no password was given: refused."

[threatmodel]
scope = """
A Spring Boot bank that keeps sessions in Redis. It covers session fixation, the life of a session, the store itself and the bank's behaviour when the store is unavailable. It does not cover Redis clustering or the sign-in method.
"""
assets = [
    "The customers' sessions and the accounts they open.",
    "Redis, which holds every live session id.",
]
actors = [
    "A customer on several devices.",
    "A stranger who can plant or steal a session id.",
    "Someone who can read Redis's keys or its backups.",
]
boundaries = [
    "The device to the bank: the cookie.",
    "The bank to Redis: a password on the loopback address.",
]
assumptions = [
    "The connection to the bank is https in production, so the Secure cookie travels.",
    "Redis is reachable only from the bank servers.",
]
out_of_scope = [
    "Attacks on the host that runs Redis.",
    "Single sign-on and tokens.",
]
tests = [
    "`SessionRedisTest` starts a real Redis and real bank servers and checks the password, the cookie, the stolen key, fixation in both modes, the idle and absolute limits, sign-out, sign-out everywhere, the password change, the session limit, two servers, a Redis that stops answering, and the request cache.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
    "`SessionKeysTest` and `AbsoluteTimeoutFilterTest` need no tools: the cookie is the Base64 of the id (by hand and by the library), which Redis keys count as live, and the 8-hour filter.",
]
next = """
The next project in this module, api-security-with-spring-boot-and-redis, adds validation, response shaping and a Redis-backed rate limiter, which also answers the flood of sign-in attempts left open here.
"""

[[threat]]
id = "T1"
stride = "S"
threat = "A planted id becomes the customer's session at sign-in"
where = "`BankSecurity.chain`, session fixation"
control = "A new id at every sign-in (changeSessionId)"
residual = "A site that sets cookies for the bank's domain"

[[threat]]
id = "T2"
stride = "I"
threat = "Someone reads Redis's keys and uses them as cookies"
where = "`spring:session:sessions:<id>`"
control = "A Redis password, a loopback address, no persistence of sessions to shared backups, short timeouts"
residual = "An attacker with access to the bank servers' memory"

[[threat]]
id = "T3"
stride = "E"
threat = "A busy session lives for ever"
where = "`AbsoluteTimeoutFilter`"
control = "An absolute limit on top of the idle limit"
residual = "A stolen session that is still inside both limits"

[[threat]]
id = "T4"
stride = "D"
threat = "Strangers create session records until Redis is full"
where = "Spring Security's request cache"
control = "Request cache off for an API, so only sign-in creates a record"
residual = "A flood of sign-in attempts, which the rate limiter in the next project addresses"

[[threat]]
id = "T5"
stride = "D"
threat = "Redis stops answering and the bank allows requests without a session check"
where = "`SessionRepositoryFilter`"
control = "A timeout on Redis and a refusal when it fails"
residual = "A long outage that signs everyone out"

