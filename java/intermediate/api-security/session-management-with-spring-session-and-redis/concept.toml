[[act]]
title = "A new id at every sign-in"
summary = "A stranger plants a welcome-page cookie in Ana's browser; with fixation protection off the stranger reads her account; with Spring Security's default, changeSessionId, the planted cookie is refused and is no longer a live record."
detail = """
Before Ana signs in, a stranger opens the bank's /welcome page, gets a session cookie, called planted here, and puts it into Ana's browser.
After sign-in, a bank configured with session fixation protection off (fixation none) keeps the id: Ana's cookie is still the planted one, and the stranger's copy reads her account. That is session fixation.
After sign-in with Spring Security's default, changeSessionId, Ana gets a new cookie: the stranger's planted one is refused with 401, Ana's new one is allowed, and the planted id is no longer a live record in Redis.
"""
figure = "fixation"
figure_title = "The same planted cookie, two settings"
figure_speech = """
Second demo: session fixation, now with Spring Security. [[slnc 400]] At the top, before Ana signs in. [[slnc 300]] A stranger opens the bank's welcome page, which gives any visitor a session cookie. [[slnc 300]] Then the stranger puts that cookie into Ana's browser. [[slnc 700]]
On the left, the bank with session fixation protection turned off. [[slnc 300]] Ana signs in, and keeps the planted id. [[slnc 300]] The stranger's copy is now signed in as Ana. [[slnc 700]]
On the right, Spring Security's default, change session id. [[slnc 300]] At sign in, the session gets a new id, and a new cookie. [[slnc 300]] The stranger's copy is refused, with four oh one, and the old id is no longer a live record in Redis. [[slnc 700]]
The default is right. [[slnc 300]] The danger is a configuration that turns it off.
"""
speech = """
Here is the output. [[slnc 400]] Before Ana signs in, the stranger plants a cookie from the welcome page. [[slnc 400]] With fixation protection off, Ana keeps the planted cookie, and the stranger is allowed. [[slnc 300]] Session fixation. [[slnc 500]] With the default, Ana gets a new cookie. [[slnc 300]] The planted one is refused, and is no longer live in Redis.
"""
rows = { fixation = "active ok" }
console = [
    ["BEFORE ANA SIGNS IN:", "code"],
