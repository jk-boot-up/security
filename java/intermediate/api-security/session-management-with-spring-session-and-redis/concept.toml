[[act]]
title = "The bill"
summary = "Two servers with separate stores refuse each other's sessions and one Redis fixes it; a Redis that stops answering makes the bank refuse with 500; with the default request cache 20 strangers make 20 records, and 0 when it is off."
detail = """
Ana signs in on server A and her next request lands on server B. With a separate store for each server, B refuses: 401. With both using the same Redis, B allows her, and so does A again.
While Redis stops answering, a request with a valid cookie and a sign-in are both refused with 500: the bank fails closed. When Redis answers again, the same cookie is allowed.
Twenty requests from strangers with no cookie: with Spring Security's request cache on, the default, they create 20 session records in Redis, so a stranger can fill it; with the cache off, 0.
The price: a customer who stops to read a statement signs in again, and every request now needs Redis to answer.
"""
figure = "redis_down"
figure_title = "One Redis for every server, and when it stops"
figure_speech = """
Fifth demo: the bill. [[slnc 400]] On the left, two servers. [[slnc 300]] Ana signs in on A, and her next request lands on B. [[slnc 300]] With a store per server, B refuses her. [[slnc 300]] With one Redis for both, B allows her. [[slnc 700]]
Top right, Redis stops answering. [[slnc 300]] Now every request needs Redis. [[slnc 300]] The bank answers five hundred, and refuses, for a valid cookie and for a sign in. [[slnc 300]] That is the right failure: closed, not open. [[slnc 700]]
Bottom right, twenty strangers with no cookie. [[slnc 300]] Spring Security's request cache remembers the page each one asked for, in a new session. [[slnc 300]] Twenty records in Redis. [[slnc 300]] Turned off, zero.
"""
speech = """
Here is the output. [[slnc 400]] A store per server: B refuses. [[slnc 300]] One Redis: B and A both allow. [[slnc 400]] While Redis stops answering, a valid cookie and a sign in are refused with five hundred: fails closed. [[slnc 300]] When Redis is back, the cookie works again.
[[page]]
Twenty strangers with no cookie make twenty records while the request cache is on, and none when it is off. [[slnc 400]] And the price: a customer who stops to read signs in again, and every request needs Redis.
"""
