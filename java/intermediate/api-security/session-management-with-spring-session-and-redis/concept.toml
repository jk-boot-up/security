[[scene]]
key = "01-poster"
kind = "poster"
title = "Session Management with Spring Session and Redis"
narration = "Hello, and welcome. [[slnc 400]] This video explains session management with Spring Session and Redis, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A session is how a website remembers that you signed in: your browser holds a random id in a cookie, and the server keeps what that id stands for. [[slnc 300]] Spring Session moves that record into Redis, a shared store, so any server can answer any request. [[slnc 300]] That also makes Redis the place where a stolen copy becomes a live session. [[slnc 600]] Think of a cloakroom that moves all its coats into one shared room. [[slnc 300]] Every attendant can now fetch your coat, so that room needs the best lock in the building. [[slnc 600]] Our example is an online bank."

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online bank on Spring Boot.", "Customers sign in with a form;", "each session is kept in Redis.", "", "The demo starts the real bank, sometimes twice,", "against a real Redis with a password.", "A device stand-in keeps the session cookie."]
narration = "Here is the scenario. [[slnc 400]] An online bank on Spring Boot signs customers in with a form, and keeps each session in Redis. [[slnc 500]] The demo starts the real bank, sometimes twice, against a real Redis that needs a password. [[slnc 500]] A device stand-in keeps the session cookie, signs in, waits, signs out, and tries copies of cookies, the way a stranger would."

[[scene]]
key = "02-words"
kind = "bullets"
title = "The Words"
body = ["Session: what the server remembers about a sign-in", "Session id: the random value in the cookie", "Redis: a fast store of keys and values", "Spring Session: keeps the session in Redis", "Session fixation: a victim made to use a known id"]
narration = """Before the demos, the words. [[slnc 500]] A session is what the server remembers about a sign in. [[slnc 500]] The session id is the random value in the cookie that points to it. [[slnc 500]] Redis is a fast store of keys and values, which several servers can share. [[slnc 500]] Spring Session is the library that keeps the session in Redis instead of in one server's memory. [[slnc 500]] And session fixation means getting a victim to sign in with an id the attacker already knows."""

[[scene]]
key = "02-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "02-id-in-redis"
kind = "figure"
title = "The id in Redis is the cookie"
body = "id_in_redis"
narration = """Let's see the whole idea on one picture. [[slnc 400]] At the top, what Redis holds after Ana signs in. [[slnc 300]] The session record's key contains the session id itself, in plain text. [[slnc 700]] At the bottom, the cookie in Ana's browser. [[slnc 300]] It is the same id, only written in Base sixty four. [[slnc 300]] Nothing is hashed, and nothing is secret about the writing. [[slnc 700]] So anyone who can read Redis's keys can write every customer's cookie, and the bank lets them in. [[slnc 300]] The plain project stored only a hash of each id. [[slnc 300]] Here, Redis itself must be protected: a password, the loopback address, and short timeouts."""

[[scene]]
key = "03-acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "04-costs"
kind = "bullets"
title = "What It Costs"
body = ["Redis is part of every request", "Redis holds every live id as it is", "Ended sessions stay in Redis five more minutes", "A short idle timeout annoys customers", "Operations work moves to Redis"]
narration = "Nothing is free. [[slnc 400]] Here is what moving sessions costs. [[slnc 500]] Redis is now part of every request, so when it stops, the bank stops. [[slnc 500]] Redis holds every live session id as it is, so a copy of its keys is a copy of every session. [[slnc 500]] Ended sessions stay in Redis for five more minutes. [[slnc 500]] A short idle timeout protects customers, and annoys them. [[slnc 300]] And Redis needs passwords, backups, and patching of its own."

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Signed out on every device after", "  a password change", "A Redis with no password on a shared network", "A session record for every stranger's request"]
narration = "You have probably met this already. [[slnc 400]] Being signed out on every device after you change your password is the sign out everywhere from the fourth demo. [[slnc 500]] A Redis with no password, on a shared network, is a copy of every session for whoever finds it. [[slnc 500]] And a store full of session records from strangers who never signed in is the request cache, from the last demo."

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Protect Redis like the cookie jar", "Keep the new id at every sign-in", "Add an absolute timeout yourself", "End sessions on the server", "Request cache off for an API", "Refuse when Redis does not answer"]
narration = "So, how do you use it? [[slnc 400]] Protect Redis like the cookie jar: a password, a private network, and no copies lying around. [[slnc 500]] Keep Spring Security's default of a new session id at every sign in. [[slnc 500]] Add an absolute timeout of your own, because Spring Session does not have one. [[slnc 500]] End sessions on the server when the customer signs out, and everywhere when the password changes. [[slnc 300]] Turn the request cache off for an A P I. [[slnc 300]] And when Redis does not answer, refuse."

[[scene]]
key = "07-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Ask for the password again", "before a payment, and rotate the id."]
narration = "That's session management with Spring Session and Redis. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Spring Session puts the session where every server can reach it, but the rules about its id, its age and its end are still the bank's to set, test and protect. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Ask for the password again before a payment, and give the session a new id. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"
