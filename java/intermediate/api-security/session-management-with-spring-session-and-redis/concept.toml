narration = "That's sessions in Redis. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Spring Session puts the session where every server can reach it, and the rules about its id, its age and its end are still the bank's to set, test and protect. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Store a hash of the id as the Redis key, and see what Spring Session needs to change. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"
