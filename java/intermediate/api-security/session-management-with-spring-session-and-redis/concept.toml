body = ["Explain what changes when sessions move from the", "server's memory to Redis", "Show why Redis's keys are as sensitive as the cookie", "jar", "Name the session rules Spring Session gives and the", "one it does not", "Make the bank refuse when the store is down"]
narration = "So, how do you use it? [[slnc 400]] Protect Redis like the cookie jar, keep Spring Security's new id at sign-in, add an absolute timeout, end sessions on the server, turn the request cache off for an A P I, and make the bank refuse when Redis does not answer."

