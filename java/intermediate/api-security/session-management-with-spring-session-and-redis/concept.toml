[[threat]]
id = "T2"
stride = "I"
threat = "Someone reads Redis's keys and uses them as cookies"
where = "`spring:session:sessions:<id>`"
control = "A Redis password, a loopback address, no persistence of sessions to shared backups, short timeouts"
residual = "An attacker with access to the bank servers' memory"

[[threat]]
id = "T3"
stride = "E"
threat = "A busy session lives for ever"
where = "`AbsoluteTimeoutFilter`"
control = "An absolute limit on top of the idle limit"
residual = "A stolen session that is still inside both limits"

[[threat]]
id = "T4"
stride = "D"
threat = "Strangers create session records until Redis is full"
where = "Spring Security's request cache"
control = "Request cache off for an API, so only sign-in creates a record"
residual = "A flood of sign-in attempts, which the rate limiter in the next project addresses"

[[threat]]
id = "T5"
stride = "D"
threat = "Redis stops answering and the bank allows requests without a session check"
where = "`SessionRepositoryFilter`"
control = "A timeout on Redis and a refusal when it fails"
residual = "A long outage that signs everyone out"

