[[act]]
title = "How long a session lives"
summary = "An idle timeout of 2 seconds for the demo: idle 1 second is allowed, 2.5 is refused, and Redis keeps the dead data up to 2 + 300 seconds; Spring Session has no absolute timeout, so our filter refuses a busy session at 8:01."
detail = """
The settings: spring.session.timeout is 2 seconds, short so the demo can wait for it, and the absolute timeout is 8 hours, enforced by a filter of our own.
Redis gives the record a time to live of the idle timeout plus five minutes, at most 2 + 300 = 302 seconds.
Idle: 1 second after Ana's last request she is allowed; 2.5 seconds after, she is refused with 401. The dead record is still in Redis, but no live record is left.
Absolute: Ana stays busy and the bank's clock is moved forward. At 7:59 after sign-in she is allowed; at 8:01 she is refused, because the session's creation time plus 8:00 is before now, and the filter ends it.
"""
figure = "timeouts"
figure_title = "Two limits, and what Redis keeps"
figure_speech = """
Third demo: how long a session lives. [[slnc 400]] Top left, the idle limit. [[slnc 300]] For the demo it is two seconds, so we can wait for it. [[slnc 300]] One second after the last request, Ana is allowed. [[slnc 300]] Two and a half seconds after, she is refused. [[slnc 700]]
Top right, what Redis does. [[slnc 300]] It keeps the record for the idle limit plus three hundred seconds. [[slnc 300]] So the data of an ended session stays five more minutes, though the bank no longer opens it. [[slnc 700]]
At the bottom, the absolute limit. [[slnc 300]] Spring Session does not have one. [[slnc 300]] A busy session would live for ever. [[slnc 300]] So a small filter of our own compares the session's creation time plus eight hours with the clock. [[slnc 300]] At seven fifty nine, allowed. [[slnc 300]] At eight oh one, refused.
"""
speech = """
Here is the output. [[slnc 400]] The settings: two idle seconds for the demo, and eight hours in all. [[slnc 400]] Redis keeps the record at most three hundred and two seconds. [[slnc 400]] Idle for one second: allowed. [[slnc 300]] Two and a half: refused. [[slnc 300]] The dead record is still in Redis, but nothing live.
[[page]]
The busy session, with the clock moved forward. [[slnc 300]] At seven fifty nine, allowed. [[slnc 300]] At eight oh one, refused, because creation time plus eight hours is in the past.
"""
rows = { timeouts = "active ok" }
console = [
