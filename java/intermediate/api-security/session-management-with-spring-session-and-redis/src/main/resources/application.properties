server.port=0
server.address=127.0.0.1
spring.main.banner-mode=off
logging.level.root=OFF
# Sessions live in Redis; the idle timeout is kept short so the demo can wait for it.
spring.session.timeout=2s
spring.session.data.redis.repository-type=indexed
spring.data.redis.host=127.0.0.1
spring.data.redis.timeout=1s
spring.data.redis.connect-timeout=1s
bank.absolute-timeout=8h
bank.fixation=change
bank.max-sessions=-1
bank.save-requests=false
