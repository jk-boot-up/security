[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] Everything runs in plain Java, with a clock that moves only when the demo moves it. [[slnc 300]] Here are the classes that matter."""

[[class]]
name = "SessionIds"
what = "random ids, and the hash the store keeps"
[[class.part]]
title = "16 random bytes, then SHA-256"
code = """
byte[] bytes = new byte[BITS / 8];
RANDOM.nextBytes(bytes);
return encode(bytes);
...
MessageDigest sha256 = MessageDigest.getInstance("SHA-256");
return sha256.digest(id.getBytes(StandardCharsets.UTF_8));
"""
speech = """A new id is sixteen bytes from Secure Random, written as base sixty four U R L. [[slnc 300]] The store only ever sees the id's S H A two fifty six hash."""

[[class]]
name = "Base64Steps"
what = "base64url redone by hand, to show the steps"
[[class.part]]
title = "6 bits, one character"
code = """
for (int i = 0; i < bits.length(); i += 6) {
    String group = bits.substring(i, Math.min(i + 6, bits.length()));
...
out.append(SessionIds.ALPHABET.charAt(Integer.parseInt(group, 2)));
"""
speech = """This teaching class cuts the bits into groups of six, and picks one character for each group. [[slnc 300]] A test proves it gives exactly the library's result."""

[[class]]
name = "SessionManager"
what = "every rule: lookup, rotation, timeouts, sign-out"
[[class.part]]
title = "found by the hash, in constant time"
code = """
byte[] hash = SessionIds.hash(id);
Session session = store.get(SessionIds.key(hash));
boolean same = session != null && MessageDigest.isEqual(session.idHash, hash);
return same ? session : null;
"""
speech = """An id is found by its hash. [[slnc 300]] The hashes are compared in constant time, so the answer's timing gives nothing away."""
[[class.part]]
title = "a new id at sign-in"
code = """
if (settings.rotate() || current == null) {
    remove(currentId);
    id = create(user, now);
"""
speech = """At sign in, the visitor's session is removed, and a new id is created. [[slnc 300]] A planted id dies here. [[slnc 300]] The rotate setting is what the fixation demo turned off."""
[[class.part]]
title = "two timeouts"
code = """
if (now - session.lastSeenAt >= settings.idleSeconds()) {
    remove(id);
    return Answer.IDLE_EXPIRED;
}
if (now - session.createdAt >= settings.absoluteSeconds()) {
"""
speech = """Every request checks both clocks. [[slnc 300]] Time since the last request against the idle limit, and time since sign in against the absolute limit. [[slnc 300]] A session that ran out is deleted."""
[[class.part]]
title = "the password again for a payment"
code = """
long sincePassword = clock.now() - find(id).authenticatedAt;
if (sincePassword > settings.reauthSeconds()) {
    return Answer.REAUTH_REQUIRED;
}
return Answer.ALLOWED;
"""
speech = """A payment also checks when the password was last given. [[slnc 300]] More than five minutes ago, and the bank asks for it again."""
[[class.part]]
title = "sign out everywhere"
code = """
synchronized int signOutEverywhere(String user) {
    return store.removeIf(e -> user.equals(e.getValue().user));
"""
speech = """Sign out everywhere removes every session of that customer from the store. [[slnc 300]] Every copy of every cookie stops working at once."""

[[class]]
name = "Cookies"
what = "the session cookie, with every protecting attribute"
[[class.part]]
title = "the Set-Cookie value"
code = """
static final String NAME = "__Host-session";
...
return NAME + "=" + id + "; Path=/; Secure; HttpOnly; SameSite=Strict";
"""
speech = """The cookie's name carries the double underscore Host prefix, and the value carries secure, H T T P only and same site strict."""

[[class]]
name = "BankServer"
what = "the bank's pages on a real local HTTP server"
[[class.part]]
title = "sign-out ends it on the server"
code = """
sessions.signOut(sessionId(exchange));
exchange.getResponseHeaders().add("Set-Cookie", Cookies.forget());
"""
speech = """Sign out does two things. [[slnc 300]] It removes the session from the store, and only then tells the browser to forget the cookie."""

[[acronym]]
short = "SHA-256"
long = "Secure Hash Algorithm, 256 bits: a fingerprint that cannot be reversed"
say = "S H A two fifty six is the secure hash algorithm with a two hundred and fifty six bit result. It turns any text into a fingerprint that cannot be turned back."
[[acronym]]
short = "hex"
long = "hexadecimal: each byte written as two characters, 0-9 and a-f"
say = "Hex, short for hexadecimal, writes each byte as two characters, from zero to nine and a to f."
[[acronym]]
short = "base64url"
long = "base 64 for URLs: 6 bits a character, from letters, digits, - and _"
say = "Base sixty four U R L writes six bits as one character, using letters, digits, dash and underscore, which are safe in a web address."
[[acronym]]
short = "URL"
long = "Uniform Resource Locator: a web address"
say = "U R L is uniform resource locator: a web address."
[[acronym]]
short = "HTTP, HTTPS"
long = "Hypertext Transfer Protocol; HTTPS is HTTP over an encrypted connection"
say = "H T T P is the hypertext transfer protocol, the language of the web. H T T P S is the same, over an encrypted connection."
[[acronym]]
short = "OK"
long = "status 200 means OK; status 401 means not signed in"
say = "Status two hundred means O K. Status four oh one means: not signed in."
[threatmodel]
scope = """
An online bank's session management: making, storing and checking session ids, rotation at sign-in and step-up, timeouts, sign-out and revocation, and the session cookie.
It does not cover how the password is checked beyond a salted hash, multi-factor authentication, or the transport, which is assumed to be HTTPS in production.
"""
assets = [
    "Live session ids, each as good as the customer's password while it lives.",
    "The session store.",
    "The customer's account and payments.",
]
actors = [
    "Ana, the customer.",
    "A stranger who guesses, plants or copies session ids.",
    "Someone who obtains a copy of the session store.",
]
boundaries = [
    "Browser to bank: every request carries an id that must be checked.",
    "Bank to session store: only hashes of ids cross it.",
]
assumptions = [
    "The connection is HTTPS in production, so the Secure cookie is never sent in the clear.",
    "The clock is trustworthy; in the demo it is simulated.",
    "In the demo, the password is a demo value and sessions are kept in memory.",
]
out_of_scope = [
    "Stealing the cookie through script injection: HttpOnly limits it, and the cross-site-scripting project covers the cause.",
    "Requests forged from other sites: the cross-site-request-forgery project.",
    "Shared session stores: the -with-spring-session-and-redis version.",
]
tests = [
    "`SessionIdsTest` checks the length and alphabet of ids, that many are distinct, SHA-256 against FIPS 180-2, that the store holds no live ids, and that base64url worked out by hand (`Base64Steps`) gives the library's exact result.",
    "`SessionManagerTest` checks rotation, fixation without it, step-up, both timeouts, re-authentication, sign-out, everywhere, password change, the limit and shared stores.",
    "`CookieAndServerTest` checks the cookie's attributes and the real local server's sign-in, sign-out and rotation.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next projects in api-security look at cross-origin access and the rest of an API's surface: request and response shapes and rate limits.
"""

[[threat]]
id = "T1"
stride = "S"
threat = "A session id is guessed"
where = "`SessionIds.newId`"
control = "128 bits from SecureRandom, with nothing from the user or the time"
residual = "None that is practical, as long as the random source is a secure one"

[[threat]]
id = "T2"
stride = "S"
threat = "A stranger plants a known id before the customer signs in (session fixation)"
where = "`SessionManager.signIn`, `SessionManager.stepUp`"
control = "A new id at every sign-in and step-up; the earlier id is removed"
residual = "A framework setting that turns rotation off brings the threat back, so it is tested"

[[threat]]
id = "T3"
stride = "E"
threat = "A copied or stolen id keeps working long after it was taken"
where = "`SessionManager.check`, `SessionManager.signOut`"
control = "Idle and absolute timeouts, sign-out on the server, sign-out everywhere and revocation on a password change"
residual = "A stolen id works until one of these ends it, so payments ask for the password again"

[[threat]]
id = "T4"
stride = "I"
threat = "The cookie is read by a script or sent over plain HTTP"
where = "`Cookies.sessionCookie`"
control = "Secure, HttpOnly, SameSite=Strict and the __Host- prefix"
residual = "Malware on the customer's device can still read cookies"

[[threat]]
id = "T5"
stride = "D"
threat = "Unlimited sessions per customer, or sessions that never end, fill the store"
where = "`SessionManager.enforceLimit`, `Settings`"
control = "A limit of three sessions per customer, and timeouts that delete expired sessions"
residual = "Visitor sessions need their own limits and cleanup in a real store"

[[threat]]
id = "T6"
stride = "I"
threat = "A copy of the session store gives live sessions"
where = "`SessionStore`"
control = "Only the SHA-256 of each id is stored, and lookups compare in constant time"
residual = "The store still reveals who is signed in and when, so it is protected like other customer data"
