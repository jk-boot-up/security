[[act]]
title = "Signing out, everywhere, and the cookie"
summary = "On a real local server the cookie carries __Host-, Path=/, Secure, HttpOnly and SameSite=Strict with 0 problems; after sign-out a copy of the cookie gets 401; a sign-out that only clears the browser leaves the copy working; sign out everywhere, a password change and a limit of 3 end other sessions."
detail = """
On a real HTTP server on this machine's loopback address, the sign-in response has status 200 and sets the cookie __Host-session with Path=/, Secure, HttpOnly and SameSite=Strict: no problems. The account page with that cookie answers 200.
The sign-out response has status 200 and a Set-Cookie with Max-Age=0, which tells the browser to forget the cookie. A copy of the cookie made before sign-out, sent again, gets 401, because the server ended the session. A bank whose sign-out only clears the browser's cookie leaves the copy reading the account.
A weak cookie, SESSIONID with no attributes, has four problems: no Secure, no HttpOnly, no SameSite and no __Host- prefix.
Ana signed in on her phone, laptop and tablet: sign out everywhere ends 3 sessions. A password change on the laptop ends the 2 others and gives the laptop a new id. With a limit of 3 sessions, a fourth sign-in ends the oldest, the phone's.
"""
figure = "cookie_attributes"
figure_title = "What each cookie attribute does, and what sign-out must do"
figure_speech = """
Fourth demo: signing out, and the cookie. [[slnc 400]] Top left, the cookie the bank sets at sign in, attribute by attribute. [[slnc 300]] The name starts with double underscore Host, dash. [[slnc 300]] The browser then insists on the other rules: no domain, path slash, and secure. [[slnc 300]] Path slash sends it to every page of the bank. [[slnc 300]] Secure sends it only over H T T P S. [[slnc 300]] H T T P only hides it from scripts. [[slnc 300]] And same site strict keeps other sites from sending it. [[slnc 700]]
Top right, a weak cookie with none of these. [[slnc 300]] Four problems. [[slnc 700]]
At the bottom, a copy of the cookie made before sign out. [[slnc 300]] On the left, the bank ended the session on the server. [[slnc 300]] The copy gets four oh one: not signed in. [[slnc 300]] On the right, sign out only cleared the browser. [[slnc 300]] The copy still works.
"""
