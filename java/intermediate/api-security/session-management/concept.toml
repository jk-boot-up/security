[[act]]
title = "The bill"
summary = "Two servers with separate session memories refuse each other's sessions and one shared store fixes it; a 20-minute pause costs a sign-in; a stolen id works for at most 15 idle minutes or 8 hours."
detail = """
Ana signs in on server A and her next request lands on server B. If each server keeps its own session memory, B refuses her: unknown session. With one store shared by both servers, B allows her; the -with-spring-session-and-redis version keeps that store in Redis.
A customer who stops for 20 minutes to read a statement must sign in again: the price of a short idle timeout.
A stolen id still works, but for at most 15 idle minutes or 8 hours in all, or until it is rotated or ended. And a wrong password never starts a session.
"""
figure = "two_servers"
figure_title = "Two servers, one session"
figure_speech = """
Fifth demo: the bill. [[slnc 400]] A real bank runs more than one server. [[slnc 300]] Ana signs in on server A. [[slnc 300]] Her next request happens to land on server B. [[slnc 700]]
On the left, each server keeps sessions in its own memory. [[slnc 300]] Server B has never heard of Ana's session, so it refuses her. [[slnc 700]]
On the right, both servers read and write one shared store. [[slnc 300]] Server B finds the session, and allows her. [[slnc 300]] That shared store is often Redis, which the next project uses. [[slnc 700]]
So server side sessions cost a shared store. [[slnc 300]] And short timeouts cost convenience, as the output shows next.
"""
speech = """
Here is the output. [[slnc 400]] With separate memories, server B answers: unknown session. [[slnc 300]] With one shared store, it answers: allowed. [[slnc 500]] A customer who reads a statement for twenty minutes must sign in again. [[slnc 300]] That is the price of a short timeout. [[slnc 500]] A stolen id still works, but for at most fifteen idle minutes, or eight hours. [[slnc 300]] And a wrong password starts no session.
"""
rows = { bill = "active amber" }
console = [
