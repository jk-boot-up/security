[readme]
intro = """
After a customer signs in, the bank does not ask for the password on every request. It hands the browser a **session id** in a cookie, and from then
on that id is all that proves who is asking. A session id is therefore as good as a password for as long as it lives, and session management is
about keeping that window small and safe.

The rules this project builds, one act each:
- A **random id**: 128 bits from `SecureRandom`, stored on the server only as its SHA-256, and compared in constant time.
- A **new id at every sign-in and step-up**, so an id that someone knew before the customer signed in is worthless after it (session fixation).
- **Idle and absolute timeouts**, and the password again for a payment.
- **Sign-out that ends the session on the server**, sign-out everywhere, sessions ended by a password change, and a limit on sessions. The cookie
  carries `Secure`, `HttpOnly`, `SameSite=Strict` and the `__Host-` prefix.

**Maps to:** OWASP Top 10 (2025) A07 Authentication Failures · CWE-384 Session Fixation · CWE-613 Insufficient Session Expiration · CWE-331
Insufficient Entropy · CWE-614 Sensitive Cookie Without Secure · CWE-1004 Sensitive Cookie Without HttpOnly · OWASP ASVS 5.0, the session management chapter.
"""
analogy = """
Think of a cloakroom ticket. Whoever holds it gets the coat, so the ticket must be impossible to guess, the cloakroom keeps only a record it can check
a ticket against, a new ticket is printed when a valuable coat is handed in, old tickets stop working at closing time, and a ticket handed back is
torn up, not just dropped in the customer's pocket.
"""
scenario = """
An online bank signs customers in and keeps them signed in with a session cookie. The demo runs the bank's session manager in process with a clock that
moves only when told, and once on a real HTTP server on this machine's loopback address. The customer is Ana, with a demo password.
"""
costs = [
    "**Server-side sessions need a store.** With more than one server, every server must see the same sessions, so the store is shared, for example in Redis.",
    "**Timeouts cost convenience.** A customer who stops for twenty minutes signs in again; the right numbers depend on what the session can do.",
    "**Asking for the password again adds friction** to every payment after the first few minutes.",
    "**A stolen id still works for a while.** Rotation, timeouts and sign-out limit how long, not whether, so the cookie's attributes and HTTPS matter too.",
]
too_much = """
Every site with sign-in needs random ids, rotation at sign-in, server-side sign-out and the cookie attributes; there is no smaller version. Absolute
timeouts, step-up for payments and session limits are for sites where a session can move money or change an account, such as a bank.
"""
met_before = [
    "Cookies named `JSESSIONID`, `__Host-session` or similar in a browser's developer tools.",
    "\"Your session has expired, please sign in again.\"",
    "\"Sign out of all other devices\" in account settings.",
    "Banking apps that ask for the password or a fingerprint again before a payment.",
]
where = """
This project is in [api-security](..) and builds on [authentication-vs-authorization](../../../beginner/identity/authentication-vs-authorization), which introduced
sessions and stale roles, and [http-basics-and-headers](../../../beginner/networking/http-basics-and-headers), which introduced cookie attributes.
"""
twin = """
The session manager runs in process with a clock that moves only when the demo moves it, so every timeout happens at the same moment on every run. One act
uses a real HTTP server on this machine's loopback address; the port is never printed. Session ids are random and are never printed either, so the demo
prints only facts that do not depend on them.
"""
test_note = "SHA-256 is checked against the FIPS 180-2 value for \"abc\". The clock is simulated and ids are never printed, so the output is the same on every run; the loopback server is tested with a real HTTP client."

[[act]]
title = "A session id: random, and never stored as itself"
summary = "An id is 128 random bits in 22 base64url characters, a thousand are all different, the store keeps only hashes so a copy of it opens no session, and a changed id is refused."
detail = """
A new session id is 128 bits from SecureRandom, written as 22 base64url characters, and a thousand new ids are all different. Ana's id does not contain her
name, a time or a counter: it is only randomness. The store keeps the SHA-256 of each id, so a stolen copy of its three keys, sent as cookies, opens no session.
Ana's real id reads her account; the same id with its last character changed is refused. The hash is compared in constant time, and ids are never printed or logged.
"""
speech = """
First demo: a session id. [[slnc 400]] A new id is one hundred and twenty eight random bits. [[slnc 300]] A thousand new ids are all different. [[slnc 600]]
It contains nothing about the customer. [[slnc 300]] No name, no time, no counter. [[slnc 600]]
The server stores only a hash of each id. [[slnc 300]] So a stolen copy of the store, sent back as cookies, opens no session at all. [[slnc 600]]
Ana's real id works. [[slnc 300]] The same id with one character changed is refused. [[slnc 300]] And no id is ever printed or logged.
"""
rows = { ids = "active ok" }
console = [
    ["a new session id is 128 bits from SecureRandom, written as 22 base64url characters: true", "ok"],
    ["1000 new ids, all different: true", "ok"],
    ["ana's id contains her name: false; it is made of randomness only, with no time or counter in it", "ok"],
    ["the store keeps the SHA-256 of each id; a stolen copy of its 3 keys, sent as cookies, opens 0 sessions", "ok"],
    ["the same id with its last character changed: refused: unknown session", "ok"],
    ["ids are never printed or logged: this output shows none", "muted"],
]

[[act]]
title = "A new id at every sign-in and step-up"
summary = "A bank that keeps the id at sign-in lets a stranger's planted id read Ana's account; a new id at sign-in and at step-up makes every earlier id worthless."
detail = """
A stranger opens the bank's site, gets an id for a visitor who has not signed in, and gets it into Ana's browser. A bank that keeps the id at sign-in makes
Ana's signed-in id the planted one, and the stranger's copy reads her account: session fixation. A bank that issues a new id at sign-in refuses the stranger's
copy and lets Ana's new id in. Before a payment Ana gives her password again, and the id changes again: the id from before the step-up is refused, and the new one pays.
"""
speech = """
Second demo: a new id at every sign in. [[slnc 400]] A stranger gets an id from the bank, before signing in, and gets it into Ana's browser. [[slnc 600]]
Ana signs in. [[slnc 300]] A bank that keeps the same id has just signed in the stranger's copy too. [[slnc 300]] The stranger reads her account. [[slnc 300]] That is session fixation. [[slnc 600]]
A bank that issues a new id at sign in refuses the stranger's copy. [[slnc 600]]
And before a payment, Ana gives her password again, and the id changes again. [[slnc 300]] The id from before is refused.
"""
rows = { rotate = "active ok" }
console = [
    ["a stranger gets an id for a visitor who has not signed in, and gets it into ana's browser", "muted"],
    ["a bank that keeps the id at sign-in: ana's id after signing in is the planted one: true", "bad"],
    ["the stranger's copy now reads ana's account: allowed  <- SESSION FIXATION", "bad"],
    ["a bank that issues a new id at sign-in: the stranger's copy: refused: unknown session, and ana's new id: allowed", "ok"],
    ["before a payment ana gives her password again, and the id changes again: true", "ok"],
    ["the id from before the step-up: refused: unknown session, the new one pays: allowed", "ok"],
]

[[act]]
title = "How long a session lives"
summary = "Idle for 14 minutes is fine and 16 ends the session; a busy session ends at 8 hours after 47 requests; a payment after 6 minutes asks for the password again."
detail = """
The bank's settings are an idle timeout of 15 minutes, an absolute timeout of 8 hours, and the password again for a payment after 5 minutes. Ana idle for 14 minutes
is still signed in; idle for 16 more she is refused, and that id stays dead. A busy Ana with a request every 10 minutes gets 47 requests, and then at 8 hours
the session ends anyway. A payment 3 minutes after signing in is allowed; 6 minutes after, the bank asks for the password again, while reading the account still works.
"""
speech = """
Third demo: how long a session lives. [[slnc 400]] Fifteen idle minutes. [[slnc 300]] Eight hours at most. [[slnc 300]] And the password again for a payment, after five minutes. [[slnc 600]]
Idle for fourteen minutes, Ana is still signed in. [[slnc 300]] Idle for sixteen, the session is gone. [[slnc 600]]
Even a busy session ends. [[slnc 300]] A request every ten minutes, and at eight hours it ends anyway. [[slnc 600]]
A payment three minutes after signing in is allowed. [[slnc 300]] Six minutes after, the bank asks for the password again.
"""
rows = { timeouts = "active ok" }
console = [
    ["idle timeout 15 minutes, absolute timeout 8 hours, the password again for a payment after 5 minutes", "muted"],
    ["ana is idle for 14 minutes: allowed", "ok"],
    ["then idle for 16 minutes: refused: idle too long, sign in again", "ok"],
    ["ana stays busy, a request every 10 minutes: 47 requests allowed, then at 8 hours: refused: session too old, sign in again", "ok"],
    ["a payment 3 minutes after signing in: allowed", "ok"],
    ["a payment 6 minutes after signing in: asks for the password again; reading the account: allowed", "ok"],
]

[[act]]
title = "Signing out, everywhere, and the cookie"
summary = "On a real server the cookie has no problems, and a copy made before sign-out gets 401; a sign-out that only clears the cookie leaves the session alive; everywhere, password change and a limit end other sessions."
detail = """
On a real local server, signing in sets a __Host-session cookie with Path=/, Secure, HttpOnly and SameSite=Strict, with no problems found. The account page answers 200;
sign-out answers 200 and tells the browser to forget the cookie; and a copy of the cookie made before sign-out, sent again, gets 401, because the server ended the session.
A bank whose sign-out only clears the browser's cookie leaves the copy working. A cookie named SESSIONID with no attributes has four problems. Sign out everywhere ends
Ana's three sessions; a password change on the laptop ends the two others and gives the laptop a new id; and with a limit of three, a fourth sign-in ends the oldest.
"""
speech = """
Fourth demo: signing out. [[slnc 400]] On a real server, the session cookie has every protection, and no problems are found. [[slnc 600]]
Ana signs out. [[slnc 300]] A copy of her cookie, made before, is now refused. [[slnc 300]] The server ended the session, not only the browser. [[slnc 600]]
A bank that only clears the cookie leaves that copy working. [[slnc 600]]
Sign out everywhere ends all three of Ana's sessions. [[slnc 300]] A password change ends the others. [[slnc 300]] And a fourth sign in ends the oldest.
"""
rows = { signout = "active ok" }
console = [
    ["sign-in on a real local server: 200, cookie __Host-session with Path=/, Secure, HttpOnly, SameSite=Strict: problems 0", "ok"],
    ["sign-out: 200, and the browser is told to forget the cookie: true", "ok"],
    ["a copy of the cookie made before sign-out, sent again: 401  <- THE SERVER ENDED THE SESSION, NOT ONLY THE BROWSER", "ok"],
    ["a bank whose sign-out only clears the browser's cookie: the copy still reads the account: allowed  <- STILL SIGNED IN", "bad"],
    ["a cookie named SESSIONID with no attributes has 4 problems: no Secure, no HttpOnly, no SameSite, no __Host- prefix", "amber"],
    ["sign out everywhere ends 3 sessions; a password change ends 2 others; a fourth sign-in ends the oldest", "ok"],
]

[[act]]
title = "The bill"
summary = "Two servers with separate session memories refuse each other's sessions; a shared store fixes it; a 20-minute pause costs a sign-in."
detail = """
Two servers, each with its own session memory: Ana signs in on A and her next request lands on B, which refuses it. With one store shared by both servers it is allowed;
the -with-spring-session-and-redis version keeps that store in Redis. A customer who stops for 20 minutes to read a statement must sign in again: the price of a short timeout.
A stolen id works only until it is rotated, times out or is ended, which is what these rules limit. And a session only starts after the right password.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] Two servers, each with its own memory of sessions. [[slnc 300]] Ana signs in on one, and her next request lands on the other. [[slnc 300]] Refused. [[slnc 600]]
With one store, shared by both servers, it works. [[slnc 300]] In practice that store is often Redis. [[slnc 600]]
And a customer who stops for twenty minutes, to read a statement, must sign in again. [[slnc 300]] That is the price of a short timeout. [[slnc 600]]
These rules do not make a stolen id useless. [[slnc 300]] They limit how long it works.
"""
rows = { bill = "active amber" }
console = [
    ["two servers, each with its own session memory: ana signs in on A, her next request lands on B: refused: unknown session  <- NEEDS A SHARED STORE", "bad"],
    ["with one store shared by both servers: allowed; the -with-spring-session-and-redis version keeps it in Redis", "ok"],
    ["a customer who stops for 20 minutes to read a statement: refused: idle too long, sign in again  <- THE PRICE OF A SHORT TIMEOUT", "amber"],
    ["a stolen id works only until it is rotated, times out or is ended: at most 15 idle minutes or 8 hours here", "amber"],
    ["and a session only starts after the right password: a wrong one gives a session: false", "ok"],
]

