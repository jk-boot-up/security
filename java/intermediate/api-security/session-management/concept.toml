[docs.explained]
sentence = """
A session id is as good as a password while it lives, so it must be random and stored only as a hash, replaced at every sign-in and step-up, ended by idle and
absolute timeouts, and ended on the server at sign-out, everywhere and after a password change, carried in a Secure, HttpOnly, SameSite cookie.
"""
verdict = """
Use the framework's session management where there is one, and check that it rotates the id at sign-in, expires sessions on the server, and sets the cookie attributes.
Choose timeouts by what a session can do, ask for the password again before payments, and give customers a way to sign out everywhere.
"""
recognise = [
    "`changeSessionId()` or \"session fixation protection\" settings in web frameworks.",
    "`server.servlet.session.timeout` and similar settings.",
    "Cookies with the `__Host-` prefix.",
    "Pen-test findings titled \"session not invalidated on logout\", CWE-613.",
]

[spec]
purpose = """
Teach session management by building an online bank's session manager: random ids stored as hashes, rotation at sign-in and step-up, idle and absolute timeouts,
server-side sign-out with sign-out everywhere, password-change revocation and a session limit, and a safe session cookie.
"""
nongoals = [
    "Token-based sessions such as JWTs: the jwt-done-right project.",
    "A shared session store in Redis: the -with-spring-session-and-redis version.",
    "Multi-factor authentication: the totp-multi-factor project.",
]
problem = """
Sessions are often treated as plumbing, so ids are kept across sign-in, sessions never expire on the server, and sign-out only clears the browser.
"""
roles = [["Session ids and their hashes", "`SessionIds`"], ["The session manager", "`SessionManager`"], ["Where sessions are kept", "`SessionStore`"], ["Timeouts and limits", "`Settings`"], ["The session cookie", "`Cookies`"], ["A browser's cookie jar", "`Browser`"], ["The real local server and client", "`BankServer`, `BankClient`"], ["Entry point", "`SessionDemo`"]]
requirements = [
    "Ids are 128 random bits and the store holds only their SHA-256.",
    "Sign-in and step-up issue a new id, and the earlier id is refused.",
    "Idle and absolute timeouts end sessions at the configured times, and payments need a recent password.",
    "Sign-out, sign-out everywhere and a password change end sessions on the server, and a fourth session ends the oldest.",
    "The session cookie has no missing attributes, on a real local server.",
    "The demo prints the same output on every run.",
]

