kind = "poster"
title = "Session Management"
narration = """Hello, and welcome. [[slnc 400]] This video explains session management, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] After a customer signs in, the site hands the browser a session id, in a cookie. [[slnc 300]] From then on, that id is all that proves who is asking. [[slnc 600]] Think of a cloakroom ticket. [[slnc 300]] Whoever holds it gets the coat. [[slnc 300]] So it must be impossible to guess, replaced when something valuable is handed in, and torn up when it is handed back. [[slnc 700]] In this video, the domain is an online bank. [[slnc 500]] By the end, you will hear how to make and store session ids. [[slnc 300]] Why a new id is needed at sign in. [[slnc 300]] How long a session should live. [[slnc 300]] And what signing out must really do."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online bank keeps Ana signed in", "with a session cookie.", "", "Whoever presents her session id", "is treated as Ana,", "including for payments."]
narration = """Here is the scenario. [[slnc 400]] An online bank keeps Ana signed in, with a session cookie. [[slnc 500]] Whoever presents her session id is treated as Ana. [[slnc 300]] Including for payments. [[slnc 600]] So the id is as good as her password, for as long as it lives."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["Session id: the value that keeps a customer signed in", "Rotation: issuing a new id", "Session fixation: making a victim use a known id", "Idle and absolute timeouts", "Step-up: the password again for a sensitive action"]
narration = """Before the demos, the words. [[slnc 500]] A session id is the value that keeps a customer signed in. [[slnc 500]] Rotation means issuing a new id. [[slnc 500]] Session fixation means getting a victim to sign in with an id the attacker already knows. [[slnc 500]] An idle timeout ends a session that is not used, and an absolute timeout ends any session after a fixed time. [[slnc 500]] And step up means asking for the password again, before something sensitive."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "09-ladder"
kind = "bullets"
title = "Four Rules for a Session"
body = ["Random, and stored as a hash", "New at every sign-in and step-up", "Ended by idle and absolute timeouts", "Ended on the server at sign-out"]
narration = """Let's put it together. [[slnc 400]] The id is random, and stored only as a hash. [[slnc 500]] It is replaced at every sign in, and every step up. [[slnc 500]] It ends after idle and absolute timeouts. [[slnc 500]] And it ends on the server, at sign out, everywhere, and after a password change."""

[[scene]]
key = "10-roles"
kind = "bullets"
title = "Who Does What"
body = ["SessionIds: random ids and their hashes", "SessionManager: every rule", "SessionStore: sessions by hash", "Cookies: the cookie and its check", "BankServer: the real local server"]
narration = """Here is who does what in the code. [[slnc 400]] The session ids class makes random ids, and their hashes. [[slnc 500]] The session manager holds every rule. [[slnc 500]] The session store keeps sessions by the hash of their id. [[slnc 500]] The cookies class writes the session cookie and checks one. [[slnc 300]] And the bank server is the real server on this machine."""

[[scene]]
key = "11-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Session cookies in developer tools", "\"Your session has expired\"", "\"Sign out of all other devices\"", "The password again before a payment"]
narration = """You have probably met this already. [[slnc 400]] Session cookies show up in every browser's developer tools. [[slnc 500]] Sites say, your session has expired, please sign in again. [[slnc 500]] Account settings offer, sign out of all other devices. [[slnc 500]] And banking apps ask for the password again, before a payment."""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Use the framework's sessions, and check them", "A new id at sign-in", "Timeouts by what a session can do", "Sign out on the server, everywhere", "Secure, HttpOnly, SameSite, __Host-"]
narration = """So, how do you use it? [[slnc 400]] Use the framework's session management, and check what it does. [[slnc 500]] Make sure it issues a new id at sign in. [[slnc 500]] Choose timeouts by what a session can do. [[slnc 500]] Sign out on the server, and offer sign out everywhere. [[slnc 500]] And give the cookie every protection it can carry."""

[[scene]]
key = "13-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Make payments shorten", "the idle timeout, and test it."]
narration = """That's session management. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] A session id is a password the server hands out, so make it random, replace it at sign in, and end it on the server. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine, with nothing installed except a Java development kit. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Make a payment shorten the idle timeout, and test it. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
An online bank's session management: making, storing and checking session ids, rotation at sign-in and step-up, timeouts, sign-out and revocation, and the session cookie.
It does not cover how the password is checked beyond a salted hash, multi-factor authentication, or the transport, which is assumed to be HTTPS in production.
"""
assets = [
    "Live session ids, each as good as the customer's password while it lives.",
    "The session store.",
    "The customer's account and payments.",
]
actors = [
    "Ana, the customer.",
    "A stranger who guesses, plants or copies session ids.",
    "Someone who obtains a copy of the session store.",
]
boundaries = [
    "Browser to bank: every request carries an id that must be checked.",
    "Bank to session store: only hashes of ids cross it.",
]
assumptions = [
    "The connection is HTTPS in production, so the Secure cookie is never sent in the clear.",
    "The clock is trustworthy; in the demo it is simulated.",
    "In the demo, the password is a demo value and sessions are kept in memory.",
]
out_of_scope = [
    "Stealing the cookie through script injection: HttpOnly limits it, and the cross-site-scripting project covers the cause.",
    "Requests forged from other sites: the cross-site-request-forgery project.",
    "Shared session stores: the -with-spring-session-and-redis version.",
]
tests = [
    "`SessionIdsTest` checks the length and alphabet of ids, that many are distinct, SHA-256 against FIPS 180-2, and that the store holds no live ids.",
    "`SessionManagerTest` checks rotation, fixation without it, step-up, both timeouts, re-authentication, sign-out, everywhere, password change, the limit and shared stores.",
    "`CookieAndServerTest` checks the cookie's attributes and the real local server's sign-in, sign-out and rotation.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next projects in api-security look at cross-origin access and the rest of an API's surface: request and response shapes and rate limits.
"""

[[threat]]
id = "T1"
stride = "S"
threat = "A session id is guessed"
where = "`SessionIds.newId`"
control = "128 bits from SecureRandom, with nothing from the user or the time"
residual = "None that is practical, as long as the random source is a secure one"

[[threat]]
id = "T2"
stride = "S"
threat = "A stranger plants a known id before the customer signs in (session fixation)"
where = "`SessionManager.signIn`, `SessionManager.stepUp`"
control = "A new id at every sign-in and step-up; the earlier id is removed"
residual = "A framework setting that turns rotation off brings the threat back, so it is tested"

[[threat]]
id = "T3"
stride = "E"
threat = "A copied or stolen id keeps working long after it was taken"
where = "`SessionManager.check`, `SessionManager.signOut`"
control = "Idle and absolute timeouts, sign-out on the server, sign-out everywhere and revocation on a password change"
residual = "A stolen id works until one of these ends it, so payments ask for the password again"

[[threat]]
id = "T4"
stride = "I"
threat = "The cookie is read by a script or sent over plain HTTP"
where = "`Cookies.sessionCookie`"
control = "Secure, HttpOnly, SameSite=Strict and the __Host- prefix"
residual = "Malware on the customer's device can still read cookies"

[[threat]]
id = "T5"
stride = "D"
threat = "Unlimited sessions per customer, or sessions that never end, fill the store"
where = "`SessionManager.enforceLimit`, `Settings`"
control = "A limit of three sessions per customer, and timeouts that delete expired sessions"
residual = "Visitor sessions need their own limits and cleanup in a real store"

[[threat]]
id = "T6"
stride = "I"
threat = "A copy of the session store gives live sessions"
where = "`SessionStore`"
control = "Only the SHA-256 of each id is stored, and lookups compare in constant time"
residual = "The store still reveals who is signed in and when, so it is protected like other customer data"
