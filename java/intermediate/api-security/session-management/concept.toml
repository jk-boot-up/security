[[act]]
title = "A session id: random, and never stored as itself"
summary = "Sixteen random bytes become a 22-character base64url id, 6 bits a character; the store keeps only the id's SHA-256, so a stolen copy of its 3 keys opens 0 sessions, and an id with one character changed is refused."
detail = """
A session id starts as 16 random bytes, 128 bits, from SecureRandom. The demo shows the steps on 16 fixed example bytes: base64url reads the bits as one row and cuts it into groups of 6, and each group, a number from 0 to 63, picks one of 64 characters, so the first 3 bytes, 4f 1a 9c, become Txqc and all 16 become the 22-character id TxqcJ9PosFpsH3LppNA7jg.
The store never keeps the id. It keeps the id's SHA-256, 64 hex characters, as the key of the session. Real ids are random: a thousand are all different, and none contains the customer's name, a time or a counter.
A stolen copy of the store's three keys, sent back as cookies, opens no session, because the bank hashes what arrives and the hash of a hash matches nothing. Ana's real id reads her account; the same id with its last character changed is refused. Hashes are compared in constant time, and ids are never printed or logged.
"""
figure = "id_encoding"
figure_title = "Sixteen bytes become a 22-character id"
figure_speech = """
First demo: a session id, made step by step. [[slnc 400]] At the top, sixteen bytes. [[slnc 300]] Sixteen times eight is one hundred and twenty eight bits. [[slnc 300]] A real id takes them from Secure Random. [[slnc 300]] This example is fixed, so the numbers are the same on every run. [[slnc 700]]
A cookie can only carry text, so the bytes are written as base sixty four U R L. [[slnc 300]] Take the first three bytes: twenty four bits, read as one row. [[slnc 300]] Cut the row into four groups of six bits. [[slnc 300]] Each group is a number from zero to sixty three, and picks one of sixty four characters: letters, digits, dash and underscore. [[slnc 300]] Here, T, x, q and c. [[slnc 700]]
All sixteen bytes become twenty two characters. [[slnc 300]] That is the id the browser keeps. [[slnc 700]]
On the right, what the bank keeps: not the id, but its S H A two fifty six hash, sixty four hex characters. [[slnc 300]] The hash cannot be turned back into the id.
"""
speech = """
Here is the real output. [[slnc 400]] Before encoding: the sixteen example bytes. [[slnc 400]] The first three bytes as bits, cut into groups of six, each group one character. [[slnc 400]] After encoding: the twenty two character id. [[slnc 400]] And what the store keeps: its S H A two fifty six, in hex.
[[page]]
The real ids, from Secure Random, are never printed. [[slnc 300]] A thousand are all different, and none contains Ana's name. [[slnc 500]] The request: a stolen copy of the store's three keys, sent as cookies. [[slnc 300]] The answer: zero sessions opened. [[slnc 500]] Ana's own id is allowed. [[slnc 300]] With one character changed, it is refused.
"""
rows = { ids = "active ok" }
console = [
    ["BEFORE ENCODING (16 example bytes; real ones are random):", "code"],
    ["  4f 1a 9c 27 d3 e8 b0 5a 6c 1f 72 e9 a4 d0 3b 8e  (128 bits)", "muted"],
    ["HOW BASE64URL WORKS (the first 3 bytes, 24 bits):", "code"],
    ["  01001111 00011010 10011100", "muted"],
    ["  cut into 6 bits a character: 010011=T 110001=x 101010=q 011100=c", "muted"],
    ["AFTER ENCODING (the id the browser keeps):", "code"],
    ["  TxqcJ9PosFpsH3LppNA7jg  (22 characters)", "muted"],
    ["WHAT THE STORE KEEPS (the SHA-256 of the id, in hex):", "code"],
    ["  c4bf610d8ed59215da093e1a54d4edc0d3d79a2993d7e93511e1b7276b9079e9", "muted"],
    ["---", ""],
    ["THE REAL IDS (from SecureRandom, never printed):", "code"],
    ["  a new id is 22 base64url characters: true", "muted"],
    ["  1000 new ids, all different: true", "muted"],
