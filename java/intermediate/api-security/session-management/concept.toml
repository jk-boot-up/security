[[act]]
title = "A new id at every sign-in and step-up"
summary = "A stranger plants a visitor id in Ana's browser; a bank that keeps the id at sign-in lets the stranger read her account (session fixation); a bank that issues a new id at sign-in and step-up refuses every earlier id."
detail = """
Before Ana signs in, a stranger asks the bank for a visitor id, called planted here, and gets it into Ana's browser, for example through a link or a shared computer.
After sign-in, a bank that keeps the id leaves Ana with the planted id: the stranger sends it and reads her account. That is session fixation.
After sign-in, a bank that issues a new id gives Ana a new one: the stranger's planted id is refused, and Ana's new id is allowed. Before a payment Ana gives her password again, a step-up, and the id changes once more: the id from before is refused, and the newer one pays.
"""
figure = "fixation"
figure_title = "The same planted id, two banks"
figure_speech = """
Second demo: session fixation. [[slnc 400]] At the top, what happens before Ana signs in. [[slnc 300]] A stranger asks the bank for an id, as any visitor can. [[slnc 300]] Then gets that id into Ana's browser, for example through a link, or a shared computer. [[slnc 700]]
On the left, a bank that keeps the id when Ana signs in. [[slnc 300]] Her id is still the planted one. [[slnc 300]] The stranger knows it. [[slnc 300]] So the stranger's requests are now Ana's requests, and they read her account. [[slnc 700]]
On the right, a bank that issues a new id at sign in. [[slnc 300]] Ana gets a new id the stranger has never seen. [[slnc 300]] The planted id is removed, and refused. [[slnc 700]]
The rule is simple. [[slnc 300]] Whenever trust goes up, at sign in and at step up, the id changes.
"""
speech = """
Here is the output. [[slnc 400]] Before Ana signs in: the stranger's planted id goes into her browser. [[slnc 400]] After sign in, at a bank that keeps the id: Ana still has the planted id, and the stranger is allowed. [[slnc 300]] Session fixation.
[[page]]
After sign in, at a bank that issues a new id: the planted id is refused, and Ana's new id is allowed. [[slnc 500]] After the step up before a payment, the id changes again. [[slnc 300]] The id from before is refused, and the newer one pays.
"""
rows = { rotate = "active ok" }
console = [
    ["BEFORE ANA SIGNS IN:", "code"],
    ["  a stranger asks the bank for a visitor id: <planted>", "muted"],
    ["  and gets <planted> into ana's browser", "muted"],
    ["AFTER SIGN-IN, A BANK THAT KEEPS THE ID:", "code"],
    ["  ana's id is still <planted>: true", "muted"],
    ["  the stranger sends <planted>: allowed  <- SESSION FIXATION", "bad"],
    ["---", ""],
    ["AFTER SIGN-IN, A BANK THAT ISSUES A NEW ID:", "code"],
    ["  ana's id is still <planted>: false; she now has <new>", "muted"],
    ["  the stranger sends <planted>: refused: unknown session", "muted"],
    ["  ana sends <new>: allowed", "muted"],
    ["AFTER STEP-UP (the password again before a payment):", "code"],
    ["  ana's id is still <new>: false; she now has <newer>", "muted"],
    ["  <new> is sent: refused: unknown session", "muted"],
    ["  <newer> makes a payment: allowed", "muted"],
]

[[act]]
title = "How long a session lives"
summary = "Idle for 14 minutes is fine and 16 ends the session; a busy session ends at 8:00, because 480 minutes over 10 puts request 48 at the limit; a payment 6 minutes after the password asks for it again."
detail = """
The bank's settings: an idle timeout of 15 minutes without a request, an absolute timeout of 8 hours after sign-in whether busy or not, and the password again for a payment 5 minutes after it was given.
Idle: after 14 minutes Ana is still allowed; after 16 more she is refused, and that id stays dead.
Absolute: with a request every 10 minutes, 8 hours is 480 minutes and 480 / 10 = 48, so requests 1 to 47, from 0:10 to 7:50, are allowed and request 48, at 8:00, is refused.
Payments: 3 minutes after the password a payment is allowed; at 6 minutes the bank asks for the password again, while reading the account still works.
"""
figure = "lifetimes"
figure_title = "Three clocks on one session"
figure_speech = """
Third demo: how long a session lives. [[slnc 400]] Three clocks run on every session. [[slnc 700]]
Top left, the idle clock. [[slnc 300]] It counts minutes since the last request. [[slnc 300]] The limit is fifteen. [[slnc 300]] At fourteen, Ana is still in. [[slnc 300]] At sixteen, the session is gone, and she signs in again. [[slnc 700]]
Top right, the payment clock. [[slnc 300]] It counts minutes since Ana last gave her password. [[slnc 300]] Within five minutes, a payment is allowed. [[slnc 300]] After that, the bank asks for the password again. [[slnc 700]]
At the bottom, the absolute clock. [[slnc 300]] Ana stays busy, with a request every ten minutes, so the idle clock never runs out. [[slnc 300]] Eight hours is four hundred and eighty minutes. [[slnc 300]] Divided by ten, request forty eight lands exactly at eight hours. [[slnc 300]] Forty seven green requests, then a red one. [[slnc 300]] Even a busy session ends.
"""
speech = """
Here is the output. [[slnc 400]] The settings: fifteen idle minutes, eight hours in all, and the password again for a payment after five minutes. [[slnc 400]] Idle for fourteen minutes: allowed. [[slnc 300]] Sixteen: refused. [[slnc 300]] And the id stays dead.
[[page]]
The busy session. [[slnc 300]] Four hundred and eighty minutes, divided by ten, puts request forty eight at eight o'clock. [[slnc 300]] Forty seven are allowed, and the forty eighth is refused. [[slnc 500]] Payments: at three minutes, allowed. [[slnc 300]] At six, the password again. [[slnc 300]] Reading the account still works.
