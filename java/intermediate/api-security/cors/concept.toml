[threatmodel]
scope = """
A bank API that is called from partner pages in browsers. It covers the CORS headers it sends and what the browser lets a page do with them.
It does not cover CSRF defences, authentication, or server-to-server calls.
"""
assets = [
    "Account data returned to a logged-in customer.",
    "The customer's session cookie, attached to cross-origin requests when credentials are allowed.",
]
actors = [
    "A customer using the bank and a partner.",
    "An attacker whose page the customer visits.",
    "An attacker who registers a look-alike domain.",
]
boundaries = [
    "Page to browser: scripts from any site run in the customer's browser.",
    "Browser to API: Origin and cookie are attached, and the answer is shown to the page only if the API allows it.",
]
assumptions = [
    "The browser enforces the same-origin policy and the CORS rules as modelled.",
    "The session cookie is sent cross-site (SameSite=None) for the partner scenario.",
]
out_of_scope = [
    "CSRF defences: cross-site-request-forgery.",
    "Cross-site scripting on the partner's page.",
]
tests = [
    "`CorsTest` checks every policy against the partner, the attacker, a look-alike and null, preflight, the Vary header, the wildcard rule and same-origin calls.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next module, identity-and-access, follows how a user is recognised across the sites that this module lets talk to each other.
"""

[[threat]]
id = "T1"
stride = "I"
threat = "Any site reads the customer's account because the API reflects the Origin header"
where = "`CorsPolicy.REFLECT_ANY`"
control = "An exact, case-sensitive allow-list"
residual = "A listed partner that is itself compromised"

[[threat]]
id = "T2"
stride = "I"
threat = "A sandboxed page or local file reads the account because null is allowed"
where = "`CorsPolicy.exactAndNull`"
control = "null is never allowed with credentials"
residual = "None known in the model"

[[threat]]
id = "T3"
stride = "S"
threat = "A look-alike domain passes a suffix or prefix test"
where = "`CorsPolicy.suffix`"
control = "Compare the whole origin string with a list"
residual = "A takeover of a listed subdomain"

[[threat]]
id = "T4"
stride = "T"
threat = "CORS is mistaken for protection against forged requests"
where = "`Browser` (simple requests)"
control = "CSRF tokens, SameSite and Fetch Metadata checks, kept as separate controls"
residual = "A state-changing endpoint reachable by a simple request with no CSRF defence"

[poster]
headline = [["CORS", "text"], ["DONE RIGHT", "accent"]]
taglines = [["CORS decides who may read an answer, not who may send a request", "gold"]]
before = { code = "Access-Control-Allow-Origin: https://evil.example", note = "A reflected origin", tag = "BEFORE" }
after = { code = "Access-Control-Allow-Origin: https://partner.example", note = "An exact allow-list", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "CORS Done Right"
narration = "Hello, and welcome. [[slnc 400]] This video explains CORS, cross-origin resource sharing, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A browser lets a page on any site send many requests to your A P I. [[slnc 300]] But it lets that page read the answer only if your A P I names the page's site, its origin. [[slnc 300]] CORS is how the A P I names it. [[slnc 600]] Think of a bank teller who takes a letter from anyone, but reads the reply aloud only to people on a list. [[slnc 300]] The list must be exact, and it does not stop the letters. [[slnc 600]] Our example is a bank's A P I."

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["A bank API on https://bank.example:", "  /account needs the session cookie", "  /rates is public", "  /transfer moves money", "", "Pages from a partner, an attacker and a", "look-alike site run in the customer's browser.", "The cookie is SameSite=None, so it travels."]
narration = "Here is the scenario. [[slnc 400]] A bank's A P I lives on bank dot example. [[slnc 300]] Its account call needs the session cookie, its rates call is public, and its transfer call moves money. [[slnc 500]] Pages from a partner, an attacker, and a look-alike site all run in the same customer's browser. [[slnc 300]] The session cookie is marked same site none, so the browser sends it with their requests too. [[slnc 500]] The demo includes a small model of the browser's rules, so every step can be seen."

[[scene]]
key = "02-words"
kind = "bullets"
title = "The Words"
body = ["Origin: scheme + host + port of a page", "Same-origin policy: a page reads only its own", "Simple request: sent without asking first", "Preflight: an OPTIONS request that asks first", "Credentials: the cookie sent with a request", "Allow-list: the exact origins that may read"]
narration = """Before the demos, the words. [[slnc 500]] An origin is the scheme, the host and the port of a page's address. [[slnc 500]] The same-origin policy is the browser rule that a page may read answers only from its own origin. [[slnc 500]] A simple request is one the browser sends without asking first. [[slnc 500]] A preflight is an options request the browser sends first, to ask whether the real request is allowed. [[slnc 500]] Credentials are the cookies the browser attaches. [[slnc 500]] And an allow list is the exact set of origins that may read."""

[[scene]]
key = "02-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "02-read-gate"
kind = "figure"
title = "The browser sends; the bank decides who reads"
body = "read_gate"
narration = """Let's see the whole idea on one picture. [[slnc 400]] Three parts: the attacker's page, the customer's browser, and the bank's A P I. [[slnc 700]] First, sending. [[slnc 300]] The page asks for the account. [[slnc 300]] The browser sends the request, with the customer's cookie, and the bank runs it. [[slnc 700]] Then, reading. [[slnc 300]] The answer, with the balance, comes back to the browser. [[slnc 300]] The browser looks for one header: access control allow origin. [[slnc 300]] The bank sent none, so the browser keeps the answer from the page. [[slnc 700]] That is the whole of cors. [[slnc 300]] The bank tells the browser which other origins may read. [[slnc 300]] It never stops a request from being sent."""

[[scene]]
key = "03-acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "04-costs"
kind = "bullets"
title = "What It Costs"
body = ["An exact list needs upkeep", "Wildcard subdomains trust every subdomain", "A preflight adds a round trip", "Credentialed CORS needs a cross-site cookie", "Caches mix up answers without Vary: Origin"]
narration = "Nothing is free. [[slnc 400]] Here is what doing it right costs. [[slnc 500]] An exact list needs upkeep, every time a partner adds or moves a site. [[slnc 500]] Allowing every subdomain is easier, but trusts every page on every one of them. [[slnc 500]] A preflight adds a round trip before each request that is not simple. [[slnc 500]] Reading with cookies needs a cookie that is sent across sites, which weakens C S R F protection. [[slnc 300]] And without vary origin, a cache can hand one site's answer to another."

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Allow-Origin copied from the request's Origin", "Access-Control-Allow-Origin: null", "endsWith, startsWith or contains on the origin", "A scanner finding: CORS misconfiguration, CWE-942"]
narration = "You have probably met this already. [[slnc 400]] An allow origin header that copies whatever the request's origin says is the reflection from the third demo. [[slnc 500]] An allow origin header of null lets in sandboxed frames and local files, which an attacker can create. [[slnc 500]] Ends with, starts with, or contains, on the origin, lets in look-alike names. [[slnc 500]] And a scanner finding called CORS misconfiguration, C W E 942, is usually one of these three."

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Prefer the same origin, or server to server", "An exact, case-sensitive list from configuration", "Never reflect; never allow null", "Vary: Origin on every answer", "Only the methods and headers needed", "Wildcard only for public data without cookies", "CSRF defences as well"]
narration = "So, how do you use it? [[slnc 400]] Prefer serving the page from the same origin, or calling the A P I from your own server. [[slnc 500]] If you do need CORS, keep an exact, case-sensitive list of origins in configuration, and compare whole strings. [[slnc 300]] Never reflect the origin, and never allow null. [[slnc 500]] Send vary origin, and allow only the methods and headers you need. [[slnc 500]] Use a wildcard only for public data, without cookies. [[slnc 300]] And keep C S R F defences, because CORS does not stop a request from being sent."

[[scene]]
key = "12-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a second partner and test", "that a look-alike of each is blocked."]
narration = "That's CORS. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] CORS tells the browser which other sites may read an A P I's answers, so list those sites exactly, never reflect the origin or allow null, keep wildcards for public data without cookies, and use C S R F defences for forged requests. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a second partner, and a test that a look-alike of each is blocked. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] The bank and a small model of the browser are plain Java, so every run is the same. [[slnc 300]] Here are the classes that matter."""

[[class]]
name = "Origin"
what = "an origin: scheme, host and port"
[[class.part]]
title = "three parts, all equal"
code = """
int port = u.getPort() != -1 ? u.getPort()
        : u.getScheme().equals("https") ? 443 : 80;
...
return scheme.equals(other.scheme)
        && host.equals(other.host) && port == other.port;
"""
speech = """An origin is parsed into scheme, host and port. [[slnc 300]] A missing port is the scheme's default, four four three for H T T P S. [[slnc 300]] Two origins are the same only when all three parts are equal."""

[[class]]
name = "CorsPolicy"
what = "which origins the bank names in Access-Control-Allow-Origin"
[[class.part]]
title = "two unsafe policies, and the fix"
code = """
CorsPolicy REFLECT_ANY = origin ->
        origin == null ? Optional.empty() : Optional.of(origin);
...
return origin -> origin != null && origin.endsWith(suffix) // suffix
        ? Optional.of(origin) : Optional.empty();
...
return origin -> origin != null && origins.contains(origin) // exact
        ? Optional.of(origin) : Optional.empty();
"""
speech = """A policy turns the origin header into the value of allow origin, or nothing. [[slnc 300]] Reflect any copies the origin back. [[slnc 300]] The suffix policy tests the end of the name. [[slnc 300]] The fix looks the whole string up in a set, so only an exact match is named."""

[[class]]
name = "BankApi"
what = "the bank: runs requests, answers preflights, logs what it ran"
[[class.part]]
title = "the preflight and the log"
code = """
if (r.method().equals("OPTIONS")) {
    return preflight(r, origin); // no cookie, no bank code
}
processed.add(r.method() + " " + r.path()); // the log
...
.with("access-control-allow-methods", "GET, POST, PUT")
"""
speech = """An options request is a preflight, answered before any bank code runs. [[slnc 300]] Every other request is added to the log, and then run. [[slnc 300]] That log is how the demo shows the post that cors did not stop."""

[[class]]
name = "Browser"
what = "a model of the browser's send and read rules"
[[class.part]]
title = "simple requests, and the read check"
code = """
return SIMPLE_METHODS.contains(method)
        && (contentType == null || SIMPLE_TYPES.contains(contentType));
...
if (withCredentials) { // "*" is refused with cookies
    return allow.equals(pageOrigin)
            && "true".equals(r.header("access-control-allow-credentials"));
}
return allow.equals("*") || allow.equals(pageOrigin);
"""
speech = """A request is simple when its method and body type are on the browser's short lists. [[slnc 300]] Anything else gets a preflight first. [[slnc 300]] With cookies, allow origin must name the page and allow credentials must be true. [[slnc 300]] Without cookies, a star is enough."""

[[acronym]]
short = "CORS"
long = "Cross-Origin Resource Sharing: how an API lets other origins read"
say = "Cors, C O R S, is cross-origin resource sharing: how an A P I tells the browser which other origins may read its answers."
[[acronym]]
short = "API"
long = "Application Programming Interface: calls a program offers"
say = "A P I is application programming interface: the calls a program offers to other programs."
[[acronym]]
short = "HTTP, HTTPS"
long = "HyperText Transfer Protocol (Secure): how browsers talk to servers"
say = "H T T P is hypertext transfer protocol, how a browser talks to a server. H T T P S is the secure version, over an encrypted connection."
[[acronym]]
short = "JSON"
long = "JavaScript Object Notation: a text format for data"
say = "Jay son, J S O N, is JavaScript object notation: a text format for data."
[[acronym]]
short = "CSRF"
long = "Cross-Site Request Forgery: a forged request sent with the victim's cookie"
say = "C S R F is cross-site request forgery: another site makes the browser send a request, with the victim's cookie."
[[acronym]]
short = "CWE"
long = "Common Weakness Enumeration: CWE-942 is a too-permissive CORS policy"
say = "C W E is the common weakness enumeration. Number nine four two is a cors policy that trusts too much."
