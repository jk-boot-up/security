[[act]]
title = "Three policies that look like fixes"
summary = "Reflecting the origin lets every site read; a list that also allows null lets a sandboxed page read; a suffix test lets evilbank.example read, because its name ends with bank.example."
detail = """
Three policies that make the browser's error go away. Reflect whatever Origin arrives, with credentials: evil.example, evilbank.example and the null origin each get their own origin back, and all three read the balance.
A list with the partner that also allows null: evil.example and evilbank.example are blocked, but null is answered with null, and a sandboxed frame or a file opened locally, which an attacker can make, reads the balance.
A suffix test on bank.example: "https://evilbank.example".endsWith("bank.example") is true, so the look-alike reads the balance. Each policy works in a test with the partner's page and quietly includes the attacker's.
"""
figure = "bad_policies"
figure_title = "Three policies, three origins, who reads the balance"
figure_speech = """
Third demo: three policies that look like fixes. [[slnc 400]] Each column is one policy. [[slnc 300]] Each row is a page that sends its origin. [[slnc 300]] In each cell, the allow origin value the bank sends back, and whether the page reads the balance. [[slnc 700]]
Policy one copies whatever origin arrives. [[slnc 300]] Every page gets its own origin back, so every page reads. [[slnc 600]]
Policy two lists the partner, and also allows null. [[slnc 300]] Null is the origin of a sandboxed frame, or a file opened locally. [[slnc 300]] An attacker can make either, so the null page reads. [[slnc 600]]
Policy three tests the end of the name. [[slnc 300]] At the bottom, the test itself. [[slnc 300]] Evil bank dot example ends with bank dot example, so the look-alike reads. [[slnc 700]]
Each policy works in a test with the partner. [[slnc 300]] And each quietly includes the attacker.
"""
speech = """
Policy one: reflect any origin, with credentials. [[slnc 300]] Each origin is sent back as the allow origin. [[slnc 300]] All three pages read.
[[page]]
Policy two: the partner, and also null. [[slnc 300]] The attacker and the look-alike get nothing. [[slnc 300]] But the null origin gets null back, and reads.
