    { id = "req", label = "Request, Response", sub = ["headers"], col = 1, row = 1, colour = "amber" },
    { id = "res", label = "FetchResult", sub = ["reachedBank", "readable"], col = 2, row = 1, colour = "amber" },
]
edges = [
