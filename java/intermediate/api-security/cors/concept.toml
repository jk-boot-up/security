[[act]]
title = "With no CORS headers, a page may send but not read"
summary = "With no CORS headers, the attacker's page cannot read the account, but its simple POST to /transfer reaches the bank and runs; a JSON PUT needs a preflight, which fails, so it is never sent."
detail = """
A script on https://evil.example makes three requests with the customer's cookie. GET /account and POST /transfer with a text/plain body are simple requests: GET, HEAD or POST with a form or plain-text body, which the browser sends without asking. PUT with application/json is not simple.
For the PUT the browser first sends a preflight, OPTIONS /transfer with Access-Control-Request-Method: PUT and Access-Control-Request-Headers: content-type, without the cookie. The answer, 204, has no Access-Control-Allow-Origin, so the PUT is never sent.
The page reads nothing. But the bank's log shows GET /account and POST /transfer: the simple POST ran. CORS controls reading, and sending only for requests that are not simple; it is not a defence against forged requests. That is the job of the CSRF defences.
"""
figure = "send_not_read"
figure_title = "Sending is not reading"
figure_speech = """
Second demo: with no cors headers, a page may send, but not read. [[slnc 400]] The bank sends no cors headers at all. [[slnc 300]] A script on evil dot example makes three requests, and the browser attaches the customer's cookie. [[slnc 700]]
The first two are simple: get, head or post, with a form or plain text body. [[slnc 300]] The browser sends a simple request without asking. [[slnc 300]] Both reach the bank, and the bank runs them. [[slnc 300]] The page only loses the answer. [[slnc 700]]
The third is a put with a jay son body. [[slnc 300]] That is not simple, so the browser first asks the bank, with a preflight. [[slnc 300]] The answer names no origin, so the put is never sent. [[slnc 700]]
At the bottom, the bank's log. [[slnc 300]] The post to transfer ran. [[slnc 300]] Cors did not stop it. [[slnc 300]] Stopping forged requests is the job of the C S R F defences.
"""
