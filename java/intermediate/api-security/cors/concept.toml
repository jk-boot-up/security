[[act]]
title = "A wildcard and cookies never combine"
summary = "A browser refuses Access-Control-Allow-Origin: * for a request made with cookies, and accepts it for one without."
detail = """
Even if a server sends `*` together with `Access-Control-Allow-Credentials: true`, the browser refuses the answer for a request made with cookies, because with cookies Allow-Origin must equal the page's origin, and it accepts it for a request without cookies.
That is why teams that "need credentials and any origin" end up reflecting the Origin header, which is the unsafe policy from act three.
"""
figure = "wildcard_cookies"
figure_title = "The same answer, with and without cookies"
figure_speech = """
Fifth demo: a wildcard and cookies never combine. [[slnc 400]] At the top, one answer. [[slnc 300]] Allow origin is a star, which means any page. [[slnc 300]] And allow credentials is true. [[slnc 700]]
On the left, a request that carried the customer's cookie. [[slnc 300]] With cookies, the browser wants allow origin to name the page exactly. [[slnc 300]] A star is not a name, so the answer is refused. [[slnc 700]]
On the right, the same answer for a request without cookies. [[slnc 300]] Now the star means any page may read, and it is accepted. [[slnc 700]]
So a star is for public data only. [[slnc 300]] Teams that want cookies and any origin end up copying the origin back, which is policy one from the third demo.
"""
speech = """
Here is the output. [[slnc 400]] The answer has a star and credentials true. [[slnc 400]] For a request with cookies, the star does not equal the page's origin, so it is refused. [[slnc 400]] Without cookies, the star means any page, so it is accepted. [[slnc 300]] Needing both leads teams to reflecting, from demo three.
"""
rows = { star = "active ok" }
console = [
    ["THE ANSWER (the server sends both):", "code"],
    ["  Access-Control-Allow-Origin: *", "muted"],
    ["  Access-Control-Allow-Credentials: true", "muted"],
    ["THE BROWSER'S CHECK, A REQUEST WITH COOKIES:", "code"],
