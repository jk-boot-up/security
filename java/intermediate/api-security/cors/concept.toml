[[act]]
title = "An exact allow-list names one partner"
summary = "The list holds https://partner.example; the partner's preflight and GET are answered with its origin and credentials, the browser's check passes, and every other page is blocked; public rates use * without cookies; answers carry Vary: Origin."
detail = """
The fixed policy compares the Origin header as a whole string, case-sensitively, with a list that holds https://partner.example.
The partner's preflight for a JSON PUT is answered with its origin, Access-Control-Allow-Credentials: true, the methods GET, POST, PUT, the headers content-type and x-requested-with, and Max-Age 600, so the browser may cache the answer for ten minutes.
The partner's GET /account comes back with its origin, credentials true and Vary: Origin. The browser checks two things for a request with cookies: Allow-Origin equals the page's origin, and Allow-Credentials is true. Both hold, so the partner reads the balance and its PUT sends 500 to mallory.
evil.example, evilbank.example and the null origin get no CORS headers, so their reads are blocked, and the evil JSON PUT never reaches the bank. The public rates call uses *, which is fine for data read without cookies.
"""
figure = "exact_list"
figure_title = "One partner on the list, and what each page gets"
figure_speech = """
Fourth demo: an exact allow list. [[slnc 400]] Top left, the list. [[slnc 300]] One origin, the partner's. [[slnc 300]] The bank compares the origin it receives with the list, as a whole string, letter by letter. [[slnc 700]]
Below it, the browser's check, for the partner reading the account with the cookie. [[slnc 300]] Does allow origin equal the page's origin? [[slnc 300]] Yes. [[slnc 300]] Does allow credentials say true? [[slnc 300]] Yes. [[slnc 300]] So the page may read. [[slnc 700]]
On the right, what each page gets. [[slnc 300]] The partner reads the balance, and its put sends five hundred to mallory. [[slnc 300]] The attacker, the look-alike, and null are all blocked. [[slnc 300]] The attacker's put never reaches the bank. [[slnc 300]] And the public rates are readable by anyone, without cookies.
"""
speech = """
The input: the list, with one partner. [[slnc 300]] The partner asks first, with a preflight, before a jay son put. [[slnc 400]] The answer names the partner, allows credentials, three methods, two headers, and may be cached for six hundred seconds.
[[page]]
The partner's get account. [[slnc 300]] The answer names the partner, allows credentials, and says vary origin, so a cache keeps one copy for each origin. [[slnc 400]] The browser's check: both questions are yes, so the page may read.
[[page]]
What each page gets. [[slnc 300]] The partner reads, and sends. [[slnc 300]] Everyone else is blocked, and the attacker's put never reaches the bank. [[slnc 300]] Public rates are readable, with a star and no cookies.
"""
