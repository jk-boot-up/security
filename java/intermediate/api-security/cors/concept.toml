The preflight asks: may I send a put, with a content type header? [[slnc 300]] The answer is two hundred and four, with no allow origin header. [[slnc 400]] So the page gets nothing back, and the put never reaches the bank. [[slnc 400]] But the bank's log shows the post. [[slnc 300]] Cors did not stop it.
"""
