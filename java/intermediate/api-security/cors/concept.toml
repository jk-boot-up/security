# concept.toml: everything about this project that is not Java code.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "cors"
level = "intermediate"
module = "api-security"
title = "CORS Done Right"
short_title = "CORS"
package = "cors"
main_class = "CorsDemo"
tagline = "CORS decides who may read an answer, not who may send a request"
bold = "A browser lets any page send many requests to your API but lets it read the answer only if your API names that page's origin, so an allow-list must be exact, never reflect the Origin header, never allow null, and never be mistaken for a defence against forged requests."
domain = "a bank API"
domain_note = ""
youtube_description = "CORS in Java: what the same-origin policy does, how Access-Control-Allow-Origin is misconfigured, and an exact allow-list."
thumb_lines = ["CORS", "DONE RIGHT"]
thumb_code = "Access-Control-Allow-Origin"
youtube_title = "CORS Done Right: Reflected Origins, null and Exact Allow-Lists"
youtube_tags = ["cors", "same-origin policy", "access-control-allow-origin", "owasp", "java", "application security"]

[readme]
intro = """
A browser runs pages from many sites in one window. The **same-origin policy** keeps a page on evil.example from *reading* what your bank's API answers. But sometimes a partner's page really needs to read the API,
and **CORS** (cross-origin resource sharing) is how the API says so: it names the origin in `Access-Control-Allow-Origin`, and adds `Access-Control-Allow-Credentials: true` if cookies are involved.
Teams that hit the browser's error often "fix" it in the easiest way, and the easy ways are the unsafe ones.

What goes wrong, in the order this project shows it:
- **CORS is about reading, not sending.** A simple `POST` from any page still reaches the bank. CORS is not a CSRF defence.
- **Reflecting the `Origin` header** with credentials lets every site read the customer's account.
- **Allowing `null`** (an opaque origin sandboxed frames and local files have) lets an attacker's page read it too.
- **Matching a suffix or prefix** passes look-alike domains such as evilbank.example.

The defences:
- **An exact, case-sensitive allow-list** of origins, compared as whole strings.
- **`Vary: Origin`** so caches keep one answer for each origin.
- **A wildcard only for public data without cookies;** browsers refuse `*` with credentials.
- **Preflight answers that name only the methods and headers really needed.**

**Maps to:** OWASP Top 10 (2025) A02 Security Misconfiguration · CWE-942 · OWASP ASVS 5.0, the browser security and API chapters.
"""
analogy = """
Think of the same-origin policy as a rule that letters from other buildings may be opened only by their own recipient. CORS is the building's list of other buildings whose people may read its mail. Writing
"anyone who asks" on the list, or "anyone whose address ends in bank", or "anyone with no address at all" is how the mail gets read.
"""
scenario = """
A bank has an API on https://bank.example with an account call that needs the session cookie, a public rates call, and a transfer call. A partner site, an attacker's site and a look-alike site all run scripts in the customer's browser.
The demo includes a model of the browser rules (simple requests, preflight, reading the response, credentials) so every claim can be tested.
"""
costs = [
    "**An exact list needs upkeep.** Every new partner is a deploy or a config change, which is the point.",
    "**Wildcard subdomains are risky.** Allowing `*.partner.example` also allows any subdomain that has a takeover or user content.",
    "**Preflight adds a round trip,** which `Access-Control-Max-Age` reduces; browsers cap the cache time.",
    "**Credentialed CORS needs the cookie to be sent cross-site,** which SameSite=None requires, and which brings CSRF back as a concern.",
    "**Caches can mix up answers** unless `Vary: Origin` is set.",
]
too_much = """
If the partner can call your API from their server, no CORS is needed at all: a server-to-server call has no browser rules. And if the API and the page are on the same origin (or behind one reverse proxy), leave CORS off.
Do not "test" CORS by switching it to reflect everything on a shared environment.
"""
met_before = [
    "The browser console message \"has been blocked by CORS policy\".",
    "`Access-Control-Allow-Origin: *` on an API.",
    "`@CrossOrigin(origins = \"*\")` or a filter that copies the `Origin` header into the response.",
    "A finding titled \"Cross-Origin Resource Sharing Misconfiguration\" with CWE-942.",
]
where = """
This project is in [api-security](..). It builds on [cross-site-request-forgery](../../web-security/cross-site-request-forgery), which covers forged requests that CORS does not stop,
and [api-security](../api-security), which covers what the API returns in the first place.
"""
twin = """
The bank API and a model of the browser's CORS rules are plain Java: the Origin header, simple versus preflighted requests, the credentials check on the response and the opaque `null` origin. The model follows the Fetch standard
for the cases shown. Sites are logical names and nothing is sent anywhere.
"""
test_note = "Everything is fixed data, so the demo prints the same text on every run."

[[act]]
title = "Same origin needs no CORS"
summary = "The bank's own page reads its balance."
detail = """
A script on https://bank.example calls the bank's API on the same origin and reads the balance. The browser applies no CORS rules at all.
"""
speech = """
First demo: same origin needs no cors. [[slnc 400]] The bank's own page reads the account. [[slnc 300]] There are no cross-origin rules to apply.
"""
rows = { same = "active ok" }
console = [
    ["bank's own page reads /account -> reached the bank, readable: balance: 125000 cents", "ok"],
]

[[act]]
title = "No CORS headers: a page may send, but not read"
summary = "An attacker's page cannot read the account, but its simple POST to /transfer still reaches the bank and is processed; a JSON PUT is stopped by the preflight."
detail = """
With no CORS headers, a script on evil.example reads nothing: "answer blocked". But the request reached the bank, with the customer's cookie, and a simple POST with a text/plain body is processed: the bank's log has POST /transfer.
A JSON PUT needs a preflight, which fails, so that one never reaches the bank. CORS controls reading and, for non-simple requests, sending; it is not a defence against forged simple requests. That is the job of the CSRF defences.
"""
speech = """
Second demo: no cors headers, a page may send but not read. [[slnc 400]] The attacker's page cannot read the account. [[slnc 600]]
But the request still reached the bank, with the cookie. [[slnc 300]] A simple post is processed. [[slnc 600]]
A json put is stopped by the preflight. [[slnc 300]] Cors controls reading. It is not a defence against forged requests.
"""
rows = { send = "active amber" }
console = [
    ["evil.example reads /account -> reached the bank, answer blocked", "ok"],
    ["evil.example POSTs /transfer (simple) -> reached the bank, answer blocked", "bad"],
    ["evil.example PUTs /transfer -> never reached the bank, answer blocked", "ok"],
    ["requests the bank processed -> [GET /account, POST /transfer]  <- CORS DID NOT STOP THE POST", "bad"],
]

[[act]]
title = "Policies that look like fixes"
summary = "Reflecting the origin lets every site read; an exact list that allows null lets a sandboxed page read; a suffix match lets evilbank.example read."
detail = """
Three policies that make the console error go away: reflect whatever Origin arrives, with credentials (evil.example, evilbank.example and a null origin all read the balance); an exact list that also allows `null` (a sandboxed iframe or a
file opened locally reads it); and a suffix match on `bank.example`, which accepts https://evilbank.example. Each is a configuration that works in a test with the partner's page and quietly includes the attacker's.
"""
speech = """
Third demo: policies that look like fixes. [[slnc 400]] Reflecting the origin lets every site read the account. [[slnc 600]]
An exact list that also allows null lets a sandboxed page read it. [[slnc 600]]
And matching the end of the name lets a look-alike domain in. [[slnc 300]] Each works in a test with the partner, and includes the attacker.
"""
rows = { bad = "active wrong" }
console = [
    ["reflect any origin: evil.example, evilbank.example and null all read the balance", "bad"],
    ["exact list that also allows null: the null origin reads the balance", "bad"],
    ["origin ends with bank.example: evilbank.example reads the balance", "bad"],
]

[[act]]
title = "An exact allow-list"
summary = "Only partner.example can read, including a JSON PUT after a successful preflight; evil.example, a look-alike and null are blocked; public rates are readable by anyone; responses carry Vary: Origin."
detail = """
The fixed policy compares the Origin header as a whole, case-sensitively, with a list that has one partner. partner.example reads the account and sends a JSON PUT after the preflight approves the method and header.
evil.example, evilbank.example and the null origin all get no CORS headers, so their reads are blocked, and the evil JSON PUT never reaches the bank. The public rates call uses a wildcard, which is fine for data with no cookies.
Responses carry `Vary: Origin` so that a cache does not hand one origin's answer to another.
"""
speech = """
Fourth demo: an exact allow-list. [[slnc 400]] The origin is compared as a whole, with a short list. [[slnc 300]] The partner can read, and can send json after a preflight. [[slnc 600]]
The attacker, the look-alike, and the null origin all get nothing. [[slnc 300]] Public data can use a wildcard. [[slnc 300]] And responses say vary origin.
"""
rows = { exact = "active ok" }
console = [
    ["partner.example reads /account and PUTs JSON -> readable", "ok"],
    ["evil.example, evilbank.example, null -> answer blocked", "ok"],
    ["evil.example PUTs JSON -> never reached the bank", "ok"],
    ["evil.example reads public /rates -> readable: rates: 4.1%", "ok"],
    ["Vary header on /account -> Origin", "ok"],
]

[[act]]
title = "Wildcard and cookies never combine"
summary = "A browser refuses Access-Control-Allow-Origin: * when the request carried cookies, and accepts it without them."
detail = """
Even if a server sends `*` together with `Access-Control-Allow-Credentials: true`, the browser refuses the answer for a request made with cookies and accepts it for one without. That is why teams that "need credentials and any origin"
end up reflecting the Origin header, which is the unsafe policy from act three.
"""
speech = """
Fifth demo: wildcard and cookies never combine. [[slnc 400]] A browser refuses a star together with cookies. [[slnc 300]] Without cookies, it accepts it. [[slnc 600]]
That is why teams who need both end up reflecting the origin, which is the mistake from before.
"""
rows = { star = "active ok" }
console = [
    ["browser accepts * with cookies -> false", "ok"],
    ["browser accepts * without cookies -> true", "muted"],
]

[animation]
subtitle = "A bank API, a partner, an attacker, and the rules a browser applies between them."
boxes = [
    ["same", "Same origin", "no CORS needed"],
    ["send", "Sending is not reading", "CORS does not stop a simple POST"],
    ["bad", "Convenient policies", "reflect, null, suffix"],
    ["exact", "An exact list", "whole, case-sensitive, Vary: Origin"],
    ["star", "Wildcard", "public data only, never with cookies"],
]

[docs.problem]
scenario = """
A bank's API serves its own pages and a partner's page, in browsers where an attacker's page and a look-alike site can also run scripts.
"""
naive = """
When the browser blocks a cross-origin call, add the CORS header that makes the error go away: reflect the origin, allow null for local testing, match the end of the domain.
"""
deliver = [
    "A bank API with account, rates and transfer calls and pluggable CORS policies.",
    "A browser model with simple requests, preflight, credentials and the opaque null origin.",
    "Three unsafe policies, each with the attacker who benefits.",
    "An exact allow-list with `Vary: Origin` and tight preflight answers.",
]

[docs.prerequisites]
required = [
    "Java basics",
    "An idea of what an origin (scheme, host, port) and a cookie are",
]
not_required = [
    "A browser or a web framework: the browser is a model",
    "JavaScript",
]
install = []

[docs.session]
objectives = [
    "explain what the same-origin policy blocks and what it does not",
    "say what a simple request is and when a preflight happens",
    "list the unsafe CORS policies and the attacker each lets in",
    "write an exact allow-list and explain Vary: Origin",
]
walkthrough = """
Run act two and ask which of the requests CORS could have stopped. In act three, ask for each policy what a test with the partner's page would show. In act five, ask why teams end up reflecting the origin.
"""
exercises = [
    "Add a second partner and a test that the look-alike of each is blocked.",
    "Add `Access-Control-Expose-Headers` for one header and check that others stay hidden.",
    "Change the session cookie to SameSite=Lax in the model and see which credentialed calls stop working.",
    "Remove `Vary: Origin` and describe how a shared cache could leak an answer.",
]

[docs.explained]
sentence = """
CORS tells the browser which other sites may read an API's answers, so list those sites exactly, never reflect the Origin header or allow null, keep wildcards for public data without cookies, and use CSRF defences for forged requests.
"""
verdict = """
Prefer same-origin deployment or a server-to-server call. If you need CORS: an exact, case-sensitive allow-list read from configuration, `Vary: Origin`, the narrowest methods and headers, and credentials only for listed origins.
Treat CORS and CSRF as separate controls and keep both.
"""
recognise = [
    "`Access-Control-Allow-Origin` copied from the request's `Origin`.",
    "`Access-Control-Allow-Origin: null`.",
    "`endsWith`, `startsWith`, `contains` or an unanchored regex on the origin.",
    "A finding titled \"CORS Misconfiguration\" with CWE-942.",
]

[spec]
purpose = """
Teach CORS by showing what the browser lets a page send and read, then breaking it with reflected origins, null and suffix matching, and fixing it with an exact allow-list.
"""
nongoals = [
    "A real browser: the browser is a model of the rules that matter.",
    "Spring's CORS configuration: the cors-with-spring-boot project.",
    "CSRF defences: the cross-site-request-forgery project.",
]
problem = """
Developers fix CORS errors in the quickest way, and the quickest ways let other sites read answers meant for the customer.
"""
roles = [["The messages", "`Request`, `Response`, `FetchResult`"], ["The bank and its policies", "`BankApi`, `CorsPolicy`"], ["The browser model", "`Browser`"], ["Entry point", "`CorsDemo`"]]
requirements = [
    "Without CORS headers, a cross-origin page cannot read answers, yet a simple POST is processed.",
    "A non-simple request is stopped by a failing preflight and never reaches the API.",
    "Reflecting the origin, allowing null and suffix matching let attacker pages read the account.",
    "An exact allow-list lets only listed origins read, answers preflights narrowly and sets Vary: Origin.",
    "The browser model refuses a wildcard with credentials.",
    "The demo prints the same output on every run.",
]

