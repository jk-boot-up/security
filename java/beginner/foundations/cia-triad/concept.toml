title = "Classes"
narration = "unused"

[[scene]]
key = "13-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a warehouse role", "and see which test must change."]
narration = """That's the C I A triad. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Every security control protects one of three promises: keeping it private, keeping it correct, or keeping it reachable. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine, with nothing installed except a Java development kit. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a third role, for the warehouse, and see which test has to change. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
The demo order system of an online store: the unprotected `NaiveStore`, the protected `SecureStore` with its
role check, seal and emergency exception, and the `TickServer` with its `RateLimiter`. It covers what the
three promises of the CIA triad protect inside this one system. It does not cover the network, the
database product, or how staff sign in.
"""
assets = [
    "The order records: customer, item, shipping address and amount paid (confidentiality).",
    "The correctness of each amount (integrity).",
    "The checkout, which must stay usable during a sale (availability).",
    "The seal key, which makes tampering detectable.",
    "The audit log of emergency access.",
]
actors = [
    "Finance staff (Ana): may see and change amounts.",
    "Support staff (Raj): may see the customer and the item only.",
    "A careless or hostile insider (Mallory): has a support account, and may reach storage directly.",
    "An outside bot: floods the checkout during a sale.",
    "A real customer (Maya): wants to buy.",
]
boundaries = [
    "Internet to server: where the rate limit sits.",
    "Staff to the order system: where the role check sits.",
    "Application to storage: where the seal is checked on every read.",
    "Normal access to emergency access: where a reason is required and the use is logged.",
]
assumptions = [
    "Users are who they say they are. Proving it is the job of the identity module, starting with authentication-vs-authorization.",
    "The seal key is kept secret. In the demo it is a fixed value; a real system keeps it in a secrets store.",
    "An attacker may reach the stored data without going through the application (that is what act five simulates).",
]
out_of_scope = [
    "Network attacks such as eavesdropping: the transport-security module covers them.",
    "Attacks on the server operating system or the database product.",
    "Distributed floods from many addresses at once.",
    "Backups and recovery: the safe-habits module covers them.",
]
tests = [
    "`ConfidentialityTest` shows support never receives the address or the amount, and only finance may change an amount.",
    "`IntegrityTest` shows that a change made behind the application is refused on read.",
    "`SealStepsTest` shows the seal worked out by hand equals Java's HMAC-SHA256.",
    "`AvailabilityTest` shows one client cannot take more than its share of the server in one tick.",
    "`BreakGlassTest` shows emergency access needs a reason and leaves an audit entry.",
]
next = """
The next project, threats-and-risk, turns a list like this into a ranked register with scores. Later modules replace
the assumptions one by one: who the user is, how keys are kept, and how traffic is protected on the way in.
"""

[[threat]]
id = "T1"
stride = "I"
threat = "A support agent reads an address or an amount they do not need"
where = "`SecureStore.read`"
control = "A role filter returns only the fields the role needs"
residual = "A finance account can still read everything, so a misused finance account is not stopped"

[[threat]]
id = "T2"
stride = "T"
threat = "An insider changes an amount through the application"
where = "`SecureStore.setAmount`"
control = "Only finance may change an amount, and the order is sealed again"
residual = "A finance account used wrongly is allowed; changes are not yet logged"

[[threat]]
id = "T3"
stride = "T"
threat = "Someone edits an order directly in storage"
where = "`SecureStore.storageForDemo` (stands in for database access)"
control = "An HMAC seal is checked on every read, and a mismatch refuses the order"
residual = "Anyone who also has the key can reseal; the key must be protected"

[[threat]]
id = "T4"
stride = "D"
threat = "A bot floods the checkout so real customers are refused"
where = "`TickServer`"
control = "`RateLimiter` allows each client a few requests per tick"
residual = "Many bots from many clients each stay under the limit"

[[threat]]
id = "T5"
stride = "E"
threat = "Emergency access is used as a shortcut around the role check"
where = "`SecureStore.breakGlass`"
control = "A reason is required and every use is written to the audit log"
residual = "Reasons can be false, and the log only helps if someone reviews it"

[[threat]]
id = "T6"
stride = "R"
threat = "Someone denies they used emergency access"
where = "`SecureStore.auditLog`"
control = "Each entry records who, which order and why"
residual = "The demo log is in memory and could be altered; a real log is append-only and stored elsewhere"

[[threat]]
id = "T7"
stride = "S"
threat = "Someone pretends to be a finance user"
where = "the whole system (users are simply given)"
control = "None in this project, by design"
residual = "Covered by the identity module: authentication, then passwords and one-time codes"

