[[act]]
title = "The bill: strict controls get in the way of emergencies"
summary = "Support cannot see an address when a courier is at the wrong door; emergency access without a reason is denied, and with a reason it shows the address and logs the use."
detail = """
Strict confidentiality has a cost. A courier is at the wrong door, the customer is on the phone, finance is not available,
and Raj, from support, gets address=[hidden]. The system offers an emergency exception, often called break-glass access.
Asked with no reason, it is denied. Asked with a reason, it shows the address, 12 Palm Street, and writes an entry to the
audit log: raj used emergency access on O-101, with the reason. The three promises pull against each other, so the
exception must exist, and it must be watched.
"""
figure = "break_glass"
figure_title = "Emergency access: a reason, and a log"
figure_speech = """
Fifth demo: the bill. [[slnc 400]] Strict controls have a cost. [[slnc 600]]
A courier is at the wrong door. [[slnc 300]] The customer is on the phone. [[slnc 300]] Finance is not available. [[slnc 300]] And Raj, from support, cannot see the address. [[slnc 600]]
So the system has an emergency exception, often called break glass access, like the glass on a fire alarm. [[slnc 600]]
In green, Raj's three requests. [[slnc 300]] In red, the responses. [[slnc 300]] As usual, the address is hidden. [[slnc 300]] Emergency access with no reason: denied. [[slnc 300]] Emergency access with a reason: twelve Palm Street. [[slnc 600]]
And at the bottom, the audit log, with one entry. [[slnc 300]] Who used it, on which order, and why. [[slnc 600]]
The promises pull against each other. [[slnc 300]] So the exception must exist, and it must be watched.
"""
speech = """
The program's output. [[slnc 300]] The requests, then the responses. [[slnc 300]] Hidden, denied, and shown. [[slnc 500]] Then the audit log: one entry, with Raj's name, the order, and his reason.
"""
rows = { conf = "active amber", avail = "active amber" }
