[[act]]
title = "Confidentiality: each role sees only what it needs"
summary = "The system looks at the asker's role: support gets the customer and the item, finance gets everything, and only finance may change an amount."
detail = """
The fix for the leak is to decide what each role may see. The same three requests go in: Raj (support) and Ana (finance)
read O-101, and Mallory (support) tries to change its amount. The responses are filtered by role. Raj gets customer=Maya Rao
and item=Laptop, with the address and the amount hidden. Ana gets everything: 12 Palm Street and $1200. Mallory is denied,
because only finance may change an amount. The principle is called least privilege: give each person only what the job needs.
"""
figure = "role_filter"
figure_title = "Each role sees only what it needs"
figure_speech = """
Second demo: confidentiality. [[slnc 400]] The order system now looks at who is asking, before it answers. [[slnc 600]]
In green, the requests. [[slnc 300]] Raj, from support, reads order one oh one. [[slnc 300]] Ana, from finance, reads the same order. [[slnc 300]] And Mallory, from support, tries to change the amount. [[slnc 600]]
