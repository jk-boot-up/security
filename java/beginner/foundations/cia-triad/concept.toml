[[scene]]
key = "01-poster"
kind = "poster"
title = "The CIA Triad"
narration = """Hello, and welcome. [[slnc 400]] This video explains the C I A triad, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] C I A stands for confidentiality, integrity and availability. [[slnc 300]] They are three promises that a system makes about its information. [[slnc 300]] Confidentiality: only the right people can see it. [[slnc 300]] Integrity: nobody can change it without being noticed. [[slnc 300]] Availability: it is there when it is needed. [[slnc 600]] Think of a bank vault. [[slnc 300]] The thick door keeps strangers out. [[slnc 300]] The seals on the money bags show if anything was touched. [[slnc 300]] And the vault opens every morning, so customers can reach their money. [[slnc 700]] In this video, the domain is an online store and its orders. [[slnc 300]] An order must stay private, must be exactly right, and must be there when a customer wants to buy. [[slnc 500]] By the end, you will hear how a system fails each promise. [[slnc 300]] The simple control that restores each one. [[slnc 300]] And why the controls can pull against each other."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online store keeps order records.", "", "Ana works in finance.", "Raj works in support.", "Mallory is a careless support agent.", "", "The first version trusts everyone."]
narration = """Here is the scenario. [[slnc 400]] An online store keeps a record for every order. [[slnc 500]] Each record has the customer, the item, the shipping address, and the amount paid. [[slnc 600]] Ana works in finance. [[slnc 300]] Raj works in support. [[slnc 300]] And Mallory also works in support, but is careless with what should not be touched. [[slnc 600]] The first version of the order system trusts everyone."""

[[scene]]
key = "03-promises"
kind = "bullets"
title = "The Three Promises"
body = ["Confidentiality", "  only the right people can see it", "", "Integrity", "  nobody can change it unnoticed", "", "Availability", "  it is there when it is needed"]
narration = """Before the demos, the three words. [[slnc 500]] Confidentiality. [[slnc 300]] Only the right people can see the information. [[slnc 500]] Integrity. [[slnc 300]] Nobody can change the information without being noticed. [[slnc 500]] Availability. [[slnc 300]] The information is there when it is needed. [[slnc 600]] A good way to remember them is as three questions. [[slnc 300]] Who must not see it? [[slnc 300]] Who must not change it? [[slnc 300]] And who must always be able to reach it?"""

[[scene]]
key = "03-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "04-order"
kind = "figure"
title = "One order, three promises"
body = "one_order"
narration = """Let's start with one real order. [[slnc 400]] Order one oh one belongs to Maya Rao. [[slnc 300]] She bought a laptop, for twelve hundred dollars, to be sent to twelve Palm Street. [[slnc 600]] Each promise asks one question about this order. [[slnc 500]] Confidentiality asks who must not see it. [[slnc 300]] Support staff need the customer and the item, but not the address or the amount. [[slnc 500]] Integrity asks who must not change it. [[slnc 300]] The amount must stay twelve hundred, unless finance changes it, and any other change must be noticed. [[slnc 500]] Availability asks who must always reach it. [[slnc 300]] Maya must be able to check out, even when a bot floods the shop. [[slnc 600]] In the demos, we break each promise on this order, and then restore it."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "09-mapping"
kind = "bullets"
title = "Which Control Protects Which Promise"
body = ["Role check  ->  confidentiality", "Seal on each order  ->  integrity", "Rate limit  ->  availability", "", "Emergency exception:", "  a logged reason, for when they pull apart"]
narration = """Let's put the demos side by side. [[slnc 400]] The role check protects confidentiality. [[slnc 500]] The seal on each order protects integrity. [[slnc 500]] The rate limit protects availability. [[slnc 600]] And the emergency exception exists because the promises can pull against each other. [[slnc 300]] The stricter one promise is, the more it can cost another. [[slnc 300]] So the exception needs a reason, and a log."""

[[scene]]
key = "11-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["A support screen with no card or address", "A checksum beside a download", "A shop that goes down on sale day", "Break glass in case of emergency"]
narration = """You have probably met the triad already. [[slnc 400]] A support screen that shows the item, but not the card or the address, protects confidentiality. [[slnc 500]] A checksum beside a download, so you can tell if the file was altered, protects integrity. [[slnc 500]] A shop that goes down on sale day, under a flood of traffic, has failed availability. [[slnc 500]] And the sign on a fire alarm, break glass in case of emergency, is the triad's trade-off in a single sentence."""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Ask three questions about any system:", "", "Who must not see it?", "Who must not change it?", "Who must always reach it?", "", "Then ask what each control costs the others."]
narration = """So, how do you use the triad? [[slnc 400]] Ask three questions about any system that holds something that matters. [[slnc 300]] Who must not see it? [[slnc 300]] Who must not change it? [[slnc 300]] And who must always be able to reach it? [[slnc 600]] Then pick a control for each answer. [[slnc 300]] And ask what each control costs the other two promises."""

