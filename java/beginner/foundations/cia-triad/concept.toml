[[act]]
title = "Availability: one client cannot use up the whole server"
summary = "A rate limiter counts each client's requests in a tick and allows 3, so the bot gets 3, is refused 97 times, and Maya is served."
detail = """
The same flash-sale flood arrives again: 100 checkouts from the bot, then 1 from Maya, at a server that can do 10 per tick.
This time each request first goes to a rate limiter, which counts the client's requests in this tick and allows at most 3.
The bot's requests 1, 2 and 3 get counts 1, 2 and 3 and are allowed; request 4 gets count 4, over 3, and is refused, and so
are requests 5 to 100. Maya's request is her first, count 1, and is allowed. Without the limit the bot got all 10 and Maya
was refused; with it the bot gets 3, is refused 97 times, and Maya is served. Availability is protected by sharing the
capacity fairly.
"""
figure = "rate_limit"
figure_title = "The rate limiter counts each client"
figure_speech = """
Fourth demo: availability. [[slnc 400]] The same flood arrives again. [[slnc 300]] One hundred checkouts from the bot, and then one from Maya. [[slnc 300]] The server can still do only ten. [[slnc 600]]
This time, each request first goes to a rate limiter. [[slnc 300]] It keeps a count for each client, and allows at most three in each tick. [[slnc 600]]
Look at the counts. [[slnc 300]] The bot's first request, count one, allowed. [[slnc 300]] Two, allowed. [[slnc 300]] Three, allowed. [[slnc 300]] The fourth, count four, is over three, so it is refused. [[slnc 300]] And so are all the rest. [[slnc 500]] Maya's request is her first, count one, so it is allowed. [[slnc 600]]
At the bottom, the results. [[slnc 300]] Without the limit, the bot took all ten places, and Maya was refused. [[slnc 300]] With the limit, the bot gets three, and Maya is served. [[slnc 300]] No single client can use up the server.
"""
speech = """
The program's output. [[slnc 300]] The requests: one hundred and one, at a server that can do ten. [[slnc 500]] Then the limiter at work: counts one to three allowed, count four refused, and Maya allowed.
[[page]]
The results. [[slnc 300]] Without the limit, Maya is refused. [[slnc 300]] With the limit, the bot gets three and is refused ninety seven times. [[slnc 300]] And Maya is served.
"""
rows = { avail = "active ok" }
console = [
    ["THE REQUESTS (one tick):", "ok"],
    ["  100 checkouts from the bot, then 1 from maya", "muted"],
