[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] Seven small classes do the work. [[slnc 300]] Here is what each one does."""

[[class]]
name = "CiaDemo"
what = "runs the seven acts"
[[class.part]]
title = "the seven acts"
code = """
act1Naive(out);
act2Confidentiality(out);
act3Seal(out);
act4SealSteps(out);
act5Tamper(out);
act6Availability(out);
act7Bill(out);
"""
speech = """C I A demo runs the seven acts, one method each. [[slnc 300]] Every act builds a fresh store with the same two orders, so every run prints the same text."""

[[class]]
name = "NaiveStore"
what = "the first version: trusts everyone"
[[class.part]]
title = "no checks at all"
code = """
public OrderRecord read(User asker, String id) {
    return orders.get(id);
}
...
public void setAmount(User asker, String id, int amountDollars) {
    orders.put(id, orders.get(id).withAmount(amountDollars));
"""
speech = """The naive store is the first version. [[slnc 300]] Read takes the asker, but never looks at it, and returns the whole order. [[slnc 300]] Set amount changes the order for anyone, and tells nobody. [[slnc 300]] That is act one."""

[[class]]
name = "SecureStore"
what = "role check, seal check, emergency access"
[[class.part]]
title = "read: the seal first, then the role"
code = """
public OrderView read(User asker, String id) {
    OrderRecord order = verified(id);
    if (asker.role() == Role.FINANCE) {
        return new OrderView(id, order.customer(), order.item(),
                order.address(), order.amountDollars());
    }
    return new OrderView(id, order.customer(), order.item(),
            null, null);
"""
speech = """The secure store protects confidentiality and integrity. [[slnc 300]] Read first gets the verified order. [[slnc 300]] Then finance gets every field, and everyone else gets the customer and the item, with null for the address and the amount. [[slnc 300]] Null is what the demo prints as hidden."""
[[class.part]]
title = "verified: work the seal out again"
code = """
private OrderRecord verified(String id) {
    Stored stored = storage.get(id);
    if (!sealer.matches(stored.order(), stored.seal())) {
        throw new TamperedOrderException(
                id + " does not match its seal");
    }
    return stored.order();
"""
speech = """Verified is the integrity check, on every read. [[slnc 300]] It takes the order and the seal from storage, and asks the sealer whether they still match. [[slnc 300]] If not, it throws, and no order comes out. [[slnc 300]] That is the refusal in act five."""
[[class.part]]
title = "breakGlass: a reason, and a log"
code = """
if (reason == null || reason.isBlank()) {
    throw new AccessDeniedException("emergency access needs a reason");
}
OrderRecord order = verified(id);
auditLog.add(asker.name() + " used emergency access on "
        + id + ": " + reason);
"""
speech = """Break glass is the emergency exception from act seven. [[slnc 300]] With no reason, it is denied. [[slnc 300]] With a reason, it still checks the seal, and writes who, which order, and why to the audit log, before it returns the address."""

[[class]]
name = "Seal"
what = "an HMAC-SHA256 code from the order and a key"
[[class.part]]
title = "of and matches"
code = """
Mac mac = Mac.getInstance("HmacSHA256");
mac.init(key);
byte[] code = mac.doFinal(
        order.sealedText().getBytes(StandardCharsets.UTF_8));
return HexFormat.of().formatHex(code);
...
public boolean matches(OrderRecord order, String seal) {
    return of(order).equals(seal);
"""
speech = """Seal asks Java for H M A C S H A two five six, with the secret key. [[slnc 300]] It runs over the order's text, and the thirty two bytes come back as sixty four hex characters. [[slnc 300]] Matches simply makes the seal again, and compares."""

[[class]]
name = "SealSteps"
what = "works out the seal by hand"
[[class.part]]
title = "the three steps"
code = """
byte[] padded = new byte[BLOCK];                  // step 1: 64 bytes
System.arraycopy(key, 0, padded, 0, key.length);
byte[] innerKey = xor(padded, (byte) 0x36);       // step 2
byte[] outerKey = xor(padded, (byte) 0x5c);       // step 3
byte[] inner = sha256(innerKey,
        text.getBytes(StandardCharsets.UTF_8));
byte[] seal = sha256(outerKey, inner);
"""
speech = """Seal steps does the same thing by hand, for act four. [[slnc 300]] Pad the key to sixty four bytes. [[slnc 200]] Hash the key X O R three six with the text. [[slnc 200]] Then hash the key X O R five c with that. [[slnc 300]] A test checks that it gives exactly Java's seal."""

[[class]]
name = "RateLimiter"
what = "a few requests per client per tick"
[[class.part]]
title = "count, then compare"
code = """
public boolean allow(String client) {
    int count = seen.merge(client, 1, Integer::sum);
    return count <= perClientPerTick;
}
"""
speech = """The rate limiter protects availability. [[slnc 300]] Allow adds one to the client's count, and says yes while the count is at most the limit, three in the demo. [[slnc 300]] These are the counts you saw in act six."""

[[class]]
name = "TickServer"
what = "serves in order until the capacity runs out"
[[class.part]]
title = "serve one tick"
code = """
for (Request request : arrivals) {
    boolean allowed = limiter == null
            || limiter.allow(request.client());
    if (allowed && used < capacity) {
        used++;
        served.merge(request.client(), 1, Integer::sum);
"""
speech = """The tick server serves requests in the order they arrive, until its ten places are used. [[slnc 300]] With no limiter, every request is allowed, so the bot takes all ten. [[slnc 300]] With one, the bot is stopped at three, and Maya gets her place."""

