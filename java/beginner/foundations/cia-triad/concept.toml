    "Write down one incident from a news story and decide which of the three promises it broke.",
]

[docs.explained]
sentence = """
The CIA triad says that information must stay private (confidentiality), stay correct (integrity), and stay reachable (availability), and that every security control protects at least one of the three.
"""
verdict = """
The triad is a checklist for thinking, not a product. Whenever a system holds
something that matters, ask three questions: who must not see it, who must not
change it, and who must always be able to reach it. Then ask which control
answers each question, and what that control costs the other two promises.
"""
recognise = [
    "A permission check before returning data (confidentiality).",
    "A checksum, signature or seal stored beside data (integrity).",
    "A rate limit, a backup or a second server (availability).",
    "An emergency exception with a logged reason: the triad's promises being traded off on purpose.",
]

[spec]
purpose = """
Teach the three promises of the CIA triad by breaking each one in a small online store's order system and restoring it with the simplest control that works.
"""
nongoals = [
    "Real cryptography: the seal uses a standard library function and a demo key.",
    "Real networking or a real database: the server and storage are simulated.",
    "A complete store: only the parts needed to show the triad.",
]
problem = """
Learners meet security as a list of unrelated tools. The triad gives them one way to ask what a control is for.
"""
roles = [["The insecure system", "`NaiveStore`"], ["The controlled system", "`SecureStore`"], ["Integrity seal", "`Seal`, worked out by hand in `SealSteps`"], ["Availability control", "`RateLimiter` with `TickServer`"], ["Entry point", "`CiaDemo`"]]
requirements = [
    "The demo prints seven numbered acts and the output equals `docs/expected-output.txt`.",
    "Support never receives the address or the amount through `SecureStore.read`.",
    "A stored order that no longer matches its seal is never returned.",
    "One client cannot take more than its share of the server in one tick.",
    "Every emergency access has a reason and an audit log entry.",
]

