[[act]]
title = "Integrity: every order is saved with a seal"
summary = "Each order is saved with a seal, an HMAC-SHA256 code worked out from the order's text and a secret key: 32 bytes, 64 hex characters."
detail = """
Role checks guard the front door, but someone may reach the stored data another way. So every order is saved with a seal.
Two inputs go in: the order as one line of text, O-101|Maya Rao|Laptop|12 Palm Street|1200, and a secret key. HMAC-SHA256
mixes them into the seal, 701017e4 0f4b5c72 ... a10f3d55: 32 bytes, written as 64 hex characters. Storage keeps the order
and its seal side by side. Change one character of the text and the seal comes out completely different; without the key,
nobody can work out the new one.
"""
figure = "seal_made"
figure_title = "Sealing one order"
figure_speech = """
Third demo: integrity. [[slnc 400]] Role checks guard the front door. [[slnc 300]] But someone may reach the stored data another way. [[slnc 300]] So every order gets a seal. [[slnc 600]]
In green, the section before sealing: the two inputs. [[slnc 300]] The order, written as one line of text, with a bar between the fields. [[slnc 300]] And a secret key, which only the order system knows. [[slnc 600]]
In the middle, H M A C S H A two five six mixes the two together. [[slnc 500]]
In red, the section after sealing: the seal. [[slnc 300]] Thirty two bytes, shown as sixty four hex characters, starting seven zero one zero. [[slnc 600]]
Storage keeps the order and its seal side by side. [[slnc 300]] Change one character of the order, and the seal comes out completely different. [[slnc 300]] And without the key, nobody can make the new one.
"""
speech = """
Here is the same thing, printed by the program. [[slnc 400]] Before sealing: the order text, and the key. [[slnc 500]]
After sealing: the seal, over two lines. [[slnc 300]] Then its size: thirty two bytes, or sixty four hex characters. [[slnc 400]] The seal is stored next to the order.
"""
rows = { integ = "active ok", store = "active ok" }
console = [
    ["BEFORE SEALING (the inputs):", "ok"],
    ["  order text  O-101|Maya Rao|Laptop|12 Palm Street|1200", "muted"],
    ["  key         demo-only-secret-not-for-real-use", "muted"],
    ["AFTER SEALING (HMAC-SHA256 of the text, with the key):", "bad"],
    ["  seal        701017e4 0f4b5c72 35d9a6a2 72a14cb4", "muted"],
