title = "The CIA Triad"
narration = """Hello, and welcome. [[slnc 400]] This video explains the C I A triad, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] The C I A triad is three promises that a system makes about its information. [[slnc 300]] Confidentiality: only the right people can see it. [[slnc 300]] Integrity: nobody can change it without being noticed. [[slnc 300]] Availability: it is there when it is needed. [[slnc 600]] Think of a bank vault. [[slnc 300]] The thick door keeps strangers out. [[slnc 300]] The seals on the money bags show if anything was touched. [[slnc 300]] And the vault opens every morning, so customers can reach their money. [[slnc 700]] In this video, the domain is an online store and its orders. [[slnc 300]] An order must stay private, must be exactly right, and must be there when a customer wants to buy. [[slnc 500]] By the end, you will hear how a system fails each promise. [[slnc 300]] The simple control that restores each one. [[slnc 300]] And why the controls can pull against each other."""

