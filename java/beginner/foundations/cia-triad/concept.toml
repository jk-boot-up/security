[[act]]
title = "How the seal is made, step by step"
summary = "The seal is made in three steps: pad the key to 64 bytes, hash the key xor 36 with the text, then hash the key xor 5c with that first hash."
detail = """
HMAC-SHA256 makes the seal in three steps, and `SealSteps` redoes them by hand. First, the 33-byte key is padded with 31 zero
bytes to 64 bytes, the block size of SHA-256. Second, every byte of the padded key is XORed with 36, and SHA-256 hashes that
followed by the order text: the inner hash 3854d249 8b389b27 .... Third, every byte of the padded key is XORed with 5c, and
SHA-256 hashes that followed by the inner hash: 701017e4 0f4b5c72 ... a10f3d55, exactly the seal Java's Mac gave in act three.
SHA-256 on its own needs no key, so anyone could recompute a plain hash; mixing the key in twice means only someone with the
key can make a matching seal.
"""
figure = "seal_steps"
figure_title = "How the seal is made"
figure_speech = """
So where does the seal come from? [[slnc 400]] H M A C makes it in three steps. [[slnc 600]]
Step one. [[slnc 300]] The key is thirty three bytes long. [[slnc 300]] Thirty one zero bytes are added, to make sixty four. [[slnc 300]] That is the block size of S H A two five six. [[slnc 600]]
Step two. [[slnc 300]] Every byte of the key is X O R ed with three six. [[slnc 300]] The letter d, six four, becomes five two. [[slnc 300]] The zero bytes become three six. [[slnc 300]] Then S H A two five six hashes this, followed by the order text. [[slnc 300]] Out comes the inner hash, thirty two bytes, starting three eight five four. [[slnc 600]]
Step three. [[slnc 300]] The key is X O R ed again, this time with five c. [[slnc 300]] S H A two five six hashes that, followed by the inner hash. [[slnc 300]] Out comes seven zero one zero, and so on. [[slnc 300]] Exactly the seal from act three. [[slnc 600]]
A plain hash needs no key, so anyone could make one. [[slnc 300]] Here the key is mixed in twice, so only the order system can make a matching seal.
"""
speech = """
The program works out the seal by hand. [[slnc 400]] Step one: thirty three bytes of key, plus thirty one zero bytes. [[slnc 300]] As hex, it ends in zeros. [[slnc 500]]
Step two: the key X O R three six, which ends in three six, and the inner hash.
[[page]]
Step three: the key X O R five c, and the seal. [[slnc 400]] The last line compares it with the seal Java made in act three. [[slnc 300]] True. [[slnc 300]] The same.
"""
rows = { integ = "active ok" }
console = [
    ["STEP 1. PAD THE KEY WITH ZERO BYTES TO 64 BYTES:", "amber"],
    ["  key         33 bytes + 31 zero bytes = 64 bytes", "muted"],
    ["  as hex      64656d6f 2d6f6e6c ... 00000000", "muted"],
    ["STEP 2. INNER HASH = SHA-256(key xor 36 + the text):", "amber"],
    ["  key xor 36  52535b59 1b59585a ... 36363636", "muted"],
    ["  inner       3854d249 8b389b27 4d465bbb ce170a34", "muted"],
    ["              3c9fd86e 23d72511 2fc3ed2b 4bd1ca0b", "muted"],
    ["---", ""],
    ["STEP 3. SEAL = SHA-256(key xor 5c + inner hash):", "amber"],
    ["  key xor 5c  38393133 71333230 ... 5c5c5c5c", "muted"],
    ["  seal        701017e4 0f4b5c72 35d9a6a2 72a14cb4", "muted"],
    ["              34ef287b b2ca343b acee4afa a10f3d55", "muted"],
    ["  the same seal Java's Mac gave in act three: true", "muted"],
]

[[act]]
title = "A change behind the application is caught"
summary = "Mallory edits the amount directly in storage and leaves the seal; on the next read the seal is worked out again, does not match, and the order is refused."
detail = """
Before the edit, storage holds O-101|Maya Rao|Laptop|12 Palm Street|1200 with the seal 701017e4 0f4b5c72 .... Mallory edits
the amount directly in storage, to 12, and leaves the seal as it was, because without the key a new one cannot be made. When
Ana reads O-101, the system works the seal out again from the text it finds, 3513c4ae 562fdd03 ..., which does not match the
stored seal, so the order is refused instead of showing a wrong amount. O-102 is untouched and still reads normally. The seal
does not stop the edit; it makes sure the edit cannot go unnoticed.
"""
figure = "edit_caught"
figure_title = "An edit in storage breaks the seal"
figure_speech = """
Now Mallory goes around the front door. [[slnc 400]] She edits the order directly in storage. [[slnc 600]]
In green, before the edit. [[slnc 300]] The amount is twelve hundred, and the stored seal starts seven zero one zero. [[slnc 600]]
In red, after the edit. [[slnc 300]] The amount is now twelve. [[slnc 300]] But the seal is left as it was, because Mallory does not have the key to make a new one. [[slnc 600]]
Then Ana reads the order. [[slnc 300]] The system works the seal out again, from the text it finds. [[slnc 300]] The new seal starts three five one three. [[slnc 300]] It does not match the stored seal. [[slnc 300]] So the order is refused, instead of showing a wrong amount. [[slnc 600]]
The seal does not stop the edit. [[slnc 300]] It makes sure the edit cannot go unnoticed.
"""
