# concept.toml: everything about this project that is not Java code.
# tools/conceptkit turns it into the README, docs, diagrams, animation and video scenes.
# Written for a beginner: plain words, short sentences, every term explained the first time.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "cia-triad"
module = "foundations"
title = "The CIA Triad"
short_title = "CIA Triad"
package = "cia"
main_class = "CiaDemo"
tagline = "Three promises every system makes"
bold = "Confidentiality, integrity and availability are the three promises a system makes about its information, and every security control protects one of them."
domain = "an online store"
domain_note = ""
youtube_description = """The CIA triad in Java: three promises a system makes about its information. Confidentiality means only the right people can see it. Integrity means nobody can change it without being noticed. Availability means it is there when it is needed. Explained with an online store and its orders, like a bank vault with a thick door, sealed money bags and doors that open every morning. We watch a first version fail all three promises, then add a role check, a tamper seal and a rate limit, and finish with the cost: strict controls can get in the way of an emergency, so even the exception has to be logged."""
thumb_lines = ["THE CIA", "TRIAD"]
thumb_code = "C - I - A"
youtube_title = "The CIA Triad Explained in Java"
youtube_tags = ["cia triad", "confidentiality", "integrity", "availability", "security basics", "java", "cybersecurity for beginners"]

[readme]
intro = """
Every security control exists to protect one of three things. **Confidentiality**
means only the right people can see the information. **Integrity** means nobody
can change it without being noticed. **Availability** means it is there when it
is needed. Together they are called the CIA triad, and they are the first
question to ask about any system: which of the three can fail, and who is hurt
when it does?

This project builds one small system, an online store's order records, and
breaks each promise on purpose. Then it adds the simplest control that restores
each one, and shows what those controls cost.
"""
analogy = """
Think of a bank vault. The thick door keeps strangers out: that is
confidentiality. The seals on the money bags show if anything was touched: that
is integrity. And the vault opens every morning, so customers can reach their
money: that is availability. A vault that nobody can open is safe but useless,
which is the lesson the last act of the demo comes back to.
"""
scenario = """
An online store keeps a record for every order: the customer, the item, the
shipping address and the amount paid. Ana works in finance. Raj works in
support. Mallory also works in support, but is careless with what should not be
touched. The first version of the order system trusts everyone, so three things
go wrong in one morning. Raj reads a shipping address he did not need. Mallory
changes an amount and nobody notices. And during a flash sale, a bot floods the
checkout so that a real customer cannot buy anything.
"""
costs = [
    "**Role checks need rules.** Someone has to decide, and keep deciding, what each role may see. Rules that are too tight stop real work.",
    "**Seals need a key.** The seal is only as trustworthy as the secret key behind it, and now the key has to be protected as well as the data.",
    "**Rate limits can block real people.** A limit that stops a bot also stops a busy but honest customer on a bad day.",
    "**The promises pull against each other.** The stricter confidentiality is, the harder an emergency becomes, so an exception is needed, and the exception must be logged.",
]
too_much = """
For a personal notes app with one user and no sensitive data, seals and role
checks are more than the problem needs. The triad itself is never too much: it
is a way of thinking, and asking the three questions costs nothing. The
controls that answer them should match the size of the harm.
"""
met_before = [
    "A support screen that shows an order's item but not the card or the address (confidentiality).",
    "A download page that shows a checksum beside the file, so you can tell if it was altered (integrity).",
    "A shop that goes down on a sale day, and the protection services that absorb the flood of traffic (availability).",
    "The phrase \"break glass in case of emergency\" on a fire alarm, and its twin in business software.",
]
where = """
This project is the first one in [foundations](..), the first module of the beginner track.
"""
twin = """
The simulation uses a clock made of ticks, one slice of simulated time, instead of real time,
so every run prints the same numbers. The storage is an in-memory map that stands in for a
database, and the secret key is a fixed demo value. A real system keeps its key out of the
code and its orders in a database that has its own access controls. Later projects cover
keys, hashing and real protocols; this one only builds the intuition.
"""
test_note = "Every line the demo prints is checked against `docs/expected-output.txt`, and nothing depends on the real clock, so every run gives the same result."

[[act]]
title = "The first version, with no controls"
summary = "A support agent reads a shipping address, an amount is changed in silence, and a bot floods the checkout so a customer is refused."
detail = """
The first version of the order system trusts everyone. Raj, from support, reads
order O-101 and gets the whole record, including the shipping address, 12 Palm
Street, which he never needed: a leak. Mallory changes the amount from $1200 to
$12 and nothing records it, so when Ana reads the order she sees $12 and nobody
knows it was changed: a silent change. Then 101 checkout requests arrive in one
tick, 100 from a bot and one from a customer, Maya. The server can do 10 per
tick and serves them in order, so it serves 10 of the bot's and refuses Maya's:
an outage for the person who wanted to buy.
"""
speech = """
First demo: the first version of the store's order system, with no controls. [[slnc 400]]
Ana works in finance. [[slnc 300]] Raj works in support. [[slnc 300]] Mallory also works in support, but is careless with what should not be touched. [[slnc 600]]
Raj reads order one oh one, for the customer Maya Rao. [[slnc 300]] The whole order comes back, including the shipping address, twelve Palm Street. [[slnc 300]] Support did not need that. [[slnc 300]] This is a leak. [[slnc 600]]
Mallory changes the amount from twelve hundred dollars to twelve. [[slnc 300]] Nothing records it. [[slnc 300]] When Ana reads the order, she sees twelve dollars, and nobody knows it was changed. [[slnc 300]] This is a silent change. [[slnc 600]]
Then a flash sale begins, and a flood of checkout requests arrives. [[slnc 300]] One hundred from a bot, and one from a real customer, Maya. [[slnc 300]] The server can only do ten at a time. [[slnc 300]] It serves ten, all of them the bot's. [[slnc 300]] Maya's request is refused. [[slnc 300]] This is an outage, for the person who wanted to buy.
"""
rows = { conf = "active wrong", integ = "active wrong", avail = "active wrong" }
console = [
    ["raj reads O-101: address=12 Palm Street  <- LEAK", "bad"],
    ["mallory changes the amount of O-101 from $1200 to $12, silently", "muted"],
    ["ana reads O-101: amount=$12  <- SILENT CHANGE", "bad"],
    ["101 checkout requests arrive in one tick; the server can do 10", "muted"],
    ["served 10 of 101; maya's request was refused  <- OUTAGE", "bad"],
]

[[act]]
title = "Confidentiality: each role sees what it needs"
summary = "Support sees the customer and the item only, finance sees everything, and only finance may change an amount."
detail = """
The fix for the leak is to decide what each role may see. The order system now
looks at the asker's role before it answers. Raj, from support, gets the
customer and the item, and the address and the amount come back hidden. Ana,
from finance, gets everything. Mallory tries to change an amount and is denied,
because only finance may. The principle is called least privilege: give each
person only what the job needs, and nothing more.
"""
speech = """
Second demo: confidentiality. [[slnc 400]] The order system now looks at who is asking, before it answers. [[slnc 600]]
Raj, from support, reads order one oh one. [[slnc 300]] He gets the customer and the item. [[slnc 300]] The address and the amount come back hidden. [[slnc 600]]
Ana, from finance, reads the same order. [[slnc 300]] She gets everything, including the address, and the amount of twelve hundred dollars. [[slnc 600]]
Mallory tries to change an amount. [[slnc 300]] Denied. [[slnc 300]] Only finance may change one. [[slnc 600]]
The idea has a name. [[slnc 300]] It is called least privilege. [[slnc 300]] Give each person only what the job needs, and nothing more.
"""
rows = { conf = "active ok" }
console = [
    ["raj reads O-101: customer=Maya Rao, item=Laptop,", "ok"],
    ["  address=[hidden], amount=[hidden]", "ok"],
    ["ana reads O-101: ... address=12 Palm Street, amount=$1200", "ok"],
    ["mallory tries to change an amount: denied", "ok"],
]

[[act]]
title = "Integrity: a change behind the application is caught"
summary = "Each order carries a seal worked out from its contents and a secret key; an edit made directly in storage no longer matches its seal."
detail = """
Role checks protect the front door, but someone may reach the stored data some
other way. So every order is saved together with a seal: a short code worked
out from the order and a secret key. On every read, the system works the code
out again and compares. Mallory edits the amount directly in storage, from
$1200 to $12, and leaves the seal as it was. When Ana reads the order, the
codes do not match, and the system refuses to show it instead of showing a
wrong amount. Other orders, such as O-102, are unaffected. The seal does not
stop the edit; it makes sure the edit cannot go unnoticed.
"""
speech = """
Third demo: integrity. [[slnc 400]] Role checks guard the front door. [[slnc 300]] But someone may reach the stored data another way. [[slnc 600]]
So every order is saved with a seal. [[slnc 300]] A seal is a short code, worked out from the order and a secret key. [[slnc 300]] Change one letter of the order, and the code no longer fits. [[slnc 600]]
Mallory edits the amount directly in storage, from twelve hundred dollars to twelve. [[slnc 300]] The seal is left as it was. [[slnc 600]]
Ana reads the order. [[slnc 300]] The system works the code out again, and it does not match. [[slnc 300]] The order is refused, instead of showing a wrong amount. [[slnc 600]]
Order one oh two is untouched, and still reads normally. [[slnc 300]] The seal does not stop the edit. [[slnc 300]] It makes sure the edit cannot go unnoticed.
"""
rows = { integ = "active ok" }
console = [
    ["mallory edits O-101 in storage: amount $1200 -> $12", "muted"],
    ["ana reads O-101: refused, O-101 does not match its seal", "ok"],
    ["  <- DETECTED", "ok"],
    ["ana reads O-102: ... address=7 Lake Road, amount=$80", "ok"],
]

[[act]]
title = "Availability: one client cannot use up the server"
summary = "Each client may make 3 requests per tick, so the bot gets 3 and Maya's request is served."
detail = """
The same flash-sale flood arrives again: 100 requests from the bot and one from
Maya. This time the server first asks a rate limiter, which allows each client 3
requests per tick. The bot is served 3 times and refused 97. Maya's single
request is served. Availability is protected by sharing the capacity fairly, so
one client, careless or hostile, cannot use all of it.
"""
speech = """
Fourth demo: availability. [[slnc 400]] The same flood arrives again. [[slnc 300]] One hundred requests from the bot, and one from Maya. [[slnc 600]]
This time the server asks a rate limiter first. [[slnc 300]] A rate limiter allows each client only a few requests in each moment. [[slnc 300]] Here, three. [[slnc 600]]
The bot is served three times, and refused ninety seven times. [[slnc 300]] Maya's single request is served. [[slnc 600]]
Availability is protected by sharing the capacity fairly. [[slnc 300]] So no single client, careless or hostile, can use all of it.
"""
rows = { avail = "active ok" }
console = [
    ["each client may make 3 requests per tick", "muted"],
    ["bot: 3 served, 97 refused", "ok"],
    ["maya: 1 served", "ok"],
]

[[act]]
title = "The bill: strict controls get in the way of emergencies"
summary = "Support cannot see a shipping address when a courier is at the wrong door; an emergency exception shows it, but only with a reason, and logs the use."
detail = """
Strict confidentiality has a cost. A courier is standing at the wrong door, the
customer is on the phone, finance is not available, and Raj cannot see the
shipping address that would let him fix it. The system offers an emergency
exception, usually called break-glass access: any employee may read the
address, but must give a reason, and the use is written to an audit log. Raj
gets the address, 12 Palm Street, and the log now has one entry saying who used
the exception, on which order, and why. The three promises pull against each
other, so the exception must exist, and the exception must be watched.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] Strict controls have a cost. [[slnc 600]]
A courier is standing at the wrong door. [[slnc 300]] The customer is on the phone. [[slnc 300]] Finance is not available. [[slnc 300]] Raj is from support, so the address is hidden from him. [[slnc 300]] And the address is exactly what he needs. [[slnc 600]]
So the system has an emergency exception. [[slnc 300]] It is often called break glass access, like the glass on a fire alarm. [[slnc 300]] Any employee may read the address, but must give a reason. [[slnc 300]] And every use is written to an audit log. [[slnc 600]]
Raj uses it, and gets the address. [[slnc 300]] The log now has one entry. [[slnc 300]] Who used it, on which order, and why. [[slnc 600]]
The three promises pull against each other. [[slnc 300]] So the exception must exist. [[slnc 300]] And the exception must be watched.
"""
rows = { conf = "active amber", avail = "active amber" }
console = [
    ["raj, from support, reads O-101: address=[hidden], amount=[hidden]", "muted"],
    ["raj uses emergency access: address=12 Palm Street", "amber"],
    ["audit log entries: 1", "amber"],
    ["raj used emergency access on O-101: courier at the wrong door, customer on the phone", "amber"],
]

