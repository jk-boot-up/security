[[act]]
title = "Spending a budget where it removes the most"
summary = "Each treatment's value is the score it removes divided by its cost; with a budget of 10, four treatments are bought best value first, the total score falls from 73 to 35, and the card risk is left waiting."
detail = """
There are four ways to treat a risk. Mitigate it, which lowers the likelihood or
the impact. Avoid it, by removing its cause. Transfer it, by handing it to
someone else, such as a payment provider. Or accept it, and live with it. Each
treatment has a cost, and the budget is 10. Before the plan, each treatment is valued: the
score it removes, divided by its cost. Deleting the debug page takes R4 from 15 to 0, removing 15 for a cost of 1: value 15.0.
Checking the order owner takes R1 from 16 to 4, removing 12 for a cost of 2: value 6.0. Limiting login attempts removes 6 for 3 (2.0),
a second approval for exports removes 5 for 3 (1.7), and the hosted payment page removes 8 for 5 (1.6). After the plan, the best value is
bought first: 1, then 3, 6 and 9 spent. The hosted payment page would need 9 + 5 = 14, more than 10, so it waits. The total score falls from 73 to 35, and the worst
risk left is the card risk, at 10.
"""
figure = "budget"
figure_title = "Spending the budget: best value first"
figure_speech = """
Fourth demo: spending a budget. [[slnc 400]] There are four ways to treat a risk. [[slnc 300]] Mitigate it, which lowers how likely or how bad. [[slnc 300]] Avoid it, by removing its cause. [[slnc 300]] Transfer it, by handing it to someone else. [[slnc 300]] Or accept it, and live with it. [[slnc 600]]
At the top, in green, the section before the plan. [[slnc 300]] Each treatment gets a value: the score it removes, divided by its cost. [[slnc 400]] Deleting the debug page takes risk four from fifteen to zero. [[slnc 300]] It removes fifteen, for a cost of one. [[slnc 300]] Value fifteen, the best. [[slnc 400]] Checking the order owner removes twelve, for a cost of two. [[slnc 300]] Value six. [[slnc 600]]
At the bottom, in red, the section after the plan. [[slnc 300]] The budget is ten boxes. [[slnc 300]] The best value is bought first, until nine are spent. [[slnc 400]] The hosted payment page costs five. [[slnc 300]] Nine plus five is fourteen, more than ten, so it waits. [[slnc 500]]
The total falls from seventy three, to thirty five.
"""
