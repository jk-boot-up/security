narration = """Here is who does what in the code. [[slnc 400]] The surface holds the list of entry points, and counts them by who can reach them. [[slnc 500]] A risk scores itself, as likelihood times impact. [[slnc 500]] The risk register ranks the risks, and can score them again for a different reviewer. [[slnc 500]] The planner spends the budget, best value first. [[slnc 300]] And the plan records what was funded, and what is left."""

