[threatmodel]
scope = """
The risk register and planner of this project: the list of entry points, the scored risks, the ranking, and the
budgeted plan. The threats here are about the process of assessing risk, not about the store's own endpoints
(those are the register's content). It covers how the register itself can mislead.
"""
assets = [
    "The attack surface list, which is only useful if it is complete.",
    "The scores, which drive what gets fixed first.",
    "The budget, which is limited and must go where it helps most.",
    "The record of accepted risks, owners and review dates.",
]
actors = [
    "The security reviewer who scores the risks.",
    "The finance and engineering reviewers, who score the same risks differently.",
    "The feature team, which ships changes that add ways in.",
    "A real attacker, who does not care what the register says.",
]
boundaries = [
    "Feature work to the register: where new entry points should be added.",
    "Reviewer to score: where judgment enters.",
    "Plan to action: where a funded treatment must actually be done.",
]
assumptions = [
    "The risks given to the planner are real and described honestly.",
    "Scores from 0 to 5 are accepted as a rough guide, not as measurements.",
    "Someone owns each accepted risk and will look at it again.",
]
out_of_scope = [
    "Discovering real vulnerabilities in a real system.",
    "A formal threat-modeling method with data flow diagrams for every feature: each later project has its own threat model.",
    "Money figures for impact.",
]
tests = [
    "`SurfaceTest` shows the count of ways in grows when a feature ships.",
    "`RiskTest` shows the score, the rating bands and the tie-break rule.",
    "`PlannerTest` shows the budget is never exceeded and the total score falls as expected.",
    "`JudgmentTest` shows two reviewers can rank the same list differently, and the original is unchanged.",
]
next = """
Each later project gets its own threat model in this format. When a project's threats are scored, they can be added to
a shared register and ranked with the planner from this project.
"""

[[threat]]
id = "T1"
stride = "I"
threat = "A forgotten entry point leaves a secret open, such as a debug page"
where = "`Surface`"
control = "Count the surface again whenever a feature ships"
residual = "The list is only as complete as the people keeping it"

[[threat]]
id = "T2"
stride = "T"
threat = "A score is nudged to move a risk down the list"
where = "`Risk`, `RiskRegister.rescored`"
control = "Rescoring returns a copy, so the original scores stay on record; assumptions are written down"
residual = "Nothing stops a reviewer from choosing a convenient number"

[[threat]]
id = "T3"
stride = "R"
threat = "An accepted risk has no owner, so nobody can say who agreed to it"
where = "the plan's unfunded and accepted risks"
control = "Every accepted risk needs an owner and a review date"
residual = "The demo prints the rule; a real process must enforce it"

[[threat]]
id = "T4"
stride = "D"
threat = "A long list of low risks swamps the few that matter"
where = "`RiskRegister.ranked`"
control = "Ranking with a fixed tie-break puts the highest first"
residual = "Many small risks can add up to more than one medium one"

[[threat]]
id = "T5"
stride = "E"
threat = "A cheap treatment is chosen only because it is cheap"
where = "`Planner`"
control = "Treatments are valued by score removed per unit of cost"
residual = "A treatment that unlocks another is not modeled"

[[threat]]
id = "T6"
stride = "S"
threat = "A score is attributed to a reviewer who did not give it"
where = "the review process"
control = "None in code; the engineering and finance views are named separately"
residual = "Real teams record who scored what and when"

[[diagram]]
name = "threat-model-diagram"
kind = "flow"
title = "Threat model: trust boundaries and threats"
caption = "Dashed boxes are trust boundaries. Rose tags show where each threat in the table applies."
zones = [
    { label = "People", nodes = ["team", "reviewers"], colour = "client" },
    { label = "The risk process", nodes = ["surface", "register", "scoring", "planner"], colour = "amber" },
    { label = "Decisions", nodes = ["plan"], colour = "green" },
]
nodes = [
    { id = "team", label = "Feature team", sub = "ships changes", col = 0, row = 0, colour = "client", threats = ["T1"] },
    { id = "reviewers", label = "Reviewers", sub = "engineering, finance", col = 0, row = 1, colour = "client", threats = ["T6"] },
    { id = "surface", label = "Attack surface", sub = "every entry point", col = 1, row = 0, colour = "accent", shape = "store", threats = ["T1"] },
    { id = "register", label = "Risk register", sub = "scored risks", col = 2, row = 0, colour = "accent", shape = "store", threats = ["T2", "T4"] },
    { id = "scoring", label = "Scoring", sub = "likelihood x impact", col = 2, row = 1, colour = "green", shape = "ellipse", threats = ["T2"] },
    { id = "planner", label = "Planner", sub = "best value first", col = 3, row = 1, colour = "green", shape = "ellipse", threats = ["T5"] },
    { id = "plan", label = "Plan and owners", sub = "funded, accepted", col = 4, row = 1, colour = "accent", shape = "store", threats = ["T3"] },
    { id = "attacker", label = "A real attacker", sub = "ignores the register", col = 4, row = 0, colour = "red" },
]
edges = [
    { from = "team", to = "surface", label = "adds ways in" },
    { from = "surface", to = "register", label = "what could go wrong" },
    { from = "reviewers", to = "scoring", label = "scores" },
    { from = "scoring", to = "register", label = "rescored copy" },
    { from = "register", to = "planner" },
    { from = "planner", to = "plan", label = "funded" },
    { from = "attacker", to = "surface", label = "tries every way in", colour = "red", dashed = true },
]
