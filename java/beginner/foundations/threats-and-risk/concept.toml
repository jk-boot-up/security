[[act]]
title = "The bill: a score is a judgment"
summary = "Engineering and finance score two risks differently, and their top three differ; accepted risks need an owner and a review date."
detail = """
The scores look like measurements, but they are estimates. Engineering knows a
filter already sits in front of the login, so scores that risk low, and its top
three are R1, R4 and R2. Finance sees real fraud losses, so scores the login
risk 20, and its top three are R3, R1 and R4. The rules are the same and the
ranking is different. That is not a flaw to remove. It is why the assumptions
behind each score must be written down and argued about. And every risk that is
accepted, here R5, R6 and R7, needs an owner and a review date, or it is just a
risk nobody is watching.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] The scores look like measurements. [[slnc 300]] They are not. They are estimates. [[slnc 600]]
Engineering knows a filter already sits in front of the login, so it scores that risk low. [[slnc 300]] Its top three are risk one, risk four, and risk two. [[slnc 600]]
Finance sees real fraud losses, so it scores the login risk twenty. [[slnc 300]] Its top three are risk three, risk one, and risk four. [[slnc 600]]
The rules are the same. [[slnc 300]] The ranking is different. [[slnc 300]] That is not a flaw to hide. [[slnc 300]] It is why the reasons behind each score must be written down, and argued about. [[slnc 600]]
And every risk that is accepted needs an owner, and a review date. [[slnc 300]] Otherwise it is just a risk that nobody is watching.
"""
