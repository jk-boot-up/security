# concept.toml: everything about this project that is not Java code.
# tools/conceptkit turns it into the README, docs, diagrams, animation and video scenes.
# Written for a beginner: plain words, short sentences, every term explained the first time.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "threats-and-risk"
module = "foundations"
title = "Threats and Risk"
short_title = "Threats and Risk"
package = "threats"
main_class = "ThreatsDemo"
tagline = "Count the ways in, score what could go wrong"
bold = "Security starts with a list: every way in, everything that could go wrong, and a score that says what to fix first."
domain = "an online store"
domain_note = ""
youtube_description = """Threats and risk in Java: a threat is who or what could do harm, a vulnerability is the weakness it would use, an asset is what gets harmed, and a risk is how likely and how bad it is. Explained with an online store, like a house owner walking round every door and window before buying locks. We count the store's attack surface, score seven risks as likelihood times impact, rank them, spend a fixed budget where it removes the most risk, and finish with the cost: a risk score is a judgment, so two sensible reviewers can rank the same list differently."""
thumb_lines = ["THREATS", "AND RISK"]
thumb_code = "L x I = score"
youtube_title = "Threats and Risk Explained in Java"
youtube_tags = ["threat modeling", "risk assessment", "attack surface", "vulnerability", "security basics", "java", "cybersecurity for beginners"]

[readme]
intro = """
You cannot protect everything equally, so the first job in security is to decide
what matters most. That takes four words. An **asset** is something worth
protecting. A **threat** is someone or something that could harm it. A
**vulnerability** is the weakness the threat would use. A **risk** is how likely
the harm is, and how bad it would be. The **attack surface** is the list of every
way in that an attacker could try.

This project builds a small risk register for an online store. It counts the
ways in, scores seven risks as likelihood times impact, ranks them, spends a
budget where it removes the most risk, and then shows why the scores are
judgments and not measurements.
"""
analogy = """
Think of a house owner before buying locks. First walk round and count every
door, window and gap: that is the attack surface. Then ask what is inside worth
stealing, who might try, and which weakness they would use. A rusty back-door
lock on a house full of valuables comes before a fancy lock on the garden shed.
That ordering is what a risk score is for.
"""
scenario = """
An online store has six ways in: a catalogue page, a login, a checkout, an order
page, a refund tool and a customer export. Then the team ships a reviews feature
and leaves a debug page behind, and the store has eight. Seven things could go
wrong, from stolen order data to rivals scraping the price list. There is only a
small budget to spend, so the team has to choose.
"""
costs = [
    "**Scores are judgments.** Likelihood and impact are estimates. Two sensible reviewers can score the same risk differently and rank the list differently.",
    "**The list goes stale.** Every new feature adds ways in, so the register has to be revisited, not written once.",
    "**Accepting a risk is a decision, not a default.** A risk left alone should have a named owner and a review date, or it is simply forgotten.",
    "**Low scores add up.** Seven small risks can be worth more than one medium one, which a ranked list alone does not show.",
]
too_much = """
A one-person project with no customer data does not need a formal register. A
short list on paper, with three columns for what, how bad and what to do, is
enough. The register grows with the harm: the more a failure would cost, the more
careful the list should be.
"""
met_before = [
    "A penetration test report, which is a ranked list of findings.",
    "The \"threat model\" step in a design review, which starts by drawing the entry points.",
    "A risk matrix in a company policy, a grid of likelihood against impact with red, amber and green cells.",
    "A security ticket labelled high, medium or low priority.",
]
where = """
This project is the second one in [foundations](..), after [cia-triad](../cia-triad), which names the three promises that a risk can break.
"""
twin = """
The scores are fixed numbers chosen to make the lesson clear, and the planner is a simple
greedy rule: buy the best value first while the budget lasts. Real teams use richer scales,
money figures for impact, and judgment calls the rule cannot make, such as a mitigation that
unlocks another. The point here is the vocabulary and the habit of ranking, not the formula.
"""
test_note = "Every line the demo prints is checked against `docs/expected-output.txt`, and ranking and planning use no clock and no randomness, so every run gives the same result."

[[act]]
title = "The attack surface: every way in"
summary = "The store has 6 ways in; shipping reviews and leaving a debug page behind makes it 8, with a third one open to everyone."
detail = """
An attack surface is the list of every way in. The store starts with six entry
points: two public (the catalogue and the login), two for signed-in customers
(checkout and the order page), and two internal (the refund tool and the customer
export). The team then ships a reviews feature, and leaves a debug page behind
that shows the store's settings and keys. Now there are eight entry points, and
three are open to everyone. Nobody decided to open the debug page. It simply
appeared, which is why counting the surface is the first step.
"""
speech = """
First demo: the attack surface. [[slnc 400]] An attack surface is the list of every way in that an attacker could try. [[slnc 600]]
The store starts with six. [[slnc 300]] Two are public: the catalogue and the login. [[slnc 300]] Two are for signed-in customers: checkout, and the order page. [[slnc 300]] And two are internal: the refund tool, and the customer export. [[slnc 600]]
Then the team ships a reviews feature. [[slnc 300]] And leaves a debug page behind, that shows the store's settings and keys. [[slnc 600]]
Now there are eight ways in, and three are open to everyone. [[slnc 300]] Nobody decided to open the debug page. [[slnc 300]] It simply appeared. [[slnc 300]] That is why the first step is to count.
"""
rows = { surface = "active amber" }
console = [
    ["6 entry points: 2 public, 2 authenticated, 2 internal", "muted"],
    ["the team ships reviews and leaves a debug page behind", "muted"],
    ["8 entry points: 3 public, 3 authenticated, 2 internal  <- NEW WAYS IN", "amber"],
]

[[act]]
title = "Threat, vulnerability, asset, and risk"
summary = "One risk named in full: customer orders, stolen, through an order page that does not check the owner, scored 4 times 4 is 16, high."
detail = """
Take one risk and name its parts. The asset is the customer orders. The threat is
that customer order data is stolen. The vulnerability, the weakness the threat
would use, is that the order page does not check the owner, so changing the order
number in the address shows someone else's order. The risk is how likely and how
bad. Likelihood is scored 4 out of 5, impact 4 out of 5, and the risk score is
the two multiplied: 16, which is rated high.
"""
speech = """
Second demo: four words, on one risk. [[slnc 400]]
The asset is what is worth protecting. [[slnc 300]] Here, the customer orders. [[slnc 600]]
The threat is who or what could harm it. [[slnc 300]] Here, that customer order data is stolen. [[slnc 600]]
The vulnerability is the weakness the threat would use. [[slnc 300]] Here, the order page does not check who owns the order. [[slnc 300]] Change the number in the address, and you see someone else's order. [[slnc 600]]
And the risk is how likely, and how bad. [[slnc 300]] Likelihood is four out of five. [[slnc 300]] Impact is four out of five. [[slnc 300]] Multiply them, and the score is sixteen. [[slnc 300]] Rated high.
"""
rows = { score = "active ok" }
console = [
    ["asset:         customer orders", "muted"],
    ["threat:        Customer order data stolen", "muted"],
    ["vulnerability: /orders/{id} does not check the owner", "bad"],
    ["likelihood 4 x impact 4 = score 16 (HIGH)", "amber"],
]

[[act]]
title = "Ranking the risks"
summary = "Seven risks ranked by score: the order page 16, the debug page 15, the login 12, down to the price scraping at 4; the total is 73."
detail = """
With every risk scored, sort them. The order page leak scores 16, the debug page
15, the login attack 12, then the export and the card risk tie at 10, fake
reviews 6 and price scraping 4. A tie goes to the higher impact, and then to the
lower id, so the order never changes between runs. Rated in words: two are high,
four are medium and one is low. The total score is 73, which gives a single
number to bring down.
"""
speech = """
Third demo: ranking. [[slnc 400]] With every risk scored, sort them from the worst to the least. [[slnc 600]]
At the top, risk one: the order page leak, sixteen. [[slnc 300]] Then risk four: the debug page, fifteen. [[slnc 300]] Then risk three: stolen passwords tried on the login, twelve. [[slnc 600]]
The customer export and the card risk tie at ten. [[slnc 300]] A tie goes to the higher impact, and then to the lower number, so the order never changes. [[slnc 600]]
Fake reviews score six. [[slnc 300]] Price scraping scores four, and is the only low one. [[slnc 600]]
