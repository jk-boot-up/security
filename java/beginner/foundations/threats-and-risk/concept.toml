[poster]
headline = [["THREATS", "text"], ["AND RISK", "accent"]]
taglines = [["Count the ways in, score what could go wrong", "gold"]]
before = { code = "fix what is in the news", note = "no list, no order", tag = "BEFORE" }
after = { code = "likelihood x impact", note = "a ranked list, a budget", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "Threats and Risk"
narration = """Hello, and welcome. [[slnc 400]] This video explains threats and risk, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A threat is someone or something that could do harm. [[slnc 300]] A vulnerability is the weakness it would use. [[slnc 300]] An asset is what would be harmed. [[slnc 300]] And a risk is how likely the harm is, and how bad it would be. [[slnc 600]] Think of a house owner, before buying any locks. [[slnc 300]] First, walk round and count every door, window, and gap. [[slnc 300]] Then ask what is inside worth stealing, and which weakness a thief would use. [[slnc 300]] A rusty lock on the back door of a house full of valuables comes before a fancy lock on the garden shed. [[slnc 700]] In this video, the domain is an online store. [[slnc 300]] It has a catalogue, a login, a checkout, and an admin area. [[slnc 500]] By the end, you will hear how to count the ways in. [[slnc 300]] How to score and rank what could go wrong. [[slnc 300]] How to spend a small budget where it helps most. [[slnc 300]] And why every score is a judgment."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online store ships features every few weeks.", "", "Each feature adds something to attack.", "There is a small security budget.", "", "What should be fixed first?"]
narration = """Here is the scenario. [[slnc 400]] An online store ships a new feature every few weeks. [[slnc 500]] Each feature adds something an attacker could reach. [[slnc 500]] There is a small security budget, and a long list of things that could go wrong. [[slnc 600]] And nobody has written that list down. [[slnc 300]] So the question is, what should be fixed first?"""

[[scene]]
key = "03-vocabulary"
kind = "bullets"
title = "The Words"
body = ["Asset: what is worth protecting", "Threat: who or what could harm it", "Vulnerability: the weakness it would use", "Risk: how likely, and how bad", "Attack surface: every way in"]
narration = """Before the demos, the words. [[slnc 500]] An asset is what is worth protecting. [[slnc 500]] A threat is who or what could harm it. [[slnc 500]] A vulnerability is the weakness the threat would use. [[slnc 500]] A risk is how likely the harm is, and how bad it would be. [[slnc 500]] And the attack surface is the list of every way in. [[slnc 600]] Keep them apart. [[slnc 300]] A vulnerability on its own is not a risk. [[slnc 300]] It becomes one when there is a threat, and an asset worth the trouble."""

[[scene]]
key = "03-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "04-four-words"
kind = "figure"
title = "One risk, in four words"
body = "four_words"
narration = """Let's see the four words on one real risk from the store. [[slnc 400]] On the left, the threat: customer order data is stolen. [[slnc 400]] In the middle, the vulnerability it uses: the order page does not check who owns the order. [[slnc 300]] Change the number in the address, and you see someone else's order. [[slnc 400]] On the right, the asset it harms: the customer orders. [[slnc 600]] The way in is the order page, which every signed-in customer can reach. [[slnc 600]] Below, the risk. [[slnc 300]] How likely, four out of five. [[slnc 300]] Times how bad, four out of five. [[slnc 300]] Equals a score of sixteen, rated high. [[slnc 600]] Remember, a weakness on its own is not a risk. [[slnc 300]] It becomes one when there is a threat, and an asset worth the trouble. [[slnc 300]] Next, the five demos."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "09-formula"
kind = "bullets"
title = "The Whole Method"
body = ["1. Count the ways in", "2. Write each risk: asset, threat, weakness", "3. Score: likelihood x impact", "4. Rank, with a rule for ties", "5. Spend the budget, best value first", "6. Write down who scored what, and why"]
narration = """Let's put the demos in order. [[slnc 400]] One. Count the ways in. [[slnc 400]] Two. Write each risk, as an asset, a threat, and a weakness. [[slnc 400]] Three. Score it, as likelihood times impact. [[slnc 400]] Four. Rank them, with a fixed rule for ties. [[slnc 400]] Five. Spend the budget, best value first. [[slnc 400]] And six. Write down who scored what, and why."""

[[scene]]
key = "11-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["A list of routes in a web app", "A grid of likelihood against impact", "High, medium and low findings", "A security ticket with an owner"]
narration = """You have probably met these ideas already. [[slnc 400]] The list of routes in a web application is an attack surface. [[slnc 500]] A grid of likelihood against impact, with red, amber, and green cells, is a risk matrix. [[slnc 500]] A penetration test report ranks its findings as high, medium, and low. [[slnc 500]] And a security ticket with a priority and an owner is a risk, being managed."""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Count the ways in, and keep counting", "Score, rank, and spend on value", "Treat the score as a conversation", "Every accepted risk: an owner, a date"]
narration = """So, how do you use this? [[slnc 400]] Count the ways in, and keep counting, because every feature adds more. [[slnc 500]] Score the risks, rank them, and spend the budget on the best value first. [[slnc 500]] Treat the score as a conversation, not a verdict. [[slnc 300]] Write down the reasons. [[slnc 500]] And give every accepted risk an owner, and a date to look at it again."""

[[scene]]
key = "13-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "13-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a new entry point", "and see where its risk lands."]
narration = """That's threats and risk. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Count the ways in, score what could go wrong, and spend your small budget where it removes the most. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine, with nothing installed except a Java development kit. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a new entry point, for discount coupons, write its risk, and see where it lands in the ranking. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
The risk register and planner of this project: the list of entry points, the scored risks, the ranking, and the
budgeted plan. The threats here are about the process of assessing risk, not about the store's own endpoints
(those are the register's content). It covers how the register itself can mislead.
"""
assets = [
    "The attack surface list, which is only useful if it is complete.",
    "The scores, which drive what gets fixed first.",
    "The budget, which is limited and must go where it helps most.",
    "The record of accepted risks, owners and review dates.",
]
actors = [
    "The security reviewer who scores the risks.",
    "The finance and engineering reviewers, who score the same risks differently.",
    "The feature team, which ships changes that add ways in.",
    "A real attacker, who does not care what the register says.",
]
boundaries = [
    "Feature work to the register: where new entry points should be added.",
    "Reviewer to score: where judgment enters.",
    "Plan to action: where a funded treatment must actually be done.",
]
assumptions = [
    "The risks given to the planner are real and described honestly.",
    "Scores from 0 to 5 are accepted as a rough guide, not as measurements.",
    "Someone owns each accepted risk and will look at it again.",
]
out_of_scope = [
    "Discovering real vulnerabilities in a real system.",
    "A formal threat-modeling method with data flow diagrams for every feature: each later project has its own threat model.",
    "Money figures for impact.",
]
tests = [
    "`SurfaceTest` shows the count of ways in grows when a feature ships.",
    "`RiskTest` shows the score, the rating bands and the tie-break rule.",
    "`PlannerTest` shows the budget is never exceeded and the total score falls as expected.",
    "`JudgmentTest` shows two reviewers can rank the same list differently, and the original is unchanged.",
]
next = """
Each later project gets its own threat model in this format. When a project's threats are scored, they can be added to
a shared register and ranked with the planner from this project.
"""

[[threat]]
id = "T1"
stride = "I"
threat = "A forgotten entry point leaves a secret open, such as a debug page"
where = "`Surface`"
control = "Count the surface again whenever a feature ships"
residual = "The list is only as complete as the people keeping it"

[[threat]]
id = "T2"
stride = "T"
threat = "A score is nudged to move a risk down the list"
where = "`Risk`, `RiskRegister.rescored`"
control = "Rescoring returns a copy, so the original scores stay on record; assumptions are written down"
residual = "Nothing stops a reviewer from choosing a convenient number"

[[threat]]
id = "T3"
stride = "R"
threat = "An accepted risk has no owner, so nobody can say who agreed to it"
where = "the plan's unfunded and accepted risks"
control = "Every accepted risk needs an owner and a review date"
residual = "The demo prints the rule; a real process must enforce it"

[[threat]]
id = "T4"
stride = "D"
threat = "A long list of low risks swamps the few that matter"
where = "`RiskRegister.ranked`"
control = "Ranking with a fixed tie-break puts the highest first"
residual = "Many small risks can add up to more than one medium one"

[[threat]]
id = "T5"
stride = "E"
threat = "A cheap treatment is chosen only because it is cheap"
where = "`Planner`"
control = "Treatments are valued by score removed per unit of cost"
residual = "A treatment that unlocks another is not modeled"

[[threat]]
id = "T6"
stride = "S"
threat = "A score is attributed to a reviewer who did not give it"
where = "the review process"
control = "None in code; the engineering and finance views are named separately"
residual = "Real teams record who scored what and when"

[[diagram]]
name = "threat-model-diagram"
kind = "flow"
title = "Threat model: trust boundaries and threats"
caption = "Dashed boxes are trust boundaries. Rose tags show where each threat in the table applies."
zones = [
