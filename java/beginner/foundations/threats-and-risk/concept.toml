[docs.session]
objectives = [
    "define asset, threat, vulnerability, risk and attack surface in your own words",
    "score a risk as likelihood times impact and rate it low, medium or high",
    "rank a list of risks and explain how a tie is broken",
    "explain why a risk score is a judgment, and what should be written down because of it",
]
walkthrough = """
Start with the house-owner analogy and ask the group to count the entry points of
their own home. Then run the demo one act at a time. In act two, ask the group to
name the asset, the threat and the vulnerability before reading them out. In act
four, ask which treatment they would fund first before the planner shows its
order, and discuss any difference. In act five, ask the group to score one risk
on their own, and compare the numbers.
"""
exercises = [
    "Add a new entry point, POST /coupons, and a risk for it. Where does it land in the ranking?",
    "Change the budget to 5. Which treatments are funded, and what is the worst risk left?",
    "Change the rating bands so that 10 and above is high. Which tests must change?",
    "Score the register as a third reviewer, the shop's owner, and compare the top three with engineering and finance.",
]

[docs.explained]
sentence = """
A risk is a threat using a vulnerability to harm an asset, scored as how likely and how bad, and a risk register ranks those scores so that a small budget goes where it removes the most.
"""
verdict = """
Count the ways in, write each risk as an asset, a threat and a vulnerability,
score them, rank them, and spend the budget on the best value first. Then treat
the result as a conversation and not a verdict: write down who scored what and
why, give every accepted risk an owner and a review date, and revisit the list
whenever a feature ships.
"""
recognise = [
    "A list of entry points, such as the routes of a web application.",
    "A grid of likelihood against impact with colored cells.",
    "Findings in a penetration test report, each rated high, medium or low.",
    "A backlog where security tickets carry a priority and an owner.",
]

[spec]
purpose = """
Teach the vocabulary of risk and the habit of ranking by building a small risk register for an online store, with a budgeted plan and an honest look at how subjective the scores are.
"""
nongoals = [
    "A full threat-modeling method such as STRIDE: that belongs to a later track.",
    "Money figures for impact or probability estimates: scores are 1 to 5 on purpose.",
    "Discovering real vulnerabilities: the risks are given.",
]
problem = """
Learners meet security as an endless list of things to fix. A ranked register gives them a way to decide what to fix first and to explain why.
"""
roles = [["The attack surface", "`Surface` and `EntryPoint`"], ["One scored risk", "`Risk` and `Rating`"], ["The ranked list", "`RiskRegister`"], ["Choosing treatments", "`Planner`, `Treatment`, `Strategy` and `Plan`"], ["Entry point", "`ThreatsDemo`"]]
requirements = [
    "The demo prints five numbered acts and the output equals `docs/expected-output.txt`.",
    "A risk score is likelihood times impact, with both scored from 0 to 5.",
    "The ranking is identical on every run, with ties broken by impact and then by id.",
    "The planner never spends more than the budget and never funds a treatment that removes nothing.",
    "Rescoring one register for a reviewer never changes the original.",
]

