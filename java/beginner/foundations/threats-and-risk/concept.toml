]

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] Five small classes do the work, with a few records and enums beside them. [[slnc 300]] Here is what each one does."""

[[class]]
name = "ThreatsDemo"
what = "runs the five acts on the store's data"
[[class.part]]
title = "the store's risks"
code = """
new Risk("R1", "Customer order data stolen",
        "/orders/{id} does not check the owner",
        "customer orders", 4, 4),
...
new Treatment("R4", Strategy.AVOID,
        "delete the debug page", 1, 0, 0),
"""
speech = """Threats demo holds the store's data and runs the five acts. [[slnc 300]] Each risk is written with an id, a threat, a vulnerability, an asset, a likelihood and an impact. [[slnc 300]] Each treatment names its risk, its strategy, its cost, and the likelihood and impact left afterwards."""

[[class]]
name = "Surface"
what = "the attack surface: every entry point"
[[class.part]]
title = "count the ways in"
code = """
public record EntryPoint(String route, Exposure exposure, String data) {
...
public long count(Exposure exposure) {
    return entryPoints.stream()
            .filter(e -> e.exposure() == exposure)
            .count();
"""
speech = """An entry point is one way in: its address, who can reach it, and the data behind it. [[slnc 300]] Surface holds the list, and counts the entry points for each exposure: public, authenticated, or internal."""

[[class]]
name = "Risk"
what = "one risk, which scores itself"
[[class.part]]
title = "likelihood times impact, then a band"
code = """
public int score() {
    return likelihood * impact;
...
public static Rating of(int score) {
    if (score <= 5) {
        return LOW;
    }
    return score <= 12 ? MEDIUM : HIGH;
"""
speech = """A risk's score is its likelihood times its impact. [[slnc 300]] Rating turns the score into a word: up to five is low, up to twelve is medium, and above that is high. [[slnc 300]] That is steps three and four from act two."""

[[class]]
name = "RiskRegister"
what = "ranks the risks, and rescores a copy"
[[class.part]]
title = "the ranking rule"
code = """
.sorted(Comparator.comparingInt(Risk::score).reversed()
        .thenComparing(Comparator.comparingInt(Risk::impact).reversed())
        .thenComparing(Risk::id))
"""
speech = """The risk register sorts by score, highest first. [[slnc 300]] A tie goes to the higher impact, and then to the lower id, so the order never changes. [[slnc 300]] Rescoring for another reviewer returns a copy, so the original stays on record."""

[[class]]
name = "Planner"
what = "spends the budget, best value first"
[[class.part]]
title = "value, then buy while it fits"
code = """
return (double) reduction(register, t) / Math.max(1, t.cost());
...
for (Treatment t : byValue) {
    if (spent + t.cost() <= budget) {
        spent += t.cost();
        funded.add(t);
...
        unfunded.add(t);
"""
speech = """The planner values each treatment as the score it removes, divided by its cost. [[slnc 300]] Then it goes through them, best value first. [[slnc 300]] If the cost still fits the budget, the treatment is funded. [[slnc 300]] If not, it waits. [[slnc 300]] The result is a plan: funded, waiting, and the register afterwards."""

[[acronym]]
short = "R1-R7"
long = "risk 1 to risk 7: each risk's number in the list"
say = "R one to R seven are the risk numbers: risk one to risk seven, in the order they were written."
[[acronym]]
short = "L x I"
long = "likelihood times impact: the risk score"
say = "L times I is likelihood times impact: how the risk score is made."
[[acronym]]
short = "HTTP"
long = "HyperText Transfer Protocol: how web pages travel"
say = "H T T P is HyperText Transfer Protocol: the way a browser and the store talk. Plain H T T P is not encrypted."
[[acronym]]
short = "GET, POST"
long = "HTTP methods: GET reads a page, POST sends data"
say = "GET and POST are H T T P methods. GET reads a page. POST sends data, such as a login."
[[acronym]]
short = "id"
long = "identifier: the number that picks one item"
say = "I D, or id, is short for identifier: the number in an address that picks one order."
[[acronym]]
short = "admin, config"
long = "administrator (staff-only tools), configuration (settings)"
say = "And admin is short for administrator: the tools only staff should reach. [[slnc 300]] Config is short for configuration: the store's settings, and sometimes its keys."
