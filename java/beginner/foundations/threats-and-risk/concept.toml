[[act]]
title = "The bill: a score is a judgment"
summary = "Engineering and finance score two risks differently with the same rules, and their top three differ; accepted risks need an owner and a review date."
detail = """
The scores look like measurements, but they are estimates. In the two reviews, engineering knows a
filter already sits in front of the login, so scores R3 as 2 times 3, 6; finance sees real fraud losses, so scores it 5 times 4, 20.
Finance also scores the price list R7 as 4 times 3, 12, where engineering keeps 4. In the two rankings, engineering's top
three are R1, R4 and R2, and finance's are R3, R1 and R4. The rules are the same and the
ranking is different. That is not a flaw to remove. It is why the assumptions
behind each score must be written down and argued about. And every risk that is
accepted, here R5, R6 and R7, needs an owner and a review date, or it is just a
risk nobody is watching.
"""
figure = "judgment"
figure_title = "Two reviewers, one list"
figure_speech = """
Fifth demo: the bill. [[slnc 400]] The scores look like measurements. [[slnc 300]] They are not. They are estimates. [[slnc 600]]
At the top, in amber, the two reviews. [[slnc 300]] Same rules, different estimates. [[slnc 400]] Engineering knows a filter already sits in front of the login. [[slnc 300]] So it scores risk three as two times three, six. [[slnc 400]] Finance sees real fraud losses. [[slnc 300]] It scores the same risk five times four, twenty. [[slnc 400]] And finance scores the price list higher too: twelve. [[slnc 600]]
Below, in blue, the two rankings. [[slnc 300]] Engineering's top three: risk one, risk four, risk two. [[slnc 300]] Finance's top three: risk three, risk one, risk four. [[slnc 300]] The ones in red are in only one list. [[slnc 600]]
That is not a flaw to hide. [[slnc 300]] It is why the reasons behind each score must be written down, and argued about. [[slnc 400]] And every accepted risk needs an owner, and a review date.
"""
