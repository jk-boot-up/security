]

[[act]]
title = "Spending a budget where it removes the most"
summary = "With a budget of 10, four treatments are paid for, the total score falls from 73 to 35, and the card risk is left waiting."
detail = """
There are four ways to treat a risk. Mitigate it, which lowers the likelihood or
the impact. Avoid it, by removing its cause. Transfer it, by handing it to
someone else, such as a payment provider. Or accept it, and live with it. Each
treatment has a cost, and the budget is 10. The planner values each one by the
score it removes per unit of cost, and buys the best first. Deleting the debug
page costs 1 and removes 15. Checking the order owner costs 2 and removes 12.
Limiting login attempts costs 3 and removes 6, and a second approval for exports
costs 3 and removes 5. That is 9 spent. The hosted payment page costs 5 and
does not fit, so it waits. The total score falls from 73 to 35, and the worst
risk left is the card risk, at 10.
"""
speech = """
Fourth demo: spending a budget. [[slnc 400]] There are four ways to treat a risk. [[slnc 300]] Mitigate it, which lowers how likely or how bad. [[slnc 300]] Avoid it, by removing its cause. [[slnc 300]] Transfer it, by handing it to someone else. [[slnc 300]] Or accept it, and live with it. [[slnc 600]]
The budget is ten. [[slnc 300]] The planner buys the best value first, meaning the most score removed for each unit of cost. [[slnc 600]]
Delete the debug page. [[slnc 300]] Cost one, and fifteen points gone. [[slnc 300]] Check the order owner. [[slnc 300]] Cost two, and twelve gone. [[slnc 300]] Limit login attempts. [[slnc 300]] Cost three. [[slnc 300]] A second approval for exports. [[slnc 300]] Cost three. [[slnc 600]]
That is nine of the ten spent. [[slnc 300]] The hosted payment page costs five, so it has to wait. [[slnc 600]]
The total falls from seventy three to thirty five. [[slnc 300]] And the worst risk left is the card risk, at ten.
"""
rows = { plan = "active ok" }
console = [
    ["funded   R4 AVOID    cost 1: delete the debug page", "ok"],
    ["funded   R1 MITIGATE cost 2: check the order owner on every read", "ok"],
    ["funded   R3 MITIGATE cost 3: limit attempts and lock out after five", "ok"],
    ["funded   R2 MITIGATE cost 3: require a second approval for exports", "ok"],
    ["waiting  R6 TRANSFER cost 5: use the payment provider's hosted page", "amber"],
    ["spent 9 of 10", "muted"],
    ["total score 73 -> 35", "ok"],
