plugins {
    id 'java'
    id 'application'
}

group = 'com.jk.explore.security'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot 4.1.1 is the latest stable Boot; its BOM pins Spring Framework 7.0.9, Spring Security 7.1.1 and Nimbus JOSE+JWT.
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.1.1')
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server-test'
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.jk.explore.security.authkeycloak.KeycloakDemo'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-parameters'
}

// `./gradlew test` never needs Docker. Tests that start the Keycloak container are tagged "docker"
// and run with `./gradlew integrationTest`, which needs a running Docker.
test {
    useJUnitPlatform {
        excludeTags 'docker'
    }
}

tasks.register('integrationTest', Test) {
    description = 'Runs the tests that start a Keycloak container.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'docker'
    }
    shouldRunAfter test
}

// No deprecated or to-be-removed API is allowed in any project: a warning fails the build.
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.addAll(['-Xlint:deprecation', '-Xlint:removal', '-Werror'])
}
