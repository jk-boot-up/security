]

[[act]]
title = "The roles in a token are a copy"
summary = "An admin is demoted but the token already issued still opens the report until it expires; a new token carries the new roles; a short lifetime limits the stale window."
detail = """
Before the demotion, root's token says admin and the sales report answers 200. Root is then demoted to customer in the login server's directory. After the demotion, the same token still gets 200, because the shop only sees the copy of the roles inside it.
301 seconds later the token has expired and gets 401, and a new token says customer: the report answers 403 and root's own pages 200. A short lifetime is the control: the stale window is at most the lifetime of the token, here 300 seconds.
"""
figure = "stale_copy"
figure_title = "The roles in a token are a copy"
figure_speech = """
Before the demotion, two hundred. [[slnc 200]] After it, the same token still gets two hundred, until it expires. [[slnc 200]] A new token gets four zero three.
"""
speech = """
In the output: before the demotion, two hundred. [[slnc 300]] After the demotion, the same token still gets two hundred. [[slnc 300]] Three hundred and one seconds later, four zero one. [[slnc 300]] And a new token gets four zero three for the report, and two hundred for root's own pages.
"""
rows = { stale = "active wrong" }
console = [
    ["BEFORE THE DEMOTION (root's token says [admin]):", "ok"],
    ["  GET /admin/report  200  sales", "muted"],
    ["root is demoted to customer in the login server's directory", "ok"],
    ["AFTER THE DEMOTION:", "ok"],
    ["  the same token:     GET /admin/report  200  <- ONLY A COPY", "bad"],
    ["  301 seconds later:  GET /admin/report  401  expired", "muted"],
    ["  a new token says [customer]:", "muted"],
    ["                      GET /admin/report  403", "muted"],
    ["                      GET /me            200", "muted"],
    ["the stale window is at most the token's lifetime: 300 s", "ok"],
]

[[act]]
title = "Ending a token early, and the bill"
summary = "A revocation list ends a token at once, but it is read on every request; without it the shop makes no call, and the login server becomes one more system to run."
detail = """
Before revoking, root's admin token (jti token-10) opens the report twice. Its id is put on the revocation list, and after revoking the next request gets 401 at once. The bill: the list was read 3 times for 3 requests, on every request,
which is the call that tokens were meant to avoid. Without a list the shop makes no call, but the token works until it expires. Refresh tokens give long sessions with short access tokens, and the login server can refuse to refresh.
And the login server is now one more system that must be kept running, patched and backed up.
"""
figure = "revocation"
figure_title = "Ending a token early"
figure_speech = """
Before revoking, two hundred twice. [[slnc 200]] After, four zero one. [[slnc 200]] And the bill: one lookup per request, and one more system to run.
"""
speech = """
In the output: before revoking, two hundred, and two hundred. [[slnc 300]] After revoking, four zero one. [[slnc 400]] Then the bill. [[slnc 300]] The list is read on every request. [[slnc 300]] Refresh tokens keep sessions long and access tokens short. [[slnc 300]] And the login server is one more system to run, patch, and back up.
"""
rows = { revoke = "active amber", server = "active amber" }
console = [
    ["BEFORE REVOKING (root's admin token, jti token-10):", "ok"],
    ["  GET /admin/report  200  sales", "muted"],
    ["  GET /admin/report  200  sales", "muted"],
    ["token-10 is put on the revocation list", "ok"],
    ["AFTER REVOKING:", "ok"],
    ["  GET /admin/report  401  <- ENDED AT ONCE", "bad"],
    ["THE BILL:", "ok"],
    ["  the list was read 3 times for 3 requests: every time", "muted"],
    ["  without a list: no call, but the token works until expiry", "muted"],
    ["  refresh tokens: long sessions with short access tokens", "muted"],
    ["  the login server: one more system to run, patch, back up", "muted"],
]

