# concept.toml: everything about this project that is not Java code.
# tools/conceptkit turns it into the README, docs, diagrams, animation and video scenes.
# Written for a beginner: plain words, short sentences, every term explained the first time.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "authentication-vs-authorization-with-keycloak"
module = "identity"
title = "Authentication vs Authorization with Keycloak"
short_title = "Authn vs Authz with Keycloak"
package = "authkeycloak"
main_class = "KeycloakDemo"
tagline = "Let a login server answer who, and let the shop answer what"
bold = "With Keycloak the shop stops handling passwords: a login server proves who is asking and signs a token, and the shop only checks the token's signature, expiry, issuer and audience, and then its own rules, but the roles in the token are a copy that can be stale."
domain = "an online store"
domain_note = ""
youtube_description = """Authentication vs authorization with Keycloak, in Java: let a login server do the logging in. Explained with an online store, like a theatre that sells tickets at one box office and only checks tickets at the doors. We see a Spring Boot resource server that holds no passwords and trusts only tokens signed by the login server, why no token gives 401 and the wrong role gives 403, how roles in a Keycloak token become authorities, why a correctly signed token still needs the right issuer and audience, what happens when a role is taken away but the token is still alive, and what it costs to end a token early. A real Keycloak in Docker repeats the checks in the integration tests."""
thumb_lines = ["AUTHN VS AUTHZ", "WITH KEYCLOAK"]
thumb_code = "realm_access.roles"
youtube_title = "Authentication vs Authorization with Keycloak (Spring Boot, JWT, OAuth 2)"
youtube_tags = ["keycloak", "oauth2", "oidc", "jwt", "spring security", "resource server", "pkce", "401 vs 403", "java", "cybersecurity for beginners"]

[readme]
technologies = [
    ["Keycloak", "26.8.1", "the real login server, run in Docker by the integration tests; the demo itself uses a stand-in that signs tokens in the same shape"],
    ["Docker", "any recent", "runs the Keycloak container for the integration tests only"],
]
intro = """
The plain version of this lesson kept passwords inside the shop. Most real shops do not. A separate **login server** checks the password, perhaps a second factor, and hands back a signed **token**. The shop then
holds no passwords at all: it receives a token with each request and decides whether to trust it. **Keycloak** is the best-known open-source login server. It speaks **OAuth 2** and **OpenID Connect**, the standards behind
"sign in with ...". Its tokens are **JWTs**: three parts, a header, claims such as who the user is, which roles they have and when the token expires, and a signature.

A shop that accepts tokens is called a **resource server**. It checks the signature with the login server's public keys, then the expiry, the **issuer** (who made the token) and the **audience** (which API the token is for). Only then do its own rules run:
no token means 401, a valid token without the right role means 403. The demo runs the real Spring Boot resource server against a stand-in login server, and the integration tests repeat the key checks against a real Keycloak.
"""
analogy = """
Think of a theatre. The box office checks your identity and sells you a ticket. The doors do not know you; they check that the ticket is real, that it is for tonight, that it is for this theatre and not the one next door,
and which seats it covers. If the box office moves you to a cheaper seat after you bought the ticket, the door still lets you in to the old seat until the ticket's date passes. That is the stale-role problem.
"""
scenario = """
An online store's order API trusts a login server. Shoppers, support staff, an admin and a nightly job all call it with tokens. The demo shows what happens with no token, a forged token, an expired token, the wrong issuer or audience,
a role that is taken away while the token is alive, and a token that is revoked.
"""
costs = [
    "**The login server is a new critical system.** If it is down, nobody can log in, and if it is breached, every shop that trusts it is breached. It needs patching, backups and monitoring like the shop itself.",
    "**Roles in a token are a copy.** A role taken away in Keycloak still works in tokens already issued until they expire, so access tokens must be short.",
    "**Ending a token early costs a lookup on every request.** A revocation list or introspection call per request gives up the main benefit of tokens, which is checking them with no call.",
    "**More moving parts to configure correctly.** A missing audience mapper, a wildcard redirect URI or a long token lifetime each weaken the whole design, which is why the realm file is tested like code.",
]
too_much = """
For one application with its own users, a framework's built-in login is simpler. A login server earns its place when several applications share logins, when staff sign in from a company directory, when second factors and
account recovery must be handled in one place, or when a mobile app and a web app need the same identities.
"""
met_before = [
    "\"Sign in with Google\" and company single sign-on pages.",
    "`Authorization: Bearer ...` headers in API documentation.",
    "`.well-known/openid-configuration` and `jwks.json` URLs.",
    "Tokens pasted into jwt.io, with `exp` and `iss` claims.",
]
where = """
This project is the second in [identity](..) after [authentication-vs-authorization-with-spring-security](../authentication-vs-authorization-with-spring-security). It builds on [authentication-vs-authorization](../authentication-vs-authorization) and uses the 401 and 403 answers from there.
"""
twin = """
The demo runs a real Spring Boot server on the loopback interface, and the tokens come from a stand-in login server in the same process, signed with a random key that is never printed. A simulated clock moves token lifetimes forward
without waiting. The integration tests start the real Keycloak 26.8.1 in Docker with the realm in `infra/shop-realm.json`, log in through its login page with the authorization code flow and PKCE, and wait for a real token to expire.
"""
test_note = "The default tests need only a JDK: the stand-in login server signs tokens with a random key and a simulated clock, so the demo prints only status codes and booleans, and the golden output is the same on every run. The integration tests (tagged docker) run the real Keycloak in Docker."

[[act]]
title = "No login in the shop, only tokens"
summary = "No token, garbage and a token signed with another key all get 401; a signed token works; 301 seconds later the same token is expired and refused, with no call to the login server."
detail = """
The shop holds no passwords. With no token the answer is 401, and so it is for garbage and for a token signed with another key. A token the login server signed, good for 300 seconds, is accepted. 301 seconds later the same token is refused,
and the shop needed no call to the login server to know: the expiry is inside the signed token.
"""
speech = """
First demo: no login in the shop, only tokens. [[slnc 400]] With no token, the answer is four zero one. [[slnc 300]] So it is for garbage, and for a token signed with another key. [[slnc 600]]
A token that the login server signed is accepted. [[slnc 600]]
Three hundred and one seconds later, the same token is refused. [[slnc 300]] And the shop did not need to ask the login server. [[slnc 300]] The expiry is inside the signed token.
"""
rows = { tokens = "active ok" }
console = [
    ["no token: 401, garbage as a token: 401, a token signed with another key: 401", "ok"],
    ["a token the login server signed, good for 300 seconds: 200", "ok"],
    ["the same token 301 seconds later: 401  <- EXPIRED, AND THE SHOP NEEDED NO CALL TO THE LOGIN SERVER TO KNOW", "amber"],
]

[[act]]
title = "Who is it, and what may they do"
summary = "The roles in realm_access.roles become authorities; Ana reads her own order and gets 403 for Ben's; support reads it; only admin opens the sales report."
detail = """
The roles in the token's realm_access.roles claim become authorities named ROLE_CUSTOMER, ROLE_SUPPORT and ROLE_ADMIN. Ana reads her own order A-1 with 200 and Ben's order B-2 with 403: logged in, not allowed.
Support Sam reads Ben's order. The sales report answers 403 to customer and support and 200 to admin. 401 means the shop does not know who is asking, and 403 means it knows and the answer is no.
"""
speech = """
Second demo: who is it, and what may they do. [[slnc 400]] The roles in the token become authorities in the shop. [[slnc 600]]
Ana reads her own order, and is allowed. [[slnc 300]] Ana reads Ben's order, and gets four zero three. [[slnc 300]] Logged in, and not allowed. [[slnc 600]]
Support reads any order. [[slnc 300]] Only the admin opens the sales report. [[slnc 600]]
Four zero one means the shop does not know who is asking. [[slnc 300]] Four zero three means it knows, and the answer is no.
"""
rows = { roles = "active ok" }
console = [
    ["the roles in realm_access.roles become authorities: ana [ROLE_CUSTOMER], sam [ROLE_SUPPORT], root [ROLE_ADMIN]", "muted"],
    ["Ana reads her own order A-1: 200, and Ben's order B-2: 403  <- LOGGED IN, NOT ALLOWED", "amber"],
    ["support Sam reads Ben's order B-2: 200", "ok"],
    ["the sales report: customer 403, support 403, admin 200", "ok"],
    ["401 means the shop does not know who is asking, 403 means it knows and the answer is no", "muted"],
]

[[act]]
title = "A real signature is not enough"
summary = "A correctly signed token from another issuer, and one meant for another API, are both refused; without an audience check any API's token would open this one."
detail = """
A token can have a perfectly good signature and still not be meant for the shop. A correctly signed token from another issuer is refused. A correctly signed token meant for another API is refused too: without an audience check,
any API's token would open this one. The shop checks the signature, the expiry, the issuer and the audience before its own rules run.
"""
speech = """
Third demo: a real signature is not enough. [[slnc 400]] A token from another issuer is refused, even if the signature is good. [[slnc 600]]
A token meant for another A P I is refused too. [[slnc 300]] Without the audience check, any A P I's token would open this one. [[slnc 600]]
The shop checks the signature, the expiry, the issuer, and the audience, before its own rules run.
"""
rows = { claims = "active ok" }
console = [
    ["a correctly signed token from another issuer: 401", "ok"],
    ["a correctly signed token meant for another API: 401  <- WITHOUT AN AUDIENCE CHECK, ANY API'S TOKEN OPENS THIS ONE", "amber"],
    ["the shop checks the signature, the expiry, the issuer and the audience", "muted"],
]

[[act]]
title = "The roles in a token are a copy"
summary = "An admin is demoted but the token already issued still opens the report until it expires; a new token carries the new roles; a short lifetime limits the stale window."
detail = """
Root, an admin, opens the sales report. Root is then demoted to customer in the login server's directory. The token root already holds still opens the report, because the shop only sees the copy of the roles inside it.
After the token expires it is refused, and a new token carries the new roles: the report answers 403. A short lifetime is the control: the stale window is at most the lifetime of the token.
"""
speech = """
Fourth demo: the roles in a token are a copy. [[slnc 400]] Root, an admin, opens the sales report. [[slnc 600]]
Root is then demoted to customer, in the login server. [[slnc 600]]
The token that root already holds still opens the report. [[slnc 300]] The shop only sees the copy. [[slnc 600]]
After the token expires, it is refused. [[slnc 300]] A new token carries the new roles. [[slnc 600]]
So a short lifetime is the control. [[slnc 300]] The stale window is at most the lifetime of the token.
"""
rows = { stale = "active wrong" }
console = [
    ["root, an admin, opens the sales report: 200", "ok"],
    ["root is demoted to customer in the login server's directory", "muted"],
    ["the token root already holds still opens the report: 200  <- THE SHOP ONLY SEES THE COPY", "bad"],
    ["after the token expires: 401", "ok"],
    ["a new token carries the new roles: report 403, own pages 200", "ok"],
    ["so a short lifetime is the control: the stale window is at most the lifetime of the token", "amber"],
]

[[act]]
title = "Ending a token early, and the bill"
summary = "A revocation list ends a token at once, but it is consulted on every request; without it the shop makes no call, and the login server becomes one more system to run."
detail = """
A revocation list can end a token at once: the admin token works, its id is put on the list, and the next request is refused. The price is that the list is consulted for every request, which is the call that tokens were meant to avoid.
Without a list the shop makes no call at all and the token can be used until it expires. Refresh tokens give long sessions with short access tokens, and the login server can refuse to refresh. And the login server is now one more system that must be kept running, patched and backed up.
"""
speech = """
Fifth demo: ending a token early, and the bill. [[slnc 400]] An admin token works. [[slnc 600]]
Its identifier is put on a revocation list, and the next request is refused at once. [[slnc 600]]
The price is that the list is consulted for every request. [[slnc 300]] That is the call that tokens were meant to avoid. [[slnc 600]]
Refresh tokens give long sessions with short access tokens. [[slnc 300]] And the login server can refuse to refresh. [[slnc 600]]
And the login server is now one more system to run, to patch, and to back up.
"""
rows = { revoke = "active amber", server = "active amber" }
console = [
    ["an admin token: 200 and 200", "ok"],
    ["its id is put on the revocation list: 401  <- ENDED AT ONCE", "ok"],
    ["the price: the list was consulted 3 times for 3 requests, once for every request", "amber"],
    ["without a list the shop made no call at all, and the token could be used until it expired", "muted"],
    ["refresh tokens give long sessions with short access tokens, and the login server can refuse to refresh", "muted"],
    ["the login server is now one more system that must be kept running, patched and backed up", "amber"],
]

