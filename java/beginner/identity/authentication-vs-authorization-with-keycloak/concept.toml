narration = """So, how do you use it? [[slnc 400]] Keep access tokens short lived. [[slnc 500]] Always check the issuer and the audience. [[slnc 500]] Map roles to authorities in one place. [[slnc 500]] Test the realm configuration like code. [[slnc 500]] And run the login server like critical infrastructure, because it is."""

[[scene]]
