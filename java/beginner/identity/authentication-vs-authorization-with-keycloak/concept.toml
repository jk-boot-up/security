after = { code = "Bearer token + resource server", note = "signed, checked, short-lived", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "Authentication vs Authorization with Keycloak"
narration = """Hello, and welcome. [[slnc 300]] This video explains authentication and authorization with Keycloak, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 500]] Authentication asks: who are you? [[slnc 300]] Authorization asks: what may you do? [[slnc 500]] Keycloak is a login server. [[slnc 300]] It checks the password, and gives back a signed token. [[slnc 300]] The shop only checks the token, and holds no passwords. [[slnc 500]] Think of a theatre. [[slnc 300]] The box office sells the ticket. [[slnc 300]] The doors only check it. [[slnc 500]] Our example is an online store."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online store has an order API.", "", "Shoppers, support staff, an admin", "and a nightly job all call it.", "", "Passwords stay at the login server."]
narration = """Here is the scenario. [[slnc 400]] An online store has an order A P I. [[slnc 500]] Shoppers, support staff, an admin, and a nightly job all call it. [[slnc 600]] The shop does not want to store passwords. [[slnc 300]] So passwords stay at the login server."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["Login server: checks passwords, signs tokens", "JWT: a signed token with claims", "Issuer: who made the token", "Audience: which API it is for", "Resource server: the API that checks tokens"]
narration = """Before the demos, the words. [[slnc 500]] A login server checks passwords, and signs tokens. [[slnc 500]] A token, called a J W T, is signed, and carries claims. [[slnc 500]] The issuer says who made the token. [[slnc 500]] The audience says which A P I it is for. [[slnc 500]] And a resource server is the A P I that checks the tokens."""

