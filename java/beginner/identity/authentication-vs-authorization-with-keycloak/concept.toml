narration = """Here is the whole idea, on one real request. [[slnc 300]] Ana asks for order B two, and sends her token. [[slnc 300]] It says who made it, which A P I it is for, who she is, her role, and when it expires. [[slnc 500]] The shop asks two questions. [[slnc 300]] One, authentication: who is asking? [[slnc 300]] It checks the signature, expiry, issuer and audience. [[slnc 300]] The answer is Ana. [[slnc 300]] If a check fails, it stops here with four zero one. [[slnc 500]] Two, authorization: may Ana read B two? [[slnc 300]] She is a customer, and B two is Ben's. [[slnc 300]] So the answer is no: four zero three."""

