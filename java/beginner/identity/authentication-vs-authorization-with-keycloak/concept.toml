[threatmodel]
scope = """
An online store's order API that accepts OAuth 2 access tokens from a Keycloak login server: token validation, role mapping, the realm configuration, token lifetime and revocation. It covers an attacker who can send requests with forged,
stolen, tampered or replayed tokens, and who can try passwords at the login server. It does not cover the login server's host, its database, or the web front end's handling of tokens.
"""
assets = [
    "The orders, and the sales report.",
    "The login server's private signing key.",
    "The users' passwords, held only by the login server.",
    "The access tokens in transit and in the front end.",
]
actors = [
    "Shoppers, support staff, an admin and a nightly job.",
    "An attacker with no token, a stolen token, or a forged token.",
    "An operator who changes roles in the login server.",
]
boundaries = [
    "Internet to the order API: every request crosses it with only a token as proof.",
    "Order API to the login server: the API trusts the keys the login server publishes.",
    "Public client to login server: the front end has no secret and relies on PKCE.",
]
assumptions = [
    "Requests reach the API over TLS, which the transport-security module covers.",
    "The login server's signing key is protected and its host is patched.",
    "In the demo, the stand-in issuer's key is random and never printed, and all passwords in the realm file are demo values.",
]
out_of_scope = [
    "Running Keycloak in production.",
    "Token storage in browsers, cross-site scripting and logout.",
    "Writing an authorization server.",
]
tests = [
    "`TokenRulesTest` checks 401 and 403, ownership, expiry at the exact second, forged, unsigned and tampered tokens, issuer and audience, role mapping and revocation.",
    "`RealmFileTest` checks the realm: PKCE public client, no password grant, exact redirect addresses, audience mapper, short tokens and brute force protection.",
    "`KeycloakIntegrationTest` (integration, Docker) logs in to the real Keycloak with PKCE, uses a service account, checks a wrong password and wrong audience, and shows a removed role working until a real token expires.",
    "`SignatureStepsTest` checks that the signature check done by hand (signed text, SHA-256 hash, opened signature, compare) always agrees with the library, for good, tampered and forged tokens.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next module, passwords-and-mfa, looks at how the login server itself should store and check passwords and second factors.
"""

[[threat]]
id = "T1"
stride = "S"
threat = "A forged token, signed with the attacker's own key or with no signature, is accepted"
where = "`Validators`, the decoder"
control = "Signatures are verified against the login server's published keys, and unsigned tokens are refused"
residual = "If the signing key leaks, forged tokens verify until the key is replaced"

[[threat]]
id = "T2"
stride = "S"
threat = "A token meant for another API, or from another issuer, is accepted"
where = "`Validators.audience`, the issuer check"
control = "Issuer and audience are checked on every token, and Keycloak adds the audience with a mapper"
residual = "A missing mapper makes every token fail, and a wildcard audience would make every token pass, so the realm file is tested"

[[threat]]
id = "T3"
stride = "E"
threat = "A stolen token is used until it expires, or a removed role keeps working"
where = "`Shop`, `Revocations`"
control = "Short access token lifetimes (15 seconds in the test realm, minutes in practice), and an optional revocation list"
residual = "The stale window is the token's lifetime, and the revocation list costs a lookup per request"

[[threat]]
id = "T4"
stride = "T"
threat = "A token's claims are changed to add a role"
where = "the signature check"
control = "The signature covers the claims, so any change breaks it"
residual = "None while the signature check stays on"

[[threat]]
id = "T5"
stride = "E"
threat = "The login server is configured loosely: a wildcard redirect address, an enabled password grant or a long token lifetime"
where = "`infra/shop-realm.json`"
control = "Exact redirect addresses, PKCE for the public client, the password grant switched off and short tokens, all checked by a test"
residual = "The imported file is only the starting point; changes made later in the admin console are not tested"

[[threat]]
id = "T6"
stride = "D"
threat = "Password guessing against the login page, or the login server going down"
where = "Keycloak"
control = "Brute force protection is enabled in the realm"
residual = "If the login server is down nobody can log in; existing tokens work until they expire"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] Eight small classes. [[slnc 300]] Here is what the main ones do."""

[[class]]
name = "KeycloakDemo"
what = "runs the six acts"
[[class.part]]
title = "the six acts"
code = """
try (Running api = Running.start(decoder(issuer, clock, List.of()))) {
    act1Tokens(out, api, issuer, clock);
    act2TokenAndSignature(out, api, issuer);
...
act6Revocation(out, issuer, clock);
"""
speech = """Keycloak demo starts the shop on a free port, and runs the six acts against it, with real H T T P requests."""

[[class]]
name = "Shop"
what = "the order API: rules, and roles from the token"
[[class.part]]
title = "the rules"
code = """
.requestMatchers("/admin/**").hasRole("ADMIN")
.anyRequest().authenticated())
.oauth2ResourceServer(o -> o.jwt(j -> j.jwtAuthenticationConverter(converter())))
"""
speech = """The shop's rules. [[slnc 300]] The admin pages need the admin role, and every other page needs a valid token. [[slnc 300]] The last line makes the shop a resource server that reads J W T tokens."""
[[class.part]]
title = "roles become authorities"
code = """
Object access = jwt.getClaim("realm_access");
...
return list.stream().<GrantedAuthority>map(r -> new SimpleGrantedAuthority(
        "ROLE_" + String.valueOf(r).toUpperCase(Locale.ROOT))).toList();
"""
speech = """The converter reads Keycloak's realm access claim, and turns each role into role underscore, in capitals. [[slnc 300]] That is the mapping from act three."""

[[class]]
name = "Validators"
what = "expiry, issuer and audience checks"
[[class.part]]
title = "the checks after the signature"
code = """
list.add(timestamps);                     // expiry
list.add(new JwtIssuerValidator(issuer));
list.add(audience(audience));             // meant for this API
list.addAll(extra);                       // e.g. the revocation list
"""
speech = """Validators lists the checks that run after the signature. [[slnc 300]] The expiry, the issuer, the audience, and any extra ones, like the revocation list."""

[[class]]
name = "SignatureSteps"
what = "redoes the RS256 check by hand"
[[class.part]]
title = "the four steps"
code = """
String signedText = parts[0] + "." + parts[1];                    // step 1
byte[] hash = sha256(signedText.getBytes(StandardCharsets.US_ASCII)); // step 2
...
BigInteger m = signature.modPow(key.getPublicExponent(), key.getModulus()); // step 3
...
boolean matches = Arrays.equals(opened, expected(hash, opened.length)); // step 4
"""
speech = """Signature steps does the four steps of act two by hand. [[slnc 300]] The signed text, its hash, the signature opened with the public key, and the comparison. [[slnc 300]] A test proves it always agrees with the library."""

[[class]]
name = "Issuer"
what = "a stand-in for Keycloak that signs tokens"
[[class.part]]
title = "signing a token"
code = """
.claim("realm_access", Map.of("roles", roles))
...
.expirationTime(new Date((now + lifetimeSeconds) * 1000))
...
SignedJWT jwt = new SignedJWT(new JWSHeader(JWSAlgorithm.RS256), claims);
jwt.sign(new RSASSASigner(key));
"""
speech = """Issuer stands in for Keycloak. [[slnc 300]] It writes the roles and the expiry into the claims, and signs them with its private key, using R S two five six."""

[[class]]
name = "Revocations"
what = "a list of ended tokens, and its cost"
[[class.part]]
title = "read on every request"
code = """
lookups++;
if (revoked.contains(jwt.getId())) {
"""
speech = """Revocations is the list from act six. [[slnc 300]] It counts every lookup, because it runs on every request."""

[[class]]
name = "Running"
what = "the shop on a free port"
[[class.part]]
title = "sending the token"
code = """
request.header("Authorization", "Bearer " + token);
"""
speech = """Running starts the shop, and sends each request with the token in the authorization header."""

[[class]]
name = "SimClock"
what = "a clock that moves only when told"
[[class.part]]
title = "jumping ahead"
code = """
now = now.plusSeconds(seconds);
"""
speech = """And sim clock jumps three hundred and one seconds ahead, so tokens expire without waiting."""

