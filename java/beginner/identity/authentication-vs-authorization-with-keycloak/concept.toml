[[act]]
title = "Inside a token, and its signature"
summary = "A token is header, claims and a 256-byte RS256 signature; the shop hashes header.claims with SHA-256, opens the signature with the public key, and finds the same hash; change one word and the hashes differ, so 401."
detail = """
The token as sent is 642 characters: three base64url parts joined by dots. Decoded, the header is {"alg":"RS256"}, the claims say who (sub ana), for which API (aud shop-api), from which login server (iss),
the roles (realm_access.roles = customer), and when it was issued and expires (iat, exp), and the signature is 256 bytes. The shop checks the signature in four steps. One: the signed text is the first two parts, header.claims, exactly as sent.
Two: its SHA-256 hash, 32 bytes, starting a1ec3b27. Three: the shop raises the signature to the power e (65537) modulo n, the login server's public key, and gets 256 bytes: 00 01, 202 bytes of ff, 00, nineteen bytes that say SHA-256, and a 32-byte hash.
Four: that hash equals the hash of step two, so the login server signed exactly this text. When customer is changed to admin in the claims, the text's hash becomes 4b680136..., the hash in the signature is still a1ec3b27..., they differ, and the shop answers 401.
`SignatureSteps` does these steps by hand, and a test proves it always agrees with the library.
"""
figure = "signature_steps"
figure_title = "How the signature is checked"
figure_speech = """
Before decoding: the token as sent. [[slnc 300]] After decoding: the header, and the claims: issuer, user, audience, role, and expiry.
[[page]]
The steps: the signed text, its hash, and the opened signature, ending with the same hash.
[[page]]
The hashes match. [[slnc 300]] After tampering, they differ, and the shop answers four zero one.
"""
speech = """
First the section before decoding: the token as sent, six hundred and forty two characters. [[slnc 400]] Then after decoding. [[slnc 300]] The header names the algorithm. [[slnc 300]] The claims say who it is, who made it, which A P I it is for, the role, and when it expires.
[[page]]
Now the steps. [[slnc 300]] The signed text. [[slnc 300]] Its hash. [[slnc 300]] And the signature opened with the public key: zero zero zero one, two hundred and two bytes of f f, a label that says S H A two five six, and the hash.
[[page]]
Step four: the hashes match, true. [[slnc 400]] After tampering, the new hash differs, the hash in the signature is the same as before, and the shop answers four zero one.
"""
rows = { sig = "active ok" }
console = [
    ["BEFORE DECODING (the token as sent, 642 characters):", "ok"],
    ["  eyJhbGciOiJSUzI1NiJ9.eyJzdWIiOiJhbmEiLCJhdWQ...", "muted"],
    ["AFTER DECODING (base64url, split at the two dots):", "ok"],
    ["  header     {\"alg\":\"RS256\"}", "muted"],
    ["  claims     iss          http://login.shop.example/realms/shop", "muted"],
    ["             sub          ana", "muted"],
    ["             aud          shop-api", "muted"],
    ["             azp          shop-web", "muted"],
    ["             preferred_username ana", "muted"],
    ["             realm_access {\"roles\":[\"customer\"]}", "muted"],
    ["             iat          1767258301 = 2026-01-01 09:05:01Z", "muted"],
    ["             exp          1767258601 = 2026-01-01 09:10:01Z", "muted"],
    ["             jti          token-2", "muted"],
    ["  signature  256 bytes, made with the private key", "muted"],
    ["---", ""],
    ["STEP 1. THE SIGNED TEXT = header + \".\" + claims, as sent:", "ok"],
    ["  eyJhbGciOiJSUzI1NiJ9.eyJzdWIiOiJhbmEiLCJhdWQ...", "muted"],
    ["STEP 2. ITS HASH = SHA-256(signed text), 32 bytes:", "ok"],
    ["  hash     a1ec3b27 76ab890b 126b93e6 e7602ef4", "muted"],
    ["           9266e7f3 570f2f2b 97992666 074a90a4", "muted"],
    ["STEP 3. OPEN THE SIGNATURE: signature ^ e mod n (public key)", "ok"],
    ["  e = 65537, n has 2048 bits, the result has 256 bytes:", "muted"],
    ["  0001, then 202 bytes of ff, then 00", "muted"],
    ["  3031300d 06096086 48016503 04020105 000420 = \"SHA-256\"", "muted"],
    ["  last 32  a1ec3b27 76ab890b 126b93e6 e7602ef4", "muted"],
    ["           9266e7f3 570f2f2b 97992666 074a90a4", "muted"],
    ["---", ""],
    ["STEP 4. COMPARE the two hashes: true", "ok"],
    ["BEFORE TAMPERING (roles [customer]): GET /me 200", "ok"],
    ["AFTER TAMPERING (customer -> admin, same signature):", "ok"],
    ["  hash     4b680136 69a41069 0c45e69e 0b6c8b1d", "muted"],
    ["           e6244c67 c42b8073 1f6ff516 491bad93", "muted"],
    ["  in sig   a1ec3b27 76ab890b 126b93e6 e7602ef4", "muted"],
    ["  compare  false: GET /me 401  <- BROKEN", "bad"],
]

[[act]]
title = "Who is it, and what may they do"
summary = "The roles in realm_access.roles become authorities ROLE_CUSTOMER, ROLE_SUPPORT and ROLE_ADMIN; Ana reads her own order and gets 403 for Ben's; support reads it; only admin opens the sales report."
