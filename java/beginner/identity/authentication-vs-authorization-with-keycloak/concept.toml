narration = """That's authentication and authorization with Keycloak. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] The shop checks the token and not the person, and the roles in the token are a copy that can be out of date until it expires. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] The demo runs with nothing installed except a Java development kit. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Remove the audience check, and see which tests fail. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
An online store's order API that accepts OAuth 2 access tokens from a Keycloak login server: token validation, role mapping, the realm configuration, token lifetime and revocation. It covers an attacker who can send requests with forged,
stolen, tampered or replayed tokens, and who can try passwords at the login server. It does not cover the login server's host, its database, or the web front end's handling of tokens.
"""
assets = [
    "The orders, and the sales report.",
    "The login server's private signing key.",
    "The users' passwords, held only by the login server.",
    "The access tokens in transit and in the front end.",
]
actors = [
    "Shoppers, support staff, an admin and a nightly job.",
    "An attacker with no token, a stolen token, or a forged token.",
    "An operator who changes roles in the login server.",
]
boundaries = [
    "Internet to the order API: every request crosses it with only a token as proof.",
    "Order API to the login server: the API trusts the keys the login server publishes.",
    "Public client to login server: the front end has no secret and relies on PKCE.",
]
assumptions = [
    "Requests reach the API over TLS, which the transport-security module covers.",
    "The login server's signing key is protected and its host is patched.",
    "In the demo, the stand-in issuer's key is random and never printed, and all passwords in the realm file are demo values.",
]
out_of_scope = [
    "Running Keycloak in production.",
    "Token storage in browsers, cross-site scripting and logout.",
    "Writing an authorization server.",
]
tests = [
    "`TokenRulesTest` checks 401 and 403, ownership, expiry at the exact second, forged, unsigned and tampered tokens, issuer and audience, role mapping and revocation.",
    "`RealmFileTest` checks the realm: PKCE public client, no password grant, exact redirect addresses, audience mapper, short tokens and brute force protection.",
    "`KeycloakIntegrationTest` (integration, Docker) logs in to the real Keycloak with PKCE, uses a service account, checks a wrong password and wrong audience, and shows a removed role working until a real token expires.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next module, passwords-and-mfa, looks at how the login server itself should store and check passwords and second factors.
"""

[[threat]]
id = "T1"
stride = "S"
threat = "A forged token, signed with the attacker's own key or with no signature, is accepted"
where = "`Validators`, the decoder"
control = "Signatures are verified against the login server's published keys, and unsigned tokens are refused"
residual = "If the signing key leaks, forged tokens verify until the key is replaced"

[[threat]]
id = "T2"
stride = "S"
threat = "A token meant for another API, or from another issuer, is accepted"
where = "`Validators.audience`, the issuer check"
control = "Issuer and audience are checked on every token, and Keycloak adds the audience with a mapper"
residual = "A missing mapper makes every token fail, and a wildcard audience would make every token pass, so the realm file is tested"

[[threat]]
id = "T3"
stride = "E"
threat = "A stolen token is used until it expires, or a removed role keeps working"
where = "`Shop`, `Revocations`"
control = "Short access token lifetimes (15 seconds in the test realm, minutes in practice), and an optional revocation list"
residual = "The stale window is the token's lifetime, and the revocation list costs a lookup per request"

[[threat]]
id = "T4"
stride = "T"
threat = "A token's claims are changed to add a role"
where = "the signature check"
control = "The signature covers the claims, so any change breaks it"
residual = "None while the signature check stays on"

[[threat]]
id = "T5"
stride = "E"
threat = "The login server is configured loosely: a wildcard redirect address, an enabled password grant or a long token lifetime"
where = "`infra/shop-realm.json`"
control = "Exact redirect addresses, PKCE for the public client, the password grant switched off and short tokens, all checked by a test"
residual = "The imported file is only the starting point; changes made later in the admin console are not tested"

[[threat]]
id = "T6"
stride = "D"
threat = "Password guessing against the login page, or the login server going down"
where = "Keycloak"
control = "Brute force protection is enabled in the realm"
residual = "If the login server is down nobody can log in; existing tokens work until they expire"
