[poster]
headline = [["AUTHN VS AUTHZ", "text"], ["WITH KEYCLOAK", "accent"]]
taglines = [["Let a login server answer who, and let the shop answer what", "gold"]]
before = { code = "the shop stores passwords", note = "and checks them itself", tag = "BEFORE" }
after = { code = "Bearer token + resource server", note = "signed, checked, short-lived", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "Authentication vs Authorization with Keycloak"
narration = """Hello, and welcome. [[slnc 400]] This video explains authentication and authorization with Keycloak, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] Keycloak is a login server. [[slnc 300]] It checks the password, and gives back a signed token. [[slnc 300]] The shop checks the token, and holds no passwords at all. [[slnc 600]] Think of a theatre. [[slnc 300]] The box office checks who you are, and sells a ticket. [[slnc 300]] The doors only check the ticket: is it real, is it for tonight, is it for this theatre. [[slnc 700]] In this video, the domain is an online store. [[slnc 500]] By the end, you will hear why no token gives four zero one, and the wrong role gives four zero three. [[slnc 300]] Why a good signature is not enough. [[slnc 300]] And why the roles in a token can be out of date."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online store has an order API.", "", "Shoppers, support staff, an admin", "and a nightly job all call it.", "", "Passwords stay at the login server."]
narration = """Here is the scenario. [[slnc 400]] An online store has an order A P I. [[slnc 500]] Shoppers, support staff, an admin, and a nightly job all call it. [[slnc 600]] The shop does not want to store passwords. [[slnc 300]] So passwords stay at the login server."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["Login server: checks passwords, signs tokens", "JWT: a signed token with claims", "Issuer: who made the token", "Audience: which API it is for", "Resource server: the API that checks tokens"]
narration = """Before the demos, the words. [[slnc 500]] A login server checks passwords, and signs tokens. [[slnc 500]] A J W T is a signed token that carries claims. [[slnc 500]] The issuer says who made the token. [[slnc 500]] The audience says which A P I it is for. [[slnc 500]] And a resource server is the A P I that checks the tokens."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "09-ladder"
kind = "bullets"
title = "What The Shop Checks"
body = ["The signature: made by the login server", "The expiry: not in the past", "The issuer: the expected realm", "The audience: this API", "Then its own rules: roles and ownership"]
narration = """Let's put the checks in order. [[slnc 400]] The signature. Was it made by the login server's key? [[slnc 500]] The expiry. Is it still in date? [[slnc 500]] The issuer. Is it the expected realm? [[slnc 500]] The audience. Is it meant for this A P I? [[slnc 500]] Any failure is four zero one. [[slnc 600]] Only then do the shop's own rules run, and they can say four zero three."""

[[scene]]
key = "10-roles"
kind = "bullets"
title = "Who Does What"
body = ["Shop: the order API and its rules", "Validators: expiry, issuer, audience", "Revocations: a list, and its cost", "Issuer and SimClock: a stand-in for Keycloak", "Keycloak: the real one, in the tests"]
narration = """Here is who does what in the code. [[slnc 400]] The shop class is the order A P I and its rules. [[slnc 500]] The validators class checks expiry, issuer and audience. [[slnc 500]] The revocations class is a list of ended tokens, and counts what that costs. [[slnc 500]] The issuer and the simulated clock stand in for Keycloak in the demo. [[slnc 300]] And the real Keycloak runs in Docker in the integration tests."""

[[scene]]
key = "11-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["\"Sign in with Google\"", "Authorization: Bearer headers", "issuer-uri in Spring configuration", "Keycloak, Auth0, Okta, Cognito"]
narration = """You have probably met this already. [[slnc 400]] Sign in with Google is a login server. [[slnc 500]] Authorization colon Bearer headers carry the tokens. [[slnc 500]] Spring applications name the login server with an issuer U R I setting. [[slnc 500]] And Keycloak, Auth zero, Okta and Cognito are all login servers."""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
