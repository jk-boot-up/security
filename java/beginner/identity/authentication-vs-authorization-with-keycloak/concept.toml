[[act]]
title = "A real signature is not enough"
summary = "A correctly signed token from another issuer, and one meant for another API, are both refused with 401; without an audience check any API's token would open this one."
detail = """
Both tokens carry a good signature. The first has iss http://login.elsewhere.example/realms/other, the second has aud another-api. The shop wants iss http://login.shop.example/realms/shop and aud shop-api,
so both get 401. Without the audience check, a token the user got for any other API of the same login server would open this one. The shop checks the signature, the expiry, the issuer and the audience before its own rules run.
"""
figure = "issuer_audience"
figure_title = "Good signature, wrong issuer or audience"
figure_speech = """
The two requests, then the two responses: four zero one, both times.
"""
speech = """
In the output, first the two requests, with their issuer and audience. [[slnc 300]] Then the two responses: four zero one, and four zero one. [[slnc 300]] Four checks, every time: the signature, the expiry, the issuer, and the audience.
"""
rows = { claims = "active ok" }
console = [
    ["THE REQUESTS (GET /me, both signed with the right key):", "ok"],
    ["  1  iss http://login.elsewhere.example/realms/other", "muted"],
    ["  2  aud another-api", "muted"],
    ["THE RESPONSES (wanted: .../realms/shop and shop-api):", "ok"],
    ["  1  401  another issuer", "muted"],
    ["  2  401  another API  <- ELSE ANY API'S TOKEN WOULD WORK", "bad"],
