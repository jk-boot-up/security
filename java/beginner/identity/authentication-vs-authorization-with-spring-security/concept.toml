[docs.dependencies]
intro = """
This project uses three pieces of Spring. None of them needs a web server or a database to run here.
"""
what = [
    ["Spring Security", "a library that puts a chain of security filters in front of a web application. One filter reads the login, another checks that the request is allowed, and a third turns a refusal into a 401 or a 403. It also provides password encoders such as BCrypt, and method security with `@PreAuthorize`."],
    ["Spring MVC", "the part of Spring that maps a web address, such as /orders/O-1, to a Java method. The shop's endpoints are ordinary methods on a controller."],
    ["MockMvc", "a test tool that sends a request through the whole filter chain and the controller in memory, without opening a network port. The demo uses it so every run is fast and repeatable."],
]
why = """
The plain project builds the login, the sessions and the rules by hand, so the ideas are visible. This project shows how the same ideas are applied with a framework, which is how most real applications do it. Putting the two side by side shows what the framework does for you, and what it still leaves to you: the rules, the configuration, and remembering to protect every endpoint.
"""
install_note = "Only a JDK. Gradle downloads the rest, and the versions are pinned:"
