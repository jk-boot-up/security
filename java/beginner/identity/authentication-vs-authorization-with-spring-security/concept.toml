[poster]
headline = [["AUTHN VS AUTHZ", "text"], ["WITH SPRING SECURITY", "accent"]]
taglines = [["The same two questions, answered by a framework", "gold"]]
before = { code = "permitAll()", note = "the framework, but no checks", tag = "BEFORE" }
after = { code = "@PreAuthorize(...)", note = "401, 403 and 200", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "Authentication vs Authorization with Spring Security"
narration = """Hello, and welcome. [[slnc 400]] This video explains authentication and authorization with Spring Security, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] Authentication, written A U T H N for short, asks: who are you? [[slnc 300]] Authorization, written A U T H Z, asks: what may you do? [[slnc 300]] Spring Security answers both, with a chain of filters in front of a web application. [[slnc 600]] Think of a hotel. [[slnc 300]] The front desk checks your passport. [[slnc 300]] The key card decides which doors open. [[slnc 600]] Our domain is an online store. [[slnc 300]] By the end, you will know how a login travels and is checked, how a four oh one differs from a four oh three, and why a forgotten rule is an open door."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online store with order endpoints:", "view, cancel, refund, export.", "", "Customers Ana and Ben", "Support Sam, admin Alex", "", "Built with Spring Security."]
narration = """Here is the scenario. [[slnc 400]] An online store has endpoints to view, cancel, refund and export orders. [[slnc 400]] Ana and Ben are customers. [[slnc 300]] Sam is from support. [[slnc 300]] Alex is the admin. [[slnc 400]] Spring Security guards the endpoints."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["Authentication: who are you?", "Authorization: what may you do?", "Filter chain: checks every request first", "Role: customer, support or admin", "401: unknown.  403: known, but no."]
narration = """First, the words. [[slnc 400]] Authentication finds out who you are. [[slnc 300]] Authorization decides what you may do. [[slnc 400]] The filter chain is Spring's line of checks, in front of every request. [[slnc 400]] A role is a label on an account: customer, support, or admin. [[slnc 400]] And two answers: four oh one means we do not know you. [[slnc 300]] Four oh three means we know you, and the answer is no."""

[[scene]]
key = "03-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "04-core"
kind = "figure"
title = "One request, two questions"
body = "two_questions"
narration = """Here is the whole idea on one real example. [[slnc 400]] Every request meets two questions, in order. [[slnc 300]] Question one, who are you. [[slnc 300]] Question two, may you do this. [[slnc 500]] Three people try to refund order one. [[slnc 300]] Nobody is logged in, so question one fails: four oh one. [[slnc 300]] Question two is not even asked. [[slnc 500]] Ben is known, but he is a customer, and refund needs support or admin: four oh three. [[slnc 500]] Sam is known, and support may refund: two hundred, okay. [[slnc 500]] Now let's build up to this, one step at a time."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Use the framework's filters and encoders", "Write rules as short sentences on endpoints", "Add a second rule on the address", "Basic login only over HTTPS", "Test with requests that must be refused"]
narration = """So, how do you use it? [[slnc 400]] Use the framework's filters and password encoders, not your own. [[slnc 300]] Write each rule on the endpoint it protects. [[slnc 300]] Add a second rule on the address for anything that matters. [[slnc 300]] Send Basic logins only over H T T P S. [[slnc 300]] And test with requests that must be refused."""

[[scene]]
key = "13-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "14-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a note endpoint that", "only the owner may use, test first."]
narration = """That's authentication and authorization with Spring Security. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] The framework answers who is asking and what they may do, but a rule protects only what it is written on. [[slnc 500]] The full source code, notes, diagrams, and an animated walkthrough are in the repository. [[slnc 300]] It runs on your own machine, with only a Java development kit. [[slnc 500]] One exercise: add a note endpoint that only the order's owner may use, and write the test first. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] Here is what each class does."""

[[class]]
name = "SpringAuthDemo"
what = "runs the seven acts, requests apart from responses"
[[class.part]]
title = "requests first, then responses"
code = """
line(out, "  THE REQUESTS (" + requests + "):");
...
line(out, "  THE RESPONSES:");
...
Shop.Result result = shop.send(a.method(), a.path(), a.who(), a.password());
"""
speech = """Spring auth demo runs the seven acts. [[slnc 300]] For each act it prints the requests first, then sends them through the shop, and prints the responses."""

[[class]]
name = "Shop"
what = "one running copy of the store, through the real filter chain"
[[class.part]]
title = "MockMvc, no network"
code = """
context.register(config);
context.refresh();
mvc = MockMvcBuilders.webAppContextSetup(context)
        .addFilters(context.getBean("springSecurityFilterChain", Filter.class))
...
request.header("Authorization", BasicHeader.header(user, password));
"""
speech = """Shop starts one version of the store from a configuration class. [[slnc 300]] Every request goes through Spring Security's real filter chain, with Mock M V C, so no web server is needed. [[slnc 300]] A login is sent as the Basic header."""

[[class]]
name = "LoginOnlyConfig"
what = "version two: a login, and nothing more"
[[class.part]]
title = "the filter chain"
code = """
return http.csrf(c -> c.disable())
        .sessionManagement(s -> s.sessionCreationPolicy(SessionCreationPolicy.STATELESS))
        .httpBasic(Customizer.withDefaults())
        .authorizeHttpRequests(a -> a.anyRequest().authenticated())
"""
speech = """Login only config builds the filter chain. [[slnc 300]] H T T P Basic, no session, and any request must be authenticated. [[slnc 300]] That is all of act five's trap. [[slnc 300]] Open config says permit all instead, and policy config adds enable method security."""

[[class]]
name = "ShopController"
what = "the endpoints, each with its rule"
[[class.part]]
title = "the @PreAuthorize rules"
code = """
@PostMapping("/orders/{id}/refund")
@PreAuthorize("hasAnyRole('SUPPORT', 'ADMIN')")
...
@GetMapping("/orders/export")         // no rule: the forgotten one
public String export() {
"""
speech = """Shop controller holds the endpoints. [[slnc 300]] Each rule is written right above its method, and checked before the method runs. [[slnc 300]] Export has none: that is the forgotten rule."""

[[class]]
name = "LayeredConfig"
what = "the second layer: a rule on the address"
[[class.part]]
title = "the fix"
code = """
.requestMatchers(HttpMethod.GET, "/orders/export").hasRole("ADMIN")
.anyRequest().authenticated())
"""
speech = """Layered config adds one rule on the address. [[slnc 300]] Export needs admin, whatever the method says."""

[[class]]
name = "BasicHeader"
what = "the login, joined and written in Base64"
[[class.part]]
title = "encoding, not encryption"
code = """
return "Basic " + base64(joined(user, password));
...
return new String(Base64.getDecoder().decode(base64), StandardCharsets.UTF_8);
"""
speech = """Basic header joins the name and password, and writes them in Base sixty four. [[slnc 300]] Decode turns it straight back, with no key."""

[[class]]
name = "HashSteps"
what = "BCrypt by hand: stored parts, and the login check"
[[class.part]]
title = "hash again with the stored salt"
code = """
return Parts.of(BCrypt.hashpw(password, String.format("$2a$%02d$%s", cost, salt)));
...
return Parts.of(BCrypt.hashpw(typed, stored.version() + stored.cost() + "$" + stored.salt()));
"""
speech = """Hash steps splits the stored line into its four parts. [[slnc 300]] To check a login, it hashes the typed password again with the stored salt and cost. [[slnc 300]] A test proves Spring's encoder accepts the same line."""

[[class]]
name = "CountingPasswordEncoder"
what = "BCrypt, with a counter of password checks"
[[class.part]]
title = "count every check"
code = """
public boolean matches(CharSequence rawPassword, String encodedPassword) {
    checks.incrementAndGet();
    return bcrypt.matches(rawPassword, encodedPassword);
"""
speech = """And the counting password encoder wraps B crypt, and counts every check. [[slnc 300]] That is how the demo shows that each request pays."""

[[acronym]]
short = "AuthN"
long = "Authentication: who are you?"
say = "Auth N is short for authentication."
[[acronym]]
short = "AuthZ"
long = "Authorization: what may you do?"
say = "Auth Z is short for authorization."
[[acronym]]
short = "HTTP"
long = "HyperText Transfer Protocol"
say = "H T T P is the HyperText Transfer Protocol, how a browser and a server talk."
[[acronym]]
short = "HTTPS"
long = "HTTP Secure, HTTP inside an encrypted connection"
say = "H T T P S is H T T P inside an encrypted connection."
[[acronym]]
short = "BCrypt"
long = "Blowfish crypt, a slow password hash"
say = "B crypt is Blowfish crypt, a password hash that is slow on purpose."
[[acronym]]
short = "Base64"
long = "Bytes written with 64 safe letters"
say = "Base sixty four writes any bytes using sixty four safe letters and digits."
[[acronym]]
short = "GET/POST"
long = "HTTP methods: read / change something"
say = "Get and post are H T T P methods: get reads, post changes something."
[[acronym]]
short = "MVC"
long = "Model View Controller (Spring MVC)"
say = "M V C is Model View Controller. Mock M V C runs Spring's web layer without a server."


[threatmodel]
scope = """
The same store as the plain project, built with Spring Security: the filter chain, HTTP Basic login, BCrypt password
storage, `@PreAuthorize` rules and a rule on the address. It covers how a configuration can leave a door open and what
the framework does and does not do for you. It runs through MockMvc, so network and server concerns are out of scope.
"""
assets = [
    "Customers' orders, and the right to view or cancel only your own.",
    "The refund and export actions.",
    "Stored password hashes.",
    "The security configuration itself, which decides which requests are checked.",
]
actors = [
    "Customers Ana and Ben, support Sam, admin Alex.",
    "An anonymous visitor.",
    "A developer who adds an endpoint and forgets its rule.",
    "An attacker guessing passwords against the login.",
]
boundaries = [
    "Request to filter chain: where credentials are checked and 401 is decided.",
    "Filter chain to controller: where the address rules sit.",
    "Controller proxy to method: where `@PreAuthorize` is checked and 403 is decided.",
    "Password to stored hash: BCrypt.",
]
assumptions = [
    "The channel is protected with HTTPS in real use: HTTP Basic sends the password in every request, readable by anyone who can see the traffic. The transport-security module covers this.",
    "CSRF protection is switched off in the demo's configuration. It must stay on for any application that uses cookie-based sessions.",
    "The demo accounts and passwords are test values from the project's own code.",
]
out_of_scope = [
    "Brute-force protection on the login: the password-attacks-and-defences project covers rate limits.",
    "Sessions, remember-me and token formats.",
    "A real user database and password reset flows.",
]
tests = [
    "`FilterChainTest` checks 401, 403 and 200 for each of the four people on each configuration.",
    "`BillTest` shows the forgotten rule is open, the second layer closes it, and Basic pays one password check per request.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The passwords-and-mfa module takes the password check apart: how BCrypt and its cost work, how attackers try to beat it, and how a second factor helps.
"""

[[threat]]
id = "T1"
stride = "E"
threat = "A logged-in customer reaches refund, cancel or other people's orders"
where = "`LoginOnlyConfig` compared with `PolicyConfig`"
control = "`@PreAuthorize` rules on roles and ownership, checked before the method runs"
residual = "Rules are code and can be wrong; the filter test covers each person on each endpoint"

[[threat]]
id = "T2"
stride = "E"
threat = "A new endpoint ships without its rule"
where = "`ShopController.export`"
control = "A second rule on the address, `GET /orders/export` for ADMIN, in `LayeredConfig`"
residual = "The address rule must be kept in step with new endpoints; a deny-by-default rule at the end is stronger"

[[threat]]
id = "T3"
stride = "S"
threat = "Someone guesses a password or sends no credentials"
where = "the Basic filter, `CountingPasswordEncoder`"
control = "Passwords are checked against BCrypt hashes; no or wrong credentials give 401"
residual = "There is no limit on attempts here; rate limiting is a later project"

[[threat]]
id = "T4"
stride = "I"
threat = "The password is read in transit, because Basic sends it on every request"
where = "the Authorization header"
control = "None in the demo (MockMvc, no network)"
residual = "A real deployment must use HTTPS, or prefer sessions or tokens"

[[threat]]
id = "T5"
stride = "I"
threat = "Password hashes are stolen and attacked offline"
where = "`CommonConfig.users`"
control = "BCrypt, a slow hash with a built-in salt"
residual = "The demo's cost is 4 for speed; a real system uses 10 or more and a strong password policy"

[[threat]]
id = "T6"
stride = "D"
threat = "Slow password checks are used to load the server"
where = "BCrypt on every request"
control = "None here; the cost is shown by counting checks"
residual = "Rate limits and sessions reduce the number of checks"

[[threat]]
id = "T7"
stride = "T"
threat = "A forged cross-site request changes an order"
where = "`csrf(c -> c.disable())` in the configs"
control = "None in the demo, because it uses no cookies"
residual = "CSRF protection must be switched on for cookie-based sessions"

