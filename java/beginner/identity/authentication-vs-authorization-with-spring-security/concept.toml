# concept.toml: everything about this project that is not Java code.
# tools/conceptkit turns it into the README, docs, diagrams, animation and video scenes.
# Written for a beginner: plain words, short sentences, every term explained the first time.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "authentication-vs-authorization-with-spring-security"
module = "identity"
title = "Authentication vs Authorization with Spring Security"
short_title = "Authentication vs Authorization with Spring Security"
package = "authspring"
main_class = "SpringAuthDemo"
tagline = "The same two questions, answered by Spring Security"
bold = "Spring Security answers who is asking with a login filter and a password encoder, and what they may do with rules on the endpoints, and a forgotten rule is still an open door."
domain = "an online store"
domain_note = ""
youtube_description = """Authentication vs authorization with Spring Security, in Java: authentication finds out who is asking, and authorization decides what that person may do. Explained with an online store, like a hotel where the front desk checks your passport and the key card decides which doors open. We use Spring Security's filter chain, BCrypt password storage and PreAuthorize rules, watch a login-only shop let a customer refund orders, see Spring answer 401 and 403, and finish with the cost: a forgotten rule is an open endpoint, so a second rule on the address is worth having, and HTTP Basic checks the password on every request."""
thumb_lines = ["AUTHN VS AUTHZ", "SPRING SECURITY"]
thumb_code = "@PreAuthorize(...)"
youtube_title = "Authentication vs Authorization with Spring Security"
youtube_tags = ["spring security", "authentication", "authorization", "preauthorize", "401 vs 403", "bcrypt", "java", "cybersecurity for beginners"]

[readme]
intro = """
This project teaches the same two questions as the plain version, **authentication**
(who are you?) and **authorization** (what may you do?), but with a framework
doing the work. Spring Security puts a chain of filters in front of the
application. One filter reads the username and password. A password encoder
checks them against a stored BCrypt hash. If nobody is known, the chain answers
401. Rules written on the endpoints, such as `@PreAuthorize`, decide what a known
person may do, and a refusal is a 403.

The demo runs the real filter chain through Spring's `MockMvc`, so there is no web
server and no network port. The online store, its four people and the five acts
are the same as in the plain project, so the two can be compared side by side.
"""
analogy = """
Think of a hotel again, now with a security desk at the door. The desk checks
every guest's passport (the authentication filter), and a key-card system holds
the rules for who may open which door (the authorization rules). You still run
the hotel. The framework simply makes sure nobody walks past the desk, and that
every door asks the key-card system.
"""
scenario = """
The online store has customers Ana and Ben, support staff Sam and an admin Alex.
Version one has Spring Security installed but permits everything. Version two
requires a login and nothing else, so a signed-in customer can still refund any
order. Version three adds `@PreAuthorize` rules to the endpoints. A last act shows
two costs: an endpoint whose rule was forgotten is open to every signed-in user,
and HTTP Basic checks the password on every single request.
"""
costs = [
    "**A forgotten rule is an open endpoint.** `@PreAuthorize` protects only the methods that carry it. A rule on the address as a second layer catches the ones that forget.",
    "**HTTP Basic checks the password on every request.** BCrypt is slow on purpose, so every call pays for it. Sessions or tokens avoid this, at the cost of managing them.",
    "**Framework configuration is code to review.** The chain, the matchers and the order of the rules are as important as the rules themselves, and a mistake there is silent.",
    "**A dependency to keep up to date.** Security fixes arrive through new Spring Security versions, and falling behind is a risk of its own.",
]
too_much = """
For a tiny internal tool with a single shared password, the framework is more than the problem needs.
For anything with accounts and different rights, a framework's tested filters and password handling
are better than writing your own, which is why the plain project exists to teach the ideas and this one
to show how they are normally applied.
"""
met_before = [
    "The `@PreAuthorize`, `@Secured` and `hasRole(...)` annotations in almost every Spring application.",
    "A `SecurityFilterChain` bean, and the `authorizeHttpRequests` block inside it.",
    "The `{bcrypt}` prefix in stored passwords of Spring applications.",
    "The browser's built-in sign-in box, which is HTTP Basic.",
]
where = """
This project is the second one in [identity](..), the framework version of [authentication-vs-authorization](../authentication-vs-authorization).
"""
twin = """
The demo does not start a web server. `MockMvc` sends requests straight through the filter chain and the
dispatcher, so the results are the ones a real server would give, and the run is fast and repeatable. HTTP Basic
without a session is used because it keeps each request self-contained; real browsers more often use a login form and a
session cookie. CSRF protection is switched off in the demo's configuration to keep the code short, and must stay on for any
application that uses cookies. The BCrypt cost is 4, the lowest allowed, for speed; real systems use 10 or more.
"""
test_note = "Every line the demo prints is checked against `docs/expected-output.txt`, the filter chain runs in the same JVM with no network, and BCrypt hashes are only compared, never printed in full, so every run gives the same result."

[[act]]
title = "Spring Security present, but every request permitted"
summary = "With the filter chain set to permit everything, anyone can refund and view any order."
detail = """
Adding Spring Security to a project does not protect it by itself. In version one
the security configuration says `anyRequest().permitAll()`. A request with no
credentials asks to refund order O-1, and the answer is 200 OK. The framework is
there; nothing asked it to check anything.
"""
speech = """
First demo: Spring Security is installed, but every request is permitted. [[slnc 400]] Adding a security framework does not protect an application by itself. [[slnc 600]]
The configuration says, any request, permit all. [[slnc 300]] A request with no credentials asks to refund order one. [[slnc 300]] The answer is two hundred, okay. [[slnc 300]] The same request views the order. [[slnc 300]] Also okay. [[slnc 600]]
The framework is there. [[slnc 300]] Nothing told it to check anything.
"""
rows = { chain = "active wrong" }
console = [
    ["nobody refunds O-1: 200 OK  <- NOBODY ASKED WHO", "bad"],
    ["nobody views O-1: 200 OK", "bad"],
]

[[act]]
title = "Authentication: HTTP Basic, passwords stored as BCrypt"
summary = "No credentials or a wrong password get a 401; the right password gets 200; stored passwords start with the BCrypt marker."
detail = """
Version two requires a login. Spring Security's Basic authentication filter reads
the username and password from the request. A user-details service holds the
accounts, and a password encoder checks the password against a stored BCrypt
hash. A stored password starts with $2a$04$, which means BCrypt, cost 4. A request
with no credentials gets 401. Ben with a wrong password also gets 401. Ben with his
password gets 200 OK. A 401 answer tells the client to ask for credentials.
"""
speech = """
Second demo: authentication, with Spring Security. [[slnc 400]] A filter reads the username and password from each request. [[slnc 300]] The accounts live in a user details service. [[slnc 300]] And a password encoder checks the password against a stored hash. [[slnc 600]]
The hash is BCrypt. [[slnc 300]] A stored password starts with dollar two a dollar zero four. [[slnc 300]] That marks BCrypt, with a cost of four. [[slnc 300]] BCrypt is slow on purpose, so guessing is slow too. [[slnc 600]]
A request with no credentials gets four oh one. [[slnc 300]] Ben with a wrong password gets four oh one. [[slnc 300]] Ben with his own password gets two hundred, okay.
"""
rows = { chain = "active ok", users = "active ok" }
console = [
    ["a stored password starts with $2a$04$ (BCrypt, cost 4)", "muted"],
    ["request with no credentials: 401 UNAUTHENTICATED", "ok"],
    ["ben with a wrong password: 401 UNAUTHENTICATED", "ok"],
    ["ben with his password: 200 OK", "ok"],
]

[[act]]
title = "Authenticated is not the same as authorized"
summary = "With the login rule and nothing else, a customer can refund orders and read other people's orders."
detail = """
The configuration now says `anyRequest().authenticated()`. Every request needs a
valid login, and the team feels safe. But Ben is a customer, and he refunds order
O-1, which is Ana's: 200 OK. He views Ana's order: 200 OK. Spring Security found out
who Ben is, and nothing decided what he may do.
"""
speech = """
Third demo: a login is not enough, even with a framework. [[slnc 400]] The configuration now says, any request must be authenticated. [[slnc 600]]
Ben is a customer. [[slnc 300]] He refunds order one, which belongs to Ana. [[slnc 300]] Two hundred, okay. [[slnc 300]] He views Ana's order. [[slnc 300]] Also okay. [[slnc 600]]
Spring found out who Ben is. [[slnc 300]] Nothing decided what Ben may do.
"""
rows = { chain = "active ok", rules = "active wrong" }
console = [
    ["ben, a customer, refunds O-1: 200 OK  <- LOGGED IN, SO ALLOWED", "bad"],
    ["ben views ana's order O-1: 200 OK  <- NOT HIS ORDER", "bad"],
]

[[act]]
title = "Authorization: @PreAuthorize rules on the endpoints"
summary = "Rules on the methods decide: no credentials get 401, a customer who may not gets 403, support and admins get what their role allows."
detail = """
Method security is switched on, and each endpoint carries its rule. Viewing needs the
support or admin role, or ownership of the order. Cancelling needs the admin role, or
ownership. Refunding needs support or admin. Spring checks the rule before the method
runs. No credentials: 401. Ben refunding: 403. Ben viewing Ana's order: 403. Ben viewing
his own order O-2: 200. Sam viewing and refunding: 200. Ana cancelling Ben's order: 403.
Alex cancelling it: 200. Spring does the 401 or 403 split for us: the filter chain turns
a missing login into 401, and a refused rule into 403.
"""
speech = """
Fourth demo: authorization, with rules written on the endpoints. [[slnc 400]] A rule is a short sentence, written on the method it protects. [[slnc 300]] Spring checks it before the method runs. [[slnc 600]]
Viewing an order needs the support or admin role, or being its owner. [[slnc 300]] Cancelling needs admin, or ownership. [[slnc 300]] Refunding needs support or admin. [[slnc 600]]
No credentials, four oh one. [[slnc 300]] Ben refunds, forbidden. [[slnc 300]] Ben views Ana's order, forbidden. [[slnc 300]] Ben views his own order, okay. [[slnc 600]]
Sam views and refunds, both okay. [[slnc 300]] Ana cancels Ben's order, forbidden. [[slnc 300]] Alex, the admin, cancels it, okay. [[slnc 600]]
Spring does the split between four oh one and four oh three for us.
"""
rows = { chain = "active ok", rules = "active ok" }
console = [
    ["no credentials refunds O-1: 401 UNAUTHENTICATED", "ok"],
    ["ben refunds O-1: 403 FORBIDDEN", "ok"],
    ["ben views ana's order O-1: 403 FORBIDDEN", "ok"],
    ["ben views his own order O-2: 200 OK", "ok"],
    ["sam, from support, views O-1: 200 OK", "ok"],
    ["sam refunds O-1: 200 OK", "ok"],
    ["ana cancels ben's order O-2: 403 FORBIDDEN", "ok"],
    ["alex, an admin, cancels O-2: 200 OK", "ok"],
]

[[act]]
title = "The bill: a forgotten rule, and a password check on every request"
summary = "An endpoint without its annotation is open to every signed-in user; a rule on the address closes it; HTTP Basic checks the password on all 3 requests."
detail = """
Two costs. First, HTTP Basic sends the password on every request, so Spring checks it on
every request. Sam makes 3 requests and 3 BCrypt checks happen, which are slow on purpose.
Second, a developer adds an export endpoint and forgets its `@PreAuthorize`. Ben, a
customer, exports every order: 200 OK. A second rule, written on the address, `/orders/export`
needs the admin role, catches it: Ben gets 403 and Alex gets 200. Two layers cost a little
more configuration and cover for human mistakes.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] There are two costs. [[slnc 600]]
First, Basic authentication sends the password with every request. [[slnc 300]] So Spring checks it every time. [[slnc 300]] Sam makes three requests, and three password checks happen. [[slnc 300]] The check is slow on purpose. [[slnc 600]]
Second, a developer adds an export endpoint, and forgets the rule. [[slnc 300]] Ben, a customer, exports every order. [[slnc 300]] Two hundred, okay. [[slnc 300]] A rule protects only the methods that carry it. [[slnc 600]]
A second rule, written on the address, catches it. [[slnc 300]] Ben is forbidden. [[slnc 300]] Alex, the admin, is allowed. [[slnc 600]]
Two layers cost a little more setup, and cover for human mistakes.
"""
rows = { chain = "active amber", rules = "active amber" }
console = [
    ["sam makes 3 requests with HTTP Basic: 3 password checks", "amber"],
    ["ben exports every order, the endpoint has no @PreAuthorize: 200 OK  <- FORGOTTEN RULE", "bad"],
    ["with a rule on the address too, ben exports: 403 FORBIDDEN", "ok"],
    ["alex exports: 200 OK", "ok"],
]

