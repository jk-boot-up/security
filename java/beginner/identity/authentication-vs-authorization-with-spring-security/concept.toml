[[act]]
title = "The bill: a forgotten rule, a check every time"
summary = "HTTP Basic checks the password on all 3 of sam's requests; an export endpoint without its annotation is open to ben until a rule on the address closes it."
detail = """
Two costs. First, HTTP Basic sends the password on every request, so Spring checks it on every request: sam makes 3 requests
and 3 BCrypt checks happen, each slow on purpose. Second, before the fix: a developer adds an export endpoint and forgets its
`@PreAuthorize`, and ben, a customer, exports every order: 200 OK. After the fix: a second rule, on the address,
`/orders/export` needs the ADMIN role. Ben gets 403 and alex gets 200. Two layers cost a little more configuration and cover
for human mistakes.
"""
figure = "two_layers"
figure_title = "The bill: every request pays, and a forgotten rule"
figure_speech = """
Last, the bill. [[slnc 400]] At the top: every request pays. [[slnc 300]] Basic login sends the password each time, so Sam's three requests cost three B crypt checks. [[slnc 500]]
Before the fix: a developer adds an export endpoint, and forgets its rule. [[slnc 300]] Ben is logged in, the method has no rule, so he exports every order. [[slnc 300]] Two hundred, okay. [[slnc 500]]
After the fix: a second rule, on the address itself, says export needs admin. [[slnc 300]] Ben gets four oh three. [[slnc 300]] Alex, the admin, gets through. [[slnc 500]]
A rule protects only what it is written on. [[slnc 300]] A second layer catches the one someone forgot.
"""
speech = """
The real output. [[slnc 300]] Three requests, three password checks. [[slnc 300]] Before the fix, Ben exports: two hundred. [[slnc 300]] After the fix, Ben is forbidden, and Alex is allowed.
"""
rows = { chain = "active amber", rules = "active amber", layers = "active ok" }
console = [
    ["EVERY REQUEST PAYS (the password goes every time):", "amber"],
    ["  sam sends 3 requests: 3 password checks", "muted"],
    ["BEFORE THE FIX (export has no @PreAuthorize):", "bad"],
    ["  ben   GET /orders/export: 200 OK  <- FORGOTTEN RULE", "bad"],
    ["AFTER THE FIX (/orders/export needs ADMIN):", "ok"],
    ["  ben   GET /orders/export: 403 FORBIDDEN", "ok"],
    ["  alex  GET /orders/export: 200 OK", "ok"],
]

