    "`@EnableMethodSecurity` and `@PreAuthorize` on service or controller methods.",
    "`{bcrypt}` at the start of stored passwords.",
    "A browser's built-in sign-in box, which is HTTP Basic.",
]

[spec]
purpose = """
Teach the difference between authentication and authorization with a framework, by building the same online store as the plain project with Spring Security and comparing the results.
"""
nongoals = [
    "A running web server, HTTPS, cookies or CSRF protection: requests go through MockMvc.",
    "A real user store or single sign-on.",
    "Spring Boot auto-configuration: the contexts are written out so every piece is visible.",
]
problem = """
Learners meet Spring Security as a block of configuration that appears to protect things. The project shows exactly which lines do the authentication and which do the authorization.
"""
roles = [["Spring Security filter chain", "the `SecurityFilterChain` in each config class"], ["Accounts and passwords", "`CommonConfig` with `CountingPasswordEncoder`"], ["The rules", "`ShopController` with `@PreAuthorize`"], ["Four configurations", "`OpenConfig`, `LoginOnlyConfig`, `PolicyConfig`, `LayeredConfig`"], ["Running a copy of the shop", "`Shop`"], ["Entry point", "`SpringAuthDemo`"]]
requirements = [
    "The demo prints seven numbered acts and the output equals `docs/expected-output.txt`.",
    "A request with no or wrong credentials is answered 401 whenever authentication is required.",
    "A known user who is not allowed is answered 403 and the method body never runs.",
    "Stored passwords are BCrypt hashes and never the passwords.",
    "The export endpoint is open without a rule and closed with the second layer.",
]

