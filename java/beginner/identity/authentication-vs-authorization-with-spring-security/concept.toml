[[act]]
title = "The login on the wire: the HTTP Basic header"
summary = "ben:ben-pass, 12 bytes, becomes YmVuOmJlbi1wYXNz in Base64, three bytes to four letters at a time, and anyone can decode it back."
detail = """
HTTP Basic joins the username and password with a colon: ben:ben-pass, 12 bytes. Base64 then writes every 3 bytes as 4 letters:
ben becomes YmVu, :be becomes OmJl, n-p becomes bi1w and ass becomes YXNz. Every request carries the header
`Authorization: Basic YmVuOmJlbi1wYXNz`. Base64 is an encoding, not encryption: anyone who sees the header decodes it back to
ben:ben-pass, which is why Basic authentication belongs only on HTTPS.
"""
figure = "basic_header"
figure_title = "How the login is written into every request"
figure_speech = """
So what does the filter actually read? [[slnc 400]] Before encoding: Ben types his name and password. [[slnc 300]] They are joined by a colon. [[slnc 300]] Ben, colon, ben dash pass. [[slnc 300]] Twelve bytes. [[slnc 500]]
Then Base sixty four takes three bytes at a time, and writes each group as four letters. [[slnc 300]] B, E, N, becomes capital Y, small m, capital V, small u. [[slnc 500]]
After encoding, the request carries one header: Authorization, Basic, and the sixteen letters. [[slnc 500]]
It looks scrambled, but it is not. [[slnc 300]] Base sixty four is an encoding, not encryption. [[slnc 300]] Anyone who sees it decodes it back. [[slnc 300]] So Basic login must only travel over H T T P S.
"""
speech = """
The program builds the header step by step. [[slnc 300]] Before encoding, the joined pair. [[slnc 300]] Then four groups of three bytes, each turned into four letters. [[slnc 300]] After encoding, the header. [[slnc 300]] And the last line decodes it back, without any key.
"""
rows = { chain = "active ok" }
console = [
    ["BEFORE ENCODING (what ben types):", "ok"],
    ["  username ben, password ben-pass", "muted"],
    ["  joined   ben:ben-pass   (12 bytes)", "muted"],
    ["STEP BY STEP (every 3 bytes become 4 letters):", "amber"],
    ["  ben  ->  YmVu", "muted"],
    ["  :be  ->  OmJl", "muted"],
    ["  n-p  ->  bi1w", "muted"],
    ["  ass  ->  YXNz", "muted"],
    ["AFTER ENCODING (what every request carries):", "bad"],
    ["  Authorization: Basic YmVuOmJlbi1wYXNz", "muted"],
    ["anyone can decode it: ben:ben-pass  <- NOT ENCRYPTED", "bad"],
]

[[act]]
title = "The password check, step by step: BCrypt"
summary = "The stored line is version $2a$, cost 04, a 22-letter salt and a 31-letter hash; a login hashes the typed password again with that salt and compares."
detail = """
When ben signs up, BCrypt takes his password ben-pass, a salt and a cost of 4 (2^4 = 16 rounds, slow on purpose). The demo fixes
the salt to ShopSaltForBenAccount. so the output repeats; real use takes a random salt every time. The stored line has four parts:
version $2a$, cost 04, the salt, and a 31-letter hash, Wz1TULMouKL9lQ/.NmDs1YmiNyGmOb6. The password itself is never stored.
To check a login, the typed password is hashed again with the stored salt and cost: ben-pass gives the same hash, guess gives
t56XmVfz7dgNW5z2vW3Vm4JaetzqNUe, which is different. Spring's own BCrypt encoder agrees: true for ben-pass, false for guess.
"""
figure = "bcrypt_parts"
figure_title = "What BCrypt stores, and how a login is checked"
figure_speech = """
And how is the password checked? [[slnc 400]] Before hashing, B crypt takes three things. [[slnc 300]] Ben's password. [[slnc 300]] A salt, which is random in real use. [[slnc 300]] And a cost of four, which means two to the power four, sixteen rounds. [[slnc 500]]
After hashing, the shop stores one line, in four parts. [[slnc 300]] The version. [[slnc 300]] The cost. [[slnc 300]] The salt, in plain sight. [[slnc 300]] And the hash. [[slnc 300]] The password itself is never stored. [[slnc 500]]
To check a login, B crypt hashes the typed password again, with the same salt and cost. [[slnc 300]] Ben pass gives exactly the stored hash. [[slnc 300]] Guess gives a completely different one, so the answer is four oh one.
"""
speech = """
The real output. [[slnc 300]] Before hashing: the password, the salt, fixed here so the output repeats, and the cost. [[slnc 300]] After hashing: the four parts of the stored line.
[[page]]
Checking a login: the right password gives the same hash. [[slnc 300]] Guess gives a different hash. [[slnc 300]] And Spring's own encoder agrees.
"""
rows = { users = "active ok" }
console = [
    ["BEFORE HASHING (when ben signs up):", "ok"],
    ["  password   ben-pass", "muted"],
    ["  salt       ShopSaltForBenAccount.", "muted"],
    ["  cost       4, so 2^4 = 16 rounds", "muted"],
    ["AFTER HASHING (the stored line, in four parts):", "bad"],
    ["  version    $2a$", "muted"],
    ["  cost       04", "muted"],
    ["  salt       ShopSaltForBenAccount.", "muted"],
    ["  hash       Wz1TULMouKL9lQ/.NmDs1YmiNyGmOb6", "muted"],
    ["---", ""],
    ["CHECKING A LOGIN (hash again, same salt):", "amber"],
    ["  ben-pass  Wz1TULMouKL9lQ/.NmDs1YmiNyGmOb6  same", "ok"],
    ["  guess     t56XmVfz7dgNW5z2vW3Vm4JaetzqNUe  different", "bad"],
    ["Spring's encoder agrees: true, false", "muted"],
]

