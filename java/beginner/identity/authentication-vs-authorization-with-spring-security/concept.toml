title = "The Parts of Spring Security"
body = ["Filter chain: reads the login, answers 401", "User details service: the accounts", "Password encoder: BCrypt hashes", "Method security: @PreAuthorize rules", "Answers 403 when a rule says no"]
narration = """Before the demos, the parts. [[slnc 500]] The filter chain sits in front of the application. [[slnc 300]] It reads the login, and answers four oh one when nobody is known. [[slnc 500]] The user details service holds the accounts. [[slnc 500]] The password encoder checks passwords against stored hashes, using BCrypt. [[slnc 500]] And method security checks the rule written on each method, before it runs. [[slnc 300]] When a rule says no, the answer is four oh three."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "09-mapping"
kind = "bullets"
title = "Plain Version, Spring Version"
body = ["Credentials  ->  PasswordEncoder (BCrypt)", "UserDirectory  ->  UserDetailsService", "Authenticator  ->  the Basic filter", "PolicyGate  ->  @PreAuthorize rules", "401 and 403  ->  exception translation"]
narration = """Let's match the two versions. [[slnc 400]] The credentials class in the plain version is the password encoder in Spring. [[slnc 500]] The user directory is the user details service. [[slnc 500]] The authenticator is the Basic authentication filter. [[slnc 500]] The policy gate is the set of pre authorize rules. [[slnc 500]] And the choice between four oh one and four oh three is made by Spring's exception translation, so you do not write it yourself."""

[[scene]]
key = "10-roles"
kind = "bullets"
title = "Who Does What"
body = ["CommonConfig: controller, rules data, accounts", "OpenConfig, LoginOnlyConfig: versions one, two", "PolicyConfig: adds method security", "LayeredConfig: a second rule on the address", "Shop: runs one copy through MockMvc"]
narration = """Here is who does what in the code. [[slnc 400]] The common configuration holds what every version shares: the controller, the ownership data, and the four accounts. [[slnc 500]] The open and login only configurations are versions one and two. [[slnc 500]] The policy configuration switches on method security. [[slnc 500]] The layered configuration adds a second rule on the address. [[slnc 300]] And the shop class runs one copy of the application, through the real filter chain, without a web server."""

[[scene]]
key = "11-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["A SecurityFilterChain bean", "@PreAuthorize on methods", "{bcrypt} in stored passwords", "The browser's sign-in box"]
narration = """You have probably met these already. [[slnc 400]] A security filter chain bean, with a block of rules for web addresses, is in almost every Spring application. [[slnc 500]] Pre authorize on service methods is how most teams write their rules. [[slnc 500]] The word bcrypt in curly braces, at the start of a stored password, is a Spring convention. [[slnc 500]] And the plain sign in box that a browser pops up is HTTP Basic."""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Use the framework's filters and encoders", "Write rules as short sentences on endpoints", "Add a second rule on the address", "Test with requests that must be refused"]
narration = """So, how do you use it? [[slnc 400]] Use the framework's filters and password encoders, instead of writing your own. [[slnc 500]] Write the rules as short sentences, on the endpoints they protect. [[slnc 500]] Add a second rule on the address, for anything that matters. [[slnc 500]] And test with requests that must be refused, because a rule that nobody tried to break is only a hope."""

[[scene]]
key = "13-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a note endpoint that", "only the owner may use, test first."]
narration = """That's authentication and authorization with Spring Security. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] The framework answers who is asking and what they may do, but a rule protects only what it is written on. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine, with nothing installed except a Java development kit. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add an endpoint for a note on an order that only the owner may use, and write the test first. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
The same store as the plain project, built with Spring Security: the filter chain, HTTP Basic login, BCrypt password
storage, `@PreAuthorize` rules and a rule on the address. It covers how a configuration can leave a door open and what
the framework does and does not do for you. It runs through MockMvc, so network and server concerns are out of scope.
"""
assets = [
    "Customers' orders, and the right to view or cancel only your own.",
    "The refund and export actions.",
    "Stored password hashes.",
    "The security configuration itself, which decides which requests are checked.",
]
actors = [
    "Customers Ana and Ben, support Sam, admin Alex.",
    "An anonymous visitor.",
    "A developer who adds an endpoint and forgets its rule.",
    "An attacker guessing passwords against the login.",
]
boundaries = [
    "Request to filter chain: where credentials are checked and 401 is decided.",
    "Filter chain to controller: where the address rules sit.",
    "Controller proxy to method: where `@PreAuthorize` is checked and 403 is decided.",
    "Password to stored hash: BCrypt.",
]
assumptions = [
    "The channel is protected with HTTPS in real use: HTTP Basic sends the password in every request, readable by anyone who can see the traffic. The transport-security module covers this.",
    "CSRF protection is switched off in the demo's configuration. It must stay on for any application that uses cookie-based sessions.",
    "The demo accounts and passwords are test values from the project's own code.",
]
out_of_scope = [
    "Brute-force protection on the login: the password-attacks-and-defences project covers rate limits.",
    "Sessions, remember-me and token formats.",
    "A real user database and password reset flows.",
]
tests = [
    "`FilterChainTest` checks 401, 403 and 200 for each of the four people on each configuration.",
    "`BillTest` shows the forgotten rule is open, the second layer closes it, and Basic pays one password check per request.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The passwords-and-mfa module takes the password check apart: how BCrypt and its cost work, how attackers try to beat it, and how a second factor helps.
"""

[[threat]]
id = "T1"
stride = "E"
threat = "A logged-in customer reaches refund, cancel or other people's orders"
where = "`LoginOnlyConfig` compared with `PolicyConfig`"
control = "`@PreAuthorize` rules on roles and ownership, checked before the method runs"
residual = "Rules are code and can be wrong; the filter test covers each person on each endpoint"

[[threat]]
id = "T2"
stride = "E"
threat = "A new endpoint ships without its rule"
where = "`ShopController.export`"
control = "A second rule on the address, `GET /orders/export` for ADMIN, in `LayeredConfig`"
residual = "The address rule must be kept in step with new endpoints; a deny-by-default rule at the end is stronger"

[[threat]]
id = "T3"
stride = "S"
threat = "Someone guesses a password or sends no credentials"
where = "the Basic filter, `CountingPasswordEncoder`"
control = "Passwords are checked against BCrypt hashes; no or wrong credentials give 401"
residual = "There is no limit on attempts here; rate limiting is a later project"

[[threat]]
id = "T4"
stride = "I"
threat = "The password is read in transit, because Basic sends it on every request"
where = "the Authorization header"
control = "None in the demo (MockMvc, no network)"
residual = "A real deployment must use HTTPS, or prefer sessions or tokens"

[[threat]]
id = "T5"
stride = "I"
threat = "Password hashes are stolen and attacked offline"
where = "`CommonConfig.users`"
control = "BCrypt, a slow hash with a built-in salt"
residual = "The demo's cost is 4 for speed; a real system uses 10 or more and a strong password policy"

[[threat]]
id = "T6"
stride = "D"
threat = "Slow password checks are used to load the server"
where = "BCrypt on every request"
control = "None here; the cost is shown by counting checks"
residual = "Rate limits and sessions reduce the number of checks"

[[threat]]
id = "T7"
stride = "T"
threat = "A forged cross-site request changes an order"
where = "`csrf(c -> c.disable())` in the configs"
control = "None in the demo, because it uses no cookies"
residual = "CSRF protection must be switched on for cookie-based sessions"

