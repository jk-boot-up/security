[[act]]
title = "Authentication: HTTP Basic and BCrypt"
summary = "No login or a wrong password gets 401; the right password gets 200; the password is checked once per request that carries one."
detail = """
Version two requires a login. Spring Security's Basic authentication filter reads the username and password from the
Authorization header, a user-details service holds the accounts, and a BCrypt password encoder checks the password against
the stored line. The requests all ask for order O-2: with no login, as ben with the password guess, and as ben with ben-pass.
The responses: 401 with no password check, 401 after one failed check, and 200 OK after one successful check.
"""
figure = "login_check"
figure_title = "Who are you? The filter and the password check"
figure_speech = """
Second demo: authentication. [[slnc 300]] Now every request must log in. [[slnc 500]]
On the left, three requests for Ben's own order. [[slnc 300]] One with no login. [[slnc 300]] One from Ben, with the password guess. [[slnc 300]] One from Ben, with his real password. [[slnc 500]]
First, the Basic filter reads the Authorization header. [[slnc 300]] The first request has nothing to read, so there is no password check. [[slnc 300]] Four oh one. [[slnc 500]]
For the other two, the B crypt encoder checks the password against the stored line. [[slnc 300]] Guess does not match. [[slnc 300]] Four oh one. [[slnc 300]] The real password matches. [[slnc 300]] Two hundred, okay. [[slnc 500]]
Four oh one means: we do not know who you are.
"""
