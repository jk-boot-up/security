[[act]]
title = "Authorization: @PreAuthorize rules on the endpoints"
summary = "Rules on the methods decide: no login gets 401, a customer who may not gets 403, support and admins get what their role allows."
detail = """
Method security is switched on, and each endpoint carries its rule. Viewing needs the SUPPORT or ADMIN role, or ownership of
the order. Cancelling needs ADMIN, or ownership. Refunding needs SUPPORT or ADMIN. Spring checks the rule before the method runs.
The eight requests and their responses: nobody refunds, 401; ben refunds, 403; ben views ana's order, 403; ben views his own
order O-2, 200; sam views and refunds, 200 and 200; ana cancels ben's order, 403; alex cancels it, 200. The filter chain turns a
missing login into 401 and a refused rule into 403.
"""
figure = "rules_table"
figure_title = "Three rules, eight requests"
figure_speech = """
Fourth demo: authorization. [[slnc 300]] At the top, the three rules, each written on the method it protects. [[slnc 300]] View needs support or admin, or being the owner. [[slnc 300]] Cancel needs admin, or the owner. [[slnc 300]] Refund needs support or admin. [[slnc 500]]
Below, eight requests on the left, and their responses on the right. [[slnc 300]] Nobody logged in: four oh one. [[slnc 300]] Ben refunding, or viewing Ana's order: four oh three. [[slnc 300]] Ben viewing his own order: okay. [[slnc 500]]
Sam, from support, views and refunds: okay. [[slnc 300]] Ana cancels Ben's order: four oh three. [[slnc 300]] Alex, the admin, cancels it: okay. [[slnc 500]]
Four oh three means: we know who you are, and the answer is no.
"""
speech = """
The real output. [[slnc 300]] First the eight requests, numbered one to eight.
[[page]]
Then the eight responses, with the same numbers. [[slnc 300]] Four oh one for no login, four oh three where a rule says no, two hundred where a rule says yes.
"""
