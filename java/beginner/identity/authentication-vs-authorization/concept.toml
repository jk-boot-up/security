[[act]]
title = "The bill: sessions expire, and roles go stale"
summary = "A session dies after 3 ticks, so at tick 4 Sam gets 401; a role copied at login survives a demotion (200 OK), while looking it up costs one lookup (403)."
detail = """
The checks have costs. A session lasts 3 ticks. Sam logs in at tick 0 with tok-1; at tick 4 the age is 4, not under 3, so it has expired and his refund gets 401:
safer if a token is stolen, and a new login for him. Then a subtler cost. Before the demotion, Sam's session tok-1 holds the role SUPPORT. After Alex makes him a
CUSTOMER, a gate that uses the role copied at login still lets him refund: 200 OK, a stale role, with 0 directory lookups. A gate that looks the role up gives 403
FORBIDDEN, at the price of 1 lookup on every request.
"""
figure = "the_bill"
figure_title = "What the checks cost"
figure_speech = """
Last, the bill. [[slnc 400]] The checks cost something. [[slnc 600]]
At the top, a timeline. [[slnc 300]] Sam logs in at tick zero. [[slnc 300]] His session lives for three ticks. [[slnc 300]] At tick four, its age is four, which is not under three. [[slnc 300]] Expired. [[slnc 300]] His refund gets four oh one. [[slnc 300]] Safer if a token is stolen, and a new login for Sam. [[slnc 600]]
At the bottom, a subtler cost. [[slnc 300]] Before the demotion, Sam's session holds the role support. [[slnc 300]] After it, the directory says customer, but the session still says support. [[slnc 500]]
A gate that uses the role copied at login lets Sam refund. [[slnc 300]] Two hundred, okay. A stale role. [[slnc 300]] A gate that looks the role up says four oh three. [[slnc 300]] But that costs one lookup, on every request. [[slnc 500]]
Fast, or up to date. [[slnc 300]] Either way, it is a choice.
"""
speech = """
The program's output. [[slnc 400]] First, the session that expires at tick four, and the four oh one. [[slnc 500]]
Then before the demotion: Sam's session holds support. [[slnc 400]] After it: the copied role gives two hundred, the looked up role gives four oh three. [[slnc 300]] Zero lookups, against one.
"""
rows = { session = "active amber", role = "active amber" }
console = [
    ["SESSIONS EXPIRE:", "amber"],
    ["  sam logs in at tick 0: tok-1, lifetime 3 ticks", "muted"],
