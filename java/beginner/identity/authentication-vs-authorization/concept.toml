[[act]]
title = "How a password is checked, step by step"
summary = "The shop keeps only a 32-byte PBKDF2 hash of ben-pass with its salt; at login the typed password is hashed the same way and compared."
detail = """
The shop never stores Ben's password. When he signed up, his password ben-pass and a salt, demo-salt:ben, were hashed 10000 times with PBKDF2 and
HMAC-SHA256, giving 32 bytes that start 0f455f22 5cf85332. That hash is all the shop keeps. At login the typed password is hashed the same way,
with the same salt. guess gives 6be4814d de2bcf7c, which is different, so it is rejected. ben-pass gives 0f455f22 5cf85332 again, the same, so it is accepted.
The salt makes the same password give a different hash for every account, and the 10000 rounds make every guess slow for an attacker.
"""
figure = "password_hash"
figure_title = "How the password is checked"
figure_speech = """
So how does the shop know that ben pass is right, and guess is wrong? [[slnc 400]] It never stores the password. [[slnc 600]]
In green, the section before hashing. [[slnc 300]] When Ben signed up, the shop took his password, and a salt. [[slnc 300]] A salt is a few extra bytes, different for every account. [[slnc 300]] Here it is demo salt ben. [[slnc 500]]
P B K D F two mixes the password and the salt, with H M A C S H A two five six, ten thousand times over. [[slnc 300]] That makes each try slow for an attacker. [[slnc 500]]
In red, the section after hashing. [[slnc 300]] Thirty two bytes, starting zero f, four five, five f. [[slnc 300]] This hash is all the shop keeps. [[slnc 600]]
At login, the typed password goes through the same steps, with the same salt. [[slnc 300]] Guess gives six b, e four. [[slnc 300]] Different, so rejected. [[slnc 300]] Ben pass gives zero f, four five again. [[slnc 300]] The same, so accepted.
"""
speech = """
The same steps, printed by the program. [[slnc 400]] Before hashing: the password, the salt, and ten thousand rounds. [[slnc 500]]
After hashing: the thirty two bytes the shop keeps. [[slnc 500]]
At login: guess gives a different hash, and is rejected. [[slnc 300]] Ben pass gives the same hash, and is accepted. [[slnc 300]] The password itself is stored nowhere.
"""
rows = { authn = "active ok" }
console = [
    ["BEFORE HASHING (when ben signed up):", "ok"],
    ["  password     ben-pass", "muted"],
    ["  salt         demo-salt:ben", "muted"],
    ["  rounds       10000 of PBKDF2 with HMAC-SHA256", "muted"],
    ["AFTER HASHING (all the shop keeps, 32 bytes):", "bad"],
