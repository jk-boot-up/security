# concept.toml: everything about this project that is not Java code.
# tools/conceptkit turns it into the README, docs, diagrams, animation and video scenes.
# Written for a beginner: plain words, short sentences, every term explained the first time.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "authentication-vs-authorization"
module = "identity"
title = "Authentication vs Authorization"
short_title = "Authentication vs Authorization"
package = "auth"
main_class = "AuthDemo"
tagline = "Who are you, and what may you do?"
bold = "Authentication finds out who is asking; authorization decides what that person may do; and a shop that checks only the first lets every customer act as an administrator."
domain = "an online store"
domain_note = ""
youtube_description = """Authentication vs authorization in Java: authentication finds out who is asking, and authorization decides what that person may do. Explained with an online store, like a hotel where the front desk checks your passport and the key card decides which doors open. We watch a shop with no checks, add a login with session tokens, see why a logged-in customer can still refund orders, add roles and ownership rules with the difference between a 401 and a 403, and finish with the cost: sessions expire and roles copied at login can go stale."""
thumb_lines = ["AUTHN VS", "AUTHZ"]
thumb_code = "401 vs 403"
youtube_title = "Authentication vs Authorization in Java"
youtube_tags = ["authentication", "authorization", "401 vs 403", "sessions", "access control", "security basics", "java", "cybersecurity for beginners"]

[readme]
intro = """
Two questions sound alike and are different. **Authentication** asks: who are you?
It is proved with something only that person should have, such as a password.
**Authorization** asks: what may you do? It is decided by rules about roles and
ownership. A system that answers only the first question lets every signed-in
user do everything. The two have their own answers too: 401 means "I do not know
who you are", and 403 means "I know who you are, and you may not do this".

This project builds the online store's order endpoints three times. The first has
no checks. The second checks who is asking and nothing else. The third checks who
is asking and what that person may do.
"""
analogy = """
Think of a hotel. At the front desk, the clerk checks your passport and gives you
a key card: that is authentication. The key card then opens your room, the gym
and the lift, but not the other guests' rooms and not the staff office: that is
authorization. A hotel that gave every card access to every door would have
checked your passport for nothing.
"""
scenario = """
An online store has three kinds of people. Customers, Ana and Ben, may view and
cancel their own orders. Support staff, Sam, may view any order and issue
refunds. An admin, Alex, may do everything. The store's first version asks
nobody anything. The second adds a login, and the team believes the problem is
solved. It is not, because a logged-in customer can still refund any order and
read anyone's.
"""
costs = [
    "**Every request pays for the checks.** Looking up the session and applying the rules happens each time, so it must be fast and always available.",
    "**Sessions expire.** A short lifetime limits the damage from a stolen token, and costs real users a new login.",
    "**Roles can go stale.** A role copied into the session at login stays after a demotion, until the session ends. Looking it up each time is current, and costs a lookup per request.",
    "**The gate must be on every endpoint.** One endpoint that forgets to ask is open, however good the rules are.",
]
too_much = """
A site with one shared, public page needs neither. As soon as there are accounts, authentication
is needed. As soon as different accounts may do different things, or see different data,
authorization is needed too, and it should be written as rules in one place and not as scattered
checks.
"""
met_before = [
    "The 401 and 403 pages a browser shows, and the difference between them.",
    "A login form, a \"remember me\" box, and a \"your session has expired\" message.",
    "A \"you do not have permission to view this page\" message after you have signed in.",
    "Role names such as viewer, editor and admin in a cloud or office tool.",
]
where = """
This project is the first one in [identity](..), the second module of the beginner track.
"""
twin = """
Tokens here are numbered (`tok-1`, `tok-2`) so that the demo prints the same text every run;
real session tokens must be long and random, or they can be guessed. Time is simulated in
ticks. Passwords are stored as slow, salted hashes with a salt derived from the username so
the demo is repeatable; a real system uses a random salt for every account. Hashing and tokens
have their own projects later in the track.
"""
test_note = "Every line the demo prints is checked against `docs/expected-output.txt`, and sessions use a simulated clock, so every run gives the same result."

[[act]]
title = "The first version, with no checks"
summary = "Nobody is asked who they are, so anyone can refund and view any order."
detail = """
The first version of the shop asks nobody anything. A request with no token at all
asks to refund order O-1, and the answer is 200 OK. The same request can view the
order. There is no concept of a person, so there is nothing to protect.
"""
speech = """
First demo: the shop with no checks. [[slnc 400]] There are two kinds of check to learn. [[slnc 300]] Neither exists yet. [[slnc 600]]
A request arrives with no name and no password, and asks to refund order one. [[slnc 300]] The answer is two hundred, okay. [[slnc 300]] Nobody asked who it was. [[slnc 600]]
The same request views the order. [[slnc 300]] Also okay. [[slnc 300]] The shop has no idea that people exist.
"""
rows = { authn = "active wrong", authz = "active wrong" }
console = [
    ["nobody refunds O-1: 200 OK  <- NOBODY ASKED WHO", "bad"],
    ["nobody views O-1: 200 OK", "bad"],
]

[[act]]
title = "Authentication: finding out who is asking"
summary = "A wrong password is rejected, the right one gives a session token, and requests without a live token get a 401."
detail = """
Authentication finds out who is asking. Ben tries to log in with a wrong password
and is rejected. He logs in with his password and receives a session token,
tok-1: from now on he shows the token instead of the password. A request with no
token gets 401 UNAUTHENTICATED. A request with a made-up token, tok-99, gets the
same, because the shop never issued it. A request with Ben's token gets 200 OK.
The password is stored only as a slow, salted hash, so even the shop cannot read
it back.
"""
speech = """
Second demo: authentication. [[slnc 400]] Authentication finds out who is asking. [[slnc 600]]
Ben tries to log in with a wrong password. [[slnc 300]] Rejected. [[slnc 600]]
Ben logs in with his own password. [[slnc 300]] The shop gives him a session token. [[slnc 300]] A token is a short code that stands in for the password, for a while. [[slnc 300]] From now on, Ben shows the token, not the password. [[slnc 600]]
A request with no token gets four oh one, unauthenticated. [[slnc 300]] So does a request with a made up token. [[slnc 300]] The shop never issued it. [[slnc 300]] A request with Ben's token is accepted. [[slnc 600]]
Four oh one means, I do not know who you are.
"""
rows = { authn = "active ok", session = "active ok" }
console = [
    ["ben logs in with a wrong password: rejected", "ok"],
    ["ben logs in with his password: session tok-1", "ok"],
    ["request with no token: 401 UNAUTHENTICATED", "ok"],
    ["request with a made-up token tok-99: 401 UNAUTHENTICATED", "ok"],
    ["request with ben's token: 200 OK", "ok"],
]

[[act]]
title = "Authenticated is not the same as authorized"
summary = "With a login and nothing else, a customer can refund orders and read other people's orders."
detail = """
The team believes the problem is solved, because every request now needs a login.
But the gate only asks whether the person is logged in. Ben is a customer. He
refunds order O-1, which is Ana's, and the answer is 200 OK. He views Ana's
order, and the answer is 200 OK again. Being logged in proved who he was, and
nothing decided what he was allowed to do.
"""
speech = """
Third demo: a login is not enough. [[slnc 400]] The team thinks the problem is solved, because every request now needs a login. [[slnc 600]]
But the gate only asks one question. [[slnc 300]] Is this person logged in? [[slnc 600]]
Ben is a customer. [[slnc 300]] He refunds order one, which belongs to Ana. [[slnc 300]] Two hundred, okay. [[slnc 300]] He views Ana's order. [[slnc 300]] Also okay. [[slnc 600]]
Being logged in proved who Ben is. [[slnc 300]] Nothing decided what Ben may do.
"""
rows = { authn = "active ok", authz = "active wrong" }
console = [
    ["ben, a customer, refunds O-1: 200 OK  <- LOGGED IN, SO ALLOWED", "bad"],
    ["ben views ana's order O-1: 200 OK  <- NOT HIS ORDER", "bad"],
]

[[act]]
title = "Authorization: what may this person do?"
summary = "Roles and ownership decide: no token gets 401, a customer who may not gets 403, support and admins get what their role allows."
detail = """
Authorization is a set of rules about roles and ownership, applied after
authentication. The gate now answers in two steps. First, who is this? No live
token gets 401. Then, may this person do this to this order? If not, 403
FORBIDDEN. Ben refunding is 403, and Ben viewing Ana's order is 403, but Ben
viewing his own order O-2 is 200. Sam, from support, may view any order and
refund, so both are 200. Ana cancelling Ben's order is 403. Alex, an admin,
cancelling it is 200. The rules are written once, in one place.
"""
speech = """
Fourth demo: authorization. [[slnc 400]] Authorization decides what a known person may do. [[slnc 600]]
The gate now asks two questions, in order. [[slnc 300]] First, who is this? [[slnc 300]] No live token means four oh one. [[slnc 300]] Then, may this person do this to this order? [[slnc 300]] If not, four oh three, forbidden. [[slnc 600]]
Ben tries to refund. [[slnc 300]] Forbidden. [[slnc 300]] Ben views Ana's order. [[slnc 300]] Forbidden. [[slnc 300]] Ben views his own order. [[slnc 300]] Okay. [[slnc 600]]
Sam, from support, may view any order, and may refund. [[slnc 300]] Both okay. [[slnc 600]]
Ana cancels Ben's order. [[slnc 300]] Forbidden. [[slnc 300]] Alex, an admin, cancels it. [[slnc 300]] Okay. [[slnc 600]]
Four oh three means, I know who you are, and you may not do this.
"""
rows = { authn = "active ok", authz = "active ok", role = "active ok" }
console = [
    ["no token refunds O-1: 401 UNAUTHENTICATED", "ok"],
    ["ben refunds O-1: 403 FORBIDDEN", "ok"],
    ["ben views ana's order O-1: 403 FORBIDDEN", "ok"],
    ["ben views his own order O-2: 200 OK", "ok"],
    ["sam, from support, views O-1: 200 OK", "ok"],
    ["sam refunds O-1: 200 OK", "ok"],
    ["ana cancels ben's order O-2: 403 FORBIDDEN", "ok"],
    ["alex, an admin, cancels O-2: 200 OK", "ok"],
]

[[act]]
title = "The bill: sessions expire, and roles go stale"
summary = "A session dies after 3 ticks; a role copied at login survives a demotion, and looking it up every time costs one lookup per request."
detail = """
The checks have costs. A session lasts only 3 ticks. Sam logs in at tick 0, and at
tick 4 his refund gets 401, because the session has expired: safer if a token is
stolen, and a new login for him. Then a subtler cost. Sam logs in, and then Alex
demotes him to a customer. If the role was copied into the session at login, Sam
can still refund: 200 OK, a stale role. If the gate looks up the role every
time, the same refund is 403 FORBIDDEN, at the price of one lookup per request.
Either choice is a trade between speed and being current.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] The checks cost something. [[slnc 600]]
A session lasts only three ticks. [[slnc 300]] Sam logs in at tick zero. [[slnc 300]] At tick four he refunds, and gets four oh one. [[slnc 300]] The session expired. [[slnc 300]] That limits the damage if a token is stolen, and costs Sam a new login. [[slnc 600]]
Now a subtler cost. [[slnc 300]] Sam logs in. [[slnc 300]] Then Alex demotes Sam to a customer. [[slnc 600]]
If the role was copied into the session at login, Sam can still refund. [[slnc 300]] That is a stale role. [[slnc 600]]
If the gate looks up the role every time, the same refund is forbidden. [[slnc 300]] But that costs one lookup, on every request. [[slnc 600]]
Fast, or up to date. [[slnc 300]] Either way, it is a choice.
"""
rows = { session = "active amber", role = "active amber" }
console = [
    ["sam logs in at tick 0: tok-1, good for 3 ticks", "muted"],
    ["at tick 4 sam refunds O-1: 401 UNAUTHENTICATED (expired)", "amber"],
    ["sam logs in, then alex demotes sam to CUSTOMER", "muted"],
    ["sam refunds with the role copied at login: 200 OK  <- STALE ROLE", "bad"],
    ["sam refunds with the role looked up each time: 403 FORBIDDEN", "ok"],
    ["role lookups for that one request: 1", "amber"],
]

