The gate asks only one question. [[slnc 300]] Is this person logged in? [[slnc 300]] Yes. [[slnc 500]]
So both responses are two hundred, okay. [[slnc 300]] A customer has refunded someone else's laptop, and read someone else's order. [[slnc 600]]
Being logged in proved who Ben is. [[slnc 300]] Nothing decided what Ben may do.
"""
