[docs.session]
objectives = [
    "explain the difference between authentication and authorization in your own words",
    "say when a system should answer 401 and when 403",
    "name the mistake of checking only that a user is logged in",
    "explain what a stale role is and one way to avoid it",
]
walkthrough = """
Start with the hotel analogy: passport at the desk, key card at the door. Run the
demo one act at a time. After act two, ask the group what a request with a
made-up token should get, before reading the answer. After act three, ask what
the bug is, and who it hurts. In act five, ask the group whether they would
rather have a fast gate with a stale role or a current gate with a lookup, and
for what kind of shop.
"""
exercises = [
    "Make support unable to refund more than the order's amount of 100 dollars. Which class changes, and which test is added?",
    "Add a LOGOUT step to act five and show that the token then gets 401.",
    "Change the session lifetime to 1 tick. Which acts of the demo change?",
    "Add a rule that an admin may not refund their own order, and write the test first.",
]

[docs.explained]
sentence = """
Authentication finds out who is asking, usually by checking a password and handing out a session token; authorization decides what that person may do, using rules about roles and ownership; and a gate must do both, in that order, on every request.
"""
verdict = """
Do both, in order, in one place. Turn away requests with no known person with
401. Then apply the rules to the known person, and answer 403 when they may not.
Keep the rules in one policy and not scattered across endpoints, put the gate in
front of every endpoint, and choose on purpose whether a role is copied into the
session or looked up each time.
"""
recognise = [
    "A 401 page asking you to sign in, and a 403 page saying you may not.",
    "A session cookie that expires, followed by a login page.",
    "Role names such as viewer, editor and admin in a settings screen.",
    "A \"remember me\" box, which trades a longer session for convenience.",
]

[spec]
purpose = """
Teach the difference between authentication and authorization by building an online store's order endpoints with no checks, with a login only, and with a login and a policy of roles and ownership.
"""
nongoals = [
    "A real login page, cookies, or an HTTP server: requests are method calls.",
    "Production token design: tokens are numbered for repeatability.",
    "Multi-factor login, single sign-on or token formats: later projects.",
]
problem = """
Learners treat a login as the whole of access control. The project shows exactly what a login does and does not decide.
"""
roles = [["Who is asking", "`Authenticator`, `Credentials`, `Session`"], ["What may they do", "`PolicyGate` and its rules"], ["The three versions", "`NoGate`, `LoginOnlyGate`, `PolicyGate`"], ["The endpoints", "`Shop`"], ["Where roles live", "`UserDirectory`"], ["Entry point", "`AuthDemo`"]]
requirements = [
    "The demo prints five numbered acts and the output equals `docs/expected-output.txt`.",
    "A request without a live session is answered 401, never 403.",
    "A request from a known user who is not allowed is answered 403, never 401.",
    "A session older than its lifetime is not recognised.",
    "With the role looked up each time, a demotion takes effect on the next request.",
]

