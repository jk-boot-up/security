[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] Eight small classes. [[slnc 300]] Here is what the main ones do."""

[[class]]
name = "AuthDemo"
what = "runs the seven acts"
[[class.part]]
title = "the seven acts"
code = """
act1NoChecks(out);
act2Authentication(out);
act3PasswordCheck(out);
act4LoginIsNotEnough(out);
act5Authorization(out);
act6HowTheGateDecides(out);
act7Bill(out);
"""
speech = """Auth demo runs the seven acts, one method each. [[slnc 300]] Every act builds a fresh shop, with the same four people and two orders, so the acts do not affect each other."""

[[class]]
name = "Credentials"
what = "keeps only salted password hashes"
[[class.part]]
title = "hash, and verify"
code = """
byte[] salt = salt(username).getBytes(StandardCharsets.UTF_8);
PBEKeySpec spec = new PBEKeySpec(password.toCharArray(),
        salt, ITERATIONS, 256);
return SecretKeyFactory.getInstance("PBKDF2WithHmacSHA256")
        .generateSecret(spec).getEncoded();
...
byte[] stored = hashes.get(username);
...
byte[] attempt = hash(username, password);   // same salt and rounds
return stored != null && MessageDigest.isEqual(stored, attempt);
"""
speech = """Credentials never keeps a password. [[slnc 300]] Hash mixes the password and the salt with P B K D F two, ten thousand rounds, into thirty two bytes. [[slnc 300]] Verify hashes the typed password the same way, and compares the two hashes. [[slnc 300]] That is act three."""

[[class]]
name = "Authenticator"
what = "authentication: logins and session tokens"
[[class.part]]
title = "login, then authenticate each request"
code = """
if (!credentials.verify(username, password)) {
    return Optional.empty();                 // wrong password
}
...
Session session = new Session("tok-" + (++issued), username,
        account.role(), ticker.now());
...
if (session == null
        || ticker.now() - session.issuedAt() >= lifetimeTicks) {
    return Optional.empty();                 // unknown or expired
"""
speech = """The authenticator answers the first question, who is this. [[slnc 300]] Login checks the password, and issues a session with the user, the role, and the time. [[slnc 300]] Authenticate turns a token back into a session, but only if it exists and is younger than its lifetime."""

[[class]]
name = "LoginOnlyGate"
what = "the mistake: a login and nothing else"
[[class.part]]
title = "any live session passes"
code = """
return authenticator.authenticate(token)
        .map(s -> new Response(Status.OK,
                "logged in as " + s.username()))
        .orElseGet(() -> new Response(Status.UNAUTHENTICATED,
                "no live session"));
"""
speech = """The login only gate asks just the first question. [[slnc 300]] Any live session gets okay, whatever it asks for. [[slnc 300]] That is the bug from act four."""

[[class]]
name = "PolicyGate"
what = "authentication, then authorization"
[[class.part]]
title = "check: 401, then 403"
code = """
Optional<Session> session = authenticator.authenticate(token);
if (session.isEmpty()) {
    return new Response(Status.UNAUTHENTICATED,
            "no live session");
}
...
Role role = roleSource == RoleSource.SESSION
        ? session.get().roleAtLogin()        // copied at login
        : directory.find(user).role();       // looked up now
if (allowed(role, user, action, order)) {
...
return new Response(Status.FORBIDDEN,     // known, not allowed
"""
speech = """The policy gate asks both questions, in order. [[slnc 300]] No live session, four oh one. [[slnc 300]] Then it takes the role, copied at login or looked up now, and asks the rules. [[slnc 300]] If they say no, four oh three."""
[[class.part]]
title = "allowed: the rules, in one place"
code = """
boolean owner = order.owner().equals(user);
return switch (role) {
    case ADMIN -> true;
    case SUPPORT -> action == Action.VIEW || action == Action.REFUND;
    case CUSTOMER -> owner
            && (action == Action.VIEW || action == Action.CANCEL);
};
"""
speech = """Allowed holds all the rules, in one switch. [[slnc 300]] An admin may do anything. [[slnc 300]] Support may view and refund. [[slnc 300]] A customer may view and cancel, only when they own the order. [[slnc 300]] The table in act six is printed from this method."""

[[class]]
name = "UserDirectory"
what = "the current role of every account"
[[class.part]]
title = "find counts the lookups"
code = """
public Account find(String username) {
    lookups++;
    return accounts.get(username);
}
"""
speech = """The user directory holds the current role of every account. [[slnc 300]] Each find is counted, which is how act seven shows the price of looking the role up."""

[[class]]
name = "Status"
what = "200, 401 and 403"
[[class.part]]
title = "two different failures"
code = """
OK(200),
UNAUTHENTICATED(401),
FORBIDDEN(403);
"""
speech = """And status names the answers. [[slnc 300]] Four oh one for, I do not know who you are. [[slnc 300]] Four oh three for, I know you, and no."""

[[acronym]]
short = "AuthN"
long = "authentication: who are you?"
say = "Auth N, with an N, is short for authentication: who are you?"
[[acronym]]
short = "AuthZ"
long = "authorization: what may you do?"
say = "Auth Z, with a Z, is short for authorization: what may you do?"
[[acronym]]
short = "HTTP"
long = "HyperText Transfer Protocol"
say = "H T T P is HyperText Transfer Protocol, the language of the web. Its status codes are numbers like two hundred, four oh one and four oh three."
[[acronym]]
short = "OK"
long = "status 200: the request was done"
say = "O K, two hundred, means the request was done."
[[acronym]]
short = "PBKDF2"
long = "Password-Based Key Derivation Function 2"
say = "P B K D F two is Password Based Key Derivation Function two: a slow, salted way to hash a password."
[[acronym]]
short = "HMAC"
long = "Hash-based Message Authentication Code"
say = "H M A C is Hash based Message Authentication Code: a hash mixed with a key. P B K D F two uses it in every round."
[[acronym]]
short = "SHA-256"
long = "Secure Hash Algorithm, 256-bit"
say = "S H A two five six is Secure Hash Algorithm, two hundred and fifty six bit: the hash inside H M A C."
[[acronym]]
short = "hex"
long = "hexadecimal: each byte as two characters, 00 to ff"
say = "And hex is short for hexadecimal: every byte is written as two characters, from zero zero to f f."
