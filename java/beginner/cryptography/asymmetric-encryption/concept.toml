[[act]]
title = "A key pair: the public key locks, the private key opens"
summary = "By hand, the PIN 4821 locks to 4485 with the public key (8633, 17) and opens with the private key 497; real RSA-2048 with OAEP locks a 32-byte key into 256 bytes that only Ana's private key opens, differently every time, and at most 190 bytes fit."
detail = """
By hand, with tiny numbers: Ana picks two secret primes, 89 and 97. Her public key is n = 89 x 97 = 8633 and e = 17. Her private key is d = 497, chosen so that 17 x 497 = 8449, which is one more than 88 x 96.
The bank locks the PIN 4821 as 4821^17 mod 8633 = 4485, and Ana opens it as 4485^497 mod 8633 = 4821. Locking again gives 4485 again: textbook RSA has no randomness.
Real RSA does the same with 2048-bit numbers and OAEP padding. Ana's public key is 294 bytes. The bank locks a 32-byte key into 256 bytes. Ana's private key opens it, Eve's is refused, locking again gives different bytes
because OAEP adds randomness, and at most 190 bytes fit.
"""
figure = "rsa_real"
figure_title = "Real RSA-2048 with OAEP"
figure_speech = """
Now the real thing. [[slnc 300]] Ana publishes her public key: two hundred and ninety four bytes. [[slnc 500]]
Before encryption, in green: the bank's key, thirty two bytes. [[slnc 300]] R S A locks it with Ana's public key, plus random padding called O A E P. [[slnc 300]] After encryption, in red: two hundred and fifty six bytes. [[slnc 500]]
Ana's private key opens it. [[slnc 300]] Eve's is refused. [[slnc 300]] Locking twice gives different bytes. [[slnc 400]]
And at most one hundred and ninety bytes fit: right for a key, far too small for a statement.
"""
speech = """
The output starts with the tiny example. [[slnc 300]] Before encryption, four eight two one. [[slnc 300]] After, four four eight five. [[slnc 300]] Opened, four eight two one again. [[slnc 400]]
Locked again, it is the same four four eight five: without padding, Eve can test her guesses.
[[page]]
Then real R S A with O A E P. [[slnc 300]] Thirty two bytes before, two hundred and fifty six after. [[slnc 300]] Ana opens it, Eve is refused, and a second lock differs.
"""
rows = { pair = "active ok", rsa = "active ok" }
console = [
    ["BY HAND, WITH TINY NUMBERS:", "amber"],
    ["  two primes     p = 89, q = 97", "muted"],
    ["  public key     n = p x q = 8633, e = 17", "muted"],
    ["  private key    d = 497, as 17 x 497 = 8449 = 88 x 96 + 1", "muted"],
    ["BEFORE ENCRYPTION:", "ok"],
    ["  message        m = 4821", "muted"],
    ["AFTER ENCRYPTION (with the public key):", "bad"],
    ["  locked         c = m^e mod n = 4485", "muted"],
    ["OPENING (with the private key):", "amber"],
    ["  opened         c^d mod n = 4821", "muted"],
    ["  locked again   4485, the same  <- NO RANDOMNESS", "bad"],
    ["---", ""],
    ["REAL RSA-2048 WITH OAEP PADDING:", "amber"],
    ["  Ana's public key   294 bytes, published", "muted"],
    ["BEFORE ENCRYPTION:", "ok"],
    ["  the key            32 bytes", "muted"],
    ["AFTER ENCRYPTION:", "bad"],
    ["  on the wire        256 bytes", "muted"],
    ["OPENING:", "amber"],
    ["  Ana's private key  opens it: true", "ok"],
    ["  Eve's private key  refused", "ok"],
    ["  locked again, the same bytes: false  <- OAEP ADDS RANDOMNESS", "ok"],
    ["at most 190 bytes fit: one byte more is refused", "ok"],
]

[[act]]
title = "Hybrid encryption: RSA for the key, AES for the data"
summary = "A 10,000-byte statement is sealed with a fresh AES key, and only that key is locked with RSA: 256 + 12 + 10,016 = 10,284 bytes; Eve's key and a flipped bit are refused."
detail = """
A statement is far longer than 190 bytes, so the bank does the heavy work with AES. It makes a fresh 32-byte AES key for this one message, encrypts the 10,000-byte statement with AES-GCM, and locks only that small key with
Ana's RSA public key. The envelope holds 256 bytes of locked key, 12 of nonce and 10,016 of cipher text and tag: 10,284 bytes in all. Ana opens it. Eve's private key is refused, and a flipped bit is refused, because the AES-GCM tag covers
the data. Every message gets its own data key, so one message's key never opens another.
"""
figure = "hybrid_envelope"
figure_title = "Hybrid encryption: the envelope"
figure_speech = """
A statement is ten thousand bytes: far too big for R S A. [[slnc 500]]
So before encryption, the bank has the statement, and a fresh A E S key for this one message. [[slnc 400]]
A E S G C M locks the statement with that key. [[slnc 300]] R S A locks only the small key, with Ana's public key. [[slnc 500]]
After encryption, the envelope, to scale: [[slnc 200]] the locked key, the nonce, and the cipher text. [[slnc 300]] Ten thousand two hundred and eighty four bytes. [[slnc 400]]
Ana unlocks the A E S key with her private key, then opens the statement.
"""
speech = """
The output shows the same two sections, and the total. [[slnc 400]] Ana's private key opens it. [[slnc 300]] Eve's is refused. [[slnc 300]] And a flipped bit is refused, because the G C M tag covers the data.
"""
rows = { hybrid = "active ok" }
console = [
    ["BEFORE ENCRYPTION:", "ok"],
    ["  statement      10000 bytes, far too big for RSA", "muted"],
    ["  fresh AES key  32 bytes, made for this one message", "muted"],
    ["AFTER ENCRYPTION (the envelope):", "bad"],
    ["  locked key     256 bytes (the AES key, locked with RSA)", "muted"],
    ["  nonce          12 bytes", "muted"],
    ["  cipher text    10016 bytes (10000 + a 16-byte tag)", "muted"],
    ["  in all         10284 bytes", "muted"],
    ["OPENING:", "amber"],
    ["  Ana's private key: true", "ok"],
    ["  Eve's private key: refused", "ok"],
    ["  one bit of the cipher text flipped: refused", "ok"],
]

[[act]]
title = "Key agreement: no key is sent at all"
summary = "By hand, the bank (secret 6) and Ana (secret 15) send 8 and 19 and both get 2; with the real X25519 keys of RFC 7748 both get 4a5d9d5b..., HKDF makes the 32-byte key, Eve does not get it, and a new session gives a new key."
detail = """
Key agreement sends no key. By hand, with tiny numbers: everyone knows g = 5 and p = 23. The bank picks the secret 6 and sends 5^6 mod 23 = 8. Ana picks 15 and sends 5^15 mod 23 = 19. The bank works out 19^6 mod 23 = 2, and Ana
works out 8^15 mod 23 = 2: the same number, which neither sent. Eve saw 8 and 19, but without 6 or 15 she cannot make 2.
X25519 does the same on an elliptic curve. With the test keys of RFC 7748, the bank and Ana swap only their public keys, and both get the secret 4a5d9d5b a4ce2de1 .... HKDF turns it into the 32-byte key 34501e3e d961431b ....
On the wire are only two public keys, 44 bytes each. Eve, with a key pair of her own, gets a different key. A new session, with a new bank key, gives a different key, so an old session's key is not part of the new one: forward secrecy.
"""
figure = "key_agreement"
figure_title = "Key agreement: the same secret, never sent"
figure_speech = """
Key agreement sends no key at all. [[slnc 300]] By hand first: everyone knows five and twenty three. [[slnc 400]]
The bank picks a secret, six, and sends five to the power six, mod twenty three: eight. [[slnc 300]] Ana picks fifteen, and sends nineteen. [[slnc 400]]
Each side uses its own secret on what it received. [[slnc 300]] The bank: nineteen to the power six, mod twenty three, is two. [[slnc 300]] Ana: eight to the power fifteen is also two. [[slnc 400]]
Eve saw eight and nineteen, but without six or fifteen she cannot make two. [[slnc 400]]
Below, real X twenty five five one nine keys: [[slnc 200]] the public keys before the swap, and after it, the same secret on both sides.
"""
speech = """
In the output: the tiny example first. [[slnc 300]] Then, before the swap, the real keys. [[slnc 300]] The private keys stay home. [[slnc 300]] Only the public ones are sent.
[[page]]
After the swap, the bank and Ana get the same secret. [[slnc 300]] H K D F turns it into a thirty two byte key. [[slnc 400]]
Eve, with a key pair of her own, gets a different key. [[slnc 300]] And a new session gives a new key, so an old session's key is not in the new one. [[slnc 300]] This is called forward secrecy.
"""
rows = { agree = "active ok" }
console = [
    ["BY HAND, WITH TINY NUMBERS (everyone knows g = 5, p = 23):", "amber"],
    ["  bank secret 6    sends 5^6 mod 23 = 8", "muted"],
    ["  Ana secret 15    sends 5^15 mod 23 = 19", "muted"],
    ["  bank gets        19^6 mod 23 = 2", "muted"],
    ["  Ana gets         8^15 mod 23 = 2  <- THE SAME, NEVER SENT", "ok"],
    ["BEFORE THE SWAP (real X25519 keys, from RFC 7748):", "ok"],
    ["  bank private  77076d0a 7318a57d 3c16c172 51b26645 ...", "muted"],
    ["  bank public   8520f009 8930a754 748b7ddc b43ef75a ...", "muted"],
    ["  Ana private   5dab087e 624a8a4b 79e17f8b 83800ee6 ...", "muted"],
    ["  Ana public    de9edb7d 7b7dc1b4 d35b61c2 ece43537 ...", "muted"],
    ["---", ""],
    ["AFTER THE SWAP (own private + other's public key):", "bad"],
    ["  bank gets     4a5d9d5b a4ce2de1 728e3bf4 80350f25 ...", "muted"],
    ["  Ana gets      4a5d9d5b a4ce2de1 728e3bf4 80350f25 ...", "muted"],
    ["  the same secret: true", "ok"],
    ["HKDF turns the secret into a 32-byte key:", "amber"],
    ["  key           34501e3e d961431b 28ea6246 60fef575 ...", "muted"],
    ["on the wire: two public keys, 44 bytes each, nothing else", "muted"],
    ["Eve, with a key pair of her own: the same key: false", "ok"],
    ["a new session, a new bank key: a different key: true", "ok"],
]

[[act]]
title = "The bill: whose key is it?"
summary = "Mallory swaps Ana's public key for her own, reads PIN is 4821, locks it again for Ana, and nobody notices; RSA public keys are 294 bytes and X25519 44; a stolen private key opens everything."
detail = """
Nothing in RSA or X25519 says whose public key it is. Mallory sits on the wire and swaps Ana's public key for her own, so the bank locks the message PIN is 4821 to Mallory's key. Mallory reads it, locks it again with Ana's real public key, and sends it on.
Ana opens PIN is 4821, and nobody notices. This is a man-in-the-middle attack, and the maths cannot stop it. Signatures and certificates, in the next projects, are the answer. Other costs: an RSA-2048 public key is 294 bytes against
44 for X25519, and a stolen private key opens every message ever locked to its public key.
"""
figure = "man_in_middle"
figure_title = "The man in the middle"
figure_speech = """
Now the bill. [[slnc 300]] Mallory can change what is on the wire. [[slnc 400]]
She swaps Ana's public key for her own. [[slnc 300]] In green, what the bank sends: P I N is four eight two one, locked to Mallory's key. [[slnc 400]]
In red, Mallory opens it, reads it, and locks it again with Ana's real key. [[slnc 400]]
In amber, what Ana receives: the same message. [[slnc 300]] Nobody notices. [[slnc 400]]
Nothing in the maths says whose public key it is. [[slnc 300]] Signatures and certificates, in the next videos, answer that.
"""
speech = """
The output shows the same three sections. [[slnc 400]] Two more costs. [[slnc 300]] An R S A public key is two hundred and ninety four bytes, against forty four for X twenty five five one nine. [[slnc 300]] And a stolen private key opens every message ever locked to it.
"""
rows = { pair = "active amber", agree = "active amber" }
console = [
    ["WHAT THE BANK SENDS:", "ok"],
