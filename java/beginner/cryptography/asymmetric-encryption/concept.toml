[[act]]
title = "A key pair: lock with the public key, open with the private key"
summary = "The bank locks a 32-byte key with Ana's 294-byte public key into 256 bytes; only Ana's private key opens it, Eve's does not, and OAEP makes every lock different; at most 190 bytes fit."
detail = """
Ana makes a key pair. Her public key, 294 bytes, is published, and her private key stays with her. The bank locks the 32-byte key with the public key using RSA with OAEP padding, and 256 bytes go over the wire. Ana opens it with
her private key. Eve has the public key and the locked message, and tries her own private key: it is refused. Locking the same key again gives different bytes, because OAEP adds randomness. And only 190
bytes fit in a 2048-bit RSA lock, one byte more is refused. RSA is for carrying a key, not data.
"""
speech = """
Second demo: a key pair. [[slnc 400]] Ana makes two keys. [[slnc 300]] The public key is published, two hundred and ninety four bytes. [[slnc 300]] The private key stays with her. [[slnc 600]]
The bank locks the thirty two byte key with the public key, and two hundred and fifty six bytes go over the wire. [[slnc 300]] Ana opens it with her private key. [[slnc 600]]
Eve has the public key, and the locked message. [[slnc 300]] She tries her own private key. [[slnc 300]] Refused. [[slnc 600]]
Locking the same key again gives different bytes. [[slnc 300]] The padding, called O A E P, adds randomness. [[slnc 600]]
And only one hundred and ninety bytes fit. [[slnc 300]] One more is refused. [[slnc 300]] R S A is for carrying a key. [[slnc 300]] Not data.
"""
rows = { pair = "active ok", rsa = "active ok" }
console = [
    ["Ana publishes her public key, 294 bytes, and keeps the private key", "muted"],
    ["the bank locks the 32-byte key with it: 256 bytes on the wire", "muted"],
    ["Ana opens it: true", "ok"],
    ["Eve has the public key and the locked message, and tries her own private key: refused", "ok"],
    ["locking the same key again gives the same bytes: false  <- OAEP ADDS RANDOMNESS", "ok"],
    ["at most 190 bytes fit: one byte more is refused", "amber"],
]

[[act]]
title = "Hybrid encryption: RSA for the key, AES for the data"
summary = "A 10,000-byte statement is sealed with a fresh AES key, only that key is locked with RSA: 256 + 12 + 10,016 = 10,284 bytes; Eve's key and a flipped bit are refused."
detail = """
A statement is far longer than 190 bytes, so the bank does the heavy work with AES. It makes a fresh 256-bit AES key for this one message, encrypts the 10,000-byte statement with AES-GCM, and locks only that small key with
Ana's RSA public key. The envelope holds 256 bytes of locked key, 12 of nonce and 10,016 of cipher text and tag: 10,284 bytes in all. Ana opens it. Eve's private key is refused, and a flipped bit is refused, because the AES-GCM tag covers
the data. Every message gets its own data key, so one message's key never opens another.
"""
speech = """
Third demo: hybrid encryption. [[slnc 400]] A statement is far longer than one hundred and ninety bytes. [[slnc 600]]
So the bank does the heavy work with A E S. [[slnc 300]] It makes a fresh key, for this one message, and encrypts the ten thousand byte statement with it. [[slnc 300]] Then it locks only that small key, with Ana's R S A public key. [[slnc 600]]
The envelope holds two hundred and fifty six bytes of locked key, twelve of nonce, and ten thousand and sixteen of cipher text and tag. [[slnc 300]] Ana opens it. [[slnc 600]]
Eve's private key is refused. [[slnc 300]] A flipped bit is refused. [[slnc 300]] And every message has its own data key.
"""
rows = { hybrid = "active ok" }
console = [
    ["a 10000-byte statement is sealed with a fresh AES key, and only that key is locked with RSA", "muted"],
    ["the envelope: 256 bytes of locked key, 12 of nonce, 10016 of cipher text and tag: 10284 in all", "ok"],
    ["Ana opens it: true", "ok"],
    ["Eve tries her own private key: refused", "ok"],
    ["one bit of the cipher text is flipped: refused", "ok"],
]

[[act]]
title = "Key agreement: no key is sent at all"
summary = "The bank and Ana swap 44-byte X25519 public keys and each derives the same 32-byte key; Eve, with both public keys, does not; a new session gives a new key."
detail = """
Key agreement sends no key. The bank and Ana each make an X25519 key pair and swap only the public keys, 44 bytes each. Each combines its own private key with the other's public key, and the two get the same secret, which HKDF turns into
the same 32-byte key. Eve saw both public keys, and makes a key pair of her own. Her key comes out different, because she lacks either private key. And a new session, with a new key pair on the bank's side, gives a completely different key, so an old
session's key is not part of the new one. That is called forward secrecy.
"""
speech = """
Fourth demo: key agreement. [[slnc 400]] This sends no key at all. [[slnc 600]]
The bank and Ana each make a key pair, and swap only the public keys. [[slnc 300]] Forty four bytes each. [[slnc 600]]
Each combines its own private key with the other's public key. [[slnc 300]] They get the same secret. [[slnc 300]] A function called H K D F turns it into a thirty two byte key. [[slnc 600]]
The two keys are the same. [[slnc 300]] Eve saw both public keys, and tries her own. [[slnc 300]] Her key is different. [[slnc 600]]
A new session, with a new key pair, gives a completely new key. [[slnc 300]] So an old session's key is not part of the new one. [[slnc 300]] This is called forward secrecy.
"""
rows = { agree = "active ok" }
console = [
    ["the bank and Ana swap public keys, 44 bytes each, and nothing else", "muted"],
    ["each combines its own private key with the other's public key and gets a 32-byte key", "muted"],
    ["the two keys are the same: true", "ok"],
    ["Eve saw both public keys and makes her own: her key is the same too: false", "ok"],
    ["a new session with a new bank key gives a different key: true  <- AN OLD SESSION'S KEY IS NOT IN THE NEW ONE", "ok"],
]

[[act]]
title = "The bill: whose key is it?"
summary = "Mallory swaps Ana's public key for her own, reads the message, locks it again for Ana, and nobody notices; RSA keys are 294 bytes and X25519 44; a stolen private key opens everything."
detail = """
Nothing in RSA or X25519 says whose public key it is. Mallory sits on the wire and swaps Ana's public key for her own. The bank locks a message to the wrong key. Mallory reads it, PIN is 4821, locks it again for Ana, and sends it on. Ana opens what she receives,
and nobody notices. This is a man-in-the-middle attack, and the maths cannot stop it. Signatures and certificates, in the next projects, are the answer: they let a key arrive with proof of whose it is. Other costs: an RSA-2048 public key is 294 bytes against
44 for X25519, and a stolen private key opens every message ever locked to its public key.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] Nothing in R S A or in key agreement says whose public key it is. [[slnc 600]]
Mallory sits on the wire, and swaps Ana's public key for her own. [[slnc 300]] The bank locks a message to the wrong key. [[slnc 300]] Mallory reads it. [[slnc 300]] The message says, P I N is four eight two one. [[slnc 300]] She locks it again for Ana, and sends it on. [[slnc 600]]
Ana opens what she receives. [[slnc 300]] Nobody notices. [[slnc 600]]
This is called a man in the middle attack, and the maths cannot stop it. [[slnc 300]] Signatures and certificates, in the next videos, are the answer. [[slnc 600]]
Two more costs. [[slnc 300]] An R S A public key is two hundred and ninety four bytes, against forty four for X twenty five five one nine. [[slnc 300]] And a stolen private key opens every message ever locked to its public key.
"""
rows = { pair = "active amber", agree = "active amber" }
console = [
