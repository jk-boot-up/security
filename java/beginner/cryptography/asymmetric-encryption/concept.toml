[poster]
headline = [["ASYMMETRIC", "text"], ["ENCRYPTION", "accent"]]
taglines = [["Share a secret with someone you have never met", "gold"]]
before = { code = "send(key)", note = "Eve copies the key", tag = "BEFORE" }
after = { code = "lock(publicKey, key)", note = "only Ana's private key opens it", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "Asymmetric Encryption (RSA and Key Agreement)"
narration = """Hello, and welcome. [[slnc 400]] This video explains asymmetric encryption, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] Asymmetric encryption uses a pair of keys: [[slnc 200]] a public key, which anyone may have, [[slnc 200]] and a private key, which only its owner keeps. [[slnc 300]] What the public key locks, only the private key opens. [[slnc 500]] Like a mailbox: anyone can drop a letter in, only the owner can open it. [[slnc 500]] Our domain is an online bank, and its customer Ana, who have never met. [[slnc 400]] You will see R S A, named after Rivest, Shamir and Adleman, worked out by hand. [[slnc 300]] Then hybrid encryption, key agreement, and the one thing none of it can do."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online bank, and Ana.", "They have never met.", "", "Eve reads everything on the network.", "Mallory can change it.", "", "The bank must send an encrypted statement."]
narration = """Here is the scenario. [[slnc 400]] An online bank wants to send Ana an encrypted statement. [[slnc 400]] They have never met, so they share no secret. [[slnc 300]] Eve can read everything on the network. [[slnc 300]] And Mallory can even change it."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["Public key: anyone may have it, it locks", "Private key: only its owner keeps it, it opens", "Hybrid: AES for the data, RSA for its key", "Key agreement: the same key, none sent"]
narration = """The words. [[slnc 400]] The public key, which anyone may have, locks. [[slnc 400]] The private key, which only its owner keeps, opens. [[slnc 400]] Hybrid encryption uses A E S for the data, and R S A only for its key. [[slnc 400]] And key agreement gives two sides the same key, without either sending one."""

[[scene]]
key = "03-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "04-by-hand"
kind = "figure"
title = "RSA by hand, with tiny numbers"
body = "rsa_by_hand"
narration = """Here is what R S A does, with numbers small enough to follow. [[slnc 400]] Ana picks two secret primes, eighty nine and ninety seven. [[slnc 300]] Multiplied, they give eight six three three. [[slnc 300]] With seventeen, that is her public key. [[slnc 400]] Her private key is four nine seven, chosen so that seventeen times four nine seven is one more than eighty eight times ninety six. [[slnc 300]] Only someone who knows the primes can work it out. [[slnc 500]] Before encryption: a P I N, four eight two one. [[slnc 300]] Raised to the power seventeen, mod eight six three three, it gives four four eight five. [[slnc 500]] To open, Ana raises that to the power four nine seven, and gets four eight two one back. [[slnc 400]] Real R S A does the same, with numbers of six hundred and seventeen digits."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "11-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["HTTPS: TLS starts with a key agreement", "Encrypted email: hybrid encryption", "SSH keys: id_rsa.pub and id_rsa", "The padlock: a key checked by a certificate"]
narration = """You have met this already. [[slnc 400]] H T T P S, through T L S, begins with a key agreement. [[slnc 300]] Encrypted email uses hybrid encryption. [[slnc 300]] S S H keys come as a public and a private file. [[slnc 300]] And the browser padlock means a key was checked by a certificate."""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Hybrid: never data locked by RSA directly", "RSA only with OAEP, or X25519 key agreement", "Fresh keys for each session", "Check whose public key it is: signatures, certificates"]
narration = """So, how do you use it? [[slnc 400]] Use hybrid encryption, never data locked by R S A directly. [[slnc 300]] Use R S A only with O A E P, or a key agreement. [[slnc 300]] Use fresh keys for each session. [[slnc 300]] And always check whose public key it is."""

[[scene]]
key = "13-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "13-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Redo the tiny RSA example", "with primes 61 and 53."]
narration = """That's asymmetric encryption. [[slnc 400]] Remember this. [[slnc 300]] A public key lets strangers lock secrets to you, but nothing in the maths says whose public key it is. [[slnc 500]] The source code, notes, diagrams and an animated walkthrough are in the repository. [[slnc 400]] Try this: redo the tiny R S A example with the primes sixty one and fifty three. [[slnc 500]] If you found this useful, a like really helps. [[slnc 300]] Kindly subscribe to the channel. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
How an online bank gets an encrypted statement to a customer it has never met: the customer's public key, RSA-OAEP, hybrid encryption with AES-GCM, and X25519 key agreement with HKDF. It covers eavesdropping, tampering with messages,
and swapping a public key. It does not cover how a public key is proved to be the customer's, how private keys are stored, or TLS.
"""
assets = [
    "The contents of each statement.",
    "The customer's private key.",
    "The authenticity of the customer's public key.",
    "The session keys made by key agreement.",
]
actors = [
    "The bank, which locks messages to a public key.",
    "Ana, who publishes a public key and keeps a private one.",
    "Eve, who reads everything on the network.",
    "Mallory, who can change what is on the network, including a public key in transit.",
]
boundaries = [
    "Bank to network: only envelopes and public keys cross it.",
    "Ana's device to the network: her private key never crosses it.",
    "Public key to its owner: the line the maths cannot draw.",
]
assumptions = [
    "Private keys are not stolen.",
    "RSA-2048, X25519, AES-256-GCM and HKDF-SHA-256 are sound at this key size.",
    "In the demo, keys are fresh and random on each run, and the man in the middle is a few lines of code.",
]
out_of_scope = [
    "Certificates and signatures: they are the next projects.",
    "Storing private keys: the keystore project.",
    "Quantum computers, which would break RSA and X25519.",
]
tests = [
    "`StandardVectorsTest` checks X25519 against RFC 7748 and HKDF against RFC 5869.",
    "`RsaTest` checks lock and unlock, other keys, OAEP's randomness, the 190-byte limit and sizes.",
    "`HybridTest` checks large messages, envelope sizes, per-message keys, refusals and the man in the middle.",
    "`KeyAgreementTest` checks both sides agree, an eavesdropper's key differs, and new sessions give new keys.",
]
next = """
The next project, digital-signatures, answers the question left open here: how a message can come with proof of who made it, so that a public key can be trusted.
"""

[[threat]]
id = "T1"
stride = "I"
threat = "Eve reads a key or a statement on the network"
where = "`Wire`"
control = "No key is sent in the clear: RSA-OAEP locks it, or key agreement makes it, and AES-GCM hides the data"
residual = "Eve still sees sizes and timing, and who talks to whom"

[[threat]]
id = "T2"
stride = "S"
threat = "Mallory swaps Ana's public key for her own"
where = "`HybridBox.seal`, the bank's copy of Ana's public key"
control = "None in this project, by design"
residual = "Signatures and certificates, in the next projects, prove whose public key it is"

[[threat]]
id = "T3"
stride = "T"
threat = "A message is changed in transit, or moved to another account"
where = "`HybridBox.open`"
control = "AES-GCM's tag covers the cipher text and the associated data"
residual = "An old valid message can be replayed"

[[threat]]
id = "T4"
stride = "I"
threat = "RSA is used without padding, or on long data"
where = "`RsaBox`"
control = "OAEP is always used and at most 190 bytes are locked; data goes under AES"
residual = "A different caller could bypass the helper, so code review should look for raw RSA"

[[threat]]
id = "T5"
stride = "I"
threat = "Ana's private key is stolen, and past messages are opened"
where = "Ana's private key"
control = "With key agreement and fresh keys each session, a stolen long-term key does not reveal old sessions"
residual = "Messages locked to a long-term RSA key stay readable by a thief of that key"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] Eight small classes. [[slnc 300]] Here is what each one does."""

[[class]]
name = "AsymmetricDemo"
what = "runs the five acts"
[[class.part]]
title = "the five acts"
code = """
act1SharingProblem(out);
act2KeyPair(out);
act3Hybrid(out);
act4KeyAgreement(out);
act5Bill(out);
"""
speech = """Asymmetric demo runs the five acts and prints what you saw. [[slnc 300]] R S A keys are random, so for them it prints only sizes and results."""

[[class]]
name = "ByHand"
what = "RSA and key agreement with tiny numbers"
[[class.part]]
title = "keys, lock, open"
code = """
long n = p * q;
long phi = (p - 1) * (q - 1);
long d = BigInteger.valueOf(e).modInverse(BigInteger.valueOf(phi)).longValue();
...
return power(m, keys.e(), keys.n());          // lock: m^e mod n
...
return power(c, keys.d(), keys.n());          // open: c^d mod n
...
return base.modPow(exponent, modulus);
"""
speech = """By hand makes the tiny keys: n is p times q, and d comes from p minus one times q minus one. [[slnc 300]] Lock and open are each one power, mod n. [[slnc 300]] A test proves it matches Java's own R S A."""

[[class]]
name = "RsaBox"
what = "RSA-2048 with OAEP padding"
[[class.part]]
title = "lock with the public key"
code = """
generator.initialize(KEY_BITS);                    // 2048
...
Cipher cipher = Cipher.getInstance("RSA/ECB/OAEPPadding");
cipher.init(Cipher.ENCRYPT_MODE, publicKey, oaep());
return cipher.doFinal(message);
"""
speech = """The R S A box makes two thousand and forty eight bit key pairs. [[slnc 300]] To lock, it asks Java for R S A with O A E P padding, and the public key. """

[[class]]
name = "HybridBox"
what = "AES-GCM for the data, RSA for its key"
[[class.part]]
title = "seal"
code = """
RANDOM.nextBytes(dataKey);                         // a fresh AES key
RANDOM.nextBytes(nonce);
...
cipher.init(Cipher.ENCRYPT_MODE, new SecretKeySpec(dataKey, "AES"),
        new GCMParameterSpec(128, nonce));
cipher.updateAAD(associatedData);
return new Envelope(RsaBox.lock(recipient, dataKey), nonce, cipher.doFinal(plaintext));
"""
speech = """The hybrid box makes a fresh A E S key and nonce for each message. [[slnc 300]] A E S G C M encrypts the data. [[slnc 300]] Only the small key is locked with R S A, and all of it goes into an envelope."""

[[class]]
name = "Envelope"
what = "locked key + nonce + cipher text"
[[class.part]]
title = "what is sent"
code = """
public record Envelope(byte[] lockedKey, byte[] nonce, byte[] ciphertextWithTag) {
...
return lockedKey.length + nonce.length + ciphertextWithTag.length;
"""
speech = """The envelope holds the three parts from act three, and adds up their length."""

[[class]]
name = "KeyAgreementBox"
what = "X25519 and HKDF"
[[class.part]]
title = "the shared secret, and the key"
code = """
KeyAgreement agreement = KeyAgreement.getInstance("X25519");
agreement.init(mine);                              // my private key
agreement.doPhase(theirs, true);                   // their public key
return agreement.generateSecret();
...
return hkdf(sharedSecret, salt, info, 32);
"""
speech = """The key agreement box combines my private key with their public key, in X twenty five five one nine. [[slnc 300]] Out comes the shared secret. [[slnc 300]] H K D F then turns it into a thirty two byte key."""

[[class]]
name = "Wire"
what = "the network, with Eve on it"
[[class.part]]
title = "send"
code = """
public byte[] send(byte[] message) {
    seenByEve.add(message.clone());                // Eve gets a copy
    return message;
"""
speech = """The wire delivers every message, and gives Eve a copy."""

[[class]]
name = "Hex"
what = "bytes as text and hex"
[[class.part]]
title = "helpers"
code = """
return HexFormat.of().formatHex(bytes);
"""
speech = """And Hex prints bytes as hex, as in the key agreement output."""

