[docs.session]
objectives = [
    "explain the key-sharing problem that asymmetric encryption solves",
    "explain a public key and a private key, and what each is for",
    "say why hybrid encryption is used, and what RSA carries in it",
    "explain what key agreement does, and why a man in the middle defeats the methods in this project",
]
walkthrough = """
Start with the mailbox analogy. Run the demo one act at a time. After act one, ask the group how the bank could give Ana the key safely. After act two, ask what Eve has, and what she lacks. In act four, ask the group what Eve would
need to make the same key, and let them see that she needs a private key she does not have. In act five, ask how Ana could know the public key is really hers, and keep that question for the signatures project.
"""
exercises = [
    "Raise the RSA key size to 3072 and find which numbers in the demo change.",
    "Change `HybridBox` to bind the account in the associated data and test a message moved to another account.",
    "Make the key agreement derive two keys, one for each direction, with different `info` text.",
    "Write a test that fails if RSA is ever used without OAEP padding.",
]

[docs.explained]
sentence = """
Asymmetric encryption uses a public key that anyone may have and a private key that only its owner keeps, so two parties who have never met can lock a key to each other with RSA and OAEP, carry large data with hybrid encryption, or agree a key with X25519 and HKDF without sending one, but nothing in the maths tells them whose public key it is.
"""
verdict = """
Use hybrid encryption, with RSA-OAEP or an elliptic-curve key agreement, never raw RSA and never data locked by RSA directly. Use fresh keys for each session, so a later theft does not reveal old messages. Keep private
keys private, and always check, with a signature or a certificate, that a public key belongs to the party you think it does.
"""
recognise = [
    "`KeyPairGenerator.getInstance(\"RSA\")` and `Cipher.getInstance(\"RSA/ECB/OAEPPadding\")`.",
    "`KeyAgreement.getInstance(\"X25519\")` followed by a key derivation.",
    "An envelope with a locked key, a nonce and a cipher text.",
    "A `.pub` file next to a private key file.",
]

[spec]
purpose = """
Teach how two parties who have never met can share a secret, with RSA-OAEP, hybrid encryption and X25519 key agreement, and show the one thing they cannot do: say whose public key it is.
"""
nongoals = [
    "How RSA or elliptic curves work inside.",
    "Certificates, signatures and trust: the next projects.",
    "Storing private keys safely: the keystore project.",
]
problem = """
Learners know "public key cryptography" as a phrase but not what the keys are for, why data is not locked with RSA directly, or why a swapped public key defeats it all.
"""
roles = [["RSA with OAEP", "`RsaBox`"], ["Hybrid encryption", "`HybridBox` and `Envelope`"], ["Key agreement", "`KeyAgreementBox`"], ["The shared network", "`Wire`"], ["Entry point", "`AsymmetricDemo`"]]
requirements = [
    "RSA locks at most 190 bytes at 2048 bits with OAEP-SHA-256, and the same message locked twice differs.",
    "Another private key, a changed bit or other associated data makes opening fail.",
    "X25519 and HKDF match the published test values of RFC 7748 and RFC 5869.",
    "Both sides of a key agreement derive the same key, and an eavesdropper's key differs.",
    "The demo prints the same output on every run although its keys are random.",
]

