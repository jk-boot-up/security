[poster]
headline = [["ASYMMETRIC", "text"], ["ENCRYPTION", "accent"]]
taglines = [["Share a secret with someone you have never met", "gold"]]
before = { code = "send(key)", note = "Eve copies the key", tag = "BEFORE" }
after = { code = "lock(publicKey, key)", note = "only Ana's private key opens it", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "Asymmetric Encryption (RSA and Key Agreement)"
narration = """Hello, and welcome. [[slnc 400]] This video explains asymmetric encryption, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] With symmetric encryption, both sides need the same secret key, and the only way to share one is to send it, which an eavesdropper can read. [[slnc 300]] Asymmetric encryption solves this with a pair of keys. [[slnc 300]] A public key, which anyone may have. [[slnc 300]] And a private key, which only its owner keeps. [[slnc 300]] Anything locked with the public key can only be opened with the private key. [[slnc 600]] Think of a mailbox on the street. [[slnc 300]] Anyone can drop a letter through the slot. [[slnc 300]] Only the owner, with the key, can open the box. [[slnc 700]] In this video, the domain is an online bank, and its customer, Ana, who have never met. [[slnc 500]] By the end, you will hear how a key is locked with R S A, how big data is carried, and how two sides agree a key without sending one. [[slnc 300]] And the one thing none of it can do."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online bank, and Ana.", "They have never met.", "", "Eve reads everything on the network.", "Mallory can change it.", "", "The bank must send an encrypted statement."]
narration = """Here is the scenario. [[slnc 400]] An online bank wants to send Ana an encrypted statement. [[slnc 500]] But the bank and Ana have never met, so they share no secret. [[slnc 300]] Eve can read everything on the network between them. [[slnc 300]] And Mallory, a worse attacker, can change it. [[slnc 600]] So how can they agree a key?"""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["Public key: anyone may have it", "Private key: only its owner keeps it", "RSA with OAEP: lock a short message", "Hybrid: AES for data, RSA for its key", "Key agreement: the same key, none sent"]
narration = """Before the demos, the words. [[slnc 500]] The public key is the one that anyone may have. [[slnc 500]] The private key is the one that only its owner keeps. [[slnc 500]] R S A with O A E P locks a short message to a public key. [[slnc 500]] Hybrid encryption uses A E S for the data, and R S A only for the key. [[slnc 500]] And key agreement lets two sides end up with the same key, without either sending one."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "09-routes"
kind = "bullets"
title = "Two Routes to a Shared Key"
body = ["Lock a key with the public key (RSA-OAEP)", "Agree a key from two public keys (X25519)", "", "Either way: carry the data with AES-GCM", "", "Neither says whose public key it is"]
narration = """Let's put it together. [[slnc 400]] There are two routes to a shared key. [[slnc 500]] One. Lock a key with the other side's public key. [[slnc 500]] Two. Let both sides agree a key from their two public keys. [[slnc 500]] Either way, the data itself is carried with A E S G C M. [[slnc 600]] And neither route says whose public key it is."""

[[scene]]
key = "10-roles"
kind = "bullets"
title = "Who Does What"
body = ["RsaBox: locks and unlocks a short message", "HybridBox: AES-GCM for data, RSA for its key", "KeyAgreementBox: X25519 and HKDF", "Wire: the network, with Eve on it", "AsymmetricDemo: the five acts"]
narration = """Here is who does what in the code. [[slnc 400]] The R S A box locks and unlocks a short message. [[slnc 500]] The hybrid box uses A E S G C M for the data, and R S A for its key. [[slnc 500]] The key agreement box uses X twenty five five one nine, and H K D F. [[slnc 500]] The wire is the network, with Eve listening. [[slnc 300]] And the demo runs the five acts."""

[[scene]]
key = "11-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Every HTTPS connection", "PGP and S/MIME email", "SSH keys: id_rsa.pub and id_rsa", "The padlock in the browser"]
narration = """You have probably met this already. [[slnc 400]] Every H T T P S connection begins with a key agreement like the fourth demo. [[slnc 500]] Encrypted email, with P G P or S slash MIME, uses hybrid encryption with the recipient's public key. [[slnc 500]] The S S H key files, one ending in dot pub, are a public key and a private key. [[slnc 500]] And the padlock in the browser is what you see when the key has been checked by a certificate, which is the subject of a later video."""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Hybrid: never data locked by RSA directly", "RSA-OAEP, or an elliptic-curve key agreement", "Fresh keys for each session", "Check whose public key it is: signatures, certificates"]
narration = """So, how do you use it? [[slnc 400]] Use hybrid encryption. Never lock data with R S A directly, and never use R S A without O A E P. [[slnc 500]] Use fresh keys for each session, so a later theft does not reveal old messages. [[slnc 500]] Keep private keys private. [[slnc 500]] And always check, with a signature or a certificate, that a public key belongs to who you think it does."""

[[scene]]
key = "13-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Raise the RSA key size", "and see which numbers change."]
narration = """That's asymmetric encryption. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] A public key lets strangers lock secrets to you, but nothing in the maths says whose public key it is. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine, with nothing installed except a Java development kit. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Raise the R S A key size to three thousand and seventy two, and see which numbers in the demo change. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
How an online bank gets an encrypted statement to a customer it has never met: the customer's public key, RSA-OAEP, hybrid encryption with AES-GCM, and X25519 key agreement with HKDF. It covers eavesdropping, tampering with messages,
and swapping a public key. It does not cover how a public key is proved to be the customer's, how private keys are stored, or TLS.
"""
assets = [
    "The contents of each statement.",
    "The customer's private key.",
    "The authenticity of the customer's public key.",
    "The session keys made by key agreement.",
]
actors = [
    "The bank, which locks messages to a public key.",
    "Ana, who publishes a public key and keeps a private one.",
    "Eve, who reads everything on the network.",
    "Mallory, who can change what is on the network, including a public key in transit.",
]
boundaries = [
    "Bank to network: only envelopes and public keys cross it.",
    "Ana's device to the network: her private key never crosses it.",
    "Public key to its owner: the line the maths cannot draw.",
]
assumptions = [
    "Private keys are not stolen.",
    "RSA-2048, X25519, AES-256-GCM and HKDF-SHA-256 are sound at this key size.",
    "In the demo, keys are fresh and random on each run, and the man in the middle is a few lines of code.",
]
out_of_scope = [
    "Certificates and signatures: they are the next projects.",
    "Storing private keys: the keystore project.",
    "Quantum computers, which would break RSA and X25519.",
]
tests = [
    "`StandardVectorsTest` checks X25519 against RFC 7748 and HKDF against RFC 5869.",
    "`RsaTest` checks lock and unlock, other keys, OAEP's randomness, the 190-byte limit and sizes.",
    "`HybridTest` checks large messages, envelope sizes, per-message keys, refusals and the man in the middle.",
    "`KeyAgreementTest` checks both sides agree, an eavesdropper's key differs, and new sessions give new keys.",
]
next = """
The next project, digital-signatures, answers the question left open here: how a message can come with proof of who made it, so that a public key can be trusted.
"""

[[threat]]
id = "T1"
stride = "I"
threat = "Eve reads a key or a statement on the network"
where = "`Wire`"
control = "No key is sent in the clear: RSA-OAEP locks it, or key agreement makes it, and AES-GCM hides the data"
residual = "Eve still sees sizes and timing, and who talks to whom"

[[threat]]
id = "T2"
stride = "S"
threat = "Mallory swaps Ana's public key for her own"
where = "`HybridBox.seal`, the bank's copy of Ana's public key"
control = "None in this project, by design"
residual = "Signatures and certificates, in the next projects, prove whose public key it is"

[[threat]]
id = "T3"
stride = "T"
threat = "A message is changed in transit, or moved to another account"
where = "`HybridBox.open`"
control = "AES-GCM's tag covers the cipher text and the associated data"
residual = "An old valid message can be replayed"

[[threat]]
id = "T4"
stride = "I"
threat = "RSA is used without padding, or on long data"
where = "`RsaBox`"
control = "OAEP is always used and at most 190 bytes are locked; data goes under AES"
residual = "A different caller could bypass the helper, so code review should look for raw RSA"

[[threat]]
id = "T5"
stride = "I"
threat = "Ana's private key is stolen, and past messages are opened"
where = "Ana's private key"
control = "With key agreement and fresh keys each session, a stolen long-term key does not reveal old sessions"
residual = "Messages locked to a long-term RSA key stay readable by a thief of that key"
