The bank sends the key over the open network. [[slnc 300]] Eve sees every message on the wire, including the key. [[slnc 300]] From then on, she can open anything encrypted with it. [[slnc 600]]
A secret key cannot be sent in the clear. [[slnc 300]] And the bank and Ana have never met, so there is no safe way to hand it over.
"""
