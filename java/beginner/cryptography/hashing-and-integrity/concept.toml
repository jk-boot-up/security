    "A comparison written with `MessageDigest.isEqual` or `hmac.compare_digest`.",
]

[spec]
purpose = """
Teach the difference between a checksum, a cryptographic hash and a keyed hash by trying each against a tampering attacker on an online store's invoices and installer, and by showing the problems that remain around HMAC.
"""
nongoals = [
    "How the algorithms work inside.",
    "Choosing keys, storing them, and rotating them: the keystore project covers keys.",
    "Digital signatures: they are the next projects.",
]
problem = """
Learners know "hash" and "checksum" but not what each can prove, and so use them where an attacker defeats them.
"""
roles = [["Checksum", "`Crc32Checksum`"], ["Hash", "`Sha256`"], ["Keyed hash", "`Hmac`"], ["HMAC worked out by hand", "`HmacSteps`"], ["Hash kept beside the data", "`InvoiceStore`"], ["Tagged invoices", "`SignedInvoices` and its `Encoding`"], ["Entry point", "`IntegrityDemo`"]]
requirements = [
    "CRC-32, SHA-256 and HMAC-SHA-256 match published standard values.",
    "A hash stored beside the data is shown to be replaceable by an attacker who can write the data.",
    "A tag made without the key is refused, whether it is old, a plain hash or made with a wrong key.",
    "The two encodings show that joined fields are ambiguous and length-prefixed fields are not.",
    "The demo output equals `docs/expected-output.txt` on every run.",
]

