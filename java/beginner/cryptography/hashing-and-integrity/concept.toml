[poster]
headline = [["HASHING AND", "text"], ["INTEGRITY", "accent"]]
taglines = [["Prove data was not changed", "gold"]]
before = { code = "store(data, sha256(data))", note = "the attacker rewrites both", tag = "BEFORE" }
after = { code = "hmac(key, data)", note = "only a key holder can tag", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "Hashing and Integrity"
narration = """Hello, and welcome. [[slnc 400]] This video explains hashing and integrity, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] How do you know that data was not changed? [[slnc 300]] There are three answers, and each is stronger than the one before. [[slnc 300]] A checksum catches accidents. [[slnc 300]] A hash gives data a fingerprint. [[slnc 300]] And a keyed hash proves that the data came from someone holding a secret key. [[slnc 600]] Think of a wax seal on a letter. [[slnc 300]] A seal that anyone can buy and press shows only that the letter was not smudged. [[slnc 300]] A fingerprint written on the envelope is easily rewritten, by whoever rewrites the letter. [[slnc 300]] But a seal pressed with a private signet ring, which only the shop owns, cannot be forged. [[slnc 700]] In this video, the domain is an online store, with invoices, and an installer for download. [[slnc 500]] By the end, you will hear why a checksum fails, why a hash beside the data fails, and what H M A C does. [[slnc 300]] And three things that still go wrong around a good tag."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online store sends invoices", "and offers an installer to download.", "", "Ana's invoice: a laptop, 1,200 dollars.", "An attacker wants it to say 12.", "", "Nobody must notice."]
narration = """Here is the scenario. [[slnc 400]] An online store sends invoices, and offers an installer for its app. [[slnc 500]] Ana's invoice is for a laptop, at twelve hundred dollars. [[slnc 500]] An attacker wants it to say twelve dollars, and does not want anyone to notice. [[slnc 600]] The store tries a checksum, then a hash, then a hash kept beside the invoice, then a hash published somewhere else, and finally H M A C. [[slnc 300]] After each one, the attacker tries again."""

[[scene]]
key = "03-three"
kind = "bullets"
title = "Three Tools"
body = ["Checksum (CRC-32): damage by accident", "Hash (SHA-256): a fixed-size fingerprint", "Keyed hash (HMAC): needs a secret key", "", "Each is stronger than the one before."]
narration = """Before the demos, the three tools. [[slnc 500]] A checksum, such as C R C thirty two, is a short number that changes when data is damaged by accident. [[slnc 500]] A hash, such as S H A two fifty six, is a fixed size fingerprint. A tiny change gives a completely different one. [[slnc 500]] And a keyed hash, called H M A C, mixes in a secret key. [[slnc 600]] None of them hides the data. [[slnc 300]] They only say whether it was changed."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "09-ladder"
kind = "bullets"
title = "What Each One Proves"
body = ["CRC: not damaged by accident", "Hash beside the data: nothing against an attacker", "Hash by another road: the file is the one published", "HMAC: made by a key holder, unchanged", "", "Signature: made by one named holder (next)"]
narration = """Let's put them side by side. [[slnc 400]] A C R C shows the data was not damaged by accident. [[slnc 500]] A hash beside the data proves nothing against an attacker. [[slnc 500]] A hash that comes by another road shows that a file is the one that was published. [[slnc 500]] H M A C shows the data was made by a key holder, and not changed. [[slnc 600]] And a digital signature, in the next video, shows it was made by one particular holder, which H M A C cannot."""

[[scene]]
key = "10-roles"
kind = "bullets"
title = "Who Does What"
body = ["Crc32Checksum, Sha256, Hmac: the three tools", "InvoiceStore: a hash kept beside the data", "SignedInvoices: HMAC tags, two encodings", "Invoice: four fields", "IntegrityDemo: the five acts"]
narration = """Here is who does what in the code. [[slnc 400]] Three small classes wrap the three tools, each from the standard library. [[slnc 500]] The invoice store keeps a plain hash beside each invoice, so the demo can show it replaced. [[slnc 500]] The signed invoices class tags invoices with H M A C, in two encodings, so the demo can show the boundary trick. [[slnc 300]] And the invoice is four fields."""

[[scene]]
key = "11-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["A SHA-256 checksum beside a download", "Git: commits named by hashes", "A signature header on a webhook", "JWTs with HS256"]
narration = """You have probably met these already. [[slnc 400]] A checksum beside a download is the hash by another road. [[slnc 500]] Git names every commit by a hash of its contents. [[slnc 500]] Webhooks that arrive with a signature header are carrying an H M A C of their body. [[slnc 500]] And a J W T signed with H S two fifty six is H M A C with S H A two fifty six."""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["CRC only for accidents", "Never a plain hash against an attacker", "HMAC with a secret key for data worth changing", "Unambiguous encoding, a number or time, constant-time compare", "A signature when checkers must not be able to tag"]
narration = """So, how do you use them? [[slnc 400]] Use a C R C only for accidents. [[slnc 500]] Never rely on a plain hash against an attacker. [[slnc 500]] For data worth changing, use H M A C with a secret key. [[slnc 500]] Encode the fields without ambiguity, give each message a number or a time that the receiver checks, and compare in constant time. [[slnc 500]] And use a signature, when the checker must not be able to make the tag."""

[[scene]]
key = "13-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a timestamp to the invoice", "and refuse old tags."]
narration = """That's hashing and integrity. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] A hash beside the data protects nothing, and only a keyed hash proves that someone with the key made it. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine, with nothing installed except a Java development kit. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a timestamp to the invoice, and make the service refuse tags that are older than five minutes. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
Invoices and an installer of an online store, from the order service to the warehouse and to customers, while they are stored,
carried over networks and mirrors, and checked. It covers whether a change can go unnoticed, whether a tag can be forged, copied or
reused, and who holds the key. It does not cover keeping the contents secret, which is the job of encryption, in the next project.
"""
assets = [
    "The correctness of each invoice, especially its amount.",
    "The installer, which customers will run.",
    "The secret key for HMAC.",
    "The record of which invoice numbers were accepted.",
]
actors = [
    "The order service, which tags invoices.",
    "The warehouse, which checks tags, and holds the same key.",
    "An attacker who can change stored data, a transfer, or a mirror.",
    "An attacker who can watch and resend valid messages.",
]
boundaries = [
    "Order service to warehouse: invoices and tags cross a network an attacker may influence.",
    "Application to storage: the invoice and any hash beside it can be rewritten together.",
    "Shop's website to mirrors: the published hash and the file travel by different roads.",
    "Key holders: everyone inside this line can make tags.",
]
assumptions = [
    "The key is kept secret, and the attacker does not hold it.",
    "The shop's own website is trusted for the published hash.",
    "The JDK's SHA-256 and HMAC are correct; the tests check them against published values.",
    "The demo key is a fixed value for repeatability and must never protect real data.",
]
out_of_scope = [
    "Confidentiality: encryption is the next project.",
    "Signatures that prove which key holder made a tag.",
    "Key storage, rotation and distribution.",
    "Timing attacks beyond the constant-time comparison.",
]
tests = [
    "`HashesTest` checks CRC-32, SHA-256 and HMAC against published values, and the avalanche counts.",
    "`InvoiceStoreTest` shows a hash beside the data is replaceable, and a hash from another channel is not.",
    "`SignedInvoicesTest` checks tags, forged tags, the boundary trick in both encodings, replay and the shared key.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next project, symmetric-encryption, adds secrecy: AES-GCM both hides the data and detects changes, and shows what goes wrong with reused nonces.
"""

[[threat]]
id = "T1"
stride = "T"
threat = "An attacker who can write the data also writes a new hash or CRC beside it"
where = "`InvoiceStore`, `Crc32Checksum`"
control = "Do not rely on a plain hash or a CRC against an attacker; use HMAC, or a hash that arrives by another channel"
residual = "A published hash only protects while the channel that carries it is safe"

[[threat]]
id = "T2"
stride = "T"
threat = "A mirror or a network changes a download or an invoice in transit"
where = "the installer and the invoice on their way"
control = "A hash published on the shop's own HTTPS site; an HMAC tag on the invoice"
residual = "Whoever controls the shop's own site controls the published hash"

[[threat]]
id = "T3"
stride = "T"
threat = "A valid invoice and tag are sent again, or a field boundary is moved"
where = "`SignedInvoices`"
control = "Length-prefixed fields, and the service remembers invoice numbers"
residual = "Remembered numbers must be kept as long as tags stay valid; a timestamp can limit how long"

[[threat]]
id = "T4"
stride = "S"
threat = "An attacker forges a tag without the key"
where = "`Hmac`"
control = "A tag is only valid for the right key and message; the comparison is constant-time"
residual = "HMAC is only as strong as the secrecy and length of the key"

[[threat]]
id = "T5"
stride = "R"
threat = "A holder of the shared key makes a tag and nobody can tell who"
where = "the key shared by the order service and the warehouse"
control = "None with HMAC"
residual = "Digital signatures with a private key give each maker an identity; the next projects cover them"
