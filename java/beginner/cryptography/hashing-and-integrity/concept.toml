Start with the wax seal analogy. Run the demo one act at a time. After act one, ask the group what the attacker needed in order to pass the check, and let them conclude that nothing
secret was involved. After act three, ask where the published hash should be kept, and why the shop's own website works but the mirror does not. In act five, ask the group how the
warehouse could be given the ability to check tags without the ability to make them, and keep that question for the signatures project.
"""
exercises = [
    "Add a separator that cannot appear in the data to the JOINED encoding and test the boundary trick again.",
    "Add a timestamp to the invoice and make the service refuse tags older than 5 minutes.",
    "Write a test that fails if the HMAC check uses an ordinary string comparison.",
    "Compute the SHA-256 of a file on your disk and compare it with the value your operating system's tool gives.",
]

[docs.explained]
sentence = """
A checksum catches accidental damage, a cryptographic hash gives data a fixed-size fingerprint that changes completely when the data changes, and only a keyed hash such as HMAC proves that data was made by a holder of a secret key and not changed since.
"""
verdict = """
Use a CRC only for accidents, never a plain hash to protect against an attacker, and a hash only when it reaches the checker by another road. For data that an attacker could gain
by changing, use HMAC with a secret key, encode the fields unambiguously, give each message a number or a time that the receiver checks, compare in constant time, and use a
signature when the checker must not be able to make the tag.
"""
recognise = [
    "A SHA-256 checksum beside a download.",
    "An `X-Signature` or `X-Hub-Signature-256` header on a webhook.",
    "A JWT with the algorithm HS256.",
    "A comparison written with `MessageDigest.isEqual` or `hmac.compare_digest`.",
]

[spec]
purpose = """
Teach the difference between a checksum, a cryptographic hash and a keyed hash by trying each against a tampering attacker on an online store's invoices and installer, and by showing the problems that remain around HMAC.
"""
nongoals = [
    "How the algorithms work inside.",
    "Choosing keys, storing them, and rotating them: the keystore project covers keys.",
    "Digital signatures: they are the next projects.",
]
problem = """
Learners know "hash" and "checksum" but not what each can prove, and so use them where an attacker defeats them.
"""
roles = [["Checksum", "`Crc32Checksum`"], ["Hash", "`Sha256`"], ["Keyed hash", "`Hmac`"], ["Hash kept beside the data", "`InvoiceStore`"], ["Tagged invoices", "`SignedInvoices` and its `Encoding`"], ["Entry point", "`IntegrityDemo`"]]
