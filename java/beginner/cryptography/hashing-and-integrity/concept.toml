[[act]]
title = "A hash kept beside the data"
summary = "A hash stored next to the invoice catches a change to the invoice alone, but not an attacker who rewrites both; a hash published on the shop's own site catches a tampered download."
detail = """
The store keeps a SHA-256 of each invoice right beside it. After attack 1, the invoice says 12 dollars and the old hash is left: they no longer match, and the change is caught.
After attack 2, the attacker, who can write the invoice, writes its new hash 242683b46b4c... too: the pair matches, and nothing is caught. The hash protected nothing, because there
is no secret in it. A hash helps when it reaches the checker by another road. The shop publishes its installer's hash, 891124db5651..., on its own site over HTTPS. A copy from a
mirror hashes to 70fa24395df6..., so it is refused. The mirror can change the file, but not the hash on the shop's site.
"""
figure = "hash_beside"
figure_title = "A hash beside the data, and a hash by another road"
figure_speech = """
Third, the store keeps a hash beside each invoice. [[slnc 400]] On the left, before the attack. [[slnc 600]]
In the middle, attack one. [[slnc 300]] The amount is changed, and the hash is left. [[slnc 300]] They no longer match: caught. [[slnc 600]]
On the right, attack two. [[slnc 300]] The attacker writes a new hash too. [[slnc 300]] They match. [[slnc 300]] Not caught. [[slnc 600]]
At the bottom, a hash by another road. [[slnc 300]] The shop publishes its installer's hash on its own site, over H T T P S. [[slnc 300]] A copy from a mirror hashes to something else, so it is refused. [[slnc 300]] The mirror can change the file, but not the shop's site.
"""
speech = """
Here is the output. [[slnc 400]] After attack one, intact is false. [[slnc 300]] After attack two, intact is true.
[[page]]
And by another road, the two hashes differ, so the download is refused.
"""
rows = { hash = "active amber", channel = "active ok" }
console = [
