[[scene]]
key = "01-poster"
kind = "poster"
title = "Hashing and Integrity"
narration = """Hello, and welcome. [[slnc 400]] This video explains hashing and integrity, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] How do you know that data was not changed? [[slnc 300]] A checksum catches accidents. [[slnc 300]] A hash gives data a fingerprint. [[slnc 300]] And a keyed hash, called H M A C, short for Hash based Message Authentication Code, proves the data came from someone holding a secret key. [[slnc 600]] Like a wax seal pressed with the shop's own ring: nobody else can make it. [[slnc 700]] The domain is an online store, with invoices, and an installer to download. [[slnc 500]] By the end, you will know why a checksum and a hash beside the data fail, how an H M A C tag is made, and what still goes wrong around it."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online store sends invoices", "and offers an installer to download.", "", "Ana's invoice: a laptop, 1,200 dollars.", "An attacker wants it to say 12.", "", "Nobody must notice."]
narration = """Here is the scenario. [[slnc 400]] An online store sends invoices, and offers an installer for its app. [[slnc 500]] Ana's invoice is for a laptop, at twelve hundred dollars. [[slnc 500]] An attacker wants it to say twelve dollars, without anyone noticing. [[slnc 600]] The store tries a checksum, then a hash, then H M A C. [[slnc 300]] After each one, the attacker tries again."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["Checksum: a short number that catches accidents", "Hash: a fixed-size fingerprint of any data", "Key: a secret only the store holds", "Tag: a keyed hash, sent with the data", "", "None of them hides the data."]
narration = """The words. [[slnc 400]] A checksum is a short number that changes when data is damaged by accident. [[slnc 400]] A hash is a fixed size fingerprint of any data. [[slnc 400]] The key is a secret only the store holds. [[slnc 400]] A tag is a hash made with the key. [[slnc 400]] None of them hides the data."""

[[scene]]
key = "03-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "04-hash"
kind = "figure"
title = "What SHA-256 does to one invoice"
body = "hash_one"
narration = """First, what a hash does to one invoice. [[slnc 400]] Before hashing, in green: Ana's invoice, twenty four characters, each with its byte below. [[slnc 300]] I is four nine. [[slnc 500]] S H A two fifty six mixes every byte into every byte of its result. [[slnc 500]] After hashing, in red: thirty two bytes, eight seven, eight two, and so on. [[slnc 500]] The same invoice always gives the same hash. [[slnc 300]] Any other input gives a completely different one. [[slnc 300]] And nothing secret went in: anyone can work it out."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "11-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["A SHA-256 checksum beside a download", "Git: commits named by hashes", "A signature header on a webhook", "JWTs with HS256"]
narration = """You have met these already. [[slnc 400]] A checksum beside a download is the hash by another road. [[slnc 400]] Git names commits by hashes. [[slnc 400]] Webhook signature headers carry an H M A C of the body. [[slnc 400]] And a J W T with H S two fifty six is H M A C with S H A two fifty six."""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["CRC only for accidents", "Never a plain hash against an attacker", "HMAC with a secret key for data worth changing", "Unambiguous encoding, a number or time, constant-time compare", "A signature when checkers must not be able to tag"]
narration = """So, how do you use them? [[slnc 400]] Use a C R C only for accidents. [[slnc 400]] Never a plain hash against an attacker. [[slnc 400]] H M A C with a secret key, for data worth changing. [[slnc 400]] Fields without ambiguity, a number or a time, and a constant time compare. [[slnc 400]] And a signature when the checker must not be able to tag."""

[[scene]]
key = "13-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "13-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a timestamp to the invoice", "and refuse old tags."]
narration = """That's hashing and integrity. [[slnc 400]] Remember this. [[slnc 300]] A hash beside the data protects nothing, and only a keyed hash proves that someone with the key made it. [[slnc 500]] The source code, notes, diagrams, and an animated walkthrough are in the repository, and run with only a Java development kit. [[slnc 500]] One exercise: add a timestamp to the invoice, and refuse tags older than five minutes. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
Invoices and an installer of an online store, from the order service to the warehouse and to customers, while they are stored,
carried over networks and mirrors, and checked. It covers whether a change can go unnoticed, whether a tag can be forged, copied or
reused, and who holds the key. It does not cover keeping the contents secret, which is the job of encryption, in the next project.
"""
assets = [
    "The correctness of each invoice, especially its amount.",
    "The installer, which customers will run.",
    "The secret key for HMAC.",
    "The record of which invoice numbers were accepted.",
]
actors = [
    "The order service, which tags invoices.",
    "The warehouse, which checks tags, and holds the same key.",
    "An attacker who can change stored data, a transfer, or a mirror.",
    "An attacker who can watch and resend valid messages.",
]
boundaries = [
    "Order service to warehouse: invoices and tags cross a network an attacker may influence.",
    "Application to storage: the invoice and any hash beside it can be rewritten together.",
    "Shop's website to mirrors: the published hash and the file travel by different roads.",
    "Key holders: everyone inside this line can make tags.",
]
assumptions = [
    "The key is kept secret, and the attacker does not hold it.",
    "The shop's own website is trusted for the published hash.",
    "The JDK's SHA-256 and HMAC are correct; the tests check them against published values.",
    "The demo key is a fixed value for repeatability and must never protect real data.",
]
out_of_scope = [
    "Confidentiality: encryption is the next project.",
    "Signatures that prove which key holder made a tag.",
    "Key storage, rotation and distribution.",
    "Timing attacks beyond the constant-time comparison.",
]
tests = [
    "`HashesTest` checks CRC-32, SHA-256 and HMAC against published values, and the avalanche counts.",
    "`InvoiceStoreTest` shows a hash beside the data is replaceable, and a hash from another channel is not.",
    "`HmacStepsTest` checks that the four steps by hand give the JDK's exact tag, and RFC 4231 test case one.",
    "`SignedInvoicesTest` checks tags, forged tags, the boundary trick in both encodings, replay and the shared key.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next project, symmetric-encryption, adds secrecy: AES-GCM both hides the data and detects changes, and shows what goes wrong with reused nonces.
"""

[[threat]]
id = "T1"
stride = "T"
threat = "An attacker who can write the data also writes a new hash or CRC beside it"
where = "`InvoiceStore`, `Crc32Checksum`"
control = "Do not rely on a plain hash or a CRC against an attacker; use HMAC, or a hash that arrives by another channel"
residual = "A published hash only protects while the channel that carries it is safe"

[[threat]]
id = "T2"
stride = "T"
threat = "A mirror or a network changes a download or an invoice in transit"
where = "the installer and the invoice on their way"
control = "A hash published on the shop's own HTTPS site; an HMAC tag on the invoice"
residual = "Whoever controls the shop's own site controls the published hash"

[[threat]]
id = "T3"
stride = "T"
threat = "A valid invoice and tag are sent again, or a field boundary is moved"
where = "`SignedInvoices`"
control = "Length-prefixed fields, and the service remembers invoice numbers"
residual = "Remembered numbers must be kept as long as tags stay valid; a timestamp can limit how long"

[[threat]]
id = "T4"
stride = "S"
threat = "An attacker forges a tag without the key"
where = "`Hmac`"
control = "A tag is only valid for the right key and message; the comparison is constant-time"
residual = "HMAC is only as strong as the secrecy and length of the key"

[[threat]]
id = "T5"
stride = "R"
threat = "A holder of the shared key makes a tag and nobody can tell who"
where = "the key shared by the order service and the warehouse"
control = "None with HMAC"
residual = "Digital signatures with a private key give each maker an identity; the next projects cover them"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] Seven small classes. [[slnc 300]] Here is what each one does."""

[[class]]
name = "IntegrityDemo"
what = "runs the six acts"
[[class.part]]
title = "the six acts"
code = """
act1Crc(out);
act2Hash(out);
act3HashBesideTheFile(out);
act4Hmac(out);
act5Steps(out);
act6Bill(out);
"""
speech = """Integrity demo runs the six acts, one method each. [[slnc 300]] A test compares its output with the golden file."""

[[class]]
name = "Crc32Checksum"
what = "a checksum, from Java"
[[class.part]]
title = "no secret"
code = """
CRC32 crc = new CRC32();
crc.update(data);
return String.format("%08x", crc.getValue());
"""
speech = """C R C thirty two checksum wraps Java's own C R C class. [[slnc 300]] Only the data goes in. [[slnc 300]] No secret, so anyone can redo it."""

[[class]]
name = "Sha256"
what = "a cryptographic hash, from Java"
[[class.part]]
title = "any input, 32 bytes out"
code = """
return MessageDigest.getInstance("SHA-256").digest(data);
"""
speech = """S H A two fifty six is one line: Java's message digest. [[slnc 300]] Any input gives thirty two bytes. [[slnc 300]] Again, no secret."""

[[class]]
name = "InvoiceStore"
what = "keeps a plain hash beside each invoice"
[[class.part]]
title = "the attacker rewrites both"
code = """
public void tamper(Invoice changed, boolean fixTheHashToo) {
    invoices.put(changed.number(), changed);
    if (fixTheHashToo) {
        hashes.put(changed.number(), Sha256.hex(changed.text()));
"""
speech = """Invoice store keeps the hash beside each invoice. [[slnc 300]] Tamper stands for the attacker. [[slnc 300]] With fix the hash too, the attacker writes a new hash as well, which is attack two."""

[[class]]
name = "Hmac"
what = "HMAC-SHA-256 tags, from Java"
[[class.part]]
title = "tag and verify"
code = """
Mac mac = Mac.getInstance("HmacSHA256");
mac.init(new SecretKeySpec(key, "HmacSHA256"));
return mac.doFinal(message);
...
return MessageDigest.isEqual(tag(key, message), tag);   // constant time
"""
speech = """H M A C asks Java for H M A C with S H A two fifty six, with the key, and tags the message. [[slnc 300]] Verify makes the tag again, and compares in constant time."""

[[class]]
name = "HmacSteps"
what = "works out the tag by hand"
[[class.part]]
title = "the four steps"
code = """
byte[] innerKey = xorEach(padded, INNER_PAD);       // step 1
byte[] innerHash = Sha256.digest(join(innerKey, message));    // step 2
byte[] outerKey = xorEach(padded, OUTER_PAD);       // step 3
byte[] tag = Sha256.digest(join(outerKey, innerHash));        // step 4
"""
speech = """H M A C steps does the four steps of act five by hand: [[slnc 200]] the inner key, [[slnc 200]] the inner hash, [[slnc 200]] the outer key, [[slnc 200]] and the tag. [[slnc 300]] A test checks that it gives Java's exact tag."""

[[class]]
name = "SignedInvoices"
what = "tags invoices, in two encodings"
[[class.part]]
title = "accept, and the length in front"
code = """
if (!Hmac.verify(key, encode(invoice), HexFormat.of().parseHex(tag))) {
    return Verdict.BAD_TAG;
}
if (rememberNumbers && !seen.add(invoice.number())) {
    return Verdict.REPLAYED;
...
    out.putInt(b.length).put(b);   // the length, then the bytes
"""
speech = """Signed invoices is the order service. [[slnc 300]] Accept refuses a bad tag, and, if it remembers numbers, a replayed invoice. [[slnc 300]] The fixed encoding writes each field's length in front of its bytes."""

