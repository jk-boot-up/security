In red, an attack. [[slnc 300]] The attacker changes the amount to twelve dollars, and stores the new checksum too. [[slnc 300]] It matches. [[slnc 300]] The forgery passes. [[slnc 500]]
A checksum has no secret, so anyone can make one.
"""
