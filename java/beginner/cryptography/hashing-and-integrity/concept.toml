[[act]]
title = "How the tag is made, step by step"
summary = "HMAC is two SHA-256 hashes with the key mixed in before each: inner key = key xor 36s, inner hash = SHA-256(inner key + bytes), outer key = key xor 5cs, tag = SHA-256(outer key + inner hash), exactly Java's tag."
detail = """
HmacSteps redoes HMAC-SHA-256 by hand. The key, 64656d6f... (the letters demo-...), is padded with zeros to 64 bytes, the block size of SHA-256. Step 1: every byte XOR 36 gives
the inner key, 52535b59.... Step 2: SHA-256 of the inner key followed by the invoice bytes gives the inner hash, 5bd27bbf.... Step 3: every key byte XOR 5c gives the outer key,
38393133.... Step 4: SHA-256 of the outer key followed by the inner hash gives the tag, 54916ce1 1158db43..., exactly the tag Java's Mac gave in act four. The key goes in twice,
so neither hash can be made without it.
"""
figure = "hmac_steps"
figure_title = "How the HMAC tag is made"
figure_speech = """
How is the tag made? [[slnc 400]] Two S H A two fifty six hashes, with the key mixed in before each. [[slnc 600]]
Step one. [[slnc 300]] The key is padded with zeros to sixty four bytes, and each byte is X O R ed with three six: the inner key. [[slnc 500]]
Step two. [[slnc 300]] The inner key, followed by the invoice bytes, is hashed: the inner hash. [[slnc 500]]
Step three. [[slnc 300]] The key X O R five c: the outer key. [[slnc 500]]
Step four. [[slnc 300]] The outer key, followed by the inner hash, is hashed again. [[slnc 300]] That is the tag, five four nine one, exactly the tag Java gave in act four.
"""
speech = """
Here the program does it by hand. [[slnc 400]] The key begins six four: the letter d. [[slnc 300]] Six four X O R three six is five two, the inner key.
[[page]]
Six four X O R five c is three eight, the outer key. [[slnc 300]] And the last line: the same tag as Java's own. True.
"""
rows = { hmac = "active ok" }
console = [
    ["BEFORE: THE KEY, PADDED WITH ZEROS TO 64 BYTES:", ""],
    ["  key        64656d6f 2d6f6e6c 792d696e 766f6963 ...", ""],
    ["STEP 1. INNER KEY = KEY XOR 36 36 36 ...:", ""],
    ["  inner key  52535b59 1b59585a 4f1b5f58 40595f55 ...", ""],
    ["STEP 2. INNER HASH = SHA-256(inner key + bytes):", ""],
    ["  inner hash 5bd27bbf 3dd49cf5 a8c808cd f7c9cde5", ""],
    ["             03fc9d14 3818cffd b6cf7f4e fd08142e", ""],
    ["---", ""],
    ["STEP 3. OUTER KEY = KEY XOR 5c 5c 5c ...:", ""],
    ["  outer key  38393133 71333230 25713532 2a33353f ...", ""],
    ["STEP 4. TAG = SHA-256(outer key + inner hash):", ""],
    ["  tag        54916ce1 1158db43 ccd2c678 b0fc1e05", ""],
    ["             45498b8e 0b32f14f c7085d72 e7427d98", ""],
    ["AFTER: the same tag Java's Mac gave in act four: true", ""],
]

[[act]]
title = "The bill: boundaries, repeats, and a shared key"
summary = "Joined fields let a boundary move without changing the tag, a valid tag can be sent twice, and the warehouse that can check a tag can also make one."
detail = """
HMAC is sound, and three things around it still go wrong. First, boundaries. Before the fix, the fields are joined with nothing between them: (ab, c) and (a, bc) are the same
bytes, INV-7abc5, so the same tag, e120bc23dcb2, and a moved boundary is OK. After the fix, each field has its length in front, the tags differ (dd8b59649a21 and 397d08fb696a),
and the same trick gets BAD_TAG. Second, repeats. A tag has no date, so a valid invoice sent twice is accepted twice, until the service remembers invoice numbers: OK, REPLAYED.
Third, the key. The warehouse holds the same key to check tags, so it can make one: a made-up invoice for 1 dollar is OK. Key holders look alike; proving who made a tag needs a
signature with a private key, in the next projects.
"""
figure = "bill"
figure_title = "What HMAC does not solve on its own"
figure_speech = """
Last, the bill: three things around H M A C still go wrong. [[slnc 600]]
First, boundaries. [[slnc 300]] With the fields joined, a b and c, or a and b c, give the same bytes, so the same tag. [[slnc 300]] A moved boundary is accepted. [[slnc 300]] With each field's length in front, the bytes differ, and it is refused. [[slnc 600]]
Second, repeats. [[slnc 300]] A tag has no date, so the same invoice is accepted twice, unless the service remembers numbers. [[slnc 600]]
Third, the shared key. [[slnc 300]] The warehouse holds the key to check tags, so it can make one too. [[slnc 300]] Proving who made a tag needs a signature, in the next projects.
"""
speech = """
Here is the output. [[slnc 400]] Before the fix, the two tags are the same, and the moved boundary is O K. [[slnc 300]] After the fix, bad tag.
[[page]]
Sent twice: O K, O K, then with the fix, replayed. [[slnc 300]] And the warehouse's own invoice for one dollar: O K.
"""
rows = { hmac = "active amber", channel = "active amber" }
console = [
    ["BEFORE THE FIX (fields joined, nothing between):", ""],
    ["  (ab, c)    bytes INV-7abc5  tag e120bc23dcb2", ""],
    ["  (a, bc)    bytes INV-7abc5  tag e120bc23dcb2", ""],
    ["  boundary moved, old tag: OK  <- THE SAME BYTES", ""],
    ["AFTER THE FIX (each field with its length in front):", ""],
    ["  (ab, c)    tag dd8b59649a21", ""],
    ["  (a, bc)    tag 397d08fb696a", ""],
    ["  boundary moved, old tag: BAD_TAG", ""],
    ["---", ""],
    ["BEFORE THE FIX (the service forgets):", ""],
    ["  one invoice sent twice: OK, OK  <- A TAG HAS NO DATE", ""],
    ["AFTER THE FIX (it remembers invoice numbers):", ""],
    ["  one invoice sent twice: OK, REPLAYED", ""],
    ["NO FIX WITH HMAC (the warehouse holds the key too):", ""],
    ["  it tags INV-9000, a laptop for 1 dollar: OK  <- WHO?", ""],
    ["a signature proves who made a tag: the next projects", ""],
]

