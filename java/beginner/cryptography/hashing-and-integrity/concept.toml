[readme]
intro = """
How do you know that some data was not changed? There are three answers, and each is stronger than the one before. A
**checksum** such as CRC-32 is a short number that changes when data is damaged by accident. It is fast, it has no
secret, and anyone can work out a new one for changed data, so it does not stop an attacker. A **cryptographic hash** such as
SHA-256 turns any data into a fixed-size fingerprint. A tiny change gives a completely different fingerprint, and nobody can
find different data with the same one. But a hash has no secret either: if the attacker can change the data, and the hash is kept next to
it, the attacker changes the hash too. A **keyed hash**, **HMAC**, mixes in a secret key. Only a key holder can make a tag that
checks out, so a good tag shows that the data came from a key holder and was not changed since.

This project shows each in turn on an online store's invoices and an installer for download, and then the three things that still go wrong around
a good HMAC: fields joined without a clear boundary, a valid tag sent again, and a key that every checker also holds.
"""
analogy = """
Think of a wax seal on a letter. A seal that anyone can buy and press is like a checksum: it shows the letter was not
smudged on the way, and nothing more. A fingerprint of the letter written on the envelope, by whoever sent it, is like a plain hash: anyone who opens
and rewrites the letter just writes a new fingerprint. But a seal pressed with a private signet ring, which only the shop owns, is like HMAC. A forger
cannot make it, so a good seal means something.
"""
scenario = """
An online store sends invoices and offers an installer for its app. Ana's invoice, INV-1001, is for a laptop at 1,200 dollars. An attacker wants to change
it to 12 dollars without anyone noticing. The store first tries a checksum, then a plain hash, then a hash kept beside the invoice,
then a hash published somewhere else, and finally HMAC. After each, the attacker tries again.
"""
costs = [
    "**A good tag is not a whole protocol.** HMAC proves the bytes came from a key holder. How the invoice becomes bytes, whether it was already used, and who else holds the key are separate design questions.",
    "**Ambiguous encoding lets a boundary move.** If fields are joined with nothing between them, `ab` and `c` look the same as `a` and `bc`. Each field should carry its length, or a separator that cannot appear in the data.",
    "**A tag does not say when.** A valid invoice and its tag can be sent again, so the receiver must remember numbers or timestamps.",
    "**A shared key means no proof of who.** Every service that can check a tag can also make one, so a tag shows only that some key holder made it. Digital signatures, in a later project, separate the two.",
    "**The key must be kept secret and rotated,** which is a job of its own.",
]
too_much = """
For data that no one has a reason to change on purpose, such as a log of sensor readings on a disk, a checksum is enough. For data that someone could
profit from changing, such as invoices, payment instructions, downloads and tokens, use HMAC or a signature. Never use a plain hash or a CRC to protect against
an attacker.
"""
met_before = [
    "SHA-256 checksums beside downloads on a project's website, so you can check a file you fetched.",
    "Git, whose commits are named by hashes of their contents.",
    "Webhook callbacks that arrive with an `X-Signature` header, which is an HMAC of the body.",
    "JWTs signed with HS256, which is HMAC with SHA-256.",
]
where = """
This project is the first one in [cryptography](..), the fourth module of the beginner track. It builds on the keyed hash used inside the one-time codes of [totp-multi-factor](../../passwords-and-mfa/totp-multi-factor).
"""
twin = """
The key is a fixed demo value in the code: a real system keeps it in a secrets store and rotates it. The attacker is a few lines
of code that change a stored value, standing in for anyone who can reach a database or sit on a network. The "mirror" and
the "trusted site" are two strings. CRC-32, SHA-256 and HMAC are the JDK's own, and the demo checks each against the published
test values, so the point of the project is how they are used, not how they are built.
"""
test_note = "CRC-32, SHA-256 and HMAC-SHA-256 are each checked against published standard values (the CRC-32 check value, the SHA-256 vectors, and RFC 4231 test cases one and two). Every line the demo prints is checked against `docs/expected-output.txt`."

[[act]]
title = "A checksum for accidents"
summary = "A flipped bit changes the CRC-32 from a7c21715 to d0c52783, but an attacker who changes the amount just stores the new CRC, 5e22dd78, and the check passes."
detail = """
Invoice INV-1001|ana|Laptop|1200 has a CRC-32 of a7c21715. If one bit flips on the disk, the CRC becomes d0c52783 and the damage is detected: a checksum
does its job. Now an attacker changes the amount to 12 and works out a new CRC, 5e22dd78, which they store beside the invoice. The check passes. A CRC has
no secret, so anyone can recompute it, and it guards against accidents only.
"""
speech = """
First demo: a checksum for accidents. [[slnc 400]] A checksum is a short number worked out from data. [[slnc 300]] The invoice for Ana's laptop has a C R C thirty two of a seven c two one seven one five. [[slnc 600]]
Suppose one bit flips on the disk. [[slnc 300]] The number changes, to d zero c five two seven eight three. [[slnc 300]] The damage is detected. [[slnc 300]] A checksum has done its job. [[slnc 600]]
Now an attacker changes the amount to twelve dollars, and works out a new checksum. [[slnc 300]] The check passes. [[slnc 600]]
A C R C has no secret, so anyone can recompute it. [[slnc 300]] It guards against accidents, and only accidents.
"""
rows = { crc = "active wrong" }
console = [
    ["invoice INV-1001|ana|Laptop|1200 has CRC-32 a7c21715", "muted"],
    ["one bit flips on the disk: the CRC is now d0c52783  <- ACCIDENT DETECTED", "ok"],
    ["an attacker changes the amount to 12 and works out a new CRC, 5e22dd78  <- THE CHECK PASSES", "bad"],
    ["a CRC has no secret, so it only guards against accidents", "amber"],
]

[[act]]
title = "A cryptographic hash: SHA-256"
summary = "Any input gives 64 hex digits; changing one digit of the amount changes 62 of the 64 digits, 134 of 256 bits, about half."
detail = """
SHA-256 is a cryptographic hash. The three letters abc give a hash that begins ba7816bf8f01, a published value. The invoice at 1200 dollars begins 878229813e30,
and at 1201 dollars begins 7da712a12a1c. Changing a single digit changes 62 of the 64 hex digits, which is 134 of the 256 bits: about half, which is what a good hash
gives for any change. And the hash is always 64 hex digits, for one line or for a whole book. It is a fingerprint: tiny change, completely different print.
"""
speech = """
Second demo: a cryptographic hash. [[slnc 400]] The one used here is called S H A two fifty six. [[slnc 300]] Whatever goes in, it gives a fixed size fingerprint of sixty four hex digits. [[slnc 600]]
The three letters a b c give a hash that begins b a seven eight one six b f. [[slnc 300]] That is a published value, so anyone can check the code. [[slnc 600]]
Ana's invoice at twelve hundred dollars gives one fingerprint. [[slnc 300]] At twelve hundred and one dollars, another. [[slnc 300]] One digit changed, and sixty two of the sixty four hex digits differ. [[slnc 300]] That is one hundred and thirty four of two hundred and fifty six bits. [[slnc 300]] About half. [[slnc 600]]
That is what a good hash does. [[slnc 300]] A tiny change gives a completely different fingerprint. [[slnc 300]] And the fingerprint is the same size, for one line or for a whole book.
"""
rows = { hash = "active ok" }
console = [
    ["SHA-256 of the three letters abc begins ba7816bf8f01", "ok"],
    ["invoice at 1200 dollars begins 878229813e30", "muted"],
    ["invoice at 1201 dollars begins 7da712a12a1c", "muted"],
    ["one digit changed, and 62 of the 64 hex digits differ", "ok"],
    ["that is 134 of 256 bits: about half, whatever the input", "ok"],
    ["the hash is always 64 hex digits, for one line or for a whole book", "muted"],
]

[[act]]
title = "A hash kept beside the data"
summary = "A hash stored next to the invoice fails when only the invoice is changed, but passes when the attacker changes both; a hash published on another channel catches a tampered download."
detail = """
Store a SHA-256 of each invoice right beside it. An attacker who changes the invoice to 12 dollars and leaves the hash is caught: the invoice no longer matches its hash.
But an attacker who can write the invoice can write the hash too, and the pair is consistent again: it looks intact. The hash protected nothing, because there is no secret
in it. A hash helps when it reaches the checker by a different road than the data. The shop publishes its installer's hash, 891124db5651, on its own website over HTTPS. A download
from a mirror hashes to 70fa24395df6, so it is refused. The mirror could change the file, but not the hash on the shop's own site.
"""
speech = """
Third demo: a hash kept beside the data. [[slnc 400]] The store keeps a hash of each invoice, right next to it. [[slnc 600]]
An attacker changes the invoice, and leaves the hash. [[slnc 300]] They no longer match, and the change is caught. [[slnc 600]]
But an attacker who can write the invoice, can write the hash too. [[slnc 300]] The pair matches again. [[slnc 300]] It looks intact. [[slnc 300]] The hash protected nothing, because there is no secret in it. [[slnc 600]]
A hash does help when it reaches the checker by another road. [[slnc 300]] The shop publishes its installer's hash on its own website, over H T T P S. [[slnc 300]] A download from a mirror gives a different hash. [[slnc 300]] It is refused. [[slnc 600]]
The mirror could change the file. [[slnc 300]] It could not change the hash on the shop's own site.
"""
rows = { hash = "active amber", channel = "active ok" }
console = [
    ["an attacker changes the invoice to 12 dollars, and leaves the hash: intact? false", "ok"],
    ["an attacker changes the invoice and the hash beside it: intact? true  <- THE ATTACKER WROTE BOTH", "bad"],
    ["the shop publishes the installer's hash on its own site, over HTTPS: 891124db5651", "muted"],
    ["a download from a mirror hashes to 70fa24395df6: refused  <- THE HASH CAME BY ANOTHER ROAD", "ok"],
]

[[act]]
title = "A keyed hash: HMAC-SHA-256"
summary = "The order service tags the invoice with HMAC; the invoice with its tag is OK, and a changed invoice with the old tag, a plain SHA-256 tag, or a tag made with a guessed key are all refused."
detail = """
HMAC mixes a secret key into the hash. The order service tags invoice INV-1001 with its key, and the tag begins 54916ce11158. The invoice with its tag is OK. An attacker who
changes the amount and keeps the tag gets BAD_TAG. One who tags it with a plain SHA-256 gets BAD_TAG. One who tags it with HMAC and a guessed key gets BAD_TAG. Without the key,
there is no way to make a tag the service accepts. The check also compares in constant time, so the first wrong byte is not revealed by how long it takes.
"""
speech = """
Fourth demo: a keyed hash, called H M A C. [[slnc 400]] It mixes a secret key into the hash. [[slnc 600]]
The order service tags the invoice with its key. [[slnc 300]] The invoice with its tag is accepted. [[slnc 600]]
An attacker changes the amount, and keeps the tag. [[slnc 300]] Refused. [[slnc 300]] The attacker tags the new invoice with a plain hash. [[slnc 300]] Refused. [[slnc 300]] The attacker tags it with H M A C and a guessed key. [[slnc 300]] Refused. [[slnc 600]]
Without the key, no tag the service accepts can be made. [[slnc 300]] And the check compares in constant time, so the first wrong byte is not given away by how long it takes.
"""
rows = { hmac = "active ok" }
console = [
    ["the order service tags invoice INV-1001: 54916ce11158", "muted"],
    ["the invoice with its tag: OK", "ok"],
    ["an attacker changes the amount, keeps the tag: BAD_TAG", "ok"],
    ["the attacker tags it with a plain SHA-256 instead: BAD_TAG", "ok"],
    ["the attacker tags it with HMAC and a guessed key: BAD_TAG", "ok"],
    ["without the key, no tag the service accepts can be made", "muted"],
]

[[act]]
title = "The bill: boundaries, repeats, and a shared key"
summary = "Joined fields let a boundary move without changing the tag, a valid tag can be sent twice, and the warehouse that can check a tag can also make one."
detail = """
HMAC is sound, and three things around it still go wrong. First, encoding. If the fields are joined with nothing between them, (ab, c) and (a, bc) give the same
tag, e120bc23dcb2, and an attacker moves a field boundary while keeping the tag: OK. Writing each field's length in front, the same change gets BAD_TAG. Second, repeats. A valid
invoice sent twice is accepted twice, because a tag does not say when it was made. When the service remembers invoice numbers, the second is REPLAYED. Third, the key. The warehouse
holds the same key in order to check tags, and so it can make one: a made-up invoice for 1 dollar is accepted. Key holders cannot be told apart. Proving who made a tag needs a
signature with a private key, in the next projects.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] H M A C is sound, but three things around it still go wrong. [[slnc 600]]
First, how the invoice becomes bytes. [[slnc 300]] If the fields are joined with nothing between them, a b and c, and a and b c, give the same tag. [[slnc 300]] The attacker moves a boundary, keeps the tag, and is accepted. [[slnc 300]] Put each field's length in front, and the same trick is refused. [[slnc 600]]
Second, repeats. [[slnc 300]] A valid invoice, sent twice, is accepted twice. [[slnc 300]] A tag does not say when. [[slnc 300]] When the service remembers invoice numbers, the second is refused. [[slnc 600]]
Third, the key. [[slnc 300]] The warehouse holds the same key, to check tags. [[slnc 300]] So it can make one too. [[slnc 300]] Key holders cannot be told apart. [[slnc 300]] To prove who made a tag, a signature with a private key is needed, and that is the next project.
"""
rows = { hmac = "active amber", channel = "active amber" }
console = [
    ["fields joined with nothing between: (ab, c) and (a, bc) get tags e120bc23dcb2 and e120bc23dcb2", "bad"],
    ["the attacker moves a field boundary, keeping the tag: OK  <- THE BOUNDARY MOVED", "bad"],
    ["with each field's length in front: BAD_TAG", "ok"],
    ["a valid invoice is sent twice: OK, OK  <- A TAG DOES NOT SAY WHEN", "bad"],
    ["when the service remembers invoice numbers: OK, REPLAYED", "ok"],
    ["the warehouse holds the same key to check tags, and can make one: OK  <- KEY HOLDERS CANNOT BE TOLD APART", "bad"],
]

