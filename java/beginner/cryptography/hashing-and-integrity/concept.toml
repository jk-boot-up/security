[[act]]
title = "A keyed hash: HMAC-SHA-256"
summary = "The key and the invoice's bytes give a 32-byte tag; the invoice with its tag is OK, and a changed invoice with the old tag, a plain SHA-256 tag and a tag made with a guessed key are all refused."
detail = """
HMAC mixes a secret key into the hash. Before tagging, there are two inputs: the key, and the invoice as bytes, each field with its length in front (00000008 and the eight
letters INV-1001, then 00000003 and ana, and so on: 37 bytes). After tagging, the tag is 32 bytes and begins 54916ce11158. The invoice with its tag is OK. An attacker who changes
the amount and keeps the tag gets BAD_TAG; one who uses a plain SHA-256 as the tag gets BAD_TAG; one who makes an HMAC with a guessed key gets BAD_TAG. The check compares in
constant time, so the first wrong byte is not revealed by how long it takes.
"""
figure = "hmac_tag"
figure_title = "HMAC: a tag only the key holder can make"
figure_speech = """
Fourth, a keyed hash: H M A C, with S H A two fifty six. [[slnc 400]] Before tagging, two inputs. [[slnc 300]] In amber, the secret key. [[slnc 300]] In blue, the invoice as bytes, each field with its length in front. [[slnc 600]]
After tagging, out comes a tag of thirty two bytes: five four nine one, and so on. [[slnc 600]]
Now the checks. [[slnc 300]] The invoice with its tag: accepted. [[slnc 300]] The amount changed, with the old tag: refused. [[slnc 300]] A plain hash as the tag: refused. [[slnc 300]] An H M A C with a guessed key: refused. [[slnc 500]]
Without the key, nobody can make a tag that checks out.
"""
speech = """
Here is the output. [[slnc 400]] Before tagging: the key, and the bytes. [[slnc 300]] Zero zero zero zero zero zero zero eight is the length of the invoice number, then its eight letters. [[slnc 400]] After tagging: the tag.
[[page]]
Then the checks: O K for the real tag, and bad tag for every try without the key. [[slnc 300]] The comparison takes the same time, whatever the bytes.
"""
rows = { hmac = "active ok" }
console = [
    ["BEFORE TAGGING (the inputs):", ""],
    ["  key        demo-only-invoice-key-not-for-real-use", ""],
    ["  invoice    INV-1001|ana|Laptop|1200", ""],
    ["  as bytes   00000008 494e562d 31303031 00000003", ""],
    ["             616e6100 0000064c 6170746f 70000000", ""],
    ["             04313230 30", ""],
    ["AFTER TAGGING (the tag, 32 bytes):", ""],
    ["  tag        54916ce1 1158db43 ccd2c678 b0fc1e05", ""],
    ["             45498b8e 0b32f14f c7085d72 e7427d98", ""],
    ["---", ""],
    ["THE CHECKS:", ""],
    ["  the invoice with its tag            OK", ""],
    ["  amount changed to 12, old tag       BAD_TAG", ""],
