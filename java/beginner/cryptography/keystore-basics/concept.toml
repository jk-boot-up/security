]

[[act]]
title = "Making keys from other secrets"
summary = "PBKDF2 turns a password and a salt into a 32-byte key in 600,000 rounds of HMAC-SHA-256, worked out by hand to the JDK's exact key; another salt gives another key, and HKDF makes a separate key for each purpose from one master key."
detail = """
Keys can be made from other secrets. PBKDF2 takes a password, correct horse battery staple, a salt, per-user-salt-1, and a number of rounds, 600,000. Round one is HMAC-SHA-256 of the salt followed by 00000001, with the password as the HMAC key: U1 starts 560d7b6f.
Each further round is the HMAC of the result before it: U2 starts 29bb6e9e. The key is all 600,000 results XORed together, and starts 29f87e05: the very key the JDK's PBKDF2 gives. So every guess at the password costs 600,000 HMACs.
Another salt gives another key. HKDF makes, from one strong master key, a separate key for each purpose: one for statements, another for login tokens, and the same one again when asked again. A key made from a weak password is only as strong as the password.
"""
figure = "pbkdf2_rounds"
figure_title = "How PBKDF2 makes a key, round by round"
figure_speech = """
The program's output. [[slnc 400]] The inputs, then U one and U two. [[slnc 400]] After deriving: the key, and true, it is the same key the J D K gave.
[[page]]
Another salt gives another key. [[slnc 500]] H K D F makes, from one master key, a separate key for each purpose, and the same key when asked again. [[slnc 500]]
And a weak password still makes a weak key.
"""
speech = """
The program's output. [[slnc 400]] Before deriving: the password, the salt, and the rounds. [[slnc 500]]
Then the steps. [[slnc 300]] U one, U two, and the X O R of them all. [[slnc 500]]
After deriving: the key, and true. [[slnc 300]] It is the same key the J D K gave.
[[page]]
Another salt gives another key. [[slnc 500]]
H K D F does something different. [[slnc 300]] From one strong master key, it makes a separate key for each purpose. [[slnc 300]] Statements and login tokens get different keys. [[slnc 300]] Asked again, the same key. [[slnc 500]]
And a key made from a weak password is only as strong as the password.
"""
rows = { derive = "active ok" }
console = [
    ["BEFORE DERIVING (the inputs of PBKDF2):", "ok"],
    ["  password  correct horse battery staple", "muted"],
    ["  salt      per-user-salt-1", "muted"],
    ["  rounds    600000", "muted"],
    ["STEP 1. U1 = HMAC-SHA-256(password, salt + 00000001)", "amber"],
    ["  U1        560d7b6f e549f1d3 456b88d0 0acc5365 ...", "muted"],
    ["STEP 2. EACH ROUND: U(n) = HMAC-SHA-256(password, U(n-1))", "amber"],
    ["  U2        29bb6e9e 621437eb 4f2af552 5c716d43 ...", "muted"],
    ["STEP 3. KEY = U1 xor U2 xor ... xor U600000", "amber"],
    ["AFTER DERIVING (the key, 32 bytes):", "bad"],
    ["  key       29f87e05 138358d9 9f75be90 325e6e8d ...", "muted"],
    ["  the same key the JDK's PBKDF2 gave: true", "muted"],
    ["---", ""],
    ["ANOTHER SALT (per-user-salt-2): ANOTHER KEY", "amber"],
    ["  key       5f7e877f 47771aa6 baa67b4d c13911cb ...", "muted"],
    ["HKDF: ONE MASTER KEY, A KEY FOR EACH PURPOSE:", "amber"],
    ["  statements    4201551f 3adc2c9e 9ffdb03a 2ba69abf ...", "muted"],
    ["  login tokens  e096269a 455770ed dc683805 702ed92c ...", "muted"],
    ["  asked again for statements, the same key: true", "muted"],
    ["a weak password makes a weak key, whatever the rounds", "amber"],
