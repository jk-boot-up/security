[poster]
headline = [["KEYSTORES AND", "text"], ["KEY MANAGEMENT", "accent"]]
taglines = [["Where the key lives matters as much as the cipher", "gold"]]
before = { code = "KEY = \"hard-coded...\"", note = "in every copy, for good", tag = "BEFORE" }
after = { code = "KeyStore PKCS12 + key names", note = "encrypted, and replaceable", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "Keystores and Key Management Basics"
narration = """Hello, and welcome. [[slnc 400]] This video explains keystores and key management, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] Key management asks where a key lives, and how it is replaced. [[slnc 300]] A keystore is an encrypted file that holds keys, and opens with a password. [[slnc 600]] Think of a bank with a fortune spent on its vault door, and the key under the doormat. [[slnc 700]] In this video, the domain is an online bank, and its statement key. [[slnc 500]] You will see why each home for a key beats the last. [[slnc 300]] How a key is made from a password, round by round. [[slnc 300]] And how a key is replaced without losing data."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online bank encrypts statements with an AES key.", "", "Where should that key live?", "", "It must reach the servers that need it,", "survive staff and servers changing,", "and be replaceable."]
narration = """Here is the scenario. [[slnc 400]] An online bank encrypts statements with an A E S key. [[slnc 300]] A E S is the Advanced Encryption Standard. [[slnc 500]] Where should that key live? [[slnc 500]] It must reach the servers, survive staff and servers changing, and be replaceable."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["Keystore: an encrypted file of keys", "Alias: the name of a key inside it", "Salt: bytes that make each derived key different", "Rounds: repeats that make guessing slow", "Rotation: replacing a key"]
narration = """First, the words. [[slnc 400]] A keystore is an encrypted file of keys. [[slnc 300]] An alias is a key's name inside it. [[slnc 300]] A salt makes each derived key different. [[slnc 300]] Rounds make every guess slow. [[slnc 300]] And rotation means replacing a key."""

[[scene]]
key = "03-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "04-homes"
kind = "figure"
title = "One key, four homes"
body = "key_homes"
narration = """Here is the whole idea, on real values from the demo. [[slnc 400]] Each row is one home for a key. [[slnc 500]] In the code, the key is found in the program, so anyone with the program can read it. [[slnc 500]] In a file, others can read it, so anyone with a login can. [[slnc 500]] In a keystore, the key's bytes are hidden, so only someone with the password can. [[slnc 500]] And a derived key is made when needed, and never stored. [[slnc 500]] The cipher is the same in every row. [[slnc 300]] Only the home changes who can read the key."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "11-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["cacerts and keytool", ".p12 and .pfx files", "Key management services, hardware modules", "\"A secret key was committed to a repository\""]
narration = """You have met this already. [[slnc 400]] Java's trusted certificates live in a keystore, managed with keytool. [[slnc 300]] Files ending in dot p twelve, or dot p f x, are keystores. [[slnc 300]] Cloud key services and hardware modules hold keys that never leave. [[slnc 300]] And news of a key committed to a public repository is the first demo."""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Keys out of code and repositories", "A keystore, or better a key service", "A key per purpose; a name in every message", "Re-seal old messages before removing a key", "Set the rounds when the key is put"]
narration = """So, how do you use it? [[slnc 400]] Keep keys out of the code and repositories. [[slnc 300]] Use a keystore, or better, a key service. [[slnc 300]] A key for each purpose, and its name in every message. [[slnc 300]] Re-seal old messages before removing a key. [[slnc 300]] And set the rounds when the key is put."""

[[scene]]
key = "13-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "13-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a third key", "and see which messages still open."]
narration = """That's keystores and key management. [[slnc 400]] Remember this. [[slnc 300]] A key is only as safe as its home, so keep it out of the code, in an encrypted keystore, and plan how to replace it. [[slnc 500]] The full source code, notes, diagrams, and an animated walkthrough are in the repository. [[slnc 300]] It runs on your own machine, with only a Java development kit. [[slnc 500]] Try this. [[slnc 300]] Add a third key, and see which messages still open. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
Where an online bank keeps its statement key: in the code, in a key file, or in a PKCS12 keystore, how other keys are derived from passwords and master keys, and how a key is replaced. It covers a thief who has the program, a disk or a backup,
and an operator who makes a mistake. It does not cover key management services or hardware modules, TLS keys, or the application's memory being read.
"""
assets = [
    "The statement key, and any key derived from it.",
    "The keystore file and its password.",
    "Every message sealed under a key that may be removed.",
    "The record of which key name each message carries.",
]
actors = [
    "The bank's program, which uses keys by name.",
    "A thief who has a copy of the program, a disk or a backup.",
    "A person with a login on the machine.",
    "An operator who replaces or removes keys.",
]
boundaries = [
    "Program to repository and build servers: a key in the code crosses it for good.",
    "Application to the filesystem: a key file's permissions are the only guard.",
    "Keystore file to its password: the line a thief must cross by guessing.",
]
assumptions = [
    "The keystore's password is strong and kept outside the application.",
    "The machine's memory is not read by an attacker.",
    "In the demo, keys, salts and nonces are random and never printed, and the key texts in the code are demo values.",
]
out_of_scope = [
    "Key management services and hardware security modules.",
    "TLS private keys and certificates: the transport-security module.",
    "Secret scanning of source history.",
]
tests = [
    "`HardCodedAndFileTest` checks the key is found in the class file, and the permissions of key files.",
    "`KeystoreVaultTest` checks round trips, hidden keys and names, wrong passwords, changed files, and the rounds a file records, before and after the fix.",
    "`DerivationTest` checks PBKDF2 and HKDF against published values, and separate keys for separate purposes.",
    "`Pbkdf2StepsTest` checks the rounds worked out by hand against published values and the JDK's key.",
    "`MessagesTest` checks key names in messages, rotation, removal and refusals.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next module, networking, looks at what travels between machines: sockets, names and the web. After it, transport security brings keys, certificates and signatures together in TLS.
"""

[[threat]]
id = "T1"
stride = "I"
threat = "A key written in the code is read from the program, the repository or a build"
where = "`HardCodedKey`"
control = "Keep keys out of the code and repositories"
residual = "A key that was ever committed must be treated as leaked and replaced"

[[threat]]
id = "T2"
stride = "I"
threat = "A key file is read by another user or from a backup"
where = "`KeyFile`"
control = "Owner-only permissions"
residual = "The file still holds the key in the clear, so backups and the owner's account must be protected too"

[[threat]]
id = "T3"
stride = "I"
threat = "A stolen keystore file is attacked offline by guessing its password"
where = "`KeystoreVault`"
control = "The file is encrypted and integrity-protected by a key made from the password, and a wrong password is refused"
residual = "The file records only 10,000 rounds by default, so a strong password matters; set the rounds when the key is put, and check the file"

[[threat]]
id = "T4"
stride = "T"
threat = "A keystore file is changed"
where = "`KeystoreVault.open`"
control = "The file carries an integrity code, so a changed file is refused"
residual = "A deleted or replaced file is still a loss of keys, so keep a backup"

[[threat]]
id = "T5"
stride = "I"
threat = "An opened key is read from the program's memory"
where = "the running program"
control = "None here"
residual = "A key service or hardware module keeps keys out of the program's memory"

[[threat]]
id = "T6"
stride = "D"
threat = "A key is removed before old messages are sealed again, and the data is lost"
where = "`KeystoreVault.remove`, `Messages.open`"
control = "Messages name their key, so the problem is visible, and old messages are sealed again first"
residual = "A runbook and a backup are still needed, because nothing stops the removal"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] Seven small classes. [[slnc 300]] Here is what each one does."""

[[class]]
name = "KeystoreDemo"
what = "runs the five acts"
[[class.part]]
title = "the five acts"
code = """
act1HardCoded(out);
act2KeyFile(out, dir);
act3Keystore(out, dir);
act4Derivation(out);
act5RotationAndBill(out, dir);
"""
speech = """Keystore demo runs the five acts, and prints only values that are the same on every run."""

[[class]]
name = "HardCodedKey"
what = "the mistake: a key in the code"
[[class.part]]
title = "a key written in the source"
code = """
public static final String KEY_TEXT = "hard-coded-statement-key-32by!";
...
public static byte[] key() {
    return Hex.bytes(KEY_TEXT);
"""
speech = """Hard coded key is the mistake from act one. [[slnc 300]] A constant in the source, so the compiler copies it into the class file."""

[[class]]
name = "KeyFile"
what = "a key in a file, and its permissions"
[[class.part]]
title = "owner only, and who else can read"
code = """
Files.write(file, key);
Files.setPosixFilePermissions(file,
        PosixFilePermissions.fromString("rw-------"));   // owner only
...
Set<PosixFilePermission> permissions = Files.getPosixFilePermissions(file);
return permissions.contains(PosixFilePermission.GROUP_READ)
        || permissions.contains(PosixFilePermission.OTHERS_READ);
"""
speech = """Key file writes the key with owner only permissions. [[slnc 300]] Readable by others asks whether the group, or anyone else, may read it."""

[[class]]
name = "KeystoreVault"
what = "a PKCS12 keystore"
[[class.part]]
title = "create, put, save and open"
code = """
KeyStore store = KeyStore.getInstance("PKCS12");
store.load(null, password);         // a new, empty keystore
...
store.setEntry(alias,
        new KeyStore.SecretKeyEntry(new SecretKeySpec(keyBytes, "AES")),
        new KeyStore.PasswordProtection(password));    // locked here, at put
...
store.store(out, password);         // save: adds the check
...
store.load(in, password);           // open: wrong password fails
"""
speech = """Keystore vault wraps Java's P K C S twelve keystore. [[slnc 300]] Put locks the key, right then. [[slnc 300]] Save adds the integrity check. [[slnc 300]] And open fails on a wrong password."""
[[class.part]]
title = "the fix: rounds set when the key is put"
code = """
new KeyStore.PasswordProtection(password, "PBEWithHmacSHA256AndAES_256",
        new PBEParameterSpec(salt, rounds)));   // the key's lock
...
Security.setProperty(names[i],
        Integer.toString(rounds));      // at save: the check only
"""
speech = """The fix from act three. [[slnc 300]] Put can take its own rounds, for the key's lock. [[slnc 300]] Save with rounds raises only the integrity check."""

[[class]]
name = "Derivation"
what = "keys from a password or a master key"
[[class.part]]
title = "PBKDF2 and HKDF"
code = """
PBEKeySpec spec = new PBEKeySpec(password, salt, rounds, 256);
return SecretKeyFactory.getInstance("PBKDF2WithHmacSHA256")
        .generateSecret(spec).getEncoded();
...
KDF kdf = KDF.getInstance("HKDF-SHA256");
return kdf.deriveData(HKDFParameterSpec.ofExtract().addIKM(masterKey)
        .addSalt(salt).thenExpand(Hex.bytes(purpose), 32));   // purpose
"""
speech = """Derivation asks Java for P B K D F two, with a password, a salt and the rounds. [[slnc 300]] For H K D F, the purpose text makes each key different."""

[[class]]
name = "Pbkdf2Steps"
what = "PBKDF2 worked out by hand"
[[class.part]]
title = "the rounds, by hand"
code = """
hmac.init(new SecretKeySpec(Hex.bytes(password), "HmacSHA256"));
byte[] u = hmac.doFinal(concat(salt, new byte[] {0, 0, 0, 1}));   // U1
...
for (int round = 2; round <= rounds; round++) {
    u = hmac.doFinal(u);                       // the next round
...
    for (int i = 0; i < key.length; i++) {
        key[i] ^= u[i];                        // XOR into the key
"""
speech = """P B K D F two steps redoes the rounds by hand, with the password as the H M A C key. [[slnc 300]] Each round hashes the last result, and X O Rs it into the key. [[slnc 300]] A test checks it gives Java's exact key."""

[[class]]
name = "Messages"
what = "seal and open, by key name"
[[class.part]]
title = "the key's name goes first"
code = """
byte[] sealed = cipher.doFinal(plaintext);
return ByteBuffer.allocate(1 + name.length + nonce.length + sealed.length)
        .put((byte) name.length).put(name).put(nonce).put(sealed).array();
...
String keyName = keyNameOf(message);
SecretKey key = vault.has(keyName) ? vault.get(keyName) : null;
if (key == null) {
    throw new CannotOpenException(
            "the key " + keyName + " is not in the vault");
"""
speech = """Messages seals with A E S G C M, and writes the name first. [[slnc 300]] To open, it reads the name and looks the key up. [[slnc 300]] If the key is gone, the message cannot be opened."""

