[[act]]
title = "A key in a file outside the program"
summary = "A key file with default permissions rw-r--r-- is readable by others; owner-only rw------- is not; but either way the file holds the key in the clear."
detail = """
Moving the key into a file means it is no longer in the program. But a file is only as private as its permissions. Before the fix, a new file gets rw-r--r--: read and write for the owner, read for the group,
read for others, so anyone with a login can read the key. After the fix, rw-------: only the owner. Either way the file holds the key in the clear, file-based-statement-key-32bytes, so anyone who can read it, or a backup of it, has the key.
"""
figure = "permissions"
figure_title = "Nine letters decide who can read the file"
figure_speech = """
The program's output. [[slnc 400]] Before the fix: readable by others, true. [[slnc 400]] After the fix: false. [[slnc 500]]
And the file holds the key itself, as plain text.
"""
speech = """
The program's output. [[slnc 400]] Before the fix: read write, read, read, and readable by others: true. [[slnc 500]]
After the fix: owner only, and readable by others: false. [[slnc 500]]
And what the file holds: the key itself, as plain text.
"""
rows = { file = "active amber" }
console = [
    ["BEFORE THE FIX (a new file, default permissions):", "ok"],
    ["  open.key  rw-r--r--", "muted"],
    ["  owner rw-   group r--   others r--", "muted"],
    ["  readable by others: true  <- ANYONE WITH A LOGIN", "bad"],
    ["AFTER THE FIX (owner only):", "bad"],
    ["  locked.key  rw-------", "muted"],
    ["  owner rw-   group ---   others ---", "muted"],
    ["  readable by others: false", "muted"],
