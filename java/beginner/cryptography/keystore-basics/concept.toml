[[act]]
title = "Replacing a key, and the bill"
summary = "Each stored message starts with the name of its key; with statements-v2 added both old and new messages open, after statements-v1 is removed the old one is refused; the keystore needs a password, a backup, and more rounds."
detail = """
Keys must be replaced from time to time, so each stored message names its key. A message is 61 bytes: one byte for the length of the name (0d, 13), the name statements-v1, a 12-byte nonce, and 35 bytes of cipher text and tag (19 + 16).
Before statements-v1 is removed, with statements-v2 added, the old message names statements-v1 and the new one statements-v2, and both open. After statements-v1 is removed, the old message is refused, so old messages must be sealed again with the new key before the old key goes.
Then the bill: the keystore's password needs a home too, a lost keystore file is lost data, and the default 10,000 rounds are far below the 600,000 recommended.
"""
figure = "rotation"
figure_title = "A message names its key: replacing a key"
figure_speech = """
The output: the stored message, sixty one bytes, with the key's name in the clear.
[[page]]
Before removing statements v one, both open. [[slnc 400]] After, the old one is refused. [[slnc 500]]
And the bill. [[slnc 300]] The keystore's password needs a home. [[slnc 300]] A lost keystore is lost data. [[slnc 300]] And raise the rounds.
"""
speech = """
The program's output. [[slnc 400]] The stored message, part by part: sixty one bytes. [[slnc 300]] Its name is in the clear, which is fine, because a name is not a secret.
[[page]]
Before removing statements v one, both messages open. [[slnc 500]] After removing it, the old one is refused. [[slnc 600]]
And the bill. [[slnc 300]] The keystore's password needs a home too. [[slnc 300]] A lost keystore file is lost data. [[slnc 300]] And ten thousand rounds is far below six hundred thousand, so raise them.
"""
rows = { store = "active amber", derive = "active amber" }
console = [
    ["A STORED MESSAGE (61 bytes), PART BY PART:", "amber"],
    ["  1 byte    0d             the name's length, 13", "muted"],
