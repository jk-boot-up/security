[[act]]
title = "Making keys from other secrets"
summary = "PBKDF2 with 600,000 rounds turns a password and a salt into a 32-byte key, the same each time, different for another salt; HKDF makes a separate key for each purpose from one master key."
detail = """
Keys can be made from other secrets. PBKDF2 turns a password and a salt into a 32-byte key, with 600,000 rounds so that guessing the password is slow. The same password and salt give the same key, and another salt gives another. HKDF turns one strong
master key into any number of separate keys: one for statements, a different one for login tokens, the same one each time for the same purpose. A key made from a weak password is only as strong as the password.
"""
speech = """
Fourth demo: making keys from other secrets. [[slnc 400]] P B K D F two turns a password and a salt into a key. [[slnc 300]] Six hundred thousand rounds, so that guessing the password is slow. [[slnc 600]]
The same password and salt give the same key. [[slnc 300]] Another salt gives another key. [[slnc 600]]
H K D F does something different. [[slnc 300]] It turns one strong master key into a separate key for each purpose. [[slnc 300]] One for statements. [[slnc 300]] A different one for login tokens. [[slnc 300]] The same one, each time, for the same purpose. [[slnc 600]]
A key made from a weak password is only as strong as the password.
"""
rows = { derive = "active ok" }
console = [
