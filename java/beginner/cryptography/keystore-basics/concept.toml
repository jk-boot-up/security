before = { code = "KEY = \"hard-coded...\"", note = "in every copy, for good", tag = "BEFORE" }
after = { code = "KeyStore PKCS12 + key names", note = "encrypted, and replaceable", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "Keystores and Key Management Basics"
narration = """Hello, and welcome. [[slnc 400]] This video explains keystores and key management, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] Every video so far used a key. [[slnc 300]] Key management is the question none of them asked: where does the key live, and how is it replaced? [[slnc 300]] A keystore is an encrypted file that holds keys, and opens with a password. [[slnc 600]] Think of a bank that spends a fortune on a vault door, and leaves the key under the doormat. [[slnc 300]] A key written in the code is taped to the door. [[slnc 300]] A key file that anyone can read is a spare key in the staff room. [[slnc 300]] A keystore is a locked key cabinet. [[slnc 700]] In this video, the domain is an online bank, and its statement key. [[slnc 500]] By the end, you will hear why each place is better than the last. [[slnc 300]] How keys are made from other secrets. [[slnc 300]] How a key is replaced. [[slnc 300]] And what a keystore still leaves for you to do."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online bank encrypts statements with an AES key.", "", "Where should that key live?", "", "It must reach the servers that need it,", "survive staff and servers changing,", "and be replaceable."]
narration = """Here is the scenario. [[slnc 400]] An online bank encrypts customer statements with an A E S key. [[slnc 500]] Where should that key live? [[slnc 600]] It must reach the servers that need it. [[slnc 300]] It must survive staff leaving, and servers being rebuilt. [[slnc 300]] And it must be replaceable. [[slnc 600]] And nobody who should not have it may be able to read it."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["Keystore: an encrypted file of keys", "PKCS12: the format Java uses", "Alias: the name of a key in it", "PBKDF2: a key from a password", "HKDF: many keys from one master key"]
narration = """Before the demos, the words. [[slnc 500]] A keystore is an encrypted file of keys. [[slnc 500]] P K C S twelve is the format that Java reads and writes. [[slnc 500]] An alias is the name of a key inside it. [[slnc 500]] P B K D F two makes a key from a password, slowly. [[slnc 500]] And H K D F makes many keys from one master key, one for each purpose."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "09-ladder"
kind = "bullets"
title = "Places for a Key, Best Last"
body = ["In the code: in every copy, for good", "In a file: in the clear", "In a keystore: encrypted, with a password", "In a key service or a hardware module: never leaves", "", "Each moves the problem to a smaller secret."]
narration = """Let's put the places side by side, worst first. [[slnc 400]] In the code. In every copy, for good. [[slnc 500]] In a file. In the clear, and as private as its permissions. [[slnc 500]] In a keystore. Encrypted, and opened with a password. [[slnc 500]] In a key service, or a hardware module. The key never leaves it. [[slnc 600]] Each one moves the problem to a smaller secret, until the last one, where the secret cannot be read at all."""

[[scene]]
key = "10-roles"
kind = "bullets"
title = "Who Does What"
body = ["HardCodedKey: the mistake", "KeyFile: a file, and its permissions", "KeystoreVault: a PKCS12 keystore", "Derivation: PBKDF2 and HKDF", "Messages: seal and open, by key name"]
narration = """Here is who does what in the code. [[slnc 400]] The hard coded key class is the mistake, kept so the demo can show it. [[slnc 500]] The key file class writes a key to a file, and checks its permissions. [[slnc 500]] The keystore vault wraps a P K C S twelve keystore. [[slnc 500]] The derivation class makes keys with P B K D F two and H K D F. [[slnc 300]] And the messages class seals and opens, using the name of the key stored in each message."""

[[scene]]
key = "11-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["cacerts and keytool", ".p12 and .pfx files", "Key management services, hardware modules", "\"An API key was committed to a repository\""]
narration = """You have probably met this already. [[slnc 400]] Java's own list of trusted certificates is a keystore, managed with a tool called keytool. [[slnc 500]] Files that end in dot p twelve, or dot p f x, are keystores. [[slnc 500]] Cloud key management services, and hardware security modules, hold keys that never leave them. [[slnc 500]] And news stories that begin, an A P I key was committed to a public repository, are the first demo."""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Keys out of code and repositories", "A keystore, or better a key service", "A key per purpose; a name in every message", "Re-seal old messages before removing a key", "Check what the file records"]
narration = """So, how do you use it? [[slnc 400]] Keep keys out of the code, and out of repositories. [[slnc 500]] Keep them in a keystore, or better, in a key management service. [[slnc 500]] Use a separate key for each purpose, and put the key's name in every message. [[slnc 500]] Seal old messages again with the new key, before removing the old one. [[slnc 500]] And check what the keystore file records about its own protection, instead of trusting the settings."""

[[scene]]
key = "13-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a third key", "and see which messages still open."]
narration = """That's keystores and key management. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] A key is only as safe as its home, so keep it out of the code, in an encrypted keystore, and plan how it will be replaced. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine, with nothing installed except a Java development kit. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a third key to the keystore, and see which messages still open. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
Where an online bank keeps its statement key: in the code, in a key file, or in a PKCS12 keystore, how other keys are derived from passwords and master keys, and how a key is replaced. It covers a thief who has the program, a disk or a backup,
and an operator who makes a mistake. It does not cover key management services or hardware modules, TLS keys, or the application's memory being read.
"""
assets = [
    "The statement key, and any key derived from it.",
    "The keystore file and its password.",
    "Every message sealed under a key that may be removed.",
    "The record of which key name each message carries.",
]
actors = [
    "The bank's program, which uses keys by name.",
    "A thief who has a copy of the program, a disk or a backup.",
    "A person with a login on the machine.",
    "An operator who replaces or removes keys.",
]
boundaries = [
    "Program to repository and build servers: a key in the code crosses it for good.",
    "Application to the filesystem: a key file's permissions are the only guard.",
    "Keystore file to its password: the line a thief must cross by guessing.",
]
assumptions = [
    "The keystore's password is strong and kept outside the application.",
    "The machine's memory is not read by an attacker.",
    "In the demo, keys, salts and nonces are random and never printed, and the key texts in the code are demo values.",
]
out_of_scope = [
    "Key management services and hardware security modules.",
    "TLS private keys and certificates: the transport-security module.",
    "Secret scanning of source history.",
]
tests = [
    "`HardCodedAndFileTest` checks the key is found in the class file, and the permissions of key files.",
    "`KeystoreVaultTest` checks round trips, hidden keys and names, wrong passwords, changed files and the rounds a file records.",
    "`DerivationTest` checks PBKDF2 and HKDF against published values, and separate keys for separate purposes.",
    "`MessagesTest` checks key names in messages, rotation, removal and refusals.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next module, networking, looks at what travels between machines: sockets, names and the web. After it, transport security brings keys, certificates and signatures together in TLS.
"""

[[threat]]
id = "T1"
stride = "I"
threat = "A key written in the code is read from the program, the repository or a build"
where = "`HardCodedKey`"
control = "Keep keys out of the code and repositories"
residual = "A key that was ever committed must be treated as leaked and replaced"

[[threat]]
id = "T2"
stride = "I"
threat = "A key file is read by another user or from a backup"
where = "`KeyFile`"
control = "Owner-only permissions"
residual = "The file still holds the key in the clear, so backups and the owner's account must be protected too"

[[threat]]
id = "T3"
stride = "I"
threat = "A stolen keystore file is attacked offline by guessing its password"
where = "`KeystoreVault`"
control = "The file is encrypted and integrity-protected by a key made from the password, and a wrong password is refused"
residual = "The file records only 10,000 rounds by default, so a strong password matters, and raised settings must be checked in the file"

[[threat]]
id = "T4"
stride = "T"
threat = "A keystore file is changed"
where = "`KeystoreVault.open`"
control = "The file carries an integrity code, so a changed file is refused"
residual = "A deleted or replaced file is still a loss of keys, so keep a backup"

[[threat]]
id = "T5"
stride = "I"
threat = "An opened key is read from the program's memory"
where = "the running program"
control = "None here"
residual = "A key service or hardware module keeps keys out of the program's memory"

[[threat]]
id = "T6"
stride = "D"
threat = "A key is removed before old messages are sealed again, and the data is lost"
where = "`KeystoreVault.remove`, `Messages.open`"
control = "Messages name their key, so the problem is visible, and old messages are sealed again first"
residual = "A runbook and a backup are still needed, because nothing stops the removal"
