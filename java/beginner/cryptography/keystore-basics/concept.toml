[[act]]
title = "A PKCS12 keystore: an encrypted file of keys"
summary = "The keystore hides the key but not its name, opens only with the password and refuses a wrong one; the file records 10,000 rounds twice, and a setting raised at save reaches only the integrity check, not the key's lock."
detail = """
A PKCS12 keystore is an encrypted file of keys. Before saving: the name statements-v1, the key, and the password. After saving, the key's bytes are not in bank.p12, but its name is, as UTF-16 text, so a name is a label, not a secret.
Opened with the password, the key comes back; with a wrong password it is refused. The password is turned into the keys that protect the file, with rounds of PBKDF2, and the file records the rounds in two places: the lock on the key, made when the key is put,
and the integrity check, made when the file is saved. By default both are 10,000. Raising the setting only at save gives 10,000 and 600,000: the key's lock is unchanged. Setting the rounds when the key is put, too, gives 600,000 in both places.
"""
figure = "keystore_file"
figure_title = "What the keystore file hides, and how slowly"
figure_speech = """
The output, part one. [[slnc 400]] Before saving, the inputs. [[slnc 400]] After saving: the key is hidden, the name is not. [[slnc 400]] A wrong password is refused.
[[page]]
Part two: the rounds, read from the file itself. [[slnc 400]] Before the fix, the key's lock stays at ten thousand. [[slnc 400]] After the fix, six hundred thousand in both places.
"""
speech = """
The program's output, part one. [[slnc 400]] Before saving: the name, the key, and the password. [[slnc 500]]
After saving: the key's bytes are hidden, but the name is there, as U T F sixteen. [[slnc 500]]
Opening it: with the password, the key comes back. [[slnc 300]] With a wrong password, it is refused.
[[page]]
Part two: the rounds, read from the file itself. [[slnc 400]] Before the fix: ten thousand twice, then ten thousand and six hundred thousand. [[slnc 500]]
After the fix: six hundred thousand in both places, and it still opens.
"""
rows = { store = "active ok" }
console = [
    ["BEFORE SAVING (what goes in):", "ok"],
    ["  name      statements-v1", "muted"],
    ["  key       6b657973 746f7265 2d737461 74656d65 ...", "muted"],
    ["  password  correct horse battery staple", "muted"],
    ["AFTER SAVING (bank.p12):", "bad"],
    ["  the key's bytes are in the file: false  <- HIDDEN", "bad"],
    ["  the name, as UTF-16, is in the file: true  <- A LABEL", "amber"],
    ["OPENING IT:", "amber"],
    ["  with the password, the key comes back: true", "muted"],
    ["  with a wrong password: refused", "bad"],
    ["---", ""],
    ["BEFORE THE FIX (rounds in the file: key lock, check):", "ok"],
    ["  default          [10000, 10000]", "muted"],
    ["  raised at save   [10000, 600000]  <- LOCK UNCHANGED", "bad"],
    ["AFTER THE FIX (rounds set when the key is put, too):", "bad"],
