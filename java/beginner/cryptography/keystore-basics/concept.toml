[[act]]
title = "A key in a file outside the program"
summary = "A key file with default permissions rw-r--r-- is readable by others; owner-only rw------- is not; but either way the file holds the key in the clear."
detail = """
Moving the key into a file outside the program means it is no longer in the jar. But a file is only as private as its permissions. A new file usually gets rw-r--r--, readable by
others on the machine: anyone with a login can read the key. With rw-------, only the owner can. The file still holds the key in the clear, so anyone who can read it, or a backup of it, has the key.
"""
speech = """
Second demo: a key in a file outside the program. [[slnc 400]] The key is no longer in the program. [[slnc 600]]
But a file is only as private as its permissions. [[slnc 300]] A new file usually allows others to read it. [[slnc 300]] Anyone with a login on the machine can read the key. [[slnc 600]]
With owner only permissions, only the owner can. [[slnc 600]]
But the file still holds the key in the clear. [[slnc 300]] So anyone who can read it, or a backup of it, has the key.
"""
rows = { file = "active amber" }
console = [
