[docs.session]
objectives = [
    "explain how a digital signature differs from an HMAC tag",
    "say who can make and who can check a signature",
    "explain why a signature should carry a purpose, a version and an expiry",
    "explain why a signature is only as good as the public key it is checked against",
]
walkthrough = """
Start with the notary analogy. Run the demo one act at a time. After act one, ask the group who can forge, and why that cannot be fixed with a better tag. After act three, ask what could go wrong if the
refund order and the price list used the same label. After act four, ask where the version should be stored, and what happens after a restart. In act five, ask how a checkout should come to hold the right public key in the first place.
"""
exercises = [
    "Add a third purpose label, shop.discount.v1, and test that signatures for one purpose never verify for another.",
    "Make the checkout store the newest version to a file so it survives a restart.",
    "Sign the price list with a validity of 30 days, and write the test for day 31 first.",
    "Compare the size of an Ed25519 signature with an RSA-2048 signature made with `Signature.getInstance(\"SHA256withRSA\")`.",
]

[docs.explained]
sentence = """
A digital signature is made with a private key and checked with a public key, so anyone can check it and only the key holder can make it; it should cover a fixed encoding of the message together with its purpose, version and expiry; and it is only as trustworthy as the public key it is checked against.
"""
verdict = """
Use a signature, not an HMAC, whenever there are checkers who must not be able to make the message. Use Ed25519, or another modern scheme, from a vetted library. Sign an unambiguous encoding with a purpose label,
put a version and an expiry inside, and check them. Protect the private key, and get the public key to checkers by a route you can trust: a certificate, or a key pinned in the software.
"""
recognise = [
    "`Signature.getInstance(\"Ed25519\")`, `initSign` and `initVerify`.",
    "A signature file beside a download, or a signed Git tag.",
    "A JWT with the algorithm `EdDSA`, `ES256` or `RS256`.",
    "A signed message that carries `version` and `notAfter` fields.",
]

[spec]
purpose = """
Teach digital signatures by showing the forgery that a shared HMAC key allows, signing and checking with Ed25519, tying signatures to a purpose, version and expiry, and showing what a signature cannot do.
"""
