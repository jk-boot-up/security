[[act]]
title = "A good signature on an old message"
summary = "A replayed genuine version 1 is accepted by a naive checkout and refused as OLD_VERSION by one that remembers the newest; a list past its expiry is EXPIRED."
detail = """
The shop published version 1, with the laptop at 1000, and then version 2, at 1200. An attacker replays the old version 1, which really was signed. A checkout that checks only the signature accepts it: OK. The
signature is perfect and the list is old. A checkout that remembers the newest version it has seen refuses it as OLD_VERSION. And a list that was only good until day 40, offered on day 50, is refused as EXPIRED.
The version and the expiry are part of the signed bytes, so nobody can change them without breaking the signature.
"""
speech = """
Fourth demo: a good signature on an old message. [[slnc 400]] The shop published version one, with the laptop at a thousand. [[slnc 300]] Then version two, at twelve hundred. [[slnc 600]]
An attacker replays the old version one, which really was signed. [[slnc 300]] A checkout that checks only the signature accepts it. [[slnc 300]] The signature is perfect. [[slnc 300]] The list is old. [[slnc 600]]
A checkout that remembers the newest version refuses it. [[slnc 300]] And a list that was only good until day forty, offered on day fifty, is refused as expired. [[slnc 600]]
The version and the expiry are part of the signed bytes, so nobody can change them without breaking the signature.
"""
rows = { fresh = "active ok" }
console = [
    ["the shop published version 1 (a laptop at 1000), then version 2 (at 1200)", "muted"],
    ["an attacker replays the old, genuinely signed, version 1 on day 50: OK  <- THE SIGNATURE IS PERFECT, THE LIST IS OLD", "bad"],
