[[act]]
title = "The bill: whose key is it, and what if it is stolen?"
summary = "A checkout given Mallory's public key accepts her forgery; with the real key it refuses it; a stolen private key signs anything; a signature hides nothing; and it is 64 bytes against a 32-byte key."
detail = """
The check is only as good as the key. Mallory gives the checkout her own public key and says it is the shop's: her forged list verifies, OK. With the shop's real public key in the checkout, the same forgery is
refused. If the shop's private key is stolen, the thief's list is accepted until the key is revoked. A signature hides nothing: the price list is readable by anyone, signed or not. And the sizes: a signature is 64
bytes, a raw public key 32, and the same key in its encoded form 44. How to be sure a public key is the shop's is the question that certificates answer, in the next modules.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] The check is only as good as the key. [[slnc 600]]
Mallory gives the checkout her own public key, and says it is the shop's. [[slnc 300]] Her forged list verifies. [[slnc 300]] With the shop's real public key in the checkout, the same forgery is refused. [[slnc 600]]
If the shop's private key is stolen, the thief's list is accepted, until the key is revoked. [[slnc 600]]
A signature hides nothing. [[slnc 300]] The price list is readable by anyone. [[slnc 600]]
How to be sure that a public key is the shop's is the question that certificates answer, in the next videos.
"""
