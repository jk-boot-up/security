[[act]]
title = "How the signature is made, step by step"
summary = "The 64 bytes are worked out by hand in five steps, R and then S, and come out exactly as Java's own signature; the check S x B = R + k x A needs only the public key."
detail = """
Ed25519 uses one fixed point B on a curve. "Times B" means adding B to itself that many times: quick to do, and nobody knows how to undo it. Step 1: hash the private key with
SHA-512 and cut the 64 bytes in two; the first half, with three bits fixed, is the secret number a (307c8386 ...), the second half is a prefix (9b4f0afe ...), and the public key is
A = a x B (d75a9801 ..., the shop's public key). Step 2: r = SHA-512(prefix + message) mod L, where "mod L" keeps the remainder after dividing by a fixed large number L; the same
message always gives the same r, so no random number is needed. Step 3: R = r x B (a83b53e9 ...), the first 32 bytes of the signature. Step 4: k = SHA-512(R + A + message) mod L.
Step 5: S = (r + k x a) mod L (193b6f5a ...), the last 32 bytes. R + S is exactly the signature Java made. To check, the warehouse works out S x B and R + k x A: equal for the real list,
not equal once the mouse is changed to 24. Only someone who knows a can make an S that passes.
"""
figure = "signature_steps"
figure_title = "How the 64 bytes are made"
figure_speech = """
Where do the sixty four bytes come from? [[slnc 400]] Five steps. [[slnc 400]]
They use one fixed point on a curve, called B. [[slnc 300]] Times B is quick to do, and nobody knows how to undo it. [[slnc 500]]
Step one. [[slnc 200]] Hash the private key with S H A five twelve, and cut it in two. [[slnc 300]] The first half is the secret number a. [[slnc 300]] The public key A is a times B. [[slnc 400]]
Step two. [[slnc 200]] Hash the second half with the message, to get r. [[slnc 400]]
Step three. [[slnc 200]] R is r times B: the first half of the signature. [[slnc 400]]
Step four. [[slnc 200]] Hash R, A and the message, to get k. [[slnc 400]]
Step five. [[slnc 200]] S is r plus k times a: the second half. [[slnc 500]]
To check, the warehouse compares S times B with R plus k times A. [[slnc 300]] They match only if the signer knew a.
"""
speech = """
The real values. [[slnc 300]] Step one: the secret a, the prefix, and A, the shop's public key. [[slnc 300]] Step two: r. [[slnc 200]] Mod L means: the remainder after dividing by a fixed large number. [[slnc 300]] Step three: R, a eight, three b.
[[page]]
Steps four and five: k, and S. [[slnc 300]] R and S together are exactly Java's signature. [[slnc 300]] The check: true for the real list, false when the mouse becomes twenty four dollars.
"""
rows = { sig = "active ok" }
console = [
    ["STEP 1. HASH THE PRIVATE KEY (SHA-512), CUT IN TWO", "amber"],
    ["  secret a     307c8386 4f2833cb 427a2ef1 c00a013c ...", "muted"],
    ["  prefix       9b4f0afe 280b746a 778684e7 54425020 ...", "muted"],
    ["  A = a x B    d75a9801 82b10ab7 d54bfed3 c964073a ...", "muted"],
    ["STEP 2. r = SHA-512(prefix + message) mod L", "amber"],
    ["  r            407edecf b2e451e3 de457d5f d71dce50 ...", "muted"],
    ["STEP 3. R = r x B: the first 32 bytes of the signature", "amber"],
    ["  R            a83b53e9 ba4d832c fa721a3f e058732d ...", "muted"],
    ["---", ""],
    ["STEP 4. k = SHA-512(R + A + message) mod L", "amber"],
    ["  k            21d7070c 464ff9d1 e299cbea bc5b58ae ...", "muted"],
    ["STEP 5. S = (r + k x a) mod L: the last 32 bytes", "amber"],
    ["  S            193b6f5a b8906deb cc2f3a23 1634677d ...", "muted"],
    ["  R + S is Java's own signature: true", "muted"],
