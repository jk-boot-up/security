narration = """You have met this already. [[slnc 400]] Signature files beside software downloads. [[slnc 400]] Signed login tokens. [[slnc 400]] Verified commits in Git. [[slnc 400]] And every H T T P S connection rests on signatures on signatures, the next module."""

[[scene]]
