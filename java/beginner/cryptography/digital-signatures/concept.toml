narration = """That's digital signatures. [[slnc 400]] One sentence to remember. [[slnc 300]] Anyone can check a signature and only the key holder can make it, but it is only as good as the key you check it against. [[slnc 500]] The source code, notes, diagrams, and an animated walkthrough are in the repository. [[slnc 400]] One exercise: add a label for discounts, and test that purposes never mix. [[slnc 500]] If this helped, a like and a subscribe help the channel grow. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
An online store's signed price list: the shop that signs, the services that verify, the public key they hold, and the version and expiry inside what is signed. It covers forgery by a service, a signature reused
for another purpose, replay of an old list, a swapped public key and a stolen private key. It does not cover how public keys are distributed or revoked, or how the private key is stored.
"""
assets = [
    "The correctness and freshness of the price list.",
    "The shop's private key.",
    "The public key each service holds.",
    "The record of the newest version each service has accepted.",
]
actors = [
    "The shop, which signs.",
    "The warehouse and the checkout, which verify.",
    "Mallory, who forges lists and tries to swap a public key.",
    "An attacker who replays an old genuine list.",
    "A thief who takes the private key.",
]
boundaries = [
    "Shop to services: lists and signatures cross a network an attacker can touch.",
    "Services to the public key they hold: the line the maths cannot draw.",
    "The shop's private key store: the one place that can sign.",
]
assumptions = [
    "Each service already holds the shop's correct public key, which is exactly what a certificate or a pinned key would provide.",
    "The shop's private key has not been stolen.",
    "In the demo, the shop's key is the public RFC 8032 test key, and the other keys are random and never printed.",
]
out_of_scope = [
    "Certificates, chains of trust and revocation.",
    "Hardware security modules and key rotation.",
    "Encrypting the price list: a signature hides nothing.",
]
tests = [
    "`Rfc8032Test` checks Ed25519 against the published vectors, and refusals of changed messages and wrong-length signatures.",
    "`SigningTest` checks verification, determinism, other keys, other contexts, and that the label cannot run into the message.",
    "`PriceListTest` checks the fixed encoding.",
    "`CheckoutTest` checks forgery, other purposes, a swapped key, replay and expiry.",
    "`HmacContrastTest` shows a shared-key tag can be forged by a checker.",
    "`SignatureStepsTest` checks that the five steps by hand give RFC 8032's and Java's exact signatures, and that the by-hand check refuses a changed message.",
]
next = """
The next module, transport security, builds on this: certificates are signatures that bind a public key to a name, and TLS uses them to answer the question this project leaves open.
"""

[[threat]]
id = "T1"
stride = "S"
threat = "A checker is given the wrong public key, so a forgery verifies"
where = "`Checkout`'s public key"
control = "None in this project: the checkout trusts the key it holds"
residual = "Certificates, or a key pinned in the software, give the checker a trustworthy key"

[[threat]]
id = "T2"
stride = "T"
threat = "A genuine old price list is replayed"
where = "`Checkout.check`"
control = "Version and expiry are inside the signed bytes, and the checkout refuses older versions and expired lists"
residual = "A checkout that forgets the newest version after a restart can be replayed; store it durably"

[[threat]]
id = "T3"
stride = "S"
threat = "The shop's private key is stolen"
where = "the shop's key store"
control = "None in this project"
residual = "Protect and rotate the key, and be able to revoke it; a thief signs anything until then"

[[threat]]
id = "T4"
stride = "T"
threat = "A signature made for one purpose is reused for another"
where = "`Signing.withContext`"
control = "A label for the purpose is signed with the message, separated by a zero byte"
residual = "Every new message type needs its own label, and a code review should check it"

[[threat]]
id = "T5"
stride = "R"
threat = "A service with a shared key forges a message and denies it"
where = "`HmacPublisher`"
control = "Signatures: only the shop can make one, so a signed list points to the shop"
residual = "A stolen private key points to the shop too, which is why key protection matters"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] Seven small classes. [[slnc 300]] Here is what each one does."""

[[class]]
name = "Signing"
what = "signs and verifies with Ed25519, with a label"
[[class.part]]
title = "sign and verify"
code = """
Signature signature = Signature.getInstance("Ed25519");
signature.initSign(key);                            // private key
signature.update(withContext(context, message));
return signature.sign();                            // 64 bytes
...
signature.initVerify(key);                          // public key
signature.update(message);
return signature.verify(signatureBytes);
"""
speech = """Signing is the heart of the code. [[slnc 300]] It signs the label and the message with the private key. [[slnc 300]] It verifies with the public key, and answers true or false."""
[[class.part]]
title = "the label, a zero byte, the message"
code = """
out.writeBytes(Hex.bytes(context));                 // shop.price-list.v1
out.write(0);
out.writeBytes(message);
"""
speech = """With context joins the label, a zero byte, and the message. [[slnc 300]] These are the signed bytes from act four."""

[[class]]
name = "PriceList"
what = "the list, as bytes in one fixed way"
[[class.part]]
title = "encode"
code = """
text.append("version=").append(version).append('\\n');
text.append("validUntilDay=").append(validUntilDay).append('\\n');
new TreeMap<>(pricesDollars).forEach((name, price) ->
        text.append(name).append('=').append(price).append('\\n'));
"""
speech = """The price list writes the version, the last valid day, and the products sorted by name. [[slnc 300]] So the same list always gives the same bytes."""

[[class]]
name = "Publisher"
what = "the shop: signs each list"
[[class.part]]
title = "publish"
code = """
public static final String CONTEXT = "shop.price-list.v1";
...
return new Signed(list, Signing.sign(key, CONTEXT, list.encode()));
"""
speech = """The publisher holds the private key. [[slnc 300]] It signs each list with the price list label, and returns a signed record: the list and its signature."""

[[class]]
name = "Checkout"
what = "verifies, then checks expiry and version"
[[class.part]]
title = "check"
code = """
if (!Signing.verify(shopKey, Publisher.CONTEXT,
        signed.priceList().encode(), signed.signature())) {
    return Verdict.BAD_SIGNATURE;
...
if (today > signed.priceList().validUntilDay()) {
    return Verdict.EXPIRED;
...
if (signed.priceList().version() < newestVersion) {
    return Verdict.OLD_VERSION;
"""
speech = """The checkout holds only the public key. [[slnc 300]] It checks the signature first. [[slnc 300]] Then, if it checks freshness, the expiry, and the newest version it has seen. [[slnc 300]] The answer is a verdict."""

[[class]]
name = "SignatureSteps"
what = "the five steps of act three, by hand"
[[class.part]]
title = "sign, by hand"
code = """
byte[] h = sha512(privateSeed);                   // step 1
...
byte[] publicA = encode(times(a, B));             // A = a x B
BigInteger r = number(sha512(prefix, message)).mod(L);         // step 2
byte[] bigR = encode(times(r, B));                             // step 3
BigInteger k = number(sha512(bigR, publicA, message)).mod(L);  // step 4
BigInteger s = r.add(k.multiply(a)).mod(L);                    // step 5
"""
speech = """Signature steps does the five steps by hand, with plain big numbers. [[slnc 300]] A test checks that it gives the published values of R F C eight oh three two, and Java's own signature."""

[[class]]
name = "HmacPublisher"
what = "the shared-key tag, for the contrast"
[[class.part]]
title = "tag"
code = """
Mac mac = Mac.getInstance("HmacSHA256");
mac.init(new SecretKeySpec(key, "HmacSHA256"));     // the shared key
return mac.doFinal(list.encode());
"""
speech = """The H M A C publisher makes the tag from act one. [[slnc 300]] Whoever holds the shared key can make it."""

[[class]]
name = "Ed25519Keys"
what = "makes keys, and reads them from raw bytes"
[[class.part]]
title = "keys"
code = """
return KeyPairGenerator.getInstance("Ed25519").generateKeyPair();
...
return KeyFactory.getInstance("Ed25519")
        .generatePrivate(new EdECPrivateKeySpec(
                NamedParameterSpec.ED25519, seed));
"""
speech = """And Ed twenty five five one nine keys makes a new key pair, or rebuilds the shop's test key from its thirty two raw bytes."""

[[acronym]]
short = "HMAC"
long = "Hash-based Message Authentication Code"
say = "H M A C is Hash based Message Authentication Code."
[[acronym]]
short = "SHA"
long = "Secure Hash Algorithm (SHA-256, SHA-512)"
say = "S H A is Secure Hash Algorithm. [[slnc 200]] S H A five twelve gives sixty four bytes."
[[acronym]]
short = "Ed25519"
long = "Edwards-curve signatures, modulo 2^255 - 19"
say = "Ed twenty five five one nine: Ed for Edwards, the kind of curve, and the numbers for the prime its maths uses."
[[acronym]]
short = "RFC"
long = "Request for Comments: a published internet standard"
say = "R F C is Request for Comments: a published internet standard."
[[acronym]]
short = "hex"
long = "hexadecimal: each byte as two characters, 00 to ff"
say = "Hex is hexadecimal: each byte written as two characters."
[[acronym]]
short = "HTTPS"
long = "HyperText Transfer Protocol Secure"
say = "And H T T P S is HyperText Transfer Protocol Secure."
