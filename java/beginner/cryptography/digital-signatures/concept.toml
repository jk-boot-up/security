[[act]]
title = "What exactly is signed"
summary = "The signed bytes are a label, a zero byte and the list in one fixed order; a signature made for a refund order is refused when offered as a price list."
detail = """
A signature covers bytes, so the message must become bytes in one fixed way. Before signing, three parts are joined: the label shop.price-list.v1, a zero byte, and the price list,
one field per line with the products sorted by name, so two lists built in a different order give the same bytes. Around the zero byte the bytes are 742e7631 ("t.v1"), 00, then
76657273 ("vers"). The shop then signs the same list for another purpose, a refund order, with the label shop.refund.v1. Checked as a refund order, the signature is fine; offered as a
price list, it is refused, because the label is signed along with the message. The zero byte keeps the label from running into the message. This is called domain separation.
"""
figure = "signed_bytes"
figure_title = "What is signed: label, zero byte, list"
figure_speech = """
A signature covers bytes. [[slnc 300]] Which bytes, exactly? [[slnc 400]]
Before signing, three parts are joined. [[slnc 300]] A label for the purpose, shop dot price list dot v one. [[slnc 300]] A zero byte. [[slnc 300]] And the price list, with its products in name order, so the same list always gives the same bytes. [[slnc 500]]
Now the shop signs the same list with a refund label. [[slnc 300]] As a refund order: fine. [[slnc 300]] As a price list: refused, because the label was signed too. [[slnc 400]]
The zero byte keeps the label from running into the list.
"""
speech = """
In the output: the label, the zero byte, the list, and the bytes around the zero. [[slnc 300]] Another build order gives the same bytes. [[slnc 300]] And the refund signature: accepted as a refund, refused as a price list.
"""
rows = { sig = "active ok", purpose = "active ok" }
console = [
    ["BEFORE SIGNING (the signed bytes = label + 00 + list):", "ok"],
    ["  label     shop.price-list.v1", "muted"],
    ["  zero byte 00", "muted"],
    ["  list      version=2 validUntilDay=100 laptop=1200 mouse=25", "muted"],
    ["  around 00 742e7631 | 00 | 76657273", "muted"],
    ["  built in another order, the same bytes: true", "muted"],
    ["AFTER SIGNING FOR ANOTHER PURPOSE (label shop.refund.v1):", "bad"],
    ["  checked as a refund order: true", "muted"],
    ["  offered as a price list:   refused  <- TIED TO ITS PURPOSE", "muted"],
]

[[act]]
title = "A good signature on an old message"
summary = "A replayed genuine version 1 is accepted by a checkout that checks only the signature, and refused as OLD_VERSION by one that remembers the newest; a list past its expiry is EXPIRED."
detail = """
Before: the shop signed version 1, with the laptop at 1000, and then version 2, at 1200; both signatures are genuine. The attack: on day 50 an attacker replays version 1. A checkout
that checks only the signature accepts it: OK. The signature is perfect and the list is old. After the fix: a checkout that remembers the newest version it has seen refuses it as
OLD_VERSION, and a list that was only good until day 40, offered on day 50, is refused as EXPIRED. The version and the expiry are part of the signed bytes, so nobody can change them
without breaking the signature.
"""
figure = "replay"
figure_title = "A genuine old list, replayed"
figure_speech = """
A perfect signature can still sit on an old message. [[slnc 400]]
The shop signed version one, laptop at a thousand dollars, then version two, at twelve hundred. [[slnc 500]]
On day fifty, an attacker sends version one again. [[slnc 300]] A checkout that checks only the signature says okay. [[slnc 500]]
The fix: the version and the last valid day are inside the signed bytes. [[slnc 300]] A checkout that has seen version two says: old version. [[slnc 300]] A list valid until day forty, on day fifty: expired. [[slnc 400]]
Nobody can change these numbers without breaking the signature.
"""
speech = """
The output. [[slnc 300]] Before: both versions, as the shop signed them. [[slnc 300]] The attack: the signature alone says okay. [[slnc 300]] After the fix: old version, and expired.
"""
rows = { fresh = "active ok" }
console = [
    ["BEFORE (both genuinely signed by the shop):", "ok"],
    ["  version 1    version=1 validUntilDay=100 laptop=1000 mouse=20", "muted"],
    ["  version 2    version=2 validUntilDay=100 laptop=1200 mouse=25", "muted"],
    ["THE ATTACK (version 1 replayed on day 50):", "bad"],
    ["  signature checked only: OK  <- PERFECT SIGNATURE, OLD LIST", "bad"],
    ["AFTER THE FIX (version and expiry are checked):", "ok"],
    ["  a checkout that has seen version 2: OLD_VERSION", "muted"],
    ["  valid until day 40, offered on day 50: EXPIRED", "muted"],
    ["  both are inside the signed bytes, so nobody can change them", "muted"],
]

[[act]]
title = "The bill: whose key is it, and what if it is stolen?"
summary = "A checkout given Mallory's public key accepts her forgery; with the real key it refuses it; a stolen private key signs anything; a signature hides nothing; and it is 64 bytes against a 32-byte key."
detail = """
The check is only as good as the key. The attack: Mallory signs a list with the laptop at 1 dollar with her own key, gives the checkout her public key and says it is the shop's: her
list verifies, OK. After the fix, with the shop's real public key in the checkout, the same list is BAD_SIGNATURE. What a signature cannot do: stop a thief with the shop's private key,
whose list is accepted until the key is revoked; or hide anything, since the price list is readable by anyone. The sizes: a signature is 64 bytes, a raw public key 32, and the same key
in its encoded form 44. How to be sure a public key is the shop's is the question that certificates answer, in the next modules.
"""
figure = "whose_key"
figure_title = "Whose key is it?"
figure_speech = """
Last, the bill. [[slnc 400]] Mallory signs a list, laptop at one dollar, with her own key. [[slnc 300]] She gives a checkout her public key, and says it is the shop's. [[slnc 300]] The check says okay. [[slnc 300]] The maths is fine. The key was wrong. [[slnc 400]] With the shop's real key, the list is refused. [[slnc 500]]
And two limits. [[slnc 300]] A thief with the private key signs anything, until the key is revoked. [[slnc 300]] And a signature hides nothing. [[slnc 400]]
Whose key it is, is what certificates answer, in the next videos.
"""
speech = """
The output. [[slnc 300]] With Mallory's key: okay. [[slnc 300]] With the shop's key: bad signature. [[slnc 300]] The stolen key: okay. [[slnc 300]] And the sizes in bytes.
"""
rows = { trust = "active amber", sig = "active amber" }
console = [
    ["THE ATTACK (Mallory's key, said to be the shop's):", "bad"],
