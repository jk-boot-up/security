narration = """So, how do you use it? [[slnc 400]] Use a signature when checkers must not be able to make the message. [[slnc 400]] Use Ed twenty five five one nine from a vetted library. [[slnc 400]] Sign a fixed encoding, with a purpose, a version and an expiry. [[slnc 400]] Protect the private key, and get the public key by a route you trust."""

