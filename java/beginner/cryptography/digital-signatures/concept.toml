[[scene]]
key = "01-poster"
kind = "poster"
title = "Digital Signatures (Ed25519)"
narration = """Hello, and welcome. [[slnc 400]] This video explains digital signatures, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A keyed hash, like H M A C, proves that a message came from someone with a shared key. [[slnc 300]] But everyone who can check it, can also forge it. [[slnc 300]] A digital signature separates the two jobs. [[slnc 300]] It is made with a private key, which only the signer has. [[slnc 300]] And checked with a public key, which anyone may have. [[slnc 600]] Think of a notary's signature. [[slnc 300]] Anyone can compare it with the specimen on file. [[slnc 300]] Nobody else can write it so that it matches. [[slnc 700]] In this video, the domain is an online store, and its price list. [[slnc 500]] By the end, you will hear how a signature is made and checked. [[slnc 300]] What should be inside what is signed. [[slnc 300]] And the two things a signature cannot do on its own."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online store publishes a price list.", "A warehouse and a checkout use it.", "", "Each must be sure it came from the store.", "None must be able to make one.", "", "Version 2: the laptop at 1,200 dollars."]
narration = """Here is the scenario. [[slnc 400]] An online store publishes a price list. [[slnc 500]] A warehouse and a checkout service use it. [[slnc 500]] Each must be sure that the list came from the store. [[slnc 300]] And none of them must be able to make a list that looks as if it did. [[slnc 600]] Version two has the laptop at twelve hundred dollars."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["Private key: only the signer has it", "Public key: anyone may have it", "Signature: 64 bytes, made with the private key", "Verify: check with the public key", "Ed25519: a modern, simple choice"]
narration = """Before the demos, the words. [[slnc 500]] The private key is the one that only the signer has. [[slnc 500]] The public key is the one that anyone may have. [[slnc 500]] A signature is sixty four bytes, made with the private key. [[slnc 500]] To verify is to check it with the public key. [[slnc 500]] And Ed twenty five five one nine is a modern, simple, and fast way of doing all of this."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "09-limits"
kind = "bullets"
title = "What To Put Inside, And What Is Left"
body = ["Inside: an unambiguous encoding", "Inside: a label for the purpose", "Inside: a version and an expiry", "", "Left: whose public key it is", "Left: protecting the private key"]
narration = """Let's put it together. [[slnc 400]] Inside what is signed, put an unambiguous encoding. [[slnc 500]] A label for the purpose. [[slnc 500]] And a version and an expiry. [[slnc 600]] What is left for you is to be sure whose public key it is. [[slnc 500]] And to protect the private key."""

[[scene]]
key = "10-roles"
kind = "bullets"
title = "Who Does What"
body = ["Ed25519Keys: makes and reads keys", "Signing: sign and verify, with a label", "PriceList: one fixed encoding", "Publisher: signs. Checkout: verifies", "HmacPublisher: the contrast"]
narration = """Here is who does what in the code. [[slnc 400]] Ed twenty five five one nine keys makes keys, and reads them from raw bytes. [[slnc 500]] The signing class signs and verifies, with a label. [[slnc 500]] The price list turns itself into bytes in one fixed way. [[slnc 500]] The publisher signs, and the checkout verifies. [[slnc 300]] And the H M A C publisher is there for the contrast."""

[[scene]]
key = "11-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Signature files beside downloads", "JWTs signed with RS256, ES256, EdDSA", "Git: Verified commits", "HTTPS certificates: signatures on signatures"]
narration = """You have probably met this already. [[slnc 400]] Software downloads often come with a signature file beside them. [[slnc 500]] A J W T signed with R S two fifty six, or E S two fifty six, uses a signature, while H S two fifty six uses H M A C. [[slnc 500]] Git shows a verified badge on signed commits. [[slnc 500]] And every H T T P S connection rests on a chain of signatures on signatures, which is the subject of the next module."""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["A signature when checkers must not be able to make", "Ed25519 from a vetted library", "Sign encoding + purpose + version + expiry", "Protect the key; get the public key by a trusted route"]
narration = """So, how do you use it? [[slnc 400]] Use a signature, not H M A C, whenever there are checkers who must not be able to make the message. [[slnc 500]] Use Ed twenty five five one nine, from a vetted library. [[slnc 500]] Sign an unambiguous encoding, with a purpose, a version, and an expiry, and check them. [[slnc 500]] And protect the private key, and get the public key to checkers by a route that you can trust."""

[[scene]]
key = "13-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a third label", "and test that purposes never mix."]
narration = """That's digital signatures. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Anyone can check a signature and only the key holder can make it, but it is only as good as the key you check it against. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine, with nothing installed except a Java development kit. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a third label, for discounts, and test that signatures for different purposes never mix. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
An online store's signed price list: the shop that signs, the services that verify, the public key they hold, and the version and expiry inside what is signed. It covers forgery by a service, a signature reused
for another purpose, replay of an old list, a swapped public key and a stolen private key. It does not cover how public keys are distributed or revoked, or how the private key is stored.
"""
assets = [
    "The correctness and freshness of the price list.",
    "The shop's private key.",
    "The public key each service holds.",
    "The record of the newest version each service has accepted.",
]
actors = [
    "The shop, which signs.",
    "The warehouse and the checkout, which verify.",
    "Mallory, who forges lists and tries to swap a public key.",
    "An attacker who replays an old genuine list.",
    "A thief who takes the private key.",
]
boundaries = [
    "Shop to services: lists and signatures cross a network an attacker can touch.",
    "Services to the public key they hold: the line the maths cannot draw.",
    "The shop's private key store: the one place that can sign.",
]
assumptions = [
    "Each service already holds the shop's correct public key, which is exactly what a certificate or a pinned key would provide.",
    "The shop's private key has not been stolen.",
    "In the demo, the shop's key is the public RFC 8032 test key, and the other keys are random and never printed.",
]
out_of_scope = [
    "Certificates, chains of trust and revocation.",
    "Hardware security modules and key rotation.",
    "Encrypting the price list: a signature hides nothing.",
]
tests = [
    "`Rfc8032Test` checks Ed25519 against the published vectors, and refusals of changed messages and wrong-length signatures.",
    "`SigningTest` checks verification, determinism, other keys, other contexts, and that the label cannot run into the message.",
    "`PriceListTest` checks the fixed encoding.",
    "`CheckoutTest` checks forgery, other purposes, a swapped key, replay and expiry.",
    "`HmacContrastTest` shows a shared-key tag can be forged by a checker.",
]
next = """
The next module, transport security, builds on this: certificates are signatures that bind a public key to a name, and TLS uses them to answer the question this project leaves open.
"""

[[threat]]
id = "T1"
stride = "S"
threat = "A checker is given the wrong public key, so a forgery verifies"
where = "`Checkout`'s public key"
control = "None in this project: the checkout trusts the key it holds"
residual = "Certificates, or a key pinned in the software, give the checker a trustworthy key"

[[threat]]
id = "T2"
stride = "T"
threat = "A genuine old price list is replayed"
where = "`Checkout.check`"
control = "Version and expiry are inside the signed bytes, and the checkout refuses older versions and expired lists"
residual = "A checkout that forgets the newest version after a restart can be replayed; store it durably"

[[threat]]
id = "T3"
stride = "S"
threat = "The shop's private key is stolen"
where = "the shop's key store"
control = "None in this project"
residual = "Protect and rotate the key, and be able to revoke it; a thief signs anything until then"

[[threat]]
id = "T4"
stride = "T"
threat = "A signature made for one purpose is reused for another"
where = "`Signing.withContext`"
control = "A label for the purpose is signed with the message, separated by a zero byte"
residual = "Every new message type needs its own label, and a code review should check it"

[[threat]]
id = "T5"
stride = "R"
threat = "A service with a shared key forges a message and denies it"
where = "`HmacPublisher`"
control = "Signatures: only the shop can make one, so a signed list points to the shop"
residual = "A stolen private key points to the shop too, which is why key protection matters"
