[[act]]
title = "What exactly is signed"
summary = "A price list always becomes the same bytes however it was built; a signature made for a refund order is refused when offered as a price list, because each is tied to its purpose."
detail = """
A signature covers bytes, so the message must become bytes in one fixed way. The price list is written with its products sorted, one per line, so two lists with the same products built in a different order give the same bytes. And
a signature should be tied to its purpose. The shop signs the same bytes as a refund order, with the label shop.refund.v1. Checked as a refund order, that signature is fine. Offered as a price list, it is refused, because
the label is signed along with the message. A zero byte separates the label from the message, so one cannot run into the other. This is called domain separation.
"""
speech = """
Third demo: what exactly is signed. [[slnc 400]] A signature covers bytes. [[slnc 300]] So the message must become bytes in one fixed way. [[slnc 600]]
The price list is written with its products in order, one per line. [[slnc 300]] Two lists with the same products, built in a different order, give the same bytes. [[slnc 600]]
And a signature should be tied to its purpose. [[slnc 300]] The shop signs the same bytes as a refund order, with a label saying so. [[slnc 300]] Checked as a refund order, the signature is fine. [[slnc 300]] Offered as a price list, it is refused. [[slnc 300]] The label is signed along with the message. [[slnc 600]]
A zero byte separates the label from the message, so one cannot run into the other.
"""
