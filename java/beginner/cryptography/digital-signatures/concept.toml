[[scene]]
key = "01-poster"
kind = "poster"
title = "Digital Signatures (Ed25519)"
narration = """Hello, and welcome. [[slnc 400]] This video explains digital signatures, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] A keyed hash, like H M A C, a hash based message authentication code, proves that a message came from someone with a shared key. [[slnc 300]] But everyone who can check it, can also forge it. [[slnc 300]] A digital signature separates the two jobs. [[slnc 300]] It is made with a private key, which only the signer has, and checked with a public key, which anyone may have. [[slnc 600]] Our domain is an online store, and its price list. [[slnc 400]] You will see how a signature is made, step by step, what belongs inside it, and what it cannot do."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online store publishes a price list.", "A warehouse and a checkout use it.", "", "Each must be sure it came from the store.", "None must be able to make one.", "", "Version 2: the laptop at 1,200 dollars."]
narration = """Here is the scenario. [[slnc 400]] An online store publishes a price list. [[slnc 500]] A warehouse and a checkout service use it. [[slnc 500]] Each must be sure that the list came from the store. [[slnc 300]] And none of them must be able to make a list that looks as if it did. [[slnc 600]] Version two has the laptop at twelve hundred dollars."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["Private key: only the signer has it", "Public key: anyone may have it", "Signature: 64 bytes, made with the private key", "Verify: check with the public key", "Ed25519: a modern, simple choice"]
narration = """Before the demos, the words. [[slnc 400]] The private key: only the signer has it. [[slnc 400]] The public key: anyone may have it. [[slnc 400]] A signature: sixty four bytes, made with the private key. [[slnc 400]] To verify: to check it with the public key. [[slnc 400]] And Ed twenty five five one nine: a modern, simple way to do all this."""

[[scene]]
key = "03-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "04-core"
kind = "figure"
title = "One price list, signed and checked"
body = "one_signature"
narration = """Here is the whole idea on one real example. [[slnc 400]] Before signing: the shop's price list, version two, with a laptop at twelve hundred dollars. [[slnc 400]] The shop signs it with its private key. [[slnc 300]] After signing: sixty four bytes, starting a eight, three b. [[slnc 300]] They travel with the list, which stays readable. [[slnc 500]] The warehouse checks both with the shop's public key: okay, or bad signature. [[slnc 400]] The private key makes. [[slnc 300]] The public key only checks."""

