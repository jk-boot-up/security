# concept.toml: everything about this project that is not Java code.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "digital-signatures-with-bouncy-castle"
module = "cryptography"
title = "Digital Signatures with Bouncy Castle and OpenSSL"
short_title = "Signatures with Bouncy Castle"
package = "signaturesbc"
main_class = "SignaturesBcDemo"
tagline = "Signed messages that other programs can check"
bold = "Bouncy Castle adds the standard signed formats and curves the JDK leaves out, CMS SignedData, deterministic ECDSA, Ed448 and JWS, and OpenSSL can check what it writes, but a valid signature proves only that a key signed, not who owns the key."
domain = "an online bank"
domain_note = ""
youtube_description = """Digital signatures with Bouncy Castle and OpenSSL, in Java: the JDK can sign, but real systems exchange signed messages in standard formats. Explained with an online bank, like a notary's stamp that any office in the world knows how to check. We sign a statement in the standard CMS format, attached and detached, see why ECDSA needs a nonce that never repeats and how deterministic signing removes the risk, reproduce the published Ed25519 and Ed448 vectors, build a compact signed token by hand and see why the verifier must choose the algorithm, and finish with the bill: a valid signature does not say who owns the key, and the signing time is only the signer's word."""
thumb_lines = ["SIGNATURES WITH", "BOUNCY CASTLE"]
thumb_code = "CMSSignedData"
youtube_title = "Digital Signatures with Bouncy Castle and OpenSSL (CMS, ECDSA, Ed25519, JWS)"
youtube_tags = ["digital signatures", "bouncy castle", "openssl", "cms", "ecdsa", "ed25519", "jws", "rfc 6979", "java", "cybersecurity for beginners"]

[readme]
technologies = [["OpenSSL (command-line tool)", "3.x", "the independent check that verifies the signatures Java writes and signs a message Java verifies; needed for the integration tests"]]
intro = """
The plain version of this lesson used Ed25519 from the JDK. Real systems exchange signed messages in **standard formats** that other programs understand. **Bouncy Castle** is an open-source
library that fills the gaps. It writes **CMS SignedData**, the standard signed message behind S/MIME email, signed PDFs and code signing, with the signer's certificate and **signed attributes** inside, and it can leave the content out (**detached**)
so the content travels separately. It does **ECDSA** with the nonce chosen two ways, randomly or **deterministically** (RFC 6979), and **Ed448**, and it supplies the building blocks for a **JWS** token written by hand. Because these are standards, a different program can check them,
and this project proves that by asking **OpenSSL** to verify what Bouncy Castle wrote, and by having Java verify what OpenSSL signed.

The demo signs a bank statement, shows the one mistake that destroys ECDSA, reproduces published test values and ends with the bill: what a signature does not tell you.
"""
analogy = """
Think of a notary's stamp. The stamp has a standard shape that every office knows how to check, and the notary's register says when the stamp was applied. A good stamp proves that the notary's stamp was used on exactly this paper. It does not prove that the notary is who they say they are,
and the date is the notary's own writing, unless a trusted clock office adds its own stamp.
"""
scenario = """
An online bank signs customer statements. The demo signs a statement in the standard CMS format, attached and detached, then looks at ECDSA nonces, reproduces the published values for Ed25519 and Ed448, builds a compact JWS token, and wraps a signed message in PEM text.
"""
costs = [
    "**A valid signature proves the key, not the person.** The certificate in the message is self-signed here, so anyone can make one. Knowing who owns the key needs a chain of certificates, which is the next module.",
    "**The signing time is the signer's word.** It is covered by the signature, but a signer can write any time. A trusted time needs a timestamp authority (RFC 3161), which is described here and not run.",
    "**ECDSA can fail catastrophically.** One reused or guessable nonce reveals the private key. Deterministic signing and Ed25519 remove the risk.",
    "**The library is large.** About 7 MB of Bouncy Castle for a handful of format functions.",
    "**Formats are easy to misuse.** A JWS verifier that reads the algorithm from the token can be fooled with `alg: none`, so the verifier must decide.",
]
too_much = """
For signing a file or a token inside one application, the JDK alone is enough. Bring in Bouncy Castle when another system needs a standard format, such as CMS or PEM, when a curve is missing from the JDK, or when a library you use already depends on it.
"""
met_before = [
    "Signed PDFs and S/MIME email, which are CMS SignedData.",
    "Java's `jarsigner` and Android's APK signing.",
    "JWT and JWS tokens in web logins, and `alg: none` in vulnerability reports.",
    "`openssl dgst -sign` and `openssl cms -sign` in scripts.",
]
where = """
This project follows [digital-signatures](../digital-signatures) and [asymmetric-encryption-with-bouncy-castle](../asymmetric-encryption-with-bouncy-castle) in [cryptography](..), and leads to [keystore-basics](../keystore-basics), which says where the private key should live.
"""
twin = """
The keys are random, so the demo prints only facts that do not depend on them. Ed25519, Ed448 and deterministic ECDSA have published values, which are reproduced exactly. OpenSSL is used only by the integration tests, so the demo and ordinary tests need only a JDK.
"""
test_note = "Ed25519 and Ed448 are checked against RFC 8032, deterministic ECDSA against RFC 6979 appendix A.2.5, and the JWS against RFC 8037. The ordinary tests need only a JDK; the integration tests (tagged openssl) run a real OpenSSL 3 as an independent check."

[[act]]
title = "A standard signed message: CMS SignedData"
summary = "The statement is signed with an ECDSA key and verifies both attached and detached; a changed statement, a changed bit and another certificate are refused; the signing time is only the signer's claim."
detail = """
The bank signs a statement with its ECDSA key and puts its certificate in the message. Attached, the statement travels inside and verifies with the certificate. Detached, the statement travels separately and verifies when it is supplied.
A changed statement is refused. One bit changed inside an attached message is refused. Somebody else's certificate refuses it. The signing time inside, 2026-03-01T09:30:00Z, is covered by the signature but it is the signer's word.
"""
speech = """
First demo: a standard signed message. [[slnc 400]] The bank signs a statement, and puts its certificate in the message. [[slnc 600]]
Attached, the statement travels inside. [[slnc 300]] Detached, it travels separately. [[slnc 300]] Both verify. [[slnc 600]]
A changed statement is refused. [[slnc 300]] One changed bit is refused. [[slnc 300]] Somebody else's certificate refuses it. [[slnc 600]]
The signing time is inside the signature, but it is only the signer's word.
"""
rows = { cms = "active ok" }
console = [
    ["the bank signs a statement with its ECDSA key and puts its certificate in the message", "muted"],
    ["attached (the statement travels inside) verifies with the certificate: true", "ok"],
    ["detached (the statement travels separately) verifies when the statement is supplied: true", "ok"],
    ["the detached signature with a changed statement: refused", "ok"],
    ["the attached message with one bit changed inside it: refused", "ok"],
    ["checked against somebody else's certificate: refused", "ok"],
    ["the signing time inside is 2026-03-01T09:30:00Z: covered by the signature, but it is the signer's word", "amber"],
]

[[act]]
title = "ECDSA: the nonce that must never repeat"
summary = "Deterministic signing repeats and matches RFC 6979, randomized signing differs each time, and two signatures with the same nonce reveal the private key."
detail = """
Deterministic signing of the same message twice gives the same signature, and it matches the value published in RFC 6979 appendix A.2.5. Randomized signing gives different signatures each time, and both verify.
Two signatures made with the same nonce let anyone compute the private key. Never reuse a nonce: deterministic signing removes the risk, and so does Ed25519.
"""
speech = """
Second demo: E C D S A. [[slnc 400]] Every signature needs a secret number, used once, called a nonce. [[slnc 600]]
Deterministic signing derives it from the key and the message, so the same message gives the same signature, and it matches the published value. [[slnc 600]]
Randomized signing draws it at random, so every signature differs. [[slnc 600]]
But two signatures that share a nonce let anyone compute the private key. [[slnc 300]] Never reuse a nonce.
"""
rows = { ecdsa = "active amber" }
console = [
    ["deterministic signing (RFC 6979) of the same message twice gives the same signature: true", "ok"],
    ["and it matches the value published in RFC 6979 appendix A.2.5: true", "ok"],
    ["randomized signing of the same message twice gives different signatures: true, and both verify: true", "ok"],
    ["two signatures made with the same nonce let anyone compute the private key: true  <- NEVER REUSE A NONCE", "bad"],
    ["deterministic signing removes the risk, and so does Ed25519, which is the next demo", "muted"],
]

[[act]]
title = "EdDSA: Ed25519 and Ed448"
summary = "Ed25519 gives 64-byte and Ed448 114-byte signatures that match RFC 8032, the same bytes every time, and one flipped bit is refused."
detail = """
An Ed25519 signature is 64 bytes and matches RFC 8032. An Ed448 signature is 114 bytes and matches RFC 8032. Signing again gives the same bytes, with no random number involved. Both verify, and one flipped bit in an Ed25519 signature is refused.
"""
speech = """
Third demo: E d D S A. [[slnc 400]] Ed twenty five five one nine signatures are sixty four bytes. [[slnc 300]] Ed four four eight signatures are one hundred fourteen bytes. [[slnc 300]] Both match the published values. [[slnc 600]]
Signing again gives the same bytes. [[slnc 300]] No random number is involved. [[slnc 600]]
One flipped bit is refused.
"""
rows = { eddsa = "active ok" }
console = [
    ["an Ed25519 signature is 64 bytes and matches RFC 8032: true", "ok"],
    ["an Ed448 signature is 114 bytes and matches RFC 8032: true", "ok"],
    ["signing again gives the same bytes, with no random number involved: true and true", "ok"],
    ["both verify: true; one flipped bit in an Ed25519 signature: refused", "ok"],
]

[[act]]
title = "A compact signed token: JWS"
summary = "The RFC 8037 example token is reproduced exactly, detached works, and a token claiming alg none or carrying another payload is refused because the verifier decides the algorithm."
detail = """
Signing the RFC 8037 example gives exactly the token in the RFC, and it verifies. The detached form has an empty middle part and verifies when the payload is supplied. A token that claims alg none and has no signature is refused,
and so is the same signature with a different payload. The verifier decides the algorithm, not the token: that is what stops alg none and key confusion.
"""
speech = """
Fourth demo: a compact signed token. [[slnc 400]] Signing the example in the standard gives exactly the token in the standard. [[slnc 600]]
The detached form leaves the payload out, and verifies when it is supplied. [[slnc 600]]
A token that says its algorithm is none is refused. [[slnc 300]] A changed payload is refused. [[slnc 600]]
The verifier decides the algorithm, not the token.
"""
rows = { jws = "active ok" }
console = [
    ["signing the RFC 8037 example gives exactly the token in the RFC: true", "ok"],
    ["it verifies: true", "ok"],
    ["detached form has an empty middle part (true) and verifies when the payload is supplied: true", "ok"],
    ["a token that claims alg none and has no signature: refused", "ok"],
    ["the same signature with a different payload: refused", "ok"],
    ["the verifier decides the algorithm, not the token: that is what stops alg none and key confusion", "muted"],
]

[[act]]
title = "Text armor, and the bill"
summary = "A signed message as PEM text round-trips, but a valid signature does not say who owns the key, the signing time is a claim, and the private key still needs a home."
detail = """
A signed message as PEM text begins with BEGIN CMS and reads back to the same bytes. Then the bill: a valid signature proves that the key signed, not who owns the key, which needs a chain of certificates. The signing time is the signer's claim: a trusted time
needs a timestamp authority (RFC 3161), described and not run. The private key still needs a home, which is the next project. OpenSSL checks the same files in the integration tests.
"""
speech = """
Fifth demo: text armor, and the bill. [[slnc 400]] A signed message can be written as P E M text, and read back to the same bytes. [[slnc 600]]
Now the bill. [[slnc 300]] A valid signature proves that a key signed. [[slnc 300]] It does not say who owns the key. [[slnc 300]] That needs a chain of certificates. [[slnc 600]]
The signing time is the signer's claim. [[slnc 300]] A trusted time needs a timestamp authority. [[slnc 600]]
And the private key still needs a home.
"""
rows = { pem = "active amber" }
console = [
    ["a signed message as PEM text begins with -----BEGIN CMS-----: true", "ok"],
    ["and reads back to the same bytes: true", "ok"],
    ["a valid signature proves that the key signed, not who owns the key: that needs a chain of certificates", "amber"],
    ["the signing time is the signer's claim: a trusted time needs a timestamp authority (RFC 3161), described here and not run", "amber"],
    ["the private key still needs a home: see keystore-basics", "amber"],
    ["openssl checks these same files in the integration tests: cms -verify, pkeyutl -verify and dgst -verify", "muted"],
]

[animation]
