[[act]]
title = "The nonce that must never repeat"
summary = "Two payments signed with one k share the same r, and two lines of arithmetic give back k and the bank's private key; a deterministic k or Ed25519 and Ed448 remove the risk."
detail = """
The mistake: "pay 10 to Bob" and "pay 99 to Eve" are signed with the same k, so both signatures have the same r. The attack, without the key: k = (h1 - h2) / (s1 - s2) gives 12345678 90abcdef ..., and key = (s1 times k - h1) / r gives c9afa9d8 ... 120f6721, the bank's private key.
The fix: a deterministic k (RFC 6979) gives the same signature for the same statement, so it never repeats on different messages; a random k gives different signatures that both verify. Ed25519 (64 bytes) and Ed448 (114 bytes) match RFC 8032, sign the same bytes every time, and refuse a flipped bit.
"""
figure = "nonce_reuse"
figure_title = "One k twice gives the key away"
figure_speech = """
Third demo: the one-time number k. [[slnc 400]] In red, the mistake: two payments signed with the same k. [[slnc 300]] Both signatures get the same r, so anyone can see the reuse. [[slnc 500]]
In amber, the attack. [[slnc 300]] Two signatures, one shared k: two equations, two unknowns. [[slnc 300]] The first line gives k. [[slnc 300]] The second gives the key: the bank's private key, from the last demo. [[slnc 500]]
In green, the fix. [[slnc 300]] Make k from the key and the message, as R F C sixty nine seventy nine does. [[slnc 300]] Or use Ed twenty five five one nine, which needs no random number at all.
"""
speech = """
The real output. [[slnc 400]] Two payments, and the same r in both. [[slnc 500]] From the signatures alone, k comes out: one two three four five six seven eight, and so on. [[slnc 300]] Then the key: c nine a f a nine d eight. [[slnc 300]] The bank's key. [[slnc 500]]
[[page]]
The fixes. [[slnc 300]] A deterministic k gives the same signature for the same statement. [[slnc 400]] Ed twenty five five one nine and Ed four four eight match their published values, give the same bytes every time, and refuse a flipped bit.
"""
rows = { eddsa = "active amber" }
console = [
    ["THE MISTAKE: one k for two payments", "ok"],
    ["  message 1    pay 10 to Bob", "muted"],
    ["  message 2    pay 99 to Eve", "muted"],
    ["  the same r in both signatures: true  <- THE REUSE SHOWS", "bad"],
    ["THE ATTACK, WITHOUT THE KEY:", "ok"],
    ["  k = (h1 - h2) / (s1 - s2)", "muted"],
    ["  k            12345678 90abcdef 12345678 90abcdef", "muted"],
    ["               12345678 90abcdef 12345678 90abcdef", "muted"],
    ["  key = (s1 times k - h1) / r", "muted"],
    ["  key          c9afa9d8 45ba7516 6b5c2157 67b1d693", "muted"],
    ["               4e50c3db 36e89b12 7b8a622b 120f6721", "muted"],
    ["  the bank's private key: true  <- NEVER REUSE A NONCE", "bad"],
    ["---", ""],
    ["THE FIX, ONE: a deterministic k (RFC 6979)", "ok"],
    ["  the statement signed twice, same r and s: true", "muted"],
    ["  random k: they differ: true, both verify: true", "muted"],
    ["THE FIX, TWO: Ed25519 and Ed448 need no random number", "ok"],
    ["  Ed25519: 64 bytes, matches RFC 8032: true", "muted"],
    ["  Ed448: 114 bytes, matches RFC 8032: true", "muted"],
    ["  signed again, the same bytes: true and true", "muted"],
    ["  both verify: true; one flipped bit: refused", "muted"],
]

[[act]]
title = "A compact signed token: JWS"
summary = "The RFC 8037 example is rebuilt by hand: header and payload in base64url, an Ed25519 signature over both, joined by dots; alg none and a swapped payload are refused because the verifier fixes the algorithm."
detail = """
Before signing: the header {"alg":"EdDSA"} and the payload "Example of Ed25519 signing". After signing, each part is base64url: eyJhbGciOiJFZERTQSJ9, RXhhbXBsZSBvZiBFZDI1NTE5IHNpZ25pbmc, and an Ed25519 signature over "header.payload". The three parts joined by dots are exactly the token in RFC 8037, and it verifies.
The detached form has an empty middle part and verifies when the payload is supplied. A header that says alg none with no signature is refused, and so is the same signature on another payload. The verifier decides the algorithm, not the token.
"""
figure = "jws_token"
figure_title = "How a JWS token is built"
figure_speech = """
Fourth demo: a compact signed token, J W S. [[slnc 400]] Before signing, two short texts: a header, which says the algorithm is E D D S A, and the payload. [[slnc 500]]
Each is written in web-safe base sixty four. [[slnc 300]] The header becomes e y J h b G c i, and so on. [[slnc 300]] The signature is Ed twenty five five one nine, over the header and payload together. [[slnc 500]]
After signing, the three parts are joined by dots. [[slnc 400]] An attacker can write a header that says the algorithm is none. [[slnc 300]] A good verifier ignores it, because it always expects E D D S A.
"""
speech = """
The real output. [[slnc 400]] The header and payload before signing. [[slnc 300]] The three web-safe parts after. [[slnc 300]] Exactly the token in the standard, and it verifies. [[slnc 500]]
[[page]]
The checks. [[slnc 300]] The detached form verifies when the payload is supplied. [[slnc 300]] Alg none is refused. [[slnc 300]] The same signature on another payload is refused. [[slnc 400]] The verifier decides the algorithm, not the token.
"""
rows = { jws = "active ok" }
console = [
    ["BEFORE SIGNING (the RFC 8037 example):", "ok"],
    ["  header       {\"alg\":\"EdDSA\"}", "muted"],
    ["  payload      Example of Ed25519 signing", "muted"],
    ["AFTER SIGNING (each part base64url, joined by dots):", "ok"],
    ["  header       eyJhbGciOiJFZERTQSJ9", "muted"],
    ["  payload      RXhhbXBsZSBvZiBFZDI1NTE5IHNpZ25pbmc", "muted"],
    ["  signature    hgyY0il_MGCjP0JzlnLWG1PPOt7-09PGcvMg3AIbQR6", "muted"],
    ["               dWbhijcNR4ki4iylGjg5BhVsPt9g7sVvpAr_MuM0KAg", "muted"],
    ["  the token in RFC 8037: true; it verifies: true", "muted"],
    ["---", ""],
    ["THE CHECKS (the verifier expects EdDSA, always):", "ok"],
    ["  detached (empty middle), payload given: verifies", "muted"],
    ["  header says alg none, no signature: refused", "muted"],
    ["  the same signature, another payload: refused", "muted"],
    ["the verifier decides the algorithm, not the token", "amber"],
]

[[act]]
title = "Text armor, and the bill"
summary = "PEM turns the binary signed message into Base64 text between BEGIN CMS and END CMS lines that reads back to the same bytes; a valid signature still does not say who owns the key, when it was signed, or where the key lives."
detail = """
Before armor, the signed CMS message is binary bytes. After armor, PEM writes it as Base64 text between -----BEGIN CMS----- and -----END CMS-----, no line over 64 characters, and it reads back to the same bytes.
The bill: a valid signature does not say who owns the key (that needs a chain of certificates), when it was signed (that needs a timestamp authority, RFC 3161), or where the private key lives (keystore-basics). OpenSSL checks the same files in the integration tests.
"""
figure = "pem_bill"
figure_title = "PEM armor, and what a signature does not say"
figure_speech = """
Fifth demo: text armor, and the bill. [[slnc 400]] Before armor, the signed message is binary bytes. [[slnc 300]] After armor, it is P E M: base sixty four text between a begin line and an end line. [[slnc 500]]
Now the bill. [[slnc 300]] Who owns the key? That needs a chain of certificates. [[slnc 300]] When was it signed? That needs a timestamp authority. [[slnc 300]] Where does the key live? That is the next project. [[slnc 400]]
A valid signature proves that a key signed these bytes. [[slnc 300]] Nothing more.
"""
speech = """
The real output. [[slnc 400]] The begin and end lines, short lines in between, and the same bytes read back. [[slnc 500]] Then the bill, as you just saw. [[slnc 400]] And OpenSSL, a different program, checks these same files in the integration tests.
"""
rows = { pem = "active amber" }
console = [
    ["BEFORE ARMOR: the signed CMS message, as binary bytes", "ok"],
    ["AFTER ARMOR (PEM: Base64 text between two lines):", "ok"],
    ["  first line   -----BEGIN CMS-----", "muted"],
    ["  last line    -----END CMS-----", "muted"],
    ["  no line over 64 characters: true", "muted"],
    ["  reads back to the same bytes: true", "muted"],
    ["THE BILL (what a valid signature does not tell you):", "ok"],
    ["  who owns the key: that needs a chain of certificates", "muted"],
    ["  when it was signed: that needs a timestamp authority", "muted"],
    ["  where the private key lives: see keystore-basics", "muted"],
    ["openssl checks these files in the integration tests", "amber"],
]

