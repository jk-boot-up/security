kind = "poster"
title = "Digital Signatures with Bouncy Castle and OpenSSL"
narration = """Hello, and welcome. [[slnc 400]] This video explains digital signatures with Bouncy Castle and OpenSSL, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A digital signature proves that a message was signed by a key, and was not changed afterwards. [[slnc 300]] A standard format means other programs can check it. [[slnc 600]] Think of a notary's stamp. [[slnc 300]] Every office knows the shape of the stamp. [[slnc 300]] It proves the stamp was used on this paper. [[slnc 300]] It does not prove who the notary really is. [[slnc 700]] In this video, the domain is an online bank. [[slnc 500]] By the end, you will hear how a statement is signed in the standard format. [[slnc 300]] The one mistake that destroys E C D S A. [[slnc 300]] Why a token verifier must choose the algorithm. [[slnc 300]] And what a valid signature still does not tell you."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online bank signs customer statements.", "", "Auditors and customers must be able to check them,", "with software the bank did not write,", "years later."]
narration = """Here is the scenario. [[slnc 400]] An online bank signs the statements it sends. [[slnc 500]] Auditors and customers must be able to check them. [[slnc 300]] With software the bank did not write. [[slnc 300]] Years later. [[slnc 600]] So the format has to be a standard."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["CMS: the standard signed message", "Detached: the content travels separately", "Nonce: a secret number used once per signature", "JWS: a compact signed token", "PEM: Base64 text armor"]
narration = """Before the demos, the words. [[slnc 500]] C M S is the standard signed message format. [[slnc 500]] Detached means the content travels separately from the signature. [[slnc 500]] A nonce is a secret number used once for each signature. [[slnc 500]] J W S is a compact signed token. [[slnc 500]] And P E M is Base64 text armor, between begin and end lines."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "09-ladder"
kind = "bullets"
title = "What a Signature Does and Does Not Prove"
body = ["Proves: this key signed these bytes", "Proves: the bytes were not changed", "Does not prove: who owns the key", "Does not prove: when it was signed", "Those need certificates and a timestamp authority."]
narration = """Let's put it side by side. [[slnc 400]] A valid signature proves that this key signed these bytes. [[slnc 500]] It proves the bytes were not changed. [[slnc 500]] It does not prove who owns the key. [[slnc 500]] It does not prove when it was signed. [[slnc 600]] Those need certificates, and a timestamp authority."""

[[scene]]
key = "10-roles"
kind = "bullets"
title = "Who Does What"
body = ["Cms: signed messages", "Ecdsa: random and deterministic nonces", "EdDsa: Ed25519 and Ed448", "Jws: compact tokens", "OpenSsl: the independent check"]
narration = """Here is who does what in the code. [[slnc 400]] The C M S class signs and verifies standard signed messages. [[slnc 500]] The E C D S A class signs with random and with deterministic nonces, and shows what a reused nonce reveals. [[slnc 500]] The Ed D S A class does Ed twenty five five one nine and Ed four four eight. [[slnc 500]] The J W S class writes compact tokens by hand. [[slnc 300]] And the OpenSSL class runs a real OpenSSL as an independent check in the integration tests."""

[[scene]]
key = "11-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Signed PDFs and S/MIME email", "jarsigner and APK signing", "JWT login tokens, and alg none", "openssl dgst -sign"]
narration = """You have probably met this already. [[slnc 400]] Signed P D F files and S slash MIME email are C M S messages. [[slnc 500]] The jarsigner tool, and Android app signing, sign in the same family of formats. [[slnc 500]] Login tokens called J W T are J W S tokens, and alg none appears in vulnerability reports. [[slnc 500]] And OpenSSL signs files from the command line."""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Use a standard format", "Prefer Ed25519 or deterministic ECDSA", "Fix the algorithm in the verifier", "Use certificates to say who owns the key", "Protect the private key"]
narration = """So, how do you use it? [[slnc 400]] Use a standard format. [[slnc 500]] Prefer Ed twenty five five one nine, or deterministic E C D S A. [[slnc 500]] Fix the algorithm in the verifier. [[slnc 500]] Use certificates to say who owns the key. [[slnc 500]] And protect the private key."""

[[scene]]
key = "13-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a second signer", "and verify each one."]
narration = """That's digital signatures with Bouncy Castle and OpenSSL. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] A valid signature proves that a key signed the bytes, not who owns the key. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] The demo runs with nothing installed except a Java development kit. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a second signer to the message, and verify each one. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
How an online bank signs statements and tokens in standard formats: the signing service, the choice of algorithm and nonce, the signed message in transit, and the verifier. It does not cover where the private key is stored, certificate chains and revocation, or timestamp authorities.
"""
assets = [
    "The private signing key.",
    "The integrity and origin of each signed statement or token.",
    "The verifier's decision to accept a message.",
]
actors = [
    "The bank's signing service.",
    "Auditors and customers who verify.",
    "An attacker who can see, change, replay or forge messages, and send crafted tokens.",
]
boundaries = [
    "Signer to the network: a signed message leaves the bank's control.",
    "Token to verifier: everything in a token is attacker-controlled input.",
    "Key to the signing service: the key must never leave it.",
]
assumptions = [
    "The verifier already trusts the right public key or certificate.",
    "The signing key is stored safely (the next project).",
    "In the demo, keys are random and never printed, and the vector keys are published test values.",
]
out_of_scope = [
    "Certificate chains, revocation and name checks: the transport-security module.",
    "Trusted timestamps: described, not run.",
    "Hardware security modules and key management services.",
]
tests = [
    "`VectorsTest` checks Ed25519 and Ed448 against RFC 8032, ECDSA against RFC 6979, the JWS against RFC 8037, and the reused-nonce recovery.",
    "`CmsAndJwsTest` checks attached and detached verification, changed content, another certificate, garbage, the signing time, PEM, and the JWS refusals.",
    "`OpenSslInteropTest` (integration) checks that OpenSSL 3 verifies CMS, Ed25519 and ECDSA signatures from Java, and that Java verifies an ECDSA signature from OpenSSL.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next project, keystore-basics, says where the private key should live and how keys are replaced.
"""

[[threat]]
id = "T1"
stride = "T"
threat = "A signed statement is changed in transit or storage"
where = "`Cms.verify`"
control = "The signature covers the content digest and the signed attributes, so any change is refused"
residual = "A valid old message can be replayed, so statements need dates or numbers the verifier checks"

[[threat]]
id = "T2"
stride = "I"
threat = "The private key is recovered from signatures made with a reused or guessable ECDSA nonce"
where = "`Ecdsa`"
control = "Deterministic nonces (RFC 6979) or Ed25519, which need no random source"
residual = "The key must still be stored safely, and a faulty implementation can still leak"

[[threat]]
id = "T3"
stride = "S"
threat = "A token that claims the algorithm none, or another algorithm, is accepted"
where = "`Jws.verify`"
control = "The verifier fixes the expected header and algorithm and ignores the token's claim"
residual = "Every new format or algorithm option needs the same discipline"

[[threat]]
id = "T4"
stride = "S"
threat = "A valid signature from a key the verifier should not trust is accepted as the bank's"
where = "`Cms.verify`, `Certificates`"
control = "Verify against the one expected certificate, as the demo does"
residual = "The demo certificate is self-signed; real use needs a chain of trust and revocation checks"

[[threat]]
id = "T5"
stride = "E"
threat = "The signing key is stolen from where it is kept"
where = "the signing service"
control = "None here: the key lives in memory in the demo"
residual = "A keystore, a key management service or a hardware module, and a plan to replace the key"

[[threat]]
id = "T6"
stride = "R"
threat = "The signer disputes when a statement was signed, or a signer backdates it"
where = "`Cms.claimedSigningTime`"
control = "The time is covered by the signature but is the signer's claim"
residual = "A trusted timestamp (RFC 3161) is needed when the time matters"
