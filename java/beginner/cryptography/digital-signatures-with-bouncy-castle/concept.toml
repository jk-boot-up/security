    "say what a CMS SignedData message contains",
    "explain the difference between attached and detached signatures",
    "explain why an ECDSA nonce must never repeat, and two ways to avoid the risk",
    "explain why a JWS verifier must choose the algorithm",
    "say what a valid signature does not prove",
]
walkthrough = """
Start with the notary's stamp. Run the demo one act at a time. After act one, ask what the certificate in the message proves and what it cannot. After act two, ask why the public key is enough to check. After act three, ask why Ed25519 has no nonce risk. After act four, ask what the attacker gains from alg none. Finish with the bill: how would the bank prove who owns the key?
"""
exercises = [
    "Add a second signer to the CMS message and verify each separately.",
    "Sign with a P-384 key and SHA-384 and verify the result with `openssl cms -verify`.",
    "Recover the private key from two signatures that share a nonce, using a different curve.",
    "Add an `exp` claim to the JWS payload and make the verifier refuse an expired token on a simulated clock.",
]

[docs.explained]
sentence = """
A digital signature in a standard format, such as CMS or JWS, can be checked by other programs, and it is only as safe as its nonce, the verifier's choice of algorithm and the certificate that says who owns the key.
"""
verdict = """
Use a standard format, deterministic signatures (Ed25519 or deterministic ECDSA), a verifier that fixes the expected algorithm, and a certificate chain that says who owns the key. Add a trusted timestamp when the time matters, and protect the private key.
"""
recognise = [
    "`openssl cms -sign` and `jarsigner` in build scripts.",
    "Signed PDFs and S/MIME mail.",
    "JWT libraries that ask you to pass the allowed algorithms.",
    "Reports of ECDSA keys recovered from bad random number generators.",
]

[spec]
purpose = """
Teach standard signature formats by signing an online bank's statements with Bouncy Castle, reproducing published test vectors, and having OpenSSL check the results.
"""
nongoals = [
    "Certificate chains and revocation: the transport-security module.",
    "Timestamp authorities: described, not run.",
    "Hardware security modules.",
]
problem = """
Learners can sign with the JDK but not in a format that anyone else can check, and may not know the one implementation detail that can destroy ECDSA.
"""
roles = [["CMS SignedData", "`Cms`"], ["ECDSA with both nonce styles", "`Ecdsa`"], ["An ECDSA signature step by step", "`SignatureSteps`"], ["Ed25519 and Ed448", "`EdDsa`"], ["JWS tokens", "`Jws`"], ["PEM armor", "`PemSignatures`"], ["Certificates", "`Certificates`"], ["The OpenSSL check", "`OpenSsl`"], ["Entry point", "`SignaturesBcDemo`"]]
requirements = [
    "A CMS message verifies attached and detached, and a change, another certificate or garbage is refused.",
    "Ed25519, Ed448, ECDSA (RFC 6979) and JWS match their published values.",
    "A reused ECDSA nonce reveals the key in the demonstration.",
    "A JWS verifier refuses alg none, a changed payload and a different key.",
    "OpenSSL verifies the CMS, Ed25519 and ECDSA signatures, and Java verifies an ECDSA signature OpenSSL made.",
    "The demo prints the same output on every run.",
]

[[diagram]]
name = "architecture-diagram"
kind = "flow"
title = "Signing and checking in standard formats"
caption = "Java signs with Bouncy Castle; Java and OpenSSL both check."
nodes = [
    { id = "bank", label = "The bank", sub = "signs a statement", col = 0, row = 0, colour = "client" },
    { id = "bc", label = "Bouncy Castle", sub = "CMS, ECDSA, EdDSA, JWS", col = 1, row = 0, colour = "green" },
    { id = "msg", label = "Signed message", sub = "attached or detached", col = 2, row = 0, colour = "amber", shape = "store" },
    { id = "java", label = "Java verifier", sub = "uses the certificate", col = 3, row = 0, colour = "green" },
    { id = "ossl", label = "OpenSSL", sub = "an independent check", col = 3, row = 1, colour = "accent" },
]
edges = [
    { from = "bank", to = "bc" },
    { from = "bc", to = "msg", label = "writes" },
    { from = "msg", to = "java" },
    { from = "msg", to = "ossl" },
]

[[diagram]]
name = "class-diagram"
kind = "class"
title = "The classes and what they hold"
caption = "One class for each format or algorithm."
nodes = [
    { id = "cms", label = "Cms", sub = ["sign(cert, key, content, attached, time)", "verify(signed, content, cert)", "claimedSigningTime(signed)"], col = 0, row = 0, colour = "green" },
    { id = "ecdsa", label = "Ecdsa", sub = ["signDeterministic(d, message)", "signRandomized(d, message)", "recoverKeyFromReusedNonce(...)"], col = 1, row = 0, colour = "amber" },
    { id = "eddsa", label = "EdDsa", sub = ["sign25519, verify25519", "sign448, verify448"], col = 2, row = 0, colour = "accent" },
    { id = "jws", label = "Jws", sub = ["sign(seed, payload)", "signDetached(seed, payload)", "verify(key, token, payload)"], col = 0, row = 1, colour = "green" },
    { id = "pem", label = "PemSignatures", sub = ["write(type, der)", "read(type, pem)"], col = 1, row = 1, colour = "client" },
]
edges = [
    { from = "jws", to = "eddsa", label = "signs with" },
    { from = "cms", to = "pem", label = "armored by" },
]

[[diagram]]
name = "data-flow-diagram"
kind = "flow"
title = "What is inside a CMS SignedData message"
caption = "The signature covers the attributes, and the attributes cover the content through its digest."
nodes = [
    { id = "content", label = "Content", sub = "attached, or left out", col = 0, row = 0, colour = "client" },
    { id = "digest", label = "Digest", sub = "SHA-256 of the content", col = 1, row = 0, colour = "accent" },
    { id = "attrs", label = "Signed attributes", sub = "content type, digest, signing time", col = 2, row = 0, colour = "amber" },
    { id = "sig", label = "Signature", sub = "ECDSA over the attributes", col = 3, row = 0, colour = "green" },
    { id = "cert", label = "Certificate", sub = "the signer's public key", col = 3, row = 1, colour = "accent" },
]
edges = [
    { from = "content", to = "digest" },
    { from = "digest", to = "attrs" },
    { from = "attrs", to = "sig" },
    { from = "cert", to = "sig", label = "checks", dashed = true },
]

[[diagram]]
name = "sequence-diagram"
kind = "sequence"
title = "Signing and verifying a detached CMS message: who does what, in order"
participants = ["The bank", "Cms", "Auditor"]
steps = [
    ["The bank", "Cms", "sign(cert, key, statement, detached)"],
    ["Cms", "The bank", "signed message", "reply"],
    ["The bank", "Auditor", "statement and signed message"],
    ["Auditor", "Cms", "verify(signed, statement, cert)"],
    ["note", "Cms", "digest the statement, compare, check the signature"],
    ["Cms", "Auditor", "true or false", "reply"],
]

[[diagram]]
name = "uml-diagram"
kind = "sequence"
title = "A reused ECDSA nonce"
caption = "Two signatures with the same k give two equations with two unknowns."
participants = ["Signer", "Attacker"]
steps = [
    ["Signer", "Attacker", "signature 1 on message 1 (r, s1)"],
    ["Signer", "Attacker", "signature 2 on message 2 (r, s2), same r"],
    ["note", "Attacker", "the same r shows that k was reused"],
    ["note", "Attacker", "k = (h1 - h2) / (s1 - s2), then d = (s1 k - h1) / r"],
    ["note", "Attacker", "the private key d is known"],
]

[[diagram]]
name = "uml-diagram-2"
kind = "sequence"
title = "Verifying a JWS token"
caption = "The verifier fixes the algorithm and ignores what the token claims."
participants = ["Client", "Verifier"]
steps = [
    ["Client", "Verifier", "token: header.payload.signature"],
    ["note", "Verifier", "the header must be exactly the expected EdDSA header"],
    ["Verifier", "Verifier", "check the signature over header.payload"],
    ["Verifier", "Client", "accepted, or refused", "reply"],
]

[[diagram]]
name = "threat-model-diagram"
kind = "flow"
title = "Threat model: trust boundaries and threats"
caption = "Dashed boxes are trust boundaries. Rose tags show where each threat in the table applies."
zones = [
    { label = "The bank", nodes = ["signer", "key"], colour = "green" },
    { label = "In transit and storage", nodes = ["msg"], colour = "amber" },
    { label = "Outside", nodes = ["attacker", "verifier"], colour = "red" },
]
nodes = [
    { id = "signer", label = "Signing service", sub = "nonce source, algorithm choice", col = 0, row = 0, colour = "green", shape = "ellipse", threats = ["T2"] },
    { id = "key", label = "Private key", sub = "needs a home", col = 0, row = 1, colour = "amber", shape = "store", threats = ["T2", "T5"] },
    { id = "msg", label = "Signed statement", sub = "CMS or JWS", col = 1, row = 0, colour = "amber", shape = "store", threats = ["T1", "T3"] },
    { id = "verifier", label = "Verifier", sub = "chooses algorithm, trusts certificates", col = 2, row = 0, colour = "client", threats = ["T3", "T4"] },
    { id = "attacker", label = "Attacker", sub = "changes, replays, forges", col = 2, row = 1, colour = "red", threats = ["T1", "T3", "T4"] },
]
edges = [
    { from = "signer", to = "msg", label = "signs" },
    { from = "msg", to = "verifier" },
    { from = "attacker", to = "msg", label = "changes or replays", colour = "red", dashed = true, threats = ["T1", "T4"] },
    { from = "attacker", to = "verifier", label = "sends alg none", colour = "red", dashed = true, threats = ["T3"] },
    { from = "attacker", to = "key", label = "recovers from reused nonce", colour = "red", dashed = true, threats = ["T2"] },
]

[poster]
headline = [["SIGNATURES WITH", "text"], ["BOUNCY CASTLE", "accent"]]
taglines = [["Signed messages that other programs can check", "gold"]]
before = { code = "sign with a private envelope", note = "only we can check it", tag = "BEFORE" }
after = { code = "CMS + RFC 6979 + openssl verify", note = "standard, and checked twice", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "Digital Signatures with Bouncy Castle and OpenSSL"
narration = """Hello, and welcome. [[slnc 400]] This video explains digital signatures with Bouncy Castle and OpenSSL, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] A digital signature proves that a message was signed with one private key, and not changed afterwards. [[slnc 300]] Anyone with the matching public key can check it. [[slnc 500]] Like a notary's stamp: it proves the stamp was used on this paper, not who the notary really is. [[slnc 600]] The domain is an online bank. [[slnc 400]] You will see how an E C D S A signature, short for Elliptic Curve Digital Signature Algorithm, is made, number by number. [[slnc 300]] The one mistake that gives the key away. [[slnc 300]] And what a valid signature still does not tell you."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online bank signs customer statements.", "", "Auditors and customers must be able to check them,", "with software the bank did not write,", "years later."]
narration = """Here is the scenario. [[slnc 400]] An online bank signs the statements it sends. [[slnc 400]] Auditors and customers must check them, with software the bank did not write, years later. [[slnc 500]] So the format has to be a standard."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["Private key: signs; public key: checks", "Hash: a short fingerprint of a message", "Nonce: a secret number used once per signature", "Detached: the content travels separately", "Base64: bytes written as plain text"]
narration = """Before the demos, the words. [[slnc 400]] The private key signs, and the public key checks. [[slnc 400]] A hash is a short fingerprint of a message. [[slnc 400]] A nonce is a secret number used once for each signature. [[slnc 400]] Detached means the content travels separately from the signature. [[slnc 400]] And base sixty four writes bytes as plain text."""

[[scene]]
key = "03-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "04-idea"
kind = "figure"
title = "Signing one statement, and checking it"
body = "sign_verify"
narration = """Let's start with the core idea, on one real statement. [[slnc 400]] In green, before signing: the statement, and the bank's private key, which stays secret. [[slnc 400]] E C D S A combines them. [[slnc 300]] In red, after signing: the same statement, plus two numbers, r and s. [[slnc 300]] That pair is the signature. [[slnc 500]] Below, anyone with the bank's public key checks it. [[slnc 300]] It verifies. [[slnc 300]] Change the balance to ninety two hundred, and it is refused. [[slnc 400]] Only the private key can sign. [[slnc 300]] Anyone can check."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "11-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Signed documents and signed email", "jarsigner, and the first Android app signing", "Web login tokens, and alg none", "openssl dgst -sign"]
narration = """You have probably met this already. [[slnc 400]] Signed documents and signed email use C M S. [[slnc 400]] So do signed Java archives, and the first Android app signatures. [[slnc 400]] Web login tokens are J W S tokens. [[slnc 400]] And OpenSSL signs files from the command line."""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Use a standard format", "Prefer Ed25519 or deterministic ECDSA", "Fix the algorithm in the verifier", "Use certificates to say who owns the key", "Protect the private key"]
narration = """So, how do you use it? [[slnc 400]] Use a standard format. [[slnc 400]] Prefer Ed twenty five five one nine, or deterministic E C D S A. [[slnc 400]] Fix the algorithm in the verifier. [[slnc 400]] Use certificates to say who owns the key. [[slnc 400]] And protect the private key."""

[[scene]]
key = "13-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "14-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a second signer", "and verify each one."]
narration = """That's digital signatures with Bouncy Castle and OpenSSL. [[slnc 400]] Remember one sentence. [[slnc 300]] A valid signature proves that a key signed the bytes, not who owns the key. [[slnc 500]] The source code, notes, diagrams, and an animated walkthrough are in the repository. [[slnc 300]] Try one exercise: add a second signer, and verify each one. [[slnc 500]] If you found this useful, a like really helps. [[slnc 300]] Kindly subscribe to the channel. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
How an online bank signs statements and tokens in standard formats: the signing service, the choice of algorithm and nonce, the signed message in transit, and the verifier. It does not cover where the private key is stored, certificate chains and revocation, or timestamp authorities.
"""
assets = [
    "The private signing key.",
    "The integrity and origin of each signed statement or token.",
    "The verifier's decision to accept a message.",
]
actors = [
    "The bank's signing service.",
    "Auditors and customers who verify.",
    "An attacker who can see, change, replay or forge messages, and send crafted tokens.",
]
boundaries = [
    "Signer to the network: a signed message leaves the bank's control.",
    "Token to verifier: everything in a token is attacker-controlled input.",
    "Key to the signing service: the key must never leave it.",
]
assumptions = [
    "The verifier already trusts the right public key or certificate.",
    "The signing key is stored safely (the next project).",
    "In the demo, keys are random and never printed, and the vector keys are published test values.",
]
out_of_scope = [
    "Certificate chains, revocation and name checks: the transport-security module.",
    "Trusted timestamps: described, not run.",
    "Hardware security modules and key management services.",
]
tests = [
    "`SignatureStepsTest` checks that the by-hand ECDSA steps give Bouncy Castle's signature and RFC 6979's r, s and k, and that the CMS digest attribute is the statement's SHA-256.",
    "`VectorsTest` checks Ed25519 and Ed448 against RFC 8032, ECDSA against RFC 6979, the JWS against RFC 8037, and the reused-nonce recovery.",
    "`CmsAndJwsTest` checks attached and detached verification, changed content, another certificate, garbage, the signing time, PEM, and the JWS refusals.",
    "`OpenSslInteropTest` (integration) checks that OpenSSL 3 verifies CMS, Ed25519 and ECDSA signatures from Java, and that Java verifies an ECDSA signature from OpenSSL.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next project, keystore-basics, says where the private key should live and how keys are replaced.
"""

[[threat]]
id = "T1"
stride = "T"
threat = "A signed statement is changed in transit or storage"
where = "`Cms.verify`"
control = "The signature covers the content digest and the signed attributes, so any change is refused"
residual = "A valid old message can be replayed, so statements need dates or numbers the verifier checks"

[[threat]]
id = "T2"
stride = "I"
threat = "The private key is recovered from signatures made with a reused or guessable ECDSA nonce"
where = "`Ecdsa`"
control = "Deterministic nonces (RFC 6979) or Ed25519, which need no random source"
residual = "The key must still be stored safely, and a faulty implementation can still leak"

[[threat]]
id = "T3"
stride = "S"
threat = "A token that claims the algorithm none, or another algorithm, is accepted"
where = "`Jws.verify`"
control = "The verifier fixes the expected header and algorithm and ignores the token's claim"
residual = "Every new format or algorithm option needs the same discipline"

[[threat]]
id = "T4"
stride = "S"
threat = "A valid signature from a key the verifier should not trust is accepted as the bank's"
where = "`Cms.verify`, `Certificates`"
control = "Verify against the one expected certificate, as the demo does"
residual = "The demo certificate is self-signed; real use needs a chain of trust and revocation checks"

[[threat]]
id = "T5"
stride = "E"
threat = "The signing key is stolen from where it is kept"
where = "the signing service"
control = "None here: the key lives in memory in the demo"
residual = "A keystore, a key management service or a hardware module, and a plan to replace the key"

[[threat]]
id = "T6"
stride = "R"
threat = "The signer disputes when a statement was signed, or a signer backdates it"
where = "`Cms.claimedSigningTime`"
control = "The time is covered by the signature but is the signer's claim"
residual = "A trusted timestamp (RFC 3161) is needed when the time matters"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] One small class for each format or step. [[slnc 300]] The demo class runs the five acts, and small helpers do E D D S A, P E M and the test certificate. [[slnc 300]] Here are the four that matter."""

[[class]]
name = "Cms"
what = "signs and checks CMS messages"
[[class.part]]
title = "sign: attributes, certificate, content"
code = """
attributes.add(new Attribute(CMSAttributes.signingTime,
        new DERSet(new Time(Date.from(signingTime)))));
...
        .build("SHA256withECDSA", key, certificate);
...
generator.addCertificates(
        new JcaCertStore(List.of(certificate)));
return generator.generate(
        new CMSProcessableByteArray(content), attached).getEncoded();
"""
speech = """The C M S class adds the signing time as a signed attribute, and signs with S H A two fifty six and E C D S A. [[slnc 300]] It puts the certificate in the message. [[slnc 300]] The attached flag decides whether the statement travels inside."""
[[class.part]]
title = "verify: every signer, one certificate"
code = """
CMSSignedData data = detachedContent == null
        ? new CMSSignedData(signedData)
        : new CMSSignedData(
              new CMSProcessableByteArray(detachedContent), signedData);
...
if (!signer.verify(new JcaSimpleSignerInfoVerifierBuilder()
        .setProvider(Providers.BC).build(certificate))) {
"""
speech = """To verify, it reads the message, with the statement supplied when it was detached. [[slnc 300]] Each signer is checked against the one certificate the bank expects, never one taken from the message."""

[[class]]
name = "SignatureSteps"
what = "makes an ECDSA signature by hand"
[[class.part]]
title = "the four steps"
code = """
BigInteger h = new BigInteger(1, Ecdsa.sha256(message));            // step 1
...
BigInteger k = nonces.nextK();                                      // step 2
...
BigInteger r = x(Ecdsa.P256.getG().multiply(k)).mod(n);             // step 3
...
BigInteger s = k.modInverse(n)
        .multiply(h.add(r.multiply(key))).mod(n);   // step 4
"""
speech = """Signature steps does act two by hand: the hash h, the one-time number k, then r and s. [[slnc 300]] A test proves the result is exactly Bouncy Castle's signature, and the published R F C values."""

[[class]]
name = "Ecdsa"
what = "both kinds of nonce, and the attack"
[[class.part]]
title = "deterministic, random, and the reuse"
code = """
return sign(new ECDSASigner(                      // deterministic k
        new HMacDSAKCalculator(new SHA256Digest())), d, message);
...
return sign(new ECDSASigner(), d, message);        // random k
...
return h1.subtract(h2)                             // the attack
        .multiply(s1.s().subtract(s2.s()).modInverse(n)).mod(n);
"""
speech = """The E C D S A class signs with a deterministic k, made with H mac, or with a random one. [[slnc 300]] The last line is the attack from act three: k from two signatures that shared it."""

[[class]]
name = "Jws"
what = "builds and checks a JWS token"
[[class.part]]
title = "sign, and a verifier that fixes the algorithm"
code = """
String signingInput = b64(Hex.bytes(HEADER)) + "." + b64(payload);
byte[] signature = EdDsa.sign25519(seed,
        signingInput.getBytes(StandardCharsets.US_ASCII));
return signingInput + "." + b64(signature);
...
if (parts.length != 3 || !Hex.text(unb64(parts[0])).equals(HEADER)) {
    return false;
"""
speech = """J W S joins the header and payload with a dot, signs that with Ed twenty five five one nine, and adds the signature. [[slnc 300]] The verifier refuses any header but its own, so alg none never gets in."""

[[acronym]]
short = "ECDSA"
long = "Elliptic Curve Digital Signature Algorithm"
say = "E C D S A is the Elliptic Curve Digital Signature Algorithm."
[[acronym]]
short = "EdDSA"
long = "Edwards-curve Digital Signature Algorithm (Ed25519, Ed448)"
say = "E D D S A is the Edwards curve Digital Signature Algorithm, with two curves: Ed twenty five five one nine and Ed four four eight."
[[acronym]]
short = "CMS"
long = "Cryptographic Message Syntax"
say = "C M S is Cryptographic Message Syntax: the standard envelope for a signed message."
[[acronym]]
short = "SHA-256"
long = "Secure Hash Algorithm, 256-bit"
say = "S H A two fifty six is the Secure Hash Algorithm, with a two hundred fifty six bit fingerprint."
[[acronym]]
short = "JWS"
long = "JSON Web Signature"
say = "J W S is JSON Web Signature, a compact signed token."
[[acronym]]
short = "JSON"
long = "JavaScript Object Notation"
say = "JSON is JavaScript Object Notation: plain text for data."
[[acronym]]
short = "PEM"
long = "Privacy-Enhanced Mail (text armor)"
say = "P E M is Privacy Enhanced Mail: today, base sixty four text between begin and end lines."
[[acronym]]
short = "RFC"
long = "Request for Comments: an internet standard"
say = "R F C is Request for Comments: a numbered internet standard, often with test values."
[[acronym]]
short = "HMAC"
long = "Hash-based Message Authentication Code"
say = "H mac is a Hash based Message Authentication Code. It makes k in deterministic signing."
