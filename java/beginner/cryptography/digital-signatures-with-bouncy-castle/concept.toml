[[act]]
title = "How an ECDSA signature is made, step by step"
summary = "The statement is signed by hand in four steps, h, k, r and s, with real numbers; the public key gives back r, so it verifies; the result equals Bouncy Castle's and RFC 6979's."
detail = """
The inputs are the statement and a private key (the RFC 6979 test key c9afa9d8 ... 120f6721). Step 1 hashes the statement: h = SHA-256(message). Step 2 derives the one-time number k from the key and h (RFC 6979). Step 3 takes r, the x coordinate of the curve point k times G.
Step 4 computes s = (h + r times key) / k, modulo n. The signature is r and s, 64 bytes. The check uses only the public key Q: the x of (h/s) G + (r/s) Q equals r. A changed balance gives another x, so it is refused. The steps give Bouncy Castle's exact signature, and RFC 6979's published r and s for "sample".
"""
figure = "ecdsa_steps"
figure_title = "How the signature r, s is made"
figure_speech = """
Second demo: how an E C D S A signature is made. [[slnc 400]] Step one: hash the statement, to get h. [[slnc 300]] Step two: a one-time secret number, k, made from the key and h. [[slnc 300]] Step three: multiply the curve's start point G by k, and keep its x coordinate. That is r. [[slnc 300]] Step four: s is h plus r times the key, divided by k. [[slnc 500]]
The signature is just r and s. [[slnc 400]]
To check it, anyone combines h, r, s and the public key into a point. [[slnc 300]] If its x equals r, the signature is good. [[slnc 300]] The private key is never needed.
"""
speech = """
The real numbers. [[slnc 400]] The statement, and the private key, c nine a f a nine d eight. [[slnc 400]] Then h, the hash, and k, the one-time number. [[slnc 500]]
[[page]]
Then r, and s: the signature. [[slnc 500]] The check, with the public key, gives x, b c eight eight e c eight d. [[slnc 300]] Exactly r. [[slnc 300]] So it verifies, and the changed balance is refused. [[slnc 500]] And our hand-made steps give the same r and s as Bouncy Castle, and as the published test vector.
"""
rows = { ecdsa = "active ok" }
console = [
    ["BEFORE SIGNING (the inputs):", "ok"],
    ["  message      Statement ANA-1: balance 1200", "muted"],
    ["  private key  c9afa9d8 45ba7516 6b5c2157 67b1d693", "muted"],
    ["               4e50c3db 36e89b12 7b8a622b 120f6721", "muted"],
    ["STEP 1. HASH THE MESSAGE: h = SHA-256(message)", "ok"],
    ["  h            6e158e90 b7240b23 b2ab7b15 df674425", "muted"],
    ["               e32dcadc 3ebad737 c051d8d5 324fb981", "muted"],
    ["STEP 2. A ONE-TIME NUMBER k, FROM KEY AND h (RFC 6979)", "ok"],
    ["  k            8a55aacb f10510b9 2b5cc886 30a85458", "muted"],
    ["               ebd42241 d0c31211 850993bd ff6f1904", "muted"],
    ["---", ""],
    ["STEP 3. r = THE x OF THE CURVE POINT k TIMES G", "ok"],
    ["  r            bc88ec8d ee35125f 43900323 513c844b", "muted"],
    ["               a223044d de5c6f4f fca225ff c4f1e365", "muted"],
    ["STEP 4. s = (h + r TIMES KEY) / k, MODULO n", "ok"],
    ["  s            ef0d3fda f8310087 798da89f 09f7830e", "muted"],
    ["               061ce37a 30bd9494 343a530f 92211745", "muted"],
    ["AFTER SIGNING: the signature is r and s, 64 bytes", "ok"],
