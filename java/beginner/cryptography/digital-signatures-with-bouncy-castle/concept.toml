]

[docs.dependencies]
intro = """
This project uses two jars from Bouncy Castle, and one optional command-line tool.
"""
what = [
    ["Bouncy Castle (bcprov)", "an open-source cryptography library for Java. It supplies the Ed448 curve, deterministic ECDSA (HMacDSAKCalculator) and the lightweight signer classes that the JDK lacks."],
    ["Bouncy Castle PKIX (bcpkix)", "the part that handles certificates, PEM and CMS. It builds on bcprov."],
    ["OpenSSL", "a widely used cryptography toolkit and command-line program. The integration tests run `openssl cms -verify`, `openssl pkeyutl -verify` and `openssl dgst -verify` as independent checks. It is optional for the demo and required for the integration tests."],
]
why = """
The plain project shows signatures with the JDK alone. Real systems exchange signed messages in standard formats, which the JDK does not write. This project shows what a library adds, and uses a different program to prove the result is a standard and not a private convention.
"""
install_note = "A JDK, and for the integration tests, OpenSSL 3 (the system openssl on macOS is LibreSSL, so use Homebrew's openssl@3). Gradle downloads the Java libraries, and the versions are pinned:"
versions = [
    ["Bouncy Castle (bcprov-jdk18on)", "1.86"],
    ["Bouncy Castle PKIX (bcpkix-jdk18on)", "1.86"],
    ["OpenSSL (optional, for the integration tests)", "3.x"],
    ["Java", "25"],
    ["JUnit", "6.1.3"],
]
costs = [
    "About 7 MB of library for a handful of format functions.",
    "A global provider registration that affects every library in the program.",
    "The integration tests need OpenSSL 3 installed.",
]

[docs.problem]
scenario = """
An online bank signs the statements it sends to customers and to auditors. The signature must be checkable by software the bank did not write, years later, and the bank must not leak its signing key by a careless implementation detail.
"""
naive = """
Sign with whatever the JDK offers and invent a private envelope, or use ECDSA with a home-made random source. It works until another program has to check it, or until a weak random number leaks the key.
"""
deliver = [
    "A statement signed in the standard CMS format, attached and detached, that verifies with its certificate and is refused when changed.",
    "ECDSA with random and with deterministic nonces, and a demonstration of what a reused nonce reveals.",
    "Ed25519, Ed448 and deterministic ECDSA checked against published vectors.",
    "A JWS token written by hand that reproduces the RFC example, with a verifier that decides the algorithm.",
    "PEM text armor for signed messages.",
    "OpenSSL verifying what Java wrote, and Java verifying what OpenSSL wrote.",
]

[docs.prerequisites]
required = [
    "Java basics",
    "The digital-signatures project, or an idea of what a signature and a verification key are",
]
not_required = [
    "Knowledge of ASN.1 or CMS",
    "OpenSSL, to run the demo",
]
install = ["OpenSSL 3 for the integration tests only"]

[docs.session]
objectives = [
    "say what a CMS SignedData message contains",
    "explain the difference between attached and detached signatures",
    "explain why an ECDSA nonce must never repeat, and two ways to avoid the risk",
    "explain why a JWS verifier must choose the algorithm",
    "say what a valid signature does not prove",
]
walkthrough = """
Start with the notary's stamp. Run the demo one act at a time. After act one, ask what the certificate in the message proves and what it cannot. After act two, ask why Ed25519 has no such risk. After act four, ask what the attacker gains from alg none. Finish with the bill: how would the bank prove who owns the key?
"""
exercises = [
    "Add a second signer to the CMS message and verify each separately.",
    "Sign with a P-384 key and SHA-384 and verify the result with `openssl cms -verify`.",
    "Recover the private key from two signatures that share a nonce, using a different curve.",
    "Add an `exp` claim to the JWS payload and make the verifier refuse an expired token on a simulated clock.",
]

[docs.explained]
sentence = """
A digital signature in a standard format, such as CMS or JWS, can be checked by other programs, and it is only as safe as its nonce, the verifier's choice of algorithm and the certificate that says who owns the key.
"""
verdict = """
Use a standard format, deterministic signatures (Ed25519 or deterministic ECDSA), a verifier that fixes the expected algorithm, and a certificate chain that says who owns the key. Add a trusted timestamp when the time matters, and protect the private key.
"""
recognise = [
    "`openssl cms -sign` and `jarsigner` in build scripts.",
    "Signed PDFs and S/MIME mail.",
    "JWT libraries that ask you to pass the allowed algorithms.",
    "Reports of ECDSA keys recovered from bad random number generators.",
]

[spec]
purpose = """
Teach standard signature formats by signing an online bank's statements with Bouncy Castle, reproducing published test vectors, and having OpenSSL check the results.
"""
nongoals = [
    "Certificate chains and revocation: the transport-security module.",
    "Timestamp authorities: described, not run.",
    "Hardware security modules.",
]
problem = """
Learners can sign with the JDK but not in a format that anyone else can check, and may not know the one implementation detail that can destroy ECDSA.
"""
roles = [["CMS SignedData", "`Cms`"], ["ECDSA with both nonce styles", "`Ecdsa`"], ["Ed25519 and Ed448", "`EdDsa`"], ["JWS tokens", "`Jws`"], ["PEM armor", "`PemSignatures`"], ["Certificates", "`Certificates`"], ["The OpenSSL check", "`OpenSsl`"], ["Entry point", "`SignaturesBcDemo`"]]
requirements = [
    "A CMS message verifies attached and detached, and a change, another certificate or garbage is refused.",
    "Ed25519, Ed448, ECDSA (RFC 6979) and JWS match their published values.",
    "A reused ECDSA nonce reveals the key in the demonstration.",
    "A JWS verifier refuses alg none, a changed payload and a different key.",
    "OpenSSL verifies the CMS, Ed25519 and ECDSA signatures, and Java verifies an ECDSA signature OpenSSL made.",
    "The demo prints the same output on every run.",
]

