[docs.explained]
sentence = """
Bouncy Castle adds to the JDK the standard formats that asymmetric encryption is used in: PEM text for keys and certificates, X.509 certificates, and the CMS envelope that holds data encrypted with AES and its key locked with RSA, so that independent programs such as OpenSSL can open what it writes.
"""
verdict = """
Use the JDK for the maths, and a library such as Bouncy Castle only for the formats the JDK does not know. Ask for OAEP by name, protect private-key files with a password, keep the library
pinned and updated, and always test interoperability with an independent program, because a private format is a liability.
"""
recognise = [
    "`JcaPEMWriter`, `PEMParser` and `JcaX509v3CertificateBuilder` in Java code.",
    "`Security.addProvider(new BouncyCastleProvider())` near the start of a program.",
    "`openssl cms` and `openssl x509 -text` in operations documentation.",
    "Files whose first line is `-----BEGIN ... -----`.",
]

[spec]
purpose = """
Teach what a library adds to the JDK's asymmetric encryption, the standard formats, by writing keys as PEM, making a certificate and sealing a CMS envelope with Bouncy Castle, and proving the result is a standard by having OpenSSL open it.
"""
nongoals = [
    "Certificate authorities, chains and revocation: the next modules.",
    "PGP: a different format, from the same library.",
    "Choosing key sizes and curves.",
]
problem = """
Learners can do RSA with the JDK but cannot read, write or exchange the files that real systems use.
"""
roles = [["Base64 by hand", "`Base64Steps`"], ["Opening the envelope by hand", "`EnvelopeSteps`"], ["PEM files", "`Pem`"], ["The certificate", "`Certificates`"], ["The CMS envelope", "`CmsEnvelope`"], ["The independent check", "`OpenSsl`"], ["Provider registration", "`Providers`"], ["Entry point", "`BouncyCastleDemo`"]]
requirements = [
    "Keys and certificates round-trip through PEM, and an encrypted private key needs its password.",
    "A CMS envelope opens with the recipient's key and not with another.",
    "The key transport is OAEP by default, and the demo shows what the simple call picks.",
    "The openssl command-line tool opens the envelope that the code wrote.",
    "The demo output equals `docs/expected-output.txt` on a machine with openssl 3.",
]

