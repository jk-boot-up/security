[poster]
headline = [["ASYMMETRIC ENCRYPTION", "text"], ["BOUNCY CASTLE + OPENSSL", "accent"]]
taglines = [["Standard files that other programs can open", "gold"]]
before = { code = "my own file format", note = "nobody else can read it", tag = "BEFORE" }
after = { code = "PEM, X.509, CMS", note = "openssl opens it too", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "Asymmetric Encryption with Bouncy Castle and OpenSSL"
narration = """Hello, and welcome. [[slnc 400]] This video explains asymmetric encryption with Bouncy Castle and Open S S L, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] The J D K can do the maths of public key encryption. [[slnc 300]] But real systems keep keys in files, and send encrypted messages in formats that other programs understand. [[slnc 300]] Bouncy Castle is a library that reads and writes those standard formats. [[slnc 600]] Think of a diplomat's sealed pouch. [[slnc 300]] Every embassy in the world knows the standard form. [[slnc 300]] A pouch in a homemade form could be perfectly secure, and still be useless, because nobody else could open it. [[slnc 700]] In this video, the domain is an online bank, and its customer, Ana. [[slnc 500]] By the end, you will hear how keys are written as P E M text, what a certificate is, and what a standard envelope contains. [[slnc 300]] How a different program proves it is a standard. [[slnc 300]] And what the library costs."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["The online bank, and Ana, as before.", "", "Her keys must live in files.", "Her statements must travel in a format", "that other programs can open.", "", "Proof: another program opens it."]
narration = """Here is the scenario. [[slnc 400]] It is the online bank, and its customer Ana, from the plain version. [[slnc 500]] This time her keys must live in files. [[slnc 300]] And her statements must travel in a format that her email program, and other tools, can open. [[slnc 600]] To prove that the format is a real standard, the bank asks a different program, Open S S L, to open an envelope that Bouncy Castle wrote."""

[[scene]]
key = "03-formats"
kind = "bullets"
title = "Three Formats"
body = ["PEM: keys and certificates as text", "X.509: a public key, a name, a signature", "CMS EnvelopedData: the standard hybrid envelope", "", "The JDK does the maths, not these."]
narration = """Before the demos, three formats. [[slnc 500]] P E M is a text format for keys and certificates, with a begin line and an end line. [[slnc 500]] X five oh nine is the format of a certificate: a public key, a name, and a signature. [[slnc 500]] And C M S enveloped data is the standard hybrid envelope, the one behind S slash MIME email. [[slnc 600]] The J D K does the maths. It does not read or write these."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "09-split"
kind = "bullets"
title = "JDK, and Library"
body = ["JDK: RSA, AES, key pairs", "Bouncy Castle: PEM, X.509, CMS", "OpenSSL: the independent check", "", "Ask for OAEP by name."]
narration = """Let's draw the line. [[slnc 400]] The J D K gives R S A, A E S, and key pairs. [[slnc 500]] Bouncy Castle gives P E M, X five oh nine, and C M S. [[slnc 500]] Open S S L is the independent check, that the formats are really standard. [[slnc 600]] And whatever the library offers, ask for O A E P by name."""

[[scene]]
key = "10-roles"
kind = "bullets"
title = "Who Does What"
body = ["Pem: keys and certificates as text", "Certificates: a self-signed X.509", "CmsEnvelope: seal and open", "OpenSsl: the independent check", "Providers: registers Bouncy Castle once"]
narration = """Here is who does what in the code. [[slnc 400]] The P E M class writes and reads keys and certificates as text. [[slnc 500]] The certificates class makes a self signed certificate. [[slnc 500]] The C M S envelope class seals and opens. [[slnc 500]] The Open S S L class runs the independent check. [[slnc 300]] And the providers class registers Bouncy Castle, once."""

[[scene]]
key = "11-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["-----BEGIN CERTIFICATE-----", "openssl cms, S/MIME email", "id_rsa and id_rsa.pub", "bcprov and bcpkix in Java builds"]
narration = """You have probably met these already. [[slnc 400]] Files that begin with dashes, and the words begin certificate, are P E M. [[slnc 500]] Encrypted email, with S slash MIME, uses this envelope. [[slnc 500]] The S S H key files, id R S A, and id R S A dot pub, are keys in a text form. [[slnc 500]] And the names B C prov and B C pkix appear in the dependency lists of a great many Java programs."""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["JDK for the maths; a library for the formats", "Ask for OAEP by name", "Password-protect private key files", "Test with an independent program"]
narration = """So, how do you use it? [[slnc 400]] Use the J D K for the maths, and a library like Bouncy Castle only for the formats the J D K does not know. [[slnc 500]] Ask for O A E P by name. [[slnc 500]] Protect private key files with a password. [[slnc 500]] And test with an independent program, because a private format is a liability."""

[[scene]]
key = "13-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Seal an envelope for two", "recipients and open it with each."]
narration = """That's asymmetric encryption with Bouncy Castle and Open S S L. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] A standard format is one that independent programs can open, so test with a program that you did not write. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It needs a Java development kit, and for one demo, Open S S L. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Seal an envelope for two recipients at once, and open it with each of their keys. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
How an online bank stores a customer's keys and sends her encrypted statements in standard formats: PEM key files, an X.509 certificate, and a CMS envelope that OpenSSL can also open. It covers a thief who reads
a key file, someone who offers a false certificate, and the risks of the library itself. It does not cover certificate authorities, or the storage of the keys in a key store or hardware module.
"""
assets = [
    "Ana's private key, in a file.",
    "The contents of each statement.",
    "The correctness of the certificate that names the recipient.",
    "The JVM's list of security providers.",
]
actors = [
    "The bank, which seals envelopes for a certificate.",
    "Ana, who holds the private key.",
    "A thief who copies a key file or a backup.",
    "A man in the middle who offers a false certificate for Ana.",
    "A developer who copies an example that picks older padding.",
]
boundaries = [
    "Key file to the filesystem: a PEM private key is a secret that sits in an ordinary file.",
    "Certificate to the bank: the bank must decide whether to trust a certificate it was handed.",
    "Library to the JVM: registering a provider affects every library in the program.",
]
assumptions = [
    "The certificate in the demo is self-signed, and its trust is assumed. A real bank checks it against a trusted authority.",
    "The openssl on the machine is a genuine version 3.",
    "Keys are fresh and random on every run.",
]
out_of_scope = [
    "Certificate authorities, chains and revocation.",
    "Hardware security modules and key stores.",
    "PGP, which Bouncy Castle also supports.",
]
tests = [
    "`PemTest` checks the headers, round trips, the password protection and the salt.",
    "`CertificateTest` checks the subject, the self-signature, the fixed dates and key usage.",
    "`CmsEnvelopeTest` checks opening, refusal for another key or certificate, the key transport algorithm, and that a changed envelope never opens to the original.",
    "`OpenSslInteropTest` (tagged `openssl`) has openssl open the envelope, and checks the golden output.",
]
next = """
The next project, digital-signatures, supplies what a self-signed certificate lacks: a signature made with a private key, which anyone can check with the public key, so that who made something can be proved.
"""

[[threat]]
id = "T1"
stride = "I"
threat = "A private key file is copied"
where = "`Pem.privateKeyInTheClear`"
control = "Encrypt the PKCS#8 file with a password (`Pem.privateKeyEncrypted`), and keep it out of backups that others can read"
residual = "A weak password can be guessed offline; a hardware module or a key store is stronger"

[[threat]]
id = "T2"
stride = "S"
threat = "A false certificate is offered for Ana, so the bank seals to the wrong key"
where = "`Certificates.selfSigned`, `CmsEnvelope.seal`"
control = "None in this project: a self-signed certificate proves nothing"
residual = "Certificates signed by a trusted authority, in the next modules, answer this"

[[threat]]
id = "T3"
stride = "I"
threat = "The easy call picks the older PKCS#1 v1.5 padding for the key"
where = "`CmsEnvelope.seal(cert, data, false)`"
control = "Ask for RSA-OAEP by name, which is the default in `seal(cert, data)`"
residual = "Another developer can still call the easy form, so a code review should look for it"

[[threat]]
id = "T4"
stride = "E"
threat = "Registering Bouncy Castle changes which algorithms every library in the JVM gets"
where = "`Providers`"
control = "Register once, on purpose, and name the provider where it is used"
residual = "Other libraries in the same JVM still see the provider"

[[threat]]
id = "T5"
stride = "T"
threat = "A vulnerable version of the library stays in use"
where = "the dependency on bcprov and bcpkix"
control = "The versions are pinned, and updating them is a routine task"
residual = "A large library has a large history of fixes, so updates need testing against another program, as the OpenSSL check does"

[[threat]]
id = "T6"
stride = "T"
threat = "An envelope is changed in transit, and AES-CBC does not notice"
where = "`CmsEnvelope`"
control = "A changed envelope never opens to the original statement, but may open to garbage"
residual = "Use an authenticated envelope, or sign the envelope, to be sure to detect changes"
