short_title = "Asymmetric Encryption with Bouncy Castle"
package = "asymmetricbc"
main_class = "BouncyCastleDemo"
tagline = "Standard files that other programs can open"
bold = "Bouncy Castle adds what the JDK leaves out, PEM key files, certificates and the standard CMS envelope, and OpenSSL, a program written by other people, can open what it writes, but the easy calls pick older padding and the library is large."
domain = "an online bank"
domain_note = ""
youtube_description = """Asymmetric encryption with Bouncy Castle and OpenSSL, in Java: the JDK can do the maths, but real systems exchange keys and encrypted files in standard formats. Explained with an online bank and its customer Ana, like a diplomat's sealed pouch that any embassy in the world knows how to open. We write keys as PEM text and protect a private key with a password, make a self-signed certificate, seal a statement in a standard CMS envelope, have the openssl command-line tool open it as a check that it really is a standard, and finish with the bill: the easy call picks the older RSA padding, the library is large, and registering it is global."""
thumb_lines = ["ASYMMETRIC ENCRYPTION", "BOUNCY CASTLE + OPENSSL"]
