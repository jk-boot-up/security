[readme]
technologies = [["OpenSSL (command-line tool)", "3.x", "the independent check that opens the CMS envelope; needed for act four and the integration tests"]]
intro = """
The plain version of this lesson used only the JDK, which does the maths but stops there. Real systems exchange keys and encrypted files in **standard
formats** that other programs understand. **Bouncy Castle** is an open-source library that fills the gaps. It reads and writes **PEM**, the text format with a `-----BEGIN ...-----` line that
OpenSSL, SSH and web servers all use. It builds **X.509 certificates**. And it writes **CMS EnvelopedData**, the standard envelope behind S/MIME email, which holds data encrypted with AES, the AES key locked with the
recipient's RSA key, and the recipient named by a certificate. Because it is a standard, a different program can open it, and this project proves that by asking **OpenSSL**, a command-line tool written by other people, to open
the bank's envelope.

The demo keeps the same online bank and customer, Ana, as the plain project. It writes her keys as PEM, protects the private key with a password, makes a self-signed certificate, seals a statement in a CMS envelope, has OpenSSL open it,
and ends with what Bouncy Castle costs.
"""
analogy = """
Think of a diplomat's sealed pouch. Any embassy in the world knows the standard form: the sealed bag, the label that names the recipient, the key held by one person. A pouch in a
homemade format could be perfectly secure and still be useless, because nobody else would know how to open it. Bouncy Castle writes the standard pouch, and OpenSSL is the other embassy that proves it can open it.
"""
scenario = """
The online bank and Ana from the plain project. This time the bank must give Ana's keys a form that she can keep in files, and send her statements in a format that her email program and other tools can read. The
demo writes her keys as PEM, makes a certificate for her public key, seals a 10,000-byte statement in a CMS envelope, opens it with Java, with Eve's key, and with OpenSSL, and finally looks at the costs of using the library.
"""
costs = [
    "**The easy call picks older padding.** Bouncy Castle's simplest way to address an envelope locks the key with PKCS#1 v1.5 padding, which is older and weaker than OAEP. OAEP has to be asked for by name.",
    "**A large library.** The core jar is several megabytes, and the certificate and CMS code come in a second one. It is a lot to add for a few functions.",
    "**Registering a provider changes the whole program.** Once Bouncy Castle is added to the JVM's list of providers, every library in the program can be handed algorithms from it.",
    "**Names and versions move.** The artifacts changed from `jdk15on` to `jdk18on`, and APIs are deprecated over time, so upgrades need care and tests.",
    "**A self-signed certificate proves nothing.** It binds a name to a key, signed by the key itself, so anyone can make one. Real proof needs a signature from a party that is trusted.",
    "**AES-CBC has no tag.** This envelope hides the data but does not, on its own, detect changes, which is why newer designs prefer authenticated modes.",
]
too_much = """
If the plain JDK is enough, because all you need is AES-GCM between two services that you control, use it. Reach for Bouncy Castle when you must
read or write formats the JDK does not know: PEM files, certificates, CMS, PGP, or an algorithm the JDK lacks. The question to ask each time is whether you need the format, or only the maths.
"""
met_before = [
    "`-----BEGIN CERTIFICATE-----` and `-----BEGIN PRIVATE KEY-----` in files on a web server.",
    "`openssl cms -encrypt` and `-decrypt`, and S/MIME encrypted email.",
    "`id_rsa` and `id_rsa.pub` in an `.ssh` folder, which are PEM-style files.",
    "Libraries named `bcprov` and `bcpkix` in the dependency lists of Java applications.",
]
where = """
This project is the fifth in [cryptography](..), the library version of [asymmetric-encryption](../asymmetric-encryption).
"""
twin = """
Keys are fresh and random on every run, so the demo prints only facts that do not depend on them: the headers of the files, the subject and dates of a certificate whose dates are fixed, and whether
operations open or are refused. The certificate is self-signed, with fixed start and end dates so its text does not change. Act four calls the `openssl` command-line tool, which must be version 3 and on the PATH, and says so if it is not. The size
of the library is printed in whole megabytes and belongs to the pinned version.
"""
test_note = "The unit tests (`./gradlew test`) need nothing installed. The tests that call `openssl`, including the golden-output comparison, are tagged `openssl` and run with `./gradlew integrationTest`, which needs openssl 3 on the PATH."

[[act]]
title = "Keys as PEM text"
summary = "A public key and a PKCS#8 private key are written as PEM; the private key in the clear is readable by anyone, encrypted with a password it is not, and a wrong password is refused."
detail = """
Ana's public key written as PEM begins -----BEGIN PUBLIC KEY-----, and reads back as the same key. Her private key as PEM begins -----BEGIN PRIVATE KEY-----, and anyone who can read the file has the key. Encrypted with a password it
begins -----BEGIN ENCRYPTED PRIVATE KEY-----: with the right password it reads back as the same key, and with a wrong password it is refused. The JDK has no PEM support, which is the first thing
Bouncy Castle adds. Text keys are easy to move, and easy to leak.
"""
speech = """
First demo: keys as P E M text. [[slnc 400]] P E M is the text format with a line that says begin, a block of letters and digits, and a line that says end. [[slnc 300]] The JDK has no support for it. Bouncy Castle does. [[slnc 600]]
Ana's public key begins with the words, begin public key. [[slnc 300]] It reads back as the same key. [[slnc 600]]
Her private key begins with the words, begin private key. [[slnc 300]] Anyone who can read the file has the key. [[slnc 600]]
Encrypted with a password, it begins with, begin encrypted private key. [[slnc 300]] With the right password, it reads back. [[slnc 300]] With a wrong password, it is refused. [[slnc 600]]
Text keys are easy to move, and easy to leak.
"""
rows = { pem = "active ok" }
console = [
    ["Ana's public key as text begins: -----BEGIN PUBLIC KEY-----", "ok"],
    ["her private key as text begins: -----BEGIN PRIVATE KEY-----  <- ANYONE WHO READS THE FILE HAS THE KEY", "bad"],
    ["the public key reads back to the same key: true", "ok"],
    ["encrypted with a password it begins: -----BEGIN ENCRYPTED PRIVATE KEY-----", "ok"],
    ["with the right password it reads back: true", "ok"],
    ["with a wrong password: refused", "ok"],
]

[[act]]
title = "A certificate for the public key"
summary = "A self-signed X.509 certificate names Ana, is valid for the year 2026, is signed with SHA256WITHRSA, and has the same issuer and subject, so anyone could have made it."
detail = """
A certificate binds a public key to a name, and a validity period, and is signed. Ana's is made with Bouncy Castle: the subject is CN=Ana,O=Example Bank customer, valid from 2026-01-01 to 2027-01-01, signed with SHA256WITHRSA. The issuer
is the same as the subject: the certificate is signed by its own key. Anyone can make one, so it proves nothing about who Ana is until someone trusted signs it, which is the subject of the next projects. CMS uses the certificate to name the recipient of an envelope.
"""
speech = """
Second demo: a certificate. [[slnc 400]] A certificate ties a public key to a name, and a period of validity, and is signed. [[slnc 600]]
Ana's is made with Bouncy Castle. [[slnc 300]] The subject is Ana, of the Example Bank. [[slnc 300]] It is valid for the whole of twenty twenty six. [[slnc 300]] And it is signed with S H A two fifty six, with R S A. [[slnc 600]]
The issuer is the same as the subject. [[slnc 300]] The certificate is signed by its own key. [[slnc 300]] Anyone can make one. [[slnc 300]] So it proves nothing, yet, about who Ana is. [[slnc 600]]
That needs someone trusted to sign it, which is the subject of the next videos.
"""
rows = { cert = "active ok" }
console = [
    ["subject: CN=Ana,O=Example Bank customer", "muted"],
    ["valid from 2026-01-01T00:00:00Z to 2027-01-01T00:00:00Z", "muted"],
    ["signed with SHA256WITHRSA", "muted"],
    ["issuer equals subject: true  <- ANYONE CAN MAKE ONE, SO IT PROVES NOTHING YET", "amber"],
    ["the certificate as text begins: -----BEGIN CERTIFICATE-----", "muted"],
]

[[act]]
title = "A standard envelope: CMS EnvelopedData"
summary = "A 10,000-byte statement is sealed for Ana's certificate with AES-256 and RSA-OAEP; Ana opens it, and Eve's private key is refused."
detail = """
CMS EnvelopedData is the standard hybrid envelope, the format behind S/MIME email. The bank seals the 10,000-byte statement for Ana's certificate: AES-256 encrypts the data, and RSA-OAEP locks the AES key, and the
certificate names the recipient. Ana opens it with her private key. Eve tries her own private key and is refused, because the envelope is not addressed to her certificate and her key cannot open the locked key.
"""
speech = """
Third demo: a standard envelope. [[slnc 400]] The format is called C M S enveloped data. [[slnc 300]] It is the one behind S slash MIME email. [[slnc 600]]
The bank seals the ten thousand byte statement for Ana's certificate. [[slnc 300]] A E S two fifty six encrypts the data. [[slnc 300]] R S A with O A E P locks the key. [[slnc 300]] And the certificate names the recipient. [[slnc 600]]
Ana opens it with her private key. [[slnc 300]] Eve tries her own private key, and is refused.
"""
rows = { cms = "active ok" }
console = [
    ["the bank seals a 10000-byte statement for Ana's certificate: AES-256 for the data, RSA-OAEP for the key", "muted"],
    ["Ana opens it: true", "ok"],
    ["Eve tries her own private key: refused", "ok"],
]

[[act]]
title = "A different program opens it"
summary = "The openssl command-line tool, written by other people, is given the envelope, the key file and the certificate, and opens the statement: it is a real standard."
detail = """
How do we know the envelope is really in the standard format, and not just something only this library can read? We ask a different program. The bank writes the envelope, Ana's key file and her certificate to a temporary folder, and runs
openssl cms -decrypt on them. OpenSSL, written by other people, opens the statement, and the bytes match the original. A format that only one library understands is a trap. A standard is one that independent programs agree on.
"""
speech = """
Fourth demo: a different program opens it. [[slnc 400]] How do we know the envelope is really in the standard format, and not just something only this library can read? [[slnc 300]] We ask a different program. [[slnc 600]]
The bank writes the envelope, Ana's key file, and her certificate, to a temporary folder. [[slnc 300]] And runs the open S S L command line tool on them. [[slnc 600]]
Open S S L, written by other people, opens the statement. [[slnc 300]] The bytes match the original. [[slnc 600]]
A format that only one library understands is a trap. [[slnc 300]] A standard is one that independent programs agree on.
"""
rows = { openssl = "active ok" }
console = [
    ["the openssl command-line tool, written by other people, is given the envelope, the key file and the certificate", "muted"],
    ["it opens the statement: true  <- A REAL STANDARD, NOT ONLY THIS LIBRARY", "ok"],
]

[[act]]
title = "The bill: what Bouncy Castle costs"
summary = "The envelope locks its key with RSA-OAEP, but the easy call picks PKCS#1 v1.5; the library is about 7 MB, and registering it changes the whole program."
detail = """
Bouncy Castle has costs. The envelope in the demo locks its key with RSA-OAEP, OID 1.2.840.113549.1.1.7, because the code asked for it. The simple call that most examples show locks the key with RSA PKCS#1 v1.5 padding, OID
1.2.840.113549.1.1.1, which is older and weaker. The easy call picks the older padding. The library is about 7 MB, and registering it as a provider changes every library in the program. Its artifact names changed from jdk15on to jdk18on, so
upgrades need care. And the JDK alone could do the maths, but not the PEM, the certificate or the CMS format, which is what the library is for.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] Bouncy Castle has costs. [[slnc 600]]
The envelope in the demo locks its key with R S A O A E P, because the code asked for it by name. [[slnc 300]] The simple call that most examples show locks the key with R S A and an older padding, called P K C S one version one point five. [[slnc 300]] The easy call picks the older padding. [[slnc 600]]
The library is about seven megabytes. [[slnc 300]] And registering it changes every library in the program. [[slnc 300]] Its package names changed over time, so upgrades need care. [[slnc 600]]
The J D K alone could do the maths. [[slnc 300]] But not the P E M, the certificate, or the C M S format. [[slnc 300]] That is what the library is for.
"""
rows = { cms = "active amber", pem = "active amber" }
console = [
    ["the envelope above locks the key with RSA-OAEP (1.2.840.113549.1.1.7)", "ok"],
    ["the simple call that most examples show locks it with RSA with PKCS#1 v1.5 padding (1.2.840.113549.1.1.1)  <- THE EASY CALL PICKS THE OLDER PADDING", "bad"],
    ["the library is about 7 MB, and registering it changes every library in the program", "amber"],
