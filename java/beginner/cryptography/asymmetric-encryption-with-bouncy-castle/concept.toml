[readme]
technologies = [["OpenSSL (command-line tool)", "3.x", "the independent check that opens the CMS envelope; needed for act five and the integration tests"]]
intro = """
The plain version of this lesson used only the JDK, which does the maths but stops there. Real systems exchange keys and encrypted files in **standard
formats** that other programs understand. **Bouncy Castle** is an open-source library that fills the gaps. It reads and writes **PEM**, the text format with a `-----BEGIN ...-----` line that
OpenSSL, SSH and web servers all use. It builds **X.509 certificates**. And it writes **CMS EnvelopedData**, the standard envelope behind S/MIME email, which holds data encrypted with AES, the AES key locked with the
recipient's RSA key, and the recipient named by a certificate. Because it is a standard, a different program can open it, and this project proves that by asking **OpenSSL**, a command-line tool written by other people, to open
the bank's envelope.

The demo keeps the same online bank and customer, Ana, as the plain project, in six acts. It writes her public key as PEM and works out the Base64 letters by hand, locks the private key with a password, makes a
self-signed certificate, seals a statement in a CMS envelope and shows its parts by size, opens it by hand with the JDK alone and then with OpenSSL, and ends with what Bouncy Castle costs. Every act shows its input and its result in separate sections.
"""
analogy = """
Think of a diplomat's sealed pouch. Any embassy in the world knows the standard form: the sealed bag, the label that names the recipient, the key held by one person. A pouch in a
homemade format could be perfectly secure and still be useless, because nobody else would know how to open it. Bouncy Castle writes the standard pouch, and OpenSSL is the other embassy that proves it can open it.
"""
scenario = """
The online bank and Ana from the plain project. This time the bank must give Ana's keys a form that she can keep in files, and send her statements in a format that her email program and other tools can read. The
demo writes her keys as PEM, makes a certificate for her public key, seals a 10,000-byte statement in a CMS envelope, opens it with Bouncy Castle, with Eve's key, by hand with the JDK alone and with OpenSSL, and finally looks at the costs of using the library.
"""
costs = [
    "**The easy call picks older padding.** Bouncy Castle's simplest way to address an envelope locks the key with PKCS#1 v1.5 padding, which is older and weaker than OAEP. OAEP has to be asked for by name.",
    "**A large library.** The core jar is several megabytes, and the certificate and CMS code come in a second one. It is a lot to add for a few functions.",
    "**Registering a provider changes the whole program.** Once Bouncy Castle is added to the JVM's list of providers, every library in the program can be handed algorithms from it.",
    "**Names and versions move.** The artifacts changed from `jdk15on` to `jdk18on`, and APIs are deprecated over time, so upgrades need care and tests.",
    "**A self-signed certificate proves nothing.** It binds a name to a key, signed by the key itself, so anyone can make one. Real proof needs a signature from a party that is trusted.",
    "**AES-CBC has no tag.** This envelope hides the data but does not, on its own, detect changes, which is why newer designs prefer authenticated modes.",
]
too_much = """
If the plain JDK is enough, because all you need is AES-GCM between two services that you control, use it. Reach for Bouncy Castle when you must
read or write formats the JDK does not know: PEM files, certificates, CMS, PGP, or an algorithm the JDK lacks. The question to ask each time is whether you need the format, or only the maths.
"""
met_before = [
    "`-----BEGIN CERTIFICATE-----` and `-----BEGIN PRIVATE KEY-----` in files on a web server.",
    "`openssl cms -encrypt` and `-decrypt`, and S/MIME encrypted email.",
    "`id_rsa` and `id_rsa.pub` in an `.ssh` folder, which are PEM-style files.",
    "Libraries named `bcprov` and `bcpkix` in the dependency lists of Java applications.",
]
where = """
This project is the fifth in [cryptography](..), the library version of [asymmetric-encryption](../asymmetric-encryption).
"""
twin = """
Keys are fresh and random on every run, so the demo prints only facts that do not depend on them: the headers of the files, sizes in bytes (a 2048-bit RSA key, its certificate and the envelope
always have the same length), the first bytes of the key's encoding, which are the same for every 2048-bit RSA public key, the padding block, and whether operations open or are refused.
The certificate is self-signed, with fixed start and end dates so its text does not change. Act five calls the `openssl` command-line tool, which must be version 3 and on the PATH, and says so if it is not. The size
of the library is printed in whole megabytes and belongs to the pinned version.
"""
test_note = "The unit tests (`./gradlew test`) need nothing installed. The tests that call `openssl`, including the golden-output comparison, are tagged `openssl` and run with `./gradlew integrationTest`, which needs openssl 3 on the PATH. The demo's comparison with its golden output runs with the integration tests, because the demo needs OpenSSL 3: run `./gradlew integrationTest` after changing the demo or its narration."

[[act]]
title = "The public key as PEM text"
summary = "Ana's 294-byte public key becomes 392 Base64 letters in 7 lines between a BEGIN and an END line; the first three bytes 30 82 01 become the letters MIIB, worked out by hand."
detail = """
A key is bytes, not text: Ana's public key is 294 bytes in the DER encoding, beginning 30820122 300d0609. PEM writes those bytes as Base64 letters, 64 to a line, between
-----BEGIN PUBLIC KEY----- and -----END PUBLIC KEY-----: 392 letters in 7 lines. Base64 takes 3 bytes, 24 bits, at a time, and cuts them into four groups of 6 bits. Each group is a
number from 0 to 63, which picks one letter of the alphabet A to Z, a to z, 0 to 9, + and /. The first bytes 30 82 01 are the bits 00110000 10000010 00000001, the groups
001100 001000 001000 000001, the numbers 12 8 8 1, and the letters M I I B. Done by hand for all 294 bytes, it gives exactly the library's PEM text. PEM hides nothing: it only makes bytes safe to paste.
"""
figure = "base64_steps"
figure_title = "Base64, step by step: three bytes, four letters"
figure_speech = """
How do bytes become letters? [[slnc 400]] Take the first three bytes of Ana's key: three zero, eight two, zero one. [[slnc 500]]
That is twenty four bits. [[slnc 300]] Base sixty four cuts them into four groups of six bits, in four colours here. [[slnc 500]]
Each group is a number from zero to sixty three: twelve, eight, eight, and one. [[slnc 500]]
Each number picks one letter. [[slnc 300]] Twelve is M. Eight is I. One is B. [[slnc 500]]
So every three bytes become four letters. [[slnc 300]] Nothing is hidden: anyone can turn them back.
"""
speech = """
Here is the program's output. [[slnc 400]] Before P E M: two hundred and ninety four bytes. [[slnc 400]] After P E M: a begin line, three hundred and ninety two letters in seven lines, and an end line.
[[page]]
Then the same steps by hand, ending in M, I, I, B. [[slnc 400]] Done by hand for all the bytes, it gives exactly the library's text.
"""
rows = { pem = "active ok" }
console = [
    ["BEFORE PEM (the key as bytes):", "ok"],
    ["  size         294 bytes", "muted"],
    ["  first bytes  30820122 300d0609 2a864886 f70d0101", "muted"],
    ["AFTER PEM (text between a BEGIN and an END line):", "bad"],
    ["  first line   -----BEGIN PUBLIC KEY-----", "muted"],
    ["  text begins  MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8A...", "muted"],
    ["  size         392 letters, in 7 lines of up to 64", "muted"],
    ["  last line    -----END PUBLIC KEY-----", "muted"],
    ["it reads back to the same key: true", "ok"],
    ["---", ""],
    ["BASE64, STEP BY STEP (the first 3 bytes):", "amber"],
    ["  bytes        30       82       01", "muted"],
    ["  bits         00110000 10000010 00000001", "muted"],
    ["  6-bit groups 001100   001000   001000   000001", "muted"],
    ["  numbers      12       8        8        1", "muted"],
    ["  letters      M        I        I        B", "muted"],
    ["all 294 bytes by hand = the PEM text: true", "ok"],
]

[[act]]
title = "The private key file, locked with a password"
summary = "In the clear, the private key file is ready for anyone to use; locked with a password (AES-256, with a key made from the password) it reads back only with the right password."
detail = """
Ana's private key as PEM begins -----BEGIN PRIVATE KEY----- and reads back without any password: whoever can read the file has the key. Locked with a password, it begins
-----BEGIN ENCRYPTED PRIVATE KEY-----: the key inside is encrypted with AES-256, under a key made from the password and a random salt. With the right password it reads back as the
same key, and with a wrong password it is refused. The JDK has no public way to write this file; Bouncy Castle does.
"""
figure = "key_lock"
figure_title = "The same private key, before and after locking"
figure_speech = """
Now Ana's private key, which must stay secret. [[slnc 400]] Before locking, the file begins, begin private key. [[slnc 300]] Anyone who reads it has a key ready to use. [[slnc 600]]
After locking, it begins, begin encrypted private key. [[slnc 300]] The same key is inside, encrypted with A E S, under a key made from a password. [[slnc 500]]
The right password gives the key back. [[slnc 300]] A wrong one is refused.
"""
speech = """
In the output: before locking, no password is needed at all. [[slnc 400]] After locking, the right password gives the same key, and the wrong one is refused.
"""
rows = { pem = "active ok" }
console = [
    ["BEFORE LOCKING (the key in the clear):", "ok"],
    ["  first line   -----BEGIN PRIVATE KEY-----", "muted"],
    ["  no password needed: true  <- ANYONE CAN USE IT", "bad"],
    ["AFTER LOCKING (AES-256, a key made from the password):", "bad"],
    ["  first line   -----BEGIN ENCRYPTED PRIVATE KEY-----", "muted"],
    ["  right password: the same key: true", "ok"],
    ["  wrong password: refused", "ok"],
]

[[act]]
title = "A certificate for the public key"
summary = "A name, Ana's 294-byte public key and fixed dates are signed with SHA256WITHRSA by her own private key, giving a 749-byte certificate whose issuer equals its subject: anyone could have made it."
detail = """
A certificate binds a public key to a name and a validity period, and is signed. The inputs: the name CN=Ana,O=Example Bank customer, Ana's 294-byte public key, and the dates
2026-01-01 to 2027-01-01. Bouncy Castle signs them with SHA256WITHRSA, using Ana's own private key, and gives a 749-byte certificate with serial number 1. Its issuer, the one who
signed, is the same as its subject: Ana vouches for herself. Anyone can make one, so it proves nothing about who Ana is until someone trusted signs it, which is the subject of the
next projects. The CMS envelope uses the certificate to name its recipient. The JDK can read certificates but has no public way to make one.
"""
figure = "certificate"
figure_title = "A self-signed certificate: the inputs and the result"
figure_speech = """
Next, a certificate, which ties a public key to a name. [[slnc 500]]
Before signing, the inputs: the name Ana, her public key, and the dates, the whole of twenty twenty six. [[slnc 500]]
Bouncy Castle signs them with S H A two fifty six and R S A, using Ana's own private key. [[slnc 500]]
After signing: a certificate of seven hundred and forty nine bytes. [[slnc 300]] Look at the issuer, the one who signed. [[slnc 300]] It is the same as the subject. [[slnc 300]] Ana vouches for herself, so it proves nothing yet.
"""
speech = """
The program prints the same two sections: the inputs, then the certificate. [[slnc 400]] And the last line: issuer equals subject.
"""
rows = { cert = "active ok" }
console = [
    ["BEFORE SIGNING (the inputs):", "ok"],
    ["  name         CN=Ana,O=Example Bank customer", "muted"],
    ["  public key   Ana's, 294 bytes", "muted"],
    ["  valid        2026-01-01T00:00:00Z to 2027-01-01T00:00:00Z", "muted"],
    ["AFTER SIGNING (the certificate, 749 bytes):", "bad"],
    ["  subject      CN=Ana,O=Example Bank customer", "muted"],
    ["  issuer       CN=Ana,O=Example Bank customer", "muted"],
    ["  serial       1", "muted"],
    ["  signed with  SHA256WITHRSA, by Ana's own private key", "muted"],
    ["  as text      -----BEGIN CERTIFICATE-----", "muted"],
    ["issuer equals subject: true  <- ANYONE CAN MAKE ONE", "bad"],
]

[[act]]
title = "A standard envelope: CMS EnvelopedData"
summary = "A 10,000-byte statement is sealed for Ana's certificate into one 10,520-byte envelope: the recipient's serial, a 256-byte locked AES key, a 16-byte IV and 10,016 bytes of cipher text; Ana opens it, Eve is refused."
detail = """
CMS EnvelopedData is the standard hybrid envelope, the format behind S/MIME email. Before sealing: a 10,000-byte statement, 625 lines of RENT -1200, and Ana's certificate. Bouncy Castle
makes a new AES-256 key, encrypts the statement with it in CBC mode, and locks the AES key with Ana's RSA public key, using OAEP. After sealing, one 10,520-byte envelope holds four
parts: who it is for (the certificate's issuer and serial number 1), the 256-byte locked key, a 16-byte IV (the start value for CBC), and 10,016 bytes of cipher text. Ana opens it with her
private key. Eve tries her own private key and is refused. AES carries the big data, RSA only the small key: that is hybrid encryption.
"""
figure = "envelope"
figure_title = "What goes into a CMS envelope, by size"
figure_speech = """
Now the bank sends Ana a statement. [[slnc 400]] Before sealing: ten thousand bytes, and Ana's certificate. [[slnc 600]]
Sealing makes a brand new A E S key, and A E S encrypts the statement. [[slnc 300]] R S A, with O A E P padding, locks only that small key. [[slnc 600]]
After sealing, one envelope with four parts. [[slnc 300]] Who it is for. [[slnc 300]] The locked key, two hundred and fifty six bytes. [[slnc 300]] The I V, sixteen bytes. [[slnc 300]] And the cipher text, ten thousand and sixteen bytes. [[slnc 600]]
Ana opens it. [[slnc 300]] Eve, with her own key, is refused.
"""
speech = """
The output shows the same: the envelope's size, its four parts, then Ana, true, and Eve, refused.
"""
rows = { cms = "active ok" }
console = [
    ["BEFORE SEALING:", "ok"],
    ["  statement    10000 bytes, 625 lines of RENT      -1200", "muted"],
    ["  recipient    Ana's certificate, serial 1", "muted"],
    ["AFTER SEALING (one envelope, 10520 bytes):", "bad"],
    ["  for          the certificate with serial 1", "muted"],
    ["  locked key   256 bytes: a new AES key, RSA-OAEP", "muted"],
    ["  IV           16 bytes, for AES-256-CBC", "muted"],
    ["  cipher text  10016 bytes: the statement", "muted"],
    ["OPENING IT:", "amber"],
    ["  Ana, her private key: true", "ok"],
    ["  Eve, her own private key: refused  <- NOT FOR HER", "ok"],
]

[[act]]
title = "Opening it by hand, then with openssl"
summary = "With the JDK alone: RSA-OAEP turns the 256-byte locked key into a 32-byte AES key; AES-256-CBC turns 10,016 bytes into 10,016, the last 16 all 10 hex; removing 16 bytes of padding leaves the 10,000-byte statement. openssl opens it too."
detail = """
The library hides how an envelope opens, so a small class, EnvelopeSteps, redoes it with the JDK's own ciphers. Step 1: RSA-OAEP with Ana's private key turns the 256-byte locked key into a
32-byte, 256-bit AES key. Step 2: AES-256-CBC, with that key and the IV, turns the 10,016 bytes of cipher text into 10,016 bytes. Their last block is sixteen bytes that are all 10 in hex:
padding. Step 3: the last byte, 0x10 = 16, says how many bytes to remove, leaving the 10,000-byte statement, exactly what Bouncy Castle gave. Then the openssl command-line tool, written by
other people, is given the envelope, Ana's key file and her certificate, and opens the statement too. A standard is a format that independent programs agree on.
"""
figure = "open_steps"
figure_title = "Opening the envelope by hand"
figure_speech = """
How does it open? [[slnc 400]] Here it is by hand, with only the J D K's own ciphers. [[slnc 600]]
Step one. [[slnc 300]] R S A, with Ana's private key, turns the locked key into the A E S key: thirty two bytes. [[slnc 600]]
Step two. [[slnc 300]] A E S, in C B C mode, decrypts the ten thousand and sixteen bytes. [[slnc 300]] The last sixteen bytes are all one zero, in hex. [[slnc 600]]
Step three. [[slnc 300]] That is padding. [[slnc 300]] One zero in hex is sixteen, so sixteen bytes come off, leaving the ten thousand byte statement. [[slnc 600]]
And Open S S L, a different program, opens it too.
"""
speech = """
The output follows the same three steps, and the J D K alone has opened what Bouncy Castle sealed. [[slnc 500]] And Open S S L: true. [[slnc 300]] A real standard.
"""
rows = { openssl = "active ok", cms = "active ok" }
console = [
    ["STEP 1. UNLOCK THE AES KEY (RSA-OAEP, Ana's private key):", "amber"],
    ["  locked key   256 bytes in", "muted"],
    ["  AES key      32 bytes out: 256 bits", "muted"],
    ["STEP 2. DECRYPT (AES-256-CBC, that key and the IV):", "amber"],
    ["  cipher text  10016 bytes in", "muted"],
    ["  plain text   10016 bytes out", "muted"],
    ["  last block   10101010 10101010 10101010 10101010", "muted"],
    ["STEP 3. REMOVE THE PADDING (the last byte says how many):", "amber"],
    ["  0x10 = 16 bytes off: 10000 bytes, the statement", "muted"],
    ["the JDK alone opened it, as Bouncy Castle did: true", "ok"],
    ["OPENSSL, A DIFFERENT PROGRAM (envelope, key file, certificate):", "amber"],
    ["  openssl cms -decrypt opens it: true  <- A REAL STANDARD", "ok"],
]

[[act]]
title = "The bill: what Bouncy Castle costs"
summary = "The careful call locks the key with RSA-OAEP (OID 1.2.840.113549.1.1.7), the easy call with the older PKCS#1 v1.5 (1.2.840.113549.1.1.1); the library is about 7 MB, registering it is global, and its names have moved."
detail = """
Bouncy Castle has costs. The envelope in the demo locks its key with RSA-OAEP, OID 1.2.840.113549.1.1.7, because the code asked for it by name. The simple call that most examples show locks
the key with RSA and the older PKCS#1 v1.5 padding, OID 1.2.840.113549.1.1.1. The library is about 7 MB, and registering it as a provider is global: every library in the program can be handed
its algorithms. Its artifact names changed from jdk15on to jdk18on, so upgrades need care. And the JDK cannot make a certificate and has no CMS, which is what the library is for.
"""
figure = "bill"
figure_title = "The careful call, the easy call, and the bill"
figure_speech = """
Last, the bill. [[slnc 400]] The careful call asks for O A E P by name. [[slnc 300]] The envelope records it as an O I D, an object identifier. [[slnc 500]]
The easy call, which most examples show, quietly picks the older padding, P K C S one, version one point five. [[slnc 600]]
And the rest: about seven megabytes of library, a global registration, and names that change between versions.
"""
speech = """
The output prints both O I Ds. [[slnc 400]] And why the library is used at all: the J D K cannot make a certificate, and has no C M S.
"""
rows = { cms = "active amber", pem = "active amber" }
console = [
    ["THE CAREFUL CALL (OAEP asked for by name):", "ok"],
    ["  key locked with  RSA-OAEP", "muted"],
    ["  OID              1.2.840.113549.1.1.7", "muted"],
    ["THE EASY CALL (the one most examples show):", "bad"],
    ["  key locked with  RSA with PKCS#1 v1.5  <- OLDER PADDING", "bad"],
    ["  OID              1.2.840.113549.1.1.1", "muted"],
    ["THE REST OF THE BILL:", "amber"],
    ["  the library is about 7 MB", "muted"],
    ["  registering it is global: every library can use it", "muted"],
    ["  names moved from jdk15on to jdk18on: upgrade with care", "muted"],
    ["  the JDK cannot make a certificate and has no CMS", "muted"],
]

