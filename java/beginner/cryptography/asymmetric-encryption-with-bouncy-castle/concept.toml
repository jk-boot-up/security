[poster]
headline = [["ASYMMETRIC ENCRYPTION", "text"], ["BOUNCY CASTLE + OPENSSL", "accent"]]
taglines = [["Standard files that other programs can open", "gold"]]
before = { code = "my own file format", note = "nobody else can read it", tag = "BEFORE" }
after = { code = "PEM, X.509, CMS", note = "openssl opens it too", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "Asymmetric Encryption with Bouncy Castle and OpenSSL"
narration = """Hello, and welcome. [[slnc 400]] This video explains asymmetric encryption with Bouncy Castle and Open S S L, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] The J D K, the Java Development Kit, does the maths of public key encryption. [[slnc 300]] But real systems keep keys in files, and send messages in formats other programs understand. [[slnc 300]] Bouncy Castle is a library for those standard formats. [[slnc 300]] Open S S L, named after the Secure Sockets Layer, is a separate toolkit that reads them too. [[slnc 600]] The domain is an online bank, and its customer, Ana. [[slnc 500]] You will see how a key becomes P E M text, short for Privacy Enhanced Mail. [[slnc 300]] What a certificate and a C M S envelope hold, C M S being the Cryptographic Message Syntax. [[slnc 300]] How to open that envelope by hand. [[slnc 300]] And what the library costs."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["The online bank, and Ana, as before.", "", "Her keys must live in files.", "Her statements must travel in a format", "that other programs can open.", "", "Proof: another program opens it."]
narration = """Here is the scenario. [[slnc 400]] The online bank and Ana, from the plain version. [[slnc 400]] Her keys must live in files, and her statements must travel in a format that other programs can open. [[slnc 500]] To prove it, the bank opens its envelope by hand, and with a different program."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["PEM: keys and certificates as text", "X.509: a public key, a name, a signature", "CMS EnvelopedData: the standard hybrid envelope", "", "The JDK does the maths, not these."]
narration = """Three formats. [[slnc 400]] P E M: keys and certificates as text, between a begin and an end line. [[slnc 400]] X five oh nine: a certificate, a public key with a name and a signature. [[slnc 400]] And C M S enveloped data: the standard hybrid envelope. [[slnc 400]] The J D K cannot make the last two."""

[[scene]]
key = "03-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "04-pem"
kind = "figure"
title = "What PEM does to one key"
body = "pem_text"
narration = """Let's start with one real key. [[slnc 400]] Before P E M, Ana's public key is two hundred and ninety four bytes: three zero, eight two, zero one, and so on. [[slnc 300]] Bytes, not text. [[slnc 600]] Base sixty four turns every three bytes into four letters. [[slnc 600]] After P E M: a begin line, three hundred and ninety two letters in seven lines, and an end line. [[slnc 500]] It is only a way of writing. [[slnc 300]] It hides nothing."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "11-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["-----BEGIN CERTIFICATE-----", "openssl cms, S/MIME email", "id_rsa and id_rsa.pub", "bcprov and bcpkix in Java builds"]
narration = """You have met these already. [[slnc 400]] Files that begin with dashes and the words begin certificate. [[slnc 400]] Encrypted email, called S slash MIME. [[slnc 400]] S S H key files, in a text form. [[slnc 400]] And bcprov and bcpkix in the builds of many Java programs."""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["JDK for the maths; a library for the formats", "Ask for OAEP by name", "Password-protect private key files", "Test with an independent program"]
narration = """So, how do you use it? [[slnc 400]] The J D K for the maths, and a library only for the formats. [[slnc 400]] Ask for O A E P by name. [[slnc 400]] Protect private key files with a password. [[slnc 400]] And test with an independent program."""

[[scene]]
key = "13-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "14-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Seal an envelope for two", "recipients and open it with each."]
narration = """That's asymmetric encryption with Bouncy Castle and Open S S L. [[slnc 400]] Remember this. [[slnc 300]] A standard format is one that independent programs can open, so test with a program you did not write. [[slnc 500]] The source code, notes, diagrams, and an animated walkthrough are in the repository. [[slnc 500]] One exercise: seal an envelope for two recipients, and open it with each of their keys. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
How an online bank stores a customer's keys and sends her encrypted statements in standard formats: PEM key files, an X.509 certificate, and a CMS envelope that OpenSSL can also open. It covers a thief who reads
a key file, someone who offers a false certificate, and the risks of the library itself. It does not cover certificate authorities, or the storage of the keys in a key store or hardware module.
"""
assets = [
    "Ana's private key, in a file.",
    "The contents of each statement.",
    "The correctness of the certificate that names the recipient.",
    "The JVM's list of security providers.",
]
actors = [
    "The bank, which seals envelopes for a certificate.",
    "Ana, who holds the private key.",
    "A thief who copies a key file or a backup.",
    "A man in the middle who offers a false certificate for Ana.",
    "A developer who copies an example that picks older padding.",
]
boundaries = [
    "Key file to the filesystem: a PEM private key is a secret that sits in an ordinary file.",
    "Certificate to the bank: the bank must decide whether to trust a certificate it was handed.",
    "Library to the JVM: registering a provider affects every library in the program.",
]
assumptions = [
    "The certificate in the demo is self-signed, and its trust is assumed. A real bank checks it against a trusted authority.",
    "The openssl on the machine is a genuine version 3.",
    "Keys are fresh and random on every run.",
]
out_of_scope = [
    "Certificate authorities, chains and revocation.",
    "Hardware security modules and key stores.",
    "PGP, which Bouncy Castle also supports.",
]
tests = [
    "`PemTest` checks the headers, round trips, the password protection and the salt.",
    "`CertificateTest` checks the subject, the self-signature, the fixed dates and key usage.",
    "`CmsEnvelopeTest` checks opening, refusal for another key or certificate, the key transport algorithm, and that a changed envelope never opens to the original.",
    "`Base64StepsTest` checks the Base64 steps against the library's PEM text and the golden output.",
    "`EnvelopeStepsTest` checks that opening by hand gives what Bouncy Castle gives, and that another key cannot.",
    "`OpenSslInteropTest` (tagged `openssl`) has openssl open the envelope, and checks the golden output.",
]
next = """
The next project, digital-signatures, supplies what a self-signed certificate lacks: a signature made with a private key, which anyone can check with the public key, so that who made something can be proved.
"""

[[threat]]
id = "T1"
stride = "I"
threat = "A private key file is copied"
where = "`Pem.privateKeyInTheClear`"
control = "Encrypt the PKCS#8 file with a password (`Pem.privateKeyEncrypted`), and keep it out of backups that others can read"
residual = "A weak password can be guessed offline; a hardware module or a key store is stronger"

[[threat]]
id = "T2"
stride = "S"
threat = "A false certificate is offered for Ana, so the bank seals to the wrong key"
where = "`Certificates.selfSigned`, `CmsEnvelope.seal`"
control = "None in this project: a self-signed certificate proves nothing"
residual = "Certificates signed by a trusted authority, in the next modules, answer this"

[[threat]]
id = "T3"
stride = "I"
threat = "The easy call picks the older PKCS#1 v1.5 padding for the key"
where = "`CmsEnvelope.seal(cert, data, false)`"
control = "Ask for RSA-OAEP by name, which is the default in `seal(cert, data)`"
residual = "Another developer can still call the easy form, so a code review should look for it"

[[threat]]
id = "T4"
stride = "E"
threat = "Registering Bouncy Castle changes which algorithms every library in the JVM gets"
where = "`Providers`"
control = "Register once, on purpose, and name the provider where it is used"
residual = "Other libraries in the same JVM still see the provider"

[[threat]]
id = "T5"
stride = "T"
threat = "A vulnerable version of the library stays in use"
where = "the dependency on bcprov and bcpkix"
control = "The versions are pinned, and updating them is a routine task"
residual = "A large library has a large history of fixes, so updates need testing against another program, as the OpenSSL check does"

[[threat]]
id = "T6"
stride = "T"
threat = "An envelope is changed in transit, and AES-CBC does not notice"
where = "`CmsEnvelope`"
control = "A changed envelope never opens to the original statement, but may open to garbage"
residual = "Use an authenticated envelope, or sign the envelope, to be sure to detect changes"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code: nine small classes."""

[[class]]
name = "BouncyCastleDemo"
what = "runs the six acts"
[[class.part]]
title = "the six acts"
code = """
KeyPair ana = newKeyPair();                        // fresh RSA keys, 2048 bits
act1Pem(out, ana);
act2PrivateKey(out, ana);
X509Certificate cert = act3Certificate(out, ana);
byte[] envelope = act4Envelope(out, ana, cert);
act5ByHand(out, ana, cert, envelope);
act6Bill(out, cert);
"""
speech = """Bouncy Castle demo runs the six acts, with one key pair for Ana. [[slnc 300]] The certificate of act three addresses the envelope that act five opens by hand."""

[[class]]
name = "Pem"
what = "keys and certificates as PEM text"
[[class.part]]
title = "writing PEM, and locking the private key"
code = """
var encryptor = new JceOpenSSLPKCS8EncryptorBuilder(PKCS8Generator.AES_256_CBC)
        .setProvider(Providers.BC).setPassword(password).build();
return write(new JcaPKCS8Generator(key, encryptor));
...
try (JcaPEMWriter writer = new JcaPEMWriter(out)) {
    writer.writeObject(object);                    // BEGIN line, Base64, END line
"""
speech = """P E M writes keys as text with the library's writer. [[slnc 300]] To lock a private key, it adds an A E S encryptor with a password."""

[[class]]
name = "Base64Steps"
what = "Base64 by hand"
[[class.part]]
title = "three bytes, four groups"
code = """
int bits = (b1 & 0xff) << 16 | (b2 & 0xff) << 8 | (b3 & 0xff);  // 24 bits
return new int[] {bits >> 18 & 63, bits >> 12 & 63,
        bits >> 6 & 63, bits & 63};
...
out.append(k <= left ? ALPHABET.charAt(g[k]) : '=');
"""
speech = """Base sixty four steps puts three bytes side by side as twenty four bits, and cuts out four groups of six. [[slnc 300]] A test proves it matches the library's text."""

[[class]]
name = "Certificates"
what = "a self-signed X.509 certificate"
[[class.part]]
title = "build and sign"
code = """
X500Name name = new X500Name("O=Example Bank customer, CN=" + commonName);
X509v3CertificateBuilder builder = new JcaX509v3CertificateBuilder(
        name, BigInteger.ONE, Date.from(NOT_BEFORE),
        Date.from(NOT_AFTER), name, keys.getPublic());  // issuer, subject
...
ContentSigner signer = new JcaContentSignerBuilder("SHA256withRSA")
        .setProvider(Providers.BC).build(keys.getPrivate());
"""
speech = """Certificates passes the same name twice, as issuer and subject, then signs with Ana's own private key. [[slnc 300]] That is self-signed."""

[[class]]
name = "CmsEnvelope"
what = "seals and opens a CMS envelope"
[[class.part]]
title = "seal: OAEP by name, AES-256 for the data"
code = """
PKCSObjectIdentifiers.id_RSAES_OAEP,                // the careful call
new OAEPParameterSpec("SHA-256", "MGF1",
        MGF1ParameterSpec.SHA256, PSource.PSpecified.DEFAULT));
...
info = new JceKeyTransRecipientInfoGenerator(recipient)
        .setProvider(Providers.BC);                  // the easy call
...
new JceCMSContentEncryptorBuilder(CMSAlgorithm.AES256_CBC)
        .setProvider(Providers.BC).build());
"""
speech = """C M S envelope is the heart of the code. [[slnc 300]] The careful call names O A E P. [[slnc 300]] The easy call names nothing, and gets the older padding. [[slnc 300]] The data is encrypted with A E S two fifty six."""

[[class]]
name = "EnvelopeSteps"
what = "opens the envelope by hand, with the JDK"
[[class.part]]
title = "unlock the key, decrypt, remove the padding"
code = """
Cipher rsa = Cipher.getInstance("RSA/ECB/OAEPPadding", "SunJCE");
...
byte[] dataKey = rsa.doFinal(parts.lockedKey());     // 256 bytes in, 32 out
Cipher aes = Cipher.getInstance("AES/CBC/NoPadding", "SunJCE");
aes.init(Cipher.DECRYPT_MODE, new SecretKeySpec(dataKey, "AES"),
        new IvParameterSpec(parts.iv()));
byte[] padded = aes.doFinal(parts.cipherText());
int pad = padded[padded.length - 1];                 // how many to drop
"""
speech = """Envelope steps uses the J D K's own ciphers. [[slnc 300]] R S A unlocks the A E S key. [[slnc 300]] A E S decrypts, keeping the padding so we can see it. [[slnc 300]] The last byte says how much to drop."""

[[class]]
name = "OpenSsl"
what = "the independent check"
[[class.part]]
title = "run openssl cms -decrypt"
code = """
return run(List.of("openssl", "cms", "-decrypt", "-inform", "DER",
        "-in", envelope.toString(), "-inkey", key.toString(),
        "-recip", cert.toString()), dir);
"""
speech = """Open S S L writes the three files to a temporary folder, and runs the openssl command on them."""

[[class]]
name = "Providers"
what = "registers Bouncy Castle once"
[[class.part]]
title = "a global registration"
code = """
static final Provider BC = new BouncyCastleProvider();
...
if (Security.getProvider(BC.getName()) == null) {
    Security.addProvider(BC);                      // seen by the whole program
"""
speech = """Providers registers Bouncy Castle once. [[slnc 300]] The whole program sees it, so every call names the provider."""

[[class]]
name = "Hex"
what = "text to bytes, and back"
[[class.part]]
title = "helpers"
code = """
return text.getBytes(StandardCharsets.UTF_8);
...
return new String(bytes, StandardCharsets.UTF_8);
"""
speech = """And Hex holds two helpers, text to bytes and back."""

