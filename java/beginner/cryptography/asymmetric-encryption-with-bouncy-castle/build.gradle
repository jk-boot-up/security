plugins {
    id 'java'
    id 'application'
}

group = 'com.jk.explore.security'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.bouncycastle:bcprov-jdk18on:1.86'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.86'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.jk.explore.security.asymmetricbc.BouncyCastleDemo'
}

// `./gradlew test` needs nothing installed. Tests tagged "openssl" run the openssl command-line tool as an independent
// check, and need openssl 3 on the PATH: run them with `./gradlew integrationTest`.
test {
    useJUnitPlatform {
        excludeTags 'openssl'
    }
}

tasks.register('integrationTest', Test) {
    description = 'Runs the tests that call the openssl command-line tool.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'openssl'
    }
    shouldRunAfter test
}
