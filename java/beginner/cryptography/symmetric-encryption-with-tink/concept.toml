[readme]
intro = """
The plain version of this lesson used AES-GCM straight from the JDK, and showed how many things the caller must get right: the
mode, the nonce, the format of the stored message, and the key. **Tink**, a library from Google, takes most of those decisions away. Its
**Aead** primitive has two calls, `encrypt` and `decrypt`, and nothing else to configure: it chooses a fresh nonce every time, lays out the
message, and refuses to offer unsafe modes. Its keys live in a **keyset**, a list of keys of which one is *primary*. New messages use the primary key, and every key in the
keyset can still open its old messages. That makes **rotation** simple: add a new key, make it primary, and later remove the old one.

The demo runs the same online bank as the plain project, with the same statement line, in five acts: one call and no nonce, any change refused,
rotating the key, keeping the keys safe with envelope encryption, and what Tink does not do for you.
"""
analogy = """
Think of a lock box maker who is also a careful advisor. You do not choose the lock, the combination or the seal. The maker fits a fresh combination to
every box, stamps on it which key opens it, and does not sell the models that are known to be weak. When you want new keys, you do not rebuild the
boxes: the maker keeps a key ring, adds a new key, and the old boxes still open with the old ones until you take them off the ring.
"""
scenario = """
The online bank from the plain project stores a statement line, `RENT -1200`, for the account ANA-1. It now encrypts with Tink. The demo seals the line twice, flips a
bit, moves a message to another account, adds a second key to the keyset and removes the first, wraps each message's data key with a master key, and ends by listing
what remains the bank's job.
"""
costs = [
    "**A library and its dependency.** Tink brings a protocol buffer library with it, and a recent JDK warns about the unsafe memory access that library uses.",
    "**A format of its own.** A message starts with five bytes naming the key, then Tink's nonce, cipher text and tag. Another library cannot read it without Tink, or without code that knows the layout.",
    "**The master key still needs a safe home.** Envelope encryption moves the problem to the master key, which should live in a key management service or a hardware module and never be read by the application.",
    "**Whole-keyset storage is on its way out.** Tink 1.24 deprecates its functions for writing a secret keyset, in favour of keys held in a key management service, so this project does not store keysets and wraps data keys instead.",
    "**Lengths still show,** and a lost keyset is lost data.",
]
too_much = """
For one small value in one program, the JDK's AES-GCM and a careful nonce is enough. As soon as there are many messages, several programs, or any need to replace keys, a library that
makes the safe choice the only choice is worth its weight. Tink is one such library, and libsodium is another.
"""
met_before = [
    "Tink's `Aead` in Android and server code at Google and elsewhere, and its cousins `DeterministicAead`, `Mac` and `PublicKeySign`.",
    "Key rotation in cloud key management services, which use the same primary and old keys idea.",
    "A stored value that begins with a small version byte and a key id, before the nonce.",
    "Libraries that do not let you pick ECB, or reuse a nonce, because the API has no place to put one.",
]
where = """
This project is the third in [cryptography](..), the library version of [symmetric-encryption](../symmetric-encryption).
"""
twin = """
The keyset is built from fixed key bytes so every run prints the same text, and its Base64 form is in the source. A real keyset is made with `generateNew`,
which picks a random key and a random key id, and must never be written in the clear. The master key stands in for a key management service, and the envelope is written with Tink's primitives. Tink's nonces are random,
so the demo prints facts that do not depend on them: whether two messages are equal, their length, and the five-byte start that names the key. Tink 1.24 deprecates its
functions for storing a keyset, so the demo never stores one.
"""
test_note = "Every line the demo prints is checked against `docs/expected-output.txt`. Tink's nonces are random, so the demo and the tests check lengths, equality and key ids, never the random bytes themselves."

[[act]]
title = "One call, and no nonce to look after"
summary = "Sealing the same line twice gives different bytes, the message starts with 01000003e9 (version 1, key id 1001), and 16 bytes become 49."
detail = """
Tink's Aead has one call to seal and one to open. The bank seals the line RENT -1200 twice, and the two results are different: Tink picked a new nonce each time, and the
caller never saw one. The message starts with five bytes, 01000003e9: the version, 1, and the key id, 1001, so Tink knows which key to open it with. The 16-byte line becomes
49 bytes: 5 for the key id, 12 for the nonce and 16 for the tag. Opened with the right key and account, the line comes back.
"""
speech = """
First demo: one call, and no nonce to look after. [[slnc 400]] Tink's A E A D primitive has one call to seal, and one to open. [[slnc 600]]
The bank seals the same line twice, and the results are different. [[slnc 300]] Tink picked a new nonce each time, and the caller never saw one. [[slnc 600]]
The message starts with five bytes. [[slnc 300]] A version, one, and the key's number, one thousand and one. [[slnc 300]] So Tink knows which key opens it. [[slnc 600]]
Sixteen bytes become forty nine. [[slnc 300]] Five for the key number, twelve for the nonce, and sixteen for the tag. [[slnc 300]] Opened with the right key and account, the line comes back.
"""
rows = { aead = "active ok" }
console = [
    ["the same line sealed twice gives the same bytes: false  <- TINK PICKS A NEW NONCE", "ok"],
    ["the stored message starts with 01000003e9: version 1, then key id 1001", "muted"],
    ["16 bytes seal to 49 bytes: 5 for the key id, 12 for the nonce, 16 for the tag", "muted"],
    ["opened with the right key and account: RENT      -1200", "ok"],
]

[[act]]
title = "Any change is refused"
summary = "A flipped bit, a message moved to another account, and a different key of the same id are all refused."
detail = """
Tink's messages are authenticated, as the plain version's were. Flip one bit of a sealed message and opening it fails. Move the message to another account, which changes the associated
data, and it fails. Open it with a different key that has the same key id, and it fails too, because the tag does not fit. In every case the caller gets an exception, and the demo reports a refusal.
"""
speech = """
Second demo: any change is refused. [[slnc 400]] Tink's messages are authenticated, like the ones in the plain version. [[slnc 600]]
Flip one bit of a sealed message, and it will not open. [[slnc 300]] Move it to another account, which changes the associated data, and it will not open. [[slnc 300]] Try a different key that has the same number, and it will not open either. [[slnc 600]]
In every case, the caller gets an exception, and the bank reports a refusal.
"""
rows = { aead = "active ok" }
console = [
    ["one bit of the message is flipped: refused  <- DETECTED", "ok"],
    ["the message is moved to another account: refused  <- DETECTED", "ok"],
    ["opened with a different key of the same id: refused", "ok"],
]

[[act]]
title = "Replacing the key without losing the data"
summary = "Adding a new primary key gives a keyset of 2 keys; old messages still open, new messages use the new key id, and removing the old key makes old messages unreadable."
detail = """
Keys should be replaced from time to time. In Tink, the keyset holds several keys and one is primary. The bank adds a new key and makes it primary, so the keyset holds 2 keys. A message sealed before the
change still opens, because the old key is still in the keyset. A new message starts with a different key id. When the old key is later removed from the keyset, old messages can no longer be opened, but
new ones can. That is why re-encrypting old messages with the new key must happen before the old key is removed.
"""
speech = """
Third demo: replacing the key without losing the data. [[slnc 400]] Keys should be replaced from time to time. [[slnc 600]]
In Tink, the keyset holds several keys, and one is called primary. [[slnc 300]] The bank adds a new key, and makes it primary. [[slnc 300]] The keyset now holds two keys. [[slnc 600]]
A message sealed before the change still opens, because the old key is still in the keyset. [[slnc 300]] A new message starts with a different key number. [[slnc 600]]
Later, the old key is removed. [[slnc 300]] Old messages can no longer be opened, but new ones can. [[slnc 300]] So old messages must be re-encrypted with the new key, before the old key is removed.
"""
rows = { rotate = "active ok" }
console = [
    ["a new key is added and made primary: the keyset now holds 2 keys", "ok"],
    ["a message sealed before the change still opens: RENT      -1200", "ok"],
    ["a new message starts with a different key id: true", "ok"],
    ["the old key is removed from the keyset: refused for old messages, RENT      -1200 for new ones", "amber"],
]

[[act]]
title = "Keys that stay at home: envelope encryption"
summary = "Each message gets its own data key, wrapped by a master key that is used once per message, 3 times for 3 messages of any size; a different master key is refused, and the master key's bytes are never stored."
detail = """
The keys have to live somewhere, and the best place is one that the application never reads. In envelope encryption, each message is sealed with its own fresh data key, and only that small key goes to the master key to be wrapped.
In a real system the master key sits in a key management service or a hardware module and never leaves it. Here it is another Tink key standing in for it. A 16-byte line becomes 113 bytes: a length, the wrapped data key,
then the cipher text. Two messages carry different wrapped keys. The master key was used 3 times for two short lines and a 100,000-byte statement: once each, whatever the size. Opened with the master key, the messages come back.
With a different master key, they are refused, and the master key's own bytes never appear in a stored message. Tink's functions for writing out a whole keyset are deprecated in this version, so the project wraps data keys
instead of storing keysets.
"""
speech = """
Fourth demo: keys that stay at home. [[slnc 400]] The keys have to live somewhere, and the best place is one that the application never reads. [[slnc 600]]
In envelope encryption, each message is sealed with its own fresh data key. [[slnc 300]] And only that small key goes to the master key, to be wrapped. [[slnc 300]] In a real system, the master key sits in a key management service, or a hardware module, and never leaves it. [[slnc 600]]
A sixteen byte line becomes a hundred and thirteen bytes. [[slnc 300]] A length, the wrapped data key, and the cipher text. [[slnc 300]] Two messages carry different wrapped keys. [[slnc 600]]
The master key is used once for each message. [[slnc 300]] Three times, for two short lines, and a hundred thousand byte statement. [[slnc 300]] Whatever the size. [[slnc 600]]
With the master key, the messages open. [[slnc 300]] With a different master key, they are refused. [[slnc 300]] And the master key's own bytes never appear in a stored message.
"""
rows = { master = "active ok" }
console = [
