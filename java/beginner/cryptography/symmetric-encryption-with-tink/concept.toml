[[act]]
title = "Replacing the key without losing the data"
summary = "Adding key 1002 as primary gives a keyset of 2 keys; old messages still open, new ones start 01000003ea, and removing key 1001 makes old messages unreadable."
detail = """
Keys should be replaced from time to time. Before rotation, the keyset holds key 1001, and a message sealed with it starts 01000003e9. The bank adds key 1002 and makes it primary:
the keyset holds key 1001 and key 1002, new messages start 01000003ea, and both old and new messages open. When key 1001 is removed, old messages are refused and new ones still open,
so old messages must be re-encrypted with the new key before the old key is removed. The demo uses a fixed new key id so the output repeats; real code uses a random one.
"""
figure = "rotation"
figure_title = "Rotating a key in the keyset"
figure_speech = """
Fourth demo: replacing the key, without losing the data. [[slnc 400]] Before rotation, the keyset holds one key, number one thousand and one. [[slnc 300]] An old message is sealed with it, and starts with e nine. [[slnc 600]]
After rotation, the bank adds key one thousand and two, and makes it primary. [[slnc 300]] Primary means new messages use it. [[slnc 300]] New messages now start with e a, the new number. [[slnc 300]] And both old and new messages still open, because both keys are in the ring. [[slnc 600]]
Then the old key is removed. [[slnc 300]] New messages still open. [[slnc 300]] But old ones are refused. [[slnc 500]] So, re encrypt the old messages with the new key, before you remove the old one.
"""
speech = """
The output, in three sections. [[slnc 300]] Before rotation, one key. [[slnc 300]] After rotation, two keys, and both messages open. [[slnc 300]] After removing the old key, only the new message opens.
"""
rows = { rotate = "active ok", keyset = "active ok" }
console = [
    ["BEFORE ROTATION:", "ok"],
    ["  keyset       key 1001 (primary)", "muted"],
    ["  old message  starts 01000003e9", "muted"],
    ["AFTER ROTATION (key 1002 added and made primary):", "bad"],
    ["  keyset       key 1001, key 1002 (primary)", "muted"],
    ["  new message  starts 01000003ea", "muted"],
    ["  old message opens: RENT      -1200", "muted"],
    ["  new message opens: RENT      -1200", "muted"],
    ["AFTER REMOVING KEY 1001:", "bad"],
    ["  keyset       key 1002 (primary)", "muted"],
    ["  old message opens: refused  <- RE-ENCRYPT FIRST", "ok"],
    ["  new message opens: RENT      -1200", "muted"],
]

[[act]]
title = "Keys that stay at home: envelope encryption"
summary = "Each message gets its own data key, wrapped by the master key: 16 bytes become 113 = 4 + 65 + 44; the master key is used once per message and its bytes are never stored."
detail = """
The keys have to live somewhere the application never reads. In envelope encryption each message gets a fresh 32-byte data key; the line is sealed with it, and only the data key goes to the
master key (key id 2001, standing in for a KMS) to be wrapped. A 16-byte line becomes 113 bytes: a 4-byte length, 00000041 = 65; the wrapped key, 65 = 5 + 12 + 32 + 16, starting 01000007d1;
and the cipher text, 44 = 12 + 16 + 16, with no key id. Two messages carry different wrapped keys; the master key was called 3 times, once per message, for two lines and a 100000-byte statement; another master key is refused,
and the master key's own bytes never appear in a message. Tink 1.24 deprecates writing out a whole secret keyset, so the project wraps data keys instead.
"""
figure = "envelope"
figure_title = "Envelope encryption: a key per message"
figure_speech = """
Fifth demo: keys that stay at home. [[slnc 400]] The best place for a key is one the application never reads. [[slnc 600]]
Before encryption, there are three things. [[slnc 300]] The line. [[slnc 300]] A data key: thirty two random bytes, new for every message. [[slnc 300]] And the master key, which in a real bank lives inside a key management service. [[slnc 600]]
The line is sealed with the data key. [[slnc 300]] Then only the data key goes to the master key, to be wrapped. [[slnc 600]]
After encryption, the bank stores a hundred and thirteen bytes. [[slnc 300]] Four bytes of length. [[slnc 300]] Sixty five bytes of wrapped key: Tink's five byte start, a nonce, the thirty two byte key, and a tag. [[slnc 300]] And forty four bytes of cipher text: nonce, line, and tag. [[slnc 500]] Four, plus sixty five, plus forty four: a hundred and thirteen.
"""
speech = """
The output. [[slnc 300]] Before encryption: the line, the data key, and the master key. [[slnc 400]] After encryption: the length, the wrapped key, and the cipher text, with their sums. [[slnc 300]] A hundred and thirteen bytes.
[[page]]
Two messages carry different wrapped keys. [[slnc 300]] The master key was called three times, once per message, even for a hundred thousand byte statement. [[slnc 300]] With the master key, they open. [[slnc 300]] With another master key, refused. [[slnc 300]] And the master key's own bytes are never stored.
"""
rows = { master = "active ok" }
console = [
