[poster]
headline = [["SYMMETRIC ENCRYPTION", "text"], ["WITH TINK", "accent"]]
taglines = [["A library that chooses the nonce, the mode and the format", "gold"]]
before = { code = "AES/GCM, my own nonce", note = "one slip breaks it", tag = "BEFORE" }
after = { code = "aead.encrypt(text, aad)", note = "nonce and layout picked for you", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "Symmetric Encryption with Google Tink"
narration = """Hello, and welcome. [[slnc 400]] This video explains symmetric encryption with Google Tink, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] Symmetric encryption uses one secret key to lock and unlock data. [[slnc 300]] Tink is a library from Google that makes this one safe call. [[slnc 300]] It picks the nonce, the mode, and the stored layout for you, and does not offer the unsafe choices. [[slnc 600]] Think of a lock box maker who is also a careful advisor. [[slnc 300]] You do not choose the lock, the combination, or the seal. [[slnc 300]] The maker fits a fresh combination to every box, and stamps on it which key opens it. [[slnc 300]] When you want new keys, you do not rebuild the boxes. The maker keeps a key ring, and adds a new key to it. [[slnc 700]] In this video, the domain is an online bank, and the same statement line as in the plain version. [[slnc 500]] By the end, you will hear what the library takes over, and what it leaves to you."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["The online bank, the same statement line.", "", "RENT -1200, for the account ANA-1.", "", "Several services will encrypt statements.", "Keys must be replaced without losing data."]
narration = """Here is the scenario. [[slnc 400]] It is the online bank from the plain version, with the same statement line. [[slnc 500]] Rent, minus twelve hundred, for the account Ana one. [[slnc 600]] Several services will encrypt statements. [[slnc 300]] And the bank wants to replace keys on a schedule, without losing old data, and without relying on every developer to remember the rules about nonces and modes."""

[[scene]]
key = "03-parts"
kind = "bullets"
title = "The Parts of Tink"
body = ["Aead: encrypt and decrypt", "Keyset: a list of keys, one primary", "Key id: five bytes at the start of a message", "Master key: wraps each message's data key"]
narration = """Before the demos, the parts of Tink. [[slnc 500]] The A E A D primitive has two calls, encrypt and decrypt. [[slnc 500]] A keyset is a list of keys, of which one is primary. [[slnc 500]] The key id is five bytes at the start of every message, so Tink knows which key opens it. [[slnc 500]] And a master key wraps the data key of each message."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "09-mapping"
kind = "bullets"
title = "Plain Version, Tink Version"
body = ["GcmBox  ->  the Aead primitive", "NonceSource  ->  inside Tink", "Sealed (nonce, cipher text, tag)  ->  one byte array", "The key  ->  a keyset, with rotation", "EcbCipher  ->  not offered"]
narration = """Let's match the two versions. [[slnc 400]] The G C M box in the plain version is Tink's A E A D primitive. [[slnc 500]] The nonce source is inside Tink, so the code never sees a nonce. [[slnc 500]] The sealed record, with its nonce, cipher text, and tag, is one byte array. [[slnc 500]] The single key is now a keyset, which can be rotated. [[slnc 500]] And the E C B cipher, which the plain version showed as a mistake, is simply not offered."""

[[scene]]
key = "10-roles"
kind = "bullets"
title = "Who Does What"
body = ["Bank: wraps Tink's Aead", "DemoKeysets: fixed keysets for repeatable output", "KeysetHandle: the keys, one primary", "TinkDemo: the five acts"]
narration = """Here is who does what in the code. [[slnc 400]] The bank class wraps Tink's A E A D, with a seal call and an open call. [[slnc 500]] Demo keysets builds fixed keysets, so every run prints the same text. [[slnc 500]] The keyset handle is Tink's own class, holding the keys, one of them primary. [[slnc 300]] And the demo runs the five acts."""

[[scene]]
key = "11-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["KeysetHandle and Aead in Java code", "A version and key id before the nonce", "Key rotation in cloud key services", "Libraries with no nonce to choose"]
narration = """You have probably met this already. [[slnc 400]] Keyset handle and A E A D appear in a great deal of Java code at Google, and elsewhere. [[slnc 500]] Many stored values begin with a version and a key number, before the nonce. [[slnc 500]] Cloud key services talk about a primary key version, and older ones, which is the same idea. [[slnc 500]] And a library that has no place to put a nonce, is a library that cannot reuse one."""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["A vetted library, not hand-written AES-GCM", "One Aead per purpose, with associated data", "Rotate keys; re-encrypt before removing old ones", "Data keys wrapped by a master key in a KMS"]
narration = """So, how do you use it? [[slnc 400]] Prefer a vetted library to hand written A E S G C M. [[slnc 500]] Use one A E A D for each purpose, and bind messages to context with associated data. [[slnc 500]] Rotate keys on a schedule, and re encrypt old messages before you remove the old key. [[slnc 500]] And wrap data keys with a master key that lives in a key management service."""

[[scene]]
key = "13-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a third key", "and see which messages still open."]
narration = """That's symmetric encryption with Tink. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] A good library makes the safe choice the only choice, but the key still needs a safe home. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine, with nothing installed except a Java development kit. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a third key to the keyset, and see which messages still open. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
An online bank's use of Google's Tink to encrypt statement lines: the Aead primitive, the keyset with its primary key, key rotation, and envelope encryption under a master key. It covers a thief who reads a disk,
one who changes a message, and the loss or exposure of keys. It does not cover who may ask for a statement, or the key management service that should hold the master key.
"""
assets = [
    "The contents and integrity of each statement line.",
    "The keyset: every key that can open stored messages.",
    "The master key that wraps every data key.",
    "The record of which key id made which message.",
]
actors = [
    "The bank's services, which seal and open messages.",
    "A thief who copies disks, backups or the stored keyset.",
    "An attacker who changes or moves stored messages.",
    "An operator who rotates keys, and may remove one too early.",
]
boundaries = [
    "Application to disk: messages leave as key id, nonce, cipher text and tag.",
    "Application to the master key: only a 32-byte data key is ever sent to be wrapped or unwrapped.",
    "Master key to key management service: the line that should hold the master key.",
]
assumptions = [
    "The attacker does not have the keyset or the master key.",
    "Tink and its dependency are kept up to date.",
    "In the demo, keysets are built from fixed public bytes, and the master key is another demo key. Real keysets come from `generateNew`.",
]
out_of_scope = [
    "Hardware security modules and cloud key management services.",
    "Who is allowed to ask for a decrypted statement.",
    "Other Tink primitives: signatures, MACs and hybrid encryption.",
]
tests = [
    "`TinkAeadTest` checks nonce freshness, the five-byte start, the 33-byte overhead, and refusal for changed, moved and wrongly keyed messages.",
    "`KeysetTest` checks rotation, removal of an old key, the encrypted keyset file and the missing ECB template.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next project, asymmetric-encryption, tackles what both versions leave open: how two parties who have never met agree on a key at all.
"""

[[threat]]
id = "T1"
stride = "I"
threat = "A thief reads statements from a disk or a backup"
where = "stored messages"
control = "Tink's AES-GCM hides the contents; the keyset is kept apart from the messages"
residual = "Message lengths show, and a thief who also gets the keyset reads everything"

[[threat]]
id = "T2"
stride = "T"
threat = "Someone changes a message, or moves it to another account"
where = "`Bank.openOrNull`"
control = "The tag covers the cipher text and the associated data, so a change or a move is refused"
residual = "A valid old message can be put back for the same account"

[[threat]]
id = "T3"
stride = "I"
threat = "A developer picks a weak mode or reuses a nonce"
where = "the `Aead` API"
control = "Tink has no place to put a nonce and offers no ECB template"
residual = "A developer can still choose a weak primitive elsewhere, or build a key from a weak password"

[[threat]]
id = "T4"
stride = "I"
threat = "The keyset is read from disk or from a backup"
where = "the stored keyset"
control = "Each message has its own data key, wrapped by a master key; no keyset is stored by the application"
residual = "The master key now needs a safe home in a key management service or a hardware module"

[[threat]]
id = "T5"
stride = "D"
threat = "A key is removed too early, and old messages can no longer be opened"
where = "keyset rotation"
control = "Add the new key first, make it primary, re-encrypt, and only then remove the old key"
residual = "A mistake in the order loses data, so the steps need a runbook and a backup"

[[threat]]
id = "T6"
stride = "R"
threat = "A message cannot be traced to the key that made it"
where = "the five-byte start of each message"
control = "The key id at the start of every message names the key"
residual = "It names the key, not the person or service that used it"
