bold = "Google's Tink library gives one safe call for encryption, picks the nonce and the layout for you, keeps keys in a keyset that can be rotated, and leaves out the unsafe choices, but the keyset still needs a safe place to live."
domain = "an online bank"
domain_note = ""
youtube_description = """Symmetric encryption with Google Tink, in Java: a library designed so that the easy way is the safe way. Explained with an online bank's account statements, like a lock box maker who picks the lock, the combination and the tamper seal for you, and offers no unsafe models. We seal a statement line with one call and watch Tink pick a fresh nonce each time, see a flipped bit and a moved message refused, rotate the key without losing old data, store the keyset encrypted under a master key, and finish with the bill: the format is Tink's own, it adds a library, and the master key still has to live somewhere."""
thumb_lines = ["SYMMETRIC", "ENCRYPTION + TINK"]
