[[act]]
title = "The bill: what Tink decides, and what it does not"
summary = "Tink offers authenticated templates and no ECB one, but every message is 33 bytes longer, the format is Tink's own, it adds a library, and the master key needs a home."
detail = """
Tink makes the safe choice the only one on the menu: its AEAD templates include AES128_GCM, AES256_GCM, CHACHA20_POLY1305 and XCHACHA20_POLY1305, among others, and an ECB template is not offered.
What it leaves to the bank: lengths still show: 16 bytes become 49 and 100000 become 100033, always 33 more (5 + 12 + 16); the stored format is Tink's own, so other libraries need Tink to read it;
it adds a library and its protocol buffer dependency; and the master key still has to live somewhere.
"""
figure = "menu"
figure_title = "The bill"
figure_speech = """
Sixth demo: the bill. [[slnc 400]] On the left, the menu. [[slnc 300]] Tink's templates are all authenticated, such as A E S G C M, and ChaCha twenty. [[slnc 300]] And E C B is simply not offered. [[slnc 600]]
On the right, what Tink leaves to you. [[slnc 300]] Sizes still show. [[slnc 300]] Sixteen bytes become forty nine, and a hundred thousand become a hundred thousand and thirty three. [[slnc 300]] Always thirty three more: the five byte start, the nonce, and the tag. [[slnc 500]] The format is Tink's own, so another program needs Tink to read it. [[slnc 300]] It is one more library to keep up to date. [[slnc 300]] And the master key still needs a safe home.
"""
speech = """
The output. [[slnc 300]] The menu: four of Tink's templates, and an E C B template, not offered. [[slnc 400]] Then what it leaves to you: the sizes, the format, the library, and the master key.
"""
