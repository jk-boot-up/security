[spec]
purpose = """
Teach what a safe encryption library does by repeating the plain symmetric-encryption story with Google's Tink: one call, key rotation, envelope encryption under a master key, and a clear list of what is still the caller's job.
"""
nongoals = [
    "Tink's other primitives: signatures, MACs and hybrid encryption.",
    "Key management services: the master key is a second demo keyset.",
    "Android or Google Cloud specifics.",
]
problem = """
Learners who have seen the plain version need to see how a library removes its sharp edges, and which edges remain.
"""
roles = [["The bank's encryption", "`Bank`"], ["Fixed keysets for the demo", "`DemoKeysets`"], ["Entry point", "`TinkDemo`"]]
requirements = [
    "Sealing the same data twice gives different bytes, and each message starts with the key's version and id.",
    "A changed bit, a moved message and a wrong key are all refused.",
    "After rotation, old messages open and new ones use the new key; after removal, old ones do not open.",
    "A keyset written encrypted does not contain the key bytes and reads back only with the master key.",
    "The demo output equals `docs/expected-output.txt` on every run.",
]

[[diagram]]
name = "architecture-diagram"
kind = "flow"
title = "Sealing with Tink"
caption = "The bank gives Tink a line and the associated data; Tink takes the primary key from the keyset, picks a nonce, and returns one stored message."
nodes = [
    { id = "bank", label = "The bank", sub = "seal(account, line)", col = 0, row = 0, colour = "client" },
    { id = "aead", label = "Aead", sub = "encrypt, decrypt", col = 1, row = 0, colour = "green", shape = "ellipse" },
    { id = "keyset", label = "Keyset", sub = "keys, one primary", col = 1, row = 1, colour = "accent", shape = "store" },
    { id = "message", label = "Stored message", sub = "key id, nonce, cipher text, tag", col = 2, row = 0, colour = "accent", shape = "store" },
    { id = "master", label = "Master key", sub = "wraps each data key", col = 2, row = 1, colour = "amber", shape = "store" },
]
edges = [
    { from = "bank", to = "aead" },
    { from = "keyset", to = "aead", label = "primary key" },
    { from = "aead", to = "message" },
    { from = "master", to = "aead", label = "wraps data keys", dashed = true },
]

[[diagram]]
name = "class-diagram"
kind = "class"
title = "The pieces of the demo"
caption = "The demo is small because Tink does the work: Bank wraps an Aead, and DemoKeysets builds fixed keysets for repeatable output."
nodes = [
    { id = "bank", label = "Bank", sub = ["seal(associatedData, plaintext)", "openOrNull(associatedData, sealed)", "aead()"], col = 1, row = 0, colour = "accent" },
    { id = "aead", label = "Aead (Tink)", sub = ["encrypt(plaintext, aad)", "decrypt(ciphertext, aad)"], col = 2, row = 0, colour = "green" },
    { id = "keyset", label = "KeysetHandle (Tink)", sub = ["getPrimary()", "size()", "getPrimitive(...)"], col = 2, row = 1, colour = "green" },
    { id = "demo", label = "DemoKeysets", sub = ["aes256Gcm(keyId, keyText)", "keyBase64(keyText)"], col = 1, row = 1, colour = "client" },
    { id = "tink", label = "TinkDemo", sub = ["run()"], col = 0, row = 0, colour = "client" },
    { id = "layout", label = "TinkLayout", sub = ["prefix(keyId)", "seal(key, keyId, nonce, aad, text)", "split(message)"], col = 0, row = 1, colour = "amber" },
]
edges = [
    { from = "bank", to = "aead", label = "uses" },
    { from = "bank", to = "keyset", label = "built from" },
    { from = "demo", to = "keyset", label = "makes" },
    { from = "tink", to = "bank", label = "drives" },
    { from = "tink", to = "layout", label = "builds act two with" },
]

[[diagram]]
name = "data-flow-diagram"
kind = "flow"
title = "What is inside a stored message"
caption = "Five bytes name the key, then Tink's nonce, the cipher text and the tag."
nodes = [
