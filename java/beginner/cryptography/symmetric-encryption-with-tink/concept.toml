[poster]
headline = [["SYMMETRIC ENCRYPTION", "text"], ["WITH TINK", "accent"]]
taglines = [["A library that chooses the nonce, the mode and the format", "gold"]]
before = { code = "AES/GCM, my own nonce", note = "one slip breaks it", tag = "BEFORE" }
after = { code = "aead.encrypt(text, aad)", note = "nonce and layout picked for you", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "Symmetric Encryption with Google Tink"
narration = """Hello, and welcome. [[slnc 400]] This video explains symmetric encryption with Google Tink, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] Symmetric encryption uses one secret key to lock and unlock data. [[slnc 300]] Tink is a library from Google that makes this one safe call. [[slnc 300]] It picks the nonce, the mode, and the layout of the message for you, and does not offer the unsafe choices. [[slnc 600]] Think of a lock box maker who fits a fresh combination to every box, and stamps on it which key opens it. [[slnc 600]] The domain is an online bank. [[slnc 300]] By the end, you will know what the library takes over, and what it leaves to you."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["The online bank, the same statement line.", "", "RENT -1200, for the account ANA-1.", "", "Several services will encrypt statements.", "Keys must be replaced without losing data."]
narration = """Here is the scenario. [[slnc 400]] An online bank stores a statement line: rent, minus twelve hundred, for the account Ana one. [[slnc 500]] Several services will encrypt statements. [[slnc 300]] And the bank wants to replace keys without losing old data."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["Aead: encrypt and decrypt, nothing to configure", "Keyset: a ring of keys, one primary", "Key id: five bytes at the start of a message", "Nonce: a number used once, picked by Tink", "Master key: wraps each message's data key"]
narration = """Before the demos, the words. [[slnc 500]] Tink's A E A D primitive has two calls, encrypt and decrypt, and nothing to configure. [[slnc 500]] A keyset is a ring of keys, and one of them is primary: new messages use it. [[slnc 500]] The key id is five bytes at the start of every message, so Tink knows which key opens it. [[slnc 500]] A nonce is a number used once, and Tink picks it for you. [[slnc 500]] And a master key wraps the data key of each message."""

[[scene]]
key = "03-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "04-one-line"
kind = "figure"
title = "What Tink does to one line"
body = "one_line"
narration = """Let's start with the core idea, on one line. [[slnc 400]] Before encryption: the statement line, rent, minus twelve hundred. [[slnc 300]] Sixteen bytes, counting the spaces and the end of the line. [[slnc 400]] Next to it, the account it belongs to, which is checked, but not hidden. [[slnc 300]] And a keyset, with key number one thousand and one. [[slnc 600]] The bank makes one call: encrypt, with the line and the account. [[slnc 300]] No nonce to pick, and no mode to choose. [[slnc 600]] After encryption: one message of forty nine bytes. [[slnc 300]] One byte of version, four bytes of key number, a twelve byte nonce, sixteen bytes of cipher text, and a sixteen byte tag. [[slnc 500]] The demos look at each of these parts."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["A vetted library, not hand-written AES-GCM", "One Aead per purpose, with associated data", "Rotate keys; re-encrypt before removing old ones", "Data keys wrapped by a master key in a KMS"]
narration = """So, how do you use it? [[slnc 400]] Prefer a vetted library to hand written A E S G C M. [[slnc 500]] Use one A E A D for each purpose, and bind messages to their context with associated data. [[slnc 500]] Rotate keys on a schedule, and re encrypt old messages before you remove the old key. [[slnc 500]] And wrap data keys with a master key that lives in a K M S."""

[[scene]]
key = "13-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "13-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a third key", "and see which messages still open."]
narration = """That's symmetric encryption with Tink. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] A good library makes the safe choice the only choice, but the key still needs a safe home. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a third key to the keyset, and see which messages still open. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] Six small classes."""

[[class]]
name = "TinkDemo"
what = "runs the six acts"
[[class.part]]
title = "the six acts"
code = """
act1NoNonce(out);
act2ByHand(out);
act3Tamper(out);
act4Rotation(out);
act5Envelope(out);
act6Bill(out);
"""
speech = """Tink demo runs the six acts. [[slnc 300]] A test checks every line it prints."""

[[class]]
name = "Bank"
what = "seals and opens with Tink's Aead"
[[class.part]]
title = "one primitive, two calls"
code = """
this.aead = keyset.getPrimitive(
        RegistryConfiguration.get(), Aead.class);
...
return aead.encrypt(plaintext, associatedData);     // Tink picks the nonce
...
return aead.decrypt(sealed, associatedData);
} catch (GeneralSecurityException e) {              // any change: refused
    return null;
"""
speech = """The bank asks the keyset for an A E A D primitive. [[slnc 300]] Sealing is one call to encrypt, with the line and the account. [[slnc 300]] Opening is one call to decrypt. [[slnc 300]] If anything was changed, Tink throws, and the bank reports refused."""

[[class]]
name = "DemoKeysets"
what = "fixed keysets, so every run prints the same"
[[class.part]]
title = "a keyset with a known key and id"
code = """
String json = "{\\"primaryKeyId\\":" + keyId
        + ",\\"key\\":[{\\"keyData\\":{\\"typeUrl\\":"
...
return CleartextKeysetHandle.read(
        JsonKeysetReader.withString(json));
"""
speech = """Demo keysets builds a keyset from fixed key bytes, so the output repeats. [[slnc 300]] Real code calls generate new, which picks a random key."""

[[class]]
name = "TinkLayout"
what = "builds a Tink message by hand"
[[class.part]]
title = "prefix + nonce + AES-GCM"
code = """
return ByteBuffer.allocate(PREFIX)
        .put((byte) 1).putInt(keyId).array();     // version, key id
...
Cipher cipher = Cipher.getInstance("AES/GCM/NoPadding");
cipher.init(Cipher.ENCRYPT_MODE, new SecretKeySpec(key, "AES"),
        new GCMParameterSpec(TAG * 8, nonce));
cipher.updateAAD(associatedData);               // the account
...
.put(prefix(keyId)).put(nonce).put(cipherTextAndTag).array();
"""
speech = """Tink layout redoes act two by hand. [[slnc 300]] The prefix is the version one, then the key number as four bytes. [[slnc 300]] Then Java's own A E S G C M seals the line with the nonce and the account. [[slnc 300]] Prefix, nonce, cipher text and tag. [[slnc 300]] A test shows Tink opens it, and rebuilds a real Tink message byte for byte."""

[[class]]
name = "EnvelopeAead"
what = "a fresh data key per message, wrapped by the master key"
[[class.part]]
title = "encrypt: wrap, then seal"
code = """
byte[] dataKey = new byte[32];
RANDOM.nextBytes(dataKey);
byte[] wrapped = master.encrypt(dataKey, associatedData);  // 32 bytes
byte[] cipherText = aeadFor(dataKey)
        .encrypt(plaintext, associatedData);
return ByteBuffer.allocate(4 + wrapped.length + cipherText.length)
        .putInt(wrapped.length).put(wrapped).put(cipherText).array();
"""
speech = """Envelope A E A D makes thirty two random bytes, a data key, for every message. [[slnc 300]] The master key wraps only that data key. [[slnc 300]] The data key seals the line. [[slnc 300]] And the stored message is the length, the wrapped key, and the cipher text."""

[[class]]
name = "CountingAead"
what = "counts the master key's calls"
[[class.part]]
title = "one call per message"
code = """
calls++;
return inner.encrypt(plaintext, associatedData);
"""
speech = """Counting A E A D counts the master key's calls: three, for three messages."""

[[acronym]]
short = "AEAD"
long = "Authenticated Encryption with Associated Data"
say = "A E A D is authenticated encryption with associated data: it hides the message, and notices any change to it or to its context."
[[acronym]]
short = "AES"
long = "Advanced Encryption Standard"
say = "A E S is the Advanced Encryption Standard: the cipher itself."
[[acronym]]
short = "GCM"
long = "Galois/Counter Mode"
say = "G C M is Galois Counter Mode: the way A E S is used here, with a nonce and a tag."
[[acronym]]
short = "ECB"
long = "Electronic Codebook (an unsafe mode)"
say = "E C B is Electronic Codebook, an unsafe mode that Tink does not offer."
[[acronym]]
short = "KMS"
long = "Key Management Service"
say = "K M S is a key management service, where a master key lives and is never read out."
[[acronym]]
short = "hex"
long = "hexadecimal: each byte as two digits, 0-9 and a-f"
say = "And hex, short for hexadecimal, writes each byte as two digits, from zero to nine and a to f."

[threatmodel]
scope = """
An online bank's use of Google's Tink to encrypt statement lines: the Aead primitive, the keyset with its primary key, key rotation, and envelope encryption under a master key. It covers a thief who reads a disk,
one who changes a message, and the loss or exposure of keys. It does not cover who may ask for a statement, or the key management service that should hold the master key.
"""
assets = [
    "The contents and integrity of each statement line.",
    "The keyset: every key that can open stored messages.",
    "The master key that wraps every data key.",
    "The record of which key id made which message.",
]
actors = [
    "The bank's services, which seal and open messages.",
    "A thief who copies disks, backups or the stored keyset.",
    "An attacker who changes or moves stored messages.",
    "An operator who rotates keys, and may remove one too early.",
]
boundaries = [
    "Application to disk: messages leave as key id, nonce, cipher text and tag.",
    "Application to the master key: only a 32-byte data key is ever sent to be wrapped or unwrapped.",
    "Master key to key management service: the line that should hold the master key.",
]
assumptions = [
    "The attacker does not have the keyset or the master key.",
    "Tink and its dependency are kept up to date.",
    "In the demo, keysets are built from fixed public bytes, and the master key is another demo key. Real keysets come from `generateNew`.",
]
out_of_scope = [
    "Hardware security modules and cloud key management services.",
    "Who is allowed to ask for a decrypted statement.",
    "Other Tink primitives: signatures, MACs and hybrid encryption.",
]
tests = [
    "`TinkLayoutTest` shows Tink opens the hand-built message and that a real Tink message is rebuilt byte for byte from its parts.",
    "`TinkAeadTest` checks nonce freshness, the five-byte start, the 33-byte overhead, and refusal for changed, moved and wrongly keyed messages.",
    "`KeysetTest` checks rotation, removal of an old key, the encrypted keyset file and the missing ECB template.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next project, asymmetric-encryption, tackles what both versions leave open: how two parties who have never met agree on a key at all.
"""

[[threat]]
id = "T1"
stride = "I"
threat = "A thief reads statements from a disk or a backup"
where = "stored messages"
control = "Tink's AES-GCM hides the contents; the keyset is kept apart from the messages"
residual = "Message lengths show, and a thief who also gets the keyset reads everything"

[[threat]]
id = "T2"
stride = "T"
threat = "Someone changes a message, or moves it to another account"
where = "`Bank.openOrNull`"
control = "The tag covers the cipher text and the associated data, so a change or a move is refused"
residual = "A valid old message can be put back for the same account"

[[threat]]
id = "T3"
stride = "I"
threat = "A developer picks a weak mode or reuses a nonce"
where = "the `Aead` API"
control = "Tink has no place to put a nonce and offers no ECB template"
residual = "A developer can still choose a weak primitive elsewhere, or build a key from a weak password"

[[threat]]
id = "T4"
stride = "I"
threat = "The keyset is read from disk or from a backup"
where = "the stored keyset"
control = "Each message has its own data key, wrapped by a master key; no keyset is stored by the application"
residual = "The master key now needs a safe home in a key management service or a hardware module"

[[threat]]
id = "T5"
stride = "D"
threat = "A key is removed too early, and old messages can no longer be opened"
where = "keyset rotation"
control = "Add the new key first, make it primary, re-encrypt, and only then remove the old key"
residual = "A mistake in the order loses data, so the steps need a runbook and a backup"

[[threat]]
id = "T6"
stride = "R"
threat = "A message cannot be traced to the key that made it"
where = "the five-byte start of each message"
control = "The key id at the start of every message names the key"
residual = "It names the key, not the person or service that used it"
