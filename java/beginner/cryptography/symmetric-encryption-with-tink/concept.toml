[[act]]
title = "Inside one Tink message, worked out by hand"
summary = "The 49 bytes, built by hand with a fixed nonce: version 01, key id 000003e9, 12-byte nonce, 16-byte cipher text and 16-byte tag; Tink opens it."
detail = """
To see inside a message, the program builds one by hand with Java's own AES-GCM and a fixed nonce, 00000000 00000000 00000001 (only for the demo; Tink's nonces are random).
The 49 bytes are: the version, 01; the key id, 000003e9, because 1001 = 3 x 256 + 233 and 233 is e9 in hex; the 12-byte nonce; the 16-byte cipher text
9399a5a1 79f6597f b269750e 0efeb9b6; and the 16-byte tag fd69a8c7 c828ec0f c5f79504 11a6da99. 1 + 4 + 12 + 16 + 16 = 49. Tink opens the hand-built message, so this is exactly its layout.
"""
figure = "by_hand"
figure_title = "Inside one Tink message"
figure_speech = """
Second demo: what is inside those forty nine bytes? [[slnc 400]] The program builds one message by hand, with Java's own A E S G C M. [[slnc 300]] It uses a fixed nonce, the number one, only so the bytes are the same on every run. [[slnc 600]]
Before encryption: the key number, the nonce, the account, and the line. [[slnc 500]] After encryption, part by part. [[slnc 300]] One byte, the version: zero one. [[slnc 300]] Four bytes, the key number. [[slnc 300]] One thousand and one is three times two hundred and fifty six, plus two hundred and thirty three. [[slnc 300]] So the bytes are zero three, and e nine. [[slnc 500]]
Then twelve bytes of nonce. [[slnc 300]] Sixteen bytes of cipher text. [[slnc 300]] And a sixteen byte tag. [[slnc 500]] One, plus four, plus twelve, plus sixteen, plus sixteen: forty nine. [[slnc 400]] And Tink opens this hand made message, so this is exactly its layout.
"""
speech = """
The program's output. [[slnc 300]] Before encryption: the inputs. [[slnc 400]] After encryption: each part on its own line, forty nine bytes in all. [[slnc 300]] And Tink opens it: the same layout.
"""
rows = { aead = "active ok", keyset = "active ok" }
console = [
