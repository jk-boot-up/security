[readme]
intro = """
The plain version of this lesson used AES-GCM straight from the JDK, and showed how many things the caller must get right: the
mode, the nonce, the format of the stored message, and the key. **Tink**, a library from Google, takes most of those decisions away. Its
**Aead** primitive has two calls, `encrypt` and `decrypt`, and nothing else to configure: it chooses a fresh nonce every time, lays out the
message, and refuses to offer unsafe modes. Its keys live in a **keyset**, a list of keys of which one is *primary*. New messages use the primary key, and every key in the
keyset can still open its old messages. That makes **rotation** simple: add a new key, make it primary, and later remove the old one.

The demo runs the same online bank as the plain project, with the same statement line, in six acts: one call and no nonce, a message taken apart by hand, any change refused,
rotating the key, keeping the keys safe with envelope encryption, and what Tink does not do for you.
"""
analogy = """
Think of a lock box maker who is also a careful advisor. You do not choose the lock, the combination or the seal. The maker fits a fresh combination to
every box, stamps on it which key opens it, and does not sell the models that are known to be weak. When you want new keys, you do not rebuild the
boxes: the maker keeps a key ring, adds a new key, and the old boxes still open with the old ones until you take them off the ring.
"""
scenario = """
The online bank from the plain project stores a statement line, `RENT -1200`, for the account ANA-1. It now encrypts with Tink. The demo seals the line twice, flips a
bit, moves a message to another account, adds a second key to the keyset and removes the first, wraps each message's data key with a master key, and ends by listing
what remains the bank's job.
"""
costs = [
    "**A library and its dependency.** Tink brings a protocol buffer library with it, and a recent JDK warns about the unsafe memory access that library uses.",
    "**A format of its own.** A message starts with five bytes naming the key, then Tink's nonce, cipher text and tag. Another library cannot read it without Tink, or without code that knows the layout.",
    "**The master key still needs a safe home.** Envelope encryption moves the problem to the master key, which should live in a key management service or a hardware module and never be read by the application.",
    "**Whole-keyset storage is on its way out.** Tink 1.24 deprecates its functions for writing a secret keyset, in favour of keys held in a key management service, so this project does not store keysets and wraps data keys instead.",
    "**Lengths still show,** and a lost keyset is lost data.",
]
too_much = """
For one small value in one program, the JDK's AES-GCM and a careful nonce is enough. As soon as there are many messages, several programs, or any need to replace keys, a library that
makes the safe choice the only choice is worth its weight. Tink is one such library, and libsodium is another.
"""
met_before = [
    "Tink's `Aead` in Android and server code at Google and elsewhere, and its cousins `DeterministicAead`, `Mac` and `PublicKeySign`.",
    "Key rotation in cloud key management services, which use the same primary and old keys idea.",
    "A stored value that begins with a small version byte and a key id, before the nonce.",
    "Libraries that do not let you pick ECB, or reuse a nonce, because the API has no place to put one.",
]
where = """
This project is the third in [cryptography](..), the library version of [symmetric-encryption](../symmetric-encryption).
"""
twin = """
The keyset is built from fixed key bytes so every run prints the same text, and its Base64 form is in the source. A real keyset is made with `generateNew`,
which picks a random key and a random key id, and must never be written in the clear. The master key stands in for a key management service, and the envelope is written with Tink's primitives. Tink's nonces are random,
so the demo prints facts that do not depend on them: whether two messages are equal, their length, and the five-byte start that names the key. To show the bytes
themselves, `TinkLayout` builds one message by hand with the JDK's AES-GCM and a fixed nonce, and a test shows Tink opens it and rebuilds a real Tink message byte for byte. Tink 1.24 deprecates its
functions for storing a keyset, so the demo never stores one.
"""
test_note = "Every line the demo prints is checked against `docs/expected-output.txt`. Tink's nonces are random, so the demo and the tests check lengths, equality and key ids, never the random bytes themselves; the one message with fixed bytes is built by hand by `TinkLayout`."

[[act]]
title = "One call, and no nonce to look after"
summary = "The same line sealed twice gives two different 49-byte messages that both start 01000003e9; the caller never sees a nonce."
detail = """
The bank gives Tink three things: the plain text RENT -1200 (16 bytes), the account account=ANA-1, which is checked but not hidden, and a keyset with one
AES256_GCM key, key id 1001. It seals the same line twice. Both messages are 49 bytes and start with the same five bytes, 01000003e9, but the two are not the same:
Tink picked a new random nonce each time, and the caller never saw one. Opened with the right key and account, the line comes back.
"""
figure = "sealed_twice"
figure_title = "One call, sealed twice"
figure_speech = """
First demo: one call, and no nonce to look after. [[slnc 400]] Before encryption, the bank gives Tink three things. [[slnc 300]] The line, rent, minus twelve hundred. [[slnc 300]] The account it belongs to. [[slnc 300]] And a keyset, holding one key, with the number one thousand and one. [[slnc 600]]
After encryption, the same line sealed twice. [[slnc 300]] Both messages start with the same five bytes, zero one, zero zero, zero zero, zero three, e nine. [[slnc 300]] That start says which key was used. [[slnc 500]] Everything after it is different, because Tink picked a new random nonce each time. [[slnc 500]]
So nobody can tell that the two messages hold the same payment. [[slnc 300]] And since the caller never sees a nonce, the caller can never reuse one.
"""
speech = """
The program's output. [[slnc 300]] Before encryption: the line, the account, and the keyset. [[slnc 400]] After encryption: two messages with the same start, but not the same. [[slnc 400]] And message one opens.
"""
rows = { aead = "active ok" }
console = [
