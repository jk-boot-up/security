[[act]]
title = "Any change is refused"
summary = "A changed last byte, a move to another account, and another key with the same id 1001 are all refused, because the tag no longer fits."
detail = """
The message from act two ends with the tag fd69a8c7 c828ec0f c5f79504 11a6da99. Tink checks the tag before it returns anything. With the right key and account it opens.
Change the last byte from 99 to 98: refused. Move the message to account=MAL-2, which changes the associated data: refused. Open it with another key that has the same id, 1001: refused.
"""
figure = "tag_check"
figure_title = "Opening: the tag is checked first"
figure_speech = """
Third demo: any change is refused. [[slnc 400]] Opening a message always checks the tag first. [[slnc 600]]
With the right key and the right account, the check passes, and the line comes back. [[slnc 600]] Now three changes. [[slnc 300]] One. The last byte goes from nine nine to nine eight. [[slnc 300]] The tag no longer fits: refused. [[slnc 400]] Two. The message is moved to another account. [[slnc 300]] The account is part of the check: refused. [[slnc 400]] Three. Another key, with the same number one thousand and one. [[slnc 300]] The number matches, but the key does not: refused. [[slnc 600]]
In every case, no plain text comes out.
"""
speech = """
The output: the sealed message, opening it, and the three changes, each one refused.
"""
rows = { aead = "active ok" }
console = [
    ["THE SEALED MESSAGE (from act two):", "amber"],
    ["  tag          fd69a8c7 c828ec0f c5f79504 11a6da99", "muted"],
    ["OPENING IT (Tink checks the tag first):", "ok"],
    ["  right key, right account: RENT      -1200  <- OPENED", "ok"],
    ["THREE CHANGES:", "bad"],
