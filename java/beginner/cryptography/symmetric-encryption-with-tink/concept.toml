[[act]]
title = "The bill: what Tink decides for you, and what it does not"
summary = "Tink offers authenticated templates and no ECB one, but the format is its own, it adds a library, the master key needs a home, and lengths still show."
detail = """
Tink makes the safe choice the only one on the menu. Its AEAD templates include AES128_GCM, AES256_GCM, AES128_EAX, AES256_CTR_HMAC_SHA256, CHACHA20_POLY1305, XCHACHA20_POLY1305 and AES256_GCM_SIV,
and an ECB template is not offered. The costs are different from the plain project's. The stored format is Tink's own, so another library needs Tink, or knowledge of the layout, to read it. Tink adds a library and
its protocol buffer dependency. The master key still has to live somewhere. And message lengths still show: every message is 33 bytes more than its content.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] Tink makes the safe choice the only one on the menu. [[slnc 600]]
Its templates include several authenticated ones, such as A E S G C M, and ChaCha twenty. [[slnc 300]] And a template for E C B is not offered. [[slnc 600]]
The costs are different from the plain project's. [[slnc 300]] The stored format is Tink's own, so another library needs Tink, or knowledge of the layout, to read it. [[slnc 300]] Tink adds a library, and a protocol buffer dependency. [[slnc 300]] The master key still has to live somewhere. [[slnc 300]] And message lengths still show.
"""
