    ["note", "EnvelopeAead", "a fresh 32-byte data key"],
    ["EnvelopeAead", "Master Aead", "encrypt(data key)"],
    ["Master Aead", "EnvelopeAead", "the wrapped data key", "reply"],
    ["note", "EnvelopeAead", "AES-GCM seals the line with the data key"],
    ["EnvelopeAead", "The bank", "length, wrapped key, cipher text", "reply"],
]

