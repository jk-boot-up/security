plugins {
    id 'java'
    id 'application'
}

group = 'com.jk.explore.security'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.google.crypto.tink:tink:1.24.0'

    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.jk.explore.security.symmetrictink.TinkDemo'
    // Tink's protocol buffer library uses sun.misc.Unsafe, which JDK 24 and later warn about; this keeps the output clean.
    applicationDefaultJvmArgs = ['--sun-misc-unsafe-memory-access=allow']
}

test {
    useJUnitPlatform()
    jvmArgs '--sun-misc-unsafe-memory-access=allow'
}

// No deprecated or to-be-removed API is allowed in any project: a warning fails the build.
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.addAll(['-Xlint:deprecation', '-Xlint:removal', '-Werror'])
}
