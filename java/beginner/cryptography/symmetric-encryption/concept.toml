"""
speech = """The E C B cipher uses only the key. [[slnc 300]] No nonce, and no tag, so equal blocks give equal results."""

[[class]]
name = "TagSteps"
what = "works out the tag by hand"
[[class.part]]
title = "the four steps"
code = """
byte[] h = EcbCipher.encrypt(key, new byte[BLOCK]);   // step 1
...
x = multiply(Hex.xor(x, lengths, BLOCK), h);         // step 2
...
byte[] mask = EcbCipher.encrypt(key, counter);       // step 3
// step 4: tag = X xor mask
return new Steps(h, mixes, counter, mask, Hex.xor(x, mask, BLOCK));
"""
speech = """Tag steps does the four steps of the tag by hand: [[slnc 200]] H, [[slnc 200]] stirring, [[slnc 200]] the mask, [[slnc 200]] and X O R. [[slnc 300]] A test checks it matches Java's own tag."""

