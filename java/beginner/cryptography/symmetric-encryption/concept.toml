[docs.session]
objectives = [
    "explain what a symmetric key, a block cipher and a mode are",
    "say why ECB leaks patterns",
    "say what authenticated encryption adds",
    "explain why a nonce must never repeat, and what an attacker does with a repeat",
]
walkthrough = """
Start with the lock box analogy. Run the demo one act at a time. After act two, ask the group what the attacker has learnt, without reading any line. After
act three, ask what the associated data protects against, and let them name moving a message between accounts. In act four, ask what the attacker needed, and make the
point that the key was never involved. In act five, ask where the key should live and who should be able to read it.
"""
exercises = [
    "Make the statement 12 lines instead of 8 and count the distinct blocks again.",
    "Seal a message with `RandomNonces` and check that two runs of the program give different cipher texts.",
    "Change the associated data to include the date, and open a message with an old date.",
    "Write a test that fails if two messages sealed by one `GcmBox` ever get the same nonce.",
]

[docs.explained]
sentence = """
Symmetric encryption uses one secret key to lock and unlock data; AES in ECB mode leaks the pattern of repeated blocks, while AES-GCM hides the data and adds a tag that notices any change, as long as every message gets a nonce that is never reused with the same key.
"""
verdict = """
Use AES-GCM, or another authenticated mode, and never ECB. Give every message a fresh nonce, random or carefully counted, and
replace the key well before the limit. Bind messages to their context with associated data. Keep the key in a key store, apart from the data,
and plan for losing and rotating it.
"""
recognise = [
    "`Cipher.getInstance(\"AES/GCM/NoPadding\")` and a `GCMParameterSpec`.",
    "A stored value made of a nonce, a cipher text and a tag.",
    "`AES/ECB` in a code review, which is a finding.",
    "An advisory titled \"nonce reuse\" for a library or a protocol.",
]

[spec]
purpose = """
Teach symmetric encryption by encrypting an online bank's statements five ways and showing what ECB leaks, what GCM adds, what a repeated nonce gives away, and what GCM costs.
"""
nongoals = [
    "How AES works inside.",
    "Key storage, key derivation and rotation: the keystore project covers keys.",
    "Encrypting large files in chunks, or streaming.",
]
problem = """
Learners know "use AES" but not which mode, what a nonce is, or how a small mistake gives away everything.
"""
roles = [["ECB, to show what not to do", "`EcbCipher`"], ["AES-GCM", "`GcmBox` and `Sealed`"], ["Nonces", "`NonceSource`, `RandomNonces`, `CountingNonces`, `RepeatedNonce`"], ["Entry point", "`SymmetricDemo`"]]
