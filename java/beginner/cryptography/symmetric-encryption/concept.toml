name = "Sealed"
what = "nonce + cipher text + tag"
[[class.part]]
title = "what gets stored"
code = """
public record Sealed(byte[] nonce, byte[] ciphertextWithTag) {
...
    public int storedLength() {
        return nonce.length + ciphertextWithTag.length;   // 12 + 16 + 16
"""
speech = """Sealed holds what the bank stores: the nonce, and the cipher text with its tag on the end. [[slnc 300]] Never the key. [[slnc 300]] Its stored length is the forty four bytes from act three."""

