[[act]]
title = "The one mistake: using a nonce twice"
summary = "Two messages sealed with the same key and nonce XOR to the XOR of their plain texts, so an attacker who knows one recovers the other, with no key."
detail = """
The one rule of GCM is that a nonce must never be used twice with the same key. Here it is broken: balance=000100, which the attacker knows, and balance=900100, the secret,
are sealed with the same key and the nonce 00000000 00000000 00000000. The two cipher texts differ in one byte only, 45 against 4c, at the place where the plain texts differ, 0 against 9.
GCM scrambles by XORing the message with a keystream made from the key and the nonce, so with one nonce both get the same keystream, and cipher 1 XOR cipher 2 equals plain 1 XOR plain 2:
00000000 00000000 09000000 0000. XOR that with the known message and out comes balance=900100. No key was needed. A repeated nonce can also reveal the key used for the tags, so forgeries become possible too.
"""
figure = "nonce_reuse"
figure_title = "The mistake: one nonce used twice"
figure_speech = """
Now the one mistake. [[slnc 400]] Two messages are sealed with the same key, and the same nonce. [[slnc 600]]
Message one, balance zero zero zero one zero zero. The attacker knows this one. [[slnc 400]] Message two, balance nine zero zero one zero zero. This is the secret. [[slnc 600]]
Look at the two cipher texts. [[slnc 300]] They are the same, except for one byte: four five, against four c. [[slnc 300]] That is exactly where the plain texts differ: zero against nine. [[slnc 600]]
Here is why. [[slnc 300]] G C M mixes the message with a stream of secret bytes, made from the key and the nonce, using X O R. [[slnc 300]] Same nonce, same secret stream. [[slnc 500]]
So the attacker X O Rs the two cipher texts together, and the secret stream cancels out. [[slnc 300]] What is left is the difference between the two messages. [[slnc 500]] X O R that with the message the attacker already knows, [[slnc 300]] and out comes the secret: balance nine zero zero one zero zero. [[slnc 400]] No key was needed.
"""
speech = """
The program's output follows the same three sections. [[slnc 400]] Before encryption: the two plain texts. [[slnc 400]] After encryption: the two cipher texts, sealed with the same all zero nonce. [[slnc 400]]
Then the attack, without the key. [[slnc 300]] The X O R of the cipher texts equals the X O R of the plain texts. [[slnc 300]] And the recovered secret. [[slnc 500]]
In G C M, a repeated nonce can also reveal the key used for the tags, so an attacker can forge messages too. [[slnc 300]] Never use a nonce twice.
"""
rows = { nonce = "active wrong" }
console = [
    ["the same nonce twice  00000000 00000000 00000000", "muted"],
    ["BEFORE ENCRYPTION:", "ok"],
    ["  plain text 1   balance=000100   (the attacker knows it)", "muted"],
    ["  plain text 2   balance=900100   (the secret)", "muted"],
    ["AFTER ENCRYPTION:", "bad"],
    ["  cipher text 1  9268a82d a80e5735 45d47db8 860f", "muted"],
    ["  cipher text 2  9268a82d a80e5735 4cd47db8 860f", "muted"],
    ["THE ATTACK, WITHOUT THE KEY:", "bad"],
    ["  cipher 1 XOR cipher 2  00000000 00000000 09000000 0000", "muted"],
    ["  plain 1 XOR plain 2    00000000 00000000 09000000 0000", "muted"],
    ["  the two are equal: true", "muted"],
    ["  XOR with plain text 1: balance=900100  <- NO KEY WAS NEEDED", "bad"],
]

[[act]]
title = "The bill: sizes, nonces, and the key"
summary = "Sealing adds 28 bytes and the length still shows, random nonces limit one key to 4,294,967,296 messages, and a lost key means lost data."
detail = """
Encryption has costs. Five bytes seal to 33 bytes and 500 bytes to 528: always 28 more, 12 for the nonce and 16 for the tag, and the length still shows, so a short note and a long one can be told apart. With random
12-byte nonces, NIST allows at most 4,294,967,296 messages under one key, which keeps the chance of a repeated nonce negligible, so the key must be replaced before that. And the key must be stored somewhere safe: a key kept beside the data protects
nothing, and a lost key takes every message with it.
"""
figure = "sizes"
figure_title = "What encryption does not hide"
figure_speech = """
Last, the bill. [[slnc 400]] Encryption has costs. [[slnc 600]]
The word hello, five bytes, is stored as thirty three bytes. [[slnc 300]] Twelve for the nonce, five of cipher text, and sixteen for the tag. [[slnc 400]] A five hundred byte message is stored as five hundred and twenty eight. [[slnc 500]]
Always twenty eight bytes more. [[slnc 300]] The content is hidden. [[slnc 300]] But the length is not, so a short note and a long one can be told apart. [[slnc 600]]
With random nonces, the standard allows about four billion messages under one key, so the key must be replaced before then. [[slnc 400]] And the key must be kept somewhere safe. [[slnc 300]] Lose it, and every message is lost with it.
"""
speech = """
The program prints the same numbers. [[slnc 300]] Before encryption: five bytes, and five hundred bytes. [[slnc 400]] After encryption: thirty three bytes, and five hundred and twenty eight. [[slnc 400]] Then the message limit for one key. [[slnc 300]] And the reminder that the key must be stored safely, and replaced in time.
"""
rows = { key = "active amber", nonce = "active amber" }
console = [
    ["BEFORE ENCRYPTION:", "ok"],
    ["  message 1  \"hello\"        5 bytes", "muted"],
    ["  message 2  500 letters    500 bytes", "muted"],
    ["AFTER ENCRYPTION (nonce + cipher text + tag):", "bad"],
    ["  message 1  12 + 5 + 16   = 33 bytes", "muted"],
    ["  message 2  12 + 500 + 16 = 528 bytes  <- SIZE LEAKS", "bad"],
    ["the content is hidden, the length is not", "muted"],
    ["random 12-byte nonces: at most 4294967296 messages per key", "muted"],
    ["so the key must be replaced long before that", "muted"],
    ["and the key must be kept safe: lose it, lose every message", "muted"],
]

