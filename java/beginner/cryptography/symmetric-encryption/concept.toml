[[acronym]]
short = "AES"
long = "Advanced Encryption Standard"
say = "A E S is the Advanced Encryption Standard: the cipher itself."
[[acronym]]
short = "ECB"
long = "Electronic Codebook (a mode)"
say = "E C B is Electronic Codebook, the simplest mode, which encrypts every block on its own, like looking each one up in a code book."
[[acronym]]
short = "GCM"
long = "Galois/Counter Mode"
say = "G C M is Galois Counter Mode. [[slnc 300]] Counter, because it encrypts a counter to make a stream of secret bytes. [[slnc 300]] Galois, after the mathematician whose kind of multiplication makes the tag."
[[acronym]]
short = "AAD"
long = "Additional Authenticated Data"
say = "A A D is Additional Authenticated Data: data that is checked but not hidden. In this video, the account."
[[acronym]]
short = "AEAD"
long = "Authenticated Encryption with Associated Data"
say = "A E A D is Authenticated Encryption with Associated Data: hiding the data, and noticing any change to it, or to its associated data. G C M is one."
[[acronym]]
short = "XOR"
long = "exclusive or"
say = "X O R is exclusive or: compare two bits, one if they differ, zero if they match."
[[acronym]]
short = "hex"
long = "hexadecimal: each byte as two characters, 00 to ff"
say = "Hex is short for hexadecimal: every byte is written as two characters, from zero zero to f f."
[[acronym]]
short = "UTF-8"
long = "Unicode Transformation Format, 8-bit: text to bytes"
say = "U T F eight is Unicode Transformation Format, eight bit: the usual way to turn text into bytes. The letter R becomes five two."
[[acronym]]
short = "NIST"
long = "US National Institute of Standards and Technology"
say = "NIST is the US National Institute of Standards and Technology, which sets the rules for A E S and G C M."
[[acronym]]
short = "HTTPS"
long = "HyperText Transfer Protocol Secure"
say = "And H T T P S is HyperText Transfer Protocol Secure: the padlock in your browser, which uses A E S G C M too."
