[[act]]
title = "How the tag is made, step by step"
summary = "The tag is worked out in four steps from the key, the nonce, the account and the cipher text, and comes out exactly as GCM's own tag."
detail = """
The tag of act three is made in four steps. First, a hash key H is made by encrypting sixteen zero bytes with the key: 28a4c82c 939593a9 3e625dd0 c42041f3.
Second, a running value X starts at zero, and each 16-byte block is stirred into it in turn: the account (padded with zeros), the cipher text, and a block holding both
lengths in bits (104 and 128). Each stir is X = (X xor block) times H, where "times" is GCM's own multiplication of 128-bit values, in which every bit of the result
depends on every bit of X and H. X ends as 0546a381 4647a1ad b0a2297a 584e3313. Third, a mask is made by encrypting the nonce followed by the counter 00000001 (the cipher
text itself was made from counter 2 onward): b2c8f938 f9a57b49 a3395275 4ec30f61. Fourth, the tag is X xor the mask: b78e5ab9 bfe2dae4 139b7b0f 168d3c72, exactly
the tag GCM gave. Change one bit of the account or the cipher text and X changes, so the tag changes; without the key, nobody can make H or the mask, so nobody can make a matching tag.
"""
figure = "tag_steps"
figure_title = "How the tag is made"
figure_speech = """
So where does the tag come from? [[slnc 400]] It is made in four steps. [[slnc 600]]
Step one. [[slnc 300]] A E S encrypts sixteen zero bytes with the key. [[slnc 300]] The result is called H, the hash key. [[slnc 300]] Only someone with the key can make H. [[slnc 600]]
Step two. [[slnc 300]] A running value, called X, starts at zero. [[slnc 300]] Then each block is stirred into it, one after another. [[slnc 300]] First the account. [[slnc 300]] Then the cipher text. [[slnc 300]] Then a block holding the two lengths. [[slnc 500]]
Each stir is the same: X O R the block into X, then multiply by H. [[slnc 300]] This is a special multiplication, where every bit of the answer depends on every bit going in. [[slnc 600]]
Step three. [[slnc 300]] A E S encrypts the nonce, followed by the counter one, with the key. [[slnc 300]] The result is the mask. [[slnc 600]]
Step four. [[slnc 300]] The tag is X, X O R the mask. [[slnc 300]] B seven, eight e, five a, b nine. [[slnc 300]] Exactly the tag we saw before. [[slnc 600]]
So if anyone changes one bit of the account, or of the cipher text, X changes, and the tag no longer matches. [[slnc 300]] And without the key, nobody can make H or the mask, so nobody can make a matching tag.
"""
speech = """
Here is the program working out the tag by hand. [[slnc 400]] Step one: the hash key H. [[slnc 500]]
Step two: X starts at zero. [[slnc 300]] The account block goes in, and X changes. [[slnc 300]] The cipher text block goes in, and X changes again. [[slnc 300]] Then the lengths block, and X becomes zero five four six a three eight one, and so on.
[[page]]
Step three: the counter block, which is the nonce followed by one, and the mask it gives. [[slnc 500]]
Step four: X, X O R the mask, gives the tag. [[slnc 300]] And the last line checks it against the tag G C M made in act three. [[slnc 300]] The same.
"""
rows = { gcm = "active ok", key = "active ok" }
console = [
    ["STEP 1. A HASH KEY H = AES(key, 16 zero bytes):", "amber"],
    ["  H          28a4c82c 939593a9 3e625dd0 c42041f3", "muted"],
    ["STEP 2. STIR EACH BLOCK INTO X:  X = (X xor block) times H", "amber"],
    ["  start X    00000000 00000000 00000000 00000000", "muted"],
    ["  account    6163636f 756e743d 414e412d 31000000", "muted"],
    ["    X =      6ad8a385 d6f7b828 ef0e0f77 28648b74", "muted"],
    ["  cipher     081a4d6d 5de30f22 23d0ee44 b1b85aea", "muted"],
    ["    X =      1bb4275f e5c112a0 a09ae234 5e57df4a", "muted"],
    ["  lengths    00000000 00000068 00000000 00000080", "muted"],
    ["    X =      0546a381 4647a1ad b0a2297a 584e3313", "muted"],
    ["---", ""],
    ["STEP 3. A MASK = AES(key, nonce + 00000001):", "amber"],
    ["  counter    00000000 00000000 00000001 00000001", "muted"],
    ["  mask       b2c8f938 f9a57b49 a3395275 4ec30f61", "muted"],
    ["STEP 4. TAG = X xor MASK:", "amber"],
    ["  tag        b78e5ab9 bfe2dae4 139b7b0f 168d3c72", "muted"],
    ["  the same tag GCM gave in act three: true", "muted"],
]

