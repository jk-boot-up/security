kind = "poster"
title = "Symmetric Encryption (AES-GCM)"
narration = """Hello, and welcome. [[slnc 400]] This video explains symmetric encryption, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] Symmetric encryption uses one secret key, for both locking and unlocking. [[slnc 300]] Whoever has the key can read the data. [[slnc 300]] The standard cipher is called A E S. [[slnc 600]] Think of a lock box, where the same key closes it and opens it. [[slnc 300]] A good lock box also has a tamper seal, which breaks if anyone has been inside. [[slnc 700]] In this video, the domain is an online bank, and its account statements. [[slnc 500]] By the end, you will hear why one way of using A E S leaks patterns. [[slnc 300]] How G C M hides the data, and notices changes. [[slnc 300]] The one mistake that gives everything away. [[slnc 300]] And what it all costs."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online bank stores account statements.", "", "A statement: eight lines of sixteen bytes.", "Five of them are the same rent payment.", "", "Disks get stolen. Files get changed."]
narration = """Here is the scenario. [[slnc 400]] An online bank stores its customers' account statements. [[slnc 500]] A statement has eight lines, of sixteen bytes each. [[slnc 300]] A salary, a food bill, and five payments of the same rent. [[slnc 600]] The disks the statements sit on may be stolen. [[slnc 300]] And the files may be changed, by someone who can reach them. [[slnc 600]] So the bank wants to hide the statements, and to notice if one is changed."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["Key: one secret, locks and unlocks", "Block: AES works on 16 bytes at a time", "Mode: how blocks are put together", "Nonce: a number used once, never twice", "Tag: notices any change"]
narration = """Before the demos, the words. [[slnc 500]] The key is one secret, that locks and unlocks. [[slnc 500]] A block is sixteen bytes, which is how much A E S works on at a time. [[slnc 500]] The mode is how the blocks are put together. [[slnc 500]] A nonce is a number used once, which must never be used twice with the same key. [[slnc 500]] And the tag is a short code that notices any change to the message."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "09-modes"
kind = "bullets"
title = "The Modes Compared"
body = ["Plain: the thief reads everything", "ECB: unreadable, but repeats show", "GCM, fresh nonce: hidden, and tamper-evident", "GCM, repeated nonce: broken", "", "Always: a safe key, replaced in time"]
narration = """Let's put them side by side. [[slnc 400]] Plain text. The thief reads everything. [[slnc 500]] E C B mode. Unreadable, but the repeats show. [[slnc 500]] G C M with a fresh nonce. Hidden, and any change is noticed. [[slnc 500]] G C M with a repeated nonce. Broken. [[slnc 600]] And in every case, the key must be kept safe, and replaced in time."""

[[scene]]
key = "10-roles"
kind = "bullets"
title = "Who Does What"
body = ["GcmBox: seals and opens with AES-GCM", "Sealed: nonce, cipher text and tag", "NonceSource: where nonces come from", "EcbCipher: shows the mistake", "SymmetricDemo: the five acts"]
narration = """Here is who does what in the code. [[slnc 400]] The G C M box seals and opens messages. [[slnc 500]] A sealed message is a nonce, a cipher text, and a tag. [[slnc 500]] The nonce source says where nonces come from: random in real use, and a counter in the demo. [[slnc 500]] The E C B cipher is there only to show the mistake. [[slnc 300]] And the demo runs the five acts."""

[[scene]]
key = "11-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Disk and phone encryption", "HTTPS, with AES-GCM", "Encrypted database fields", "Advisories about nonce reuse"]
narration = """You have probably met this already. [[slnc 400]] Your phone and your laptop encrypt their storage with A E S. [[slnc 500]] The H T T P S connections that carry your bank's pages use A E S G C M, or a close relative. [[slnc 500]] Some applications encrypt database fields before storing them. [[slnc 500]] And advisories titled nonce reuse describe the fourth demo, in a real library or protocol."""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["AES-GCM, never ECB", "A fresh nonce for every message", "Bind messages to context: associated data", "Keep the key apart; replace it in time"]
narration = """So, how do you use it? [[slnc 400]] Use A E S G C M, or another authenticated mode. Never E C B. [[slnc 500]] Give every message a fresh nonce. [[slnc 500]] Bind each message to its context with associated data, such as the account. [[slnc 500]] And keep the key apart from the data, and replace it well before the limit."""

[[scene]]
key = "13-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Seal a message with random nonces", "and compare two runs."]
narration = """That's symmetric encryption. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] A E S G C M hides the data and notices changes, but only if every message gets a nonce that is never reused, and the key is kept safe. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine, with nothing installed except a Java development kit. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Seal a message with random nonces, run the program twice, and compare the two cipher texts. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
An online bank's stored account statements, encrypted by the application before they are stored: the choice of mode, the nonces, the
associated data, the key, and the messages on disk and in backups. It covers a thief who reads a disk, and one who changes a file. It does
not cover who is allowed to ask the application for a statement, or how the key is stored and rotated.
"""
assets = [
    "The contents of each statement.",
    "The integrity of each statement.",
    "The encryption key.",
    "The record of which nonces have been used.",
]
actors = [
    "The bank's application, which seals and opens messages.",
    "A thief who copies a disk or a backup.",
    "An attacker who can change or move stored messages.",
    "An attacker who sees two messages made with the same nonce.",
]
boundaries = [
    "Application to disk: messages leave the application only as nonce, cipher text and tag.",
    "Key store to application: the key must reach the application and nowhere else.",
    "Account to account: associated data stops one account's message being used for another.",
]
assumptions = [
    "The attacker does not have the key.",
    "The application's memory is not itself compromised.",
    "In the demo, keys and nonces are fixed values. Real systems use a random key from a key store and never repeat a nonce.",
]
out_of_scope = [
    "Key generation, storage, rotation and destruction: the keystore-basics project.",
    "Who may open a statement: authorization, in the identity module.",
    "Traffic analysis, which can use message sizes and timing.",
]
tests = [
    "`StandardVectorsTest` checks AES and GCM against FIPS 197 and the original GCM specification.",
    "`EcbTest` shows ECB keeps the repeats of the plain text.",
    "`GcmBoxTest` shows a changed bit, tag, nonce, associated data or key all make `open` fail, and the overhead is 28 bytes.",
    "`NonceReuseTest` shows an attacker who knows one message recovers another when a nonce is reused, and not when nonces are fresh.",
]
next = """
The next project, asymmetric-encryption, solves the problem that this one leaves: how two parties who have never met can agree on a key.
"""

[[threat]]
id = "T1"
stride = "I"
threat = "A thief reads statements from a disk or a backup"
where = "stored messages"
control = "AES-GCM hides the contents, so the disk holds only cipher text"
residual = "The length of each message still shows, and the key must not be on the same disk"

[[threat]]
id = "T2"
stride = "T"
threat = "Someone changes a stored message, or moves it to another account"
where = "`GcmBox.open`"
control = "The tag covers the cipher text, nonce and associated data, so any change or move is refused"
residual = "An attacker can still delete a message, or replace it with an older valid one for the same account"

[[threat]]
id = "T3"
stride = "I"
threat = "Patterns in the data show through the cipher text"
where = "`EcbCipher`"
control = "Use GCM, not ECB, so equal blocks give different cipher text"
residual = "Message lengths and timing can still leak something"

[[threat]]
id = "T4"
stride = "I"
threat = "A nonce is reused and an attacker recovers one message from another"
where = "`NonceSource`"
control = "A fresh nonce for every message, from `RandomNonces` or a carefully kept counter"
residual = "Random nonces may repeat near 2^32 messages under one key; replace the key before that"

[[threat]]
id = "T5"
stride = "I"
threat = "The key is read by someone who should not have it"
where = "the key store"
control = "None in this project; the key is kept apart from the data"
residual = "Whoever holds the key reads everything, so it must be guarded and its use logged"

[[threat]]
id = "T6"
stride = "D"
threat = "The key is lost, and with it every message"
where = "the key store"
control = "None in this project"
residual = "Back up the key separately from the data, and test that the backup works"

[[threat]]
id = "T7"
stride = "R"
threat = "Anyone with the key can make a valid message, so nobody can tell who made it"
where = "`GcmBox`"
control = "None with a shared key"
residual = "Digital signatures give each maker an identity; a later project covers them"
