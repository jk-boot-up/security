[[act]]
title = "AES in ECB mode: every block on its own"
summary = "In ECB the 8 blocks give only 3 different cipher blocks, so an attacker sees that 5 of the 8 lines are the same payment."
detail = """
AES encrypts one 16-byte block at a time. Each line of the statement is exactly one block. In ECB mode, every block is encrypted on its own, so the same line always gives the same block of
cipher text. The statement has three different lines, a salary, the rent and a food bill, so the cipher text has three different blocks out of eight. The attacker cannot read any line,
but can see that five of the eight are the same payment, and where. The first and second rent blocks both begin 59a345b721951fa8. The pattern of the data shows through.
"""
speech = """
Second demo: AES in ECB mode. [[slnc 400]] AES scrambles data sixteen bytes at a time. [[slnc 300]] Each line of the statement is exactly one block. [[slnc 600]]
In ECB mode, every block is scrambled on its own. [[slnc 300]] So the same line always gives the same scrambled block. [[slnc 600]]
The statement has three different lines, so the cipher text has three different blocks, out of eight. [[slnc 300]] The attacker cannot read any line. [[slnc 300]] But sees that five of the eight are the same payment, and where they are. [[slnc 600]]
The pattern of the data shows through.
"""
rows = { ecb = "active wrong" }
console = [
    ["the statement is 8 blocks of 16 bytes", "muted"],
    ["the plain text has 3 different blocks, and so does the cipher text: 3", "bad"],
    ["the attacker cannot read a line, but sees that 5 of 8 are the same payment  <- PATTERNS SHOW THROUGH", "bad"],
    ["the first rent block begins 59a345b721951fa8, the second rent block begins 59a345b721951fa8", "bad"],
]

[[act]]
title = "AES-GCM: hiding and checking"
summary = "With a new nonce each time, the same line seals to different cipher texts; a flipped bit, a message moved to another account, and a wrong key are all refused."
detail = """
GCM mode uses a nonce, a number used once, for every message, so the same line sealed twice gives different cipher texts: 081a4d6d5de30f22 and e2d8337cdaa2332c. It also adds a 16-byte tag.
Opened with the right key and the right account, the line comes back. Flip one bit of the cipher text and it is refused. Move the message to another account, which
changes the associated data, the text that is bound to the message but not hidden, and it is refused. A different key is refused too. GCM both hides the data and notices
any change, which is what authenticated encryption means.
"""
speech = """
Third demo: AES G C M. [[slnc 400]] G C M uses a nonce, a number used once, for every message. [[slnc 300]] So the same line, sealed twice, gives different cipher texts. [[slnc 600]]
It also adds a tag, sixteen bytes long. [[slnc 300]] Opened with the right key and the right account, the line comes back. [[slnc 600]]
Flip one bit of the cipher text, and it is refused. [[slnc 300]] Move the message to another account, which changes the associated data, and it is refused. [[slnc 300]] The associated data is text that is bound to the message, but not hidden. [[slnc 300]] A different key is refused too. [[slnc 600]]
G C M both hides the data, and notices any change. [[slnc 300]] That is what authenticated encryption means.
"""
rows = { gcm = "active ok", nonce = "active ok" }
console = [
    ["the same line sealed twice: 081a4d6d5de30f22 and e2d8337cdaa2332c  <- A NEW NONCE EACH TIME", "ok"],
    ["opened with the right key and account: RENT      -1200", "ok"],
    ["one bit of the cipher text is flipped: refused  <- DETECTED", "ok"],
    ["the message is moved to another account: refused  <- DETECTED", "ok"],
    ["opened with a different key: refused  <- DETECTED", "ok"],
]

[[act]]
title = "The one mistake: using a nonce twice"
summary = "Two messages sealed with the same key and nonce XOR to the XOR of their plain texts, so an attacker who knows one recovers the other, with no key."
detail = """
The one rule of GCM is that a nonce must never be used twice with the same key. Here it is. Two messages are sealed with the same key and the same nonce. The cipher text of the first XOR the cipher
text of the second equals the first plain text XOR the second plain text, because both were scrambled with the same stream of bytes. An attacker who knows the first message, balance=000100, XORs
that with the two cipher texts and gets the second: balance=900100. No key was needed. In GCM, a repeated nonce can also reveal the key used for the tags, so forgeries become possible too.
"""
speech = """
Fourth demo: the one mistake. [[slnc 400]] The one rule of G C M is that a nonce must never be used twice, with the same key. [[slnc 600]]
Here it is used twice. [[slnc 300]] Both messages were scrambled with the same stream of bytes. [[slnc 300]] So the first cipher text, X O R the second, equals the first plain text, X O R the second. [[slnc 600]]
An attacker who knows the first message, balance zero zero zero one zero zero, combines it with the two cipher texts, and gets the second. [[slnc 300]] Balance nine zero zero one zero zero. [[slnc 300]] No key was needed. [[slnc 600]]
And in G C M, a repeated nonce can reveal the key used for the tags, so forgeries become possible too.
"""
rows = { nonce = "active wrong" }
console = [
    ["two messages sealed with the same key and the same nonce", "muted"],
    ["cipher text one XOR cipher text two equals plain text one XOR plain text two: true", "bad"],
    ["the attacker knows the first message and recovers the second: balance=900100  <- NO KEY WAS NEEDED", "bad"],
]

[[act]]
title = "The bill: sizes, nonces, and the key"
summary = "Sealing adds 28 bytes and the length still shows, random nonces run out near 4,294,967,296 messages, and a lost key means lost data."
detail = """
Encryption has costs. Five bytes seal to 33 bytes and 500 bytes to 528: always 28 more, 12 for the nonce and 16 for the tag, and the length still shows, so a short note and a long one can be told apart. With random
12-byte nonces, a repeat becomes likely near 4,294,967,296 messages under one key, so the key must be replaced long before that. And the key must be stored somewhere safe: a key kept beside the data protects
nothing, and a lost key takes every message with it.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] Encryption has costs. [[slnc 600]]
Five bytes seal to thirty three bytes. [[slnc 300]] Five hundred bytes seal to five hundred and twenty eight. [[slnc 300]] Always twenty eight more: twelve for the nonce, and sixteen for the tag. [[slnc 300]] And the length still shows. [[slnc 600]]
With random nonces, a repeat becomes likely near four billion messages, under one key. [[slnc 300]] So the key must be replaced long before that. [[slnc 600]]
And the key must be stored somewhere safe. [[slnc 300]] A key kept beside the data protects nothing. [[slnc 300]] And a lost key takes every message with it.
"""
rows = { key = "active amber", nonce = "active amber" }
console = [
    ["5 bytes seal to 33 bytes, 500 bytes to 528: 28 bytes of overhead, and the length still shows  <- SIZE LEAKS", "amber"],
    ["with random 12-byte nonces, a repeat becomes likely near 4294967296 messages under one key", "amber"],
    ["so the key must be replaced long before that", "amber"],
    ["and the key must be stored somewhere safe: lose it, and every message is lost with it", "amber"],
]

