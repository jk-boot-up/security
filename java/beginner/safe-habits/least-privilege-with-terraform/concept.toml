kind = "poster"
title = "Least Privilege with Terraform and LocalStack"
narration = """Hello, and welcome. [[slnc 400]] This video explains least privilege with Terraform and LocalStack, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] Least privilege means giving each job the access it needs, and no more. [[slnc 300]] In the cloud, access is written as policies. [[slnc 300]] And Terraform lets you write them as code. [[slnc 600]] Think of a key cabinet in the shop. [[slnc 300]] The nightly export gets a key to one drawer, and not the master key. [[slnc 300]] A note says nobody takes the key to the safe, and that note beats any slip. [[slnc 700]] In this video, the domain is an online store. [[slnc 500]] By the end, you will hear how a policy is matched. [[slnc 300]] Why a deny wins. [[slnc 300]] What a boundary does. [[slnc 300]] And how a small policy can still be dangerous."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online store's account has 25 things to do.", "", "A nightly export, a support tool", "and a deploy pipeline each need some.", "", "The easy way is a wildcard."]
narration = """Here is the scenario. [[slnc 400]] An online store's account has twenty five things that can be done. [[slnc 500]] A nightly export, a support tool, and a deploy pipeline each need some of them. [[slnc 600]] The easy way is a wildcard. [[slnc 300]] And a stolen key then opens everything."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["Policy: a list of allowed or denied actions", "Action: something to do, like s3:GetObject", "Resource: the thing it is done to", "Boundary: a ceiling on what can be granted", "Blast radius: what a stolen key can do"]
narration = """Before the demos, the words. [[slnc 500]] A policy is a list of allowed or denied actions. [[slnc 500]] An action is something to do, like reading an object. [[slnc 500]] A resource is the thing it is done to. [[slnc 500]] A boundary is a ceiling on what can be granted. [[slnc 500]] And the blast radius is what a stolen key can do."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "09-ladder"
kind = "bullets"
title = "From Wide to Narrow"
body = ["A wildcard: 25 of 25", "A deny on secrets: 20 of 25", "A boundary: 8 of 25", "A scoped policy: 3 of 25", "Then read it: counting hides escalation."]
narration = """Let's put the numbers side by side. [[slnc 400]] A wildcard policy: twenty five of twenty five. [[slnc 500]] With a deny on the secrets: twenty. [[slnc 500]] Under a boundary: eight. [[slnc 500]] A scoped policy: three. [[slnc 600]] And then read the policy as well, because counting hides ways to grow one's own power."""

[[scene]]
key = "10-roles"
kind = "bullets"
title = "Who Does What"
body = ["Glob: wildcard matching", "PolicyDocument: reads the JSON", "Evaluator: allow, deny and boundary", "Catalogue: the 25 things", "Linter: wildcards and escalation"]
narration = """Here is who does what in the code. [[slnc 400]] The glob class does wildcard matching. [[slnc 500]] The policy document class reads the J S O N that Terraform writes. [[slnc 500]] The evaluator applies allow, deny, and boundary. [[slnc 500]] The catalogue is the list of twenty five things, and counts the blast radius. [[slnc 300]] And the linter reads the text for wildcards and escalation."""

[[scene]]
key = "11-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["aws_iam_policy_document in Terraform", "Policy validation in cloud consoles", "Action star and Resource star in breaches", "Terraform plans in pull requests"]
narration = """You have probably met this already. [[slnc 400]] Policy documents are in almost every Terraform repository for the cloud. [[slnc 500]] Cloud consoles show policy validation findings. [[slnc 500]] Star action and star resource appear in breach reports. [[slnc 500]] And Terraform plans are reviewed in pull requests."""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Write permissions as code", "One scoped policy per job", "Boundaries on identities people can create", "Count the blast radius, and lint", "Test enforcement in a real account"]
narration = """So, how do you use it? [[slnc 400]] Write permissions as code. [[slnc 500]] Give each job one scoped policy. [[slnc 500]] Put a boundary on identities that people can create. [[slnc 500]] Count the blast radius, and lint. [[slnc 500]] And test enforcement in a real account, because the free emulator stores policies but does not enforce them."""

[[scene]]
key = "13-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Write a support policy", "and count its blast radius."]
narration = """That's least privilege with Terraform and LocalStack. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Write permissions as code, keep each policy scoped, and read it as well as count it. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] The demo runs with nothing installed except a Java development kit. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Write a policy for the support tool, and count its blast radius. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
How an online store's cloud permissions are written, reviewed and applied: Terraform code, the IAM policies it produces, and the identities that wear them. It covers a thief or insider who holds one job's key and a change to the code that widens a policy.
It does not cover how keys are stored, network access, or the cloud provider.
"""
assets = [
    "The data and actions the account protects: reports, orders, customers, secrets and the key.",
    "The Terraform code and the policies it produces.",
    "The keys of each job's identity.",
]
actors = [
    "The nightly export, the support tool and the deploy pipeline.",
    "A thief or insider holding one job's key.",
    "A developer who changes the policy code.",
    "A reviewer, and the linter.",
]
boundaries = [
    "Code repository to the account: a merged change becomes live permissions.",
    "A job's identity to the account: what its key can reach is the blast radius.",
]
assumptions = [
    "The emulator in the integration tests uses test credentials and is thrown away.",
    "Reviewers read the plan, and the linter runs in the pipeline.",
    "The catalogue of 25 things stands for the account, and the demo account number is a fake.",
]
out_of_scope = [
    "Enforcement by a real AWS account or a paid emulator.",
    "Conditions, resource policies, session policies and organisation rules.",
    "Where job keys are stored.",
]
tests = [
    "`GlobTest` checks star, question mark and the case rules.",
    "`EvaluatorTest` checks deny by default, deny in any order, boundaries, NotAction and refused conditions.",
    "`FixturesAndLinterTest` checks the blast radius of every policy, the bucket against contents rule and the linter findings.",
    "`TerraformInteropTest` (integration) applies the code with OpenTofu to LocalStack and checks that what is stored equals the fixtures, that the boundary is attached and that a second plan has nothing to change.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
That completes the safe-habits module. Higher levels build on it: applying least privilege to identity providers, secrets and the software supply chain.
"""

[[threat]]
id = "T1"
stride = "E"
threat = "A stolen job key does everything a wildcard policy allows"
where = "`Catalogue.blastRadius`"
control = "One scoped policy per job, and a count of its blast radius"
residual = "A small count can still hide escalation, so policies are read as well"

[[threat]]
id = "T2"
stride = "E"
threat = "A policy that looks small grants a way to more power, such as iam:PassRole on every role"
where = "`Linter`"
control = "The linter flags escalation actions on every resource, and a person reviews the plan"
residual = "The linter knows a fixed list, so new escalation paths need new rules"

[[threat]]
id = "T3"
stride = "T"
threat = "A change to the code widens a policy and is merged without notice"
where = "the Terraform repository"
control = "Policies as code are reviewed as a diff, and the linter runs in the pipeline"
residual = "Review only helps if someone reads it; require approval for permission changes"

[[threat]]
id = "T4"
stride = "I"
threat = "The evaluator is trusted for something it does not model, such as a condition or an organisation rule"
where = "`PolicyDocument.parse`"
control = "A statement with a condition is refused, and the docs list what is not modelled"
residual = "Real enforcement must be tested in a real account"

[[threat]]
id = "T5"
stride = "R"
threat = "Nobody can tell which job used a permission, because jobs share one identity"
where = "the job identities"
control = "One identity per job, so logs name the job"
residual = "Logging itself is outside this project"
