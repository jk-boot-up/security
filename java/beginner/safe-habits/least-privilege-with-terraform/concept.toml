[[act]]
title = "A deny beats every allow"
summary = "Allow * on * plus a deny on the secrets: the secret file and the key are EXPLICIT_DENY, a report is ALLOW, the order of statements does not matter, and the count falls from 25 to only 20."
detail = """
The admin_with_deny policy has two statements: Allow * on *, and Deny s3:* and kms:* on shop-secrets, shop-secrets/* and key/*.
Reading shop-secrets/keys.pem matches both statements, and the deny wins: EXPLICIT_DENY. Decrypting with key/shop is EXPLICIT_DENY too. Writing shop-reports/q3.csv matches only the allow: ALLOW.
With the two statements in the opposite order, all 25 answers are the same: order never matters. The count falls from 25 of 25 to 20 of 25. The deny is a safety net, and 20 things are still open.
"""
figure = "deny_wins"
figure_title = "Two statements disagree: the deny wins"
figure_speech = """
Third demo: a deny beats every allow. [[slnc 400]] The policy as written has two statements. [[slnc 300]] In green: allow star, on star. [[slnc 300]] In red: deny everything in S 3 and K M S, on the secrets bucket, its files, and the keys. [[slnc 700]]
Three requests. [[slnc 300]] For each, a tick shows which statement matched. [[slnc 600]]
Reading the secret keys file matches both. [[slnc 300]] The allow says yes, the deny says no. [[slnc 300]] The deny wins. [[slnc 300]] Explicit deny. [[slnc 500]] Decrypting with the shop key: the same. [[slnc 500]] Writing a report matches only the allow. [[slnc 300]] Allowed. [[slnc 700]]
At the bottom, the count. [[slnc 300]] Twenty five without the deny. [[slnc 300]] Twenty with it. [[slnc 300]] The deny is a safety net, and twenty things are still open.
"""
speech = """
Here is the output. [[slnc 400]] The policy as written, then three requests. [[slnc 300]] Explicit deny, explicit deny, and allow. [[slnc 500]] With the statements in the opposite order, all twenty five answers are the same. [[slnc 500]] And the count: twenty five without the deny, twenty with it.
"""
