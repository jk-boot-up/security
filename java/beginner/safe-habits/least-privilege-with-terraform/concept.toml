[docs.dependencies]
intro = """
This project uses one Java library, for reading JSON, and four local tools, only for the integration tests.
"""
what = [
    ["Jackson (jackson-databind)", "reads the policy documents into trees. Version 3 changed its package to tools.jackson."],
    ["OpenTofu", "the open-source fork of Terraform. It turns the Terraform code into calls to the IAM service. The tests use it, and fall back to Terraform if it is not installed."],
    ["Terraform AWS provider", "the plugin that knows the AWS IAM calls. It is downloaded once into a cache folder in the home directory, which is large (hundreds of megabytes)."],
    ["LocalStack", "a local AWS emulator, run in Docker. The community image 4.14.0 is the last one that starts without an account token; newer images need one."],
    ["Docker", "runs the emulator."],
]
why = """
The Java evaluator teaches how the rules combine. Applying the same code to an emulator, and reading it back, proves that the JSON the evaluator reads is the JSON the cloud would store.
"""
install_note = "A JDK for the demo and the ordinary tests. For the integration tests, Docker and OpenTofu (`brew install opentofu`) or Terraform on the PATH. The versions in use are:"
versions = [
    ["Jackson (jackson-databind)", "3.2.3"],
    ["OpenTofu", "1.13.1"],
    ["Terraform AWS provider", "6.69.1"],
    ["LocalStack (community image)", "4.14.0"],
    ["Java", "25"],
    ["JUnit", "6.1.3"],
]
costs = [
    "The first integration run downloads the AWS provider, which is large, and the emulator image.",
