[[act]]
title = "A permissions boundary"
summary = "The wildcard policy alone reaches 25 of 25; under the read-only boundary 8 of 25; the boundary alone 0 of 25, because a boundary grants nothing."
detail = """
The boundary allows s3:List*, s3:Get*, dynamodb:Scan, dynamodb:Query and dynamodb:GetItem on everything, and denies all of S3 on the secrets bucket.
The wildcard policy alone reaches 25 of 25. The same policy under the boundary reaches 8 of 25. The boundary alone, with no policy attached, reaches 0 of 25: a boundary grants nothing. Admin with a deny, under the boundary, is also 8 of 25.
The 8 things left are listing the reports bucket, reading the report file, and GetItem, Query and Scan on the orders and customers tables. A request is allowed only when a policy allows it AND the boundary allows it, and nothing denies it.
"""
figure = "boundary"
figure_title = "A boundary is a ceiling: only the overlap is allowed"
figure_speech = """
Fourth demo: a permissions boundary. [[slnc 400]] On the left, the identity's policy: the wildcard, allow star on star. [[slnc 300]] Twenty five things. [[slnc 600]] In the middle, the boundary. [[slnc 300]] It allows reading: list and get in S 3, and scan, query and get item in Dynamo D B. [[slnc 300]] And it denies the secrets bucket. [[slnc 700]]
A request must pass both. [[slnc 300]] On the right, the overlap: the eight things left. [[slnc 300]] List the reports bucket. [[slnc 300]] Read the report file. [[slnc 300]] And get item, query and scan, on the orders and customers tables. [[slnc 700]]
Underneath, the counts. [[slnc 300]] Twenty five alone. [[slnc 300]] Eight under the boundary. [[slnc 300]] And the boundary alone: zero. [[slnc 300]] A boundary is a ceiling. [[slnc 300]] It grants nothing.
"""
speech = """
Here is the output. [[slnc 400]] The boundary as written. [[slnc 400]] Then the counts. [[slnc 300]] The wildcard alone, twenty five. [[slnc 300]] Under the boundary, eight. [[slnc 300]] The boundary alone, zero. [[slnc 300]] And admin with a deny, under the boundary, eight.
[[page]]
These are the eight things left: one list, one read, and three table actions on two tables. [[slnc 500]] A request is allowed only when a policy allows it and the boundary allows it, and nothing denies it.
"""
