]

[docs.problem]
scenario = """
An online store's account has jobs that need access to a few things: a nightly export, a support tool and a deploy pipeline. Someone has to write what each may do, and the easy way is a wildcard.
"""
naive = """
Give every job `Action: *` on `Resource: *`. It works on the first day, and a stolen key then opens everything.
"""
deliver = [
    "Five IAM policies written as Terraform and applied to a local emulator.",
    "An evaluator in Java with deny by default, explicit deny, wildcards and boundaries.",
    "A blast-radius count for each identity over a fixed catalogue of 25 things.",
    "A linter for wildcards, NotAction and escalation.",
    "A check that what the emulator stores equals what the Java code reads.",
]

[docs.prerequisites]
required = [
    "Java basics",
    "The least-privilege project, or an idea of roles and deny by default",
]
not_required = [
    "A cloud account: everything runs locally",
    "Terraform experience: the code is short and commented",
]
install = ["OpenTofu or Terraform, and Docker, for the integration tests only"]

[docs.session]
objectives = [
    "read an IAM policy and say what it allows",
    "explain why an explicit deny wins and a boundary grants nothing",
    "explain why a bucket and its contents are different resources",
    "name a policy shape that escalates privilege although it allows little",
]
walkthrough = """
Start with the key cabinet. Run the demo one act at a time. After act one, ask which policy the team would write on a busy day. After act two, ask what breaks when the slash-star is left off. In act five, ask who would review the deployer policy and what they would look for.
"""
exercises = [
    "Add a policy for the support tool: read orders, no customers, and check its blast radius.",
    "Write a policy that allows only s3:GetObject on shop-reports, and show it cannot list the bucket.",
    "Add iam:CreatePolicyVersion to a policy and see what the linter says.",
    "Change the boundary to allow writes to reports and see how the count moves.",
]

[docs.explained]
sentence = """
Permissions written as code can be reviewed, counted and linted: a scoped policy keeps the blast radius small, an explicit deny and a boundary narrow it further, and a linter catches the shapes that grant more power than they seem to.
"""
verdict = """
Write permissions as code, give each job a scoped policy, put a boundary on identities that people can create, count the blast radius, and lint for wildcards and for ways to grow one's own power. Test enforcement against a real account before relying on it.
"""
recognise = [
    "`data \"aws_iam_policy_document\"` blocks in Terraform repositories.",
    "Policy validation and unused-access findings in cloud consoles.",
    "`iam:PassRole` with `Resource: *` in security reviews.",
]

[spec]
purpose = """
Teach least privilege for cloud permissions by writing IAM policies in Terraform for an online store, applying them to a local emulator, and evaluating, counting and linting the same JSON in Java.
"""
nongoals = [
    "Enforcing policies: that needs a real account or a paid emulator.",
    "Conditions, resource policies and organisation rules.",
    "Terraform state storage and modules.",
]
problem = """
Cloud permissions are easy to write too wide, and hard to see once written.
"""
roles = [["Glob matching", "`Glob`"], ["Policy documents", "`PolicyDocument`"], ["Allow, deny and boundary rules", "`Evaluator`"], ["The 25 things", "`Catalogue`"], ["The linter", "`Linter`"], ["The fixtures", "`Fixtures`"], ["Entry point", "`LeastPrivilegeTerraformDemo`"]]
requirements = [
    "Wildcard matching handles star and question mark, with case rules for actions and resources.",
    "An explicit deny wins in any order, and a boundary only narrows.",
    "Blast radius is counted over the fixed catalogue.",
    "The linter flags star actions, star resources, service stars, NotAction and escalation actions.",
    "The Terraform code applies to the emulator, and what it stores equals the fixtures.",
    "The demo prints the same output on every run and needs no tool.",
]

