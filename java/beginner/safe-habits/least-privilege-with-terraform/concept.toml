[[act]]
title = "How a request is matched"
summary = "Six requests against the exporter's S3 statements: a report file and the reports bucket are allowed; a secret file, a list on a file, and a read of the bucket itself are denied by default; action names ignore case."
detail = """
The exporter's S3 part has two statements: Allow s3:ListBucket on shop-reports, and Allow s3:GetObject on shop-reports/*.
Reading shop-reports/q3.csv matches the second statement: ALLOW. Reading shop-secrets/keys.pem matches nothing: IMPLICIT_DENY. Listing shop-reports matches the first: ALLOW.
Listing with a file's name, shop-reports/q3.csv, is IMPLICIT_DENY, and reading the bucket shop-reports as if it were a file is IMPLICIT_DENY too, because /* means the files in the bucket, not the bucket itself. The action s3:getobject in small letters is still ALLOW: action names ignore case.
In a pattern, a star matches any letters, so s3:Get* matches s3:GetObject and not s3:PutObject. When no statement matches, the answer is denied by default.
"""
figure = "matching"
figure_title = "Six requests against the exporter's policy"
figure_speech = """
Second demo: how a request is matched. [[slnc 400]] At the top, the exporter's two S 3 statements. [[slnc 300]] List the bucket shop reports. [[slnc 300]] And get any object under shop reports, slash star. [[slnc 700]]
Below, six requests. [[slnc 300]] Each is an action on a resource, and the arrow shows which statement it matched. [[slnc 600]]
Reading the report file q 3 dot c s v matches statement two. [[slnc 300]] Allowed. [[slnc 300]] Reading the secret keys file matches nothing. [[slnc 300]] Denied by default. [[slnc 300]] Listing the reports bucket matches statement one. [[slnc 300]] Allowed. [[slnc 600]]
Now two traps. [[slnc 300]] Listing, but naming a file instead of the bucket: no match. [[slnc 300]] And reading the bucket itself as if it were a file: no match either. [[slnc 300]] Because slash star means the files in the bucket, not the bucket. [[slnc 600]]
Last, get object in small letters. [[slnc 300]] Allowed, because action names ignore case.
"""
speech = """
Here is the output. [[slnc 400]] The policy as written: two statements. [[slnc 400]] Then the six requests, each with its decision. [[slnc 300]] Allow, implicit deny, allow, implicit deny, implicit deny, and allow.
[[page]]
The pattern s 3 colon get star matches get object, and not put object, because a star matches any letters. [[slnc 500]] Slash star means the files in the bucket, not the bucket itself. [[slnc 400]] And when no statement matches, the answer is denied by default.
"""
