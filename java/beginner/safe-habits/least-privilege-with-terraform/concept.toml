[[act]]
title = "A linter, and the way to more power"
summary = "The linter flags star actions and star resources, and ESCALATION in the deployer: it reaches only 3 of 25, yet iam:PassRole on * plus lambda:CreateFunction runs code as any role."
detail = """
The linter reads the text of each policy, not its effect. The wildcard and admin_with_deny policies each have ACTION_STAR and RESOURCE_STAR. The exporter has none. The boundary has RESOURCE_STAR. The deployer has RESOURCE_STAR and ESCALATION.
The deployer allows lambda:InvokeFunction and lambda:CreateFunction on function:checkout, and iam:PassRole on *. A stolen key reaches only 3 of 25, so it looks small.
But three steps lead to more power: iam:PassRole on * hands any role to a function, lambda:CreateFunction makes checkout with that role, and lambda:InvokeFunction runs code as that role. So read the policy as well as counting it.
This evaluator ignores resource policies and organisation rules, and it refuses a statement with a condition rather than guess.
"""
figure = "escalation"
figure_title = "3 of 25 that can become everything"
figure_speech = """
Fifth demo: a linter, and the way to more power. [[slnc 400]] On the left, the findings for all five policies. [[slnc 300]] Red rows have a star action, or an escalation. [[slnc 300]] The exporter, in green, has none. [[slnc 700]]
On the right, the deployer. [[slnc 300]] It reaches only three of twenty five things. [[slnc 300]] It looks small. [[slnc 600]]
Follow the three steps. [[slnc 300]] One. Pass role, on star: it may hand any role to a function, even the admin role. [[slnc 300]] Two. Create function: it makes the checkout function with that role. [[slnc 300]] Three. Invoke function: it runs that code. [[slnc 300]] Now the code runs as the admin role. [[slnc 700]]
Three of twenty five, and still the whole account. [[slnc 300]] So read the policy, as well as counting it.
"""
speech = """
Here is the output. [[slnc 400]] The findings for the five policies. [[slnc 300]] The deployer has a star resource and an escalation. [[slnc 500]] The deployer as written, and its count: three of twenty five.
[[page]]
The three steps to more power. [[slnc 300]] Pass role, create function, and invoke function. [[slnc 500]] So read the policy as well as counting it. [[slnc 500]] And the limits: this evaluator ignores resource policies and organisation rules, and it refuses a statement with a condition, rather than guess.
"""
