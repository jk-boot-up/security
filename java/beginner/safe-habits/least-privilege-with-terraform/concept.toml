# concept.toml: everything about this project that is not Java code.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "least-privilege-with-terraform"
module = "safe-habits"
title = "Least Privilege with Terraform and LocalStack"
short_title = "Least Privilege with Terraform"
package = "leastprivilegetf"
main_class = "LeastPrivilegeTerraformDemo"
tagline = "Permissions written as code, and read back by a program"
bold = "Write permissions as infrastructure code so that they can be read, counted and linted before they are applied: scope each policy, let an explicit deny and a boundary narrow it further, and watch for the shapes that quietly grant more power."
domain = "an online store"
domain_note = ""
youtube_description = """Least privilege with Terraform and LocalStack, in Java: cloud permissions are code, so they can be checked like code. Explained with an online store, like a key cabinet where the nightly export gets a key to one drawer and not the master key. We write AWS IAM policies in Terraform, apply them with OpenTofu to a local AWS emulator in Docker, read the same policies back in Java and count the blast radius of each, see how wildcard matching and the difference between a bucket and its contents trips people up, watch an explicit deny and a permissions boundary narrow an over-broad policy, and run a linter that catches iam PassRole on every role. Everything runs on your own machine, with no cloud account."""
thumb_lines = ["LEAST PRIVILEGE", "TERRAFORM + LOCALSTACK"]
thumb_code = "data aws_iam_policy_document"
youtube_title = "Least Privilege with Terraform and LocalStack (IAM Policies, Blast Radius, Boundaries)"
youtube_tags = ["least privilege", "terraform", "opentofu", "localstack", "iam policy", "permissions boundary", "blast radius", "java", "cybersecurity for beginners"]

[readme]
technologies = [
    ["OpenTofu", "1.13.1", "applies the Terraform code in the integration tests; Terraform itself also works and is used if OpenTofu is missing"],
    ["Terraform AWS provider", "6.69.1", "talks to the emulator's IAM service"],
    ["LocalStack (community image)", "4.14.0", "a local AWS emulator in Docker; the last community tag that starts without an account token"],
    ["Docker", "required for the integration tests", "runs the emulator"],
]
intro = """
In a cloud account, **permissions are written as policies**: JSON documents that list which **actions** (such as `s3:GetObject`) may be done on which **resources** (such as one bucket). Tools such as **Terraform** and its open-source fork **OpenTofu** let you
write those policies as code, review them in a pull request and apply them in one step. Because they are code, they can also be **read by a program**. This project writes five policies in Terraform for an online store, applies them with OpenTofu to a **local AWS emulator**
(LocalStack in Docker, so no cloud account), and reads the same JSON back in Java, where an evaluator follows AWS's rules: deny by default, an explicit deny always wins, and a **permissions boundary** limits what any policy can grant.

The demo counts each identity's **blast radius**, how many of 25 things it could do if its key were stolen, and a **linter** reads the text of a policy for wildcards and for ways to grow one's own power.
"""
analogy = """
Think of a key cabinet in the shop. The nightly export gets a key to one drawer and not the master key. A note on the cabinet says "nobody takes the key to the safe", and that note beats any other permission slip. A sign on the staff door says "visitors may go no further than the shop floor, whatever slip
they hold". The notes are written down in a book anyone can read, so before a key is handed out, someone can count which doors it opens.
"""
scenario = """
An online store's account has 25 things that can be done: reading and writing reports, querying orders and customers, changing who may do what, decrypting with a key, and deploying a function. The demo writes five policies, from a wildcard shortcut to a scoped export role, and
counts, matches and lints them.
"""
costs = [
    "**The emulator does not enforce the policies.** The free LocalStack image stores IAM policies but does not enforce them, so the Java evaluator is checked against what Terraform writes and the emulator stores, and not against a real denial. Enforcement needs a real account or a paid emulator.",
    "**The evaluator is a model.** It handles actions, resources, deny, boundaries and NotAction, and refuses conditions. Real AWS also has resource policies, organisation rules, session policies and conditions.",
    "**Counting hides escalation.** An identity with a small count can still be dangerous, such as one that may pass any role to a new function, so the policy has to be read as well as counted.",
    "**Code review only helps if someone reviews.** Policies as code make the review possible, not automatic.",
]
too_much = """
For a personal project, one or two scoped policies are enough. In a team, writing every permission as code and linting it in the pipeline is cheap and catches the common mistakes before they reach an account.
"""
met_before = [
    "`aws_iam_policy_document` and `aws_iam_policy` in Terraform repositories.",
    "IAM Access Analyzer and \"policy validation\" findings in cloud consoles.",
    "`\"Action\": \"*\"` and `\"Resource\": \"*\"` in blog posts, and in breach reports.",
    "Terraform plans reviewed in pull requests.",
]
where = """
This project follows [least-privilege](../least-privilege), [least-privilege-with-spring-security](../least-privilege-with-spring-security) and [least-privilege-with-kubernetes-rbac](../least-privilege-with-kubernetes-rbac), and is the last in [safe-habits](..) for least privilege.
"""
twin = """
The five policies are the JSON that OpenTofu emitted when it applied the Terraform code in `infra/terraform`, saved as fixtures, so the demo needs no tool and prints the same on every run. The integration tests start LocalStack in Docker, apply the code with OpenTofu,
and check that what the emulator stores equals the fixtures. The emulator is local, with test credentials, and is always removed afterwards.
"""
test_note = "The demo reads fixtures, so it needs only a JDK. The integration tests (tagged terraform) start a LocalStack container, apply the Terraform code with OpenTofu, and compare the stored policies with the fixtures the Java evaluator uses; the container is always removed."

[[act]]
title = "Policies written as code"
summary = "The account offers 25 things to do; the wildcard policy allows all 25, the nightly export needs 3, and a deploy policy that looks small also allows 3."
detail = """
The store's account offers 25 things to do: an action on a resource, such as reading one report or querying one table. The wildcard policy, with one statement, lets an identity do all 25. The exporter policy, with three statements, lets it do 3, which is all the nightly export needs.
The deployer policy allows 3 too. The number of things an identity can do if its key is stolen is its blast radius.
"""
speech = """
First demo: policies written as code. [[slnc 400]] The store's account offers twenty five things to do. [[slnc 600]]
The wildcard policy lets an identity do all twenty five. [[slnc 600]]
The export policy lets it do three. [[slnc 300]] That is all the nightly export needs. [[slnc 600]]
The number of things an identity can do, if its key is stolen, is its blast radius.
"""
rows = { code = "active ok" }
console = [
    ["the store's account offers 25 things to do: an action on a resource", "muted"],
    ["policy wildcard: 1 statement(s), so an identity wearing it can do 25 of 25", "bad"],
    ["policy exporter: 3 statement(s), so an identity wearing it can do 3 of 25", "ok"],
    ["policy deployer: 2 statement(s), so an identity wearing it can do 3 of 25", "amber"],
    ["the number of things an identity can do if its key is stolen is its blast radius", "muted"],
]

[[act]]
title = "How a request is matched"
summary = "The exporter may read a report file and list the reports bucket, but not the secret file, and not the bucket as if it were a file; action names ignore case, and anything not allowed is denied."
detail = """
The exporter reads a report file: allowed. It reads a secret file: denied by default. It lists the reports bucket: allowed. Listing with a file's name instead of the bucket's is denied, and reading the bucket itself as if it were a file is denied too, because the slash-star
in the policy means the contents and not the bucket. Action names ignore case. The pattern s3:Get* matches s3:GetObject and not s3:PutObject. Anything not allowed is denied by default.
"""
speech = """
Second demo: how a request is matched. [[slnc 400]] The exporter may read a report file. [[slnc 300]] It may not read a secret file. [[slnc 600]]
It may list the reports bucket. [[slnc 300]] But a bucket and its contents are different resources. [[slnc 300]] So listing with a file's name is denied. [[slnc 300]] And reading the bucket as if it were a file is denied too. [[slnc 600]]
Action names ignore case. [[slnc 300]] And anything not allowed is denied by default.
"""
rows = { match = "active ok" }
console = [
    ["exporter reads a report file: ALLOW", "ok"],
    ["exporter reads a secret file: IMPLICIT_DENY", "ok"],
    ["exporter lists the reports bucket: ALLOW", "ok"],
    ["exporter lists using a file's name instead of the bucket's: IMPLICIT_DENY", "amber"],
    ["exporter reads the bucket itself as if it were a file: IMPLICIT_DENY  <- /* means the contents, not the bucket", "amber"],
    ["action names ignore case, s3:getobject: ALLOW", "muted"],
    ["the pattern s3:Get* matches s3:GetObject: true, and s3:PutObject: false", "muted"],
]

[[act]]
title = "A deny beats every allow"
summary = "Admin with a deny on secrets can do 20 of 25 against 25 without it; the secret file is explicitly denied, and the order of statements does not matter."
detail = """
An admin policy with an explicit deny on the secrets can do 20 of 25 things, against 25 without the deny. Reading the secret file is an explicit deny, while writing a report is allowed. With the statements in the opposite order the answer is the same.
The deny is a safety net, and it still leaves 20 things open.
"""
speech = """
Third demo: a deny beats every allow. [[slnc 400]] An admin policy with an explicit deny on the secrets can do twenty of twenty five things. [[slnc 600]]
Reading the secret file is denied. [[slnc 300]] Writing a report is allowed. [[slnc 600]]
Put the statements in the opposite order, and the answer is the same. [[slnc 600]]
The deny is a safety net. [[slnc 300]] And it still leaves twenty things open.
"""
rows = { deny = "active amber" }
console = [
    ["admin with a deny on secrets can do 20 of 25, against 25 without the deny", "amber"],
    ["reading the secret file: EXPLICIT_DENY", "ok"],
    ["writing a report: ALLOW", "muted"],
    ["with the statements in the opposite order the answer is the same: true", "ok"],
    ["the deny is a safety net, and it still leaves 20 things open", "amber"],
]

[[act]]
title = "A permissions boundary"
summary = "The wildcard policy alone allows 25 of 25 and under the boundary 8 of 25; the boundary alone grants 0; admin with a deny under the boundary is also 8."
detail = """
The wildcard policy alone allows 25 of 25. The same policy under the boundary allows 8 of 25. The boundary alone, with nothing attached to the identity, allows 0: a boundary grants nothing. Admin with a deny, under the boundary, is also 8 of 25.
An identity gets only what both its policies and its boundary allow.
"""
speech = """
Fourth demo: a permissions boundary. [[slnc 400]] The wildcard policy alone allows all twenty five. [[slnc 600]]
The same policy under the boundary allows eight. [[slnc 600]]
The boundary alone grants nothing at all. [[slnc 600]]
An identity gets only what both its policies and its boundary allow.
"""
rows = { boundary = "active ok" }
console = [
    ["the wildcard policy alone: 25 of 25", "bad"],
    ["the same policy under the boundary: 8 of 25", "ok"],
    ["the boundary alone, with nothing attached to the identity: 0 of 25  <- A BOUNDARY GRANTS NOTHING", "ok"],
    ["admin with a deny, under the boundary: 8 of 25", "ok"],
    ["an identity gets only what both its policies and its boundary allow", "muted"],
]

[[act]]
title = "A linter, and the way to more power"
summary = "The linter flags the wildcard policies and finds iam:PassRole on every role in the deployer policy, which counts as only 3 of 25 and is still dangerous."
detail = """
A linter reads the text of each policy. It finds the star action and star resource in the wildcard and admin policies, nothing in the exporter, and in the deployer policy iam:PassRole on every resource. The deployer can do only 3 of 25 things and is still dangerous:
passing any role to a new function runs code as any role in the account. The count hides escalation, so read the policy as well as counting it. This evaluator ignores conditions, resource policies and organisation rules, and refuses a statement with a condition.
"""
speech = """
Fifth demo: a linter. [[slnc 400]] The linter reads the text of each policy. [[slnc 600]]
It finds the star action, and the star resource. [[slnc 300]] The export policy has no findings. [[slnc 600]]
The deploy policy can do only three things. [[slnc 300]] But it may pass any role to a new function. [[slnc 300]] That runs code as any role in the account. [[slnc 600]]
The count hides escalation. [[slnc 300]] So read the policy, as well as counting it.
"""
rows = { lint = "active wrong" }
console = [
    ["wildcard: 2 finding(s) (ACTION_STAR 1, RESOURCE_STAR 1)", "bad"],
    ["exporter: 0 finding(s)", "ok"],
    ["deployer: 2 finding(s) (RESOURCE_STAR 1, ESCALATION 1)", "bad"],
    ["deployer can do only 3 of 25, and is still dangerous: iam:PassRole on every role plus lambda:CreateFunction runs code as any role in the account", "amber"],
    ["the count hides escalation, so read the policy as well as counting it", "amber"],
    ["this evaluator ignores conditions, resource policies and organisation rules, and refuses a statement with a condition: true", "muted"],
]

[animation]
