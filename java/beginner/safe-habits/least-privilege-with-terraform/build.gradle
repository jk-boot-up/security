plugins {
    id 'java'
    id 'application'
}

group = 'com.jk.explore.security'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'tools.jackson.core:jackson-databind:3.2.3'

    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.jk.explore.security.leastprivilegetf.LeastPrivilegeTerraformDemo'
}

// `./gradlew test` needs nothing installed. Tests tagged "terraform" run OpenTofu against a local AWS emulator (LocalStack in
// Docker) as an independent check of the policies: run them with `./gradlew integrationTest` (needs Docker and tofu).
test {
    useJUnitPlatform {
        excludeTags 'terraform'
    }
}

tasks.register('integrationTest', Test) {
    description = 'Runs the tests that apply the Terraform code to LocalStack with OpenTofu.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'terraform'
    }
    shouldRunAfter test
}

// No deprecated or to-be-removed API is allowed in any project: a warning fails the build.
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.addAll(['-Xlint:deprecation', '-Xlint:removal', '-Werror'])
}
