plugins {
    id 'java'
    id 'application'
}

group = 'com.jk.explore.security'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.snakeyaml:snakeyaml-engine:3.2'

    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.jk.explore.security.leastprivilegek8s.LeastPrivilegeK8sDemo'
}

// `./gradlew test` needs nothing installed. Tests tagged "k8s" make a real kind cluster and ask it with kubectl, as an
// independent check of the Java evaluator: run them with `./gradlew integrationTest` (needs Docker, kind and kubectl).
test {
    useJUnitPlatform {
        excludeTags 'k8s'
    }
}

tasks.register('integrationTest', Test) {
    description = 'Runs the tests that create a kind cluster and call kubectl.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'k8s'
    }
    shouldRunAfter test
}

// No deprecated or to-be-removed API is allowed in any project: a warning fails the build.
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.addAll(['-Xlint:deprecation', '-Xlint:removal', '-Werror'])
}
