# concept.toml: everything about this project that is not Java code.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "least-privilege-with-kubernetes-rbac"
module = "safe-habits"
title = "Least Privilege with Kubernetes RBAC"
short_title = "Least Privilege with Kubernetes"
package = "leastprivilegek8s"
main_class = "LeastPrivilegeK8sDemo"
tagline = "Give each identity only what its job needs"
bold = "Kubernetes RBAC denies everything until a rule allows it, and the damage from a stolen token is set by the rules you wrote: cluster-admin, wildcards and the create-pods and bind verbs are where least privilege is lost."
domain = "an online store"
domain_note = ""
youtube_description = """Least privilege with Kubernetes RBAC, in Java: every service account is a key, and the question is how many doors it opens. Explained with an online store, like a master key given to the night cleaner. We compare a nightly export job given cluster-admin with one scoped to two actions, fall into the wildcard trap where read everything includes secrets, find the escalation paths of create pods, bind and escalate, see that a namespaced binding keeps a cluster-wide role inside its namespace, and lint the manifests. The Java evaluator is checked against a real kind cluster and kubectl auth can-i."""
thumb_lines = ["LEAST PRIVILEGE", "KUBERNETES RBAC"]
thumb_code = "kubectl auth can-i get secrets"
youtube_title = "Least Privilege with Kubernetes RBAC (cluster-admin, Wildcards, Escalation)"
youtube_tags = ["kubernetes", "rbac", "least privilege", "service account", "cluster-admin", "kind", "kubectl", "java", "cybersecurity for beginners"]

[readme]
technologies = [
    ["kind", "0.33.0", "makes a real Kubernetes cluster in Docker for the integration tests"],
    ["kubectl", "1.27.2 (client)", "asks the cluster `auth can-i` as each service account; newer than the supported skew is only a warning"],
    ["Kubernetes", "1.37.0 (kindest/node image)", "the cluster the manifests are applied to in the integration tests"],
    ["Docker", "required for the integration tests", "runs the kind node"],
]
intro = """
In Kubernetes every program that talks to the cluster has an identity, usually a **service account**, and a token that proves it. **RBAC** (role-based access control) decides what each identity may do. It is **deny by default**: nothing is allowed until a **Role**
(rules in one namespace) or a **ClusterRole** (rules for the whole cluster) says so, and a **RoleBinding** or **ClusterRoleBinding** gives the role to an identity. A rule lists **verbs** (get, list, create, delete ...) on **resources** (pods, secrets ...), and can name the objects it covers.

This project reads real manifests, answers the question `kubectl auth can-i` answers, counts the **blast radius** of a stolen token, finds the escalation paths, and lints the manifests. The integration tests make a real cluster with kind and check that it answers exactly as the Java code does.
"""
analogy = """
Think of the keys of a shop. A master key given to the night cleaner "to make it work" opens the till, the stockroom and the office. A key cut for the cleaner's cupboard opens one door. A key that says "all doors on the ground floor" sounds modest, until you remember the safe is on the ground floor.
"""
scenario = """
An online store runs its jobs as service accounts. A nightly export was given cluster-admin, a reporting job was given "get and list everything", and the deploy pipeline can create pods. The demo asks what each stolen token could do.
"""
costs = [
    "**Narrow roles need maintenance.** Each new feature may need a new permission, so the rules need an owner and a review.",
    "**RBAC has no deny rules.** You can only leave permissions out, so one extra binding can undo careful work, and the audit has to look at all of them.",
    "**The Java evaluator is a model.** It ignores API groups, non-resource URLs, aggregated roles and groups of users, so it teaches the idea and does not replace asking the cluster.",
    "**Real clusters add roles you did not write.** Built-in and operator-installed roles also grant permissions, so check with `kubectl auth can-i --list`.",
]
too_much = """
For a throwaway local cluster, cluster-admin is fine. For anything that holds real data or is reachable by other people, give each workload its own service account, bind it in one namespace, and turn off token mounting for pods that do not call the API.
"""
met_before = [
    "`cluster-admin` in tutorials, copied into production.",
    "`kubectl auth can-i` and `kubectl auth can-i --list`.",
    "Cloud kubernetes services that map cloud identities onto service accounts.",
    "Reports that begin \"a pod's service account token was stolen\".",
]
where = """
This project follows [least-privilege](../least-privilege) and [least-privilege-with-spring-security](../least-privilege-with-spring-security). The first modelled the ideas in memory, the second applied them in a Spring application, and this one applies them to the platform the application runs on.
"""
twin = """
The demo reads the manifests in `infra/rbac` and needs no cluster, so it is the same on every machine. The integration tests create a kind cluster with a generated name, apply the same manifests, ask `kubectl auth can-i` for 490 combinations of identity, namespace, resource and verb, and always delete the cluster.
"""
test_note = "The demo and the default tests read the manifests and need nothing installed. The integration tests (tagged k8s) make a real kind cluster, compare 490 kubectl answers with the Java evaluator, and always delete the cluster."

[[act]]
title = "The nightly job that was given cluster-admin"
summary = "The namespace has 7 verbs x 8 resources = 56 things a token could do; a stolen cluster-admin token reaches 56 of 56, the scoped exporter 2 of 56 plus one named config map, and no secrets."
detail = """
The shop's namespace has 7 verbs (get, list, watch, create, update, patch, delete) on 8 resources (pods, pods/exec, secrets, configmaps, services, deployments, roles, rolebindings): 7 x 8 = 56 things a token could be used for.
Before the fix, the nightly-export-admin service account is bound to cluster-admin, and a stolen token reaches all 56, and the whole cluster as well. After the fix, the exporter has the role order-exporter with two rules: get and list on pods, and get on the one config map named export-settings.
A stolen exporter token reaches 2 of 56, plus that named config map. It can read export-settings, not payment-keys, and not secrets.
"""
figure = "blast_grid"
figure_title = "56 things a token could do, before and after"
figure_speech = """
First demo: the nightly job that was given cluster admin. [[slnc 400]] Each grid is everything a token could do in the shop's namespace. [[slnc 300]] Seven verbs across the top: get, list, watch, create, update, patch, and delete. [[slnc 300]] Eight resources down the side: pods, secrets, config maps, deployments, roles, and so on. [[slnc 300]] Seven times eight is fifty six. [[slnc 700]]
On the left, in red, before the fix. [[slnc 300]] The nightly export runs with cluster admin. [[slnc 300]] Every one of the fifty six cells is filled. [[slnc 300]] A thief with that token can read the secrets, delete the deployments, and rewrite the roles. [[slnc 300]] In every namespace of the cluster. [[slnc 700]]
On the right, in green, after the fix. [[slnc 300]] The exporter's role has two rules. [[slnc 300]] Get and list on pods: two cells. [[slnc 300]] And get on one config map, by name. [[slnc 300]] That one is outlined in amber, because it allows a single object, not the whole kind. [[slnc 600]]
Two of fifty six. [[slnc 300]] The job still works.
"""
speech = """
Here is the real output. [[slnc 400]] First, the namespace: seven verbs, eight resources, fifty six things. [[slnc 500]] Before the fix, a stolen token reaches fifty six of fifty six. [[slnc 400]] After the fix, the exporter's two rules, and two of fifty six.
[[page]]
Then three checks for the exporter. [[slnc 300]] The named config map: true. [[slnc 300]] Another config map, payment keys: false. [[slnc 300]] The secrets: false.
"""
rows = { admin = "active wrong", scoped = "active ok" }
console = [
    ["THE NAMESPACE shop (what a token could be used for):", "code"],
    ["  7 verbs      get list watch create update patch delete", "muted"],
    ["  8 resources  pods pods/exec secrets configmaps services", "muted"],
    ["               deployments roles rolebindings", "muted"],
    ["  7 x 8 = 56 things", "muted"],
    ["BEFORE THE FIX (nightly-export-admin, bound to cluster-admin):", "bad"],
    ["  a stolen token reaches 56 of 56  <- THE WHOLE CLUSTER", "bad"],
    ["AFTER THE FIX (exporter, with the role order-exporter):", "ok"],
    ["  rule 1  get, list on pods", "muted"],
    ["  rule 2  get on configmaps named export-settings", "muted"],
    ["  a stolen token reaches 2 of 56, plus one named config map", "muted"],
    ["---", ""],
    ["THE CHECKS (can the exporter ...?):", "code"],
    ["  get configmap export-settings  true", "amber"],
    ["  get configmap payment-keys     false", "ok"],
    ["  get secrets                    false", "ok"],
]

[[act]]
title = "The wildcard trap: read everything"
summary = "The role report-reader says get and list on *; it sounds read-only and harmless, but it reads every secret, and reaches 16 of 56: 2 verbs x 8 resources."
detail = """
The reporter's role, report-reader, has one rule: get and list on *, which means every resource. Read everything sounds read-only and harmless.
But secrets are a resource too, so the reporter can read every password and key in the namespace. It cannot update a deployment. It reaches 16 of 56: 2 verbs x 8 resources.
And * also covers kinds of object added after the role was written. Name the resources instead, and use resourceNames for a single object.
"""
figure = "wildcard"
figure_title = "What \"read everything\" really allows"
figure_speech = """
Second demo: the wildcard trap. [[slnc 400]] On the left, in blue, the role as written. [[slnc 300]] One rule: get and list, on star. [[slnc 300]] Star means every resource. [[slnc 500]] Read everything. [[slnc 300]] It sounds read only, and harmless. [[slnc 700]]
Below, in red, what it really allows. [[slnc 300]] Get secrets: true. [[slnc 300]] Every password and key in the namespace. [[slnc 300]] Update deployments: false. [[slnc 300]] So it is read only. [[slnc 300]] But reading is enough to steal. [[slnc 600]]
On the right, the same grid as before. [[slnc 300]] The two columns get and list are filled, all the way down. [[slnc 300]] Two verbs times eight resources is sixteen. [[slnc 300]] And the secrets row, in red, is the one that matters. [[slnc 600]]
A star also covers kinds of object that are added later. [[slnc 300]] So name the resources you mean.
"""
speech = """
The output prints the role as written, then what it really allows. [[slnc 400]] Get secrets, true. [[slnc 300]] Update deployments, false. [[slnc 300]] Sixteen of fifty six. [[slnc 500]] And the advice: name the resources, and use resource names for a single object.
"""
rows = { wildcard = "active wrong" }
console = [
    ["THE ROLE AS WRITTEN (report-reader, held by reporter):", "code"],
    ["  rule 1  get, list on *", "muted"],
    ["  \"read everything\": it sounds read-only and harmless", "muted"],
    ["WHAT IT REALLY ALLOWS:", "code"],
    ["  get secrets         true  <- EVERY PASSWORD AND KEY", "bad"],
    ["  update deployments  false", "ok"],
    ["  reaches 16 of 56: 2 verbs x 8 resources", "muted"],
    ["* also covers kinds added after the role was written;", "muted"],
    ["name the resources, and use resourceNames for one object", "muted"],
]

[[act]]
title = "Ways to become more powerful"
summary = "The deployer role cannot read secrets, yet has 4 escalation paths: create pods (a pod mounts any secret), create role bindings, bind and escalate; the exporter has none."
detail = """
The role deployer, held by the ci-deployer service account, has four rules: get, list and create on pods; get, list, create, update and patch on deployments; create on rolebindings; and bind and escalate on roles.
It cannot get secrets. But it has 4 escalation paths, ways to become more powerful than it was given: it can create pods, and a pod can mount any secret or token; it can create role bindings; it can bind roles it does not hold; and it can edit roles to add permissions it does not hold. The exporter has none.
So create pods is the same as read secrets, and bind or escalate is the same as owning the namespace.
"""
figure = "escalation"
figure_title = "Four ways to more power than the role says"
figure_speech = """
Third demo: escalation. [[slnc 400]] Escalation means becoming more powerful than you were given. [[slnc 600]]
On the left, in blue, the role the deploy pipeline holds. [[slnc 300]] Four rules. [[slnc 300]] Create pods. [[slnc 200]] Change deployments. [[slnc 200]] Create role bindings. [[slnc 200]] And bind and escalate on roles. [[slnc 300]] There is no rule for secrets. [[slnc 600]]
On the right, in red, where each rule leads. [[slnc 400]] Create pods. [[slnc 300]] A new pod can mount any secret in the namespace, so the pipeline can read them after all. [[slnc 400]] Create role bindings. [[slnc 300]] It can bind itself to any role. [[slnc 400]] Bind. [[slnc 300]] It can hand out a role it does not hold. [[slnc 400]] And escalate. [[slnc 300]] It can add any permission to a role. [[slnc 600]]
The exporter, in green, has none of these. [[slnc 300]] The deployer has four.
"""
speech = """
The output first lists the deployer's four rules. [[slnc 400]] Then the escalation paths: none for the exporter, four for the deployer. [[slnc 500]] Get secrets, false. [[slnc 300]] But create pods, true. [[slnc 300]] And a pod can mount the secrets. [[slnc 300]] So create pods is as powerful as read secrets.
"""
rows = { escalate = "active wrong" }
console = [
    ["THE ROLE (deployer, held by ci-deployer):", "code"],
    ["  rule 1  get, list, create on pods", "muted"],
    ["  rule 2  get, list, create, update, patch on deployments", "muted"],
    ["  rule 3  create on rolebindings", "muted"],
    ["  rule 4  bind, escalate on roles", "muted"],
    ["THE ESCALATION PATHS (exporter 0, ci-deployer 4):", "code"],
    ["  create pods, which can mount any secret or token", "muted"],
    ["  create role bindings", "muted"],
    ["  bind roles it does not hold", "muted"],
    ["  edit roles to add permissions it does not hold", "muted"],
    ["ci-deployer: get secrets false, but create pods true", "amber"],
    ["a pod can mount the secrets  <- CREATE PODS = READ SECRETS", "bad"],
    ["and bind or escalate = owning the namespace", "muted"],
]

[[act]]
title = "A cluster-wide role through a namespaced binding"
summary = "shop-viewer is a ClusterRole; the support agent holds it through a RoleBinding in shop, so it may list pods in shop but not in warehouse; a ClusterRoleBinding reaches warehouse too."
detail = """
The role shop-viewer is a ClusterRole: it has no namespace, and its rule is get, list and watch on pods, services and configmaps. The support agent holds it through a RoleBinding in the shop namespace.
So the support agent can list pods in shop, but not in warehouse, and cannot delete pods in shop. By contrast, the nightly-export-admin is bound by a ClusterRoleBinding, and can list pods in warehouse: a cluster binding ignores namespaces.
The binding sets the scope, not the role: a role can be shared, and the binding is where the reach is decided.
"""
figure = "scope"
figure_title = "The binding sets the scope, not the role"
figure_speech = """
Fourth demo: where the scope is set. [[slnc 400]] At the top, in green, a cluster role called shop viewer. [[slnc 300]] A cluster role has no namespace. [[slnc 300]] Its rule lets you get, list and watch pods, services, and config maps. [[slnc 700]]
Below, two namespaces: shop, and warehouse. [[slnc 400]] In shop, a role binding gives that cluster role to the support agent. [[slnc 400]] List pods in shop: true. [[slnc 300]] Delete pods in shop: false, because the rule never said delete. [[slnc 400]] In warehouse: list pods, false. [[slnc 300]] The role binding lives in shop, so it only reaches shop. [[slnc 700]]
On the right, in red, the contrast. [[slnc 300]] The nightly export admin is bound by a cluster role binding. [[slnc 300]] It can list pods in warehouse too. [[slnc 300]] A cluster binding ignores namespaces. [[slnc 600]]
So the same role can be shared. [[slnc 300]] The binding decides how far it reaches.
"""
speech = """
The output shows the role and the binding, then three checks for the support agent: true, false, false. [[slnc 500]] And, by contrast, the cluster role binding: true in warehouse. [[slnc 400]] The binding sets the scope, not the role.
"""
rows = { scope = "active ok" }
console = [
    ["THE ROLE AND THE BINDING:", "code"],
    ["  shop-viewer is a ClusterRole: it has no namespace", "muted"],
    ["  rule 1  get, list, watch on pods, services, configmaps", "muted"],
    ["  support-agent holds it by a RoleBinding in shop", "muted"],
    ["THE CHECKS (can support-agent ...?):", "code"],
    ["  list pods in shop        true", "amber"],
    ["  list pods in warehouse   false", "ok"],
    ["  delete pods in shop      false", "ok"],
    ["BY CONTRAST, A ClusterRoleBinding (nightly-export-admin):", "code"],
    ["  list pods in warehouse   true  <- IGNORES NAMESPACES", "bad"],
    ["the binding sets the scope, not the role", "muted"],
]

[[act]]
title = "A linter for the habits that cause incidents"
summary = "The linter reads the shop's manifests, 5 roles, 5 bindings and 6 service accounts, and finds 6 problems: cluster-admin, a wildcard, two escalation verbs and two tokens mounted into every pod."
detail = """
The linter reads the manifests in infra/rbac/shop.yaml: 5 roles, 5 bindings and 6 service accounts. It finds 6 problems: a binding to cluster-admin, a role with wildcard resources, the escalation verbs escalate and bind, and two service accounts whose token is mounted into every pod.
A linter finds wildcards and cluster-admin; it does not find a role that is too wide but spelled out in full. So ask the cluster too, with kubectl auth can-i --list for each service account.
"""
figure = "findings"
figure_title = "What the linter finds"
figure_speech = """
Fifth demo: a linter. [[slnc 400]] A linter is a program that reads the manifests and looks for known bad habits. [[slnc 600]]
At the top, what it read: five roles, five bindings, and six service accounts. [[slnc 600]]
Below, the six findings. [[slnc 400]] One, in red: a binding to cluster admin. [[slnc 300]] The nightly export again. [[slnc 400]] One, in amber: a role with a wildcard for resources. [[slnc 300]] The report reader. [[slnc 400]] Two, in red: the escalation verbs escalate and bind, in the deployer. [[slnc 400]] And two, in blue: service accounts whose token is mounted into every pod, even pods that never use it. [[slnc 700]]
A linter catches these easily. [[slnc 300]] It cannot catch a role that is too wide, but spelled out in full. [[slnc 300]] So ask the cluster as well.
"""
speech = """
The output lists what the linter read, then the six findings, one per line: the object, and the problem. [[slnc 500]] And the command to ask a real cluster what one service account can do: kubectl auth can I, dash dash list.
"""
rows = { lint = "active amber" }
console = [
    ["THE MANIFESTS (infra/rbac/shop.yaml):", "code"],
    ["  5 roles, 5 bindings, 6 service accounts", "muted"],
    ["THE FINDINGS (6):", "code"],
    ["  nightly-export-is-admin  binds cluster-admin", "bad"],
    ["  report-reader            wildcard resources", "amber"],
    ["  deployer                 escalation verb escalate", "bad"],
    ["  deployer                 escalation verb bind", "bad"],
    ["  default                  token is mounted into every pod", "amber"],
    ["  nightly-export-admin     token is mounted into every pod", "amber"],
    ["a linter finds wildcards and cluster-admin,", "amber"],
    ["not a role that is too wide but spelled out in full", "muted"],
    ["ask the cluster too:", "muted"],
    ["  kubectl auth can-i --list -n shop \\", "muted"],
    ["    --as=system:serviceaccount:shop:exporter", "muted"],
]

