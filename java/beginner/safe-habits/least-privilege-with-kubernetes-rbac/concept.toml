[docs.session]
objectives = [
    "explain deny by default and how roles and bindings combine",
    "count the blast radius of a service account",
    "name three verbs that allow escalation",
    "say why the binding, not the role, sets the scope",
]
walkthrough = """
Start with the master key analogy. Run the demo one act at a time and open `infra/rbac/shop.yaml` beside it. After act two, ask what else "everything" would include in a cluster that has custom resources. After act three, ask how to let a pipeline deploy without giving it the power to read secrets.
"""
exercises = [
    "Change the reporter's role to name pods and services only, and check its blast radius.",
    "Add a RoleBinding that gives the support agent shop-viewer in warehouse and see act four change.",
    "Run `kubectl auth can-i --list` as the exporter in a kind cluster and compare it with the manifest.",
    "Add a lint rule for ClusterRoleBindings that name the default service account.",
]

[docs.explained]
sentence = """
RBAC allows only what a rule says, so the harm from a stolen token is the sum of its rules, and the common mistakes are cluster-admin, wildcards, and the verbs that let an identity grant itself more.
"""
verdict = """
One service account per workload, bound in one namespace, with rules that name resources and, where possible, objects. Turn off token mounting where the pod does not call the API. Review any binding to cluster-admin and any use of create pods, bind, escalate or impersonate, and check with `kubectl auth can-i --list`.
"""
recognise = [
    "`cluster-admin` bindings in install guides.",
    "`resources: [\"*\"]` in Helm charts.",
    "`automountServiceAccountToken: false` in hardened manifests.",
    "Policy tools that fail a build on cluster-admin.",
]

[spec]
