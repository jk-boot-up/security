    "Admission control, network policies and pod security standards.",
    "Groups, users, aggregated roles and non-resource URLs.",
    "Cloud identity mapping.",
]
problem = """
Learners see RBAC as YAML to copy. They need to see what the rules add up to, and what a stolen token could do.
"""
roles = [["Reading manifests", "`Manifests`"], ["Answering can-i", "`Rbac`"], ["Finding bad habits", "`Linter`"], ["Entry point", "`LeastPrivilegeK8sDemo`"], ["Real cluster check", "`KubectlInteropTest`"]]
requirements = [
    "The evaluator denies by default and matches verbs, resources and resource names.",
    "A namespaced binding applies only in its namespace, even to a ClusterRole.",
    "Blast radius and escalation paths are computed for each identity.",
    "The linter finds the six problems in the shop manifests.",
