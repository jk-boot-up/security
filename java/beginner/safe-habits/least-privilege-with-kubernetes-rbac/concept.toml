[poster]
headline = [["LEAST PRIVILEGE", "text"], ["KUBERNETES RBAC", "accent"]]
taglines = [["Give each identity only what its job needs", "gold"]]
before = { code = "cluster-admin", note = "56 of 56 if stolen", tag = "BEFORE" }
after = { code = "Role: get, list pods", note = "2 of 56 if stolen", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "Least Privilege with Kubernetes RBAC"
narration = """Hello, and welcome. [[slnc 400]] This video explains least privilege with Kubernetes R B A C, which is role based access control, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] Every program in a cluster has an identity and a token. [[slnc 300]] R B A C decides what each identity may do, and it allows nothing until a rule says so. [[slnc 600]] Think of the keys of a shop. [[slnc 300]] A master key given to the night cleaner opens the till, the stockroom and the office. [[slnc 300]] A key cut for the cleaner's cupboard opens one door. [[slnc 700]] In this video, the domain is an online store. [[slnc 500]] By the end, you will hear how to count what a stolen token could do. [[slnc 300]] Why read everything is not harmless. [[slnc 300]] Which verbs let an identity grant itself more. [[slnc 300]] And how to check it all against a real cluster."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online store runs jobs in Kubernetes.", "", "A nightly export has cluster-admin.", "A report job can read everything.", "The deploy pipeline can create pods.", "", "What could each stolen token do?"]
narration = """Here is the scenario. [[slnc 400]] An online store runs its jobs in Kubernetes. [[slnc 500]] A nightly export was given cluster admin. [[slnc 300]] A report job can read everything. [[slnc 300]] The deploy pipeline can create pods. [[slnc 600]] What could each stolen token do?"""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["Service account: a job's identity", "Role: rules in one namespace", "ClusterRole: rules for the whole cluster", "Binding: gives a role to an identity", "Blast radius: what a stolen token can reach"]
narration = """Before the demos, the words. [[slnc 500]] A service account is a job's identity. [[slnc 500]] A role is a set of rules in one namespace. [[slnc 500]] A cluster role is a set of rules for the whole cluster. [[slnc 500]] A binding gives a role to an identity. [[slnc 500]] And the blast radius is what a stolen token can reach."""

[[scene]]
key = "03-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "04-rbac-chain"
kind = "figure"
title = "How RBAC gives a job a permission"
body = "rbac_chain"
narration = """Let's see the whole idea on one picture. [[slnc 400]] In Kubernetes, every program runs with an identity, called a service account. [[slnc 300]] Here it is the exporter, the nightly job that exports the orders. [[slnc 600]] On its own, a service account may do nothing at all. [[slnc 300]] A role binding joins it to a role. [[slnc 300]] And the role is a list of rules. [[slnc 600]] This role has two rules. [[slnc 300]] Get and list on pods. [[slnc 300]] And get, on one config map, named export settings. [[slnc 600]] On the left, three questions, and the answers. [[slnc 300]] Can it read export settings? True: a rule names it. [[slnc 300]] Can it read payment keys? False: no rule says so. [[slnc 300]] Can it read the secrets? False. [[slnc 600]] Nothing is allowed until a rule says so."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "09-ladder"
kind = "bullets"
title = "From Broad to Narrow"
body = ["cluster-admin: everything, everywhere", "Wildcards: more than they say", "Verbs that grant: create pods, bind, escalate", "A named role in one namespace: only the job", "The binding sets the reach."]
narration = """Let's put it side by side, broad to narrow. [[slnc 400]] Cluster admin. Everything, everywhere. [[slnc 500]] Wildcards. More than they say. [[slnc 500]] Verbs that grant. Create pods, bind, and escalate. [[slnc 500]] A named role in one namespace. Only the job. [[slnc 600]] And remember, the binding sets the reach, not the role."""

[[scene]]
key = "11-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["cluster-admin in install guides", "resources: * in charts", "automountServiceAccountToken: false", "kubectl auth can-i"]
narration = """You have probably met this already. [[slnc 400]] Cluster admin appears in install guides, and is copied into production. [[slnc 500]] A star for resources appears in charts. [[slnc 500]] Automount service account token false appears in hardened manifests. [[slnc 500]] And kubectl auth can i is how you ask the cluster what an identity may do."""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["One service account per workload", "Bind in one namespace", "Name resources, not wildcards", "Watch create pods, bind, escalate", "Check with kubectl auth can-i --list"]
narration = """So, how do you use it? [[slnc 400]] Give each workload its own service account. [[slnc 500]] Bind it in one namespace. [[slnc 500]] Name resources, instead of using wildcards. [[slnc 500]] Treat create pods, bind, and escalate as powerful as the things they can reach. [[slnc 500]] And check with kubectl auth can i, with the list option."""

[[scene]]
key = "12-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "13-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Name the resources", "in the reporter's role and count again."]
narration = """That's least privilege with Kubernetes R B A C. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] A token can do exactly what its rules add up to, so write the rules to add up to the job and nothing else. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] The demo runs with nothing installed except a Java development kit. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Name the resources in the reporter's role, and count the blast radius again. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
The RBAC configuration of a Kubernetes cluster that runs an online store's jobs: service accounts, roles, bindings, and the pipeline that applies them. It covers an attacker who steals a service account token or takes over a pipeline. It does not cover the nodes, the network, admission control or the applications' own authorization.
"""
assets = [
    "Secrets in the cluster, such as payment keys and database passwords.",
    "The ability to create workloads and bindings.",
    "Service account tokens.",
    "The manifests that define the rules.",
]
actors = [
    "Jobs and pipelines running as service accounts.",
    "An attacker who steals a token or takes over a job.",
    "A developer who writes or reviews the manifests.",
]
boundaries = [
    "Pod to API server: the token is the only proof of identity.",
    "Git repository to cluster: whatever is applied becomes the rules.",
    "Namespace to namespace: only bindings set the boundary.",
]
assumptions = [
    "The API server enforces RBAC correctly and the nodes are not compromised.",
    "Manifests are reviewed before they are applied.",
    "In the demo, names, passwords and keys are demo values, and the cluster is a throwaway kind cluster.",
]
out_of_scope = [
    "Admission control, pod security standards and network policies.",
    "Cloud identity mapping.",
    "Runtime detection.",
]
tests = [
    "`RbacTest` checks deny by default, cluster-admin, resource names, wildcards, binding scope, subresources and escalation paths.",
    "`ManifestsAndLinterTest` checks YAML parsing and the six lint findings.",
    "`KubectlInteropTest` (integration) makes a real kind cluster and compares 490 kubectl answers, the bind, escalate and exec verbs, and a named config map with the Java evaluator.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
This is the last project in the safe-habits track so far. The later projects return to identity and add a real identity provider.
"""

[[threat]]
id = "T1"
stride = "E"
threat = "A job is bound to cluster-admin or a wildcard role, so a stolen token controls the cluster"
where = "`nightly-export-is-admin`, `report-reader`"
control = "One service account per workload, scoped roles that name resources, and a linter that fails on cluster-admin and wildcards"
residual = "Roles still need review as features grow"

[[threat]]
id = "T2"
stride = "E"
threat = "An identity that can create pods or bindings makes itself more powerful"
where = "`deployer`, `ci-deployer`"
control = "Treat create pods, bind and escalate as the permissions they can reach, and limit them with admission policy"
residual = "RBAC alone cannot stop a pod from mounting the secrets of its namespace"

[[threat]]
id = "T3"
stride = "T"
threat = "A role is edited to grant more, and nobody notices"
where = "the RBAC rules"
control = "Keep manifests in git with review, and diff `kubectl auth can-i --list` over time"
residual = "Someone with escalate can change roles without review"

[[threat]]
id = "T4"
stride = "I"
threat = "A service account token is read from a pod, a log or a backup"
where = "the pod's mounted token"
control = "Turn off automounting where the pod does not call the API, and use short-lived bound tokens"
residual = "A token used by a running pod can still be read from that pod"

[[threat]]
id = "T5"
stride = "R"
threat = "Nobody can tell who applied a permission change, or why"
where = "the manifests repository"
control = "Review in git, and enable the API server's audit log"
residual = "Audit logs have to be kept and read"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] Three small classes do the work, and the demo class runs the five acts. [[slnc 300]] Here is what each one does."""

[[class]]
name = "Manifests"
what = "reads the YAML: roles, bindings and service accounts"
[[class.part]]
title = "the four kinds of record"
code = """
record Rule(List<String> verbs, List<String> resources, List<String> resourceNames) {
...
record Role(String namespace, String name, List<Rule> rules) {
...
record Binding(String namespace, String name, String roleKind, String roleName, List<Subject> subjects) {
...
record Account(String namespace, String name, boolean tokenAutomounted) {
"""
speech = """Manifests reads the same Y A M L file that a real cluster would apply. [[slnc 300]] A rule is verbs, resources, and optional names. [[slnc 300]] A role is a list of rules. [[slnc 300]] A binding joins subjects to a role. [[slnc 300]] A cluster role and a cluster binding simply have no namespace."""

[[class]]
name = "Rbac"
what = "answers: may this identity do this, here?"
[[class.part]]
title = "one rule allows a request"
code = """
static boolean allows(Rule rule, String verb, String resource, String objectName) {
    boolean verbOk = rule.verbs().contains("*") || rule.verbs().contains(verb);
    boolean resourceOk = rule.resources().contains("*") || rule.resources().contains(resource);
    boolean nameOk = rule.resourceNames().isEmpty()
            || (objectName != null && rule.resourceNames().contains(objectName));
    return verbOk && resourceOk && nameOk;
"""
speech = """A rule allows a request when the verb matches, the resource matches, and, if the rule names objects, the object is one of them. [[slnc 300]] A star matches anything. [[slnc 300]] That is the wildcard trap, in one line."""
[[class.part]]
title = "the binding sets the scope"
code = """
private static boolean appliesIn(Binding binding, String namespace) {
    return binding.namespace() == null || binding.namespace().equals(namespace);
"""
speech = """A binding with no namespace, a cluster role binding, applies everywhere. [[slnc 300]] A role binding applies only in its own namespace, even when it points at a cluster role."""
[[class.part]]
title = "blast radius: count every pair"
code = """
for (String resource : RESOURCES) {
    for (String verb : VERBS) {
        if (can(user, verb, resource, namespace)) {
            count++;
"""
speech = """The blast radius asks the same question for every verb and every resource. [[slnc 300]] Seven times eight is fifty six questions. [[slnc 300]] The count of yes answers is what a stolen token reaches."""

[[class]]
name = "Linter"
what = "finds the habits that cause incidents"
[[class.part]]
title = "wildcards and escalation verbs"
code = """
if (rule.resources().contains("*")) {
    findings.add(new Finding(role.name(), "wildcard resources"));
}
for (String verb : List.of("escalate", "bind", "impersonate")) {
    if (rule.verbs().contains(verb)) {
        findings.add(new Finding(role.name(), "escalation verb " + verb));
"""
speech = """The linter walks every rule of every role. [[slnc 300]] A star for resources is a finding. [[slnc 300]] So are the verbs escalate, bind and impersonate. [[slnc 300]] It also flags cluster admin bindings, and tokens mounted into every pod."""

[[acronym]]
short = "RBAC"
long = "Role-Based Access Control: permissions given through roles"
say = "R B A C is role based access control: permissions are written into roles, and roles are given to identities."
[[acronym]]
short = "YAML"
long = "YAML Ain't Markup Language: the manifest file format"
say = "Y A M L is the text format that Kubernetes manifests are written in."
[[acronym]]
short = "CI"
long = "Continuous Integration: the build and deploy pipeline"
say = "C I is continuous integration: the pipeline that builds and deploys the store. The C I deployer is its service account."
[[acronym]]
short = "ns, -n"
long = "namespace: a named area of a cluster, such as shop"
say = "A namespace is a named area of the cluster, such as shop, or warehouse. In kubectl, dash n picks one."
[[acronym]]
short = "kubectl"
long = "Kubernetes control: the command-line tool"
say = "Kube control, written k u b e c t l, is the command line tool for a Kubernetes cluster."
[[acronym]]
short = "*"
long = "star, a wildcard: matches every verb or resource"
say = "And a star is a wildcard. In a rule it matches every verb, or every resource."
