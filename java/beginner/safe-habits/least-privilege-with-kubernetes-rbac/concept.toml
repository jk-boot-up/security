    ["wildcard", "The wildcard trap", "read everything includes secrets"],
    ["escalate", "Escalation", "create pods, bind, escalate"],
    ["scope", "Binding scope", "the binding sets the reach"],
    ["lint", "A linter", "finds the common habits"],
]

