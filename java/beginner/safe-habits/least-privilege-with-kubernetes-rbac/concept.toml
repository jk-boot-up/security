# concept.toml: everything about this project that is not Java code.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "least-privilege-with-kubernetes-rbac"
module = "safe-habits"
title = "Least Privilege with Kubernetes RBAC"
short_title = "Least Privilege with Kubernetes"
package = "leastprivilegek8s"
main_class = "LeastPrivilegeK8sDemo"
tagline = "Give each identity only what its job needs"
bold = "Kubernetes RBAC denies everything until a rule allows it, and the damage from a stolen token is set by the rules you wrote: cluster-admin, wildcards and the create-pods and bind verbs are where least privilege is lost."
domain = "an online store"
domain_note = ""
youtube_description = """Least privilege with Kubernetes RBAC, in Java: every service account is a key, and the question is how many doors it opens. Explained with an online store, like a master key given to the night cleaner. We compare a nightly export job given cluster-admin with one scoped to two actions, fall into the wildcard trap where read everything includes secrets, find the escalation paths of create pods, bind and escalate, see that a namespaced binding keeps a cluster-wide role inside its namespace, and lint the manifests. The Java evaluator is checked against a real kind cluster and kubectl auth can-i."""
thumb_lines = ["LEAST PRIVILEGE", "KUBERNETES RBAC"]
thumb_code = "kubectl auth can-i get secrets"
youtube_title = "Least Privilege with Kubernetes RBAC (cluster-admin, Wildcards, Escalation)"
youtube_tags = ["kubernetes", "rbac", "least privilege", "service account", "cluster-admin", "kind", "kubectl", "java", "cybersecurity for beginners"]

[readme]
technologies = [
    ["kind", "0.33.0", "makes a real Kubernetes cluster in Docker for the integration tests"],
    ["kubectl", "1.27.2 (client)", "asks the cluster `auth can-i` as each service account; newer than the supported skew is only a warning"],
    ["Kubernetes", "1.37.0 (kindest/node image)", "the cluster the manifests are applied to in the integration tests"],
    ["Docker", "required for the integration tests", "runs the kind node"],
]
intro = """
In Kubernetes every program that talks to the cluster has an identity, usually a **service account**, and a token that proves it. **RBAC** (role-based access control) decides what each identity may do. It is **deny by default**: nothing is allowed until a **Role**
(rules in one namespace) or a **ClusterRole** (rules for the whole cluster) says so, and a **RoleBinding** or **ClusterRoleBinding** gives the role to an identity. A rule lists **verbs** (get, list, create, delete ...) on **resources** (pods, secrets ...), and can name the objects it covers.

This project reads real manifests, answers the question `kubectl auth can-i` answers, counts the **blast radius** of a stolen token, finds the escalation paths, and lints the manifests. The integration tests make a real cluster with kind and check that it answers exactly as the Java code does.
"""
analogy = """
Think of the keys of a shop. A master key given to the night cleaner "to make it work" opens the till, the stockroom and the office. A key cut for the cleaner's cupboard opens one door. A key that says "all doors on the ground floor" sounds modest, until you remember the safe is on the ground floor.
"""
scenario = """
An online store runs its jobs as service accounts. A nightly export was given cluster-admin, a reporting job was given "get and list everything", and the deploy pipeline can create pods. The demo asks what each stolen token could do.
"""
costs = [
    "**Narrow roles need maintenance.** Each new feature may need a new permission, so the rules need an owner and a review.",
    "**RBAC has no deny rules.** You can only leave permissions out, so one extra binding can undo careful work, and the audit has to look at all of them.",
    "**The Java evaluator is a model.** It ignores API groups, non-resource URLs, aggregated roles and groups of users, so it teaches the idea and does not replace asking the cluster.",
    "**Real clusters add roles you did not write.** Built-in and operator-installed roles also grant permissions, so check with `kubectl auth can-i --list`.",
]
too_much = """
For a throwaway local cluster, cluster-admin is fine. For anything that holds real data or is reachable by other people, give each workload its own service account, bind it in one namespace, and turn off token mounting for pods that do not call the API.
"""
met_before = [
    "`cluster-admin` in tutorials, copied into production.",
    "`kubectl auth can-i` and `kubectl auth can-i --list`.",
    "Cloud kubernetes services that map cloud identities onto service accounts.",
    "Reports that begin \"a pod's service account token was stolen\".",
]
where = """
This project follows [least-privilege](../least-privilege) and [least-privilege-with-spring-security](../least-privilege-with-spring-security). The first modelled the ideas in memory, the second applied them in a Spring application, and this one applies them to the platform the application runs on.
"""
twin = """
The demo reads the manifests in `infra/rbac` and needs no cluster, so it is the same on every machine. The integration tests create a kind cluster with a generated name, apply the same manifests, ask `kubectl auth can-i` for 490 combinations of identity, namespace, resource and verb, and always delete the cluster.
"""
test_note = "The demo and the default tests read the manifests and need nothing installed. The integration tests (tagged k8s) make a real kind cluster, compare 490 kubectl answers with the Java evaluator, and always delete the cluster."

[[act]]
title = "The nightly job that was given cluster-admin"
summary = "A stolen cluster-admin token reaches 56 of 56 things; the scoped exporter reaches 2, one named config map is readable, and secrets are not."
detail = """
The shop's namespace has 56 things a token could be used for: 7 verbs on 8 kinds of object. If the nightly-export-admin token is stolen it reaches all 56, and the whole cluster as well. If the exporter token is stolen it reaches 2 of 56: get and list pods.
It can also read one config map by name, export-settings, but not another one, payment-keys, and it cannot read secrets.
"""
speech = """
First demo: the nightly job that was given cluster admin. [[slnc 400]] The shop's namespace has fifty six things a token could be used for. [[slnc 600]]
If the cluster admin token is stolen, it reaches all fifty six. [[slnc 300]] And the whole cluster as well. [[slnc 600]]
The scoped exporter reaches two. [[slnc 300]] It can read one config map by name. [[slnc 300]] It cannot read another. [[slnc 300]] And it cannot read secrets.
"""
rows = { admin = "active wrong", scoped = "active ok" }
console = [
    ["the shop's namespace has 56 things a token could be used for: 7 verbs on 8 kinds of object", "muted"],
    ["if the nightly-export-admin token is stolen it reaches 56 of 56  <- THE WHOLE NAMESPACE, AND THE WHOLE CLUSTER", "bad"],
    ["if the exporter token is stolen it reaches 2 of 56: get and list pods", "ok"],
    ["the exporter can read the config map export-settings: true", "ok"],
    ["the exporter can read another config map, payment-keys: false", "ok"],
    ["the exporter can read secrets: false", "ok"],
]

[[act]]
title = "The wildcard trap: read everything"
summary = "A role that allows get and list on all resources sounds harmless, but it can read secrets; naming resources keeps a rule meaning what it said."
detail = """
The reporter's role says get and list on all resources, which sounds read-only and harmless. But the reporter can read secrets, every password and key in the namespace. It reaches 16 of 56, and "everything" also includes things that did not exist when the role was written.
A rule that names its resources keeps meaning what it said.
"""
speech = """
Second demo: the wildcard trap. [[slnc 400]] The reporter's role says get and list on everything. [[slnc 300]] That sounds read only and harmless. [[slnc 600]]
But the reporter can read secrets. [[slnc 300]] Every password and key in the namespace. [[slnc 600]]
And everything includes things that did not exist when the role was written. [[slnc 300]] A rule that names its resources keeps meaning what it said.
"""
rows = { wildcard = "active wrong" }
console = [
    ["the reporter's role says get and list on all resources, which sounds read-only and harmless", "muted"],
    ["the reporter can read secrets: true  <- EVERY PASSWORD AND KEY IN THE NAMESPACE", "bad"],
    ["the reporter can change anything: false", "ok"],
    ["the reporter reaches 16 of 56, but \"everything\" includes things that did not exist when the role was written", "amber"],
]

[[act]]
title = "Ways to become more powerful"
summary = "The deploy pipeline has 4 escalation paths: create pods, create role bindings, bind roles and escalate roles; the exporter has none."
detail = """
The exporter has no escalation paths. The ci-deployer has four: it can create pods, which can mount any secret or service account token in the namespace, it can create role bindings, bind roles it does not hold, and edit roles to add permissions it does not hold.
It cannot read secrets directly, but it can create a pod that mounts them. So "create pods" is as powerful as "read secrets", and "bind" or "escalate" is as powerful as owning the namespace.
"""
speech = """
Third demo: ways to become more powerful. [[slnc 400]] The exporter has none. [[slnc 600]]
The deploy pipeline has four. [[slnc 300]] It can create pods. [[slnc 300]] It can create role bindings. [[slnc 300]] It can bind roles it does not hold. [[slnc 300]] And it can edit roles. [[slnc 600]]
It cannot read secrets directly. [[slnc 300]] But it can create a pod that mounts them. [[slnc 600]]
So create pods is as powerful as read secrets.
"""
rows = { escalate = "active wrong" }
console = [
    ["exporter: 0 escalation paths", "ok"],
    ["ci-deployer: 4 escalation paths", "bad"],
    ["can create pods, which can mount any secret or service account token in the namespace", "amber"],
    ["can create role bindings; can bind roles it does not hold; can edit roles to add permissions it does not hold", "amber"],
    ["the deploy pipeline can read secrets directly: false, and it can create a pod that mounts them: true", "amber"],
]

[[act]]
title = "A cluster-wide role through a namespaced binding"
summary = "The support agent holds a ClusterRole through a RoleBinding, so it works in shop and not in warehouse, while a ClusterRoleBinding ignores namespaces."
detail = """
The role shop-viewer is a ClusterRole, and the support agent holds it through a RoleBinding in the shop namespace. The agent can list pods in shop, cannot list pods in warehouse, and cannot delete pods in shop.
The cluster-admin job can list pods in warehouse because a cluster binding ignores namespaces. The binding decides the reach, not the role.
"""
speech = """
Fourth demo: scope. [[slnc 400]] The support agent holds a cluster wide role through a binding in one namespace. [[slnc 600]]
It can list pods in shop. [[slnc 300]] It cannot list pods in warehouse. [[slnc 300]] And it cannot delete anything. [[slnc 600]]
A cluster binding ignores namespaces. [[slnc 300]] The binding decides the reach, not the role.
"""
rows = { scope = "active ok" }
console = [
    ["the support agent can list pods in shop: true", "ok"],
    ["the support agent can list pods in warehouse: false", "ok"],
    ["the support agent can delete pods in shop: false", "ok"],
    ["the cluster-admin job can list pods in warehouse: true  <- A CLUSTER BINDING IGNORES NAMESPACES", "bad"],
]

[[act]]
title = "A linter for the habits that cause incidents"
summary = "The linter finds 6 problems in the shop manifests: a cluster-admin binding, a wildcard, two escalation verbs and two auto-mounted tokens."
detail = """
The linter finds six problems in the shop manifests: a binding to cluster-admin, a wildcard on resources, the escalate and bind verbs, and two service accounts whose token is mounted into every pod. A linter finds wildcards and cluster-admin, not a role that is too wide but spelled out in full,
so ask the cluster too, with kubectl auth can-i --list.
"""
speech = """
Fifth demo: a linter. [[slnc 400]] It finds six problems. [[slnc 300]] A binding to cluster admin. [[slnc 300]] A wildcard on resources. [[slnc 300]] Two escalation verbs. [[slnc 300]] And two service accounts whose token is mounted into every pod. [[slnc 600]]
A linter finds wildcards. [[slnc 300]] It does not find a role that is too wide but spelled out in full. [[slnc 300]] So ask the cluster as well.
"""
rows = { lint = "active amber" }
console = [
    ["findings in the shop manifests: 6", "amber"],
    ["nightly-export-is-admin: binds cluster-admin", "bad"],
    ["report-reader: wildcard resources", "amber"],
    ["deployer: escalation verb escalate; deployer: escalation verb bind", "amber"],
    ["default: token is mounted into every pod; nightly-export-admin: token is mounted into every pod", "amber"],
    ["ask the cluster too: kubectl auth can-i --list --as=system:serviceaccount:shop:exporter -n shop", "muted"],
]

[animation]
subtitle = "An online store's service accounts, from cluster-admin to a role that names exactly what a job needs."
boxes = [
    ["admin", "cluster-admin", "reaches everything, everywhere"],
