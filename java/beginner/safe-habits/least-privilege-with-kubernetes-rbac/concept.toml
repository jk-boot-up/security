kind = "bullets"
title = "From Broad to Narrow"
body = ["cluster-admin: everything, everywhere", "Wildcards: more than they say", "Verbs that grant: create pods, bind, escalate", "A named role in one namespace: only the job", "The binding sets the reach."]
narration = """Let's put it side by side, broad to narrow. [[slnc 400]] Cluster admin. Everything, everywhere. [[slnc 500]] Wildcards. More than they say. [[slnc 500]] Verbs that grant. Create pods, bind, and escalate. [[slnc 500]] A named role in one namespace. Only the job. [[slnc 600]] And remember, the binding sets the reach, not the role."""

[[scene]]
key = "10-roles"
kind = "bullets"
title = "Who Does What"
body = ["Manifests: reads the YAML", "Rbac: can this identity do this?", "Linter: finds the common habits", "infra/rbac: the real manifests", "KubectlInteropTest: asks a real cluster"]
narration = """Here is who does what in the code. [[slnc 400]] The manifests class reads the Y A M L. [[slnc 500]] The R B A C class answers whether an identity can do something, counts the blast radius and finds the escalation paths. [[slnc 500]] The linter finds the common bad habits. [[slnc 500]] The infra folder holds the real manifests. [[slnc 300]] And the interop test asks a real cluster the same questions."""

[[scene]]
key = "11-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["cluster-admin in install guides", "resources: * in charts", "automountServiceAccountToken: false", "kubectl auth can-i"]
narration = """You have probably met this already. [[slnc 400]] Cluster admin appears in install guides, and is copied into production. [[slnc 500]] A star for resources appears in charts. [[slnc 500]] Automount service account token false appears in hardened manifests. [[slnc 500]] And kubectl auth can i is how you ask the cluster what an identity may do."""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["One service account per workload", "Bind in one namespace", "Name resources, not wildcards", "Watch create pods, bind, escalate", "Check with kubectl auth can-i --list"]
narration = """So, how do you use it? [[slnc 400]] Give each workload its own service account. [[slnc 500]] Bind it in one namespace. [[slnc 500]] Name resources, instead of using wildcards. [[slnc 500]] Treat create pods, bind, and escalate as powerful as the things they can reach. [[slnc 500]] And check with kubectl auth can i, with the list option."""

[[scene]]
key = "13-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Name the resources", "in the reporter's role and count again."]
narration = """That's least privilege with Kubernetes R B A C. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] A token can do exactly what its rules add up to, so write the rules to add up to the job and nothing else. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] The demo runs with nothing installed except a Java development kit. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Name the resources in the reporter's role, and count the blast radius again. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
The RBAC configuration of a Kubernetes cluster that runs an online store's jobs: service accounts, roles, bindings, and the pipeline that applies them. It covers an attacker who steals a service account token or takes over a pipeline. It does not cover the nodes, the network, admission control or the applications' own authorization.
"""
assets = [
    "Secrets in the cluster, such as payment keys and database passwords.",
    "The ability to create workloads and bindings.",
    "Service account tokens.",
    "The manifests that define the rules.",
]
actors = [
    "Jobs and pipelines running as service accounts.",
    "An attacker who steals a token or takes over a job.",
    "A developer who writes or reviews the manifests.",
]
boundaries = [
    "Pod to API server: the token is the only proof of identity.",
    "Git repository to cluster: whatever is applied becomes the rules.",
    "Namespace to namespace: only bindings set the boundary.",
]
assumptions = [
    "The API server enforces RBAC correctly and the nodes are not compromised.",
    "Manifests are reviewed before they are applied.",
    "In the demo, names, passwords and keys are demo values, and the cluster is a throwaway kind cluster.",
]
out_of_scope = [
    "Admission control, pod security standards and network policies.",
    "Cloud identity mapping.",
    "Runtime detection.",
]
tests = [
    "`RbacTest` checks deny by default, cluster-admin, resource names, wildcards, binding scope, subresources and escalation paths.",
    "`ManifestsAndLinterTest` checks YAML parsing and the six lint findings.",
    "`KubectlInteropTest` (integration) makes a real kind cluster and compares 490 kubectl answers, the bind, escalate and exec verbs, and a named config map with the Java evaluator.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
This is the last project in the safe-habits track so far. The later projects return to identity and add a real identity provider.
"""

[[threat]]
id = "T1"
stride = "E"
threat = "A job is bound to cluster-admin or a wildcard role, so a stolen token controls the cluster"
where = "`nightly-export-is-admin`, `report-reader`"
control = "One service account per workload, scoped roles that name resources, and a linter that fails on cluster-admin and wildcards"
residual = "Roles still need review as features grow"

[[threat]]
id = "T2"
stride = "E"
threat = "An identity that can create pods or bindings makes itself more powerful"
where = "`deployer`, `ci-deployer`"
control = "Treat create pods, bind and escalate as the permissions they can reach, and limit them with admission policy"
residual = "RBAC alone cannot stop a pod from mounting the secrets of its namespace"

[[threat]]
id = "T3"
stride = "T"
threat = "A role is edited to grant more, and nobody notices"
where = "the RBAC rules"
control = "Keep manifests in git with review, and diff `kubectl auth can-i --list` over time"
residual = "Someone with escalate can change roles without review"

[[threat]]
id = "T4"
stride = "I"
threat = "A service account token is read from a pod, a log or a backup"
where = "the pod's mounted token"
control = "Turn off automounting where the pod does not call the API, and use short-lived bound tokens"
residual = "A token used by a running pod can still be read from that pod"

[[threat]]
id = "T5"
stride = "R"
threat = "Nobody can tell who applied a permission change, or why"
where = "the manifests repository"
control = "Review in git, and enable the API server's audit log"
residual = "Audit logs have to be kept and read"
