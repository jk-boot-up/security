plugins {
    id 'java-library'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'commons-codec:commons-codec:1.23.0'
}

// Resolves and prints the runtime classpath. With a verification-metadata.xml next to this file, Gradle checks
// the SHA-256 of every file it downloads and fails the build on a mismatch.
tasks.register('resolveAll') {
    doLast {
        configurations.runtimeClasspath.files.each { println it.name }
    }
}
