]

[[act]]
title = "A bill of materials a scanner can read"
summary = "The code writes a CycloneDX 1.6 file of five libraries with package URLs, checks them against the lock file, and refuses a package URL that disagrees with its version."
detail = """
The store writes a CycloneDX 1.6 file listing the five libraries, each with a package URL such as pkg:maven/commons-codec/commons-codec@1.23.0. The file lists the same libraries as the lock file, and the committed copy is exactly what the code writes. A package URL that disagrees with the version beside it is refused, because a scanner would look up the wrong library.
"""
speech = """
Second demo: a bill of materials. [[slnc 400]] The store writes a Cyclone D X file listing the five libraries, each with a package address. [[slnc 600]]
It lists the same libraries as the lock file. [[slnc 600]]
A package address that disagrees with its version is refused. [[slnc 300]] A scanner would look up the wrong library.
"""
rows = { sbom = "active ok" }
console = [
    ["the store writes a CycloneDX 1.6 file listing 5 libraries, each with a package URL", "muted"],
    ["first package URL: pkg:maven/commons-codec/commons-codec@1.23.0", "muted"],
    ["the bill of materials and the lock file list the same libraries: true", "ok"],
    ["a package URL that disagrees with its version: refused", "ok"],
]

[[act]]
title = "What the scanner reported"
summary = "The real Trivy found 16 problems in 4 libraries, 3 critical, and the code's own range checks agree on Log4Shell and the Commons Text problem."
detail = """
Trivy 0.76.0 scanned the bill of materials, and its report is saved in the project. It reported 16 problems in 4 libraries: 3 critical, 3 high and 10 medium. Every installed version is older than the version that fixes it, as the code compares them. The store's own range checks agree with Trivy on CVE-2021-44228, Log4Shell, and CVE-2022-42889, the Commons Text problem. A scanner only knows what is in its database on the day it runs.
"""
speech = """
Third demo: the scanner's report. [[slnc 400]] The real Trivy scanner read the bill of materials. [[slnc 600]]
It reported sixteen problems in four libraries. [[slnc 300]] Three are critical. [[slnc 600]]
The store's own checks agree on the two best known problems. [[slnc 600]]
But a scanner only knows what is in its database on the day it runs.
"""
rows = { scan = "active amber" }
console = [
    ["Trivy 0.76.0 scanned the bill of materials; the report is saved in fixtures/trivy-report.json", "muted"],
    ["it reported 16 problems in 4 libraries: 3 critical, 3 high, 10 medium, 0 low", "bad"],
    ["every installed version is older than the version that fixes it, as the code compares them: true", "ok"],
    ["CVE-2021-44228: the store's own range check says affected: true, Trivy reports it: true", "ok"],
    ["CVE-2022-42889: the store's own range check says affected: true, Trivy reports it: true", "ok"],
    ["a scanner only knows what is in its database on the day it runs, so a clean report means no known problem today", "amber"],
]

[[act]]
title = "What to fix first, and to which version"
summary = "Critical problems come first, and one upgrade per library fixes everything that has a fix: log4j-core to 2.25.4 and snakeyaml to 2.0, which crosses a major version."
detail = """
The report is ordered by severity: the Commons Text problem and two log4j-core problems are critical. One move per library fixes everything that has a fix: commons-lang3 to 3.18.0, commons-text to 1.10.0, log4j-core to 2.25.4 and snakeyaml to 2.0. Each target is the highest of the nearest fixes, so log4j-core needs 2.25.4 for its last problem, further than the first fix, 2.15.0, suggested. A fix that crosses a major version, such as snakeyaml 1.26 to 2.0, can break the build, so the tests run after each move.
"""
speech = """
Fourth demo: what to fix first. [[slnc 400]] The critical problems come first. [[slnc 600]]
One move per library fixes everything that has a fix. [[slnc 600]]
Each target is the highest of the nearest fixes. [[slnc 300]] So log four j needs a newer version than the first fix suggested. [[slnc 600]]
A fix that crosses a major version can break the build, so run the tests after each move.
"""
rows = { triage = "active ok" }
console = [
    ["CRITICAL CVE-2022-42889 in org.apache.commons:commons-text 1.9, fixed in 1.10.0", "bad"],
    ["CRITICAL CVE-2021-44228 in org.apache.logging.log4j:log4j-core 2.14.1, fixed in 2.15.0", "bad"],
    ["org.apache.logging.log4j:log4j-core 2.14.1 -> 2.25.4", "ok"],
    ["org.yaml:snakeyaml 1.26 -> 2.0", "ok"],
    ["a fix that crosses a major version, such as snakeyaml 1.26 to 2.0, can break the build, so run the tests after each move", "amber"],
]

[[act]]
title = "Checking what is downloaded, and automating the updates"
summary = "Gradle's verification file pins six checksums and the build refuses a changed one; Dependabot and Renovate configurations open the update pull requests."
detail = """
Gradle's verification-metadata.xml pins the SHA-256 of six downloaded files. One checksum changed in a copy of the file differs from the original, and the integration test shows that the real Gradle refuses to build then. The configuration files for Dependabot and Renovate in the infra folder open a pull request for each update, so each review is small. The cost: every update means reviewing a new hash, and a scanner is only as good as its database.
"""
speech = """
Fifth demo: checking downloads. [[slnc 400]] Gradle's verification file pins the checksum of six downloaded files. [[slnc 600]]
Change one checksum, and the real Gradle refuses to build. [[slnc 600]]
Configuration files for Dependabot and Renovate open a pull request for each update, so each review stays small. [[slnc 600]]
The cost: every update means reviewing a new checksum, and a scanner is only as good as its database.
"""
rows = { verify = "active ok" }
console = [
