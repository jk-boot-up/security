[[act]]
title = "Checking what is downloaded, and automating the updates"
summary = "Gradle's verification-metadata.xml pins the SHA-256 of 6 files; in a copy with one checksum changed, 1 file differs and Gradle refuses to build; Dependabot and Renovate open one pull request per update."
detail = """
Gradle's verification file, gradle/verification-metadata.xml, pins the SHA-256 of 6 downloaded files: the commons-codec jar and pom, and four parent and bill-of-materials poms.
Before the check, a copy of the file has one checksum changed, for commons-codec-1.23.0.jar. After the check, 1 file differs, and Gradle refuses to build (the integration test runs this with the real Gradle).
dependabot.yml and renovate.json in infra/ open one pull request for each update, so each review is small. The cost: every new hash needs a review, and a scanner knows only what is in its database.
"""
figure = "pins"
figure_title = "Checksums that stop a changed download"
figure_speech = """
Fifth demo: checking what is downloaded. [[slnc 400]] On the left, the pins. [[slnc 300]] Gradle's verification file holds the S H A two five six hash of six downloaded files. [[slnc 300]] Here are the first sixteen characters of each. [[slnc 600]]
On the right, in red, a copy of that file with one checksum changed: the commons codec jar. [[slnc 300]] Now the hash on record is all zeros. [[slnc 500]] After the check: one file differs. [[slnc 300]] And Gradle refuses to build. [[slnc 600]]
The same happens the other way round. [[slnc 300]] If someone changes the downloaded jar, its hash no longer matches the pin. [[slnc 300]] A download is used only when it matches.
"""
speech = """
The output lists the six pins. [[slnc 300]] Then the copy, before the check, with its changed checksum.
[[page]]
After the check: one file differs, and Gradle refuses to build. [[slnc 400]] Dependabot and Renovate open one pull request per update, so each review stays small. [[slnc 300]] The cost is a review for every new hash.
"""
rows = { verify = "active ok" }
console = [
