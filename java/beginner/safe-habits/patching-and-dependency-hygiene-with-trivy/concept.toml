[threatmodel]
scope = """
How an online store finds out what its build contains and whether any of it is known to be vulnerable: the Gradle lock file, the bill of materials, the Trivy scan and its database, and the checksum verification of downloads. It does not cover container images, secrets, licences, or the store's own code.
"""
assets = [
    "The libraries the store ships, and the integrity of what is downloaded.",
    "The lock file and the pinned checksums.",
    "The accuracy of the scan result, which drives the decision what to fix.",
]
actors = [
    "The store's developers and build servers.",
    "An attacker who can change a library in a repository or on the way.",
    "The scanner and its vulnerability database.",
]
boundaries = [
    "Library repository to the build: every download crosses it.",
    "Vulnerability database to the scanner: a database that is old or unavailable changes the answer.",
]
assumptions = [
    "The repository is reached over TLS, and Gradle's verification file was reviewed when it was written.",
    "The scan is repeated, since new problems appear after a library ships.",
    "In the demo, the libraries are real but never run, and the report is a saved copy from 17 October 2026.",
]
out_of_scope = [
    "Container image scanning, secret scanning and licence checks.",
    "Verifying signatures of artifacts.",
    "The store's own code.",
]
tests = [
    "`FormatsTest` checks version comparison, the lock file, the CycloneDX file and its strict checks, the saved report, the triage, and the verification file.",
    "`ToolsIntegrationTest` (integration) runs the real Trivy in Docker on the files the code writes, compares the SBOM and lock file scans, checks that the upgrade removes the original critical problems, and runs a nested Gradle build that must refuse a changed checksum.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next project, backups-and-recovery, covers what to do when prevention fails: copies that survive an attack, and a restore that has been tested.
"""

[[threat]]
id = "T1"
stride = "T"
threat = "A library is changed in the repository or on the way, and the build uses the changed file"
where = "`VerificationMetadata`, the Gradle build"
control = "Gradle's dependency verification pins the SHA-256 of every download and fails the build on a mismatch"
residual = "A bad file that was pinned when the file was written stays pinned, so review new hashes, and consider signatures"

[[threat]]
id = "T2"
stride = "T"
threat = "A dependency version floats and the build picks up a malicious or broken release"
where = "`GradleLockfile`"
control = "Dependency locking records the exact version of every library"
residual = "The lock file must be updated deliberately, with review, or the store falls behind"

[[threat]]
id = "T3"
stride = "R"
threat = "Nobody can say which versions a past release shipped"
where = "`CycloneDx`"
control = "A bill of materials is written for each build and kept with the release"
residual = "It describes what the build resolved, not what was copied in by other means"

[[threat]]
id = "T4"
stride = "I"
threat = "A scan gives a false sense of safety because the input is wrong or incomplete"
where = "`TrivyReport`, `OwnAdvisory`"
control = "The code checks that every reported library is in the list and cross-checks well known problems with its own ranges"
residual = "Libraries copied into the source, or not in the list, are not scanned at all"

[[threat]]
id = "T5"
stride = "D"
threat = "The vulnerability database is old or cannot be downloaded, so the scan reports less than is known"
where = "the Trivy database"
control = "Download the database once and update it on a schedule, and fail the pipeline when it is too old"
residual = "A clean report means no known problem on the day of the database"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] Small classes read and write each file, and the demo class runs the five acts. [[slnc 300]] Here are the ones that matter."""

[[class]]
name = "Dependency"
what = "one library: group, artifact and version"
[[class.part]]
title = "the package URL"
code = """
String purl() {
    return "pkg:maven/" + group + "/" + artifact + "@" + version;
"""
speech = """A dependency is a group, an artifact and a version. [[slnc 300]] Its package URL joins them with a fixed pattern. [[slnc 300]] That string is what the scanner looks up."""

[[class]]
name = "GradleLockfile"
what = "reads gradle.lockfile into dependencies"
[[class.part]]
title = "one line, three parts"
code = """
int equals = trimmed.indexOf('=');
String key = equals < 0 ? trimmed : trimmed.substring(0, equals);
String[] parts = key.split(":");
...
dependencies.add(new Dependency(parts[0], parts[1], parts[2]));
"""
speech = """Each line of the lock file is group, colon, artifact, colon, version, then the configurations that use it. [[slnc 300]] The reader keeps the three parts."""

[[class]]
name = "Vulnerability"
what = "one problem from the Trivy report"
[[class.part]]
title = "the nearest fix"
code = """
Version current = Version.parse(installed);
...
for (String part : fixed.split(",")) {
    Version candidate = Version.parse(part);
    if (current.isOlderThan(candidate)) {
        candidates.add(candidate);
...
return candidates.stream().min(Comparator.naturalOrder());
"""
speech = """A report can list several fixed versions, one per release line. [[slnc 300]] The nearest fix is the smallest one that is newer than what is installed."""

[[class]]
name = "Triage"
what = "orders the problems, and picks one target per library"
[[class.part]]
title = "keep the highest nearest fix"
code = """
Optional<Version> fix = v.nearestFix();
Optional<Version> current = targets.getOrDefault(v.packageName(), Optional.empty());
if (fix.isPresent()
        && (current.isEmpty() || current.get().isOlderThan(fix.get()))) {
    targets.put(v.packageName(), fix);
"""
speech = """For each library, triage keeps the highest of the nearest fixes. [[slnc 300]] That one version fixes every problem the library has. [[slnc 300]] So log four j core gets two point twenty five point four."""

[[class]]
name = "VerificationMetadata"
what = "reads Gradle's checksums, and compares two files"
[[class.part]]
title = "which files differ"
code = """
for (String key : keys) {
    if (!java.util.Objects.equals(one.get(key), other.get(key))) {
        different.add(key);
"""
speech = """Verification metadata reads every S H A two five six in Gradle's file. [[slnc 300]] Differences compares two of them, file by file, and lists the ones that do not match."""

[[acronym]]
short = "SBOM"
long = "Software Bill of Materials: a list of every component"
say = "S bom is a software bill of materials: a list of every component a program is built from."
[[acronym]]
short = "purl, URL"
long = "package URL (Uniform Resource Locator): a library's name"
say = "U R L is a uniform resource locator: an address, written as text. A purl is a package U R L: a standard name for a library, which a scanner looks up."
[[acronym]]
short = "CVE"
long = "Common Vulnerabilities and Exposures: public flaw ids"
say = "C V E is Common Vulnerabilities and Exposures: the public id of a known flaw, such as C V E twenty twenty one, four four two two eight."
[[acronym]]
short = "SHA-256"
long = "Secure Hash Algorithm, 256 bits: a file's fingerprint"
say = "S H A two five six is the Secure Hash Algorithm with two hundred and fifty six bits: a fingerprint of a file."
[[acronym]]
short = "CycloneDX, YAML, CI"
long = "an SBOM format; a settings format; Continuous Integration"
say = "Cyclone D-X is a standard file format for a bill of materials. Y A M L is a text format for settings, and snake yaml is a library that reads it. C I is continuous integration: the pipeline that builds and tests the store on every change."
