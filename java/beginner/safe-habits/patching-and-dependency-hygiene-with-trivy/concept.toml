[docs.dependencies]
intro = """
This project adds no Java library. It uses three tools: Docker to run Trivy, Gradle's own locking and verification features, and the CycloneDX format.
"""
what = [
    ["Trivy", "an open-source vulnerability scanner from Aqua Security. It reads a bill of materials or a lock file and compares the libraries with a database of known problems. It runs here from the Docker image aquasec/trivy:0.76.0."],
    ["Docker", "runs the Trivy image, so that nothing needs installing besides Docker. A named volume keeps the vulnerability database between runs."],
    ["CycloneDX 1.6", "an open standard for a bill of materials, written here as JSON by about eighty lines of Java."],
    ["Gradle dependency locking and verification", "built into Gradle. `gradle.lockfile` pins versions, and `gradle/verification-metadata.xml` pins SHA-256 checksums. The fixture project in `fixtures/verified-build` has a real one that Gradle generated."],
]
why = """
The plain project worked out by hand what the tools do. A scanner is what teams actually use, and writing a reader for its report shows what it does and does not tell you.
"""
install_note = "A JDK for the demo and the ordinary tests. For the integration tests, Docker and, once, a network connection to download Trivy's database. The versions:"
versions = [
    ["Trivy", "0.76.0"],
    ["CycloneDX specification", "1.6"],
    ["Gradle", "9.8.1"],
    ["Java", "25"],
    ["JUnit", "6.1.3"],
]
costs = [
    "The integration tests need Docker and download about 130 MB the first time.",
    "A report depends on the day's database, so exact counts are not asserted by the integration tests.",
]

[docs.problem]
scenario = """
An online store depends on libraries written by other people. Some of them have problems that become known after the store ships. The store needs to find out which, and quickly.
"""
naive = """
Upgrade when something breaks, or when somebody remembers. Libraries drift and nobody can say which version is running.
"""
deliver = [
    "A lock file read by the code, so the exact libraries are known.",
    "A CycloneDX 1.6 bill of materials written and checked by the code.",
    "A report from the real Trivy, read and cross-checked with the code's own range checks.",
    "A triage that orders the problems and names one target version per library.",
    "Gradle's dependency verification, with a test that a changed checksum stops the build.",
    "Dependabot and Renovate configuration files, as documentation.",
]

