before = { code = "upgrade when it breaks", note = "nobody knows what runs", tag = "BEFORE" }
after = { code = "lock + SBOM + scan + verify", note = "known, scanned and checked", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "Patching and Dependency Hygiene with Trivy and Gradle"
narration = """Hello, and welcome. [[slnc 400]] This video explains patching and dependency hygiene with Trivy and Gradle, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A lock file records the exact version of every library a program uses. [[slnc 300]] A bill of materials lists them in a form that scanners understand. [[slnc 300]] And a scanner compares that list with known problems. [[slnc 600]] Think of a shop that keeps a list of every ingredient, with brand and batch number. [[slnc 300]] An inspector arrives with this morning's recall notices, and marks every product that contains a recalled batch. [[slnc 300]] And a delivery's label is checked against the list before anything is used. [[slnc 700]] In this video, the domain is an online store. [[slnc 500]] By the end, you will hear how a scanner's report is read. [[slnc 300]] What to fix first, and to which version. [[slnc 300]] And what a scanner cannot tell you."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online store builds on five libraries.", "", "One is the famous log4j 2.14.1.", "", "Which problems are known,", "what comes first,", "and which version fixes them?"]
narration = """Here is the scenario. [[slnc 400]] An online store builds on five libraries. [[slnc 500]] One of them is the famous log four j, version two point fourteen point one. [[slnc 600]] Which problems are known? [[slnc 300]] What comes first? [[slnc 300]] And which version fixes them?"""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["Lock file: exact versions of every library", "SBOM: a bill of materials", "CycloneDX: a standard format for it", "Package URL: the name a scanner looks up", "Checksum: a fingerprint of a file"]
narration = """Before the demos, the words. [[slnc 500]] A lock file records the exact version of every library. [[slnc 500]] An S BOM is a bill of materials, the list of what a program is built from. [[slnc 500]] Cyclone D X is a standard format for it. [[slnc 500]] A package address is the name a scanner looks up. [[slnc 500]] And a checksum is a fingerprint of a file."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "09-ladder"
kind = "bullets"
title = "What Each Tool Answers"
body = ["Lock file: what exactly does the store use?", "Bill of materials: can a tool read it?", "Scanner: what is known to be wrong?", "Triage: what first, and to which version?", "Verification: is this the file the store reviewed?"]
narration = """Let's put it side by side. [[slnc 400]] The lock file answers, what exactly does the store use? [[slnc 500]] The bill of materials answers, can a tool read it? [[slnc 500]] The scanner answers, what is known to be wrong? [[slnc 500]] The triage answers, what first, and to which version? [[slnc 500]] And the verification answers, is this the file the store reviewed?"""

[[scene]]
key = "10-roles"
kind = "bullets"
title = "Who Does What"
body = ["GradleLockfile: reads the lock file", "CycloneDx: writes and checks the SBOM", "TrivyReport: reads the scanner's report", "Triage: orders, picks target versions", "VerificationMetadata: pinned checksums"]
narration = """Here is who does what in the code. [[slnc 400]] The Gradle lockfile class reads the lock file. [[slnc 500]] The Cyclone D X class writes and checks the bill of materials. [[slnc 500]] The Trivy report class reads the scanner's report. [[slnc 500]] The triage class orders the problems and picks the target version of each library. [[slnc 300]] And the verification metadata class reads the pinned checksums."""

[[scene]]
key = "11-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["gradle.lockfile in repositories", "Dependabot and Renovate pull requests", "Scan steps in CI pipelines", "SBOM requirements in contracts"]
narration = """You have probably met this already. [[slnc 400]] Lock files sit in nearly every repository. [[slnc 500]] Dependabot and Renovate open pull requests, with titles like, bump log four j core. [[slnc 500]] Scan steps run in continuous integration pipelines. [[slnc 500]] And customers and governments increasingly ask for a bill of materials."""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Lock every build", "Produce a bill of materials", "Scan on every build and on a schedule", "Automate the update pull requests", "Verify checksums; treat a clean scan as today's answer"]
narration = """So, how do you use it? [[slnc 400]] Lock every build. [[slnc 500]] Produce a bill of materials. [[slnc 500]] Scan on every build, and on a schedule. [[slnc 500]] Automate the update pull requests. [[slnc 500]] Verify checksums. [[slnc 300]] And treat a clean scan as today's answer, not a promise."""

[[scene]]
key = "13-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Run Trivy yourself", "and compare with the saved report."]
narration = """That's patching and dependency hygiene with Trivy and Gradle. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Pin what you use, let a scanner read the list, and remember that a clean scan only means nothing is known today. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] The demo runs with nothing installed except a Java development kit. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Run Trivy yourself on the bill of materials, and compare it with the saved report. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
How an online store finds out what its build contains and whether any of it is known to be vulnerable: the Gradle lock file, the bill of materials, the Trivy scan and its database, and the checksum verification of downloads. It does not cover container images, secrets, licences, or the store's own code.
"""
assets = [
    "The libraries the store ships, and the integrity of what is downloaded.",
    "The lock file and the pinned checksums.",
    "The accuracy of the scan result, which drives the decision what to fix.",
]
actors = [
    "The store's developers and build servers.",
    "An attacker who can change a library in a repository or on the way.",
    "The scanner and its vulnerability database.",
]
boundaries = [
    "Library repository to the build: every download crosses it.",
    "Vulnerability database to the scanner: a database that is old or unavailable changes the answer.",
]
assumptions = [
    "The repository is reached over TLS, and Gradle's verification file was reviewed when it was written.",
    "The scan is repeated, since new problems appear after a library ships.",
    "In the demo, the libraries are real but never run, and the report is a saved copy from 17 October 2026.",
]
out_of_scope = [
    "Container image scanning, secret scanning and licence checks.",
    "Verifying signatures of artifacts.",
    "The store's own code.",
]
tests = [
    "`FormatsTest` checks version comparison, the lock file, the CycloneDX file and its strict checks, the saved report, the triage, and the verification file.",
    "`ToolsIntegrationTest` (integration) runs the real Trivy in Docker on the files the code writes, compares the SBOM and lock file scans, checks that the upgrade removes the original critical problems, and runs a nested Gradle build that must refuse a changed checksum.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next project, backups-and-recovery, covers what to do when prevention fails: copies that survive an attack, and a restore that has been tested.
"""

[[threat]]
id = "T1"
stride = "T"
threat = "A library is changed in the repository or on the way, and the build uses the changed file"
where = "`VerificationMetadata`, the Gradle build"
control = "Gradle's dependency verification pins the SHA-256 of every download and fails the build on a mismatch"
residual = "A bad file that was pinned when the file was written stays pinned, so review new hashes, and consider signatures"

[[threat]]
id = "T2"
stride = "T"
threat = "A dependency version floats and the build picks up a malicious or broken release"
where = "`GradleLockfile`"
control = "Dependency locking records the exact version of every library"
residual = "The lock file must be updated deliberately, with review, or the store falls behind"

[[threat]]
id = "T3"
stride = "R"
threat = "Nobody can say which versions a past release shipped"
where = "`CycloneDx`"
control = "A bill of materials is written for each build and kept with the release"
residual = "It describes what the build resolved, not what was copied in by other means"

[[threat]]
id = "T4"
stride = "I"
threat = "A scan gives a false sense of safety because the input is wrong or incomplete"
where = "`TrivyReport`, `OwnAdvisory`"
control = "The code checks that every reported library is in the list and cross-checks well known problems with its own ranges"
residual = "Libraries copied into the source, or not in the list, are not scanned at all"

[[threat]]
id = "T5"
stride = "D"
threat = "The vulnerability database is old or cannot be downloaded, so the scan reports less than is known"
where = "the Trivy database"
control = "Download the database once and update it on a schedule, and fail the pipeline when it is too old"
residual = "A clean report means no known problem on the day of the database"
