[[act]]
title = "A bill of materials a scanner can read"
summary = "Each lock file line becomes a CycloneDX 1.6 component with a package URL, pkg:maven/org.yaml/snakeyaml@1.26; the SBOM matches the lock file and the committed file, and a mismatched purl is refused."
detail = """
The store turns its lock file into a software bill of materials in the CycloneDX 1.6 format: 5 components. The input is one line, org.yaml:snakeyaml:1.26; the output is a component with a package URL, pkg:maven/org.yaml/snakeyaml@1.26.
The package URL, or purl, is read part by part: the type pkg:maven, the group org.yaml, the name snakeyaml, and the version 1.26. It is the name a scanner looks up.
Three checks: the SBOM lists the same 5 libraries as the lock file; the committed fixtures/online-store.cdx.json is exactly what the code writes; and a component whose version says 1.31 while its purl says 1.26 is refused.
"""
figure = "purl"
figure_title = "From a lock file line to a package URL"
figure_speech = """
Second demo: a bill of materials a scanner can read. [[slnc 400]] On the left, in blue, the input: one line of the lock file. [[slnc 300]] Snake yaml, version one point two six. [[slnc 600]]
On the right, the output: its package URL. [[slnc 300]] Every library in the bill of materials gets one. [[slnc 600]]
Below, the package URL, part by part. [[slnc 300]] The type: a Maven package. [[slnc 300]] The group: org dot yaml. [[slnc 300]] The name: snake yaml. [[slnc 300]] And the version: one point two six. [[slnc 600]]
This is the name a scanner looks up in its database. [[slnc 500]] At the bottom, three checks. [[slnc 300]] The list matches the lock file. [[slnc 300]] The file in the repository matches what the code writes. [[slnc 300]] And a version that disagrees with its package URL is refused.
"""
