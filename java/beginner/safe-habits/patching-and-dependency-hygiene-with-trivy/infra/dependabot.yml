# Shown as documentation: GitHub Dependabot opens a pull request for each outdated or vulnerable Gradle dependency.
# It would live at .github/dependabot.yml in the store's own repository.
version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      test-libraries:
        patterns: ["org.junit*"]
