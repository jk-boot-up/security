    ["  customers  read  write  delete", "muted"],
    ["  payments   read  write", "muted"],
    ["  refunds    create  approve", "muted"],
    ["  inventory  read  write", "muted"],
    ["  reports    read", "muted"],
    ["  secrets    read  write", "muted"],
    ["THE ROLES (what each one allows):", "code"],
    ["  admin      15 of 15  *", "muted"],
    ["  support    3 of 15   orders:read customers:read refunds:create", "muted"],
    ["  warehouse  3 of 15   inventory:read inventory:write orders:read", "muted"],
    ["  finance    3 of 15   payments:read refunds:approve reports:read", "muted"],
    ["---", ""],
    ["THE REQUEST: support asks for refunds:approve", "code"],
