    ["  allow orders:read     does not match", "muted"],
    ["  allow customers:read  does not match", "muted"],
    ["  allow refunds:create  does not match", "muted"],
    ["THE DECISION: DENY_DEFAULT  <- NOTHING ALLOWS IT", "bad"],
