]
install = []

[docs.session]
objectives = [
    "explain least privilege and blast radius",
    "describe deny by default and why an explicit deny wins",
    "give an example of separation of duties",
    "explain why access should expire",
    "describe how to find unused permissions",
]
walkthrough = """
Start with the hotel keys. Run the demo one act at a time. After act two, ask the group which of their own accounts or jobs are admin because it was quick. After act three, ask where in their work one person can do something risky from start to finish.
After act five, ask who removes a permission once it is found to be unused, and who notices.
"""
exercises = [
    "Add a new role, `refund-reviewer`, and check how many of the 15 permissions it reaches.",
    "Make the grant renewable once, and decide who has to approve the renewal.",
    "Add a rule that nobody may both create and approve any permission change.",
    "Change the audit limit from 90 days to 30 and see which permissions are flagged.",
]

[docs.explained]
sentence = """
Give each person and program only the permissions its work needs, deny everything else by default, require two people for risky actions, let temporary access expire, and remove permissions nobody uses, so that any one stolen account can reach as little as possible.
"""
verdict = """
Start with unattended jobs and administrator access. Replace broad roles with scoped ones, measure the blast radius of each credential, make high-risk actions need two people, prefer temporary grants to permanent ones, and review usage regularly.
"""
recognise = [
    "IAM policies with `Effect: Deny` and a default deny.",
    "Kubernetes `Role` and `RoleBinding`, and `sudoers` entries.",
    "Short-lived tokens and \"break glass\" admin accounts.",
    "Approval workflows for payments and deployments.",
]

[spec]
purpose = """
Teach least privilege by modelling an online store's permissions, measuring blast radius, requiring two people for refunds, expiring grants, auditing unused permissions and locking files to their owner.
"""
nongoals = [
    "Cloud IAM and Kubernetes RBAC: the tools projects.",
    "Authentication: the identity module.",
    "Sandboxing code inside a JVM: the SecurityManager has been removed.",
]
problem = """
Broad permissions are convenient and invisible until an account is stolen; learners need to see the size of the damage as a number.
"""
roles = [["Policy and decisions", "`Policy`"], ["The store's permissions and roles", "`Catalogue`"], ["Users, roles and expiring grants", "`Access`"], ["Two-person refunds", "`RefundDesk`"], ["Unused permission audit", "`UsageAudit`"], ["File permissions", "`OwnerOnly`"], ["Entry point", "`LeastPrivilegeDemo`"]]
requirements = [
    "Nothing is allowed unless a statement allows it, and an explicit deny beats any allow.",
    "The blast radius of a credential is the count of catalogue permissions it reaches.",
    "No person can create and approve the same refund, whatever their roles.",
    "A grant is active from its start tick up to but not including its end tick, and never overrides a deny.",
    "A permission unused for more than the limit, or never used, is flagged.",
    "The demo prints the same output on every run.",
]

