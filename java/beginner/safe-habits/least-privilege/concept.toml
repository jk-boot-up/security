# concept.toml: everything about this project that is not Java code.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "least-privilege"
module = "safe-habits"
title = "The Principle of Least Privilege"
short_title = "Least Privilege"
package = "leastprivilege"
main_class = "LeastPrivilegeDemo"
tagline = "Give only the access that is needed, for only as long as it is needed"
bold = "Everyone and every program should hold only the permissions the work needs, for only as long as it needs them, so that one stolen credential, one mistake or one dishonest person can reach as little as possible."
domain = "an online store"
domain_note = ""
youtube_description = """The principle of least privilege in Java: give people and programs only the access they need. Explained with an online store, like hotel keys that open one room and expire at checkout, not a master key for every guest. We model roles and permissions with deny by default, measure the blast radius of a stolen credential for an admin and for a scoped job, require two different people for a refund, give access that expires on its own, find permissions nobody uses, and lock a file to its owner with operating system permissions."""
thumb_lines = ["LEAST", "PRIVILEGE"]
thumb_code = "deny by default"
youtube_title = "The Principle of Least Privilege in Java (Roles, Blast Radius, Expiring Access)"
youtube_tags = ["least privilege", "rbac", "blast radius", "separation of duties", "deny by default", "access control", "java", "cybersecurity for beginners"]

[readme]
intro = """
The **principle of least privilege** says that every person and every program should have only the permissions its work needs, and no more. It matters because things go wrong: a password is stolen, a token leaks, a person makes a mistake or turns dishonest. What the
attacker or the mistake can reach is the **blast radius**, and it is exactly the privilege the account held. A policy that is **deny by default**, where nothing is allowed unless a statement allows it and an **explicit deny** beats any allow, keeps privilege small. Two more habits help:
**separation of duties**, so that no single account can complete something risky alone, and **access that expires**, so that a temporary need does not become a permanent permission.

The demo gives an online store a catalogue of 15 things that can be done, measures what a stolen credential reaches, requires two people for a refund, grants access on a simulated clock, audits unused permissions, and locks a file to its owner.
"""
analogy = """
Think of a hotel. A guest's key opens one room and stops working at checkout. A master key that opens every door is kept in a safe and signed out only for a reason. And the person who orders a refund at the front desk is not the person who approves it.
If a guest's key is stolen, one room is lost, not the hotel.
"""
scenario = """
An online store has customers, orders, payments, refunds, inventory, reports and secrets. The demo asks what each role may do, what happens when a nightly export job's token is stolen, whether one person can refund themselves, what happens to access given for a month-end fix, and which permissions nobody uses.
"""
costs = [
    "**More roles to manage.** Many small roles take more design than one admin role, and need someone to own them.",
    "**Requests for more access.** People who are denied ask for access, so there must be a fast, recorded way to grant it temporarily.",
    "**Audits need data.** Finding unused permissions needs a record of what is actually used, kept for long enough to be meaningful.",
    "**Separation of duties slows work.** Two people for a refund is slower than one, which is the point, and it should be applied where the risk justifies it.",
]
too_much = """
Least privilege applied to the point where nobody can do their job leads people to share accounts and write permissions down, which is worse. Start with the highest risks: administrator access, programs that run unattended, and anything that moves money or reads secrets.
"""
met_before = [
    "Cloud IAM policies, with their explicit deny and default deny, and temporary credentials.",
    "Kubernetes roles and role bindings, and `sudo` rules.",
    "Database users that can only read, and file permissions such as `chmod 600`.",
    "\"Four eyes\" approval for payments and production deploys.",
]
where = """
This project is the first in [safe-habits](..), and it applies [authentication-vs-authorization](../../identity/authentication-vs-authorization) at the level of design: once we know who is asking, how much should they be allowed?
"""
twin = """
The policy engine, roles, grants and audit are plain Java with a simulated clock and fixed data, so the demo is exact. The one real piece is the operating system: it sets POSIX file permissions on a temporary file, and so runs on macOS and Linux.
"""
test_note = "The policy, roles, grants and audit run on fixed data and a simulated clock, so the golden output is the same on every run. The file permissions are set explicitly, so they do not depend on the machine's default umask."

[[act]]
title = "Roles and permissions, and deny by default"
summary = "The store has 15 things that can be done; admin allows all 15 and support, warehouse and finance allow 3 each; what nothing allows is denied, and an explicit deny beats any allow."
detail = """
The online store has 15 things that can be done, such as orders:read and refunds:approve. The admin role allows all 15, and the support, warehouse and finance roles allow 3 each. When support asks for refunds:approve, nothing allows it, so it is denied by default.
And an admin with an explicit deny on secrets who asks for secrets:read is denied explicitly: a deny beats any allow.
"""
speech = """
First demo: roles and permissions. [[slnc 400]] The online store has fifteen things that can be done. [[slnc 600]]
The admin role allows all fifteen. [[slnc 300]] Support, warehouse and finance allow three each. [[slnc 600]]
When support asks for something nothing allows, it is denied by default. [[slnc 600]]
And an explicit deny beats any allow.
"""
rows = { roles = "active ok" }
console = [
    ["the online store has 15 things that can be done, such as orders:read and refunds:approve", "muted"],
    ["the admin role allows 15 of 15", "amber"],
    ["the support role allows 3 of 15", "ok"],
    ["support asks for refunds:approve: DENY_DEFAULT  <- NOTHING ALLOWS IT, SO IT IS DENIED", "ok"],
    ["an admin with an explicit deny on secrets asks for secrets:read: DENY_EXPLICIT  <- A DENY BEATS ANY ALLOW", "ok"],
]

[[act]]
title = "Blast radius: what a stolen credential can reach"
summary = "A nightly export that runs as admin reaches 15 of 15 if its token is stolen; with only the exporter role, 2 of 15; an admin with an explicit deny on secrets reaches 13."
detail = """
The nightly order export runs as an admin because that was quick: a stolen token reaches all 15. The same job with only the exporter role reaches 2 of 15. An admin account with an explicit deny on secrets reaches 13.
The job needs only orders:read and reports:read, so everything else it was given is risk without benefit.
"""
speech = """
Second demo: blast radius. [[slnc 400]] The nightly export runs as an admin, because that was quick. [[slnc 600]]
If its token is stolen, the thief reaches all fifteen. [[slnc 600]]
The same job, with only the role it needs, reaches two. [[slnc 600]]
Everything else it was given was risk, without benefit.
"""
rows = { blast = "active wrong" }
console = [
    ["the nightly order export runs as an admin, because that was quick: a stolen token reaches 15 of 15  <- EVERYTHING", "bad"],
    ["the same job with only the exporter role: a stolen token reaches 2 of 15", "ok"],
    ["an admin account with an explicit deny on secrets reaches 13 of 15", "amber"],
    ["the job needs only orders:read and reports:read, so everything else it was given is risk without benefit", "muted"],
]

[[act]]
title = "Separation of duties: two people for a refund"
summary = "Alice creates a refund but cannot approve; Dave, an admin, creates one and is refused when he approves it himself; Carol approves Alice's."
detail = """
Alice in support creates refund R-1, and cannot approve it. Dave, an admin, creates R-2 and is refused when he tries to approve it himself: admin power does not remove the rule. Carol in finance approves R-1.
Nobody could move money alone, so one stolen account is not enough.
"""
speech = """
Third demo: separation of duties. [[slnc 400]] Alice in support creates a refund, and cannot approve it. [[slnc 600]]
Dave is an admin. [[slnc 300]] He creates a refund, and is refused when he tries to approve it himself. [[slnc 600]]
Carol in finance approves Alice's refund. [[slnc 600]]
Nobody could move money alone, so one stolen account is not enough.
"""
rows = { duties = "active ok" }
console = [
    ["alice (support) creates refund R-1: DONE", "ok"],
    ["alice tries to approve it: NOT_ALLOWED  (support cannot approve)", "ok"],
    ["dave (admin) creates refund R-2 and tries to approve it himself: DONE, then SAME_PERSON  <- ADMIN POWER DOES NOT REMOVE THE RULE", "ok"],
    ["carol (finance) approves R-1: DONE, approved: true", "ok"],
    ["nobody could move money alone, so one stolen account is not enough", "muted"],
]

[[act]]
title = "Access that expires by itself"
summary = "Carol is granted payments:write for ticks 10 to 12; she can write at ticks 10 and 12, not at 9 or 13, and nobody has to remember to remove it."
detail = """
Carol in finance is granted payments:write for ticks 10 to 12, for a month-end fix. At tick 9 she cannot write payments, at ticks 10 and 12 she can, and at tick 13 she cannot again. The grant is gone and nobody had to remember to remove it.
"""
speech = """
Fourth demo: access that expires. [[slnc 400]] Carol is granted permission to write payments, for a month end fix, for a short time. [[slnc 600]]
Before it starts, she cannot. [[slnc 300]] During it, she can. [[slnc 300]] After it ends, she cannot again. [[slnc 600]]
Nobody had to remember to remove it.
"""
rows = { expiry = "active ok" }
console = [
    ["carol (finance) is granted payments:write for ticks 10 to 12, for a month-end fix", "muted"],
    ["at tick 9 she can write payments: false", "ok"],
    ["at tick 10 she can write payments: true", "amber"],
    ["at tick 12 she can write payments: true", "amber"],
    ["at tick 13 she can write payments: false", "ok"],
    ["at tick 13 the grant is gone, and nobody had to remember to remove it", "ok"],
]

[[act]]
title = "Privilege creep, and the operating system"
summary = "Of 5 permissions held, 2 were not used in 90 days; a file is made readable by others and then owner-only, rw------- in a rwx------ folder; the SecurityManager is gone."
detail = """
On day 200, of 5 permissions held, 2 were not used in the last 90 days: Bob's orders:read, never used, and Carol's payments:read, last used on day 100. Those are candidates for removal. At the operating system level, an export file with permissions rw-r--r-- is readable by others;
with rw------- it is not, and its folder is rwx------. The Java SecurityManager that once limited code inside one program has been removed, so the limits that remain are outside the program: separate operating system users, containers and separate processes.
"""
speech = """
Fifth demo: privilege creep, and the operating system. [[slnc 400]] Of five permissions held, two were not used for ninety days. [[slnc 300]] One was never used at all. [[slnc 600]]
Those are candidates for removal. [[slnc 600]]
On the file system, a file that others can read is made readable by the owner only. [[slnc 600]]
The Java security manager has been removed. [[slnc 300]] So the limits that remain are outside the program: separate users, containers, and separate processes.
"""
rows = { creep = "active amber", os = "active ok" }
console = [
    ["on day 200, of 5 permissions held, 2 were not used in the last 90 days:", "amber"],
    ["bob orders:read, never used", "amber"],
    ["carol payments:read, last used on day 100", "amber"],
    ["an export file with permissions rw-r--r-- is readable by others: true", "bad"],
    ["with permissions rw------- it is readable by others: false, and its folder is rwx------", "ok"],
    ["the Java SecurityManager that once limited code inside one program has been removed from the JDK", "muted"],
    ["the limits that remain are outside the program: separate operating system users, containers and separate processes", "muted"],
]

