[[act]]
title = "Blast radius: what a stolen credential can reach"
summary = "The nightly export needs 2 permissions; running as admin, a stolen token reaches 15 of 15, 13 of them never needed; with only the exporter role it reaches 2 of 15; an admin with an explicit deny on secrets reaches 13."
detail = """
The nightly order export needs only orders:read and reports:read. Before the fix it runs as an admin, because that was quick, and a stolen token reaches all 15 permissions: 13 of them the job never needs.
After the fix the same job has only the exporter role, and a stolen token reaches 2 of 15, both needed. Another admin account with an explicit deny on secrets reaches 13 of 15.
Whatever the job does not need is risk without benefit.
"""
figure = "blast"
figure_title = "The blast radius of one stolen token"
figure_speech = """
Second demo: the blast radius. [[slnc 400]] The blast radius is everything one stolen credential can reach. [[slnc 600]]
Each box is one of the store's fifteen permissions. [[slnc 300]] A filled box is one the token reaches. [[slnc 600]]
On the left, in red, before the fix. [[slnc 300]] The nightly order export runs as an admin, because that was quick. [[slnc 400]] Every box is filled. [[slnc 300]] A thief with that token can delete customers, write payments, and read the secrets. [[slnc 600]]
The two green boxes are all the job really needs: read the orders, and read the reports. [[slnc 600]]
On the right, in green, after the fix. [[slnc 300]] The same job, with only the exporter role. [[slnc 300]] Only those two boxes are filled. [[slnc 400]] Two of fifteen. [[slnc 600]]
The job works exactly as before. [[slnc 300]] The other thirteen were risk, without any benefit.
"""
speech = """
The program prints the same sections. [[slnc 400]] First, what the job needs: two permissions. [[slnc 400]] Before the fix, a stolen token reaches fifteen of fifteen, and thirteen of them the job never needs. [[slnc 500]] After the fix, two of fifteen, and none wasted. [[slnc 500]] And an admin with an explicit deny on the secrets still reaches thirteen. [[slnc 300]] Better, but still far too much for one job.
"""
rows = { blast = "active wrong" }
console = [
    ["WHAT THE NIGHTLY ORDER EXPORT NEEDS:", "code"],
    ["  orders:read  reports:read", "muted"],
    ["BEFORE THE FIX (the job runs as admin, because it was quick):", "bad"],
    ["  a stolen token reaches 15 of 15  <- EVERYTHING", "bad"],
    ["  13 of them the job never needs", "muted"],
    ["AFTER THE FIX (the same job with only the exporter role):", "ok"],
    ["  a stolen token reaches 2 of 15", "muted"],
    ["  0 of them the job never needs", "muted"],
    ["ANOTHER ADMIN, WITH AN EXPLICIT deny secrets:*:", "code"],
    ["  a stolen token reaches 13 of 15", "muted"],
    ["whatever the job does not need is risk without benefit", "muted"],
]

