[poster]
headline = [["LEAST", "text"], ["PRIVILEGE", "accent"]]
taglines = [["Give only the access that is needed, for only as long as it is needed", "gold"]]
before = { code = "role = admin", note = "15 of 15 reachable", tag = "BEFORE" }
after = { code = "role = exporter", note = "2 of 15 reachable", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "The Principle of Least Privilege"
narration = """Hello, and welcome. [[slnc 400]] This video explains the principle of least privilege, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] Every person and every program should have only the permissions its work needs, for only as long as it needs them. [[slnc 600]] Think of a hotel. [[slnc 300]] A guest's key opens one room and stops working at checkout. [[slnc 300]] A master key is kept in a safe. [[slnc 300]] If a guest's key is stolen, one room is lost, not the hotel. [[slnc 700]] In this video, the domain is an online store. [[slnc 500]] By the end, you will hear how to measure the damage a stolen credential can do. [[slnc 300]] Why two people should be needed for a refund. [[slnc 300]] And why access should expire by itself."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online store has staff and unattended jobs.", "", "It is quickest to make everything an admin.", "", "Then every account is worth stealing."]
narration = """Here is the scenario. [[slnc 400]] An online store has staff, and unattended jobs, and they all need some access. [[slnc 500]] It is quickest to make everything an admin, so that nothing ever fails. [[slnc 600]] And then every account is worth stealing."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["Privilege: a permission to do something", "Role: a bundle of permissions", "Deny by default: nothing allowed unless stated", "Blast radius: what one stolen credential reaches", "Separation of duties: two people for risky acts"]
narration = """Before the demos, the words. [[slnc 500]] A privilege is a permission to do something. [[slnc 500]] A role is a bundle of permissions. [[slnc 500]] Deny by default means nothing is allowed unless a statement allows it. [[slnc 500]] The blast radius is what one stolen credential can reach. [[slnc 500]] And separation of duties means two people are needed for a risky act."""

[[scene]]
key = "03-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "04-who-can-do-what"
kind = "figure"
title = "Who can do what in the store"
body = "role_matrix"
narration = """Let's see the whole idea on one picture. [[slnc 400]] Down the left are the fifteen things that can be done in the store. [[slnc 300]] Read the orders, approve a refund, read the secrets, and so on. [[slnc 500]] Across the top are four roles. [[slnc 300]] A filled box means the role allows it. [[slnc 600]] The admin column, in red, is filled from top to bottom. [[slnc 300]] Fifteen of fifteen. [[slnc 500]] Support, warehouse and finance, in green, each allow three. [[slnc 300]] Just what that job needs. [[slnc 600]] Here is why it matters. [[slnc 300]] A stolen key opens exactly what its role allows. [[slnc 300]] A stolen support password reaches three things. [[slnc 300]] A stolen admin password reaches everything. [[slnc 500]] And any box that is empty is denied, by default. [[slnc 300]] Next, the five demos."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "09-ladder"
kind = "bullets"
title = "Ways To Shrink Privilege"
body = ["Smaller roles", "Deny by default, explicit deny wins", "Two people for risky actions", "Access that expires", "Remove what is not used"]
narration = """Let's put the ways side by side. [[slnc 400]] Smaller roles. [[slnc 500]] Deny by default, and an explicit deny that wins. [[slnc 500]] Two people for risky actions. [[slnc 500]] Access that expires. [[slnc 500]] And removing what is not used."""

[[scene]]
key = "11-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Cloud IAM policies", "Kubernetes roles, sudo rules", "Read-only database users, chmod 600", "Four-eyes approval"]
narration = """You have probably met this already. [[slnc 400]] Cloud I A M policies, for identity and access management, have an explicit deny and a default deny. [[slnc 500]] Kubernetes has roles and role bindings, and Unix has sudo rules. [[slnc 500]] Read only database users, and the command chmod six hundred, are the same idea. [[slnc 500]] And four eyes approval for payments is separation of duties."""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Start with admins and unattended jobs", "Measure the blast radius of each credential", "Two people for money and secrets", "Prefer temporary access", "Review what is used"]
narration = """So, how do you use it? [[slnc 400]] Start with administrators and unattended jobs. [[slnc 500]] Measure the blast radius of each credential. [[slnc 500]] Require two people for money and for secrets. [[slnc 500]] Prefer temporary access to permanent access. [[slnc 500]] And review what is really used."""

[[scene]]
key = "12-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "13-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a refund-reviewer role", "and count what it reaches."]
narration = """That's the principle of least privilege. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Give only the access that is needed, for only as long as it is needed, so one stolen account reaches as little as possible. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine, with nothing installed except a Java development kit. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a new role, and count how many permissions it reaches. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
How an online store gives access to its staff, its unattended jobs and its files: roles and permissions, refunds that need two people, temporary grants, the audit of unused permissions, and the file permissions of exports.
It covers theft of one credential and a dishonest insider. It does not cover how people prove their identity, network access, or the security of the systems the permissions apply to.
"""
assets = [
    "Customer data, payments and refunds.",
    "Secrets such as keys and tokens.",
    "The roles and grants themselves.",
    "Export files on disk.",
]
actors = [
    "Staff in support, warehouse and finance roles.",
    "Unattended jobs and services holding tokens.",
    "An attacker who steals one credential.",
    "A dishonest insider.",
]
boundaries = [
    "Credential to the permissions behind it: the blast radius is everything across it.",
    "Request to decision: the policy is the guard.",
    "Role management to everyone else: who may change roles is itself a permission.",
]
assumptions = [
    "People and jobs are correctly identified before the policy is asked.",
    "The audit's usage records are complete and cannot be edited by the people they describe.",
    "In the demo, names and numbers are fixed and the clock is simulated.",
]
out_of_scope = [
    "Authentication and sessions.",
    "Cloud IAM and Kubernetes RBAC: the tools projects.",
    "Sandboxing code inside the JVM.",
]
tests = [
    "`PolicyTest` checks pattern matching, deny by default, explicit deny in any order, and the blast radius counts.",
    "`AccessTest` checks combined roles, user denies, grant windows, and two-person refunds including for an admin.",
    "`AuditAndFilesTest` checks the audit limit and owner-only file permissions.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next project, patching-and-dependency-hygiene, looks at the other half of staying safe over time: keeping the software itself up to date.
"""

[[threat]]
id = "T1"
stride = "E"
threat = "A stolen token of an over-privileged job reaches everything"
where = "`Access`, `Policy.reachable`"
control = "Scoped roles for each job, and a measured blast radius"
residual = "A scoped job is still a stolen job, so tokens should also be short-lived and rotated"

[[threat]]
id = "T2"
stride = "R"
threat = "One person creates and approves their own refund"
where = "`RefundDesk`"
control = "Creator and approver must be different people, whatever their roles"
residual = "Two colluding people can still do it, so approvals should be reviewed"

[[threat]]
id = "T3"
stride = "E"
threat = "Roles grow over time until they allow far more than the work needs"
where = "`Catalogue.ROLES`"
control = "Review roles regularly and keep them small"
residual = "Needs an owner and a schedule; code cannot do it alone"

[[threat]]
id = "T4"
stride = "E"
threat = "Temporary access is never removed"
where = "`Access.grant`"
control = "Grants have an end and expire on their own"
residual = "A renewal that nobody checks turns a temporary grant into a permanent one"

[[threat]]
id = "T5"
stride = "I"
threat = "An export file is read by another user on the machine"
where = "`OwnerOnly`"
control = "Owner-only file and folder permissions"
residual = "The owner's account, backups and root can still read it"

[[threat]]
id = "T6"
stride = "T"
threat = "Someone changes the roles to give themselves access"
where = "the management of roles"
control = "Changing roles is itself a permission that is held by very few and recorded"
residual = "Not modelled here; needs an audit log that the changers cannot edit"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] Six small classes do the work, and the demo class runs the five acts. [[slnc 300]] Here is what each one does."""

[[class]]
name = "Policy"
what = "allow and deny statements, and the decision"
[[class.part]]
title = "deny by default, and a deny wins"
code = """
Decision decide(String permission) {
    boolean allowed = false;
    for (Statement statement : statements) {
        if (matches(statement.pattern(), permission)) {
            if (!statement.allow()) {
                return Decision.DENY_EXPLICIT;
            }
            allowed = true;
...
    return allowed ? Decision.ALLOW : Decision.DENY_DEFAULT;
"""
speech = """A policy is a list of allow and deny statements. [[slnc 300]] Decide goes through them one by one. [[slnc 300]] A matching deny returns at once: deny explicit. [[slnc 300]] A matching allow only remembers it. [[slnc 300]] If nothing matched, the answer is deny by default."""

[[class]]
name = "Catalogue"
what = "the store's 15 permissions, and its roles"
[[class.part]]
title = "roles are bundles of permissions"
code = """
static final Map<String, Policy> ROLES = Map.of(
        "admin", Policy.of("allow *"),
...
        "exporter", Policy.of("allow orders:read",
                "allow reports:read"));
"""
speech = """The catalogue lists the fifteen permissions, each written as resource, colon, action. [[slnc 300]] Each role is a policy. [[slnc 300]] Admin is a single allow star. [[slnc 300]] The exporter, for the nightly job, allows just two."""

[[class]]
name = "Access"
what = "who has which roles, and grants that expire"
[[class.part]]
title = "a grant only counts inside its window"
code = """
for (Grant grant : grants.getOrDefault(user, List.of())) {
    boolean inside = tick >= grant.from() && tick < grant.until();
    if (inside && Policy.matches(grant.permission(), permission)) {
        return true;
"""
speech = """Access joins a user's roles into one policy. [[slnc 300]] An explicit deny still wins. [[slnc 300]] A temporary grant counts only from its first tick, up to but not including its last. [[slnc 300]] That is why tick thirteen says false."""

[[class]]
name = "RefundDesk"
what = "a refund needs two different people"
[[class.part]]
title = "permission first, then not the creator"
code = """
if (!access.can(user, "refunds:approve", tick)) {
    return Outcome.NOT_ALLOWED;
}
if (creators.get(refund).equals(user)) {
    return Outcome.SAME_PERSON;
}
"""
speech = """The refund desk remembers who created each refund. [[slnc 300]] To approve, you need the permission. [[slnc 300]] And you must not be the creator. [[slnc 300]] An admin passes the first check, and still fails the second."""

[[class]]
name = "UsageAudit"
what = "finds permissions nobody has used lately"
[[class.part]]
title = "never used, or too long ago"
code = """
static List<Holding> unused(List<Holding> holdings, long today, long days) {
    return holdings.stream()
            .filter(h -> h.lastUsedDay() < 0 || today - h.lastUsedDay() > days)
            .toList();
"""
speech = """Each holding is a user, a permission, and the day it was last used. [[slnc 300]] Minus one means never. [[slnc 300]] A holding is unused if it was never used, or if more than ninety days have passed."""

[[class]]
name = "OwnerOnly"
what = "sets operating system file permissions"
[[class.part]]
title = "lock a file to its owner"
code = """
static String lockFile(Path file) throws IOException {
    Set<PosixFilePermission> ownerOnly = PosixFilePermissions.fromString("rw-------");
    Files.setPosixFilePermissions(file, ownerOnly);
"""
speech = """Owner only uses the operating system's own permissions. [[slnc 300]] The Java standard library can set them directly. [[slnc 300]] Read and write for the owner, and nothing for anyone else."""

[[acronym]]
short = "JDK"
long = "Java Development Kit: Java and its tools"
say = "J D K is the Java Development Kit: Java, and the tools to build and run it."
[[acronym]]
short = "IAM"
long = "Identity and Access Management: cloud permissions"
say = "I A M is identity and access management: how a cloud decides who may do what."
[[acronym]]
short = "R-1, R-2"
long = "refund 1, refund 2: the refunds in act three"
say = "R one and R two are the numbers of two refunds in the store."
[[acronym]]
short = "rwx"
long = "read, write, execute: file permission letters"
say = "R, W and X are read, write, and execute. On a folder, x means you may enter it. A dash means not allowed."
[[acronym]]
short = "POSIX"
long = "Portable Operating System Interface: the Unix standard"
say = "POSIX is the Portable Operating System Interface: the Unix standard that macOS and Linux follow, including file permissions."
[[acronym]]
short = "*"
long = "star, a wildcard: matches anything"
say = "And a star is a wildcard. Allow star allows everything. Deny secrets star denies every action on the secrets."
