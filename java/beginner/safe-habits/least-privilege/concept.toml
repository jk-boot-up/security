[[act]]
title = "Privilege creep, and the operating system"
summary = "Of 5 permissions held, 2 were not used in the last 90 days and are candidates for removal; an export file goes from rw-r--r-- to rw-------, in a rwx------ folder; the SecurityManager is permanently disabled."
detail = """
Privilege creep is permission that piles up and is never taken away. On day 200 the audit looks at 5 permissions held, and when each was last used. Unused means last used before day 200 - 90 = 110: Bob's orders:read, never used, and Carol's payments:read, last used on day 100. Those 2 are candidates for removal.
At the operating system level, the export file is first written with permissions rw-r--r--: the owner can read and write, and the group and everyone else can read. Locked to rw------- only the owner can, and its folder is rwx------.
The Java SecurityManager that once limited code inside one program is permanently disabled since JDK 24, so the limits that remain are outside the program: separate operating system users, containers and separate processes.
"""
figure = "creep_and_files"
figure_title = "Unused permissions, and owner-only files"
figure_speech = """
Fifth demo: privilege creep, and the operating system. [[slnc 400]] Privilege creep is permission that piles up, and is never taken away. [[slnc 600]]
On the left, in amber, the audit. [[slnc 300]] Today is day two hundred. [[slnc 300]] Anything not used in the last ninety days counts as unused. [[slnc 300]] Two hundred minus ninety is one hundred and ten. [[slnc 300]] So anything last used before day one hundred and ten. [[slnc 500]] Five permissions are held. [[slnc 300]] Bob has never used orders read. [[slnc 300]] Carol last read payments on day one hundred. [[slnc 300]] Those two, in red, are candidates for removal. [[slnc 700]]
On the right, the same idea for a file. [[slnc 300]] File permissions are nine letters, in three groups of three: the owner, the group, and everyone else. [[slnc 300]] R is read, w is write, and a dash means not allowed. [[slnc 500]] Before the fix, the export file is r w dash, r dash dash, r dash dash. [[slnc 300]] Everyone on the machine can read it. [[slnc 500]] After the fix, r w, then six dashes. [[slnc 300]] Only the owner can.
"""
speech = """
Here is the output. [[slnc 400]] The holdings: five permissions, and when each was last used. [[slnc 400]] Then the audit, which works out the cut off day, two hundred minus ninety, and marks the two to remove.
[[page]]
Then the file, before and after the fix. [[slnc 300]] Readable by others, true, then false, and its folder is locked too. [[slnc 500]] The Java security manager has been switched off for good, since J D K twenty four. [[slnc 300]] So the limits that remain are outside the program: separate users, containers, and separate processes.
"""
rows = { creep = "active amber", os = "active ok" }
console = [
    ["THE HOLDINGS (5 permissions, and when each was last used):", "code"],
    ["  alice  orders:read      last used on day 198", "muted"],
    ["  alice  customers:read   last used on day 150", "muted"],
    ["  bob    inventory:write  last used on day 190", "muted"],
    ["  bob    orders:read      never used", "muted"],
    ["  carol  payments:read    last used on day 100", "muted"],
    ["THE AUDIT (unused for 90 days: before day 200 - 90 = 110):", "code"],
    ["  bob    orders:read      never used            <- REMOVE", "bad"],
    ["  carol  payments:read    last used on day 100  <- REMOVE", "bad"],
    ["  2 of 5 are candidates for removal", "amber"],
    ["---", ""],
    ["BEFORE THE FIX (the export file as first written):", "bad"],
    ["  export.csv  rw-r--r--  readable by others: true", "amber"],
    ["AFTER THE FIX (owner only):", "ok"],
    ["  export.csv  rw-------  readable by others: false", "ok"],
    ["  its folder  rwx------", "muted"],
    ["the Java SecurityManager is disabled for good (JDK 24),", "muted"],
    ["so the limits that remain are outside the program:", "muted"],
    ["separate operating system users, containers, processes", "muted"],
]

