[[act]]
title = "Access that expires by itself"
summary = "Carol is granted payments:write from tick 10 until tick 13; she can write at ticks 10 and 12, not at 9 or 13, and nobody has to remember to remove it."
detail = """
Carol in finance gets payments:write for a month-end fix, from tick 10 until tick 13 (a tick is one step of the demo's simulated clock, and tick 13 is the first without the grant).
At tick 9 she cannot write payments, at ticks 10 and 12 she can, and at tick 13 she cannot again. The grant is gone and nobody had to remember to remove it.
"""
figure = "timeline"
figure_title = "A grant that ends by itself"
figure_speech = """
Fourth demo: access that expires. [[slnc 400]] Along the line is the demo's clock. [[slnc 300]] Each step is called a tick. [[slnc 600]]
At the top, in blue, the grant. [[slnc 300]] Carol, in finance, gets permission to write payments, for a month end fix. [[slnc 300]] It starts at tick ten, and it ends at tick thirteen. [[slnc 300]] Thirteen is the first tick without it. [[slnc 400]] The green bar shows when she holds it. [[slnc 600]]
Below, in amber, four checks. [[slnc 300]] Can Carol write payments? [[slnc 400]] At tick nine, before the grant: false. [[slnc 300]] At tick ten: true. [[slnc 300]] At tick twelve: still true. [[slnc 300]] At tick thirteen: false again. [[slnc 600]]
Nobody had to remember to take it back. [[slnc 300]] The end was written into the grant, on the day it was given.
"""
speech = """
The output shows the same two sections. [[slnc 400]] The grant: who, what, from when, and until when. [[slnc 500]] Then the checks, one per line: the tick, the answer, and why. [[slnc 400]] False, true, true, false.
