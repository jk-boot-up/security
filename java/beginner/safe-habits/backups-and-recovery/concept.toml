# concept.toml: everything about this project that is not Java code.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "backups-and-recovery"
module = "safe-habits"
title = "Backups and Recovery"
short_title = "Backups and Recovery"
package = "backups"
main_class = "BackupsDemo"
tagline = "A backup is only real once it has been restored"
bold = "Backups are what turns a disaster into an inconvenience, but only if they are complete, checked by a real restore, kept where ransomware cannot reach them, kept long enough, and sealed like the secrets they are."
domain = "an online store"
domain_note = ""
youtube_description = """Backups and recovery in Java: the last line of defence when everything else fails. Explained with an online store, like a fire drill, because a plan nobody has practised is only a hope. We make full and incremental backups with a manifest of SHA-256 fingerprints, catch a changed and a deleted file, show a backup that passes its checks and still cannot be restored, grade a setup against the 3-2-1 rule, prune snapshots by a retention policy, watch ransomware encrypt the shop and its mounted backup folder, restore from a store that only adds versions, work out recovery point and recovery time from a timeline, and seal the archive with AES-GCM, because a backup is a copy of every secret."""
thumb_lines = ["BACKUPS AND", "RECOVERY"]
thumb_code = "restore --verify manifest.sha256"
youtube_title = "Backups and Recovery in Java (3-2-1, Ransomware, RPO and RTO)"
youtube_tags = ["backups", "disaster recovery", "ransomware", "3-2-1 rule", "rpo rto", "restore test", "immutable backups", "java", "cybersecurity for beginners"]

[readme]
intro = """
Every other defence in this repository tries to stop something going wrong. A **backup** is for when it does anyway: a mistake, a failed disk, a fire, or **ransomware** that encrypts everything it can write to.
A good backup has a few properties. It is **complete**, which a **manifest** of SHA-256 fingerprints helps to prove. It has been **restored** at least once, because a backup that cannot be restored is not a backup. It follows the **3-2-1 rule**:
three copies, on two kinds of media, one of them off site. It includes a copy that the shop's own account **cannot change**, because ransomware encrypts every backup it can reach. It is kept for as long as it is useful and no longer, by a **retention policy**.
And it is **sealed**, because it contains every customer's data.

The demo makes full and incremental backups of an online store's files, damages them, grades two setups against the rule, prunes 400 snapshots, runs a ransomware attack, works out how much work a failure loses and how long recovery takes, and seals the archive.
"""
analogy = """
Think of a fire drill. Having a plan is not the same as knowing it works: the exits turn out to be locked only when the building is full of smoke. A backup that has never been restored is the same, a plan that looks fine on paper.
A copy in the next room of the same building is gone in the same fire, and a copy kept in a cabinet that any thief can open is a second way to lose.
"""
scenario = """
An online store keeps orders, customers and stock in files. The demo takes backups of them, finds damage by comparing fingerprints, discovers a backup that cannot be restored, grades two setups, prunes old snapshots, lets ransomware loose on the shop and its mounted backup folder,
calculates what a failure costs, and seals the archive.
"""
costs = [
    "**Backups cost storage, time and attention.** Incremental backups are small but need the whole chain to restore, and every copy is one more thing to monitor.",
    "**Restore tests cost effort.** They take time and a scratch environment, and they are the only way to know. Schedule them.",
    "**A backup is a copy of every secret.** Anyone who can read the backup can read the data, so it needs encryption, access control and its own key management.",
    "**Immutable storage is not free.** Data cannot be deleted before its retention ends, even by mistake or on request, which has to be reconciled with rules about deleting personal data.",
    "**The demo is small.** It shows the ideas with files in a folder. Real systems add databases that must be backed up consistently, object storage with object lock, and backup products.",
]
too_much = """
Every business that has data it cannot recreate needs this. How far to go depends on the recovery point and recovery time it can afford: a shop that can lose an hour of orders is a different problem from one that cannot lose one.
"""
met_before = [
    "`rsync`, `restic`, `borg` and cloud snapshot features.",
    "Object lock and write-once storage in cloud object stores.",
    "Disaster recovery plans and \"RPO\" and \"RTO\" in service agreements.",
    "News stories about ransomware that also took the backups.",
]
where = """
This project is the third in [safe-habits](..), after [least-privilege](../least-privilege) and [patching-and-dependency-hygiene](../patching-and-dependency-hygiene). It uses the key habits from [keystore-basics](../../cryptography/keystore-basics) to protect the archive.
"""
twin = """
All backups are files in a temporary folder, and the clock is simulated, so the demo is exact. Keys and nonces are random, so the demo prints only facts that do not depend on them. SHA-256 is checked against the published value for "abc".
File permissions are the POSIX ones that macOS and Linux use, and a true write-once store needs a storage service, so it is modelled by a store that only adds versions.
"""
test_note = "SHA-256 is checked against the published value for \"abc\". Backups are files in a temporary folder, the clock is simulated, and keys and nonces are random but never printed, so the golden output is the same on every run."

[[act]]
title = "Full and incremental backups, with a manifest"
summary = "A full backup stores 3 files, an incremental one only the files that changed, and the day 3 state of 4 files restores from the chain with no problems."
detail = """
Day one is a full backup: three files stored. On day two the orders file changed and a refunds file appeared, so the incremental backup stores just those two. On day three only the customers file changed: one file stored.
The manifest of day three lists all four files, each with its SHA-256. Restoring day three takes the newest copy of each file from the chain, and comparing with the manifest finds no problems.
Incremental backups are small and quick, and a restore needs the whole chain.
"""
speech = """
First demo: full and incremental backups. [[slnc 400]] Day one is a full backup. [[slnc 300]] Three files are stored. [[slnc 600]]
On day two, only two files changed or appeared, so the incremental backup stores just those two. [[slnc 600]]
Each backup has a manifest. [[slnc 300]] A list of every file, with its S H A two fifty six fingerprint. [[slnc 600]]
Restoring takes the newest copy of each file from the chain, and the manifest confirms that nothing is wrong. [[slnc 300]] Incremental backups are small, and a restore needs the whole chain.
"""
rows = { full = "active ok" }
console = [
    ["day 1, a full backup: 3 files stored", "muted"],
    ["day 2, an incremental backup: 2 files stored (orders changed, refunds new)", "muted"],
    ["day 3, an incremental backup: 1 file stored", "muted"],
    ["the manifest of day 3 lists 4 files, each with its SHA-256", "ok"],
    ["restoring day 3 takes the newest copy of each file from the chain; problems found: 0", "ok"],
    ["incremental backups are small and quick, and a restore needs the whole chain", "amber"],
]

[[act]]
title = "Can the backup be trusted? Only a restore test says"
summary = "A changed byte and a deleted file are both found from the manifest, yet a backup that skipped the orders file passes the manifest and fails the restore test."
detail = """
One byte of a stored file is changed: the check finds one changed file, and the manifest names it. A stored file is deleted: one missing file is found. But a backup job that skipped the orders file because it was in use
produces a manifest that checks out, since the manifest only describes what was copied. The restore test asks the application's own question, is there a usable orders file, and the answer is no. A backup nobody restored is a hope.
A good backup passes the restore test, with three orders.
"""
speech = """
Second demo: can the backup be trusted? [[slnc 400]] Change one byte of a stored file, and the manifest finds it. [[slnc 300]] Delete a file, and the manifest finds that too. [[slnc 600]]
But a backup job skipped the orders file, because it was in use. [[slnc 300]] The manifest checks out. [[slnc 300]] It only describes what was copied. [[slnc 600]]
The restore test asks the application's own question. [[slnc 300]] Is there a usable orders file? [[slnc 300]] No. [[slnc 600]]
A backup that nobody restored is a hope.
"""
rows = { trust = "active amber" }
console = [
    ["one byte of a stored file is changed: files found changed 1, and the manifest names it", "ok"],
    ["a stored file is deleted: files found missing 1", "ok"],
    ["a backup job skipped the orders file because it was in use; the manifest checks out: true", "amber"],
    ["the restore test asks for a usable orders file: false  <- A BACKUP NOBODY RESTORED IS A HOPE", "bad"],
    ["a good backup passes the restore test: true, with 3 orders", "ok"],
]

[[act]]
title = "The 3-2-1 rule, and how long to keep backups"
summary = "A second folder on the same server scores 0 of 4 against the rule while a server, a NAS and an off-site locked bucket score 4 of 4; 400 snapshots shrink to 21."
detail = """
The 3-2-1 rule asks for three copies, on two kinds of media, one of them off site, and today also one that cannot be changed. A copy in another folder of the same server scores zero of four.
A server, an office NAS and an off-site locked bucket score four of four. Retention decides how long to keep: out of 400 daily snapshots, keeping seven daily, four weekly and twelve monthly leaves 21 and prunes 379.
The oldest kept is the first of March the year before: a year of history in 21 snapshots. Keeping less than the law or the business needs is a risk, and so is keeping personal data for ever.
"""
speech = """
Third demo: the three two one rule. [[slnc 400]] Three copies. [[slnc 300]] Two kinds of media. [[slnc 300]] One off site. [[slnc 300]] And today, one that cannot be changed. [[slnc 600]]
A second folder on the same server scores zero out of four. [[slnc 300]] A server, a network disk, and an off site locked bucket score four. [[slnc 600]]
Retention decides how long to keep. [[slnc 300]] Four hundred daily snapshots become twenty one: seven daily, four weekly, and twelve monthly. [[slnc 300]] A year of history. [[slnc 600]]
Keeping too little is a risk, and so is keeping personal data for ever.
"""
rows = { rule = "active ok" }
console = [
    ["a copy in another folder of the same server: three copies false, two media false, one off site false, one unchangeable false: 0 of 4", "bad"],
    ["the server, a NAS and an off-site locked bucket: three copies true, two media true, one off site true, one unchangeable true: 4 of 4", "ok"],
    ["400 daily snapshots, keeping 7 daily, 4 weekly and 12 monthly: 21 kept, 379 pruned", "muted"],
    ["the oldest kept is 2025-03-01: a year of history in 21 snapshots instead of 400", "muted"],
    ["keeping less than the law or the business needs is a risk too, and so is keeping personal data for ever", "amber"],
]

[[act]]
title = "Ransomware, and the copy it cannot change"
summary = "Ransomware encrypts the shop's 3 files and the 3 files in the mounted backup folder, but a store that only adds versions restores every original, and read-only files stop it only until the same user changes them."
detail = """
Ransomware runs on the shop server and encrypts three files in place. The backup folder was mounted and writable, so it is encrypted too: the backup went with the data. A store that only ever adds new versions took the attacker's writes as new versions:
two versions of the orders file, and restoring the version from before the attack gives every original back. Files marked read-only stop the attack: zero encrypted, three blocked. But the same user can make them writable again, and then three are encrypted.
Real protection comes from a copy the shop's own account cannot change.
"""
speech = """
Fourth demo: ransomware. [[slnc 400]] It runs on the shop server and encrypts the files it can write to. [[slnc 600]]
The backup folder was mounted and writable. [[slnc 300]] So it is encrypted too. [[slnc 300]] The backup went with the data. [[slnc 600]]
A store that only adds versions is different. [[slnc 300]] The attacker's writes become a new version, and the old versions are still there. [[slnc 300]] Restore the version from before the attack, and every original comes back. [[slnc 600]]
Marking files read only stops the attack, but only until the same user makes them writable again. [[slnc 300]] Real protection needs a copy that the shop's own account cannot change.
"""
rows = { ransom = "active wrong" }
console = [
    ["ransomware runs on the shop server and encrypts 3 files in place", "bad"],
    ["the backup folder was mounted and writable, so it is encrypted too: 3 files  <- THE BACKUP WENT WITH THE DATA", "bad"],
    ["a store that only adds versions took the attacker's writes as new versions: 2 versions of the orders file", "muted"],
    ["restoring the version from before the attack gives every original file back: true", "ok"],
    ["files marked read-only: encrypted 0, blocked 3", "ok"],
    ["but the same user can make them writable again: encrypted 3", "amber"],
]

[[act]]
title = "How much can be lost, how long it takes, and backups as secrets"
summary = "A nightly backup loses 13:30 of work, about 162 orders, and takes 01:55 to recover, an hourly one loses 6; the archive is sealed with AES-256-GCM and a wrong key is refused."
detail = """
With a nightly backup at two in the morning, a failure at half past three, noticed at ten to four, and a restore of 95 minutes, the recovery point is 13:30 of work lost, about 162 orders at 12 an hour, and the recovery time is 01:55 until the shop is back.
With an hourly backup the recovery point is half an hour and about six orders; the recovery time is the same. And since a backup holds every customer's data, it is sealed with AES-256-GCM: the archive shows no customer name, the right key opens it, another key is refused,
the same archive offered as the next night's is refused because its name is sealed in with it, and the key file is readable by its owner only and lives apart from the backups. A lost key is a lost backup.
"""
speech = """
Fifth demo: recovery point and recovery time. [[slnc 400]] A nightly backup at two in the morning, and a failure in the afternoon. [[slnc 600]]
Thirteen and a half hours of work are lost. [[slnc 300]] About a hundred and sixty two orders. [[slnc 300]] And the shop is back after one hour fifty five. [[slnc 600]]
With an hourly backup, only about six orders are lost. [[slnc 300]] The recovery time is the same. [[slnc 600]]
And since a backup holds every customer's data, it is sealed with A E S G C M. [[slnc 300]] The archive shows no customer name. [[slnc 300]] Another key is refused. [[slnc 300]] So is the same archive passed off as the next night's, because its name is sealed in with it. [[slnc 300]] The key lives apart from the backups, with its own safe copy, because a lost key is a lost backup.
"""
rows = { objectives = "active amber", sealed = "active ok" }
console = [
    ["nightly backup at 02:00, failure at 15:30, noticed at 15:50, restore takes 95 minutes", "muted"],
    ["recovery point: 13:30 of work lost, about 162 orders at 12 an hour", "bad"],
    ["recovery time: 01:55 until the shop is back", "amber"],
    ["with an hourly backup the recovery point is 00:30 and about 6 orders; the recovery time is the same", "ok"],
    ["the archive shows a customer name: false", "ok"],
    ["another key: refused", "ok"],
    ["the same archive offered as the next night's: refused, because its name is sealed in with it", "ok"],
    ["the key file has permissions rw-------, and lives apart from the backups", "muted"],
]

