[[act]]
title = "Recovery point, recovery time, and a sealed backup"
summary = "A nightly backup at 02:00 and a failure at 15:30 lose 13:30 of work, 13.5 h x 12 = 162 orders, and the shop is back after 01:55; hourly backups cut the loss to 6 orders; the archive is sealed with AES-256-GCM and a wrong key or name is refused."
detail = """
The input: the last nightly backup at 02:00, the order database fails at 15:30, someone notices at 15:50, the restore takes 95 minutes, and the shop takes 12 orders an hour.
The recovery point objective, RPO, is the work that can be lost: 15:30 - 02:00 = 13:30, that is 13.5 hours x 12 = 162 orders. The recovery time objective, RTO, is how long until the shop is back: 15:50 + 95 minutes = 17:25, and 17:25 - 15:30 = 01:55. With an hourly backup, the last at 15:00, the RPO is 00:30, 0.5 x 12 = 6 orders, and the RTO is still 01:55: more backups do not make a restore faster.
And a backup holds every customer's data, so it is sealed. The input: 3 files with names such as Ana, the archive name nightly-day-30 and a random 256-bit key; AES-256-GCM with the name bound in as associated data. The result: the archive does not show the name Ana; the right key opens it, 3 files; another key is refused; the same archive offered as nightly-day-31 is refused, because its name is sealed in; and the key file is rw------- and kept apart. A lost key is a lost backup, so the key needs its own copy.
"""
figure = "objectives"
figure_title = "Recovery point and recovery time, on one day"
figure_speech = """
Fifth demo: how much can be lost, and how long it takes. [[slnc 400]] One day, on a line. [[slnc 600]]
In blue, the nightly backup, at two in the morning. [[slnc 300]] In red, the order database fails, at half past three in the afternoon. [[slnc 600]]
The red bar is the recovery point, R P O. [[slnc 300]] Everything since the last backup is lost. [[slnc 300]] Fifteen thirty minus two o'clock is thirteen and a half hours. [[slnc 300]] At twelve orders an hour, a hundred and sixty two orders. [[slnc 600]]
The amber bar is the recovery time, R T O. [[slnc 300]] Noticed at ten to four, plus ninety five minutes of restore, is twenty five past five. [[slnc 300]] One hour fifty five after the failure. [[slnc 600]]
In green, an hourly backup, the last at three o'clock. [[slnc 300]] Only half an hour lost: six orders. [[slnc 300]] But the recovery time is the same. [[slnc 300]] Only a faster restore shrinks it.
"""
speech = """
The real output. [[slnc 400]] The input: the timeline. [[slnc 400]] The recovery point, worked out: thirteen thirty, a hundred and sixty two orders. [[slnc 400]] The recovery time: one fifty five. [[slnc 400]] Hourly: six orders, the same recovery time. [[slnc 600]]
[[page]] Then the archive to seal, and the results. [[slnc 300]] No customer name shows. [[slnc 300]] The right key opens it. [[slnc 300]] Another key, or another name, is refused. [[slnc 300]] And a lost key is a lost backup.
"""
