[poster]
headline = [["BACKUPS AND", "text"], ["RECOVERY", "accent"]]
taglines = [["A backup is only real once it has been restored", "gold"]]
before = { code = "cp -r shop shop-backup", note = "same server, never restored", tag = "BEFORE" }
after = { code = "3-2-1 + restore test + locked copy", note = "complete, checked, out of reach", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "Backups and Recovery"
narration = """Hello, and welcome. [[slnc 400]] This video explains backups and recovery, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A backup is a copy of your data, kept so that you can come back after a failure, a mistake, or an attack. [[slnc 600]] Think of a fire drill. [[slnc 300]] A plan that nobody has practised is only a hope. [[slnc 300]] A copy in the next room of the same building burns in the same fire. [[slnc 700]] In this video, the domain is an online store. [[slnc 500]] By the end, you will hear what makes a backup complete. [[slnc 300]] Why only a restore proves it. [[slnc 300]] Why ransomware can destroy the backup too. [[slnc 300]] And why a backup must be sealed."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online store keeps orders, customers", "and stock in files on one server.", "", "Disks fail. People delete things.", "Ransomware encrypts what it can reach.", "", "The shop must come back."]
narration = """Here is the scenario. [[slnc 400]] An online store keeps its orders, customers, and stock in files on one server. [[slnc 500]] Disks fail. [[slnc 300]] People delete things. [[slnc 300]] And ransomware encrypts everything it can reach. [[slnc 600]] The shop must be able to come back."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["Full and incremental: everything, or only changes", "Manifest: a list of files with fingerprints", "3-2-1: three copies, two media, one off site", "RPO: how much work can be lost", "RTO: how long until service is back"]
narration = """Before the demos, the words. [[slnc 500]] A full backup copies everything. An incremental backup copies only what changed. [[slnc 500]] A manifest is a list of files, each with its fingerprint. [[slnc 500]] The three two one rule asks for three copies, on two kinds of media, one off site. [[slnc 500]] R P O is how much work can be lost. [[slnc 500]] And R T O is how long it takes until service is back."""

[[scene]]
key = "03-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "04-backup-life"
kind = "figure"
title = "One file, from the shop to a tested restore"
body = "backup_life"
narration = """Let's see the whole idea on one real example: the shop's orders file. [[slnc 400]] Step one, in blue, the copy. [[slnc 300]] The orders file changed on day two, so the day two backup stores a copy. [[slnc 600]] Step two, in cyan, the fingerprint. [[slnc 300]] The backup's manifest records the file's S H A two five six. [[slnc 300]] Any later change to the copy shows up. [[slnc 600]] Step three, in amber, keep it elsewhere. [[slnc 300]] Three places, one off site and locked. [[slnc 300]] Four out of four on the three two one rule. [[slnc 600]] Step four, in green, restore and test. [[slnc 300]] Restored from day two, with three orders, usable. [[slnc 300]] The test passes. [[slnc 600]] A backup counts only when all four steps hold. [[slnc 300]] The five demos look at each step in turn."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "08-sealed"
kind = "figure"
title = "A backup is a copy of every secret"
body = "sealed"
narration = """A backup holds every customer's data, so it is sealed. [[slnc 400]] At the top, the input. [[slnc 300]] Three files, with customer names such as Ana. [[slnc 300]] The archive's name, nightly day thirty. [[slnc 300]] And a random key. [[slnc 300]] A E S G C M seals them, with the name bound in. [[slnc 600]] Below, the results. [[slnc 300]] The archive does not show the name Ana. [[slnc 300]] The right key opens it, three files. [[slnc 300]] Another key is refused. [[slnc 300]] The same archive passed off as the next night's is refused too, because its name is sealed in. [[slnc 600]] The key file is readable by its owner only, and kept apart from the backups. [[slnc 300]] And a lost key is a lost backup, so the key needs its own safe copy."""

[[scene]]
key = "09-ladder"
kind = "bullets"
title = "What Makes a Backup Good"
body = ["Complete: the manifest says so", "Restored: a test says so", "Elsewhere: 3-2-1", "Out of reach: one copy nobody can change", "Sealed: it holds every secret"]
narration = """Let's put it together. [[slnc 400]] A good backup is complete, and the manifest says so. [[slnc 500]] It has been restored, and a test says so. [[slnc 500]] It is elsewhere, following the three two one rule. [[slnc 500]] It has one copy that nobody on the shop's account can change. [[slnc 500]] And it is sealed, because it holds every secret."""

[[scene]]
key = "11-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["restic, borg, rsync", "Object lock and versioning", "RPO and RTO in service agreements", "Ransomware that took the backups too"]
narration = """You have probably met this already. [[slnc 400]] Tools like restic, borg and rsync do these jobs. [[slnc 500]] Object stores offer object lock and versioning. [[slnc 500]] Service agreements talk about R P O and R T O. [[slnc 500]] And news about ransomware often says that it took the backups too."""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Back up to match what you can lose", "3-2-1, with a copy nobody can change", "Restore regularly, into a scratch place", "Prune by a written policy", "Encrypt, and keep the key apart"]
narration = """So, how do you use it? [[slnc 400]] Back up as often as the business can afford to lose. [[slnc 500]] Follow three two one, with a copy nobody on the shop's account can change. [[slnc 500]] Restore regularly, into a scratch place. [[slnc 500]] Prune by a written policy. [[slnc 500]] And encrypt the archive, with a key that lives somewhere else."""

[[scene]]
key = "12-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "13-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Change the retention policy", "and see how many snapshots are kept."]
narration = """That's backups and recovery. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] A backup is only real once it has been restored, and only safe if ransomware cannot change it. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine, with nothing installed except a Java development kit. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Change the retention policy, and see how many snapshots are kept. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
How an online store protects and restores its files: the backups it takes, the places they live, who can write to those places, how long they are kept and how the archive is protected. It covers ransomware running as the shop's own account,
accidental loss and corruption, and a thief who finds a backup. It does not cover the security of the live system itself or of a backup service provider.
"""
assets = [
    "The shop's orders, customers and stock.",
    "The backups, which are copies of all of it.",
    "The ability to restore: manifests, chains, keys and a tested procedure.",
    "The archive key.",
]
actors = [
    "The shop's operators, who take and restore backups.",
    "Ransomware running with the shop account's permissions.",
    "A thief who finds a backup copy.",
]
boundaries = [
    "The shop's account to the places it can write: everything a mounted folder or an access key reaches can be encrypted.",
    "The shop's account to a copy it cannot change: the line ransomware must not cross.",
    "The backup to the key: a sealed archive is only as safe as its key's home.",
]
assumptions = [
    "The unchangeable copy is protected by something other than the shop's own credentials.",
    "Restore tests are really run, on a schedule.",
    "In the demo, keys and nonces are random and never printed, and the store that only adds versions stands for object lock or a similar service.",
]
out_of_scope = [
    "Securing the live system against the attack.",
    "Backing up databases consistently.",
    "The security of a backup provider.",
]
tests = [
    "`BackupStoreTest` checks the SHA-256 value, manifests, incremental snapshots, restores of older days, tamper and loss detection, and the restore test.",
    "`PoliciesTest` checks the 3-2-1 rule, retention, objectives, the ransomware simulation, the versioned store, the sealed archive and the key file.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
That completes the plain projects of the beginner track. The tool versions follow: scanning dependencies with real tools, and backups with an object store that supports object lock.
"""

[[threat]]
id = "T1"
stride = "T"
threat = "Ransomware encrypts the live files"
where = "`Ransomware.encryptInPlace`"
control = "Backups taken before the attack and kept where the attack cannot reach"
residual = "Everything since the last backup is lost, which is the recovery point"

[[threat]]
id = "T2"
stride = "T"
threat = "Ransomware encrypts a backup folder that is mounted and writable"
where = "the mounted backup folder"
control = "Do not mount backups writable from the server, and keep a copy that only adds versions"
residual = "Read-only permissions are only a speed bump for the same user"

[[threat]]
id = "T3"
stride = "R"
threat = "A backup is deleted or replaced, and nobody can show what it used to contain"
where = "`Ransomware.VersionedStore`, `Manifest`"
control = "A store that only adds versions, and a manifest of fingerprints"
residual = "The retention period decides how long old versions exist, and a deletion rule for personal data must be reconciled with it"

[[threat]]
id = "T4"
stride = "I"
threat = "A thief reads a backup, which holds every customer's data"
where = "`BackupVault`"
control = "AES-256-GCM, with the key kept apart in an owner-only file"
residual = "A lost key is a lost backup, so the key needs its own safe copy"

[[threat]]
id = "T5"
stride = "D"
threat = "A backup that looks fine cannot be restored"
where = "`RestoreTest`"
control = "A scheduled restore test that asks the application's own question"
residual = "Only the checks the test makes are proven, so they must grow with the system"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] Small classes, one for each idea, and the demo class runs the five acts. [[slnc 300]] Here are the ones that matter."""

[[class]]
name = "BackupStore"
what = "full and incremental snapshots, and the restore"
[[class.part]]
title = "incremental: only files whose hash changed"
code = """
Manifest before = state(root, parent);
Manifest now = Manifest.of(source);
List<String> changed = new ArrayList<>();
now.entries().forEach((file, hash) -> {
    if (!hash.equals(before.entries().get(file))) {
        changed.add(file);
"""
speech = """An incremental backup reads the manifest of the backup before it. [[slnc 300]] It fingerprints the live files now. [[slnc 300]] And it stores only the files whose fingerprint changed, or that are new."""
[[class.part]]
title = "restore: walk back along the chain"
code = """
while (!current.isEmpty()) {
    Path candidate = snapshot(root, current)
            .resolve("data").resolve(file);
    if (Files.isRegularFile(candidate)) {
        return candidate;
    }
    current = Files.readString(
            snapshot(root, current).resolve("PARENT.txt"));
"""
speech = """To restore a file, start at the chosen backup. [[slnc 300]] If it stored the file, use that copy. [[slnc 300]] If not, read its parent, and look there. [[slnc 300]] That is why a restore needs the whole chain."""

[[class]]
name = "Manifest"
what = "every file with its SHA-256, and the check"
[[class.part]]
title = "missing, or changed"
code = """
entries.forEach((name, hash) -> {
    String found = actual.entries.get(name);
    if (found == null) {
        missing.add(name);
    } else if (!found.equals(hash)) {
        changed.add(name);
"""
speech = """The check goes through every file the manifest lists. [[slnc 300]] No file found: missing. [[slnc 300]] A file with a different fingerprint: changed. [[slnc 300]] It can only check what the manifest lists, which is why a partial backup passes."""

[[class]]
name = "RestoreTest"
what = "restore into a scratch folder, then ask the shop's question"
[[class.part]]
title = "is there a usable orders file?"
code = """
Path orders = scratch.resolve("orders.csv");
if (!Files.isRegularFile(orders)) {
    return new Result(manifestOk, false, 0);
}
var lines = Files.readAllLines(orders);
boolean shaped = lines.size() > 1
        && lines.stream().allMatch(line -> line.split(",", -1).length == 3);
"""
speech = """The restore test restores into a scratch folder. [[slnc 300]] No orders file: failed. [[slnc 300]] Otherwise every line must have three fields: id, customer and total. [[slnc 300]] It asks the question the shop really cares about."""

[[class]]
name = "ThreeTwoOne"
what = "the 3-2-1 rule as four checks"
[[class.part]]
title = "copies, media, off site, locked"
code = """
return new Result(copies.size() >= 3,
        copies.stream().map(Copy::medium).distinct().count() >= 2,
        copies.stream().anyMatch(Copy::offsite),
        copies.stream().skip(1).anyMatch(Copy::immutable));
"""
speech = """Four checks, one per line. [[slnc 300]] At least three copies. [[slnc 300]] At least two kinds of media. [[slnc 300]] One off site. [[slnc 300]] And one backup copy that cannot be changed. [[slnc 300]] The live data itself does not count for that one."""

[[class]]
name = "Retention"
what = "which daily snapshots to keep"
[[class.part]]
title = "the newest Sundays, and the 1st of each month"
code = """
days.stream()
        .filter(day -> day.getDayOfWeek() == DayOfWeek.SUNDAY)
        .sorted(Comparator.reverseOrder())
        .limit(weekly)
        .forEach(kept::add);
...
firstOfMonth.entrySet().stream()
        .sorted(Map.Entry.<YearMonth, LocalDate>comparingByKey().reversed())
        .limit(monthly)
"""
speech = """Retention adds three lists to one set. [[slnc 300]] The newest days, the newest Sundays, and the first day of each of the newest months. [[slnc 300]] A set holds each date once, which is why two dates in two lists are counted once."""

[[class]]
name = "Ransomware"
what = "the attack, and the store that only adds versions"
[[class.part]]
title = "append, never overwrite"
code = """
void append(String name, byte[] data, long time) {
    versions.computeIfAbsent(name, key -> new TreeMap<>())
            .put(time, data.clone());
}
...
Optional<byte[]> latestBefore(String name, long time) {
"""
speech = """The versioned store has no way to change or delete. [[slnc 300]] A write only adds a new version, under its time. [[slnc 300]] So the restore asks for the latest version before the attack."""

[[class]]
name = "Objectives"
what = "RPO and RTO from a timeline in minutes"
[[class.part]]
title = "what is lost, and how long"
code = """
long rpo = failure - lastBackup;
long rto = detected + restoreMinutes - failure;
return new Outcome(rpo, rto, rpo * ordersPerHour / 60);
"""
speech = """The recovery point is the failure time minus the last backup. [[slnc 300]] The recovery time is when the restore ends, minus the failure. [[slnc 300]] Orders lost is the recovery point, in hours, times the orders per hour."""

[[class]]
name = "BackupVault"
what = "seals a backup with AES-256-GCM"
[[class.part]]
title = "the archive's name is sealed in"
code = """
Cipher cipher = Cipher.getInstance("AES/GCM/NoPadding");
cipher.init(Cipher.ENCRYPT_MODE, new SecretKeySpec(key, "AES"),
        new GCMParameterSpec(128, nonce));
cipher.updateAAD(name.getBytes(StandardCharsets.UTF_8));
byte[] sealed = cipher.doFinal(pack(files));
"""
speech = """The vault encrypts the packed files with A E S G C M, and a fresh random nonce. [[slnc 300]] The archive's name goes in as associated data. [[slnc 300]] It is not secret, but the archive opens only under that name. [[slnc 300]] So last month's archive cannot pass as tonight's."""

[[acronym]]
short = "SHA-256"
long = "Secure Hash Algorithm, 256 bits: a fingerprint of a file"
say = "S H A two five six is the Secure Hash Algorithm with two hundred and fifty six bits: a fingerprint of a file."
[[acronym]]
short = "3-2-1"
long = "3 copies, 2 kinds of media, 1 off site"
say = "Three two one is the backup rule: three copies, on two kinds of media, one of them off site."
[[acronym]]
short = "NAS, SSD"
long = "Network Attached Storage; Solid State Drive"
say = "N A S is network attached storage, a disk on the office network. S S D is a solid state drive."
[[acronym]]
short = "RPO, RTO"
long = "Recovery Point / Time Objective: work lost; time until back"
say = "R P O is the recovery point objective: how much work can be lost. R T O is the recovery time objective: how long until the shop is back."
[[acronym]]
short = "AES-256-GCM"
long = "Advanced Encryption Standard, 256-bit key, Galois/Counter Mode"
say = "A E S two five six G C M is the Advanced Encryption Standard with a two hundred and fifty six bit key, in Galois Counter Mode, which also detects any change."
[[acronym]]
short = "rw-------, r--------"
long = "file permissions: owner may read and write; owner may only read"
say = "The dashes are file permissions. R W means only the owner may read and write. A single R means the owner may only read."
