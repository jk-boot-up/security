[docs.explained]
sentence = """
A backup is complete when its manifest says so, trustworthy only after a restore test, safe from ransomware only if one copy cannot be changed by the shop's own account, and a secret itself, so it is sealed and its key is kept apart.
"""
verdict = """
Back up on a schedule that matches what the business can lose, follow 3-2-1 with an unchangeable copy, restore regularly into a scratch environment, prune by a written policy, and encrypt the archive with a key that lives somewhere else.
"""
recognise = [
    "`restic`, `borg`, `rsync` and database dump jobs in cron.",
    "Object lock, versioning and write-once settings in object stores.",
    "RPO and RTO in disaster recovery plans.",
    "A \"restore drill\" in a runbook.",
]

[spec]
purpose = """
Teach backups as a security control by making full and incremental backups with a manifest, testing a restore, grading the 3-2-1 rule, pruning by retention, simulating ransomware, calculating recovery objectives and sealing the archive.
"""
nongoals = [
    "Backup products, schedulers and cloud services: described, not run.",
    "Database consistency and point-in-time recovery.",
    "A real write-once store: modelled by a store that only adds versions.",
]
problem = """
Learners know backups matter but not what makes one trustworthy, or how ransomware defeats the usual setup.
"""
roles = [["Fingerprints and manifests", "`Sha256`, `Manifest`"], ["Full and incremental snapshots", "`BackupStore`"], ["The restore test", "`RestoreTest`"], ["The 3-2-1 rule", "`ThreeTwoOne`"], ["Retention", "`Retention`"], ["Ransomware and a versioned store", "`Ransomware`"], ["Recovery objectives", "`Objectives`"], ["The sealed archive", "`BackupVault`"], ["Entry point", "`BackupsDemo`"]]
requirements = [
    "Incremental snapshots store only changes and any day can be restored from the chain.",
    "A changed or missing stored file is found from the manifest.",
    "A backup missing the orders file passes the manifest and fails the restore test.",
    "The 3-2-1 rule and the retention policy give the numbers in the demo.",
    "A store that only adds versions restores the files from before an attack.",
    "A wrong key does not open the archive.",
    "The demo prints the same output on every run.",
]

