[[act]]
title = "Ransomware, and the copy it cannot change"
summary = "Ransomware encrypts the shop's 3 files and the mounted backup's 3; the versioned store keeps the version from before the attack and gives every file back; read-only files block it only until the same user runs chmod u+w."
detail = """
The input: four copies of the shop's three files. The shop server and a mounted backup folder, both writable. A versioned store that can only add versions, holding the files at time 100. And a read-only folder, with permissions r--------. At time 200 the ransomware encrypts every file it can write.
The result: the shop server's 3 files are encrypted, and the orders file no longer reads as before. The mounted backup is encrypted too: the backup went with the data. The versioned store took the attacker's writes as a new version, so it has 2 versions of orders.csv, at 100 and 200. The read-only folder: 0 encrypted, 3 blocked.
The recovery: the versioned store's version from before 200 gives every original file back. But the same user can run chmod u+w on the read-only folder, and then all 3 are encrypted. Real protection comes from a copy the shop's own account cannot change.
"""
figure = "ransomware"
figure_title = "Four copies, one attack"
figure_speech = """
Fourth demo: ransomware. [[slnc 400]] On the left, four copies of the shop's files, before the attack. [[slnc 600]]
The shop server, and a backup folder that is mounted and writable. [[slnc 300]] A versioned store, that can only add new versions. [[slnc 300]] And a folder of read only files. [[slnc 600]]
At time two hundred, the ransomware encrypts every file it can write. [[slnc 300]] On the right, what is left. [[slnc 600]]
The shop server: encrypted. [[slnc 300]] The mounted backup: encrypted too. [[slnc 300]] The backup went with the data. [[slnc 600]]
The versioned store took the attacker's write as a second version. [[slnc 300]] The first one, from time one hundred, is still there, and gives every file back. [[slnc 600]]
