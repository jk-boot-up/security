    "describe an access grant that expires by itself",
]
walkthrough = """
Start with the hotel and the master key. Run the demo one act at a time. After act one, ask which endpoints in a real application have no rule. After act two, ask what could go wrong with a post-authorized method that sends an email.
In act four, ask the group which account in their own system is the dave of the story.
"""
exercises = [
    "Add a refunds:cancel action, a rule for it, and a test that fails if the rule is missing.",
    "Change the last rule to `authenticated()` and find the paths that become open to everyone with a login.",
    "Add an account for the warehouse export and print its blast radius.",
    "Store grants in a database table and keep the same custom authorization manager.",
]

[docs.explained]
sentence = """
Least privilege means every account holds only the actions its job needs, and Spring Security can enforce it by denying every path without a rule, guarding methods by authority, keeping separation of duties in one rule that no role can switch off, and letting grants expire by themselves.
"""
verdict = """
End every rule chain with deny. Give accounts exact authorities and use roles only to name jobs. Put separation of duties in code that roles cannot bypass. Give service accounts their own, smaller authorities, and measure what a stolen token reaches. Prefer grants that expire.
"""
recognise = [
    "`@PreAuthorize` and `@EnableMethodSecurity` in Spring applications.",
    "`anyRequest().authenticated()` at the end of a configuration, which should usually be `denyAll()`.",
    "Service accounts named `admin` or `root`.",
    "Temporary access in cloud consoles that expires.",
]

[spec]
purpose = """
Teach least privilege with Spring Security by starting a real Spring Boot store and checking deny-by-default rules, method security, separation of duties, a role hierarchy with a measured blast radius, and time-limited grants.
"""
nongoals = [
    "Authentication methods, tokens and single sign-on.",
    "Persistence of accounts and grants.",
    "Kubernetes and cloud access policies.",
]
problem = """
Teams know the principle and still give the export job admin rights, because the framework lets them.
"""
roles = [["Accounts and actions", "`Catalogue`"], ["The security configuration", "`Shop`"], ["Refund methods", "`Refunds`, `RefundRules`"], ["Expiring grants", "`Grants`, `GrantAuthorization`, `SimulatedClock`"], ["Blast radius", "`BlastRadius`"], ["Entry point", "`LeastPrivilegeSpringDemo`"]]
requirements = [
    "A path with no rule is denied, even for an admin.",
    "A refund can be created and approved only with the right authority, and never approved by its requester.",
    "A role hierarchy lets an admin act as support and does not let finance do so.",
    "The blast radius of each account is computed by Spring Security's own authorization manager.",
    "A grant works only inside its window, for its person and its permission.",
