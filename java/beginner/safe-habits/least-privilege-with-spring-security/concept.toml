# concept.toml: everything about this project that is not Java code.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "least-privilege-with-spring-security"
module = "safe-habits"
title = "Least Privilege with Spring Security"
short_title = "Least Privilege with Spring Security"
package = "leastprivilegespring"
main_class = "LeastPrivilegeSpringDemo"
tagline = "Give each account exactly what the job needs"
bold = "Spring Security can make least privilege the default: deny every path that has no rule, give accounts exact permissions instead of an admin role, keep separation of duties in one rule that no role can switch off, and let access expire by itself."
domain = "an online store"
domain_note = ""
youtube_description = """Least privilege with Spring Security, in Java: the easy way to build a feature is to give it admin power. Explained with an online store, like a hotel that hands every employee the master key. We start a real Spring Boot server, see that a path with no rule is denied even for an admin, guard refunds with method security and see what PostAuthorize really does, enforce two people for a refund with a rule that no role can switch off, compare a stolen admin token with a stolen scoped service token using Spring Security's own authorization manager, and give a month-end grant that expires by itself on an injected clock."""
thumb_lines = ["LEAST PRIVILEGE", "SPRING SECURITY"]
thumb_code = "anyRequest().denyAll()"
youtube_title = "Least Privilege with Spring Security (Deny by Default, @PreAuthorize, Grants)"
youtube_tags = ["least privilege", "spring security", "preauthorize", "separation of duties", "role hierarchy", "authorization", "spring boot", "java", "cybersecurity for beginners"]

[readme]
technologies = [
    ["Spring Boot", "4.1.1", "the latest stable release; its dependency list pins the Spring and Tomcat versions below, and it starts the real web server"],
    ["Spring Framework (Spring MVC)", "7.0.9", "maps web addresses to Java methods; pinned by Spring Boot 4.1.1"],
    ["Spring Security", "7.1.1", "authorization rules for requests and methods, a role hierarchy and custom authorization managers; pinned by Spring Boot 4.1.1"],
    ["Apache Tomcat (embedded)", "11.0.24", "the web server inside the application; pinned by Spring Boot 4.1.1"],
]
intro = """
The plain version of this lesson modelled **least privilege** by hand: every account gets only the permissions its job needs, so that a stolen credential, a mistake or a bad day can do only so much harm. **Spring Security** is the framework most Java
stores use for this, and it has a place for each idea. A request rule can say **deny anything not listed**. A **method security** annotation, `@PreAuthorize`, puts the rule next to the code it guards. A **role hierarchy** says that an admin includes the other jobs.
A custom **AuthorizationManager** can hold any rule at all, such as a grant that expires. This project starts a real Spring Boot server and checks each of them with real requests.

The demo ends with the number that matters: what a stolen token can reach, for an admin account and for a scoped service account.
"""
analogy = """
Think of a hotel. The easy way to run it is to give every employee the master key. Least privilege gives the cleaner the keys for the rooms on their floor, the night porter the front door, and the manager a key that cannot open the safe without a second person.
A key that stops working at checkout time is better than one that someone has to remember to take back.
"""
scenario = """
An online store has support staff, warehouse staff, finance staff, an admin and a nightly export job. The demo starts the store with Spring Boot and asks, with real requests, who may do what: reading orders, creating and approving refunds, and writing a payment.
"""
costs = [
    "**More accounts and more rules.** Scoped accounts need to be created, named and reviewed. Spring Security makes the rules short, and someone still has to decide them.",
    "**Rules in annotations are easy to forget.** A method with no annotation is open to anyone who can call it, so the request rules end with `denyAll` and tests call each endpoint as each account.",
    "**`@PostAuthorize` runs the method first.** It withholds the answer, it does not stop the work, so a method with side effects needs `@PreAuthorize`.",
    "**A role hierarchy can hide how much power a role has.** Keep it small and print what each role reaches, as the demo does.",
    "**Time-limited grants need a clock you can trust.** The demo injects a clock so tests control time; in production the clock and the grant store are things an attacker would like to change.",
]
too_much = """
For a small internal tool with three users, a couple of roles and a deny-by-default chain is plenty. The full set, scoped authorities, separation of duties and expiring grants, belongs where money moves or personal data lives, and anywhere one stolen credential would be a headline.
"""
met_before = [
    "`@PreAuthorize(\"hasRole('ADMIN')\")` on controller methods in most Spring tutorials.",
    "`anyRequest().authenticated()` at the end of a security configuration, which is one step weaker than `denyAll`.",
    "Cloud IAM policies with \"allow only these actions\" and temporary credentials.",
    "Approval workflows where the person who asked cannot approve.",
]
where = """
This project follows [least-privilege](../least-privilege) and is the second in [safe-habits](..). It reuses the ideas of [authentication-vs-authorization-with-spring-security](../../identity/authentication-vs-authorization-with-spring-security).
"""
twin = """
The store runs on a free port on the loopback interface, and the demo prints only status codes and facts that do not depend on the port. Passwords are one demo value, hashed with Spring Security's default encoder at start-up. Time is a simulated clock.
The blast radius is computed by asking Spring Security's authorization manager about every action, not by a separate list.
"""
test_note = "The store runs on a free loopback port and the demo prints only status codes and facts that do not depend on the port. Time is a simulated clock, the password hashes use random salts but are never printed, so the golden output is the same on every run."

[[act]]
title = "Deny by default: every path needs a rule"
summary = "No credentials gets 401, alice gets 200 for orders and 403 for reports, and an admin asking for a path nobody wrote a rule for also gets 403."
detail = """
With no credentials, a request for orders gets 401: who are you? Alice, from support, with a wrong password also gets 401. With the right one she gets orders, and 403 for reports, because she is known but not allowed. Dave, an admin, asks for a path nobody wrote a rule for, and gets 403 too.
The last rule is `anyRequest().denyAll()`, so a forgotten endpoint stays closed.
"""
speech = """
First demo: deny by default. [[slnc 400]] With no credentials, the answer is four oh one. Who are you? [[slnc 600]]
Alice, from support, can read orders. [[slnc 300]] She cannot read reports. That is four oh three. Known, but not allowed. [[slnc 600]]
An admin asks for a path that nobody wrote a rule for. [[slnc 300]] The answer is four oh three. No rule means no, even for an admin. [[slnc 600]]
The last rule is deny all, so a forgotten endpoint stays closed.
"""
rows = { rules = "active ok" }
console = [
    ["no credentials, GET /orders: 401  <- WHO ARE YOU?", "muted"],
    ["alice (support) GET /orders: 200", "ok"],
    ["alice (support) GET /reports: 403  <- KNOWN, BUT NOT ALLOWED", "amber"],
    ["dave (admin) GET /admin/debug, a path nobody wrote a rule for: 403  <- NO RULE MEANS NO, EVEN FOR AN ADMIN", "ok"],
    ["the last rule is anyRequest().denyAll(), so a forgotten endpoint stays closed", "muted"],
]

[[act]]
title = "Method security: the rule sits next to the code"
summary = "Bob cannot create a refund, alice can; bob cannot read alice's refund, but the method ran before the answer was withheld, which is what PostAuthorize does."
detail = """
Bob, from the warehouse, tries to create a refund and gets 403: he has no refunds:create. Alice creates refund R-1. She can read her own, and carol, an approver, can read any. Bob cannot read someone else's request. But the method ran for bob before the answer was withheld,
because `@PostAuthorize` judges the result. `@PreAuthorize` stops a call before it runs, so a method with side effects needs that one.
"""
speech = """
Second demo: method security. [[slnc 400]] The rule sits next to the code it guards. [[slnc 600]]
Bob, from the warehouse, cannot create a refund. [[slnc 300]] Alice can. [[slnc 600]]
Alice can read her own refund. [[slnc 300]] Carol, who approves refunds, can read any. [[slnc 300]] Bob cannot. [[slnc 600]]
But here is the catch. [[slnc 300]] For bob, the method ran first, and the answer was withheld afterwards. [[slnc 300]] That is what post authorize does. [[slnc 600]]
Pre authorize stops a call before it runs. [[slnc 300]] So a method with side effects needs pre authorize.
"""
rows = { methods = "active ok" }
console = [
    ["bob (warehouse) POST /refunds: 403  <- NO refunds:create", "ok"],
    ["alice (support) POST /refunds: 200, the new refund is R-1", "muted"],
    ["alice GET /refunds/R-1: 200, her own request", "ok"],
    ["carol (finance) GET /refunds/R-1: 200, an approver may read any", "ok"],
    ["bob GET /refunds/R-1: 403, someone else's request", "ok"],
    ["the method ran for bob before the answer was withheld: true  <- @PostAuthorize JUDGES THE RESULT, SO KEEP SIDE EFFECTS OUT OF SUCH METHODS", "amber"],
]

[[act]]
title = "Separation of duties: two people for a refund"
summary = "Alice cannot approve her own refund, dave the admin cannot approve his own, carol approves alice's, and dave may approve alice's other request."
detail = """
Alice cannot approve her own refund: she has no refunds:approve. Dave, an admin, creates refund R-2 and tries to approve it himself, and is refused: admin power does not remove the rule. Carol approves R-1. Alice creates R-3 and Dave approves it, because an admin may approve someone
else's request. The rule is a bean that the annotation calls, in one place, and no role can switch it off.
"""
speech = """
Third demo: separation of duties. [[slnc 400]] Two people are needed for a refund. [[slnc 600]]
Alice cannot approve her own. [[slnc 600]]
Dave, the admin, creates a refund, and tries to approve it himself. [[slnc 300]] Refused. [[slnc 300]] Admin power does not remove the rule. [[slnc 600]]
Carol approves alice's refund. [[slnc 300]] And dave may approve another request that alice made. [[slnc 600]]
The rule is in one place, and no role can switch it off.
"""
rows = { duties = "active ok" }
console = [
    ["alice approves her own refund R-1: 403  <- NO refunds:approve", "ok"],
    ["dave (admin) creates refund R-2 and then approves it himself: 403  <- ADMIN POWER DOES NOT REMOVE THE RULE", "ok"],
    ["carol (finance) approves R-1: approved by carol", "ok"],
    ["alice creates R-3 and dave approves it: approved by dave  <- AN ADMIN MAY APPROVE SOMEONE ELSE'S REQUEST", "muted"],
    ["the rule is in one place, a bean that the annotation calls, and no role can switch it off", "muted"],
]

[[act]]
title = "A role hierarchy, and what a stolen credential can reach"
summary = "An admin includes support, finance does not; a stolen admin token reaches 15 of 15 actions, a stolen exporter token reaches 2 of 15."
detail = """
With a role hierarchy, an admin includes support, so the staff queue lets alice and dave in and keeps carol from finance and the exporter out. Then the number that matters. The nightly order export ran as dave because that was quick: a stolen token reaches 15 of 15 actions.
The same job as the exporter service account reaches 2 of 15. Alice, bob and carol reach 3 each. The numbers come from asking Spring Security's own authorization manager about each action.
"""
speech = """
Fourth demo: the role hierarchy, and the blast radius. [[slnc 400]] With a hierarchy, an admin includes support. [[slnc 300]] A finance account does not, and neither does the exporter. [[slnc 600]]
Now the number that matters. [[slnc 300]] The nightly export ran as the admin, because that was quick. [[slnc 300]] A stolen token reaches fifteen of fifteen actions. Everything. [[slnc 600]]
The same job, as a scoped service account, reaches two. [[slnc 600]]
The numbers come from asking Spring Security about each action.
"""
rows = { hierarchy = "active ok", radius = "active wrong" }
console = [
    ["the staff queue: alice 200, dave (admin includes support) 200, carol (finance) 403, exporter 403", "muted"],
    ["the nightly order export runs as dave, because that was quick: a stolen token reaches 15 of 15  <- EVERYTHING", "bad"],
    ["the same job as the exporter service account: a stolen token reaches 2 of 15", "ok"],
    ["alice reaches 3 of 15, bob 3, carol 3", "ok"],
    ["the exporter can read orders: 200, and cannot reach the secrets: 403", "ok"],
]

[[act]]
title = "Access that expires by itself"
summary = "Carol is granted payments:write for ticks 10 to 12 and gets 403 at tick 9, 200 at ticks 10 and 12, and 403 at tick 13; alice never had it."
detail = """
Carol, in finance, is granted payments:write for ticks 10 to 12, for a month-end fix. At tick 9 the answer is 403, at ticks 10 and 12 it is 200, and at tick 13 it is 403 again. Nobody had to remember to remove it. Alice, who never had a grant, gets 403 even inside the window.
The rule is a custom AuthorizationManager that asks an injected clock, so the demo and the tests control time.
"""
speech = """
Fifth demo: access that expires by itself. [[slnc 400]] Carol, in finance, is granted the right to write payments, for a short window, for a month end fix. [[slnc 600]]
Before the window, refused. [[slnc 300]] Inside it, allowed. [[slnc 300]] After it, refused again. [[slnc 600]]
Nobody had to remember to take it back. [[slnc 600]]
And alice, who never had a grant, is refused even inside the window.
"""
rows = { grants = "active ok" }
console = [
    ["carol (finance) is granted payments:write for ticks 10 to 12, for a month-end fix", "muted"],
    ["at tick 9 PUT /payments/P-1: 403", "ok"],
    ["at tick 10 PUT /payments/P-1: 200", "amber"],
    ["at tick 12 PUT /payments/P-1: 200", "amber"],
    ["at tick 13 PUT /payments/P-1: 403", "ok"],
    ["alice, who never had a grant, at tick 11: 403", "ok"],
]

