[poster]
headline = [["LEAST PRIVILEGE", "text"], ["SPRING SECURITY", "accent"]]
taglines = [["Give each account exactly what the job needs", "gold"]]
before = { code = "role = ADMIN", note = "a stolen token reaches 15 of 15", tag = "BEFORE" }
after = { code = "orders:read, reports:read", note = "a stolen token reaches 2 of 15", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "Least Privilege with Spring Security"
narration = """Hello, and welcome. [[slnc 400]] This video explains least privilege with Spring Security, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] Least privilege means every account holds only the actions its job needs. [[slnc 300]] So a stolen password, a mistake, or a bad day can do only so much harm. [[slnc 600]] Think of a hotel. [[slnc 300]] The easy way is to give every employee the master key. [[slnc 300]] Least privilege gives the cleaner the keys for the rooms on their floor. [[slnc 300]] And a key that stops working at checkout is better than one that someone must remember to take back. [[slnc 700]] In this video, the domain is an online store. [[slnc 500]] By the end, you will hear how a rule chain ends with deny. [[slnc 300]] Where to put a rule in a method. [[slnc 300]] How to keep two people for a refund. [[slnc 300]] And how much a stolen token can reach."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online store has:", "support, warehouse and finance staff,", "an admin, and a nightly export job.", "", "There are fifteen actions.", "Each job needs a few of them.", "None needs all."]
narration = """Here is the scenario. [[slnc 400]] An online store has support staff, warehouse staff, finance staff, an admin, and a nightly export job. [[slnc 500]] There are fifteen things that can be done in the store. [[slnc 300]] Each job needs a few of them. [[slnc 300]] None of them needs all fifteen."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["Authority: one exact action, like orders:read", "Role: the name of a job", "Role hierarchy: admin includes other jobs", "Blast radius: what a stolen token reaches", "Separation of duties: two people for one risk"]
narration = """Before the demos, the words. [[slnc 500]] An authority is one exact action, like orders colon read. [[slnc 500]] A role is the name of a job. [[slnc 500]] A role hierarchy says that an admin includes other jobs. [[slnc 500]] The blast radius is what a stolen token can reach. [[slnc 500]] And separation of duties means that two people are needed for one risky thing."""

[[scene]]
key = "03-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "04-request-path"
kind = "figure"
title = "Where Spring Security says no"
body = "request_path"
narration = """Let's see the whole idea on one picture. [[slnc 400]] A request to the store passes three gates before any of our code runs. [[slnc 600]] Gate one, in amber: who are you? [[slnc 300]] A request with no credentials stops here, with four oh one. [[slnc 600]] Gate two: is there a rule for this path, and does it allow you? [[slnc 300]] Alice is signed in, but she has no permission to read reports. [[slnc 300]] Four oh three. [[slnc 600]] Gate three: a rule written on the Java method itself. [[slnc 300]] Bob, from the warehouse, tries to create a refund, and has no permission to. [[slnc 300]] Four oh three, and the method never runs. [[slnc 600]] Only a request that passes every gate reaches the code, like Alice reading the orders. [[slnc 300]] Two hundred. [[slnc 500]] So four oh one means not signed in. [[slnc 300]] And four oh three means signed in, but not allowed."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "09-ladder"
kind = "bullets"
title = "From Open to Least Privilege"
body = ["authenticated() last: any login gets in", "denyAll() last: only listed paths", "Roles only: coarse", "Exact authorities: small", "Expiring grants: smallest in time"]
narration = """Let's put the steps side by side. [[slnc 400]] If the last rule says authenticated, any login can reach anything not listed. [[slnc 500]] If the last rule says deny all, only listed paths are open. [[slnc 500]] Roles alone are coarse. [[slnc 500]] Exact authorities are small. [[slnc 500]] And grants that expire are smallest in time."""

[[scene]]
key = "11-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["@PreAuthorize in controllers", "authenticated() at the end of a chain", "Cloud policies: allow only these actions", "Approval workflows"]
narration = """You have probably met this already. [[slnc 400]] Pre authorize annotations on controller methods are in most Spring tutorials. [[slnc 500]] A security configuration that ends with authenticated is one step weaker than deny all. [[slnc 500]] Cloud policies that allow only these actions are the same idea. [[slnc 500]] And approval workflows, where the person who asked cannot approve, are separation of duties."""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["End every chain with deny", "Exact authorities; roles name jobs", "Separation of duties in code, not roles", "Measure what a stolen token reaches", "Prefer grants that expire"]
narration = """So, how do you use it? [[slnc 400]] End every rule chain with deny. [[slnc 500]] Give exact authorities, and use roles only to name jobs. [[slnc 500]] Put separation of duties in code that roles cannot bypass. [[slnc 500]] Measure what a stolen token reaches. [[slnc 500]] And prefer grants that expire."""

[[scene]]
key = "12-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "13-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Change the last rule to", "authenticated() and see what opens."]
narration = """That's least privilege with Spring Security. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Give each account exactly what the job needs, and end every rule chain with deny. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine, with nothing installed except a Java development kit. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Change the last rule to authenticated, and see which paths open to everyone with a login. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
The authorization rules of an online store built with Spring Security: the request chain, method security on refunds, a role hierarchy, scoped service accounts and time-limited grants. It covers a stolen token, an insider who wants to approve their own refund, and a forgotten endpoint.
It does not cover how accounts log in, how tokens are issued, or the database underneath.
"""
assets = [
    "The fifteen actions of the store, and the money and customer data behind them.",
    "The authorities held by each account.",
    "The refund approval rule.",
    "The grant store and the clock.",
]
actors = [
    "Support, warehouse and finance staff, an admin and a nightly export job.",
    "A thief with a stolen token.",
    "An insider who wants to approve their own refund.",
]
boundaries = [
    "Request to the rule chain: every path crosses it and the last rule decides the unlisted ones.",
    "Account to its authorities: what a token carries is what an attacker can use.",
]
assumptions = [
    "Authentication works: a token belongs to the person it names, until it is stolen.",
    "The grant store and the clock cannot be changed by an attacker.",
    "In the demo, the password is one demo value and the accounts live in memory.",
]
out_of_scope = [
    "Login methods, tokens and single sign-on.",
    "Persistence of accounts and grants.",
    "Network and operating-system access.",
]
tests = [
    "`AccessRulesTest` checks 401 and 403 answers, unlisted paths for an admin, the role hierarchy, the blast radius, the refund rule for admins and approvers, missing refunds, create without the permission, and the grant window.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next project in the module, patching-and-dependency-hygiene, looks at keeping the software itself up to date, which limits what any attacker can do with a known flaw.
"""

[[threat]]
id = "T1"
stride = "E"
threat = "A new endpoint is added and nobody writes a rule for it"
where = "`Shop.chain`"
control = "The last rule is deny, so an unlisted path is closed, even for an admin"
residual = "A rule that is written too wide still opens too much, so each endpoint is tested as each account"

[[threat]]
id = "T2"
stride = "E"
threat = "A stolen token of an over-privileged account reaches everything"
where = "`Catalogue`, `BlastRadius`"
control = "Service accounts hold exact authorities, and the reach of each account is measured"
residual = "A scoped token still reaches its own actions, so it is rotated and monitored"

[[threat]]
id = "T3"
stride = "R"
threat = "A person approves their own refund"
where = "`Refunds.approve`, `RefundRules`"
control = "A rule in one bean, called by the annotation, that no role can switch off"
residual = "Two colluding people can still do it, so refunds are also audited"

[[threat]]
id = "T4"
stride = "I"
threat = "A post-authorized method does its work and leaks through a side effect"
where = "`Refunds.view`"
control = "`@PostAuthorize` withholds the result only, so methods with side effects use `@PreAuthorize`"
residual = "Developers must know the difference, so the demo and a test show it"

[[threat]]
id = "T5"
stride = "E"
threat = "A time-limited grant is extended or never expires"
where = "`Grants`, `GrantAuthorization`"
control = "The window is checked on every request against an injected clock"
residual = "Whoever can write the grant store or change the clock can grant anything, so both are protected and audited"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] Spring Security does the checking. [[slnc 300]] Our classes only say what the rules are. [[slnc 300]] Here is what each one does."""

[[class]]
name = "Shop"
what = "the accounts, the role hierarchy and the rule chain"
[[class.part]]
title = "the rule chain ends with denyAll"
code = """
.authorizeHttpRequests(a -> a
        .requestMatchers(HttpMethod.GET, "/orders").hasAuthority("orders:read")
...
        .requestMatchers("/refunds", "/refunds/**").authenticated()
        .anyRequest().denyAll());
"""
speech = """The shop class builds the security filter chain. [[slnc 300]] Each line matches a method and a path, and says what it needs. [[slnc 300]] The refunds only need a login here, because their methods carry the real rules. [[slnc 300]] And the last line denies anything that is not listed."""
[[class.part]]
title = "admin includes the other jobs"
code = """
return RoleHierarchyImpl.withDefaultRolePrefix()
        .role("ADMIN").implies("FINANCE")
        .role("ADMIN").implies("SUPPORT")
        .role("ADMIN").implies("WAREHOUSE")
        .build();
"""
speech = """The role hierarchy says that an admin implies finance, support, and warehouse. [[slnc 300]] That is why Dave could open the staff queue, which needs the role support."""

[[class]]
name = "Refunds"
what = "the refund methods, each guarded by an annotation"
[[class.part]]
title = "before, or after, the method runs"
code = """
@PreAuthorize("hasAuthority('refunds:create')")
public Refund create() {
...
@PostAuthorize("returnObject.requester() == authentication.name or hasAuthority('refunds:approve')")
public Refund view(String id) {
"""
speech = """Each method carries its own rule. [[slnc 300]] Create needs refunds create, checked before it runs. [[slnc 300]] View runs first, and then post authorize looks at the refund it returned: the requester, or an approver."""
[[class.part]]
title = "two halves for approve"
code = """
@PreAuthorize("hasAuthority('refunds:approve') and @refundRules.differentPerson(#id, authentication)")
public Refund approve(String id) {
"""
speech = """Approve needs both halves. [[slnc 300]] The permission to approve. [[slnc 300]] And the refund rules bean, called by name, must say this is a different person."""

[[class]]
name = "RefundRules"
what = "separation of duties, as a bean the annotation calls"
[[class.part]]
title = "not the person who asked"
code = """
public boolean differentPerson(String id, Authentication authentication) {
    String requester = refunds.requesterOf(id);
    return requester != null && !requester.equals(authentication.getName());
"""
speech = """Refund rules answers one question. [[slnc 300]] Is the person approving different from the person who asked? [[slnc 300]] No role appears here, so no role can switch it off."""

[[class]]
name = "GrantAuthorization"
what = "a custom rule: the permission, or a grant that is active now"
[[class.part]]
title = "held, or granted right now"
code = """
boolean held = who.getAuthorities().stream()
        .map(GrantedAuthority::getAuthority)
        .anyMatch(permission::equals);
return new AuthorizationDecision(held || grants.active(who.getName(), permission));
"""
speech = """Grant authorization is our own authorization manager. [[slnc 300]] It allows the request if the caller holds the permission, or has a grant that is active at this moment. [[slnc 300]] Grants asks the injected clock what time it is."""

[[class]]
name = "BlastRadius"
what = "counts what a stolen token reaches"
[[class.part]]
title = "ask Spring Security about every action"
code = """
for (String permission : Catalogue.PERMISSIONS) {
    var rule = AuthorityAuthorizationManager.hasAuthority(permission);
    if (rule.authorize(() -> token, null).isGranted()) {
        count++;
"""
speech = """Blast radius builds the token an account would carry. [[slnc 300]] Then it asks Spring Security, for each of the fifteen actions, whether that token is allowed. [[slnc 300]] The count is the blast radius."""

[[acronym]]
short = "HTTP"
long = "HyperText Transfer Protocol: how browsers and servers talk"
say = "H T T P is HyperText Transfer Protocol: the way a browser or a program talks to the store."
[[acronym]]
short = "GET, POST, PUT"
long = "HTTP methods: read, create, replace"
say = "GET, POST and PUT are H T T P methods. GET reads, POST creates, and PUT replaces something, such as a payment."
[[acronym]]
short = "200, 401, 403"
long = "HTTP status codes: OK, who are you?, not allowed"
say = "Two hundred means O K. Four oh one means the server does not know who you are. Four oh three means it knows, and says no."
[[acronym]]
short = "R-1, R-2, R-3, P-1"
long = "refunds 1, 2 and 3, and payment 1, in the demo"
say = "R one, R two and R three are the numbers of the refunds in the store. P one is payment one."
[[acronym]]
short = "@Pre, @PostAuthorize"
long = "annotations: check before, or after, the method runs"
say = "Pre authorize and post authorize are Java annotations: labels on a method. Pre checks before the method runs. Post checks after it has run."
[[acronym]]
short = "*"
long = "star, a wildcard: /payments/** means every path below"
say = "And a star is a wildcard. Slash payments, star star, means every path under payments."
