[[act]]
title = "Access that expires by itself"
summary = "Carol is granted payments:write from tick 10 to tick 12; PUT /payments/P-1 answers 403 at tick 9, 200 at ticks 10 and 12, 403 at tick 13, and 403 for Alice, who never had a grant."
detail = """
Carol in finance gets payments:write for a month-end fix, from tick 10 to tick 12, both included (a tick is one step of the demo's simulated clock). The rule for PUT /payments/** is a custom AuthorizationManager, GrantAuthorization, that allows the request if the caller holds payments:write or has a grant that is active right now.
PUT /payments/P-1 answers 403 at tick 9, 200 at ticks 10 and 12, and 403 at tick 13. Alice, who never had a grant, gets 403 at tick 11. The clock is injected, so the demo and the tests control time.
"""
figure = "timeline"
figure_title = "A grant that ends by itself"
figure_speech = """
Fifth demo: access that expires. [[slnc 400]] Along the line is the demo's clock. [[slnc 300]] Each step is called a tick. [[slnc 600]]
At the top, in blue, the grant. [[slnc 300]] Carol, in finance, may write payments for a month end fix. [[slnc 300]] From tick ten, to tick twelve, both included. [[slnc 300]] The green bar shows when she holds it. [[slnc 600]]
Below, in amber, five requests to change payment P one, and their responses. [[slnc 400]] At tick nine, before the grant: four oh three. [[slnc 300]] At tick ten: two hundred. [[slnc 300]] At tick twelve: still two hundred. [[slnc 300]] At tick thirteen: four oh three again. [[slnc 400]] And Alice, at tick eleven, in the middle of the grant: four oh three. [[slnc 300]] The grant was for Carol only. [[slnc 600]]
Nobody had to remember to take it back.
"""
speech = """
The output shows the grant, then the requests with their responses, one per line: the tick, who asks, the status, and why. [[slnc 500]] The rule is a custom authorization manager that asks an injected clock, so the tests can control time.
"""
rows = { grants = "active ok" }
