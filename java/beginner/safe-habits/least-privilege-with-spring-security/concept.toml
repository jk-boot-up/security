[[act]]
title = "Method security: the rule sits next to the code"
summary = "Bob gets 403 creating a refund, so create() never runs; Alice creates R-1; Alice and Carol may read it, Bob may not, but view() ran for Bob before his 403, because @PostAuthorize judges the result."
detail = """
Two rules sit on the methods of the Refunds class. create() has @PreAuthorize, which checks before the method runs: it needs refunds:create. view() has @PostAuthorize, which runs the method first and then checks the result: the caller must be the requester, or hold refunds:approve.
Bob in the warehouse gets 403 when he creates a refund, and create() never runs. Alice creates R-1. Alice may read her own request, and Carol may read any as an approver. Bob gets 403 on R-1, but the method had already run for him. So a method with side effects needs @PreAuthorize.
"""
figure = "pre_post"
figure_title = "Before the method, or after it"
figure_speech = """
Second demo: rules on the methods. [[slnc 400]] There are two kinds, and they work at different times. [[slnc 600]]
At the top, in red, pre authorize. [[slnc 300]] It sits on the create method, and needs refunds create. [[slnc 400]] Bob, from the warehouse, tries to create a refund. [[slnc 300]] The rule is checked first. [[slnc 300]] He does not have it, so the call stops. [[slnc 300]] Create never runs, and the response is four oh three. [[slnc 700]]
Below, in amber, post authorize. [[slnc 300]] It sits on the view method. [[slnc 300]] Only the person who asked, or an approver, may see a refund. [[slnc 400]] Bob asks for Alice's refund. [[slnc 300]] This time the method runs first. [[slnc 300]] Then the rule looks at the result, and withholds it. [[slnc 300]] Four oh three. [[slnc 600]]
Bob saw nothing. [[slnc 300]] But the method did run. [[slnc 300]] So never put a side effect, such as sending an email or changing data, in a method guarded by post authorize.
"""
speech = """
The output prints the two rules first. [[slnc 400]] Then five requests: Bob creates, Alice creates, and three people try to read refund R one.
[[page]]
Then the five responses. [[slnc 300]] Four oh three for Bob, so create never ran. [[slnc 300]] Two hundred for Alice, and the new refund is R one. [[slnc 300]] Two hundred for Alice and for Carol. [[slnc 300]] Four oh three for Bob. [[slnc 500]] And the last line answers the question: did the view method run for Bob before his four oh three? [[slnc 300]] True.
"""
rows = { methods = "active ok" }
console = [
    ["THE RULES ON THE METHODS (in Refunds):", "code"],
    ["  create()  @PreAuthorize   needs refunds:create", "muted"],
    ["  view()    @PostAuthorize  requester, or refunds:approve", "muted"],
    ["THE REQUESTS:", "code"],
    ["  1  bob (warehouse)  POST /refunds", "muted"],
    ["  2  alice (support)  POST /refunds", "muted"],
    ["  3  alice            GET /refunds/R-1", "muted"],
    ["  4  carol (finance)  GET /refunds/R-1", "muted"],
    ["  5  bob              GET /refunds/R-1", "muted"],
    ["---", ""],
    ["THE RESPONSES:", "code"],
    ["  1  403  no refunds:create, so create() never ran", "bad"],
    ["  2  200  the new refund is R-1", "ok"],
    ["  3  200  her own request", "ok"],
    ["  4  200  an approver may read any", "ok"],
    ["  5  403  someone else's request", "bad"],
    ["did view() run for bob before his 403? true", "muted"],
    ["<- @PostAuthorize RUNS FIRST: NO SIDE EFFECTS", "amber"],
]

[[act]]
title = "Separation of duties: two people for a refund"
summary = "Approving needs refunds:approve and a different person: Alice gets 403 on her own R-1, Dave the admin gets 403 on his own R-2, Carol approves R-1 and Dave approves R-3, which Alice created."
detail = """
The rule on approve() has two halves: hasAuthority('refunds:approve'), and @refundRules.differentPerson(#id, authentication), a small bean that checks that the approver is not the person who asked.
Alice approving her own R-1 gets 403, as she has no refunds:approve. Dave, an admin, creates R-2 and approving it himself gets 403: he holds every permission, but he is the same person. Carol approves R-1, and Dave approves R-3, which Alice created. No role can switch the rule off.
"""
figure = "refund_steps"
figure_title = "Two people for a refund: the requests and the responses"
figure_speech = """
Third demo: separation of duties. [[slnc 400]] At the top, the rule on the approve method. [[slnc 300]] It has two halves. [[slnc 300]] You need the permission to approve. [[slnc 300]] And a small bean, refund rules, checks that you are a different person from the one who asked. [[slnc 600]]
On the left, four requests. [[slnc 300]] On the right, the responses. [[slnc 500]]
One. Alice approves her own refund. [[slnc 300]] Four oh three: she cannot approve at all. [[slnc 400]]
Two. Dave, the admin, creates refund R two, and approves it himself. [[slnc 300]] He has every permission. [[slnc 300]] Still four oh three: same person. [[slnc 400]]
Three. Carol, in finance, approves Alice's refund. [[slnc 300]] Two hundred. [[slnc 400]]
Four. Dave approves refund R three, which Alice created. [[slnc 300]] Two hundred: it is someone else's request. [[slnc 600]]
The rule lives in one place, and no role can switch it off.
"""
speech = """
Here is the output. [[slnc 400]] The rule, in its two halves. [[slnc 300]] Then the four requests, and the four responses. [[slnc 500]] Four oh three. [[slnc 200]] Four oh three. [[slnc 200]] Approved by Carol. [[slnc 200]] Approved by Dave. [[slnc 500]] The only refunds approved are the ones where two different people were involved.
"""
