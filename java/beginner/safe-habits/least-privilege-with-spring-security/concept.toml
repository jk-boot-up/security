    ["  4  dave (admin)     approves R-3, which alice created", "muted"],
    ["THE RESPONSES:", "code"],
    ["  1  403  no refunds:approve", "bad"],
    ["  2  403  same person  <- ADMIN POWER DOES NOT HELP", "bad"],
    ["  3  200  approved by carol", "ok"],
    ["  4  200  approved by dave: someone else's request", "ok"],
    ["the rule is one bean the annotation calls: no role turns it off", "muted"],
]

[[act]]
title = "A role hierarchy, and what a stolen credential can reach"
summary = "ADMIN includes SUPPORT, so Dave reaches the staff queue and Carol and the exporter do not; a stolen token for the export running as Dave reaches 15 of 15, the exporter service account 2 of 15."
detail = """
A role hierarchy says that ADMIN includes SUPPORT, FINANCE and WAREHOUSE, so a rule that needs the role SUPPORT also lets an admin in. GET /staff/queue answers 200 to Alice (SUPPORT) and Dave (ADMIN), and 403 to Carol (FINANCE) and the exporter.
The nightly order export once ran as Dave, because that was quick: a stolen token reaches 15 of 15 actions. As the exporter service account, which holds only orders:read and reports:read, it reaches 2 of 15: it can read the orders, 200, and not the secrets, 403. Each count comes from asking Spring Security's own authorization manager about every action.
"""
figure = "blast"
figure_title = "The role hierarchy, and one stolen token"
figure_speech = """
Fourth demo: a role hierarchy, and the blast radius. [[slnc 400]] At the top, the hierarchy. [[slnc 300]] Admin includes support, finance, and warehouse. [[slnc 500]] The staff queue needs the role support. [[slnc 300]] Alice, in support: two hundred. [[slnc 300]] Dave, the admin: two hundred, because admin includes support. [[slnc 300]] Carol and the exporter: four oh three. [[slnc 700]]
Below, the blast radius: everything one stolen token can reach. [[slnc 300]] Each square is one of the store's fifteen actions. [[slnc 500]] Before the fix, in red, the nightly export runs as Dave, because that was quick. [[slnc 300]] All fifteen squares are filled. [[slnc 500]] After the fix, in green, it runs as its own service account. [[slnc 300]] It holds orders read, and reports read. [[slnc 300]] Two of fifteen. [[slnc 300]] It can read the orders, and it cannot reach the secrets. [[slnc 600]]
The job works the same. [[slnc 300]] Only the damage from a stolen token has changed.
"""
speech = """
The output prints the hierarchy, and the four answers from the staff queue. [[slnc 500]] Then before the fix: fifteen of fifteen. [[slnc 300]] After the fix: what the account holds, two of fifteen, and two real requests to prove it. [[slnc 500]] The others reach three each. [[slnc 300]] Each count asks Spring Security itself.
"""
rows = { hierarchy = "active ok", radius = "active wrong" }
console = [
    ["THE HIERARCHY: ADMIN includes SUPPORT, FINANCE and WAREHOUSE", "code"],
    ["GET /staff/queue NEEDS THE ROLE SUPPORT:", "code"],
