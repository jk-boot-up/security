[[act]]
title = "How bad, and what to fix first"
summary = "The CVSS 3.1 score of DEMO-2026-0001 is worked out step by step, 0.915, 5.873, 3.887, 9.760, rounded up to 9.8 Critical; with reachability, the order is 0001 now, 0003 in the window, 0002 with the next upgrade."
detail = """
A CVSS vector describes a flaw in eight short metrics. For DEMO-2026-0001 it is AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H: over the network, low complexity, no privileges, no user action, scope unchanged, and high loss of confidentiality, integrity and availability.
The score is worked out in five steps. ISS = 1 - (1-0.56)(1-0.56)(1-0.56) = 0.915. Impact = 6.42 x 0.915 = 5.873. Exploitability = 8.22 x 0.85 x 0.77 x 0.85 x 0.85 = 3.887. Sum = 5.873 + 3.887 = 9.760, rounded up to one decimal: 9.8, Critical. The same code reproduces six published scores.
Then reachability: the store uses json-deserialize and log-viewer, but not xml-entities. So DEMO-2026-0001 (9.8, reachable) is fixed now, DEMO-2026-0003 (6.1, reachable) inside the patch window, and DEMO-2026-0002 (7.5, not reachable) with the next upgrade. A high score nobody can reach is still a debt.
"""
figure = "cvss_steps"
figure_title = "How 9.8 is made"
figure_speech = """
Third demo: how bad is it? [[slnc 400]] At the top, in blue, the vector: eight short metrics that describe the flaw. [[slnc 400]] Attack vector, network. [[slnc 200]] Complexity, low. [[slnc 200]] Privileges, none. [[slnc 200]] User action, none. [[slnc 200]] Scope, unchanged. [[slnc 300]] And high loss of confidentiality, integrity, and availability, in red. [[slnc 600]]
Below, in amber, the score, step by step. [[slnc 400]] Step one. High means fifty six hundredths lost, for each of the three. [[slnc 300]] One minus the product of what is left gives zero point nine one five. [[slnc 400]] Step two. Times six point four two gives the impact: five point eight seven three. [[slnc 400]] Step three. How easy it is: eight point two two, times the four weights, gives three point eight eight seven. [[slnc 400]] Step four. Add the two: nine point seven six. [[slnc 400]] Step five. Round up, to one decimal place. [[slnc 300]] Nine point eight. [[slnc 300]] Critical.
"""
speech = """
Here is the output. [[slnc 400]] The vector, then the same five steps with the real numbers. [[slnc 400]] And a check: the same code reproduces six published scores.
[[page]]
Then the three findings, with their scores, and whether the store uses the feature that is broken. [[slnc 400]] And the order to fix them. [[slnc 300]] The critical one that is reachable, now. [[slnc 300]] The medium one that is reachable, inside the patch window. [[slnc 300]] The high one that nobody can reach, with the next upgrade.
"""
