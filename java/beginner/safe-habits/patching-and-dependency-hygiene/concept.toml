[[act]]
title = "Pinning, and checking what you download"
summary = "Three reviewed artifacts are pinned by SHA-256; the same file verifies, a single changed bit or an unreviewed version is refused, and a name one letter from a real one is flagged."
detail = """
A fix means downloading a new artifact, and a download can be swapped. When a person reviews an artifact, the SHA-256 of it is recorded: three are pinned. The same artifact downloaded again is verified. With one bit changed, same name and version,
it is refused as a mismatch. A version nobody has reviewed, acme-json 1.8.4, is refused until someone does. A name one letter away from a real one, acme-jsom, looks like a copy, which is how a lookalike package is published, while acme-json itself does not.
Gradle can enforce hashes for every dependency from a file called verification-metadata.xml; that is described, not run. The cost is a review of every new hash, so automate the pull requests and keep each review small.
"""
speech = """
Fifth demo: pinning. [[slnc 400]] A fix means downloading something new, and a download can be swapped. [[slnc 600]]
When a person reviews an artifact, its S H A two fifty six hash is recorded. [[slnc 600]]
The same file again is verified. [[slnc 300]] One bit changed, and it is refused. [[slnc 300]] A version nobody reviewed is refused too. [[slnc 600]]
A name one letter away from a real one is flagged as a lookalike. [[slnc 600]]
Gradle can enforce hashes for every dependency. [[slnc 300]] The cost is a review of each new hash, so keep the reviews small.
"""
