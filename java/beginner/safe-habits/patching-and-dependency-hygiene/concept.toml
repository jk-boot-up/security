[[act]]
title = "Pinning, and checking what you download"
summary = "3 artifacts are pinned by their SHA-256; the reviewed download is VERIFIED, a copy with one bit flipped is a MISMATCH and an unreviewed version is NOT_PINNED; acme-jsom is flagged as a copy of acme-json."
detail = """
Pinning means recording the SHA-256 hash of each artifact when a person reviews it: 3 are pinned. Every later download is hashed again and compared with the pin.
The reviewed acme-json@1.8.3 is VERIFIED. The same name and version with one bit flipped, the first byte 0x61 'a' becoming 0x60 '`', has a completely different hash: MISMATCH, refused. A version nobody has reviewed, acme-json@1.8.4, is NOT_PINNED, refused until someone reviews it.
A name one letter away from a real one, acme-jsom, looks like a copy (a typosquat); acme-json itself does not. Gradle can enforce pins for every dependency with gradle/verification-metadata.xml (described here, not run). The cost: each new hash needs a review, so keep updates small.
"""
figure = "pin_check"
figure_title = "One bit flipped, and the check that catches it"
figure_speech = """
Fifth demo: pinning. [[slnc 400]] When a person reviews a library, its S H A two five six hash is written down. [[slnc 300]] That is a pin. [[slnc 600]]
At the top left, in amber, one bit flipped in a download. [[slnc 300]] The first byte of the reviewed file is six one, the letter a. [[slnc 300]] In the download, the last bit is different. [[slnc 300]] Six zero, a back quote. [[slnc 300]] The same name, the same version. [[slnc 600]]
On the right, the hash of each. [[slnc 300]] One bit in, and a completely different hash out. [[slnc 600]]
Below, three downloads, and the check. [[slnc 300]] The reviewed file: verified, and used. [[slnc 300]] The one with a flipped bit: mismatch, refused. [[slnc 300]] A version nobody has reviewed: not pinned, refused until someone does. [[slnc 600]]
Only a download whose hash matches a reviewed pin is used.
"""
speech = """
The output prints the three pins, then the three downloads and the result of each check.
[[page]]
Then the flipped bit, and the two hashes, side by side. [[slnc 400]] And a check for look alike names: acme j s o m is one letter from acme j s o n, so it looks like a copy. [[slnc 400]] Gradle can enforce pins for every dependency. [[slnc 300]] The cost is a review for each new hash.
"""
rows = { pins = "active ok" }
console = [
    ["THE PINS (SHA-256, recorded when a person reviews it):", "code"],
    ["  acme-json@1.8.3  0cd5baa02e5579a67d47aa684a86f520...", "muted"],
    ["  acme-xml@3.1.5   c8d2ae9b51aab4513c9e64d08a2c183d...", "muted"],
    ["  acme-log@4.2.1   9da0405c200e5102ced8309969ec359b...", "muted"],
    ["THE DOWNLOADS, AND THE CHECK:", "code"],
    ["  acme-json@1.8.3  as reviewed    VERIFIED", "ok"],
    ["  acme-json@1.8.3  1 bit flipped  MISMATCH", "bad"],
    ["  acme-json@1.8.4  not reviewed   NOT_PINNED", "bad"],
    ["only VERIFIED is used  <- MISMATCH AND NOT_PINNED ARE REFUSED", "amber"],
    ["---", ""],
    ["ONE BIT FLIPPED (first byte 0x61 'a' becomes 0x60 '`'):", "code"],
    ["  reviewed  0cd5baa02e5579a67d47aa684a86f520...", "muted"],
    ["  download  99af96fac445c7d27af7a33cadca60e5...", "muted"],
