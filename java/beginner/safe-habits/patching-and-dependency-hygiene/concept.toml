[poster]
headline = [["PATCHING AND", "text"], ["DEPENDENCY HYGIENE", "accent"]]
taglines = [["You ship other people's code, so you ship their bugs", "gold"]]
before = { code = "upgrade when it breaks", note = "nobody knows what is inside", tag = "BEFORE" }
after = { code = "inventory + deadlines + pins", note = "known, ranked and verified", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "Patching and Dependency Hygiene"
narration = """Hello, and welcome. [[slnc 400]] This video explains patching and dependency hygiene, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] Most of a program is libraries that other people wrote. [[slnc 300]] So their bugs become your bugs. [[slnc 300]] Hygiene means knowing what you ship, finding the known problems, fixing the important ones in time, and checking what you download. [[slnc 600]] Think of a restaurant. [[slnc 300]] When a supplier announces a recall, the kitchen needs a list of every ingredient in every dish. [[slnc 300]] It fixes the dangerous dishes first. [[slnc 300]] And it checks the seal on every delivery. [[slnc 700]] In this video, the domain is an online store. [[slnc 500]] All the problems in the demo are made up. [[slnc 500]] By the end, you will hear how an inventory is read. [[slnc 300]] How a problem is scored and ranked. [[slnc 300]] How a deadline is kept. [[slnc 300]] And how a changed download is caught."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online store uses three libraries directly,", "and three more through them.", "", "A flaw is announced in one of them.", "", "Is the store affected? How badly?", "By when will it be fixed?"]
narration = """Here is the scenario. [[slnc 400]] An online store uses three libraries directly. [[slnc 300]] And three more, that came along with them. [[slnc 500]] A flaw is announced in one of them. [[slnc 600]] Is the store affected? [[slnc 300]] How badly? [[slnc 300]] And by when will it be fixed?"""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["SBOM: a list of everything a program contains", "Transitive dependency: a library of a library", "Advisory: a report of a known problem", "CVSS: a score from zero to ten", "SLA: a deadline for a fix"]
narration = """Before the demos, the words. [[slnc 500]] An S BOM, a software bill of materials, is a list of everything a program contains. [[slnc 500]] A transitive dependency is a library of a library. [[slnc 500]] An advisory is a report of a known problem. [[slnc 500]] C V S S is a score from zero to ten for how bad a flaw is. [[slnc 500]] And an S L A is a deadline for a fix."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "09-ladder"
kind = "bullets"
title = "Five Questions, In Order"
body = ["What do we ship?", "Which parts have known problems?", "Which matter most here?", "By when will they be fixed?", "Is what we download what we reviewed?"]
narration = """Let's put it in order. [[slnc 400]] First: what do we ship? [[slnc 500]] Second: which parts have known problems? [[slnc 500]] Third: which of them matter most here? [[slnc 500]] Fourth: by when will they be fixed? [[slnc 500]] And fifth: is what we download what we reviewed?"""

[[scene]]
key = "10-roles"
kind = "bullets"
title = "Who Does What"
body = ["Sbom: the inventory and its paths", "SemVer and VersionRange: versions as numbers", "Audit: matching and ranking", "Cvss31: the score equation", "PatchWindow and Pins: deadlines and hashes"]
narration = """Here is who does what in the code. [[slnc 400]] The Sbom class reads the inventory, and finds the shortest path to any component. [[slnc 500]] Sem Ver and Version Range compare versions as numbers. [[slnc 500]] Audit matches the inventory against the advisories, and ranks the findings. [[slnc 500]] Cvss thirty one works out the score. [[slnc 300]] And Patch Window and Pins keep the deadlines and the hashes."""

[[scene]]
key = "11-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Dependency bots and their pull requests", "npm audit, Trivy, Dependency-Check", "CycloneDX and SPDX", "Lock files with hashes", "Supply chain attack news"]
narration = """You have probably met this already. [[slnc 400]] Dependency bots open pull requests for new versions. [[slnc 500]] Tools such as npm audit, Trivy and Dependency Check match an inventory against advisories. [[slnc 500]] CycloneDX and S P D X are the standard formats for the inventory. [[slnc 500]] Lock files carry hashes, so a changed download is caught. [[slnc 500]] And supply chain attacks, where a trusted package was swapped or copied, are the news that made all of this common practice."""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["An inventory with every build", "Scan daily; rank by score and reachability", "A deadline for each severity", "Pin and verify every artifact", "Fewer, better-maintained dependencies"]
narration = """So, how do you use it? [[slnc 400]] Produce an inventory with every build. [[slnc 500]] Scan it daily, and rank the findings by score and by whether they can be reached. [[slnc 500]] Give each severity a deadline, and track it. [[slnc 500]] Pin and verify every artifact. [[slnc 500]] And prefer fewer, better maintained dependencies, because each one is a promise to keep up."""

[[scene]]
key = "13-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Make the store use", "the XML feature and see the order change."]
narration = """That's patching and dependency hygiene. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] You ship other people's code, so know what it is, fix what matters in time, and check what you download. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine, with nothing installed except a Java development kit. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Make the store use the X M L feature, and see how the order of the findings changes. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
How an online store knows what it ships, learns about flaws in it, decides what to fix and when, and receives the fixed libraries. It covers the build that downloads artifacts, the registry they come from, and the advisory data. It does not cover flaws in the store's own code or the security of the registry's servers.
"""
assets = [
    "The running store, which contains every library in the inventory.",
    "The inventory of each release.",
    "The advisory data and the pinned hashes.",
    "The build that fetches and verifies artifacts.",
]
actors = [
    "The team that maintains the store.",
    "A library author, whose releases the store trusts.",
    "An attacker who can publish packages, or change a download on its way.",
]
boundaries = [
    "Registry to build: every artifact crosses it and the hash is the check.",
    "Advisory data to the scanner: the data decides what the team believes is wrong.",
]
assumptions = [
    "The first review of an artifact before pinning is honest and careful.",
    "The advisory data is current and comes from a source the team trusts.",
    "In the demo, all libraries and problems are fictional and the clock is simulated.",
]
out_of_scope = [
    "Flaws in the store's own code.",
    "Signature verification of artifacts: the signing projects.",
    "The security of the registry's own servers.",
]
tests = [
    "`VersionTest` checks numeric version order, every range operator, exact range boundaries and refused nonsense.",
    "`JsonTest` checks the reader on every kind of value and on malformed text.",
    "`CvssTest` checks the equation against published scores, the rounding rule and the severity bands.",
    "`AuditTest` checks the inventory, shortest paths, cycles, broken inventories, the findings, the advice and the ranking.",
    "`PatchWindowAndPinsTest` checks the deadlines, SHA-256 against published values, every single-bit change, unpinned artifacts and lookalike names.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next project, backups-and-recovery, looks at what happens when prevention fails: how to restore data, and how to know that the backup works.
"""

[[threat]]
id = "T1"
stride = "T"
threat = "A dependency is swapped for a changed artifact under the same name and version"
where = "`Pins.verify`"
control = "A SHA-256 recorded at review time, compared on every download"
residual = "A pin proves the file is the one reviewed, not that the reviewed file was safe"

[[threat]]
id = "T2"
stride = "S"
threat = "A package is published under a name one letter from a real one, and gets installed by mistake"
where = "`Typosquat`"
control = "Flag names one edit from a known name, and take libraries only from an allow-listed repository"
residual = "Only near misses are caught; a deliberately different name needs human review"

[[threat]]
id = "T3"
stride = "I"
threat = "A library with a known flaw stays in the store because nobody knew it was there"
where = "`Sbom`, `Audit.scan`"
control = "An inventory for every build, including transitive libraries, matched against advisories"
residual = "A scan finds known problems only, and the advisory data must be current"

[[threat]]
id = "T4"
stride = "E"
threat = "A reachable critical flaw is exploited before it is fixed"
where = "`PatchWindow`, `Audit.triage`"
control = "Rank by score and reachability, and give each severity a deadline"
residual = "Even a fix inside the window leaves days of exposure; mitigations such as a temporary block may be needed"

[[threat]]
id = "T5"
stride = "T"
threat = "The advisory data or the inventory is edited to hide a problem"
where = "`Advisory.parse`, `Sbom.parse`"
control = "Keep both under version control with reviewed changes, and fetch advisories from a trusted source over TLS"
residual = "Someone with write access to both can still hide a problem, so changes need a second reviewer"

[[threat]]
id = "T6"
stride = "R"
threat = "After an incident nobody can show what the store was built from at the time"
where = "`Sbom`"
control = "Keep the inventory of every release with the release"
residual = "The inventory must be generated by the build, because a hand-kept list drifts"
