[[act]]
title = "Object Lock: nobody can delete a locked version"
summary = "With a compliance lock until tomorrow, even the root account is refused with 403 when it deletes, bypasses or shortens; a plain delete only adds a marker; a governance lock can be lifted with the bypass permission."
detail = """
The input: the bucket shop-backups, created with object lock on, and two backups. backup-full.tar is locked in COMPLIANCE mode until now plus one day; backup-soft.tar in GOVERNANCE mode until the same time.
The result for the compliance version, tried by the root account: delete the version, refused with 403 AccessDenied; delete asking to bypass governance, refused; shorten the retention, refused. A plain delete is allowed, but only adds a marker, and the version still reads.
For the governance version: a plain delete of the version is refused, but with the bypass flag, which needs a special permission, it is allowed. Compliance cannot be lifted by anyone until the date, so choose it with care.
"""
figure = "lock_matrix"
figure_title = "What root may do to a locked version"
figure_speech = """
Second demo: object lock. [[slnc 400]] Two backups, each locked until tomorrow. [[slnc 300]] In amber, compliance mode. [[slnc 300]] In blue, governance mode. [[slnc 600]]
The rows are what the root account tries. [[slnc 300]] Root is the most powerful account the store has. [[slnc 600]]
On the compliance version, delete is refused. [[slnc 300]] Delete with the bypass flag is refused. [[slnc 300]] Shortening the lock is refused. [[slnc 300]] All with four oh three. [[slnc 600]]
A plain delete is allowed, but it only adds a marker, so the version still reads. [[slnc 600]]
On the governance version, a delete is refused too. [[slnc 300]] But with the bypass flag, and the special permission it needs, it goes through. [[slnc 300]] So governance protects against mistakes. [[slnc 300]] Compliance protects against everyone, until the date.
"""
speech = """
The real output. [[slnc 400]] The input: the bucket with object lock, and the two locks.
[[page]]
The result on the compliance version: refused, refused, refused. [[slnc 300]] A plain delete only adds a marker, and the version still reads. [[slnc 400]] On the governance version, the bypass flag is allowed. [[slnc 300]] Compliance cannot be lifted by anyone, so choose its date with care.
"""
rows = { lock = "active ok" }
console = [
    ["THE BUCKET", "code"],
    ["  shop-backups, object lock on", "muted"],
    ["THE LOCKS", "code"],
    ["  backup-full.tar  COMPLIANCE  until now + 1 day", "muted"],
    ["  backup-soft.tar  GOVERNANCE  until now + 1 day", "muted"],
    ["---", ""],
    ["THE ROOT ACCOUNT TRIES THE COMPLIANCE VERSION", "code"],
    ["  delete the version         refused (403 AccessDenied)", "bad"],
    ["  delete, bypass governance  refused (403 AccessDenied)", "bad"],
    ["  shorten the retention      refused (403 AccessDenied)", "bad"],
    ["  plain delete, a marker     allowed", "ok"],
    ["  the version still reads    true", "muted"],
    ["THE ROOT ACCOUNT TRIES THE GOVERNANCE VERSION", "code"],
    ["  delete the version         refused (403 AccessDenied)", "bad"],
    ["  delete, bypass governance  allowed", "ok"],
    ["  <- COMPLIANCE: NOBODY UNTIL THE DATE. CHOOSE WITH CARE", "amber"],
]

[[act]]
title = "The backup job gets an identity that can only add objects"
summary = "The backup-writer policy allows one action, s3:PutObject, on shop-backups: its put is allowed and get, list, delete, delete-version and a put into shop-orders are all refused with 403."
detail = """
The input: the user backup-writer, with a policy of one statement. Effect Allow, Action s3:PutObject, Resource arn:aws:s3:::shop-backups/*: add objects to the backup bucket, and nothing else.
The result: the backup job's put of nightly.tar is allowed. Reading it back, listing its versions, deleting it, deleting a version, and writing into shop-orders are all refused with 403 AccessDenied.
So a thief who steals the backup job's key can add data, but cannot read the backups, change their history or destroy them. It can still add junk, so set a quota and alert on unusual uploads.
"""
figure = "writer"
figure_title = "One action, on one bucket"
figure_speech = """
Third demo: the backup job gets its own identity. [[slnc 400]] On the left, its policy. [[slnc 300]] Effect: allow. [[slnc 300]] Action: put object, which only adds. [[slnc 300]] Resource: the objects of the backup bucket. [[slnc 600]]
On the right, everything the job tries. [[slnc 300]] Putting the nightly backup is allowed. [[slnc 600]]
Reading it back is refused. [[slnc 300]] Listing versions is refused. [[slnc 300]] Deleting, and deleting a version, are refused. [[slnc 300]] Writing into the orders bucket is refused. [[slnc 600]]
So if a thief steals this key from the backup server, the backups stay safe. [[slnc 300]] The thief can add junk, so a quota and an alert still matter.
"""
speech = """
The real output. [[slnc 400]] The input: the policy, three fields. [[slnc 400]] The result: one allowed, five refused with four oh three. [[slnc 400]] A stolen key can add, but not read or destroy.
"""
rows = { writer = "active ok" }
console = [
