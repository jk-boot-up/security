[docs.session]
objectives = [
    "explain what versioning protects against, and what it does not",
    "explain the difference between COMPLIANCE and GOVERNANCE locks",
    "give a backup job the least privilege it needs",
    "list the costs of immutable backups",
]
walkthrough = """
Start with the safe deposit box. Run the demo one act at a time. After act one, ask what an attacker with full rights could still do. After act two, ask who should be allowed to bypass a GOVERNANCE lock. In act three, ask what the
thief who steals the backup key can still do, and what would reveal it.
"""
exercises = [
    "Change the retention to ten seconds on a GOVERNANCE lock and watch it expire, then try the same with COMPLIANCE.",
    "Give the backup identity read access to one prefix and test what it can then reach.",
    "Add a legal hold to an object and see what it refuses.",
    "Set a bucket default retention and check that new objects get it without being asked.",
]

[docs.explained]
sentence = """
Backups survive ransomware when old versions are kept, when locks stop anyone from deleting them before a date, and when the job that writes them can do nothing but add objects.
"""
verdict = """
Use a versioned bucket, a write-only identity for the backup job, a lifecycle rule and, for the backups that matter most, Object Lock with a retention you can afford. Test restores regularly, protect the root account, and keep a copy outside the account.
"""
recognise = [
    "S3 Versioning, Object Lock and bucket policies in cloud consoles.",
    "`mc admin policy` and `mc retention` in guides for S3-compatible stores.",
    "Backup software settings called \"immutable backups\" or \"WORM\".",
]

[spec]
purpose = """
Teach immutable, least-privilege backups by running a real S3-compatible object store in Docker and showing versioning, Object Lock, a write-only identity, checksums and lifecycle rules with the AWS SDK for Java.
"""
nongoals = [
    "Backup scheduling and the contents of a backup: the plain project.",
    "Replication across sites and regions.",
    "Server-side encryption keys and key management services.",
]
problem = """
Backups on the same account as the application are destroyed with it; learners need to see the features that prevent this working on a real store.
"""
roles = [["The store in Docker", "`ObjectStoreContainer`"], ["An S3 client for one identity", "`Store`"], ["Entry point", "`BackupsRustfsDemo`"]]
requirements = [
    "An overwrite keeps the old version, and a delete only adds a marker.",
    "A COMPLIANCE lock refuses deleting, bypassing and shortening, and a GOVERNANCE lock accepts a bypass.",
    "The write-only identity can add objects to its bucket and nothing else.",
    "A checksum that does not match the bytes is refused and leaves nothing behind.",
    "No container or network is left after a run.",
]

