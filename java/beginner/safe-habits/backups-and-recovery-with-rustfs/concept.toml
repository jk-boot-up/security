kind = "poster"
title = "Backups and Recovery with RustFS"
narration = """Hello, and welcome. [[slnc 400]] This video explains backups with Rust F S, an S three compatible object store, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] An object store keeps files, called objects, in buckets, and speaks the S three A P I. [[slnc 300]] Amazon S three, RustFS and many others use the same A P I. [[slnc 600]] Think of a safe deposit box with a postal slot. [[slnc 300]] The courier can post envelopes through the slot, but cannot open the box. [[slnc 300]] And the bank has promised that nothing posted this month will be destroyed. [[slnc 700]] In this video, the domain is an online store. [[slnc 500]] By the end, you will hear how versions, locks, and a write only key protect backups. [[slnc 300]] And what they cost."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online store backs up its orders.", "", "Ransomware gets onto the servers,", "overwrites the orders,", "and then looks for the backups", "to destroy them."]
narration = """Here is the scenario. [[slnc 400]] An online store backs up its orders every night. [[slnc 500]] Ransomware gets onto the servers. [[slnc 300]] It overwrites the orders. [[slnc 300]] And then it looks for the backups, to destroy them."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["Bucket: a container of objects", "Version: an older copy of an object", "Object Lock: no delete until a date", "COMPLIANCE: nobody can lift it", "Policy: what an identity may do"]
narration = """Before the demos, the words. [[slnc 500]] A bucket is a container of objects. [[slnc 500]] A version is an older copy of an object. [[slnc 500]] Object Lock means no delete until a date. [[slnc 500]] Compliance mode means nobody can lift the lock. [[slnc 500]] And a policy says what an identity may do."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "09-ladder"
kind = "bullets"
title = "Three Protections"
body = ["Versions: the old data stays", "Locks: it cannot be deleted before a date", "A write-only key: the job can only add", "Each stops a different attack."]
narration = """Let's put the three side by side. [[slnc 400]] Versions keep the old data when something is overwritten. [[slnc 500]] Locks stop anyone deleting a version before a date. [[slnc 500]] A write only key means the backup job can only add. [[slnc 600]] Each one stops a different attack, and together they leave ransomware very little to destroy."""

[[scene]]
key = "10-roles"
kind = "bullets"
title = "Who Does What"
body = ["ObjectStoreContainer: the store in Docker", "Store: one identity's S3 calls", "BackupsRustfsDemo: the five acts", "rc admin tool: users and policies"]
narration = """Here is who does what in the code. [[slnc 400]] The object store container class starts the store in Docker, and removes it afterwards. [[slnc 500]] The store class makes every call as one identity, so what each one may do is visible. [[slnc 500]] The demo class runs the five acts. [[slnc 300]] And the admin tool creates the users and their policies."""

[[scene]]
key = "11-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["S3 Versioning and Object Lock", "Azure immutable blobs", "Immutable or WORM backups", "S3-compatible stores in home labs"]
narration = """You have probably met this already. [[slnc 400]] Amazon S three offers versioning and object lock. [[slnc 500]] Azure calls it immutable blob storage. [[slnc 500]] Backup products offer immutable, or worm, backups. [[slnc 500]] And S three compatible stores like RustFS are common in home labs and on premises."""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Versioned bucket, with a lifecycle rule", "A write-only identity for the job", "Object Lock for backups that matter", "Test restores; protect the root account", "Keep a copy outside the account"]
narration = """So, how do you use it? [[slnc 400]] Use a versioned bucket, with a lifecycle rule. [[slnc 500]] Give the backup job a write only identity. [[slnc 500]] Use Object Lock for the backups that matter most. [[slnc 500]] Test restores, and protect the root account. [[slnc 500]] And keep a copy outside the account."""

[[scene]]
key = "13-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Try a GOVERNANCE lock", "with a ten second retention."]
narration = """That's backups with an object store. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] A backup is safe when the old data is kept, when it cannot be deleted before a date, and when the job that writes it can do nothing but add. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine, with Docker and a Java development kit. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Make a governance lock with a ten second retention, and watch it expire. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
The backups of an online store held in an S3-compatible object store: the objects and their versions, the locks, the identity that writes backups, and the root account. It covers ransomware on the application servers and a thief who steals a key.
It does not cover the store's disks, the network between the servers and the store, or the contents of the backups.
"""
assets = [
    "The backup objects and their older versions.",
    "The write-only key of the backup job.",
    "The root credentials of the store.",
    "The retention settings.",
]
actors = [
    "The shop's application and backup job.",
    "Ransomware running with the application's rights.",
    "A thief who has stolen the backup job's key.",
    "An administrator who holds the root account.",
]
boundaries = [
    "Application servers to the object store: only the write-only identity crosses it.",
    "The backup identity to the root account: the root account can change any policy.",
]
assumptions = [
    "The root credentials are kept out of the application servers.",
    "The store's disks and the account itself are not attacked.",
    "In the demo, the store is local and its credentials are fixed demo values.",
]
out_of_scope = [
    "Replication to another site or provider.",
    "Encryption keys and key management.",
    "The correctness of the backup's contents: the plain project's restore test.",
]
tests = [
    "`ObjectStoreTest` (integration, Docker) checks versions, delete markers, both lock modes, the write-only identity, checksums, the lifecycle rule, and that nothing is left running.",
    "`StoreUnitTest` checks the SHA-256 helper against the published value, the wording of refusals, and that the policy has one action.",
    "`DemoRunsTest` (integration) compares the whole demo with the golden output.",
]
next = """
The safe-habits module is finished with this project. The track continues with the tool versions of the earlier projects and then the intermediate level.
"""

[[threat]]
id = "T1"
stride = "T"
threat = "Ransomware overwrites or deletes the backups using the application's access"
where = "the bucket"
control = "Versioning keeps the old data, and Object Lock refuses deletes of locked versions"
residual = "Versions cost storage, and a lock protects only until its date"

[[threat]]
id = "T2"
stride = "E"
threat = "A thief with the backup job's key reads or destroys the backups"
where = "`ObjectStoreContainer.createWriteOnlyUser`"
control = "The policy has one action, PutObject, on one bucket"
residual = "The thief can still add junk, so quotas and alerts on unusual uploads are needed"

[[threat]]
id = "T3"
stride = "T"
threat = "A backup is damaged in transit or at upload"
where = "`Store.put`"
control = "A SHA-256 checksum is sent and verified by the store"
residual = "Only a restore test shows that the backup is usable"

[[threat]]
id = "T4"
stride = "R"
threat = "Nobody can say who uploaded or removed a backup"
where = "the backup job"
control = "A separate identity for the job makes its actions attributable"
residual = "Audit logging of the store has to be switched on and kept elsewhere"

[[threat]]
id = "T5"
stride = "E"
threat = "The root account is stolen, and policies, users and governance locks are changed"
where = "the root account"
control = "COMPLIANCE locks cannot be lifted even by the root account"
residual = "GOVERNANCE locks can, new users can be added, and the store's disks are outside the lock, so keep the root credentials out of daily use and keep a copy elsewhere"
