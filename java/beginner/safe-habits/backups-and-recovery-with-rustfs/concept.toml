    ["lock", "Object Lock", "no delete until the date"],
    ["writer", "Write-only identity", "the backup job can only add"],
    ["checksum", "Checksums", "damaged uploads are refused"],
    ["lifecycle", "Lifecycle", "old versions expire, at a cost"],
