[docs.dependencies]
intro = """
This project uses the AWS SDK for Java to talk to the store, and two Docker images: the object store and its admin tool.
"""
what = [
    ["AWS SDK for Java v2 (s3, url-connection-client)", "the standard Java client for the S3 API. It works unchanged against Amazon S3, RustFS, Ceph and other S3-compatible stores; here it is pointed at the loopback address with path-style access."],
    ["RustFS (rustfs/rustfs)", "an open-source S3-compatible object store. MinIO's community edition no longer publishes container images, so this project runs RustFS, which implements the same S3 features and a MinIO-style admin API. The lesson does not depend on which store it is."],
    ["rc (rustfs/rc)", "the command-line admin tool of RustFS, used only to create the backup user, its policy and the attachment. It plays the role that `mc admin` plays for MinIO."],
    ["Docker", "runs the two images. The container and its private network are removed when the run ends."],
]
why = """
The earlier backup project modelled the ideas with folders. Versioning, Object Lock and policies are features of a real object store, so a real one is the only honest way to show that they behave as described, and the same code works against Amazon S3.
"""
install_note = "A JDK, and Docker for the demo and the integration tests. Gradle downloads the Java libraries and Docker pulls the images, and the versions are pinned:"
versions = [
