[[act]]
title = "A checksum catches a damaged backup"
summary = "An upload whose bytes match its SHA-256 is allowed, one whose bytes do not is refused with 400 BadDigest and leaves 0 versions; the stored copy hashes to the same value."
detail = """
The input: the SHA-256 of the backup bytes and of other bytes, in Base64, and two uploads. checked.tar sends the backup with its own checksum; damaged.tar sends the backup with the checksum of other bytes, as a transfer damaged on the way would.
The result: checked.tar is allowed, and damaged.tar is refused with 400 BadDigest. What is stored for checked.tar hashes to the same value, and damaged.tar left 0 versions behind.
The store checks the bytes it receives. Whether the backup is usable is a different question: a restore test is still needed.
"""
figure = "checksum"
figure_title = "The checksum travels with the bytes"
figure_speech = """
Fourth demo: checksums. [[slnc 400]] At the top, two fingerprints, in Base sixty four. [[slnc 300]] One for the backup, one for some other bytes. [[slnc 600]]
Each upload sends the bytes and a claimed fingerprint. [[slnc 300]] The store computes the fingerprint of what arrived, and compares. [[slnc 600]]
For checked dot tar, they match: allowed. [[slnc 600]]
For damaged dot tar, the claim is the other bytes' fingerprint, as if the data changed on the way. [[slnc 300]] Refused, with four hundred, bad digest. [[slnc 300]] And nothing is stored. [[slnc 600]]
A checksum proves the bytes arrived intact. [[slnc 300]] It does not prove they restore into a working shop.
"""
speech = """
The real output. [[slnc 400]] The input: the two checksums, and the two uploads.
[[page]]
The answers: allowed, and refused with bad digest. [[slnc 400]] What is stored: the same hash, and zero versions of the damaged one. [[slnc 300]] Intact is not usable, so still run a restore test.
"""
rows = { checksum = "active ok" }
console = [
    ["THE CHECKSUMS (SHA-256 IN BASE64)", "code"],
    ["  the backup   Du5R0k8IE/PhcdlE4tmKtfFjDbpcvgZLRF3U08cDIys=", "muted"],
    ["  other bytes  U4p0HGInM6/hR4Gek52CzAce376z60ntcBpVl1rCiLM=", "muted"],
    ["THE UPLOADS", "code"],
    ["  checked.tar  the backup, with its own checksum", "muted"],
    ["  damaged.tar  the backup, with other bytes' checksum", "muted"],
    ["---", ""],
    ["THE ANSWERS", "code"],
    ["  checked.tar                allowed", "ok"],
    ["  damaged.tar                refused (400 BadDigest)", "bad"],
    ["WHAT IS STORED", "code"],
    ["  checked.tar, same hash     true", "muted"],
    ["  damaged.tar, versions      0", "muted"],
    ["  <- INTACT IS NOT USABLE: STILL RUN A RESTORE TEST", "amber"],
]

[[act]]
title = "Keeping history without keeping it for ever, and the cost"
summary = "A lifecycle rule removes old versions 30 days after they are replaced; a 2 MB file overwritten every hour keeps 24 x 30 = 720 old versions, 720 x 2 = 1440 MB."
detail = """
The input: one lifecycle rule on shop-orders, expire-old-versions, enabled: an old version is removed 30 days after it is replaced.
The cost, worked out: every version is stored in full. An orders.csv of 2 MB overwritten every hour keeps 24 x 30 = 720 old versions, and 720 x 2 MB = 1440 MB of storage for one 2 MB file. The rule keeps it bounded, not free.
The limits: a compliance date set wrong is paid for in storage, since nobody can lift it. The root account can change every policy, so keep it out of daily use. And a lock stops the API, not someone deleting the disks, so keep a copy somewhere else too.
"""
figure = "cost"
figure_title = "History is kept in full, for thirty days"
figure_speech = """
Fifth demo: how long to keep history, and what it costs. [[slnc 400]] At the top, the lifecycle rule. [[slnc 300]] An old version is removed thirty days after it is replaced. [[slnc 600]]
Now the cost, worked out. [[slnc 300]] An orders file of two megabytes, overwritten every hour. [[slnc 300]] Twenty four versions a day, times thirty days, is seven hundred and twenty old versions. [[slnc 600]]
Every version is stored in full. [[slnc 300]] Seven hundred and twenty times two megabytes is one thousand four hundred and forty megabytes. [[slnc 300]] For one two megabyte file. [[slnc 600]]
Each block on the bar is one day: forty eight megabytes. [[slnc 300]] After thirty days, the oldest block goes. [[slnc 300]] The rule keeps the history bounded, but not free.
"""
speech = """
The real output. [[slnc 400]] The input: one rule, thirty days. [[slnc 400]] The cost: seven hundred and twenty versions, one thousand four hundred and forty megabytes.
[[page]]
And the limits. [[slnc 300]] A wrong compliance date is paid for in storage. [[slnc 300]] Keep the root account out of daily use. [[slnc 300]] And keep a copy somewhere else, because a lock does not stop someone deleting the disks.
"""
rows = { lifecycle = "active amber" }
