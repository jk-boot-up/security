The restore copies version one back, as version three. [[slnc 300]] A normal read sees the orders again. [[slnc 300]] The scrambled version stays, as evidence. [[slnc 600]]
Last, a plain delete. [[slnc 300]] It only adds a delete marker on top. [[slnc 300]] A normal read now fails, with four oh four. [[slnc 300]] But nothing below is gone.
"""
