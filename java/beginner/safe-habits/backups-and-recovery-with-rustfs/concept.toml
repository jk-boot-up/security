# concept.toml: everything about this project that is not Java code.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "backups-and-recovery-with-rustfs"
module = "safe-habits"
title = "Backups and Recovery with RustFS, an S3-Compatible Object Store"
short_title = "Backups with RustFS"
package = "backupsrustfs"
main_class = "BackupsRustfsDemo"
tagline = "Backups the attacker cannot delete"
bold = "An S3-compatible object store gives backups three protections that a plain folder cannot: versions that survive an overwrite, locks that survive even the root account, and a write-only identity for the backup job, at the price of storage and a lock that cannot be undone."
domain = "an online store"
domain_note = ""
youtube_description = """Backups and recovery with RustFS, an S3-compatible object store, in Java: the same S3 API as Amazon S3, run locally in Docker. Explained with an online store, like a safe deposit box where the courier can post envelopes through a slot but cannot open the box. We watch ransomware overwrite a file and restore the older version, lock a backup with Object Lock so that not even the root account can delete it, give the backup job an identity that can only add objects, catch a damaged upload with a SHA-256 checksum, and finish with the bill: storage grows with every version, a compliance lock cannot be undone, and the root account is the real key."""
thumb_lines = ["BACKUPS WITH RUSTFS", "S3 OBJECT LOCK"]
thumb_code = "ObjectLockMode.COMPLIANCE"
youtube_title = "Backups and Recovery with RustFS, an S3-Compatible Object Store (Versioning, Object Lock, Write-Only Keys)"
youtube_tags = ["backups", "ransomware", "object lock", "s3", "rustfs", "versioning", "least privilege", "docker", "java", "cybersecurity for beginners"]

[readme]
technologies = [
    ["RustFS (rustfs/rustfs)", "1.0.2", "the S3-compatible object store that runs in Docker; MinIO's community edition no longer publishes images, and RustFS speaks the same S3 and MinIO-style admin API"],
    ["rc (rustfs/rc)", "v0.1.36", "the admin command-line tool that creates the backup user and its policy; the same job `mc` does for MinIO"],
    ["Docker", "24 or later", "runs the store and the admin tool; only the integration tests and the demo need it"],
]
intro = """
The plain version of this lesson kept backups in folders and simulated the ransomware. Real backups usually go to **object storage**: a service that stores objects (files with a name) in buckets and speaks the **S3** API, which Amazon S3,
RustFS and many others share. Three of its features matter for security. **Versioning** keeps the old data when an object is overwritten or deleted. **Object Lock** makes a version impossible to delete until a date, in COMPLIANCE mode even for the root account.
And the store has its own **identities and policies**, so the backup job can be allowed to add objects and nothing else.

The demo runs a real store in Docker and talks to it with the AWS SDK for Java, as the shop, as ransomware and as the backup job.
"""
analogy = """
Think of a safe deposit box with a postal slot. The courier can post envelopes through the slot but cannot open the box, read what is inside or take anything out. The box keeps every envelope ever posted, and the bank has promised, in a way that not even the manager can undo,
that nothing posted this month will be destroyed. A thief who steals the courier's key can post junk, and nothing more.
"""
scenario = """
An online store backs up its orders to an object store. Ransomware overwrites the orders file, then looks for the backups to destroy them. The demo shows what versioning, a lock and a write-only identity each stop, how a checksum catches a damaged upload, and what all of it costs.
"""
costs = [
    "**Storage grows with every version.** Each overwrite keeps the old object in full until a lifecycle rule removes it.",
    "**A COMPLIANCE lock cannot be undone.** A wrong retention date is paid for in storage until it ends, and nobody, including you, can shorten it.",
    "**The root account is the real key.** Whoever holds it can create users and change policies, so it stays out of daily use and under its own protection.",
    "**The lock stops the API, not the disks.** Someone who can delete the storage underneath, or the whole account, still wins, so keep a copy somewhere else too.",
    "**It needs Docker for the lab.** The demo starts a store in a container, so it runs only where Docker is available.",
]
too_much = """
For a small shop, a versioned bucket with a write-only backup identity and a lifecycle rule is a large gain for little work. Object Lock in COMPLIANCE mode is for backups whose loss would end the business, and a short retention is a sensible way to start.
"""
met_before = [
    "Amazon S3 Versioning and Object Lock, Azure immutable blob storage, Google Cloud bucket lock.",
    "Backup tools such as restic and Veeam, which can write to S3 buckets with locks.",
    "The advice \"keep an immutable copy\" in every ransomware guide.",
    "RustFS, Ceph and other S3-compatible stores in on-premises and home-lab backups.",
]
where = """
This project follows [backups-and-recovery](../backups-and-recovery) and is the third project in [safe-habits](..), after [least-privilege](../least-privilege): the write-only backup identity is least privilege applied to a real service.
"""
twin = """
The store runs in Docker on your machine and is thrown away after each run, with fixed demo credentials that protect nothing. The demo prints only facts that do not depend on ports, version ids or time. The retention date is a day from the moment of the run, and the demo prints only that the lock refuses.
"""
test_note = "The ordinary tests need only a JDK (the checksum helper, the outcome wording and the write-only policy). The integration tests and the demo start the real store in Docker and check versioning, both lock modes, the write-only identity, the checksum, the lifecycle rule, and that no container or network is left behind. The demo's comparison with its golden output runs with the integration tests, because the demo needs Docker: run `./gradlew integrationTest` after changing the demo or its narration."

[[act]]
title = "Versioning: an overwrite does not destroy the old data"
summary = "Ransomware overwrites orders.csv, two versions are kept, the original is restored by writing it back, and a plain delete only adds a marker."
detail = """
The shop stores orders.csv and ransomware overwrites it with scrambled bytes. Two versions are kept. A normal read returns the scrambled file, but the original is still there as an older version. Restoring is writing the older version back as the newest.
The scrambled version stays in the history as evidence. A plain delete only adds a delete marker: reading the key fails, the data is not gone. But an attacker with the right to delete versions could still remove every version, which is what the next act stops.
"""
speech = """
First demo: versioning. [[slnc 400]] The shop stores its orders file. [[slnc 300]] Ransomware overwrites it with scrambled bytes. [[slnc 600]]
Two versions are kept. [[slnc 300]] A normal read returns the scrambled file. [[slnc 300]] But the original is still there, as an older version. [[slnc 600]]
Restoring is writing the older version back as the newest. [[slnc 600]]
A plain delete only adds a marker. [[slnc 300]] The data is not gone. [[slnc 600]]
But an attacker who may delete versions could still destroy them all. [[slnc 300]] The next demo stops that.
"""
rows = { versions = "active ok" }
console = [
    ["the shop stores orders.csv, then ransomware overwrites it with scrambled bytes", "muted"],
    ["versions kept for orders.csv: 2", "ok"],
    ["what a normal read returns now is the scrambled file: true", "amber"],
    ["the original is still there as an older version: true", "ok"],
    ["restore = write the older version back as the newest: true", "ok"],
    ["a plain delete only adds a delete marker (1): reading the key now fails, the data is not gone: true", "ok"],
    ["but an attacker with delete rights on versions can still remove every version, which is what the next act stops", "amber"],
]

[[act]]
title = "Object Lock: nobody can delete a locked version"
summary = "A COMPLIANCE-locked backup refuses deletion, even with bypass and from the root account, and the retention cannot be shortened; GOVERNANCE can be lifted with a special permission."
detail = """
A backup is stored with COMPLIANCE retention for a day. Deleting that version is refused. Deleting it while asking to bypass governance is refused. Shortening the retention is refused. A plain delete is allowed but only adds a marker, and the locked version is still readable.
GOVERNANCE is softer: deleting is refused, but with the special bypass permission it can be lifted. COMPLIANCE cannot be lifted by anyone until the date, so choose it with care.
"""
speech = """
Second demo: Object Lock. [[slnc 400]] A backup is stored with a compliance lock for one day. [[slnc 600]]
Deleting that version is refused. [[slnc 300]] Asking to bypass the lock is refused. [[slnc 300]] Shortening the lock is refused. [[slnc 600]]
This is the root account, and it is still refused. [[slnc 600]]
A plain delete only adds a marker. [[slnc 300]] The locked version is still readable. [[slnc 600]]
The governance lock is softer. [[slnc 300]] It can be lifted with a special permission. [[slnc 300]] The compliance lock cannot be lifted by anyone, until the date.
"""
rows = { lock = "active ok" }
console = [
    ["a backup is stored with COMPLIANCE retention for a day", "muted"],
    ["delete that version: refused (403 AccessDenied)", "ok"],
    ["delete it asking to bypass governance: refused (403 AccessDenied)", "ok"],
    ["shorten the retention: refused (403 AccessDenied)", "ok"],
    ["a plain delete is allowed but only adds a marker: allowed", "muted"],
    ["the locked version is still readable: true", "ok"],
    ["GOVERNANCE is softer. Delete that version: refused (403 AccessDenied)", "muted"],
    ["with the special bypass permission it can be lifted: allowed", "amber"],
    ["COMPLIANCE cannot be lifted by anyone until the date, so choose it with care", "amber"],
]

[[act]]
title = "The backup job gets an identity that can only add objects"
summary = "The backup job's policy has one action, PutObject: it can write a backup but cannot read, list, delete, delete a version or write to another bucket."
detail = """
The backup job gets its own identity with a policy that has one action, adding objects to one bucket. It can write a backup. It cannot read one back, list versions, delete, delete a version, or write to the orders bucket.
So a thief who steals the backup job's key can add data but cannot read it, change history or destroy backups. It can still add junk, so quotas and alerts on unusual uploads matter.
"""
speech = """
Third demo: a write only identity. [[slnc 400]] The backup job gets its own user, whose policy has one action: add an object, to one bucket. [[slnc 600]]
It can write a backup. [[slnc 300]] It cannot read one. [[slnc 300]] It cannot list. [[slnc 300]] It cannot delete. [[slnc 300]] It cannot delete a version. [[slnc 300]] And it cannot write to any other bucket. [[slnc 600]]
So a thief who steals this key can add data, and nothing else. [[slnc 300]] It can still add junk, so alerts on unusual uploads still matter.
"""
rows = { writer = "active ok" }
console = [
    ["the backup job writes a backup: allowed", "ok"],
    ["it tries to read one back: refused (403 AccessDenied)", "ok"],
    ["it tries to list versions: refused (403 AccessDenied)", "ok"],
    ["it tries to delete: refused (403 AccessDenied)", "ok"],
    ["it tries to delete a version: refused (403 AccessDenied)", "ok"],
    ["it tries to write to the orders bucket: refused (403 AccessDenied)", "ok"],
    ["so a thief who steals the backup job's key can add data but cannot read, change history or destroy backups", "muted"],
    ["it can still add junk, so the quota and the alerts on unusual uploads matter", "amber"],
]

[[act]]
title = "A checksum catches a damaged backup"
summary = "An upload with the right SHA-256 is accepted; one whose bytes do not match the checksum is refused with BadDigest and leaves nothing behind."
detail = """
Uploading with the SHA-256 of the data is allowed. Uploading bytes whose SHA-256 does not match the one sent is refused, and leaves nothing behind. What was stored for the good upload hashes to the same value.
The store checks bytes in transit and at upload; a restore test is still needed to know that a backup is usable.
"""
speech = """
Fourth demo: a checksum. [[slnc 400]] An upload with the right S H A two five six is accepted. [[slnc 600]]
Bytes that do not match the checksum are refused. [[slnc 300]] And nothing is left behind. [[slnc 600]]
The stored copy hashes to the same value. [[slnc 600]]
But a checksum only shows the bytes arrived. [[slnc 300]] A restore test shows the backup is usable.
"""
rows = { checksum = "active ok" }
console = [
    ["upload with the SHA-256 of the data: allowed", "ok"],
    ["upload bytes whose SHA-256 does not match the one sent: refused (400 BadDigest)", "ok"],
    ["what was stored for the good upload hashes to the same value: true", "ok"],
    ["the damaged upload left nothing behind: true", "ok"],
    ["the store checks bytes in transit and at upload; a restore test is still needed to know the backup is usable", "amber"],
]

[[act]]
title = "Keeping history without keeping it for ever, and the cost"
summary = "A lifecycle rule removes old versions after 30 days; the bill is storage that grows, a lock that cannot be undone, a root account that is the real key, and disks that the lock does not protect."
detail = """
A lifecycle rule on the orders bucket removes old versions 30 days after they are replaced. Every version is stored in full, so storage grows with every overwrite until the rule removes them. A COMPLIANCE lock cannot be undone. The root account is the real key, so keep it out of daily use.
Object lock stops the API from deleting backups; it does not stop someone from deleting the disks, so keep a copy somewhere else too.
"""
speech = """
Fifth demo: the lifecycle, and the bill. [[slnc 400]] A lifecycle rule removes old versions thirty days after they are replaced. [[slnc 600]]
Every version is stored in full, so storage grows with every overwrite, until the rule removes them. [[slnc 600]]
A compliance lock cannot be undone. [[slnc 300]] A wrong date is paid for in storage. [[slnc 600]]
The root account is the real key. [[slnc 300]] Keep it out of daily use. [[slnc 600]]
And the lock stops the A P I from deleting backups, not someone from deleting the disks. [[slnc 300]] So keep a copy somewhere else too.
"""
rows = { lifecycle = "active amber" }
console = [
    ["a lifecycle rule on the orders bucket: 1 rule, expire-old-versions, removes old versions 30 days after they are replaced", "ok"],
    ["every version is stored in full, so storage grows with every overwrite until the rule removes them", "amber"],
    ["a COMPLIANCE lock cannot be undone, so a mistaken retention date is paid for in storage", "amber"],
    ["the root account is the real key: whoever holds it can change policies and users, so keep it out of daily use", "amber"],
    ["object lock stops the API from deleting backups; it does not stop someone from deleting the disks, so keep a copy somewhere else too", "amber"],
]

[animation]
subtitle = "An online store backs up to an object store that keeps versions, locks them, and lets the backup job only add objects."
boxes = [
