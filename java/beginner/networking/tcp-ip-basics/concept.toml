narration = """Before the demos, the words. [[slnc 500]] A packet is a unit of data, with a source and a destination address. [[slnc 500]] A segment is T C P's unit, with ports and numbers. [[slnc 500]] SYN and ACK are flags used to start a connection. [[slnc 500]] A sequence number counts the bytes in the stream. [[slnc 500]] And the backlog is the table of handshakes that have started and not finished."""

