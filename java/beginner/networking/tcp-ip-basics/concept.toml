narration = """Here is who does what in the code. [[slnc 400]] The checksum class computes the standard internet checksum. [[slnc 500]] The I P packet and T C P segment classes build and read the headers. [[slnc 500]] The listener is the handshake state machine. [[slnc 500]] The sequence numbers interface picks the first number, with a counter or with a keyed hash. [[slnc 300]] And the plaintext tap sends a real connection and records what an observer would see."""

