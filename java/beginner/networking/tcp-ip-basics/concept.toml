# concept.toml: everything about this project that is not Java code.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "tcp-ip-basics"
module = "networking"
title = "TCP/IP Basics for Security"
short_title = "TCP/IP Basics"
package = "tcpip"
main_class = "TcpIpDemo"
tagline = "Every attack on the network starts with how packets really work"
bold = "TCP/IP delivers bytes reliably, but it does not say who sent them, it does not hide them, and its handshake can be filled up: security has to be added on top."
domain = "an online store"
domain_note = ""
youtube_description = """TCP/IP basics for security in Java: packets, checksums, the three-way handshake, SYN floods and guessable sequence numbers. Explained with an online store. We build an IPv4 packet and a TCP segment byte by byte, see that a checksum catches accidents but not attackers, run the three-way handshake as a state machine, fill its table with a SYN flood and defend with SYN cookies, forge a connection by guessing sequence numbers, and watch a real connection carry a card number in the clear."""
thumb_lines = ["TCP/IP BASICS", "FOR SECURITY"]
thumb_code = "SYN -> SYN-ACK -> ACK"
youtube_title = "TCP/IP Basics for Security in Java (Handshake, SYN Flood, Sequence Numbers)"
youtube_tags = ["tcp", "ip", "three-way handshake", "syn flood", "syn cookies", "sequence numbers", "networking", "java", "cybersecurity for beginners"]

[readme]
intro = """
Almost everything on the internet rides on **IP**, which moves packets from one address to another, and **TCP**, which turns those packets into a reliable, ordered stream of bytes.
Both were designed for cooperation, not defence. A packet's **source address** is only a field the sender fills in. A **checksum** catches accidents and has no key. A **connection** begins with a
three-way **handshake**, and the server must remember each half-finished handshake, which is what a **SYN flood** abuses. And the stream TCP delivers is not hidden from anyone on the path.

The demo builds an IPv4 packet and a TCP segment byte by byte, runs the handshake as a state machine, floods it, defends it with SYN cookies, forges a connection by guessing numbers, and sends a card number over a real connection.
"""
analogy = """
Think of the postal system. Each envelope carries a return address that anyone can write, whatever is true. A smudge check on the envelope catches rain damage, not a forger. Starting a conversation by post means three letters:
"are you there?", "yes, are you?", "yes". A shop that must reserve a chair for everyone who sends the first letter can be emptied of chairs by someone sending thousands of first letters from fake addresses.
"""
scenario = """
An online store's web server receives connections from customers. The demo shows what a packet contains, what its checksum does not protect, how a connection begins, how the store's connection table is filled by an attacker,
how a connection is forged by guessing numbers, and what an observer sees of a real connection.
"""
costs = [
    "**SYN cookies are for emergencies.** They drop TCP options and cost a hash for every SYN, so servers switch them on only when the table is full.",
    "**Keyed sequence numbers need a good secret.** The secret must be unpredictable, and replaced from time to time.",
    "**Filtering by address helps only near the source.** Spoofed packets are stopped by ingress filtering at the networks they come from, which the store does not control.",
    "**The demo is a model.** It builds packets and a state machine in memory, with no options, no retransmission and no real IP stack, so it teaches the ideas and not the full protocol.",
]
too_much = """
For most applications, TCP/IP is something to understand and leave alone: the operating system implements it. The knowledge matters when something goes wrong or something is attacked,
and when choosing where to put defences: rate limits, firewalls, SYN cookies, and above all TLS.
"""
met_before = [
    "`netstat` and `ss`, which list connections and their states, such as SYN_RECV and ESTABLISHED.",
    "`tcpdump` and Wireshark, which show packets with their flags.",
    "Firewall rules that say \"drop packets from this source\".",
    "News stories about SYN floods and denial-of-service attacks.",
]
where = """
This project is the first in [networking](..) and builds on [authentication-vs-authorization](../../identity/authentication-vs-authorization): knowing who is on the other end of a connection is the problem that the later projects solve.
"""
twin = """
All packets are built and read in memory, so the demo is exact. The one real connection is on the loopback interface of the machine running it, and the demo prints only facts that do not depend on port numbers.
The checksum is checked against the example in RFC 1071.
"""
test_note = "The checksum is checked against the RFC 1071 example. Packets are built and read in memory, the handshake is a state machine with fixed addresses, and the one real connection prints only facts that do not depend on port numbers, so the golden output is the same on every run."

[[act]]
title = "Layers: a packet inside a packet"
summary = "A TCP segment is 20 bytes and inside an IP packet it is 40 bytes; the packet decodes again, but nothing in it says who the sender really is."
detail = """
A customer's browser sends a SYN to the store's port 443. The TCP segment is 20 bytes, and inside an IP packet it is 40 bytes. Decoded again, it says from 198.51.100.7 to 203.0.113.10, ports 51000 to 443, with the SYN flag set.
Nothing in either header says who the sender really is: the source address is just a field.
"""
speech = """
First demo: layers. [[slnc 400]] A customer's browser sends a first packet to the store. [[slnc 600]]
The T C P segment is twenty bytes. [[slnc 300]] Inside an I P packet, it is forty bytes. [[slnc 600]]
Decoded again, it says who it is from, who it is to, the ports, and that it is a SYN. [[slnc 600]]
But nothing in either header says who the sender really is. [[slnc 300]] The source address is just a field.
"""
rows = { layers = "active ok" }
console = [
    ["a customer's browser sends a SYN from 198.51.100.7 to the shop 203.0.113.10 port 443", "muted"],
    ["the TCP segment is 20 bytes, and inside an IP packet it is 40 bytes", "muted"],
    ["decoded again: from 198.51.100.7 to 203.0.113.10, ports 51000 to 443, SYN flag: true", "ok"],
    ["nothing in either header says who the sender really is: the source address is just a field", "amber"],
]

[[act]]
title = "A checksum catches accidents, not attackers"
summary = "A changed byte is refused, but the same change made by someone who recomputes the checksum is accepted, because the checksum has no key."
detail = """
One byte changed in transit, the time to live, is refused because the header checksum does not match. The same change made by someone who recomputes the checksum is accepted. The checksum has no key, so anyone can make it match,
and it is no protection against an attacker.
"""
speech = """
Second demo: the checksum. [[slnc 400]] Change one byte in transit, and the packet is refused. [[slnc 600]]
But the same change, made by someone who recomputes the checksum, is accepted. [[slnc 600]]
The checksum has no key. [[slnc 300]] So anyone can make it match. [[slnc 300]] It catches accidents, not attackers.
"""
rows = { checksum = "active amber" }
console = [
    ["one byte changed in transit (the time to live): refused (IPv4 header checksum does not match)", "ok"],
    ["the same change made by someone who recomputes the checksum: accepted", "bad"],
    ["the checksum has no key, so anyone can make it match: it is not protection against an attacker", "amber"],
]

[[act]]
title = "The three-way handshake"
summary = "SYN with sequence 1000, SYN-ACK acknowledging 1001 and one half-open entry, ACK establishes the connection; an ACK with no SYN before it is refused."
detail = """
The customer sends SYN with sequence number 1000. The store answers SYN-ACK acknowledging 1001, and now holds a half-open entry. The customer answers ACK and the connection is established, with no half-open entries left.
An ACK with no SYN before it does not establish anything.
"""
speech = """
Third demo: the three way handshake. [[slnc 400]] The customer sends a SYN, with a sequence number. [[slnc 600]]
The store answers with a SYN ACK, and keeps a half open entry. [[slnc 600]]
The customer answers with an ACK, and the connection is established. [[slnc 600]]
An ACK with no SYN before it establishes nothing.
"""
rows = { handshake = "active ok" }
console = [
    ["the customer sends SYN with sequence number 1000", "muted"],
    ["the shop answers SYN-ACK, acknowledging 1001, and now holds a half-open entry: 1", "muted"],
    ["the customer answers ACK: connection established: true, half-open entries left: 0", "ok"],
    ["an ACK with no SYN before it: established: false", "ok"],
]

[[act]]
title = "A SYN flood"
summary = "Eight SYNs that never answer fill a table of eight, so a real customer is refused; SYN cookies keep no entry and the customer still connects."
detail = """
Eight SYNs from addresses that never answer fill the store's table of eight half-open entries. A real customer's SYN is then not answered: the store is denying service to its customers. With SYN cookies the store keeps no entry,
because the state is encoded in its own sequence number, and the real customer connects. The cost is that cookies carry no options and take work for every SYN.
"""
speech = """
Fourth demo: a SYN flood. [[slnc 400]] Eight SYNs from addresses that never answer fill the store's table. [[slnc 600]]
A real customer's SYN is now not answered. [[slnc 300]] The store is denying service to its own customers. [[slnc 600]]
With SYN cookies, the store keeps no entry. [[slnc 300]] The state is encoded in its own sequence number. [[slnc 300]] The real customer connects. [[slnc 600]]
The cost is that cookies drop options, and take work for every SYN.
"""
rows = { flood = "active wrong" }
console = [
    ["8 SYNs from addresses that never answer fill the shop's table of 8 half-open entries: 8", "amber"],
    ["a real customer's SYN is now answered: false  <- THE SHOP IS DENYING SERVICE TO ITS CUSTOMERS", "bad"],
    ["with SYN cookies the shop keeps no entry: half-open entries 0, and the real customer connects: true", "ok"],
    ["the cost: cookies carry no options and take work for every SYN, so they are a defence for when the table is full", "amber"],
]

[[act]]
title = "Guessable numbers, and a stream anyone can read"
summary = "A counter that adds 64000 lets an attacker forge a connection as the admin machine; a keyed hash does not; and a real connection shows the card number to anyone watching."
detail = """
If the store picks its sequence numbers with a counter that adds 64000 each time, an attacker who sends a SYN pretending to be the admin machine guesses the next number from its own connection and is accepted as the admin: a forged connection.
With a keyed hash the same guess fails. And on a real connection on this machine, a sniffer on the wire sees the card number: TCP delivers bytes reliably and in order, and hides nothing. Secrecy and identity come from TLS.
"""
speech = """
Fifth demo: guessable numbers. [[slnc 400]] If the store picks its sequence numbers with a counter, an attacker can guess the next one from its own connection. [[slnc 600]]
It sends a first packet pretending to be the admin machine, and is accepted as the admin. [[slnc 600]]
With a keyed hash, the same guess fails. [[slnc 600]]
And on a real connection, a sniffer on the wire sees the card number. [[slnc 300]] T C P hides nothing. [[slnc 300]] Secrecy and identity come from T L S.
"""
rows = { numbers = "active wrong", stream = "active amber" }
console = [
    ["a counter that adds 64000: the attacker pretending to be 10.0.0.5 is accepted as the admin: true  <- A FORGED CONNECTION", "bad"],
    ["a keyed hash: the same guess is accepted as the admin: false", "ok"],
    ["a real TCP connection on this machine: connected true, the server received every byte: true", "muted"],
    ["what a sniffer on the wire sees contains the card number: true  <- TCP DOES NOT HIDE ANYTHING", "bad"],
    ["TCP gives reliable, ordered delivery. Secrecy and identity come from TLS", "amber"],
]

