[docs.problem]
scenario = """
An online store accepts connections from customers over the internet. Anyone can send it packets claiming any source, many at once, and watch the replies pass.
"""
naive = """
Assume that a connection from an address is from the owner of that address, that a checksum protects a packet, and that a stream is private because it is a connection.
"""
deliver = [
    "An IPv4 packet and a TCP segment built and read byte by byte, with the RFC 1071 checksum.",
    "A demonstration that a checksum with no key does not stop an attacker.",
    "The handshake as a state machine, with a limited table of half-open entries.",
    "A SYN flood and the SYN cookie defence.",
    "A forged connection from guessable sequence numbers, and the keyed numbers that stop it.",
    "A real connection whose content is visible to an observer.",
]

[docs.prerequisites]
required = [
    "Java basics",
    "A rough idea of what an IP address and a port are",
]
not_required = [
    "Any networking course",
    "Root access, raw sockets or packet capture: the packets are built in memory",
]
install = []

[docs.session]
objectives = [
    "describe what an IP packet and a TCP segment contain",
    "explain why a checksum is not a security measure",
    "describe the three-way handshake and what a SYN flood abuses",
    "explain why sequence numbers must be unpredictable",
    "say what TCP does not provide",
]
walkthrough = """
Start with the postal analogy. Run the demo one act at a time. After act two, ask who could recompute the checksum. After act four, ask what the store has lost besides connections.
In act five, ask what would have to be true for a source address to be trusted, and lead to the next projects: names, the web and TLS.
"""
exercises = [
    "Add the acknowledgement of data, so that a payload is delivered after the handshake, and check what a forged ACK does.",
    "Change the table size and the number of flooding SYNs and find the point at which a real customer gets in.",
    "Make the counter step 1 instead of 64000 and check that the forgery still works.",
    "Add a timeout to half-open entries, in simulated ticks, and see how it changes the flood.",
]

[docs.explained]
sentence = """
TCP/IP carries bytes between addresses reliably, but a source address can be forged, a checksum has no key, the handshake costs the server memory, and the stream is readable by anyone on the path, so defences must be added at other layers.
"""
verdict = """
Let the operating system's defences work: SYN cookies, keyed sequence numbers, ingress filtering. Rate-limit and filter at the edge. Never treat a source address as proof of identity, and never treat a TCP connection as private: use TLS.
"""
recognise = [
    "`ss -tan` showing many connections in SYN_RECV.",
    "`net.ipv4.tcp_syncookies` in kernel settings.",
    "Firewall and cloud rules written in terms of source addresses.",
    "Packet captures where a password or card number is readable.",
]

[spec]
purpose = """
Teach what TCP/IP does and does not provide by building an IPv4 packet and a TCP segment, running the handshake as a state machine, flooding it, defending it, forging a connection and watching a real connection.
"""
nongoals = [
    "A full TCP implementation, with options, retransmission and congestion control.",
    "Raw sockets and real packet capture: the tool counterpart.",
    "Names and the web: the next projects.",
]
problem = """
Learners use connections every day but do not know what is trusted in them, and so trust the wrong things.
"""
roles = [["Internet checksum", "`Checksum`"], ["IPv4 packet", "`Ipv4Packet`"], ["TCP segment", "`TcpSegment`"], ["The server's handshake", "`Listener`"], ["Sequence numbers", "`SequenceNumbers`"], ["A real connection and a tap", "`PlaintextTap`"], ["Entry point", "`TcpIpDemo`"]]
requirements = [
    "Packets round-trip, and any changed header byte is caught by the checksum.",
    "The checksum matches the RFC 1071 example.",
    "The handshake establishes only with the right acknowledgement, and a full table drops new SYNs.",
    "SYN cookies keep no state and still establish connections.",
    "Counter numbers can be guessed and keyed numbers cannot.",
    "The demo prints the same output on every run.",
]

