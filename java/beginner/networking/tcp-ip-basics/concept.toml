# concept.toml: everything about this project that is not Java code.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "tcp-ip-basics"
module = "networking"
title = "TCP/IP Basics for Security"
short_title = "TCP/IP Basics"
package = "tcpip"
main_class = "TcpIpDemo"
tagline = "Every attack on the network starts with how packets really work"
bold = "TCP/IP delivers bytes reliably, but it does not say who sent them, it does not hide them, and its handshake can be filled up: security has to be added on top."
domain = "an online store"
domain_note = ""
youtube_description = """TCP/IP basics for security in Java: packets, checksums, the three-way handshake, SYN floods and guessable sequence numbers. Explained with an online store. We build an IPv4 packet and a TCP segment byte by byte, see that a checksum catches accidents but not attackers, run the three-way handshake as a state machine, fill its table with a SYN flood and defend with SYN cookies, forge a connection by guessing sequence numbers, and watch a real connection carry a card number in the clear."""
thumb_lines = ["TCP/IP BASICS", "FOR SECURITY"]
thumb_code = "SYN -> SYN-ACK -> ACK"
youtube_title = "TCP/IP Basics for Security in Java (Handshake, SYN Flood, Sequence Numbers)"
youtube_tags = ["tcp", "ip", "three-way handshake", "syn flood", "syn cookies", "sequence numbers", "networking", "java", "cybersecurity for beginners"]

[readme]
intro = """
Almost everything on the internet rides on **IP**, which moves packets from one address to another, and **TCP**, which turns those packets into a reliable, ordered stream of bytes.
Both were designed for cooperation, not defence. A packet's **source address** is only a field the sender fills in. A **checksum** catches accidents and has no key. A **connection** begins with a
three-way **handshake**, and the server must remember each half-finished handshake, which is what a **SYN flood** abuses. And the stream TCP delivers is not hidden from anyone on the path.

The demo builds an IPv4 packet and a TCP segment byte by byte, runs the handshake as a state machine, floods it, defends it with SYN cookies, forges a connection by guessing numbers, and sends a card number over a real connection.
"""
analogy = """
Think of the postal system. Each envelope carries a return address that anyone can write, whatever is true. A smudge check on the envelope catches rain damage, not a forger. Starting a conversation by post means three letters:
"are you there?", "yes, are you?", "yes". A shop that must reserve a chair for everyone who sends the first letter can be emptied of chairs by someone sending thousands of first letters from fake addresses.
"""
scenario = """
An online store's web server receives connections from customers. The demo shows what a packet contains, what its checksum does not protect, how a connection begins, how the store's connection table is filled by an attacker,
how a connection is forged by guessing numbers, and what an observer sees of a real connection.
"""
costs = [
    "**SYN cookies are for emergencies.** They drop TCP options and cost a hash for every SYN, so servers switch them on only when the table is full.",
    "**Keyed sequence numbers need a good secret.** The secret must be unpredictable, and replaced from time to time.",
    "**Filtering by address helps only near the source.** Spoofed packets are stopped by ingress filtering at the networks they come from, which the store does not control.",
    "**The demo is a model.** It builds packets and a state machine in memory, with no options, no retransmission and no real IP stack, so it teaches the ideas and not the full protocol.",
]
too_much = """
For most applications, TCP/IP is something to understand and leave alone: the operating system implements it. The knowledge matters when something goes wrong or something is attacked,
and when choosing where to put defences: rate limits, firewalls, SYN cookies, and above all TLS.
"""
met_before = [
    "`netstat` and `ss`, which list connections and their states, such as SYN_RECV and ESTABLISHED.",
    "`tcpdump` and Wireshark, which show packets with their flags.",
    "Firewall rules that say \"drop packets from this source\".",
    "News stories about SYN floods and denial-of-service attacks.",
]
where = """
This project is the first in [networking](..) and builds on [authentication-vs-authorization](../../identity/authentication-vs-authorization): knowing who is on the other end of a connection is the problem that the later projects solve.
"""
twin = """
All packets are built and read in memory, so the demo is exact. The one real connection is on the loopback interface of the machine running it, and the demo prints only facts that do not depend on port numbers.
The checksum is checked against the example in RFC 1071.
"""
test_note = "The checksum is checked against the RFC 1071 example. Packets are built and read in memory, the handshake is a state machine with fixed addresses, and the one real connection prints only facts that do not depend on port numbers, so the golden output is the same on every run."

[[act]]
title = "Layers: a packet inside a packet"
summary = "The customer's first packet: a 20-byte TCP segment inside a 40-byte IP packet; the shop decodes the same values again, but the source address is just a field."
detail = """
A customer's browser sends a SYN to the store's port 443. The packet sent: a TCP segment of 20 bytes (ports 51000 to 443, the SYN flag, sequence number 1000) inside an IP packet of 40 bytes (from 198.51.100.7 to 203.0.113.10, time to live 64).
The packet received: the store decodes the 40 bytes and gets the same values back. Nothing in either header says who the sender really is: the source address is four bytes the sender writes itself.
"""
figure = "layers"
figure_title = "A TCP segment inside an IP packet"
figure_speech = """
The real output. [[slnc 300]] The packet sent: the segment, the header, and the same bytes in hex. [[slnc 400]] The packet received: the same values back. [[slnc 300]] And the source address is just a field.
"""
speech = """
Here is the real output. [[slnc 400]] First the section for the packet sent: the segment, the header, and the forty byte packet. [[slnc 300]] Then the same bytes in hex, two bytes per group. [[slnc 500]]
Then the section for the packet received: from, to, the SYN flag, and the sequence number. [[slnc 300]] All the same. [[slnc 400]] And the last line: the source address is just a field.
"""
rows = { layers = "active ok" }
console = [
    ["THE PACKET SENT (the customer's browser opens a connection):", "ok"],
    ["  TCP segment  20 bytes  ports 51000 -> 443, SYN, seq 1000", "muted"],
    ["  IP header    20 bytes  198.51.100.7 -> 203.0.113.10, TTL 64", "muted"],
    ["  IP packet    40 bytes  = IP header + TCP segment", "muted"],
    ["  ip   4500 0028 0000 0000 4006 148b c633 6407 cb00 710a", "muted"],
    ["  tcp  c738 01bb 0000 03e8 0000 0000 5002 ffff 7cc1 0000", "muted"],
    ["THE PACKET RECEIVED (the shop decodes the 40 bytes):", "bad"],
    ["  from  198.51.100.7 port 51000", "muted"],
    ["  to    203.0.113.10 port 443", "muted"],
    ["  SYN flag true, sequence number 1000", "muted"],
    ["the source address is just a field  <- ANYONE CAN WRITE IT", "bad"],
]

[[act]]
title = "A checksum catches accidents, not attackers"
summary = "The IP header checksum is made in three steps (add, fold, flip); a changed byte is refused, but the same change with a recomputed checksum is accepted, because the checksum has no key."
detail = """
The checksum is made from the header with its checksum field set to 0000: add the ten 16-bit words (2eb72), fold the overflow back in (eb72 + 2 = eb74), and flip every bit (ffff - eb74 = 148b).
Before the change the packet is accepted. After the time to live is changed from 64 to 1, the packet with the old checksum is refused, but an attacker who redoes the three steps writes 538b and the packet is accepted.
The checksum has no key, so it is no protection against an attacker.
"""
figure = "checksum_steps"
figure_title = "How the checksum is made, and who can make it"
figure_speech = """
The program prints the same steps: the words, the sum, the fold, and the flip. [[slnc 400]]
Before the change: accepted. [[slnc 300]] After the change: refused by accident, accepted from the attacker.
"""
speech = """
The program prints the same steps. [[slnc 300]] The ten words, the sum, the fold, and the flip. [[slnc 500]]
Then the section before the change: accepted. [[slnc 300]] And the section after the change: refused by accident, but accepted from the attacker. [[slnc 400]] A checksum catches accidents, not attackers.
"""
rows = { checksum = "active amber" }
console = [
    ["HOW THE CHECKSUM IS MADE (IP header, checksum field 0000):", "amber"],
    ["  words  4500 0028 0000 0000 4006 0000 c633 6407 cb00 710a", "muted"],
    ["  sum    2eb72 (hex)", "muted"],
    ["  fold   eb72 + 2 = eb74", "muted"],
    ["  flip   ffff - eb74 = 148b  <- the checksum", "muted"],
    ["BEFORE THE CHANGE (as the customer sent it):", "ok"],
    ["  time to live 64, checksum 148b: accepted", "muted"],
    ["AFTER THE CHANGE (time to live 64 -> 1 on the way):", "bad"],
    ["  by accident, checksum kept 148b: refused", "muted"],
    ["  by an attacker, new checksum 538b: accepted  <- NOT CAUGHT", "bad"],
    ["the checksum has no key, so anyone can make it match", "muted"],
]

[[act]]
title = "The three-way handshake"
summary = "SYN with sequence 1000; SYN-ACK with the shop's own number, acknowledging 1001, and one half-open entry; ACK with the shop's number + 1 establishes the connection. An ACK with no SYN before it is refused."
detail = """
The request: the customer sends SYN with sequence number 1000. The response: the store answers SYN-ACK with its own sequence number, 3120261316, and acknowledges 1001, the customer's number plus one; it now holds one half-open entry.
The request: the customer answers ACK with 3120261317, the store's number plus one, which proves it saw the SYN-ACK. The result: the connection is established and no half-open entries are left. An ACK with no SYN before it establishes nothing.
"""
figure = "handshake"
figure_title = "SYN, SYN-ACK, ACK with the real numbers"
figure_speech = """
The same in sections. [[slnc 300]] SYN, then SYN ACK with one half open entry, then ACK. [[slnc 400]]
The result: established, no entries left. [[slnc 300]] And an ACK with no SYN before it establishes nothing.
"""
speech = """
The output, in sections. [[slnc 300]] The request: SYN, sequence one thousand. [[slnc 300]] The response: SYN ACK, acknowledging one thousand and one, with one half open entry. [[slnc 300]] The request: ACK, with the shop's number plus one. [[slnc 400]]
The result: established, and no entries left. [[slnc 300]] And an ACK with no SYN before it establishes nothing.
"""
rows = { handshake = "active ok" }
console = [
    ["THE REQUEST (customer -> shop):", "ok"],
    ["  1. SYN      seq 1000", "muted"],
    ["THE RESPONSE (shop -> customer):", "bad"],
    ["  2. SYN-ACK  seq 3120261316, ack 1001 (= 1000 + 1)", "muted"],
    ["     half-open entries in the shop's table: 1", "muted"],
    ["THE REQUEST (customer -> shop):", "ok"],
    ["  3. ACK      seq 1001, ack 3120261317 (= 3120261316 + 1)", "muted"],
    ["THE RESULT:", "ok"],
    ["  established: true, half-open entries left: 0", "muted"],
    ["  an ACK with no SYN before it: established: false", "muted"],
]

[[act]]
title = "A SYN flood"
summary = "Eight SYNs that never answer fill a table of eight, so a real customer is not answered; with SYN cookies the store keeps no entry, its sequence number is an HMAC of the connection, and the customer connects."
detail = """
Before the fix: eight SYNs from addresses that never answer fill the store's table of eight half-open entries, and a real customer's SYN is not answered: the store is denying service to its customers.
After the fix, SYN cookies: the store keeps no entry. Its sequence number, the cookie, is an HMAC of a secret, the customer's address, port and sequence number: 1053972776. The ACK brings 1053972777, the cookie plus one, the store recomputes the HMAC, and the customer connects.
The cost: a cookie carries only a few TCP options, such as the maximum segment size, and every SYN costs a hash, so cookies are switched on when the table is full.
"""
figure = "flood"
figure_title = "A full table, and the SYN cookie that needs none"
figure_speech = """
Before the fix: eight of eight entries, and the customer is not answered. [[slnc 400]] After the fix: no entries, the cookie, and the cookie plus one. [[slnc 300]] The cost: fewer T C P options, and a hash for every SYN.
"""
speech = """
The output shows both sections. [[slnc 300]] Before the fix: eight SYNs, eight of eight entries, and the real customer is not answered. [[slnc 400]] After the fix: no entries, the cookie, and the ACK bringing the cookie plus one. [[slnc 400]] The cost: a cookie carries only a few T C P options, and every SYN costs a hash.
"""
rows = { flood = "active wrong" }
console = [
    ["BEFORE THE FIX (a table of 8 half-open entries):", "bad"],
    ["  8 SYNs from 100.64.0.1 to 100.64.0.8, never answered", "muted"],
    ["  half-open entries: 8 of 8, the table is full", "muted"],
    ["  a real customer's SYN answered: false  <- DENIAL OF SERVICE", "bad"],
    ["AFTER THE FIX (SYN cookies):", "ok"],
    ["  the same 8 SYNs: half-open entries 0", "muted"],
    ["  cookie = HMAC(secret, 198.51.100.7, 51000, 1000)", "muted"],
    ["         = 1053972776, sent as the SYN-ACK's seq", "muted"],
    ["  the ACK brings 1053972777 = cookie + 1: connects true", "muted"],
    ["the cost: few TCP options, and a hash for every SYN", "muted"],
]

[[act]]
title = "Guessable numbers, and a stream anyone can read"
summary = "With a counter that adds 64000 the attacker guesses the admin's number and forges a connection; with a keyed hash the guess misses; and a real connection shows the card number to anyone watching."
detail = """
Before the fix, the store picks its sequence numbers with a counter that adds 64000. The attacker connects as itself and sees 1000, guesses 65000 for the SYN-ACK sent to the admin machine 10.0.0.5, which it cannot see, and its forged ACK is accepted: a forged connection.
After the fix, a keyed hash (RFC 6528): the attacker sees 692804923 and guesses 692868923, but the store sent 1773183168, and the forgery fails.
On a real connection on this machine, the stream sent and what a sniffer on the wire sees are the same text, card number included: TCP delivers bytes reliably and in order, and hides nothing. Secrecy and identity come from TLS.
"""
figure = "guessing"
figure_title = "A counter can be guessed, and the stream can be read"
figure_speech = """
Before the fix: the attacker's number, its guess, and what the shop sent. They match. [[slnc 400]] After the fix: the guess misses.
[[page]]
A real connection: the stream sent, and what a sniffer sees. [[slnc 300]] The same bytes. [[slnc 300]] Secrecy and identity come from T L S, in a later module.
"""
speech = """
The program shows both sections. [[slnc 300]] Before the fix: the attacker's own number, its guess, and what the shop really sent. [[slnc 300]] They match, so the connection is forged. [[slnc 400]] After the fix: the guess misses, and the forgery fails.
[[page]]
Then a real T C P connection on this machine. [[slnc 300]] The stream sent: a card number and an order. [[slnc 300]] What a sniffer sees: the very same bytes. [[slnc 400]] Secrecy and identity come from T L S, in a later module.
"""
rows = { numbers = "active wrong", stream = "active amber" }
console = [
    ["BEFORE THE FIX (a counter that adds 64000):", "bad"],
    ["  the attacker's own SYN-ACK seq:     1000", "muted"],
    ["  its guess for the admin (+ 64000):  65000", "muted"],
    ["  what the shop really sent 10.0.0.5: 65000", "muted"],
    ["  forged ACK accepted: true  <- A FORGED CONNECTION", "bad"],
    ["AFTER THE FIX (a keyed hash, RFC 6528):", "ok"],
    ["  the attacker's own SYN-ACK seq:     692804923", "muted"],
    ["  its guess for the admin (+ 64000):  692868923", "muted"],
    ["  what the shop really sent 10.0.0.5: 1773183168", "muted"],
    ["  forged ACK accepted: false", "muted"],
    ["---", ""],
    ["THE STREAM SENT (a real connection on this machine):", "ok"],
    ["  card=4111111111111111&order=A-1001", "muted"],
    ["  connected true, the shop received every byte: true", "muted"],
    ["WHAT A SNIFFER ON THE WIRE SEES:", "bad"],
    ["  card=4111111111111111&order=A-1001", "muted"],
    ["  contains the card number: true  <- TCP HIDES NOTHING", "bad"],
    ["secrecy and identity come from TLS", "muted"],
]

