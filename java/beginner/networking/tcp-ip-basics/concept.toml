[poster]
headline = [["TCP/IP BASICS", "text"], ["FOR SECURITY", "accent"]]
taglines = [["Every attack on the network starts with how packets really work", "gold"]]
before = { code = "trust the source address", note = "any sender can write it", tag = "BEFORE" }
after = { code = "keyed numbers + TLS", note = "unguessable, and private", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "TCP/IP Basics for Security"
narration = """Hello, and welcome. [[slnc 400]] This video explains T C P I P basics for security, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] I P, the Internet Protocol, moves packets from one address to another. [[slnc 300]] T C P, the Transmission Control Protocol, turns them into a reliable stream of bytes. [[slnc 600]] Think of the post. [[slnc 300]] Any envelope can carry any return address. [[slnc 600]] The domain is an online store. [[slnc 400]] You will see what a packet contains, why a checksum is no protection, how a flood works and is stopped, and why T C P hides nothing."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online store accepts connections.", "", "Anyone can send it packets,", "claiming any source address,", "many at a time,", "and watch the traffic go by."]
narration = """Here is the scenario. [[slnc 400]] An online store accepts connections from customers over the internet. [[slnc 500]] Anyone can send it packets. [[slnc 300]] Claiming any source address. [[slnc 300]] Many at a time. [[slnc 300]] And anyone on the path can watch the traffic go by."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["Packet: a unit of data with addresses", "Segment: TCP's unit, with ports and numbers", "SYN, ACK: flags used to start a connection", "Sequence number: counts bytes in the stream", "Backlog: the table of half-finished handshakes"]
narration = """The words. [[slnc 400]] A packet is data with a source and a destination address. [[slnc 300]] A segment is T C P's unit, with ports and numbers. [[slnc 300]] SYN and ACK are flags that start a connection. [[slnc 300]] A sequence number counts bytes in the stream. [[slnc 300]] And the backlog is the table of unfinished handshakes."""

[[scene]]
key = "03-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "04-packet"
kind = "figure"
title = "One real packet, byte by byte"
body = "packet_bytes"
narration = """Here is one real packet, byte by byte: the first one the customer's browser sends. [[slnc 300]] Forty bytes. [[slnc 500]] The top row is the I P header. [[slnc 300]] Four five means version four. [[slnc 200]] Then the length, forty, the time to live, sixty four, and protocol six, which means T C P is inside. [[slnc 300]] Then a checksum, and two addresses of four bytes each. [[slnc 300]] C six is one ninety eight, three three is fifty one, and so on. [[slnc 500]] The bottom row is the T C P header: the ports, the sequence number one thousand, and the flags byte, zero two, which means SYN. [[slnc 500]] The source address, in red, is four bytes the sender writes itself. [[slnc 300]] Nothing proves them."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "09-ladder"
kind = "bullets"
title = "What TCP/IP Gives, and Does Not"
body = ["Gives: delivery, order, retries", "Does not give: who sent it", "Does not give: that it was not changed", "Does not give: that nobody read it", "Those come from TLS and keys."]
narration = """Side by side. [[slnc 400]] T C P I P gives delivery, order, and retries. [[slnc 400]] It does not say who sent a packet, that it was not changed, or that nobody read it. [[slnc 400]] Those come from T L S, and keys."""

[[scene]]
key = "11-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["ss and netstat: SYN_RECV", "tcpdump and Wireshark", "tcp_syncookies in kernel settings", "Denial-of-service news"]
narration = """You have met this already. [[slnc 400]] ss and netstat show states such as SYN received. [[slnc 300]] tcpdump and Wireshark show packets and flags. [[slnc 300]] The kernel setting tcp syncookies turns the defence on. [[slnc 300]] And denial of service news often starts with a flood."""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Let the operating system defend", "Rate-limit and filter at the edge", "Never trust a source address", "Never trust a stream to be private: use TLS"]
narration = """So, how do you use it? [[slnc 400]] Let the operating system's defences do their work: SYN cookies, and keyed sequence numbers. [[slnc 500]] Rate limit and filter at the edge. [[slnc 500]] Never treat a source address as proof of identity. [[slnc 500]] And never treat a connection as private. Use T L S."""

[[scene]]
key = "13-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "13-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Change the table size", "and find when a real customer gets in."]
narration = """That's T C P I P basics for security. [[slnc 400]] Remember this. [[slnc 300]] T C P delivers bytes reliably, but it does not say who sent them, and it does not hide them. [[slnc 500]] The source, notes, diagrams and an animated walkthrough are in the repository, and run with just a Java development kit. [[slnc 400]] Try this: change the table size, and find when a real customer gets in. [[slnc 500]] If this helped, a like and a subscribe really help the channel. [[slnc 400]] Thanks for watching!"""


[threatmodel]
scope = """
An online store's web server accepting TCP connections: the packets it receives, the handshake that starts a connection, the table that remembers half-finished handshakes, the sequence numbers it chooses and the stream that follows.
It covers an attacker who can send packets with any source address and can watch the path. It does not cover the web application on top, names, or encryption.
"""
assets = [
    "The server's ability to accept connections (availability).",
    "The identity attached to a connection, such as a trusted admin address.",
    "The content of the stream.",
    "The server's table of half-open connections.",
]
actors = [
    "Customers making real connections.",
    "An attacker who can send packets from any claimed address.",
    "An observer on the network path.",
]
boundaries = [
    "Internet to the store's server: every packet crosses it and none proves its sender.",
    "Server to its half-open table: the memory a flood fills.",
]
assumptions = [
    "The attacker cannot see replies sent to a spoofed address.",
    "The server's secret for sequence numbers and cookies is unpredictable.",
    "In the demo, addresses are documentation addresses and the secret is a fixed demo value.",
]
out_of_scope = [
    "Names and the web: the next projects.",
    "Encryption and certificates: the transport-security module.",
    "Network-level defences such as ingress filtering and load balancers.",
]
tests = [
    "`PacketsTest` checks the RFC 1071 checksum, packet round trips, and that any changed header byte is caught.",
    "`ListenerTest` checks the handshake, full tables, SYN cookies, guessable and keyed numbers, and a real connection.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next project, dns-basics, looks at how names become addresses, and how that answer too can be forged.
"""

[[threat]]
id = "T1"
stride = "S"
threat = "A packet claims a source address that is not the sender's"
where = "`Ipv4Packet`"
control = "None in the protocol; never use a source address as identity, and filter at the edge"
residual = "Identity needs keys: TLS and authentication"

[[threat]]
id = "T2"
stride = "D"
threat = "A SYN flood fills the table of half-open connections"
where = "`Listener.onSyn`"
control = "SYN cookies keep no state for a SYN"
residual = "Cookies carry only a few options and cost work, and a flood can still use up bandwidth"

[[threat]]
id = "T3"
stride = "S"
threat = "A connection is forged by guessing the server's sequence number"
where = "`SequenceNumbers`"
control = "A keyed hash of the connection and a counter, as in RFC 6528"
residual = "The secret must be unpredictable and replaced from time to time"

[[threat]]
id = "T4"
stride = "T"
threat = "A packet is changed on the path and its checksum recomputed"
where = "`Checksum`"
control = "None: the checksum has no key"
residual = "Integrity needs a keyed code or a signature, as in TLS"

[[threat]]
id = "T5"
stride = "I"
threat = "An observer reads the stream"
where = "`PlaintextTap`"
control = "None in TCP"
residual = "Encrypt the stream with TLS"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] Seven small classes. [[slnc 300]] Here is what each one does."""

[[class]]
name = "TcpIpDemo"
what = "runs the five acts"
[[class.part]]
title = "the five acts"
code = """
act1Layers(out);
act2ChecksumIsNotSecurity(out);
act3Handshake(out);
act4SynFlood(out);
act5GuessableNumbers(out);
"""
speech = """T C P I P demo runs the five acts, in order, and collects what they print. [[slnc 300]] A test compares that text with the expected output, so the video and the code always agree."""

[[class]]
name = "Ipv4Packet"
what = "the 20-byte IP header around the segment"
[[class.part]]
title = "encode, and the checksum check"
code = """
buffer.put((byte) 0x45).put((byte) 0)
        .putShort((short) (HEADER + payload.length));
...
buffer.put((byte) timeToLive).put((byte) TCP).putShort((short) 0);
buffer.putInt(source).putInt(destination);   // never proved
...
int checksum = Checksum.of(
        java.util.Arrays.copyOf(bytes, HEADER));
...
if (Checksum.sum(java.util.Arrays.copyOf(bytes, HEADER))
        != 0xffff) {
    throw new BadPacketException(
            "IPv4 header checksum does not match");
"""
speech = """I P v four packet writes the header byte by byte: four five, the length, the time to live, the protocol, and the two addresses. [[slnc 300]] The source address is simply written. [[slnc 300]] Then the checksum goes in. [[slnc 300]] When decoding, a header whose checksum does not add up is refused."""

[[class]]
name = "TcpSegment"
what = "ports, numbers and flags"
[[class.part]]
title = "the TCP header"
code = """
static final int SYN = 0x02;
...
static final int ACK = 0x10;
...
buffer.putShort((short) sourcePort).putShort((short) destinationPort);
buffer.putInt((int) sequence).putInt((int) acknowledgement);
buffer.put((byte) 0x50).put((byte) flags).putShort((short) window);
"""
speech = """T C P segment holds the flags, such as SYN and ACK, as bits in one byte. [[slnc 300]] It writes the two ports, the sequence number, the acknowledgement number, and the flags."""

[[class]]
name = "Checksum"
what = "the RFC 1071 checksum, step by step"
[[class.part]]
title = "add, fold, flip"
code = """
for (int word : words(data)) {
    total += word;                                   // 1. add
...
while ((total >> 16) != 0) {
    total = (total & 0xffff) + (total >> 16);        // 2. fold
...
return ~sum(data) & 0xffff;                          // 3. flip
"""
speech = """Checksum does the three steps from act two. [[slnc 300]] Add the sixteen bit words. [[slnc 200]] Fold the overflow back in. [[slnc 200]] Flip every bit. [[slnc 300]] There is no key anywhere, so anyone can run it."""

[[class]]
name = "Listener"
what = "the shop's side of the handshake"
[[class.part]]
title = "a SYN, and the table"
code = """
if (cookies) {
    return Optional.of(
            SequenceNumbers.mac(secret, address, port, clientSequence));
}
if (halfOpen.size() >= backlog) {
    return Optional.empty();        // the flood wins
}
long serverSequence = numbers.next(address, port);
halfOpen.put(key(address, port), serverSequence);
"""
speech = """Listener is the shop's handshake, as a state machine. [[slnc 300]] With cookies, a SYN gets a keyed number and no entry. [[slnc 300]] Without them, a full table drops the SYN, which is the flood. [[slnc 300]] Otherwise the shop picks its number and keeps a half open entry."""
[[class.part]]
title = "the final ACK"
code = """
Long serverSequence = halfOpen.get(key);
if (serverSequence != null
        && acknowledgement == ((serverSequence + 1) & 0xffffffffL)) {
    halfOpen.remove(key);
    established.add(key);
"""
speech = """The final ACK must bring the shop's number plus one. [[slnc 300]] Then the entry leaves the table, and the connection is established."""

[[class]]
name = "SequenceNumbers"
what = "a counter, or a keyed hash"
[[class.part]]
title = "guessable or not"
code = """
current = (current + step) & 0xffffffffL;            // guessable
...
Mac mac = Mac.getInstance("HmacSHA256");             // keyed
mac.init(new SecretKeySpec(secret, "HmacSHA256"));
byte[] out = mac.doFinal(ByteBuffer.allocate(16)
        .putInt(address).putInt(port).putLong(extra).array());
return ByteBuffer.wrap(out).getInt() & 0xffffffffL;
"""
speech = """Sequence numbers gives the shop its first number. [[slnc 300]] The counter adds a fixed step, which is why act five could guess it. [[slnc 300]] The keyed version is an H mac with S H A two five six over the addresses and ports, cut to thirty two bits. [[slnc 300]] Without the secret, nobody can predict it."""

[[class]]
name = "PlaintextTap"
what = "a real connection, and what the wire carries"
[[class.part]]
title = "send, and tap"
code = """
try (Socket client = new Socket(
        InetAddress.getLoopbackAddress(), server.getLocalPort())) {
...
    tap.write(data);                // what a sniffer sees
    out.write(data);
"""
speech = """Plaintext tap opens a real T C P connection on this machine. [[slnc 300]] The tap records exactly the bytes that are written to the wire. [[slnc 300]] They are the card number, as it is."""

