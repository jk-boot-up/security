narration = """Let's put it side by side. [[slnc 400]] T C P I P gives delivery, order, and retries. [[slnc 500]] It does not say who sent a packet. [[slnc 500]] It does not say that a packet was not changed on purpose. [[slnc 500]] It does not say that nobody read it. [[slnc 600]] Those come from T L S, and from keys, in the next modules."""

