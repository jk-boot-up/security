[[scene]]
key = "01-poster"
kind = "poster"
title = "TCP/IP Basics for Security"
narration = """Hello, and welcome. [[slnc 400]] This video explains T C P I P basics for security, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] I P moves packets from one address to another. [[slnc 300]] T C P turns those packets into a reliable stream of bytes. [[slnc 600]] Think of the postal system. [[slnc 300]] Any envelope can carry any return address. [[slnc 300]] A smudge check catches rain damage, not a forger. [[slnc 300]] And a shop that reserves a chair for every first letter can be emptied of chairs by thousands of fake ones. [[slnc 700]] In this video, the domain is an online store. [[slnc 500]] By the end, you will hear what a packet contains. [[slnc 300]] Why a checksum is not protection. [[slnc 300]] How a flood works, and how it is stopped. [[slnc 300]] And why T C P hides nothing."""

