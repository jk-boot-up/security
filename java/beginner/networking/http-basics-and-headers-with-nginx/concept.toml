[[act]]
title = "The inheritance trap"
summary = "The five headers are set once for the server, so GET / scores 5 of 5; /account adds its own Cache-Control header and scores 0 + 0 + 0 + 0 + 0 = 0 of 5; with the five repeated inside /account it scores 5 of 5."
detail = """
The five headers are set once, in the server block, and GET / scores 1 + 1 + 1 + 1 + 1 = 5 of 5. The /account location adds one header of its own, add_header Cache-Control "no-store" always;, so account pages are not kept in a cache.
nginx inherits add_header from the level above only when a level has no add_header of its own, so /account now has Cache-Control: no-store and none of the five: 0 + 0 + 0 + 0 + 0 = 0 of 5. With the five repeated inside /account, it scores 5 of 5 again.
The habit: audit every location, not just the top page.
"""
figure = "inheritance"
figure_title = "One add_header in a location drops all the others"
figure_speech = """
Here is a trap that catches experienced people. [[slnc 400]] At the top, in green, the configuration. [[slnc 300]] The five headers are set once, for the whole server. [[slnc 300]] Inside it, a location for slash account adds one header of its own: cache control, no store. [[slnc 300]] So account pages are never kept in a cache. [[slnc 600]]
Now the rule. [[slnc 300]] A location inherits the add header lines from above only if it has none of its own. [[slnc 300]] One add header is enough to drop all five. [[slnc 600]]
In red, the real answers. [[slnc 300]] The shop page: five out of five. [[slnc 300]] The account page: cache control is there, but the score is zero out of five. [[slnc 600]]
In green, after the fix: the five lines repeated inside slash account. [[slnc 300]] Five out of five again.
"""
speech = """
Here is the output. [[slnc 400]] The configuration, in short. [[slnc 300]] Then the answers: five out of five for the shop page, and zero for the account page, which has only its cache control header. [[slnc 400]] After the fix, the account page scores five out of five. [[slnc 300]] So audit every location, not only the top page.
"""
rows = { trap = "active wrong" }
console = [
    ["THE CONFIGURATION (the five headers set once, for the server):", "ok"],
    ["  server {", "muted"],
    ["    add_header Strict-Transport-Security ... always;", "muted"],
    ["    ... and the other four, the same way", "muted"],
    ["    location = /account {", "muted"],
    ["      add_header Cache-Control \"no-store\" always;", "muted"],
    ["THE RESPONSES:", "ok"],
    ["  GET /          1 + 1 + 1 + 1 + 1 = 5 of 5", "muted"],
    ["  GET /account   0 + 0 + 0 + 0 + 0 = 0 of 5  <- DROPPED", "muted"],
    ["                 Cache-Control: no-store", "muted"],
    ["its own add_header replaces every add_header of the server", "muted"],
    ["AFTER THE FIX (the five repeated inside /account):", "ok"],
    ["  GET /account   1 + 1 + 1 + 1 + 1 = 5 of 5", "muted"],
    ["the habit: audit every location, not just the top page", "muted"],
]

[[act]]
title = "Limits, and requests that are ambiguous"
summary = "With client_max_body_size 1k and large_client_header_buffers 2 1k (1k = 1024 bytes): a 100-byte body gets 200, a 2000-byte body 413, a 4007-character header line 400; Content-Length with Transfer-Encoding, and two different Content-Lengths, get 400."
detail = """
Two lines set the limits: client_max_body_size 1k; and large_client_header_buffers 2 1k;, where 1k is 1024 bytes. Five requests are sent as raw bytes. An order with a 100-byte body gets 200, because 100 <= 1024. One with a 2000-byte body gets 413, because 2000 > 1024.
A header line of 4007 characters (X-Pad: and 4000 x) gets 400, because a header line must fit one 1024-byte buffer. A request with Content-Length: 4 and Transfer-Encoding: chunked, two ways to say where the body ends, gets 400, and so does one with Content-Length: 4 and Content-Length: 5.
nginx refuses both ambiguous requests, so it cannot disagree with the application behind it about where a request ends, which is the idea behind request smuggling.
"""
figure = "limits"
figure_title = "Five requests against two limits and two rules"
figure_speech = """
A front door should also refuse what is too big, and what is unclear. [[slnc 400]] At the top, in green, two lines of configuration. [[slnc 300]] A body of at most one k, which is one thousand and twenty four bytes. [[slnc 300]] And header lines of at most one k. [[slnc 600]]
Below, five requests, and the real answers in red. [[slnc 300]] A body of one hundred bytes: under the limit, so two hundred. [[slnc 300]] A body of two thousand bytes: over the limit, so four one three, too large. [[slnc 300]] A header line of four thousand and seven characters: four hundred. [[slnc 600]]
The last two are ambiguous. [[slnc 300]] One gives a content length and also says chunked. [[slnc 300]] The other gives two different lengths. [[slnc 300]] A proxy and an application could each pick a different end of the request. [[slnc 300]] That gap is how request smuggling works. [[slnc 300]] nginx refuses both with four hundred.
"""
speech = """
Here is the output. [[slnc 400]] The two limits, where one k is one thousand and twenty four bytes. [[slnc 300]] Then the five requests, a to e.
[[page]]
And the five answers. [[slnc 300]] Two hundred for the small body. [[slnc 300]] Four one three for the big body. [[slnc 300]] Four hundred for the long header line. [[slnc 300]] And four hundred for both ambiguous requests.
"""
rows = { limits = "active ok" }
console = [
    ["THE CONFIGURATION:", "ok"],
    ["  client_max_body_size 1k;           1k = 1024 bytes", "muted"],
    ["  large_client_header_buffers 2 1k;  per header line", "muted"],
    ["THE REQUESTS (sent as raw bytes):", "ok"],
    ["  a  an order with a body of 100 bytes", "muted"],
    ["  b  an order with a body of 2000 bytes", "muted"],
    ["  c  one header line of 4007 characters", "muted"],
    ["  d  Content-Length: 4 and Transfer-Encoding: chunked", "muted"],
    ["  e  Content-Length: 4 and Content-Length: 5", "muted"],
    ["---", ""],
    ["THE RESPONSES:", "ok"],
    ["  a  200  100 <= 1024 bytes: accepted", "muted"],
    ["  b  413  2000 > 1024 bytes: the body is too large", "muted"],
    ["  c  400  4007 > 1024: the line fits no buffer", "muted"],
    ["  d  400  two ways to say where the body ends", "muted"],
    ["  e  400  two different lengths", "muted"],
    ["nginx refuses d and e, so it cannot disagree with the", "muted"],
    ["application behind it about where a request ends", "muted"],
]

[[act]]
title = "Hiding what the application gives away, and the bill"
summary = "Through nginx the application gives away Server: nginx/1.31.7, X-Powered-By: PHP/5.6.40 and X-AspNet-Version: 4.0.30319; with proxy_hide_header and server_tokens off only Server: nginx is left."
detail = """
The application behind nginx sends X-Powered-By: PHP/5.6.40 and X-AspNet-Version: 4.0.30319, and nginx itself says Server: nginx/1.31.7: three exact versions, and old versions have known holes. With proxy_hide_header for the two application headers and server_tokens off, both are hidden and Server says just nginx.
Hiding is a speed bump, not a lock: the real fix is to keep the software up to date. And the bill: the configuration is easy to get subtly wrong, so test it, and a Content-Security-Policy still has to match the real site.
"""
figure = "hide_upstream"
figure_title = "The application's headers, passed on and then hidden"
figure_speech = """
nginx usually passes requests on to an application behind it. [[slnc 400]] On the left, the application. [[slnc 300]] It adds two headers that give away its technology: X powered by, P H P five point six point forty. [[slnc 300]] And X, A S P net version. [[slnc 600]]
In red, the response as it comes. [[slnc 300]] nginx passes both on, and adds its own exact version. [[slnc 300]] Three version numbers, all old, all with known holes. [[slnc 600]]
In green, after the fix. [[slnc 300]] Proxy hide header removes the two application headers. [[slnc 300]] Server tokens off removes the nginx version. [[slnc 600]]
In amber, the honest part. [[slnc 300]] Hiding is a speed bump, not a lock. [[slnc 300]] Attackers can still guess. [[slnc 300]] The real fix is to keep the software up to date.
"""
speech = """
Here is the output. [[slnc 400]] The response as it comes: three exact versions. [[slnc 300]] After the fix: the server says only nginx, and the two application headers are hidden. [[slnc 400]] And the bill: test the configuration, and write a content security policy that matches the real site.
"""
rows = { upstream = "active amber" }
console = [
    ["THE RESPONSE (the application's headers, passed on by nginx):", "ok"],
    ["  Server            nginx/1.31.7", "muted"],
    ["  X-Powered-By      PHP/5.6.40", "muted"],
    ["  X-AspNet-Version  4.0.30319", "muted"],
    ["AFTER THE FIX (proxy_hide_header, server_tokens off):", "ok"],
    ["  Server            nginx", "muted"],
    ["  X-Powered-By      hidden", "muted"],
    ["  X-AspNet-Version  hidden", "muted"],
    ["hiding is a speed bump, not a lock: the real fix is to keep", "muted"],
    ["the software up to date", "muted"],
    ["THE BILL:", "ok"],
    ["  the configuration is easy to get subtly wrong: test it", "muted"],
    ["  a Content-Security-Policy still has to match the real site", "muted"],
]

