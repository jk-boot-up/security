[[act]]
title = "add_header, and the word always"
summary = "The five headers added without always: GET / scores 1 + 1 + 1 + 1 + 1 = 5 of 5 but the 404 page 0 + 0 + 0 + 0 + 0 = 0 of 5; with always both score 5 of 5, and server_tokens off leaves Server: nginx."
detail = """
nginx adds a header with add_header, for example add_header X-Frame-Options "DENY";. The store adds the five security headers this way: Strict-Transport-Security max-age=31536000; includeSubDomains, Content-Security-Policy default-src 'self', X-Content-Type-Options nosniff, X-Frame-Options DENY and Referrer-Policy no-referrer.
Without the word always, nginx adds them only to answers such as 200, 201, 204, 206, 301, 302, 303, 304, 307 and 308: GET / scores 5 of 5, but GET /missing, a 404 page, scores 0 + 0 + 0 + 0 + 0 = 0 of 5. With always on each line both pages score 1 + 1 + 1 + 1 + 1 = 5 of 5.
With server_tokens off, the Server header is just nginx, without the version.
"""
figure = "always"
figure_title = "Four requests: a page and a 404, without and with always"
figure_speech = """
The fix for the missing headers is the directive add header. [[slnc 400]] At the top, in green, the five headers the store adds, each with its value. [[slnc 600]]
Each one can be written in two ways. [[slnc 300]] Without the word always, or with it. [[slnc 500]]
Below, in red, four real requests. [[slnc 300]] Without always, the shop page scores five out of five. [[slnc 300]] But a page that does not exist, a four oh four, scores zero. [[slnc 300]] nginx adds those headers only to successful answers and redirects. [[slnc 300]] Error pages are left bare, and error pages can be framed or sniffed too. [[slnc 600]]
With always, both pages score five out of five. [[slnc 500]]
So write always at the end of every security header.
"""
speech = """
Here is the output. [[slnc 400]] First, the five headers with their values. [[slnc 300]] Then the two ways of writing one of them: without always, and with always.
[[page]]
Then the four responses, with the points added up. [[slnc 300]] Without always, the page scores five, and the four oh four page scores zero. [[slnc 300]] With always, both score five. [[slnc 400]] And with server tokens off, the server header is just nginx, without the version.
"""
