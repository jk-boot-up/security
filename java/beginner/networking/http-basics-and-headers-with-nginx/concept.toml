[poster]
headline = [["HTTP HEADERS", "text"], ["WITH NGINX", "accent"]]
taglines = [["The front door sets the headers, and one directive can undo them", "gold"]]
before = { code = "add_header X ...;", note = "gone from error pages", tag = "BEFORE" }
after = { code = "add_header X ... always;", note = "audited in every location", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "HTTP Basics and Security Headers with nginx"
narration = """Hello, and welcome. [[slnc 400]] This video explains security headers with nginx, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] Web pages travel over H T T P, the HyperText Transfer Protocol. [[slnc 300]] First, a simple definition. [[slnc 300]] A security header is a line in a web reply that tells the browser how to treat the page. [[slnc 300]] And nginx is the web server that very often sets them. [[slnc 600]] Think of a doorman who hands every visitor the house rules on the way in. [[slnc 300]] If he hands them out only to guests who arrive properly, a visitor turned away at the side gate never gets them. [[slnc 300]] And if each side room has its own notice board, the main rules are not copied there. [[slnc 700]] In this video, the domain is an online store. [[slnc 500]] By the end, you will hear what the word always does. [[slnc 300]] How one directive drops all the others. [[slnc 300]] Which requests nginx refuses. [[slnc 300]] And why hiding a version is not a defence."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online store runs behind nginx.", "", "The headers, the limits and the", "treatment of odd requests", "are decided in nginx's configuration,", "which few people test."]
narration = """Here is the scenario. [[slnc 400]] An online store runs its application behind nginx. [[slnc 500]] The headers, the limits, and the treatment of odd requests are all decided in the nginx configuration. [[slnc 600]] And few people test it."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["add_header: adds a header to the reply", "always: even to error pages", "server_tokens off: hides the version", "proxy_hide_header: drops the app's header", "Smuggling: two readings of one request"]
narration = """Before the demos, the words. [[slnc 500]] add header adds a header to the reply. [[slnc 500]] always means, even to error pages. [[slnc 500]] server tokens off hides the version number. [[slnc 500]] proxy hide header drops a header that the application sent. [[slnc 500]] And smuggling means a request that two programs read in two different ways."""

[[scene]]
key = "03-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "04-door"
kind = "figure"
title = "nginx at the front door, writing the headers"
body = "front_door"
narration = """Let's see where nginx sits. [[slnc 400]] On the left, the customer's browser. [[slnc 300]] In the middle, nginx, the front door of the store. [[slnc 300]] On the right, the store's application. [[slnc 500]] Every request passes through nginx, and every response passes back through it. [[slnc 300]] So nginx is the one place that can add the same headers to every page. [[slnc 600]] Below, the five lines the store writes in the nginx configuration. [[slnc 300]] Each one is add header, a name, and a value. [[slnc 300]] Strict transport security for one year. [[slnc 300]] A content security policy: only this site. [[slnc 300]] No sniff. [[slnc 300]] Deny framing. [[slnc 300]] And no referrer. [[slnc 600]] The application does not change at all. [[slnc 300]] But one small word, or one extra line, decides whether the headers really arrive. [[slnc 300]] The demos show how."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "09-ladder"
kind = "bullets"
title = "Three Traps in add_header"
body = ["Without always: error pages go bare", "A nested add_header: drops the rest", "Hiding a version: a speed bump only", "Audit every location, and error pages"]
narration = """Let's put it side by side. [[slnc 400]] Without the word always, error pages go out bare. [[slnc 500]] A nested add header drops the rest from the level above. [[slnc 500]] Hiding a version is a speed bump, and not a lock. [[slnc 600]] So audit every location, and the error pages too."""

[[scene]]
key = "11-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["add_header lines in every nginx config", "Header scanners with letter grades", "proxy_hide_header X-Powered-By", "Request smuggling advisories"]
narration = """You have probably met this already. [[slnc 400]] Add header lines are in almost every nginx configuration. [[slnc 500]] Header scanners give a site a letter grade. [[slnc 500]] proxy hide header X powered by is in many hardening guides. [[slnc 500]] And request smuggling advisories describe exactly the ambiguity that nginx refuses."""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Five headers, each with always", "server_tokens off", "Repeat them where a location adds its own", "Set size limits", "Test every location and an error page"]
narration = """So, how do you use it? [[slnc 400]] Set the five headers, each with always. [[slnc 500]] Turn server tokens off. [[slnc 500]] Repeat the headers wherever a location adds its own. [[slnc 500]] Set sensible size limits. [[slnc 500]] And test every location, and an error page, with an auditor."""

[[scene]]
key = "13-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "13-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a static location", "and see which headers it keeps."]
narration = """That's security headers with nginx. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] A header is only worth what the weakest location serves, so audit every location and every error page. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine, with a Java development kit and Docker. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a static location, and see which headers it keeps. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
The configuration of an nginx reverse proxy in front of an online store's application: the security headers it sets, the limits on request sizes, the treatment of ambiguous requests, and the headers it passes along from the application. It does not cover TLS, the application's own code, or nginx itself being compromised.
"""
assets = [
    "The browser protections that the headers switch on, such as HSTS and the content security policy.",
    "The agreement between nginx and the application about where each request ends.",
    "The application's technology and version, which help an attacker choose an attack.",
    "The server's resources, which oversize requests would use.",
]
actors = [
    "Customers' browsers, which obey the headers.",
    "An attacker who sends malformed, ambiguous or oversize requests and reads replies.",
    "The administrator who writes and changes the configuration.",
]
boundaries = [
    "Internet to nginx: every request crosses it.",
    "nginx to the application: only requests that nginx accepts cross it.",
    "Configuration file to the running server: a mistake in the file is a mistake in production.",
]
assumptions = [
    "nginx and Docker are up to date.",
    "The configuration is under version control and reviewed.",
    "In the demo, the application is a stub inside the same nginx, and its leaked versions are fake.",
]
out_of_scope = [
    "TLS settings and certificates: the transport-security module.",
    "A web application firewall.",
    "The application's own vulnerabilities.",
]
tests = [
    "`ConfigAndAuditTest` checks each configuration's directives, the auditor and the reply parser, without Docker.",
    "`NginxContainerTest` (integration) starts real nginx containers and checks the headers on pages and error pages, the inheritance trap, the limits, the ambiguous requests, the hidden headers and that no container is left behind.",
    "`ReferenceConfigTest` checks the written-out configuration is what the code generates.",
]
next = """
The next module, transport-security, looks at how connections are protected with TLS, certificates and HTTPS.
"""

[[threat]]
id = "T1"
stride = "T"
threat = "A header is missing from error pages or from a location, so a browser protection is off where it matters"
where = "`NginxConfig`, `HeaderAudit`"
control = "always on every add_header, headers repeated in each location that adds its own, and an audit of every location and an error page"
residual = "A new location added later can lose the headers again, so the audit must run in the build"

[[threat]]
id = "T2"
stride = "T"
threat = "The configuration is changed by mistake and nobody notices because the page still works"
where = "`nginx.conf`"
control = "Configuration in version control, with tests that fetch pages and check the headers"
residual = "Tests cover only the locations they request"

[[threat]]
id = "T3"
stride = "T"
threat = "Request smuggling: nginx and the application disagree about where a request ends"
where = "nginx request parsing"
control = "nginx refuses Content-Length together with Transfer-Encoding, and conflicting Content-Length headers (400)"
residual = "Keep nginx and the application server up to date, because their parsers must keep agreeing"

[[threat]]
id = "T4"
stride = "D"
threat = "Oversize bodies or header lines use up server resources"
where = "`client_max_body_size`, `large_client_header_buffers`"
control = "Limits on body size and header buffers answer 413 and 400"
residual = "The limits must be tuned to real uploads, and a flood of small requests needs rate limits as well"

[[threat]]
id = "T5"
stride = "I"
threat = "The application's technology and version are revealed in headers, helping an attacker pick an attack"
where = "`proxy_hide_header`, `server_tokens`"
control = "Hide X-Powered-By, X-AspNet-Version and the nginx version"
residual = "Hiding is a speed bump: fingerprinting still works, so keep the software up to date"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] Four small classes, plus the demo that runs the five acts against real nginx containers. [[slnc 300]] Here is what each one does."""

[[class]]
name = "NginxConfig"
what = "writes the nginx configuration for each version of the front door"
[[class.part]]
title = "the five headers, each with always"
code = """
new String[] {"Strict-Transport-Security", "max-age=31536000; includeSubDomains"},
new String[] {"Content-Security-Policy", "default-src 'self'"},
...
text.append(indent).append("add_header ").append(header[0])
        .append(" \\\"").append(header[1]).append("\\\" always;\\n");
"""
speech = """Nginx config holds the five headers and their values. [[slnc 300]] It writes one add header line for each, ending with always. [[slnc 300]] Each act asks it for one variant: bare, without always, the inheritance trap, the limits, or the proxy."""

[[class]]
name = "Nginx"
what = "runs one configuration in a real nginx container"
[[class.part]]
title = "a pinned image on a free local port"
code = """
public static final String IMAGE = "nginx:1.31.7-alpine";
...
run(List.of("docker", "run", "-d", "--rm", "--name", name, "-p", "127.0.0.1::80",
"""
speech = """The nginx class starts a real container from a pinned image, so every run uses the same version. [[slnc 300]] It publishes port eighty on a free port of this machine only, and stops the container when the act is done."""

[[class]]
name = "Probe"
what = "sends raw bytes and reads the whole answer"
[[class.part]]
title = "requests a normal client would never send"
code = """
socket.getOutputStream().write(raw.getBytes(StandardCharsets.ISO_8859_1));
...
return parse(socket.getInputStream().readAllBytes());
"""
speech = """The probe writes a request to a socket as raw bytes. [[slnc 300]] That is how the demo sends a header line of four thousand characters, or two different content lengths, which a normal client would refuse to send."""

[[class]]
name = "HeaderAudit"
what = "one point per security header, judged by its value"
[[class.part]]
title = "a header is only worth its value"
code = """
findings.add(hsts(h.get("strict-transport-security")));
findings.add(csp(h.get("content-security-policy")));
"""
speech = """The header audit gives one point for each of the five headers. [[slnc 300]] It judges the value, not only the name, so a header with a weak value scores zero."""

