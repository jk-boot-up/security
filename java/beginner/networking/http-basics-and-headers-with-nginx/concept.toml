[[scene]]
key = "01-poster"
kind = "poster"
title = "HTTP Basics and Security Headers with nginx"
narration = """Hello, and welcome. [[slnc 400]] This video explains security headers with nginx, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A security header is a line in a web reply that tells the browser how to treat the page. [[slnc 300]] And nginx is the web server that very often sets them. [[slnc 600]] Think of a doorman who hands every visitor the house rules on the way in. [[slnc 300]] If he hands them out only to guests who arrive properly, a visitor turned away at the side gate never gets them. [[slnc 300]] And if each side room has its own notice board, the main rules are not copied there. [[slnc 700]] In this video, the domain is an online store. [[slnc 500]] By the end, you will hear what the word always does. [[slnc 300]] How one directive drops all the others. [[slnc 300]] Which requests nginx refuses. [[slnc 300]] And why hiding a version is not a defence."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online store runs behind nginx.", "", "The headers, the limits and the", "treatment of odd requests", "are decided in nginx's configuration,", "which few people test."]
narration = """Here is the scenario. [[slnc 400]] An online store runs its application behind nginx. [[slnc 500]] The headers, the limits, and the treatment of odd requests are all decided in the nginx configuration. [[slnc 600]] And few people test it."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["add_header: adds a header to the reply", "always: even to error pages", "server_tokens off: hides the version", "proxy_hide_header: drops the app's header", "Smuggling: two readings of one request"]
narration = """Before the demos, the words. [[slnc 500]] add header adds a header to the reply. [[slnc 500]] always means, even to error pages. [[slnc 500]] server tokens off hides the version number. [[slnc 500]] proxy hide header drops a header that the application sent. [[slnc 500]] And smuggling means a request that two programs read in two different ways."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "09-ladder"
kind = "bullets"
title = "Three Traps in add_header"
body = ["Without always: error pages go bare", "A nested add_header: drops the rest", "Hiding a version: a speed bump only", "Audit every location, and error pages"]
narration = """Let's put it side by side. [[slnc 400]] Without the word always, error pages go out bare. [[slnc 500]] A nested add header drops the rest from the level above. [[slnc 500]] Hiding a version is a speed bump, and not a lock. [[slnc 600]] So audit every location, and the error pages too."""

[[scene]]
