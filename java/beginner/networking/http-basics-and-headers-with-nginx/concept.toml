[[scene]]
key = "11-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["add_header lines in every nginx config", "Header scanners with letter grades", "proxy_hide_header X-Powered-By", "Request smuggling advisories"]
narration = """You have probably met this already. [[slnc 400]] Add header lines are in almost every nginx configuration. [[slnc 500]] Header scanners give a site a letter grade. [[slnc 500]] proxy hide header X powered by is in many hardening guides. [[slnc 500]] And request smuggling advisories describe exactly the ambiguity that nginx refuses."""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Five headers, each with always", "server_tokens off", "Repeat them where a location adds its own", "Set size limits", "Test every location and an error page"]
narration = """So, how do you use it? [[slnc 400]] Set the five headers, each with always. [[slnc 500]] Turn server tokens off. [[slnc 500]] Repeat the headers wherever a location adds its own. [[slnc 500]] Set sensible size limits. [[slnc 500]] And test every location, and an error page, with an auditor."""

[[scene]]
key = "13-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a static location", "and see which headers it keeps."]
narration = """That's security headers with nginx. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] A header is only worth what the weakest location serves, so audit every location and every error page. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine, with a Java development kit and Docker. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a static location, and see which headers it keeps. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
The configuration of an nginx reverse proxy in front of an online store's application: the security headers it sets, the limits on request sizes, the treatment of ambiguous requests, and the headers it passes along from the application. It does not cover TLS, the application's own code, or nginx itself being compromised.
"""
assets = [
    "The browser protections that the headers switch on, such as HSTS and the content security policy.",
    "The agreement between nginx and the application about where each request ends.",
    "The application's technology and version, which help an attacker choose an attack.",
    "The server's resources, which oversize requests would use.",
]
actors = [
    "Customers' browsers, which obey the headers.",
    "An attacker who sends malformed, ambiguous or oversize requests and reads replies.",
    "The administrator who writes and changes the configuration.",
]
boundaries = [
    "Internet to nginx: every request crosses it.",
    "nginx to the application: only requests that nginx accepts cross it.",
    "Configuration file to the running server: a mistake in the file is a mistake in production.",
]
assumptions = [
    "nginx and Docker are up to date.",
    "The configuration is under version control and reviewed.",
    "In the demo, the application is a stub inside the same nginx, and its leaked versions are fake.",
]
out_of_scope = [
    "TLS settings and certificates: the transport-security module.",
    "A web application firewall.",
    "The application's own vulnerabilities.",
]
tests = [
    "`ConfigAndAuditTest` checks each configuration's directives, the auditor and the reply parser, without Docker.",
    "`NginxContainerTest` (integration) starts real nginx containers and checks the headers on pages and error pages, the inheritance trap, the limits, the ambiguous requests, the hidden headers and that no container is left behind.",
    "`ReferenceConfigTest` checks the written-out configuration is what the code generates.",
]
next = """
The next module, transport-security, looks at how connections are protected with TLS, certificates and HTTPS.
"""

[[threat]]
id = "T1"
stride = "T"
threat = "A header is missing from error pages or from a location, so a browser protection is off where it matters"
where = "`NginxConfig`, `HeaderAudit`"
control = "always on every add_header, headers repeated in each location that adds its own, and an audit of every location and an error page"
residual = "A new location added later can lose the headers again, so the audit must run in the build"

[[threat]]
id = "T2"
stride = "T"
threat = "The configuration is changed by mistake and nobody notices because the page still works"
where = "`nginx.conf`"
control = "Configuration in version control, with tests that fetch pages and check the headers"
residual = "Tests cover only the locations they request"

[[threat]]
id = "T3"
stride = "T"
threat = "Request smuggling: nginx and the application disagree about where a request ends"
where = "nginx request parsing"
control = "nginx refuses Content-Length together with Transfer-Encoding, and conflicting Content-Length headers (400)"
residual = "Keep nginx and the application server up to date, because their parsers must keep agreeing"

[[threat]]
id = "T4"
stride = "D"
threat = "Oversize bodies or header lines use up server resources"
where = "`client_max_body_size`, `large_client_header_buffers`"
control = "Limits on body size and header buffers answer 413 and 400"
residual = "The limits must be tuned to real uploads, and a flood of small requests needs rate limits as well"

[[threat]]
id = "T5"
stride = "I"
threat = "The application's technology and version are revealed in headers, helping an attacker pick an attack"
where = "`proxy_hide_header`, `server_tokens`"
control = "Hide X-Powered-By, X-AspNet-Version and the nginx version"
residual = "Hiding is a speed bump: fingerprinting still works, so keep the software up to date"
