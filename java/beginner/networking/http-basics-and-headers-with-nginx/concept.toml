# concept.toml: everything about this project that is not Java code.
# tools/conceptkit turns it into the README, docs, diagrams, animation and video scenes.
# Written for a beginner: plain words, short sentences, every term explained the first time.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "http-basics-and-headers-with-nginx"
module = "networking"
title = "HTTP Basics and Security Headers with nginx"
short_title = "HTTP Headers with nginx"
package = "httpnginx"
main_class = "HttpNginxDemo"
tagline = "The front door sets the headers, and one directive can undo them"
bold = "nginx can add the security headers and refuse ambiguous requests before the application sees them, but a header added without always vanishes from error pages, a nested add_header silently drops the rest, and hiding a version is a speed bump and not a lock."
domain = "an online store"
domain_note = ""
youtube_description = """HTTP basics and security headers with nginx, in Java: the web server in front of the shop is the best place to set headers, and the easiest place to get them subtly wrong. Explained with an online store behind a real nginx container, like a doorman who hands every visitor the house rules, except in the side rooms where the rules were never written down again. We add the five security headers and score them with an auditor, see why the word always matters on error pages, fall into the add_header inheritance trap, watch nginx refuse an oversized request and the Content-Length with Transfer-Encoding smuggling pattern, and hide the technology the application behind it gives away."""
thumb_lines = ["HTTP HEADERS", "WITH NGINX"]
thumb_code = "add_header ... always;"
youtube_title = "HTTP Security Headers with nginx (always, Inheritance Trap, Smuggling)"
youtube_tags = ["nginx", "http security headers", "add_header", "hsts", "csp", "request smuggling", "proxy_hide_header", "docker", "java", "cybersecurity for beginners"]

[readme]
technologies = [
    ["nginx (container image)", "nginx:1.31.7-alpine", "the web server and reverse proxy in front of the store, pinned to an exact version"],
    ["Docker", "any recent Docker Engine or Docker Desktop", "runs the nginx container for the demo and the container tests"],
]
intro = """
The plain version of this lesson built an HTTP parser and a header auditor in Java. In production the **security headers** are usually added by the web server in front of the application, and **nginx**
is very often that server. The directive is `add_header`. It looks simple and has three traps. Without the word **`always`**, nginx adds the header only to successful answers, so error pages go out bare.
**Inheritance** is all or nothing: a `location` that has even one `add_header` of its own drops every `add_header` from the level above. And what the application behind the proxy says about itself, such as
`X-Powered-By`, is passed along unless `proxy_hide_header` removes it. nginx also refuses requests that are ambiguous, such as one with both `Content-Length` and `Transfer-Encoding`, which is the shape of a **request smuggling** attack.

The demo starts a real nginx in a Docker container for each act, sends requests with a raw socket so that malformed ones can be sent too, and scores each answer with the same five-header auditor as the plain project.
"""
analogy = """
Think of a doorman who hands every visitor the house rules on the way in. If he hands them out only to guests who arrive properly, a visitor who is turned away at the side gate never gets the rules. If each side room has its own
notice board, the main rules are not copied there unless someone writes them again. And a parcel that says it is four kilos and also says it is five is sent back, not argued over.
"""
scenario = """
An online store has nginx at its front door. The demo sets the five security headers, checks error pages and a side location, applies limits to bodies and header lines, sends the ambiguous requests of a smuggling attack, and puts nginx in front of
an application that reveals its technology.
"""
costs = [
    "**Headers describe the page.** A Content-Security-Policy that is wrong for the real site breaks the site, so the policy has to be tested with the real pages.",
    "**Configuration is easy to get subtly wrong.** The `always` and inheritance rules are not obvious, so the configuration needs tests like the ones in this project.",
    "**Hiding is a speed bump.** Removing a version number does not remove the hole, and attackers probe anyway. The fix is to keep software up to date.",
    "**Limits need tuning.** A body limit that is too small refuses real uploads, and one that is too large invites abuse.",
    "**Docker is needed.** The demo and the container tests need a running Docker; the default tests do not.",
]
too_much = """
Setting the five headers and `server_tokens off` is cheap and always worth doing. The refusals of ambiguous requests are on by default in current nginx, and the value of this project is knowing that and checking it.
"""
met_before = [
    "`add_header` lines in almost every nginx configuration, and `always` copied from a snippet nobody explained.",
    "Scanners such as securityheaders.com that give a site a letter grade.",
    "Include files such as `security-headers.conf` repeated in each `location`.",
    "Advisories about request smuggling between a proxy and an application server.",
]
where = """
This project follows [http-basics-and-headers](../http-basics-and-headers) and is a tools counterpart in [networking](..), next to [the Spring Boot version](../http-basics-and-headers-with-spring-boot). It uses Docker in the same way as [password-attacks-and-defences-with-nginx](../../passwords-and-mfa/password-attacks-and-defences-with-nginx).
"""
twin = """
nginx runs in a container on a random local port, and the demo prints only facts that do not depend on the port or on timing: scores, status codes and which headers are present. The version number is pinned in the image name.
Raw sockets are used so the demo can send requests that no HTTP client library would send.
"""
test_note = "The default tests need no Docker: they check the generated configurations, the auditor and the reply parser. The tests tagged docker start real nginx containers, check every claim in the demo and that no container is left running, and compare the demo with the golden output."

[[act]]
title = "nginx in front of the shop, as it comes"
summary = "Out of the box a request scores 0 of 5 on the security headers and the Server header shows the exact nginx version."
detail = """
A request for the home page is answered 200 and scores 0 of 5 on the five security headers. The Server header shows the exact nginx version, a free hint for an attacker who wants to look up its known problems.
"""
speech = """
First demo: nginx as it comes. [[slnc 400]] A request for the home page is answered. [[slnc 600]]
It scores zero out of five on the security headers. [[slnc 600]]
And the Server header shows the exact nginx version. [[slnc 300]] A free hint for an attacker.
"""
rows = { bare = "active wrong" }
console = [
    ["GET / answers 200 and scores 0 of 5 on the security headers", "bad"],
    ["the Server header shows the exact nginx version: yes  <- A FREE HINT FOR AN ATTACKER", "bad"],
]

[[act]]
title = "add_header, and the word always"
summary = "Without always the home page scores 5 of 5 but the 404 page scores 0; with always both score 5, and server_tokens off hides the version."
detail = """
With the five headers added without always, the home page scores 5 of 5, but the 404 page scores 0 of 5: error pages are left bare. With always, both score 5 of 5. With server_tokens off the Server header is just nginx.
"""
speech = """
Second demo: add header, and the word always. [[slnc 400]] Without it, the home page gets all five headers. [[slnc 300]] But the error page gets none. [[slnc 600]]
With the word always, both pages have all five. [[slnc 600]]
And with server tokens off, the Server header says just nginx.
"""
rows = { always = "active ok" }
console = [
    ["headers added without always: GET / scores 5 of 5, but the 404 page scores 0 of 5  <- ERROR PAGES ARE LEFT BARE", "amber"],
    ["headers added with always: GET / scores 5 of 5 and the 404 page scores 5 of 5", "ok"],
    ["with server_tokens off the Server header is just: nginx", "ok"],
]

[[act]]
title = "The inheritance trap"
summary = "A location that adds its own Cache-Control drops all five server-level headers and scores 0 of 5; repeating them there scores 5 of 5."
detail = """
With the headers set once for the whole server, the home page scores 5 of 5. But /account adds its own Cache-Control header, and now scores 0 of 5: its own add_header dropped the rest. Cache-Control is there, the five security headers are not.
Repeating the five headers inside /account brings it back to 5 of 5. The habit is to audit every location, not just the top of the page.
"""
speech = """
Third demo: the inheritance trap. [[slnc 400]] The headers are set once, for the whole server. [[slnc 300]] The home page has all five. [[slnc 600]]
But the account page adds one header of its own. [[slnc 300]] And now it has none of the five. [[slnc 300]] Its own add header dropped the rest. [[slnc 600]]
Repeat the five inside the account page, and it is fixed. [[slnc 300]] The habit: audit every location, not just the top of the page.
"""
rows = { trap = "active wrong" }
console = [
    ["headers set once for the whole server: GET / scores 5 of 5", "ok"],
    ["/account adds its own Cache-Control header, and now scores 0 of 5  <- ITS OWN add_header DROPPED THE REST", "bad"],
    ["Cache-Control is there: yes", "muted"],
    ["with the five headers repeated inside /account it scores 5 of 5", "ok"],
    ["the habit: audit every location, not just the top of the page", "amber"],
]

[[act]]
title = "Limits, and requests that are ambiguous"
summary = "A body over 1k gets 413, a header line of 4000 characters gets 400, and both Content-Length with Transfer-Encoding and two different Content-Lengths get 400."
detail = """
With client_max_body_size 1k, a 100 byte order gets 200 and a 2000 byte order gets 413. With large_client_header_buffers 2 1k, a header line of 4000 characters gets 400.
A request with both Content-Length and Transfer-Encoding, the smuggling pattern, gets 400, and so do two different Content-Length headers. nginx refuses both, so it cannot disagree with the application behind it about where a request ends.
"""
speech = """
Fourth demo: limits, and ambiguous requests. [[slnc 400]] A small order goes through. [[slnc 300]] A two thousand byte order is refused. [[slnc 600]]
A header line of four thousand characters is refused. [[slnc 600]]
A request with both Content Length and Transfer Encoding is the shape of a smuggling attack. [[slnc 300]] It is refused. [[slnc 600]]
So are two different Content Lengths. [[slnc 300]] So nginx cannot disagree with the application about where a request ends.
"""
rows = { limits = "active ok" }
console = [
    ["client_max_body_size 1k: a 100 byte order gets 200, a 2000 byte order gets 413", "ok"],
    ["large_client_header_buffers 2 1k: a header line of 4000 characters gets 400", "ok"],
    ["Content-Length and Transfer-Encoding together, the smuggling pattern: 400", "ok"],
    ["two different Content-Length headers: 400", "ok"],
    ["nginx refuses both, so it cannot disagree with the application behind it about where a request ends", "muted"],
]

[[act]]
title = "Hiding what the application gives away, and the bill"
summary = "A proxy passes X-Powered-By and X-AspNet-Version along unless proxy_hide_header removes them; hiding is a speed bump, and the configuration needs tests."
detail = """
The application behind the proxy sends X-Powered-By and X-AspNet-Version, and the proxy passes them on: old versions have known holes. With proxy_hide_header and server_tokens off, no extra headers are left and the Server header says just nginx.
Hiding is a speed bump, not a lock: the real fix is to keep the software up to date. The bill: the configuration is easy to get subtly wrong, so it has to be tested, and the Content-Security-Policy has to match the real site.
"""
speech = """
Fifth demo: hiding what the application gives away. [[slnc 400]] The application sends the name of its technology and its version. [[slnc 300]] And the proxy passes them on. [[slnc 600]]
With proxy hide header, they are gone. [[slnc 600]]
But hiding is a speed bump, not a lock. [[slnc 300]] The real fix is to keep the software up to date. [[slnc 600]]
And the bill: the configuration is easy to get subtly wrong, so test it.
"""
rows = { upstream = "active amber" }
console = [
    ["the application behind the proxy sends X-Powered-By and X-AspNet-Version: yes  <- OLD VERSIONS HAVE KNOWN HOLES", "bad"],
    ["with proxy_hide_header and server_tokens off, extra headers left: 0, Server says: nginx", "ok"],
    ["hiding is a speed bump, not a lock: the real fix is to keep the software up to date", "amber"],
    ["the bill: the configuration is easy to get subtly wrong, so test it, as these demos do", "amber"],
    ["and the headers describe the page, so a Content-Security-Policy still has to match the real site", "amber"],
]

