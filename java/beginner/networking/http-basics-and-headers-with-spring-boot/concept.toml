# concept.toml: everything about this project that is not Java code.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "http-basics-and-headers-with-spring-boot"
module = "networking"
title = "HTTP Basics and Security Headers with Spring Boot"
short_title = "HTTP Headers with Spring Boot"
package = "httpspring"
main_class = "HttpSpringDemo"
tagline = "Let the framework write the safe headers"
bold = "Spring Boot and Spring Security write the security headers, harden the session cookie and bound the request size with a few lines of configuration, and the container refuses a line break in a header, but the defaults still need a decision from you."
domain = "an online store"
domain_note = ""
youtube_description = """HTTP basics and security headers with Spring Boot, in Java: the earlier project built HTTP by hand, and this one lets a real framework do it. Explained with an online store, like fitting the shop with standard locks instead of forging them. We start two real Spring Boot servers on the loopback interface, one with headers switched off and one hardened, and score their real responses. We see why Strict-Transport-Security appears only over HTTPS, harden the session cookie with three properties, watch Tomcat refuse a line break in a header, bound the size of a request, and note the cost: a framework's defaults are a starting point, and trusting a forwarded header is a decision."""
thumb_lines = ["HTTP SECURITY HEADERS", "WITH SPRING BOOT"]
thumb_code = "http.headers(...)"
youtube_title = "HTTP Security Headers with Spring Boot (HSTS, CSP, Cookies, Limits)"
youtube_tags = ["spring boot", "spring security", "security headers", "hsts", "csp", "cookies", "samesite", "tomcat", "java", "cybersecurity for beginners"]

[readme]
technologies = [
    ["Spring Boot", "4.1.1", "the latest stable release; its dependency list pins the Spring and Tomcat versions below, and it starts the real web server"],
    ["Spring Framework (Spring MVC)", "7.0.9", "maps web addresses to Java methods; pinned by Spring Boot 4.1.1"],
    ["Spring Security", "7.1.1", "writes the security headers and sits in front of every request; pinned by Spring Boot 4.1.1"],
    ["Apache Tomcat (embedded)", "11.0.24", "the web server inside the application; it parses requests and enforces size limits; pinned by Spring Boot 4.1.1"],
]
intro = """
The plain version of this lesson wrote an HTTP parser, a cookie judge and a header auditor by hand. Real stores use a framework. **Spring Boot** starts a real web server (**Tomcat**) inside the program, and **Spring Security** puts a chain of filters
in front of every request, one of which writes the **security headers**. A few lines of configuration choose which headers, a few **properties** harden the session cookie and bound the size of a request, and the container itself refuses a line
break in a header, which is how **header injection** is attacked.

The demo starts two real servers on the loopback interface, one with the headers switched off and one hardened, and scores their real responses with the same five-header audit as before. It then shows why one header appears only over HTTPS, hardens a cookie, tries to inject a header and sends an oversized one.
"""
analogy = """
The earlier project was forging your own door locks, to learn how locks work. This one fits standard locks that a locksmith has tested. You still choose which doors get locks and which key to use, and you still have to
check that the locks are fitted, which is why the demo scores the real doors and does not trust the plan.
"""
scenario = """
An online store runs a small Spring Boot application with a products page, a cart that starts a session, and a search that puts the customer's text in a header. The demo runs it twice, bare and hardened, and attacks both.
"""
costs = [
    "**A framework is a large dependency.** Boot, Spring Security and Tomcat bring many jars, and their versions have to be updated together as new releases fix vulnerabilities.",
    "**The defaults are a start.** Spring Security writes some headers by default, and the policy that matters, such as the Content-Security-Policy, is yours to write and test against your pages.",
    "**Trusting a forwarded header is a decision.** `server.forward-headers-strategy=native` believes X-Forwarded-Proto from trusted proxies. If the application is reachable without the proxy, a customer can send the header and change what the application believes.",
    "**A small request limit can break real customers.** Cookies and long addresses need room, so the limit has to be set from real traffic.",
    "**A header check on the demo is not a check on production.** The demo scores one page over plain HTTP on this machine: the real check is on the real site, over HTTPS.",
]
too_much = """
For any real web application, use the framework's header support and test the result. Writing headers by hand is for learning, and for cases the framework does not cover.
"""
met_before = [
    "`http.headers(...)` in a Spring Security configuration class.",
    "`server.servlet.session.cookie.*` properties in `application.properties`.",
    "Security scanners that give a site a grade for its headers.",
    "`server.max-http-request-header-size` and its relatives in hardening guides.",
]
where = """
This project follows [http-basics-and-headers](../http-basics-and-headers) and is the sixth in [networking](..). The same five-header audit and cookie judge are used here, on a real framework's responses.
"""
twin = """
Both servers are real Spring Boot applications started on free ports on the loopback interface, so nothing needs installing except a JDK. The demo prints only facts that do not depend on the port, the date or the session id. Tests also use MockMvc, which
sends a request through the whole filter chain in memory. HTTPS itself is not used; the transport-security module covers it, and the demo shows the effect of a proxy that ends HTTPS by sending the X-Forwarded-Proto header.
"""
test_note = "Real servers are started on free ports and closed after every test, and the demo prints only facts that do not depend on ports, dates or session ids, so the golden output is the same on every run."

[[act]]
title = "The same page, with and without header writers"
summary = "With headers switched off the store scores 0 of 5; the hardened store scores 4 of 5, because Strict-Transport-Security is left out on plain HTTP on purpose."
detail = """
A customer asks for the products page over plain HTTP on this machine. The store with headers switched off scores 0 of 5. The hardened store scores 4 of 5, missing only Strict-Transport-Security. The framework leaves that header out on plain HTTP on purpose:
a browser must ignore it there, so sending it would only mislead.
"""
speech = """
First demo: the same page, twice. [[slnc 400]] One store has its security headers switched off. [[slnc 300]] It scores zero out of five. [[slnc 600]]
The hardened store scores four out of five. [[slnc 300]] The missing one is Strict Transport Security. [[slnc 600]]
The framework leaves it out over plain H T T P, on purpose. [[slnc 300]] A browser must ignore it there, so sending it would only mislead.
"""
rows = { headers = "active ok" }
console = [
    ["the store with headers switched off scores 0 of 5 (missing or weak: Strict-Transport-Security, Content-Security-Policy, X-Content-Type-Options, X-Frame-Options, Referrer-Policy)", "bad"],
    ["the hardened store scores 4 of 5 (missing or weak: Strict-Transport-Security)", "ok"],
    ["the framework leaves out Strict-Transport-Security on plain HTTP on purpose: a browser must ignore it there, so sending it would only mislead", "amber"],
]

[[act]]
title = "The same page behind a proxy that ends HTTPS"
summary = "With X-Forwarded-Proto: https the hardened store scores 5 of 5 and sends Strict-Transport-Security; trusting that header is safe only if nobody but the proxy can reach the store."
detail = """
Most stores sit behind a proxy that ends HTTPS. The proxy adds X-Forwarded-Proto: https, and the hardened store, configured to trust it, scores 5 of 5 and sends max-age=31536000 with includeSubDomains, and a policy of default-src 'self' with frame-ancestors 'none'.
This trust is safe only because the store listens on the loopback interface and only the proxy can reach it.
"""
speech = """
Second demo: behind a proxy that ends H T T P S. [[slnc 400]] The proxy adds a header saying the customer used H T T P S. [[slnc 600]]
The hardened store now scores five out of five. [[slnc 300]] It sends Strict Transport Security for a year, and a content security policy. [[slnc 600]]
But this trust is safe only because nobody but the proxy can reach the store.
"""
rows = { proxy = "active ok" }
console = [
    ["the proxy adds X-Forwarded-Proto: https, and the hardened store scores 5 of 5", "ok"],
    ["Strict-Transport-Security: max-age=31536000 ; includeSubDomains", "ok"],
    ["Content-Security-Policy: default-src 'self'; frame-ancestors 'none'", "ok"],
    ["this trust in a forwarded header is safe only because the store listens on the loopback interface and only the proxy can reach it", "amber"],
]

[[act]]
title = "The cookie that carries the cart's session"
summary = "The default session cookie has 2 problems, no Secure and no SameSite; three properties give the hardened store a cookie with none."
detail = """
The cart starts a session and sets a cookie. In the default store the cookie JSESSIONID has two problems: no Secure, and no SameSite. HttpOnly is already on by default. In the hardened store three properties, cookie.http-only, cookie.secure and cookie.same-site,
leave the cookie with no problems.
"""
speech = """
Third demo: the cookie that carries the cart. [[slnc 400]] In the default store, it has two problems. [[slnc 300]] No Secure, and no Same Site. [[slnc 600]]
Three properties fix it in the hardened store. [[slnc 300]] H T T P only, Secure, and Same Site strict. [[slnc 300]] No problems left.
"""
rows = { cookie = "active ok" }
console = [
    ["default store: cookie JSESSIONID, problems: 2", "amber"],
    ["- no Secure: it is also sent over plain HTTP", "amber"],
    ["- no SameSite: other sites can trigger requests that carry it", "amber"],
    ["hardened store: cookie JSESSIONID, problems: 0", "ok"],
    ["three properties turn the safe attributes on: cookie.http-only, cookie.secure and cookie.same-site", "muted"],
]

[[act]]
title = "A line break inside a header"
summary = "The search text with a line break and a second header is refused by the container with status 500, no X-Echo and no second header; a header name with a space gets 400."
detail = """
The search endpoint puts the customer's text in the X-Echo header. A text with a line break and a second header is refused: the container will not write it, the status is 500, and the answer has no second header with the attacker's cookie and no X-Echo header at all.
A request with a space in a header name gets status 400. The container turns the attack into an error, and the code must still never write customer text into a header unchecked.
"""
speech = """
Fourth demo: a line break inside a header. [[slnc 400]] The customer's search text contains a line break, and a second header. [[slnc 600]]
The server refuses to write it. [[slnc 300]] There is no second header, and no attacker's cookie. [[slnc 600]]
A request with a space in a header name gets a four hundred. [[slnc 600]]
The container turns the attack into an error. [[slnc 300]] But the code must still never write customer text into a header unchecked.
"""
rows = { injection = "active ok" }
console = [
    ["the answer contains a second header with the attacker's cookie: false", "ok"],
    ["the server refused to write a header with a line break: status 500, and no X-Echo header at all: true", "ok"],
    ["a request with a space in a header name gets status 400", "ok"],
    ["the container turns the attack into an error, and the code must still never write customer text into a header unchecked", "amber"],
]

[[act]]
title = "Limits on the size of a request"
summary = "A 4000-character header is accepted by the default store with 200 and refused by the hardened store, whose limit is 1KB, with 400."
detail = """
A request with a 4000-character header is answered 200 by the default store, and 400 by the hardened store whose header limit is one kilobyte. A small limit keeps one customer from making the server read and hold megabytes, and the limit must still be high enough
for real cookies.
"""
speech = """
Fifth demo: limits. [[slnc 400]] A request with a four thousand character header. [[slnc 600]]
The default store accepts it. [[slnc 300]] The hardened store, with a one kilobyte limit, refuses it. [[slnc 600]]
A small limit stops one customer from making the server hold megabytes. [[slnc 300]] But it must stay high enough for real cookies.
"""
rows = { limits = "active amber" }
console = [
    ["a request with a 4000-character header: default store answers 200, hardened store (limit 1KB) answers 400", "amber"],
    ["a small limit keeps one customer from making the server read and hold megabytes, and the limit must still be high enough for real cookies", "muted"],
]

[animation]
subtitle = "An online store runs a real Spring Boot server twice, bare and hardened, and attacks both."
boxes = [
    ["headers", "Headers", "four of five over HTTP"],
    ["proxy", "Behind a proxy", "five of five over HTTPS"],
    ["cookie", "The cookie", "three properties"],
    ["injection", "Injection", "refused by the container"],
    ["limits", "Limits", "a smaller header limit"],
]

[docs.dependencies]
intro = """
This project uses Spring Boot, which brings the web server and the security filters with it.
"""
what = [
    ["Spring Boot", "starts an application with a web server inside it and chooses sensible settings from what is on the classpath. Properties such as `server.servlet.session.cookie.same-site` change them."],
    ["Spring Security", "puts a chain of filters in front of every request. One of them writes the security headers, and the configuration decides which."],
    ["Spring MVC", "maps a web address to a Java method. The store's endpoints are plain controller methods."],
    ["Apache Tomcat (embedded)", "the web server inside the application. It parses requests, enforces the header size limit and refuses a line break in a header."],
    ["MockMvc", "a test tool that sends a request through the whole filter chain in memory, without a network port."],
]
why = """
The plain project builds HTTP by hand, so the rules are visible. This one shows how a framework applies the same rules with configuration, and how a real server behaves when attacked, which is what most applications run on.
"""
install_note = "Only a JDK. Gradle downloads the rest. Spring Boot 4.1.1 is the latest stable release (the 4.2 line is only milestones), and its dependency list pins everything else:"
versions = [
    ["Spring Boot", "4.1.1"],
    ["Spring Framework", "7.0.9"],
    ["Spring Security", "7.1.1"],
    ["Apache Tomcat (embedded)", "11.0.24"],
    ["Jakarta Servlet API", "6.1.0"],
    ["Java", "25"],
    ["JUnit", "6.1.3"],
]
costs = [
    "A large dependency, and the versions must move together when a vulnerability is fixed.",
    "Defaults change between releases, so the demo's scores are a check to rerun after an upgrade.",
    "The demo uses plain HTTP on the loopback interface; real HTTPS is the next module.",
]

[docs.problem]
scenario = """
An online store runs on a Spring Boot application. It must send the safe headers, keep the session cookie from leaking, refuse malformed requests and bound their size, without hand-written HTTP code.
"""
naive = """
Rely on the framework's defaults without looking at the real responses, and trust a forwarded header from anywhere.
"""
deliver = [
    "Two real Spring Boot servers, bare and hardened, started on free ports.",
    "The five-header audit applied to their real responses: 0 of 5, 4 of 5 and 5 of 5.",
    "The session cookie judged before and after three properties.",
    "A header injection attempt and a malformed request refused by the container.",
    "A request size limit shown in effect.",
]

[docs.prerequisites]
required = [
    "Java basics",
    "The http-basics-and-headers project, or an idea of what an HTTP header and a cookie are",
]
not_required = [
    "Any Spring experience: the configuration is a few lines",
    "HTTPS or certificates: the next module",
]
install = []

[docs.session]
objectives = [
    "name the five security headers the audit checks",
    "explain why Strict-Transport-Security is sent only over HTTPS",
    "harden a session cookie with properties",
    "explain what a forwarded header is and why trusting it is a decision",
]
walkthrough = """
Start with the standard locks. Run the demo one act at a time. After act one, ask why the framework leaves out one header. After act two, ask what an attacker could do if the store were reachable without the proxy. In act four, ask what the code would have to do
if the container did not refuse the line break.
"""
exercises = [
    "Remove the `forward-headers-strategy` property and check that act two drops to 4 of 5.",
    "Change the Content-Security-Policy to allow 'unsafe-inline' and watch the audit fail.",
    "Raise the header limit until the 4000-character header is accepted by the hardened store.",
    "Add a `Permissions-Policy` header and extend the audit to six headers.",
]

[docs.explained]
sentence = """
A framework can write the security headers, harden the session cookie and bound the request size from a few lines of configuration, and the web server refuses a line break in a header, but the policy, the proxy trust and the limits are decisions that must be made and checked on the real responses.
"""
verdict = """
Use the framework's header support, set the cookie properties, set request limits from real traffic, trust forwarded headers only from the proxy, and test the real responses after every upgrade, as the demo does.
"""
recognise = [
    "`http.headers(...)` and `SecurityFilterChain` in Spring configuration.",
    "`server.servlet.session.cookie.*` in `application.properties`.",
    "Header grading tools for websites.",
]

[spec]
purpose = """
Teach how a real framework applies the HTTP security basics by running two Spring Boot servers, bare and hardened, scoring their real headers, hardening the session cookie, and attacking them with an injected header and an oversized one.
"""
nongoals = [
    "HTTPS, certificates and HSTS preloading: the transport-security module.",
    "CSRF tokens, authentication and CORS.",
    "Writing a full Content-Security-Policy for a real site.",
]
problem = """
Learners know the headers by name but have never seen a framework's real response, or what changes it.
"""
roles = [["The two stores", "`Shop.Bare`, `Shop.Hardened`"], ["Endpoints", "`ShopController`"], ["Header audit", "`HeaderAudit`"], ["Cookie judge", "`Cookie`"], ["Talking to the servers", "`Wire`"], ["Entry point", "`HttpSpringDemo`"]]
requirements = [
    "A bare store scores 0 of 5 and a hardened store scores 4 of 5 over HTTP and 5 of 5 behind a proxy that ends HTTPS.",
    "The session cookie has no problems in the hardened store.",
    "A line break in a header never produces a second header.",
    "A request over the size limit is refused.",
    "The demo prints the same output on every run.",
]

