[threatmodel]
scope = """
An online store's Spring Boot web application: the headers it sends to the browser, its session cookie, the requests it accepts, and the proxy in front of it. It covers a script injected into a page, a request from another site, a crafted or oversized request,
and a forged forwarded header. It does not cover HTTPS itself, authentication, or the application's own logic.
"""
assets = [
    "The customer's session, held in a cookie.",
    "The page's content and the customer's browser.",
    "The server's memory and time.",
    "The store's belief about whether a request was secure.",
]
actors = [
    "A customer with a browser that obeys the headers.",
    "An attacker who can inject a script, build a page on another site, or send crafted requests.",
    "The proxy that ends HTTPS.",
]
boundaries = [
    "Browser to server: the headers are the server's only way to tell the browser how to behave.",
    "Proxy to application: forwarded headers cross it and must only be believed from the proxy.",
]
assumptions = [
    "The application is reachable only through the proxy.",
    "TLS is handled by the proxy and tested elsewhere.",
    "In the demo, the stores listen on the loopback interface on free ports.",
]
out_of_scope = [
    "HTTPS and certificates: the transport-security module.",
    "CSRF tokens, authentication and CORS.",
    "A complete Content-Security-Policy for a real site.",
]
tests = [
    "`MockMvcHeadersTest` checks the five headers over HTTPS and plain HTTP, and the refusal of a line break, through the whole filter chain.",
    "`RealServerTest` starts real servers on free ports and checks scores, the cookie, the injection, the malformed request, the size limit, and an untrusted forwarded header.",
    "`CookieAndAuditTest` checks the cookie judge and the header audit.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next module, transport-security, looks at what makes a connection private: the TLS handshake, certificates and HTTPS.
"""

[[threat]]
id = "T1"
stride = "T"
threat = "A script injected into a page runs, or the page is shown inside another site's frame"
where = "`Shop.Hardened` headers"
control = "Content-Security-Policy with default-src 'self' and frame-ancestors, X-Frame-Options, nosniff"
residual = "The policy must fit the real pages, and only helps browsers that enforce it"

[[threat]]
id = "T2"
stride = "S"
threat = "The session cookie is read by a script, sent over plain HTTP, or sent with another site's request"
where = "the JSESSIONID cookie"
control = "HttpOnly, Secure and SameSite=Strict through three properties"
residual = "SameSite is not a replacement for CSRF tokens, and Strict can break links from other sites"

[[threat]]
id = "T3"
stride = "T"
threat = "Customer text with a line break splits the response or sets a second header"
where = "`ShopController.echo`"
control = "Tomcat refuses a line break in a header value"
residual = "The code should validate or encode customer text before it reaches a header"

[[threat]]
id = "T4"
stride = "D"
threat = "An oversized request makes the server read and hold too much"
where = "Tomcat's header limit"
control = "server.max-http-request-header-size set from real traffic"
residual = "A limit too small breaks real customers, and body, upload and rate limits are separate"

[[threat]]
id = "T5"
stride = "I"
threat = "A malformed request is read differently by two programs"
where = "Tomcat's parser"
control = "Tomcat refuses a header name with a space with status 400"
residual = "A proxy in front must be strict in the same way"

[[threat]]
id = "T6"
stride = "S"
threat = "A forged X-Forwarded-Proto makes the application believe the request was secure"
where = "`server.forward-headers-strategy=native`"
control = "Believe forwarded headers only from trusted proxies, and keep the application unreachable except through the proxy"
residual = "If the application is reachable directly, the belief can be forged"
