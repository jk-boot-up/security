[[scene]]
key = "01-poster"
kind = "poster"
title = "HTTP Security Headers with Spring Boot"
narration = """Hello, and welcome. [[slnc 400]] This video explains H T T P security headers with Spring Boot, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] Security headers are instructions that a server sends to the browser, such as, only load scripts from here, and, never show me inside a frame. [[slnc 300]] Spring Boot and Spring Security can write them for you. [[slnc 600]] Think of fitting a shop with standard locks, instead of forging your own. [[slnc 300]] You still choose which doors get locks, and you still check that they are fitted. [[slnc 700]] In this video, the domain is an online store. [[slnc 500]] By the end, you will hear how a real server scores. [[slnc 300]] Why one header appears only over H T T P S. [[slnc 300]] How a cookie is hardened. [[slnc 300]] And how a server answers a line break and an oversized request."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online store runs a Spring Boot application.", "", "A products page, a cart with a session,", "and a search that echoes a header.", "", "Run it twice, bare and hardened,", "and attack both."]
narration = """Here is the scenario. [[slnc 400]] An online store runs a small Spring Boot application. [[slnc 500]] A products page. A cart that starts a session. And a search that puts the customer's text in a header. [[slnc 600]] The demo runs it twice, bare and hardened, and attacks both."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["Header: a line of text with the response", "HSTS: always use HTTPS for this site", "CSP: where scripts may load from", "SameSite: when a cookie is sent", "Forwarded header: what a proxy tells the server"]
narration = """Before the demos, the words. [[slnc 500]] A header is a line of text sent with the response. [[slnc 500]] H S T S means, always use H T T P S for this site. [[slnc 500]] C S P says where scripts may be loaded from. [[slnc 500]] Same Site says when a cookie is sent. [[slnc 500]] And a forwarded header is what a proxy tells the server about the original request."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
