[docs.session]
objectives = [
    "read a Corefile and a zone file",
    "explain the difference between NXDOMAIN and REFUSED",
    "explain how UDP and TCP carry the same message",
    "explain why a cache keeps a wrong answer alive",
    "say what protects a name, since the server does not",
]
walkthrough = """
Start with the phone book. Run the demo one act at a time, and open the Corefile and the zone file the demo writes. After act three, ask what a client could do if the rewrite were wrong. After act five, ask who in the store can change the zone file, and how would anyone notice.
"""
exercises = [
    "Add an AAAA record to the zone file and ask for it with `dig` while the container runs.",
    "Change `cache 60` to `cache 5` and watch how the countdown changes.",
    "Add a `forward` plugin block for a second zone that sends questions to the first server.",
    "Run `dig +tcp @127.0.0.1 -p <port> www.shop.example` against the container and compare with the Java output.",
]

[docs.explained]
sentence = """
A DNS server answers exactly what its zone says, over UDP or TCP, with no proof of who wrote it, and caches repeat the answer until its time runs out, so the file and the people who can change it are what protect a name.
"""
verdict = """
Restrict and review changes to zone files, keep important names on short times to live, sign the zone with DNSSEC where the provider supports it, and watch for changes to records that you did not make.
"""
recognise = [
    "`dig`, `nslookup` and `host` in every troubleshooting guide.",
    "CoreDNS configuration in Kubernetes clusters.",
    "Zone files starting with `$ORIGIN` and an SOA record.",
    "Incidents where a record was changed and the old answer lingered for hours.",
]

[spec]
purpose = """
Teach how a real DNS server behaves by running CoreDNS in a container and asking it questions over UDP and TCP with the project's own DNS message code, then showing missing names, a rewrite, a counting cache and a wrong record.
"""
nongoals = [
    "Running a production DNS service.",
    "Recursive resolution and forwarding in depth.",
    "DNSSEC, which is described and not run.",
]
problem = """
Learners see DNS as a lookup that just works, and need to see that a server serves what a file says.
"""
roles = [["CoreDNS container", "`CoreDns`"], ["Corefile and zone text", "`ShopZone`"], ["UDP and TCP client", "`Client`"], ["DNS messages", "`DnsMessage`"], ["Entry point", "`CoreDnsDemo`"]]
requirements = [
    "The image is pinned to an exact version and the server is bound to loopback.",
    "The client reads answers over UDP and over TCP with the two-byte length.",
    "NXDOMAIN, REFUSED and the rewrite are shown.",
    "Cached answers count down.",
    "A wrong record is served as any other.",
    "Containers never leak, and the demo prints only facts that are the same on every run.",
]

