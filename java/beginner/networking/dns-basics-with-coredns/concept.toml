# concept.toml: everything about this project that is not Java code.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "dns-basics-with-coredns"
module = "networking"
title = "DNS Basics with CoreDNS"
short_title = "DNS with CoreDNS"
package = "dnscoredns"
main_class = "CoreDnsDemo"
tagline = "Run a real DNS server and ask it questions"
bold = "A real DNS server answers exactly what its zone file says, over UDP or TCP, with no signature, so whoever controls the file controls the answer, and every cache repeats it."
domain = "an online store"
domain_note = ""
youtube_description = """DNS basics with CoreDNS, in Java: run a real DNS server in a container and ask it questions with our own code. Explained with an online store, like a phone book that prints whatever the last editor wrote. We query the server over UDP and TCP, see a name that does not exist, a zone it refuses to answer, a rewrite rule, the cache and the countdown of the time to live, and a zone with a wrong record that the server serves exactly like the right one, and finish with what really protects names: control of the zone file and DNSSEC."""
thumb_lines = ["DNS WITH", "COREDNS"]
thumb_code = "file + rewrite + cache"
youtube_title = "DNS Basics with CoreDNS (UDP, TCP, NXDOMAIN, Cache, Wrong Records)"
youtube_tags = ["dns", "coredns", "docker", "nxdomain", "dns cache", "ttl", "zone file", "java", "cybersecurity for beginners"]

[readme]
technologies = [
    ["CoreDNS (container image)", "coredns/coredns:1.14.7", "the real DNS server the Java code asks, pinned to an exact version"],
    ["Docker", "any recent Docker Engine or Docker Desktop", "runs the CoreDNS containers for the demo and the container tests"],
]
intro = """
The plain version of this lesson built DNS messages and a resolver in Java. Here the other side is real: **CoreDNS**, a widely used open-source DNS server, runs in a container. It is configured by a small **Corefile** and serves a **zone file**, a text file of records for
shop.example. Three of its **plugins** are used: **file** serves the zone, **rewrite** answers one name as another, and **cache** keeps answers for a while and counts their time to live down.

The Java code asks it questions over **UDP**, one datagram each way, and over **TCP**, where each message starts with its length in two bytes. It sees a name that does not exist (NXDOMAIN), a name the server will not answer (REFUSED),
and then a zone with a wrong record, which the server serves as faithfully as the right one.
"""
analogy = """
Think of a phone book printed from a master list. The printer prints whatever the list says, in the same ink, with no way to tell a typo from a fact. A copy shop keeps a stack of old pages for a while to save a trip,
and anyone who picks up a page believes it. What protects the shop is who may edit the master list, and a seal on each page that a reader can check.
"""
scenario = """
An online store runs its own DNS server for shop.example. The demo starts it, asks for www, the same question over TCP, a missing name, a name outside the zone and an old name that is rewritten, watches the cache count down, and then starts a server whose zone has a wrong record.
"""
costs = [
    "**The server believes its files.** CoreDNS serves what the zone file says, so control of the file and of the process that writes it is control of the name.",
    "**Caches repeat a wrong answer.** Fixing the file does not recall answers that resolvers and browsers already hold, which is why important names often have short times to live.",
    "**Plain DNS is readable and unsigned.** UDP and TCP carry the question and answer in the clear, and neither proves who made the answer; DNSSEC and encrypted transports address that and are not run here.",
    "**It needs Docker.** The demo and the container tests start real containers, so a running Docker is required, though the default tests are not.",
]
too_much = """
Running your own authoritative DNS server is a real job, and most online stores use a provider's. Understanding what such a server does, and trusting it only as far as its zone's access controls, is the part worth learning.
"""
met_before = [
    "`dig www.shop.example` and `nslookup`, which send exactly these questions.",
    "Kubernetes clusters, where CoreDNS is the default name service.",
    "Corefile and zone-file syntax, shared with many DNS servers.",
    "Short times to live on names that must be able to change quickly.",
]
where = """
This project follows [dns-basics](../dns-basics) and is the fourth in [networking](..). It puts a real server on the other end of the questions that project simulated.
"""
twin = """
A real CoreDNS container serves the zone on free local ports bound to loopback. The demo prints only facts that do not depend on ports, ids or the exact countdown, so it is the same on every run. Containers are always stopped and removed.
"""
test_note = "The ordinary tests need only a JDK: they check the Corefile and zone text, the pinned image, the DNS message encoding and the client against small servers written in the tests. The container tests (tagged docker) start CoreDNS and check real answers, and run with integrationTest. The demo's comparison with its golden output runs with the integration tests, because the demo needs Docker: run `./gradlew integrationTest` after changing the demo or its narration."

[[act]]
title = "A real DNS server, in a container"
summary = "CoreDNS serves the zone file's record for www.shop.example over UDP, repeats the question's id, and is believed because the id and question match."
detail = """
The zone file for shop.example says www.shop.example is 203.0.113.10 for 300 seconds. Asked over UDP, CoreDNS answers with that address. The answer repeats the question's id and says it is a response. The client trusts it because the id and the question match, and nothing else.
"""
speech = """
First demo: a real D N S server, in a container. [[slnc 400]] The zone file says the store's web address, and how long to keep it. [[slnc 600]]
Asked over U D P, the server answers with that address. [[slnc 300]] The answer repeats the question's number. [[slnc 600]]
The client trusts it because the number and the question match, and nothing else.
"""
rows = { server = "active ok" }
console = [
    ["the zone file for shop.example says www.shop.example is 203.0.113.10 for 300 seconds", "muted"],
    ["asked over UDP, CoreDNS answers www.shop.example is 203.0.113.10", "ok"],
    ["the answer repeats the question's id: true, and says it is a response: true", "ok"],
    ["the client trusts it because the id and the question match, and nothing else", "amber"],
]

[[act]]
title = "The same question over UDP and over TCP"
summary = "Both give the same address; over TCP each message starts with a two-byte length, so the answer is 2 bytes longer; neither signs or encrypts."
detail = """
Asked over TCP, the server gives the same address. Over TCP each message starts with its length in two bytes, so the answer is 2 bytes longer. TCP is used when an answer does not fit in a datagram, and to copy a whole zone between servers. Neither one signs or encrypts anything.
"""
speech = """
Second demo: U D P and T C P. [[slnc 400]] The same question over T C P gives the same address. [[slnc 600]]
Each T C P message starts with its length in two bytes, so the answer is two bytes longer. [[slnc 600]]
T C P is used when an answer is too big for a datagram, and to copy a whole zone between servers. [[slnc 300]] Neither one signs or encrypts anything.
"""
rows = { transport = "active ok" }
console = [
    ["both give the same address: true", "ok"],
    ["over TCP each message starts with its length in two bytes, so the answer is 2 bytes longer", "muted"],
    ["TCP is used when an answer does not fit in a datagram, and to copy a whole zone between servers", "muted"],
    ["neither one signs or encrypts anything", "amber"],
]

[[act]]
title = "Names that do not exist, names it will not answer, and a rewrite"
summary = "A missing name gives NXDOMAIN with no answers, a name outside the zone is REFUSED, and legacy.shop.example is rewritten to www and answered under the name asked."
detail = """
nope.shop.example does not exist, so the answer is NXDOMAIN with no answers. www.other.example is outside the zone, so the answer is REFUSED, because the server only answers for shop.example. The old name legacy.shop.example is rewritten to www.shop.example, and
the answer is 203.0.113.10 under the name asked for. A rewrite is a rule in the server, invisible to the client.
"""
speech = """
Third demo: names that do not exist. [[slnc 400]] A missing name gives N X domain, and no answers. [[slnc 600]]
A name outside the zone is refused, because this server only answers for the store's zone. [[slnc 600]]
And an old name is rewritten to the new one, and answered under the name that was asked. [[slnc 300]] A rewrite is a rule in the server, invisible to the client.
"""
rows = { missing = "active amber" }
console = [
    ["nope.shop.example: NXDOMAIN with 0 answers", "amber"],
    ["www.other.example: REFUSED, because this server only answers for shop.example", "amber"],
    ["legacy.shop.example is rewritten to www.shop.example and the answer is 203.0.113.10 under the name asked for: legacy.shop.example", "ok"],
    ["a rewrite is a rule in the server, invisible to the client", "muted"],
]

[[act]]
title = "The cache and the countdown of the time to live"
summary = "The cache plugin cuts the zone's 300 seconds to 60, and each answer from the cache has a smaller time to live than the one before."
detail = """
The cache plugin keeps answers for at most 60 seconds, so the zone's 300 is cut to 60. Each answer from the cache has a smaller time to live than the one before, because the cache counts down. A cache makes DNS fast, and keeps a false answer until its time runs out.
"""
speech = """
Fourth demo: the cache. [[slnc 400]] The cache keeps answers for at most sixty seconds, so the zone's three hundred is cut to sixty. [[slnc 600]]
Each answer from the cache has a smaller time to live than the one before. [[slnc 300]] The cache counts down. [[slnc 600]]
A cache makes D N S fast, and keeps a false answer until its time runs out.
"""
rows = { cache = "active amber" }
console = [
    ["the cache plugin keeps answers for at most 60 seconds, so the zone's 300 is cut to 60: true", "muted"],
    ["each answer from the cache has a smaller time to live than the one before: true", "ok"],
    ["the first answer, from the zone file, was not counted down: true", "muted"],
    ["a cache makes DNS fast, and keeps a false answer until its time runs out", "amber"],
]

[[act]]
title = "A zone with a wrong record"
summary = "A record changed to 192.0.2.66 with a day-long time to live is served exactly like the right one, and the cache setting cuts what it hands out to 60 seconds."
detail = """
Someone changes the record for www.shop.example to 192.0.2.66 with a time to live of 86400 seconds. CoreDNS serves it exactly as it serves the right one: the server cannot tell. The cache setting cuts the 86400 seconds to 60 in what it hands out, but a resolver that does not
cap would keep it for a day. Fixing the file fixes the server, not the caches. The defences are around the file: who may change it, review of changes and short times to live for important names. DNSSEC signs the records so that a forged one can be seen, and is described here, not run.
"""
speech = """
Fifth demo: a zone with a wrong record. [[slnc 400]] Someone changes the store's address to another one, with a time to live of a day. [[slnc 600]]
The server serves it exactly as it serves the right one. [[slnc 300]] The server cannot tell. [[slnc 600]]
Here the cache setting cuts that day to sixty seconds, but a resolver that does not cap would keep it for a day. [[slnc 600]]
Fixing the file fixes the server, not the caches. [[slnc 300]] So the defences are around the file. [[slnc 300]] Who may change it. Review of changes. Short times to live. [[slnc 600]]
D N S sec signs the records, so a forged one can be seen.
"""
rows = { wrong = "active wrong" }
console = [
    ["someone changes the record for www.shop.example to 192.0.2.66 with a time to live of 86400 seconds", "muted"],
    ["CoreDNS serves it exactly as it serves the right one: 192.0.2.66  <- THE SERVER CANNOT TELL", "bad"],
    ["the cache setting cuts the 86400 seconds to 60 in what it hands out: true, but a resolver that does not cap would keep it for a day", "amber"],
    ["fixing the file fixes the server, but every resolver that cached the wrong answer keeps it until its time runs out", "amber"],
    ["the defences are around the file: who may change it, review of changes, a short time to live for important names", "ok"],
    ["DNSSEC signs the records, so a resolver can see that a record was not made by the zone's owner (described here, not run)", "ok"],
]

[animation]
subtitle = "An online store's DNS server is asked questions over UDP and TCP and serves a zone, a cache and a wrong record."
boxes = [
