[[scene]]
key = "01-poster"
kind = "poster"
title = "DNS Basics with CoreDNS"
narration = """Hello, and welcome. [[slnc 400]] This video runs a real D N S server called CoreDNS, and asks it questions from Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] D N S turns names into addresses. [[slnc 300]] A server answers from a zone file, a text file of records. [[slnc 600]] Think of a phone book printed from a master list. [[slnc 300]] The printer cannot tell a typo from a fact. [[slnc 300]] A copy shop keeps old pages for a while, and anyone who picks one up believes it. [[slnc 700]] In this video, the domain is an online store. [[slnc 500]] By the end, you will hear how the questions travel over U D P and T C P. [[slnc 300]] What a missing name looks like. [[slnc 300]] How a cache counts down. [[slnc 300]] And why a wrong record is served like a right one."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online store runs its own DNS server.", "", "It serves one zone: shop.example.", "", "The demo asks it questions,", "and then gives it a wrong record."]
narration = """Here is the scenario. [[slnc 400]] An online store runs its own D N S server. [[slnc 500]] It serves one zone, called shop dot example. [[slnc 500]] The demo asks it questions. [[slnc 300]] And then gives it a wrong record."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["Zone file: the records for a name", "Corefile: CoreDNS's configuration", "Plugin: a feature, such as cache", "NXDOMAIN: that name does not exist", "REFUSED: this server will not answer that"]
narration = """Before the demos, the words. [[slnc 500]] A zone file holds the records for a name. [[slnc 500]] The Corefile is CoreDNS's configuration. [[slnc 500]] A plugin is a feature, such as the cache. [[slnc 500]] N X domain means that name does not exist. [[slnc 500]] And refused means this server will not answer that."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "09-ladder"
kind = "bullets"
title = "What Protects a Name"
body = ["Not the server: it serves its files", "Not the cache: it repeats", "Not the wire: it is readable and unsigned", "The files, and who can change them", "DNSSEC signatures, where available"]
narration = """Let's put it together. [[slnc 400]] The server does not protect a name. It serves its files. [[slnc 500]] The cache does not. It repeats. [[slnc 500]] The wire does not. It is readable and unsigned. [[slnc 500]] What protects a name is the file, and who can change it. [[slnc 500]] And, where it is available, D N S sec signatures."""

[[scene]]
key = "10-roles"
kind = "bullets"
title = "Who Does What"
body = ["CoreDns: starts and removes the container", "ShopZone: writes the Corefile and zone", "Client: UDP and TCP questions", "DnsMessage: the wire format", "Tests: the container, checked"]
narration = """Here is who does what in the code. [[slnc 400]] The CoreDns class starts the container, and always removes it. [[slnc 500]] The shop zone class writes the Corefile and the zone file. [[slnc 500]] The client sends questions over U D P and T C P. [[slnc 500]] The D N S message class is the wire format. [[slnc 300]] And the container tests check the real answers."""

[[scene]]
key = "11-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["dig and nslookup", "CoreDNS in Kubernetes", "Zone files with $ORIGIN and SOA", "Incidents where an old answer lingered"]
narration = """You have probably met this already. [[slnc 400]] The commands dig and nslookup send exactly these questions. [[slnc 500]] CoreDNS is the default name service in Kubernetes. [[slnc 500]] Zone files start with an origin and a start of authority record. [[slnc 500]] And many incidents end with, the old answer lingered for hours."""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Control and review zone file changes", "Short times to live for important names", "Sign the zone with DNSSEC if you can", "Watch for records you did not make"]
narration = """So, how do you use it? [[slnc 400]] Control and review changes to zone files. [[slnc 500]] Keep important names on short times to live. [[slnc 500]] Sign the zone with D N S sec if your provider supports it. [[slnc 500]] And watch for records you did not make."""

[[scene]]
key = "13-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a forward block", "and chain two servers together."]
narration = """That's D N S with CoreDNS. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] A D N S server serves exactly what its file says, so the file, and the people who can change it, are what protect the name. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] The demo needs a Java development kit and Docker. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a forward block for a second zone, and chain two servers together. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
An online store's authoritative DNS server for shop.example, run as CoreDNS: its configuration and zone files, the queries it answers over UDP and TCP, and the caches that repeat its answers. It does not cover the registrar, the recursive resolvers customers use, or DNSSEC, which is described and not run.
"""
assets = [
    "The zone file: it decides where customers' browsers go.",
    "The Corefile and the server process.",
    "The server's availability.",
    "The caches that hold its answers.",
]
actors = [
    "The store's operators, who edit zone files.",
    "Resolvers and customers asking questions.",
    "An attacker who can send questions, watch the wire, or edit a file by mistake or by access.",
]
boundaries = [
    "The zone file to the server: whoever can write the file decides every answer.",
    "The server to the network: questions arrive from anyone, and answers are unsigned.",
    "The server to resolver caches: an answer given once is repeated until its time runs out.",
]
assumptions = [
    "In the demo the server is bound to loopback only and run for seconds.",
    "A production server would run with limits on who can send queries and on how fast.",
    "The image is pinned to an exact version and updated when the project updates.",
]
out_of_scope = [
    "Registrar and delegation security.",
    "Recursive resolvers and how they are poisoned: the plain dns-basics project.",
    "DNSSEC and encrypted DNS transports, which are described only.",
]
tests = [
    "`ConfigAndClientTest` checks the Corefile and zone text, the pinned image, and the UDP and TCP client against small servers written in the test.",
    "`DnsMessageTest` checks the DNS wire format.",
    "`CoreDnsContainerTest` (integration) starts CoreDNS and checks answers over UDP and TCP, NXDOMAIN, REFUSED, the rewrite, the counting cache, the wrong record, and that containers are removed.",
    "`DemoRunsTest` (integration) compares the whole demo with the golden output.",
]
next = """
The next project, http-basics-and-headers, moves up a layer: what a web request and a response carry, and the headers that protect browsers.
"""

[[threat]]
id = "T1"
stride = "T"
threat = "A record in the zone file is changed by mistake or by someone who should not"
where = "`ShopZone.zoneFile`"
control = "Restrict who can write the file, review changes, and keep the file in version control"
residual = "The server cannot tell a right record from a wrong one, so detection depends on monitoring from outside"

[[threat]]
id = "T2"
stride = "T"
threat = "A wrong answer lives on in resolvers' caches after the file is fixed"
where = "the `cache` plugin and customers' resolvers"
control = "A cap on cached times to live, and short times to live on important names"
residual = "Resolvers that do not cap keep an answer for its whole time to live"

[[threat]]
id = "T3"
stride = "S"
threat = "A forged answer is accepted, or questions are watched, because plain DNS is unsigned and readable"
where = "`Client`, UDP and TCP"
control = "DNSSEC to sign the records, and encrypted transports to hide the questions (described here, not run)"
residual = "Both depend on the resolver and the client supporting them"

[[threat]]
id = "T4"
stride = "D"
threat = "The server is flooded with questions, or used to amplify an attack on someone else"
where = "`CoreDns`"
control = "Bind to the interfaces needed, rate-limit, and answer only for the store's own zone (a name outside it is REFUSED)"
residual = "A flood larger than the link still takes the service down"
