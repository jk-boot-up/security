[[acronym]]
short = "UDP"
long = "User Datagram Protocol"
say = "U D P is the User Datagram Protocol: one packet each way, no connection."
[[acronym]]
short = "TCP"
long = "Transmission Control Protocol"
say = "T C P is the Transmission Control Protocol: a connection that carries a stream of bytes."
[[acronym]]
short = "TTL"
long = "Time To Live"
say = "T T L is the time to live: how many seconds an answer may be kept."
[[acronym]]
