title = "Classes"
narration = "unused"

[[scene]]
key = "13-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a forward block", "and chain two servers together."]
narration = """That's D N S with CoreDNS. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Every D N S server serves exactly what its file says, so the file, and the people who can change it, are what protect the name. [[slnc 500]] The source code, notes, diagrams and an animated walkthrough are in the repository. [[slnc 300]] The demo needs Java and Docker. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a forward block for a second zone, and chain two servers together. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
An online store's authoritative DNS server for shop.example, run as CoreDNS: its configuration and zone files, the queries it answers over UDP and TCP, and the caches that repeat its answers. It does not cover the registrar, the recursive resolvers customers use, or DNSSEC, which is described and not run.
"""
assets = [
    "The zone file: it decides where customers' browsers go.",
    "The Corefile and the server process.",
    "The server's availability.",
    "The caches that hold its answers.",
]
actors = [
    "The store's operators, who edit zone files.",
    "Resolvers and customers asking questions.",
    "An attacker who can send questions, watch the wire, or edit a file by mistake or by access.",
]
boundaries = [
    "The zone file to the server: whoever can write the file decides every answer.",
    "The server to the network: questions arrive from anyone, and answers are unsigned.",
    "The server to resolver caches: an answer given once is repeated until its time runs out.",
]
assumptions = [
    "In the demo the server is bound to loopback only and run for seconds.",
    "A production server would run with limits on who can send queries and on how fast.",
    "The image is pinned to an exact version and updated when the project updates.",
]
out_of_scope = [
    "Registrar and delegation security.",
    "Recursive resolvers and how they are poisoned: the plain dns-basics project.",
    "DNSSEC and encrypted DNS transports, which are described only.",
]
tests = [
    "`ConfigAndClientTest` checks the Corefile and zone text, the pinned image, and the UDP and TCP client against small servers written in the test.",
    "`DnsMessageTest` checks the DNS wire format.",
    "`CoreDnsContainerTest` (integration) starts CoreDNS and checks answers over UDP and TCP, NXDOMAIN, REFUSED, the rewrite, the counting cache, the wrong record, and that containers are removed.",
    "`DemoRunsTest` (integration) compares the whole demo with the golden output.",
]
next = """
The next project, http-basics-and-headers, moves up a layer: what a web request and a response carry, and the headers that protect browsers.
"""

[[threat]]
id = "T1"
stride = "T"
threat = "A record in the zone file is changed by mistake or by someone who should not"
where = "`ShopZone.zoneFile`"
control = "Restrict who can write the file, review changes, and keep the file in version control"
residual = "The server cannot tell a right record from a wrong one, so detection depends on monitoring from outside"

[[threat]]
id = "T2"
stride = "T"
threat = "A wrong answer lives on in resolvers' caches after the file is fixed"
where = "the `cache` plugin and customers' resolvers"
control = "A cap on cached times to live, and short times to live on important names"
residual = "Resolvers that do not cap keep an answer for its whole time to live"

[[threat]]
id = "T3"
stride = "S"
threat = "A forged answer is accepted, or questions are watched, because plain DNS is unsigned and readable"
where = "`Client`, UDP and TCP"
control = "DNSSEC to sign the records, and encrypted transports to hide the questions (described here, not run)"
residual = "Both depend on the resolver and the client supporting them"

[[threat]]
id = "T4"
stride = "D"
threat = "The server is flooded with questions, or used to amplify an attack on someone else"
where = "`CoreDns`"
control = "Bind to the interfaces needed, rate-limit, and answer only for the store's own zone (a name outside it is REFUSED)"
residual = "A flood larger than the link still takes the service down"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] Six small classes do the work. [[slnc 300]] Here is what each one does."""

[[class]]
name = "CoreDnsDemo"
what = "runs the five acts"
[[class.part]]
title = "two servers, five acts"
code = """
try (CoreDns server = CoreDns.start(ShopZone.corefile(),
        ShopZone.zoneFile(ShopZone.GOOD_ADDRESS, ShopZone.GOOD_TTL))) {
    act1RealServer(out, server);
    act2UdpAndTcp(out, server);
    act3MissingNames(out, server);
    act4Cache(out, server);
}
act5WrongRecord(out);                 // a second server, wrong record
"""
speech = """Core D N S demo starts one server with the right zone, and runs the first four acts against it. [[slnc 300]] The try block always removes the container. [[slnc 300]] Act five starts a second server, with the wrong record."""

[[class]]
name = "ShopZone"
what = "writes the Corefile and the zone file"
[[class.part]]
title = "the two files CoreDNS reads"
code = """
%s:53 {
    file /etc/coredns/%s.db
    rewrite name exact legacy.%s. www.%s.
    cache %d
    errors
}
...
www %d IN A %s
"""
speech = """Shop zone writes the two files CoreDNS starts with. [[slnc 300]] The Corefile serves the zone on port fifty three, with the file, rewrite and cache plugins. [[slnc 300]] In the zone file, the line for w w w holds the time to live and the address. [[slnc 300]] Change that line, and the server's answer changes."""

[[class]]
name = "CoreDns"
what = "starts and removes the container"
[[class.part]]
title = "docker run, on loopback only"
code = """
run(List.of("docker", "run", "-d", "--rm", "--name", name,
        "-p", "127.0.0.1::53/udp", "-p", "127.0.0.1::53/tcp",
        "-v", dir + ":/etc/coredns:ro", IMAGE, "-conf", "/etc/coredns/Corefile"));
...
run(List.of("docker", "stop", "-t", "1", name));     // in close()
"""
speech = """Core D N S starts the pinned CoreDNS image with Docker. [[slnc 300]] Port fifty three is published on loopback only, so nothing outside the machine can ask it. [[slnc 300]] The files are mounted read only, and close stops the container."""

[[class]]
name = "Client"
what = "asks over UDP and over TCP"
[[class.part]]
title = "one datagram, or a length and a stream"
code = """
socket.send(new DatagramPacket(out, out.length, local, port));   // UDP
...
framed.write(out.length >> 8);                                   // TCP: length first
framed.write(out.length & 0xff);
framed.writeBytes(out);
"""
speech = """The client sends the same bytes two ways. [[slnc 300]] Over U D P, one datagram. [[slnc 300]] Over T C P, two length bytes first, then the message. [[slnc 300]] That is the two bytes you saw in act two."""

[[class]]
name = "DnsMessage"
what = "the bytes on the wire"
[[class.part]]
title = "encode: header, name, record"
code = """
put16(out, id);
put16(out, (response ? 0x8180 : 0x0100) | rcode);
...
out.write(label.length);                      // 03 www 04 shop ...
out.writeBytes(label);
...
put16(out, (int) (answer.ttl() >> 16));       // time to live, 4 bytes
put16(out, (int) (answer.ttl() & 0xffff));
put16(out, 4);
put16(out, answer.address() >>> 16);          // address, 4 bytes
put16(out, answer.address() & 0xffff);
"""
speech = """D N S message writes and reads the wire format. [[slnc 300]] The header starts with the id and the flags. [[slnc 300]] Each part of a name goes after its length. [[slnc 300]] And a record ends with the time to live, the length four, and the four address bytes."""

[[class]]
name = "WireSteps"
what = "reads each field back, by hand"
[[class.part]]
title = "the time to live, worked out"
code = """
row(out, "ttl", hex(a, at + 6, 4), number(a, at + 6, 4) + " seconds");
...
value = (value << 8) | (m[i] & 0xff);         // the first byte counts most
"""
speech = """Wire steps prints act one's bytes, field by field, without Docker. [[slnc 300]] Each note is read back from the bytes. [[slnc 300]] Number shifts the value one byte left, and adds the next byte. [[slnc 300]] So zero zero zero one two c becomes three hundred, and a test checks it against the golden output."""

