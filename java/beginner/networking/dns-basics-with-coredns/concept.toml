# concept.toml: everything about this project that is not Java code.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "dns-basics-with-coredns"
module = "networking"
title = "DNS Basics with CoreDNS"
short_title = "DNS with CoreDNS"
package = "dnscoredns"
main_class = "CoreDnsDemo"
tagline = "Run a real DNS server and ask it questions"
bold = "A real DNS server answers exactly what its zone file says, over UDP or TCP, with no signature, so whoever controls the file controls the answer, and every cache repeats it."
domain = "an online store"
domain_note = ""
youtube_description = """DNS basics with CoreDNS, in Java: run a real DNS server in a container and ask it questions with our own code. Explained with an online store, like a phone book that prints whatever the last editor wrote. We query the server over UDP and TCP, see a name that does not exist, a zone it refuses to answer, a rewrite rule, the cache and the countdown of the time to live, and a zone with a wrong record that the server serves exactly like the right one, and finish with what really protects names: control of the zone file, and DNSSEC against answers forged on the way."""
thumb_lines = ["DNS WITH", "COREDNS"]
thumb_code = "file + rewrite + cache"
youtube_title = "DNS Basics with CoreDNS (UDP, TCP, NXDOMAIN, Cache, Wrong Records)"
youtube_tags = ["dns", "coredns", "docker", "nxdomain", "dns cache", "ttl", "zone file", "java", "cybersecurity for beginners"]

[readme]
technologies = [
    ["CoreDNS (container image)", "coredns/coredns:1.14.7", "the real DNS server the Java code asks, pinned to an exact version"],
    ["Docker", "any recent Docker Engine or Docker Desktop", "runs the CoreDNS containers for the demo and the container tests"],
]
intro = """
The plain version of this lesson built DNS messages and a resolver in Java. Here the other side is real: **CoreDNS**, a widely used open-source DNS server, runs in a container. It is configured by a small **Corefile** and serves a **zone file**, a text file of records for
shop.example. Three of its **plugins** are used: **file** serves the zone, **rewrite** answers one name as another, and **cache** keeps answers for a while and counts their time to live down.

The Java code asks it questions over **UDP**, one datagram each way, and over **TCP**, where each message starts with its length in two bytes. It sees a name that does not exist (NXDOMAIN), a name the server will not answer (REFUSED),
and then a zone with a wrong record, which the server serves as faithfully as the right one.
"""
analogy = """
Think of a phone book printed from a master list. The printer prints whatever the list says, in the same ink, with no way to tell a typo from a fact. A copy shop keeps a stack of old pages for a while to save a trip,
and anyone who picks up a page believes it. What protects the shop is who may edit the master list, and a seal on each page that a reader can check.
"""
scenario = """
An online store runs its own DNS server for shop.example. The demo starts it, asks for www, the same question over TCP, a missing name, a name outside the zone and an old name that is rewritten, watches the cache count down, and then starts a server whose zone has a wrong record.
"""
costs = [
    "**The server believes its files.** CoreDNS serves what the zone file says, so control of the file and of the process that writes it is control of the name.",
    "**Caches repeat a wrong answer.** Fixing the file does not recall answers that resolvers and browsers already hold, which is why important names often have short times to live.",
    "**Plain DNS is readable and unsigned.** UDP and TCP carry the question and answer in the clear, and neither proves who made the answer; DNSSEC and encrypted transports address that and are not run here.",
    "**It needs Docker.** The demo and the container tests start real containers, so a running Docker is required, though the default tests are not.",
]
too_much = """
Running your own authoritative DNS server is a real job, and most online stores use a provider's. Understanding what such a server does, and trusting it only as far as its zone's access controls, is the part worth learning.
"""
met_before = [
    "`dig www.shop.example` and `nslookup`, which send exactly these questions.",
    "Kubernetes clusters, where CoreDNS is the default name service.",
    "Corefile and zone-file syntax, shared with many DNS servers.",
    "Short times to live on names that must be able to change quickly.",
]
where = """
This project follows [dns-basics](../dns-basics) and is the fourth in [networking](..). It puts a real server on the other end of the questions that project simulated.
"""
twin = """
A real CoreDNS container serves the zone on free local ports bound to loopback. The demo prints only facts that do not depend on ports, ids or the exact countdown, so it is the same on every run. Containers are always stopped and removed.
"""
test_note = "The ordinary tests need only a JDK: they check the Corefile and zone text, the bytes of act one worked out by `WireSteps` against the golden output, the pinned image, the DNS message encoding and the client against small servers written in the tests. The container tests (tagged docker) start CoreDNS and check real answers, and run with integrationTest. The demo's comparison with its golden output runs with the integration tests, because the demo needs Docker: run `./gradlew integrationTest` after changing the demo or its narration."

[[act]]
title = "A real DNS server, in a container"
summary = "CoreDNS serves the zone file's record for www.shop.example over UDP and repeats the question's id; the question (34 bytes) and the answer (50 bytes) are shown field by field."
detail = """
The zone file for shop.example says www.shop.example is 203.0.113.10 for 300 seconds. Asked over UDP, CoreDNS answers with that address. The answer repeats the question's id and says it is a response. The client trusts it because the id and the question match, and nothing else.
The program then shows both messages byte by byte. The question is 34 bytes: a 12-byte header (id 10 01, flags, counts), the name written as lengths and letters (03 www 04 shop 07 example 00), the type A and the class IN.
The answer is 50 bytes: the same id, response flags, the question again, then the record: a two-byte pointer back to the name at byte 12, type and class, the time to live 00 00 01 2c (1 × 256 + 44 = 300 seconds), the length 4, and the address cb 00 71 0a, one byte per number: 203.0.113.10. Nothing in either message is signed.
"""
figure = "wire_bytes"
figure_title = "The question and the answer, byte by byte"
figure_speech = """
Let's open the two messages. [[slnc 400]] At the top, the question: thirty four bytes. [[slnc 300]] An id picked by the client, the flags, and the counts: one question. [[slnc 300]] Then the name, each part after its length. Three, w w w. Four, shop. Seven, example. And a zero. [[slnc 300]] Last, type A, an address, and class I N, the internet. [[slnc 600]]
Below, the answer. [[slnc 300]] The same id comes back, the flags say response, and the question is copied. [[slnc 300]] Then the record. Its name is a two byte pointer back to byte twelve. [[slnc 600]]
Two fields are worth working out. [[slnc 300]] The time to live ends in zero one, two c. [[slnc 300]] The first byte counts most: one times two hundred and fifty six, plus two c, forty four, makes three hundred seconds. [[slnc 500]]
The address is one number per byte. [[slnc 300]] c b is two hundred and three. Zero. Seven one is one hundred and thirteen. Zero a is ten. [[slnc 600]]
And there is no signature. [[slnc 300]] The id and the question are all the client can check.
"""
speech = """
Here is the program's output. [[slnc 300]] The zone file says the store's address, for three hundred seconds. [[slnc 400]] Asked over U D P, CoreDNS gives exactly that address. [[slnc 400]] The answer repeats the question's id, and says it is a response. [[slnc 400]] That match is all the client checks.
[[page]]
The program prints the question, field by field. [[slnc 300]] The id, the flags, the counts, the name, the type and the class. [[slnc 300]] Thirty four bytes.
[[page]]
And the answer: the same id, the question again, then the record, with its time to live and its address. [[slnc 300]] Fifty bytes.
"""
rows = { server = "active ok" }
console = [
    ["the zone file for shop.example says www.shop.example", "muted"],
    ["  is 203.0.113.10 for 300 seconds", "muted"],
    ["asked over UDP, CoreDNS answers www.shop.example", "ok"],
    ["  is 203.0.113.10", "ok"],
    ["the answer repeats the question's id: true,", "ok"],
    ["  and says it is a response: true", "ok"],
    ["the client trusts it because the id and the question match,", "amber"],
    ["  and nothing else", "amber"],
    ["---", ""],
    ["THE QUESTION (what the client sends over UDP, 34 bytes):", "ok"],
    ["  id         10 01        picked by the client", "muted"],
    ["  flags      01 00        a question, recursion desired", "muted"],
    ["  counts     00 01 00 00  1 question, 0 answers", "muted"],
    ["             00 00 00 00  0 other records", "muted"],
    ["  name       03 www 04 shop 07 example 00", "muted"],
    ["  type       00 01        A: an IPv4 address", "muted"],
    ["  class      00 01        IN: internet", "muted"],
    ["---", ""],
    ["THE ANSWER (as DnsMessage writes it, 50 bytes):", "ok"],
    ["  id         10 01        the question's id, repeated", "muted"],
    ["  flags      81 80        a response, no error", "muted"],
    ["  counts     00 01 00 01  1 question, 1 answer", "muted"],
    ["             00 00 00 00  0 other records", "muted"],
    ["  question   the same 22 bytes", "muted"],
    ["  name       c0 0c        points back to byte 12", "muted"],
    ["  type+class 00 01 00 01  A, IN", "muted"],
    ["  ttl        00 00 01 2c  300 seconds", "muted"],
    ["  length     00 04        4 bytes follow", "muted"],
    ["  address    cb 00 71 0a  203.0.113.10", "muted"],
]

[[act]]
title = "The same question over UDP and over TCP"
summary = "Both give the same address; over TCP each message starts with a two-byte length, so the answer is 2 bytes longer; neither signs or encrypts."
detail = """
Asked over TCP, the server gives the same address. UDP sends the 34-byte question alone, in one datagram. TCP is a stream with no edges, so each message starts with its length in two bytes: 00 22, which is 34 in hexadecimal. So the TCP answer is 2 bytes longer. TCP is used when an answer does not fit in a datagram, and to copy a whole zone between servers. Neither one signs or encrypts anything.
"""
figure = "udp_tcp"
figure_title = "One message, two ways to send it"
figure_speech = """
Now the same question, sent two ways. [[slnc 400]] Over U D P, the thirty four byte message goes alone, in one datagram. [[slnc 300]] A datagram is a single packet, with no connection. [[slnc 600]]
Over T C P, the message travels in a stream. [[slnc 300]] A stream has no edges, so two bytes in front say how long the message is. [[slnc 300]] Zero zero, two two. [[slnc 300]] Two two in hex is thirty four, the length of the message. [[slnc 600]]
Now the answers. [[slnc 300]] Both give the same address. [[slnc 300]] And the T C P answer is two bytes longer: its own length in front. [[slnc 600]]
But neither way signs or encrypts anything. [[slnc 300]] Anyone on the path can read the question and the answer.
"""
speech = """
The program agrees. [[slnc 300]] Both give the same address. [[slnc 300]] Over T C P, the answer is two bytes longer, because of the length in front. [[slnc 400]] T C P is used for answers too big for one datagram, and to copy whole zones. [[slnc 300]] Neither one signs or encrypts.
"""
rows = { transport = "active ok" }
console = [
    ["both give the same address: true", "ok"],
    ["over TCP each message starts with its length in two bytes,", "muted"],
    ["  so the answer is 2 bytes longer", "muted"],
    ["TCP is used when an answer does not fit in a datagram,", "muted"],
    ["  and to copy a whole zone between servers", "muted"],
    ["neither one signs or encrypts anything", "amber"],
]

[[act]]
title = "Names that do not exist, names it will not answer, and a rewrite"
summary = "A missing name gives NXDOMAIN with no answers, a name outside the zone is REFUSED, and legacy.shop.example is rewritten to www and answered under the name asked."
detail = """
nope.shop.example does not exist, so the answer is NXDOMAIN with no answers. www.other.example is outside the zone, so the answer is REFUSED, because the server only answers for shop.example. The old name legacy.shop.example is rewritten to www.shop.example, and
the answer is 203.0.113.10 under the name asked for. A rewrite is a rule in the server, invisible to the client.
"""
figure = "three_names"
figure_title = "Three questions, three kinds of answer"
figure_speech = """
Three more questions. [[slnc 400]] First, nope dot shop dot example. [[slnc 300]] The zone is the server's own, but has no such record. [[slnc 300]] So the answer is N X domain, with zero answers. [[slnc 600]]
Second, w w w dot other dot example. [[slnc 300]] That is not the server's zone at all. [[slnc 300]] So it answers: refused. [[slnc 600]]
Third, legacy dot shop dot example, an old name. [[slnc 300]] A rewrite rule in the Corefile turns it into w w w, before the lookup. [[slnc 300]] The answer is the store's address, but under the name that was asked. [[slnc 500]]
The client never sees the rule.
"""
speech = """
Here is the output. [[slnc 300]] The missing name: N X domain, zero answers. [[slnc 300]] The other zone: refused. [[slnc 300]] And the old name: rewritten, and answered with the store's address, under the old name. [[slnc 300]] The rule is invisible to the client.
"""
rows = { missing = "active amber" }
console = [
    ["nope.shop.example: NXDOMAIN with 0 answers", "amber"],
    ["www.other.example: REFUSED, because this server only", "amber"],
    ["  answers for shop.example", "amber"],
    ["legacy.shop.example is rewritten to www.shop.example", "ok"],
    ["  and the answer is 203.0.113.10", "ok"],
    ["  under the name asked for: legacy.shop.example", "ok"],
    ["a rewrite is a rule in the server, invisible to the client", "muted"],
]

[[act]]
title = "The cache and the countdown of the time to live"
summary = "The cache plugin cuts the zone's 300 seconds to 60, and each answer from the cache has a smaller time to live than the one before."
detail = """
The cache plugin keeps answers for at most 60 seconds, so the zone's 300 is cut to 60: the smaller of the two. Each answer from the cache has a smaller time to live than the one before, because the cache counts down. A cache makes DNS fast, and keeps a false answer until its time runs out.
"""
figure = "cache_ttl"
figure_title = "The cache cuts the time to live, then counts it down"
figure_speech = """
Now the cache. [[slnc 400]] Before the cache, the zone file says: keep this answer for three hundred seconds. [[slnc 300]] The Corefile has a cache line, with sixty. [[slnc 300]] So the cache keeps the smaller of the two: sixty seconds. [[slnc 600]]
After the cache, three answers in a row. [[slnc 300]] The first comes from the zone file. [[slnc 300]] The second comes from the cache, with at most sixty seconds left. [[slnc 300]] The third has less time left than the second. [[slnc 300]] The cache counts down, second by second. [[slnc 600]]
Fast, but a false answer stays until its time runs out.
"""
speech = """
The program checks each of these. [[slnc 300]] Three hundred is cut to sixty: true. [[slnc 300]] Each answer from the cache has less time left than the one before: true. [[slnc 300]] The first, from the file, was not counted down. [[slnc 300]] Fast, and a false answer stays until its time runs out.
"""
rows = { cache = "active amber" }
console = [
    ["the cache plugin keeps answers for at most 60 seconds,", "muted"],
    ["  so the zone's 300 is cut to 60: true", "muted"],
    ["each answer from the cache has a smaller time to live", "ok"],
    ["  than the one before: true", "ok"],
    ["the first answer, from the zone file, was not counted down: true", "muted"],
    ["a cache makes DNS fast, and keeps a false answer", "amber"],
    ["  until its time runs out", "amber"],
]

[[act]]
title = "A zone with a wrong record"
summary = "A record changed to 192.0.2.66 with a day-long time to live is served exactly like the right one, and the cache setting cuts what it hands out to 60 seconds."
detail = """
Someone changes the record for www.shop.example to 192.0.2.66 with a time to live of 86400 seconds: 24 hours × 60 × 60, one day. CoreDNS serves it exactly as it serves the right one: the server cannot tell. The cache setting cuts the 86400 seconds to 60 in what it hands out, but a resolver that does not
cap would keep it for a day. Fixing the file fixes the server, not the caches. The defences are around the file: who may change it, review of changes and short times to live for important names. DNSSEC signs the records so that one forged on the way can be seen, but it signs whatever is in the zone, so a wrong record in the file is signed too; it is described here, not run.
"""
figure = "wrong_record"
figure_title = "Before and after a wrong change to the zone file"
figure_speech = """
The last demo starts a second server, with one wrong line. [[slnc 400]] Before the change, the zone gives the store's real address, and the server serves it. [[slnc 600]]
After the change, someone has written one nine two dot zero dot two dot six six, with a time to live of eighty six thousand four hundred seconds. [[slnc 300]] The server serves it the same way. [[slnc 300]] It cannot tell a wrong line from a right one. [[slnc 600]]
Eighty six thousand four hundred seconds, divided by sixty, and by sixty again, is twenty four hours. One day. [[slnc 300]] Our cache cuts it to sixty seconds, but a resolver without a limit keeps the wrong address for a day. [[slnc 600]]
So the protection is around the file: who may change it, review of changes, and short times to live.
"""
speech = """
The program shows it. [[slnc 300]] The wrong address is served, exactly like the right one. [[slnc 300]] The server cannot tell. [[slnc 400]] The cache cuts the day to sixty seconds here, but not every resolver does. [[slnc 300]] And fixing the file does not reach answers already cached.
[[page]]
The defences are around the file. [[slnc 300]] And D N S sec would show a record forged on the way, but it signs a wrong record in the file too. [[slnc 300]] That part is described, not run.
"""
rows = { wrong = "active wrong" }
console = [
    ["someone changes the record for www.shop.example", "muted"],
    ["  to 192.0.2.66 with a time to live of 86400 seconds", "muted"],
    ["CoreDNS serves it exactly as it serves the right one:", "bad"],
    ["  192.0.2.66  <- THE SERVER CANNOT TELL", "bad"],
    ["the cache setting cuts the 86400 seconds to 60", "amber"],
    ["  in what it hands out: true, but a resolver that does not", "amber"],
    ["  cap would keep it for a day", "amber"],
    ["fixing the file fixes the server, but every resolver that", "amber"],
    ["  cached the wrong answer keeps it until its time runs out", "amber"],
    ["---", ""],
    ["the defences are around the file: who may change it,", "ok"],
    ["  review of changes, a short time to live for important names", "ok"],
    ["DNSSEC lets a resolver see a record forged on the way,", "amber"],
    ["  but it signs whatever is in the zone, wrong records too", "amber"],
    ["  (described, not run)", "amber"],
]

