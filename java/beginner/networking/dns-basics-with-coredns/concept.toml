after = { code = "Corefile + zone file", note = "the file decides", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "DNS Basics with CoreDNS"
narration = """Hello, and welcome. [[slnc 400]] This video runs a real D N S server called CoreDNS, and asks it questions from Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] D N S, the Domain Name System, turns names into addresses. [[slnc 300]] A server answers from a zone file, a text file of records. [[slnc 600]] Think of a phone book: the printer cannot tell a typo from a fact. [[slnc 700]] In this video, the domain is an online store. [[slnc 500]] By the end, you will see a question and its answer byte by byte, [[slnc 200]] how they travel over U D P, the User Datagram Protocol, and T C P, the Transmission Control Protocol, [[slnc 300]] how a cache counts down, [[slnc 300]] and why a wrong record is served like a right one."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online store runs its own DNS server.", "", "It serves one zone: shop.example.", "", "The demo asks it questions,", "and then gives it a wrong record."]
narration = """Here is the scenario. [[slnc 400]] An online store runs its own D N S server. [[slnc 500]] It serves one zone, called shop dot example. [[slnc 500]] The demo asks it questions. [[slnc 300]] And then gives it a wrong record."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["Zone file: the records for a name", "Corefile: CoreDNS's configuration", "Plugin: a feature, such as cache", "Time to live: how long an answer may be kept", "REFUSED: this server will not answer that"]
narration = """Before the demos, the words. [[slnc 500]] A zone file holds the records for a name. [[slnc 500]] The Corefile is CoreDNS's configuration. [[slnc 500]] A plugin is a feature, such as the cache. [[slnc 500]] The time to live says how many seconds an answer may be kept. [[slnc 500]] And refused means this server will not answer that."""

[[scene]]
key = "03-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "04-lookup"
kind = "figure"
title = "One question, one answer"
body = "one_lookup"
narration = """Let's start with one real question. [[slnc 400]] On the left, the question: what is the I P version four address of w w w dot shop dot example? [[slnc 400]] In the middle, CoreDNS looks the name up in its zone file. [[slnc 400]] On the right, the answer: two zero three dot zero dot one one three dot ten, to keep for three hundred seconds. [[slnc 600]] Underneath is the zone file line that made it: [[slnc 200]] the name, the time to live, the class I N for internet, the type A for address, and the address. [[slnc 600]] Like a phone book, the server prints exactly what the file says. [[slnc 300]] Nothing in the answer proves that the file is right."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "09-ladder"
kind = "bullets"
title = "What Protects a Name"
body = ["Not the server: it serves its files", "Not the cache: it repeats", "Not the wire: it is readable and unsigned", "The files, and who can change them", "DNSSEC: against forgery on the way"]
narration = """Let's put it together. [[slnc 400]] The server serves its files. [[slnc 300]] The cache repeats. [[slnc 300]] The wire is readable and unsigned. [[slnc 500]] What protects a name is the file, and who can change it. [[slnc 500]] And D N S sec, which stops answers forged on the way, though not a wrong record in the file."""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Control and review zone file changes", "Short times to live for important names", "Sign the zone with DNSSEC if you can", "Watch for records you did not make"]
narration = """So, how do you use it? [[slnc 400]] Control and review changes to zone files. [[slnc 500]] Keep important names on short times to live. [[slnc 500]] Sign the zone with D N S sec if your provider supports it. [[slnc 500]] And watch for records you did not make."""

[[scene]]
key = "13-classes"
