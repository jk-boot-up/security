narration = """So, how do you use it? [[slnc 400]] Capture briefly, with a filter. [[slnc 500]] Analyse recorded files, on a copy, since live capture needs special rights. [[slnc 500]] Protect captures like passwords. [[slnc 500]] Delete them when the work ends. [[slnc 500]] And use T L S, so that a stolen capture is useless."""

