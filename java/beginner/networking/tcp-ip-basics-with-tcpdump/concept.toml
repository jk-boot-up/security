narration = """That's T C P I P with tcpdump and Python. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] A capture shows what really crossed the wire, and it is as sensitive as the traffic itself. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] The demo runs with nothing installed except a Java development kit. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Open the capture in Wireshark, and find the same flags. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
The handling of packet capture files by an analyst at an online store: recording, reading with tcpdump and scripts, storing and sharing. It does not cover live capture, the network that is being captured, or the content of any protocol above TCP.
"""
assets = [
    "The capture file, which holds every byte that crossed the wire unencrypted.",
    "The analyst's machine, which parses the file.",
    "The places where captures are stored or attached.",
]
actors = [
    "An analyst who records and reads captures.",
    "A thief or colleague who finds a capture.",
    "An attacker who can influence a capture file's contents.",
]
boundaries = [
    "Capture file to the people who can read it: a file moves from a restricted machine to tickets and shared drives.",
    "Capture file to the parser: a file from outside is untrusted input.",
]
assumptions = [
    "Captures are made with permission and a clear purpose.",
    "The analyst works on a copy, on a machine that is kept up to date.",
    "In the demo, all addresses are documentation addresses and the card number is a test value.",
]
out_of_scope = [
    "Live capture and the privileges it needs.",
    "Decrypting TLS captures.",
    "Intrusion detection.",
]
tests = [
    "`CaptureTest` checks the pcap layout, round trips, truncated files, line format, the flood sources, the damaged packet, and the card number in the capture.",
    "`ToolsInteropTest` (integration) checks that the real tcpdump prints the same lines, that tcpdump -v marks the bad checksum, and that the Python script finds the same sources.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next project, dns-basics, looks at how names become addresses, and how that answer too can be forged.
"""

[[threat]]
id = "T1"
stride = "I"
threat = "A capture file with card numbers or cookies is found, attached to a ticket or left on a shared drive"
where = "`Traffic`, `Capture.containsText`"
control = "Capture briefly and with filters, store securely, delete when done, and use TLS so the content is encrypted"
residual = "Metadata such as addresses, sizes and timing remains visible even with TLS"

[[threat]]
id = "T2"
stride = "E"
threat = "A crafted capture file exploits a flaw in the tool that reads it"
where = "`PcapFile.read`"
control = "The reader checks every length and rejects truncated or unexpected files"
residual = "Keep tcpdump and Wireshark up to date, and open files from outside in a disposable environment"

[[threat]]
id = "T3"
stride = "T"
threat = "A damaged or forged packet is trusted because only the application logs were read"
where = "`Capture.damagedCount`"
control = "Recompute checksums when reading a capture"
residual = "A forged packet with a correct checksum is still accepted, so a checksum is not authentication"

[[threat]]
id = "T4"
stride = "R"
threat = "Nobody can show who recorded a capture, or whether it was changed afterwards"
where = "the capture file"
control = "None in pcap: record who captured it and when, and store a hash or signature with it"
residual = "Without signatures a capture is weak evidence"
