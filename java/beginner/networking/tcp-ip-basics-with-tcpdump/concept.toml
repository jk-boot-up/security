[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] Five small classes do the work. [[slnc 300]] Here is what each one does."""

[[class]]
name = "Traffic"
what = "builds the fixed packets of the purchase and the flood"
[[class.part]]
title = "one packet: a TCP segment inside an IP packet"
code = """
TcpSegment segment = new TcpSegment(fromPort, toPort, sequence,
        acknowledgement, flags, 65535, payload);
return new Ipv4Packet(from, to, 64, segment.encode(from, to)).encode();
...
packets.add(packet(CUSTOMER, SHOP, 51000, 443, 1000, 0,
        TcpSegment.SYN, new byte[0]));          // packet 1: the SYN
"""
speech = """Traffic builds every packet. [[slnc 300]] Its T C P segment holds the ports, the seq and ack numbers, the flags and the data, and is wrapped in an I P packet with the two addresses. [[slnc 300]] The first packet is the customer's SYN, starting at one thousand."""

[[class]]
name = "PcapFile"
what = "writes and reads the standard capture file"
[[class.part]]
title = "write: a file header, then a record header per packet"
code = """
header.putInt(MAGIC).putShort((short) 2).putShort((short) 4)
        .putInt(0).putInt(0).putInt(65535).putInt(LINKTYPE_RAW);  // 24 bytes
...
for (byte[] packet : packets) {
...
    record.putInt((int) second++).putInt(0)
            .putInt(packet.length).putInt(packet.length);       // 16 bytes
    out.writeBytes(record.array());
    out.writeBytes(packet);
"""
speech = """P cap file writes the twenty four byte file header, ending with the link type, raw I P. [[slnc 300]] Then, for each packet, a sixteen byte record header with its time and length, and the packet's bytes."""

[[class]]
name = "Capture"
what = "prints tcpdump lines, finds floods and damage"
[[class.part]]
title = "handshakes: who started, who finished"
code = """
String source = Address.text(packet.source());
if (segment.has(TcpSegment.SYN) && !segment.has(TcpSegment.ACK)) {
    finished.putIfAbsent(source, false);           // a handshake started
} else if (segment.has(TcpSegment.ACK) && !segment.has(TcpSegment.SYN)
        && finished.containsKey(source)) {
    finished.put(source, true);                    // and finished
}
"""
speech = """Capture reads the file back. [[slnc 300]] Every source that sends a SYN starts as unfinished. [[slnc 300]] A later plain ACK from it marks the handshake finished. [[slnc 300]] Those still unfinished are the flood."""

[[class]]
name = "ChecksumSteps"
what = "works out a TCP checksum in four steps"
[[class.part]]
title = "split, add, fold, flip"
code = """
segment[16] = 0;                                   // the checksum field counts as zero
segment[17] = 0;
byte[] all = TcpSegment.withPseudoHeader(packet.source(),
        packet.destination(), segment);
List<Integer> words = words(all);                  // step 1
...
    total += word;                                 // step 2: add them up
...
    folded = (folded & 0xffff) + (folded >> 16);   // step 3: fold the carry back in
...
int checksum = ~(int) folded & 0xffff;             // step 4: flip every bit
"""
speech = """Checksum steps redoes the checksum by hand: zero the field, add the pseudo header, split into words, add, fold, and flip. [[slnc 300]] A test proves it matches the packet."""

[[class]]
name = "TcpSegment"
what = "a TCP header and its data, as bytes"
[[class.part]]
title = "encode: the checksum goes into bytes 16 and 17"
code = """
byte[] bytes = body(0);
int checksum = Checksum.of(
        withPseudoHeader(sourceAddress, destinationAddress, bytes));
bytes[16] = (byte) (checksum >> 8);
bytes[17] = (byte) checksum;
"""
speech = """T C P segment turns the fields into bytes, works the checksum out, and puts it in bytes sixteen and seventeen, where the receiver checks it."""
