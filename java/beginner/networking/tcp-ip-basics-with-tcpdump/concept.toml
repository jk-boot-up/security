[[scene]]
key = "01-poster"
kind = "poster"
title = "TCP/IP Basics with tcpdump and Python"
narration = """Hello, and welcome. [[slnc 400]] This video looks at T C P I P, short for Transmission Control Protocol and Internet Protocol, with tcpdump and Python, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] A capture is a file of the packets that crossed a network. [[slnc 300]] Its standard format is P cap, short for packet capture, and tcpdump is the classic tool that reads it. [[slnc 600]] Think of a security camera at the shop door. [[slnc 300]] The tape shows who came in, and in what order. [[slnc 300]] And it is as valuable to a thief as the shop's secrets. [[slnc 700]] In this video, the domain is an online store. [[slnc 500]] You will see what is inside a packet, how a flood and a damaged packet show up, and why a capture needs protecting."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online store records its traffic.", "", "One customer's purchase,", "then a SYN flood,", "then one damaged packet.", "", "What do the packets show?"]
narration = """Here is the scenario. [[slnc 400]] An online store records its traffic to a file. [[slnc 500]] One customer's purchase. [[slnc 300]] Then a flood of first packets. [[slnc 300]] Then one damaged packet. [[slnc 600]] What do the packets show?"""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["Packet: one small piece of traffic", "Capture: a recording of packets", "Port: which program, on a computer", "Handshake: SYN, SYN-ACK, ACK", "Checksum: a number that detects damage"]
narration = """Before the demos, the words. [[slnc 500]] A packet is one small piece of traffic. [[slnc 500]] A capture is a recording of packets. [[slnc 500]] A port says which program, on a computer. [[slnc 500]] A handshake is the three packets that start a connection. [[slnc 500]] And a checksum is a number that detects damage."""

[[scene]]
key = "03-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "04-packet"
kind = "figure"
title = "What is inside one packet"
body = "one_packet"
narration = """Let's start with one real packet: the customer's order, seventy four bytes, in three parts. [[slnc 500]] First, twenty bytes of I P header. [[slnc 300]] It says which computer: from the customer, to the shop. [[slnc 500]] Then twenty bytes of T C P header. [[slnc 300]] It says which program, by port number, here four four three. [[slnc 300]] It numbers the bytes with seq and ack, and its flags say what kind of packet it is. [[slnc 500]] Last, thirty four bytes of data: what the customer typed, card number included. [[slnc 600]] I P carries T C P, and T C P carries the data."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "11-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["tcpdump in troubleshooting guides", ".pcap files in incident reports", "Intrusion detection", "Cloud flow logs and traffic mirroring"]
narration = """You have probably met this already. [[slnc 400]] The command tcpdump is in almost every network troubleshooting guide. [[slnc 500]] Files that end in dot p cap are attached to incident reports. [[slnc 500]] Intrusion detection systems read traffic in the same way. [[slnc 500]] And cloud flow logs are captures with less detail."""

[[scene]]
