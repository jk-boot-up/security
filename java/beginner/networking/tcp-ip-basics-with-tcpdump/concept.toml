# concept.toml: everything about this project that is not Java code.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "tcp-ip-basics-with-tcpdump"
module = "networking"
title = "TCP/IP Basics with tcpdump and Python"
short_title = "TCP/IP with tcpdump"
package = "tcpipdump"
main_class = "TcpdumpDemo"
tagline = "Look at the packets themselves"
bold = "A capture file shows what really arrived, damaged, forged or readable, and tcpdump and a short Python script can read the same file the Java code writes, but a capture is as sensitive as the traffic it holds."
domain = "an online store"
domain_note = ""
youtube_description = """TCP/IP basics with tcpdump and Python, in Java: packets are easier to understand when you can look at them. Explained with an online store, like a security camera recording at the shop door. We write a capture file in the standard pcap format, have the real tcpdump tool print the same lines as our Java code, find a SYN flood in a capture with a short independent Python script, spot a packet with a bad checksum, and finish with the bill: a capture file holds the card number in the clear, so it must be protected like the traffic itself."""
thumb_lines = ["TCP/IP WITH", "TCPDUMP + PYTHON"]
thumb_code = "tcpdump -nn -r capture.pcap"
youtube_title = "TCP/IP Basics with tcpdump and Python (pcap, SYN Flood, Checksums)"
youtube_tags = ["tcpdump", "pcap", "wireshark", "syn flood", "tcp", "packet capture", "python", "java", "cybersecurity for beginners"]

[readme]
technologies = [
    ["tcpdump", "4.99.1 (libpcap 1.10.1)", "the independent check that prints the capture the Java code writes; needed for the integration tests"],
    ["Python", "3.14", "runs the independent flood detector in python/; standard library only"],
]
intro = """
The plain version of this lesson built packets in memory. Real investigations start from a **capture**: a file of the packets that crossed a network interface. The standard format is **pcap**, a 24-byte file header and then, for each packet, a
16-byte record header and the packet's bytes. **tcpdump** is the classic command-line tool that records and prints captures, and Wireshark is its graphical cousin. Because pcap is a standard, this project writes a capture from Java
and lets tcpdump read it, and a short independent **Python** script finds the half-open handshakes of a SYN flood in the same file.

The demo records a customer's purchase, reads it back in tcpdump's format, finds a flood and a damaged packet, and ends with the cost: the capture holds the card number in the clear.
"""
analogy = """
Think of a security camera at the shop door. What the guards remember is one thing, what the tape shows is another. Reading the tape afterwards tells you who came in, in what order, and whether anyone was loitering, and the tape is
exactly as valuable to a thief as the shop's own secrets, so it is kept in a locked room.
"""
scenario = """
An online store records the traffic of one customer's purchase, then of a SYN flood. The demo writes the capture, prints it as tcpdump would, finds the sources that never finished a handshake, and finds a packet whose checksum is wrong.
"""
costs = [
    "**A capture is sensitive data.** It holds whatever crossed the wire, such as card numbers and cookies when TLS is not used, so it needs the same protection as the traffic.",
    "**Live capture needs privileges.** Reading from a network interface needs special rights, usually root, so work from recorded files, on a copy.",
    "**Captures grow fast.** A busy server can fill a disk in minutes, so capture filters and short captures are the habit.",
    "**A capture shows the wire, not the application.** With TLS you see sizes and timing, not content, which is the point of TLS.",
]
too_much = """
For understanding, a small capture and tcpdump are always worth it. For a production incident, use captures sparingly, with filters, for a short time, and store them securely, because the capture itself is a copy of every secret that crossed the wire.
"""
met_before = [
    "`tcpdump` and Wireshark in every network troubleshooting guide.",
    "`.pcap` and `.pcapng` files attached to incident reports.",
    "Intrusion detection systems, which analyse traffic in the same way.",
    "Cloud \"traffic mirroring\" and \"flow logs\", which are captures with less detail.",
]
where = """
This project follows [tcp-ip-basics](../tcp-ip-basics) and is the second in [networking](..). It adds a tool for looking at what that project modelled.
"""
twin = """
The capture is written by Java with fixed timestamps, addresses and sequence numbers, so the file is identical every time. tcpdump and Python are used only by the integration tests, which compare their output with the Java code's. The demo itself
needs no tool, so it is the same on every machine. Live capture is not used.
"""
test_note = "The capture file is written with fixed timestamps and packets, so it is identical every time. The ordinary tests need only a JDK; the integration tests (tagged tools) compare tcpdump's real output and a Python script's answer with the Java code's."

[[act]]
title = "Recording a purchase to a capture file"
summary = "A purchase of 5 packets, 234 bytes, becomes a 338-byte pcap file: 24 bytes of file header, then 16 bytes of record header before each packet."
detail = """
Before recording, the purchase is five packets: four of 40 bytes (an IP header of 20 bytes and a TCP header of 20 bytes, no data) and the order of 74 bytes, which carries 34 bytes of data: 234 bytes in all.
After recording, the pcap file holds a 24-byte file header, then for each packet a 16-byte record header (its time and length) and its bytes: 24 + 5 x 16 + 234 = 338 bytes. tcpdump, Wireshark and the Python script all read the same file.
"""
figure = "pcap_layout"
figure_title = "Before and after recording: packets into a pcap file"
figure_speech = """
First demo: recording a purchase. [[slnc 400]] At the top, before recording, are the five packets of one purchase. [[slnc 300]] Four are forty bytes: just the two headers, no data. [[slnc 300]] The order is seventy four bytes, because it carries thirty four bytes of data. [[slnc 600]]
Below, after recording, is the P cap file. [[slnc 300]] A file header of twenty four bytes. [[slnc 300]] Then, before each packet, a record header of sixteen bytes, with its time and its length. [[slnc 600]]
Twenty four, plus five times sixteen, plus two hundred and thirty four: three hundred and thirty eight bytes.
"""
speech = """
Here is the same thing, printed by the program. [[slnc 400]] Before recording: the five packets, with their flags and sizes. [[slnc 500]] After recording: the headers and the packet bytes, three hundred and thirty eight bytes in all.
"""
rows = { record = "active ok" }
console = [
    ["BEFORE RECORDING (the packets of one purchase):", "ok"],
    ["  packet 1  [S]   40 bytes = IP 20 + TCP 20 + data 0", "muted"],
    ["  packet 2  [S.]  40 bytes = IP 20 + TCP 20 + data 0", "muted"],
    ["  packet 3  [.]   40 bytes = IP 20 + TCP 20 + data 0", "muted"],
    ["  packet 4  [P.]  74 bytes = IP 20 + TCP 20 + data 34", "muted"],
    ["  packet 5  [.]   40 bytes = IP 20 + TCP 20 + data 0", "muted"],
    ["  5 packets, 234 bytes", "muted"],
    ["AFTER RECORDING (the pcap file):", "bad"],
