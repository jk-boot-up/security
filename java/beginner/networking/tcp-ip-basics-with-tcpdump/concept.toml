[[act]]
title = "Reading it back, in the style of tcpdump"
summary = "Each packet is printed with its addresses, ports, flags, sequence and acknowledgement numbers and length, exactly as the real tcpdump prints it; each ack is worked out from the other side's seq."
detail = """
What tcpdump prints is one line per packet (shown here over two lines): source and destination with ports, the flags, the sequence number, the acknowledgement, the window and the length. S is SYN, a dot is ACK and P is PSH. The first three packets are the handshake and the fourth is the order.
How the numbers follow: the shop's ack 1001 is the customer's seq 1000 plus 1, because a SYN counts as one byte; the customer's ack 7001 is the shop's seq 7000 plus 1; and the shop's last ack 1035 is 1001 plus the 34 bytes of the order. The integration test checks that the real tcpdump prints exactly the same lines.
"""
figure = "handshake"
figure_title = "The handshake and the order, packet by packet"
figure_speech = """
Second demo: reading the file back. [[slnc 400]] The customer is on the left, the shop on the right. [[slnc 600]]
Packet one, a SYN, says: let's talk, my first number is one thousand. [[slnc 500]] Packet two, the shop's SYN ACK, answers one thousand and one: one more, because a SYN counts as one byte. [[slnc 300]] The shop starts its own numbers at seven thousand. [[slnc 500]]
Packet three answers seven thousand and one, and the handshake is done. [[slnc 500]] Packet four is the order, thirty four bytes. [[slnc 300]] So the shop's last ack is one thousand and one, plus thirty four: one thousand and thirty five. [[slnc 400]] An ack always means: I have every byte before this one.
"""
speech = """
This is what tcpdump prints. [[slnc 400]] Each packet takes two lines here: who it is from and to, with ports. [[slnc 300]] Then the flags, the seq and ack numbers, the window, and the data length. [[slnc 300]] The real tcpdump prints exactly these lines, and a test checks that.
[[page]]
And here the program works out each ack from the other side's seq. [[slnc 400]] Plus one for a SYN. [[slnc 300]] Plus thirty four for the order's data.
"""
rows = { read = "active ok" }
console = [
    ["WHAT TCPDUMP PRINTS (one packet, two lines):", "muted"],
    ["  IP 198.51.100.7.51000 > 203.0.113.10.443:", "muted"],
    ["     Flags [S], seq 1000, win 65535, length 0", "muted"],
    ["  IP 203.0.113.10.443 > 198.51.100.7.51000:", "muted"],
    ["     Flags [S.], seq 7000, ack 1001, win 65535, length 0", "muted"],
    ["  IP 198.51.100.7.51000 > 203.0.113.10.443:", "muted"],
    ["     Flags [.], ack 7001, win 65535, length 0", "muted"],
    ["  IP 198.51.100.7.51000 > 203.0.113.10.443:", "muted"],
    ["     Flags [P.], seq 1001:1035, ack 7001, win 65535, length 34", "muted"],
    ["  IP 203.0.113.10.443 > 198.51.100.7.51000:", "muted"],
    ["     Flags [.], ack 1035, win 65535, length 0", "muted"],
    ["S is SYN, a dot is ACK, P is PSH", "muted"],
    ["---", ""],
    ["HOW THE NUMBERS FOLLOW:", "amber"],
    ["  packet 2  ack 1001 = seq 1000 + 1", "muted"],
    ["  packet 3  ack 7001 = seq 7000 + 1", "muted"],
    ["  packet 5  ack 1035 = seq 1001 + 34 bytes of data", "muted"],
    ["a SYN counts as one byte", "muted"],
]

[[act]]
title = "Finding a SYN flood in a capture"
summary = "Of 14 packets, 9 sources sent a SYN and never finished the handshake; only the real customer finished."
detail = """
The capture has 14 packets: the purchase (5), a burst of 8 SYNs, and one more SYN. The finding: for each source that sent a SYN, did it send the final ACK? The customer 198.51.100.7 did. Nine sources never finished: 100.64.0.1 to 100.64.0.8 and 100.64.0.99.
The real customer is not among them. A flood is told by handshakes that never finish, not by where they come from, because its addresses are often forged. An independent Python script finds the same sources.
"""
figure = "flood"
figure_title = "Who started a handshake, and who finished it"
figure_speech = """
Third demo: a SYN flood. [[slnc 400]] At the top, the capture: fourteen packets. [[slnc 300]] The purchase in green, eight SYNs in amber, and one more SYN in red. [[slnc 600]]
Below, the finding. [[slnc 300]] For each address that sent a SYN: did it ever send the final ACK? [[slnc 400]] The real customer did. [[slnc 300]] Nine addresses never did. [[slnc 300]] Each one makes the shop wait, with memory set aside, and thousands can lock real customers out. [[slnc 500]]
We judge by behaviour, not by address, because flood addresses are often forged.
"""
speech = """
Here is the program's output. [[slnc 400]] The capture section counts the packets. [[slnc 300]] The finding section shows one finished handshake, the customer's, and nine sources that never finished. [[slnc 300]] The real customer is not among them. [[slnc 300]] A short, independent Python script finds the same nine.
"""
rows = { flood = "active amber" }
console = [
    ["THE CAPTURE (14 packets):", "ok"],
    ["  the purchase         5 packets", "muted"],
    ["  a burst of SYNs      8 packets", "muted"],
    ["  one more SYN         1 packet", "muted"],
    ["THE FINDING (who started a handshake, who finished it):", "bad"],
    ["  finished        198.51.100.7", "muted"],
    ["  never finished  9 sources", "muted"],
    ["    100.64.0.1   100.64.0.2   100.64.0.3", "muted"],
    ["    100.64.0.4   100.64.0.5   100.64.0.6", "muted"],
    ["    100.64.0.7   100.64.0.8   100.64.0.99", "muted"],
    ["  the real customer is among them: false", "muted"],
    ["a flood is told by handshakes that never finish", "muted"],
]

[[act]]
title = "How a checksum is made, step by step"
summary = "The TCP checksum of one SYN is worked out by hand in four steps, split, add, fold and flip, and comes out as the 70cf the packet carries."
detail = """
The packet is the last SYN, from 100.64.0.99, as it was sent. Step 1: the bytes are split into 16-bit words: a pseudo-header (the two addresses, the protocol number 6 for TCP and the TCP length, 20) and the 20-byte TCP header with its checksum field set to 0000.
Step 2: the sixteen words are added up: 38f2d, one hex digit too long for 16 bits. Step 3: the carry is folded back in: 8f2d + 3 = 8f30. Step 4: every bit is flipped: 70cf, the checksum the packet carries. The receiver does the same sum to check it.
"""
figure = "checksum_steps"
figure_title = "How the TCP checksum is made"
figure_speech = """
Fourth demo: how a checksum is made, for the last SYN, as it was sent. [[slnc 600]]
Step one. [[slnc 300]] Split the bytes into sixteen bit words. [[slnc 300]] First a pseudo header: the two addresses, the protocol number six for T C P, and the length, twenty. [[slnc 300]] Then the T C P header, with its checksum field set to zero. [[slnc 600]]
Step two. [[slnc 300]] Add all sixteen words: three eight f two d. [[slnc 300]] Five hex digits, one too many. [[slnc 500]]
Step three. [[slnc 300]] Fold the extra digit back in: eight f two d, plus three, is eight f three zero. [[slnc 500]]
Step four. [[slnc 300]] Flip every bit: seven zero c f. [[slnc 300]] That is the checksum. [[slnc 300]] The receiver does the same sum to check it.
"""
speech = """
Here are the same four steps, printed by the program. [[slnc 400]] The words. [[slnc 200]] The sum. [[slnc 200]] The fold. [[slnc 200]] And the flipped result, seven zero c f. [[slnc 400]] The last line compares it with the checksum the packet carries. [[slnc 300]] The same.
"""
rows = { checksum = "active ok" }
console = [
    ["the packet: the SYN from 100.64.0.99, as it was sent", "muted"],
    ["STEP 1. SPLIT INTO 16-BIT WORDS (checksum field 0000):", "amber"],
    ["  pseudo-header  6440 0063 cb00 710a 0006 0014", "muted"],
    ["  TCP header     9ca3 01bb 0000 0007 0000 0000", "muted"],
    ["                 5002 ffff 0000 0000", "muted"],
    ["STEP 2. ADD THEM UP:", "amber"],
    ["  sum            38f2d", "muted"],
    ["STEP 3. FOLD THE CARRY BACK IN:", "amber"],
    ["  8f2d + 3 = 8f30", "muted"],
    ["STEP 4. FLIP EVERY BIT:", "amber"],
    ["  checksum       70cf", "muted"],
    ["the checksum the packet carries: 70cf, the same: true", "muted"],
]

[[act]]
title = "Finding a damaged packet"
summary = "Before the damage the checksum 70cf matches; after one byte changed on the way it reads 25cf, no longer matches, and one packet in the capture fails its checksum."
detail = """
Before the damage, the SYN carries the checksum 70cf and working it out again gives 70cf: a match. After the damage, one byte changed on the way, so the packet carries 25cf, while working it out again still gives 70cf: no match.
One packet in the whole capture fails its checksum. Plain tcpdump shows it like any other packet; with the verbose option -v it marks the checksum incorrect. A capture shows what arrived, damaged or forged.
"""
figure = "damage"
figure_title = "Before and after the damage"
figure_speech = """
Fifth demo: a damaged packet. [[slnc 400]] At the top, before the damage. [[slnc 300]] The packet carries seven zero c f, and working it out again gives seven zero c f. [[slnc 300]] A match. [[slnc 600]]
Below, after the damage. [[slnc 300]] On the way, one byte changed: seven zero became two five. [[slnc 300]] Worked out again, it is still seven zero c f. [[slnc 300]] No match: the packet was damaged, or carelessly forged. [[slnc 500]]
Plain tcpdump prints it like any other. [[slnc 300]] With dash v, for verbose, it marks the checksum incorrect.
"""
speech = """
The program's output shows the same two sections. [[slnc 400]] Before the damage: a match. [[slnc 300]] After the damage: no match. [[slnc 400]] In the whole capture, exactly one packet fails its checksum.
"""
rows = { damaged = "active amber" }
console = [
    ["BEFORE THE DAMAGE (the SYN as it was sent):", "ok"],
    ["  checksum in the packet  70cf", "muted"],
    ["  worked out again        70cf  match: true", "muted"],
    ["AFTER THE DAMAGE (the same SYN as it arrived):", "bad"],
    ["  checksum in the packet  25cf", "muted"],
    ["  worked out again        70cf  match: false", "muted"],
    ["packets in the capture whose checksum does not match: 1", "muted"],
    ["tcpdump -v marks it incorrect; plain tcpdump does not", "muted"],
]

[[act]]
title = "What a capture reveals"
summary = "The capture holds the order, card number included, in bytes 40 to 73 of packet 4, so a capture file is as sensitive as the traffic; only TLS makes it useless to a thief."
detail = """
What the customer sent is the order card=4111111111111111&order=A-1001, without TLS. What the capture holds, in packet 4, bytes 40 to 73, is exactly the same text. A capture file is as sensitive as the traffic, so protect it like a password and capture only what the investigation needs.
Live capture needs special rights, usually root, so analyse recorded files, on a copy. Encryption with TLS is what makes a capture useless to a thief.
"""
figure = "reveal"
figure_title = "What the customer sent, and what the capture holds"
figure_speech = """
Last demo: what a capture reveals. [[slnc 400]] At the top, what the customer sent: the order, with a card number. [[slnc 300]] This shop does not use T L S, so it travels as plain text. [[slnc 600]]
Below, what the capture file holds: packet four, bytes forty to seventy three, right after the two headers. [[slnc 300]] The same order, with the card number marked in red. [[slnc 600]]
Anyone with a copy of this file can read it. [[slnc 300]] So a capture is as sensitive as the traffic itself. [[slnc 300]] With T L S, those bytes would be scrambled.
"""
speech = """
In the program's output: what the customer sent, then what the capture holds. [[slnc 400]] The same text, and the check says true. [[slnc 400]] So protect a capture like a password, and capture only what you need.
"""
rows = { reveal = "active wrong" }
console = [
    ["WHAT THE CUSTOMER SENT (the order, without TLS):", "ok"],
    ["  card=4111111111111111&order=A-1001", "muted"],
    ["WHAT THE CAPTURE HOLDS (packet 4, bytes 40 to 73):", "bad"],
    ["  card=4111111111111111&order=A-1001", "muted"],
    ["  the capture contains the card number: true", "muted"],
    ["A CAPTURE FILE IS AS SENSITIVE AS THE TRAFFIC", "bad"],
    ["protect it like a password; capture only what you need", "muted"],
    ["with TLS, a thief would see only scrambled bytes here", "muted"],
]

