# concept.toml: everything about this project that is not Java code.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "tcp-ip-basics-with-tcpdump"
module = "networking"
title = "TCP/IP Basics with tcpdump and Python"
short_title = "TCP/IP with tcpdump"
package = "tcpipdump"
main_class = "TcpdumpDemo"
tagline = "Look at the packets themselves"
bold = "A capture file shows what really arrived, damaged, forged or readable, and tcpdump and a short Python script can read the same file the Java code writes, but a capture is as sensitive as the traffic it holds."
domain = "an online store"
domain_note = ""
youtube_description = """TCP/IP basics with tcpdump and Python, in Java: packets are easier to understand when you can look at them. Explained with an online store, like a security camera recording at the shop door. We write a capture file in the standard pcap format, have the real tcpdump tool print the same lines as our Java code, find a SYN flood in a capture with a short independent Python script, spot a packet with a bad checksum, and finish with the bill: a capture file holds the card number in the clear, so it must be protected like the traffic itself."""
thumb_lines = ["TCP/IP WITH", "TCPDUMP + PYTHON"]
thumb_code = "tcpdump -nn -r capture.pcap"
youtube_title = "TCP/IP Basics with tcpdump and Python (pcap, SYN Flood, Checksums)"
youtube_tags = ["tcpdump", "pcap", "wireshark", "syn flood", "tcp", "packet capture", "python", "java", "cybersecurity for beginners"]

[readme]
technologies = [
    ["tcpdump", "4.99.1 (libpcap 1.10.1)", "the independent check that prints the capture the Java code writes; needed for the integration tests"],
    ["Python", "3.14", "runs the independent flood detector in python/; standard library only"],
]
intro = """
The plain version of this lesson built packets in memory. Real investigations start from a **capture**: a file of the packets that crossed a network interface. The standard format is **pcap**, a 24-byte file header and then, for each packet, a
16-byte record header and the packet's bytes. **tcpdump** is the classic command-line tool that records and prints captures, and Wireshark is its graphical cousin. Because pcap is a standard, this project writes a capture from Java
and lets tcpdump read it, and a short independent **Python** script finds the half-open handshakes of a SYN flood in the same file.

The demo records a customer's purchase, reads it back in tcpdump's format, finds a flood and a damaged packet, and ends with the cost: the capture holds the card number in the clear.
"""
analogy = """
Think of a security camera at the shop door. What the guards remember is one thing, what the tape shows is another. Reading the tape afterwards tells you who came in, in what order, and whether anyone was loitering, and the tape is
exactly as valuable to a thief as the shop's own secrets, so it is kept in a locked room.
"""
scenario = """
An online store records the traffic of one customer's purchase, then of a SYN flood. The demo writes the capture, prints it as tcpdump would, finds the sources that never finished a handshake, and finds a packet whose checksum is wrong.
"""
costs = [
    "**A capture is sensitive data.** It holds whatever crossed the wire, such as card numbers and cookies when TLS is not used, so it needs the same protection as the traffic.",
    "**Live capture needs privileges.** Reading from a network interface needs root, so work from recorded files, on a copy.",
    "**Captures grow fast.** A busy server can fill a disk in minutes, so capture filters and short captures are the habit.",
    "**A capture shows the wire, not the application.** With TLS you see sizes and timing, not content, which is the point of TLS.",
]
too_much = """
For understanding, a small capture and tcpdump are always worth it. For a production incident, use captures sparingly, with filters, for a short time, and store them securely, because the capture itself is a copy of every secret that crossed the wire.
"""
met_before = [
    "`tcpdump` and Wireshark in every network troubleshooting guide.",
    "`.pcap` and `.pcapng` files attached to incident reports.",
    "Intrusion detection systems, which analyse traffic in the same way.",
    "Cloud \"traffic mirroring\" and \"flow logs\", which are captures with less detail.",
]
where = """
This project follows [tcp-ip-basics](../tcp-ip-basics) and is the second in [networking](..). It adds a tool for looking at what that project modelled.
"""
twin = """
The capture is written by Java with fixed timestamps, addresses and sequence numbers, so the file is identical every time. tcpdump and Python are used only by the integration tests, which compare their output with the Java code's. The demo itself
needs no tool, so it is the same on every machine. Live capture is not used.
"""
test_note = "The capture file is written with fixed timestamps and packets, so it is identical every time. The ordinary tests need only a JDK; the integration tests (tagged tools) compare tcpdump's real output and a Python script's answer with the Java code's."

[[act]]
title = "Recording traffic to a capture file"
summary = "A purchase of 5 packets, 234 bytes, becomes a 338-byte pcap file: a 24-byte file header and 16 bytes of header for each packet."
detail = """
A customer's purchase is 5 packets and 234 bytes. In a pcap file it is 24 bytes of file header, then 16 bytes of header and the packet bytes for each packet: 338 bytes. tcpdump, Wireshark and the Python script all read the same file.
"""
speech = """
First demo: recording traffic. [[slnc 400]] A customer's purchase is five packets. [[slnc 600]]
In a P CAP file, it has a file header, and a small header for each packet. [[slnc 600]]
The same file can be read by tcpdump, by Wireshark, and by the Python script.
"""
rows = { record = "active ok" }
console = [
    ["a customer's purchase is 5 packets, 234 bytes", "muted"],
    ["in a pcap file it is 24 bytes of file header, then 16 bytes of header and the packet bytes for each packet: 338 bytes", "muted"],
    ["tcpdump, Wireshark and the Python script all read the same file", "ok"],
]

[[act]]
title = "Reading it back, in the style of tcpdump"
summary = "Each packet is printed with its addresses, ports, flags, sequence numbers and length, and the lines are the same as the real tcpdump prints."
detail = """
Each packet is printed as one line: source and destination with ports, the flags, the sequence number, the acknowledgement, the window and the length. S is SYN, a dot is ACK and P is PSH. The first three lines are the handshake and the fourth is the order itself.
The integration test checks that the real tcpdump prints exactly the same lines.
"""
speech = """
Second demo: reading it back. [[slnc 400]] Each packet is one line. [[slnc 300]] Who it is from, who it is to, the flags, the numbers, and the length. [[slnc 600]]
The first three lines are the handshake. [[slnc 300]] The fourth is the order itself. [[slnc 600]]
The real tcpdump prints exactly the same lines, and a test checks that.
"""
rows = { read = "active ok" }
console = [
    ["IP 198.51.100.7.51000 > 203.0.113.10.443: Flags [S], seq 1000, win 65535, length 0", "muted"],
    ["IP 203.0.113.10.443 > 198.51.100.7.51000: Flags [S.], seq 7000, ack 1001, win 65535, length 0", "muted"],
    ["IP 198.51.100.7.51000 > 203.0.113.10.443: Flags [.], ack 7001, win 65535, length 0", "muted"],
    ["IP 198.51.100.7.51000 > 203.0.113.10.443: Flags [P.], seq 1001:1035, ack 7001, win 65535, length 34", "ok"],
    ["S is SYN, a dot is ACK, P is PSH: the handshake is the first three lines, and the order is the fourth", "muted"],
]

[[act]]
title = "Finding a SYN flood in a capture"
summary = "Of 14 packets, 9 sources sent a SYN and never finished the handshake; the real customer is not among them."
detail = """
The capture has 14 packets: the purchase, then 8 SYNs from addresses that never answer, then one more. Sources that sent a SYN and never finished the handshake: 9. The real customer is not among them. They are all from the same network, which is what a flood often looks like.
An independent Python script finds the same sources.
"""
speech = """
Third demo: finding a SYN flood. [[slnc 400]] The capture has fourteen packets. [[slnc 600]]
Nine sources started a handshake and never finished it. [[slnc 300]] The real customer is not one of them. [[slnc 600]]
They are all from the same network, which is what a flood often looks like. [[slnc 300]] A short Python script finds the same nine.
"""
rows = { flood = "active amber" }
console = [
    ["the capture has 14 packets: the purchase, then 8 SYNs from addresses that never answer, then one more", "muted"],
    ["sources that sent a SYN and never finished the handshake: 9", "amber"],
    ["the real customer is among them: false", "ok"],
    ["the first of them is 100.64.0.1 and they are all from the same network, which is what a flood often looks like", "amber"],
]

[[act]]
title = "Finding a damaged packet"
summary = "One packet has a wrong checksum; plain tcpdump shows it like any other, and tcpdump -v marks the checksum incorrect."
detail = """
One packet in the capture has a checksum that does not match. Plain tcpdump shows it like any other packet. With the verbose option it marks the checksum incorrect. A capture shows what arrived, damaged or forged, which is why it is the first thing to look at.
"""
speech = """
Fourth demo: a damaged packet. [[slnc 400]] One packet has a checksum that does not match. [[slnc 600]]
Plain tcpdump shows it like any other. [[slnc 300]] With the verbose option, it marks the checksum incorrect. [[slnc 600]]
A capture shows what arrived, damaged or forged.
"""
rows = { damaged = "active amber" }
console = [
    ["packets whose checksum does not match: 1", "amber"],
    ["tcpdump without -v shows it like any other; with -v it marks the checksum incorrect", "muted"],
    ["a capture shows what arrived, damaged or forged, which is why it is the first thing to look at", "muted"],
]

[[act]]
title = "What a capture reveals"
summary = "The capture contains the card number in the clear, so a capture file is as sensitive as the traffic; only TLS makes it useless to a thief."
detail = """
The capture contains the card number. A capture file is as sensitive as the traffic, so protect it like passwords and capture only what the investigation needs. Live capture needs root, so analyse recorded files without it, on a copy.
Encryption with TLS is what makes a capture useless to a thief.
"""
speech = """
Fifth demo: what a capture reveals. [[slnc 400]] The capture contains the card number. [[slnc 600]]
So a capture file is as sensitive as the traffic. [[slnc 300]] Protect it like a password. [[slnc 600]]
Live capture needs root, so analyse recorded files instead, on a copy. [[slnc 600]]
Encryption with T L S is what makes a capture useless to a thief.
"""
rows = { reveal = "active wrong" }
console = [
    ["the capture contains the card number: true  <- A CAPTURE FILE IS AS SENSITIVE AS THE TRAFFIC", "bad"],
    ["so protect capture files like passwords, and capture only what the investigation needs", "amber"],
    ["live capture needs root, so analyse recorded files without it, on a copy", "amber"],
    ["encryption with TLS is what makes a capture useless to a thief", "ok"],
]

[animation]
subtitle = "An online store records its traffic to a capture file and reads it with tcpdump and Python."
boxes = [
    ["record", "Record", "write a pcap file"],
    ["read", "Read", "tcpdump lines, from Java or the real tool"],
    ["flood", "Find a flood", "handshakes that never finish"],
    ["damaged", "Find damage", "a checksum that does not match"],
    ["reveal", "What it reveals", "everything that was not encrypted"],
]

[docs.dependencies]
intro = """
This project adds no Java library. It uses two command-line tools, and only for the integration tests.
"""
what = [
    ["tcpdump", "the classic command-line packet capture and analysis tool, built on libpcap. The tests run `tcpdump -r` on the file the Java code wrote, to prove the format is the standard one."],
    ["Python", "runs `python/unfinished_handshakes.py`, written with the standard library only, as an independent second implementation of the flood check."],
]
why = """
The plain project modelled packets in memory. A tool that other people wrote, reading the file this project writes, is the proof that the model matches reality.
"""
install_note = "A JDK for the demo and the ordinary tests. For the integration tests, tcpdump and Python 3 on the PATH (both are present on macOS and most Linux systems). The versions are pinned where Gradle controls them:"
versions = [
    ["tcpdump", "4.99.1"],
    ["libpcap", "1.10.1"],
    ["Python", "3.14"],
    ["Java", "25"],
    ["JUnit", "6.1.3"],
]
costs = [
    "The integration tests need tcpdump and Python installed.",
    "The Java formatter copies tcpdump's line format for TCP only; tcpdump prints far more protocols.",
]

[docs.problem]
scenario = """
An online store wants to understand what its server really received during a purchase and during a flood, without taking the server down or guessing.
"""
naive = """
Read logs, which show what the application saw and not what the network delivered.
"""
deliver = [
    "A pcap capture file written from Java, byte for byte in the standard format.",
    "The lines of tcpdump's output reproduced in Java, and checked against the real tool.",
    "A flood detector in Java and an independent one in Python that agree.",
    "A damaged packet found by its checksum.",
    "A demonstration that a capture holds secrets.",
]

[docs.prerequisites]
required = [
    "Java basics",
    "The tcp-ip-basics project, or an idea of what a SYN, ACK and sequence number are",
]
not_required = [
    "Root access: only recorded files are read",
    "Wireshark, though it opens the same file",
]
install = ["tcpdump and Python 3 for the integration tests only"]

[docs.session]
objectives = [
    "describe the pcap file format",
    "read a line of tcpdump output",
    "find an unfinished handshake in a capture",
    "say why a capture file needs protection",
]
walkthrough = """
Start with the security camera. Run the demo, then open the capture with the real tcpdump and match the lines. Ask what in the capture would be safe if TLS were used, and what would still show.
"""
exercises = [
    "Open the capture in Wireshark and find the same flags.",
    "Add a filter to the Java reader that prints only packets to port 443.",
    "Change the flood to come from many networks and see what the Python script reports.",
    "Run `tcpdump -nn -t -S -v -r` and find the checksum line for the damaged packet.",
]

[docs.explained]
sentence = """
A capture file records what really crossed the wire in a standard format, so tools like tcpdump and short scripts can show handshakes, floods and damaged packets, and because it holds everything that was not encrypted, it must be protected like the traffic.
"""
verdict = """
Learn to read a capture with tcpdump and Wireshark, keep captures short and filtered, store them securely, and delete them when the investigation ends.
"""
recognise = [
    "`tcpdump -nn -i eth0 port 443` in runbooks.",
    "`.pcap` files in incident reports.",
    "Cloud traffic mirroring and VPC flow logs.",
]

[spec]
purpose = """
Teach how to look at packets by writing a standard pcap file from Java, reading it with the real tcpdump and an independent Python script, and finding a flood and a damaged packet.
"""
nongoals = [
    "Live capture from an interface, which needs root.",
    "Protocols other than TCP over IPv4.",
    "Intrusion detection rules.",
]
problem = """
Packets are abstract until you have seen them; learners need to see real ones, with a tool they will meet at work.
"""
roles = [["pcap file format", "`PcapFile`"], ["The traffic", "`Traffic`"], ["Reading, flood and damage checks", "`Capture`"], ["IPv4 and TCP", "`Ipv4Packet`, `TcpSegment`"], ["Independent flood check", "`python/unfinished_handshakes.py`"], ["Entry point", "`TcpdumpDemo`"]]
requirements = [
    "The capture file has the documented pcap layout and round-trips.",
    "The Java lines equal the real tcpdump's lines for the same file.",
    "The Python script and the Java code find the same unfinished handshakes.",
    "A damaged packet is found, and tcpdump -v marks it incorrect.",
    "The demo needs no tool and prints the same output on every run.",
]

