[poster]
headline = [["HTTP BASICS AND", "text"], ["SECURITY HEADERS", "accent"]]
taglines = [["A web request is just text, and every line of it is the sender's choice", "gold"]]
before = { code = "Set-Cookie: session=abc", note = "readable, and sent anywhere", tag = "BEFORE" }
after = { code = "Secure; HttpOnly; SameSite=Lax", note = "plus five security headers", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "HTTP Basics and Security Headers"
narration = """Hello, and welcome. [[slnc 400]] This video explains H T T P basics and security headers, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] H T T P, the HyperText Transfer Protocol, is how browsers talk to web servers. [[slnc 300]] A message is plain text, and the sender writes every line. [[slnc 600]] Think of an order form filled in by hand. [[slnc 300]] The clerk and the warehouse must read it the same way. [[slnc 700]] In this video, the domain is an online store. [[slnc 500]] You will see how a request is read strictly, how header injection works, how cookies are set safely, and which headers tell the browser what to refuse."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online store sits behind a proxy.", "", "It receives requests from browsers", "and from anyone else,", "sets a login cookie,", "and sends pages browsers must handle safely."]
narration = """Here is the scenario. [[slnc 400]] An online store sits behind a proxy. [[slnc 500]] It receives requests from browsers, and from anyone else. [[slnc 300]] It sets a login cookie. [[slnc 300]] And it sends pages that browsers must handle safely."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["Header: a name and a value, one line", "Body: the data after the blank line", "Cookie: a small value the browser sends back", "Proxy: a program that passes requests on", "Security header: tells the browser what to refuse"]
narration = """Before the demos, the words. [[slnc 500]] A header is a name and a value, on one line. [[slnc 500]] The body is the data after the blank line. [[slnc 500]] A cookie is a small value that the browser sends back with every request. [[slnc 500]] A proxy is a program in front of the server that passes requests on. [[slnc 500]] And a security header tells the browser what to refuse."""

[[scene]]
key = "03-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "04-request"
kind = "figure"
title = "One request, as plain text"
body = "request_text"
narration = """Let's start with one real request. [[slnc 400]] A customer orders two of item A one zero zero one. [[slnc 400]] The browser sends five lines of text. [[slnc 300]] The request line: post, slash orders, H T T P one point one. [[slnc 300]] Two headers: the host, and the content length. [[slnc 300]] A blank line. [[slnc 300]] And the body. [[slnc 600]] Each line ends with backslash r, backslash n, in red. [[slnc 300]] Carriage return and line feed: two invisible characters. [[slnc 500]] So the request line is twenty one characters, plus two: twenty three. [[slnc 300]] Add up every line, and you get eighty two. [[slnc 600]] At the bottom, the body: seventeen characters. [[slnc 300]] That is why the content length says seventeen. [[slnc 300]] It tells the server where the body ends."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "11-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Developer tools: the Network tab", "curl -v", "Header scanners and grades", "Smuggling advisories for proxies"]
narration = """You have probably met this already. [[slnc 400]] The network tab in your browser's developer tools shows every header. [[slnc 500]] The command curl, with the dash v option, prints both messages. [[slnc 500]] Header scanners give sites a grade. [[slnc 500]] And security advisories for proxies often mention request smuggling."""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Keep the proxy and server updated", "Refuse ambiguity, and log it", "Encode customer text in headers", "HttpOnly, Secure, SameSite on the session", "Five headers, with real values"]
narration = """So, how do you use it? [[slnc 400]] Keep the proxy and the server up to date. [[slnc 500]] Refuse ambiguous messages, and log them. [[slnc 500]] Encode customer text before it reaches a header. [[slnc 500]] Set the session cookie with HttpOnly, Secure and SameSite. [[slnc 500]] And send the five headers, with values that really restrict the browser."""

[[scene]]
key = "13-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "13-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a sixth header", "to the auditor."]
narration = """That's H T T P basics and security headers. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] A web request is just text that the sender wrote, so read it strictly, keep customer text out of headers, and tell the browser what to refuse. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine, with nothing installed except a Java development kit. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a sixth header to the auditor. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
An online store's HTTP handling: how a proxy and server read requests, how the store builds response headers and cookies from customer text, and which security headers it sends to the browser. It covers an attacker who can send crafted requests and text.
It does not cover TLS, the contents of pages, or the web application's own logic.
"""
assets = [
    "The customer's session cookie.",
    "The integrity of each request: that it means the same to every program that reads it.",
    "The response headers that set the browser's rules.",
    "Other customers' requests in the same connection.",
]
actors = [
    "Customers and their browsers.",
    "An attacker who can craft requests and customer text.",
    "The proxy and the server in front of the store.",
]
boundaries = [
    "Internet to proxy: every byte is chosen by the sender.",
    "Proxy to server: the two must read the bytes alike.",
    "Customer text to response headers: line breaks must not cross it.",
    "Server to browser: security headers are the store's only way to set the browser's rules.",
]
assumptions = [
    "The browser enforces the headers it is sent.",
    "Transport is protected by TLS, which is the next module.",
    "In the demo, the proxy is not run: its disagreement with the server is shown by the strict parser's refusals.",
]
out_of_scope = [
    "TLS and certificates.",
    "Cross-site scripting in the page itself, which Content-Security-Policy limits but does not remove.",
    "HTTP/2 and HTTP/3 framing.",
]
tests = [
    "`ParserTest` checks round trips and the refusal of both lengths, differing lengths, spaces before colons, folded headers, bare line feeds, wrong body lengths and header injection.",
    "`CookieAndHeaderTest` checks cookie judgement, header scores for empty, hardened and badly set headers, and a real loopback exchange.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next module, transport security, starts with the TLS handshake: how a connection like these becomes private and authenticated.
"""

[[threat]]
id = "T1"
stride = "T"
threat = "A request is read differently by the proxy and the server, hiding a second request"
where = "`HttpParser`"
control = "Refuse both Content-Length and Transfer-Encoding, differing lengths, odd header names, folding and bare line feeds"
residual = "Real proxies and servers must be configured and updated to be as strict, and HTTP/2 end to end removes the ambiguity"

[[threat]]
id = "T2"
stride = "T"
threat = "Customer text with a line break adds a header or splits the response"
where = "`HttpResponse.serialize`"
control = "Refuse line breaks in header names and values"
residual = "Encoding the text is better than refusing it, so the customer still gets an answer"

[[threat]]
id = "T3"
stride = "I"
threat = "A session cookie is read by a script, sent over plain HTTP or sent by another site"
where = "`Cookie.problems`"
control = "HttpOnly, Secure, SameSite and the __Host- prefix"
residual = "A cookie that is still stolen from the device or by a network observer on HTTP is valid until it expires"

[[threat]]
id = "T4"
stride = "E"
threat = "The browser allows a page to be framed, sniffed, downgraded or to run any script"
where = "`HeaderAudit`"
control = "Strict-Transport-Security, Content-Security-Policy, X-Content-Type-Options, X-Frame-Options, Referrer-Policy"
residual = "Headers reduce what an injected script can do, and do not remove the injection"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] Six small classes, plus the demo that runs the five acts. [[slnc 300]] Here is what each one does."""

[[class]]
name = "HttpRequest"
what = "a request, and how it is written as text"
[[class.part]]
title = "writing the request as text"
code = """
StringBuilder text = new StringBuilder(method).append(' ')
        .append(target).append(' ').append(version).append("\\r\\n");
for (Map.Entry<String, String> header : headers.entrySet()) {
    text.append(header.getKey()).append(": ").append(header.getValue()).append("\\r\\n");
}
return text.append("\\r\\n").append(new String(body, StandardCharsets.ISO_8859_1)).toString();
"""
speech = """H T T P request is the message as a record. [[slnc 300]] Serialize writes it as text: the request line, then each header as a name, a colon and a value. [[slnc 300]] Every line ends with backslash r backslash n, and a blank line comes before the body."""

[[class]]
name = "HttpParser"
what = "reads a request strictly and refuses anything ambiguous"
[[class.part]]
title = "the checks that stop smuggling"
code = """
String key = name.toLowerCase(Locale.ROOT);          // not the machine's language
...
if (headers.containsKey("transfer-encoding") && headers.containsKey("content-length")) {
    throw new BadMessageException("both Content-Length and Transfer-Encoding");
}
...
if (body.length != expected) {
    throw new BadMessageException("Content-Length says " + expected
            + " bytes but " + body.length + " follow");
}
"""
speech = """The parser is the strict reader. [[slnc 300]] It lower cases header names with the root locale, so Turkish rules cannot change them. [[slnc 300]] It refuses two ways of giving the length. [[slnc 300]] And it refuses a body that is not exactly as long as the content length says."""

[[class]]
name = "HttpResponse"
what = "a response that refuses line breaks in headers"
[[class.part]]
title = "no line break in a header value"
code = """
if (header.getValue().indexOf('\\r') >= 0 || header.getValue().indexOf('\\n') >= 0) {
    throw new BadMessageException("a line break inside the value of " + header.getKey());
}
"""
speech = """The response is where header injection is stopped. [[slnc 300]] Before writing a header, it looks for a carriage return or a line feed in the value. [[slnc 300]] If there is one, it refuses to write the response at all."""

[[class]]
name = "Cookie"
what = "parses a Set-Cookie header and lists its problems"
[[class.part]]
title = "what is wrong for a login cookie"
code = """
if (!httpOnly) {
    problems.add("no HttpOnly: a script in the page can read it");
}
if (!secure) {
    problems.add("no Secure: it is also sent over plain HTTP");
}
if (sameSite == null) {
...
if (name.startsWith("__Host-") && (!secure || !"/".equals(path) || hasDomain)) {
"""
speech = """The cookie class reads the attributes, then lists the problems. [[slnc 300]] No HttpOnly, no Secure, no SameSite: one problem each. [[slnc 300]] And a host prefix cookie must be Secure, with the path slash and no domain."""

[[class]]
name = "HeaderAudit"
what = "one point per security header, judged by its value"
[[class.part]]
title = "a header is only worth its value"
code = """
findings.add(hsts(h.get("strict-transport-security")));
findings.add(csp(h.get("content-security-policy")));
...
return age >= 31536000 ? new Finding("Strict-Transport-Security", true, "max-age at least a year")
        : new Finding("Strict-Transport-Security", false, "max-age under a year");
"""
speech = """The header audit checks the five headers, one finding each. [[slnc 300]] It looks at the value, not just the name. [[slnc 300]] For example, strict transport security passes only with a max age of at least a year, in seconds."""

[[class]]
name = "LoopbackExchange"
what = "a real server and client on this machine"
[[class.part]]
title = "a real exchange over a socket"
code = """
HttpServer server = HttpServer.create(new InetSocketAddress(InetAddress.getLoopbackAddress(), 0), 0);
...
extraHeaders.forEach((name, value) -> exchange.getResponseHeaders().add(name, value));
...
java.net.http.HttpResponse<String> response = client.send(
        HttpRequest.newBuilder(uri).GET().build(), BodyHandlers.ofString());
"""
speech = """The loopback exchange runs Java's own server and client on this machine. [[slnc 300]] The server adds the headers it was given. [[slnc 300]] The client sends a real request, so the audit judges headers that really crossed a socket."""

[[acronym]]
short = "HTTP"
long = "HyperText Transfer Protocol"
say = "H T T P is the HyperText Transfer Protocol: the plain text messages that browsers and web servers send."
[[acronym]]
short = "HTTPS"
long = "HTTP Secure (HTTP inside an encrypted connection)"
say = "H T T P S is H T T P Secure: the same messages, sent inside an encrypted connection."
[[acronym]]
short = "HSTS"
long = "HTTP Strict Transport Security"
say = "H S T S is H T T P Strict Transport Security: a header that tells the browser to use H T T P S only."
[[acronym]]
short = "CRLF"
long = "Carriage Return, Line Feed (\\r\\n, the end of a line)"
say = "C R L F is carriage return, line feed: the two characters, backslash r and backslash n, that end every line."
