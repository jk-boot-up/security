body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a sixth header", "to the auditor."]
narration = """That's H T T P basics and security headers. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] A web request is just text that the sender wrote, so read it strictly, keep customer text out of headers, and tell the browser what to refuse. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine, with nothing installed except a Java development kit. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a sixth header to the auditor. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
An online store's HTTP handling: how a proxy and server read requests, how the store builds response headers and cookies from customer text, and which security headers it sends to the browser. It covers an attacker who can send crafted requests and text.
It does not cover TLS, the contents of pages, or the web application's own logic.
"""
assets = [
    "The customer's session cookie.",
    "The integrity of each request: that it means the same to every program that reads it.",
    "The response headers that set the browser's rules.",
    "Other customers' requests in the same connection.",
]
actors = [
    "Customers and their browsers.",
    "An attacker who can craft requests and customer text.",
    "The proxy and the server in front of the store.",
]
boundaries = [
    "Internet to proxy: every byte is chosen by the sender.",
    "Proxy to server: the two must read the bytes alike.",
    "Customer text to response headers: line breaks must not cross it.",
    "Server to browser: security headers are the store's only way to set the browser's rules.",
]
assumptions = [
    "The browser enforces the headers it is sent.",
    "Transport is protected by TLS, which is the next module.",
    "In the demo, the proxy is not run: its disagreement with the server is shown by the strict parser's refusals.",
]
out_of_scope = [
    "TLS and certificates.",
    "Cross-site scripting in the page itself, which Content-Security-Policy limits but does not remove.",
    "HTTP/2 and HTTP/3 framing.",
]
tests = [
    "`ParserTest` checks round trips and the refusal of both lengths, differing lengths, spaces before colons, folded headers, bare line feeds, wrong body lengths and header injection.",
    "`CookieAndHeaderTest` checks cookie judgement, header scores for empty, hardened and badly set headers, and a real loopback exchange.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next module, transport security, starts with the TLS handshake: how a connection like these becomes private and authenticated.
"""

[[threat]]
id = "T1"
stride = "T"
threat = "A request is read differently by the proxy and the server, hiding a second request"
where = "`HttpParser`"
control = "Refuse both Content-Length and Transfer-Encoding, differing lengths, odd header names, folding and bare line feeds"
residual = "Real proxies and servers must be configured and updated to be as strict, and HTTP/2 end to end removes the ambiguity"

[[threat]]
id = "T2"
stride = "T"
threat = "Customer text with a line break adds a header or splits the response"
where = "`HttpResponse.serialize`"
control = "Refuse line breaks in header names and values"
residual = "Encoding the text is better than refusing it, so the customer still gets an answer"

[[threat]]
id = "T3"
stride = "I"
threat = "A session cookie is read by a script, sent over plain HTTP or sent by another site"
where = "`Cookie.problems`"
control = "HttpOnly, Secure, SameSite and the __Host- prefix"
residual = "A cookie that is still stolen from the device or by a network observer on HTTP is valid until it expires"

[[threat]]
id = "T4"
stride = "E"
threat = "The browser allows a page to be framed, sniffed, downgraded or to run any script"
where = "`HeaderAudit`"
control = "Strict-Transport-Security, Content-Security-Policy, X-Content-Type-Options, X-Frame-Options, Referrer-Policy"
residual = "Headers reduce what an injected script can do, and do not remove the injection"
