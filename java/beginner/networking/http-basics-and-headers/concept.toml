[[act]]
title = "Messages that two programs could read differently"
summary = "Content-Length says 4 but 4 + 21 + 20 + 2 = 47 bytes follow, a second request hidden after the body: refused. Both length headers, Turkish capitals, two lengths and a space before the colon are refused too; the exact request is accepted."
detail = """
A proxy and a server in a chain must agree where a request ends. A request says Content-Length: 4, but after the four body bytes abcd comes a whole second request: GET /admin HTTP/1.1\\r\\n (21 bytes),
Host: shop.example\\r\\n (20) and a blank line (2), so 4 + 21 + 20 + 2 = 47 bytes follow the blank line. A proxy that trusts Content-Length stops after 4 bytes and reads the other 43 as the next customer's request,
which is the idea behind request smuggling. The strict parser refuses it: Content-Length says 4 bytes but 47 follow.
It also refuses Content-Length and Transfer-Encoding together, the same with TRANSFER-ENCODING in capitals on a machine set to Turkish (where the capital I lower-cases to a dotless ı, so header names are
lower-cased without the machine's locale), two different Content-Length headers, and a space before the colon. The same request, plain and exact, is accepted.
"""
figure = "smuggling"
figure_title = "One request, two ends: a request hidden after the body"
figure_speech = """
Now a request with a trick in it. [[slnc 400]] Its headers say content length four. [[slnc 300]] So the body is four bytes: a, b, c, d, in green. [[slnc 400]] But more bytes follow, in red. [[slnc 300]] A whole second request: get slash admin, a host line, and a blank line. [[slnc 600]]
Count them. [[slnc 300]] Four, plus twenty one, plus twenty, plus two. [[slnc 300]] Forty seven bytes after the blank line. [[slnc 600]]
Now two programs read it. [[slnc 300]] A proxy that trusts the content length stops after four bytes. [[slnc 300]] It passes the other forty three on as the next customer's request. [[slnc 300]] So get slash admin reaches the server, and no check ever saw it. [[slnc 300]] That is request smuggling. [[slnc 600]]
Our strict parser refuses the whole message instead. [[slnc 300]] Four bytes were promised, but forty seven follow.
"""
speech = """
Here is the program's output. [[slnc 400]] First, the request: the four byte body, then the three hidden lines, with their byte counts. [[slnc 300]] Four plus twenty one plus twenty plus two is forty seven. [[slnc 500]]
Then the parser's answer: refused. [[slnc 300]] And what a proxy that trusts the content length would do instead.
[[page]]
The parser refuses more messages that two programs could read differently. [[slnc 400]] Content length and transfer encoding together: two ways to say where the body ends. [[slnc 400]] Transfer encoding in capitals, on a machine set to Turkish. [[slnc 300]] In Turkish, a capital I lower cases to a dotless i, so the name would no longer match. [[slnc 300]] The parser lower cases names without the machine's language, so it is still refused. [[slnc 400]]
Two different lengths, and a space before the colon, are refused too. [[slnc 300]] The plain, exact request is accepted.
"""
rows = { ambiguity = "active wrong" }
console = [
    ["THE REQUEST (Content-Length: 4, then more after the body):", "ok"],
    ["  body     abcd                        4 bytes", "muted"],
    ["  hidden   GET /admin HTTP/1.1\\r\\n    21 bytes", "muted"],
    ["  hidden   Host: shop.example\\r\\n     20 bytes", "muted"],
    ["  hidden   \\r\\n                        2 bytes", "muted"],
    ["  after the blank line: 4 + 21 + 20 + 2 = 47 bytes", "muted"],
    ["THE PARSER'S ANSWER:", "ok"],
    ["  refused: Content-Length says 4 bytes but 47 follow", "muted"],
    ["  a proxy that trusts Content-Length stops after 4 bytes", "muted"],
    ["  and reads the other 43 as the next customer's request", "muted"],
    ["---", ""],
    ["MORE MESSAGES THAT TWO PROGRAMS COULD READ DIFFERENTLY:", "ok"],
    ["  Content-Length and Transfer-Encoding together", "muted"],
    ["    refused: both Content-Length and Transfer-Encoding", "muted"],
    ["  TRANSFER-ENCODING on a machine set to Turkish", "ok"],
    ["    Turkish lower case: transfer-encodıng (dotless i)", "muted"],
    ["    refused: both Content-Length and Transfer-Encoding", "muted"],
    ["  two different Content-Length headers", "muted"],
    ["    refused: two different Content-Length headers", "muted"],
    ["  a space before the colon: 'Content-Length : 4'", "muted"],
    ["    refused: a space or odd character in a header name", "muted"],
    ["  the same request, plain and exact", "muted"],
    ["    accepted", "muted"],
]

[[act]]
title = "Header injection"
summary = "Search text with a line break adds a Set-Cookie header the attacker wrote; after the fix, the normal search is written and the attack is refused."
detail = """
The store puts the customer's search text in the Location header of a redirect. A normal search, shoes, is written as Location: /search?q=shoes. The attack text is shoes\\r\\nSet-Cookie: session=attacker.
Before the fix, written as it is, the browser reads three lines: the status line, Location: /search?q=shoes and Set-Cookie: session=attacker, a header the attacker wrote. After the fix, the writer refuses a line break
inside any header value, so the attack is refused. The answer is to refuse or encode line breaks in anything that reaches a header.
"""
figure = "injection"
figure_title = "A line break in the search text adds a header"
figure_speech = """
After a search, the store sends a redirect. [[slnc 300]] It puts the customer's search text into the location header. [[slnc 500]] At the top, in green, two search texts. [[slnc 300]] A normal one, shoes. [[slnc 300]] And an attack: shoes, then backslash r, backslash n, which is a line break, then set cookie, session equals attacker. [[slnc 600]]
Before the fix, in red, the text goes into the header as it is. [[slnc 300]] The browser sees the line break, and reads three lines. [[slnc 300]] The third one is a set cookie header that the attacker wrote. [[slnc 300]] Now the customer's browser carries the attacker's session. [[slnc 600]]
After the fix, in green, the writer checks every header value. [[slnc 300]] The normal search is written. [[slnc 300]] The attack is refused, because of the line break inside the location value.
"""
speech = """
Here is the same, printed by the program. [[slnc 400]] The search text, normal, and attack. [[slnc 400]] Before the fix: three lines, with the attacker's cookie last. [[slnc 400]] After the fix: shoes is written, and the attack is refused.
"""
rows = { injection = "active wrong" }
console = [
    ["THE SEARCH TEXT (typed by the customer):", "ok"],
    ["  normal   shoes", "muted"],
    ["  attack   shoes\\r\\nSet-Cookie: session=attacker", "muted"],
    ["BEFORE THE FIX (the attack, put in the redirect as it is):", "ok"],
    ["  HTTP/1.1 302 Found", "ok"],
    ["  Location: /search?q=shoes", "muted"],
    ["  Set-Cookie: session=attacker  <- WRITTEN BY THE ATTACKER", "muted"],
    ["AFTER THE FIX (line breaks refused when writing a header):", "ok"],
    ["  normal   written: Location: /search?q=shoes", "muted"],
    ["  attack   refused: a line break inside the value of Location", "muted"],
]

[[act]]
title = "Cookies that carry a login"
summary = "A bare cookie has three problems; Secure, HttpOnly, SameSite=Lax and Path=/ has none; SameSite=None without Secure has two; a __Host- cookie with a Domain has one."
detail = """
Four cookies are judged. session=abc123 has three problems: no HttpOnly, no Secure and no SameSite. With Secure, HttpOnly, SameSite=Lax and Path=/ it has none.
With HttpOnly and SameSite=None but no Secure it has two. And a cookie with the __Host- prefix and a Domain attribute has one, because that prefix needs Secure, Path=/ and no Domain.
"""
figure = "cookies"
figure_title = "Four cookies, checked one attribute at a time"
figure_speech = """
After login, the store sends a cookie that carries the session. [[slnc 400]] On the left, in green, four ways to send it. [[slnc 300]] On the right, in red, the verdict, one attribute at a time. [[slnc 600]]
Cookie one has no attributes. [[slnc 300]] No HttpOnly, so a script in the page can read it. [[slnc 300]] No Secure, so it also travels over plain H T T P. [[slnc 300]] No SameSite, so another site can make the browser send it. [[slnc 300]] Three problems. [[slnc 500]]
Cookie two sets all three, and the path. [[slnc 300]] No problems. [[slnc 500]]
Cookie three says SameSite none, but has no Secure. [[slnc 300]] Browsers reject that, so two problems. [[slnc 500]]
Cookie four uses the host prefix, which promises Secure, the path slash, and no domain. [[slnc 300]] It sets a domain, so one problem.
"""
speech = """
The program prints two cookies at a time, exactly as the store sends them. [[slnc 300]] Then the verdict for each. [[slnc 400]] Cookie one: three problems, each with its reason. [[slnc 300]] Cookie two: none.
[[page]]
Cookie three: two problems, no Secure, and SameSite none without Secure. [[slnc 300]] Cookie four: one problem, the host prefix with a domain.
"""
rows = { cookie = "active amber" }
console = [
    ["THE COOKIES (what the store sends in Set-Cookie):", "ok"],
    ["  cookie 1  session=abc123", "muted"],
    ["  cookie 2  session=abc123; Secure; HttpOnly;", "muted"],
    ["            SameSite=Lax; Path=/", "ok"],
    ["THE VERDICT (what is wrong, if it carries a login):", "ok"],
    ["  cookie 1  3 problems", "muted"],
    ["    - no HttpOnly: a script in the page can read it", "muted"],
    ["    - no Secure: it is also sent over plain HTTP", "muted"],
    ["    - no SameSite: other sites can make the browser send it", "muted"],
    ["  cookie 2  0 problems", "muted"],
    ["---", ""],
    ["THE COOKIES (what the store sends in Set-Cookie):", "ok"],
    ["  cookie 3  session=abc123; HttpOnly; SameSite=None", "muted"],
    ["  cookie 4  __Host-session=abc123; Secure; HttpOnly;", "muted"],
    ["            SameSite=Strict; Path=/; Domain=shop.example", "ok"],
    ["THE VERDICT (what is wrong, if it carries a login):", "ok"],
    ["  cookie 3  2 problems", "muted"],
    ["    - no Secure: it is also sent over plain HTTP", "muted"],
    ["    - SameSite=None without Secure: browsers reject it", "muted"],
    ["  cookie 4  1 problem", "muted"],
    ["    - the __Host- prefix needs Secure, Path=/ and no Domain", "muted"],
]

[[act]]
title = "Security headers on a real response"
summary = "A real local server with no security headers scores 0 of 5, the same server with the five headers scores 5 of 5, and the five headers set badly score 0 + 0 + 1 + 0 + 0 = 1 of 5."
detail = """
A real request to a plain server on this machine returns status 200 and none of the five security headers: 0 of 5. The same request to a server that sets the five headers scores 5 of 5: Strict-Transport-Security,
Content-Security-Policy, X-Content-Type-Options, X-Frame-Options and Referrer-Policy. Headers present but set badly (max-age=300, script-src 'unsafe-inline', nosniff, ALLOWALL, unsafe-url) score
0 + 0 + 1 + 0 + 0 = 1 of 5, because a header is only worth its value.
"""
figure = "header_audit"
figure_title = "Five headers, three responses, three scores"
figure_speech = """
Security headers tell the browser what to refuse. [[slnc 400]] Strict transport security: use H T T P S only. [[slnc 300]] Content security policy: load scripts only from this site. [[slnc 300]] Content type options, no sniff: do not guess file types. [[slnc 300]] Frame options: do not show this page inside another site. [[slnc 300]] Referrer policy: do not leak the full address. [[slnc 600]]
In green, the headers of three real responses. [[slnc 300]] The plain server sends none of them. [[slnc 300]] The hardened server sends all five, with strong values. [[slnc 300]] The last one sends all five, but sets four of them badly. [[slnc 600]]
In red, the audit. [[slnc 300]] One point per header. [[slnc 300]] Zero out of five, five out of five, and one out of five. [[slnc 300]] A header is only worth its value.
"""
speech = """
The program starts a real server and client on this machine. [[slnc 300]] The plain server answers with status two hundred and the order. [[slnc 300]] The hardened server answers the same, plus these five headers. [[slnc 400]] The audit adds one point per header: zero out of five, and five out of five.
[[page]]
Last, the five headers set badly. [[slnc 300]] A max age of three hundred seconds, under a year. [[slnc 300]] A policy that allows inline scripts. [[slnc 300]] Frame options that allow all. [[slnc 300]] And a referrer policy that leaks the address. [[slnc 300]] Only no sniff passes. [[slnc 300]] Zero plus zero plus one plus zero plus zero: one out of five.
"""
rows = { headers = "active ok" }
console = [
    ["THE RESPONSES (a real server and client on this machine):", "ok"],
    ["  plain server     status 200, body 'order A-1001 received'", "muted"],
    ["  hardened server  status 200, the same body, and these five:", "muted"],
    ["  Strict-Transport-Security max-age=31536000; includeSubDomains", "muted"],
    ["  Content-Security-Policy   default-src 'self'; script-src 'self'", "muted"],
    ["  X-Content-Type-Options    nosniff", "muted"],
    ["  X-Frame-Options           DENY", "muted"],
    ["  Referrer-Policy           strict-origin-when-cross-origin", "muted"],
    ["THE AUDIT (one point per header):", "ok"],
