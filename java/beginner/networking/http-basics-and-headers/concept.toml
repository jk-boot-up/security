# concept.toml: everything about this project that is not Java code.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "http-basics-and-headers"
module = "networking"
title = "HTTP Basics and Security Headers"
short_title = "HTTP and Headers"
package = "http"
main_class = "HttpDemo"
tagline = "A web request is just text, and every line of it is the sender's choice"
bold = "HTTP messages are plain text that the sender controls, so a server must read them strictly, never put raw text in a header, set cookies with care, and tell the browser what to refuse with security headers."
domain = "an online store"
domain_note = ""
youtube_description = """HTTP basics and security headers in Java: an HTTP message is text, and the sender writes every line. Explained with an online store. We parse and write a request byte by byte, refuse messages that two programs could read differently (the idea behind request smuggling), refuse header injection through a customer's search text, judge session cookies for HttpOnly, Secure and SameSite, and score a real response from a real local server against five security headers."""
thumb_lines = ["HTTP BASICS AND", "SECURITY HEADERS"]
thumb_code = "Set-Cookie: Secure; HttpOnly"
youtube_title = "HTTP Basics and Security Headers in Java (Cookies, Smuggling, Injection)"
youtube_tags = ["http", "security headers", "cookies", "httponly", "samesite", "request smuggling", "header injection", "hsts", "java", "cybersecurity for beginners"]

[readme]
intro = """
**HTTP** is how browsers talk to web servers, and an HTTP/1.1 message is plain text: a **request line**, some **headers**, a blank line and an optional **body**. Every line is chosen by the sender, and the server and any proxy
in front of it must read it the same way. When they do not, an attacker can hide a second request inside the first, which is the idea behind **request smuggling**. When a server puts a customer's text into a header without checking for line breaks,
the customer can add headers of their own: **header injection**. **Cookies** carry the login, so their attributes (**HttpOnly**, **Secure**, **SameSite**) decide who can read or send them. And **security headers** tell the browser what to refuse:
use HTTPS only, load scripts only from the site, do not guess content types, do not be put in a frame, do not leak the address.

The demo parses and writes messages, refuses ambiguous ones, refuses injection, judges four cookies, and scores two real responses from a real server on this machine.
"""
analogy = """
Think of an order form that anyone can fill in by hand. The shop's clerk and the warehouse worker must read it the same way: if the clerk thinks the form ends at the first signature and the worker keeps reading, a second order written below
gets filled for the wrong person. A customer's name written on the form must not be able to add a new line that says "deliver to me". Cookies are the membership card, and the headers are the notices on the shop door: "enter only by this door",
"no photographs", "do not follow strangers' directions".
"""
scenario = """
An online store receives a purchase request, redirects a search, sets a session cookie and serves pages. The demo shows each of those messages as text, shows which malformed versions are refused, judges cookies, and audits the headers of a real response.
"""
costs = [
    "**Strict parsing refuses some real traffic.** Old clients and odd proxies sometimes send folded headers or bare line feeds. Refusing them is safer, and it should be logged so a real client with a bug is found.",
    "**SameSite=Strict can break links.** A customer who follows a link from another site arrives without the cookie and looks logged out, so Lax is the usual choice for a session.",
    "**A strict Content-Security-Policy takes work.** Inline scripts and styles must be moved out or given nonces, and every third-party script must be listed.",
    "**HSTS is hard to undo.** Once a browser has seen a long max-age, it will refuse plain HTTP for that long, so it should be rolled out with a short age first.",
    "**The demo is a model.** The parser handles a request with a Content-Length body only: no chunked bodies, no HTTP/2, no folding, no obsolete forms. Real servers do more, and their own defences should be switched on.",
]
too_much = """
Every public site should send the five headers and set its session cookie with HttpOnly, Secure and SameSite. Writing a parser is rarely needed: the point is to know what the server and the proxy in front of it do with an odd message,
and to configure both to refuse it.
"""
met_before = [
    "The browser developer tools' Network tab, which shows request and response headers.",
    "`curl -v`, which prints the lines of both messages.",
    "Scanners such as securityheaders.com and Mozilla Observatory that grade a site's headers.",
    "Advisories titled \"HTTP request smuggling\" for proxies and servers.",
]
where = """
This project is the third in [networking](..), after [tcp-ip-basics](../tcp-ip-basics), and prepares the transport-security module: HTTPS is HTTP carried inside TLS.
"""
twin = """
Messages are built and parsed in memory, so the demo is exact. The real exchange uses the JDK's own HTTP server and HTTP client on the loopback interface, and the demo prints only facts that do not depend on the port number.
"""
test_note = "Messages are parsed and written in memory, cookies and headers are judged by fixed rules, and the one real exchange prints only facts that do not depend on the port number, so the golden output is the same on every run."

[[act]]
title = "An HTTP message is just text"
summary = "A request of 82 characters is parsed into method, target, Host and a 17-byte body, and written out again as the same text."
detail = """
A customer's browser sends 82 characters: a request line, headers, a blank line and a body. Parsed, it is a POST to /orders for the host shop.example with a 17-byte body. Written out again it is the same text.
Every header is only a line of text that the sender chose, so the server must check it.
"""
speech = """
First demo: an H T T P message is just text. [[slnc 400]] A customer's browser sends eighty two characters. [[slnc 300]] A request line, headers, a blank line, and a body. [[slnc 600]]
Parsed, it is a post to orders, for the host shop dot example. [[slnc 300]] Written out again, it is the same text. [[slnc 600]]
Every header is only a line of text that the sender chose. [[slnc 300]] So the server must check it.
"""
rows = { message = "active ok" }
console = [
    ["a customer's browser sends 82 characters: a request line, headers, a blank line, and a body", "muted"],
    ["parsed: method POST, target /orders, Host shop.example, body 17 bytes", "ok"],
    ["written out again it is the same text: true", "ok"],
    ["every header is only a line of text that the sender chose, so the server must check it", "amber"],
]

[[act]]
title = "Messages that two programs could read differently"
summary = "Both Content-Length and Transfer-Encoding, two different lengths, a space before a colon and a body with a hidden second request are all refused; the exact request is accepted."
detail = """
A proxy and a server in a chain must agree where a request ends. Content-Length and Transfer-Encoding together are refused. Two different Content-Length headers are refused. A space before the colon in a header name is refused.
A body longer than its Content-Length, with a second request hidden after it, is refused. The same request, plain and exact, is accepted. When a proxy and a server disagree about where a request ends, the rest is read as the next customer's request.
"""
speech = """
Second demo: messages that two programs could read differently. [[slnc 400]] A proxy and a server must agree where a request ends. [[slnc 600]]
Content length and transfer encoding together are refused. [[slnc 300]] Two different content lengths are refused. [[slnc 300]] A space before the colon is refused. [[slnc 600]]
A body with a second request hidden after it is refused. [[slnc 600]]
The same request, plain and exact, is accepted. [[slnc 600]]
When a proxy and a server disagree about where a request ends, the rest is read as the next customer's request.
"""
rows = { ambiguity = "active wrong" }
console = [
    ["Content-Length and Transfer-Encoding together: refused (both Content-Length and Transfer-Encoding)", "ok"],
    ["two different Content-Length headers: refused (two different Content-Length headers)", "ok"],
    ["a space before the colon in a header name: refused", "ok"],
    ["a body longer than its Content-Length, with a second request hidden after it: refused (Content-Length says 4 bytes but 47 follow)", "ok"],
    ["the same request, plain and exact: accepted", "ok"],
    ["when a proxy and a server disagree about where a request ends, the rest is read as the next customer's request", "amber"],
]

[[act]]
title = "Header injection"
summary = "A normal search redirect is written; search text with a line break and a second header is refused, because otherwise the attacker would set a cookie."
detail = """
The store puts the customer's search text in a redirect address. A normal search, shoes, is written. Search text with a line break and a second header is refused: without the check, the attacker sets a cookie.
The answer is to refuse or encode line breaks in anything that reaches a header.
"""
speech = """
Third demo: header injection. [[slnc 400]] The store puts the customer's search text in a redirect address. [[slnc 600]]
A normal search is written. [[slnc 600]]
Search text with a line break and a second header is refused. [[slnc 300]] Without that check, the attacker sets a cookie. [[slnc 600]]
So refuse or encode line breaks in anything that reaches a header.
"""
rows = { injection = "active wrong" }
console = [
    ["the store puts the customer's search text in a redirect address", "muted"],
    ["a normal search, shoes: written", "ok"],
    ["search text with a line break and a second header: refused (a line break inside the value of Location)  <- WITHOUT THE CHECK THE ATTACKER SETS A COOKIE", "bad"],
    ["the answer is to refuse or encode line breaks in anything that reaches a header", "amber"],
]

[[act]]
title = "Cookies that carry a login"
summary = "A bare cookie has three problems; Secure, HttpOnly, SameSite=Lax and Path=/ has none; SameSite=None without Secure has two; a __Host- cookie with a Domain has one."
detail = """
Four cookies are judged. session=abc123 has three problems: no HttpOnly, no Secure and no SameSite. With Secure, HttpOnly, SameSite=Lax and Path=/ it has none.
With HttpOnly and SameSite=None but no Secure it has two. And a cookie with the __Host- prefix and a Domain attribute has one, because that prefix needs Secure, Path=/ and no Domain.
"""
speech = """
Fourth demo: cookies that carry a login. [[slnc 400]] A bare cookie has three problems. [[slnc 300]] No HttpOnly, so a script can read it. [[slnc 300]] No Secure, so it is sent over plain H T T P. [[slnc 300]] No SameSite, so other sites can trigger requests that carry it. [[slnc 600]]
With all three set, it has none. [[slnc 600]]
SameSite none without Secure has two. [[slnc 600]]
And a cookie with the host prefix and a domain has one.
"""
rows = { cookie = "active amber" }
console = [
    ["session=abc123  ->  problems: 3 (no HttpOnly, no Secure, no SameSite)", "bad"],
    ["session=abc123; Secure; HttpOnly; SameSite=Lax; Path=/  ->  problems: 0", "ok"],
    ["session=abc123; HttpOnly; SameSite=None  ->  problems: 2", "amber"],
    ["__Host-session=abc123; Secure; HttpOnly; SameSite=Strict; Path=/; Domain=shop.example  ->  problems: 1", "amber"],
]

[[act]]
title = "Security headers on a real response"
summary = "A real local server with no security headers scores 0 of 5, the same server with the five headers scores 5 of 5, and headers set badly score 1 of 5."
detail = """
A real request to a plain server on this machine returns status 200 with security headers present: 0 of 5. The same request to a server that sets the five headers scores 5 of 5: Strict-Transport-Security, Content-Security-Policy,
X-Content-Type-Options, X-Frame-Options and Referrer-Policy. Headers present but set badly score 1 of 5, because a header is only worth its value.
"""
speech = """
Fifth demo: security headers on a real response. [[slnc 400]] A real request to a plain server on this machine has none of the five. [[slnc 600]]
The same request to a server that sets them scores five out of five. [[slnc 600]]
Strict transport security. Content security policy. No sniff. Frame options. Referrer policy. [[slnc 600]]
Headers that are present but set badly score one out of five. [[slnc 300]] A header is only worth its value.
"""
rows = { headers = "active ok" }
console = [
    ["a real request to a plain server: status 200", "muted"],
    ["security headers present: 0 of 5", "bad"],
    ["the same request to a server that sets the five headers: 5 of 5", "ok"],
    ["headers present but set badly score 1 of 5: a header is only worth its value", "amber"],
]

