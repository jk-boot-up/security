# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "http-basics-and-headers"
module = "networking"
title = "HTTP Basics and Security Headers"
short_title = "HTTP and Headers"
package = "http"
main_class = "HttpDemo"
tagline = "A web request is just text, and every line of it is the sender's choice"
bold = "HTTP messages are plain text that the sender controls, so a server must read them strictly, never put raw text in a header, set cookies with care, and tell the browser what to refuse with security headers."
domain = "an online store"
domain_note = ""
youtube_description = """HTTP basics and security headers in Java: an HTTP message is text, and the sender writes every line. Explained with an online store. We parse and write a request byte by byte, refuse messages that two programs could read differently (the idea behind request smuggling), refuse header injection through a customer's search text, judge session cookies for HttpOnly, Secure and SameSite, and score a real response from a real local server against five security headers."""
thumb_lines = ["HTTP BASICS AND", "SECURITY HEADERS"]
thumb_code = "Set-Cookie: Secure; HttpOnly"
youtube_title = "HTTP Basics and Security Headers in Java (Cookies, Smuggling, Injection)"
youtube_tags = ["http", "security headers", "cookies", "httponly", "samesite", "request smuggling", "header injection", "hsts", "java", "cybersecurity for beginners"]

[readme]
intro = """
**HTTP** is how browsers talk to web servers, and an HTTP/1.1 message is plain text: a **request line**, some **headers**, a blank line and an optional **body**. Every line is chosen by the sender, and the server and any proxy
in front of it must read it the same way. When they do not, an attacker can hide a second request inside the first, which is the idea behind **request smuggling**. When a server puts a customer's text into a header without checking for line breaks,
the customer can add headers of their own: **header injection**. **Cookies** carry the login, so their attributes (**HttpOnly**, **Secure**, **SameSite**) decide who can read or send them. And **security headers** tell the browser what to refuse:
use HTTPS only, load scripts only from the site, do not guess content types, do not be put in a frame, do not leak the address.

The demo parses and writes messages, refuses ambiguous ones, refuses injection, judges four cookies, and scores two real responses from a real server on this machine.
"""
analogy = """
Think of an order form that anyone can fill in by hand. The shop's clerk and the warehouse worker must read it the same way: if the clerk thinks the form ends at the first signature and the worker keeps reading, a second order written below
gets filled for the wrong person. A customer's name written on the form must not be able to add a new line that says "deliver to me". Cookies are the membership card, and the headers are the notices on the shop door: "enter only by this door",
"no photographs", "do not follow strangers' directions".
"""
scenario = """
An online store receives a purchase request, redirects a search, sets a session cookie and serves pages. The demo shows each of those messages as text, shows which malformed versions are refused, judges cookies, and audits the headers of a real response.
"""
costs = [
    "**Strict parsing refuses some real traffic.** Old clients and odd proxies sometimes send folded headers or bare line feeds. Refusing them is safer, and it should be logged so a real client with a bug is found.",
    "**SameSite=Strict can break links.** A customer who follows a link from another site arrives without the cookie and looks logged out, so Lax is the usual choice for a session.",
    "**A strict Content-Security-Policy takes work.** Inline scripts and styles must be moved out or given nonces, and every third-party script must be listed.",
    "**HSTS is hard to undo.** Once a browser has seen a long max-age, it will refuse plain HTTP for that long, so it should be rolled out with a short age first.",
    "**The demo is a model.** The parser handles a request with a Content-Length body only: no chunked bodies, no HTTP/2, no folding, no obsolete forms. Real servers do more, and their own defences should be switched on.",
]
too_much = """
Every public site should send the five headers and set its session cookie with HttpOnly, Secure and SameSite. Writing a parser is rarely needed: the point is to know what the server and the proxy in front of it do with an odd message,
and to configure both to refuse it.
"""
met_before = [
    "The browser developer tools' Network tab, which shows request and response headers.",
    "`curl -v`, which prints the lines of both messages.",
    "Scanners such as securityheaders.com and Mozilla Observatory that grade a site's headers.",
    "Advisories titled \"HTTP request smuggling\" for proxies and servers.",
]
where = """
This project is the third in [networking](..), after [tcp-ip-basics](../tcp-ip-basics), and prepares the transport-security module: HTTPS is HTTP carried inside TLS.
"""
twin = """
Messages are built and parsed in memory, so the demo is exact. The real exchange uses the JDK's own HTTP server and HTTP client on the loopback interface, and the demo prints only facts that do not depend on the port number.
"""
test_note = "Messages are parsed and written in memory, cookies and headers are judged by fixed rules, and the one real exchange prints only facts that do not depend on the port number, so the golden output is the same on every run."

[[act]]
title = "An HTTP message is just text"
summary = "A request of 82 characters (23 + 20 + 20 + 2 + 17) is parsed into method, target, Host and a 17-byte body, and written out again as the same text."
detail = """
A customer's browser sends five lines: the request line POST /orders HTTP/1.1, the headers host and content-length, a blank line and the body item=A-1001&qty=2. Each line ends with \\r\\n, two invisible
characters, so the lines count 23 + 20 + 20 + 2 + 17 = 82 characters. Parsed, it is a POST to /orders for the host shop.example with a 17-byte body, exactly what Content-Length said.
Written out again it is the same text. Every header is only a line of text that the sender chose, so the server must check it.
"""
figure = "parse_roundtrip"
figure_title = "From text to fields, and back to text"
figure_speech = """
The server's first job is to read this text. [[slnc 400]] On the left, in green, the request, exactly as it arrived. [[slnc 400]] In the middle, the parser. [[slnc 300]] On the right, in red, what the parser found. [[slnc 500]]
The method, post. [[slnc 200]] The target, slash orders. [[slnc 200]] The host, shop dot example. [[slnc 200]] And a body of seventeen bytes, just as the content length said. [[slnc 600]]
At the bottom, the parsed request is written out again. [[slnc 300]] It is the same text, character for character. [[slnc 600]]
Notice that nothing here proves who wrote it. [[slnc 300]] Every line was chosen by the sender, so the server must check every line.
"""
speech = """
Here is the program's output. [[slnc 400]] First, the request, line by line. [[slnc 300]] Each line is counted, plus two for its line break. [[slnc 300]] Twenty three, twenty, twenty, two, and seventeen for the body. [[slnc 300]] Eighty two characters in all. [[slnc 500]]
Then the parsed request: post, slash orders, shop dot example, seventeen bytes. [[slnc 400]] And written out again, it is the same text: true.
"""
rows = { message = "active ok" }
console = [
    ["THE REQUEST (the text the browser sends, line by line):", "ok"],
    ["  POST /orders HTTP/1.1\\r\\n  21 + 2 = 23", "ok"],
    ["  host: shop.example\\r\\n     18 + 2 = 20", "muted"],
    ["  content-length: 17\\r\\n     18 + 2 = 20", "muted"],
    ["  \\r\\n                        0 + 2 =  2", "muted"],
    ["  item=A-1001&qty=2          17     = 17", "muted"],
    ["  total                               82 characters", "muted"],
    ["THE PARSED REQUEST:", "ok"],
    ["  method   POST", "muted"],
    ["  target   /orders", "muted"],
