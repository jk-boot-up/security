install = []

[docs.session]
objectives = [
    "describe the parts of an HTTP/1.1 request and response",
    "explain how two programs reading one message differently allows smuggling",
    "explain header injection and how to prevent it",
    "choose cookie attributes for a login session",
    "name five security headers and what each tells the browser",
]
walkthrough = """
Start with the order form analogy. Run the demo one act at a time. After act two, ask what a proxy would do with the hidden request. After act three, ask where else customer text reaches a header. In act four, ask which attribute stops which attack.
In act five, ask why presence is not enough.
"""
exercises = [
    "Add support for a chunked body, keep the refusal of Content-Length together with Transfer-Encoding, and test it.",
    "Add a sixth header, Permissions-Policy, to the auditor.",
    "Add the Max-Age and Expires attributes to the cookie judge and flag a session cookie that lasts a year.",
    "Run `curl -v` against the loopback server and match each line to the parser's rules.",
]

[docs.explained]
sentence = """
An HTTP message is text written by the sender, so a server must read it strictly and the same way as the proxy in front of it, keep customer text out of headers, set cookies with HttpOnly, Secure and SameSite, and send security headers whose values really restrict the browser.
"""
verdict = """
Use a current, well-maintained server and proxy, and keep them updated. Refuse ambiguous messages and log them. Encode customer text before it reaches a header. Set session cookies with HttpOnly, Secure and SameSite=Lax, and the __Host- prefix when possible.
Send the five headers, starting HSTS with a short age. Grade the site with a scanner after every change.
"""
recognise = [
    "`Set-Cookie: ...; Secure; HttpOnly; SameSite=Lax` in login responses.",
    "`Strict-Transport-Security` and `Content-Security-Policy` in a framework's security configuration.",
    "Spring Security's `headers()` configuration and nginx's `add_header`.",
    "Advisories about request smuggling in proxies.",
]

[spec]
purpose = """
Teach how HTTP messages are built and abused by writing a strict parser and writer for an online store, judging cookies, and auditing the security headers of a real response.
"""
nongoals = [
    "A complete HTTP implementation: chunked bodies, HTTP/2, connection reuse and caching.",
    "A framework's security configuration: the Spring Boot and nginx counterparts.",
    "TLS: the transport-security module.",
]
problem = """
Learners see HTTP through frameworks and do not know what the server receives, what a proxy changes, or what a header does.
"""
roles = [["Request model", "`HttpRequest`"], ["Strict parser", "`HttpParser`"], ["Response writer", "`HttpResponse`"], ["Cookie judge", "`Cookie`"], ["Header auditor", "`HeaderAudit`"], ["A real exchange", "`LoopbackExchange`"], ["Entry point", "`HttpDemo`"]]
requirements = [
    "A request round-trips through the parser and the writer.",
    "Ambiguous messages are refused: both lengths, differing lengths, a space before a colon, folded headers, bare line feeds, wrong body length.",
    "A response with a line break in a header value or a bad header name is refused.",
    "Cookies are judged for HttpOnly, Secure, SameSite and the __Host- prefix.",
    "Headers are audited for value as well as presence.",
    "The demo prints the same output on every run.",
]

