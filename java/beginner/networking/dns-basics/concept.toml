]

[docs.problem]
scenario = """
An online store is reached by name. Every customer's browser asks a resolver for the address, and the resolver caches the answer for everyone who asks after.
"""
naive = """
Assume that an answer to a DNS question came from the owner of the name, and that the resolver's cache is as trustworthy as the store.
"""
deliver = [
    "A DNS message built and read byte by byte, with RFC 1035 name compression.",
    "A caching resolver with a time to live and a simulated clock.",
    "A real question and answer over UDP on this machine.",
    "Cache poisoning against counting ids, and its failure against keyed ids and ports.",
    "A cap on lifetimes, and the roles of DNSSEC, encrypted DNS and TLS.",
]

[docs.prerequisites]
required = [
    "Java basics",
    "The tcp-ip-basics project, or at least what an address and a port are",
]
not_required = [
    "A DNS server, `dig` or root access: everything runs in the JDK",
    "The mathematics of DNSSEC",
]
install = []

[docs.session]
objectives = [
    "describe what a DNS question and answer contain",
    "explain what a cache and a TTL do, and what that means for a false answer",
    "explain how a transaction id and a source port protect a query",
    "list what limits the damage of a poisoned answer",
]
walkthrough = """
Start with directory enquiries. Run the demo one act at a time. After act three, ask what a person on the path can read. In act four, ask why the port helps as well as the id. After act five, ask which defence stops a poisoning by someone on the path, and which does not.
"""
exercises = [
    "Make the attacker send 10000 guesses instead of 1000 and check the keyed resolver again.",
    "Add a second record type (a text record) to the message codec.",
    "Add a negative cache, so that a missing name is remembered for a short time, and think about how it could be abused.",
    "Change the cap on lifetimes and find the shortest lifetime that still gives a useful cache.",
]

[docs.explained]
sentence = """
DNS maps names to addresses in small unsigned datagrams that a resolver believes when they repeat the question, the id and the port, and caches for their lifetime, so unguessable ids, capped lifetimes, signatures and TLS are all needed to limit a false answer.
"""
verdict = """
Use resolvers that randomize ids and source ports and cap TTLs, turn on DNSSEC validation where available, use encrypted DNS when privacy matters, and never treat a name's address as proof of identity: check the certificate.
"""
recognise = [
    "`dig +dnssec` showing signatures and the ad flag.",
    "Resolver settings for DNS over TLS or HTTPS.",
    "TTL fields in a domain's control panel.",
    "Incident reports about hijacked domains.",
]

[spec]
purpose = """
Teach how names become addresses and how that answer can be forged, by encoding and decoding DNS messages, simulating a caching resolver, running a real UDP exchange, and poisoning a cache by guessing a transaction id.
"""
nongoals = [
    "A full resolver or an authoritative server with all record types.",
    "DNSSEC validation: it is described, not run.",
    "A real DNS server and the tool counterpart: a later project.",
]
problem = """
Learners use names every day and trust the address they get, without knowing that the answer is unsigned.
"""
roles = [["The message codec", "`DnsMessage`"], ["Where ids and ports come from", "`TransactionIds`"], ["The caching resolver", "`Resolver`"], ["A real UDP exchange", "`LoopbackExchange`"], ["Entry point", "`DnsDemo`"]]
requirements = [
    "A query matches the RFC 1035 layout and an answer's name is a pointer.",
    "Messages round-trip, and pointer loops, cut messages and bad names are refused.",
    "The resolver believes only a response that repeats id, port and question, and caps lifetimes.",
    "Counting ids are guessed and keyed ids and ports are not.",
    "The demo prints the same output on every run.",
]

