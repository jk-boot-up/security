[poster]
headline = [["DNS BASICS", "text"], ["FOR SECURITY", "accent"]]
taglines = [["The internet's phone book believes whoever answers first", "gold"]]
before = { code = "ids count up, port 53", note = "one guess poisons the cache", tag = "BEFORE" }
after = { code = "keyed id + port, TTL cap", note = "4 billion pairs, short lies", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "DNS Basics for Security"
narration = """Hello, and welcome. [[slnc 400]] This video explains D N S basics for security, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] D N S, the Domain Name System, turns a name into an address. [[slnc 300]] It is the internet's phone book. [[slnc 500]] But its answers are not signed. [[slnc 300]] Whoever answers first, with the right numbers, is believed. [[slnc 500]] Our domain is an online store. [[slnc 400]] You will see what a D N S message contains, how a cache works, how it is poisoned, and what limits the damage."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online store is reached by name.", "", "Every browser asks a resolver", "for the address.", "The resolver keeps the answer", "for everyone who asks next."]
narration = """Here is the scenario. [[slnc 400]] An online store is reached by name. [[slnc 500]] Every customer's browser asks a resolver for the address. [[slnc 300]] And the resolver keeps the answer, for everyone who asks after."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["Resolver: asks for names and keeps answers", "TTL: how long an answer may be kept", "Transaction id: 16 bits that match a reply to a query", "Cache poisoning: a false answer kept as true", "DNSSEC: signatures on DNS answers"]
narration = """The words. [[slnc 400]] A resolver asks for names, and keeps the answers. [[slnc 400]] The time to live is how long an answer may be kept. [[slnc 400]] The transaction id is sixteen bits that match a reply to a query. [[slnc 400]] Cache poisoning is a false answer kept as true. [[slnc 400]] And D N S S E C signs D N S answers."""

[[scene]]
key = "03-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "04-question"
kind = "figure"
title = "One DNS question, byte by byte"
body = "query_bytes"
narration = """Let's start with one real D N S question, byte by byte, for shop dot example dot com. [[slnc 500]] First, twelve bytes of header, in six fields. [[slnc 300]] The id, a b c d, works like a ticket number. [[slnc 300]] The flags, zero one zero zero, mean: please look it up. [[slnc 300]] Then the counts: one question. [[slnc 500]] Next, the name. [[slnc 300]] Each part is its length, then its letters. [[slnc 300]] Four, shop. [[slnc 200]] Seven, example. [[slnc 200]] Three, com. [[slnc 200]] And a zero to end it. [[slnc 200]] Eighteen bytes. [[slnc 500]] Last, the type, A, for an I P version four address, and the class, I N, the internet. [[slnc 400]] Twelve, plus eighteen, plus two, plus two: thirty four bytes. [[slnc 500]] No sender, and no signature. [[slnc 300]] Whoever replies with the same id and question is believed."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "11-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["dig and nslookup", "\"Server not found\" errors", "TTL in a domain's control panel", "Hijacked-domain news"]
narration = """You have met this already. [[slnc 400]] dig and nslookup show questions, answers and T T Ls. [[slnc 400]] Server not found is a failed lookup. [[slnc 400]] Domain control panels have a T T L setting. [[slnc 400]] And many hijacked domain stories start with a false D N S answer."""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Resolvers with random ids and ports", "Capped TTLs", "DNSSEC where available", "Encrypted DNS for privacy", "Always check the certificate"]
narration = """So, how do you use it? [[slnc 400]] Use resolvers that randomize ids and ports. [[slnc 500]] Cap lifetimes. [[slnc 500]] Turn on D N S S E C validation where it is available. [[slnc 500]] Use encrypted D N S when privacy matters. [[slnc 500]] And never treat an address as proof of identity. Check the certificate."""

[[scene]]
key = "12-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "13-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Make the attacker send", "ten thousand guesses and check again."]
narration = """That's D N S basics for security. [[slnc 400]] Remember this: D N S answers are unsigned, so every defence exists to make a forged answer hard to land, short lived, or caught. [[slnc 500]] The source code, notes, diagrams and an animated walkthrough are in the repository. [[slnc 300]] Try this: make the attacker send ten thousand guesses, and check the keyed resolver again. [[slnc 500]] If you found this useful, a like really helps. [[slnc 300]] Kindly subscribe to the channel. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
An online store's customers resolving its name through a caching resolver: the questions, the unsigned answers, the cache that repeats them, and the ids and ports that protect a query.
It covers an attacker who can send forged datagrams to the resolver and one who can watch the path. It does not cover the store's own DNS servers, registrar accounts, or the certificate check.
"""
assets = [
    "The address that customers are sent to for the store's name.",
    "The resolver's cache.",
    "The privacy of which sites customers ask for.",
]
actors = [
    "Customers and their browsers.",
    "The resolver and the upstream servers.",
    "An attacker who can forge datagrams, and one who can watch the path.",
]
boundaries = [
    "Resolver to upstream servers: unsigned datagrams that cross the internet.",
    "Resolver to its cache: one false entry reaches every customer.",
]
assumptions = [
    "The attacker cannot see the resolver's queries, and cannot guess a keyed id and port.",
    "The resolver's secret for ids and ports is unpredictable.",
    "In the demo, addresses are documentation addresses and the secret is a fixed demo value.",
]
out_of_scope = [
    "Registrar and zone account security.",
    "DNSSEC validation: described, not run.",
    "The certificate check in the browser: the transport-security module.",
]
tests = [
    "`DnsMessageTest` checks the RFC 1035 query layout, name compression, round trips, and that pointer loops, cut messages and bad names are refused.",
    "`ResolverTest` checks the cache and TTL, that wrong ids, ports and questions are refused, the lifetime cap, guessable and keyed ids, and a real UDP exchange.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next project, http-basics-and-headers, looks at the web request that follows the lookup, and the headers that defend it.
"""

[[threat]]
id = "T1"
stride = "S"
threat = "A forged answer with a guessed id is cached and sent to every customer"
where = "`Resolver.accept`"
control = "Random ids and source ports from a keyed hash"
residual = "An attacker on the path sees the query and can answer first, so signatures are needed"

[[threat]]
id = "T2"
stride = "S"
threat = "A resolver with predictable ids is poisoned by a single guess"
where = "`TransactionIds.sequential`"
control = "Keyed ids and ports"
residual = "Old or unpatched resolvers still count up"

[[threat]]
id = "T3"
stride = "T"
threat = "A false answer with a long lifetime stays in the cache"
where = "`Resolver`"
control = "A cap on lifetimes"
residual = "The false answer is used until it expires, so the cap limits it but does not stop it"

[[threat]]
id = "T4"
stride = "I"
threat = "An observer reads which names customers ask for"
where = "`LoopbackExchange`"
control = "None in plain DNS; encrypted DNS hides it from the path"
residual = "The resolver itself still sees every question"

[[threat]]
id = "T5"
stride = "T"
threat = "A message is changed on the path"
where = "`DnsMessage`"
control = "DNSSEC signatures, checked by the resolver"
residual = "Only signed zones are protected, and TLS is still the last check"

[classes]
title = "The Java Classes"
narration = """Now, the code: seven small classes."""

[[class]]
name = "DnsDemo"
what = "runs the five acts"
[[class.part]]
title = "the five acts"
code = """
act1Message(out);
act2Cache(out);
act3Exchange(out);
act4Poisoning(out);
act5Lifetime(out);
"""
speech = """D N S demo runs the five acts. [[slnc 300]] A test checks its output against the golden file."""

[[class]]
name = "DnsMessage"
what = "writes and reads DNS messages"
[[class.part]]
title = "the header: six 2-byte fields"
code = """
put16(out, id);                          // abcd
put16(out, (response ? 0x8180 : 0x0100)
        | rcode);                        // the flags
put16(out, questions.size());
put16(out, answers.size());
"""
speech = """D N S message turns messages into bytes, and back. [[slnc 300]] The header is written two bytes at a time: the id, the flags, and the counts."""
[[class.part]]
title = "a name: labels, or a pointer"
code = """
Integer seen = offsets.get(suffix);
if (seen != null) {
    put16(out, 0xC000 | seen);    // c00c: back to byte 12
    return;
}
...
out.write(label.length);          // 04, then "shop"
out.writeBytes(label);
"""
speech = """For a name already written, it writes only a pointer: c zero, plus where the name is. [[slnc 300]] Otherwise, each part as its length, then its letters."""

[[class]]
name = "Resolver"
what = "keeps a cache, believes or refuses replies"
[[class.part]]
title = "the checks, then the cache"
code = """
if (!response.response() || response.id() != pending.id()
        || arrivedAtPort != pending.port()) {
    return false;                 // wrong id or port
}
...
cache.put(pending.name(), new Entry(answer.address(),
        now + Math.min(answer.ttl(), maxTtl)));
"""
speech = """The resolver refuses a reply unless the id and the port match. [[slnc 300]] That is all a forger must guess. [[slnc 300]] A believed answer is kept for the smaller of its time to live and the cap."""

[[class]]
name = "TransactionIds"
what = "where ids and ports come from"
[[class.part]]
title = "counting, or keyed"
code = """
return next++ & 0xffff;           // the old way: count up
...
byte[] hash = mac.doFinal(
        ByteBuffer.allocate(8).putLong(counter).array());
...
int id = Short.toUnsignedInt(in.getShort());     // bytes 0-1
int port = LOWEST_PORT                           // bytes 2-5
        + (int) (Integer.toUnsignedLong(in.getInt()) % PORTS);
"""
speech = """Transaction ids either counts up, which is easy to guess, [[slnc 200]] or takes an H mac of a counter with a secret key: two bytes for the id, four for the port."""

[[class]]
name = "LoopbackExchange"
what = "a real exchange over UDP"
[[class.part]]
title = "one datagram each way"
code = """
client.send(new DatagramPacket(query, query.length,
        local, server.getLocalPort()));
DatagramPacket in = new DatagramPacket(new byte[512], 512);
...
client.receive(in);
"""
speech = """Loopback exchange sends one datagram, and receives one back, with no connection first."""

[[class]]
name = "Address"
what = "an IPv4 address as four bytes"
[[class.part]]
title = "four numbers into one"
code = """
value = (value << 8) | octet;
"""
speech = """Address packs the four numbers of an address into one number."""

[[class]]
name = "BadMessageException"
what = "a message that cannot be read"
[[class.part]]
title = "refuse, do not guess"
code = """
final class BadMessageException extends Exception {
...
throw new BadMessageException(
        "name pointers loop or point outside the message");
"""
speech = """And bad message exception refuses a message that is cut short, or whose pointers loop."""

