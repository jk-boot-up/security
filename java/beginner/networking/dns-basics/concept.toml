# concept.toml: everything about this project that is not Java code.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "dns-basics"
module = "networking"
title = "DNS Basics for Security"
short_title = "DNS Basics"
package = "dns"
main_class = "DnsDemo"
tagline = "The internet's phone book believes whoever answers first"
bold = "DNS turns names into addresses with no signature on the answer: a resolver believes any reply that repeats the right id, so ids must be unguessable, lifetimes capped, and the final check left to TLS."
domain = "an online store"
domain_note = ""
youtube_description = """DNS basics for security in Java: messages, caching, and cache poisoning. Explained with an online store. We build a DNS message byte by byte with name compression, cache answers with a time to live, run a real exchange over UDP, poison a resolver's cache by guessing a transaction id, and see why random ids and ports, capped lifetimes, DNSSEC and TLS each stop a part of the attack."""
thumb_lines = ["DNS BASICS", "FOR SECURITY"]
thumb_code = "shop.example.com -> A ?"
youtube_title = "DNS Basics for Security in Java (Messages, Caching, Cache Poisoning)"
youtube_tags = ["dns", "cache poisoning", "dnssec", "resolver", "transaction id", "udp", "networking", "java", "cybersecurity for beginners"]

[readme]
intro = """
Before a browser can connect to the store, it must turn **shop.example.com** into an address. That is the job of **DNS**, the internet's phone book. A small **question** goes out in a single **UDP** datagram, and a small **answer** comes back, to be kept in a **cache**
for its **time to live** (TTL). There is no connection and no signature. A resolver believes a reply if it repeats the question and the 16-bit **transaction id**, and, on modern resolvers, arrives at the right source port.
Anyone who can guess those numbers and answer first can put a false address in the cache, which is **cache poisoning**.

The demo builds a message byte by byte, with the name compression of RFC 1035, caches answers with a TTL, runs a real exchange over UDP, poisons a resolver with predictable ids, and shows what stops it.
"""
analogy = """
Think of calling directory enquiries and writing down the number you are told. The operator never signs anything, and the line is open, so a person who shouts a number first, using the right reference code, is believed.
The operator's notebook, the cache, then repeats the false number to every caller until the page is replaced.
"""
scenario = """
An online store is reached by name. The demo shows what a DNS question and answer contain, how a resolver caches, a real exchange over UDP on this machine, how a resolver with counting ids is poisoned with one forged answer, and what limits the damage.
"""
costs = [
    "**Random ports and ids are a speed bump, not a lock.** About four billion combinations make blind guessing impractical, but not impossible against a patient attacker, and they do not protect against an attacker on the path.",
    "**Capping lifetimes costs speed.** A shorter cap means more questions to the upstream servers, and it limits a false answer's life, not its first use.",
    "**DNSSEC needs the zone to be signed and the resolver to check.** Both sides must deploy it, and keys must be managed and rolled over.",
    "**Encrypted DNS moves trust.** DNS over TLS or HTTPS hides questions from the path, but the resolver still sees them.",
    "**The demo is a model.** It supports only the A record, one question, and a simulated clock, so it teaches the ideas and not the full protocol.",
]
too_much = """
Most applications never speak DNS themselves; the operating system does. The knowledge matters when choosing resolvers, setting TTLs, and deciding which defences to trust: DNSSEC where available, encrypted DNS for privacy, and always TLS with a certificate check as the last line.
"""
met_before = [
    "`dig` and `nslookup`, which show questions, answers and TTLs.",
    "\"DNS_PROBE_FINISHED\" and \"server not found\" errors in a browser.",
    "TTL settings in a domain's control panel, and \"wait for DNS to propagate\".",
    "News stories about hijacked domains and poisoned caches.",
]
where = """
This project is the second in [networking](..), after [tcp-ip-basics](../tcp-ip-basics): a name is turned into an address before any connection starts, and the transport-security module explains the check that catches a wrong address.
"""
twin = """
Messages and the resolver are built in memory with a simulated clock, so the demo is exact. The one real exchange is over UDP on the loopback interface of the machine running it, and the demo prints only facts that do not depend on port numbers.
The query layout is checked against RFC 1035.
"""
test_note = "The query bytes are checked against the RFC 1035 layout and the answer's name pointer against its compression rule. The resolver uses a simulated clock and fixed secrets, and the one real exchange prints only facts that do not depend on port numbers, so the golden output is the same on every run."

[[act]]
title = "A DNS message, byte by byte"
summary = "The question for shop.example.com is 34 bytes; the answer repeats the name as a two-byte pointer and is 50 bytes, not 66; nothing in it says who made it."
detail = """
The question for shop.example.com is 34 bytes: 12 of header, then the name as labels, then type and class. Its first 12 bytes are abcd01000001000000000000. The answer repeats the name as a two-byte pointer, so it is 50 bytes and not 66.
Decoded again, shop.example.com is 203.0.113.10 for 300 seconds. Nothing in the message says who made the answer: only the id and the question have to match.
"""
speech = """
First demo: a D N S message, byte by byte. [[slnc 400]] The question for the store's name is thirty four bytes. [[slnc 300]] Twelve of header, then the name as labels, then the type and class. [[slnc 600]]
The answer repeats the name as a two byte pointer, so it is fifty bytes, not sixty six. [[slnc 600]]
Decoded again, it says the address, and how long to keep it. [[slnc 600]]
But nothing in the message says who made the answer. [[slnc 300]] Only the id and the question have to match.
"""
rows = { message = "active ok" }
console = [
    ["the question for shop.example.com is 34 bytes: 12 of header, then the name as labels, then type and class", "muted"],
    ["its first 12 bytes: abcd01000001000000000000", "muted"],
    ["the answer repeats the name as a two byte pointer, so it is 50 bytes and not 66", "ok"],
    ["decoded again: shop.example.com is 203.0.113.10 for 300 seconds", "ok"],
    ["nothing in the message says who made the answer: only the id and the question have to match", "amber"],
]

[[act]]
title = "The cache and the time to live"
summary = "An answer is kept for 300 seconds: a hit at second 100, a new question at second 300; caching repeats one false answer to every customer."
detail = """
At second 0 the answer 203.0.113.10 arrives with a time to live of 300 seconds. At second 100 the resolver answers from its cache, with one question sent upstream so far. At second 300 the entry has expired and the resolver asks again.
Caching makes DNS fast, and it also means one false answer is repeated to every customer until it expires.
"""
speech = """
Second demo: the cache. [[slnc 400]] An answer arrives, with a time to live of three hundred seconds. [[slnc 600]]
At second one hundred, the resolver answers from its cache. [[slnc 300]] Only one question has gone upstream. [[slnc 600]]
At second three hundred, the entry has expired, and the resolver asks again. [[slnc 600]]
Caching makes D N S fast. [[slnc 300]] And it means one false answer is repeated to every customer, until it expires.
"""
rows = { cache = "active ok" }
console = [
    ["at second 0 the answer 203.0.113.10 arrives with a time to live of 300 seconds", "muted"],
    ["at second 100 the resolver answers from its cache: true, questions sent upstream so far: 1", "ok"],
    ["at second 300 the entry has expired and the resolver asks again: true", "ok"],
    ["caching makes DNS fast, and it also means one false answer is repeated to every customer until it expires", "amber"],
]

[[act]]
title = "A real exchange over UDP"
summary = "One datagram of 34 bytes goes out and 50 come back; the name is readable in the query; there is no connection and no signature."
detail = """
On this machine, a client sends one datagram of 34 bytes to a tiny server and gets one of 50 bytes back. The answer arrived, repeats the id, and says 203.0.113.10. The name can be read in the query as plain text,
so anyone on the path sees which sites you ask for. There is no connection and no signature: a datagram is believed if it looks right.
"""
speech = """
Third demo: a real exchange over U D P. [[slnc 400]] One datagram goes out. [[slnc 300]] One comes back. [[slnc 600]]
The answer repeats the id, and gives the address. [[slnc 600]]
The name can be read in the query as plain text. [[slnc 300]] Anyone on the path sees which sites you ask for. [[slnc 600]]
There is no connection, and no signature. [[slnc 300]] A datagram is believed if it looks right.
"""
rows = { udp = "active amber" }
console = [
    ["the client sent one datagram of 34 bytes and got one of 50 bytes back", "muted"],
    ["the answer arrived: true, repeats the id: true, says 203.0.113.10", "ok"],
    ["the name can be read in the query as plain text: true  <- ANYONE ON THE PATH SEES WHICH SITES YOU ASK FOR", "bad"],
    ["there is no connection and no signature: a datagram is believed if it looks right", "amber"],
]

[[act]]
title = "Cache poisoning by guessing"
summary = "Counting ids from port 53 are guessed at once and the cache says the attacker's address; a keyed id and port stop 1000 guesses out of about four billion pairs."
detail = """
A resolver that counts its ids up and sends every query from port 53 is poisoned by the first forged answer: after 1000 forged answers the cache says 192.0.2.66, the attacker's address. A resolver whose ids and ports come from a keyed hash
is not: after 1000 forged answers the cache says nothing. The attacker must match one of 4,227,858,432 pairs, and 1000 guesses are about one in 4,227,858.
"""
speech = """
Fourth demo: cache poisoning. [[slnc 400]] A resolver counts its ids up, and sends every query from the same port. [[slnc 600]]
The attacker guesses the next id, and the first forged answer is believed. [[slnc 300]] The cache now holds the attacker's address. [[slnc 600]]
A resolver whose ids and ports come from a keyed hash is different. [[slnc 300]] A thousand forged answers do nothing. [[slnc 600]]
The attacker must match one of over four billion pairs.
"""
rows = { poison = "active wrong" }
console = [
    ["ids that count up, all queries from port 53: after 1000 forged answers the cache says 192.0.2.66  <- THE ATTACKER'S ADDRESS", "bad"],
    ["ids and ports from a keyed hash: after 1000 forged answers the cache says nothing", "ok"],
    ["the attacker must match one of 4227858432 pairs, and 1000 guesses are about one in 4227858", "muted"],
]

[[act]]
title = "How long a false answer lives, and what stops it"
summary = "A false answer with a 86400-second lifetime is still believed after two hours unless the resolver caps lifetimes at 3600; DNSSEC, encrypted DNS and TLS cover the rest."
detail = """
A false answer with a time to live of 86400 seconds is still believed after 2 hours when the resolver allows it, and not when the resolver caps lifetimes at 3600 seconds. DNSSEC signs the answers, so a forged one fails a check that needs no trust in the path.
DNS over TLS or HTTPS hides the questions and protects the path to the resolver, but not the data upstream. The browser's check that the certificate names shop.example.com is the last line of defence.
"""
speech = """
Fifth demo: how long a false answer lives. [[slnc 400]] A false answer asks to be kept for a day. [[slnc 600]]
A resolver that allows it still believes the answer after two hours. [[slnc 300]] One that caps lifetimes at an hour does not. [[slnc 600]]
D N S S E C signs the answers, so a forged one fails a check. [[slnc 600]]
Encrypted D N S hides the questions. [[slnc 600]]
And the certificate check in the browser is the last line of defence.
"""
rows = { lifetime = "active ok" }
console = [
    ["a false answer with a time to live of 86400 seconds, resolver cap 86400: still believed after 2 hours true", "bad"],
    ["the same false answer, resolver cap 3600: still believed after 2 hours false", "ok"],
    ["DNSSEC signs the answers, so a forged one fails a check that needs no trust in the path (described here, not run)", "muted"],
    ["DNS over TLS or HTTPS hides the questions and protects the path to the resolver, but not the data upstream", "muted"],
    ["the browser's check that the certificate names shop.example.com is the last line of defence", "amber"],
]

