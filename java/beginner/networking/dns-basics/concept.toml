# concept.toml: everything about this project that is not Java code.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "dns-basics"
module = "networking"
title = "DNS Basics for Security"
short_title = "DNS Basics"
package = "dns"
main_class = "DnsDemo"
tagline = "The internet's phone book believes whoever answers first"
bold = "DNS turns names into addresses with no signature on the answer: a resolver believes any reply that repeats the right id, so ids must be unguessable, lifetimes capped, and the final check left to TLS."
domain = "an online store"
domain_note = ""
youtube_description = """DNS basics for security in Java: messages, caching, and cache poisoning. Explained with an online store. We build a DNS message byte by byte with name compression, cache answers with a time to live, run a real exchange over UDP, poison a resolver's cache by guessing a transaction id, and see why random ids and ports, capped lifetimes, DNSSEC and TLS each stop a part of the attack."""
thumb_lines = ["DNS BASICS", "FOR SECURITY"]
thumb_code = "shop.example.com -> A ?"
youtube_title = "DNS Basics for Security in Java (Messages, Caching, Cache Poisoning)"
youtube_tags = ["dns", "cache poisoning", "dnssec", "resolver", "transaction id", "udp", "networking", "java", "cybersecurity for beginners"]

[readme]
intro = """
Before a browser can connect to the store, it must turn **shop.example.com** into an address. That is the job of **DNS**, the internet's phone book. A small **question** goes out in a single **UDP** datagram, and a small **answer** comes back, to be kept in a **cache**
for its **time to live** (TTL). There is no connection and no signature. A resolver believes a reply if it repeats the question and the 16-bit **transaction id**, and, on modern resolvers, arrives at the right source port.
Anyone who can guess those numbers and answer first can put a false address in the cache, which is **cache poisoning**.

The demo builds a message byte by byte, with the name compression of RFC 1035, caches answers with a TTL, runs a real exchange over UDP, poisons a resolver with predictable ids, and shows what stops it.
"""
analogy = """
Think of calling directory enquiries and writing down the number you are told. The operator never signs anything, and the line is open, so a person who shouts a number first, using the right reference code, is believed.
The operator's notebook, the cache, then repeats the false number to every caller until the page is replaced.
"""
scenario = """
An online store is reached by name. The demo shows what a DNS question and answer contain, how a resolver caches, a real exchange over UDP on this machine, how a resolver with counting ids is poisoned with one forged answer, and what limits the damage.
"""
costs = [
    "**Random ports and ids are a speed bump, not a lock.** About four billion combinations make blind guessing impractical, but not impossible against a patient attacker, and they do not protect against an attacker on the path.",
    "**Capping lifetimes costs speed.** A shorter cap means more questions to the upstream servers, and it limits a false answer's life, not its first use.",
    "**DNSSEC needs the zone to be signed and the resolver to check.** Both sides must deploy it, and keys must be managed and rolled over.",
    "**Encrypted DNS moves trust.** DNS over TLS or HTTPS hides questions from the path, but the resolver still sees them.",
    "**The demo is a model.** It supports only the A record, one question, and a simulated clock, so it teaches the ideas and not the full protocol.",
]
too_much = """
Most applications never speak DNS themselves; the operating system does. The knowledge matters when choosing resolvers, setting TTLs, and deciding which defences to trust: DNSSEC where available, encrypted DNS for privacy, and always TLS with a certificate check as the last line.
"""
met_before = [
    "`dig` and `nslookup`, which show questions, answers and TTLs.",
    "\"DNS_PROBE_FINISHED\" and \"server not found\" errors in a browser.",
    "TTL settings in a domain's control panel, and \"wait for DNS to propagate\".",
    "News stories about hijacked domains and poisoned caches.",
]
where = """
This project is the second in [networking](..), after [tcp-ip-basics](../tcp-ip-basics): a name is turned into an address before any connection starts, and the transport-security module explains the check that catches a wrong address.
"""
twin = """
Messages and the resolver are built in memory with a simulated clock, so the demo is exact. The one real exchange is over UDP on the loopback interface of the machine running it, and the demo prints only facts that do not depend on port numbers.
The query layout is checked against RFC 1035.
"""
test_note = "The query bytes are checked against the RFC 1035 layout and the answer's name pointer against its compression rule. The resolver uses a simulated clock and fixed secrets, and the one real exchange prints only facts that do not depend on port numbers, so the golden output is the same on every run."

[[act]]
title = "A DNS message, byte by byte"
summary = "The question for shop.example.com is 34 bytes; the answer copies it and adds a 16-byte record whose name is the pointer c00c, so it is 50 bytes, not 66; nothing in it says who sent it."
detail = """
The question is 34 bytes: a 12-byte header (id abcd, flags 0100, one question), the name written as labels (04 shop 07 example 03 com 00, 18 bytes), then type 0001 (A, an IPv4 address) and class 0001 (IN).
The answer copies the header with the reply flags 8180, copies the question, and adds one 16-byte record: the name as the pointer c00c (c0 marks a pointer, 0c is byte 12, where the name already is), type and class,
the time to live 0000012c (1 x 256 + 2 x 16 + 12 = 300 seconds), the length 0004 and the address cb00710a, which is 203.0.113.10. Without the pointer it would be 66 bytes, not 50. Nothing in the message says who sent it: only the id and the question have to match.
"""
figure = "message"
figure_title = "The question and the answer"
figure_speech = """
Now the answer. [[slnc 400]] It starts with the same header, and the same id, a b c d. [[slnc 300]] Only the flags change, to eight one eight zero: this is a reply. [[slnc 300]] Then the question, copied. [[slnc 500]]
Then one new record, of sixteen bytes. [[slnc 300]] The name is not written again. [[slnc 300]] It is two bytes, c zero zero c. [[slnc 300]] C zero means pointer, and zero c is twelve: the name is at byte twelve. [[slnc 500]]
Then the type and class. [[slnc 300]] The time to live is one two c in hex. [[slnc 200]] One times two hundred fifty six, plus two times sixteen, plus twelve: three hundred seconds. [[slnc 300]] And the address. [[slnc 500]]
The pointer saves sixteen bytes: fifty, not sixty six. [[slnc 300]] And nothing says who sent it.
"""
speech = """
The program prints the same. [[slnc 300]] The question: header, name, type and class.
[[page]]
The answer: the same start, then the record, field by field. [[slnc 300]] Without the pointer, sixty six bytes.
"""
rows = { message = "active ok" }
console = [
    ["THE QUESTION (34 bytes):", "ok"],
    ["  header   abcd 0100 0001 0000 0000 0000", "muted"],
    ["  name     04 73686f70 07 6578616d706c65 03 636f6d 00", "muted"],
    ["  type     0001 = A, an IPv4 address", "muted"],
    ["  class    0001 = IN, the internet", "muted"],
    ["---", ""],
    ["THE ANSWER (50 bytes):", "ok"],
    ["  header   abcd 8180 0001 0001 0000 0000", "muted"],
    ["  question the same 22 bytes as above", "muted"],
    ["  name     c00c = a pointer to byte 12", "muted"],
    ["  type     0001  class 0001", "muted"],
    ["  ttl      0000012c = 300 seconds", "muted"],
    ["  address  0004 cb00710a = 203.0.113.10", "muted"],
    ["without the pointer the answer would be 66 bytes, not 50", "amber"],
    ["no sender in it: only the id and question must match", "ok"],
]

[[act]]
title = "The cache and the time to live"
summary = "An answer with a TTL of 300 is kept until second 0 + min(300, 3600) = 300: questions at seconds 100 and 299 come from the cache, at second 300 the resolver asks again."
detail = """
At second 0 the answer 203.0.113.10 arrives with a time to live of 300 seconds. The resolver keeps it until now + min(TTL, its cap) = 0 + min(300, 3600) = second 300.
Questions at seconds 100 and 299 are answered from the cache, with still only one question sent upstream. At second 300 the entry has expired and the resolver asks again. Caching makes DNS fast, and it also means one false answer is repeated to every customer until it expires.
"""
figure = "cache"
figure_title = "How long an answer is kept"
figure_speech = """
A resolver looks names up for you, and keeps the answers. [[slnc 400]] At second zero, the answer arrives, with a time to live of three hundred seconds. [[slnc 400]] The resolver keeps it for the smaller of that and its own cap, three thousand six hundred. [[slnc 300]] So, until second three hundred. [[slnc 500]]
At seconds one hundred and two hundred ninety nine, the answer comes from the cache. [[slnc 300]] Still only one question went upstream. [[slnc 300]] At second three hundred it has expired, and the resolver asks again. [[slnc 500]]
That is fast. [[slnc 200]] But a false answer would be handed out just as fast, to every customer.
"""
speech = """
The same, printed: the answer, when it expires, and the later questions.
"""
rows = { cache = "active ok" }
console = [
    ["THE ANSWER (second 0):", "ok"],
    ["  shop.example.com  203.0.113.10  ttl 300", "muted"],
    ["  kept until 0 + min(300, cap 3600) = second 300", "muted"],
    ["LATER QUESTIONS:", "ok"],
    ["  second 100  from the cache  203.0.113.10  upstream 1", "muted"],
    ["  second 299  from the cache  203.0.113.10  upstream 1", "muted"],
    ["  second 300  expired, asked again          upstream 2", "muted"],
    ["a false answer goes to every customer until it expires", "amber"],
]

[[act]]
title = "A real exchange over UDP"
summary = "One datagram of 34 bytes goes out and one of 50 comes back with the same id; on the path the query reads .shop.example.com, in plain text; there is no connection and no signature."
detail = """
On this machine, a client sends one UDP datagram of 34 bytes, with id 1234, to a tiny server and gets one of 50 bytes back, which repeats the id and says 203.0.113.10.
Shown the way someone on the path sees it, with every byte that is not a printable character as a dot, the query reads .4...........shop.example.com.....: the name is plain text, so anyone on the path sees which sites you ask for. There is no connection and no signature: a reply that looks right is believed.
"""
figure = "exchange"
figure_title = "One datagram out, one back"
figure_speech = """
Now a real exchange, over U D P, on this machine. [[slnc 400]] The query is one datagram of thirty four bytes, with the id one two three four. [[slnc 300]] The response is one datagram of fifty bytes, with the same id, and the address. [[slnc 500]]
There is no connection, and no signature. [[slnc 300]] A reply is believed if the id and the question match. [[slnc 500]]
At the bottom is the query as someone on the path sees it. [[slnc 300]] A dot is a byte that is not a letter. [[slnc 300]] The store's name is plain text. [[slnc 300]] Anyone on the path sees which sites you look up.
"""
speech = """
The program's output: the query, what the path sees, and the response with the same id.
"""
rows = { udp = "active amber" }
console = [
    ["THE QUERY (one datagram, 34 bytes):", "ok"],
    ["  id 1234, asks for shop.example.com", "muted"],
    ["  seen on the path: .4...........shop.example.com.....", "muted"],
    ["  name readable: true  <- THE PATH SEES IT", "muted"],
    ["THE RESPONSE (one datagram, 50 bytes):", "ok"],
    ["  arrived: true, repeats id 1234: true", "muted"],
    ["  says 203.0.113.10", "muted"],
    ["no connection and no signature on the reply", "amber"],
]

[[act]]
title = "Cache poisoning by guessing"
summary = "With counting ids from port 53 the first forged answer is believed; with an id and port from HMAC-SHA-256 of a counter, 1000 forged answers do nothing among 4227858432 pairs."
detail = """
An attacker sends up to 1000 forged answers that say 192.0.2.66. Before the fix, the resolver counts its ids up and sends every query from port 53: the last id seen was 4000, so the guess 4001 on port 53 is believed after 1 forged answer, and the cache is poisoned.
After the fix, the id and port of query 2 come from HMAC-SHA-256(secret, 2) = c56a 8cedc967 ...: the id is the first 2 bytes, c56a = 50538, and the port is 1024 + (8cedc967 mod 64512) = 30055. Without the secret nobody can predict them,
and after 1000 forged answers the cache says nothing. The attacker must match 1 of 65536 x 64512 = 4,227,858,432 pairs, and 1000 guesses hit about 1 time in 4,227,858.
"""
figure = "poisoning"
figure_title = "Guessing the id and port"
figure_speech = """
Cache poisoning. [[slnc 300]] An attacker sends forged answers, with their own address. [[slnc 300]] To be believed, a forgery must repeat the id, and reach the right port. [[slnc 500]]
Before the fix, ids count up, and the port is always fifty three. [[slnc 300]] The last id seen was four thousand, so the guess is four thousand and one. [[slnc 300]] The first forgery is believed. [[slnc 500]]
After the fix, the id and port come from H mac S H A two fifty six: a keyed hash of the query counter. [[slnc 300]] The first two bytes, c five six a, are the id. [[slnc 300]] Divide the next four bytes by sixty four thousand five hundred twelve, and add one thousand twenty four to the remainder: that is the port. [[slnc 300]] Without the secret key, nobody can predict them. [[slnc 400]]
A thousand forgeries do nothing, out of over four billion pairs.
"""
speech = """
The program shows both. [[slnc 300]] Before the fix, one guess is enough. [[slnc 300]] After the fix, the hash, the id and the port, step by step, and a thousand forgeries that fail.
"""
rows = { poison = "active wrong" }
console = [
    ["THE ATTACK: up to 1000 forged answers, each says 192.0.2.66", "bad"],
    ["BEFORE THE FIX: ids count up, every query from port 53", "bad"],
    ["  last id seen 4000, so the guess is id 4001, port 53", "muted"],
    ["  after 1 forged answer the cache says 192.0.2.66  <- POISONED", "muted"],
    ["AFTER THE FIX: id and port from a keyed hash of a counter", "ok"],
    ["  HMAC-SHA-256(secret, 2) = c56a 8cedc967 79cf64f4 ...", "muted"],
    ["  id    first 2 bytes c56a = 50538", "muted"],
    ["  port  1024 + (8cedc967 mod 64512) = 30055", "muted"],
    ["  after 1000 forged answers the cache says nothing", "muted"],
    ["1 of 65536 ids x 64512 ports = 4227858432 pairs", "amber"],
    ["1000 guesses hit about 1 time in 4227858", "amber"],
]

[[act]]
title = "How long a false answer lives, and what stops it"
summary = "A false answer asking for 86400 seconds is still believed after two hours when the cap is a day, and gone when the cap is 3600 seconds; DNSSEC, encrypted DNS and TLS cover the rest."
detail = """
A false answer, 192.0.2.66, asks to be kept for 86400 seconds, a day. Before the fix, the resolver caps lifetimes at a day: kept until min(86400, 86400) = second 86400, and still believed after 2 hours. After the fix, the cap is 3600 seconds:
kept until min(86400, 3600) = second 3600, and gone after 2 hours. A cap does not stop the first lie, but it makes it short. DNSSEC signs the answers, so a forged one fails a check that needs no trust in the path; DNS over TLS or HTTPS hides the questions on the path to the resolver;
and the browser's check that the certificate names shop.example.com is the last line of defence. These three are described here, not run.
"""
figure = "lifetime"
figure_title = "The same lie under two caps"
figure_speech = """
Suppose a false answer gets in anyway. [[slnc 300]] It asks to be kept for a whole day. [[slnc 500]]
Before the fix, the resolver allows a day. [[slnc 300]] At two hours, the yellow line, the lie is still believed. [[slnc 500]]
After the fix, the cap is one hour. [[slnc 300]] The smaller of a day and an hour is an hour, so at two hours the lie is gone. [[slnc 300]] A cap does not stop the first lie. [[slnc 200]] It makes it short. [[slnc 500]]
Three more defences. [[slnc 300]] D N S S E C signs the answers. [[slnc 300]] Encrypted D N S seals the path to the resolver. [[slnc 300]] And T L S checks that the certificate names the store.
"""
speech = """
The output: kept a day and still believed, or kept an hour and gone. [[slnc 300]] And the other three defences, described here, not run.
"""
rows = { lifetime = "active ok" }
console = [
    ["THE FALSE ANSWER: 192.0.2.66, keep it 86400 seconds (a day)", "bad"],
    ["BEFORE THE FIX: cap 86400 (a day)", "bad"],
    ["  kept until min(86400, 86400) = second 86400", "muted"],
    ["  still believed after 2 hours (second 7200): true", "muted"],
    ["AFTER THE FIX: cap 3600 (an hour)", "ok"],
    ["  kept until min(86400, 3600) = second 3600", "muted"],
    ["  still believed after 2 hours (second 7200): false", "muted"],
    ["WHAT ELSE STOPS IT (described here, not run):", "ok"],
    ["  DNSSEC: a forged answer fails the signature check", "muted"],
    ["  DNS over TLS or HTTPS: hides the questions on the path", "muted"],
    ["  TLS: the certificate must name shop.example.com", "muted"],
]

