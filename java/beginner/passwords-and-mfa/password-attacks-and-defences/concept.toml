# tools/conceptkit turns it into the README, docs, diagrams, animation and video scenes.
# Written for a beginner: plain words, short sentences, every term explained the first time.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "password-attacks-and-defences"
module = "passwords-and-mfa"
title = "Password Attacks and Defences"
short_title = "Password Attacks and Defences"
package = "attacks"
main_class = "AttacksDemo"
tagline = "Guessing online, and how to slow it down"
bold = "A bank's login can be guessed at through three kinds of attack, dictionary, spraying and stuffing, and each defence, lockout, rate limit, second factor and breach check, stops one and misses another."
domain = "an online bank"
domain_note = ""
youtube_description = """Password attacks and defences in Java: attackers do not need to steal a database to guess passwords, they can simply try them at the login page. Explained with an online bank, like a night guard at a vault who must stop a patient thief without locking out the customers. We run a dictionary attack, password spraying and credential stuffing against a login with no defences, then add an account lockout, a rate limit per address, a second factor and a check against known breaches, count what each one stops and what it misses, and finish with the bill: a lockout can be turned into a denial of service, and error messages can reveal which usernames exist."""
thumb_lines = ["PASSWORD ATTACKS", "AND DEFENCES"]
thumb_code = "lock, limit, MFA"
youtube_title = "Password Attacks and Defences Explained in Java"
youtube_tags = ["password attacks", "brute force", "credential stuffing", "password spraying", "rate limiting", "account lockout", "security basics", "java", "cybersecurity for beginners"]

[readme]
intro = """
Hashing protects passwords after a theft. But an attacker does not have to steal anything: the login page
itself will answer every guess. There are three common ways to use it. A **dictionary attack** tries many passwords
against one account. **Password spraying** tries a few very common passwords against every account, so no single account
sees many failures. **Credential stuffing** takes pairs of usernames and passwords leaked from another site and tries each pair once,
hoping people reused them.

Four defences answer them. A **lockout** blocks an account after too many failures. A **rate limit** caps the
attempts one address may make. A **second factor** stops a right password from being enough. A **check against known breaches** refuses
passwords that are already public. This project runs each attack against a bank's login with each defence in turn, on a clock made of ticks, and counts
what the attack managed to do.
"""
analogy = """
Think of a night guard at a bank vault. A patient thief tries one key after another. The guard can ring an alarm
after five wrong keys, which stops the thief, and also stops a customer whose key sticks. He can allow each visitor only
five tries an hour. But a thief with a ring of stolen keys, one for each of a hundred doors, tries each key only once, and
never trips any of it. Only a second lock that needs something else, or a list of keys known to be stolen, catches that thief.
"""
scenario = """
An online bank has ten customers. Dana's password, midnight7, is on the attacker's list of twenty common passwords. Emil,
Farah and Hana chose welcome1, and Ivan chose hunter2. Gus, Kate and Mona chose long random passwords. Joel and Liam chose
passwords that were also leaked from another site, as did Dana and Farah. The attacker has no stolen database, only the bank's
login page and a clock that ticks once for every attempt.
"""
costs = [
    "**A lockout can be used against the customer.** An attacker who fails five times on Dana's account locks Dana out. Locking each account-and-address pair on its own helps, but an attacker with many addresses gets more guesses.",
    "**Rate limits slow, they do not stop.** Five attempts every ten ticks still lets a patient attacker through, and shared addresses, such as an office, can hit the limit by accident.",
    "**A second factor adds friction** for every login, and for the customers who lose the device.",
    "**Messages can leak.** A different message for an unknown name and a wrong password tells an attacker which usernames exist. One message for both is safer, and makes real mistakes harder to explain.",
]
too_much = """
A site with no accounts has nothing to defend. As soon as there are accounts, a rate limit is the minimum, and for anything that
holds money or private data, a second factor and a breach check are worth the friction. The strength of each defence should match
what the account can lose.
"""
met_before = [
    "\"Your account has been locked after too many failed attempts\" emails.",
    "A login page that asks you to wait, or to prove you are not a robot, after a few wrong tries.",
    "A prompt to enter a code from an app after you type your password.",
    "\"This password has appeared in a data breach, please choose another\" at sign-up.",
]
where = """
This project is the third one in [passwords-and-mfa](..), after [password-hashing](../password-hashing) and its [library version](../password-hashing-with-spring-security-crypto).
"""
twin = """
Time is a counter of ticks, one per attempt, so every run is the same. The wordlists are tiny: 20 words for the dictionary and 3 for the spray,
where a real attacker has billions. Real systems also see attackers spread over thousands of addresses, who defeat a limit per address,
and defenders use further signals, such as device recognition and unusual locations, which this project does not model.
"""
test_note = "Every line the demo prints is checked against `docs/expected-output.txt`. Time is a tick counter and nothing is random, so every run gives the same result."

[[act]]
title = "No defences"
summary = "A dictionary attack finds Dana's password in 14 guesses at tick 13, and spraying three common passwords takes 4 of 10 accounts in 23 guesses."
detail = """
The bank's login answers every attempt, as often as it is asked. A dictionary attack on Dana tries twenty
common passwords in order, one per tick, and finds midnight7 on the 14th guess, at tick 13. Spraying tries three common
passwords, welcome1, hunter2 and 123456, against all ten accounts. It takes four accounts, Emil, Farah, Hana and Ivan, in 23
guesses, finishing at tick 23. Each account saw at most three wrong guesses.
"""
speech = """
First demo: no defences. [[slnc 400]] The bank's login answers every attempt, however often it is asked. [[slnc 600]]
A dictionary attack tries many passwords against one account. [[slnc 300]] The attacker tries twenty common passwords against Dana, one at a time. [[slnc 300]] The fourteenth guess is right, at tick thirteen. [[slnc 600]]
Password spraying does the opposite. [[slnc 300]] It tries a few very common passwords, against every account. [[slnc 300]] Three passwords, ten accounts. [[slnc 300]] It takes four accounts, in twenty three guesses. [[slnc 300]] And no account saw more than three wrong guesses.
"""
rows = { lock = "active wrong", limit = "active wrong" }
console = [
    ["dictionary attack on dana: found after 14 guesses, at tick 13  <- NOTHING STOPS IT", "bad"],
    ["spraying 3 common passwords over 10 accounts: 4 taken (emil, farah, hana, ivan)", "bad"],
    ["23 guesses in all, finished at tick 23", "muted"],
]

[[act]]
title = "Lock an account after 5 wrong passwords, for 10 ticks"
summary = "The dictionary attack on Dana now wins at tick 33 instead of 13, but the spray still takes 4 accounts, because no account fails 5 times."
detail = """
A lockout blocks an account for 10 ticks after 5 wrong passwords. The dictionary attack must now wait out each lock, and
it finds Dana's password at tick 33 instead of tick 13: slowed, not stopped. The spray is not affected at all. It still takes
four accounts and finishes at tick 23, because no account ever fails 5 times in a row. A lockout counts failures per account, and a
spray spreads its failures thinly across all of them.
"""
speech = """
Second demo: a lockout. [[slnc 400]] After five wrong passwords, an account is blocked for ten ticks. [[slnc 600]]
The dictionary attack on Dana now has to wait out each lock. [[slnc 300]] It finds the password at tick thirty three, instead of tick thirteen. [[slnc 300]] Slowed, not stopped. [[slnc 600]]
The spray is not affected at all. [[slnc 300]] It still takes four accounts, at tick twenty three. [[slnc 300]] No account ever failed five times. [[slnc 600]]
A lockout counts failures per account. [[slnc 300]] A spray spreads them thinly over all of them.
"""
rows = { lock = "active ok" }
console = [
    ["dictionary attack on dana: found at tick 33 instead of tick 13", "ok"],
    ["the same spray: 4 taken, finished at tick 23  <- NO ACCOUNT FAILED 5 TIMES", "bad"],
]

[[act]]
title = "Allow each address 5 attempts in every 10 ticks"
summary = "A rate limit per address delays Dana's password to tick 23 and stretches the spray to 43 ticks, but both still succeed."
detail = """
A rate limit counts attempts per address, not per account. Each address may make 5 attempts in every 10 ticks, and the
attacker has one address. The dictionary attack now finds Dana's password at tick 23. The spray still takes four accounts,
but needs 43 ticks instead of 23. The attack runs at about half the speed. A longer wordlist would simply take longer; the
limit buys time and does not close the door.
"""
speech = """
Third demo: a rate limit. [[slnc 400]] The bank counts attempts for each address. [[slnc 300]] Five attempts in every ten ticks. [[slnc 600]]
The dictionary attack on Dana now succeeds at tick twenty three. [[slnc 600]]
The spray still takes four accounts. [[slnc 300]] But it needs forty three ticks, instead of twenty three. [[slnc 600]]
The attack runs at about half the speed. [[slnc 300]] A rate limit buys time. [[slnc 300]] It does not close the door.
"""
rows = { limit = "active ok" }
console = [
    ["dictionary attack on dana: found at tick 23", "amber"],
    ["the same spray: 4 taken, but it needs 43 ticks instead of 23  <- SLOWED, NOT STOPPED", "amber"],
]

[[act]]
title = "Credential stuffing: passwords leaked from another site"
summary = "With lockout and rate limit, 4 of 10 accounts still fall; a second factor on 2 of them cuts that to 2; a breach check cuts it to 0 and forces 4 resets."
detail = """
Credential stuffing uses pairs of usernames and passwords leaked from another site. Ten leaked pairs are each tried once, each
from a different address. Four of them are passwords the customers reused at the bank. The lockout and the rate limit
never trigger, because every account sees one attempt and every address makes one. Four of ten accounts are taken. If Dana and Joel have
a second factor, two of the four are stopped at the second factor and two are taken. With a check against known breaches, the right passwords
are recognised as public and the login demands a new one: none are taken, and four customers are forced to choose a new password.
"""
speech = """
Fourth demo: credential stuffing. [[slnc 400]] Passwords leak from other sites, and people reuse them. [[slnc 300]] The attacker takes ten leaked pairs of name and password, and tries each one once, from ten different addresses. [[slnc 600]]
Four of the ten are passwords the customers reused at the bank. [[slnc 300]] The lockout never triggers. [[slnc 300]] Neither does the rate limit. [[slnc 300]] Each account saw one attempt, and each address made one. [[slnc 300]] Four of ten accounts are taken. [[slnc 600]]
Now give Dana and Joel a second factor. [[slnc 300]] Two of the four are stopped at the second step. [[slnc 600]]
Or check passwords against known breaches. [[slnc 300]] The four right passwords are recognised as public, and the bank demands new ones. [[slnc 300]] None are taken. [[slnc 300]] Four customers are asked to choose a new password.
"""
rows = { second = "active ok" }
console = [
    ["10 leaked pairs, each tried once, each from a different address", "muted"],
    ["with a lockout and a rate limit: 4 of 10 accounts taken  <- NEITHER EVER TRIGGERS", "bad"],
    ["with a second factor on dana and joel: 2 taken, 2 stopped at the second factor", "ok"],
    ["with a check against known breaches: 0 taken, 4 customers forced to choose a new password", "ok"],
]

[[act]]
title = "The bill: a lock can be used against the customer, and messages can leak"
summary = "An attacker can lock Dana out, locking per address avoids that but gives 10 addresses 50 guesses, and different error messages reveal which names exist."
detail = """
The defences have costs. First, a lockout per account can be turned against the customer: an attacker fails 5 times on Dana's
account, and then Dana, logging in from her own phone with the right password, is told the account is locked. That is a denial of
service. Locking each account-and-address pair instead lets Dana in, but an attacker with 10 addresses now gets 10 times 5, which is 50, guesses
before any is locked. Second, messages. If an unknown name says "no account with that name" and a wrong password says "wrong password", the
attacker can test which usernames exist. One message for both, "wrong username or password", hides it, at the price of a vaguer message for honest typing mistakes.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] Every defence has a cost. [[slnc 600]]
First, a lockout can be used against the customer. [[slnc 300]] The attacker fails five times on Dana's account. [[slnc 300]] Then Dana logs in from her own phone, with the right password. [[slnc 300]] And is told the account is locked. [[slnc 300]] That is a denial of service. [[slnc 600]]
Locking each account and address pair on its own lets Dana in. [[slnc 300]] But an attacker with ten addresses now gets fifty guesses, before any of them is locked. [[slnc 600]]
Second, messages. [[slnc 300]] If an unknown name says, no account with that name, and a wrong password says, wrong password, the attacker can test which names exist. [[slnc 300]] One message for both hides it. [[slnc 300]] At the price of a vaguer message for honest mistakes.
"""
rows = { lock = "active amber", messages = "active amber" }
console = [
    ["an attacker fails 5 times on dana's account, then dana logs in with the right password: LOCKED", "bad"],
    ["  <- DENIAL OF SERVICE", "bad"],
    ["locking each account-and-address pair instead: dana logs in: OK", "ok"],
    ["but 10 addresses get 10 x 5 = 50 guesses before any of them is locked", "amber"],
    ["unknown name zed: \"no account with that name\"", "muted"],
    ["known name emil, wrong password: \"wrong password\"  <- LEAKS WHICH NAMES EXIST", "bad"],
    ["with one message for both: \"wrong username or password\" and \"wrong username or password\"", "ok"],
]

