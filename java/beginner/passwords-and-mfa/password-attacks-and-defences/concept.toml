On the right, spraying. [[slnc 300]] Three common passwords, each tried on every account not yet taken. [[slnc 300]] Welcome one takes Emil, Farah and Hana. [[slnc 300]] Hunter two takes Ivan. [[slnc 600]]
Four accounts, in twenty three guesses. [[slnc 300]] And no account saw more than three wrong guesses. [[slnc 300]] Remember that number.
"""
