Then the dictionary. [[slnc 300]] Guesses one to thirteen are wrong, and guess fourteen gets in, at tick thirteen. [[slnc 500]] Then the spray, password by password. [[slnc 300]] The result: four of ten accounts, by tick twenty three.
"""
