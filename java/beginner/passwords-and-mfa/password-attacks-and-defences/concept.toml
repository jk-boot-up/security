kind = "poster"
title = "Password Attacks and Defences"
narration = """Hello, and welcome. [[slnc 400]] This video explains password attacks and defences, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] Even when passwords are stored well, an attacker does not need to steal anything. [[slnc 300]] The login page itself will answer every guess. [[slnc 300]] A password attack is a way of using that page to find a password by trying. [[slnc 600]] Think of a night guard at a bank vault. [[slnc 300]] A patient thief tries one key after another. [[slnc 300]] The guard can ring an alarm after five wrong keys. [[slnc 300]] That stops the thief, and also stops a customer whose key sticks. [[slnc 300]] But a thief with one stolen key for each of a hundred doors, tries each key only once, and trips nothing. [[slnc 700]] In this video, the domain is an online bank, with ten customers. [[slnc 500]] By the end, you will hear three kinds of attack, and four defences. [[slnc 300]] What each defence stops, and what each one misses. [[slnc 300]] And what the defences cost."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online bank, ten customers.", "", "Passwords are stored as slow hashes.", "The attacker has no stolen database.", "Only the login page, and time.", "", "The page answers every guess."]
narration = """Here is the scenario. [[slnc 400]] An online bank has ten customers. [[slnc 500]] Their passwords are stored as slow, salted hashes, as in the earlier videos. [[slnc 500]] The attacker has no stolen database. [[slnc 300]] Only the bank's login page, and a clock that ticks once for every attempt. [[slnc 600]] Some customers chose very common passwords. [[slnc 300]] Some reused a password from another site. [[slnc 300]] And some chose long random ones."""

[[scene]]
key = "03-attacks"
kind = "bullets"
title = "Three Attacks"
body = ["Dictionary: many passwords, one account", "Spraying: few passwords, every account", "Stuffing: leaked pairs, one try each"]
narration = """Before the demos, the three attacks. [[slnc 500]] A dictionary attack tries many passwords against one account. [[slnc 500]] Password spraying tries a few very common passwords against every account, so no account sees many failures. [[slnc 500]] And credential stuffing takes pairs of names and passwords leaked from another site, and tries each pair once, hoping people reused them."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "09-matrix"
kind = "bullets"
title = "What Stops What"
body = ["Lockout: slows a dictionary, misses a spray", "Rate limit: slows both, misses many addresses", "Second factor: stops a right password", "Breach check: refuses a public password", "", "Layer them. None covers everything."]
narration = """Let's put the defences against the attacks. [[slnc 400]] A lockout slows a dictionary attack, and misses a spray. [[slnc 500]] A rate limit slows both, and misses an attacker with many addresses. [[slnc 500]] A second factor stops a right password from being enough. [[slnc 500]] A breach check refuses a password that is already public. [[slnc 600]] So layer them. [[slnc 300]] None of them covers everything."""

[[scene]]
key = "10-roles"
kind = "bullets"
title = "Who Does What"
body = ["Bank: the login and its defences", "Defences: which protections are on", "Attacks: dictionary, spray and stuffing", "Outcome: what the login answered", "Ticker: a clock made of ticks"]
narration = """Here is who does what in the code. [[slnc 400]] The bank class is the login, and applies the defences. [[slnc 500]] The defences record says which protections are switched on. [[slnc 500]] The attacks class holds the three scripts. [[slnc 500]] The outcome says what the login answered to one attempt. [[slnc 300]] And the ticker is a clock made of ticks, so every run is the same."""

[[scene]]
key = "11-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Your account has been locked", "Wait, or prove you are human", "A code sent to your phone", "This password is in a known breach"]
narration = """You have probably met these already. [[slnc 400]] An email saying your account has been locked after too many failed attempts is a lockout. [[slnc 500]] A page that asks you to wait, after a few wrong tries, is a rate limit. [[slnc 500]] A code sent to your phone, after you type your password, is a second factor. [[slnc 500]] And a sign up form that refuses a password because it appeared in a data breach, is a breach check."""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use Them"
body = ["Layer: limit, lock gently, second factor, breach check", "One message for every failure", "Never let outsiders lock owners out for long", "Watch for many accounts failing once each"]
narration = """So, how do you use these? [[slnc 400]] Layer the defences, because none covers every attack. [[slnc 500]] Give one message for every failure. [[slnc 500]] Never let an outsider lock the owner out for long. [[slnc 500]] And watch the logs, because the first sign of spraying or stuffing is many different accounts failing once each."""

[[scene]]
key = "13-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a fourth spray password", "and count the accounts it takes."]
narration = """That's password attacks and defences. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Every defence stops some attacks and misses others, so layer them, and let the second factor catch what the others cannot. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine, with nothing installed except a Java development kit. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a fourth password to the spray, and count how many more accounts it takes. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
The login of an online bank and the defences in front of it: the account lockout, the per-address rate limit, a second
factor, a check against known breached passwords, and the messages the login returns. It covers guessing at the login page,
not theft of the database and not how the password is stored.
"""
assets = [
    "Customers' accounts and the money behind them.",
    "The availability of login for the real customer.",
    "The secrecy of which usernames exist.",
    "The login service itself, which spends work on every attempt.",
]
actors = [
    "Customers, with passwords of every strength, some reused from other sites.",
    "An attacker with one address, trying many passwords against one account.",
    "An attacker spraying a few common passwords across all accounts.",
    "A botnet using many addresses, with pairs leaked from another site.",
]
boundaries = [
    "Internet to login: where the per-address limit sits.",
    "Login to account: where the lock and the password check sit.",
    "Password to second factor: where a right password stops being enough.",
]
assumptions = [
    "Passwords are stored as slow, salted hashes (see password-hashing).",
    "The attacker has no stolen database and no access to the customer's device.",
    "Addresses can be told apart. Many customers behind one shared address are a hazard for any per-address limit.",
]
out_of_scope = [
    "Real networks, CAPTCHAs, device recognition and location signals.",
    "How one-time codes are made: the totp project covers that.",
    "Phishing, which defeats most of these defences by tricking the customer.",
]
tests = [
    "`BankTest` checks each defence on its own: locks and when they end, limits per window, second factor, breach check and messages.",
    "`AttacksTest` pins the numbers: tick 13, 33 and 23 for the dictionary attack, and 23 and 43 ticks for the spray.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next project, totp-multi-factor, builds the second factor that act four relies on: a one-time code made from a shared secret and the time.
"""

[[threat]]
id = "T1"
stride = "S"
threat = "A dictionary attack finds one account's password by trying many"
where = "`Attacks.dictionary`"
control = "An account lock after 5 failures slows it from tick 13 to tick 33"
residual = "It is slowed, not stopped; a stronger password and a second factor are needed"

[[threat]]
id = "T2"
stride = "S"
threat = "Spraying takes accounts with common passwords without tripping any lock"
where = "`Attacks.spray`"
control = "A rate limit per address slows the spray from 23 to 43 ticks"
residual = "Four of ten accounts still fall; a breach check and a second factor help"

[[threat]]
id = "T3"
stride = "S"
threat = "Credential stuffing uses passwords reused from another site"
where = "`Attacks.stuff`"
control = "A second factor, and a check of right passwords against known breaches"
residual = "Customers must change their password or enrol a device, which costs them effort"

[[threat]]
id = "T4"
stride = "D"
threat = "An outsider locks a real customer out by failing on purpose"
where = "`Bank.login` with `LockScope.ACCOUNT`"
control = "Lock each account-and-address pair instead"
residual = "An attacker with many addresses gets more guesses: 10 addresses give 50"

[[threat]]
id = "T5"
stride = "D"
threat = "A per-address limit blocks many honest customers behind one shared address"
where = "`Bank.login` rate limit"
control = "None here"
residual = "Real systems tune limits per context and add other signals"

[[threat]]
id = "T6"
stride = "I"
threat = "Different messages reveal which usernames exist"
where = "`Bank.login` messages"
control = "One message, \"wrong username or password\", for both cases"
residual = "Timing and other differences can still reveal it; the messages are only the first step"

[[threat]]
id = "T7"
stride = "R"
threat = "Attacks go unnoticed because nobody looks at the failures"
where = "the whole login"
control = "None in this project"
residual = "Logging failures per address and per account would show spraying as many accounts failing once"
