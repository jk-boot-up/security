[poster]
headline = [["PASSWORD ATTACKS", "text"], ["AND DEFENCES", "accent"]]
taglines = [["Guessing online, and how to slow it down", "gold"]]
before = { code = "answer every guess", note = "unlimited tries, names leak", tag = "BEFORE" }
after = { code = "limit, lock, 2nd factor", note = "each stops a different attack", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "Password Attacks and Defences"
narration = """Hello, and welcome. [[slnc 400]] This video explains password attacks and defences, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] An attacker does not need to steal anything to guess a password. [[slnc 300]] The login page itself answers every guess. [[slnc 600]] Think of a night guard at a bank vault. [[slnc 300]] He can ring an alarm after five wrong keys. [[slnc 300]] But a thief with one stolen key for each of a hundred doors tries each key once, and trips nothing. [[slnc 700]] Our domain is an online bank, with ten customers. [[slnc 500]] Three attacks, four defences, and what each one stops, misses, and costs."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online bank, ten customers.", "", "Some chose common passwords.", "Some reused a leaked one.", "The attacker has no stolen database.", "Only the login page, and time."]
narration = """Here is the scenario. [[slnc 400]] An online bank has ten customers. [[slnc 500]] Some chose common passwords, like welcome one. [[slnc 300]] Some reused a password that leaked from another site. [[slnc 600]] The attacker has no stolen database. [[slnc 300]] Only the login page, and a clock that ticks once per attempt."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["Dictionary: many passwords, one account", "Spraying: few passwords, every account", "Stuffing: leaked pairs, one try each", "Tick: one step of the demo's clock", "Address: where an attempt comes from"]
narration = """First, the words. [[slnc 500]] A dictionary attack tries many passwords on one account. [[slnc 500]] Spraying tries a few common passwords on every account. [[slnc 500]] Stuffing tries leaked pairs of name and password, once each. [[slnc 500]] A tick is one step of the demo's clock. [[slnc 500]] And the address is where an attempt comes from: its I P address."""

[[scene]]
key = "03-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "04-guess"
kind = "figure"
title = "One guess, checked"
body = "one_guess"
narration = """Let's start with one guess. [[slnc 400]] On the left, in green, the request: the name Dana, and the password one two three four five six. [[slnc 600]] In the middle, the check. [[slnc 300]] The bank keeps no passwords, only hashes: S H A two five six, of a salt, the name and the password. [[slnc 300]] The guess hashes to four zero three f, and so on. [[slnc 300]] Dana's stored hash starts six one three four. [[slnc 300]] Not the same. [[slnc 600]] So the response, in red: wrong password. [[slnc 600]] Each guess costs one attempt. [[slnc 300]] And a rate limit or a lock can refuse an attempt before the password is even checked."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "09-matrix"
kind = "bullets"
title = "What Stops What"
body = ["Lockout: slows a dictionary, misses a spray", "Rate limit: slows both, misses many addresses", "Second factor: stops a right password", "Breach check: refuses a public password", "", "Layer them. None covers everything."]
narration = """Let's put them side by side. [[slnc 400]] A lockout slows a dictionary, and misses a spray. [[slnc 500]] A rate limit slows both, and misses many addresses. [[slnc 500]] A second factor stops a right password being enough. [[slnc 500]] A breach check refuses a public password. [[slnc 600]] So layer them."""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Layer: limit, lock gently, second factor, breach check", "One message for every failure", "Never let outsiders lock owners out for long", "Watch for many accounts failing once each"]
narration = """So, how do you use these? [[slnc 400]] Layer the defences. [[slnc 500]] Give one message for every failure. [[slnc 500]] Never let an outsider lock the owner out for long. [[slnc 500]] And watch for many accounts failing once each: that is spraying or stuffing."""

[[scene]]
key = "13-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "13-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a fourth spray password", "and count the accounts it takes."]
narration = """That's password attacks and defences. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Every defence stops some attacks and misses others, so layer them. [[slnc 500]] The full source code, notes, diagrams, and an animated walkthrough are in the repository. [[slnc 500]] Here is one exercise. [[slnc 300]] Add a fourth password to the spray, and count the accounts it takes. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
The login of an online bank and the defences in front of it: the account lockout, the per-address rate limit, a second
factor, a check against known breached passwords, and the messages the login returns. It covers guessing at the login page,
not theft of the database and not how the password is stored.
"""
assets = [
    "Customers' accounts and the money behind them.",
    "The availability of login for the real customer.",
    "The secrecy of which usernames exist.",
    "The login service itself, which spends work on every attempt.",
]
actors = [
    "Customers, with passwords of every strength, some reused from other sites.",
    "An attacker with one address, trying many passwords against one account.",
    "An attacker spraying a few common passwords across all accounts.",
    "A botnet using many addresses, with pairs leaked from another site.",
]
boundaries = [
    "Internet to login: where the per-address limit sits.",
    "Login to account: where the lock and the password check sit.",
    "Password to second factor: where a right password stops being enough.",
]
assumptions = [
    "Passwords are stored as slow, salted hashes (see password-hashing).",
    "The attacker has no stolen database and no access to the customer's device.",
    "Addresses can be told apart. Many customers behind one shared address are a hazard for any per-address limit.",
]
out_of_scope = [
    "Real networks, CAPTCHAs, device recognition and location signals.",
    "How one-time codes are made: the totp project covers that.",
    "Phishing, which defeats most of these defences by tricking the customer.",
]
tests = [
    "`BankTest` checks each defence on its own: locks and when they end, limits per window, second factor, breach check and messages.",
    "`AttacksTest` pins the numbers: tick 13, 33 and 23 for the dictionary attack, and 23 and 43 ticks for the spray.",
    "`TimelineTest` checks the tick-by-tick runs behind tick 33 and tick 23, and the salted SHA-256 hash act one prints.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next project, totp-multi-factor, builds the second factor that act four relies on: a one-time code made from a shared secret and the time.
"""

[[threat]]
id = "T1"
stride = "S"
threat = "A dictionary attack finds one account's password by trying many"
where = "`Attacks.dictionary`"
control = "An account lock after 5 failures slows it from tick 13 to tick 33"
residual = "It is slowed, not stopped; a stronger password and a second factor are needed"

[[threat]]
id = "T2"
stride = "S"
threat = "Spraying takes accounts with common passwords without tripping any lock"
where = "`Attacks.spray`"
control = "A rate limit per address slows the spray from 23 to 43 ticks"
residual = "Four of ten accounts still fall; a breach check and a second factor help"

[[threat]]
id = "T3"
stride = "S"
threat = "Credential stuffing uses passwords reused from another site"
where = "`Attacks.stuff`"
control = "A second factor, and a check of right passwords against known breaches"
residual = "Customers must change their password or enrol a device, which costs them effort"

[[threat]]
id = "T4"
stride = "D"
threat = "An outsider locks a real customer out by failing on purpose"
where = "`Bank.login` with `LockScope.ACCOUNT`"
control = "Lock each account-and-address pair instead"
residual = "An attacker with many addresses gets more guesses: 10 addresses give 50"

[[threat]]
id = "T5"
stride = "D"
threat = "A per-address limit blocks many honest customers behind one shared address"
where = "`Bank.login` rate limit"
control = "None here"
residual = "Real systems tune limits per context and add other signals"

[[threat]]
id = "T6"
stride = "I"
threat = "Different messages reveal which usernames exist"
where = "`Bank.login` messages"
control = "One message, \"wrong username or password\", for both cases, and the same hash computed for an unknown name, which also counts toward the lock"
residual = "Other differences, such as a sign-up form that says a name is taken, can still reveal which names exist"

[[threat]]
id = "T7"
stride = "R"
threat = "Attacks go unnoticed because nobody looks at the failures"
where = "the whole login"
control = "None in this project"
residual = "Logging failures per address and per account would show spraying as many accounts failing once"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] A few small classes. [[slnc 300]] Here is what each one does."""

[[class]]
name = "AttacksDemo"
what = "runs the five acts"
[[class.part]]
title = "a defence, an attack, the steps"
code = """
Defences lock = Defences.none().withLockout(LOCK_AFTER, LOCK_TICKS, LockScope.ACCOUNT);
Ticker t1 = new Ticker();
Attacks dictionary = new Attacks(bank(t1, lock, Set.of()), t1);
Found found = dictionary.dictionary("attacker", "dana", WORDLIST);
line(out, "  THE DICTIONARY: the same " + WORDLIST.size() + " words on dana");
timeline(out, dictionary.steps());
"""
speech = """Attacks demo runs the five acts. [[slnc 300]] Each act switches on defences, runs an attack on the bank, and prints its steps. [[slnc 300]] Here, the lockout of act two."""

[[class]]
name = "Bank"
what = "the login, with its defences"
[[class.part]]
title = "refused before the password is checked"
code = """
if (defences.perAddressLimit() > 0) {
    String window = address + "@" + (now / defences.windowTicks());
    int used = attemptsByWindow.merge(window, 1, Integer::sum);
    if (used > defences.perAddressLimit()) {
        return new Reply(Outcome.RATE_LIMITED, "too many attempts, slow down");
...
if (defences.lockoutAfter() > 0 && now < lockedUntilByKey.getOrDefault(key, 0)) {
    return new Reply(Outcome.LOCKED, "account locked, try again later");
"""
speech = """The bank's login method checks the rate limit first. [[slnc 300]] It counts the attempts of this address in the current window of ticks. [[slnc 300]] Then the lock. [[slnc 300]] Both can refuse an attempt before the password is looked at."""
[[class.part]]
title = "the check, the lock, and the last two defences"
code = """
boolean matches = hash(username, password).equals(expected) && account != null;
if (!matches) {
    int failures = failuresByKey.merge(key, 1, Integer::sum);
    if (defences.lockoutAfter() > 0 && failures >= defences.lockoutAfter()) {
        lockedUntilByKey.put(key, now + 1 + defences.lockoutTicks());
...
if (defences.breached().contains(password)) {
...
if (account.secondFactor) {
"""
speech = """Then the hashes are compared. [[slnc 300]] The fifth failure locks the account from the next tick, for ten ticks. [[slnc 300]] A right password can still be refused: by the breach check, or the second factor."""

[[class]]
name = "Defences"
what = "which protections are on"
[[class.part]]
title = "zero means off"
code = """
public static Defences none() {
    return new Defences(0, 0, LockScope.ACCOUNT, 0, 1, false, Set.of());
...
public Defences withLockout(int after, int ticks, LockScope scope) {
"""
speech = """Defences is a record of settings. [[slnc 300]] A zero means that defence is off, and none switches everything off. [[slnc 300]] Each act adds what it needs."""

[[class]]
name = "Attacks"
what = "dictionary, spray and stuffing"
[[class.part]]
title = "a refused attempt is tried again"
code = """
while (next < words.size()) {
    Reply reply = attempt(address, username, words.get(next));
    if (reply.outcome() != Outcome.LOCKED && reply.outcome() != Outcome.RATE_LIMITED) {
        guesses++;
        next++;
...
    ticker.advance(1);                                 // one tick per attempt
"""
speech = """Attacks holds the three scripts. [[slnc 300]] The dictionary tries one word per tick. [[slnc 300]] If the attempt is locked or rate limited, the same word is tried again on the next tick. [[slnc 300]] Every attempt is recorded as a step."""

[[class]]
name = "Timeline"
what = "steps folded into runs, tick by tick"
[[class.part]]
title = "runs of the same answer"
code = """
public record Step(int tick, String username, String password, Outcome outcome) {
...
if (first.refused()) {
    guessed = "no guess";                       // a refused attempt does not use up a word
...
lines.add(String.format("%-13s %-15s %s", ticks, guessed, first.outcome()));
"""
speech = """A step is one attempt: its tick, the name, the password and the answer. [[slnc 300]] Timeline folds the steps into runs of the same answer. [[slnc 300]] Those are the lines that showed how tick thirty three is made."""

[[class]]
name = "Reply and Outcome"
what = "what the login answered"
[[class.part]]
title = "seven possible answers"
code = """
public record Reply(Outcome outcome, String message) {
...
OK,
WRONG_PASSWORD,
UNKNOWN_USER,
...
LOCKED,
...
RATE_LIMITED,
...
SECOND_FACTOR_NEEDED,
...
RESET_REQUIRED
"""
speech = """A reply is the outcome, and the message the person sees. [[slnc 300]] The outcome is one of seven answers, from O K to reset required."""

[[class]]
name = "Ticker"
what = "a clock made of ticks"
[[class.part]]
title = "no waiting, the same every run"
code = """
public void advance(int ticks) {
    now += ticks;
"""
speech = """And the ticker is the clock. [[slnc 300]] A lock of ten ticks needs no real waiting, and every run gives the same numbers."""

