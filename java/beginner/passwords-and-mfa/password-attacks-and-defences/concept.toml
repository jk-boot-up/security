[[act]]
title = "Credential stuffing: passwords leaked from another site"
summary = "Ten leaked pairs, each tried once from its own address: with lockout and rate limit Dana, Farah, Joel and Liam fall; a second factor on Dana and Joel stops those two; a breach check stops all four and forces new passwords."
detail = """
Credential stuffing uses pairs of usernames and passwords leaked from another site. Ten leaked pairs are each tried once, each from its own address. Dana, Farah,
Joel and Liam used the same password at the bank. The lockout and the rate limit never trigger, because every account sees one attempt and every address makes one:
those four are taken. If Dana and Joel have a second factor, their right password only gets a request for a code, and Farah and Liam are taken. With a check against known breaches,
the right passwords are recognised as public: nobody is taken, and Dana, Farah, Joel and Liam must choose a new password.
"""
figure = "stuffing_table"
figure_title = "Ten leaked pairs against three sets of defences"
figure_speech = """
Fourth demo: credential stuffing. [[slnc 400]] The attacker has ten pairs of name and password, leaked from another site. [[slnc 300]] Each pair is tried once, from its own address. [[slnc 300]] Four customers used the same password here. [[slnc 600]]
First column: a lockout and a rate limit. [[slnc 300]] All four are taken. [[slnc 300]] Nothing ever counts to five. [[slnc 600]]
Second column: Dana and Joel have a second factor. [[slnc 300]] The bank asks them for a code. [[slnc 300]] Two are taken. [[slnc 600]]
Third column: a check against known breaches. [[slnc 300]] The right password is already public, so the bank asks for a new one. [[slnc 300]] Nobody is taken.
"""
