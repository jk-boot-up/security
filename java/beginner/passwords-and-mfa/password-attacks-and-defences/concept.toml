[docs.session]
objectives = [
    "name the three ways of guessing passwords online and tell them apart",
    "say which defence stops which attack, and which it misses",
    "explain how a lockout can be turned into a denial of service",
    "explain why an error message can leak information",
]
walkthrough = """
Start with the night guard analogy. Run the demo one act at a time. After act two, ask what kind of attack the lockout does not
stop, and let the group name spraying before it is shown. After act three, ask what an attacker with a thousand addresses would do. In act four, ask what the
bank could do about customers who reuse passwords, and what it costs them. In act five, ask whether the group would rather lock out a real customer
or let a guesser try a few more times, and why the answer depends on the bank.
"""
exercises = [
    "Raise the lockout to 10 failures. Which acts change, and which do not?",
    "Add a fourth spray password, 12345678. Does the spray take more accounts, and how many ticks does it need?",
    "Make the rate limit apply per username as well as per address. Which attack does that slow most?",
    "Add a delay that doubles after each failure instead of a fixed lock, and compare the dictionary attack's time.",
]

[docs.explained]
sentence = """
Attackers can guess passwords through the login page itself, with a dictionary against one account, a few common passwords against every account, or leaked pairs from another site, and each defence, lockout, rate limit, second factor or breach check, stops some of these and misses others.
"""
verdict = """
Layer the defences, because none of them covers every attack. Use a rate limit per address and a gentle limit per account, a second factor for
anything that matters, and a check against known breaches at sign-up and login. Give one message for every failure, never lock an account in a way an
outsider can trigger for long, and watch the logs, because the first sign of spraying or stuffing is many accounts failing once each.
"""
recognise = [
    "A login that waits longer after each wrong try.",
    "\"We sent a code to your phone\" after a correct password.",
    "A sign-up form that refuses a password because it appeared in a breach.",
    "A single message such as \"wrong username or password\".",
]

