[[act]]
title = "Allow each address 5 attempts in every 10 ticks"
summary = "A rate limit per address allows 5 guesses in each window of 10 ticks, so Dana's password falls at tick 23 instead of 13, and the spray needs 43 ticks instead of 23."
detail = """
A rate limit counts attempts per address, not per account. Each address may make 5 attempts in every window of 10 ticks, and the attacker has one address.
In the window of ticks 0 to 9, guesses 1 to 5 take ticks 0 to 4 and ticks 5 to 9 are RATE_LIMITED. The same happens in the window of ticks 10 to 19. In the third window,
guesses 11 to 14 take ticks 20 to 23, and the attacker is in at tick 23 instead of 13. The spray still takes four accounts, but by tick 43 instead of 23. The attack runs at
about half the speed: a rate limit buys time and does not close the door.
"""
figure = "limit_windows"
figure_title = "A rate limit: 5 attempts in every 10 ticks"
figure_speech = """
Third demo: a rate limit. [[slnc 400]] Each address may make five attempts in every window of ten ticks. [[slnc 600]]
The grey boxes are the windows. [[slnc 300]] In each one, five wrong guesses. [[slnc 300]] Then five ticks refused, in amber. [[slnc 300]] In the third window, the attacker is in, at tick twenty three. [[slnc 600]]
The spray is slowed the same way. [[slnc 300]] Done at tick forty three, instead of twenty three. [[slnc 600]]
About half the speed. [[slnc 300]] A rate limit buys time. [[slnc 300]] It does not close the door.
"""
speech = """
Here is the output. [[slnc 400]] The dictionary from one address. [[slnc 300]] Five guesses, then rate limited, again and again, and in at tick twenty three. [[slnc 500]]
The spray still takes four accounts. [[slnc 300]] But only by tick forty three.
"""
