[[act]]
title = "Lock an account after 5 wrong passwords, for 10 ticks"
summary = "The lockout turns tick 13 into tick 33: two locks of 10 ticks, during which no guess is used; the spray still takes 4 accounts by tick 23, because no account fails 5 times."
detail = """
A lockout blocks an account for 10 ticks after 5 wrong passwords. Tick by tick: guesses 1 to 5 are wrong at ticks 0 to 4, so ticks 5 to 14 are LOCKED and use up no guess.
Guesses 6 to 10 are wrong at ticks 15 to 19, so ticks 20 to 29 are locked. Guesses 11 to 13 take ticks 30 to 32, and guess 14 gets in at tick 33 instead of tick 13: the same
14 guesses plus 20 locked ticks. Slowed, not stopped. The spray is not affected at all: at most 3 wrong guesses on one account, and the lock needs 5, so it still takes
four accounts by tick 23. A lockout counts failures per account, and a spray spreads its failures thinly across all of them.
"""
figure = "lock_timeline"
figure_title = "How a lockout turns tick 13 into tick 33"
figure_speech = """
The program prints the same runs. [[slnc 400]] Wrong, locked, wrong, locked, wrong, and in at tick thirty three. [[slnc 500]]
The spray puts at most three wrong guesses on one account. [[slnc 300]] The lock needs five. [[slnc 300]] So the spray is not slowed at all.
"""
speech = """
The program prints the same runs. [[slnc 400]] Wrong, locked, wrong, locked, wrong, and in at tick thirty three. [[slnc 500]]
Then the spray. [[slnc 300]] At most three wrong guesses on one account, and the lock needs five. [[slnc 300]] So it still takes four accounts by tick twenty three. [[slnc 300]] The lockout never sees it.
"""
rows = { lock = "active ok" }
console = [
    ["THE DICTIONARY: the same 20 words on dana", "ok"],
    ["  ticks 0-4     guesses 1-5     WRONG_PASSWORD", "muted"],
