[[act]]
title = "The bill: what the defences cost"
summary = "An attacker can lock Dana out, locking per account and address avoids that but gives 10 addresses 50 guesses, and different error messages reveal which names exist."
detail = """
The defences have costs. First, a lockout per account can be turned against the customer: an attacker fails 5 times on Dana's account, and then Dana, logging in from her
own phone with the right password, gets the response LOCKED. That is a denial of service. Locking each account-and-address pair instead lets Dana in, but an attacker with
10 addresses then gets 10 times 5, which is 50, guesses instead of 5. Second, messages. If an unknown name gets "no account with that name" and a wrong password gets "wrong password",
the attacker can test which usernames exist. One message for both, "wrong username or password", hides it, at the price of a vaguer message for honest typing mistakes. The work
behind the message must match too: an unknown name costs the same 1 password hash as a known one, so the time a reply takes does not tell them apart either.
"""
figure = "the_bill"
figure_title = "What the defences cost"
figure_speech = """
Fifth demo: the bill. [[slnc 400]] Every defence has a cost. [[slnc 600]]
At the top, an attacker fails five times on Dana's account. [[slnc 300]] Then Dana logs in, with the right password. [[slnc 300]] With a lock per account: locked. [[slnc 300]] The owner is locked out. [[slnc 300]] That is a denial of service. [[slnc 300]] With a lock per pair of account and address, Dana is in. [[slnc 300]] But ten addresses then get fifty guesses. [[slnc 600]]
At the bottom, messages. [[slnc 300]] Different messages tell an outsider which names exist. [[slnc 300]] One message for both, and the same work behind it, hides that.
"""
speech = """
The output shows the lock first. [[slnc 300]] Per account: locked. [[slnc 300]] Per pair of account and address: Dana is in, but ten addresses get fifty guesses.
[[page]]
Then the messages. [[slnc 300]] A message for each case tells the attacker that Emil exists. [[slnc 300]] One message for both does not. [[slnc 300]] And each name costs one password hash.
"""
rows = { lock = "active amber", messages = "active amber" }
console = [
