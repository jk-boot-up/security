plugins {
    id 'java'
    id 'application'
}

group = 'com.jk.explore.security'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('org.springframework.security:spring-security-bom:7.1.1')
    implementation 'org.springframework.security:spring-security-crypto'
    // Argon2 and scrypt in Spring Security use Bouncy Castle's implementations.
    implementation 'org.bouncycastle:bcprov-jdk18on:1.86'
    // spring-security-crypto uses Spring's utility classes and its logging, which it leaves for the application to supply.
    implementation platform('org.springframework:spring-framework-bom:7.0.9')
    implementation 'org.springframework:spring-core'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.jk.explore.security.hashingspring.SpringHashingDemo'
}

test {
    useJUnitPlatform()
}
