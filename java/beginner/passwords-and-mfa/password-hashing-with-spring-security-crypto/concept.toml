    "A stored text made by any of the four algorithms is checked by its own encoder.",
    "An old `{bcrypt}` text still matches after the default changes, and is flagged for upgrade.",
    "An allow-list encoder refuses an algorithm that is not on its list.",
    "Nothing printed depends on a random salt or on timing.",
]

