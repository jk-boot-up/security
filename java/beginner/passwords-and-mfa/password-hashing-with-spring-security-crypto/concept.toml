[[scene]]
key = "01-poster"
kind = "poster"
title = "Password Hashing with Spring Security Crypto"
narration = """Hello, and welcome. [[slnc 400]] This video explains password hashing with Spring Security Crypto, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A shop should store a slow, salted hash of each password, never the password. [[slnc 300]] Spring Security Crypto is a library that does this for you, with the same two calls for every algorithm. [[slnc 600]] Think of a hotel where each lock carries a label saying which kind it is, so a lock can be replaced when its guest comes back. [[slnc 700]] You will see what the library stores, how a login is checked, how to move to a stronger algorithm, and two ways it can still go wrong."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online store, five customers.", "", "Ana and Ben both chose welcome1.", "Carol, Erin: weak passwords.", "Dave: a long random password.", "", "The shop uses a library to hash them."]
narration = """Here is the scenario. [[slnc 400]] An online store has five customers. [[slnc 500]] Ana and Ben chose welcome one. [[slnc 300]] Carol and Erin chose weak passwords. [[slnc 300]] Dave chose a long random one. [[slnc 600]] The shop uses Spring Security's password encoders to store them."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["Hash: a one-way fingerprint of the password", "Salt: random text mixed in, new every time", "Cost: how slow each hash is made", "Encoder: encode to store, matches to check", "Stored text: {id}, settings, salt and hash"]
narration = """Before the demos, the words. [[slnc 500]] A hash is a one way fingerprint of the password. [[slnc 400]] A salt is random text mixed in, new every time. [[slnc 400]] The cost says how slow each hash is. [[slnc 400]] An encoder has two calls: encode, and matches. [[slnc 400]] And the stored text holds an id, the settings, the salt and the hash."""

[[scene]]
key = "03-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "04-stored"
kind = "figure"
title = "What bcrypt stores for welcome1"
body = "stored_text"
narration = """One real example. [[slnc 400]] Before hashing, three inputs. [[slnc 300]] Ana's password, welcome one. [[slnc 300]] A salt: sixteen random bytes, written as twenty two characters. [[slnc 300]] And the cost, ten, which means two to the power ten, one thousand and twenty four rounds. [[slnc 600]] Bcrypt mixes them, slowly. [[slnc 600]] After hashing, the stored text is sixty eight characters, in five parts. [[slnc 300]] The id, bcrypt, in curly braces, picks the algorithm. [[slnc 300]] Then bcrypt's version, and the cost. [[slnc 300]] Then the salt, as it went in. [[slnc 300]] And last, thirty one characters of hash. [[slnc 600]] The salt and the cost are not secret. [[slnc 300]] A login needs them to make the same hash again."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Use a vetted library, not your own code", "Choose bcrypt or Argon2, measure the cost", "Build the encoder from an explicit list", "Upgrade at login with upgradeEncoding"]
narration = """So, how do you use it? [[slnc 400]] Use a vetted library, never your own hashing. [[slnc 500]] Choose a modern algorithm, bcrypt or Argon two, and measure the cost on your own servers. [[slnc 500]] Build the delegating encoder from an explicit list of the algorithms you accept. [[slnc 500]] And upgrade stored texts at login, with upgrade encoding."""

[[scene]]
key = "13-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "14-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Switch the default to scrypt", "and read the new prefix."]
narration = """That's password hashing with Spring Security Crypto. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Let a vetted library hash the passwords, choose the algorithms it accepts on purpose, and upgrade old hashes at login. [[slnc 500]] The source, notes, diagrams and an animated walkthrough are in the repository. [[slnc 500]] One exercise: switch the default algorithm to scrypt, run the migration again, and read the new prefix. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
The part of an online store that stores and checks customer passwords using Spring Security's password encoders: the
default delegating encoder, four algorithms, a migration to a new default, and an allow-list. It covers a stolen
table, a planted value, and the cost of the algorithms. It does not cover how passwords reach the server or how
logins are rate limited.
"""
assets = [
    "Customers' passwords, often reused elsewhere.",
    "The accounts table of stored texts.",
    "The login check, which spends time and memory on every attempt.",
    "The list of algorithms the shop agrees to accept.",
]
actors = [
    "Customers, with passwords of every strength.",
    "An attacker who steals a copy of the table and guesses offline.",
    "An attacker who can write to the table and plant a value.",
    "A developer who builds the encoder, and may choose the default list.",
]
boundaries = [
    "Application to database: where the stored text is written and read.",
    "Stored text to encoder: the name in braces decides which code runs, so it is an input from the table.",
    "Database to the outside: the line a thief crosses when the table is copied.",
]
assumptions = [
    "The typed password reaches the server over a protected channel.",
    "Only the application and administrators can write to the accounts table, except in the planted-value act, which supposes otherwise.",
    "Library versions are kept up to date, because the algorithms' recommended settings change.",
]
out_of_scope = [
    "Rate limiting and lockout: the next project covers online guessing.",
    "Password policy, breached-password checks and password managers.",
    "Spring Security's login filters.",
    "Hardware security modules and peppers.",
]
tests = [
    "`EncodersTest` checks every algorithm, the visible settings, the migration and the planted value.",
    "`AttackerTest` shows the weak passwords fall in 24 guesses and the strong one survives.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next project, password-attacks-and-defences, moves from offline guessing to online guessing: rate limits, lockouts and the cost of each.
"""

[[threat]]
id = "T1"
stride = "I"
threat = "The accounts table is stolen and the passwords are readable or cheap to guess"
where = "`PlainTextEncoder`, `FastSaltedSha256Encoder`"
control = "Use a slow, salted algorithm: bcrypt, PBKDF2, scrypt or Argon2"
residual = "Weak passwords on the attacker's list still fall"

[[threat]]
id = "T2"
stride = "E"
threat = "A value such as {noop}letmein is planted in the table and accepted"
where = "the default `DelegatingPasswordEncoder`"
control = "Build the delegating encoder from an explicit allow-list of ids"
residual = "Anyone with write access can still swap one valid hash for another; protect the table"

[[threat]]
id = "T3"
stride = "I"
threat = "Offline guessing against a stolen bcrypt or Argon2 hash"
where = "`BCryptPasswordEncoder`, `Argon2PasswordEncoder`"
control = "Cost: bcrypt cost 10 is 1,024 rounds; Argon2 uses 16 MiB, two passes"
residual = "Weak passwords fall; settings must be raised as hardware improves"

[[threat]]
id = "T4"
stride = "D"
threat = "Many simultaneous logins exhaust memory, because Argon2 needs 16 MiB each"
where = "`Argon2PasswordEncoder`"
control = "None here; the memory per login is shown"
residual = "Rate limits and a cap on concurrent hashing are needed"

[[threat]]
id = "T5"
stride = "D"
threat = "Wrong logins load the server, because every check is slow"
where = "`matches`"
control = "None here"
residual = "Rate limits and lockouts; the next project covers them"

[[threat]]
id = "T6"
stride = "T"
threat = "An old algorithm is left in use after the default changes"
where = "`upgradeEncoding`"
control = "The stored text is replaced after the next correct login"
residual = "Customers who never log in keep their old hash"

[[threat]]
id = "T7"
stride = "I"
threat = "The format of the stored text reveals the algorithm and settings"
where = "the accounts table"
control = "None needed: security does not depend on hiding the algorithm"
residual = "It tells an attacker how costly guessing is, which is why the cost must be high enough"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] Seven small classes. [[slnc 300]] Here is what each one does."""

[[class]]
name = "SpringHashingDemo"
what = "runs the six acts with the library's encoders"
[[class.part]]
title = "the default, and an allow-list"
code = """
PasswordEncoder factory = PasswordEncoderFactories.createDelegatingPasswordEncoder();
...
Map<String, PasswordEncoder> encoders = new HashMap<>();
encoders.put("bcrypt", new BCryptPasswordEncoder());
encoders.put(ARGON2_ID, Argon2PasswordEncoder.defaultsForSpringSecurity_v5_8());
return new DelegatingPasswordEncoder(idForEncode, encoders);
"""
speech = """Spring hashing demo runs the six acts. [[slnc 300]] One call to the factory gives the default delegating encoder. [[slnc 300]] The allow list builds one that knows only bcrypt and Argon two, and the id for encode says which one makes new stored texts."""

[[class]]
name = "BcryptSteps"
what = "takes a stored text apart and redoes a login by hand"
[[class.part]]
title = "the three steps of a login"
code = """
String[] f = stored.substring(id.length())
        .split("\\\\$");                 // "", "2a", "10", salt + hash
...
// steps 1 and 2: hash again with the stored cost and salt
String again = BCrypt.hashpw(typed,
        stored.version() + "%02d$".formatted(stored.cost()) + stored.salt());
...
// step 3: compare
return MessageDigest.isEqual(again.getBytes(StandardCharsets.UTF_8),
        stored.hash().getBytes(StandardCharsets.UTF_8));
"""
speech = """Bcrypt steps splits a stored text into its id, version, cost, salt and hash. [[slnc 300]] Then it hashes the typed password again, with the same cost and salt, and compares the two hashes. [[slnc 300]] A test proves it gives the library's own answer."""

[[class]]
name = "RepeatableSalts"
what = "salts from a fixed seed, for the demo only"
[[class.part]]
title = "the same salts on every run"
code = """
public class RepeatableSalts extends SecureRandom {
    private final Random seeded = new Random(2026);
...
        seeded.nextBytes(bytes);
"""
speech = """Repeatable salts gives the same salts on every run, so the values in this video never change. [[slnc 300]] Real code passes nothing, and gets unpredictable salts."""

[[class]]
name = "Attacker"
what = "tries a list of common passwords on each account"
[[class.part]]
title = "one guess at a time"
code = """
for (Map.Entry<String, String> account : stolen.entrySet()) {
    for (String word : wordlist) {
        guesses++;
...
        if (encoder.matches(word, account.getValue())) {
"""
speech = """The attacker tries each word in turn, on each account. [[slnc 300]] It uses the encoder's own matches call, so every guess pays the full cost."""

[[class]]
name = "FastSaltedSha256Encoder"
what = "a salt, but one fast step: the weak encoder"
[[class.part]]
title = "salt, then one quick hash"
code = """
random.nextBytes(salt);
...
return saltHex + "$" + hash(saltHex, rawPassword);
...
return HexFormat.of().formatHex(MessageDigest.getInstance("SHA-256")
"""
speech = """The fast encoder adds a random salt, then one S H A two fifty six hash. [[slnc 300]] Different values for equal passwords, but each guess is cheap."""

[[class]]
name = "PlainTextEncoder"
what = "stores the password as it is: the worst encoder"
[[class.part]]
title = "no hashing at all"
code = """
public String encode(CharSequence rawPassword) {
    return rawPassword.toString();
"""
speech = """The plain text encoder returns the password itself. [[slnc 300]] It is here only to show the problem."""

[[class]]
name = "Customers"
what = "five customers and the eight-word list"
[[class.part]]
title = "the passwords and the guesses"
code = """
PASSWORDS.put("ana", "welcome1");
PASSWORDS.put("ben", "welcome1");
...
"123456", "password", "welcome1", "sunshine",
"qwerty", "letmein", "iloveyou", "admin");
"""
speech = """And customers holds the five passwords, and the attacker's eight common guesses."""

