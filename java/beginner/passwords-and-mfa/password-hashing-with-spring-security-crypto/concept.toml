    ["  version  $2a$      bcrypt's version", "muted"],
    ["  cost     10        2^10 = 1024 rounds", "muted"],
    ["  salt     55bclqVAnRI5wEVXXI1NJO", "muted"],
    ["  hash     FXF81EeN1M0sYeZViEoifJUe8ZPSJfy", "muted"],
