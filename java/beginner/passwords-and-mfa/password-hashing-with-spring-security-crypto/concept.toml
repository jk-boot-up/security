    ["  each one matches welcome1: true, true, true, true", "muted"],
]

[[act]]
title = "The same attack, at two costs"
summary = "Eight common passwords tried on each of five accounts: 24 guesses crack 4 of 5 at cost 4 and at cost 10, but each guess at cost 10 is 64 times the work."
detail = """
The attacker tries the eight common passwords in turn on each account, and stops at the first one that matches: 3 guesses for Ana and Ben, 4 for Carol, 6 for Erin and all 8 for Dave,
24 in all. At bcrypt cost 4 each guess is 16 rounds; at cost 10 it is 1024 rounds. Both lose the same four accounts, but each guess at cost 10 is 64 times the work.
That is what makes guessing slow. Dave survives only because his password is not on the list.
"""
figure = "attack_costs"
figure_title = "The same attack, at two costs"
figure_speech = """
Now an attacker tries eight common passwords, in turn, on each account. [[slnc 600]]
Ana's and Ben's password is third on the list, so three guesses each. [[slnc 300]] Carol's is fourth. [[slnc 300]] Erin's is sixth. [[slnc 300]] Dave's is not on the list, so all eight guesses fail. [[slnc 300]] Twenty four guesses in all, and four accounts fall. [[slnc 600]]
The result is the same at cost four, and at cost ten. [[slnc 300]] Cost four is sixteen rounds. [[slnc 300]] Cost ten is one thousand and twenty four. [[slnc 300]] Sixty four times the work. [[slnc 600]]
Slow helps. [[slnc 300]] But a weak password still falls.
"""
speech = """
The output: the guesses per account, then the result at each cost. [[slnc 300]] The same four accounts fall, but at cost ten each guess is sixty four times the work.
"""
rows = { algos = "active amber" }
console = [
    ["THE ATTACK", "amber"],
    ["  8 common passwords, tried in turn on each of 5 accounts", "muted"],
    ["  guesses: ana 3, ben 3, carol 4, dave 8, erin 6", "muted"],
    ["THE RESULT", "amber"],
    ["  cost 4:  cracked 4 of 5 in 24 guesses, 16 rounds each", "muted"],
    ["  cost 10: cracked 4 of 5 in 24 guesses, 1024 rounds each", "muted"],
    ["  each guess at cost 10 is 64 times the work of cost 4", "muted"],
