    ["  {bcrypt}$2a$10$", "muted"],
    ["  55bclqVAnRI5wEVXXI1NJOFXF81EeN1M0sYeZViEoifJUe8ZPSJfy", "muted"],
    ["THE PARTS", "amber"],
