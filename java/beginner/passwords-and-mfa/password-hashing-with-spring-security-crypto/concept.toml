[[act]]
title = "Moving to a stronger algorithm without asking anyone"
summary = "With Argon2 as the new default, Erin's old {bcrypt} text still matches, upgradeEncoding says it is due, and after her login it is stored again as {argon2@SpringSecurity_v5_8}."
detail = """
Before the login, Erin's stored text begins `{bcrypt}$2a$10$`, and the shop has switched its default to Argon2. Erin logs in with letmein: the id `{bcrypt}` picks bcrypt,
so matches gives true. `upgradeEncoding` answers true, because `{bcrypt}` is not the default. After the login the shop stores her password again: the new text
begins `{argon2@SpringSecurity_v5_8}` and `$argon2id$v=19$m=16384,t=2,p=1$`, and `upgradeEncoding` now says false. Nobody had to reset a password.
"""
figure = "migration"
figure_title = "An upgrade at login"
figure_speech = """
Now the shop moves to a stronger algorithm. [[slnc 400]] Before the login, Erin's stored text begins with bcrypt, in curly braces. [[slnc 300]] And the shop's default is now Argon two. [[slnc 600]]
Erin logs in with her password. [[slnc 300]] The id bcrypt picks the old algorithm, so her password still checks. [[slnc 300]] True. [[slnc 600]]
Then the shop asks the encoder: should this text be upgraded? [[slnc 300]] Yes, because bcrypt is not the default. [[slnc 600]]
The shop has the right password in hand, so it stores it again. [[slnc 300]] After the login, the text begins with Argon two, followed by Argon two's settings. [[slnc 300]] And the next check says, nothing to upgrade. [[slnc 600]]
Nobody had to reset a password. [[slnc 300]] Customers who come back are upgraded, one by one.
"""
speech = """
The output, in the same three parts: before the login, the login itself, and after it, the new Argon two text, with nothing left to upgrade.
"""
rows = { upgrade = "active ok", delegating = "active ok" }
console = [
    ["BEFORE THE LOGIN", "amber"],
    ["  erin's stored text  {bcrypt}$2a$10$...", "muted"],
    ["  the shop's default  now argon2", "muted"],
    ["THE LOGIN: ERIN TYPES letmein", "amber"],
    ["  the id {bcrypt} picks bcrypt; matches: true", "muted"],
    ["  upgradeEncoding: true, {bcrypt} is not the default", "muted"],
    ["AFTER THE LOGIN: STORED AGAIN", "amber"],
    ["  {argon2@SpringSecurity_v5_8}", "muted"],
    ["  $argon2id$v=19$m=16384,t=2,p=1$...", "muted"],
    ["  upgradeEncoding now: false", "muted"],
]

[[act]]
title = "The bill: an open list, and memory"
summary = "The default encoder accepts a planted {noop}letmein, an allow-list refuses it, and one Argon2 hash uses 16 MiB, so 100 logins at once need 1,600 MiB."
detail = """
Two costs. First, the default delegating encoder knows many old forms, including `{noop}`, which means no hashing. Someone who can write to the accounts table plants `{noop}letmein`
in Erin's row, and the default encoder says letmein matches: true. A delegating encoder built with an explicit list, bcrypt and Argon2 only, refuses it: no encoder is mapped for that id.
Second, memory. One Argon2 hash uses 16384 KiB, which is 16 MiB, and 100 logins at once need 1,600 MiB. That memory is what makes it hard to speed up, and the shop pays for it.
"""
figure = "the_bill"
figure_title = "The bill: a planted value, and memory"
figure_speech = """
Last, the bill: two costs. [[slnc 600]]
First, the attack. [[slnc 300]] Someone who can write to the accounts table puts noop, in curly braces, then letmein, in Erin's row. [[slnc 300]] Noop means no hashing at all. [[slnc 600]]
The default encoder knows noop, so letmein matches. [[slnc 300]] True. [[slnc 300]] The attacker is in. [[slnc 600]]
An encoder built from an allow list, bcrypt and Argon two only, refuses it. [[slnc 300]] No encoder is mapped for that id. [[slnc 600]]
Second, memory. [[slnc 300]] One Argon two hash uses sixteen mebibytes. [[slnc 300]] A hundred logins at once need sixteen hundred. [[slnc 300]] That memory makes Argon two hard to speed up, and the shop pays for it.
"""
speech = """
In the output: the default encoder says true, the allow list refuses, and the memory adds up to sixteen hundred mebibytes.
"""
rows = { delegating = "active amber", algos = "active amber" }
console = [
    ["THE ATTACK: A VALUE WRITTEN INTO THE TABLE", "amber"],
    ["  erin's stored text  {noop}letmein", "muted"],
    ["THE DEFAULT ENCODER", "amber"],
    ["  letmein matches: true  <- NO HASHING AT ALL", "bad"],
    ["THE ALLOW-LIST ENCODER: bcrypt and argon2 only", "amber"],
    ["  refused: no encoder mapped for the id noop", "muted"],
    ["THE MEMORY", "amber"],
    ["  one argon2 hash     16384 KiB = 16 MiB", "muted"],
    ["  100 logins at once  1600 MiB  <- MEMORY IS THE PRICE", "bad"],
]

