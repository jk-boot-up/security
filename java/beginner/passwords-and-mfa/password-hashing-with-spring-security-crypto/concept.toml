[[act]]
title = "Four algorithms, one interface"
summary = "BCrypt, PBKDF2, scrypt and Argon2 each encode welcome1 and match it; bcrypt, scrypt and Argon2 write their settings at the front of the stored text."
detail = """
Four algorithms sit behind the same interface. Before hashing, the password is welcome1. After hashing, bcrypt gives 60 characters beginning `$2a$10$`;
PBKDF2 gives 96 characters, the salt and the hash in hex, with its settings kept in the code; scrypt gives 77 beginning `$100801$`, its CPU cost, memory and lanes packed together;
and Argon2 gives 97 beginning `$argon2id$v=19$m=16384,t=2,p=1$`: version 19, 16384 KiB of memory, 2 passes and 1 lane. Each one matches welcome1,
and swapping one for another is a change of one line.
"""
figure = "four_algorithms"
figure_title = "Four algorithms, one interface"
figure_speech = """
The library has four slow algorithms. [[slnc 300]] Bcrypt, P B K D F two, scrypt, and Argon two. [[slnc 600]]
Before hashing, the same password goes into each: welcome one. [[slnc 600]]
After hashing, bcrypt writes its cost, ten, at the front. [[slnc 300]] P B K D F two keeps its settings in the code. [[slnc 300]] Scrypt packs them into one number. [[slnc 300]] And Argon two writes them out in words: sixteen thousand three hundred and eighty four kibibytes of memory, two passes, and one lane. [[slnc 600]]
All four use the same two calls, encode and matches. [[slnc 300]] So swapping one for another is a one line change.
"""
speech = """
The output: four stored texts, each with its own settings, and all four match welcome one.
"""
rows = { algos = "active ok" }
console = [
    ["BEFORE HASHING", "amber"],
    ["  the password  welcome1", "muted"],
    ["AFTER HASHING", "amber"],
    ["  bcrypt  60 characters  $2a$10$", "muted"],
    ["  pbkdf2  96 characters  salt + hash in hex", "muted"],
    ["  scrypt  77 characters  $100801$", "muted"],
    ["  argon2  97 characters  $argon2id$v=19$m=16384,t=2,p=1$", "muted"],
