[project]
slug = "password-hashing-with-spring-security-crypto"
module = "passwords-and-mfa"
title = "Password Hashing with Spring Security Crypto"
short_title = "Password Hashing with Spring Security Crypto"
package = "hashingspring"
main_class = "SpringHashingDemo"
tagline = "bcrypt, scrypt and Argon2 in one call"
bold = "Spring Security's password encoders store a slow, salted hash in one call, tag it with the algorithm's name, and let a shop move to a stronger algorithm without asking customers, as long as the list of algorithms it accepts is chosen on purpose."
domain = "an online store"
domain_note = ""
youtube_description = """Password hashing with Spring Security Crypto, in Java: the library's password encoders turn a password into a slow, salted hash in one call, tag the stored text with the algorithm's name, and offer bcrypt, PBKDF2, scrypt and Argon2 behind one interface. Explained with an online store's customer accounts, like a hotel that replaces its door locks guest by guest, without closing the hotel. We see the two deprecated encoders, the delegating encoder, four algorithms side by side, the same attack at two costs, a migration from bcrypt to Argon2 at login, and finish with the bill: an open algorithm list lets someone plant a plain-text password, and Argon2 costs memory."""
thumb_lines = ["PASSWORD HASHING", "SPRING CRYPTO"]
thumb_code = "{argon2}$..."
youtube_title = "Password Hashing with Spring Security Crypto"
youtube_tags = ["spring security", "password encoder", "bcrypt", "argon2", "scrypt", "password hashing", "java", "cybersecurity for beginners"]

[readme]
intro = """
The plain version of this lesson built a slow, salted hash by hand, so the ideas were visible. This
project does what real applications do: it asks a library. Spring Security's `spring-security-crypto`
module gives every algorithm the same small interface, `PasswordEncoder`, with `encode` to make the
stored text and `matches` to check a login. Salts are added for you. The `DelegatingPasswordEncoder` writes
the algorithm's name in front of the stored text, in curly braces, such as `{bcrypt}`, so it can
check old hashes and make new ones with something stronger, and `upgradeEncoding` tells the shop when a
stored text is due to be replaced.

The same five customers, the same wordlist and the same attack as in the plain project make the two easy to
compare. Six acts show the encoders, the algorithms, the cost, a migration, and what it all costs.
"""
analogy = """
Think of a hotel that wants better locks. It cannot close the hotel and change every lock at once.
Instead, each lock carries a small label saying which kind it is. When a guest comes back, the
front desk checks the old lock as usual, then quietly fits a new one for the next visit.
The label is the `{bcrypt}` in front of the stored text. And a hotel that accepts any label a stranger
writes is asking for trouble, which is the lesson of the last act.
"""
scenario = """
The online store from the plain project, with its five customers: Ana and Ben (both welcome1),
Carol, Erin and Dave. The shop now uses Spring Security's encoders. It starts with the two the library
warns against, moves to the delegating encoder, compares four algorithms, attacks bcrypt at two
costs, switches its default from bcrypt to Argon2 without asking anyone, and then looks at what that
cost.
"""
costs = [
    "**Argon2 costs memory.** It is hard to speed up with special hardware because each hash needs a block of memory. The shop pays that memory on every login, so many logins at once need a lot.",
    "**An open list of algorithms is a risk.** The default delegating encoder accepts old and plain forms, including `{noop}`, which means no hashing at all. Anyone who can write to the table can plant one.",
    "**Another dependency.** Argon2 and scrypt need Bouncy Castle, and the crypto module expects the application to bring Spring's core and logging.",
    "**The same limits as before.** A strong algorithm cannot rescue a weak password, and every login still pays for the slow hash.",
]
too_much = """
For a real application, this is the minimum. The only time to write the hashing yourself is to teach it, which is why the plain
project exists. If a framework other than Spring is in use, its own password library does the same job, and
the advice is the same: use a vetted library, not your own code.
"""
met_before = [
    "`PasswordEncoder` beans in Spring applications, and `{bcrypt}` in their user tables.",
    "The `$2a$10$` start of bcrypt hashes in many databases.",
    "`$argon2id$v=19$m=16384,t=2,p=1$...`, the format that shows Argon2's settings.",
    "Migration notes that say \"hashes are upgraded the next time a user logs in\".",
]
where = """
This project is the second one in [passwords-and-mfa](..), the library version of [password-hashing](../password-hashing).
"""
twin = """
The costs shown are the library's current defaults for each algorithm, taken from the stored text where the
algorithm writes them down (bcrypt's cost, Argon2's memory, passes and parallelism). Guidance changes over time, so
check the current recommendation before copying any setting. The attack is the same eight-word loop as in the plain project,
counted in guesses. Bcrypt cost 10 is used because it is the library default, and cost 4 is the lowest bcrypt allows,
used only to show the difference.
"""
test_note = "Every line the demo prints is checked against `docs/expected-output.txt`. Nothing printed depends on a random salt or on timing, so every run gives the same result."

[[act]]
title = "Two the library marks as deprecated"
summary = "NoOpPasswordEncoder stores the password itself; the SHA-256 encoder adds a salt but costs one cheap step per guess, so 24 guesses crack 4 of 5."
detail = """
The library still contains the two weakest choices, and marks them deprecated. NoOpPasswordEncoder stores
the password as it is: ana's row says welcome1. MessageDigestPasswordEncoder is a plain SHA-256 hash with
a salt, so Ana's and Ben's stored values differ. But it is one cheap step per guess, so the same eight
common passwords crack 4 of the 5 accounts in 24 guesses. Both exist for old systems, not for new ones.
"""
speech = """
First demo: two the library marks as deprecated. [[slnc 400]] The library still contains the two weakest choices, and labels them as old. [[slnc 600]]
The first one stores the password as it is. [[slnc 300]] Ana's row says welcome one. [[slnc 600]]
The second is a plain SHA two fifty six hash, with a salt. [[slnc 300]] Ana's and Ben's stored values differ. [[slnc 300]] But each guess costs one cheap step. [[slnc 300]] So the attacker's list of eight common passwords cracks four of the five accounts, in twenty four guesses. [[slnc 600]]
Both exist for old systems. [[slnc 300]] Not for new ones.
"""
rows = { encoder = "active wrong" }
console = [
    ["NoOpPasswordEncoder stores ana's password as: welcome1  <- THE PASSWORD ITSELF", "bad"],
    ["MessageDigestPasswordEncoder, SHA-256 with a salt: same value for ana and ben: false", "muted"],
    ["but it is one cheap step per guess: 24 guesses crack 4 of 5  <- FAST", "bad"],
]

[[act]]
title = "One call: the delegating encoder"
summary = "The default encoder writes {bcrypt} in front of a 68-character stored text, adds a salt for you, and checks logins with matches."
detail = """
`PasswordEncoderFactories.createDelegatingPasswordEncoder()` gives an encoder that is ready to use. Ana's stored
text begins `{bcrypt}` and is 68 characters long. Encoding welcome1 twice gives two different texts, because a new
salt is added each time, with no code from the shop. `matches` checks a login: the right password gives true,
a wrong one false. The name in front is how the encoder knows which algorithm to use when it checks the text again.
"""
speech = """
Second demo: one call. [[slnc 400]] The library gives an encoder that is ready to use. [[slnc 300]] It is called the delegating encoder. [[slnc 600]]
Ana's stored text begins with the word bcrypt, in curly braces, and is sixty eight characters long. [[slnc 600]]
Encode the same password twice, and the two texts differ. [[slnc 300]] A salt was added each time, with no code from the shop. [[slnc 600]]
A login is checked with one call, called matches. [[slnc 300]] The right password gives true. [[slnc 300]] A wrong one gives false. [[slnc 600]]
The name in front is how the encoder knows which method to use, when it checks the text again.
"""
rows = { delegating = "active ok" }
console = [
    ["ana's stored text begins {bcrypt} and is 68 characters long", "muted"],
    ["same password, same stored text: false  <- A SALT IS ADDED FOR YOU", "ok"],
    ["ana logs in with the right password: true", "ok"],
    ["ana logs in with a wrong one: false", "ok"],
]

[[act]]
title = "Four algorithms, one interface"
summary = "BCrypt, PBKDF2, scrypt and Argon2 each encode and match; the stored text of bcrypt shows its cost, and Argon2's shows its memory, passes and parallelism."
detail = """
Four algorithms sit behind the same interface. BCrypt's stored text begins $2a$10$: cost 10, which is
1024 rounds. PBKDF2 gives a text of 96 characters, and scrypt one of 77. Argon2 writes its settings
in the text: m=16384, t=2 and p=1, which are 16384 KiB of memory, 2 passes and 1 lane of parallelism.
Each one checks its own hash and rejects a wrong password, and swapping one for another is a change
of one line.
"""
speech = """
Third demo: four algorithms, one interface. [[slnc 400]] Bcrypt, P B K D F two, scrypt, and Argon two. [[slnc 600]]
Bcrypt writes its cost into the stored text. [[slnc 300]] Cost ten means one thousand and twenty four rounds. [[slnc 600]]
P B K D F two and scrypt give longer texts, and each checks its own hash. [[slnc 600]]
Argon two writes its settings in the text. [[slnc 300]] Sixteen thousand three hundred and eighty four kilobytes of memory. [[slnc 300]] Two passes. [[slnc 300]] And one lane. [[slnc 600]]
All four check a right password, and reject a wrong one. [[slnc 300]] And swapping one for another is a change of a single line.
"""
rows = { algos = "active ok" }
console = [
    ["bcrypt:  cost 10 (1024 rounds), text begins $2a$10$", "ok"],
    ["pbkdf2:  96 characters, matches: true", "ok"],
    ["scrypt:  77 characters, matches: true", "ok"],
    ["argon2:  settings m=16384,t=2,p=1, matches: true", "ok"],
]

[[act]]
title = "The same attack, at two costs"
summary = "Bcrypt at cost 4 and at cost 10 both lose 4 of 5 accounts in 24 guesses, but each guess at cost 10 is 64 times the work."
detail = """
The attacker runs the same eight-word list against bcrypt at the lowest cost, 4, and at the library's default,
10. Both lose the same four accounts after the same 24 guesses. The difference is the work behind each guess:
bcrypt's work doubles with every step of cost, so cost 10 is 64 times the work of cost 4. That is what
makes guessing slow. And as in the plain project, Dave survives only because his password is not on the list.
"""
speech = """
Fourth demo: the same attack, at two costs. [[slnc 400]] The attacker uses the same list of eight common passwords. [[slnc 300]] First against bcrypt at the lowest cost, four. [[slnc 300]] Then at the library's default, ten. [[slnc 600]]
Both lose the same four accounts, after the same twenty four guesses. [[slnc 600]]
The difference is the work behind each guess. [[slnc 300]] Bcrypt's work doubles with every step of cost. [[slnc 300]] So cost ten is sixty four times the work of cost four. [[slnc 600]]
And as before, Dave survives only because his password is not on the list. [[slnc 300]] Slow helps. [[slnc 300]] A weak password still falls.
"""
rows = { algos = "active amber" }
console = [
    ["bcrypt cost 4:  cracked 4 of 5 in 24 guesses", "bad"],
    ["bcrypt cost 10: cracked 4 of 5 in 24 guesses", "bad"],
    ["each guess at cost 10 is 64 times the work of cost 4", "ok"],
    ["cracked: ana, ben, carol, erin  <- COST HELPS, WEAK PASSWORDS STILL FALL", "amber"],
]

[[act]]
title = "Moving to a stronger algorithm without asking anyone"
summary = "With Argon2 as the new default, Erin's old {bcrypt} text still checks, upgradeEncoding says it is due, and after her login it is stored as {argon2}."
detail = """
Erin's stored text begins `{bcrypt}`. The shop switches its default algorithm to Argon2. Erin logs in, and the
old text still checks: matches gives true, because the name in front selects bcrypt for it. The encoder's
`upgradeEncoding` answers true, because the text is not in the current default. The shop stores Erin's password again;
the new text begins `{argon2@SpringSecurity_v5_8}`, and the next check of `upgradeEncoding` says false. Nobody
had to reset a password, and only active customers have been upgraded.
"""
speech = """
Fifth demo: a move to a stronger algorithm. [[slnc 400]] Erin's stored text begins with bcrypt, in curly braces. [[slnc 300]] The shop switches its default to Argon two. [[slnc 600]]
Erin logs in. [[slnc 300]] The old text still checks, because the name in front picks bcrypt for it. [[slnc 600]]
The encoder is then asked, should this text be upgraded? [[slnc 300]] It says yes. [[slnc 300]] The text is not in the current default. [[slnc 600]]
The shop stores Erin's password again. [[slnc 300]] The new text begins with Argon two. [[slnc 300]] And the next check says, nothing to upgrade. [[slnc 600]]
Nobody had to reset a password. [[slnc 300]] And only the customers who came back were upgraded.
"""
rows = { upgrade = "active ok", delegating = "active ok" }
console = [
    ["erin's stored text begins {bcrypt}", "muted"],
    ["the shop switches its default to argon2; erin logs in: true", "ok"],
    ["the encoder says the stored text should be upgraded: true", "ok"],
    ["after login it is stored again, beginning {argon2@SpringSecurity_v5_8}", "ok"],
    ["upgrade needed now: false", "ok"],
]

[[act]]
title = "The bill: an open list, and memory"
summary = "The default encoder accepts a planted {noop} value, an allow-list refuses it, and one Argon2 hash uses 16 MiB, so 100 logins at once need 1,600 MiB."
detail = """
Two costs. First, the default delegating encoder knows many old forms, including `{noop}`, which means no hashing.
It says `{noop}letmein` matches the password letmein. Anyone who can write to the accounts table could plant such a value for
an account they control. A delegating encoder built with an explicit list, bcrypt and Argon2 only, refuses
it: no encoder is mapped for that name. Second, memory. One Argon2 hash uses 16384 KiB, which is 16 MiB, and
100 logins at once need 1,600 MiB. That memory is what makes it hard to speed up, and the shop pays for it.
"""
speech = """
Sixth demo: the bill. [[slnc 400]] There are two costs. [[slnc 600]]
First, the default delegating encoder knows many old forms, including one called noop, which means no hashing at all. [[slnc 300]] It says that noop letmein matches the password letmein. [[slnc 300]] Anyone who can write to the accounts table could plant such a value. [[slnc 600]]
An encoder built with an explicit list, bcrypt and Argon two only, refuses it. [[slnc 300]] No encoder is mapped for that name. [[slnc 600]]
Second, memory. [[slnc 300]] One Argon two hash uses sixteen mebibytes. [[slnc 300]] A hundred logins at once need sixteen hundred. [[slnc 300]] That memory is what makes it hard to speed up. [[slnc 300]] And the shop pays for it.
"""
rows = { delegating = "active amber", algos = "active amber" }
console = [
    ["the default delegating encoder accepts {noop}letmein for letmein: true", "bad"],
    ["  <- A WRITER TO THE TABLE CAN PLANT IT", "bad"],
    ["an allow-list encoder refuses {noop}: no encoder mapped for that id", "ok"],
    ["one argon2 hash uses 16384 KiB, 16 MiB, of memory", "amber"],
    ["100 logins at once need 1600 MiB  <- MEMORY IS THE PRICE", "amber"],
]

