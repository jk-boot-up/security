[docs.dependencies]
intro = """
This project uses one Spring module, plus the small libraries it expects the application to supply.
"""
what = [
    ["spring-security-crypto", "the part of Spring Security that holds the password encoders: bcrypt, PBKDF2, scrypt and Argon2, the delegating encoder, and the deprecated ones. It has no web or database parts, so it can be used without the rest of Spring Security."],
    ["Bouncy Castle", "an open-source cryptography library. Spring's Argon2 and scrypt encoders use its implementations, so the library has to be on the class path for those two."],
    ["spring-core", "Spring's utility classes and its logging. The crypto module uses them but leaves it to the application to include them."],
]
why = """
The plain project builds a slow, salted hash by hand so the ideas are visible. Real applications should not write
their own: a library has been reviewed by many people, supports several algorithms, and keeps the stored format and the upgrade path in one place. This
project shows the library doing what the plain project did by hand.
"""
install_note = "Only a JDK. Gradle downloads the rest, and the versions are pinned:"
versions = [
    ["spring-security-crypto", "7.1.1"],
    ["spring-core", "7.0.9"],
    ["Bouncy Castle (bcprov-jdk18on)", "1.86"],
    ["JUnit", "5.10.2"],
]
costs = [
    "Argon2 and scrypt cannot be used without Bouncy Castle, which is a large library for two encoders.",
