objectives = [
    "name the three things a Spring PasswordEncoder gives you that the plain project wrote by hand",
    "explain what the {bcrypt} in front of a stored text is for",
    "describe how a shop moves to a stronger algorithm without a password reset",
    "explain why an allow-list of algorithms is safer than the default list",
]
walkthrough = """
Run the plain project and this one side by side and compare act four with act four: the same twenty four guesses, the
same four accounts. Then read act five slowly: ask the group what happens to a customer who never comes back, and
what the shop could do about it. In act six, ask who can write to the accounts table in a real shop, and what else
they could do if they can.
"""
exercises = [
    "Change the default to scrypt and run act five again. What does the new prefix look like?",
    "Add a `{pbkdf2}` entry to the allow-list and make the shop upgrade Dave's account from it.",
    "Increase bcrypt's cost to 12 in act four. How much more work is that, compared with cost 10?",
    "Write a test that fails if the default delegating encoder is used anywhere in the demo's code.",
]

[docs.explained]
sentence = """
Spring Security's password encoders give every algorithm the same two calls, add a salt for you, write the algorithm's name in front of the stored text so old texts can still be checked and upgraded, and are only safe when the list of algorithms they accept is chosen on purpose.
"""
verdict = """
Use a vetted library, never your own hashing. Take the encoder for a modern algorithm, bcrypt or Argon2, with
a cost you have measured, build the delegating encoder from an explicit list, and upgrade stored texts at login with
`upgradeEncoding`. Remember the limits: a strong algorithm does not save a weak password, and every login pays
its price in time, and for Argon2 in memory.
"""
recognise = [
    "A `PasswordEncoder` bean in a configuration class.",
    "Stored passwords that start with `{bcrypt}` or `$argon2id$`.",
    "A call to `upgradeEncoding` after a successful login.",
    "A `DelegatingPasswordEncoder` built with a map of encoders.",
]

[spec]
purpose = """
Teach how a library stores passwords safely by repeating the plain password-hashing story with Spring Security's password encoders, and by showing a migration and the costs of the choices.
"""
nongoals = [
    "Spring Security's login filters and sessions: the identity module covers them.",
    "Benchmarking: costs are shown from the stored text and from arithmetic, not from timing.",
    "Choosing parameters for a real system.",
]
problem = """
Learners know passwords should be hashed with a library but not what the library does for them, or how the list of accepted algorithms becomes a risk.
"""
roles = [["The encoders", "Spring's `PasswordEncoder` implementations"], ["The attacker", "`Attacker`"], ["The customers and wordlist", "`Customers`"], ["Entry point and helpers", "`SpringHashingDemo`"]]
requirements = [
