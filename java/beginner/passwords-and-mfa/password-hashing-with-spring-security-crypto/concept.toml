[[scene]]
key = "01-poster"
kind = "poster"
title = "Password Hashing with Spring Security Crypto"
narration = """Hello, and welcome. [[slnc 400]] This video explains password hashing with Spring Security Crypto, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A shop should store a slow, salted hash of each password, never the password. [[slnc 300]] Spring Security Crypto is a library that does this for you. [[slnc 300]] It gives every algorithm the same two calls: one to make the stored text, and one to check a login. [[slnc 600]] Think of a hotel that wants better locks. [[slnc 300]] It cannot close the hotel to change every lock at once. [[slnc 300]] So each lock carries a small label that says which kind it is. [[slnc 300]] When a guest comes back, the desk checks the old lock as usual, and then fits a new one for the next visit. [[slnc 700]] In this video, the domain is an online store, with the same five customers as in the plain version. [[slnc 500]] By the end, you will hear what the library does for you. [[slnc 300]] How to move to a stronger algorithm without asking anyone. [[slnc 300]] And two ways it can still go wrong."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["The same online store, five customers.", "", "Ana and Ben both chose welcome1.", "Carol, Erin: weak passwords.", "Dave: a long random password.", "", "Now the shop uses a library."]
narration = """Here is the scenario. [[slnc 400]] It is the same online store as in the plain version, with the same five customers. [[slnc 500]] Ana and Ben chose welcome one. [[slnc 300]] Carol and Erin chose weak passwords. [[slnc 300]] Dave chose a long random one. [[slnc 600]] This time, the shop uses Spring Security's password encoders, so you can compare the two versions step by step."""

[[scene]]
key = "03-interface"
kind = "bullets"
title = "The Interface"
body = ["encode(password)  ->  stored text", "matches(password, stored)  ->  true or false", "upgradeEncoding(stored)  ->  true or false", "", "Salt: added for you", "Name in braces: picks the algorithm"]
narration = """Before the demos, the interface. [[slnc 500]] Encode takes a password, and gives the stored text. [[slnc 500]] Matches takes a typed password and a stored text, and says true or false. [[slnc 500]] Upgrade encoding takes a stored text, and says whether it is due to be replaced. [[slnc 600]] The salt is added for you. [[slnc 300]] And the name in curly braces, at the front of the stored text, picks the algorithm."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "10-mapping"
kind = "bullets"
title = "Plain Version, Library Version"
body = ["Pbkdf2Hasher  ->  Pbkdf2PasswordEncoder", "SaltSource  ->  inside the encoder", "Stored format with rounds  ->  {id}text", "needsUpgrade  ->  upgradeEncoding", "Counting work  ->  cost in the stored text"]
narration = """Let's match the two versions. [[slnc 400]] The PBKDF two hasher is now one of the library's encoders. [[slnc 500]] The salt source is inside the encoder, so the shop never sees a salt. [[slnc 500]] The stored format with its rounds is now the name in curly braces, followed by the text. [[slnc 500]] The needs upgrade check is upgrade encoding. [[slnc 500]] And counting steps of work is replaced by the cost that the stored text writes down."""

[[scene]]
key = "11-roles"
kind = "bullets"
title = "Who Does What"
body = ["PasswordEncoder: the interface", "DelegatingPasswordEncoder: chooses by name", "BCrypt, Argon2 and the others: the work", "Attacker: tries a wordlist", "Customers: five people, eight guesses"]
narration = """Here is who does what in the code. [[slnc 400]] The password encoder is the interface every algorithm shares. [[slnc 500]] The delegating encoder chooses an algorithm by the name in front of the stored text. [[slnc 500]] Bcrypt, Argon two, and the others do the slow work. [[slnc 500]] The attacker tries a list of common passwords. [[slnc 300]] And the customers class holds the five people, and the eight guesses."""

[[scene]]
key = "12-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["A PasswordEncoder bean", "{bcrypt} in a user table", "$argon2id$v=19$m=16384,t=2,p=1", "Hashes upgraded at next login"]
narration = """You have probably met this already. [[slnc 400]] A password encoder bean is in almost every Spring application. [[slnc 500]] The word bcrypt in curly braces, at the start of a stored password, is a Spring convention. [[slnc 500]] And a stored text that starts with dollar argon two id, and then lists its memory, passes, and lanes, is Argon two writing down its own settings. [[slnc 500]] Migration notes that say hashes are upgraded the next time a user logs in, describe the fifth demo."""

[[scene]]
key = "13-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Use a vetted library, not your own code", "Choose bcrypt or Argon2, measure the cost", "Build the encoder from an explicit list", "Upgrade at login with upgradeEncoding"]
narration = """So, how do you use it? [[slnc 400]] Use a vetted library, never your own hashing. [[slnc 500]] Choose a modern algorithm, bcrypt or Argon two, and measure the cost on your own servers. [[slnc 500]] Build the delegating encoder from an explicit list of the algorithms you accept. [[slnc 500]] And upgrade stored texts at login, with upgrade encoding."""

[[scene]]
key = "14-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Switch the default to scrypt", "and read the new prefix."]
narration = """That's password hashing with Spring Security Crypto. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Let a vetted library hash the passwords, choose the algorithms it accepts on purpose, and upgrade old hashes at login. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine, with nothing installed except a Java development kit. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Switch the default algorithm to scrypt, run the migration again, and read the new prefix. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
The part of an online store that stores and checks customer passwords using Spring Security's password encoders: the
default delegating encoder, four algorithms, a migration to a new default, and an allow-list. It covers a stolen
table, a planted value, and the cost of the algorithms. It does not cover how passwords reach the server or how
logins are rate limited.
"""
assets = [
    "Customers' passwords, often reused elsewhere.",
    "The accounts table of stored texts.",
    "The login check, which spends time and memory on every attempt.",
    "The list of algorithms the shop agrees to accept.",
]
actors = [
    "Customers, with passwords of every strength.",
    "An attacker who steals a copy of the table and guesses offline.",
    "An attacker who can write to the table and plant a value.",
    "A developer who builds the encoder, and may choose the default list.",
]
boundaries = [
    "Application to database: where the stored text is written and read.",
    "Stored text to encoder: the name in braces decides which code runs, so it is an input from the table.",
    "Database to the outside: the line a thief crosses when the table is copied.",
]
assumptions = [
    "The typed password reaches the server over a protected channel.",
    "Only the application and administrators can write to the accounts table, except in the planted-value act, which supposes otherwise.",
    "Library versions are kept up to date, because the algorithms' recommended settings change.",
]
out_of_scope = [
    "Rate limiting and lockout: the next project covers online guessing.",
    "Password policy, breached-password checks and password managers.",
    "Spring Security's login filters.",
    "Hardware security modules and peppers.",
]
tests = [
    "`EncodersTest` checks every algorithm, the visible settings, the migration and the planted value.",
    "`AttackerTest` shows the weak passwords fall in 24 guesses and the strong one survives.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next project, password-attacks-and-defences, moves from offline guessing to online guessing: rate limits, lockouts and the cost of each.
"""

[[threat]]
id = "T1"
stride = "I"
threat = "The accounts table is stolen and the passwords are readable or cheap to guess"
where = "`NoOpPasswordEncoder`, `MessageDigestPasswordEncoder`"
control = "Use a slow, salted algorithm: bcrypt, PBKDF2, scrypt or Argon2"
residual = "Weak passwords on the attacker's list still fall"

[[threat]]
id = "T2"
stride = "E"
threat = "A value such as {noop}letmein is planted in the table and accepted"
where = "the default `DelegatingPasswordEncoder`"
control = "Build the delegating encoder from an explicit allow-list of ids"
residual = "Anyone with write access can still swap one valid hash for another; protect the table"

[[threat]]
id = "T3"
stride = "I"
threat = "Offline guessing against a stolen bcrypt or Argon2 hash"
where = "`BCryptPasswordEncoder`, `Argon2PasswordEncoder`"
control = "Cost: bcrypt cost 10 is 1,024 rounds; Argon2 uses 16 MiB, two passes"
residual = "Weak passwords fall; settings must be raised as hardware improves"

[[threat]]
id = "T4"
stride = "D"
threat = "Many simultaneous logins exhaust memory, because Argon2 needs 16 MiB each"
where = "`Argon2PasswordEncoder`"
control = "None here; the memory per login is shown"
residual = "Rate limits and a cap on concurrent hashing are needed"

[[threat]]
id = "T5"
stride = "D"
threat = "Wrong logins load the server, because every check is slow"
where = "`matches`"
control = "None here"
residual = "Rate limits and lockouts; the next project covers them"

[[threat]]
id = "T6"
stride = "T"
threat = "An old algorithm is left in use after the default changes"
where = "`upgradeEncoding`"
control = "The stored text is replaced after the next correct login"
residual = "Customers who never log in keep their old hash"

[[threat]]
id = "T7"
stride = "I"
threat = "The format of the stored text reveals the algorithm and settings"
where = "the accounts table"
control = "None needed: security does not depend on hiding the algorithm"
residual = "It tells an attacker how costly guessing is, which is why the cost must be high enough"
