[readme]
intro = """
The plain version of this lesson built a slow, salted hash by hand, so the ideas were visible. This
project does what real applications do: it asks a library. Spring Security's `spring-security-crypto`
module gives every algorithm the same small interface, `PasswordEncoder`, with `encode` to make the
stored text and `matches` to check a login. Salts are added for you. The `DelegatingPasswordEncoder` writes
the algorithm's name in front of the stored text, in curly braces, such as `{bcrypt}`, so it can
check old hashes and make new ones with something stronger, and `upgradeEncoding` tells the shop when a
stored text is due to be replaced.

The same five customers, the same wordlist and the same attack as in the plain project make the two easy to
compare. Six acts show the encoders, the algorithms, the cost, a migration, and what it all costs.
"""
analogy = """
Think of a hotel that wants better locks. It cannot close the hotel and change every lock at once.
Instead, each lock carries a small label saying which kind it is. When a guest comes back, the
front desk checks the old lock as usual, then quietly fits a new one for the next visit.
The label is the `{bcrypt}` in front of the stored text. And a hotel that accepts any label a stranger
writes is asking for trouble, which is the lesson of the last act.
"""
scenario = """
The online store from the plain project, with its five customers: Ana and Ben (both welcome1),
Carol, Erin and Dave. The shop now uses Spring Security's encoders. It starts with the two the library
warns against, moves to the delegating encoder, compares four algorithms, attacks bcrypt at two
costs, switches its default from bcrypt to Argon2 without asking anyone, and then looks at what that
cost.
"""
costs = [
    "**Argon2 costs memory.** It is hard to speed up with special hardware because each hash needs a block of memory. The shop pays that memory on every login, so many logins at once need a lot.",
    "**An open list of algorithms is a risk.** The default delegating encoder accepts old and plain forms, including `{noop}`, which means no hashing at all. Anyone who can write to the table can plant one.",
    "**Another dependency.** Argon2 and scrypt need Bouncy Castle, and the crypto module expects the application to bring Spring's core and logging.",
    "**The same limits as before.** A strong algorithm cannot rescue a weak password, and every login still pays for the slow hash.",
]
too_much = """
For a real application, this is the minimum. The only time to write the hashing yourself is to teach it, which is why the plain
project exists. If a framework other than Spring is in use, its own password library does the same job, and
the advice is the same: use a vetted library, not your own code.
"""
met_before = [
    "`PasswordEncoder` beans in Spring applications, and `{bcrypt}` in their user tables.",
    "The `$2a$10$` start of bcrypt hashes in many databases.",
    "`$argon2id$v=19$m=16384,t=2,p=1$...`, the format that shows Argon2's settings.",
    "Migration notes that say \"hashes are upgraded the next time a user logs in\".",
]
where = """
This project is the second one in [passwords-and-mfa](..), the library version of [password-hashing](../password-hashing).
"""
twin = """
The costs shown are the library's current defaults for each algorithm, taken from the stored text where the
algorithm writes them down (bcrypt's cost, Argon2's memory, passes and parallelism). Guidance changes over time, so
check the current recommendation before copying any setting. The attack is the same eight-word loop as in the plain project,
counted in guesses. Bcrypt cost 10 is used because it is the library default, and cost 4 is the lowest bcrypt allows,
used only to show the difference.
"""
test_note = "Every line the demo prints is checked against `docs/expected-output.txt`. Nothing printed depends on a random salt or on timing, so every run gives the same result."

[[act]]
title = "Two weak encoders, written out here"
summary = "A plain-text encoder stores welcome1 itself; a fast SHA-256 encoder adds a salt, but each guess is one cheap step, so 24 guesses crack 4 of 5."
detail = """
The library keeps the two weakest choices only for old systems, and marks them deprecated, so this project writes them out in a few lines.
Before hashing, Ana's password is welcome1. After hashing with the plain-text encoder, the stored value is welcome1: the password itself.
After hashing with a fast SHA-256 encoder, the stored value is a random salt followed by a hash of the salt and the password, so Ana and Ben get
different values. But SHA-256 is one quick step, so the attacker's eight common passwords crack 4 of the 5 accounts in 24 guesses.
"""
figure = "weak_encoders"
figure_title = "Two weak ways to store welcome1"
figure_speech = """
First, two weak ways to store a password. [[slnc 400]] Before hashing, on the left, is Ana's password: welcome one. [[slnc 600]]
After hashing, the first encoder stores it as it is. [[slnc 300]] The stored value is welcome one. [[slnc 600]]
The second uses S H A two fifty six, with a salt. [[slnc 300]] The salt is random text, shown in blue. [[slnc 300]] So Ana and Ben get different values. [[slnc 600]]
But S H A two fifty six is built to be fast. [[slnc 300]] Each guess is one quick step. [[slnc 300]] So a list of eight common passwords still cracks four of the five accounts, in twenty four guesses. [[slnc 600]]
A salt alone is not enough. [[slnc 300]] Each guess must also be slow.
"""
speech = """
The output shows the same: the password itself, then the salt and the fast hash. [[slnc 300]] And twenty four guesses crack four of five. [[slnc 300]] The library keeps encoders like these only for old systems.
"""
rows = { encoder = "active wrong" }
console = [
    ["BEFORE HASHING", "amber"],
    ["  ana's password  welcome1", "muted"],
    ["AFTER HASHING: PLAIN TEXT", "amber"],
    ["  stored          welcome1  <- THE PASSWORD ITSELF", "bad"],
    ["AFTER HASHING: FAST SHA-256 WITH A SALT", "amber"],
    ["  salt            efb75e9ec5c2a532", "muted"],
    ["  hash            7ea9a53562ef936a1b00b7e4e4a2fd26...", "muted"],
    ["  ana and ben the same: false", "muted"],
    ["THE ATTACK", "amber"],
    ["  24 guesses crack 4 of 5, one cheap step each  <- FAST", "bad"],
    ["the library keeps these only for old systems: deprecated", "amber"],
]

[[act]]
title = "One call: the delegating encoder"
summary = "The delegating encoder stores {bcrypt}$2a$10$, a 22-character salt and a 31-character hash, 68 characters in all; a login hashes the typed password again with that salt and cost and compares."
detail = """
`PasswordEncoderFactories.createDelegatingPasswordEncoder()` gives an encoder that is ready to use; the demo builds the same one, bcrypt at cost 10, with repeatable salts so
the values in this lesson never change. Before hashing, Ana's password is welcome1. After hashing, the stored text is 68 characters: `{bcrypt}` names the algorithm, `$2a$` is bcrypt's version,
`10` is the cost (2^10 = 1024 rounds), then 22 characters of salt and 31 of hash. Ben, with the same password, gets a different salt, so a different stored text.
A login is checked in three steps: read the cost and the salt from the stored text, hash the typed password again with them, and compare with the stored hash.
welcome1 gives the same hash, so true; guess gives a different one, so false. The library's own `matches` gives the same answers.
"""
figure = "login_check"
figure_title = "How a login is checked, step by step"
figure_speech = """
So how is a login checked, if the password is never stored? [[slnc 400]] At the top is Ana's stored text. [[slnc 600]]
Step one. [[slnc 300]] Read the cost and the salt from the stored text. [[slnc 300]] Step two. [[slnc 300]] Hash the typed password again, with that same cost and salt. [[slnc 300]] Step three. [[slnc 300]] Compare the new hash with the stored hash. [[slnc 600]]
Ana types welcome one. [[slnc 300]] The new hash starts with f, x, f, eight, one: exactly the stored hash. [[slnc 300]] So the answer is true. [[slnc 600]]
Someone types guess. [[slnc 300]] The new hash starts with x, x, h, v: nothing like it. [[slnc 300]] So the answer is false. [[slnc 600]]
Nothing is decrypted. [[slnc 300]] The hash is made again, and compared.
"""
speech = """
Before hashing, the password. [[slnc 300]] After hashing, Ana's stored text, sixty eight characters, and its parts. [[slnc 300]] The id, bcrypt, in curly braces, picks the algorithm. [[slnc 300]] Then the version, and the cost ten, which is one thousand and twenty four rounds. [[slnc 300]] Then twenty two characters of salt, and thirty one of hash.
[[page]]
Ben has the same password, but a new salt, so a different stored text. [[slnc 500]] Then the two logins, step by step. [[slnc 300]] Welcome one gives the same hash: true. [[slnc 300]] Guess gives another: false. [[slnc 300]] And the library's own matches call agrees.
"""
rows = { delegating = "active ok" }
console = [
