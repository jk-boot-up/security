kind = "poster"
title = "Password Hashing"
narration = """Hello, and welcome. [[slnc 400]] This video explains password hashing, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A shop must be able to check a password, without ever being able to read it. [[slnc 300]] So it stores a hash. [[slnc 300]] A hash is a one way scramble of the password. [[slnc 300]] At login, the shop scrambles what was typed, and compares. [[slnc 300]] Nobody can run the scramble backwards. [[slnc 600]] Think of a safe. [[slnc 300]] A plain hash is a lock that anyone with a catalogue of keys can open. [[slnc 300]] A salt gives every customer a lock of their own. [[slnc 300]] And a slow hash makes each lock stiff, so that trying keys takes years. [[slnc 300]] The thief can still carry the whole safe home. [[slnc 300]] The safe only makes the opening slow. [[slnc 700]] In this video, the domain is an online store, with five customers. [[slnc 500]] By the end, you will hear why plain text fails, why a plain hash fails, and what a salt and a slow hash each add. [[slnc 300]] And what that costs."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["Five customers.", "", "Ana and Ben both chose welcome1.", "Carol, Erin: weak passwords.", "Dave: a long random password.", "", "One night, the table is stolen."]
narration = """Here is the scenario. [[slnc 400]] An online store has five customers. [[slnc 500]] Ana and Ben both chose the password welcome one. [[slnc 300]] Carol and Erin chose weak passwords too. [[slnc 300]] Dave chose a long random one. [[slnc 600]] One night, the whole accounts table is stolen. [[slnc 300]] The attacker has a list of eight common passwords, and nothing else. [[slnc 300]] How much the thief learns depends on how the shop stored the passwords."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["Hash: a one-way scramble", "Salt: random bytes, one set per account", "Rounds: how many times to repeat the scramble", "Slow hash: many rounds, on purpose"]
narration = """Before the demos, the words. [[slnc 500]] A hash is a one way scramble. [[slnc 500]] A salt is a few random bytes, different for every account, mixed in before the scramble. [[slnc 500]] Rounds are how many times the scramble is repeated. [[slnc 500]] And a slow hash is one with many rounds, on purpose, so that each guess costs real work. [[slnc 600]] Keep one thing in mind. [[slnc 300]] The salt is not a secret. [[slnc 300]] It is stored beside the hash."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "09-ladder"
kind = "bullets"
title = "Four Ways, Compared"
body = ["Plain text: read at once", "Fast hash, no salt: one table cracks all", "Fast hash, salt: cheap, per account", "Slow hash, salt: costly, per account", "", "Weak passwords still fall."]
narration = """Let's put the four ways side by side. [[slnc 400]] Plain text. [[slnc 300]] The thief reads everything at once. [[slnc 500]] A fast hash with no salt. [[slnc 300]] One table, made in advance, cracks every account. [[slnc 500]] A fast hash with a salt. [[slnc 300]] Each account needs its own guesses, but each guess is cheap. [[slnc 500]] A slow hash with a salt. [[slnc 300]] Each account needs its own guesses, and each guess is costly. [[slnc 600]] And in all of them, a weak password still falls. [[slnc 300]] A strong password is part of the defence too."""

[[scene]]
key = "10-roles"
kind = "bullets"
title = "Who Does What"
body = ["PasswordHasher: hash and verify", "Pbkdf2Hasher: slow, salted, stores its rounds", "SaltSource: where salts come from", "AccountStore: register, login, upgrade", "Attacker: tries a wordlist"]
narration = """Here is who does what in the code. [[slnc 400]] The password hasher turns a password into stored text, and checks a login against it. [[slnc 500]] The PBKDF two hasher is the slow, salted one, and it writes its number of rounds into the stored text. [[slnc 500]] The salt source says where salts come from, secure random bytes in real use, and a counter in the demo. [[slnc 500]] The account store registers accounts, checks logins, and upgrades old hashes. [[slnc 300]] And the attacker tries a list of common passwords."""

[[scene]]
key = "11-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["A stored value starting with $2a$", "We store passwords as salted hashes", "Hashed with MD5, cracked in days", "A PasswordEncoder in a framework"]
narration = """You have probably met this already. [[slnc 400]] A long stored value that starts with dollar two a dollar, is a bcrypt hash, with its cost and salt inside. [[slnc 500]] A company that says it stores passwords as salted hashes is describing this. [[slnc 500]] And every data breach story where passwords were hashed with a fast method, and cracked within days, is the second demo. [[slnc 500]] A framework's password encoder does all of this for you."""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Never store a password", "Use a slow, salted hash from a trusted library", "Store the settings with each hash", "Upgrade at login, limit attempts", "Add a second factor"]
narration = """So, how do you use this? [[slnc 400]] Never store a password, and never store a plain fast hash. [[slnc 500]] Use a slow, salted password hash from a trusted library. [[slnc 500]] Store its settings beside each hash, so you can raise them later. [[slnc 500]] Upgrade old hashes at login, and limit the number of attempts. [[slnc 500]] And add what hashing cannot give, a second factor, because a weak password still falls."""

[[scene]]
key = "13-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a strong customer", "and show the attack cannot crack it."]
narration = """That's password hashing. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Store a slow, salted hash, never the password, and remember that a weak password still falls. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine, with nothing installed except a Java development kit. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a customer with a strong password that is not on the list, and show that the attack cannot crack it. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
The part of an online store that stores and checks customer passwords: the four storage schemes from plain text to
PBKDF2, the account table, the login check and the upgrade of old hashes. It covers what a thief learns from a
stolen table, and what guessing costs. It does not cover how passwords are chosen, how they travel to the server, or
what happens after login.
"""
assets = [
    "Customers' passwords, which are often reused on other sites.",
    "The accounts table, which holds the stored text.",
    "The login check, which spends real work on every attempt.",
    "The accounts themselves, which a stolen or swapped hash could open.",
]
actors = [
    "Customers, who choose passwords, some of them weak.",
    "An attacker who has stolen a copy of the accounts table and guesses offline.",
    "An attacker who can write to the table and replace a stored hash.",
    "An attacker who sends many wrong logins to load the server.",
]
boundaries = [
    "Customer to server: the typed password arrives (HTTPS protects it; see the transport-security module).",
    "Application to database: the stored text is written and read.",
    "Database to the outside: the line a thief crosses when the table is copied.",
]
assumptions = [
    "The password reaches the server over a protected channel.",
    "Salts come from a secure random generator in real use. The demo uses a counter so output is repeatable, and must never be used for real accounts.",
    "The attacker's list is small. Real lists have billions of entries and rules that vary each word.",
]
out_of_scope = [
    "Password policy, breached-password checks and password managers.",
    "Multi-factor login: the totp project covers one-time codes.",
    "Choosing between PBKDF2, bcrypt, scrypt and Argon2 in a real system: the with-spring-security-crypto project shows bcrypt and Argon2.",
    "Resetting a forgotten password.",
]
tests = [
    "`HashersTest` checks each scheme against a known value, shows salts change the stored text, and checks the stored format.",
    "`AttackerTest` shows a table cracks unsalted accounts, fails against salts, and that a slow hash multiplies the work by the number of rounds.",
    "`AccountStoreTest` shows a wrong password never changes the stored hash and a correct one upgrades an old hash once.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next project, the with-spring-security-crypto version, repeats this with bcrypt and Argon2 from a library. After that, password-attacks-and-defences
shows how attackers guess online, and how limits and lockouts answer them.
"""

[[threat]]
id = "T1"
stride = "I"
threat = "The accounts table is stolen and the passwords are readable"
where = "`PlainText`, and the table in every scheme"
control = "Store only a salted, slow hash, never the password"
residual = "A weak password on the attacker's list still falls to guessing"

[[threat]]
id = "T2"
stride = "I"
threat = "Two accounts with the same password can be seen to match"
where = "`UnsaltedSha256`"
control = "A different salt for every account, stored with the hash"
residual = "The salt is public by design; it hides matches, not passwords"

[[threat]]
id = "T3"
stride = "I"
threat = "A table of common passwords, hashed in advance, cracks every account at once"
where = "`Attacker.crackWithTable`"
control = "Salts, so no table made in advance fits any account"
residual = "The attacker can still guess per account"

[[threat]]
id = "T4"
stride = "E"
threat = "Offline guessing against a stolen hash"
where = "`Attacker.crackEachAccount`, `Pbkdf2Hasher`"
control = "A slow hash: 100,000 rounds multiply the cost of every guess by 100,000"
residual = "Weak passwords still fall; real guidance uses more rounds or a memory-hard function such as Argon2"

[[threat]]
id = "T5"
stride = "D"
threat = "Many wrong logins load the server, because each one costs a slow hash"
where = "`AccountStore.login`"
control = "None here; the cost is shown as 100,000,000 steps for 1,000 attempts"
residual = "Rate limits and lockouts are needed; the password-attacks-and-defences project covers them"

[[threat]]
id = "T6"
stride = "T"
threat = "An attacker with write access swaps a stored hash for one they know"
where = "the accounts table"
control = "None in this project, by design"
residual = "Protect the table with database permissions and audit changes"

[[threat]]
id = "T7"
stride = "I"
threat = "The comparison leaks, through its timing, how much of a hash matched"
where = "`Hex.sameText`"
control = "A comparison that takes the same time wherever the texts differ"
residual = "Other side channels, such as response timing for unknown usernames, are not covered"

[[threat]]
id = "T8"
stride = "E"
threat = "Old, weaker hashes stay in the table for accounts that never log in"
where = "`AccountStore.login`, `Pbkdf2Hasher.needsUpgrade`"
control = "The hash is replaced by a stronger one after the next correct login"
residual = "A hash can only be upgraded when the password is known, so dormant accounts stay weak"
