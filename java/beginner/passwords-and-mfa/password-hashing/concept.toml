[[act]]
title = "A slow hash, with a salt for each account"
summary = "PBKDF2 hashes 100,000 rounds, each an HMAC of the round before, and XORs them all; the same 24 guesses now cost 2,400,000 steps, yet the 4 weak passwords still fall."
detail = """
The fourth version uses PBKDF2 with 100,000 rounds. Before hashing: the password, the salt and the number of rounds. After
hashing, the stored text has four parts: pbkdf2-sha256, 100000, the salt and the 32-byte hash ce26f863 557480dd .... The program
then makes the hash by hand. Round 1 is an HMAC-SHA-256, keyed with the password, of the salt followed by 00000001: 9c08e776 ....
Every next round is an HMAC of the round before, so no round can be skipped. The hash is all 100,000 rounds XORed together, and
it is exactly the hash PBKDF2 gave. The same attack, the same 24 guesses, now costs 2,400,000 steps. But the four weak passwords
are on the attacker's list, so they still fall. A slow hash makes guessing expensive, not impossible.
"""
figure = "rounds_chain"
figure_title = "What one hundred thousand rounds are"
figure_speech = """
Fourth demo: a slow hash, called P B K D F two. [[slnc 400]] Before hashing: the password, the salt, and the number of rounds, one hundred thousand. [[slnc 600]]
Round one is an H mac of the salt, keyed with the password. [[slnc 300]] An H mac is a hash mixed with a key. [[slnc 400]] Round two is an H mac of round one. [[slnc 300]] And so on, each round from the one before, so none can be skipped. [[slnc 600]]
After hashing: all the rounds are X O R ed together. [[slnc 300]] That is the hash. [[slnc 500]] So one hash costs a hundred thousand steps, for the shop, and for every guess.
"""
speech = """
Before hashing, the inputs. [[slnc 300]] After hashing, the stored text in four parts: the method, the rounds, the salt, and the hash. [[slnc 300]] The right password logs in. [[slnc 200]] A wrong one does not.
[[page]]
Now the program does the rounds by hand. [[slnc 300]] Round one, two, three, and round one hundred thousand. [[slnc 300]] X O R them all, and the hash starts c e two six. [[slnc 300]] The same hash P B K D F two gave.
[[page]]
The same twenty four guesses now cost two million four hundred thousand steps. [[slnc 300]] But the four weak passwords still fall. [[slnc 300]] Slow helps, but it cannot save a weak password.
"""
