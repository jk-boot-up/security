[[act]]
title = "A fast hash, with no salt"
summary = "Ana and Ben have the same stored value; a table of 8 common passwords, hashed once, cracks 4 of 5 accounts with no guessing per account."
detail = """
The second version stores a SHA-256 hash of each password. A hash is a one-way scramble:
the thief cannot read the password from it. But the scramble is the same every time. Ana and
Ben both chose welcome1, and both rows begin fcc3a23f, so anyone can see they match. The attacker hashes
eight common passwords once and looks each stolen value up in that table. Four accounts fall at
once: Ana, Ben, Carol and Erin. Only Dave's long random password is safe.
"""
speech = """
Second demo: a fast hash, with no salt. [[slnc 400]] A hash is a one way scramble. [[slnc 300]] You cannot run it backwards to get the password. [[slnc 600]]
But the scramble is the same every time. [[slnc 300]] Ana and Ben both chose welcome one, and their stored values are identical. [[slnc 300]] Anyone can see that they match. [[slnc 600]]
The attacker scrambles eight common passwords, once, and looks each stolen value up in that table. [[slnc 300]] Four accounts fall at once. [[slnc 300]] Ana, Ben, Carol, and Erin. [[slnc 300]] Only Dave's long random password is safe. [[slnc 600]]
And there was no guessing for each account. [[slnc 300]] One table fits every account.
"""
rows = { stored = "active wrong", salt = "active wrong" }
console = [
    ["ana's stored value begins fcc3a23f, ben's begins fcc3a23f", "muted"],
    ["same password, same stored value: true  <- EASY TO SPOT", "bad"],
    ["a table of 8 common passwords is hashed once and looked up", "muted"],
    ["cracked 4 of 5: ana, ben, carol, erin  <- NO GUESSING PER ACCOUNT", "bad"],
]

[[act]]
title = "A fast hash, with a salt for each account"
summary = "Ana and Ben's stored values now differ and the table trick fails, but cracking still takes only 24 guesses and 24 steps."
detail = """
The third version adds a salt: a few extra bytes, different for every account, mixed into
the password before it is hashed and stored beside the hash. Ana's value now begins 82ae9429
and Ben's begins 51cd9c7f, even though their passwords are the same, so nobody can see that they
match. The table made in advance no longer fits any account, because each account has its own
salt. The attacker must guess for each account separately. But the hash is still fast. The
same four accounts fall after 24 guesses, which is 24 steps of work.
"""
speech = """
Third demo: a fast hash, with a salt for each account. [[slnc 400]] A salt is a few random bytes, different for every account. [[slnc 300]] It is mixed in before the scramble, and stored beside the result. [[slnc 600]]
Now Ana and Ben have different stored values, although their passwords are the same. [[slnc 300]] Nobody can see that they match. [[slnc 600]]
The table made in advance no longer fits any account. [[slnc 300]] Each account has its own salt, so each needs its own guesses. [[slnc 600]]
But the hash is still fast. [[slnc 300]] The same four accounts fall after twenty four guesses. [[slnc 300]] That is twenty four steps of work. [[slnc 300]] Still cheap.
"""
rows = { salt = "active ok", slow = "active wrong" }
console = [
    ["ana's stored value begins 82ae9429, ben's begins 51cd9c7f", "muted"],
    ["same password, same stored value: false", "ok"],
    ["the table trick is gone; each account needs its own guesses", "ok"],
    ["cracked 4 of 5 in 24 guesses, 24 steps of work  <- STILL CHEAP", "bad"],
]

[[act]]
title = "A slow hash, with a salt for each account"
summary = "PBKDF2 with 100,000 rounds makes each guess cost 100,000 times more: the same 24 guesses take 2,400,000 steps, yet the 4 weak passwords still fall."
detail = """
The fourth version uses PBKDF2, which repeats the scramble many thousands of times. Here, 100,000
rounds. Each stored text has four parts: the algorithm, the number of rounds, the salt and the
hash. A right password logs in and a wrong one does not. The same attack, the same 24 guesses, now costs
2,400,000 steps, because each guess costs 100,000 times more than a fast hash. That is the point of a
slow hash. But it cannot rescue a password that is on the attacker's list. The same four accounts still
fall. Dave's survives, as before. A slow hash makes guessing expensive, not impossible.
"""
speech = """
Fourth demo: a slow hash, with a salt for each account. [[slnc 400]] The scheme is called PBKDF two. [[slnc 300]] It repeats the scramble many thousands of times. [[slnc 300]] Here, one hundred thousand times. [[slnc 600]]
The stored text has four parts: the name of the method, the number of rounds, the salt, and the hash. [[slnc 600]]
A right password logs in. [[slnc 300]] A wrong one does not. [[slnc 600]]
Now the same attack, with the same twenty four guesses. [[slnc 300]] It costs two million four hundred thousand steps. [[slnc 300]] Each guess costs a hundred thousand times more than before. [[slnc 600]]
But the four weak passwords still fall. [[slnc 300]] They are on the attacker's list. [[slnc 300]] A slow hash makes guessing expensive, not impossible.
"""
rows = { slow = "active ok" }
console = [
    ["ana's stored text has four parts: pbkdf2-sha256, 100000 rounds, ...", "muted"],
    ["ana logs in with the right password: OK", "ok"],
    ["ana logs in with a wrong one: WRONG", "ok"],
    ["the same attack, the same 24 guesses: 2400000 steps of work", "ok"],
    ["each guess costs 100000 times more than a fast hash", "ok"],
    ["cracked 4 of 5: ana, ben, carol, erin  <- SLOW HELPS, A WEAK PASSWORD STILL FALLS", "amber"],
]

[[act]]
title = "The bill: every login pays, and old hashes must be upgraded"
summary = "One login costs 100,000 steps, 1,000 wrong logins cost 100,000,000; an account with 10,000 rounds is upgraded to 100,000 at its next login."
detail = """
The slow hash costs the shop too. One login costs 100,000 steps, and 1,000 wrong logins cost 100,000,000 steps, so
the login itself can become a target; rate limits are needed. The second cost is time. Erin's account was
made years ago with only 10,000 rounds, while Ana's uses 100,000. At Erin's next correct login, the shop
quietly stores a new hash with 100,000 rounds. The next login reports no upgrade needed. The shop can
only upgrade a hash when it holds the password, which is at login, so accounts that never log in stay weak.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] The slow hash costs the shop too. [[slnc 600]]
One login costs a hundred thousand steps. [[slnc 300]] A thousand wrong logins cost a hundred million. [[slnc 300]] So the login itself can become a target. [[slnc 300]] The shop will need limits on attempts. [[slnc 600]]
The second cost is time. [[slnc 300]] Erin's account was made years ago, with only ten thousand rounds. [[slnc 300]] Ana's uses a hundred thousand. [[slnc 600]]
At Erin's next correct login, the shop stores a new hash, with a hundred thousand rounds. [[slnc 300]] The login after that reports nothing to upgrade. [[slnc 600]]
The shop can only upgrade a hash when it has the password, which is at login. [[slnc 300]] So accounts that never log in stay weak.
"""
