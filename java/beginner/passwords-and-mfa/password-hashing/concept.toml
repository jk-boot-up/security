[[act]]
title = "The bill: login costs, and upgrades"
summary = "One login costs 100,000 steps and 1,000 wrong logins 100,000,000; Erin's old 10,000-round hash is upgraded to 100,000 at her next login."
detail = """
The slow hash costs the shop too. One login costs 100,000 steps, and 1,000 wrong logins cost 100,000,000 steps, so the login
itself can become a target and attempts must be limited. Before the upgrade, Erin's account, made years ago, uses 10,000 rounds
while Ana's uses 100,000. Erin logs in with the right password, so the shop knows it for a moment and stores a new hash: after the
upgrade, Erin's uses 100,000 rounds, and her next login is simply OK. Accounts that never log in stay weak.
"""
figure = "upgrade"
figure_title = "The bill, and an upgrade at login"
figure_speech = """
Fifth demo: the bill. [[slnc 400]] One login costs a hundred thousand steps. [[slnc 300]] A thousand wrong logins cost a hundred million. [[slnc 300]] So the shop must limit attempts. [[slnc 600]]
Before the upgrade, Erin's old account uses only ten thousand rounds. [[slnc 300]] When she logs in, the shop has her password for a moment. [[slnc 300]] So it stores a new hash. [[slnc 300]] After the upgrade, a hundred thousand rounds. [[slnc 300]] Accounts that never log in stay weak.
"""
speech = """
The output: the cost of logins. [[slnc 300]] Erin before the upgrade, ten thousand rounds. [[slnc 300]] Her login says upgraded. [[slnc 300]] After it, a hundred thousand. [[slnc 300]] The next login is simply O K.
"""
