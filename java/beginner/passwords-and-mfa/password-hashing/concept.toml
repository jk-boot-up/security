In the output: before hashing, the two passwords. [[slnc 300]] After hashing, Ana's thirty two bytes. [[slnc 300]] And Ben's, the same. [[slnc 500]] The table cracks Ana, Ben, Carol and Erin. [[slnc 300]] Only Dave's long password survives.
"""
