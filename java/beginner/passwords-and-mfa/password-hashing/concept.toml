[docs.problem]
scenario = """
An online store keeps an account for every customer, and must check a password at every login
without being able to read it. Its accounts table will, sooner or later, be copied by someone who
should not have it.
"""
naive = """
Store what the customer typed. The next improvement, a plain hash, looks safe but gives identical
values for identical passwords and falls to a table of common passwords prepared in advance.
"""
deliver = [
    "Four storage schemes behind one interface, so they can be compared.",
    "An attacker with a list of eight common passwords, and the exact work each scheme costs it.",
    "Work counted in steps, so the numbers are the same on every machine.",
    "A stored format that carries the algorithm, rounds and salt, so rounds can be raised later.",
    "An upgrade of old hashes after a correct login.",
    "The same output every run, checked against a golden output file.",
]

[docs.prerequisites]
required = [
    "Java basics: classes, records, interfaces and maps",
    "The idea of a hash as a one-way function is explained here, so no cryptography is assumed",
]
not_required = [
    "Mathematics behind hash functions",
    "A web framework or a database",
    "Knowledge of bcrypt or Argon2: they are mentioned, and the with-spring-security-crypto project uses them",
]
install = []

[docs.session]
objectives = [
    "explain why a shop stores a hash and never the password",
    "explain what a salt does and what it does not do",
    "explain why a slow hash helps, and why it cannot save a weak password",
    "describe how an old hash is upgraded without asking the customer",
]
walkthrough = """
Start with the safe analogy. Run the demo one act at a time. After act one, ask what the thief
learns. After act two, ask why Ana and Ben's rows look the same, and why that matters. After act
three, ask why salts do not make the attack much harder. After act four, ask what would make Ana's account
safe, and let the group conclude that the password itself must be stronger. In act five, ask
when old hashes can be upgraded, and why not all at once.
"""
exercises = [
    "Add a stronger customer to the demo with a password not on the list, and show that act four cannot crack it.",
    "Change CURRENT_ROUNDS to 200000 and note how the work in act four changes. Which tests change?",
    "Add a method that reports which accounts still use fewer rounds than the current setting.",
    "Make the attacker's list longer by adding five more words, and count the guesses again.",
]

[docs.explained]
sentence = """
A shop should store only a slow, salted hash of each password: the hash hides the password, the salt makes identical passwords look different and defeats tables made in advance, and the slowness makes every guess cost real work.
"""
verdict = """
Never store a password and never store a plain fast hash. Use a slow, salted password hash from a
trusted library, store its settings with each hash so they can be raised later, upgrade old hashes at
login, and limit login attempts. Then add what hashing cannot give: a policy against weak passwords,
and a second factor.
"""
recognise = [
    "Stored passwords that begin with a name or version marker, such as `$2a$`.",
    "A user table with one column for the whole stored text, not separate columns for password and salt.",
    "A `PasswordEncoder` or a `hash` and `verify` pair of functions.",
    "Login code that does a comparison of equal length and time.",
]

[spec]
purpose = """
Teach how passwords are stored safely by storing the same five passwords four ways, attacking each with the same list, and counting the attacker's work.
"""
nongoals = [
    "Choosing the best algorithm for a real system: bcrypt and Argon2 appear in the with-spring-security-crypto project.",
    "Password policy, breached-password checks or password managers.",
    "Real attackers' tools: the attacker is a small loop.",
]
problem = """
Learners know passwords should be hashed but not why a plain hash is not enough. The project makes each improvement visible as a number.
"""
roles = [["The four schemes", "`PlainText`, `UnsaltedSha256`, `SaltedSha256`, `Pbkdf2Hasher`"], ["Salts", "`SaltSource`, `SecureSalts`, `CountingSalts`"], ["The accounts table", "`AccountStore`"], ["The attacker", "`Attacker` and `Cracked`"], ["Counting work", "`WorkMeter`"], ["Entry point", "`HashingDemo`"]]
requirements = [
    "The demo prints five numbered acts and the output equals `docs/expected-output.txt`.",
    "No scheme except plain text ever stores the password.",
    "Two accounts with the same password have different stored values once a salt is used.",
    "A hash is checked with the rounds stored in it, not the current setting.",
    "A hash with fewer rounds than the current setting is replaced only after a correct password.",
]

