[poster]
headline = [["PASSWORD", "text"], ["HASHING", "accent"]]
taglines = [["Never store the password itself", "gold"]]
before = { code = "store(password)", note = "a stolen table is a list of passwords", tag = "BEFORE" }
after = { code = "pbkdf2$rounds$salt$hash", note = "every guess costs real work", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "Password Hashing"
narration = """Hello, and welcome. [[slnc 400]] This video explains password hashing, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] A shop must check a password, without ever being able to read it. [[slnc 300]] So it stores a hash: a one way scramble of the password. [[slnc 300]] At login, it scrambles what was typed, and compares. [[slnc 600]] Think of a safe. [[slnc 300]] A salt gives every customer a lock of their own. [[slnc 300]] And a slow hash makes each lock stiff, so trying keys takes years. [[slnc 700]] The domain is an online store, with five customers. [[slnc 400]] We use S H A two fifty six, the Secure Hash Algorithm, and then P B K D F two, a Password Based Key Derivation Function. [[slnc 400]] By the end, you will see what a salt and a slow hash each add, and what they cost."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["Five customers.", "", "Ana and Ben both chose welcome1.", "Carol, Erin: weak passwords.", "Dave: a long random password.", "", "One night, the table is stolen."]
narration = """Here is the scenario. [[slnc 400]] Ana and Ben both chose welcome one. [[slnc 300]] Carol and Erin chose weak passwords too. [[slnc 300]] Dave chose a long random one. [[slnc 500]] One night, the accounts table is stolen. [[slnc 300]] The attacker has a list of eight common passwords, and nothing else."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["Hash: a one-way scramble, 32 bytes", "Salt: 16 random bytes, new per account", "Rounds: how often the scramble repeats", "Slow hash: many rounds, on purpose"]
narration = """The words. [[slnc 400]] A hash is a one way scramble. [[slnc 400]] A salt is sixteen random bytes, new for every account, mixed in before the scramble. [[slnc 400]] Rounds are how many times the scramble is repeated. [[slnc 400]] And a slow hash has many rounds, on purpose."""

[[scene]]
key = "03-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "04-hash"
kind = "figure"
title = "What a hash does to one password"
body = "hash_one"
narration = """First, what a hash does to one password. [[slnc 400]] Here is welcome one, eight characters. [[slnc 300]] Under each one is its byte, in hex. [[slnc 300]] W is seven seven. [[slnc 500]] Sha two fifty six scrambles all the bytes together. [[slnc 300]] It has no key and no secret. [[slnc 300]] Out come thirty two bytes, starting f c c three. [[slnc 500]] Nobody can run it backwards. [[slnc 300]] But the same password always gives the same thirty two bytes. [[slnc 300]] Keep that in mind."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "09-ladder"
kind = "bullets"
title = "Four Ways, Compared"
body = ["Plain text: read at once", "Fast hash, no salt: one table cracks all", "Fast hash, salt: cheap, per account", "Slow hash, salt: costly, per account", "", "Weak passwords still fall."]
narration = """Side by side. [[slnc 400]] Plain text: read at once. [[slnc 400]] A fast hash, no salt: one table cracks all. [[slnc 400]] A salt: each account needs its own guesses, but they are cheap. [[slnc 400]] A slow hash: each guess is costly. [[slnc 400]] And a weak password still falls."""

[[scene]]
key = "11-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["A stored value starting with $2a$", "We store passwords as salted hashes", "Hashed with a fast hash, cracked in days", "A PasswordEncoder in a framework"]
narration = """You have met this already. [[slnc 400]] A stored value starting with dollar two a dollar is a bcrypt hash, with its cost and salt inside. [[slnc 400]] Breach stories where passwords used a fast hash, and were cracked within days, are the second demo. [[slnc 400]] And a framework's password encoder does all of this for you."""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Never store a password", "Use a slow, salted hash from a trusted library", "Store the settings with each hash", "Upgrade at login, limit attempts", "Add a second factor"]
narration = """So, how do you use this? [[slnc 400]] Never store a password, or a plain fast hash. [[slnc 400]] Use a slow, salted hash from a trusted library. [[slnc 400]] Store its settings with each hash. [[slnc 400]] Upgrade at login, and limit attempts. [[slnc 400]] And add a second factor, because a weak password still falls."""

[[scene]]
key = "12-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "13-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a strong customer", "and show the attack cannot crack it."]
narration = """That's password hashing. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Store a slow, salted hash, never the password, and remember that a weak password still falls. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine, with nothing installed except a Java development kit. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a customer with a strong password that is not on the list, and show that the attack cannot crack it. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] Here is what each class does."""

[[class]]
name = "PasswordHasher"
what = "hash a password, verify a login"
[[class.part]]
title = "one interface, four ways"
code = """
public interface PasswordHasher {
...
    String hash(String password);
...
    boolean verify(String password, String stored);
"""
speech = """Password hasher is the interface the four ways share. [[slnc 300]] Hash makes what is stored. [[slnc 300]] Verify checks a login against it."""

[[class]]
name = "SaltedSha256"
what = "a fast hash, with a salt"
[[class.part]]
title = "salt, then password, then SHA-256"
code = """
System.arraycopy(salt, 0, joined, 0, salt.length);
System.arraycopy(text, 0, joined, salt.length, text.length);
return saltHex + "$" + Hex.sha256(joined);
"""
speech = """Salted sha two fifty six joins the salt and the password, hashes the joined bytes, and stores the salt, a dollar sign, and the hash. [[slnc 300]] That is act three."""

[[class]]
name = "Pbkdf2Hasher"
what = "the slow, salted hash"
[[class.part]]
title = "the rounds are stored with the hash"
code = """
PBEKeySpec spec = new PBEKeySpec(password.toCharArray(),
        salt, rounds, 256);
byte[] key = SecretKeyFactory.getInstance("PBKDF2WithHmacSHA256")
        .generateSecret(spec).getEncoded();
return PREFIX + "$" + rounds + "$" + HexFormat.of().formatHex(salt)
        + "$" + HexFormat.of().formatHex(key);
...
int storedIterations = Integer.parseInt(parts[1]); // verify
"""
speech = """The P B K D F two hasher asks Java for the slow hash, with the salt and the rounds. [[slnc 300]] It stores four parts: the method, the rounds, the salt, and the hash. [[slnc 300]] Verify uses the rounds stored in the text, so old hashes still work."""

[[class]]
name = "RoundSteps"
what = "does the rounds by hand"
[[class.part]]
title = "each round from the one before"
code = """
byte[] round = hmac.doFinal(first);     // round 1
...
for (int i = 2; i <= rounds; i++) {
    round = hmac.doFinal(round);        // HMAC of the round before
    hash = Hex.xor(hash, round);        // XOR it into the hash
"""
speech = """Round steps redoes the rounds by hand. [[slnc 300]] Each round is an H mac of the one before, and the hash is all of them X O R ed. [[slnc 300]] A test checks it matches Java's own hash."""

[[class]]
name = "AccountStore"
what = "register, log in, upgrade"
[[class.part]]
title = "upgrade after a correct password"
code = """
if (current == null || !hasher.verify(password, current)) {
    return Login.WRONG;
}
if (hasher instanceof Pbkdf2Hasher pbkdf2 && pbkdf2.needsUpgrade(current)) {
    stored.put(username, pbkdf2.hash(password));
    return Login.UPGRADED;
"""
speech = """The account store checks a login. [[slnc 300]] Only after a correct password, when the old hash has too few rounds, it stores a new one. [[slnc 300]] That is Erin's upgrade in act five."""

[[class]]
name = "Attacker"
what = "tries a list of common passwords"
[[class.part]]
title = "a table, or guesses per account"
code = """
for (String word : wordlist) {
    table.put(hasher.hash(word), word);   // no salt: hash once, look up
}
...
for (String word : wordlist) {
    guesses++;
    if (hasher.verify(word, account.getValue())) {   // salt: guess per account
"""
speech = """The attacker has two tricks. [[slnc 300]] Without a salt, hash the list once and look rows up. [[slnc 300]] With a salt, guess each account on its own."""

[[class]]
name = "SaltSource"
what = "where salts come from"
[[class.part]]
title = "secure in real use, counting in the demo"
code = """
public class SecureSalts implements SaltSource {   // real use
    private final SecureRandom random = new SecureRandom();
...
public class CountingSalts implements SaltSource { // the demo
"""
speech = """Salt source gives sixteen bytes. [[slnc 300]] Secure salts uses Java's secure random generator, for real use. [[slnc 300]] Counting salts keeps the demo repeatable. [[slnc 300]] A work meter counts steps, not seconds."""

[[acronym]]
short = "SHA-256"
long = "Secure Hash Algorithm, 256-bit output"
say = "S H A two fifty six is the Secure Hash Algorithm, with a two hundred and fifty six bit result: thirty two bytes."
[[acronym]]
short = "PBKDF2"
long = "Password-Based Key Derivation Function 2"
say = "P B K D F two is Password Based Key Derivation Function two: a slow hash made of many rounds."
[[acronym]]
short = "HMAC"
long = "Hash-based Message Authentication Code"
say = "H mac is Hash based Message Authentication Code: a hash mixed with a key. Here, the key is the password."
[[acronym]]
short = "XOR"
long = "exclusive or"
say = "X O R is exclusive or: compare two bits, one if they differ, zero if they match."
[[acronym]]
short = "hex"
long = "hexadecimal: each byte as two characters, 00 to ff"
say = "And hex is hexadecimal: every byte written as two characters, from zero zero to f f."

[threatmodel]
scope = """
The part of an online store that stores and checks customer passwords: the four storage schemes from plain text to
PBKDF2, the account table, the login check and the upgrade of old hashes. It covers what a thief learns from a
stolen table, and what guessing costs. It does not cover how passwords are chosen, how they travel to the server, or
what happens after login.
"""
assets = [
    "Customers' passwords, which are often reused on other sites.",
    "The accounts table, which holds the stored text.",
    "The login check, which spends real work on every attempt.",
    "The accounts themselves, which a stolen or swapped hash could open.",
]
actors = [
    "Customers, who choose passwords, some of them weak.",
    "An attacker who has stolen a copy of the accounts table and guesses offline.",
    "An attacker who can write to the table and replace a stored hash.",
    "An attacker who sends many wrong logins to load the server.",
]
boundaries = [
    "Customer to server: the typed password arrives (HTTPS protects it; see the transport-security module).",
    "Application to database: the stored text is written and read.",
    "Database to the outside: the line a thief crosses when the table is copied.",
]
assumptions = [
    "The password reaches the server over a protected channel.",
    "Salts come from a secure random generator in real use. The demo uses a counter so output is repeatable, and must never be used for real accounts.",
    "The attacker's list is small. Real lists have billions of entries and rules that vary each word.",
]
out_of_scope = [
    "Password policy, breached-password checks and password managers.",
    "Multi-factor login: the totp project covers one-time codes.",
    "Choosing between PBKDF2, bcrypt, scrypt and Argon2 in a real system: the with-spring-security-crypto project shows bcrypt and Argon2.",
    "Resetting a forgotten password.",
]
tests = [
    "`HashersTest` checks each scheme against a known value, shows salts change the stored text, and checks the stored format.",
    "`AttackerTest` shows a table cracks unsalted accounts, fails against salts, and that a slow hash multiplies the work by the number of rounds.",
    "`AccountStoreTest` shows a wrong password never changes the stored hash and a correct one upgrades an old hash once.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next project, the with-spring-security-crypto version, repeats this with bcrypt and Argon2 from a library. After that, password-attacks-and-defences
shows how attackers guess online, and how limits and lockouts answer them.
"""

[[threat]]
id = "T1"
stride = "I"
threat = "The accounts table is stolen and the passwords are readable"
where = "`PlainText`, and the table in every scheme"
control = "Store only a salted, slow hash, never the password"
residual = "A weak password on the attacker's list still falls to guessing"

[[threat]]
id = "T2"
stride = "I"
threat = "Two accounts with the same password can be seen to match"
where = "`UnsaltedSha256`"
control = "A different salt for every account, stored with the hash"
residual = "The salt is public by design; it hides matches, not passwords"

[[threat]]
id = "T3"
stride = "I"
threat = "A table of common passwords, hashed in advance, cracks every account at once"
where = "`Attacker.crackWithTable`"
control = "Salts, so no table made in advance fits any account"
residual = "The attacker can still guess per account"

[[threat]]
id = "T4"
stride = "E"
threat = "Offline guessing against a stolen hash"
where = "`Attacker.crackEachAccount`, `Pbkdf2Hasher`"
control = "A slow hash: 100,000 rounds multiply the cost of every guess by 100,000"
residual = "Weak passwords still fall; real guidance uses more rounds or a memory-hard function such as Argon2"

[[threat]]
id = "T5"
stride = "D"
threat = "Many wrong logins load the server, because each one costs a slow hash"
where = "`AccountStore.login`"
control = "None here; the cost is shown as 100,000,000 steps for 1,000 attempts"
residual = "Rate limits and lockouts are needed; the password-attacks-and-defences project covers them"

[[threat]]
id = "T6"
stride = "T"
threat = "An attacker with write access swaps a stored hash for one they know"
where = "the accounts table"
control = "None in this project, by design"
residual = "Protect the table with database permissions and audit changes"

[[threat]]
id = "T7"
stride = "I"
threat = "The comparison leaks, through its timing, how much of a hash matched"
where = "`Hex.sameText`"
control = "A comparison that takes the same time wherever the texts differ"
residual = "Other side channels, such as response timing for unknown usernames, are not covered"

[[threat]]
id = "T8"
stride = "E"
threat = "Old, weaker hashes stay in the table for accounts that never log in"
where = "`AccountStore.login`, `Pbkdf2Hasher.needsUpgrade`"
control = "The hash is replaced by a stronger one after the next correct login"
residual = "A hash can only be upgraded when the password is known, so dormant accounts stay weak"
