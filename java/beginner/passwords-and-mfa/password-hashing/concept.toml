The shop stored each password exactly as typed. [[slnc 300]] So the thief reads all five at once. [[slnc 300]] Ana's row says welcome one. [[slnc 600]]
There is nothing to crack. [[slnc 300]] And people reuse passwords, so the damage spreads to their other accounts too.
"""
