[poster]
headline = [["ONE-TIME CODES", "text"], ["WITH JAVA-OTP", "accent"]]
taglines = [["Let a library make the code, and write the rest yourself", "gold"]]
before = { code = "your own HMAC", note = "easy to get subtly wrong", tag = "BEFORE" }
after = { code = "generator.validate(key, time, code)", note = "the bank adds window and replay", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "One-Time Codes with the java-otp Library"
narration = """Hello, and welcome. [[slnc 400]] This video explains one time codes with the java otp library, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A one time code is the six digits in an authenticator app, made from a secret and the time. [[slnc 300]] A library can make that code for you, and can check it for one thirty second step. [[slnc 300]] And that is all it does. [[slnc 600]] Think of a clerk who buys a ready made stamp, that prints a new number every thirty seconds. [[slnc 300]] The stamp does its one job well. [[slnc 300]] The clerk still has to decide how many seconds either side of the number to accept, to remember which numbers were already used, to lock the stamp away, and to turn away anyone who keeps guessing. [[slnc 700]] In this video, the domain is an online bank, and its customer, Dana, from the earlier video. [[slnc 500]] By the end, you will hear what the library does, where it stops, and what the bank must still write."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["The online bank and Dana, as before.", "", "The bank wants a library for its codes,", "not its own HMAC.", "", "What does the library do?", "What is still the bank's job?"]
narration = """Here is the scenario. [[slnc 400]] It is the online bank, and its customer Dana, from the earlier video. [[slnc 500]] This time, the bank wants a library to make its codes, instead of writing the H M A C itself. [[slnc 600]] So the questions are, what does the library do, and what is still the bank's job?"""

[[scene]]
key = "03-library"
kind = "bullets"
title = "What the Library Offers"
body = ["Makes the code for a key and a time", "Checks a code for one time step", "Other hashes, other lengths", "", "That is all."]
narration = """Before the demos, what the library offers. [[slnc 500]] It makes the code, for a key and a time. [[slnc 500]] It checks a code for one time step. [[slnc 500]] And it can use other hashes, and other code lengths. [[slnc 600]] That is all. [[slnc 300]] Everything else is for the bank."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "09-split"
kind = "bullets"
title = "Library, and Bank"
body = ["Library: the code, one-step check", "Bank: the window for drifting clocks", "Bank: the memory that stops a second use", "Bank: secret storage, attempt limits", "Bank: the otpauth link, and its privacy"]
narration = """Let's draw the line. [[slnc 400]] The library makes the code, and checks one step. [[slnc 500]] The bank decides the window, for clocks that drift. [[slnc 500]] The bank keeps the memory that stops a code being used twice. [[slnc 500]] The bank stores the secrets, and limits the attempts. [[slnc 500]] And the bank builds the link for the picture, and keeps that screen private."""

[[scene]]
key = "10-roles"
kind = "bullets"
title = "Who Does What"
body = ["TimeBasedOneTimePasswordGenerator: the library", "OtpService: window and replay memory", "OtpAuthUri: the link in the QR code", "Secrets: the standard's test keys", "Commons Codec: Base32 for the link"]
narration = """Here is who does what in the code. [[slnc 400]] The time based one time password generator is the library's class. [[slnc 500]] The O T P service is the bank's code, with the window and the memory. [[slnc 500]] The O T P auth class builds the link that the picture carries. [[slnc 500]] The secrets class holds the standard's test keys. [[slnc 300]] And Commons Codec supplies Base thirty two, for the link."""

[[scene]]
key = "11-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["pyotp, otplib, rotp: the same idea", "otpauth:// behind the QR code", "Docs: you must prevent replays", "Frameworks that wrap a library like this"]
narration = """You have probably met this already. [[slnc 400]] Almost every language has a library like this one. [[slnc 500]] The text behind the picture on a two step sign in page is an O T P auth link. [[slnc 500]] Library documentation often says, you are responsible for storing the secret and preventing replays. [[slnc 500]] And frameworks that offer one time codes usually wrap a library like this, and add the rest."""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["A library for the code, never your own HMAC", "Check it against the standard's values", "Wrap it: window, replay memory", "Encrypt secrets, limit attempts, test it all"]
narration = """So, how do you use it? [[slnc 400]] Use a library for the code, never your own H M A C. [[slnc 500]] Check it once, against the standard's values. [[slnc 500]] Wrap it, with a window and a replay memory. [[slnc 500]] Keep the secrets encrypted, limit the attempts, and test every one of those."""

[[scene]]
key = "13-outro"
kind = "outro"
title = "Thanks for Watching"
