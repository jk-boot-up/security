[poster]
headline = [["ONE-TIME CODES", "text"], ["WITH JAVA-OTP", "accent"]]
taglines = [["Let a library make the code, and write the rest yourself", "gold"]]
before = { code = "your own HMAC", note = "easy to get subtly wrong", tag = "BEFORE" }
after = { code = "generator.validate(key, time, code)", note = "the bank adds window and replay", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "One-Time Codes with the java-otp Library"
narration = """Hello, and welcome. [[slnc 400]] This video explains one time codes with the java otp library, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A one time code is the six digits in an authenticator app, made from a secret and the time. [[slnc 300]] Its name is T O T P, short for time based one time password. [[slnc 300]] A library can make that code for you, and check it for one thirty second step. [[slnc 300]] And that is all it does. [[slnc 600]] Think of a clerk who buys a ready made stamp, that prints a new number every thirty seconds. [[slnc 300]] The clerk still decides who may use it, and how often. [[slnc 700]] In this video, the domain is an online bank, and its customer, Dana. [[slnc 500]] By the end, you will see how one code is made, what the library checks, and what the bank must still write."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online bank and its customer Dana.", "", "The bank wants a library for its codes,", "not its own HMAC.", "", "What does the library do?", "What is still the bank's job?"]
narration = """Here is the scenario. [[slnc 400]] An online bank, and its customer Dana. [[slnc 500]] The bank wants a library to make its codes, instead of writing the H M A C itself. [[slnc 600]] So the questions are, what does the library do, and what is still the bank's job?"""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["Secret: shared by the phone and the bank", "Time step: 30 seconds, one code each", "Code: 6 digits from the secret and the step", "Window: the steps the bank accepts", "Replay: the same code used twice"]
narration = """Before the demos, the words. [[slnc 500]] The secret is a key, shared by Dana's phone and the bank. [[slnc 500]] A time step is thirty seconds, and each step has one code. [[slnc 500]] The code is six digits, made from the secret and the step. [[slnc 500]] The window is the steps the bank accepts, for clocks that drift. [[slnc 500]] And a replay is the same code, used twice."""

[[scene]]
key = "03-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "04-idea"
kind = "figure"
title = "The same secret, the same clock, the same code"
body = "phone_and_bank"
narration = """Before: what both sides have. [[slnc 300]] Dana's phone and the bank hold the same secret. [[slnc 300]] And both have a clock, here at time fifty nine. [[slnc 600]] Each side puts the secret and the time into T O T P. [[slnc 300]] After: both get the same six digits, two eight seven, zero eight two. [[slnc 600]] Dana types the code from her phone, and the bank compares it with its own. [[slnc 300]] The same, so Dana is let in. [[slnc 500]] Only the six digits travel, never the secret."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "09-split"
kind = "bullets"
title = "Library, and Bank"
body = ["Library: the code, one-step check", "Bank: the window for drifting clocks", "Bank: the memory that stops a second use", "Bank: secret storage, attempt limits", "Bank: the otpauth link, and its privacy"]
narration = """Let's draw the line. [[slnc 400]] The library makes the code, and checks one step. [[slnc 500]] The bank decides the window, for clocks that drift. [[slnc 500]] The bank keeps the memory that stops a second use. [[slnc 500]] The bank stores the secrets, and limits the attempts. [[slnc 500]] And the bank builds the link for the Q R code, and keeps that screen private."""

[[scene]]
key = "11-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["pyotp, otplib, rotp: the same idea", "otpauth:// behind the QR code", "Docs: you must prevent replays", "Frameworks that wrap a library like this"]
narration = """You have probably met this already. [[slnc 400]] Almost every language has a library like this one. [[slnc 500]] The text behind the Q R code on a two step sign in page is an o t p auth link. [[slnc 500]] Its documentation says: preventing replays is your job."""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["A library for the code, never your own HMAC", "Check it against the standard's values", "Wrap it: window, replay memory", "Encrypt secrets, limit attempts, test it all"]
narration = """So, how do you use it? [[slnc 400]] Use a library for the code, never your own H M A C. [[slnc 500]] Check it once, against the standard's values. [[slnc 500]] Wrap it, with a window and a replay memory. [[slnc 500]] Keep the secrets encrypted, limit the attempts, and test every one of those."""

[[scene]]
key = "13-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "13-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Change the step to sixty", "seconds and see which numbers change."]
narration = """That's one time codes with a library. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] The library does the arithmetic, and the bank is still responsible for the policy. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine, with nothing installed except a Java development kit. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Change the step to sixty seconds, and see which numbers in the demo change. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
The bank's use of the java-otp library for one-time codes: the code generator, the bank's window and replay memory around it, the
secret, and the otpauth link that carries the secret to the phone. It covers what the library does and does not protect against. It does not
cover the password check, TLS, or hardware keys.
"""
assets = [
    "Customers' accounts.",
    "The shared secret, on the phone, on the bank's server and in the otpauth link.",
    "The bank's record of the last accepted step.",
    "The correctness of the library's codes.",
]
actors = [
    "Dana, the customer.",
    "An observer who sees a code or the enrolment screen.",
    "A fake bank page that relays codes.",
    "A developer who relies on the library for more than it does.",
]
boundaries = [
    "Bank to phone: the secret crosses once, in the otpauth link or QR code.",
    "Customer to bank: the code is typed and sent.",
    "Bank code to library: the library checks one step, and everything else is above it.",
]
assumptions = [
    "TLS protects the codes and the enrolment page in transit.",
    "The phone is not compromised.",
    "The library is the version pinned in the build, and is kept up to date.",
    "The demo's secrets are public test keys.",
]
out_of_scope = [
    "Storing secrets encrypted, and limiting attempts: later modules and the attacks project.",
    "Hardware security keys, which stop relaying.",
    "Testing real authenticator apps.",
]
tests = [
    "`LibraryCodesTest` checks the library against RFC 4226 and RFC 6238 for three hashes.",
    "`OtpServiceTest` checks the library's one-step check, the bank's window, the replay protection and its per-customer memory.",
    "`OtpAuthUriTest` checks the link's parts and the padding.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The cryptography module comes next, beginning with hashing and integrity, which explains the keyed hash, HMAC, that this library uses inside.
"""

[[threat]]
id = "T1"
stride = "S"
threat = "A code seen by an observer is used again"
where = "`OtpService.verify`"
control = "The bank remembers the last accepted step and refuses it again"
residual = "The library alone does not do this; the observer can still be first"

[[threat]]
id = "T2"
stride = "D"
threat = "A phone's clock is out, so the right code is refused; a wide window gives an attacker more chances"
where = "the window in `OtpService`"
control = "A window of one step either side, written by the bank"
residual = "The library validates one step only, so the window is the bank's to choose and test"

[[threat]]
id = "T3"
stride = "I"
threat = "The secrets are stolen from the bank"
where = "wherever the bank stores them"
control = "None in the library or the demo"
residual = "The bank must store them encrypted, and limit who can read them"

[[threat]]
id = "T4"
stride = "I"
threat = "The otpauth link or QR code is seen during enrolment"
where = "`OtpAuthUri`"
control = "Show it once, on a private screen"
residual = "Anyone who sees it can make the customer's codes"

[[threat]]
id = "T5"
stride = "S"
threat = "A fake page relays the code at once"
where = "the customer's browser"
control = "None in TOTP"
residual = "Hardware security keys stop this; a library cannot"

[[threat]]
id = "T6"
stride = "T"
threat = "The library's codes differ from the standard, so real apps are refused"
where = "`TimeBasedOneTimePasswordGenerator`"
control = "Tests against the published values of RFC 4226 and RFC 6238"
residual = "The version must be re-tested whenever it is upgraded"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] Five small classes. [[slnc 300]] Here is what each one does."""

[[class]]
name = "OtpLibraryDemo"
what = "runs the six acts"
[[class.part]]
title = "the six acts"
code = """
act1SameValues(out);
act2HowTheCodeIsMade(out);
act3WhatTheLibraryChecks(out);
act4Options(out);
act5Provisioning(out);
act6Bill(out);
"""
speech = """O T P library demo runs the six acts. [[slnc 300]] A test compares its output with the golden file, so every number in this video is checked."""

[[class]]
name = "OtpService"
what = "the bank's check, around the library"
[[class.part]]
title = "the library's one line"
code = """
// make a code
return generator.generateOneTimePasswordString(key,
        Instant.ofEpochSecond(unixSeconds));
...
// check a code, for one step only
return generator.validateOneTimePassword(key,
        Instant.ofEpochSecond(unixSeconds), code);
"""
speech = """O T P service is the bank's code. [[slnc 300]] Making a code is one call to the library. [[slnc 300]] Checking a code, for one step, is another."""
[[class.part]]
title = "the window and the replay memory"
code = """
long current = now / stepSeconds;
for (long step = current - window; step <= current + window; step++) {
    if (step >= 0 && libraryValidates(key, step * stepSeconds, code)) {
        if (replayProtection && step <= lastStep.getOrDefault(user, -1L)) {
            return Result.REPLAYED;
        }
        lastStep.put(user, step);
        return Result.OK;
"""
speech = """Verify is what the bank adds. [[slnc 300]] It asks the library about each step in the window, one either side. [[slnc 300]] If a step matches but is not newer than the customer's last one, it is replayed. [[slnc 300]] Otherwise it remembers the step, and says O K."""

[[class]]
name = "TotpSteps"
what = "works out the code by hand"
[[class.part]]
title = "the four steps"
code = """
// step 1: which 30-second step, as 8 bytes
long step = unixSeconds / 30;
byte[] counter = ByteBuffer.allocate(8).putLong(step).array();
// step 2: HMAC-SHA1 with the key, 20 bytes
byte[] hmac = hmacSha1(key, counter);
// step 3: the last half-byte says where to take 4 bytes
int offset = hmac[hmac.length - 1] & 0x0f;
int fourBytes = ByteBuffer.wrap(hmac, offset, 4).getInt();
// step 4: drop the top bit, keep the last 6 digits
int number = fourBytes & 0x7fffffff;
String code = String.format("%06d", number % 1_000_000);
"""
speech = """T O T P steps does the four steps of act two by hand. [[slnc 300]] The step number as eight bytes. [[slnc 200]] The H M A C. [[slnc 200]] Four bytes, picked by the last half byte. [[slnc 200]] And the last six digits. [[slnc 300]] A test checks it gives the library's exact code."""

[[class]]
name = "OtpAuthUri"
what = "the text in the QR code"
[[class.part]]
title = "the link"
code = """
String label = encode(issuer) + ":" + encode(account);
String base32 = new Base32().encodeToString(secret)
        .replace("=", "");                     // no padding
return "otpauth://totp/" + label + "?secret=" + base32
        + "&issuer=" + encode(issuer) + "&algorithm=" + algorithm
        + "&digits=" + digits + "&period=" + periodSeconds;
"""
speech = """O T P auth U R I builds the link of act five. [[slnc 300]] The bank's name and the account, then the secret in Base thirty two, without padding, then the settings."""

[[class]]
name = "Secrets"
what = "the standard's public test keys"
[[class.part]]
title = "never for a real account"
code = """
static final byte[] SHA1 = "12345678901234567890".getBytes(StandardCharsets.US_ASCII);
"""
speech = """Secrets holds the standards' public test keys. [[slnc 300]] They must never protect a real account."""

[[acronym]]
short = "OTP"
long = "One-Time Password"
say = "O T P is One Time Password: a code that works only once."
[[acronym]]
short = "TOTP"
long = "Time-based One-Time Password"
say = "T O T P is Time based One Time Password: a code made from a secret and the clock, new every thirty seconds."
[[acronym]]
short = "HMAC"
long = "Hash-based Message Authentication Code"
say = "H M A C is Hash based Message Authentication Code: a hash mixed with a secret key."
[[acronym]]
short = "SHA, SHA1"
long = "Secure Hash Algorithm: SHA-1 (SHA1 in a link), SHA-256, SHA-512"
say = "S H A is Secure Hash Algorithm. The number after it says which one: one, two fifty six, or five twelve."
[[acronym]]
short = "RFC"
long = "Request for Comments: an internet standard"
say = "R F C is Request for Comments: the name of the internet's standards."
[[acronym]]
short = "QR"
long = "Quick Response (code)"
say = "Q R is Quick Response: the square picture a phone camera reads."
[[acronym]]
short = "URI"
long = "Uniform Resource Identifier: a link"
say = "U R I is Uniform Resource Identifier: a link, like the o t p auth one."
[[acronym]]
short = "MFA"
long = "Multi-Factor Authentication"
say = "M F A is Multi Factor Authentication: a password, and something you have, like a phone."
[[acronym]]
short = "Base32"
long = "letters A-Z and digits 2-7: 5 bits each"
say = "And Base thirty two writes bytes with the capital letters and the digits two to seven, five bits per character."
