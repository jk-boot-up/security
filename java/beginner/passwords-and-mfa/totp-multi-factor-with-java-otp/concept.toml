[readme]
intro = """
The plain version of this lesson built the one-time code by hand from HMAC, so the recipe was visible. Most applications
use a library instead. This project uses **java-otp**, a small open-source library with one class for the time-based code,
`TimeBasedOneTimePasswordGenerator`. Given a secret key and a time, it makes the code. Given a code, it can say whether it
is right for one time step. And that is all. The rest of what a bank needs is still written by the bank: a window of steps for clocks that are
a little out, a memory so a code cannot be used twice, secure storage for secrets, and limits on wrong guesses.

The demo checks the library against the published test values, shows exactly where its check stops and the bank's code starts,
works out one code by hand, step by step, tries the other hashes and digit counts, builds the `otpauth://` link that a QR code carries to the phone, and ends with the list of things it does
not do.
"""
analogy = """
Think of a clerk who buys a ready-made stamp that prints a new number every thirty seconds. The stamp does its one job well. The clerk still has to decide
how many seconds either side of the number to accept, to remember which numbers were already used, to lock the stamp away, and to turn away
someone who keeps guessing. Buying the stamp does not change who has to do those.
"""
scenario = """
The online bank and its customer Dana from the plain version. The bank now lets java-otp make the codes and does the rest
itself. The demo follows the library through six questions: does it match the standard, how is a code made, what does it check, what else can it make, how does the secret get to
the phone, and what is left for the bank to write.
"""
costs = [
    "**The library checks one step only.** Its validation answers for the single time step that the given time falls in, so a window for slow or fast clocks is code you write.",
    "**No replay memory.** The same code is right twice within its step unless the bank remembers the last step it accepted.",
    "**No secret storage and no attempt limits.** The library takes a key from you and never sees a customer.",
    "**Settings that apps may ignore.** Other hashes and eight digits are valid TOTP, but some authenticator apps support only SHA-1, six digits and thirty seconds, so a bank that changes them must control the app.",
    "**A dependency to maintain.** It is small, and it still has to be kept up to date.",
]
too_much = """
A bank should not write its own HMAC and truncation: a library has been used and reviewed by many people. Writing the plain version once, to understand it, is
useful, and then production code should use a library. What matters is knowing the line between the two.
"""
met_before = [
    "`TimeBasedOneTimePasswordGenerator` and its equivalents in most languages: `pyotp` in Python, `otplib` in JavaScript, `rotp` in Ruby.",
    "The `otpauth://totp/...` text behind the QR code on a two-step sign-in setup page.",
    "Library documentation that says \"you are responsible for storing the secret and preventing replays\".",
    "Frameworks, such as Spring Security or Keycloak, that wrap a library like this and add the policy around it.",
]
where = """
This project is the sixth in [passwords-and-mfa](..), the library version of [totp-multi-factor](../totp-multi-factor).
"""
twin = """
The secrets are the public keys of the RFC test vectors, so the codes can be checked against the standards: they must
never protect a real account. Time is a number of seconds passed to the code, so every run prints the same digits. The
bank's window and replay memory are small classes kept in memory, which a real bank would keep in a shared store. Authenticator apps differ in what they
support, and the demo does not test any app.
"""
test_note = "The library's codes are tested against the published values of RFC 4226 (SHA-1, 10 values) and RFC 6238 (SHA-1, SHA-256 and SHA-512). Every line the demo prints is checked against `docs/expected-output.txt`."

[[act]]
title = "The library's codes, checked against the standard"
summary = "With the RFC test key, the library gives 755224, 287082, 359152 and 969429 for steps 0 to 3, and 287082 at time 59: the published values."
detail = """
Before: the inputs are the RFC's test key, 12345678901234567890, and a time in seconds since 1970. Time is cut into steps of 30 seconds, and each step has its
own code. After: the library gives 755224 for step 0, 287082 for step 1, 359152 for step 2 and 969429 for step 3. Time 59 is still in step 1, so it gives
287082 again, the value published in RFC 6238. A library that did not match the standard would be useless with real authenticator apps, so this is the first check.
"""
figure = "timeline"
figure_title = "One code per 30-second step"
figure_speech = """
First demo: are the library's codes right? [[slnc 400]] Before: the inputs. [[slnc 300]] The standard's own test key, the digits one to nine and zero, twice. [[slnc 300]] And a time, in seconds. [[slnc 600]]
After: the codes. [[slnc 300]] Time is cut into steps of thirty seconds, and each step has its own code. [[slnc 300]] Step zero gives seven five five, two two four. [[slnc 300]] Step one gives two eight seven, zero eight two. [[slnc 500]]
Time fifty nine is still inside step one, so it gives the same code. [[slnc 500]] These are the values published in the standard, R F C six two three eight.
"""
speech = """
The output: first the inputs, then one code per time, with its step.
"""
rows = { lib = "active ok" }
console = [
    ["BEFORE: THE INPUTS", "ok"],
    ["  key       12345678901234567890  (the RFC test key)", "muted"],
    ["  times     0, 30, 60, 90 and 59 seconds since 1970", "muted"],
    ["AFTER: THE LIBRARY'S CODES", "bad"],
    ["  time 0    step 0   755224", "muted"],
    ["  time 30   step 1   287082", "muted"],
    ["  time 60   step 2   359152", "muted"],
    ["  time 90   step 3   969429", "muted"],
    ["  time 59   step 1   287082  <- THE VALUE IN RFC 6238", "muted"],
]

[[act]]
title = "How the code at time 59 is made, step by step"
summary = "59 / 30 = step 1; HMAC-SHA1 of the 8-byte counter gives 20 bytes; the last half-byte b = 11 picks 4 bytes; without the top bit that is 1094287082, and its last 6 digits are 287082."
detail = """
The library hides how a code is made, so `TotpSteps` redoes it by hand. Step 1: 59 / 30 = 1, written as 8 bytes, 00000000 00000001. Step 2: HMAC-SHA1 of those
bytes with the secret key gives 20 bytes, 75a48a19 d4cbe100 644e8ac1 397eea74 7a2d33ab. Step 3: the last byte is ab; its last half-byte, b, is 11, so take the 4 bytes
starting at byte 11: c1397eea. Step 4: drop the top bit (so the number is never negative) and read it as a number, 1094287082, then keep the last 6 digits: 287082.
That is exactly the library's code, and a test checks it for many times. Without the key nobody can make the HMAC, so nobody can make the code.
"""
figure = "code_steps"
figure_title = "How 287082 is made"
figure_speech = """
So how is two eight seven, zero eight two made? [[slnc 400]] The library hides it, so a small class does it by hand, in four steps. [[slnc 600]]
Step one. [[slnc 300]] Fifty nine divided by thirty is one, dropping the remainder. [[slnc 300]] That step number is written as eight bytes: seven zeros, then a one. [[slnc 600]]
Step two. [[slnc 300]] H M A C mixes the secret key with those eight bytes, using S H A one. [[slnc 300]] Out come twenty bytes, which nobody can make without the key. [[slnc 600]]
Step three. [[slnc 300]] Look at the last byte, a b. [[slnc 300]] Its last half, b, is eleven. [[slnc 300]] So take four bytes, starting at byte eleven: c one, three nine, seven e, e a. [[slnc 600]]
Step four. [[slnc 300]] Drop the top bit, so the number is never negative, and read it as a number. [[slnc 300]] Keep the last six digits: two eight seven, zero eight two. [[slnc 300]] Exactly the library's code.
"""
speech = """
Here are the same four steps, printed by the program. [[slnc 300]] The last line checks the result against the library. [[slnc 200]] True.
"""
rows = { lib = "active ok" }
console = [
    ["STEP 1. THE TIME STEP = 59 / 30, AS 8 BYTES:", "amber"],
    ["  step      1", "muted"],
    ["  counter   00000000 00000001", "muted"],
    ["STEP 2. HMAC-SHA1(key, counter) = 20 BYTES:", "amber"],
    ["  hmac      75a48a19 d4cbe100 644e8ac1 397eea74 7a2d33ab", "muted"],
    ["STEP 3. TAKE 4 BYTES, FROM THE LAST HALF-BYTE ON:", "amber"],
    ["  last      ab, so offset 11", "muted"],
    ["  4 bytes   c1397eea", "muted"],
    ["STEP 4. DROP THE TOP BIT, KEEP THE LAST 6 DIGITS:", "amber"],
    ["  number    1094287082", "muted"],
    ["  code      287082", "muted"],
    ["the same code the library gave: true", "amber"],
]

[[act]]
title = "What the library checks, and what the bank adds"
summary = "The library accepts a code in its own step only; the bank's window of one step either side accepts it at time 65 and refuses it at time 95."
detail = """
The code 287082 was made at time 59, in step 1. Before: the library alone validates a code for one 30-second step only. It says true at times 59 and 40, both in step 1,
and false at time 65, in step 2. That is correct for a library, and too strict for a bank, because phone clocks drift and typing takes time. After: the bank wraps it in
a window of one step either side. At time 65 the bank says OK, and at time 95, in step 3, two steps on, it says WRONG_CODE. The window is the bank's code.
"""
figure = "window"
figure_title = "One step, or a window"
figure_speech = """
Third demo: what does the library check? [[slnc 400]] The code two eight seven, zero eight two was made at time fifty nine, in step one. [[slnc 600]]
Before: the library alone. [[slnc 300]] It accepts the code only in step one. [[slnc 300]] At time forty, and at fifty nine: true. [[slnc 300]] At sixty five, a few seconds later, in step two: false. [[slnc 600]]
That is too strict for a bank. [[slnc 300]] Phone clocks drift, and typing takes time. [[slnc 600]]
After: the bank's own window, one step either side. [[slnc 300]] At sixty five, the bank says O K. [[slnc 300]] At ninety five, two steps on, wrong code.
"""
speech = """
In the output: the library alone says true, true, false. [[slnc 300]] The bank's window says O K, then wrong code.
"""
rows = { lib = "active ok", check = "active ok" }
console = [
    ["BEFORE: THE LIBRARY ALONE", "ok"],
    ["  287082 at time 59, step 1: true", "muted"],
    ["  287082 at time 40, step 1: true", "muted"],
    ["  287082 at time 65, step 2: false  <- ONE STEP ONLY", "muted"],
    ["AFTER: THE BANK'S WINDOW OF 1 STEP EITHER SIDE", "bad"],
    ["  287082 at time 65, step 2: OK", "muted"],
    ["  287082 at time 95, step 3: WRONG_CODE", "muted"],
]

[[act]]
title = "Other hashes and longer codes"
summary = "SHA-1, SHA-256 and SHA-512 with 8 digits give 94287082, 46119246 and 90693936 at time 59, the RFC 6238 values."
detail = """
Before: the settings, at time 59. SHA-1 with a 20-byte key, SHA-256 with a 32-byte key and SHA-512 with a 64-byte key, all with 8 digits. After: 94287082, 46119246
and 90693936, the values in RFC 6238. The SHA-1 code is the number of act two with two more digits kept. This is what the standard allows; many authenticator apps
take only SHA-1, 6 digits and 30 seconds, so a bank that changes them must control the app, or test the ones its customers use.
"""
figure = "hashes"
figure_title = "Three hashes, eight digits"
figure_speech = """
Fourth demo: other hashes, and longer codes. [[slnc 400]] Before: the settings. [[slnc 300]] S H A one, S H A two fifty six, and S H A five twelve, each with a longer key, and eight digits. [[slnc 600]]
After: three codes, all equal to the values in the standard. [[slnc 300]] The S H A one code ends in two eight seven, zero eight two: the same number, with two more digits kept. [[slnc 600]]
But many authenticator apps take only S H A one, six digits, and thirty seconds. [[slnc 300]] So change these only if the bank controls the app.
"""
speech = """
The output: the settings, then the three codes.
"""
rows = { opts = "active ok" }
console = [
    ["BEFORE: THE SETTINGS, AT TIME 59", "ok"],
    ["  SHA-1     20-byte key, 8 digits", "muted"],
    ["  SHA-256   32-byte key, 8 digits", "muted"],
    ["  SHA-512   64-byte key, 8 digits", "muted"],
    ["AFTER: THE CODES", "bad"],
    ["  SHA-1     94287082", "muted"],
    ["  SHA-256   46119246", "muted"],
    ["  SHA-512   90693936", "muted"],
    ["all three are the values of RFC 6238", "amber"],
    ["many authenticator apps take only SHA-1, 6 digits, 30 seconds", "amber"],
]

[[act]]
title = "Giving the secret to the phone"
summary = "The bank puts its name, the account, the secret and the settings into one otpauth link; the QR code carries it, with the secret in Base32."
detail = """
Before: what the bank puts in: the issuer Example Bank, the account dana@example.com, the 20-byte secret and the settings SHA1, 6 digits, 30 seconds. After: one
`otpauth://` link, which the QR code carries: otpauth://totp/Example%20Bank:dana%40example.com?secret=GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ&issuer=Example%20Bank&algorithm=SHA1&digits=6&period=30.
The secret is written in Base32: each letter carries 5 bits, so 20 bytes (160 bits) become 32 letters. The app reads the link once and keeps the secret, which is
why the screen showing it must be private, and why it should be shown only once.
"""
figure = "otpauth"
figure_title = "The text in the QR code"
figure_speech = """
Fifth demo: how does the secret get onto the phone? [[slnc 400]] The bank shows a Q R code. [[slnc 600]]
Before: what the bank puts in. [[slnc 300]] Its name, Dana's account, the secret, and the settings. [[slnc 600]]
After: one link, that starts with o t p auth. [[slnc 300]] The secret is written in Base thirty two: capital letters, and the digits two to seven. [[slnc 300]] Each one carries five bits, so twenty bytes, a hundred and sixty bits, become thirty two letters. [[slnc 600]]
The app reads the link once, and keeps the secret. [[slnc 300]] So the screen must be private, and the secret shown only once.
"""
speech = """
The program prints the link one part per line. [[slnc 300]] In the Q R code, it is a single line.
"""
rows = { uri = "active ok" }
console = [
    ["BEFORE: WHAT THE BANK PUTS IN", "ok"],
    ["  issuer    Example Bank", "muted"],
    ["  account   dana@example.com", "muted"],
    ["  secret    12345678901234567890  (20 bytes)", "muted"],
    ["  settings  SHA1, 6 digits, 30 seconds", "muted"],
    ["AFTER: THE TEXT IN THE QR CODE", "bad"],
    ["  otpauth://totp/Example%20Bank:dana%40example.com", "muted"],
    ["    ?secret=GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ", "muted"],
    ["    &issuer=Example%20Bank", "muted"],
    ["    &algorithm=SHA1&digits=6&period=30", "muted"],
    ["Base32: 20 bytes = 160 bits = 32 letters of 5 bits each", "amber"],
    ["the app keeps the secret: show it once, in private", "amber"],
]

[[act]]
title = "The bill: what the library does not do"
summary = "With the library alone the same code logs in twice; with the bank's memory of the last step the second use is REPLAYED; secrets, wrong-code counts and limits are all the bank's."
detail = """
Before the fix: with the library alone, a login with 287082 at time 59 is OK, and the same code at time 64 is OK again: a code used twice. After the fix: the bank
remembers, for each customer, the last step it accepted, so the second use is REPLAYED. And the library keeps no secrets, counts no wrong codes and limits no attempts.
Those, and the choice of window, are the bank's to write, and to test.
"""
figure = "replay"
figure_title = "The same code, twice"
figure_speech = """
Last demo: the bill. [[slnc 400]] Before the fix: the library alone. [[slnc 300]] Dana logs in at time fifty nine: O K. [[slnc 300]] Someone who saw the code uses it again at sixty four: O K too. [[slnc 300]] The same code, used twice. [[slnc 600]]
After the fix: the bank remembers the last step it accepted, for each customer. [[slnc 300]] So the second login is refused, as replayed. [[slnc 600]]
And the library stores no secrets, counts no wrong codes, and limits no attempts. [[slnc 300]] Those are the bank's to write, and to test.
"""
speech = """
In the output: before the fix, O K twice. [[slnc 300]] After the fix, O K, then replayed.
"""
rows = { check = "active amber", lib = "active amber" }
console = [
    ["BEFORE THE FIX: THE LIBRARY ALONE", "ok"],
    ["  login at time 59 with 287082: OK", "muted"],
    ["  login at time 64 with 287082: OK  <- USED TWICE", "muted"],
    ["AFTER THE FIX: THE BANK REMEMBERS THE LAST STEP", "bad"],
    ["  login at time 59 with 287082: OK", "muted"],
    ["  login at time 64 with 287082: REPLAYED", "muted"],
    ["still the bank's to write: secret storage, wrong-code counts,", "amber"],
    ["attempt limits, and the choice of window", "amber"],
]

