[project]
slug = "totp-multi-factor-with-java-otp"
module = "passwords-and-mfa"
title = "One-Time Codes with the java-otp Library"
short_title = "One-Time Codes with java-otp"
package = "totpotp"
main_class = "OtpLibraryDemo"
tagline = "Let a library make the code, and write the rest yourself"
bold = "A library makes the same one-time codes as the hand-written version and checks one time step, but the window, the replay memory, the secrets and the attempt limits are still the bank's to write."
domain = "an online bank"
domain_note = ""
youtube_description = """One-time codes with the java-otp library, in Java: a library can make the six-digit code for you and check it for one time step, but a bank still has to decide the rest. Explained with an online bank, like a clerk who buys a ready-made stamp but still has to decide who may use it and how often. We check the library's codes against the values published in RFC 4226 and RFC 6238, see that it validates only a single step so the window is written by the bank, try SHA-256 and SHA-512 and eight digits, build the otpauth link a QR code carries, and finish with the bill: the library keeps no replay memory, no secrets and no attempt limits."""
thumb_lines = ["ONE-TIME CODES", "WITH JAVA-OTP"]
thumb_code = "validateOneTimePassword"
youtube_title = "One-Time Codes (TOTP) with the java-otp Library"
youtube_tags = ["totp", "java-otp", "otpauth", "two-factor authentication", "one-time password", "rfc 6238", "java", "cybersecurity for beginners"]

[readme]
intro = """
The plain version of this lesson built the one-time code by hand from HMAC, so the recipe was visible. Most applications
use a library instead. This project uses **java-otp**, a small open-source library with one class for the time-based code,
`TimeBasedOneTimePasswordGenerator`. Given a secret key and a time, it makes the code. Given a code, it can say whether it
is right for one time step. And that is all. The rest of what a bank needs is still written by the bank: a window of steps for clocks that are
a little out, a memory so a code cannot be used twice, secure storage for secrets, and limits on wrong guesses.

The demo checks the library against the published test values, shows exactly where its check stops and the bank's code starts,
tries the other hashes and digit counts, builds the `otpauth://` link that a QR code carries to the phone, and ends with the list of things it does
not do.
"""
analogy = """
Think of a clerk who buys a ready-made stamp that prints a new number every thirty seconds. The stamp does its one job well. The clerk still has to decide
how many seconds either side of the number to accept, to remember which numbers were already used, to lock the stamp away, and to turn away
someone who keeps guessing. Buying the stamp does not change who has to do those.
"""
scenario = """
The online bank and its customer Dana from the plain version. The bank now lets java-otp make the codes and does the rest
itself. The demo follows the library through five questions: does it match the standard, what does it check, what else can it make, how does the secret get to
the phone, and what is left for the bank to write.
"""
costs = [
    "**The library checks one step only.** Its validation answers for the single time step that the given time falls in, so a window for slow or fast clocks is code you write.",
    "**No replay memory.** The same code is right twice within its step unless the bank remembers the last step it accepted.",
    "**No secret storage and no attempt limits.** The library takes a key from you and never sees a customer.",
    "**Settings that apps may ignore.** Other hashes and eight digits are valid TOTP, but some authenticator apps support only SHA-1, six digits and thirty seconds, so a bank that changes them must control the app.",
    "**A dependency to maintain.** It is small, and it still has to be kept up to date.",
]
too_much = """
A bank should not write its own HMAC and truncation: a library has been used and reviewed by many people. Writing the plain version once, to understand it, is
useful, and then production code should use a library. What matters is knowing the line between the two.
"""
met_before = [
    "`TimeBasedOneTimePasswordGenerator` and its equivalents in most languages: `pyotp` in Python, `otplib` in JavaScript, `rotp` in Ruby.",
    "The `otpauth://totp/...` text behind the QR code on a two-step sign-in setup page.",
    "Library documentation that says \"you are responsible for storing the secret and preventing replays\".",
    "Frameworks, such as Spring Security or Keycloak, that wrap a library like this and add the policy around it.",
]
where = """
This project is the sixth in [passwords-and-mfa](..), the library version of [totp-multi-factor](../totp-multi-factor).
"""
twin = """
The secrets are the public keys of the RFC test vectors, so the codes can be checked against the standards: they must
never protect a real account. Time is a number of seconds passed to the code, so every run prints the same digits. The
bank's window and replay memory are small classes kept in memory, which a real bank would keep in a shared store. Authenticator apps differ in what they
support, and the demo does not test any app.
"""
test_note = "The library's codes are tested against the published values of RFC 4226 (SHA-1, 10 values) and RFC 6238 (SHA-1, SHA-256 and SHA-512). Every line the demo prints is checked against `docs/expected-output.txt`."

[[act]]
title = "The library makes the same codes as the hand-written version"
summary = "The library gives 755224, 287082, 359152 and 969429 for steps 0 to 3, and 287082 at time 59: the values in the RFCs."
detail = """
The library's generator, given the RFC's key and the times 0, 30, 60 and 90, gives 755224, 287082, 359152 and 969429. These are the same codes as the
hand-written version printed, and the values published in RFC 4226. At time 59 the code is 287082. A library that did not match the standard would be useless
with real authenticator apps, so checking it against the published values is the first thing to do.
"""
speech = """
First demo: the library makes the same codes. [[slnc 400]] The library's generator is given the standard's test key, and the times zero, thirty, sixty, and ninety. [[slnc 600]]
It gives seven five five two two four, two eight seven zero eight two, three five nine one five two, and nine six nine four two nine. [[slnc 300]] The same codes as the hand written version. [[slnc 300]] And the values in the standard. [[slnc 600]]
At time fifty nine, the code is two eight seven zero eight two. [[slnc 600]]
A library that did not match the standard would be useless with real authenticator apps. [[slnc 300]] So this is the first thing to check.
"""
rows = { lib = "active ok" }
console = [
    ["codes for steps 0 to 3, at times 0, 30, 60 and 90: 755224, 287082, 359152, 969429", "ok"],
    ["at time 59 the code is 287082  <- THE VALUE IN RFC 4226 AND 6238", "ok"],
]

[[act]]
title = "What the library checks, and what it leaves to the bank"
summary = "The library validates a code for one step only; the bank's own window of 1 accepts it one step later and refuses it two steps on."
detail = """
The library can validate a code, but only for the single 30-second step that the given time is in. Code 287082 is right at time 59, in step 1, and at
time 40, also step 1. At time 65, which is step 2, the library says false. That is correct for a library, and too strict for a bank, because phone clocks drift. So the
bank wraps it in a window of one step either side: at time 65 the bank accepts the code, and at time 95, in step 3, two steps on, it is refused.
"""
speech = """
Second demo: what the library checks. [[slnc 400]] The library can validate a code, but only for one thirty second step. [[slnc 600]]
The code two eight seven zero eight two is right at time fifty nine, in step one. [[slnc 300]] It is also right at time forty, still step one. [[slnc 600]]
At time sixty five, which is step two, the library says no. [[slnc 300]] That is correct for a library. [[slnc 300]] But too strict for a bank, because phone clocks drift. [[slnc 600]]
So the bank wraps it in a window of one step either side. [[slnc 300]] At time sixty five, the bank accepts. [[slnc 300]] At time ninety five, two steps on, it refuses.
"""
rows = { lib = "active ok", check = "active ok" }
console = [
    ["the library says 287082 is right at time 59, in step 1: true", "ok"],
    ["the library says 287082 is right at time 40, also step 1: true", "ok"],
    ["the library says 287082 is right at time 65, in step 2: false  <- ONE STEP ONLY", "amber"],
    ["the bank's own window of 1 accepts it at time 65: OK", "ok"],
    ["and refuses it two steps on, at time 95, in step 3: WRONG_CODE", "ok"],
]

[[act]]
title = "Other hashes and longer codes"
summary = "SHA-1, SHA-256 and SHA-512 with 8 digits give 94287082, 46119246 and 90693936 at time 59, the RFC 6238 values."
detail = """
The library can use HMAC with SHA-1, SHA-256 or SHA-512, and codes of other lengths. At time 59, with 8 digits, SHA-1 gives 94287082, SHA-256 gives
46119246 and SHA-512 gives 90693936, which are the values in RFC 6238. This is what the standard allows. What a customer's phone supports is another matter, because some
authenticator apps ignore these settings and use SHA-1, 6 digits and 30 seconds. A bank that changes them must control the app, or test the ones its customers use.
"""
speech = """
Third demo: other hashes, and longer codes. [[slnc 400]] The library can use S H A one, S H A two fifty six, or S H A five twelve, and codes of other lengths. [[slnc 600]]
At time fifty nine, with eight digits, S H A one gives nine four two eight seven zero eight two. [[slnc 300]] S H A two fifty six gives four six one one nine two four six. [[slnc 300]] S H A five twelve gives nine zero six nine three nine three six. [[slnc 300]] All three are the values in the standard. [[slnc 600]]
What a customer's phone supports is another matter. [[slnc 300]] Some authenticator apps ignore these settings, and use S H A one, six digits, and thirty seconds. [[slnc 300]] A bank that changes them must control the app, or test the ones its customers use.
"""
rows = { opts = "active ok" }
console = [
    ["SHA-1, 8 digits, at time 59: 94287082", "ok"],
    ["SHA-256, 8 digits, at time 59: 46119246", "ok"],
    ["SHA-512, 8 digits, at time 59: 90693936", "ok"],
    ["all three are the values of RFC 6238", "muted"],
    ["some authenticator apps ignore these settings and use SHA-1, 6 digits, 30 seconds", "amber"],
]

[[act]]
title = "Giving the secret to the phone"
summary = "The QR code carries an otpauth link with the issuer, the account, the Base32 secret and the settings; the app reads it once and keeps the secret."
detail = """
How does the secret get onto the phone? The bank shows a QR code. It is a picture of text: an `otpauth://` link holding the issuer, the account, the secret in
Base32, the hash, the number of digits and the period. For the demo's key it reads otpauth://totp/Example%20Bank:dana%40example.com?secret=GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ&issuer=Example%20Bank&algorithm=SHA1&digits=6&period=30.
The app reads it once and keeps the secret, which is why the screen showing it must be private, and why it should be shown once.
"""
speech = """
Fourth demo: giving the secret to the phone. [[slnc 400]] The bank shows a picture, called a Q R code. [[slnc 300]] It is a picture of text. [[slnc 600]]
The text is a link that starts with o t p auth. [[slnc 300]] It holds the name of the bank, the account, the secret in Base thirty two, the hash, the number of digits, and the period. [[slnc 600]]
The app reads it once, and keeps the secret. [[slnc 300]] That is why the screen must be private, and why the secret should be shown only once.
"""
rows = { uri = "active ok" }
console = [
    ["the QR code carries this text:", "muted"],
    ["otpauth://totp/Example%20Bank:dana%40example.com?secret=GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ&issuer=Example%20Bank&algorithm=SHA1&digits=6&period=30", "ok"],
    ["the app reads it once and keeps the secret, which is why the screen must be private", "amber"],
]

[[act]]
title = "The bill: what the library does not do"
summary = "The library alone accepts the same code twice; the bank's own memory of the last step refuses the second use; secrets, wrong-code counts and limits are all the bank's."
detail = """
With the library alone, the same code works twice. A first login with 287082 at time 59 is OK, and a second at time 64 is also OK. That is not the library's job. The
bank's own memory of the last accepted step makes the second use REPLAYED. And the library keeps no secrets, counts no wrong codes and limits no attempts. The window, the
replay memory, secure storage of the secrets, and the limits on guessing are the bank's to write, and to test.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] With the library alone, the same code works twice. [[slnc 300]] The first login is accepted. [[slnc 300]] The second, a few seconds later, is accepted too. [[slnc 300]] That is not the library's job. [[slnc 600]]
The bank's own memory of the last accepted step makes the second use refused. [[slnc 600]]
And the library keeps no secrets. [[slnc 300]] It counts no wrong codes. [[slnc 300]] It limits no attempts. [[slnc 600]]
Those, and the choice of the window, are the bank's to write, and to test.
"""
rows = { check = "active amber", lib = "active amber" }
console = [
    ["the library alone, the same code twice: OK, OK  <- NOT THE LIBRARY'S JOB", "bad"],
    ["with the bank's own memory of the last step: OK, REPLAYED", "ok"],
    ["the library keeps no secrets, counts no wrong codes and limits no attempts", "amber"],
    ["those, and the choice of window, are the bank's to write and to test", "amber"],
]

