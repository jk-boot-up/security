[poster]
headline = [["RATE LIMITING", "text"], ["WITH NGINX", "accent"]]
taglines = [["A real limit, and the key that decides it", "gold"]]
before = { code = "key = X-Forwarded-For", note = "the attacker picks the key", tag = "BEFORE" }
after = { code = "key = $binary_remote_addr", note = "the real address decides", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "Password Attacks and Defences with nginx"
narration = """Hello, and welcome. [[slnc 400]] This video explains rate limiting a login with nginx, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A rate limit turns away requests that arrive too fast. [[slnc 300]] nginx is a web server that often sits in front of an application, and can do this before the request reaches it. [[slnc 300]] It keeps a count for each key, and when a key is over its limit, it answers with an H T T P status, four twenty nine, too many requests. [[slnc 300]] H T T P is the Hypertext Transfer Protocol, the language of the web. [[slnc 600]] Think of a door guard at a bank, who allows each visitor six entries an hour. [[slnc 300]] If the guard recognises faces, a thief is held to six. [[slnc 300]] If the guard trusts the name a visitor gives, the thief gives a new name every time, and walks in twenty times. [[slnc 300]] The rule was fine. [[slnc 300]] What the guard counted was wrong. [[slnc 700]] In this video, the domain is an online bank, whose login runs behind a real nginx, inside a Docker container."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online bank's login, behind nginx.", "", "Twenty guesses at Dana's account.", "Sent as fast as one machine can.", "", "Five ways to count them."]
narration = """Here is the scenario. [[slnc 400]] An online bank's login sits behind nginx. [[slnc 500]] Twenty guesses at Dana's account arrive from one machine, as fast as it can send them. [[slnc 500]] The login itself is a stub, that says four oh one, wrong password, to every guess. [[slnc 300]] So only the limit decides what the attacker sees. [[slnc 600]] The bank tries five ways of counting."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["limit_req: nginx's rate limit", "Key: what the count is kept for", "Excess: the count for one key", "Burst: extra requests allowed at once", "429: too many requests"]
narration = """Before the demos, the words. [[slnc 500]] Limit req is nginx's rate limit. [[slnc 500]] The key is what the count is kept for. [[slnc 300]] An address, a header, or a username. [[slnc 500]] The excess is the count nginx keeps for one key. [[slnc 500]] The burst is how many extra requests are allowed at once. [[slnc 500]] And four twenty nine is the answer that means, too many requests."""

[[scene]]
key = "03-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "04-keys"
kind = "figure"
title = "One request, three possible keys"
body = "key_choice"
narration = """Let's start with one real request. [[slnc 400]] On the left, in green, the request. [[slnc 300]] A guess at Dana's login, sent with the H T T P method POST, to slash login, with user equals Dana. [[slnc 300]] It also carries a header, X Forwarded For, ten dot zero dot zero dot seven, which the attacker wrote. [[slnc 600]] On the right, three things nginx could count. [[slnc 400]] The connection's own I P address, which the network decides. [[slnc 300]] The header, which the client writes. [[slnc 300]] And the username, which the client names. [[slnc 600]] Below, in red, the response. [[slnc 300]] nginx keeps one count for each value of the key. [[slnc 300]] With room left, the request is passed on, and the login says four oh one. [[slnc 300]] With no room left, nginx itself says four twenty nine. [[slnc 600]] The rule is the same in every demo. [[slnc 300]] Only the key changes."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "11-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["A 429 Too Many Requests page", "limit_req_zone in a config", "Rate limits in API documentation", "Never trust X-Forwarded-For"]
narration = """You have probably met these already. [[slnc 400]] A page that says too many requests, try again later, is a four twenty nine. [[slnc 500]] The lines limit req zone and limit req appear in many nginx configurations. [[slnc 500]] Many A P Is document their rate limits. [[slnc 500]] And the advice, never trust X Forwarded For, is the third demo."""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Limit at the front door", "Key: the real connection address", "Overwrite X-Forwarded-For at your own proxy", "Per-username only beside it, with care", "Keep lockout, second factor, breach check"]
narration = """So, how do you use it? [[slnc 400]] Put a rate limit at the front door. [[slnc 500]] Key it on the real connection address, which the client cannot choose. [[slnc 500]] Make your own proxy overwrite the forwarded header, instead of passing on what the client sent. [[slnc 500]] Add a limit per username only beside it, knowing it can lock the owner out. [[slnc 500]] And keep the lockout, the second factor, and the breach check behind it, from the earlier video."""

[[scene]]
key = "13-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "14-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Change the burst to two", "and predict the counts first."]
narration = """That's rate limiting a login with nginx. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] A rate limit is only as good as the key it counts, and a key the attacker can choose is no limit at all. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It needs a J D K, and a running Docker. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Change the burst to two, and predict the counts before you run the demo. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
The front door of an online bank's login: an nginx container with a request limit, and the login stub behind it. It covers
which key the limit counts, how an attacker can avoid the limit, and what the limit does to a real customer. It does not cover the password check itself, TLS
or the rest of the bank.
"""
assets = [
    "Customers' accounts, which guessing targets.",
    "The availability of login to the real customer.",
    "The login service, which should not be asked more often than needed.",
    "The limit's own state: the count for each key.",
]
actors = [
    "An attacker with one machine, sending guesses as fast as possible.",
    "An attacker who writes request headers and chooses usernames.",
    "A real customer, logging in from their own address.",
    "The operator, who writes the nginx configuration.",
]
boundaries = [
    "Internet to nginx: the line where the limit decides.",
    "nginx to the login: only requests within the limit cross it.",
    "Client-written headers to the key: a header must not become a key unless a trusted proxy set it.",
]
assumptions = [
    "nginx sees the real client address. In the demo it sees the Docker network's address, which stands for one attacker.",
    "In a real deployment behind a trusted proxy, only that proxy can set the forwarded header, and it overwrites what clients send.",
    "The rate is deliberately slow here, so counts are repeatable.",
]
out_of_scope = [
    "TLS, timeouts, logging and the rest of a production nginx configuration.",
    "Distributed attackers with many real addresses.",
    "Checking the password: the plain password-attacks-and-defences project does that.",
]
tests = [
    "`NginxConfigTest` checks the generated configurations, including the key, the burst and that `limit_req` sits beside `proxy_pass`.",
    "`LeakyBucketTest` checks that the hand-made rule gives the counts of the golden output: 1 plus the burst for one key, every guess for a new key each time.",
    "`ReferenceConfigTest` checks that `infra/nginx-limit-by-address.conf` is what the code generates.",
    "`NginxContainerTest` (tagged `docker`) starts real containers and checks the counts for all five keys and the golden output.",
]
next = """
The next project, totp-multi-factor, builds the second factor that makes a guessed password not enough.
"""

[[threat]]
id = "T1"
stride = "S"
threat = "Guessing at the login with no limit"
where = "nginx in act one"
control = "limit_req keyed on the real connection address: one plus the burst gets through"
residual = "An attacker with many real addresses has many buckets"

[[threat]]
id = "T2"
stride = "S"
threat = "The limit is bypassed by changing a header the limit counts"
where = "`NginxConfig.Key.FORWARDED_HEADER`"
control = "Key on the connection address; behind a proxy, take it from a header only that proxy sets"
residual = "A misconfigured proxy can bring the problem back"

[[threat]]
id = "T3"
stride = "S"
threat = "A spray of many usernames never fills a per-username bucket"
where = "`NginxConfig.Key.USERNAME`"
control = "Add a limit per address beside it"
residual = "A spray from many addresses still gets through"

[[threat]]
id = "T4"
stride = "D"
threat = "A per-username limit turns away the real owner while an attacker fills the bucket"
where = "`NginxConfig.Key.USERNAME`"
control = "Prefer the address key, or accept the cost knowingly"
residual = "Any key that an outsider can fill can be used to deny service"

[[threat]]
id = "T5"
stride = "D"
threat = "Many customers behind one shared address share one bucket"
where = "the limit zone"
control = "None here"
residual = "Tune the rate to the traffic, or key on a combination of signals"

[[threat]]
id = "T6"
stride = "E"
threat = "The login is reachable without passing the limit"
where = "the port of the login stub"
control = "The stub listens inside the container only; the demo publishes only port 80"
residual = "In a real system the application must not be directly reachable from outside nginx"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] Five small classes. [[slnc 300]] Here is what each one does."""

[[class]]
name = "NginxAttacksDemo"
what = "runs the five acts"
[[class.part]]
title = "one act: start nginx, then attack"
code = """
try (Nginx nginx = Nginx.start(
        NginxConfig.text(NginxConfig.Key.FORWARDED_HEADER, RATE, BURST))) {
    Tally t = new Attacker(nginx.port())
            .run(ATTEMPTS, i -> "dana", i -> "10.0.0." + i);   // new header each time
"""
speech = """Nginx attacks demo runs the five acts. [[slnc 300]] Each act starts a fresh nginx with one key, here the forwarded header. [[slnc 300]] Then the attacker sends twenty guesses, with a new header value every time."""

[[class]]
name = "NginxConfig"
what = "writes nginx's configuration for one key"
[[class.part]]
title = "the key, and the two limit lines"
code = """
ADDRESS("$binary_remote_addr"),
...
FORWARDED_HEADER("$http_x_forwarded_for"),
...
USERNAME("$arg_user");
...
conf.append("  limit_req_zone ").append(key.variable())
        .append(" zone=login:1m rate=").append(rate).append(";\\n");
...
conf.append("      limit_req zone=login burst=").append(burst).append(" nodelay;\\n");
conf.append("      limit_req_status 429;\\n");
"""
speech = """Nginx config writes the configuration. [[slnc 300]] Each key names the nginx variable that is counted: the connection address, the header, or the user in the request. [[slnc 300]] The zone line sets the key and the rate. [[slnc 300]] The limit line sets the burst, and answers four twenty nine."""

[[class]]
name = "Nginx"
what = "one real nginx, in a Docker container"
[[class.part]]
title = "start a pinned image with that file"
code = """
public static final String IMAGE = "nginx:1.31.7-alpine";
...
run(List.of("docker", "run", "-d", "--rm", "--name", name, "-p", "127.0.0.1::80",
        "-v", conf + ":/etc/nginx/nginx.conf:ro", IMAGE));
"""
speech = """Nginx starts a real container, from an image pinned to one exact version. [[slnc 300]] The generated file is mounted as nginx's configuration, and the container is stopped after the act."""

[[class]]
name = "Attacker"
what = "sends the guesses, counts 401 and 429"
[[class.part]]
title = "one guess, and the count"
code = """
if (forwardedFor != null) {
    request.header("X-Forwarded-For", forwardedFor);   // the attacker writes it
}
...
if (status == 401) {
    answered++;
} else if (status == 429) {
    refused++;
"""
speech = """The attacker sends each guess as an H T T P POST. [[slnc 300]] It writes the forwarded header itself, when an act asks for one. [[slnc 300]] Four oh one counts as answered, four twenty nine as refused, and the tally holds both numbers."""

[[class]]
name = "LeakyBucket"
what = "nginx's rule, redone by hand"
[[class.part]]
title = "the excess for one key"
code = """
long now = 0;                                         // a new key starts empty
if (before != null) {
    long drained = perMinute * 1000 * (millis - lastMillis.get(key)) / 60_000;
    now = Math.max(0, before - drained) + 1000;      // drain, then add this guess
}
if (now > burst * 1000) {
    return false;                                     // over the burst: 429
"""
speech = """Leaky bucket redoes nginx's rule by hand, counting in thousandths, as nginx does. [[slnc 300]] A new key starts at zero. [[slnc 300]] Each guess drains what the rate allows, then adds one. [[slnc 300]] Over the burst is refused. [[slnc 300]] Its test gives the same counts as the real nginx."""

