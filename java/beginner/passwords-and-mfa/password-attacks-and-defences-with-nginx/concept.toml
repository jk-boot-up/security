key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online bank's login, behind nginx.", "", "Twenty guesses at Dana's account.", "Sent as fast as one machine can.", "", "Five ways to count them."]
narration = """Here is the scenario. [[slnc 400]] An online bank's login sits behind nginx. [[slnc 500]] Twenty guesses at Dana's account arrive from one machine, as fast as it can send them. [[slnc 500]] The login itself is a stub, that says four oh one to every password. [[slnc 300]] So only the limit decides what the attacker sees. [[slnc 600]] The bank tries five ways of counting."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["limit_req: nginx's rate limit", "Zone: a count of requests for each key", "Key: what the count is kept for", "Burst: extra requests allowed at once", "429: too many requests"]
narration = """Before the demos, the words. [[slnc 500]] Limit req is nginx's rate limit. [[slnc 500]] A zone is a count of requests for each key. [[slnc 500]] The key is what the count is kept for. [[slnc 300]] An address, a header, or a username. [[slnc 500]] The burst is how many extra requests are allowed at once. [[slnc 500]] And four twenty nine is the answer that means, too many requests."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "09-keys"
kind = "bullets"
title = "Choosing the Key"
body = ["Real connection address: the client cannot choose it", "A client-written header: the client chooses it", "Username: locks the owner, misses a spray", "", "Layer them. Take the address from your own proxy."]
narration = """Let's put the keys side by side. [[slnc 400]] The real connection address is a good key, because the client cannot choose it. [[slnc 500]] A header the client writes is a bad key, because the client chooses it. [[slnc 500]] The username locks the owner out, and misses a spray. [[slnc 600]] So, count the real address, and add a gentle limit per username only with care. [[slnc 300]] And behind a proxy, take the address from a header that only your own proxy sets."""

[[scene]]
key = "10-roles"
kind = "bullets"
title = "Who Does What"
body = ["NginxConfig: writes the configuration", "Nginx: starts and stops the container", "Attacker: sends guesses, counts answers", "Tally: answered and refused", "Login stub: always says 401"]
narration = """Here is who does what in the code. [[slnc 400]] Nginx config writes the configuration for each act. [[slnc 500]] Nginx starts a container with that configuration, and stops it afterwards. [[slnc 500]] The attacker sends guesses, and counts the answers. [[slnc 500]] The tally holds how many were answered and how many refused. [[slnc 300]] And the login stub inside nginx says four oh one to every password."""

[[scene]]
key = "11-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["A 429 Too Many Requests page", "limit_req_zone in a config", "Rate limits in API documentation", "Never trust X-Forwarded-For"]
narration = """You have probably met these already. [[slnc 400]] A page that says too many requests, with a note to try again later, is a four twenty nine. [[slnc 500]] The lines limit req zone and limit req appear in many nginx configurations. [[slnc 500]] Many programming interfaces document their rate limits. [[slnc 500]] And the advice, never trust X Forwarded For, is the third demo."""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Limit at the front door", "Key: the real connection address", "Overwrite X-Forwarded-For at your own proxy", "Keep lockout, second factor, breach check"]
narration = """So, how do you use it? [[slnc 400]] Put a rate limit at the front door. [[slnc 500]] Key it on the real connection address. [[slnc 500]] Make your own proxy overwrite the forwarded header, instead of passing on what the client sent. [[slnc 500]] And keep the lockout, the second factor, and the breach check behind it, from the earlier video."""

[[scene]]
key = "13-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Change the burst to two", "and predict the counts first."]
narration = """That's rate limiting a login with nginx. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] A rate limit is only as good as the key it counts, and a key the attacker can choose is no limit at all. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It needs a Java development kit, and a running Docker. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Change the burst to two, and predict the counts before you run the demo. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
The front door of an online bank's login: an nginx container with a request limit, and the login stub behind it. It covers
which key the limit counts, how an attacker can avoid the limit, and what the limit does to a real customer. It does not cover the password check itself, TLS
or the rest of the bank.
"""
assets = [
    "Customers' accounts, which guessing targets.",
    "The availability of login to the real customer.",
    "The login service, which should not be asked more often than needed.",
    "The limit's own state: the count for each key.",
]
actors = [
    "An attacker with one machine, sending guesses as fast as possible.",
    "An attacker who writes request headers and chooses usernames.",
    "A real customer, logging in from their own address.",
    "The operator, who writes the nginx configuration.",
]
boundaries = [
    "Internet to nginx: the line where the limit decides.",
    "nginx to the login: only requests within the limit cross it.",
    "Client-written headers to the key: a header must not become a key unless a trusted proxy set it.",
]
assumptions = [
    "nginx sees the real client address. In the demo it sees the Docker network's address, which stands for one attacker.",
    "In a real deployment behind a trusted proxy, only that proxy can set the forwarded header, and it overwrites what clients send.",
    "The rate is deliberately slow here, so counts are repeatable.",
]
out_of_scope = [
    "TLS, timeouts, logging and the rest of a production nginx configuration.",
    "Distributed attackers with many real addresses.",
    "Checking the password: the plain password-attacks-and-defences project does that.",
]
tests = [
    "`NginxConfigTest` checks the generated configurations, including the key, the burst and that `limit_req` sits beside `proxy_pass`.",
    "`ReferenceConfigTest` checks that `infra/nginx-limit-by-address.conf` is what the code generates.",
    "`NginxContainerTest` (tagged `docker`) starts real containers and checks the counts for all five keys and the golden output.",
]
next = """
The next project, totp-multi-factor, builds the second factor that makes a guessed password not enough.
"""

[[threat]]
id = "T1"
stride = "S"
threat = "Guessing at the login with no limit"
where = "nginx in act one"
control = "limit_req keyed on the real connection address: one plus the burst gets through"
residual = "An attacker with many real addresses has many buckets"

[[threat]]
id = "T2"
stride = "S"
threat = "The limit is bypassed by changing a header the limit counts"
where = "`NginxConfig.Key.FORWARDED_HEADER`"
control = "Key on the connection address; behind a proxy, take it from a header only that proxy sets"
residual = "A misconfigured proxy can bring the problem back"

[[threat]]
id = "T3"
stride = "S"
threat = "A spray of many usernames never fills a per-username bucket"
where = "`NginxConfig.Key.USERNAME`"
control = "Add a limit per address beside it"
residual = "A spray from many addresses still gets through"

[[threat]]
id = "T4"
stride = "D"
threat = "A per-username limit turns away the real owner while an attacker fills the bucket"
where = "`NginxConfig.Key.USERNAME`"
control = "Prefer the address key, or accept the cost knowingly"
residual = "Any key that an outsider can fill can be used to deny service"

[[threat]]
id = "T5"
stride = "D"
threat = "Many customers behind one shared address share one bucket"
where = "the limit zone"
control = "None here"
residual = "Tune the rate to the traffic, or key on a combination of signals"

[[threat]]
id = "T6"
stride = "E"
threat = "The login is reachable without passing the limit"
where = "the port of the login stub"
control = "The stub listens inside the container only; the demo publishes only port 80"
residual = "In a real system the application must not be directly reachable from outside nginx"
