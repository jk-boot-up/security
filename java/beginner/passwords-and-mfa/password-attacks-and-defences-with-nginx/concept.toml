narration = """Hello, and welcome. [[slnc 400]] This video explains rate limiting a login with nginx, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A rate limit turns away requests that arrive too fast. [[slnc 300]] nginx is a web server that often sits in front of an application, and can do this before the request reaches the application. [[slnc 300]] It counts requests for each key, and answers four twenty nine, too many requests, when a key is over its limit. [[slnc 600]] Think of a door guard at a bank. [[slnc 300]] The guard allows each visitor six entries an hour. [[slnc 300]] If the guard recognises visitors by their face, a thief is held to six. [[slnc 300]] If the guard asks for a name and trusts the answer, the thief gives a new name every time, and walks in twenty times. [[slnc 300]] The rule was fine. [[slnc 300]] What the guard counted was wrong. [[slnc 700]] In this video, the domain is an online bank. [[slnc 300]] Its login runs behind a real nginx, inside a Docker container. [[slnc 500]] By the end, you will hear what a limit counts, which counts work, and which do not."""

