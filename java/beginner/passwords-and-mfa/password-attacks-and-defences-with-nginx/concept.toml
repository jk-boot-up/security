# concept.toml: everything about this project that is not Java code.
# tools/conceptkit turns it into the README, docs, diagrams, animation and video scenes.
# Written for a beginner: plain words, short sentences, every term explained the first time.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "password-attacks-and-defences-with-nginx"
module = "passwords-and-mfa"
title = "Password Attacks and Defences with nginx"
short_title = "Password Attacks and Defences with nginx"
package = "attacksnginx"
main_class = "NginxAttacksDemo"
tagline = "A real rate limit, and the key that decides it"
bold = "nginx can rate-limit a login before it reaches the application, but the limit is only as good as the key it counts, and a key the attacker can choose is no limit at all."
domain = "an online bank"
domain_note = ""
youtube_description = """Password attacks and defences with nginx, in Java: a rate limit is a bouncer at the door, and what it counts decides whether it works. Explained with an online bank's login behind a real nginx container, like a door guard who counts visitors by their face and not by the name they give. We send twenty guesses at the login with no limit, then with limit_req keyed on the client's address, then keyed on an X-Forwarded-For header the attacker writes, then on the real address again, and finish with the bill: a limit per username locks the owner out too, and a spray of different usernames never reaches it."""
thumb_lines = ["RATE LIMITING", "WITH NGINX"]
thumb_code = "limit_req zone=login"
youtube_title = "Rate Limiting a Login with nginx"
youtube_tags = ["nginx", "rate limiting", "limit_req", "brute force", "x-forwarded-for", "password attacks", "docker", "java", "cybersecurity for beginners"]

[readme]
technologies = [["nginx (container image)", "nginx:1.31.6-alpine", "the web server and rate limiter in front of the login, pinned to an exact version"], ["Docker", "any recent Docker Engine or Docker Desktop", "runs the nginx container for the demo and the container tests"]]
intro = """
The plain version of this lesson modelled a bank's login with a clock made of ticks. This project puts a real piece of software in
front of the login: **nginx**, a web server that is very often the first thing a request meets. Its `limit_req` directive keeps a count
of requests for each **key** and turns away those that arrive too fast, answering 429 (Too Many Requests). The key is a choice, and
the choice matters more than the numbers. Count by the connection's real address and an attacker with one address is held to
the limit. Count by a header the client writes itself, such as `X-Forwarded-For`, and the attacker simply writes a new value
for every attempt.

The demo starts a real nginx in a Docker container for each act, sends twenty guesses at a login with a plain Java client, and
counts what came back. The login itself is a stub that answers 401 to every password, so only the limit decides what the attacker sees.
"""
analogy = """
Think of a door guard at a bank who allows each visitor six entries an hour. If the guard recognises visitors by their
face, a thief is held to six. If the guard asks visitors for their name and trusts what they say, the thief says a
new name each time and walks in twenty times. The rule was fine. What the guard counted was wrong.
"""
scenario = """
An online bank's login sits behind nginx. Twenty guesses at Dana's account arrive from one machine, as fast as it can send
them. The bank tries five arrangements: no limit, a limit on the client address, a limit on a header, the same limit on the
real address, and a limit per username. In each, the attacker's twenty guesses and what happens to them are counted. The rate is one request
a minute with a burst of five, so the limit's effect shows within a moment and does not depend on timing.
"""
costs = [
    "**Counting the wrong thing makes the limit useless.** A limit keyed on `X-Forwarded-For` or any other client-written header is bypassed by changing it. Behind a proxy or load balancer, the real address must be taken from a header only the trusted proxy sets.",
    "**A limit per username locks the owner out too.** While the bucket for Dana is full, Dana's own login is turned away, from any address.",
    "**A limit per username misses a spray.** One guess at each of many usernames never fills any bucket.",
    "**Shared addresses are punished together.** Many customers behind one office or mobile network address share one bucket.",
    "**Docker is a dependency of the demo.** The container has to start, and the image has to be present.",
]
too_much = """
A site with no accounts does not need a login limit. For one that does, a limit at the front door is cheap and worth having. nginx is
only one place to put it, and the same ideas apply to any reverse proxy, load balancer or cloud gateway: choose the key carefully, return 429,
and combine the limit with the lockout, second factor and breach check from the plain project.
"""
met_before = [
    "A \"429 Too Many Requests\" page, sometimes with a \"try again later\" message.",
    "`limit_req_zone` and `limit_req` lines in an nginx configuration.",
    "An API that documents its rate limits in a response header.",
    "Advice to \"never trust X-Forwarded-For\" in a security review.",
]
where = """
This project is the fourth in [passwords-and-mfa](..), the nginx version of [password-attacks-and-defences](../password-attacks-and-defences).
"""
twin = """
The login is a stub inside the same nginx, answering 401 to every password, because the lesson is about the limit and not
about checking passwords. The rate is one request a minute with a burst of five: nginx's limit counts in real time, so
the demo chooses a rate so slow that the whole run takes a few seconds and the counts are the same every time. Real limits use rates such as
five a second, and need more care. The demo cannot send requests from different real addresses, so the difference between the
connection address and a client-written header is shown by changing the header only.
"""
test_note = "The unit tests (`./gradlew test`) check the generated nginx configurations and need no Docker. The tests that start real containers, including the golden-output comparison, are tagged `docker` and run with `./gradlew integrationTest`."

[[act]]
title = "nginx in front of the login, with no limit"
summary = "With no limit, all 20 guesses at Dana's login are answered with 401."
detail = """
nginx sits in front of the login, which is a stub that says 401 to every password. With no limit configured, nginx
passes every request through. Twenty guesses at Dana's account are all answered: 20 answered, 0 refused. Anyone
can keep guessing for as long as they like.
"""
speech = """
First demo: nginx in front of the login, with no limit. [[slnc 400]] nginx is a web server that very often sits in front of an application. [[slnc 300]] The login behind it is a stub, which says four oh one to every password. [[slnc 600]]
The attacker sends twenty guesses at Dana's account. [[slnc 300]] All twenty are answered. [[slnc 300]] Nothing refused. [[slnc 600]]
Anyone can keep guessing, for as long as they like.
"""
rows = { nginx = "active wrong" }
console = [
    ["20 guesses at dana's login: 20 answered, 0 refused with 429  <- ANYONE CAN KEEP GUESSING", "bad"],
]

[[act]]
title = "limit_req on the client's address: 1r/m, burst 5"
summary = "Keyed on the connection address, the limit lets 6 guesses through, 1 plus the burst of 5, and refuses the other 14 with a 429."
detail = """
The configuration now has a zone that counts requests per client address, at one request a minute, and the login
location uses it with a burst of five. The first request is allowed. The burst lets five more through at once. That is six answered. The
remaining fourteen get 429. The rate is deliberately slow, so the count does not depend on how fast the demo runs.
"""
speech = """
Second demo: a limit on the client's address. [[slnc 400]] nginx keeps a count of requests for each address, in a zone. [[slnc 300]] The rate is one a minute, with a burst of five. [[slnc 600]]
The first request is allowed. [[slnc 300]] The burst lets five more through at once. [[slnc 300]] That is six answered. [[slnc 600]]
The other fourteen are turned away with a four twenty nine, which means, too many requests. [[slnc 600]]
The rate is deliberately slow, so the count does not depend on how fast the demo runs.
"""
rows = { nginx = "active ok", zone = "active ok" }
console = [
    ["20 guesses at dana's login: 6 answered, 14 refused with 429", "ok"],
    ["the first 6 get through (1 plus the burst of 5), the rest are turned away", "ok"],
]

[[act]]
title = "The same limit, but counted on the X-Forwarded-For header"
summary = "Keyed on a header the client writes, the attacker sends a different value each time and all 20 guesses are answered."
detail = """
Many setups sit behind a proxy and take the client's address from the `X-Forwarded-For` header. Here the zone is
keyed on that header, and the attacker simply sends a different value with every guess. Each value has its own,
empty bucket, so all 20 guesses are answered: 20 answered, 0 refused. The limit is in place and does nothing, because
the attacker chose the key.
"""
speech = """
Third demo: the same limit, counted on a header. [[slnc 400]] Many setups sit behind a proxy, and take the client's address from a header called X Forwarded For. [[slnc 600]]
Here the zone is keyed on that header. [[slnc 300]] And the attacker sends a different value, with every guess. [[slnc 300]] Each value gets its own, empty bucket. [[slnc 600]]
All twenty guesses are answered. [[slnc 300]] The limit is in place, and does nothing. [[slnc 300]] The attacker chose the key.
"""
rows = { header = "active wrong", zone = "active wrong" }
console = [
    ["20 guesses, each with a different X-Forwarded-For value: 20 answered, 0 refused with 429  <- THE ATTACKER CHOSE ITS OWN KEY", "bad"],
]

[[act]]
title = "The same limit, counted on the real connection address"
summary = "Keyed on the real address, changing the header buys nothing: 6 answered and 14 refused again."
detail = """
The zone is keyed on the address of the connection itself, which the client cannot choose. The attacker sends the same different header values
as before, and nginx ignores them. The result is back to 6 answered and 14 refused. Behind a trusted proxy, the real client
address must be taken from a header that only that proxy sets, and the proxy must overwrite whatever the client sent.
"""
speech = """
Fourth demo: the same limit, counted on the real connection address. [[slnc 400]] The client cannot choose that one. [[slnc 600]]
The attacker sends the same different header values as before. [[slnc 300]] nginx ignores them. [[slnc 300]] Six answered. [[slnc 300]] Fourteen refused. [[slnc 600]]
Behind a trusted proxy, the real address must come from a header that only that proxy sets. [[slnc 300]] And the proxy must overwrite whatever the client sent.
"""
rows = { nginx = "active ok", zone = "active ok", header = "active ok" }
console = [
    ["20 guesses with different X-Forwarded-For values: 6 answered, 14 refused with 429", "ok"],
    ["the header is ignored, so changing it buys nothing", "ok"],
]

[[act]]
title = "The bill: a limit per username"
summary = "Keyed on the username, the limit holds an attack on Dana to 6 but also turns Dana away, and a spray of 20 usernames is never limited."
detail = """
A limit per username seems natural: protect each account. An attack on Dana is held to 6 answered and 14 refused.
But the bucket for Dana is now full, and when Dana herself tries from another address, she gets 429: the
limit locks the owner out too. And a spray, with one guess at each of 20 usernames, fills no bucket at all: 20 answered, 0 refused.
A per-username limit is a lockout with the same two weaknesses as in the plain project. It belongs beside a limit per address, not in place of it.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] A limit per username seems natural. [[slnc 300]] Protect each account. [[slnc 600]]
An attack on Dana is held to six answered, and fourteen refused. [[slnc 300]] But Dana's bucket is now full. [[slnc 300]] When Dana herself tries, from another address, she is turned away too. [[slnc 600]]
And a spray, with one guess at each of twenty usernames, fills no bucket at all. [[slnc 300]] All twenty are answered. [[slnc 600]]
A limit per username is a lockout, with the same two weaknesses as before. [[slnc 300]] It belongs beside a limit per address. [[slnc 300]] Not instead of it.
"""
rows = { zone = "active amber", nginx = "active amber" }
console = [
    ["20 guesses at dana: 6 answered, 14 refused with 429", "ok"],
    ["dana herself tries from another address: 429  <- THE LIMIT LOCKS THE OWNER OUT TOO", "bad"],
    ["one guess at each of 20 usernames: 20 answered, 0 refused with 429  <- A SPRAY NEVER REACHES THE LIMIT", "bad"],
]

