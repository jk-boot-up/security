plugins {
    id 'java'
    id 'application'
}

group = 'com.jk.explore.security'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.jk.explore.security.attacksnginx.NginxAttacksDemo'
}

// `./gradlew test` never needs Docker. Tests that start the nginx container are tagged "docker"
// and run with `./gradlew integrationTest`, which needs a running Docker.
test {
    useJUnitPlatform {
        excludeTags 'docker'
    }
}

tasks.register('integrationTest', Test) {
    description = 'Runs the tests that start an nginx container.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'docker'
    }
    shouldRunAfter test
}
