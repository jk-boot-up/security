    ["the bank makes a 20-byte secret and shows it as Base32: GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ", "muted"],
    ["at time 59 the counter is 1 and the code is 287082", "ok"],
    ["the code for steps 0 to 3, each lasting 30 seconds: 755224, 287082, 359152, 969429", "ok"],
