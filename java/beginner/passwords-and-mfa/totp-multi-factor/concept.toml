[poster]
headline = [["ONE-TIME", "text"], ["CODES (TOTP)", "accent"]]
taglines = [["A second factor made from a secret and the time", "gold"]]
before = { code = "password", note = "one leak is enough", tag = "BEFORE" }
after = { code = "password + 287082", note = "a code every 30 seconds", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "One-Time Codes (TOTP)"
narration = """Hello, and welcome. [[slnc 400]] This video explains T O T P, which stands for time based one time password, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] A password is something you know, and it can leak. [[slnc 300]] A second factor adds something you have, such as a phone, so a stolen password alone is not enough. [[slnc 600]] Think of a safe deposit box that needs two keys turned together. [[slnc 300]] Yours, which never changes. [[slnc 300]] And the clerk's, which is replaced every thirty seconds, in a pattern that only the clerk and your phone know. [[slnc 300]] A copy of your key alone cannot open the box. [[slnc 700]] The domain is an online bank. [[slnc 300]] You will see how the code is made, step by step, and what it cannot do."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online bank. A customer, Dana.", "", "Her password leaked from another site.", "", "The bank adds a second factor:", "a code from an app on her phone."]
narration = """Here is the scenario. [[slnc 400]] An online bank has a customer called Dana. [[slnc 300]] Her password leaked from another site, so a password alone is no longer safe. [[slnc 500]] The bank adds a second factor: [[slnc 200]] a code from an app on her phone. [[slnc 500]] The demo uses the secret from the published test values, so you can check every number against the standard."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["Secret: shared once by the phone and the bank", "Step: 30 seconds; the counter counts them", "HMAC: a keyed hash of the counter", "Window: steps either side the bank accepts", "Replay: the same code used twice"]
narration = """Before the demos, the words. [[slnc 400]] The secret is shared once, by the phone and the bank. [[slnc 400]] A step is thirty seconds, and the counter is the number of steps since nineteen seventy. [[slnc 400]] H M A C is a keyed hash: it mixes the counter with the secret. [[slnc 400]] The window is how many steps either side the bank accepts. [[slnc 400]] And a replay is the same code used twice."""

[[scene]]
key = "03-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "04-idea"
kind = "figure"
title = "Two sides, one code, no message"
body = "one_code"
narration = """Here is the whole idea on one example. [[slnc 400]] On the left, Dana's phone. [[slnc 300]] On the right, the bank. [[slnc 500]] Before: each side has the same secret, one two three four five, and so on, and the same time, fifty nine seconds. [[slnc 600]] After: each side runs the same recipe, and gets the same code, two eight seven zero eight two. [[slnc 600]] No message goes between them. [[slnc 300]] The secret was shared once, and after that, only the clocks need to agree. [[slnc 300]] Thirty seconds later, both get a new code."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "11-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["A six-digit code that changes every 30 seconds", "A QR code when you turn on two-step sign-in", "Recovery codes to print and keep", "SMS codes are weaker than an app"]
narration = """You have probably met this already. [[slnc 400]] The six digit code in an authenticator app is exactly this. [[slnc 400]] The Q R code you scan when you turn on two step sign in carries the secret. [[slnc 400]] And S M S codes, sent by text message, are weaker than an app, because a text can be redirected by a swapped SIM card."""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["An app, not SMS, for anything that matters", "A small window; refuse a code used twice", "Encrypt secrets; guard recovery codes", "Offer a hardware key for the highest stakes"]
narration = """So, how do you use it? [[slnc 400]] Choose an authenticator app, not S M S, for anything that matters. [[slnc 400]] Accept a small window, and refuse a code that was already used. [[slnc 400]] Keep the secrets encrypted, and guard recovery codes like passwords. [[slnc 400]] And for the highest stakes, offer a hardware security key."""

[[scene]]
key = "13-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "13-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Change the window to zero", "and see which clock tests change."]
narration = """That's time based one time codes. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] A code made from a shared secret and the time means a stolen password is not enough, but a code typed into a fake page still works. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine, with nothing installed except a Java development kit. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Change the window to zero, and see which of the clock tests change. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
The second factor of an online bank's login: the shared secret, the code made from it, the bank's check with its window and
its replay memory, and recovery codes. It covers an attacker who has the password, one who watches a code, one who runs a fake bank
page, and one who steals the bank's table. It does not cover how the password is checked or stored, or hardware security keys.
"""
assets = [
    "Customers' accounts, and the money behind them.",
    "The shared secret held by each phone and by the bank.",
    "The recovery codes issued to each customer.",
    "The bank's record of the last accepted step.",
]
actors = [
    "Dana, the customer, with her phone.",
    "An attacker who has Dana's password but not her phone.",
    "An observer who sees a code as it is typed.",
    "A fake bank page that relays what the customer types.",
    "An attacker who copies the bank's table of secrets.",
]
boundaries = [
    "Customer to bank: the password and the code cross the internet.",
    "Phone to customer: the code is shown on a screen, and can be seen.",
    "Bank to its table of secrets: the secret must be readable by the bank to check codes.",
]
assumptions = [
    "The channel is protected with TLS, so codes are not read in transit.",
    "The phone is not itself compromised.",
    "The bank's clock is correct, and phones are within a few seconds of it.",
    "The demo's secret is public (the RFC's test key) and the table is in memory. Real secrets are random and stored encrypted.",
]
out_of_scope = [
    "Limits on wrong codes: the password-attacks project covers lockouts and rate limits.",
    "Phishing-resistant factors such as hardware security keys and WebAuthn.",
    "SIM swaps, because this is not an SMS code.",
]
tests = [
    "`HotpTest`, `TotpTest` and `Base32Test` check the code, in the standard library, against the published values of RFC 4226, 6238 and 4648.",
    "`MfaServerTest` checks the window, replay protection, recovery codes, and the server's holding of the secret.",
    "`CodeStepsTest` checks that the step-by-step code equals `Totp` and the RFC 4226 intermediate values.",
    "`AuthenticatorTest` checks that a fast phone shows a later step's code.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The cryptography module comes next, starting with hashing and integrity: HMAC, the keyed hash used here, is a central part of it.
"""

[[threat]]
id = "T1"
stride = "S"
threat = "An attacker with a leaked password logs in"
where = "`MfaServer.login`"
control = "A second factor: the right password alone gets CODE_NEEDED"
residual = "An attacker who also has the phone, or a relayed code, still gets in"

[[threat]]
id = "T2"
stride = "S"
threat = "A fake bank page collects the password and code and relays them at once"
where = "the customer's browser"
control = "None in TOTP: the code cannot tell the real bank from a copy"
residual = "Hardware security keys, which check the site's identity, are the answer"

[[threat]]
id = "T3"
stride = "S"
threat = "Someone sees a code as it is typed and uses it again"
where = "`MfaServer.login` with replay protection"
control = "The server remembers the last accepted step and refuses it again"
residual = "The observer can still use it first, if they are faster than Dana"

[[threat]]
id = "T4"
stride = "I"
threat = "The table of secrets is stolen, so every customer's codes can be made"
where = "`MfaServer.stolenSecrets`"
control = "None in the demo"
residual = "Store secrets encrypted with a key kept apart, and limit who can read the table"

[[threat]]
id = "T5"
stride = "D"
threat = "A phone's clock is wrong, so the right code is refused, or a wide window gives an attacker more chances"
where = "the window in `MfaServer`"
control = "A window of one step either side forgives 30 seconds of drift"
residual = "A phone more than a step out is refused; a wider window accepts more codes"

[[threat]]
id = "T6"
stride = "E"
threat = "A recovery code is stolen and used instead of the phone"
where = "`MfaServer.loginWithRecoveryCode`"
control = "Each recovery code works once, and the password is still required"
residual = "An unused code is a standing second way in and must be guarded like a password"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] Eight small classes. [[slnc 300]] Here is what each one does."""

[[class]]
name = "TotpDemo"
what = "runs the six acts"
[[class.part]]
title = "the six acts"
code = """
act1PasswordAlone(out);
act2Enrol(out);
act3CodeSteps(out);
act4Login(out);
act5Replay(out);
act6Bill(out);
"""
speech = """Totp demo runs the six acts, in order. [[slnc 300]] Time is a number passed in, so every run prints the same codes."""

[[class]]
name = "CodeSteps"
what = "makes the code one step at a time"
[[class.part]]
title = "the four steps"
code = """
long counter = unixSeconds / Totp.STEP_SECONDS;                      // step 1
byte[] counterBytes = ByteBuffer.allocate(8).putLong(counter).array();
byte[] hmac = hmacSha1(secret, counterBytes);                        // step 2
int offset = hmac[hmac.length - 1] & 0x0F;                           // step 3
...
int number = ByteBuffer.wrap(picked).getInt() & 0x7FFFFFFF;          // step 4
String code = String.format("%06d", number % 1_000_000);
"""
speech = """Code steps does the four steps of act three, and keeps every value in between. [[slnc 300]] Divide the time by thirty. [[slnc 200]] H M A C the counter. [[slnc 200]] Use the last half byte as the offset. [[slnc 200]] Drop the top bit, and keep six digits. [[slnc 300]] A test checks that it matches Totp."""

[[class]]
name = "Hotp"
what = "the code for a counter (RFC 4226)"
[[class.part]]
title = "HMAC, then a few bytes as digits"
code = """
Mac mac = Mac.getInstance(hmacAlgorithm);
mac.init(new SecretKeySpec(key, hmacAlgorithm));
byte[] hash = mac.doFinal(ByteBuffer.allocate(8).putLong(counter).array());
int offset = hash[hash.length - 1] & 0x0F;
"""
speech = """H O T P is the code for any counter, with Java's own H M A C. [[slnc 300]] It is tested against the ten published values of the standard."""

[[class]]
name = "Totp"
what = "HOTP with the time as counter (RFC 6238)"
[[class.part]]
title = "the counter is the time step"
code = """
public static long counterAt(long unixSeconds) {
    return unixSeconds / STEP_SECONDS;                 // 30 seconds
}
...
return Hotp.code(key, counterAt(unixSeconds), DIGITS);  // 6 digits
"""
speech = """T O T P is H O T P, where the counter is the time divided by thirty. [[slnc 300]] That one line is the whole difference."""

[[class]]
name = "Base32"
what = "writes the secret as letters"
[[class.part]]
title = "5 bits per letter"
code = """
buffer = (buffer << 8) | (b & 0xFF);
bits += 8;
while (bits >= 5) {
    out.append(ALPHABET.charAt((buffer >> (bits - 5)) & 31));
    bits -= 5;
"""
speech = """Base thirty two adds eight bits at a time, and takes out five at a time, as one letter. [[slnc 300]] That is the picture from act two."""

[[class]]
name = "Authenticator"
what = "the phone, with its own clock"
[[class.part]]
title = "a clock that may be wrong"
code = """
public String codeShownAt(long trueTime) {
    return Totp.codeAt(secret, trueTime + clockOffsetSeconds);
"""
speech = """The authenticator is the phone. [[slnc 300]] It adds its clock error to the true time, which is how the demo makes the fast phones of act four."""

[[class]]
name = "MfaServer"
what = "the bank: password, code, window, replay"
[[class.part]]
title = "the window and the replay check"
code = """
long current = Totp.counterAt(now);
for (long step = current - window; step <= current + window; step++) {
    if (step >= 0 && MessageDigest.isEqual(code.getBytes(StandardCharsets.UTF_8),
            Hotp.code(secret, step, Totp.DIGITS).getBytes(StandardCharsets.UTF_8))) {
        if (replayProtection && step <= lastAcceptedStep.getOrDefault(username, -1L)) {
            return Verdict.REPLAYED;
        }
        lastAcceptedStep.put(username, step);
        return Verdict.OK;
"""
speech = """M F A server is the bank. [[slnc 300]] After the password, it tries every step in the window. [[slnc 300]] If the code matches a step it already accepted, the answer is replayed. [[slnc 300]] Otherwise it remembers that step, and says okay. [[slnc 300]] The answers are a small enum called Verdict."""

[[class]]
name = "SecureSecrets"
what = "real random secrets"
[[class.part]]
title = "random, not the test key"
code = """
private final SecureRandom random = new SecureRandom();
...
byte[] secret = new byte[20];
random.nextBytes(secret);
"""
speech = """Secure secrets makes real twenty byte secrets, from Java's secure random generator. [[slnc 300]] The demo uses demo secrets instead, with the public test key, so the numbers can be checked."""

