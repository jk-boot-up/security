[[act]]
title = "Enrolling a second factor"
summary = "The bank makes a 20-byte secret shown as Base32; at time 59 the counter is 1 and the code is 287082; steps 0 to 3 give 755224, 287082, 359152, 969429."
detail = """
Dana enrols. The bank makes a 20-byte secret and shows it as Base32 text, which the phone takes in by QR code or by typing:
GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ. The phone and the bank each turn the secret and the time into a code. At time 59 the counter, the
number of whole 30-second steps, is 1, and the code is 287082. The codes for steps 0, 1, 2 and 3 are 755224, 287082, 359152 and 969429, each good for
30 seconds. They match the test values published in RFC 4226. The phone and the bank never talk: they only share the secret and the clock.
"""
speech = """
Second demo: enrolling a second factor. [[slnc 400]] The bank makes a secret, twenty bytes long. [[slnc 300]] It shows it as text made of capital letters and digits, which the phone takes in by scanning a picture, or by typing. [[slnc 600]]
From then on, the phone and the bank each work out a code from the secret and the time. [[slnc 600]]
At time fifty nine, the counter is one. [[slnc 300]] That is the number of whole thirty second steps so far. [[slnc 300]] The code is two eight seven zero eight two. [[slnc 600]]
The codes for the first four steps are seven five five two two four, then two eight seven zero eight two, then three five nine one five two, then nine six nine four two nine. [[slnc 300]] Each lasts thirty seconds. [[slnc 600]]
These are the values published in the standard. [[slnc 300]] The phone and the bank never talk. [[slnc 300]] They share only the secret and the clock.
"""
