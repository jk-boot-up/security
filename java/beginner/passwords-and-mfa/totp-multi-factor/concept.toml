    { from = "server", to = "recovery", label = "spends a code" },
]

[poster]
headline = [["ONE-TIME", "text"], ["CODES (TOTP)", "accent"]]
taglines = [["A second factor made from a secret and the time", "gold"]]
before = { code = "password", note = "one leak is enough", tag = "BEFORE" }
after = { code = "password + 287082", note = "a code every 30 seconds", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "One-Time Codes (TOTP)"
narration = """Hello, and welcome. [[slnc 400]] This video explains time based one time codes, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A password is something you know, and it can leak. [[slnc 300]] A second factor adds something you have, such as a phone, so a stolen password alone is not enough. [[slnc 300]] The six digit code in an authenticator app is the most common one. [[slnc 300]] The phone and the bank share a secret. [[slnc 300]] Every thirty seconds, each works out the same code from that secret and the time, without talking to each other. [[slnc 600]] Think of a safe deposit box that needs two keys turned together. [[slnc 300]] Yours, which never changes. [[slnc 300]] And the clerk's, which is replaced every thirty seconds, in a pattern that both the clerk and your phone know. [[slnc 300]] A thief with a copy of your key cannot open the box. [[slnc 300]] But a thief who stands beside you, and uses the clerk's key the moment you show it, can. [[slnc 700]] In this video, the domain is an online bank. [[slnc 500]] By the end, you will hear how the code is made. [[slnc 300]] How clocks that disagree are forgiven. [[slnc 300]] How a code is stopped from being used twice. [[slnc 300]] And what a code cannot do."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online bank. A customer, Dana.", "", "Her password leaked from another site.", "", "The bank adds a second factor:", "a code from an app on her phone."]
narration = """Here is the scenario. [[slnc 400]] An online bank has a customer called Dana. [[slnc 500]] Her password leaked from another site, so a password alone is no longer safe. [[slnc 600]] The bank adds a second factor. [[slnc 300]] A code from an app on her phone. [[slnc 600]] The demo follows that code, from its first calculation, using the secret from the published test values, so you can check the numbers against the standard."""

[[scene]]
key = "03-recipe"
kind = "bullets"
title = "How the Code Is Made"
body = ["1. Counter: whole 30-second steps since 1970", "2. HMAC the counter with the shared secret", "3. Pick 4 bytes, using the last digit", "4. Keep six digits of the remainder", "", "RFC 4226 (HOTP), RFC 6238 (TOTP)"]
narration = """Before the demos, the recipe. [[slnc 500]] One. Count the whole thirty second steps since the start of nineteen seventy. [[slnc 500]] Two. Put that counter through H M A C, a keyed hash, using the shared secret. [[slnc 500]] Three. Pick four bytes of the result, using its last digit to choose where. [[slnc 500]] Four. Keep six digits of that number. [[slnc 600]] Two published standards describe it. [[slnc 300]] R F C forty two twenty six for the counter version, and R F C sixty two thirty eight for the time version."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "09-limits"
kind = "bullets"
title = "What a Code Does, and Does Not"
body = ["Stops: a stolen password alone", "Stops: a code used twice (with replay protection)", "Does not stop: a fake page that relays the code", "Does not stop: a stolen secrets table", "Does not stop: a lost recovery code", "", "For phishing: a hardware key"]
narration = """Let's put it together. [[slnc 400]] A code stops a stolen password from being enough. [[slnc 500]] With replay protection, it stops a code being used twice. [[slnc 500]] It does not stop a fake page that relays the code at once. [[slnc 500]] It does not help if the bank's table of secrets is stolen. [[slnc 500]] And it does not help if a recovery code is lost. [[slnc 600]] For phishing, a hardware security key is stronger, because it checks which site it is talking to."""

[[scene]]
key = "10-roles"
kind = "bullets"
title = "Who Does What"
body = ["Hotp, Totp: make the code", "Base32: writes the secret as text", "Authenticator: the phone, with its clock", "MfaServer: password, code, window, replay", "SecureSecrets: real random secrets"]
narration = """Here is who does what in the code. [[slnc 400]] The H O T P and T O T P classes make the code. [[slnc 500]] Base thirty two writes the secret as text, for the app. [[slnc 500]] The authenticator is the phone, with its own clock, which may be wrong. [[slnc 500]] The M F A server checks the password and the code, allows the window, and refuses a code used twice. [[slnc 300]] And secure secrets makes real random secrets, which the demo replaces with the standard's test key."""

[[scene]]
key = "11-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["A six-digit code that changes every 30 seconds", "A QR code when you turn on 2FA", "Recovery codes to print and keep", "SMS codes are weaker than an app"]
narration = """You have probably met this already. [[slnc 400]] A six digit code in an authenticator app, that changes every thirty seconds, is exactly this. [[slnc 500]] The picture you scan when you turn on two step sign in carries the secret. [[slnc 500]] A page of recovery codes to print and keep is the fifth demo. [[slnc 500]] And when banks say that codes by text message are weaker than an app, it is because a text can be intercepted, or redirected by a swapped SIM card."""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["An app, not SMS, for anything that matters", "A small window; refuse a code used twice", "Encrypt secrets; guard recovery codes", "Offer a hardware key for the highest stakes"]
narration = """So, how do you use it? [[slnc 400]] Choose an authenticator app, not text messages, for anything that matters. [[slnc 500]] Accept a small window, and refuse a code that was already used. [[slnc 500]] Keep the secrets encrypted, and guard recovery codes like passwords. [[slnc 500]] And for the highest stakes, offer a hardware security key as well."""

[[scene]]
key = "13-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Change the window to zero", "and see which clock tests change."]
narration = """That's time based one time codes. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] A code made from a shared secret and the time means a stolen password is not enough, but a code typed into a fake page still works. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine, with nothing installed except a Java development kit. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Change the window to zero, and see which of the clock tests change. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
The second factor of an online bank's login: the shared secret, the code made from it, the bank's check with its window and
its replay memory, and recovery codes. It covers an attacker who has the password, one who watches a code, one who runs a fake bank
page, and one who steals the bank's table. It does not cover how the password is checked or stored, or hardware security keys.
"""
assets = [
    "Customers' accounts, and the money behind them.",
    "The shared secret held by each phone and by the bank.",
    "The recovery codes issued to each customer.",
    "The bank's record of the last accepted step.",
]
actors = [
    "Dana, the customer, with her phone.",
    "An attacker who has Dana's password but not her phone.",
    "An observer who sees a code as it is typed.",
    "A fake bank page that relays what the customer types.",
    "An attacker who copies the bank's table of secrets.",
]
boundaries = [
    "Customer to bank: the password and the code cross the internet.",
    "Phone to customer: the code is shown on a screen, and can be seen.",
    "Bank to its table of secrets: the secret must be readable by the bank to check codes.",
]
assumptions = [
    "The channel is protected with TLS, so codes are not read in transit.",
    "The phone is not itself compromised.",
    "The bank's clock is correct, and phones are within a few seconds of it.",
    "The demo's secret is public (the RFC's test key) and the table is in memory. Real secrets are random and stored encrypted.",
]
out_of_scope = [
    "Limits on wrong codes: the password-attacks project covers lockouts and rate limits.",
    "Phishing-resistant factors such as hardware security keys and WebAuthn.",
    "SIM swaps, because this is not an SMS code.",
]
tests = [
    "`HotpTest`, `TotpTest` and `Base32Test` check the code, in the standard library, against the published values of RFC 4226, 6238 and 4648.",
    "`MfaServerTest` checks the window, replay protection, recovery codes, and the server's holding of the secret.",
    "`AuthenticatorTest` checks that a fast phone shows a later step's code.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The cryptography module comes next, starting with hashing and integrity: HMAC, the keyed hash used here, is a central part of it.
"""

[[threat]]
id = "T1"
stride = "S"
threat = "An attacker with a leaked password logs in"
where = "`MfaServer.login`"
control = "A second factor: the right password alone gets CODE_NEEDED"
residual = "An attacker who also has the phone, or a relayed code, still gets in"

[[threat]]
id = "T2"
stride = "S"
threat = "A fake bank page collects the password and code and relays them at once"
where = "the customer's browser"
control = "None in TOTP: the code cannot tell the real bank from a copy"
residual = "Hardware security keys, which check the site's identity, are the answer"

[[threat]]
id = "T3"
stride = "S"
threat = "Someone sees a code as it is typed and uses it again"
where = "`MfaServer.login` with replay protection"
control = "The server remembers the last accepted step and refuses it again"
residual = "The observer can still use it first, if they are faster than Dana"

[[threat]]
id = "T4"
stride = "I"
threat = "The table of secrets is stolen, so every customer's codes can be made"
where = "`MfaServer.stolenSecrets`"
control = "None in the demo"
residual = "Store secrets encrypted with a key kept apart, and limit who can read the table"

[[threat]]
id = "T5"
stride = "D"
threat = "A phone's clock is wrong, so the right code is refused, or a wide window gives an attacker more chances"
where = "the window in `MfaServer`"
control = "A window of one step either side forgives 30 seconds of drift"
residual = "A phone more than a step out is refused; a wider window accepts more codes"

[[threat]]
id = "T6"
stride = "E"
threat = "A recovery code is stolen and used instead of the phone"
where = "`MfaServer.loginWithRecoveryCode`"
control = "Each recovery code works once, and the password is still required"
residual = "An unused code is a standing second way in and must be guarded like a password"
