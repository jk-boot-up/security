[docs.session]
objectives = [
    "explain what a second factor adds to a password",
    "explain how the phone and the bank get the same code without talking",
    "say why the bank accepts a window of steps, and what a wider window costs",
    "name three things a TOTP code cannot protect against",
]
walkthrough = """
Start with the two-key safe-deposit box. Run the demo one act at a time. After act two, ask the group how the phone and the bank can agree on a code
without a message between them, and let them name the shared secret and the clock. After act three, ask what the bank loses if it widens the window to 5. In
act five, ask what a hardware security key does that a code cannot, and let the group discover that it checks which site it is talking to.
"""
exercises = [
    "Change the window to 0 and rerun the clock tests. Which of them change?",
    "Change the step from 30 seconds to 60. Which code values in the demo change?",
    "Use 8 digits instead of 6 and check the codes against the RFC 6238 table.",
    "Add a limit of 5 wrong codes before the account locks, and decide what the unlock should need.",
]

[docs.explained]
sentence = """
A time-based one-time password is a code made by putting the number of 30-second steps since 1970 through HMAC with a secret that the phone and the bank share, so both can work it out without talking and a stolen password alone is no longer enough.
"""
verdict = """
Use an authenticator app, not text messages, as a second factor for anything that matters. Accept a small window, refuse a
code that was already used, keep secrets encrypted on the server, guard recovery codes like passwords, and know that a code
does not stop a fake page. For the highest stakes, offer a hardware security key as well.
"""
recognise = [
    "A six-digit code in an authenticator app that changes every 30 seconds.",
    "A QR code shown when two-step sign-in is turned on.",
    "A page of recovery codes to print and keep.",
    "`otpauth://` links, which carry the secret, the name and the step.",
]

[spec]
purpose = """
Teach how time-based one-time codes work by building HOTP and TOTP from the standard library, checking them against the standards, and examining the bank's choices and the limits of the method.
"""
nongoals = [
    "QR codes and the `otpauth://` format: only Base32 is shown.",
    "Hardware security keys and WebAuthn: they are mentioned as the answer to phishing.",
    "Storing secrets encrypted: the secrets are held in memory.",
]
problem = """
Learners use authenticator apps daily but do not know how a code can be the same on two devices that never talk, or where the method stops.
"""
roles = [["The code", "`Hotp`, `Totp`, `Base32`"], ["The phone", "`Authenticator`"], ["The bank", "`MfaServer` and `Verdict`"], ["Where secrets come from", "`SecretSource`, `SecureSecrets`, `DemoSecrets`"], ["Entry point", "`TotpDemo`"]]
requirements = [
    "HOTP matches the ten values of RFC 4226, and TOTP matches the published values of RFC 6238 for SHA-1, SHA-256 and SHA-512.",
