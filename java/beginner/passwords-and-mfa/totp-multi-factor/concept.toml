[[act]]
title = "Enrolling: one secret, shared once"
summary = "The bank makes a 20-byte secret, shows it as 32 Base32 letters for the app, and the secret gives a new code every 30 seconds: 755224, 287082, 359152, 969429."
detail = """
Dana enrols. BEFORE ENCODING: the bank makes a 20-byte secret; the demo uses the published RFC test key, 12345678901234567890.
AFTER ENCODING: the secret as Base32 text, GEZDGNBV GY3TQOJQ GEZDGNBV GY3TQOJQ, which the app takes in by QR code or by typing. Base32 cuts the
bytes into groups of 5 bits, and each group is one of 32 letters and digits, so 5 bytes become 8 letters. From then on the phone and the
bank each work out a code from the secret and the time step: 755224, 287082, 359152 and 969429 for steps 0 to 3, each good for 30 seconds.
These are the test values published in RFC 4226.
"""
figure = "base32"
figure_title = "The secret, written as letters for the app"
figure_speech = """
Now Dana turns on the second factor. [[slnc 400]] Before encoding, the bank makes a secret of twenty bytes. [[slnc 300]] Here are the first five: the characters one to five, which are bytes three one to three five. [[slnc 600]]
After encoding, the same bits are cut into groups of five. [[slnc 300]] Five bits give thirty two possible values, so each group is one letter, or a digit from two to seven. [[slnc 300]] Five bytes become eight letters: G E Z D G N B V. [[slnc 600]]
The app takes in all thirty two letters once, by scanning a Q R code, or by typing. [[slnc 600]]
From then on, the secret gives a new six digit code every thirty seconds. [[slnc 300]] At the bottom are the first four.
"""
