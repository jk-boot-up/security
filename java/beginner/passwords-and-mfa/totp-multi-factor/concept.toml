[[act]]
title = "How the code is made, step by step"
summary = "From the secret and time 59: counter 1, HMAC-SHA1 gives 20 bytes, the last half-byte b picks bytes 11 to 14, c1397eea, the top bit is dropped, 1094287082, and the last six digits are the code 287082."
detail = """
BEFORE: the secret and the time, 59 seconds. Step 1: the counter is 59 / 30 = 1, written as 8 bytes. Step 2: HMAC-SHA1 of the counter, with the
secret as key, gives 20 bytes: 75a48a19 d4cbe100 644e8ac1 397eea74 7a2d33ab. Step 3: the last byte is ab, and its last half-byte, b, is 11, so 4 bytes
are read from byte 11: c1397eea. Step 4: the top bit is dropped, so the number is never negative, 1094287082, and the last six digits are kept.
AFTER: the code 287082, the same as `Totp` gives. `CodeSteps` does these steps one by one, and a test checks it against `Totp` and the RFC 4226 values.
"""
figure = "code_steps"
figure_title = "How the six digits are made"
figure_speech = """
So how do six digits come from a secret and the time? [[slnc 400]] In four steps. [[slnc 600]]
Step one. [[slnc 300]] Divide the time by thirty. [[slnc 300]] Fifty nine seconds is one whole step, so the counter is one. [[slnc 600]]
Step two. [[slnc 300]] H M A C mixes the counter with the secret, and gives twenty bytes. [[slnc 300]] Change the secret or the counter, and every byte changes. [[slnc 600]]
Step three. [[slnc 300]] The last byte is a b. [[slnc 300]] Its last half, b, is eleven. [[slnc 300]] So read four bytes, starting at byte eleven: c one, three nine, seven e, e a. [[slnc 600]]
Step four. [[slnc 300]] Drop the top bit, so the number is never negative. [[slnc 300]] That gives one billion and ninety four million, and so on. [[slnc 300]] Keep the last six digits: two eight seven zero eight two. [[slnc 600]]
Without the secret, nobody can work out the H M A C, so nobody can make the code.
"""
speech = """
Here is the program doing the same steps. [[slnc 300]] Before: the secret, and the time, fifty nine. [[slnc 300]] Step one: the counter, one, as eight bytes. [[slnc 300]] Step two: the twenty bytes of H M A C.
[[page]]
Step three: the last half byte, b, is eleven, and the four bytes from there. [[slnc 300]] Step four: the number, and its last six digits. [[slnc 300]] After: the code, the same as the library class gives.
"""
rows = { secret = "active ok", clock = "active ok" }
console = [
    ["BEFORE: THE SECRET AND THE TIME", "ok"],
    ["  secret      12345678901234567890", "muted"],
    ["  time        59 seconds", "muted"],
    ["STEP 1. COUNTER = TIME / 30, AS 8 BYTES", "amber"],
    ["  counter     1 = 00000000 00000001", "muted"],
    ["STEP 2. HMAC-SHA1 OF THE COUNTER, WITH THE SECRET", "amber"],
    ["  hmac, 20 bytes", "muted"],
    ["    75a48a19 d4cbe100 644e8ac1 397eea74 7a2d33ab", "muted"],
    ["---", ""],
    ["STEP 3. THE LAST HALF-BYTE PICKS WHERE TO READ 4 BYTES", "amber"],
    ["  last byte   ab, last half-byte b = 11", "muted"],
    ["  bytes 11-14 c1397eea", "muted"],
    ["STEP 4. DROP THE TOP BIT, KEEP THE LAST 6 DIGITS", "amber"],
    ["  number      1094287082", "muted"],
    ["  last 6      287082", "muted"],
    ["AFTER: THE CODE", "bad"],
    ["  code        287082, the same as Totp gives: true", "muted"],
]

[[act]]
title = "Logging in, and clocks that disagree"
summary = "At time 59 (step 1) the bank accepts steps 0 to 2: no code is CODE_NEEDED, the right code and a phone 25 seconds fast are OK, a wrong code and a phone 70 seconds fast are WRONG_CODE."
detail = """
THE ATTEMPTS, at time 59, which is step 1: the password alone; 287082 from a phone on time; a wrong code, 000000; 359152 from a phone 25 seconds
fast, which is already in step 2; and 338314 from a phone 70 seconds fast, in step 4. THE ANSWERS: the bank accepts its own step and one step
either side, a window of one, so steps 0 to 2. The password alone gets CODE_NEEDED, the phone on time and the phone 25 seconds fast get OK, and the
wrong code and the phone 70 seconds fast, three steps ahead, get WRONG_CODE.
"""
figure = "clock_window"
figure_title = "A window of one step either side"
figure_speech = """
Now Dana logs in with a code. [[slnc 400]] The bank's clock says fifty nine seconds, so it is in step one. [[slnc 600]]
Phone clocks are never exactly right. [[slnc 300]] So the bank also accepts one step either side: steps zero to two, in the green box. [[slnc 600]]
The attempts. [[slnc 300]] A phone on time shows step one's code. [[slnc 300]] A phone twenty five seconds fast is already in step two. [[slnc 300]] A phone seventy seconds fast is in step four. [[slnc 600]]
The answers. [[slnc 300]] The first two are inside the window, so they are okay. [[slnc 300]] The third is three steps ahead, so it is refused. [[slnc 600]]
A wider window forgives worse clocks, but it gives an attacker more codes to try.
"""
speech = """
The output lists the attempts first. [[slnc 300]] The password alone, the right code, a wrong code, and the two fast phones. [[slnc 400]] Then the answers. [[slnc 300]] Code needed, okay, wrong code, okay, and wrong code, three steps ahead.
"""
rows = { server = "active ok", clock = "active ok" }
console = [
    ["THE ATTEMPTS, AT TIME 59 (STEP 1)", "ok"],
    ["  a           no code     the password alone", "muted"],
    ["  b           287082      phone on time (step 1)", "muted"],
    ["  c           000000      a wrong code", "muted"],
    ["  d           359152      phone 25 seconds fast (step 2)", "muted"],
    ["  e           338314      phone 70 seconds fast (step 4)", "muted"],
    ["THE ANSWERS: THE BANK ALLOWS STEPS 0 TO 2", "bad"],
    ["  a           CODE_NEEDED", "muted"],
    ["  b           OK", "muted"],
    ["  c           WRONG_CODE", "muted"],
    ["  d           OK", "muted"],
    ["  e           WRONG_CODE  (3 steps ahead)", "muted"],
]

[[act]]
title = "The same code twice"
summary = "An observer reuses Dana's code 5 seconds later: without replay protection it is OK; with it, the bank remembers step 1 and says REPLAYED."
detail = """
THE LOGINS: Dana logs in with 287082 at time 59, and an observer who saw her type it uses the same code at time 64. WITHOUT REPLAY PROTECTION
both get OK: a replay. WITH REPLAY PROTECTION the bank remembers the last step it accepted for each customer, step 1, and refuses any code from that
step or an earlier one: the observer gets REPLAYED. The code now works once, which is why it is called a one-time password.
"""
figure = "replay"
figure_title = "The same code twice"
figure_speech = """
A code lasts thirty seconds, and a little more with the window. [[slnc 300]] So someone who sees Dana type it can use it too. [[slnc 600]]
The logins. [[slnc 300]] Dana at fifty nine seconds. [[slnc 300]] An observer with the same code, five seconds later. [[slnc 600]]
Without replay protection, the bank remembers nothing, so both are let in. [[slnc 600]]
With replay protection, the bank remembers the last step it accepted for Dana: step one. [[slnc 300]] The observer's code is from step one too, so it is refused. [[slnc 600]]
Now the code works once. [[slnc 300]] That is why it is called a one time password.
"""
speech = """
In the output: the two logins, with the same code. [[slnc 400]] Without replay protection: okay, and okay. [[slnc 300]] With it: okay, then replayed.
"""
rows = { server = "active ok" }
console = [
    ["THE LOGINS", "ok"],
    ["  dana        287082 at time 59", "muted"],
    ["  observer    287082 at time 64, 5 seconds later", "muted"],
    ["WITHOUT REPLAY PROTECTION", "bad"],
    ["  dana        OK", "muted"],
    ["  observer    OK  <- REPLAY", "bad"],
    ["WITH REPLAY PROTECTION: THE BANK REMEMBERS STEP 1", "ok"],
    ["  dana        OK", "muted"],
    ["  observer    REPLAYED", "muted"],
]

[[act]]
title = "The bill: what a code cannot do"
summary = "A fake bank page passes on the password and code at once and gets OK; the bank's stolen table gives the attacker Dana's code; a recovery code works once, but is a second way in."
detail = """
Three costs. A FAKE BANK PAGE: Dana types midnight7 and 287082 into it, and it passes both to the real bank at time 61, which says OK; the code
cannot tell the real bank from a copy. A STOLEN SECRETS TABLE: the bank must keep Dana's secret to check codes, so the attacker's own app shows
287082 at time 59, the same as Dana's. A LOST PHONE: Dana types recovery-1, which is OK once and WRONG_CODE the second time; until it is used it is a
second way in, and must be guarded like the password.
"""
figure = "bill"
figure_title = "Three things a code cannot do"
figure_speech = """
Finally, the bill. [[slnc 400]] Three things a code cannot do. [[slnc 600]]
One. [[slnc 300]] Dana types her password and code into a fake bank page. [[slnc 300]] The page passes both to the real bank at once, and the bank says okay. [[slnc 300]] The code cannot tell the fake page from the real one. [[slnc 600]]
Two. [[slnc 300]] The bank must keep Dana's secret, to check her codes. [[slnc 300]] If its table is stolen, the attacker's app shows the same code as Dana's phone. [[slnc 600]]
Three. [[slnc 300]] Dana loses her phone, and types a recovery code. [[slnc 300]] It works once, then it is refused. [[slnc 300]] But until it is used, it is a second way in. [[slnc 600]]
Against a fake page, only a hardware security key helps, because it checks which site it is talking to.
"""
speech = """
The output, part one. [[slnc 300]] What Dana types into the fake page, and the real bank's answer: okay. [[slnc 400]] What the stolen table holds, and the attacker's code: the same as Dana's.
[[page]]
Part two. [[slnc 300]] The recovery code, typed twice. [[slnc 300]] Okay the first time, wrong code the second.
"""
rows = { phish = "active amber", secret = "active amber" }
console = [
