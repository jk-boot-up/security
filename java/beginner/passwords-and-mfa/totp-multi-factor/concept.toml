[[act]]
title = "Logging in with a code, and clocks that disagree"
summary = "The password alone now asks for a code; the right code is accepted; a phone 25 seconds fast is accepted, 70 seconds fast and a 2-step-old code are not."
detail = """
With the second factor on, the password alone gets CODE_NEEDED. Dana's phone shows 287082 at time 59, and the login is OK. A wrong
code, 000000, is WRONG_CODE. Phones' clocks are never exactly right, so the bank accepts the code for the current step and for one
step either side, a window of one. A phone 25 seconds fast shows the next step's code, 359152, and is accepted. A phone 70 seconds fast shows the code
of a step three ahead, 338314, and is not. An old code from step 2, used at time 120, which is step 4, is also refused.
"""
speech = """
Third demo: logging in with a code. [[slnc 400]] The password alone now gets the answer, code needed. [[slnc 600]]
Dana's phone shows two eight seven zero eight two at time fifty nine. [[slnc 300]] The login is accepted. [[slnc 300]] A wrong code is refused. [[slnc 600]]
Clocks are never exactly right. [[slnc 300]] So the bank accepts the code for this step, and for one step either side. [[slnc 600]]
A phone twenty five seconds fast shows the next step's code, and is accepted. [[slnc 300]] A phone seventy seconds fast is three steps ahead, and is refused. [[slnc 300]] An old code, two steps back, is refused too.
"""
rows = { server = "active ok", clock = "active ok" }
console = [
    ["the password alone: CODE_NEEDED", "ok"],
    ["dana's phone shows 287082 at time 59: OK", "ok"],
    ["a wrong code, 000000: WRONG_CODE", "ok"],
    ["a phone 25 seconds fast shows 359152: OK (the bank allows 1 step either side)", "ok"],
    ["a phone 70 seconds fast shows 338314: WRONG_CODE (3 steps ahead)", "ok"],
    ["an old code, from step 2, used at time 120 (step 4): WRONG_CODE", "ok"],
]

[[act]]
title = "The same code twice"
summary = "Without replay protection an observer can reuse Dana's code 5 seconds later; with it, the second use is REPLAYED."
detail = """
A code is good for 30 seconds, plus the window. If someone sees Dana type it, they can use it too, within that time. Without any
memory, the bank accepts the same code twice: dana logs in with 287082, and an observer uses it 5 seconds later,
also OK: a replay. With replay protection, the bank remembers the last step it accepted for each customer, and refuses any code from that step or an
earlier one. The observer gets REPLAYED. The code now works once, which is why it is called a one-time password.
"""
speech = """
Fourth demo: the same code twice. [[slnc 400]] A code is good for thirty seconds, and a little more with the window. [[slnc 300]] So someone who sees Dana type it can use it too. [[slnc 600]]
Without any memory, the bank accepts the same code twice. [[slnc 300]] Dana logs in. [[slnc 300]] An observer uses the same code five seconds later, and is let in. [[slnc 600]]
With replay protection, the bank remembers the last step it accepted for each customer. [[slnc 300]] It refuses that step, and any earlier one. [[slnc 300]] The observer is turned away. [[slnc 600]]
Now the code works once. [[slnc 300]] That is why it is called a one time password.
"""
rows = { server = "active ok" }
console = [
    ["without replay protection: dana logs in with 287082: OK; an observer uses it 5 seconds later: OK  <- REPLAY", "bad"],
    ["with replay protection: dana logs in with 287082: OK; an observer uses it 5 seconds later: REPLAYED", "ok"],
]

[[act]]
title = "The bill: what a code cannot do"
summary = "A fake bank page can pass on the password and code at once; the bank's table holds the secret; a recovery code is a second way in that works once."
detail = """
Three costs. First, a fake bank page asks Dana for her password and her code. The attacker passes both to the real bank at once,
within the code's 30 seconds, and the login is OK. The code cannot tell the real bank from a copy. Second, the bank must keep the secret in
order to check codes. If its table is stolen, the attacker's own app shows 287082 at time 59, the same as Dana's. The secret lives on the
server too. Third, a customer who loses the phone needs a recovery code. It works once, and the second use is refused, but until it is used it is
a second way in, and must be guarded like a password.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] There are three costs. [[slnc 600]]
First, a fake bank page asks Dana for her password and her code. [[slnc 300]] The attacker passes both to the real bank at once, within thirty seconds. [[slnc 300]] The login is accepted. [[slnc 300]] The code cannot tell the real bank from a copy. [[slnc 600]]
Second, the bank must keep the secret, to check codes. [[slnc 300]] If its table is stolen, the attacker's own app shows the same code as Dana's phone. [[slnc 300]] The secret lives on the server too. [[slnc 600]]
Third, Dana loses her phone and uses a recovery code. [[slnc 300]] It works once. [[slnc 300]] The second use is refused. [[slnc 300]] But until it is used, it is a second way in, and must be guarded like a password.
"""
rows = { phish = "active amber", secret = "active amber" }
console = [
