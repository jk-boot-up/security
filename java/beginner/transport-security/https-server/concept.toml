# concept.toml: everything about this project that is not Java code.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "https-server"
module = "transport-security"
title = "An HTTPS Server, Put Together"
short_title = "HTTPS Server"
package = "https"
main_class = "HttpsDemo"
tagline = "The padlock is only the first item on the list"
bold = "A working HTTPS server needs a trusted certificate, TLS 1.3, a redirect from plain HTTP, HSTS, and cookies that stay on HTTPS, and a client must refuse a wrong certificate, a wrong name and a downgrade."
domain = "an online store"
domain_note = ""
youtube_description = """An HTTPS server put together in Java: certificates, TLS, redirects, HSTS and cookies in one working shop. Explained with an online store, like a shop with a strong front door, a sign that points everyone to it, and a rule that valuables never leave through the back. We start a real HTTPS server on this machine, make a checked request, see the plain port only redirect, keep a session cookie on HTTPS with the Secure flag and watch an unflagged cookie leak, see the client refuse an untrusted certificate, a wrong name and a downgrade, and score a careful shop against a careless one on five checks."""
thumb_lines = ["AN HTTPS SERVER", "PUT TOGETHER"]
thumb_code = "HttpsServer + HSTS + Secure"
youtube_title = "An HTTPS Server in Java (TLS, Redirect, HSTS, Secure Cookies)"
youtube_tags = ["https", "tls", "hsts", "secure cookie", "redirect", "certificate", "java httpserver", "java", "cybersecurity for beginners"]

[readme]
intro = """
The earlier projects each showed one piece: a **TLS handshake**, a **certificate chain**, and the **headers and cookies** of HTTP. This one runs them together as a real web server on your machine. The shop serves **HTTPS** with a certificate the client trusts.
Its plain **HTTP** port does one thing, **redirects** to HTTPS. Every HTTPS answer carries **HSTS**, which tells the browser never to use plain HTTP for this shop again. And its session **cookie** is marked **Secure**, so a client never sends it over plain HTTP.

The client side matters just as much. The Java client trusts only the shop's certificate and checks the host name, so it **refuses** a server with a certificate nobody trusts, the right certificate under the wrong name, and a server that only offers old TLS when the client demands 1.3.
The demo ends by scoring a careful shop and a careless one with a five-point checklist, run from outside like an auditor would.
"""
analogy = """
Think of a shop with a strong front door, a sign on the side entrance that points everyone to the front, and a standing rule that valuables never leave through the back. The padlock on the door matters, and so does the sign and the rule.
A careless shop has the same padlock but leaves the side door open, so the padlock tells you very little about the whole shop.
"""
scenario = """
An online store runs a web server. Customers must reach it only over HTTPS, log in with a cookie that cannot leak, and be able to tell the real shop from an impostor. The demo starts a careful shop and a careless one on this machine and tests both from outside.
"""
costs = [
    "**HSTS cannot protect the first visit.** The first request can still be made in the clear, so high-value sites also join browsers' preload lists, which is hard to undo.",
    "**HSTS with a long life is a commitment.** If the certificate expires or breaks, browsers will not let users click through, so renewals must be automated and watched.",
    "**Allowing older TLS is a choice.** Some old clients need TLS 1.2, and allowing it is what a downgrade attack asks for, so keep it only while it is needed.",
    "**The demo uses a test certificate.** A real shop gets a certificate from a public certificate authority and renews it automatically; the demo trusts one certificate that it made itself.",
]
too_much = """
For anything public, all of this is the baseline, not an extra. The part that can be too much is custom code: in production most of it is configuration of a proxy or a framework, as the tools projects show, and certificates come from an automated authority.
"""
met_before = [
    "The padlock in the browser's address bar, and the warning page when a certificate is wrong.",
    "Sites that jump from `http://` to `https://` as soon as they load.",
    "The `Strict-Transport-Security` and `Set-Cookie` lines in browser developer tools.",
    "SSL Labs and similar tests that score a server's configuration.",
]
where = """
This project is the third in [transport-security](..) and puts together [tls-handshake](../tls-handshake), [certificates-and-chain-of-trust](../certificates-and-chain-of-trust) and the headers of [http-basics-and-headers](../../networking/http-basics-and-headers).
"""
twin = """
The shop and the client run on the loopback address of the machine running the demo, on random ports that are never printed. The name `shop.example.test` points to this machine through a small hosts file inside the project, so no DNS is used.
The certificates are two PKCS12 test files with demo passwords, made once with `keytool` and valid for a hundred years.
"""
test_note = "Everything runs on this machine, on random ports that are not printed. The certificates are fixed test files and the name resolves through the project's own hosts file, so the golden output is the same on every run."

[[act]]
title = "An HTTPS request that is checked"
summary = "The shop presents a certificate for CN=shop.example.test, valid 2026-10-17 to 2126-09-23; the client checks it is trusted, names shop.example.test and is current, then gets 200 cart: 2 items over TLSv1.3 with 1 + 1 + 1 + 1 + 1 = 5 of 5 security headers."
detail = """
The customer's client asks for https://shop.example.test/cart. Before any data moves, the shop presents its certificate: subject CN=shop.example.test, issued by itself, naming shop.example.test, valid from 2026-10-17 to 2126-09-23.
The client makes three checks: it is the one certificate the client trusts, it names the host that was asked for (shop.example.test), and today is between the two dates. All three pass, so the request is answered 200 cart: 2 items over TLSv1.3,
with the five security headers: 1 + 1 + 1 + 1 + 1 = 5 of 5.
"""
figure = "checked_request"
figure_title = "Three checks before a single byte of the cart"
figure_speech = """
Here is what happens before the customer sees the cart. [[slnc 400]] At the top, in green, the certificate the shop presents. [[slnc 300]] Its subject is shop dot example dot test. [[slnc 300]] It names shop dot example dot test. [[slnc 300]] And it is valid from twenty twenty six to twenty one twenty six. [[slnc 600]]
In the middle, the client's three checks. [[slnc 300]] One: is this the certificate I trust? [[slnc 300]] Here the client trusts exactly one certificate, and this is it. [[slnc 300]] Two: does it name the host I asked for? [[slnc 300]] Shop dot example dot test, on both sides. [[slnc 300]] Three: is it current? [[slnc 300]] Today is between the two dates. [[slnc 600]]
Only then, in red, the response. [[slnc 300]] Two hundred, cart, two items, over T L S one point three. [[slnc 300]] With all five security headers: five out of five. [[slnc 500]]
If any check fails, the client stops before sending anything.
"""
speech = """
Here is the program's output. [[slnc 400]] The certificate: subject, issuer, which is itself, the name, and the two dates. [[slnc 400]] The three checks, each answered yes. [[slnc 400]] And the response: two hundred, over T L S one point three, with five out of five headers.
"""
rows = { secure = "active ok" }
console = [
    ["THE CERTIFICATE (what the shop presents):", "ok"],
    ["  subject      CN=shop.example.test", "muted"],
    ["  issuer       CN=shop.example.test  (itself)", "muted"],
    ["  names        shop.example.test", "muted"],
    ["  valid        2026-10-17 to 2126-09-23", "muted"],
    ["THE CLIENT'S THREE CHECKS:", "ok"],
    ["  trusted      the one certificate the client trusts: yes", "muted"],
    ["  name         asked for shop.example.test", "muted"],
    ["               the certificate names shop.example.test: yes", "muted"],
    ["  current      today is between the two dates: yes", "muted"],
    ["THE RESPONSE (over TLSv1.3):", "ok"],
    ["  200 cart: 2 items", "muted"],
    ["  security headers 1 + 1 + 1 + 1 + 1 = 5 of 5", "muted"],
]

[[act]]
title = "Plain HTTP only redirects"
summary = "GET http://shop.example.test/cart gets 301 Moved Permanently with Location: https://shop.example.test:<https port>/cart and no HSTS; the HTTPS answer carries max-age=31536000, 31536000 / 86400 = 365 days of HTTPS only."
detail = """
A customer types the old address, http://shop.example.test/cart. The plain port does not serve the cart: it answers 301 Moved Permanently with Location: https://shop.example.test:<https port>/cart, and no Strict-Transport-Security header, because browsers ignore HSTS sent over plain HTTP.
The HTTPS answer carries Strict-Transport-Security: max-age=31536000; includeSubDomains, and 31536000 / 86400 seconds a day = 365 days in which the browser uses HTTPS only. The first request still crossed the network in the clear: HSTS protects only the visits after it.
"""
figure = "redirect"
figure_title = "The first visit is redirected, the next ones go straight to HTTPS"
figure_speech = """
Many customers still type the old address, with plain H T T P. [[slnc 400]] At the top, in green, that request: get H T T P, shop dot example dot test, slash cart. [[slnc 600]]
In red, the answer from the plain port. [[slnc 300]] Three oh one, moved permanently. [[slnc 300]] The location header points to the same page, on H T T P S. [[slnc 300]] No cart, no cookie, nothing else. [[slnc 600]]
The H T T P S answer then carries strict transport security. [[slnc 300]] Its max age is in seconds: thirty one million, five hundred and thirty six thousand. [[slnc 300]] Divided by eighty six thousand four hundred seconds a day, that is three hundred and sixty five days. [[slnc 300]] For a year, the browser goes straight to H T T P S. [[slnc 600]]
In amber, the catch. [[slnc 300]] The very first request still crossed the network in the clear. [[slnc 300]] H S T S protects only the visits after it.
"""
speech = """
Here is the output. [[slnc 400]] The request to the plain port. [[slnc 300]] The response: three oh one, the location on H T T P S, and no strict transport security. [[slnc 400]] Then the next visit: the header, and its max age worked out, three hundred and sixty five days.
"""
rows = { redirect = "active amber" }
console = [
    ["THE REQUEST (to the plain HTTP port):", "ok"],
    ["  GET http://shop.example.test/cart", "muted"],
    ["THE RESPONSE:", "ok"],
    ["  301 Moved Permanently", "muted"],
    ["  Location: https://shop.example.test:<https port>/cart", "muted"],
    ["  Strict-Transport-Security: none (ignored over HTTP)", "muted"],
    ["THE NEXT VISIT (the HTTPS answer carries HSTS):", "ok"],
    ["  Strict-Transport-Security", "muted"],
    ["    max-age=31536000; includeSubDomains", "muted"],
    ["  31536000 / 86400 seconds a day = 365 days of HTTPS only", "muted"],
    ["the first request still crossed the network in the clear:", "muted"],
    ["HSTS protects only the visits after it", "muted"],
]

[[act]]
title = "A cookie that stays on HTTPS"
summary = "The login sets session=...; Secure; HttpOnly; SameSite=Lax; Path=/: the browser sends it over https and not over http. A shop whose cookie is session=...; Path=/ has it sent over plain http: a leak."
detail = """
The login over HTTPS sets session=...; Secure; HttpOnly; SameSite=Lax; Path=/. On the next requests the browser attaches it over https (the shop says cookie received) and does not attach it over http, because of Secure.
Before the fix, a shop whose cookie is just session=...; Path=/ has the cookie sent over plain http too: a leak, since anyone on the network can read it there and use the session.
"""
figure = "secure_cookie"
figure_title = "Which requests carry the session cookie"
figure_speech = """
After login, the shop hands the browser a session cookie. [[slnc 400]] Whoever holds it is logged in. [[slnc 600]]
At the top, in green, the cookie of the careful shop. [[slnc 300]] It is marked Secure, HttpOnly, and SameSite lax. [[slnc 500]]
Below, in red, two next requests. [[slnc 300]] Over H T T P S, the browser attaches it, and the shop says, cookie received. [[slnc 300]] Over plain H T T P, the browser keeps it back, because of Secure. [[slnc 600]]
At the bottom, before the fix: a shop whose cookie has no Secure. [[slnc 300]] Over plain H T T P, the browser sends it. [[slnc 300]] Anyone on the same network can read it, and take over the session.
"""
speech = """
Here is the output. [[slnc 400]] The cookie the login sets, with the value hidden. [[slnc 300]] Over H T T P S it is sent. [[slnc 300]] Over H T T P it is not. [[slnc 400]] And the cookie without Secure is sent over H T T P: a leak.
"""
rows = { cookie = "active ok" }
console = [
    ["THE COOKIE (the login over HTTPS sets):", "ok"],
    ["  session=...; Secure; HttpOnly; SameSite=Lax; Path=/", "muted"],
    ["THE NEXT REQUESTS (does the browser attach it?):", "ok"],
    ["  over https   sent      shop says: cookie received", "muted"],
    ["  over http    not sent  because of Secure", "muted"],
    ["BEFORE THE FIX (a shop whose cookie has no Secure):", "ok"],
    ["  session=...; Path=/", "muted"],
    ["  over http    sent      <- A LEAK", "muted"],
]

[[act]]
title = "What the client refuses"
summary = "A certificate nobody trusts, the right certificate under another name, and a TLS 1.3-only client against a TLS 1.2-only server are refused with SSLHandshakeException; a client that also allows 1.2 connects over TLSv1.2."
detail = """
Four attempts. A server at shop.example.test with a certificate nobody trusts: refused (SSLHandshakeException), not trusted. The shop's own certificate reached as evil.example.test: refused, wrong name. A client that allows only TLS 1.3, against a server that offers only TLS 1.2: refused, no common version.
The same server with a client that also allows 1.2: ok (TLSv1.2). Allowing the older version is the client's choice, and it is exactly what a downgrade attack asks for.
"""
figure = "refusals"
figure_title = "Four attempts, and why three are refused"
figure_speech = """
A careful client refuses to talk when something is wrong. [[slnc 400]] In green, four attempts. [[slnc 600]]
A: the right name, but a certificate that nobody trusts. [[slnc 300]] An impostor. [[slnc 300]] Refused: not trusted. [[slnc 500]]
B: the shop's real certificate, but reached under the name evil dot example dot test. [[slnc 300]] The certificate does not name that host. [[slnc 300]] Refused: wrong name. [[slnc 500]]
C: a client that speaks only T L S one point three, and a server that offers only one point two. [[slnc 300]] No common version, so refused. [[slnc 500]]
D: the same server, but the client also allows one point two. [[slnc 300]] It connects, over T L S one point two. [[slnc 600]]
That last one is the client's choice. [[slnc 300]] And it is what a downgrade attack asks for: talk the older, weaker way.
"""
speech = """
Here is the output. [[slnc 400]] The four attempts, a to d. [[slnc 300]] Then the results. [[slnc 300]] Three refusals, each an S S L handshake exception: not trusted, wrong name, and no common version. [[slnc 300]] And one connection, over T L S one point two.
"""
rows = { refuse = "active ok" }
console = [
    ["THE ATTEMPTS:", "ok"],
    ["  a  shop.example.test, a certificate nobody trusts", "muted"],
    ["  b  the shop's certificate, reached as evil.example.test", "muted"],
    ["  c  client: TLS 1.3 only     server: TLS 1.2 only", "muted"],
    ["  d  client: TLS 1.3 or 1.2   server: TLS 1.2 only", "muted"],
    ["THE RESULTS:", "ok"],
    ["  a  refused (SSLHandshakeException)  not trusted", "muted"],
    ["  b  refused (SSLHandshakeException)  wrong name", "muted"],
    ["  c  refused (SSLHandshakeException)  no common version", "muted"],
    ["  d  ok (TLSv1.2)", "muted"],
    ["allowing the older version is the client's choice, and", "muted"],
    ["it is exactly what a downgrade attack asks for", "muted"],
]

[[act]]
title = "Scoring a shop from outside"
summary = "Five checks from outside: the careful shop scores 1 + 1 + 1 + 1 + 1 = 5 of 5; the careless shop has a trusted certificate but nothing else, 1 + 0 + 0 + 0 + 0 = 1 of 5."
detail = """
Two shops are checked from outside on the same five points: the certificate is trusted and names the host, TLS 1.3 is accepted, plain HTTP redirects to HTTPS, HSTS lasts at least a year, and the session cookie is Secure, HttpOnly and SameSite.
The careful shop passes all five, 1 + 1 + 1 + 1 + 1 = 5 of 5. The careless shop has the same valid certificate but passes nothing else, 1 + 0 + 0 + 0 + 0 = 1 of 5. A padlock proves who the server is and that the connection is private; it says nothing about the rest of the setup.
"""
figure = "scorecard"
figure_title = "Same certificate, five points, two scores"
figure_speech = """
Last, the shop is scored from outside, the way a customer's browser or a scanner sees it. [[slnc 400]] Five checks, in rows. [[slnc 300]] Two shops, in columns. [[slnc 600]]
Both shops use the same, valid certificate. [[slnc 300]] So both pass the first row, and both show a padlock. [[slnc 500]]
The careful shop also accepts T L S one point three, redirects plain H T T P, sends a year of H S T S, and marks its cookie Secure, HttpOnly and SameSite. [[slnc 300]] Five out of five. [[slnc 500]]
The careless shop passes nothing else. [[slnc 300]] One plus zero plus zero plus zero plus zero: one out of five. [[slnc 600]]
A padlock proves who the server is, and that the connection is private. [[slnc 300]] It says nothing about the rest.
"""
speech = """
Here is the output. [[slnc 400]] The five checks, with yes or no for each shop. [[slnc 400]] And the scores, added up: five out of five, and one out of five.
"""
rows = { score = "active amber" }
console = [
    ["THE CHECKS (the same five, on both shops):", "ok"],
    ["                                       careful  careless", "muted"],
    ["  certificate trusted, names the host  yes      yes", "muted"],
    ["  TLS 1.3 accepted                     yes      no", "muted"],
    ["  plain HTTP redirects to HTTPS        yes      no", "muted"],
    ["  HSTS for at least a year             yes      no", "muted"],
    ["  cookie Secure, HttpOnly, SameSite    yes      no", "muted"],
    ["THE SCORES (one point per check):", "ok"],
    ["  careful    1 + 1 + 1 + 1 + 1 = 5 of 5", "muted"],
    ["  careless   1 + 0 + 0 + 0 + 0 = 1 of 5", "muted"],
    ["a padlock proves who the server is and that the connection", "muted"],
    ["is private; it says nothing about the rest of the setup", "muted"],
]

