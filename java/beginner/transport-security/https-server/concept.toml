kind = "bullets"
title = "How To Use It"
body = ["HTTPS is a set of settings, not a certificate", "Redirect, then HSTS, then preload if ready", "Cookies: Secure, HttpOnly, SameSite", "Offer TLS 1.3, renew certificates automatically", "Test from outside"]
narration = """So, how do you use it? [[slnc 400]] Treat H T T P S as a set of settings, not a certificate. [[slnc 500]] Redirect first, then send H S T S, and join the preload list when you are ready. [[slnc 500]] Mark cookies Secure, Http Only, and Same Site. [[slnc 500]] Offer T L S one point three, and renew certificates automatically. [[slnc 500]] And test the result from outside."""

[[scene]]
key = "13-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a sixth check", "to the checklist."]
narration = """That's an H T T P S server, put together. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] The padlock is only the first item on the list. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine, with nothing installed except a Java development kit. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a sixth check to the checklist, and a server profile that fails it. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
An online store's HTTPS web server and the clients that call it: the certificate it presents, the TLS versions it accepts, the plain HTTP port that redirects, the headers it sends and the session cookie. It covers an attacker on the network path and an impostor server.
It does not cover application bugs, the certificate authority's own security, or attacks on the server's host.
"""
assets = [
    "The confidentiality and integrity of customers' requests and answers.",
    "The session cookie.",
    "The server's private key.",
    "The customer's ability to tell the real shop from an impostor.",
]
actors = [
    "Customers using browsers or clients.",
    "An attacker on the network path who can read, change and block traffic.",
    "An impostor who runs a server with a certificate nobody trusts, or a trusted one for another name.",
]
boundaries = [
    "Customer to the network: everything crossing it can be read and changed unless TLS protects it.",
    "Plain HTTP port to HTTPS port: the redirect is the only thing that crosses it.",
]
assumptions = [
    "The server's private key stays on the server.",
    "Clients trust only certificate authorities they should.",
    "In the demo, the certificates are test files made once, the passwords are demo values, and the shop's name resolves through a local hosts file.",
]
out_of_scope = [
    "Certificate issuance and revocation in the real world.",
    "Reverse proxies and load balancers.",
    "Mutual TLS.",
    "Application-level attacks such as injection.",
]
tests = [
    "`HttpsTest` checks a trusted request over TLS 1.3, the five headers, the redirect without HSTS, cookie flags and the leak of an unflagged cookie, the refusal of an impostor certificate, a wrong name and a downgrade, and both checklist scores.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next module, safe-habits, turns from how data travels to how systems are kept safe over time: least privilege, patching and backups.
"""

[[threat]]
id = "T1"
stride = "I"
threat = "A first visit over plain HTTP, or a stripped redirect, exposes the request or sends the customer to an attacker"
where = "`ShopServer` plain port"
control = "Redirect to HTTPS, then HSTS for later visits, and HSTS preload for the first"
residual = "The very first request can still be intercepted without preload"

[[threat]]
id = "T2"
stride = "S"
threat = "An impostor server presents a certificate nobody trusts, or a trusted one for another name"
where = "`ShopClient`"
control = "The client trusts only the shop's certificate and checks the host name"
residual = "Clients that skip verification or trust too many authorities are not protected"

[[threat]]
id = "T3"
stride = "I"
threat = "The session cookie is sent over plain HTTP and read on the network"
where = "`ShopServer` login"
control = "Secure, HttpOnly and SameSite attributes"
residual = "A cookie set without Secure, as the careless shop does, leaks"

[[threat]]
id = "T4"
stride = "T"
threat = "An attacker forces an older TLS version to use its weaknesses"
where = "`ShopClient`, `ShopServer` protocols"
control = "The client demands TLS 1.3 where it can, and the server offers only versions it needs"
residual = "Clients that must support 1.2 stay exposed to downgrade attempts against 1.2"

[[threat]]
id = "T5"
stride = "D"
threat = "An expired or broken certificate with HSTS locks customers out"
where = "`ShopServer` HSTS header"
control = "Automated renewal and monitoring of expiry"
residual = "HSTS with a long life turns a certificate mistake into an outage"
