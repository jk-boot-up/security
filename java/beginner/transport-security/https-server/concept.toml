# concept.toml: everything about this project that is not Java code.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "https-server"
module = "transport-security"
title = "An HTTPS Server, Put Together"
short_title = "HTTPS Server"
package = "https"
main_class = "HttpsDemo"
tagline = "The padlock is only the first item on the list"
bold = "A working HTTPS server needs a trusted certificate, TLS 1.3, a redirect from plain HTTP, HSTS, and cookies that stay on HTTPS, and a client must refuse a wrong certificate, a wrong name and a downgrade."
domain = "an online store"
domain_note = ""
youtube_description = """An HTTPS server put together in Java: certificates, TLS, redirects, HSTS and cookies in one working shop. Explained with an online store, like a shop with a strong front door, a sign that points everyone to it, and a rule that valuables never leave through the back. We start a real HTTPS server on this machine, make a checked request, see the plain port only redirect, keep a session cookie on HTTPS with the Secure flag and watch an unflagged cookie leak, see the client refuse an untrusted certificate, a wrong name and a downgrade, and score a careful shop against a careless one on five checks."""
thumb_lines = ["AN HTTPS SERVER", "PUT TOGETHER"]
thumb_code = "HttpsServer + HSTS + Secure"
youtube_title = "An HTTPS Server in Java (TLS, Redirect, HSTS, Secure Cookies)"
youtube_tags = ["https", "tls", "hsts", "secure cookie", "redirect", "certificate", "java httpserver", "java", "cybersecurity for beginners"]

[readme]
intro = """
The earlier projects each showed one piece: a **TLS handshake**, a **certificate chain**, and the **headers and cookies** of HTTP. This one runs them together as a real web server on your machine. The shop serves **HTTPS** with a certificate the client trusts.
Its plain **HTTP** port does one thing, **redirects** to HTTPS. Every HTTPS answer carries **HSTS**, which tells the browser never to use plain HTTP for this shop again. And its session **cookie** is marked **Secure**, so a client never sends it over plain HTTP.

The client side matters just as much. The Java client trusts only the shop's certificate and checks the host name, so it **refuses** a server with a certificate nobody trusts, the right certificate under the wrong name, and a server that only offers old TLS when the client demands 1.3.
The demo ends by scoring a careful shop and a careless one with a five-point checklist, run from outside like an auditor would.
"""
analogy = """
Think of a shop with a strong front door, a sign on the side entrance that points everyone to the front, and a standing rule that valuables never leave through the back. The padlock on the door matters, and so does the sign and the rule.
A careless shop has the same padlock but leaves the side door open, so the padlock tells you very little about the whole shop.
"""
scenario = """
An online store runs a web server. Customers must reach it only over HTTPS, log in with a cookie that cannot leak, and be able to tell the real shop from an impostor. The demo starts a careful shop and a careless one on this machine and tests both from outside.
"""
costs = [
    "**HSTS cannot protect the first visit.** The first request can still be made in the clear, so high-value sites also join browsers' preload lists, which is hard to undo.",
    "**HSTS with a long life is a commitment.** If the certificate expires or breaks, browsers will not let users click through, so renewals must be automated and watched.",
    "**Allowing older TLS is a choice.** Some old clients need TLS 1.2, and allowing it is what a downgrade attack asks for, so keep it only while it is needed.",
    "**The demo uses a test certificate.** A real shop gets a certificate from a public certificate authority and renews it automatically; the demo trusts one certificate that it made itself.",
]
too_much = """
For anything public, all of this is the baseline, not an extra. The part that can be too much is custom code: in production most of it is configuration of a proxy or a framework, as the tools projects show, and certificates come from an automated authority.
"""
met_before = [
    "The padlock in the browser's address bar, and the warning page when a certificate is wrong.",
    "Sites that jump from `http://` to `https://` as soon as they load.",
    "The `Strict-Transport-Security` and `Set-Cookie` lines in browser developer tools.",
    "SSL Labs and similar tests that score a server's configuration.",
]
where = """
This project is the third in [transport-security](..) and puts together [tls-handshake](../tls-handshake), [certificates-and-chain-of-trust](../certificates-and-chain-of-trust) and the headers of [http-basics-and-headers](../../networking/http-basics-and-headers).
"""
twin = """
The shop and the client run on the loopback address of the machine running the demo, on random ports that are never printed. The name `shop.example.test` points to this machine through a small hosts file inside the project, so no DNS is used.
The certificates are two PKCS12 test files with demo passwords, made once with `keytool` and valid for a hundred years.
"""
test_note = "Everything runs on this machine, on random ports that are not printed. The certificates are fixed test files and the name resolves through the project's own hosts file, so the golden output is the same on every run."

[[act]]
title = "An HTTPS request that is checked"
summary = "The client trusts the shop's certificate, which names shop.example.test; the request returns 200 over TLS 1.3 with all five security headers."
detail = """
The client sends a request to the shop over HTTPS. It checks that the certificate is one it trusts, that it names the shop, and that it is current. The shop answers 200 over TLS 1.3, with five of the five security headers including HSTS.
"""
speech = """
First demo: an HTTPS request that is checked. [[slnc 400]] The client trusts the shop's certificate, and checks that it names the shop. [[slnc 600]]
The shop answers over T L S one point three. [[slnc 300]] With all five security headers, including H S T S. [[slnc 600]]
The client checked three things: that the certificate is one it trusts, that it names the shop, and that it is current.
"""
rows = { secure = "active ok" }
console = [
    ["the shop's certificate is trusted by the client and matches the name shop.example.test", "ok"],
    ["the request is answered: 200 cart: 2 items, over TLSv1.3", "ok"],
    ["security headers present: 5 of 5, including Strict-Transport-Security", "ok"],
    ["the client checked three things: that the certificate is one it trusts, that it names the shop, and that it is current", "muted"],
]

[[act]]
title = "Plain HTTP only redirects"
summary = "The plain port answers 301 to an https address and sends no HSTS; the first request itself still crossed the network in the clear."
detail = """
A request to the plain port gets a 301, moved permanently, pointing to an https address. The plain answer carries no HSTS header, because browsers ignore HSTS sent over plain HTTP.
The first request itself crossed the network in the clear. HSTS protects the later visits, not the first.
"""
speech = """
Second demo: plain HTTP only redirects. [[slnc 400]] A request to the plain port gets a three oh one, pointing to an H T T P S address. [[slnc 600]]
The plain answer carries no H S T S header, because browsers ignore it over plain H T T P. [[slnc 600]]
And the first request itself crossed the network in the clear. [[slnc 300]] H S T S protects the later visits, not the first.
"""
rows = { redirect = "active amber" }
console = [
    ["a request to the plain port gets: 301 moved permanently", "muted"],
    ["it points to an https address: true", "ok"],
    ["the plain answer carries no HSTS header: true  (browsers ignore HSTS sent over HTTP)", "muted"],
    ["the first request itself crossed the network in the clear  <- THE FIRST VISIT IS STILL EXPOSED; HSTS protects the later ones", "amber"],
]

[[act]]
title = "A cookie that stays on HTTPS"
summary = "The login cookie is Secure, HttpOnly and SameSite=Lax, so it is sent over HTTPS and not over plain HTTP; the same cookie without Secure leaks."
detail = """
The login sets a cookie marked Secure, HttpOnly and SameSite=Lax. Asked again over HTTPS, the cookie is sent. Asked over plain HTTP, it is not sent: the Secure flag keeps it off plain connections.
A cookie without the Secure flag, asked over plain HTTP, is sent, and that is a leak.
"""
speech = """
Third demo: a cookie that stays on H T T P S. [[slnc 400]] The login sets a cookie with three flags: Secure, Http Only, and Same Site. [[slnc 600]]
Over H T T P S, the cookie is sent. [[slnc 300]] Over plain H T T P, it is not. [[slnc 600]]
The same cookie without the Secure flag is sent over plain H T T P. [[slnc 300]] That is a leak.
"""
rows = { cookie = "active ok" }
console = [
    ["the login sets: session=...; Secure; HttpOnly; SameSite=Lax; Path=/", "muted"],
    ["asking again over https, the cookie is sent: cookie received", "ok"],
    ["asking over plain http, the cookie is sent: false  (the Secure flag keeps it off plain connections)", "ok"],
    ["a cookie without the Secure flag, asked over plain http, is sent: true  <- A LEAK", "bad"],
]

[[act]]
title = "What the client refuses"
summary = "The client refuses a certificate nobody trusts, the right certificate under another name, and a TLS 1.2 server when it demands 1.3; it accepts 1.2 only when it allows it."
detail = """
A server with the right name and a certificate nobody trusts is refused. The right certificate reached under another name is refused. A client that demands TLS 1.3 refuses a server that offers only 1.2. The same server works for a client that also allows 1.2, over TLS 1.2.
Allowing the older version is a choice the client makes, and it is what a downgrade attack asks for.
"""
speech = """
Fourth demo: what the client refuses. [[slnc 400]] A server with the right name and a certificate nobody trusts is refused. [[slnc 600]]
The right certificate under another name is refused. [[slnc 600]]
A client that demands T L S one point three refuses a server that offers only one point two. [[slnc 600]]
Allowing the older version is a choice, and it is what a downgrade attack asks for.
"""
rows = { refuse = "active ok" }
console = [
    ["a server with the right name and a certificate nobody trusts: refused (SSLHandshakeException)", "ok"],
    ["the right certificate, reached under another name: refused (SSLHandshakeException)", "ok"],
    ["a client that demands TLS 1.3, and a server that offers only 1.2: refused (SSLHandshakeException)", "ok"],
    ["the same server, a client that also allows 1.2: ok (TLSv1.2)", "amber"],
    ["allowing the older version is a choice the client makes, and it is what a downgrade attack asks for", "amber"],
]

[[act]]
title = "Scoring a shop from outside"
summary = "A five-point checklist gives the careful shop 5 of 5 and the careless shop 1 of 5: its certificate is valid and nothing else is right."
detail = """
An auditor's checklist probes a running shop from outside: the certificate is trusted and matches, TLS 1.3 is accepted, plain HTTP redirects, HSTS lasts a year, and the session cookie is Secure, HttpOnly and SameSite.
The careful shop scores 5 of 5. The careless shop has the same valid certificate and scores 1 of 5. A padlock proves who the server is and that the connection is private; it says nothing about the rest.
"""
speech = """
Fifth demo: scoring a shop from outside. [[slnc 400]] An auditor checks five things. [[slnc 300]] A trusted certificate. [[slnc 300]] T L S one point three. [[slnc 300]] A redirect. [[slnc 300]] H S T S. [[slnc 300]] And a safe cookie. [[slnc 600]]
The careful shop scores five out of five. [[slnc 300]] The careless shop has the same certificate, and scores one. [[slnc 600]]
A padlock says who the server is, and that the connection is private. [[slnc 300]] It says nothing about the rest.
"""
rows = { score = "active amber" }
console = [
    ["the careful shop scores 5 of 5", "ok"],
    ["the careless shop, the certificate is trusted and matches the host name: yes", "ok"],
    ["the careless shop, TLS 1.3 is accepted: no", "bad"],
    ["the careless shop, plain HTTP redirects to HTTPS: no", "bad"],
    ["the careless shop, HSTS lasts at least a year: no", "bad"],
    ["the careless shop, the session cookie is Secure, HttpOnly and SameSite: no", "bad"],
    ["the careless shop scores 1 of 5: a valid certificate is only the first item", "amber"],
]

[animation]
subtitle = "An online store runs HTTPS for real: a trusted certificate, a redirect, HSTS and a cookie that stays put."
boxes = [
