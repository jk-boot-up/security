[docs.problem]
scenario = """
An online store must serve customers only over HTTPS, keep their login cookie private, and let them tell the real shop from an impostor, while some visitors still arrive by typing an old plain-HTTP address.
"""
naive = """
Install a certificate and assume the job is done. The padlock appears, and the plain port, the cookie flags and the old TLS versions are left as they were.
"""
deliver = [
    "A real HTTPS server and a plain HTTP server on this machine, started and stopped by the code.",
    "A client that verifies the certificate and the host name, and refuses impostors, wrong names and downgrades.",
    "A redirect with HSTS, and cookies that stay on HTTPS, and a demonstration of a leak.",
    "A five-point checklist run from outside against a careful and a careless shop.",
    "The same output on every run, with random ports never printed.",
]

[docs.prerequisites]
required = [
    "Java basics",
    "The tls-handshake and certificates-and-chain-of-trust projects, or an idea of what a certificate and a handshake are",
    "The http-basics-and-headers project, or an idea of what a header and a cookie are",
]
not_required = [
    "A real domain name or a certificate from a public authority",
    "Any web framework",
]
install = []

[docs.session]
objectives = [
    "list what a secure web server needs besides a certificate",
    "explain what HSTS does and what it cannot do",
    "explain what the Secure flag does for a cookie",
    "explain why a client should demand TLS 1.3 when it can",
]
walkthrough = """
Start with the shop and its doors. Run the demo one act at a time. After act two, ask what the first visit of a new customer looks like. After act three, ask how a cookie can leak on a site that uses HTTPS everywhere.
After act four, ask which refusal protects against which attacker. Finish with the checklist and ask what a sixth item would be.
"""
exercises = [
    "Add a sixth check to the checklist: the server does not offer the weak version of TLS. Add the matching server profile.",
    "Make the strong shop send HSTS with a short max-age and see which check fails.",
    "Add a `/logout` route that expires the cookie, with the same attributes, and test it.",
    "Add a certificate that has expired to the keystore and show the client refusing it.",
]

[docs.explained]
sentence = """
A secure web server needs a trusted certificate, a modern TLS version, a redirect from plain HTTP, HSTS, and cookies that cannot leave over HTTP, and clients that check all of it and refuse an impostor, a wrong name or a downgrade.
"""
verdict = """
Treat HTTPS as a set of settings, not a certificate. Redirect plain HTTP, send HSTS once everything works, mark cookies Secure, HttpOnly and SameSite, offer TLS 1.3, renew certificates automatically, and test the result from outside.
"""
recognise = [
    "`Strict-Transport-Security` and `Set-Cookie: ...; Secure; HttpOnly; SameSite=...` in a browser's developer tools.",
    "A 301 from `http://` to `https://` in a `curl -I` call.",
    "SSL Labs and other scanners that give a grade to a server.",
    "Automatic certificate renewal with ACME clients.",
]

[spec]
purpose = """
Teach how the pieces of HTTPS fit together by running a real server on this machine, with a client that checks it, and a checklist that scores a careful and a careless configuration.
"""
nongoals = [
    "Getting a certificate from a public authority.",
    "Reverse proxies and load balancers: the tools project.",
    "Client certificates and mutual TLS.",
]
problem = """
Learners who know what a certificate is still ship servers that are only partly secure, because they stop at the padlock.
"""
roles = [["The shop (HTTPS and plain HTTP)", "`ShopServer`"], ["The verifying client", "`ShopClient`"], ["The checklist", "`HttpsChecklist`"], ["Header scoring", "`HeaderAudit`"], ["Test certificates", "`TestCertificates`"], ["Entry point", "`HttpsDemo`"]]
requirements = [
    "A trusted request succeeds over TLS 1.3 with all five security headers.",
    "The plain port redirects and sends no HSTS.",
    "A Secure cookie is not sent over plain HTTP and an unflagged cookie is.",
    "An untrusted certificate, a wrong name and a downgrade are each refused.",
    "The checklist scores the careful shop 5 and the careless shop 1.",
    "The demo prints the same output on every run.",
]

