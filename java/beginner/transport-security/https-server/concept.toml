[[scene]]
key = "01-poster"
kind = "poster"
title = "An HTTPS Server, Put Together"
narration = """Hello, and welcome. [[slnc 400]] This video puts an H T T P S server together, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] H T T P S is H T T P, the HyperText Transfer Protocol, carried inside T L S, Transport Layer Security, with a certificate that proves who the server is. [[slnc 600]] Think of a shop with a strong front door. [[slnc 300]] A sign on the side entrance that points everyone to the front. [[slnc 300]] And a rule that valuables never leave through the back. [[slnc 300]] A careless shop has the same padlock, but leaves the side door open. [[slnc 700]] In this video, the domain is an online store. [[slnc 500]] By the end, you will hear what a secure server needs besides a certificate. [[slnc 300]] What the client must refuse. [[slnc 300]] And how to score a server from outside."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online store runs a web server.", "", "Customers must reach it only over HTTPS,", "log in with a cookie that cannot leak,", "and tell the real shop from an impostor."]
narration = """Here is the scenario. [[slnc 400]] An online store runs a web server. [[slnc 500]] Customers must reach it only over H T T P S. [[slnc 300]] They log in with a cookie that cannot leak. [[slnc 300]] And they must be able to tell the real shop from an impostor. [[slnc 600]] Some visitors still arrive by typing an old plain H T T P address."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["HTTPS: HTTP inside TLS", "Redirect: a 301 that points elsewhere", "HSTS: always use HTTPS for this site", "Secure cookie: never sent over plain HTTP", "Downgrade: forcing an older, weaker version"]
narration = """Before the demos, the words. [[slnc 500]] H T T P S is H T T P inside T L S. [[slnc 500]] A redirect is an answer that points somewhere else. [[slnc 500]] H S T S tells the browser to use H T T P S for this site, from now on. [[slnc 500]] A secure cookie is never sent over plain H T T P. [[slnc 500]] And a downgrade is an attempt to force an older, weaker version."""

[[scene]]
key = "03-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "04-doors"
kind = "figure"
title = "One shop, two doors"
body = "two_doors"
narration = """Let's look at how the shop is built. [[slnc 400]] It has two doors, two ports on the same machine. [[slnc 500]] On the left, the plain H T T P door. [[slnc 300]] Everything through it travels as readable text. [[slnc 300]] So this door serves nothing at all. [[slnc 300]] It only answers three oh one, and points to the other door. [[slnc 600]] On the right, the H T T P S door. [[slnc 300]] Here the connection is encrypted with T L S, and the shop proves who it is with its certificate. [[slnc 300]] This door serves the cart and the login. [[slnc 300]] And it adds the five security headers and the secure cookie. [[slnc 600]] Below, the customer's client. [[slnc 300]] It trusts exactly one certificate, the shop's. [[slnc 300]] Every act checks one part of this picture."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "09-ladder"
kind = "bullets"
title = "The Five-Point Checklist"
body = ["Certificate trusted, name matches", "TLS 1.3 accepted", "Plain HTTP redirects to HTTPS", "HSTS lasts at least a year", "Session cookie: Secure, HttpOnly, SameSite"]
narration = """Let's put the checklist side by side. [[slnc 400]] One. A certificate the client trusts, that names the shop. [[slnc 500]] Two. T L S one point three is accepted. [[slnc 500]] Three. Plain H T T P redirects to H T T P S. [[slnc 500]] Four. H S T S lasts at least a year. [[slnc 500]] Five. The session cookie is Secure, Http Only, and Same Site. [[slnc 600]] The careless shop passed only the first."""

[[scene]]
key = "11-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["The padlock and the warning page", "http:// jumping to https://", "Strict-Transport-Security in developer tools", "SSL Labs grades"]
narration = """You have probably met this already. [[slnc 400]] The padlock in the address bar, and the warning page when a certificate is wrong. [[slnc 500]] Sites that jump from H T T P to H T T P S as soon as they load. [[slnc 500]] The strict transport security header, in the browser's developer tools. [[slnc 500]] And scanners that give a server a grade."""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["HTTPS is a set of settings, not a certificate", "Redirect, then HSTS, then preload if ready", "Cookies: Secure, HttpOnly, SameSite", "Offer TLS 1.3, renew certificates automatically", "Test from outside"]
narration = """So, how do you use it? [[slnc 400]] Treat H T T P S as a set of settings, not a certificate. [[slnc 500]] Redirect first, then send H S T S, and join the preload list when you are ready. [[slnc 500]] Mark cookies Secure, Http Only, and Same Site. [[slnc 500]] Offer T L S one point three, and renew certificates automatically. [[slnc 500]] And test the result from outside."""

[[scene]]
key = "13-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "13-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a sixth check", "to the checklist."]
narration = """That's an H T T P S server, put together. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] The padlock is only the first item on the list. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine, with nothing installed except a Java development kit. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a sixth check to the checklist, and a server profile that fails it. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
An online store's HTTPS web server and the clients that call it: the certificate it presents, the TLS versions it accepts, the plain HTTP port that redirects, the headers it sends and the session cookie. It covers an attacker on the network path and an impostor server.
It does not cover application bugs, the certificate authority's own security, or attacks on the server's host.
"""
assets = [
    "The confidentiality and integrity of customers' requests and answers.",
    "The session cookie.",
    "The server's private key.",
    "The customer's ability to tell the real shop from an impostor.",
]
actors = [
    "Customers using browsers or clients.",
    "An attacker on the network path who can read, change and block traffic.",
    "An impostor who runs a server with a certificate nobody trusts, or a trusted one for another name.",
]
boundaries = [
    "Customer to the network: everything crossing it can be read and changed unless TLS protects it.",
    "Plain HTTP port to HTTPS port: the redirect is the only thing that crosses it.",
]
assumptions = [
    "The server's private key stays on the server.",
    "Clients trust only certificate authorities they should.",
    "In the demo, the certificates are test files made once, the passwords are demo values, and the shop's name resolves through a local hosts file.",
]
out_of_scope = [
    "Certificate issuance and revocation in the real world.",
    "Reverse proxies and load balancers.",
    "Mutual TLS.",
    "Application-level attacks such as injection.",
]
tests = [
    "`HttpsTest` checks a trusted request over TLS 1.3, the five headers, the redirect without HSTS, cookie flags and the leak of an unflagged cookie, the refusal of an impostor certificate, a wrong name and a downgrade, and both checklist scores.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next module, safe-habits, turns from how data travels to how systems are kept safe over time: least privilege, patching and backups.
"""

[[threat]]
id = "T1"
stride = "I"
threat = "A first visit over plain HTTP, or a stripped redirect, exposes the request or sends the customer to an attacker"
where = "`ShopServer` plain port"
control = "Redirect to HTTPS, then HSTS for later visits, and HSTS preload for the first"
residual = "The very first request can still be intercepted without preload"

[[threat]]
id = "T2"
stride = "S"
threat = "An impostor server presents a certificate nobody trusts, or a trusted one for another name"
where = "`ShopClient`"
control = "The client trusts only the shop's certificate and checks the host name"
residual = "Clients that skip verification or trust too many authorities are not protected"

[[threat]]
id = "T3"
stride = "I"
threat = "The session cookie is sent over plain HTTP and read on the network"
where = "`ShopServer` login"
control = "Secure, HttpOnly and SameSite attributes"
residual = "A cookie set without Secure, as the careless shop does, leaks"

[[threat]]
id = "T4"
stride = "T"
threat = "An attacker forces an older TLS version to use its weaknesses"
where = "`ShopClient`, `ShopServer` protocols"
control = "The client demands TLS 1.3 where it can, and the server offers only versions it needs"
residual = "Clients that must support 1.2 stay exposed to downgrade attempts against 1.2"

[[threat]]
id = "T5"
stride = "D"
threat = "An expired or broken certificate with HSTS locks customers out"
where = "`ShopServer` HSTS header"
control = "Automated renewal and monitoring of expiry"
residual = "HSTS with a long life turns a certificate mistake into an outage"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] Five small classes, plus the demo that runs the five acts on this machine. [[slnc 300]] Here is what each one does."""

[[class]]
name = "ShopServer"
what = "the shop's two doors: an HTTPS port and a plain HTTP port"
[[class.part]]
title = "the plain door only redirects"
code = """
if (!secure && strong) {
    exchange.getResponseHeaders().add("Location",
            "https://" + TestCertificates.HOST + ":" + httpsPort() + path);
    respond(exchange, 301, "");
"""
speech = """The shop server opens two ports with Java's own server classes. [[slnc 300]] On the plain port, the careful shop answers only three oh one, with a location on H T T P S."""
[[class.part]]
title = "the HTTPS door adds HSTS and a Secure cookie"
code = """
ssl.setProtocols(protocols);
...
exchange.getResponseHeaders().add("Strict-Transport-Security",
        "max-age=31536000; includeSubDomains");
...
exchange.getResponseHeaders().add("Set-Cookie", strong
        ? "session=abc123; Secure; HttpOnly; SameSite=Lax; Path=/"
        : "session=abc123; Path=/");
"""
speech = """On the H T T P S port, the shop allows only the T L S versions it was given. [[slnc 300]] It adds strict transport security for a year. [[slnc 300]] And the careful shop marks its session cookie Secure, HttpOnly and SameSite."""

[[class]]
name = "TestCertificates"
what = "the shop's keys, an impostor's, and the client's trust"
[[class.part]]
title = "the client trusts exactly one certificate"
code = """
Certificate shop = shopCertificate();
KeyStore trust = KeyStore.getInstance("PKCS12");
trust.load(null, null);
trust.setCertificateEntry("shop", shop);
"""
speech = """Test certificates loads two key stores, made once with keytool. [[slnc 300]] The client's trust store holds exactly one entry: the shop's certificate. [[slnc 300]] So the impostor's certificate, with the same name, is not trusted."""

[[class]]
name = "ShopClient"
what = "a careful customer: verifies the server and keeps cookies"
[[class.part]]
title = "verify, and never follow a redirect blindly"
code = """
client = HttpClient.newBuilder()
        .sslContext(trust)
        .sslParameters(parameters)
        .cookieHandler(cookies)
        .followRedirects(HttpClient.Redirect.NEVER)
"""
speech = """The shop client uses Java's H T T P client with the trust store. [[slnc 300]] It checks the host name by default. [[slnc 300]] It keeps cookies like a browser, and does not follow redirects, so the demo can look at them."""

[[class]]
name = "HttpsDemo"
what = "runs the five acts and shows the client's three checks"
[[class.part]]
title = "the three checks, with the real certificate"
code = """
boolean trusted = cert.equals(TestCertificates.shopCertificate());
boolean named = names.equals(SHOP);
...
    cert.checkValidity();
"""
speech = """The demo redoes the client's three checks with the certificate that really arrived. [[slnc 300]] Is it the trusted one? [[slnc 300]] Does it name the shop? [[slnc 300]] And is it valid today?"""

[[class]]
name = "HttpsChecklist"
what = "scores a shop from outside on five points"
[[class.part]]
title = "one check: plain HTTP must redirect"
code = """
redirects = response.statusCode() == 301
        && response.headers().firstValue("Location").orElse("").startsWith("https://");
...
cookieOk = cookie.contains("Secure") && cookie.contains("HttpOnly")
        && cookie.contains("SameSite=");
"""
speech = """The checklist only uses what anyone outside can see. [[slnc 300]] For example, a plain request must get a three oh one to an H T T P S address. [[slnc 300]] And the login cookie must carry Secure, HttpOnly and SameSite."""

[[acronym]]
short = "HTTP"
long = "HyperText Transfer Protocol"
say = "H T T P is the HyperText Transfer Protocol: the plain text messages that browsers and web servers send."
[[acronym]]
short = "HTTPS"
long = "HTTP Secure (HTTP inside TLS)"
say = "H T T P S is H T T P Secure: the same messages, sent inside an encrypted T L S connection."
[[acronym]]
short = "TLS"
long = "Transport Layer Security"
say = "T L S is Transport Layer Security: it encrypts the connection and lets the server prove who it is with a certificate."
[[acronym]]
short = "SSL"
long = "Secure Sockets Layer (TLS's old name)"
say = "S S L is Secure Sockets Layer, the old name of T L S. Java still uses it in names such as S S L handshake exception."
[[acronym]]
short = "HSTS"
long = "HTTP Strict Transport Security"
say = "H S T S is H T T P Strict Transport Security: a header that tells the browser to use H T T P S only."
[[acronym]]
short = "CN"
long = "Common Name (the name in a certificate's subject)"
say = "C N is the Common Name: the name written in a certificate's subject, here the shop's host name."
