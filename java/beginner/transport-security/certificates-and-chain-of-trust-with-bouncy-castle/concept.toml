[poster]
headline = [["CERTIFICATES AND", "text"], ["CHAIN OF TRUST", "accent"]]
taglines = [["Building a certificate authority, and checking it with another program", "gold"]]
before = { code = "bytes written by hand", note = "hard to see what each field means", tag = "BEFORE" }
after = { code = "JcaX509v3CertificateBuilder", note = "named extensions, checked by OpenSSL", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "Certificates and Chain of Trust with Bouncy Castle"
narration = """Hello, and welcome. [[slnc 400]] This video explains certificates and the chain of trust, with Bouncy Castle and OpenSSL, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A certificate is a public key with a name, signed by an authority. [[slnc 300]] A chain of trust is a path of such signatures, from a certificate you want to trust, to a root you already trust. [[slnc 600]] Think of a passport office. [[slnc 300]] The government authorises regional offices, and can limit what each may issue. [[slnc 300]] The traveller brings only a form, never the pen they sign with. [[slnc 300]] And lost passports are published on a list. [[slnc 700]] In this video, the domain is an online store. [[slnc 500]] By the end, you will hear how to build a chain with a library. [[slnc 300]] How an authority is limited. [[slnc 300]] How certificates are withdrawn. [[slnc 300]] And what a stolen authority key does."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online store runs a small authority.", "", "It needs certificates for its services,", "a limit on what the authority can vouch for,", "a way to withdraw a certificate,", "and requests that keep private keys home."]
narration = """Here is the scenario. [[slnc 400]] An online store runs a small certificate authority for its own services. [[slnc 500]] It needs certificates for those services. [[slnc 300]] A limit on what the authority can ever vouch for. [[slnc 300]] A way to withdraw a certificate. [[slnc 300]] And requests that keep private keys at home."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["Extension: a rule inside a certificate", "Name constraint: names an authority may certify", "CRL: a signed list of withdrawn certificates", "CSR: a signed request for a certificate", "PEM: the text form every tool reads"]
narration = """Before the demos, the words. [[slnc 500]] An extension is a rule inside a certificate. [[slnc 500]] A name constraint says which names an authority may certify. [[slnc 500]] a C R L is a signed list of withdrawn certificates. [[slnc 500]] a C S R is a signed request for a certificate. [[slnc 500]] And P E M is the text form that every tool reads."""

[[scene]]
key = "03-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "04-rules"
kind = "figure"
title = "Rules that travel inside certificates"
body = "rules_core"
narration = """Here is the whole idea, on the demo's real values. [[slnc 400]] A certificate authority does not only sign. [[slnc 300]] It writes rules into the certificates, and every client enforces them. [[slnc 500]] A path length of zero: no deeper chain. [[slnc 300]] Key usage bits: a server key cannot sign certificates. [[slnc 300]] A name constraint: other dot example is refused. [[slnc 300]] And a signed revocation list: a lost key is refused. [[slnc 500]] Bouncy Castle writes these rules with named builders, so no byte is written by hand."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "09-ladder"
kind = "bullets"
title = "Plain Project, Then Library, Then Another Tool"
body = ["Plain: the bytes written by hand", "Library: the same ideas, named", "Another tool: a check by other people", "Agreement is evidence the standard was followed"]
narration = """Let's put the two projects side by side. [[slnc 400]] In the plain project, the bytes were written by hand. [[slnc 500]] With the library, the same ideas have names. [[slnc 500]] And with another tool, written by other people, the work is checked. [[slnc 500]] When they agree, that is good evidence the standard was followed."""

[[scene]]
key = "11-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["openssl x509 -text", "Public authorities and their intermediates", "Internal authorities in service meshes", "keytool -certreq"]
narration = """You have probably met this already. [[slnc 400]] The command openssl X five oh nine text prints exactly the extensions built here. [[slnc 500]] Public authorities publish intermediates and revocation information. [[slnc 500]] Internal authorities run inside service meshes and Kubernetes. [[slnc 500]] And keytool can create certificate signing requests."""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Public sites: a public authority", "Internal services: a small authority", "Name constraints, short lifetimes", "The root key stays offline", "Check what you build with a second tool"]
narration = """So, how do you use it? [[slnc 400]] For public sites, use a public authority. [[slnc 500]] For internal services, run a small authority of your own. [[slnc 500]] Use name constraints and short lifetimes. [[slnc 500]] Keep the root key offline. [[slnc 500]] And check what you build with a second tool."""

[[scene]]
key = "13-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "13-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Remove the name constraint", "and see which act changes."]
narration = """That's certificates and the chain of trust, with Bouncy Castle and OpenSSL. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] An authority is only as safe as its key, so limit what it may vouch for, keep the root offline, and keep certificates short lived. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] The demo runs with nothing installed except a Java development kit. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Remove the name constraint from the intermediate, and see which act changes. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
A small certificate authority run by an online store for its own services: a root, an intermediate limited to the store's names, server certificates, revocation lists and signing requests. It covers an attacker who steals a key, sends a request for a name that is not theirs, or relies on a
client that cannot fetch a list. It does not cover public authorities, OCSP, certificate transparency or hardware key storage.
"""
assets = [
    "The root private key and the intermediate private key.",
    "The shop service's private key.",
    "The clients' trust in the root.",
    "The revocation lists and the policy for signing requests.",
]
actors = [
    "The store's operators, who run the authority.",
    "The shop service, which requests certificates.",
    "Clients that validate chains and lists.",
    "An attacker who steals a key or sends forged requests.",
]
boundaries = [
    "Root key to everything else: the root stays offline and signs only intermediates.",
    "Signing request to the authority: a request from outside is untrusted until its signature and names are checked.",
    "Client to the lists: a client either gets a current list or must decide whether to trust anyway.",
]
assumptions = [
    "The root key is kept offline and the root certificate reaches clients in a trustworthy way.",
    "Clients check revocation and refuse when they cannot find out.",
    "In the demo, keys are random and never printed, the dates are fixed, and the domain is the example domain shop.example.",
]
out_of_scope = [
    "OCSP, certificate transparency and automated issuance.",
    "Hardware security modules.",
    "The TLS handshake that carries the chain: the next projects.",
]
tests = [
    "`ChainTest` checks the extensions, key identifiers, expiry, an untrusted root, name constraints, the path length limit and a changed certificate.",
    "`ListAndRequestTest` checks revocation, list signatures, missing and foreign lists, stale lists, requests, the authority's policy and PEM.",
    "`OpenSslInteropTest` (integration) checks that OpenSSL verifies the chain, shows the extensions, enforces the name constraint, reads the lists and request, and that an OpenSSL authority can sign a Java request.",
    "`NameRuleTest` checks that the name rule by hand agrees with the JDK's PKIX check, and that the dot matters.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next project, https-server, puts a certificate chain to work on a real server.
"""

[[threat]]
id = "T1"
stride = "S"
threat = "An attacker who steals the intermediate's key signs certificates that clients accept"
where = "`Pki.intermediate`, `CertFactory`"
control = "A name constraint limits the names, the key is kept offline or in hardware, and the root can revoke the intermediate"
residual = "Until clients fetch the new list the forged certificates are accepted, so lifetimes must be short"

[[threat]]
id = "T2"
stride = "S"
threat = "A request for a name the requester does not own is certified"
where = "`SigningRequest.certify`"
control = "The authority checks the request's signature and refuses names outside its domain"
residual = "The domain check here is by suffix; real authorities also prove control of the name"

[[threat]]
id = "T3"
stride = "E"
threat = "The root key is stolen, so any name can be certified"
where = "`Pki.root`"
control = "The root key is kept offline and used only to sign intermediates"
residual = "Clients must replace the root, which is slow and disruptive"

[[threat]]
id = "T4"
stride = "R"
threat = "A revoked certificate is still accepted because the client could not or did not fetch the list"
where = "`ChainValidator.validateWithLists`"
control = "The client refuses when the status is undetermined, and lists are signed and dated"
residual = "Many real clients go ahead instead, so short-lived certificates are the stronger defence"

[[threat]]
id = "T5"
stride = "I"
threat = "The shop's private key is exposed while getting a certificate"
where = "`SigningRequest`"
control = "The request carries only the public key and a signature; the private key never leaves the shop"
residual = "The shop must still protect its private key at rest"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] Five classes matter here. [[slnc 300]] Here is what each one does."""

[[class]]
name = "CertsBcDemo"
what = "runs the five acts"
[[class.part]]
title = "the five acts"
code = """
Pki pki = new Pki();
act1Chain(out, pki);
act2NameLimits(out, pki);
act3Lists(out, pki);
act4Request(out, pki);
act5Stolen(out, pki);
"""
speech = """The demo builds a fresh chain and runs the five acts. [[slnc 300]] The keys are random, so it prints only facts that do not depend on them."""

[[class]]
name = "CertFactory"
what = "builds certificates with Bouncy Castle"
[[class.part]]
title = "the rules, as named extensions"
code = """
if (spec.authority()) {
    builder.addExtension(Extension.basicConstraints, true,
            new BasicConstraints(spec.pathLength()));                  // a CA, and how deep
    builder.addExtension(Extension.keyUsage, true,
            new KeyUsage(KeyUsage.keyCertSign | KeyUsage.cRLSign));     // bits 5 and 6
} else {
    builder.addExtension(Extension.basicConstraints, true, new BasicConstraints(false));
    builder.addExtension(Extension.keyUsage, true,
            new KeyUsage(KeyUsage.digitalSignature));                   // bit 0
...
builder.addExtension(Extension.nameConstraints, true,
        new NameConstraints(new GeneralSubtree[] {permitted}, null));
"""
speech = """Cert factory writes each rule as a named extension. [[slnc 300]] An authority gets its path length, and the bits to sign certificates and lists. [[slnc 300]] A server gets only the bit to sign data. [[slnc 300]] The intermediate also gets its name constraint."""

[[class]]
name = "NameRule"
what = "the name constraint, by hand"
[[class.part]]
title = "the name, or ending in a dot and the name"
code = """
return host.equals(domain) || host.endsWith("." + domain);   // the domain itself, or one of its sub-names
"""
speech = """Name rule redoes the name constraint by hand. [[slnc 300]] The domain itself, or a name ending in a dot and the domain. [[slnc 300]] A test proves the J D K agrees."""

[[class]]
name = "Crls"
what = "signed revocation lists"
[[class.part]]
title = "serials, reasons, and the issuer's signature"
code = """
X509v2CRLBuilder builder = new X509v2CRLBuilder(
        new JcaX509CertificateHolder(issuer.certificate()).getSubject(), Date.from(thisUpdate));
builder.setNextUpdate(Date.from(thisUpdate.plusSeconds(7 * 24 * 3600L)));   // a week
for (Map.Entry<BigInteger, Integer> entry : new LinkedHashMap<>(revoked).entrySet()) {
    builder.addCRLEntry(entry.getKey(), Date.from(thisUpdate), entry.getValue());
...
return new JcaX509CRLConverter().getCRL(builder.build(
        new JcaContentSignerBuilder("SHA256withECDSA").build(issuer.keys().getPrivate())));
"""
speech = """C R Ls builds a list, valid for a week, naming each revoked serial number and why. [[slnc 300]] The issuer signs it, so no one else can withdraw its certificates."""

[[class]]
name = "SigningRequest"
what = "a request, and the authority's policy"
[[class.part]]
title = "proof of possession, then the policy"
code = """
return request.isSignatureValid(new JcaContentVerifierProviderBuilder().build(request.getSubjectPublicKeyInfo()));
...
if (!NameRule.permits(domain, name)) {
    throw new RefusedException(name + " is outside " + domain);
"""
speech = """Signing request checks the request's signature with the public key inside it. [[slnc 300]] That proves the sender holds the private key. [[slnc 300]] Then the policy refuses names outside the shop's domain."""

