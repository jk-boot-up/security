# concept.toml: everything about this project that is not Java code.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "certificates-and-chain-of-trust-with-bouncy-castle"
module = "transport-security"
title = "Certificates and Chain of Trust with Bouncy Castle and OpenSSL"
short_title = "Certificates with Bouncy Castle"
package = "certsbc"
main_class = "CertsBcDemo"
tagline = "Building a certificate authority, and checking it with another program"
bold = "Bouncy Castle builds real certificates, name limits, revocation lists and signing requests from named calls, and OpenSSL, written by other people, agrees with every one of them, but each extension is a place to get a rule quietly wrong."
domain = "an online store"
domain_note = ""
youtube_description = """Certificates and chain of trust with Bouncy Castle and OpenSSL, in Java: the JDK checks certificates but cannot make them. Explained with an online store, like a passport office that issues passports, limits what each office may issue, and publishes a list of lost ones. We build a root, an intermediate and a server certificate with Bouncy Castle, limit the intermediate to the store's own names, publish signed revocation lists, send a signing request so the private key never leaves the shop, have the openssl command-line tool verify the same chain, and finish with the bill: a stolen authority key breaks everything below it, and every extension is a place to be quietly wrong."""
thumb_lines = ["CERTIFICATES AND", "CHAIN OF TRUST"]
thumb_code = "JcaX509v3CertificateBuilder"
youtube_title = "Certificates and Chain of Trust with Bouncy Castle and OpenSSL (CRL, CSR, Name Constraints)"
youtube_tags = ["certificates", "chain of trust", "bouncy castle", "openssl", "x509", "crl", "csr", "name constraints", "java", "cybersecurity for beginners"]

[readme]
technologies = [["OpenSSL (command-line tool)", "3.x", "the independent check that verifies the chain, reads the lists and requests, and acts as a second authority; needed for the integration tests"]]
intro = """
The plain version of this lesson wrote the bytes of a certificate by hand, because the JDK can **check** certificates but has no public way to **make** them. **Bouncy Castle** is an open-source library that supplies the missing builders. With
them the project makes a **root**, an **intermediate** and a **server certificate**, and attaches the extensions that say what each may do: whether it is an authority, how many authorities may sit below it, which keys may sign what, which names it
covers, and which names an authority is allowed to certify at all (a **name constraint**).

It also publishes **revocation lists** (CRLs), signed by the issuer, and walks through the **signing request** (PKCS#10) that lets a shop get a certificate without ever handing over its private key. Because all of this is standard, a different program can
check it, and this project proves that by asking **OpenSSL** to verify the same chain, read the same lists, and even sign a request that Java wrote.
"""
analogy = """
Think of a passport office. The government (the root) authorises regional offices (the intermediates) and can limit what each may do: this office may only issue passports to residents of one town. The traveller (the shop) makes their own signature and brings only a
form (the signing request), never the pen they sign with. Lost passports are published on a list the border officers check. A stolen office stamp is the disaster: forged passports look genuine until the office is struck off.
"""
scenario = """
An online store runs its own small certificate authority for shop.example. The demo builds the chain, limits the intermediate to the store's names, publishes lists, handles a signing request, and then imagines the intermediate's key being stolen.
"""
costs = [
    "**Every extension is a chance to be wrong.** A missing critical flag or constraint silently weakens a rule, and nothing fails until someone relies on it.",
    "**The library is large.** About a few megabytes of code to build a handful of structures, and its own release cycle to keep up with.",
    "**A stolen authority key breaks everything below it.** Name constraints limit the damage, and revocation only protects clients that fetched the newest list.",
    "**Revocation is weak in practice.** Many browsers go ahead when they cannot fetch a list, so short-lived certificates are the stronger defence.",
    "**Running an authority is a duty.** Offline keys, audit logs, procedures and backups matter more than the code.",
]
too_much = """
For a real public website, use a public authority and an automated client. Run your own authority for internal systems, tests and mutual TLS between services, where you control who trusts the root, and keep the root key offline.
"""
met_before = [
    "`openssl x509 -text`, which prints exactly the extensions this project writes.",
    "Let's Encrypt and other public authorities, which publish intermediates and revocation information.",
    "Internal certificate authorities in service meshes and Kubernetes.",
    "`keytool -importcert`, which adds a root to a trust store.",
]
where = """
This project follows [certificates-and-chain-of-trust](../certificates-and-chain-of-trust) and is the fifth in [transport-security](..). It builds on [asymmetric-encryption-with-bouncy-castle](../../cryptography/asymmetric-encryption-with-bouncy-castle), which first used the library.
"""
twin = """
Keys are random, so the demo prints only facts that do not depend on them: what an extension says, whether a chain is accepted and why, and whether a request or list verifies. The validation date is fixed (2026-01-01), not the real clock.
OpenSSL is used only by the integration tests, so the demo and the ordinary tests need nothing installed.
"""
test_note = "Chains are validated on a fixed date. Keys are random, so the demo and its tests check only facts that do not depend on them. The ordinary tests need only a JDK; the integration tests (tagged openssl) run the real OpenSSL 3 as an independent check."

[[act]]
title = "A chain built with Bouncy Castle"
summary = "The builders are asked for a root (a CA, 1 more below), an intermediate (a CA, 0 below, only names under shop.example) and a server certificate (not a CA); read back, the intermediate's key usage bits are 000001100 and the server's 100000000, and each certificate names its parent's key identifier."
detail = """
Before building, each builder is asked for something: the root is a CA with 1 more CA allowed below it and signs itself; the intermediate is a CA with 0 below and may only certify names under shop.example; the server certificate is not a CA, for shop.example, to sign data.
After building, the certificates are read back: CN=Example Root CA with 1 CA below, CN=Example Issuing CA with 0 and the name rule shop.example, and CN=shop.example, which is not a CA.
Key usage is a row of bits: bit 0 signs data, bit 5 signs certificates, bit 6 signs revocation lists. The intermediate's bits 0 to 8 are 000001100, certificates and lists; the server's are 100000000, data only. Each certificate names its parent's key identifier, so a client can find the right parent.
"""
figure = "built_chain"
figure_title = "Asked for, and read back"
figure_speech = """
On the left, what each builder was asked for. [[slnc 300]] On the right, what the certificates say when they are read back. [[slnc 500]]
The root is a C A that allows one more C A below it. [[slnc 300]] The intermediate allows none below it, and carries a name rule: shop dot example. [[slnc 300]] The server's certificate is not a C A. [[slnc 500]]
Below, the key usage, bit by bit. [[slnc 300]] The intermediate has bits five and six: it signs certificates and lists. [[slnc 300]] The server has only bit zero: it signs data. [[slnc 500]]
And each certificate names its parent's key identifier.
"""
speech = """
The program's output. [[slnc 400]] Before building: what each builder is asked for. [[slnc 400]] After building: what the certificates say. [[slnc 500]]
Then the key usage bits: certificates and lists for the intermediate, data only for the server. [[slnc 400]] And each one names its parent's key.
"""
rows = { chain = "active ok" }
console = [
    ["BEFORE BUILDING (what each builder is asked for):", "ok"],
    ["  root          a CA, 1 more CA below, self-signed", "muted"],
    ["  intermediate  a CA, 0 below, only names under shop.example", "muted"],
    ["  server        not a CA, for shop.example, to sign data", "muted"],
    ["AFTER BUILDING (read back from the certificates):", "bad"],
    ["  root          CN=Example Root CA, CAs below: 1", "muted"],
    ["  intermediate  CN=Example Issuing CA, CAs below: 0", "muted"],
    ["                name rule: shop.example", "muted"],
    ["  server        CN=shop.example, a CA: false", "muted"],
    ["KEY USAGE, BIT BY BIT (0 data, 5 certificates, 6 lists):", "amber"],
    ["  intermediate  000001100  signs certificates and lists", "muted"],
    ["  server        100000000  signs data only", "muted"],
    ["each names its parent's key identifier: true, true", "amber"],
]

[[act]]
title = "A limit the authority carries in its own certificate"
summary = "The intermediate's rule is shop.example; by hand, shop.example and api.shop.example pass, other.example and evilshop.example do not; the JDK accepts shop.example and api.shop.example and refuses other.example with INVALID_NAME."
detail = """
Before the check, the intermediate carries a name constraint in its own certificate: shop.example. It signs certificates for shop.example, api.shop.example and other.example.
Step, the rule by hand: a name passes if it is shop.example itself, or ends with .shop.example. shop.example is the same name, api.shop.example ends with .shop.example, other.example is neither, and evilshop.example is neither too: the dot matters.
After the check, the JDK's PKIX validator agrees: shop.example and api.shop.example are accepted, other.example is refused with INVALID_NAME. So a stolen intermediate key can sign only names under shop.example.
"""
figure = "name_rule"
figure_title = "The name rule, by hand and by the JDK"
figure_speech = """
The intermediate carries a rule in its own certificate: only names under shop dot example. [[slnc 500]]
By hand, the rule is simple. [[slnc 300]] The name itself passes. [[slnc 300]] So does any name ending in dot shop dot example, like a p i dot shop dot example. [[slnc 300]] Other dot example does not. [[slnc 300]] And evil shop dot example does not either, because the dot matters. [[slnc 500]]
On the right, the J D K's check agrees. [[slnc 300]] Other dot example is refused, with invalid name.
"""
speech = """
The program's output. [[slnc 400]] Before the check: the rule, and three names. [[slnc 400]] The step: the rule by hand, for four names. [[slnc 400]]
After the check: the J D K accepts the first two, and refuses other dot example. [[slnc 400]] So a stolen intermediate key can sign only names under the shop's.
"""
rows = { limits = "active ok" }
console = [
    ["BEFORE THE CHECK (the intermediate's rule: shop.example):", "ok"],
    ["  shop.example, api.shop.example, other.example", "muted"],
    ["STEP. THE RULE BY HAND (the name, or ending in .shop.example):", "amber"],
    ["  shop.example       the same name: true", "muted"],
    ["  api.shop.example   ends with .shop.example: true", "muted"],
    ["  other.example      neither: false", "muted"],
    ["  evilshop.example   neither: false", "muted"],
    ["AFTER THE CHECK (the JDK's PKIX, given each chain):", "bad"],
    ["  shop.example       accepted true", "muted"],
    ["  api.shop.example   accepted true", "muted"],
    ["  other.example      accepted false, INVALID_NAME", "muted"],
    ["a stolen intermediate key can sign only names under shop.example", "amber"],
]

[[act]]
title = "A revocation list signed by the issuer"
summary = "The intermediate's empty list accepts the chain; with 1 entry, serial 3, KEY_COMPROMISE, signed by the intermediate and not the root, the chain is refused (REVOKED); a stranger's list or no list gives UNDETERMINED_REVOCATION_STATUS."
detail = """
Before revocation, the intermediate publishes a signed list with 0 entries, and the chain is accepted. After revocation, because the shop's key is lost, the list has 1 entry: serial 3, KEY_COMPROMISE. Its signature checks with the intermediate's key and not with the root's, and the chain is refused: REVOKED.
Without a good list, the client cannot find out: a list signed by a stranger, or no list at all, gives false, UNDETERMINED_REVOCATION_STATUS. This client refuses when it cannot find out; many browsers go ahead instead, which is why short-lived certificates matter.
"""
figure = "crl_check"
figure_title = "A signed list of withdrawn certificates"
figure_speech = """
Before revocation, the intermediate signs a list with no entries, and the chain is accepted. [[slnc 500]]
Then the shop's key is lost. [[slnc 300]] After revocation, the list names serial three, with the reason: key compromise. [[slnc 300]] The list's signature checks with the intermediate's key, not the root's. [[slnc 300]] And the chain is refused: revoked. [[slnc 500]]
Below, without a good list. [[slnc 300]] A stranger's list, or no list at all: the client cannot find out, and this client refuses.
"""
speech = """
The program's output. [[slnc 400]] Before revocation: no entries, and the chain is accepted. [[slnc 400]]
After revocation: one entry, signed by the intermediate, and the chain is refused. [[slnc 400]]
Without a good list: refused too. [[slnc 300]] Many browsers go ahead instead, which is why short lived certificates matter.
"""
rows = { lists = "active amber" }
console = [
    ["BEFORE REVOCATION (the intermediate's signed list):", "ok"],
    ["  entries 0, the chain accepted: true", "muted"],
    ["AFTER REVOCATION (the shop's key is lost):", "bad"],
    ["  entries 1: serial 3, KEY_COMPROMISE", "muted"],
    ["  signed by the intermediate: true, by the root: false", "muted"],
    ["  the chain accepted: false, REVOKED", "muted"],
    ["WITHOUT A GOOD LIST (accepted, and the reason):", "amber"],
    ["  a stranger's list  false, UNDETERMINED_REVOCATION_STATUS", "muted"],
    ["  no list at all     false, UNDETERMINED_REVOCATION_STATUS", "muted"],
    ["this client refuses when it cannot find out; many browsers", "amber"],
    ["go ahead instead, which is why short-lived certificates matter", "amber"],
]

[[act]]
title = "Asking for a certificate without handing over the private key"
summary = "The shop signs a request naming [shop.example] with its own EC key; the signature proves possession, but not after one letter changes; the authority's policy signs shop.example (serial 10, the shop's own key) and refuses bank.example as outside shop.example."
detail = """
The request: the shop makes its own key pair, keeps the private key at home, and signs a request naming [shop.example] with its EC public key. The signature proves the sender holds the private key; with one letter of the name changed on the way, it no longer does.
The response: the authority's policy allows names under shop.example, so it signs a certificate with serial 10 that holds the shop's own public key, and refuses bank.example, which is outside shop.example. As PEM, the certificate starts with -----BEGIN CERTIFICATE----- and reads back as the same certificate.
"""
figure = "csr_flow"
figure_title = "A signing request: the private key stays home"
figure_speech = """
The request. [[slnc 300]] The shop makes its own key pair, and keeps the private key. [[slnc 300]] It sends its names and its public key, signed with the private key. [[slnc 300]] The signature proves the shop holds that key. [[slnc 300]] Change one letter on the way, and it no longer does. [[slnc 500]]
The response. [[slnc 300]] The authority checks its policy: only names under shop dot example. [[slnc 300]] The shop's request is signed, with the shop's own public key in it. [[slnc 300]] A request for bank dot example is refused. [[slnc 500]]
The authority never sees the private key.
"""
speech = """
The program's output. [[slnc 400]] The request: the names, the key, and the proof of possession, true, then false after one letter changed. [[slnc 500]]
The response: shop dot example is signed, bank dot example is refused. [[slnc 400]] And the certificate, as P E M text.
"""
rows = { request = "active ok" }
console = [
    ["THE REQUEST (signed by the shop; the private key stays home):", "ok"],
    ["  names [shop.example], public key EC", "muted"],
    ["  the signature proves the sender holds the key: true", "muted"],
    ["  one letter changed on the way, it still proves it: false", "muted"],
    ["THE RESPONSE (the authority's policy: names under shop.example):", "bad"],
    ["  shop.example: signed, serial 10, holds the shop's key: true", "muted"],
    ["  bank.example: refused, bank.example is outside shop.example", "muted"],
    ["as PEM: -----BEGIN CERTIFICATE-----, reads back the same: true", "amber"],
]

[[act]]
title = "A stolen authority key, and the bill"
summary = "A thief with the intermediate's private key signs shop.example, serial 77, and the forged chain is accepted; after the root's list names serial 2, CA_COMPROMISE, both the forged and the shop's real chain are refused."
detail = """
Before revocation, a thief has the intermediate's private key and signs shop.example, serial 77: the forged chain is accepted, and everything below the stolen key falls. After revocation, the root's list names serial 2, CA_COMPROMISE: the forged chain and the shop's real chain are both refused, so the shop needs a new certificate from a new intermediate.
The bill: revocation protects only clients with the new list; builders are short to write and easy to get subtly wrong, as a missing critical flag or constraint weakens a rule; a trusted root may vouch for any name, so keep the store small, and keep CA keys offline or in hardware.
"""
figure = "stolen_key"
figure_title = "A stolen CA key, and the root's list"
figure_speech = """
Before revocation. [[slnc 300]] A thief has the intermediate's private key. [[slnc 300]] The thief signs a certificate for the shop's name, and the forged chain is accepted. [[slnc 500]]
After revocation. [[slnc 300]] The root's list names the intermediate, serial two, as compromised. [[slnc 300]] The forged chain is refused. [[slnc 300]] And so is the shop's real chain. [[slnc 500]]
So the shop needs a new certificate, from a new intermediate.
"""
speech = """
The program's output. [[slnc 400]] Before revocation: the forged chain is accepted. [[slnc 400]]
After revocation: both chains are refused. [[slnc 500]]
And the bill. [[slnc 300]] Clients need the new list. [[slnc 300]] Builders are easy to get quietly wrong. [[slnc 300]] Keep the trust store small, and C A keys offline, or in hardware.
"""
rows = { stolen = "active wrong" }
console = [
    ["BEFORE REVOCATION (a thief has the intermediate's private key):", "ok"],
    ["  the thief signs shop.example, serial 77", "muted"],
    ["  the forged chain accepted: true  <- EVERYTHING BELOW FALLS", "bad"],
    ["AFTER REVOCATION (the root's list: serial 2, CA_COMPROMISE):", "bad"],
    ["  the forged chain accepted: false", "muted"],
    ["  the shop's real chain accepted: false", "muted"],
    ["  so the shop needs a new certificate from a new intermediate", "muted"],
    ["THE BILL:", "amber"],
    ["  revocation protects only clients with the new list", "muted"],
    ["  builders are short to write and easy to get subtly wrong:", "muted"],
    ["  a missing critical flag or constraint weakens a rule", "muted"],
    ["  a trusted root may vouch for any name: keep the store small", "muted"],
    ["  and keep CA keys offline or in hardware", "muted"],
]

[highlight]
console_green = ["BEFORE", "THE REQUEST"]
console_rose = ["AFTER", "THE RESPONSE"]
