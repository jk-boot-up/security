# concept.toml: everything about this project that is not Java code.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "certificates-and-chain-of-trust-with-bouncy-castle"
module = "transport-security"
title = "Certificates and Chain of Trust with Bouncy Castle and OpenSSL"
short_title = "Certificates with Bouncy Castle"
package = "certsbc"
main_class = "CertsBcDemo"
tagline = "Building a certificate authority, and checking it with another program"
bold = "Bouncy Castle builds real certificates, name limits, revocation lists and signing requests from named calls, and OpenSSL, written by other people, agrees with every one of them, but each extension is a place to get a rule quietly wrong."
domain = "an online store"
domain_note = ""
youtube_description = """Certificates and chain of trust with Bouncy Castle and OpenSSL, in Java: the JDK checks certificates but cannot make them. Explained with an online store, like a passport office that issues passports, limits what each office may issue, and publishes a list of lost ones. We build a root, an intermediate and a server certificate with Bouncy Castle, limit the intermediate to the store's own names, publish signed revocation lists, send a signing request so the private key never leaves the shop, have the openssl command-line tool verify the same chain, and finish with the bill: a stolen authority key breaks everything below it, and every extension is a place to be quietly wrong."""
thumb_lines = ["CERTIFICATES AND", "CHAIN OF TRUST"]
thumb_code = "JcaX509v3CertificateBuilder"
youtube_title = "Certificates and Chain of Trust with Bouncy Castle and OpenSSL (CRL, CSR, Name Constraints)"
youtube_tags = ["certificates", "chain of trust", "bouncy castle", "openssl", "x509", "crl", "csr", "name constraints", "java", "cybersecurity for beginners"]

[readme]
technologies = [["OpenSSL (command-line tool)", "3.x", "the independent check that verifies the chain, reads the lists and requests, and acts as a second authority; needed for the integration tests"]]
intro = """
The plain version of this lesson wrote the bytes of a certificate by hand, because the JDK can **check** certificates but has no public way to **make** them. **Bouncy Castle** is an open-source library that supplies the missing builders. With
them the project makes a **root**, an **intermediate** and a **server certificate**, and attaches the extensions that say what each may do: whether it is an authority, how many authorities may sit below it, which keys may sign what, which names it
covers, and which names an authority is allowed to certify at all (a **name constraint**).

It also publishes **revocation lists** (CRLs), signed by the issuer, and walks through the **signing request** (PKCS#10) that lets a shop get a certificate without ever handing over its private key. Because all of this is standard, a different program can
check it, and this project proves that by asking **OpenSSL** to verify the same chain, read the same lists, and even sign a request that Java wrote.
"""
analogy = """
Think of a passport office. The government (the root) authorises regional offices (the intermediates) and can limit what each may do: this office may only issue passports to residents of one town. The traveller (the shop) makes their own signature and brings only a
form (the signing request), never the pen they sign with. Lost passports are published on a list the border officers check. A stolen office stamp is the disaster: forged passports look genuine until the office is struck off.
"""
scenario = """
An online store runs its own small certificate authority for shop.example. The demo builds the chain, limits the intermediate to the store's names, publishes lists, handles a signing request, and then imagines the intermediate's key being stolen.
"""
costs = [
    "**Every extension is a chance to be wrong.** A missing critical flag or constraint silently weakens a rule, and nothing fails until someone relies on it.",
    "**The library is large.** About a few megabytes of code to build a handful of structures, and its own release cycle to keep up with.",
    "**A stolen authority key breaks everything below it.** Name constraints limit the damage, and revocation only protects clients that fetched the newest list.",
    "**Revocation is weak in practice.** Many browsers go ahead when they cannot fetch a list, so short-lived certificates are the stronger defence.",
    "**Running an authority is a duty.** Offline keys, audit logs, procedures and backups matter more than the code.",
]
too_much = """
For a real public website, use a public authority and an automated client. Run your own authority for internal systems, tests and mutual TLS between services, where you control who trusts the root, and keep the root key offline.
"""
met_before = [
    "`openssl x509 -text`, which prints exactly the extensions this project writes.",
    "Let's Encrypt and other public authorities, which publish intermediates and revocation information.",
    "Internal certificate authorities in service meshes and Kubernetes.",
    "`keytool -importcert`, which adds a root to a trust store.",
]
where = """
This project follows [certificates-and-chain-of-trust](../certificates-and-chain-of-trust) and is the fifth in [transport-security](..). It builds on [asymmetric-encryption-with-bouncy-castle](../../cryptography/asymmetric-encryption-with-bouncy-castle), which first used the library.
"""
twin = """
Keys are random, so the demo prints only facts that do not depend on them: what an extension says, whether a chain is accepted and why, and whether a request or list verifies. The validation date is fixed (2026-01-01), not the real clock.
OpenSSL is used only by the integration tests, so the demo and the ordinary tests need nothing installed.
"""
test_note = "Chains are validated on a fixed date. Keys are random, so the demo and its tests check only facts that do not depend on them. The ordinary tests need only a JDK; the integration tests (tagged openssl) run the real OpenSSL 3 as an independent check."

[[act]]
title = "A chain built with Bouncy Castle"
summary = "A root, an intermediate and a server certificate are built from named calls, with authority flags, key usages and key identifiers that link each to its parent."
detail = """
The root allows one authority below it, the intermediate allows none, and the server certificate may not issue certificates at all. An authority's key may sign certificates and lists but not data, and the server's key may sign data but not certificates. Each certificate names
its parent's key identifier, which is how a client finds the right parent. The server certificate names shop.example. All of it is written with builders, and no byte of the encoding is written by hand.
"""
speech = """
First demo: a chain built with Bouncy Castle. [[slnc 400]] A root, an intermediate, and a server certificate. [[slnc 600]]
Each one says what it may do. [[slnc 300]] The root allows one authority below it. [[slnc 300]] The intermediate allows none. [[slnc 300]] The server certificate may not issue certificates at all. [[slnc 600]]
An authority's key may sign certificates, but not data. [[slnc 300]] The server's key may sign data, but not certificates. [[slnc 600]]
Each certificate names its parent's key identifier, so a client can find the right parent. [[slnc 600]]
And not one byte of the encoding was written by hand.
"""
rows = { chain = "active ok" }
console = [
    ["root: CN=Example Root CA, self-signed: true, authorities allowed below it: 1", "muted"],
    ["intermediate: CN=Example Issuing CA, authorities allowed below it: 0", "muted"],
    ["server: CN=shop.example, may issue certificates: false", "muted"],
    ["an authority's key may sign certificates and lists: true, and may not sign data: true", "ok"],
    ["each certificate names its parent's key identifier: server to intermediate true, intermediate to root true", "ok"],
    ["the library wrote the extensions from named builders; no byte of the encoding was written by hand", "muted"],
]

[[act]]
title = "A limit the authority carries in its own certificate"
summary = "The intermediate may only certify shop.example and names below it; a certificate for another name from the same intermediate is refused with INVALID_NAME."
detail = """
The intermediate carries a name constraint: it may only certify shop.example and names below it. A certificate for shop.example is accepted. A certificate for api.shop.example from the same intermediate is accepted too. A certificate for other.example from the same intermediate
is refused with the reason INVALID_NAME. The client checks the limit, so a stolen intermediate key can only be misused for the names it was limited to.
"""
speech = """
Second demo: a limit in the authority's own certificate. [[slnc 400]] The intermediate may only certify the store's name, and names below it. [[slnc 600]]
A certificate for the store is accepted. [[slnc 300]] So is one for a name below it. [[slnc 600]]
A certificate for another name, from the same intermediate, is refused. [[slnc 600]]
The client checks the limit. [[slnc 300]] So a stolen intermediate key can only be misused for the names it was limited to.
"""
rows = { limits = "active ok" }
console = [
    ["the intermediate may only certify shop.example and names below it (a name constraint)", "muted"],
    ["the certificate for shop.example: accepted true", "ok"],
    ["a certificate for api.shop.example from the same intermediate: accepted true", "ok"],
    ["a certificate for other.example from the same intermediate: accepted false, reason INVALID_NAME", "bad"],
    ["the limit is checked by the client, so a stolen intermediate key can only be misused for the names it was limited to", "amber"],
]

[[act]]
title = "A revocation list signed by the issuer"
summary = "A signed list naming the shop's serial makes the chain REVOKED; a list signed by someone else, or no list, leaves the status undetermined and the chain refused."
detail = """
The issuer publishes a signed list. An empty list means nothing is revoked and the chain is accepted. When the shop's key is lost, the intermediate lists its serial number, and the chain is refused with the reason REVOKED. The list's signature verifies with the intermediate's key
and not with the root's. A list signed by someone else is not used, and with no list at all the status is undetermined and the chain is refused. This client refuses when it cannot find out. Many browsers go ahead instead, which is why short-lived certificates matter.
"""
speech = """
Third demo: a revocation list. [[slnc 400]] The issuer publishes a signed list of certificates that should no longer be trusted. [[slnc 600]]
An empty list, and the chain is accepted. [[slnc 600]]
The shop's key is lost, so the intermediate lists its serial number. [[slnc 300]] The chain is now refused, with the reason revoked. [[slnc 600]]
The list's signature verifies with the intermediate's key, and not with the root's. [[slnc 600]]
A list signed by someone else is not used. [[slnc 300]] And with no list at all, this client refuses. [[slnc 300]] Many browsers go ahead instead, which is why short lived certificates matter.
"""
rows = { lists = "active amber" }
console = [
    ["the issuer publishes a signed list; it names 0 revoked certificates and the chain is accepted: true", "ok"],
    ["the shop's key is lost, so the intermediate lists its serial number (1 entry): accepted false, reason REVOKED", "bad"],
    ["the list's signature verifies with the intermediate's key: true, with the root's key: false", "ok"],
    ["a list signed by someone else is not used: accepted false, reason UNDETERMINED_REVOCATION_STATUS", "amber"],
    ["no list at all: accepted false, reason UNDETERMINED_REVOCATION_STATUS", "amber"],
    ["this client refuses when it cannot find out; many browsers go ahead instead, which is why short-lived certificates matter", "amber"],
]

[[act]]
title = "Asking for a certificate without handing over the private key"
summary = "The shop signs a request with its own key; the authority checks the signature and its policy, certifies only names under shop.example, and the certificate holds the shop's public key."
detail = """
The shop makes its own key pair and signs a request naming shop.example; the private key stays with the shop. The request's signature proves the sender holds the private key. Change one letter of the name on the way, and the signature no longer verifies.
The authority's policy allows names under shop.example, so it signs, and the certificate holds the shop's public key. A request for bank.example is refused. As PEM text the certificate starts with a BEGIN CERTIFICATE line and reads back as the same certificate.
"""
speech = """
Fourth demo: asking for a certificate. [[slnc 400]] The shop makes its own key pair, and signs a request with it. [[slnc 300]] The private key stays with the shop. [[slnc 600]]
The signature proves the sender holds the private key. [[slnc 300]] Change one letter on the way, and it no longer verifies. [[slnc 600]]
The authority checks its policy. [[slnc 300]] It only certifies names under the store's domain. [[slnc 300]] The certificate holds the shop's own public key. [[slnc 600]]
A request for another bank is refused. [[slnc 600]]
And as P E M text, the certificate reads back as the same certificate.
"""
rows = { request = "active ok" }
console = [
    ["the shop makes its own key pair and signs a request naming [shop.example]; the private key stays with the shop", "muted"],
    ["the request's signature proves the sender holds the private key: true", "ok"],
    ["one letter of the name changed on the way: the signature still proves possession: false", "ok"],
    ["the authority's policy allows names under shop.example, so it signs: the certificate holds the shop's public key: true", "ok"],
    ["a request for bank.example: refused (bank.example is outside shop.example)", "ok"],
    ["as PEM text it starts with -----BEGIN CERTIFICATE----- and reads back as the same certificate: true", "muted"],
]

[[act]]
title = "A stolen authority key, and the bill"
summary = "A forged chain from a stolen intermediate key is accepted until the root revokes the intermediate; then both the forged and the real chains are refused and the shop needs a new certificate."
detail = """
If someone steals the intermediate's private key and signs their own certificate for shop.example, the forged chain is accepted: a stolen authority key breaks everything below it. When the root lists the intermediate as compromised, the forged chain is refused, and so is the shop's real chain.
The shop needs a new certificate from a new intermediate, and revocation only protects clients that fetched the new list. The bill: builders make certificates short to write and easy to get subtly wrong, and trusting a root is a decision, so keep the store small and keep authority keys offline or in hardware.
"""
speech = """
Fifth demo: a stolen authority key, and the bill. [[slnc 400]] Someone steals the intermediate's private key and signs their own certificate for the store. [[slnc 600]]
The forged chain is accepted. [[slnc 300]] A stolen authority key breaks everything below it. [[slnc 600]]
The root lists the intermediate as compromised. [[slnc 300]] The forged chain is refused. [[slnc 300]] So is the shop's real chain. [[slnc 600]]
The shop needs a new certificate from a new intermediate, and revocation only protects clients that fetched the new list. [[slnc 600]]
And the bill. [[slnc 300]] Builders make certificates easy to write, and easy to get quietly wrong. [[slnc 300]] Trusting a root is a decision. [[slnc 300]] Keep authority keys offline, or in hardware.
"""
rows = { stolen = "active wrong" }
console = [
    ["someone steals the intermediate's private key and signs their own certificate for shop.example", "muted"],
    ["the forged chain is accepted: true  <- A STOLEN CA KEY BREAKS EVERYTHING BELOW IT", "bad"],
    ["the root lists the intermediate as compromised: the forged chain accepted false, the shop's real chain accepted false", "amber"],
    ["so the shop needs a new certificate from a new intermediate; revocation protects only clients that fetched the new list", "amber"],
    ["the builders make certificates short to write and easy to get subtly wrong: a missing critical flag or constraint silently weakens a rule", "amber"],
    ["trusting a root is a decision: it may vouch for any name, so keep the store small and keep authority keys offline or in hardware", "amber"],
]

[animation]
subtitle = "An online store builds a small certificate authority with Bouncy Castle and has OpenSSL check it."
boxes = [
    ["chain", "A chain", "root, intermediate, server, with extensions"],
    ["limits", "Name limits", "the intermediate may only certify the store"],
    ["lists", "Revocation lists", "signed by the issuer"],
    ["request", "Signing request", "the private key never leaves the shop"],
    ["stolen", "A stolen key", "breaks everything below it"],
]

[docs.dependencies]
intro = """
This project uses two jars from Bouncy Castle, and one optional command-line tool for the integration tests.
"""
what = [
    ["Bouncy Castle (bcprov)", "an open-source cryptography library for Java. The certificate builders use it for algorithms and the encoding of names and extensions."],
    ["Bouncy Castle PKIX (bcpkix)", "the part that builds certificates, lists and signing requests, and reads and writes PEM. It builds on bcprov."],
    ["OpenSSL", "a widely used cryptography toolkit and command-line program. The integration tests run `openssl verify`, `openssl x509`, `openssl crl`, `openssl req` and `openssl x509 -req` as independent checks. It is optional: the demo and ordinary tests do not need it."],
]
why = """
The JDK validates certificates but cannot create them, and reading its own certificates back proves little. This project builds real certificates with a library, and uses a different program to prove that they are standard and not a private convention.
"""
install_note = "A JDK, and for the integration tests, OpenSSL 3 on the PATH. Gradle downloads the Java libraries, and the versions are pinned:"
versions = [
    ["Bouncy Castle (bcprov-jdk18on)", "1.86"],
    ["Bouncy Castle PKIX (bcpkix-jdk18on)", "1.86"],
    ["OpenSSL (optional, for the integration tests)", "3.x"],
    ["Java", "25"],
    ["JUnit", "6.1.3"],
]
costs = [
    "A few megabytes of library for a handful of structures.",
    "The integration tests need OpenSSL 3 installed.",
    "Extensions are easy to write and easy to get quietly wrong.",
]

[docs.problem]
scenario = """
An online store needs certificates for its own services under a small authority it controls, with a limit on what that authority can ever vouch for, a way to withdraw a certificate, and a way for a service to request one without sharing its private key.
"""
naive = """
Generate a self-signed certificate for each service with a command someone found online, trust all of them everywhere, and hope nobody steals a key.
"""
deliver = [
    "A root, an intermediate and a server certificate built with Bouncy Castle, with the extensions that set each one's role.",
    "A name constraint that the JDK and OpenSSL both enforce.",
    "Revocation lists signed by the issuer, and validation that uses them.",
    "A signing request that proves possession of a private key without revealing it, and an authority policy that checks the names.",
    "Independent checks by OpenSSL, including OpenSSL signing a request that Java made.",
    "Output that is the same on every run although the keys are random.",
]

[docs.prerequisites]
required = [
    "Java basics",
    "The certificates-and-chain-of-trust project, or an idea of what a certificate and a chain are",
]
not_required = [
    "Knowledge of ASN.1 or DER",
    "A public certificate authority account",
]
install = ["OpenSSL 3, only for the integration tests"]

[docs.session]
objectives = [
    "name the extensions that set a certificate's role",
    "explain what a name constraint protects against",
    "explain how a revocation list works and when it fails",
    "describe what a signing request proves and why the private key stays home",
]
walkthrough = """
Start with the passport office. Run the demo one act at a time. After act two, ask what an attacker with the intermediate's key could still do. After act three, ask what a browser should do when it cannot fetch a list. In act four, ask why the request is signed.
Then run the integration tests, and compare OpenSSL's text output with the extensions in act one.
"""
exercises = [
    "Remove the name constraint from the intermediate and see which act changes.",
    "Add a second server certificate and revoke only that one.",
    "Run `openssl x509 -text` on a certificate the demo writes and find the key identifiers.",
    "Change the validation date to after the server certificate ends and read the reason.",
]

[docs.explained]
sentence = """
A certificate authority is a set of builders and rules: certificates carry extensions that fix what each key may do and which names it may vouch for, revocation lists withdraw them, signing requests let the private key stay home, and the whole thing is only as safe as the authority's key.
"""
verdict = """
Use a public authority for public sites and your own small authority, with name constraints, short lifetimes and an offline root, for internal services. Check what you build with a second tool, and treat every extension as a decision.
"""
recognise = [
    "`openssl x509 -noout -text` output in troubleshooting guides.",
    "Name-constrained intermediates in enterprise and service mesh designs.",
    "CRL and OCSP settings in web server and client configuration.",
    "Certificate signing requests created by `openssl req` or `keytool -certreq`.",
]

[spec]
purpose = """
Teach how a small certificate authority works by building a chain with Bouncy Castle, limiting an intermediate with a name constraint, publishing signed revocation lists, handling a signing request, and checking everything with OpenSSL.
"""
nongoals = [
    "OCSP and certificate transparency.",
    "Automated issuance such as ACME.",
    "Hardware-protected authority keys.",
]
problem = """
The plain project had to write certificates by hand, which hides what the standard extensions are for. A library lets the lesson show them by name, and a second tool shows they are standard.
"""
roles = [["Builds certificates", "`CertFactory`"], ["The store's chain", "`Pki`"], ["Revocation lists", "`Crls`"], ["Chain validation", "`ChainValidator`"], ["Signing requests and policy", "`SigningRequest`"], ["PEM text", "`Pem`"], ["Entry point", "`CertsBcDemo`"]]
requirements = [
    "A chain with correct basic constraints, key usages and key identifiers.",
    "A name constraint refuses names outside the permitted domain.",
    "A signed list revokes a serial, a list from another signer or no list leaves the status undetermined.",
    "A request proves possession, a changed request fails, and the authority's policy refuses other domains.",
    "OpenSSL verifies the chain, the lists and the request, and an OpenSSL authority can sign a Java request.",
    "The demo prints the same output on every run.",
]

