[[act]]
title = "Giving the certificate and key to other programs"
summary = "The 371-byte DER certificate becomes PEM: Base64 turns 30 82 01 into 24 bits, groups 12 8 8 1, letters MIIB; 496 letters in lines of 64 between two labels give a 10-line file; the key file is owner-only but holds the private key in the clear."
detail = """
Java holds the certificate as DER bytes: 371 of them, starting 30 82 01. Other programs read PEM text, made in two steps. Step 1, Base64: three bytes are 24 bits, 00110000 10000010 00000001, cut into four groups of six bits, 001100 001000 001000 000001, which are the numbers 12 8 8 1, which are the letters M I I B in the Base64 alphabet (0 = A, 25 = Z, 26 = a, 52 = 0, 63 = /).
Step 2: the 371 bytes become 496 letters, written in lines of 64 between -----BEGIN CERTIFICATE----- and -----END CERTIFICATE-----, a file of 10 lines. The key file is made the same way, between PRIVATE KEY labels, for CN=shop.example.test with an EC key, with permissions rw------- so only its owner can read it. It holds the private key in the clear, so protect it like a password.
"""
figure = "pem_steps"
figure_title = "How a certificate becomes PEM text"
figure_speech = """
Here is how a certificate becomes P E M text, on its first three bytes. [[slnc 400]] Java holds the certificate as D E R bytes, three hundred seventy one of them. [[slnc 300]] The first three are three zero, eight two, zero one. [[slnc 500]]
Step one, Base64. [[slnc 300]] Three bytes are twenty four bits. [[slnc 300]] Cut them into four groups of six bits. [[slnc 300]] As numbers: twelve, eight, eight, one. [[slnc 300]] In the Base64 alphabet, zero is A, so twelve is M, eight is I, and one is B. [[slnc 300]] M, I, I, B. [[slnc 500]]
Step two. [[slnc 300]] All the bytes become four hundred ninety six letters, written in lines of sixty four, between a begin label and an end label. [[slnc 500]]
That text file is what open S S L reads.
"""
speech = """
The program's output. [[slnc 400]] Before P E M: three hundred seventy one D E R bytes. [[slnc 400]] Step one: the bits, the groups of six, and the letters M, I, I, B. [[slnc 400]] Step two: lines of sixty four. [[slnc 400]] After P E M: a file of ten lines.
[[page]]
The key file is made the same way. [[slnc 300]] It is for the shop's name, with an elliptic curve key. [[slnc 300]] Only its owner can read it. [[slnc 400]] But it holds the private key in the clear, so protect it like a password.
"""
rows = { pem = "active amber" }
console = [
    ["BEFORE PEM (the certificate as Java holds it, DER bytes):", "ok"],
    ["  371 bytes, starting  30 82 01 ...", "muted"],
    ["STEP 1. BASE64: 3 BYTES = 24 BITS = 4 GROUPS OF 6 BITS", "amber"],
    ["  bits    00110000 10000010 00000001", "muted"],
    ["  groups  001100 001000 001000 000001  = 12 8 8 1", "muted"],
    ["  letters MIIB   (0 = A, 1 = B, 8 = I, 12 = M, 63 = /)", "muted"],
    ["STEP 2. 496 LETTERS, IN LINES OF 64, BETWEEN TWO LABELS", "amber"],
    ["AFTER PEM (shop-cert.pem, 10 lines):", "bad"],
    ["  -----BEGIN CERTIFICATE-----", "muted"],
    ["  MIIBbzCCARWgAwIBAgIIS44KRdwJBm4w...", "muted"],
    ["  -----END CERTIFICATE-----", "muted"],
    ["---", ""],
    ["THE KEY FILE (shop-key.pem):", "amber"],
    ["  -----BEGIN PRIVATE KEY----- ... -----END PRIVATE KEY-----", "muted"],
    ["  for CN=shop.example.test, key type EC", "muted"],
    ["  permissions rw-------, owner only", "muted"],
    ["  the private key, in the clear  <- PROTECT IT LIKE A PASSWORD", "bad"],
]

[[act]]
title = "Who is on the other end"
summary = "The client asks for shop.example.test and trusts one certificate, fingerprint 0ded3842d38b01a7; over real sockets the shop works, an impostor with the same name but fingerprint b72122451fcf2531 is refused, and the shop is refused when the client asked for another name."
detail = """
The request: the client asks for shop.example.test and trusts one certificate, whose SHA-256 fingerprint starts 0ded3842d38b01a7. The response, from three servers over real sockets: the shop works; an impostor with the same name but a certificate with fingerprint b72122451fcf2531, which the client does not trust, is refused;
and the shop itself is refused when the client asked for another.example.test, because the name must match. openssl s_client makes the same two checks when it is given -CAfile, -verify_hostname NAME and -verify_return_error.
"""
figure = "identity_checks"
figure_title = "Who answered? Two checks on every certificate"
figure_speech = """
The request. [[slnc 300]] The client asks for the shop's name, and trusts one certificate, shown by the first bytes of its S H A two five six fingerprint. [[slnc 500]]
Three servers answer, over real sockets. [[slnc 400]] The shop: trusted, and the name matches. [[slnc 300]] It works. [[slnc 500]]
An impostor: the same name, but another fingerprint. [[slnc 300]] Not trusted, so it is refused. [[slnc 500]]
The shop again, but the client asked for another name. [[slnc 300]] Trusted, but the name does not match, so it is refused too. [[slnc 500]]
Open S S L makes the same two checks, when it is told to.
"""
speech = """
The program's output. [[slnc 400]] The request: the name, and the trusted certificate. [[slnc 500]]
The response: the shop works. [[slnc 300]] The impostor is refused. [[slnc 300]] The wrong name is refused. [[slnc 500]]
And the open S S L options that make the same checks.
"""
rows = { trust = "active ok" }
console = [
    ["THE REQUEST (what the client asks for, and trusts):", "ok"],
    ["  asks for  shop.example.test", "muted"],
    ["  trusts    one certificate, SHA-256 0ded3842d38b01a7", "muted"],
    ["THE RESPONSE (three servers, over real sockets):", "bad"],
    ["  1. the shop, certificate 0ded3842d38b01a7", "muted"],
    ["     works: true", "muted"],
    ["  2. an impostor, same name, certificate b72122451fcf2531", "muted"],
    ["     works: false  <- NOT TRUSTED", "bad"],
    ["  3. the shop, but the client asked for another.example.test", "muted"],
    ["     works: false  <- THE NAME MUST MATCH", "bad"],
    ["openssl s_client checks the same two things when given", "amber"],
    ["-CAfile, -verify_hostname NAME and -verify_return_error", "amber"],
]

[[act]]
title = "Versions: what each side offers"
summary = "Against a server with the JDK's defaults, a client offering only TLSv1.1 is refused and TLSv1.2 agrees TLSv1.2; against a server that allows only TLS 1.3, TLSv1.2 is refused and TLSv1.3 works; openssl's -tls1_1, -tls1_2 and -tls1_3 make the same offers."
detail = """
Before tightening, against a server with the JDK's defaults: a client that offers only TLSv1.1 is refused, because old versions are switched off, and a client that offers only TLSv1.2 agrees TLSv1.2. After tightening, the server allows only TLS 1.3: the TLSv1.2 client is refused and a TLSv1.3 client works.
openssl s_client -tls1_1, -tls1_2 and -tls1_3 make the same offers, and the integration tests check what openssl is told.
"""
figure = "version_matrix"
figure_title = "Which versions connect"
figure_speech = """
Before tightening, a server with Java's defaults. [[slnc 300]] A client that offers only T L S one point one is refused. [[slnc 300]] Old versions are off. [[slnc 300]] A client that offers one point two still connects. [[slnc 500]]
After tightening, the server allows only one point three. [[slnc 300]] Now the one point two client is refused, and a one point three client connects. [[slnc 500]]
Open S S L makes the same offers, with dash T L S one underscore one, one underscore two, and one underscore three.
"""
speech = """
The program's output. [[slnc 400]] Before tightening: one point one refused, one point two works. [[slnc 500]]
After tightening: one point two refused, one point three works. [[slnc 500]]
And the open S S L options that make the same offers.
"""
rows = { versions = "active ok" }
console = [
    ["BEFORE TIGHTENING (a server with the JDK's defaults):", "ok"],
    ["  client offers TLSv1.1  works: false  <- OLD VERSIONS ARE OFF", "bad"],
    ["  client offers TLSv1.2  works: true, agreed TLSv1.2", "muted"],
    ["AFTER TIGHTENING (the server allows only TLS 1.3):", "bad"],
    ["  client offers TLSv1.2  works: false", "muted"],
