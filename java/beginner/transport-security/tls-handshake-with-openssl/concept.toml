# concept.toml: everything about this project that is not Java code.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "tls-handshake-with-openssl"
module = "transport-security"
title = "The TLS Handshake with OpenSSL"
short_title = "TLS with OpenSSL"
package = "tlsopenssl"
main_class = "TlsOpenSslDemo"
tagline = "Ask a second TLS implementation what it sees"
bold = "A TLS client or server written in Java can be checked by openssl, a program written by other people, which reports the same protocol and cipher, refuses the same wrong names and untrusted certificates, and turns away old versions, but only the checks that you switch on."
domain = "an online store"
domain_note = ""
youtube_description = """The TLS handshake with OpenSSL, in Java: the best way to trust your TLS setup is to point a second implementation at it. Explained with an online store, like asking a stranger to read your map back to you. We run a real TLS server and client on one machine, write the certificate and key as PEM files that other programs read, see the client refuse an impostor and a wrong name, offer old and new protocol versions, and use openssl s_client and s_server in the tests as the other end of the conversation, and finish with the bill: openssl only checks what you ask it to check."""
thumb_lines = ["TLS HANDSHAKE", "WITH OPENSSL"]
thumb_code = "openssl s_client -verify_return_error"
youtube_title = "The TLS Handshake with OpenSSL (s_client, s_server, Java)"
youtube_tags = ["tls", "openssl", "s_client", "s_server", "pem", "certificate verification", "hostname verification", "java", "cybersecurity for beginners"]

[readme]
technologies = [
    ["OpenSSL (command-line tool)", "3.6.3", "the independent TLS peer: `openssl s_server` and `openssl s_client`; needed for the integration tests, which skip themselves without it"],
]
intro = """
The plain version of this lesson wired two Java TLS engines together in memory. Here the engines meet the network, and a second implementation. **openssl** is a command-line toolkit written by other people, and its
**s_server** and **s_client** commands are a TLS server and a TLS client that report what they negotiated and what they verified. If a Java client and an openssl server agree on a protocol and cipher, and an openssl client
refuses the same impostor and the same wrong name that the Java client refuses, the Java setting is not a private idea. The two sides read the same **PEM** files: text files that hold a certificate or a private key as Base64.

The demo runs a real TLS server and client over the loopback address, writes the PEM files, repeats the trust and version checks, and prints only facts that do not change between runs. The openssl conversations are in the integration tests.
"""
analogy = """
Think of asking a stranger to read your map back to you. If a friend who drew the map reads it back the same way you drew it, that proves little. A stranger who reads back the same roads, refuses the same
dead end, and agrees on the same name for the town is better evidence that the map is right, and that it is a map and not a private code.
"""
scenario = """
An online store's server presents a certificate for shop.example.test. A Java client connects to it, an impostor with the same name is tried, a wrong name is tried and old protocol versions are offered. The same server is then checked by openssl,
and the same certificate is served by openssl to the Java client.
"""
costs = [
    "**openssl checks only what you ask.** Without `-verify_return_error` it prints a verification problem and carries on, and a script that ignores the exit status and the verification line passes a broken setup.",
    "**Private keys get copied.** Handing a key to another program means writing it to a file, which is one more copy to protect, with owner-only permissions at least.",
    "**Versions of the tool differ.** macOS ships LibreSSL as `openssl`, which has different options and output, so the tests look for a real OpenSSL 3 and skip without one.",
    "**The test certificates are fake.** They are valid for a hundred years, with a published password, and protect nothing.",
]
too_much = """
For a real service, check a new TLS setup from the outside once with openssl or a scanner, and then keep a regular automated check. For learning, the pairing is always worth it. A production server needs certificates from a real authority,
which is the next project.
"""
met_before = [
    "`openssl s_client -connect host:443` in almost every TLS troubleshooting guide.",
    "`curl -v https://...`, which prints the same handshake information.",
    "Online TLS scanners that grade a site's protocols and ciphers.",
    "`.pem`, `.crt` and `.key` files in web server configuration.",
]
where = """
This project follows [tls-handshake](../tls-handshake) and is the second in [transport-security](..). It borrows from [asymmetric-encryption-with-bouncy-castle](../../cryptography/asymmetric-encryption-with-bouncy-castle) the habit of checking Java against OpenSSL.
"""
twin = """
The demo uses real sockets on the loopback address, with ports chosen by the system and never printed, and prints only facts that are the same every time. The test certificates are two PKCS12 files made once with keytool.
The integration tests start openssl as a separate process on a free port, always stop it, and skip themselves if no OpenSSL 3 is found.
"""
test_note = "The ordinary tests and the demo need only a JDK. The integration tests (tagged openssl) run a real openssl as the other end of the connection. They look for OpenSSL 3, skip cleanly without it, and always stop the processes they start."

[[act]]
title = "A real TLS server and client on this machine"
summary = "A Java client connects to a Java server by the name shop.example.test over TLS 1.3 with TLS_AES_256_GCM_SHA384 and gets its answer; anything that speaks TLS can take the client's place."
detail = """
The server listens on the loopback address and the client connects by the name shop.example.test. The handshake works and agrees TLS 1.3 with the suite TLS_AES_256_GCM_SHA384. The server answers the order. Two engines wired together in memory agree
the same suite, as in the plain project. Anything that speaks TLS can take the client's place, so the tests let openssl do it.
"""
speech = """
First demo: a real T L S server and client. [[slnc 400]] The server listens on this machine. [[slnc 300]] The client connects by the shop's name. [[slnc 600]]
The handshake works, with T L S one point three. [[slnc 300]] The server answers the order. [[slnc 600]]
Anything that speaks T L S can take the client's place. [[slnc 300]] So the tests let openssl do it.
"""
rows = { sockets = "active ok" }
console = [
    ["the server listens on the loopback address; the client connects by the name shop.example.test", "muted"],
    ["handshake works: true, agreed protocol: TLSv1.3", "ok"],
    ["agreed cipher suite: TLS_AES_256_GCM_SHA384", "ok"],
    ["the server answered: received: order=A-1001", "ok"],
    ["anything that speaks TLS can take the client's place, so the tests let the openssl program do it", "muted"],
]

[[act]]
title = "Giving the certificate and key to other programs"
summary = "The certificate and private key are written as PEM files, which openssl reads, and the key file is owner-only and holds the key in the clear."
detail = """
The certificate file starts with BEGIN CERTIFICATE and ends with END CERTIFICATE. The key file starts with BEGIN PRIVATE KEY. The certificate names CN=shop.example.test and its key is an elliptic curve key.
The key file is readable by its owner only. PEM is only Base64 of the same bytes, so openssl reads what Java wrote. The key file holds the private key in the clear, so it must be protected like a password.
"""
speech = """
Second demo: giving files to other programs. [[slnc 400]] The certificate and the private key are written as P E M files. [[slnc 600]]
P E M is only Base64 of the same bytes between a first line and a last line. [[slnc 600]]
The key file can be read by its owner only. [[slnc 300]] But it holds the private key in the clear. [[slnc 300]] Protect it like a password.
"""
rows = { pem = "active amber" }
console = [
    ["the certificate file starts with -----BEGIN CERTIFICATE----- and ends with -----END CERTIFICATE-----", "muted"],
    ["the key file starts with -----BEGIN PRIVATE KEY----- and ends with -----END PRIVATE KEY-----", "muted"],
    ["the key file is readable by its owner only: true", "ok"],
    ["PEM is only Base64 of the same bytes, so openssl reads what Java wrote and Java reads what openssl writes", "muted"],
    ["the key file holds the private key in the clear  <- PROTECT IT LIKE A PASSWORD", "amber"],
]

[[act]]
title = "Who is on the other end"
summary = "The client accepts the shop's own certificate, refuses an impostor with the same name, and refuses the real certificate when it asked for a different name."
detail = """
With the shop's own certificate and the name shop.example.test, the handshake works. With an impostor that has the same name but a certificate the client does not trust, it does not: the client refuses. With the shop's real certificate but a request for
another.example.test, it does not: the name must match. openssl s_client checks the same two things when it is given the options for returning an error on verification and for checking the host name.
"""
speech = """
Third demo: who is on the other end. [[slnc 400]] The shop's own certificate works. [[slnc 600]]
An impostor with the same name, but a certificate the client does not trust, is refused. [[slnc 600]]
The shop's real certificate, with a different name asked for, is refused. [[slnc 300]] The name must match. [[slnc 600]]
The openssl client checks the same two things, when it is told to.
"""
rows = { trust = "active ok" }
console = [
    ["the shop's own certificate, name shop.example.test: handshake works: true", "ok"],
    ["an impostor with the same name but a certificate the client does not trust: handshake works: false  <- THE CLIENT REFUSES", "ok"],
    ["the shop's real certificate, but the client asked for another.example.test: handshake works: false  <- THE NAME MUST MATCH", "ok"],
    ["openssl s_client checks the same two things when given -verify_return_error and -verify_hostname", "muted"],
]

[[act]]
title = "Versions: what each side offers"
summary = "TLS 1.2 works with a server that allows the defaults, fails against a server that allows only TLS 1.3, and TLS 1.1 fails everywhere."
detail = """
A client that offers only TLS 1.2 to a server that allows the defaults gets a handshake that works, and the agreed protocol is TLS 1.2. The same client against a server that allows only TLS 1.3 fails. A client that offers only TLS 1.1 fails: old versions are switched off.
openssl s_client with the options for TLS 1.2 and TLS 1.1 makes the same offers, and the tests check what it is told.
"""
speech = """
Fourth demo: versions. [[slnc 400]] A client that offers only T L S one point two works with a server that allows the defaults. [[slnc 600]]
The same client fails against a server that allows only T L S one point three. [[slnc 600]]
And a client that offers only T L S one point one fails. [[slnc 300]] Old versions are switched off. [[slnc 600]]
The openssl client makes the same offers, and the tests check what happens.
"""
rows = { versions = "active ok" }
console = [
    ["a client that offers only TLS 1.2 to a server that allows the defaults: handshake works: true", "ok"],
    ["the agreed protocol is TLSv1.2", "muted"],
    ["the same client against a server that allows only TLS 1.3: handshake works: false", "ok"],
    ["a client that offers only TLS 1.1: handshake works: false  <- OLD VERSIONS ARE SWITCHED OFF", "ok"],
    ["openssl s_client -tls1_2 and -tls1_1 make the same offers, and the tests check what it is told", "muted"],
]

[[act]]
title = "Checking from the outside, and the bill"
summary = "Two openssl commands check a server or serve a certificate, but a second implementation catches only the settings you pass, and openssl without -verify_return_error carries on after a problem."
detail = """
To check a server with another program, run openssl s_client with the address, the server name, the trusted certificate file, the host name to verify, and the option to return an error on verification. To serve with another program, run openssl s_server with the address,
the certificate and the key. The bill: a second implementation catches mistakes in the first, but only the settings that you actually pass are checked. Without the option to return an error, openssl prints the problem and carries on,
so a script must check the exit status and the verification line. And a private key written to a file for another program is one more copy to protect.
"""
speech = """
Fifth demo: checking from the outside. [[slnc 400]] One openssl command checks a server. [[slnc 300]] Another serves a certificate. [[slnc 600]]
The bill. [[slnc 300]] A second implementation catches mistakes, but only in the settings that you pass. [[slnc 600]]
Without the option to return an error, openssl prints the problem and carries on. [[slnc 300]] So a script must check the exit status, and the verification line. [[slnc 600]]
And a private key in a file for another program is one more copy to protect.
"""
rows = { bill = "active amber" }
console = [
    ["to check a server: openssl s_client -connect HOST:PORT -servername NAME -CAfile cert.pem -verify_hostname NAME -verify_return_error", "muted"],
    ["to serve: openssl s_server -accept PORT -cert cert.pem -key key.pem", "muted"],
    ["a second implementation catches mistakes in the first, but only the settings that you actually pass are checked", "amber"],
    ["openssl without -verify_return_error prints the problem and carries on, so a script must check the exit status and the verification line", "amber"],
    ["a private key written to a file for another program is one more copy to protect", "amber"],
]

[animation]
subtitle = "An online store's TLS server is checked by a second implementation: openssl."
boxes = [
