[poster]
headline = [["TLS HANDSHAKE", "text"], ["WITH OPENSSL", "accent"]]
taglines = [["Ask a second TLS implementation what it sees", "gold"]]
before = { code = "Java talks to Java", note = "both could be wrong together", tag = "BEFORE" }
after = { code = "openssl s_client -verify_return_error", note = "an independent check", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "The TLS Handshake with OpenSSL"
narration = """Hello, and welcome. [[slnc 400]] This video checks a T L S setup with openssl, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] T L S is the protocol that makes a connection private, and proves who is on the other end. [[slnc 300]] And openssl is a toolkit, written by other people, with a T L S client and a T L S server in it. [[slnc 600]] Think of asking a stranger to read your map back to you. [[slnc 300]] If the stranger reads back the same roads, and refuses the same dead end, the map is right, and it is a map and not a private code. [[slnc 700]] In this video, the domain is an online store. [[slnc 500]] By the end, you will hear how a Java server and client run over real sockets. [[slnc 300]] How the certificate and key are shared as P E M files. [[slnc 300]] How openssl checks names, trust, and versions. [[slnc 300]] And why it only checks what it is told to."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online store runs a TLS server.", "", "A Java client connects to it.", "An impostor and a wrong name are tried.", "", "Then openssl plays each end."]
narration = """Here is the scenario. [[slnc 400]] An online store runs a T L S server. [[slnc 500]] A Java client connects to it. [[slnc 300]] An impostor, and a wrong name, are tried. [[slnc 600]] Then openssl plays each end, as a second opinion."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["PEM: a certificate or key as Base64 text", "s_server: openssl's TLS server", "s_client: openssl's TLS client", "Verify hostname: the name must match", "Loopback: this machine talking to itself"]
narration = """Before the demos, the words. [[slnc 500]] P E M is a certificate or a key written as base sixty four text. [[slnc 500]] s underscore server is openssl's T L S server. [[slnc 500]] s underscore client is openssl's T L S client. [[slnc 500]] Verify host name means the name in the certificate must match the name asked for. [[slnc 500]] And loopback is this machine talking to itself."""

[[scene]]
key = "03-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "04-pairs"
kind = "figure"
title = "One handshake, two implementations"
body = "two_programs"
narration = """Here is the whole idea, on real values. [[slnc 400]] The demo runs a Java client against a Java server. [[slnc 300]] The tests swap one side for open S S L, a program written by other people. [[slnc 300]] First as the client, then as the server. [[slnc 500]] Every pair agrees. [[slnc 300]] T L S one point three, the same cipher suite, the same reply. [[slnc 300]] And open S S L's own check says verification O K. [[slnc 500]] When two independent programs agree, the setup follows the standard, not a private habit of one library."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "09-ladder"
kind = "bullets"
title = "Why A Second Implementation"
body = ["Java and Java can agree and both be wrong", "openssl was written by other people", "Agreement means it follows the standard", "Switch the checks on, or it will not check"]
narration = """Let's put it together. [[slnc 400]] Java talking to Java can agree, and both be wrong. [[slnc 500]] openssl was written by other people. [[slnc 500]] When the two agree, the setup follows the standard. [[slnc 600]] But switch the checks on, or openssl will not check."""

[[scene]]
key = "11-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["openssl s_client -connect in guides", "curl -v showing the handshake", "Online TLS scanners", ".pem, .crt and .key files"]
narration = """You have probably met this already. [[slnc 400]] The command openssl s underscore client is in almost every T L S troubleshooting guide. [[slnc 500]] The command curl with the verbose option prints the same handshake information. [[slnc 500]] Online T L S scanners grade a site's versions and ciphers. [[slnc 500]] And files that end in dot p e m, dot c r t, and dot key are in every web server's configuration."""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Check new TLS setups from outside", "Verify the name; return on error", "Check the exit status in scripts", "Treat exported keys as new secrets"]
narration = """So, how do you use it? [[slnc 400]] Check every new T L S setup from the outside. [[slnc 500]] Switch on name verification, and return on error. [[slnc 500]] In scripts, check the exit status as well as the output. [[slnc 500]] And treat any key you export for another program as a new secret."""

[[scene]]
key = "13-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "13-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Serve the impostor from openssl", "and see the Java client refuse it."]
narration = """That's the T L S handshake with openssl. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] A second implementation is the best check of a T L S setup, but it checks only what you tell it to check. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] The demo runs with nothing installed except a Java development kit. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Serve the impostor's certificate from openssl, and see the Java client refuse it. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
An online store's TLS server and client on one machine, the certificate and key files that are exported for another program, and the checks that Java and openssl each make. It covers an impostor with the right name, a request for the wrong name,
an attacker who offers an old protocol version, and the handling of exported keys. It does not cover certificate authorities, revocation or mutual TLS.
"""
assets = [
    "The server's private key, in its keystore and in the exported PEM file.",
    "The orders sent over the connection.",
    "The client's decision about whom to trust.",
]
actors = [
    "The store's server and clients.",
    "An impostor who holds a certificate for the right name from nobody the client trusts.",
    "An eavesdropper or downgrader on the network.",
    "A person or script running openssl.",
]
boundaries = [
    "Client to network to server: every byte is protected by TLS or it is public.",
    "Keystore to PEM file: the private key leaves its protected container.",
]
assumptions = [
    "The test certificates and the password in the repository are demo values and protect nothing.",
    "The loopback address stands in for a network.",
    "The openssl used in the tests is a genuine OpenSSL 3 installation.",
]
out_of_scope = [
    "Certificate authorities and chains, revocation, and mutual TLS.",
    "Scanners and policy tools.",
    "Operating system trust stores.",
]
tests = [
    "`SocketsTest` checks the handshake over sockets, an untrusted certificate, a wrong name, protocol versions, PEM round trips, owner-only key files and failed-handshake counts.",
    "`OpenSslInteropTest` (integration) has openssl as client and server, and checks protocol, cipher, verification, wrong names, untrusted certificates, TLS 1.2, TLS 1.3 only and TLS 1.1.",
    "`Base64StepsTest` checks the Base64 worked out by hand against the JDK's encoder, for the whole certificate.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next project, certificates-and-chain-of-trust, looks at who vouches for a certificate, and what happens when the voucher cannot be trusted.
"""

[[threat]]
id = "T1"
stride = "S"
threat = "An impostor presents a certificate for the shop's name that the client does not trust"
where = "`TlsClient`, `openssl s_client -CAfile`"
control = "The client trusts only listed certificates and refuses the rest"
residual = "The trust list is a decision: a wrong entry or a stolen key defeats it"

[[threat]]
id = "T2"
stride = "S"
threat = "A genuine certificate for another name is accepted for the shop's name"
where = "`TlsClient`, `-verify_hostname`"
control = "Endpoint identification: the name in the certificate must match the name asked for"
residual = "openssl s_client checks it only if told to, and a script must check the result"

[[threat]]
id = "T3"
stride = "I"
threat = "The exported private key file is read by another user or ends up in a backup or repository"
where = "`Pem.writePrivateKey`"
control = "Owner-only permissions, written in a temporary folder and deleted"
residual = "The key is in the clear, so keep exported keys short-lived and out of repositories"

[[threat]]
id = "T4"
stride = "R"
threat = "A broken setup passes a script because openssl printed a problem and carried on"
where = "`openssl s_client` without `-verify_return_error`"
control = "The tests pass -verify_return_error and check the exit status and the verification line"
residual = "Any other script must do the same"

[[threat]]
id = "T5"
stride = "T"
threat = "A downgrade to an old protocol version, or reading and changing the traffic"
where = "`TlsServer` protocol list"
control = "TLS 1.0 and 1.1 are switched off, and a server can require TLS 1.3"
residual = "TLS 1.2 stays allowed by default for compatibility, and its configuration needs care"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] Five classes matter here. [[slnc 300]] Here is what each one does."""

[[class]]
name = "TlsOpenSslDemo"
what = "runs the five acts"
[[class.part]]
title = "the five acts"
code = """
act1RealSockets(out);
act2FilesForOtherPrograms(out, dir);
act3WhoIsOnTheOtherEnd(out);
act4Versions(out);
act5Bill(out);
"""
speech = """The demo runs the five acts over real sockets. [[slnc 300]] It prints no ports and no random values, so its output is the same on every run."""

[[class]]
name = "TlsServer"
what = "a tiny TLS server on the loopback"
[[class.part]]
title = "listen, handshake, answer one line"
code = """
socket = (SSLServerSocket) context.getServerSocketFactory()
        .createServerSocket(0, 5, InetAddress.getLoopbackAddress());
...
connection.startHandshake();
...
String line = in.readLine();
...
out.write(("received: " + line + "\\n").getBytes(StandardCharsets.UTF_8));
"""
speech = """T L S server listens on a free port of the loopback address. [[slnc 300]] It runs the handshake, reads one line, and answers received. [[slnc 300]] Open S S L can talk to it like any other client."""

[[class]]
name = "TlsClient"
what = "a client that checks trust and the name"
[[class.part]]
title = "check the name, offer versions"
code = """
SSLParameters parameters = socket.getSSLParameters();
parameters.setEndpointIdentificationAlgorithm("HTTPS");   // the name must match
if (protocols != null) {
    parameters.setProtocols(protocols);                    // e.g. only TLSv1.2
}
socket.setSSLParameters(parameters);
socket.startHandshake();
"""
speech = """T L S client turns on the name check, and can offer only some versions. [[slnc 300]] Start handshake throws if the certificate is not trusted or the name is wrong."""

[[class]]
name = "Pem"
what = "certificate and key as PEM text"
[[class.part]]
title = "Base64 in lines of 64, between labels"
code = """
String body = Base64.getMimeEncoder(64, "\\n".getBytes(StandardCharsets.US_ASCII))
        .encodeToString(der);                  // 64 letters a line
return "-----BEGIN " + label + "-----\\n"
        + body + "\\n-----END " + label + "-----\\n";
...
Files.createFile(file, java.nio.file.attribute.PosixFilePermissions.asFileAttribute(
        PosixFilePermissions.fromString("rw-------")));   // owner only
"""
speech = """P E M encodes the bytes in Base64, sixty four letters a line, between a begin and an end label. [[slnc 300]] The key file is created readable by its owner only."""

[[class]]
name = "Base64Steps"
what = "Base64 worked out by hand"
[[class.part]]
title = "24 bits, four groups of 6"
code = """
int bits = (three[0] & 0xff) << 16 | (three[1] & 0xff) << 8 | (three[2] & 0xff);   // 24 bits
return new int[] {bits >> 18 & 63, bits >> 12 & 63, bits >> 6 & 63, bits & 63};
...
out.append(ALPHABET.charAt(group));     // 0 = A ... 63 = /
"""
speech = """Base64 steps redoes one group of three bytes by hand. [[slnc 300]] It joins them into twenty four bits, cuts four groups of six, and looks each up in the alphabet. [[slnc 300]] A test checks it matches Java's encoder."""

