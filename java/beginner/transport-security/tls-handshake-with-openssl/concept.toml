kind = "poster"
title = "The TLS Handshake with OpenSSL"
narration = """Hello, and welcome. [[slnc 400]] This video checks a T L S setup with openssl, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] T L S is the protocol that makes a connection private, and proves who is on the other end. [[slnc 300]] And openssl is a toolkit, written by other people, with a T L S client and a T L S server in it. [[slnc 600]] Think of asking a stranger to read your map back to you. [[slnc 300]] If the stranger reads back the same roads, and refuses the same dead end, the map is right, and it is a map and not a private code. [[slnc 700]] In this video, the domain is an online store. [[slnc 500]] By the end, you will hear how a Java server and client run over real sockets. [[slnc 300]] How the certificate and key are shared as P E M files. [[slnc 300]] How openssl checks names, trust, and versions. [[slnc 300]] And why it only checks what it is told to."""

