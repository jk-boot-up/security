    "Certificate authorities and chains: the next project.",
    "Mutual TLS with client certificates.",
    "TLS scanners.",
]
problem = """
Learners see TLS working between two programs they wrote and do not know whether it is a standard or a private agreement.
"""
roles = [["A TLS server", "`TlsServer`"], ["A checking TLS client", "`TlsClient`"], ["PEM files", "`Pem`"], ["Base64 by hand", "`Base64Steps`"], ["Test certificates", "`TestCertificates`"], ["In-memory engines", "`Connection`, `Wire`"], ["Entry point", "`TlsOpenSslDemo`"]]
