[[act]]
title = "Checking from the outside, and the bill"
summary = "The request is openssl s_client -connect HOST:PORT -servername NAME -CAfile cert.pem -verify_hostname NAME -verify_return_error -brief; the response the tests check is Protocol version: TLSv1.3, Ciphersuite: TLS_AES_256_GCM_SHA384, Verification: OK and the reply; the bill is that only the settings you pass are checked."
detail = """
To check a server from the outside, the request is the command openssl s_client -connect HOST:PORT -servername NAME -CAfile cert.pem -verify_hostname NAME -verify_return_error -brief. The response the tests check, for this server: Protocol version: TLSv1.3, Ciphersuite: TLS_AES_256_GCM_SHA384, Verification: OK, and the reply received: order=A-1001.
To serve from openssl instead: openssl s_server -cert cert.pem -key key.pem. The bill: a second program catches mistakes in the first, but only the settings you pass are checked; without -verify_return_error, openssl reports a problem and goes on, so a script must check the exit status; and a key file for another program is one more copy to protect.
"""
figure = "openssl_check"
figure_title = "openssl as the client: the command and what it prints"
figure_speech = """
Here is open S S L as the client. [[slnc 400]] The request is one command. [[slnc 300]] Connect to the host and port, send the server name, trust the shop's certificate file, check the name, and stop on any failed check. [[slnc 500]]
The response: the lines the tests read. [[slnc 300]] Protocol version, T L S one point three. [[slnc 300]] The cipher suite. [[slnc 300]] Verification, O K. [[slnc 300]] And the server's reply. [[slnc 500]]
And the bill. [[slnc 300]] Open S S L checks only what the command asks. [[slnc 300]] Without verify return error, it reports a problem and goes on. [[slnc 300]] So a script must check the exit status. [[slnc 300]] And every key file is one more copy to protect.
"""
speech = """
The program's output. [[slnc 400]] The request: the open S S L command, over three lines. [[slnc 500]]
The response: the four lines the tests check. [[slnc 500]]
And how to make open S S L the server instead.
[[page]]
The bill. [[slnc 300]] A second program catches mistakes in the first, but only the settings you pass are checked. [[slnc 400]] A script must check the exit status. [[slnc 400]] And a key file is one more copy to protect.
"""
rows = { bill = "active amber" }
console = [
    ["THE REQUEST (openssl as the client, the command):", "ok"],
