# concept.toml: everything about this project that is not Java code.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "tls-handshake-with-openssl"
module = "transport-security"
title = "The TLS Handshake with OpenSSL"
short_title = "TLS with OpenSSL"
package = "tlsopenssl"
main_class = "TlsOpenSslDemo"
tagline = "Ask a second TLS implementation what it sees"
bold = "A TLS client or server written in Java can be checked by openssl, a program written by other people, which reports the same protocol and cipher, refuses the same wrong names and untrusted certificates, and turns away old versions, but only the checks that you switch on."
domain = "an online store"
domain_note = ""
youtube_description = """The TLS handshake with OpenSSL, in Java: the best way to trust your TLS setup is to point a second implementation at it. Explained with an online store, like asking a stranger to read your map back to you. We run a real TLS server and client on one machine, write the certificate and key as PEM files that other programs read, see the client refuse an impostor and a wrong name, offer old and new protocol versions, and use openssl s_client and s_server in the tests as the other end of the conversation, and finish with the bill: openssl only checks what you ask it to check."""
thumb_lines = ["TLS HANDSHAKE", "WITH OPENSSL"]
thumb_code = "openssl s_client -verify_return_error"
youtube_title = "The TLS Handshake with OpenSSL (s_client, s_server, Java)"
youtube_tags = ["tls", "openssl", "s_client", "s_server", "pem", "certificate verification", "hostname verification", "java", "cybersecurity for beginners"]

[readme]
technologies = [
    ["OpenSSL (command-line tool)", "3.6.3", "the independent TLS peer: `openssl s_server` and `openssl s_client`; needed for the integration tests, which skip themselves without it"],
]
intro = """
The plain version of this lesson wired two Java TLS engines together in memory. Here the engines meet the network, and a second implementation. **openssl** is a command-line toolkit written by other people, and its
**s_server** and **s_client** commands are a TLS server and a TLS client that report what they negotiated and what they verified. If a Java client and an openssl server agree on a protocol and cipher, and an openssl client
refuses the same impostor and the same wrong name that the Java client refuses, the Java setting is not a private idea. The two sides read the same **PEM** files: text files that hold a certificate or a private key as Base64.

The demo runs a real TLS server and client over the loopback address, writes the PEM files, repeats the trust and version checks, and prints only facts that do not change between runs. The openssl conversations are in the integration tests.
"""
analogy = """
Think of asking a stranger to read your map back to you. If a friend who drew the map reads it back the same way you drew it, that proves little. A stranger who reads back the same roads, refuses the same
dead end, and agrees on the same name for the town is better evidence that the map is right, and that it is a map and not a private code.
"""
scenario = """
An online store's server presents a certificate for shop.example.test. A Java client connects to it, an impostor with the same name is tried, a wrong name is tried and old protocol versions are offered. The same server is then checked by openssl,
and the same certificate is served by openssl to the Java client.
"""
costs = [
    "**openssl checks only what you ask.** Without `-verify_return_error` it prints a verification problem and carries on, and a script that ignores the exit status and the verification line passes a broken setup.",
    "**Private keys get copied.** Handing a key to another program means writing it to a file, which is one more copy to protect, with owner-only permissions at least.",
    "**Versions of the tool differ.** macOS ships LibreSSL as `openssl`, which has different options and output, so the tests look for a real OpenSSL 3 and skip without one.",
    "**The test certificates are fake.** They are valid for a hundred years, with a published password, and protect nothing.",
]
too_much = """
For a real service, check a new TLS setup from the outside once with openssl or a scanner, and then keep a regular automated check. For learning, the pairing is always worth it. A production server needs certificates from a real authority,
which is the next project.
"""
met_before = [
    "`openssl s_client -connect host:443` in almost every TLS troubleshooting guide.",
    "`curl -v https://...`, which prints the same handshake information.",
    "Online TLS scanners that grade a site's protocols and ciphers.",
    "`.pem`, `.crt` and `.key` files in web server configuration.",
]
where = """
This project follows [tls-handshake](../tls-handshake) and is the second in [transport-security](..). It borrows from [asymmetric-encryption-with-bouncy-castle](../../cryptography/asymmetric-encryption-with-bouncy-castle) the habit of checking Java against OpenSSL.
"""
twin = """
The demo uses real sockets on the loopback address, with ports chosen by the system and never printed, and prints only facts that are the same every time. The test certificates are two PKCS12 files made once with keytool.
The integration tests start openssl as a separate process on a free port, always stop it, and skip themselves if no OpenSSL 3 is found.
"""
test_note = "The ordinary tests and the demo need only a JDK. The integration tests (tagged openssl) run a real openssl as the other end of the connection. They look for OpenSSL 3, skip cleanly without it, and always stop the processes they start."

[[act]]
title = "A real TLS server and client on this machine"
summary = "A Java client connects to shop.example.test at 127.0.0.1 and sends order=A-1001; the Java server's response: handshake true, TLSv1.3, TLS_AES_256_GCM_SHA384, and the reply received: order=A-1001."
detail = """
The request: a Java client connects over a real socket to the name shop.example.test at the loopback address 127.0.0.1, and sends order=A-1001. The response, after the handshake: it works, the protocol is TLSv1.3, the cipher suite TLS_AES_256_GCM_SHA384, and the server's reply is received: order=A-1001.
Two engines wired together in memory agree the same suite. Anything that speaks TLS can take either side, so the integration tests put the openssl program in the client's place and in the server's.
"""
figure = "socket_exchange"
figure_title = "One order over a real socket"
figure_speech = """
Here is one order over a real socket. [[slnc 400]] The request: a Java client connects to shop dot example dot test, on this machine's own loopback address. [[slnc 300]] It sends order A one thousand and one. [[slnc 500]]
In between, the handshake: the hellos, the certificate, and the client's two checks. [[slnc 500]]
The response, from the Java server. [[slnc 300]] The handshake works. [[slnc 300]] T L S one point three, with A E S two fifty six in G C M mode. [[slnc 300]] And the reply: received, order A one thousand and one. [[slnc 500]]
Because this is a real socket, any program that speaks T L S could take either side.
"""
speech = """
The program's output. [[slnc 400]] The request: where the client connects, and what it sends. [[slnc 500]]
The response: the handshake works, the protocol, the cipher suite, and the reply. [[slnc 500]]
Two engines in memory agree the same suite. [[slnc 300]] And the tests let open S S L take a side.
"""
rows = { sockets = "active ok" }
console = [
