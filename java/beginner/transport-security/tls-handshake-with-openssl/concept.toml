[docs.explained]
sentence = """
A TLS setup is best checked by a second, independent implementation that negotiates the same protocol, refuses the same wrong names and untrusted certificates, and reads the same PEM files, provided that it is told to verify.
"""
verdict = """
Check every new TLS setup from outside with openssl or a scanner, switch on hostname verification and return-on-error, and keep an automated check afterwards. Treat any key you export for another program as a new secret.
"""
recognise = [
    "`openssl s_client -connect host:443` in troubleshooting guides.",
    "`-----BEGIN CERTIFICATE-----` files in web server configuration.",
    "Online TLS scanners.",
]

[spec]
purpose = """
Teach how to check a TLS setup with a second implementation, by running a Java TLS server and client over real sockets, writing PEM files, and using openssl s_client and s_server as the other end in the integration tests.
"""
nongoals = [
    "Certificate authorities and chains: the next project.",
    "Mutual TLS with client certificates.",
    "TLS scanners.",
]
problem = """
Learners see TLS working between two programs they wrote and do not know whether it is a standard or a private agreement.
"""
roles = [["A TLS server", "`TlsServer`"], ["A checking TLS client", "`TlsClient`"], ["PEM files", "`Pem`"], ["Test certificates", "`TestCertificates`"], ["In-memory engines", "`Connection`, `Wire`"], ["Entry point", "`TlsOpenSslDemo`"]]
