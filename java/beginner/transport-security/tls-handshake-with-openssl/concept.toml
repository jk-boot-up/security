]

[docs.dependencies]
intro = """
This project adds no Java library. It uses one command-line tool, and only for the integration tests.
"""
what = [
    ["OpenSSL", "a widely used cryptography toolkit and command-line program. The tests run `openssl s_server` and `openssl s_client` as the other end of a real TLS connection. They skip themselves if no OpenSSL 3 is found."],
]
why = """
A client and server that agree with each other may share the same mistake. A different implementation, written by other people, is the cheapest independent check that the setup follows the standard.
"""
install_note = "A JDK for the demo and the ordinary tests. For the integration tests, OpenSSL 3 on the PATH or in Homebrew's openssl@3 folder. The system `openssl` on macOS is LibreSSL and is not used. The versions:"
