[threatmodel]
scope = """
A Spring Boot web server for an online store, terminating TLS itself: its SSL bundle and keystore file, the plain HTTP port that redirects, the HSTS header and session cookie, certificate renewal, and an internal service that connects with a client certificate.
It covers an attacker on the network and an attacker who impersonates the shop. It does not cover the application's own logic, a reverse proxy, or the operating system.
"""
assets = [
    "Customers' traffic and session cookies.",
    "The server's private key and the keystore file.",
    "The shop's availability, which depends on a valid certificate.",
    "The internal service's access to the shop.",
]
actors = [
    "Customers using browsers.",
    "An attacker on the network path.",
    "An attacker who runs a server with the shop's name.",
    "An internal service that calls the shop.",
    "An operator who renews certificates.",
]
boundaries = [
    "Internet to the HTTPS port: everything crossing it is protected by TLS.",
    "Internet to the plain port: nothing is protected, and the port only redirects.",
    "Keystore file to the server process: the file is readable by the server, so by anyone who gets that access.",
]
assumptions = [
    "The root certificate authority is trusted and its key is safe.",
    "Clients check the certificate and the host name, as browsers and java.net.http do.",
    "In the demo, the host name comes from a hosts file, and the keys and password are demo values.",
]
out_of_scope = [
    "Reverse proxies, load balancers and service meshes.",
    "Certificate authorities, ACME and revocation: see the certificates project.",
    "User authentication and authorization on top of TLS.",
]
tests = [
    "`CertificatesTest` checks that the two server certificates differ, name the host, and chain to the demo root, and that the impostor and the client certificates are what they claim.",
    "`HttpsSpringTest` starts real servers and checks TLS 1.3, every refusal, the redirect and HSTS, the cookie flags, renewal with and without reload, mutual TLS, and the error page and actuator.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next module, safe-habits, looks at what keeps a system safe over time: least privilege, patching and backups.
"""

[[threat]]
id = "T1"
stride = "S"
threat = "A server with the shop's name but a certificate nobody trusts impersonates the shop"
where = "`ShopClient`, the `trust` bundle"
control = "The client trusts only the demo root and checks the host name"
residual = "A stolen or wrongly issued certificate from a trusted authority still passes"

[[threat]]
id = "T2"
stride = "T"
threat = "An attacker forces an old TLS version or plain HTTP"
where = "the `shop` bundle, `ShopApp.chain`"
control = "TLS 1.3 only, a redirect from the plain port, and HSTS"
residual = "A first visit before the browser has seen HSTS can still start on plain HTTP, which preload lists address"

[[threat]]
id = "T3"
stride = "I"
threat = "A session cookie is read from the network or sent over plain HTTP"
where = "the session cookie settings"
control = "Secure, HttpOnly and SameSite=Strict"
residual = "A cross-site scripting hole in the application would still reach the page's data"

[[threat]]
id = "T4"
stride = "I"
threat = "The private key is read from the keystore file"
where = "`shop.p12`"
control = "File permissions on the folder and a password on the keystore"
residual = "The server must read the file, so a key management service or hardware module is stronger"

[[threat]]
id = "T5"
stride = "D"
threat = "The certificate expires, or a renewal is mishandled, and customers cannot connect"
where = "the bundle's reload setting"
control = "Reload on update, so a renewed file is served without a restart"
residual = "Someone must obtain the new certificate in time, and a bad file could break the reload, so monitor expiry"

[[threat]]
id = "T6"
stride = "S"
threat = "An unauthorised client calls an internal endpoint"
where = "`server.ssl.client-auth=need`"
control = "Mutual TLS: only a certificate signed by the trusted root is accepted"
residual = "It identifies a machine, not a person, and a stolen client key works until the certificate expires"

[[threat]]
id = "T7"
stride = "I"
threat = "Error pages, headers or extra endpoints reveal internal details"
where = "`ShopApp`, the defaults"
control = "No actuator on the class path, error messages off, and no Server header"
residual = "A custom error handler or an extra dependency could bring these back, so test from outside"
