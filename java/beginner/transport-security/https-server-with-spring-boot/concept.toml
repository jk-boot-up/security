# concept.toml: everything about this project that is not Java code.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "https-server-with-spring-boot"
module = "transport-security"
title = "An HTTPS Server with Spring Boot"
short_title = "HTTPS with Spring Boot"
package = "httpsspring"
main_class = "HttpsSpringDemo"
tagline = "TLS from a few properties, and what is still yours to check"
bold = "Spring Boot turns a keystore, a TLS version and a client-certificate rule into a working HTTPS server with a few properties, and can renew a certificate without a restart, but a wrong property is as silent as a right one, so check the result from outside."
domain = "an online store"
domain_note = ""
youtube_description = """An HTTPS server with Spring Boot, in Java: the earlier project built HTTPS from the JDK's parts, and this one lets Spring Boot do the plumbing. Explained with an online store, like fitting the shop with a standard door that the locksmith has certified, and still walking round the outside to check it is shut. We configure TLS 1.3 from an SSL bundle, make a client that verifies the certificate and the host name, redirect plain HTTP with Spring Security and add HSTS and secure cookies, renew the certificate while the server keeps running, require a client certificate for mutual TLS, and finish with what the framework leaves to you: error pages, headers and the private key file."""
thumb_lines = ["HTTPS WITH", "SPRING BOOT"]
thumb_code = "server.ssl.bundle=shop"
youtube_title = "HTTPS Server with Spring Boot (SSL Bundles, HSTS, Reload, mTLS)"
youtube_tags = ["spring boot", "https", "tls 1.3", "ssl bundles", "hsts", "mtls", "certificate renewal", "java", "cybersecurity for beginners"]

[readme]
technologies = [
    ["Spring Boot", "4.1.1", "the latest stable release (the 4.2 line is only milestones); it starts the web server and reads the SSL bundles"],
    ["Spring Framework (Spring MVC, RestClient)", "7.0.9", "maps web addresses to Java methods, and its RestClient is the client in the demo; pinned by Spring Boot 4.1.1"],
    ["Spring Security", "7.1.1", "redirects plain HTTP to HTTPS and writes the HSTS header; pinned by Spring Boot 4.1.1"],
    ["Apache Tomcat (embedded)", "11.0.24", "the web server inside the application; it does the TLS handshake; pinned by Spring Boot 4.1.1"],
    ["keytool (JDK)", "25", "made the demo keystores once; the script is in infra/"],
]
intro = """
The plain HTTPS project built a secure web server from the JDK's parts. Real stores use a framework. **Spring Boot** starts a web server (**Tomcat**) inside the program, and TLS becomes **configuration**: a property names an **SSL bundle**, and the bundle names
a **keystore** file, a password, and the TLS versions allowed. Another property asks the server to require a **client certificate**, which is **mutual TLS**. A bundle can also **watch** its files, so when a certificate is renewed
the server starts using it without a restart. **Spring Security** adds what configuration cannot: it redirects the plain HTTP port to HTTPS and writes the **HSTS** header.

The demo starts real servers on the loopback interface, builds clients from the same kind of bundle (a client that trusts only a demo root and checks the host name), and tries to break each setting: a wrong name, an old TLS version, an untrusted certificate,
a missing client certificate. It ends with what Spring does not do for you.
"""
analogy = """
The plain project was building a door and its lock from raw metal. This one fits a standard door that a locksmith has certified, and a key cabinet that the shop can swap keys in without closing. You still have to walk round the outside
and try the handle, because a door that was fitted wrongly looks exactly like one fitted right.
"""
scenario = """
An online store runs a small Spring Boot application. Its customers' browsers, and one internal service, connect over HTTPS. The demo configures the server, builds clients that verify it, redirects plain HTTP, renews the certificate while running, and requires a client certificate.
"""
costs = [
    "**A large dependency.** Spring Boot, Spring Security and Tomcat must be updated together when a vulnerability is fixed.",
    "**Configuration is silent.** A misspelt property does nothing and says nothing, so the demo checks the result from outside, as an attacker would.",
    "**Reload helps only if someone renews.** The server can swap a file without a restart, but a person or a tool still has to get a new certificate before the old one expires.",
    "**mTLS identifies machines, not people.** It suits calls between services. A customer in a browser would need a password and more on top.",
    "**The private key is a file.** The server must be able to read it, so protect the folder, and consider a key management service or hardware module for the real thing.",
]
too_much = """
For a small shop, the usual advice is to put the TLS in front of the application, in a reverse proxy or a load balancer that renews certificates by itself, and keep the application on plain HTTP inside a trusted network.
Terminating TLS in the application, as here, fits when the traffic between the proxy and the application also needs protecting, or when there is no proxy.
"""
met_before = [
    "`server.ssl.*` properties in `application.properties` files.",
    "`.p12` and `.jks` files next to an application, and a password in its configuration.",
    "The \"certificate has expired\" outage that wakes people up.",
    "Service meshes and internal APIs that require client certificates.",
]
where = """
This project is the third in [transport-security](..), after [tls-handshake](../tls-handshake) and [certificates-and-chain-of-trust](../certificates-and-chain-of-trust), and is the framework version of [https-server](../https-server).
"""
twin = """
The servers run on free loopback ports, so the demo prints only facts that do not depend on a port number. The shop's name, shop.example.test, resolves to this machine through a hosts file in the project that Gradle passes to the JVM.
The keystores are made once by `infra/make-test-keystores.sh` with keytool, with a demo password, and are valid for a hundred years. Fingerprints are compared, not printed.
"""
test_note = "Every test starts a real Spring Boot server on free loopback ports. The demo prints only port-independent facts, certificates are compared by fingerprint and never printed, and the renewal test polls until the new certificate is served, so the golden output is the same on every run."

[[act]]
title = "TLS from an SSL bundle"
summary = "TLS 1.3 only, from properties and a bundle; a client built from a bundle trusting the demo root gets 200 over TLS 1.3, and a wrong name, TLS 1.2 only, or the JDK's default trust is refused."
detail = """
The server's certificate and key, and TLS 1.3 only, are set in properties: server.ssl.bundle names a bundle, and the bundle names the keystore. A client built from a bundle that trusts only the demo root asks for /products and gets 200 over TLS 1.3.
The same call through Spring's RestClient works. The same server reached by another name, evil.example.test, is refused, because the name on the certificate must match. A client that offers only TLS 1.2 is refused. And a client that uses the JDK's
default trust and not the bundle is refused, because the demo root is not in the JDK's list.
"""
speech = """
First demo: T L S from an S S L bundle. [[slnc 400]] The certificate, the key, and T L S one point three only, are all set in properties. [[slnc 600]]
A client built from a bundle that trusts only the demo root gets the products page, over T L S one point three. [[slnc 600]]
Reach the same server by another name, and the client refuses it. [[slnc 300]] The name on the certificate must match. [[slnc 600]]
A client that offers only T L S one point two is refused. [[slnc 300]] And a client that uses the default trust of the J D K is refused, because the demo root is not in its list.
"""
rows = { tls = "active ok" }
console = [
    ["the server's certificate and key, and TLS 1.3 only, are set in properties: server.ssl.bundle=shop and a bundle that names the keystore", "muted"],
    ["a client built from a bundle that trusts only the demo root asks for /products: 200 over TLSv1.3", "ok"],
    ["the same call through Spring's RestClient: kettle, toaster, lamp", "ok"],
    ["the same server reached by another name, evil.example.test: refused  <- THE NAME ON THE CERTIFICATE MUST MATCH", "ok"],
    ["a client that offers only TLS 1.2: refused", "ok"],
    ["a client that uses the JDK's default trust and not the bundle: refused  <- THE DEMO ROOT IS NOT IN THE JDK'S LIST", "ok"],
]

[[act]]
title = "Redirect, HSTS and secure cookies"
summary = "The plain HTTP port answers 302 to an https address with an empty body and no HSTS; the HTTPS answer carries HSTS, and the session cookie is Secure, HttpOnly and SameSite=Strict and is never sent over plain HTTP."
detail = """
A request to the plain HTTP port is answered with 302 pointing to an https address, with an empty body and without the HSTS header, because a browser must ignore HSTS received over plain HTTP. The HTTPS answer carries Strict-Transport-Security with a
year and includeSubDomains. The session cookie is Secure, HttpOnly and SameSite=Strict. The client would send the cookie over HTTPS, and never over plain HTTP.
"""
speech = """
Second demo: redirect, H S T S, and cookies. [[slnc 400]] A request to the plain port is answered with a redirect to the secure address, and nothing else. [[slnc 600]]
The redirect carries no H S T S header, because a browser must ignore it over plain H T T P. [[slnc 600]]
The secure answer carries H S T S, for a year. [[slnc 600]]
The session cookie is Secure, Http Only, and Same Site strict. [[slnc 300]] The client would send it over H T T P S, and never over plain H T T P.
"""
rows = { redirect = "active ok" }
console = [
    ["a request to the plain HTTP port is answered with 302 pointing to an https address: true, and the body is empty: true", "ok"],
    ["the plain answer carries Strict-Transport-Security: false", "muted"],
    ["the HTTPS answer carries Strict-Transport-Security: max-age=31536000 ; includeSubDomains", "ok"],
    ["the session cookie is Secure: true, HttpOnly: true, SameSite=Strict: true", "ok"],
    ["the client would send that cookie over HTTPS: true, over plain HTTP: false", "ok"],
]

[[act]]
title = "Renewing a certificate without a restart"
summary = "With reload-on-update the bundle watches its keystore file; replacing the file changes the served certificate, matched by fingerprint, and clients that trust the root need no change."
detail = """
A server with reload-on-update serves the certificate that is on disk. The file is replaced with a renewed certificate, and the server is not restarted. The certificate served has changed, and it matches the new file by fingerprint.
Clients that trust the root still connect without any change, because both certificates are signed by the same root.
"""
speech = """
Third demo: renewing a certificate. [[slnc 400]] The bundle watches its keystore file. [[slnc 600]]
The certificate served matches the file on disk. [[slnc 600]]
Now the file is replaced with a renewed certificate, and the server is not restarted. [[slnc 600]]
The certificate served has changed, and it matches the new file. [[slnc 300]] Clients that trust the root connect without any change.
"""
rows = { reload = "active ok" }
console = [
    ["the certificate served matches the file on disk: true", "ok"],
    ["the file is replaced with the renewed certificate and the server is not restarted", "muted"],
    ["the certificate served has changed: true, and now matches the new file: true", "ok"],
    ["clients that trust the root still connect without any change: ok (200)", "ok"],
]

[[act]]
title = "Mutual TLS: the server checks the client too"
summary = "With client-auth need, Ana's client with a certificate signed by the demo root is identified; a client with no certificate, or one signed by nobody, is refused."
detail = """
The server is told server.ssl.client-auth=need and the bundle gets a trust store for client certificates. Ana's client presents a certificate signed by the demo root, and the server sees who she is, from the certificate.
A client with no certificate is refused, and so is a client whose certificate is signed by nobody. This identifies a machine or an app, not a person who types a password, so it suits calls between services.
"""
speech = """
Fourth demo: mutual T L S. [[slnc 400]] The server is told to need a client certificate, and is given a trust store for them. [[slnc 600]]
Ana's client presents a certificate signed by the demo root, and the server knows who she is. [[slnc 600]]
A client with no certificate is refused. [[slnc 300]] So is a client whose certificate is signed by nobody. [[slnc 600]]
This identifies a machine or an app, not a person who types a password. [[slnc 300]] So it suits calls between services.
"""
rows = { mtls = "active ok" }
console = [
    ["the server is told server.ssl.client-auth=need and the bundle gets a trust store for client certificates", "muted"],
    ["Ana's client presents a certificate signed by the demo root: 200, the server saw: CN=Ana the customer", "ok"],
    ["a client with no certificate: refused", "ok"],
    ["a client whose certificate is signed by nobody: refused", "ok"],
    ["this identifies a machine or an app, not a person who types a password, so it suits service-to-service calls", "amber"],
]

[[act]]
title = "What Spring leaves to you"
summary = "The actuator is not on the class path and gives 404, an error page does not leak its message, no Server header names the software; but configuration is silent when wrong and the private key is a file."
detail = """
The actuator is not on the class path, so /actuator/health gives 404 and nothing extra is exposed. A failing page answers 500 and its body does not mention the internal detail. There is no Server header naming the software.
But configuration is short, and that is the risk: a wrong property is as silent as a right one, so check the result from outside. And the private key sits in a file the server can read, so protect it, rotate it, and renew before it expires.
"""
speech = """
Fifth demo: what Spring leaves to you. [[slnc 400]] The actuator is not on the class path, so nothing extra is exposed. [[slnc 600]]
A failing page answers with an error, and does not mention the internal detail. [[slnc 300]] There is no header naming the software. [[slnc 600]]
But configuration is short, and that is the risk. [[slnc 300]] A wrong property is as silent as a right one. [[slnc 300]] So check the result from outside. [[slnc 600]]
And the private key sits in a file the server can read. [[slnc 300]] Protect it, rotate it, and renew before it expires.
"""
rows = { yours = "active amber" }
console = [
    ["/actuator/health: 404  <- the actuator is not on the class path, so nothing extra is exposed", "ok"],
    ["a failing page answers 500 and its body mentions the internal detail: false", "ok"],
    ["a Server header that names the software: false", "ok"],
    ["configuration is short, and that is the risk: a wrong property is as silent as a right one, so check the result from outside", "amber"],
    ["the private key sits in a file the server can read, so protect it, rotate it, and renew before it expires", "amber"],
]

