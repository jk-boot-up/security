[[scene]]
key = "01-poster"
kind = "poster"
title = "An HTTPS Server with Spring Boot"
narration = """Hello, and welcome. [[slnc 400]] This video explains an H T T P S server with Spring Boot, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] H T T P S is H T T P, the HyperText Transfer Protocol, inside T L S, Transport Layer Security. [[slnc 300]] Spring Boot starts a web server for you, and turns T L S into a few properties. [[slnc 600]] Think of fitting the shop with a standard door that a locksmith has certified. [[slnc 300]] And a key cabinet, where keys can be swapped without closing. [[slnc 300]] You still walk round the outside and try the handle, because a door fitted wrongly looks the same as one fitted right. [[slnc 700]] In this video, the domain is an online store. [[slnc 500]] By the end, you will hear how the server is set up. [[slnc 300]] How clients check it. [[slnc 300]] How a certificate is renewed without a restart. [[slnc 300]] And what the framework still leaves to you."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online store runs on Spring Boot.", "", "Customers connect over HTTPS.", "An internal service must show a certificate.", "The certificate is renewed while the server runs."]
narration = """Here is the scenario. [[slnc 400]] An online store runs on Spring Boot. [[slnc 500]] Customers connect over H T T P S. [[slnc 300]] An internal service must show a certificate of its own. [[slnc 300]] And the store's certificate must be renewed while the server keeps running."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["SSL bundle: a named set of keys and settings", "HSTS: never use plain HTTP for this site", "Reload: use a new file without a restart", "mTLS: the client shows a certificate too", "Fingerprint: a short hash of a certificate"]
narration = """Before the demos, the words. [[slnc 500]] An S S L bundle is a named set of keys and settings. [[slnc 500]] H S T S tells the browser never to use plain H T T P for this site. [[slnc 500]] Reload means using a new file without a restart. [[slnc 500]] M T L S means the client shows a certificate too. [[slnc 500]] And a fingerprint is a short hash that identifies a certificate."""

[[scene]]
key = "03-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "04-handshake"
kind = "figure"
title = "Who checks whom in a TLS connection"
body = "who_checks"
narration = """Before the demos, one picture of what T L S checks. [[slnc 400]] On the left, the client. [[slnc 300]] On the right, the shop's server. [[slnc 500]] When they connect, the server shows its certificate: shop dot example dot test, issued by the demo root. [[slnc 300]] The client checks it against the roots it trusts, and checks the name. [[slnc 600]] With mutual T L S, the client also shows a certificate: Ana the customer, issued by the same root. [[slnc 300]] Now the server checks the client in the same way. [[slnc 600]] Both sides need the demo root in their trust store. [[slnc 300]] And in Spring Boot, all of this, the keys, the trust and the versions, lives in S S L bundles: named sets of files and settings, written as properties."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "09-ladder"
kind = "bullets"
title = "Plain Version and Framework Version"
body = ["Plain: every piece in your code", "Framework: the same decisions as properties", "Plain shows how it works", "Framework shows how it is used", "Both need testing from outside"]
narration = """Let's put the two versions side by side. [[slnc 400]] In the plain version, every piece is in your code. [[slnc 500]] In the framework version, the same decisions are properties. [[slnc 500]] The plain version shows how it works. [[slnc 500]] The framework version shows how it is used. [[slnc 600]] And both need testing from the outside."""

[[scene]]
key = "11-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["server.ssl properties", ".p12 files and passwords", "The certificate-expired outage", "Services that require client certificates"]
narration = """You have probably met this already. [[slnc 400]] Server dot S S L properties are in the configuration of almost every Spring application. [[slnc 500]] Dot p twelve files, and a password next to them. [[slnc 500]] The certificate has expired outage, that wakes people up. [[slnc 500]] And internal services that require client certificates."""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["TLS 1.3 only, from an SSL bundle", "Redirect plain HTTP, send HSTS", "Reload, and someone who renews", "Client certificates between services", "Test every setting from outside"]
narration = """So, how do you use it? [[slnc 400]] Use T L S one point three only, from an S S L bundle. [[slnc 500]] Redirect plain H T T P, and send H S T S. [[slnc 500]] Turn on reload, and give someone the job of renewing. [[slnc 500]] Require client certificates between services. [[slnc 500]] And test every setting from the outside."""

[[scene]]
key = "13-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "13-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Allow TLS 1.2", "and see which refusal changes."]
narration = """That's an H T T P S server with Spring Boot. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] A few properties give you H T T P S, and a wrong property is as silent as a right one, so test from the outside. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine, with nothing installed except a Java development kit. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Allow T L S one point two as well, and see which refusal changes. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
A Spring Boot web server for an online store, terminating TLS itself: its SSL bundle and keystore file, the plain HTTP port that redirects, the HSTS header and session cookie, certificate renewal, and an internal service that connects with a client certificate.
It covers an attacker on the network and an attacker who impersonates the shop. It does not cover the application's own logic, a reverse proxy, or the operating system.
"""
assets = [
    "Customers' traffic and session cookies.",
    "The server's private key and the keystore file.",
    "The shop's availability, which depends on a valid certificate.",
    "The internal service's access to the shop.",
]
actors = [
    "Customers using browsers.",
    "An attacker on the network path.",
    "An attacker who runs a server with the shop's name.",
    "An internal service that calls the shop.",
    "An operator who renews certificates.",
]
boundaries = [
    "Internet to the HTTPS port: everything crossing it is protected by TLS.",
    "Internet to the plain port: nothing is protected, and the port only redirects.",
    "Keystore file to the server process: the file is readable by the server, so by anyone who gets that access.",
]
assumptions = [
    "The root certificate authority is trusted and its key is safe.",
    "Clients check the certificate and the host name, as browsers and java.net.http do.",
    "In the demo, the host name comes from a hosts file, and the keys and password are demo values.",
]
out_of_scope = [
    "Reverse proxies, load balancers and service meshes.",
    "Certificate authorities, ACME and revocation: see the certificates project.",
    "User authentication and authorization on top of TLS.",
]
tests = [
    "`CertificatesTest` checks that the two server certificates differ, name the host, and chain to the demo root, and that the impostor and the client certificates are what they claim.",
    "`HttpsSpringTest` starts real servers and checks TLS 1.3, every refusal, the redirect and HSTS, the cookie flags, renewal with and without reload, mutual TLS, and the error page and actuator.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next module, safe-habits, looks at what keeps a system safe over time: least privilege, patching and backups.
"""

[[threat]]
id = "T1"
stride = "S"
threat = "A server with the shop's name but a certificate nobody trusts impersonates the shop"
where = "`ShopClient`, the `trust` bundle"
control = "The client trusts only the demo root and checks the host name"
residual = "A stolen or wrongly issued certificate from a trusted authority still passes"

[[threat]]
id = "T2"
stride = "T"
threat = "An attacker forces an old TLS version or plain HTTP"
where = "the `shop` bundle, `ShopApp.chain`"
control = "TLS 1.3 only, a redirect from the plain port, and HSTS"
residual = "A first visit before the browser has seen HSTS can still start on plain HTTP, which preload lists address"

[[threat]]
id = "T3"
stride = "I"
threat = "A session cookie is read from the network or sent over plain HTTP"
where = "the session cookie settings"
control = "Secure, HttpOnly and SameSite=Strict"
residual = "A cross-site scripting hole in the application would still reach the page's data"

[[threat]]
id = "T4"
stride = "I"
threat = "The private key is read from the keystore file"
where = "`shop.p12`"
control = "File permissions on the folder and a password on the keystore"
residual = "The server must read the file, so a key management service or hardware module is stronger"

[[threat]]
id = "T5"
stride = "D"
threat = "The certificate expires, or a renewal is mishandled, and customers cannot connect"
where = "the bundle's reload setting"
control = "Reload on update, so a renewed file is served without a restart"
residual = "Someone must obtain the new certificate in time, and a bad file could break the reload, so monitor expiry"

[[threat]]
id = "T6"
stride = "S"
threat = "An unauthorised client calls an internal endpoint"
where = "`server.ssl.client-auth=need`"
control = "Mutual TLS: only a certificate signed by the trusted root is accepted"
residual = "It identifies a machine, not a person, and a stolen client key works until the certificate expires"

[[threat]]
id = "T7"
stride = "I"
threat = "Error pages, headers or extra endpoints reveal internal details"
where = "`ShopApp`, the defaults"
control = "No actuator on the class path, error messages off, and no Server header"
residual = "A custom error handler or an extra dependency could bring these back, so test from outside"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] Five small classes, plus the demo that runs the five acts against real Spring Boot servers. [[slnc 300]] Here is what each one does."""

[[class]]
name = "Shop"
what = "starts a real Spring Boot server, configured only by properties"
[[class.part]]
title = "TLS as properties: an SSL bundle"
code = """
"server.ssl.bundle=shop",
"spring.ssl.bundle.jks.shop.keystore.location=" + store,
"spring.ssl.bundle.jks.shop.keystore.password=" + Certificates.PASSWORD,
...
"spring.ssl.bundle.jks.shop.options.enabled-protocols=TLSv1.3",
"spring.ssl.bundle.jks.shop.reload-on-update=" + settings.reload(),
"""
speech = """Shop starts the store with a list of properties. [[slnc 300]] The server uses the bundle named shop. [[slnc 300]] The bundle names the key store, its password and the allowed T L S version, and whether to reload the file when it changes."""
[[class.part]]
title = "mutual TLS: two more properties"
code = """
if (settings.requireClientCertificate()) {
    // the server's own bundle also needs the trust store, to check client certificates
    p.add("spring.ssl.bundle.jks.shop.truststore.location=" + trust);
...
    p.add("server.ssl.client-auth=need");
"""
speech = """For mutual T L S, the shop's bundle also gets a trust store, to check client certificates. [[slnc 300]] And client auth is set to need, so a client without a trusted certificate is refused."""

[[class]]
name = "ShopApp"
what = "the plain connector, the redirect, HSTS and the pages"
[[class.part]]
title = "redirect plain HTTP, and send HSTS"
code = """
http.portMapper(ports -> ports.http(httpPort).mapsTo(httpsPort))
        .redirectToHttps(Customizer.withDefaults())
        .headers(headers -> headers
                .httpStrictTransportSecurity(hsts -> hsts
                        .includeSubDomains(true)
                        .maxAgeInSeconds(31_536_000))
"""
speech = """Shop app adds what properties cannot. [[slnc 300]] A plain H T T P connector, and a Spring Security chain that redirects it to the H T T P S port. [[slnc 300]] And strict transport security for one year."""
[[class.part]]
title = "who is calling, from the client certificate"
code = """
Object chain = request.getAttribute("jakarta.servlet.request.X509Certificate");
if (chain instanceof X509Certificate[] certificates && certificates.length > 0) {
    return certificates[0].getSubjectX500Principal().getName();
"""
speech = """The who am I page reads the client certificate that the handshake already checked. [[slnc 300]] It answers with its subject, such as C N equals Ana the customer."""

[[class]]
name = "ShopClient"
what = "a client that verifies the server, built from a bundle"
[[class.part]]
title = "the bundle's trust, and a version limit"
code = """
if (context != null) {
    builder.sslContext(context);
}
if (protocols.length > 0) {
    SSLParameters parameters = new SSLParameters();
    parameters.setProtocols(protocols);
...
String attempt(String url) throws InterruptedException {
    try {
        return "ok (" + get(url).status() + ")";
"""
speech = """The shop client is Java's H T T P client, built with a bundle's S S L context, or with the J D K's default trust when there is none. [[slnc 300]] It can limit the T L S versions it offers. [[slnc 300]] Attempt turns a refused handshake into the word refused, so the demo can print it."""

[[class]]
name = "Certificates"
what = "the demo key stores, and fingerprints"
[[class.part]]
title = "a fingerprint is a hash of the certificate"
code = """
static String fingerprint(Certificate certificate) throws GeneralSecurityException {
    byte[] hash = MessageDigest.getInstance("SHA-256").digest(certificate.getEncoded());
    return HexFormat.of().formatHex(hash);
"""
speech = """Certificates copies the demo key stores into a folder, because bundles read files and watch them. [[slnc 300]] A fingerprint is the S H A two fifty six hash of a certificate's bytes. [[slnc 300]] Equal fingerprints mean the same certificate."""

[[class]]
name = "HttpsSpringDemo"
what = "runs the five acts, and names fingerprints by letter"
[[class.part]]
title = "letters instead of machine-made hashes"
code = """
private static String name(List<String> seen, String fingerprint) {
    if (!seen.contains(fingerprint)) {
        seen.add(fingerprint);
    }
    return String.valueOf((char) ('A' + seen.indexOf(fingerprint)));
"""
speech = """The keys are made on each machine, so their hashes differ from one machine to the next. [[slnc 300]] The demo names each fingerprint by a letter, in order of first use, so the output is the same everywhere."""

[[acronym]]
short = "HTTP"
long = "HyperText Transfer Protocol"
say = "H T T P is the HyperText Transfer Protocol: the plain text messages that browsers and web servers send."
[[acronym]]
short = "HTTPS"
long = "HTTP Secure (HTTP inside TLS)"
say = "H T T P S is H T T P Secure: the same messages, sent inside an encrypted T L S connection."
[[acronym]]
short = "TLS"
long = "Transport Layer Security"
say = "T L S is Transport Layer Security: it encrypts the connection and lets each side prove who it is with a certificate."
[[acronym]]
short = "mTLS"
long = "mutual TLS (both sides show a certificate)"
say = "M T L S is mutual T L S: the client shows a certificate too, and the server checks it."
[[acronym]]
short = "SSL"
long = "Secure Sockets Layer (TLS's old name)"
say = "S S L is Secure Sockets Layer, the old name of T L S. Spring still uses it, as in S S L bundle."
[[acronym]]
short = "HSTS"
long = "HTTP Strict Transport Security"
say = "H S T S is H T T P Strict Transport Security: a header that tells the browser to use H T T P S only."
[[acronym]]
short = "JDK"
long = "Java Development Kit"
say = "J D K is the Java Development Kit. It comes with its own list of trusted root certificates."
[[acronym]]
short = "SHA-256"
long = "Secure Hash Algorithm, 256 bits"
say = "S H A two fifty six is the Secure Hash Algorithm with a two hundred and fifty six bit result."
[[acronym]]
short = "CN"
long = "Common Name (the name in a certificate)"
say = "C N is the Common Name: the name written in a certificate, such as Ana the customer."
