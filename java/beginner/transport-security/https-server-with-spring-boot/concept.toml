# concept.toml: everything about this project that is not Java code.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "https-server-with-spring-boot"
module = "transport-security"
title = "An HTTPS Server with Spring Boot"
short_title = "HTTPS with Spring Boot"
package = "httpsspring"
main_class = "HttpsSpringDemo"
tagline = "TLS from a few properties, and what is still yours to check"
bold = "Spring Boot turns a keystore, a TLS version and a client-certificate rule into a working HTTPS server with a few properties, and can renew a certificate without a restart, but a wrong property is as silent as a right one, so check the result from outside."
domain = "an online store"
domain_note = ""
youtube_description = """An HTTPS server with Spring Boot, in Java: the earlier project built HTTPS from the JDK's parts, and this one lets Spring Boot do the plumbing. Explained with an online store, like fitting the shop with a standard door that the locksmith has certified, and still walking round the outside to check it is shut. We configure TLS 1.3 from an SSL bundle, make a client that verifies the certificate and the host name, redirect plain HTTP with Spring Security and add HSTS and secure cookies, renew the certificate while the server keeps running, require a client certificate for mutual TLS, and finish with what the framework leaves to you: error pages, headers and the private key file."""
thumb_lines = ["HTTPS WITH", "SPRING BOOT"]
thumb_code = "server.ssl.bundle=shop"
youtube_title = "HTTPS Server with Spring Boot (SSL Bundles, HSTS, Reload, mTLS)"
youtube_tags = ["spring boot", "https", "tls 1.3", "ssl bundles", "hsts", "mtls", "certificate renewal", "java", "cybersecurity for beginners"]

[readme]
technologies = [
    ["Spring Boot", "4.1.1", "the latest stable release (the 4.2 line is only milestones); it starts the web server and reads the SSL bundles"],
    ["Spring Framework (Spring MVC, RestClient)", "7.0.9", "maps web addresses to Java methods, and its RestClient is the client in the demo; pinned by Spring Boot 4.1.1"],
    ["Spring Security", "7.1.1", "redirects plain HTTP to HTTPS and writes the HSTS header; pinned by Spring Boot 4.1.1"],
    ["Apache Tomcat (embedded)", "11.0.24", "the web server inside the application; it does the TLS handshake; pinned by Spring Boot 4.1.1"],
    ["keytool (JDK)", "25", "made the demo keystores once; the script is in infra/"],
]
intro = """
The plain HTTPS project built a secure web server from the JDK's parts. Real stores use a framework. **Spring Boot** starts a web server (**Tomcat**) inside the program, and TLS becomes **configuration**: a property names an **SSL bundle**, and the bundle names
a **keystore** file, a password, and the TLS versions allowed. Another property asks the server to require a **client certificate**, which is **mutual TLS**. A bundle can also **watch** its files, so when a certificate is renewed
the server starts using it without a restart. **Spring Security** adds what configuration cannot: it redirects the plain HTTP port to HTTPS and writes the **HSTS** header.

The demo starts real servers on the loopback interface, builds clients from the same kind of bundle (a client that trusts only a demo root and checks the host name), and tries to break each setting: a wrong name, an old TLS version, an untrusted certificate,
a missing client certificate. It ends with what Spring does not do for you.
"""
analogy = """
The plain project was building a door and its lock from raw metal. This one fits a standard door that a locksmith has certified, and a key cabinet that the shop can swap keys in without closing. You still have to walk round the outside
and try the handle, because a door that was fitted wrongly looks exactly like one fitted right.
"""
scenario = """
An online store runs a small Spring Boot application. Its customers' browsers, and one internal service, connect over HTTPS. The demo configures the server, builds clients that verify it, redirects plain HTTP, renews the certificate while running, and requires a client certificate.
"""
costs = [
    "**A large dependency.** Spring Boot, Spring Security and Tomcat must be updated together when a vulnerability is fixed.",
    "**Configuration is silent.** A misspelt property does nothing and says nothing, so the demo checks the result from outside, as an attacker would.",
    "**Reload helps only if someone renews.** The server can swap a file without a restart, but a person or a tool still has to get a new certificate before the old one expires.",
    "**mTLS identifies machines, not people.** It suits calls between services. A customer in a browser would need a password and more on top.",
    "**The private key is a file.** The server must be able to read it, so protect the folder, and consider a key management service or hardware module for the real thing.",
]
too_much = """
For a small shop, the usual advice is to put the TLS in front of the application, in a reverse proxy or a load balancer that renews certificates by itself, and keep the application on plain HTTP inside a trusted network.
Terminating TLS in the application, as here, fits when the traffic between the proxy and the application also needs protecting, or when there is no proxy.
"""
met_before = [
    "`server.ssl.*` properties in `application.properties` files.",
    "`.p12` and `.jks` files next to an application, and a password in its configuration.",
    "The \"certificate has expired\" outage that wakes people up.",
    "Service meshes and internal APIs that require client certificates.",
]
where = """
This project is the third in [transport-security](..), after [tls-handshake](../tls-handshake) and [certificates-and-chain-of-trust](../certificates-and-chain-of-trust), and is the framework version of [https-server](../https-server).
"""
twin = """
The servers run on free loopback ports, so the demo prints only facts that do not depend on a port number. The shop's name, shop.example.test, resolves to this machine through a hosts file in the project that Gradle passes to the JVM.
The keystores are made on the first build by `infra/make-test-keystores.sh` with keytool, into `build/` and never committed, with a demo password, and are valid for a hundred years. Fingerprints are compared, not printed.
"""
test_note = "Every test starts a real Spring Boot server on free loopback ports. The demo prints only port-independent facts, certificates are compared by fingerprint and never printed, and the renewal test polls until the new certificate is served, so the golden output is the same on every run."

[[act]]
title = "TLS from an SSL bundle"
summary = "Three properties (server.ssl.bundle=shop, the keystore location, enabled-protocols=TLSv1.3) give a server whose certificate CN=shop.example.test is issued by CN=Demo Root CA; the trusted client gets 200 over TLSv1.3, while another name, a TLS 1.2-only client and the JDK's default trust are refused."
detail = """
TLS is configured with properties and no TLS code: server.ssl.bundle=shop names an SSL bundle, spring.ssl.bundle.jks.shop.keystore.location points to shop.p12, and options.enabled-protocols=TLSv1.3 allows TLS 1.3 only.
The server presents a certificate with subject CN=shop.example.test, issued by CN=Demo Root CA, the root the client's trust bundle holds. Four attempts: (a) the trust bundle, TLS 1.3, shop.example.test: 200 over TLSv1.3, and Spring's RestClient reads kettle, toaster, lamp;
(b) the same, reached as evil.example.test: refused, the name on the certificate must match; (c) a client that offers only TLS 1.2: refused; (d) the JDK's default trust instead of the bundle: refused, because the demo root is not in the JDK's list.
"""
figure = "bundle"
figure_title = "From three properties to a checked connection"
figure_speech = """
In Spring Boot, T L S is configuration. [[slnc 400]] At the top, in green, three properties. [[slnc 300]] The server uses the S S L bundle named shop. [[slnc 300]] That bundle's key store is the file shop dot p twelve. [[slnc 300]] And it allows T L S one point three only. [[slnc 600]]
In the middle, the certificate the server presents. [[slnc 300]] Its subject is shop dot example dot test. [[slnc 300]] It was issued by the demo root. [[slnc 300]] The client trusts that root, so it trusts the certificate. [[slnc 600]]
Below, four attempts and, in red, their results. [[slnc 300]] A: the right client: two hundred, over T L S one point three. [[slnc 300]] B: the same server under another name: refused. [[slnc 300]] C: a client that offers only T L S one point two: refused. [[slnc 300]] D: a client with the J D K's default trust list: refused, because the demo root is not in it.
"""
speech = """
Here is the program's output. [[slnc 400]] The three properties. [[slnc 300]] The certificate: subject, and the issuer, the demo root. [[slnc 300]] And the four attempts, a to d.
[[page]]
The results. [[slnc 300]] A: two hundred over T L S one point three, and Spring's rest client reads the products. [[slnc 300]] B, C and D are refused: wrong name, old version, and a root the J D K does not know.
"""
rows = { tls = "active ok" }
console = [
    ["THE CONFIGURATION (properties, no TLS code):", "ok"],
    ["  server.ssl.bundle=shop", "muted"],
    ["  spring.ssl.bundle.jks.shop.keystore.location=file:.../shop.p12", "muted"],
    ["  spring.ssl.bundle.jks.shop.options.enabled-protocols=TLSv1.3", "muted"],
    ["THE CERTIFICATE (what the shop presents):", "ok"],
    ["  subject   CN=shop.example.test", "muted"],
    ["  issuer    CN=Demo Root CA   (the root the trust bundle holds)", "muted"],
    ["THE ATTEMPTS:", "ok"],
    ["  a  the trust bundle, TLS 1.3, shop.example.test", "muted"],
    ["  b  the same, reached as evil.example.test", "muted"],
    ["  c  a client that offers only TLS 1.2", "muted"],
    ["  d  the JDK's default trust instead of the bundle", "muted"],
    ["---", ""],
    ["THE RESULTS:", "ok"],
    ["  a  200 over TLSv1.3", "muted"],
    ["     Spring's RestClient reads: kettle, toaster, lamp", "muted"],
    ["  b  refused  the name on the certificate must match", "muted"],
    ["  c  refused  the bundle allows TLS 1.3 only", "muted"],
    ["  d  refused  the demo root is not in the JDK's list", "muted"],
]

[[act]]
title = "Redirect, HSTS and secure cookies"
summary = "GET http://shop.example.test/products gets 302 to https with an empty body and no HSTS; the HTTPS answer carries max-age=31536000 (31536000 / 86400 = 365 days) and a JSESSIONID cookie with Path=/; Secure; HttpOnly; SameSite=Strict, sent over https and not over http."
detail = """
A request to the plain HTTP port, GET http://shop.example.test/products, is answered 302 with Location: https://shop.example.test:<https port>/products, an empty body and no Strict-Transport-Security. The HTTPS answer to GET /login carries Strict-Transport-Security: max-age=31536000 ; includeSubDomains,
and 31536000 / 86400 seconds a day = 365 days. It also sets the session cookie JSESSIONID with a random 32-character id and Path=/; Secure; HttpOnly; SameSite=Strict. The client attaches it over https and not over http, because of Secure.
"""
figure = "redirect_cookie"
figure_title = "Plain HTTP is turned away, HTTPS sets HSTS and the cookie"
figure_speech = """
On the left, in green, a request to the plain H T T P port. [[slnc 400]] In red, the answer: three oh two, a location on H T T P S, an empty body, and no strict transport security. [[slnc 300]] Spring Security sends nothing else over the plain port. [[slnc 600]]
On the right, the answer over H T T P S. [[slnc 300]] Strict transport security, with a max age in seconds. [[slnc 300]] Thirty one million, five hundred and thirty six thousand, divided by eighty six thousand four hundred, is three hundred and sixty five days. [[slnc 600]]
And the session cookie, J session id. [[slnc 300]] Secure, HttpOnly, and SameSite strict, from three properties. [[slnc 500]]
At the bottom: the client sends that cookie over H T T P S, and keeps it back over plain H T T P.
"""
speech = """
Here is the output. [[slnc 400]] The plain request, and its answer: three oh two, an empty body, no H S T S. [[slnc 300]] The H T T P S answer: the H S T S header and its days, and the cookie, with the id hidden. [[slnc 300]] Last, the cookie is sent over H T T P S only.
"""
rows = { redirect = "active ok" }
console = [
    ["THE REQUEST (to the plain HTTP port):", "ok"],
    ["  GET http://shop.example.test/products", "muted"],
    ["THE RESPONSE:", "ok"],
    ["  302  Location: https://shop.example.test:<https port>/products", "muted"],
    ["       body: empty, Strict-Transport-Security: none", "muted"],
    ["THE HTTPS ANSWER (to GET /login):", "ok"],
    ["  Strict-Transport-Security:", "muted"],
    ["    max-age=31536000 ; includeSubDomains", "muted"],
    ["    31536000 / 86400 seconds a day = 365 days", "muted"],
    ["  Set-Cookie: JSESSIONID=<32 random characters>", "muted"],
    ["    Path=/; Secure; HttpOnly; SameSite=Strict", "muted"],
    ["THE NEXT REQUESTS (does the client attach the cookie?):", "ok"],
    ["  over https   sent", "muted"],
    ["  over http    not sent  because of Secure", "muted"],
]

[[act]]
title = "Renewing a certificate without a restart"
summary = "With reload-on-update=true, the file on disk and the certificate served are both A; shop.p12 is replaced by the renewed file and, without a restart, both become B (CN=shop.example.test, issued by CN=Demo Root CA), and a client that trusts the root still connects: ok (200)."
detail = """
The shop bundle is set to reload: spring.ssl.bundle.jks.shop.reload-on-update=true. The SHA-256 fingerprints are shown as letters, because the keys are made on each machine. Before: shop.p12 on disk is A, and the certificate served is A.
Then shop.p12 is replaced by the renewed file and the server is not restarted. After: the file is B and the certificate served is B. The renewed certificate is CN=shop.example.test, issued by CN=Demo Root CA, so a client that trusts the root still connects, ok (200), with no change.
"""
figure = "reload"
figure_title = "A new certificate file, picked up while the server runs"
figure_speech = """
Certificates expire, so they must be renewed. [[slnc 400]] Restarting a busy shop to do that is a risk. [[slnc 600]]
At the top, in green, one property: reload on update, true. [[slnc 300]] Spring now watches the key store file. [[slnc 600]]
Each certificate is shown by its fingerprint, a S H A two fifty six hash, written here as a letter. [[slnc 500]]
Before, on the left: the file on disk is A, and the server serves A. [[slnc 400]] In the middle, the file is replaced by the renewed one, and nobody restarts the server. [[slnc 400]] After, on the right: the file is B, and moments later the server serves B. [[slnc 600]]
The renewed certificate has the same name and the same issuer, the demo root. [[slnc 300]] So clients that trust the root connect as before, with no change at all.
"""
speech = """
Here is the output. [[slnc 400]] The property. [[slnc 300]] Before: A on disk, A served. [[slnc 300]] The file is replaced, with no restart. [[slnc 300]] After: B on disk, B served. [[slnc 300]] The renewed certificate has the same name and issuer, so a client that trusts the root still gets two hundred.
"""
rows = { reload = "active ok" }
console = [
    ["THE CONFIGURATION:", "ok"],
    ["  spring.ssl.bundle.jks.shop.reload-on-update=true", "muted"],
    ["BEFORE (SHA-256 fingerprints, shown as letters):", "ok"],
    ["  shop.p12 on disk  A    served  A", "muted"],
    ["THE CHANGE: shop.p12 is replaced by the renewed file,", "ok"],
    ["and the server is not restarted", "muted"],
    ["AFTER:", "ok"],
    ["  shop.p12 on disk  B    served  B", "muted"],
    ["  renewed: CN=shop.example.test, by CN=Demo Root CA", "muted"],
    ["  a client that trusts the root: ok (200), no change", "muted"],
]

[[act]]
title = "Mutual TLS: the server checks the client too"
summary = "With server.ssl.client-auth=need and a trust store in the shop bundle, Ana's certificate CN=Ana the customer, issued by CN=Demo Root CA, gets 200 and the server sees CN=Ana the customer; a client with no certificate and Mallory's self-issued one are refused."
detail = """
Two settings turn on mutual TLS: server.ssl.client-auth=need, and a trust store in the shop bundle (trust.p12) that the server uses to check client certificates. Three clients connect. Ana presents CN=Ana the customer, issued by CN=Demo Root CA: 200, and the server saw CN=Ana the customer.
A client with no certificate is refused. Mallory presents CN=shop.example.test, issued by itself: refused. This identifies a machine or an app, not a person who types a password, so it suits service-to-service calls.
"""
figure = "mutual_tls"
figure_title = "Three clients, and the certificate each one shows"
figure_speech = """
Usually only the server shows a certificate. [[slnc 400]] With mutual T L S, the client must show one too. [[slnc 600]]
At the top, in green, two settings. [[slnc 300]] Client auth: need. [[slnc 300]] And a trust store for the server, holding the demo root. [[slnc 600]]
Below, three clients. [[slnc 300]] Ana shows a certificate for Ana the customer, issued by the demo root. [[slnc 300]] The server accepts it, and even knows who called: C N equals Ana the customer. [[slnc 500]]
The second client shows no certificate. [[slnc 300]] Refused. [[slnc 500]]
Mallory shows a certificate that she issued herself. [[slnc 300]] The server does not trust its issuer, so she is refused too. [[slnc 600]]
This proves which machine or app is calling. [[slnc 300]] So it suits one service calling another.
"""
speech = """
Here is the output. [[slnc 400]] The two settings. [[slnc 300]] The three clients and their certificates. [[slnc 300]] And the results: two hundred for Ana, with the name the server saw, and refused for the other two.
"""
rows = { mtls = "active ok" }
console = [
    ["THE CONFIGURATION:", "ok"],
    ["  server.ssl.client-auth=need", "muted"],
    ["  spring.ssl.bundle.jks.shop.truststore.location=file:.../trust.p12", "muted"],
    ["THE CLIENTS (the certificate each one presents):", "ok"],
    ["  ana       CN=Ana the customer, issued by CN=Demo Root CA", "muted"],
    ["  nobody    no certificate", "muted"],
    ["  mallory   CN=shop.example.test, issued by itself", "muted"],
    ["THE RESULTS:", "ok"],
    ["  ana       200, the server saw: CN=Ana the customer", "muted"],
    ["  nobody    refused", "muted"],
    ["  mallory   refused", "muted"],
    ["this identifies a machine or an app, not a person who types", "muted"],
    ["a password, so it suits service-to-service calls", "muted"],
]

[[act]]
title = "What Spring leaves to you"
summary = "/actuator/health answers 404 because the actuator is not on the class path, the failing /boom page answers 500 without the password in its body, and /products has no Server header; a wrong property fails silently, and the private key is a file to protect, rotate and renew."
detail = """
Three requests probe what Spring Boot might give away. GET /actuator/health answers 404: the actuator is not on the class path, so nothing extra is exposed. GET /boom throws an error that holds a password (database password is hunter2): it answers 500, and the password is not in the body.
GET /products answers 200 with no Server header. The bill: a wrong property fails silently, so check the result from outside; and the private key is a file the server can read, so protect it, rotate it and renew it before it expires.
"""
figure = "left_to_you"
figure_title = "Three probes, and what is still your job"
figure_speech = """
Last, what does the shop give away? [[slnc 400]] In green, three requests an attacker would try. [[slnc 600]]
The actuator health page, which many Spring apps expose. [[slnc 300]] Here it answers four oh four, because the actuator is not on the class path. [[slnc 500]]
A page that fails, with a password inside its error. [[slnc 300]] It answers five hundred, and the password does not appear in the body. [[slnc 500]]
And a normal page. [[slnc 300]] There is no server header naming the software. [[slnc 600]]
In amber, the bill. [[slnc 300]] A wrong property fails as silently as a right one works. [[slnc 300]] So always check from outside. [[slnc 300]] And the private key is just a file: protect it, rotate it, and renew it in time.
"""
speech = """
Here is the output. [[slnc 400]] The three requests. [[slnc 300]] The responses: four oh four, five hundred with no password in the body, and no server header. [[slnc 300]] And the bill.
"""
rows = { yours = "active amber" }
console = [
    ["THE REQUESTS:", "ok"],
    ["  GET /actuator/health  a page many apps expose", "muted"],
    ["  GET /boom             its error holds a password", "muted"],
    ["  GET /products         does a header name the server?", "muted"],
    ["THE RESPONSES:", "ok"],
    ["  /actuator/health      404  no actuator on the class path", "muted"],
    ["  /boom                 500  the password in the body: no", "muted"],
    ["  /products             200  Server header: none", "muted"],
    ["THE BILL:", "ok"],
    ["  a wrong property fails silently: check from outside", "muted"],
    ["  the private key is a file: protect, rotate, renew it", "muted"],
]

