after = { code = "server.ssl.bundle=shop", note = "configured, and tested from outside", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "An HTTPS Server with Spring Boot"
narration = """Hello, and welcome. [[slnc 400]] This video explains an H T T P S server with Spring Boot, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] H T T P S is H T T P inside T L S. [[slnc 300]] Spring Boot starts a web server for you, and turns T L S into a few properties. [[slnc 600]] Think of fitting the shop with a standard door that a locksmith has certified. [[slnc 300]] And a key cabinet, where keys can be swapped without closing. [[slnc 300]] You still walk round the outside and try the handle, because a door fitted wrongly looks the same as one fitted right. [[slnc 700]] In this video, the domain is an online store. [[slnc 500]] By the end, you will hear how the server is set up. [[slnc 300]] How clients check it. [[slnc 300]] How a certificate is renewed without a restart. [[slnc 300]] And what the framework still leaves to you."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online store runs on Spring Boot.", "", "Customers connect over HTTPS.", "An internal service must show a certificate.", "The certificate is renewed while the server runs."]
narration = """Here is the scenario. [[slnc 400]] An online store runs on Spring Boot. [[slnc 500]] Customers connect over H T T P S. [[slnc 300]] An internal service must show a certificate of its own. [[slnc 300]] And the store's certificate must be renewed while the server keeps running."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["SSL bundle: a named set of keys and settings", "HSTS: never use plain HTTP for this site", "Reload: use a new file without a restart", "mTLS: the client shows a certificate too", "Fingerprint: a short hash of a certificate"]
narration = """Before the demos, the words. [[slnc 500]] An S S L bundle is a named set of keys and settings. [[slnc 500]] H S T S tells the browser never to use plain H T T P for this site. [[slnc 500]] Reload means using a new file without a restart. [[slnc 500]] M T L S means the client shows a certificate too. [[slnc 500]] And a fingerprint is a short hash that identifies a certificate."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
