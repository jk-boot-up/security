    ["Spring Security", "puts a chain of filters in front of every request. One redirects plain HTTP to HTTPS, and another writes the HSTS header."],
    ["Spring MVC and RestClient", "map web addresses to Java methods, and make the client calls in the demo, here on the JDK's HttpClient, which verifies host names."],
