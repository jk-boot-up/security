[docs.session]
objectives = [
    "say which property turns on TLS and which turns on client certificates",
    "explain why a client must check the host name as well as the certificate",
    "explain why the plain port's redirect carries no HSTS header",
    "describe how a certificate is renewed without a restart",
    "say what mutual TLS proves and what it does not",
]
walkthrough = """
Start with the standard door. Run the demo one act at a time. After act one, ask which refusal protects against which attacker. After act two, ask what happens on a customer's very first visit, before HSTS has been seen.
In act three, ask what happens if nobody renews. In act four, ask what Mallory would need to get in. In act five, ask which property would silently undo each of the earlier acts if it were misspelt.
"""
exercises = [
    "Allow TLS 1.2 as well, and see which refusal in act one changes.",
    "Misspell `server.ssl.bundle` and find out what the server does, then add a test that would have caught it.",
    "Turn off reload and check that the old certificate keeps being served after the file changes.",
    "Add a third client bundle whose certificate has the wrong key usage and see what the server says.",
]

[docs.explained]
sentence = """
A Spring Boot server gets HTTPS from an SSL bundle named in properties, redirects plain HTTP, can renew its certificate without a restart and can require client certificates, but every one of those settings is silent when wrong, so each must be tested from outside.
"""
verdict = """
Use an SSL bundle with TLS 1.3 only, a redirect and HSTS, secure cookies, and reload with a renewal process that someone owns. Require client certificates between services. Put TLS in a proxy when you can, test from outside whatever you configure, and protect the key file.
"""
recognise = [
    "`server.ssl.bundle` and `spring.ssl.bundle.*` in application properties.",
    "`server.ssl.client-auth=need` in internal service configuration.",
    "A certificate-expiry alert in a monitoring system.",
    "`http.redirectToHttps(...)` in a security configuration.",
]

