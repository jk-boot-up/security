plugins {
    id 'java'
    id 'application'
}

group = 'com.jk.explore.security'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot 4.1.1 is the latest stable Boot; its BOM pins Spring Framework 7.0.9, Spring Security 7.1.1 and Tomcat 11.0.24.
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.1.1')
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security'

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-parameters'
}

// The demo names the shop shop.example.test, which resolves to this machine only through a hosts file kept in the project.
def hostsFile = "-Djdk.net.hosts.file=${projectDir}/config/hosts"

application {
    mainClass = 'com.jk.explore.security.httpsspring.HttpsSpringDemo'
    applicationDefaultJvmArgs = [hostsFile]
}

test {
    useJUnitPlatform()
    jvmArgs hostsFile
}

// No deprecated or to-be-removed API is allowed in any project: a warning fails the build.
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.addAll(['-Xlint:deprecation', '-Xlint:removal', '-Werror'])
}

// The demo keystores are made on the first build by infra/make-test-keystores.sh into build/, and are never committed.
def demoKeys = layout.buildDirectory.dir('generated/demo-keys')
tasks.register('demoKeys', Exec) {
    description = 'Makes the demo keystores, once, into build/.'
    outputs.dir(demoKeys)
    onlyIf { !demoKeys.get().file('trust.p12').asFile.exists() }
    environment 'KEYSTORE_OUT', demoKeys.get().asFile.absolutePath
    commandLine 'bash', 'infra/make-test-keystores.sh'
}
sourceSets.main.resources.srcDir(demoKeys)
tasks.named('processResources') { dependsOn 'demoKeys' }
