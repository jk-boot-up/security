[docs.session]
objectives = [
    "explain what ending TLS at the front door means",
    "choose protocol versions for a site",
    "explain what HSTS does and what it cannot do on the first visit",
    "say why a proxy must set X-Forwarded-Proto itself",
    "run nginx -t before deploying a configuration",
]
walkthrough = """
Start with the receptionist. Run the demo one act at a time. After act three, ask what a visitor on a hotel network could do on the very first visit. In act four, ask why a name check matters when the chain is already trusted.
In act five, show the one-line difference between the trap and the safe configuration, and ask where else a service believes a header it should set itself.
"""
exercises = [
    "Add `ssl_stapling on;` to the configuration and find out why nginx complains when it cannot reach the authority.",
    "Make the plain port serve `/health` only on 127.0.0.1 and redirect everything else.",
    "Change the Java client to resume a session and observe what `ssl_session_tickets off` changes.",
    "Add a second server block for another host name and give it its own certificate.",
]

[docs.explained]
sentence = """
nginx can end TLS at the front door of a site with a short list of settings, but each setting has a trap, so the configuration should be tested and scored, and the application must be told what nginx saw and never what the client claims.
"""
verdict = """
Use TLS 1.3, add 1.2 only if customers need it, send HSTS with always, redirect the plain port, hide the version, and set forwarded headers from nginx's own variables. Test every configuration with nginx -t, and keep private keys out of repositories.
"""
recognise = [
    "`ssl_protocols`, `ssl_ciphers` and `ssl_session_tickets` in nginx configuration.",
    "Cloud load balancers listed as \"TLS termination\".",
    "`X-Forwarded-Proto` handling in framework settings, such as \"trust the proxy\".",
    "Mozilla's SSL configuration generator.",
]

