# concept.toml: everything about this project that is not Java code.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "https-server-with-nginx"
module = "transport-security"
title = "HTTPS Server with nginx"
short_title = "HTTPS with nginx"
package = "httpsnginx"
main_class = "HttpsNginxDemo"
tagline = "Let the front door handle TLS, and set it up with care"
bold = "nginx can end TLS for an online store with HTTP/2, HSTS, a redirect and optional client certificates in a few lines, but the lines have traps: old protocols, a forwarded header the client can forge, and a certificate file that is not there."
domain = "an online store"
domain_note = ""
youtube_description = """HTTPS with nginx, checked from Java: the web server in front of an online store ends the TLS. Explained with an online store, like a receptionist who checks every visitor at the front door so the staff inside need not. We run real nginx containers and talk to them with a Java client that checks the certificate chain and the host name: TLS 1.3 with HTTP/2, which protocol versions to allow, the redirect from the plain port and HSTS, an impostor certificate and a wrong name refused, client certificates with mutual TLS, a forged X-Forwarded-Proto header that fools the application, a configuration check with nginx -t, and a seven-point score for TLS settings."""
thumb_lines = ["HTTPS SERVER", "WITH NGINX"]
thumb_code = "ssl_protocols TLSv1.3;"
youtube_title = "HTTPS Server with nginx (TLS 1.3, HSTS, mTLS, Forwarded Headers)"
youtube_tags = ["nginx", "https", "tls 1.3", "hsts", "mtls", "reverse proxy", "http2", "x-forwarded-proto", "java", "cybersecurity for beginners"]

[readme]
technologies = [
    ["nginx (container image)", "nginx:1.31.7-alpine", "the web server and reverse proxy in front of the store, pinned to an exact version"],
    ["Docker", "any recent Docker Engine or Docker Desktop", "runs the nginx containers for the demo and the container tests"],
    ["OpenSSL 3", "3.6.3", "makes the demo certificates on the first build (infra/make-test-pki.sh, into build/)"],
]
intro = """
The plain version of this lesson put TLS inside the Java server. In production, TLS is usually ended by the web server or load balancer in front of the application, and **nginx** is very often that server. This project
runs real nginx containers and checks them with a Java client that does what a browser does: it verifies the **certificate chain** and the **host name**.

The settings are few and each one matters. `ssl_protocols TLSv1.3` leaves out the older versions. `http2 on` speeds up pages. `add_header Strict-Transport-Security ... always` tells browsers to use HTTPS next time, and `always`
keeps it on error pages. `ssl_session_tickets off` avoids long-lived ticket keys. The plain port 80 only redirects. `ssl_verify_client on` asks visitors for a **client certificate**, which is **mutual TLS**. And the application behind nginx
should be told what nginx saw, in the `X-Forwarded-Proto` header, never what the client claims.
"""
analogy = """
Think of a receptionist at the front door of an office. Visitors show their pass to the receptionist, who then phones the right person inside, so the staff never see the passes. That works as long as the receptionist writes down what they saw, and not
what the visitor says. A receptionist who repeats "the visitor says they were checked at the gate" to the staff has handed every visitor a way to skip the check.
"""
scenario = """
An online store puts nginx in front of its application. The demo starts nginx in several versions: careful, one that also allows TLS 1.2, one with a certificate nobody trusts, one that demands client certificates, and two that differ in one header line.
A Java client checks each one, and the configuration is tested with `nginx -t` and scored against seven habits.
"""
costs = [
    "**The application behind nginx speaks plain text.** Traffic between nginx and the application is not encrypted in this setup, which is fine on one machine and not fine across a network. Use TLS to the application too, or a trusted private network.",
    "**Every setting is a place to go wrong.** A copied configuration can allow old protocols or forget `always`, so the configuration needs a test and a score.",
    "**TLS 1.2 is a trade-off.** Allowing it keeps older clients working and brings back the choice of ciphers, which must then be kept short.",
    "**Certificates expire.** nginx reads them at start, so renewal needs a reload, and the plan for it matters more than the settings.",
    "**Demo keys are not secrets.** The certificates in this project are made for the demo and are committed on purpose. Real private keys never go in a repository.",
]
too_much = """
For a small site, an nginx with a short, tested TLS configuration or a managed load balancer is the right answer. Client certificates are for machine-to-machine traffic and special users, not for ordinary customers.
"""
met_before = [
    "`ssl_protocols`, `ssl_certificate` and `ssl_certificate_key` in every nginx tutorial.",
    "Mozilla's SSL configuration generator, and SSL Labs' test of a site.",
    "`X-Forwarded-For` and `X-Forwarded-Proto` headers in application logs.",
    "Load balancers that \"terminate TLS\" in cloud diagrams.",
]
where = """
This project follows [https-server](../https-server) and [https-server-with-spring-boot](../https-server-with-spring-boot) and uses the same ideas as [tls-handshake](../tls-handshake) and [certificates-and-chain-of-trust](../certificates-and-chain-of-trust). It is the nginx twin of the HTTPS lesson.
"""
twin = """
The demo and its golden-output test start real nginx containers, so they need a running Docker and run with `./gradlew integrationTest`. The default `./gradlew test` needs no Docker: it checks the generated configuration, the score, the demo certificates and the
reply parser. The demo prints only facts that do not depend on port numbers or on random values. The certificates are made on the first build by `infra/make-test-pki.sh` into `build/` and are never committed, and the shop is named shop.example.test through a hosts file kept in the project.
"""
test_note = "The default tests need only a JDK. The tests tagged docker start real nginx containers (nginx:1.31.7-alpine) on free local ports and always remove them; a test checks that none are left behind. The demo prints no port numbers or random values, so its golden output is the same on every run. The demo's comparison with its golden output runs with the integration tests, because the demo needs Docker: run `./gradlew integrationTest` after changing the demo or its narration."

[[act]]
title = "nginx ends the TLS for the shop"
summary = "nginx listens on 443 with http2, the certificate /pki/shop.crt and TLSv1.3 only, and passes requests to the app on http://127.0.0.1:8081; a client that trusts the demo root gets 200 over TLSv1.3 with HTTP/2, 1 + 1 + 1 + 1 + 1 = 5 of 5 headers and Server: nginx, and the app is told proto=https."
detail = """
The HTTPS server block of nginx, in short: listen 443 ssl; http2 on; ssl_certificate /pki/shop.crt; ssl_protocols TLSv1.3; and proxy_pass http://127.0.0.1:8081, the application on a plain local port. A Java client that trusts the demo root asks GET https://shop.example.test/.
The response is 200 over TLSv1.3, with HTTP/2 agreed in the handshake, the five security headers (1 + 1 + 1 + 1 + 1 = 5 of 5) and Server: nginx with no version. The app behind nginx answers app saw proto=https client=: it was told by nginx that the customer used HTTPS.
"""
figure = "termination"
figure_title = "TLS ends at nginx, plain HTTP goes on to the app"
figure_speech = """
Here is what ending T L S at nginx means. [[slnc 400]] On the left, the customer's client. [[slnc 300]] In the middle, nginx. [[slnc 300]] On the right, the shop's application. [[slnc 600]]
Between the client and nginx, in green: H T T P S, encrypted with T L S one point three. [[slnc 300]] nginx holds the certificate and its private key. [[slnc 500]]
Between nginx and the app: plain H T T P, but only on this machine, on port eighty eighty one. [[slnc 300]] nginx adds one header, X forwarded proto, to tell the app the customer used H T T P S. [[slnc 600]]
Below, in red, what came back. [[slnc 300]] Two hundred, over T L S one point three, with H T T P two. [[slnc 300]] All five security headers. [[slnc 300]] A server header without a version. [[slnc 300]] And the app saw proto equals https.
"""
speech = """
Here is the program's output. [[slnc 400]] The configuration lines that matter. [[slnc 300]] The request. [[slnc 300]] And the response: two hundred over T L S one point three with H T T P two, five out of five headers, and what the app behind nginx was told.
"""
rows = { terminate = "active ok" }
console = [
