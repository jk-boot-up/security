# concept.toml: everything about this project that is not Java code.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "https-server-with-nginx"
module = "transport-security"
title = "HTTPS Server with nginx"
short_title = "HTTPS with nginx"
package = "httpsnginx"
main_class = "HttpsNginxDemo"
tagline = "Let the front door handle TLS, and set it up with care"
bold = "nginx can end TLS for an online store with HTTP/2, HSTS, a redirect and optional client certificates in a few lines, but the lines have traps: old protocols, a forwarded header the client can forge, and a certificate file that is not there."
domain = "an online store"
domain_note = ""
youtube_description = """HTTPS with nginx, checked from Java: the web server in front of an online store ends the TLS. Explained with an online store, like a receptionist who checks every visitor at the front door so the staff inside need not. We run real nginx containers and talk to them with a Java client that checks the certificate chain and the host name: TLS 1.3 with HTTP/2, which protocol versions to allow, the redirect from the plain port and HSTS, an impostor certificate and a wrong name refused, client certificates with mutual TLS, a forged X-Forwarded-Proto header that fools the application, a configuration check with nginx -t, and a seven-point score for TLS settings."""
thumb_lines = ["HTTPS SERVER", "WITH NGINX"]
thumb_code = "ssl_protocols TLSv1.3;"
youtube_title = "HTTPS Server with nginx (TLS 1.3, HSTS, mTLS, Forwarded Headers)"
youtube_tags = ["nginx", "https", "tls 1.3", "hsts", "mtls", "reverse proxy", "http2", "x-forwarded-proto", "java", "cybersecurity for beginners"]

[readme]
technologies = [
    ["nginx (container image)", "nginx:1.31.7-alpine", "the web server and reverse proxy in front of the store, pinned to an exact version"],
    ["Docker", "any recent Docker Engine or Docker Desktop", "runs the nginx containers for the demo and the container tests"],
    ["OpenSSL 3", "3.6.3", "makes the demo certificates on the first build (infra/make-test-pki.sh, into build/)"],
]
intro = """
The plain version of this lesson put TLS inside the Java server. In production, TLS is usually ended by the web server or load balancer in front of the application, and **nginx** is very often that server. This project
runs real nginx containers and checks them with a Java client that does what a browser does: it verifies the **certificate chain** and the **host name**.

The settings are few and each one matters. `ssl_protocols TLSv1.3` leaves out the older versions. `http2 on` speeds up pages. `add_header Strict-Transport-Security ... always` tells browsers to use HTTPS next time, and `always`
keeps it on error pages. `ssl_session_tickets off` avoids long-lived ticket keys. The plain port 80 only redirects. `ssl_verify_client on` asks visitors for a **client certificate**, which is **mutual TLS**. And the application behind nginx
should be told what nginx saw, in the `X-Forwarded-Proto` header, never what the client claims.
"""
analogy = """
Think of a receptionist at the front door of an office. Visitors show their pass to the receptionist, who then phones the right person inside, so the staff never see the passes. That works as long as the receptionist writes down what they saw, and not
what the visitor says. A receptionist who repeats "the visitor says they were checked at the gate" to the staff has handed every visitor a way to skip the check.
"""
scenario = """
An online store puts nginx in front of its application. The demo starts nginx in several versions: careful, one that also allows TLS 1.2, one with a certificate nobody trusts, one that demands client certificates, and two that differ in one header line.
A Java client checks each one, and the configuration is tested with `nginx -t` and scored against seven habits.
"""
costs = [
    "**The application behind nginx speaks plain text.** Traffic between nginx and the application is not encrypted in this setup, which is fine on one machine and not fine across a network. Use TLS to the application too, or a trusted private network.",
    "**Every setting is a place to go wrong.** A copied configuration can allow old protocols or forget `always`, so the configuration needs a test and a score.",
    "**TLS 1.2 is a trade-off.** Allowing it keeps older clients working and brings back the choice of ciphers, which must then be kept short.",
    "**Certificates expire.** nginx reads them at start, so renewal needs a reload, and the plan for it matters more than the settings.",
    "**Demo keys are not secrets.** The certificates in this project are made for the demo and are committed on purpose. Real private keys never go in a repository.",
]
too_much = """
For a small site, an nginx with a short, tested TLS configuration or a managed load balancer is the right answer. Client certificates are for machine-to-machine traffic and special users, not for ordinary customers.
"""
met_before = [
    "`ssl_protocols`, `ssl_certificate` and `ssl_certificate_key` in every nginx tutorial.",
    "Mozilla's SSL configuration generator, and SSL Labs' test of a site.",
    "`X-Forwarded-For` and `X-Forwarded-Proto` headers in application logs.",
    "Load balancers that \"terminate TLS\" in cloud diagrams.",
]
where = """
This project follows [https-server](../https-server) and [https-server-with-spring-boot](../https-server-with-spring-boot) and uses the same ideas as [tls-handshake](../tls-handshake) and [certificates-and-chain-of-trust](../certificates-and-chain-of-trust). It is the nginx twin of the HTTPS lesson.
"""
twin = """
The demo and its golden-output test start real nginx containers, so they need a running Docker and run with `./gradlew integrationTest`. The default `./gradlew test` needs no Docker: it checks the generated configuration, the score, the demo certificates and the
reply parser. The demo prints only facts that do not depend on port numbers or on random values. The certificates are made on the first build by `infra/make-test-pki.sh` into `build/` and are never committed, and the shop is named shop.example.test through a hosts file kept in the project.
"""
test_note = "The default tests need only a JDK. The tests tagged docker start real nginx containers (nginx:1.31.7-alpine) on free local ports and always remove them; a test checks that none are left behind. The demo prints no port numbers or random values, so its golden output is the same on every run. The demo's comparison with its golden output runs with the integration tests, because the demo needs Docker: run `./gradlew integrationTest` after changing the demo or its narration."

[[act]]
title = "nginx ends the TLS for the shop"
summary = "A Java client that trusts the demo root gets 200 over TLS 1.3 with HTTP/2, five of five security headers, and the application behind nginx is told the request was https."
detail = """
A Java client that trusts the demo root asks https://shop.example.test/ and gets 200 over TLS 1.3. HTTP/2 was agreed during the handshake. The five security headers score 5 of 5, and the Server header says just nginx, with no version. Behind nginx the application, on a plain local port,
answered: app saw proto=https. nginx told it what it saw.
"""
speech = """
First demo: nginx ends the T L S for the shop. [[slnc 400]] A Java client that trusts the demo root asks for the home page. [[slnc 600]]
It gets two hundred, over T L S one point three. [[slnc 300]] H T T P two was agreed during the handshake. [[slnc 600]]
All five security headers are there, and the server header says only nginx, with no version. [[slnc 600]]
Behind nginx, the application on a plain local port is told that the request came over H T T P S.
"""
rows = { terminate = "active ok" }
console = [
    ["a Java client that trusts the demo root asks https://shop.example.test/ and gets 200 over TLSv1.3", "ok"],
    ["HTTP/2 was agreed during the handshake: yes", "ok"],
    ["the five security headers score 5 of 5, and the Server header says just nginx", "ok"],
    ["behind nginx the application, on a plain local port, answered: app saw proto=https client=", "muted"],
]

[[act]]
title = "Which TLS versions the shop allows"
summary = "With TLS 1.3 only, a client limited to TLS 1.2 is refused; allowing TLS 1.2 with three strong ciphers lets it in, and TLS 1.3 clients still get 1.3."
detail = """
nginx set to TLS 1.3 only refuses a client limited to TLS 1.2, and a TLS 1.3 client gets TLS 1.3. With TLS 1.2 allowed as well, with three strong ciphers, the TLS 1.2 client gets TLS 1.2, and a TLS 1.3 client on the same server still gets TLS 1.3.
Allow TLS 1.2 only while customers still need it, and keep the list of ciphers short.
"""
speech = """
Second demo: which T L S versions the shop allows. [[slnc 400]] With T L S one point three only, a client limited to one point two is refused. [[slnc 600]]
Allow one point two as well, with three strong ciphers, and that client gets in. [[slnc 300]] A one point three client still gets one point three. [[slnc 600]]
Allow the older version only while customers still need it, and keep the list of ciphers short.
"""
rows = { protocols = "active ok" }
console = [
    ["nginx set to TLS 1.3 only: a client limited to TLS 1.2 is refused", "ok"],
    ["the same server and a TLS 1.3 client: TLSv1.3", "ok"],
    ["nginx set to allow TLS 1.2 as well, with three strong ciphers: the TLS 1.2 client gets TLSv1.2", "amber"],
    ["a TLS 1.3 client on the same server still gets TLSv1.3", "ok"],
    ["allow TLS 1.2 only while customers still need it, and keep the list of ciphers short", "muted"],
]

[[act]]
title = "The plain port, the redirect and HSTS"
summary = "The plain port answers 301 to the same address on https and sends no HSTS; the HTTPS answer carries a two-year HSTS, which protects every visit after the first."
detail = """
A request to http://shop.example.test/orders?id=7 gets 301 and a Location of the same address on https. The plain answer carries no HSTS, because a browser ignores HSTS sent over plain HTTP. The HTTPS answer carries max-age=63072000, two years.
The very first visit is still plain, so HSTS protects every visit after it, and preloading protects the first.
"""
speech = """
Third demo: the plain port, the redirect, and H S T S. [[slnc 400]] A request on the plain port is answered with a permanent redirect to the same address on H T T P S. [[slnc 600]]
The plain answer carries no H S T S, because a browser ignores it over plain H T T P. [[slnc 600]]
The secure answer carries it, for two years. [[slnc 300]] The very first visit is still plain. [[slnc 300]] So H S T S protects every visit after it, and preloading protects the first.
"""
rows = { redirect = "active ok" }
console = [
    ["GET http://shop.example.test/orders?id=7 answers 301 and Location https://shop.example.test/orders?id=7", "ok"],
    ["the plain answer carries HSTS: no (a browser ignores HSTS sent over plain HTTP)", "muted"],
    ["the HTTPS answer carries HSTS: max-age=63072000; includeSubDomains", "ok"],
    ["the very first visit is still plain, so HSTS protects every visit after it, and preloading protects the first", "amber"],
]

[[act]]
title = "Who the client trusts, and who the server trusts"
summary = "The client refuses an unknown root, a wrong name and an impostor certificate; with ssl_verify_client on, nginx refuses a client without a certificate and sets the client's identity itself."
detail = """
The JDK's own list of trusted roots does not know the demo root, so it refuses. With the demo root trusted and the right name, the connection is accepted. Connecting by the address 127.0.0.1 is refused, because the name in the certificate must match.
A server with the right name and a certificate signed by nobody trusted is refused. With ssl_verify_client on, a client with no certificate is refused, and with Ana's certificate the answer is 200 and the application is told Ana's name.
When Ana adds a header claiming to be the admin, nginx overwrites it, because it sets that header itself.
"""
speech = """
Fourth demo: who the client trusts, and who the server trusts. [[slnc 400]] The J D K's own list of roots does not know the demo root, so it refuses. [[slnc 600]]
With the demo root trusted and the right name, the connection works. [[slnc 300]] Connect by the address instead, and it is refused, because the name in the certificate must match. [[slnc 600]]
A server with the right name and a certificate signed by nobody trusted is refused. [[slnc 600]]
With client certificates required, a client with none is refused. [[slnc 300]] With Ana's certificate, the application is told Ana's name. [[slnc 300]] A header claiming to be the admin is overwritten by nginx.
"""
rows = { trust = "active ok" }
console = [
    ["the JDK's own list of trusted roots does not know the demo root: refused", "ok"],
    ["with the demo root trusted, the right name: accepted", "ok"],
    ["with the demo root trusted, but connecting by the address 127.0.0.1: refused  <- THE NAME IN THE CERTIFICATE MUST MATCH", "ok"],
    ["a server with the right name and a certificate signed by nobody trusted: refused", "ok"],
    ["with ssl_verify_client on, a client with no certificate: refused", "ok"],
    ["with Ana's certificate: 200 and app saw proto=https client=CN=Ana the customer", "ok"],
    ["Ana adds a header claiming to be the admin: app saw proto=https client=CN=Ana the customer  <- NGINX OVERWRITES HEADERS IT SETS ITSELF", "ok"],
]

[[act]]
title = "The proxy trap, a config check and a score"
summary = "Passing on the client's X-Forwarded-Proto makes the application believe a plain request is secure; nginx -t catches a missing certificate; the careful config scores 7 of 7 and a copied one 1 of 7."
detail = """
If nginx passes on the client's own X-Forwarded-Proto, a plain request that claims https makes the application believe the connection is secure. When nginx sets the header from what it saw, the application is told http.
nginx -t accepts the careful configuration and refuses one whose certificate file is missing, before any customer sees it. The careful configuration scores 7 of 7 on the TLS habits and a typical copied configuration scores 1 of 7.
OCSP stapling is for certificates from a public authority and needs the server to reach it, so it is described and not run here.
"""
speech = """
Fifth demo: the proxy trap, a config check, and a score. [[slnc 400]] If nginx passes on the client's own forwarded protocol header, a plain request that claims H T T P S makes the application believe it is secure. [[slnc 600]]
When nginx sets the header from what it saw, the application is told H T T P. [[slnc 600]]
The command nginx dash t catches a missing certificate before any customer sees it. [[slnc 600]]
The careful configuration scores seven out of seven. [[slnc 300]] A typical copied configuration scores one. [[slnc 600]]
O C S P stapling is described, and not run here.
"""
rows = { proxy = "active wrong" }
console = [
    ["a plain request claims X-Forwarded-Proto: https and nginx passes it on: app saw proto=https client=  <- THE APP BELIEVES THE CONNECTION IS SECURE", "bad"],
    ["the same request when nginx sets the header from what it saw: app saw proto=http client=", "ok"],
    ["nginx -t on the careful configuration: syntax ok", "ok"],
    ["nginx -t when the certificate file is missing: refused before any customer sees it", "ok"],
    ["the careful configuration scores 7 of 7 on the TLS habits", "ok"],
    ["a typical copied configuration scores 1 of 7", "amber"],
    ["OCSP stapling is for certificates from a public authority and needs the server to reach it, so it is described and not run here", "muted"],
]

[animation]
