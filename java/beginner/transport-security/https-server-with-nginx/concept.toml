[[scene]]
key = "01-poster"
kind = "poster"
title = "HTTPS Server with nginx"
narration = """Hello, and welcome. [[slnc 400]] This video explains an H T T P S server with nginx, checked from Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] nginx is a web server that sits in front of an application. [[slnc 300]] H T T P S is H T T P, the HyperText Transfer Protocol, inside T L S, Transport Layer Security. [[slnc 300]] Ending T L S at nginx means it handles the secure connection, and the application behind it speaks plain H T T P. [[slnc 600]] Think of a receptionist at the front door of an office. [[slnc 300]] Visitors show their pass to the receptionist, who then phones the right person inside. [[slnc 300]] That works while the receptionist writes down what they saw, and not what the visitor says. [[slnc 700]] In this video, the domain is an online store. [[slnc 500]] By the end, you will hear which protocol versions to allow. [[slnc 300]] What H S T S can and cannot do. [[slnc 300]] How client certificates work. [[slnc 300]] And the one header line that can fool the application."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online store puts nginx in front of its application.", "", "Customers connect over HTTPS.", "nginx ends the TLS,", "and a Java client checks it", "the way a browser does."]
narration = """Here is the scenario. [[slnc 400]] An online store puts nginx in front of its application. [[slnc 500]] Customers connect over H T T P S. [[slnc 300]] nginx ends the T L S. [[slnc 300]] And a Java client checks it, the way a browser does, with the certificate chain and the host name. [[slnc 600]] What can go wrong in the configuration?"""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["TLS termination: the front door ends TLS", "HSTS: always use HTTPS for this site", "mTLS: the client shows a certificate too", "X-Forwarded-Proto: what nginx saw", "nginx -t: test the configuration"]
narration = """Before the demos, the words. [[slnc 500]] T L S termination means the front door ends the T L S connection. [[slnc 500]] H S T S tells browsers to always use H T T P S for this site. [[slnc 500]] M T L S, mutual T L S, means the client shows a certificate too. [[slnc 500]] X Forwarded Proto is the header that tells the application what nginx saw. [[slnc 500]] And nginx dash t tests a configuration without starting it."""

[[scene]]
key = "03-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "04-chain"
kind = "figure"
title = "Why the client trusts the shop's certificate"
body = "chain"
narration = """Before the demos, how does a client decide to trust the shop? [[slnc 400]] At the top, the demo root. [[slnc 300]] It is a certificate authority, a C A, that signs other certificates. [[slnc 300]] The client keeps a copy of it in its trust store. [[slnc 600]] Below it, the shop's certificate, for shop dot example dot test, signed by the root. [[slnc 300]] nginx presents it on every connection. [[slnc 300]] The client follows the signature up to a root it trusts, and checks the name. [[slnc 600]] On the right, Ana's certificate, also signed by the root. [[slnc 300]] With mutual T L S, nginx checks it the same way. [[slnc 600]] And at the bottom, the impostor. [[slnc 300]] It claims the same name, but it is signed by nobody the client trusts. [[slnc 300]] That signature is the whole difference."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "09-ladder"
kind = "bullets"
title = "A Careful Configuration"
body = ["TLS 1.3, and 1.2 only if needed", "HSTS with always, on every answer", "Plain port: redirect only", "Session tickets off, version hidden", "Forwarded headers set by nginx itself", "Tested with nginx -t"]
narration = """Let's put it side by side. [[slnc 400]] T L S one point three, and one point two only if customers need it. [[slnc 500]] H S T S with always, so error pages carry it too. [[slnc 500]] The plain port only redirects. [[slnc 500]] Session tickets off, and the version hidden. [[slnc 500]] Forwarded headers set by nginx itself, never copied from the client. [[slnc 500]] And every configuration tested with nginx dash t before it goes live."""

[[scene]]
key = "11-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["ssl_protocols in nginx tutorials", "SSL configuration generators and SSL Labs", "X-Forwarded-Proto in application logs", "Load balancers that terminate TLS"]
narration = """You have probably met this already. [[slnc 400]] The settings ssl protocols, ssl certificate, and ssl certificate key are in every nginx tutorial. [[slnc 500]] Configuration generators and site testers grade the same choices. [[slnc 500]] X Forwarded Proto appears in application logs and framework settings. [[slnc 500]] And cloud load balancers that terminate T L S do the same job as this nginx."""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["TLS 1.3; add 1.2 only if needed", "HSTS with always, a redirect, a hidden version", "Set forwarded headers yourself", "Test every configuration with nginx -t", "Keep private keys out of repositories"]
narration = """So, how do you use it? [[slnc 400]] Use T L S one point three, and add one point two only if customers need it. [[slnc 500]] Send H S T S with always, redirect the plain port, and hide the version. [[slnc 500]] Set forwarded headers yourself, from nginx's own variables. [[slnc 500]] Test every configuration with nginx dash t. [[slnc 500]] And keep private keys out of repositories."""

[[scene]]
key = "13-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "13-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a second host name", "with its own certificate."]
narration = """That's an H T T P S server with nginx. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Let nginx end the T L S, but tell the application what nginx saw, and never what the client claims. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] The demo needs a Java development kit and Docker. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a second host name with its own certificate. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
The front door of an online store: nginx ending TLS on port 443, redirecting port 80, passing requests to an application on a local port, and optionally asking clients for certificates. It covers a network attacker who can downgrade, impersonate or forge headers.
It does not cover the application's own logic, the host's security, or TLS between nginx and the application.
"""
assets = [
    "The confidentiality and integrity of customer traffic.",
    "The server's private key.",
    "The application's belief about who is calling and over what.",
    "Client identities presented through certificates.",
]
actors = [
    "Customers using browsers.",
    "A network attacker who can read and change traffic and send forged requests.",
    "An operator who writes and reloads the configuration.",
]
boundaries = [
    "Internet to nginx: the TLS port and the plain port.",
    "nginx to the application: headers that nginx sets become the application's facts.",
    "Configuration repository to the running server: a copied or untested configuration crosses it.",
]
assumptions = [
    "The application listens only on a local port that outsiders cannot reach.",
    "The private key is readable only by nginx and is not in a repository.",
    "In the demo, the certificates and keys are made for the demo and protect nothing.",
]
out_of_scope = [
    "TLS between nginx and the application.",
    "Certificates from a public authority and OCSP stapling.",
    "Denial-of-service protection and load balancing.",
]
tests = [
    "`ConfigAndScoreTest` checks the seven-point score, protocol parsing, the forwarded-header trap and the variants' directives.",
    "`ReferenceConfigTest` checks that `infra/nginx-careful.conf` is what the code generates.",
    "`PkiTest` checks the demo certificates: chain, names, key usage and the impostor.",
    "`NginxContainerTest` (integration) starts real nginx containers and checks TLS, redirects, trust, mutual TLS, the trap, `nginx -t` and that no containers are left.",
    "`DemoRunsTest` (integration) compares the whole demo with the golden output.",
]
next = """
The transport-security module is complete. The safe-habits module looks at the habits that keep a system safe over time: least privilege, patching and backups.
"""

[[threat]]
id = "T1"
stride = "T"
threat = "An attacker strips or downgrades the protection on the connection"
where = "`ssl_protocols`, the plain port"
control = "TLS 1.3 only (or 1.2 with a short cipher list), a redirect from port 80, and HSTS with always"
residual = "The first visit is plain unless the site is preloaded"

[[threat]]
id = "T2"
stride = "I"
threat = "Traffic is read on the network"
where = "the plain port and the TLS port"
control = "All real traffic goes over TLS, and the plain port only redirects"
residual = "Metadata such as addresses and timing remains visible"

[[threat]]
id = "T3"
stride = "S"
threat = "A client forges a forwarded header so the application believes the request was secure"
where = "`proxy_set_header X-Forwarded-Proto`"
control = "nginx sets the header from `$scheme`, never from the client's header"
residual = "Other headers the application trusts must be set the same way"

[[threat]]
id = "T4"
stride = "T"
threat = "A copied or untested configuration is deployed with weak settings or errors"
where = "`nginx.conf`"
control = "`nginx -t` before deployment and a score of the TLS habits"
residual = "The score covers seven habits, not everything"

[[threat]]
id = "T5"
stride = "S"
threat = "A client claims an identity through a header or an unchecked certificate"
where = "`ssl_verify_client`, `X-Client-DN`"
control = "Client certificates are checked against the demo root, and nginx overwrites the identity header"
residual = "Revocation of client certificates is not checked here"

[[threat]]
id = "T6"
stride = "I"
threat = "The server's private key is stolen from the host or a repository"
where = "`/pki/shop.key`"
control = "Mounted read-only, readable only by nginx in a real deployment, and never committed (the demo key is a demo value)"
residual = "A stolen key allows impersonation until the certificate is replaced and revoked"

[classes]
title = "The Java Classes"
narration = "Now, a quick look at the code. [[slnc 300]] Six small classes, plus the demo that runs the five acts against real nginx containers. [[slnc 300]] Here is what each one does."

[[class]]
name = "NginxConfig"
what = "writes the nginx configuration for each version of the shop"
[[class.part]]
title = "TLS 1.3, and mutual TLS when asked"
code = '''
c.append("    ssl_protocols TLSv1.3;\n");
...
c.append("    ssl_session_tickets off;\n");
if (mtls) {
    c.append("    ssl_client_certificate /pki/root.pem;\n");
    c.append("    ssl_verify_client on;\n");
'''
speech = "Nginx config writes every variant of the configuration as text. [[slnc 300]] The careful one allows T L S one point three only and turns session tickets off. [[slnc 300]] The mutual T L S variant also checks client certificates against the demo root."
[[class.part]]
title = "the app is told what nginx saw"
code = '''
String proto = variant == Variant.PROXY_TRAP ? "$http_x_forwarded_proto" : "$scheme";
...
c.append("      proxy_set_header X-Forwarded-Proto $scheme;\n");
c.append("      proxy_set_header X-Client-DN $ssl_client_s_dn;\n");
'''
speech = "The trap variant copies the client's own header. [[slnc 300]] The careful one sets X forwarded proto from the scheme nginx saw, and X client D N from the checked client certificate."

[[class]]
name = "Nginx"
what = "runs a configuration in a real container, or tests it"
[[class.part]]
title = "nginx -t before any customer"
code = '''
Process p = new ProcessBuilder("docker", "run", "--rm", "-v", dir.resolve("nginx.conf") + ":/etc/nginx/nginx.conf:ro",
        "-v", dir.resolve("pki") + ":/pki:ro", IMAGE, "nginx", "-t").redirectErrorStream(true).start();
'''
speech = "The nginx class starts a pinned nginx image with a configuration and the demo certificates. [[slnc 300]] It can also run nginx dash t, which checks a configuration and its files without serving anyone."

[[class]]
name = "Pki"
what = "the demo certificates, and the client's trust"
[[class.part]]
title = "trust the demo root, or the JDK's list"
code = '''
trust.init(trustDemoRoot ? keyStore("trust.p12") : (KeyStore) null);
...
    keys.init(keyStore("client.p12"), PASSWORD);
'''
speech = "Pki builds the client's S S L context. [[slnc 300]] It trusts either the demo root, or, with null, the J D K's own list. [[slnc 300]] With a client certificate, it also loads Ana's key."

[[class]]
name = "TlsClient"
what = "a Java client that checks the chain and the name"
[[class.part]]
title = "the versions it offers"
code = '''
.sslContext(Pki.sslContext(options.trustDemoRoot(), options.clientCertificate()));
...
    parameters.setProtocols(options.protocols());
'''
speech = "The T L S client is Java's H T T P client, built from those options. [[slnc 300]] It can limit the versions it offers, use another host name, or add a header, which is how each attempt is made."

[[class]]
name = "Probe"
what = "sends raw bytes to the plain port"
[[class.part]]
title = "a request a normal client would not send"
code = '''
socket.getOutputStream().write(raw.getBytes(StandardCharsets.ISO_8859_1));
'''
speech = "The probe writes a plain request to a socket as raw bytes, such as the forged X forwarded proto header."

[[class]]
name = "ConfigScore"
what = "seven TLS habits, read from the configuration text"
[[class.part]]
title = "one habit: HSTS on every answer"
code = '''
boolean hstsAlways = Pattern.compile("add_header\\s+Strict-Transport-Security\\s+\"[^\"]*\"\\s+always;").matcher(conf).find();
'''
speech = "Config score reads a configuration and gives one point per habit. [[slnc 300]] For example, the H S T S header must be added with always, so that error pages carry it too."

[[acronym]]
short = "HTTP"
long = "HyperText Transfer Protocol"
say = "H T T P is the HyperText Transfer Protocol: the plain text messages that browsers and web servers send."
[[acronym]]
short = "HTTPS"
long = "HTTP Secure (HTTP inside TLS)"
say = "H T T P S is H T T P Secure: the same messages, sent inside an encrypted T L S connection."
[[acronym]]
short = "TLS"
long = "Transport Layer Security"
say = "T L S is Transport Layer Security: it encrypts the connection and lets each side prove who it is with a certificate."
[[acronym]]
short = "mTLS"
long = "mutual TLS (both sides show a certificate)"
say = "M T L S is mutual T L S: the client shows a certificate too, and the server checks it."
[[acronym]]
short = "SSL"
long = "Secure Sockets Layer (TLS's old name)"
say = "S S L is Secure Sockets Layer, the old name of T L S, still used in nginx's directive names."
[[acronym]]
short = "HSTS"
long = "HTTP Strict Transport Security"
say = "H S T S is H T T P Strict Transport Security: a header that tells the browser to use H T T P S only."
[[acronym]]
short = "CA"
long = "Certificate Authority"
say = "C A is a Certificate Authority: whoever signs certificates. Here it is the demo root."
[[acronym]]
short = "JDK"
long = "Java Development Kit"
say = "J D K is the Java Development Kit. It comes with its own list of trusted root certificates."
[[acronym]]
short = "ECDHE"
long = "Elliptic Curve Diffie-Hellman Ephemeral (a fresh shared key per connection)"
say = "E C D H E is Elliptic Curve Diffie Hellman Ephemeral: the two sides agree a fresh key for each connection."
[[acronym]]
short = "ECDSA"
long = "Elliptic Curve Digital Signature Algorithm"
say = "E C D S A is the Elliptic Curve Digital Signature Algorithm: how the server signs with its certificate's key."
[[acronym]]
short = "AES/AES128/AES256"
long = "Advanced Encryption Standard (with a 128-bit or 256-bit key)"
say = "A E S is the Advanced Encryption Standard: the cipher that encrypts the data."
[[acronym]]
short = "GCM"
long = "Galois/Counter Mode"
say = "G C M is Galois Counter Mode: a way of using A E S that also detects any change to the data."
[[acronym]]
short = "SHA/SHA256/SHA384"
long = "Secure Hash Algorithm (256-bit or 384-bit result)"
say = "S H A is the Secure Hash Algorithm. The number after it is the size of the result in bits."
[[acronym]]
short = "DN"
long = "Distinguished Name (the full name in a certificate)"
say = "D N is a Distinguished Name: the full name in a certificate, such as C N equals Ana the customer."
[[acronym]]
short = "CN"
long = "Common Name"
say = "C N is the Common Name, the main part of a certificate's name."
[[acronym]]
short = "OCSP"
long = "Online Certificate Status Protocol"
say = "O C S P is the Online Certificate Status Protocol: a way to ask whether a certificate was revoked."
