[[act]]
title = "The proxy trap, a config check and a score"
summary = "A plain request forging X-Forwarded-Proto: https fools the app (proto=https) when nginx copies the header, and not (proto=http) when nginx sets it from $scheme; nginx -t passes the careful configuration and refuses a missing certificate; the careful configuration scores 7 of 7 TLS habits, a copied one 1 of 7."
detail = """
A plain HTTP request sends GET /app with a forged X-Forwarded-Proto: https. When nginx copies the client's header, the app is told proto=https and is fooled into believing the connection is secure; when nginx sets the header from $scheme, what it saw itself, the app is told proto=http.
nginx -t checks a configuration before any customer sees it: the careful one gives syntax ok, and one whose certificate file is missing is refused. Seven TLS habits are scored: modern protocols only, HSTS on every answer, plain port redirects, session tickets off, version hidden, HTTP/2, and the app told what nginx saw.
The careful configuration scores 1 + 1 + 1 + 1 + 1 + 1 + 1 = 7 of 7; a typical copied one scores 0 + 0 + 0 + 0 + 1 + 0 + 0 = 1 of 7. OCSP stapling needs a public authority, so it is described and not run.
"""
figure = "proxy_trap"
figure_title = "A forged header, a config test, and seven habits"
figure_speech = """
First, the proxy trap. [[slnc 400]] At the top, in green, a plain request with a forged header: X forwarded proto, H T T P S. [[slnc 500]]
In red, two versions of nginx. [[slnc 300]] One copies the client's header. [[slnc 300]] The app is told proto equals https, and believes the connection is secure. [[slnc 300]] It is fooled. [[slnc 300]] The other sets the header itself, from the scheme it saw. [[slnc 300]] The app is told proto equals http. [[slnc 600]]
Below, nginx dash t tests a configuration before any customer sees it. [[slnc 300]] The careful one passes. [[slnc 300]] One with a missing certificate file is refused. [[slnc 600]]
On the right, seven T L S habits, one point each. [[slnc 300]] The careful configuration scores seven out of seven. [[slnc 300]] A typical copied one scores one: it only hides the version.
"""
speech = """
Here is the output. [[slnc 400]] The forged request. [[slnc 300]] What the app was told: https when nginx copies the header, http when nginx sets it. [[slnc 300]] And nginx dash t: syntax ok, and refused when the certificate file is missing.
[[page]]
Then the seven habits, yes or no for each configuration, and the two sums: seven out of seven, and one out of seven.
"""
rows = { proxy = "active wrong" }
console = [
    ["THE REQUEST (plain HTTP, with a forged header):", "ok"],
    ["  GET /app   X-Forwarded-Proto: https", "muted"],
    ["THE RESPONSES (what the app behind nginx was told):", "ok"],
    ["  nginx copies it   proto=https client=  <- FOOLED", "muted"],
    ["  nginx sets it     proto=http client=", "muted"],
    ["THE CONFIG CHECKS (nginx -t, before any customer):", "ok"],
    ["  the careful configuration     syntax ok", "muted"],
    ["  the certificate file missing  refused", "muted"],
    ["---", ""],
    ["THE SCORE (seven TLS habits):", "ok"],
    ["                            careful  copied", "muted"],
    ["  modern protocols only     yes      no", "muted"],
    ["  HSTS on every answer      yes      no", "muted"],
    ["  plain port redirects      yes      no", "muted"],
    ["  session tickets off       yes      no", "muted"],
    ["  version hidden            yes      yes", "muted"],
    ["  HTTP/2                    yes      no", "muted"],
    ["  app told what nginx saw   yes      no", "muted"],
    ["  careful   1 + 1 + 1 + 1 + 1 + 1 + 1 = 7 of 7", "muted"],
    ["  copied    0 + 0 + 0 + 0 + 1 + 0 + 0 = 1 of 7", "muted"],
    ["OCSP stapling needs a public authority: described, not run", "muted"],
]

