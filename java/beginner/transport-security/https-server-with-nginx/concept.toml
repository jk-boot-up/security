[docs.explained]
sentence = """
nginx can end TLS at the front door of a site with a short list of settings, but each setting has a trap, so the configuration should be tested and scored, and the application must be told what nginx saw and never what the client claims.
"""
verdict = """
Use TLS 1.3, add 1.2 only if customers need it, send HSTS with always, redirect the plain port, hide the version, and set forwarded headers from nginx's own variables. Test every configuration with nginx -t, and keep private keys out of repositories.
"""
recognise = [
    "`ssl_protocols`, `ssl_ciphers` and `ssl_session_tickets` in nginx configuration.",
    "Cloud load balancers listed as \"TLS termination\".",
    "`X-Forwarded-Proto` handling in framework settings, such as \"trust the proxy\".",
    "Mozilla's SSL configuration generator.",
]

[spec]
purpose = """
Teach HTTPS at the front door by running real nginx in Docker with a careful TLS configuration, checking it from a Java client that verifies the chain and the host name, and showing the traps: old protocols, a forgeable forwarded header and a missing certificate.
"""
nongoals = [
    "Certificates from a public authority and OCSP stapling: described, not run.",
    "Load balancing and caching.",
    "TLS between nginx and the application.",
]
problem = """
TLS is usually ended by a web server in front of the application, and copied configurations carry hidden weaknesses.
"""
roles = [["nginx configurations", "`NginxConfig`"], ["The container", "`Nginx`"], ["The checking client", "`TlsClient`"], ["The demo certificates", "`Pki`"], ["Configuration score", "`ConfigScore`"], ["Raw plain-port requests", "`Probe`"], ["Header auditor", "`HeaderAudit`"], ["Entry point", "`HttpsNginxDemo`"]]
requirements = [
    "The careful configuration gives TLS 1.3 with HTTP/2 and five of five headers.",
    "A TLS 1.2 client is refused unless the configuration allows it.",
    "The plain port redirects with 301 and sends no HSTS.",
    "An untrusted root, a wrong name and an impostor certificate are refused.",
    "With mutual TLS a client without a certificate is refused and the identity is set by nginx.",
    "Passing on the client's forwarded protocol is shown to deceive the application.",
    "The configuration is tested with nginx -t and scored.",
    "No containers are left behind.",
]

