[[act]]
title = "Which TLS versions the shop allows"
summary = "With ssl_protocols TLSv1.3 a TLS 1.2-only client is refused and a TLS 1.3 client gets TLSv1.3; with TLSv1.2 TLSv1.3 and three ECDHE-ECDSA ciphers the TLS 1.2 client gets TLSv1.2 and the TLS 1.3 client still gets TLSv1.3."
detail = """
Two configurations. Strict: ssl_protocols TLSv1.3;. Compat: ssl_protocols TLSv1.2 TLSv1.3; with three ciphers for TLS 1.2, ECDHE-ECDSA-AES128-GCM-SHA256, ECDHE-ECDSA-AES256-GCM-SHA384 and ECDHE-ECDSA-CHACHA20-POLY1305.
Each cipher name lists its parts: ECDHE agrees a fresh key, ECDSA signs with the certificate's key, AES128-GCM (or AES256-GCM, or CHACHA20-POLY1305) encrypts, and SHA256 or SHA384 is the hash. A client that offers only TLS 1.2 is refused by the strict server and gets TLSv1.2 from the compat one; a TLS 1.3 client gets TLSv1.3 from both.
Allow TLS 1.2 only while customers still need it, and keep the list of ciphers short.
"""
figure = "versions"
figure_title = "Two servers, two clients, and what one cipher name means"
figure_speech = """
nginx decides which T L S versions it speaks. [[slnc 400]] At the top, in green, two servers. [[slnc 300]] Strict allows only T L S one point three. [[slnc 300]] Compat also allows one point two, with three ciphers. [[slnc 600]]
Let's read one cipher name, part by part. [[slnc 300]] E C D H E: the two sides agree a fresh key for this connection only. [[slnc 300]] E C D S A: the server signs with its certificate's key. [[slnc 300]] A E S one twenty eight G C M: the encryption. [[slnc 300]] S H A two fifty six: the hash. [[slnc 600]]
In red, four connections. [[slnc 300]] A client that offers only one point two: refused by strict, and connected by compat. [[slnc 300]] A client that offers one point three: one point three from both. [[slnc 500]]
So allow one point two only while customers need it, and keep the cipher list short.
"""
speech = """
Here is the output. [[slnc 400]] The two configurations, and the three ciphers of the compat one. [[slnc 400]] Then the four results: refused, one point three, one point two, and one point three.
"""
rows = { protocols = "active ok" }
console = [
    ["THE CONFIGURATIONS:", "ok"],
    ["  strict   ssl_protocols TLSv1.3;", "muted"],
    ["  compat   ssl_protocols TLSv1.2 TLSv1.3;", "muted"],
    ["           ssl_ciphers, three of them:", "muted"],
    ["             ECDHE-ECDSA-AES128-GCM-SHA256", "muted"],
    ["             ECDHE-ECDSA-AES256-GCM-SHA384", "muted"],
    ["             ECDHE-ECDSA-CHACHA20-POLY1305", "muted"],
    ["THE RESULTS (server, the only version the client offers):", "ok"],
    ["  strict   TLS 1.2 client   refused", "muted"],
    ["  strict   TLS 1.3 client   TLSv1.3", "muted"],
    ["  compat   TLS 1.2 client   TLSv1.2", "muted"],
    ["  compat   TLS 1.3 client   TLSv1.3", "muted"],
    ["allow TLS 1.2 only while customers still need it,", "muted"],
    ["and keep the list of ciphers short", "muted"],
]

[[act]]
title = "The plain port, the redirect and HSTS"
summary = "GET http://shop.example.test/orders?id=7 answers 301 to https://shop.example.test/orders?id=7 with no HSTS; the HTTPS answer carries max-age=63072000; includeSubDomains, 63072000 / 86400 = 730 days."
detail = """
A request to the plain port, GET http://shop.example.test/orders?id=7, answers 301 with Location: https://shop.example.test/orders?id=7, the same path and query on HTTPS, and no Strict-Transport-Security, which a browser ignores over plain HTTP.
The HTTPS answer carries Strict-Transport-Security: max-age=63072000; includeSubDomains, and 63072000 / 86400 seconds a day = 730 days, two years. The very first visit is still plain: HSTS protects every visit after it, and preloading protects the first.
"""
figure = "redirect"
figure_title = "The plain port only redirects, and HSTS lasts two years"
figure_speech = """
Some customers still type the plain address. [[slnc 400]] At the top, in green, that request: slash orders, question mark, id equals seven. [[slnc 600]]
In red, nginx's answer on the plain port. [[slnc 300]] Three oh one. [[slnc 300]] The location is the same path and the same query, on H T T P S. [[slnc 300]] No strict transport security here, because a browser ignores it over plain H T T P. [[slnc 600]]
On the right, the H T T P S answer. [[slnc 300]] Strict transport security, max age sixty three million and seventy two thousand seconds. [[slnc 300]] Divided by eighty six thousand four hundred seconds a day, that is seven hundred and thirty days. [[slnc 300]] Two years. [[slnc 600]]
In amber, the first visit is still plain. [[slnc 300]] H S T S protects the visits after it. [[slnc 300]] Preloading the site into the browser protects the first one too.
"""
speech = """
Here is the output. [[slnc 400]] The plain request. [[slnc 300]] The three oh one, with its location, and no H S T S. [[slnc 300]] Then the H T T P S answer, its max age, and the days worked out: seven hundred and thirty.
"""
rows = { redirect = "active ok" }
console = [
    ["THE REQUEST (to the plain port):", "ok"],
    ["  GET http://shop.example.test/orders?id=7", "muted"],
    ["THE RESPONSE:", "ok"],
    ["  301  Location: https://shop.example.test/orders?id=7", "muted"],
    ["  Strict-Transport-Security: none (ignored over HTTP)", "muted"],
    ["THE HTTPS ANSWER:", "ok"],
    ["  Strict-Transport-Security:", "muted"],
    ["    max-age=63072000; includeSubDomains", "muted"],
    ["  63072000 / 86400 seconds a day = 730 days", "muted"],
    ["the very first visit is still plain: HSTS protects every", "muted"],
    ["visit after it, and preloading protects the first", "muted"],
]

[[act]]
title = "Who the client trusts, and who the server trusts"
summary = "The JDK's own roots, the address 127.0.0.1 and an impostor signed by nobody trusted are refused; the demo root and the right name are accepted. With ssl_verify_client on, no certificate is refused, Ana's gets 200 and the app is told client=CN=Ana the customer, even when she forges X-Client-DN: CN=Admin."
detail = """
The client checks the server: (a) with the JDK's own trusted roots: refused, the demo root is not in the JDK's list; (b) with the demo root trusted and the name shop.example.test: accepted; (c) the same, connecting by the address 127.0.0.1: refused, the certificate names shop.example.test;
(d) an impostor with the right name, signed by nobody trusted: refused. Then the server checks the client, with ssl_verify_client on: (e) no certificate: refused; (f) Ana's certificate: 200, and the app is told proto=https client=CN=Ana the customer;
(g) Ana's certificate and a forged X-Client-DN: CN=Admin header: 200, and the app is still told client=CN=Ana the customer, because nginx sets X-Client-DN itself and drops Ana's.
"""
figure = "trust"
figure_title = "The client checks the server, then the server checks the client"
figure_speech = """
Trust goes both ways. [[slnc 400]] On the left, the client checks the server. [[slnc 500]] A: a client with only the J D K's own list of roots. [[slnc 300]] The demo root is not in it: refused. [[slnc 300]] B: the demo root trusted, and the right name: accepted. [[slnc 300]] C: the same, but by the address one two seven dot zero dot zero dot one. [[slnc 300]] The certificate names shop dot example dot test, not that address: refused. [[slnc 300]] D: an impostor with the right name, signed by nobody trusted: refused. [[slnc 600]]
On the right, with S S L verify client on, the server checks the client. [[slnc 300]] E: no certificate: refused. [[slnc 300]] F: Ana's certificate: the app is told client equals Ana the customer. [[slnc 300]] G: Ana also sends a forged header, claiming to be the admin. [[slnc 300]] nginx sets that header itself, so the app still sees Ana.
"""
speech = """
Here is the output. [[slnc 400]] Four attempts in which the client checks the server, and their results: refused, accepted, refused, refused.
[[page]]
Then three clients that the server checks. [[slnc 300]] No certificate: refused. [[slnc 300]] Ana: two hundred, and the app is told her name. [[slnc 300]] And Ana with a forged header: still her own name.
"""
rows = { trust = "active ok" }
console = [
    ["THE ATTEMPTS (the client checks the server):", "ok"],
    ["  a  the JDK's own trusted roots, shop.example.test", "muted"],
    ["  b  the demo root trusted, shop.example.test", "muted"],
    ["  c  the demo root trusted, by the address 127.0.0.1", "muted"],
