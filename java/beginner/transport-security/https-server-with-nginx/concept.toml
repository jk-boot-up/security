[poster]
headline = [["HTTPS SERVER", "text"], ["WITH NGINX", "accent"]]
taglines = [["Let the front door handle TLS, and set it up with care", "gold"]]
before = { code = "copied nginx.conf", note = "old protocols, forgeable headers", tag = "BEFORE" }
after = { code = "TLS 1.3 + nginx -t", note = "tested, scored, headers set by nginx", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "HTTPS Server with nginx"
narration = """Hello, and welcome. [[slnc 400]] This video explains an H T T P S server with nginx, checked from Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] nginx is a web server that sits in front of an application. [[slnc 300]] Ending T L S there means it handles the secure connection, and the application behind it speaks plain H T T P. [[slnc 600]] Think of a receptionist at the front door of an office. [[slnc 300]] Visitors show their pass to the receptionist, who then phones the right person inside. [[slnc 300]] That works while the receptionist writes down what they saw, and not what the visitor says. [[slnc 700]] In this video, the domain is an online store. [[slnc 500]] By the end, you will hear which protocol versions to allow. [[slnc 300]] What H S T S can and cannot do. [[slnc 300]] How client certificates work. [[slnc 300]] And the one header line that can fool the application."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online store puts nginx in front of its application.", "", "Customers connect over HTTPS.", "nginx ends the TLS,", "and a Java client checks it", "the way a browser does."]
narration = """Here is the scenario. [[slnc 400]] An online store puts nginx in front of its application. [[slnc 500]] Customers connect over H T T P S. [[slnc 300]] nginx ends the T L S. [[slnc 300]] And a Java client checks it, the way a browser does, with the certificate chain and the host name. [[slnc 600]] What can go wrong in the configuration?"""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["TLS termination: the front door ends TLS", "HSTS: always use HTTPS for this site", "mTLS: the client shows a certificate too", "X-Forwarded-Proto: what nginx saw", "nginx -t: test the configuration"]
narration = """Before the demos, the words. [[slnc 500]] T L S termination means the front door ends the T L S connection. [[slnc 500]] H S T S tells browsers to always use H T T P S for this site. [[slnc 500]] M T L S, mutual T L S, means the client shows a certificate too. [[slnc 500]] X Forwarded Proto is the header that tells the application what nginx saw. [[slnc 500]] And nginx dash t tests a configuration without starting it."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "09-ladder"
kind = "bullets"
title = "A Careful Configuration"
body = ["TLS 1.3, and 1.2 only if needed", "HSTS with always, on every answer", "Plain port: redirect only", "Session tickets off, version hidden", "Forwarded headers set by nginx itself", "Tested with nginx -t"]
narration = """Let's put it side by side. [[slnc 400]] T L S one point three, and one point two only if customers need it. [[slnc 500]] H S T S with always, so error pages carry it too. [[slnc 500]] The plain port only redirects. [[slnc 500]] Session tickets off, and the version hidden. [[slnc 500]] Forwarded headers set by nginx itself, never copied from the client. [[slnc 500]] And every configuration tested with nginx dash t before it goes live."""

[[scene]]
key = "10-roles"
kind = "bullets"
title = "Who Does What"
body = ["NginxConfig: writes each configuration", "Nginx: runs it in a container", "TlsClient: checks chain and name", "Pki: the demo certificates", "ConfigScore: seven TLS habits"]
narration = """Here is who does what in the code. [[slnc 400]] The nginx config class writes each version of the configuration. [[slnc 500]] The nginx class runs it in a container, and always removes it. [[slnc 500]] The T L S client checks the certificate chain and the host name. [[slnc 500]] The P K I class holds the demo certificates. [[slnc 300]] And the config score reads a configuration as text and marks it against seven habits."""

[[scene]]
key = "11-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["ssl_protocols in nginx tutorials", "SSL configuration generators and SSL Labs", "X-Forwarded-Proto in application logs", "Load balancers that terminate TLS"]
narration = """You have probably met this already. [[slnc 400]] The settings ssl protocols, ssl certificate, and ssl certificate key are in every nginx tutorial. [[slnc 500]] Configuration generators and site testers grade the same choices. [[slnc 500]] X Forwarded Proto appears in application logs and framework settings. [[slnc 500]] And cloud load balancers that terminate T L S do the same job as this nginx."""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["TLS 1.3; add 1.2 only if needed", "HSTS with always, a redirect, a hidden version", "Set forwarded headers yourself", "Test every configuration with nginx -t", "Keep private keys out of repositories"]
narration = """So, how do you use it? [[slnc 400]] Use T L S one point three, and add one point two only if customers need it. [[slnc 500]] Send H S T S with always, redirect the plain port, and hide the version. [[slnc 500]] Set forwarded headers yourself, from nginx's own variables. [[slnc 500]] Test every configuration with nginx dash t. [[slnc 500]] And keep private keys out of repositories."""

[[scene]]
key = "13-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a second host name", "with its own certificate."]
narration = """That's an H T T P S server with nginx. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Let nginx end the T L S, but tell the application what nginx saw, and never what the client claims. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] The demo needs a Java development kit and Docker. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a second host name with its own certificate. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
The front door of an online store: nginx ending TLS on port 443, redirecting port 80, passing requests to an application on a local port, and optionally asking clients for certificates. It covers a network attacker who can downgrade, impersonate or forge headers.
It does not cover the application's own logic, the host's security, or TLS between nginx and the application.
"""
assets = [
    "The confidentiality and integrity of customer traffic.",
    "The server's private key.",
    "The application's belief about who is calling and over what.",
    "Client identities presented through certificates.",
]
actors = [
    "Customers using browsers.",
    "A network attacker who can read and change traffic and send forged requests.",
    "An operator who writes and reloads the configuration.",
]
boundaries = [
    "Internet to nginx: the TLS port and the plain port.",
    "nginx to the application: headers that nginx sets become the application's facts.",
    "Configuration repository to the running server: a copied or untested configuration crosses it.",
]
assumptions = [
    "The application listens only on a local port that outsiders cannot reach.",
    "The private key is readable only by nginx and is not in a repository.",
    "In the demo, the certificates and keys are made for the demo and protect nothing.",
]
out_of_scope = [
    "TLS between nginx and the application.",
    "Certificates from a public authority and OCSP stapling.",
    "Denial-of-service protection and load balancing.",
]
tests = [
    "`ConfigAndScoreTest` checks the seven-point score, protocol parsing, the forwarded-header trap and the variants' directives.",
    "`ReferenceConfigTest` checks that `infra/nginx-careful.conf` is what the code generates.",
    "`PkiTest` checks the demo certificates: chain, names, key usage and the impostor.",
    "`NginxContainerTest` (integration) starts real nginx containers and checks TLS, redirects, trust, mutual TLS, the trap, `nginx -t` and that no containers are left.",
    "`DemoRunsTest` (integration) compares the whole demo with the golden output.",
]
next = """
The transport-security module is complete. The safe-habits module looks at the habits that keep a system safe over time: least privilege, patching and backups.
"""

[[threat]]
id = "T1"
stride = "T"
threat = "An attacker strips or downgrades the protection on the connection"
where = "`ssl_protocols`, the plain port"
control = "TLS 1.3 only (or 1.2 with a short cipher list), a redirect from port 80, and HSTS with always"
residual = "The first visit is plain unless the site is preloaded"

[[threat]]
id = "T2"
stride = "I"
threat = "Traffic is read on the network"
where = "the plain port and the TLS port"
control = "All real traffic goes over TLS, and the plain port only redirects"
residual = "Metadata such as addresses and timing remains visible"

[[threat]]
id = "T3"
stride = "S"
threat = "A client forges a forwarded header so the application believes the request was secure"
where = "`proxy_set_header X-Forwarded-Proto`"
control = "nginx sets the header from `$scheme`, never from the client's header"
residual = "Other headers the application trusts must be set the same way"

[[threat]]
id = "T4"
stride = "T"
threat = "A copied or untested configuration is deployed with weak settings or errors"
where = "`nginx.conf`"
control = "`nginx -t` before deployment and a score of the TLS habits"
residual = "The score covers seven habits, not everything"

[[threat]]
id = "T5"
stride = "S"
threat = "A client claims an identity through a header or an unchecked certificate"
where = "`ssl_verify_client`, `X-Client-DN`"
control = "Client certificates are checked against the demo root, and nginx overwrites the identity header"
residual = "Revocation of client certificates is not checked here"

[[threat]]
id = "T6"
stride = "I"
threat = "The server's private key is stolen from the host or a repository"
where = "`/pki/shop.key`"
control = "Mounted read-only, readable only by nginx in a real deployment, and never committed (the demo key is a demo value)"
residual = "A stolen key allows impersonation until the certificate is replaced and revoked"
