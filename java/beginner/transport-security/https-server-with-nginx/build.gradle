plugins {
    id 'java'
    id 'application'
}

group = 'com.jk.explore.security'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// The demo names the shop shop.example.test, which resolves to this machine only through a hosts file kept in the project.
def hostsFile = "-Djdk.net.hosts.file=${projectDir}/config/hosts"

application {
    mainClass = 'com.jk.explore.security.httpsnginx.HttpsNginxDemo'
    applicationDefaultJvmArgs = [hostsFile]
}

// `./gradlew test` never needs Docker. Tests that start the nginx container are tagged "docker"
// and run with `./gradlew integrationTest`, which needs a running Docker.
test {
    useJUnitPlatform {
        excludeTags 'docker'
    }
    jvmArgs hostsFile
}

tasks.register('integrationTest', Test) {
    description = 'Runs the tests that start an nginx container.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'docker'
    }
    jvmArgs hostsFile
    shouldRunAfter test
}

// No deprecated or to-be-removed API is allowed in any project: a warning fails the build.
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.addAll(['-Xlint:deprecation', '-Xlint:removal', '-Werror'])
}

// The demo's certificates and keys are made on the first build by infra/make-test-pki.sh into build/, and are never committed.
def demoKeys = layout.buildDirectory.dir('generated/demo-keys')
tasks.register('demoKeys', Exec) {
    description = 'Makes the demo certificates and keys, once, into build/.'
    outputs.dir(demoKeys)
    onlyIf { !demoKeys.get().file('pki/shop.key').asFile.exists() }
    environment 'PKI_OUT', demoKeys.get().dir('pki').asFile.absolutePath
    commandLine 'bash', 'infra/make-test-pki.sh'
}
sourceSets.main.resources.srcDir(demoKeys)
tasks.named('processResources') { dependsOn 'demoKeys' }
