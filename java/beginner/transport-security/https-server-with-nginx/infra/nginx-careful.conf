events {}
http {
  server_tokens off;
  access_log off;

  # the application: reachable only inside the container, and it says what it was told
  server {
    listen 127.0.0.1:8081;
    location / {
      return 200 "app saw proto=$http_x_forwarded_proto client=$http_x_client_dn\n";
    }
  }

  # the plain port: only a redirect to https
  server {
    listen 80;
    server_name shop.example.test;
    location = /health {
      return 200 "ok\n";
    }
    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name shop.example.test;

    ssl_certificate /pki/shop.crt;
    ssl_certificate_key /pki/shop.key;
    ssl_protocols TLSv1.3;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
      proxy_pass http://127.0.0.1:8081;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Client-DN $ssl_client_s_dn;
    }
  }
}
