narration = """You have probably met this already. [[slnc 400]] The padlock in the browser, and the warning page when a check fails. [[slnc 500]] The cacerts file, and your system's list of roots. [[slnc 500]] Let's Encrypt, and its short lived certificates. [[slnc 500]] And news stories about outages, because a certificate expired."""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Use a real CA and the platform validator", "Always check the host name", "Keep the root store small", "Short lifetimes; automate renewal", "Keep CA keys offline; plan revocation"]
narration = """So, how do you use it? [[slnc 400]] Use a real certificate authority, and the platform's validator. [[slnc 500]] Always check the host name. [[slnc 500]] Keep the list of trusted roots small. [[slnc 500]] Use short lifetimes, and automate renewal. [[slnc 500]] Keep authority keys offline, and plan how to revoke."""

