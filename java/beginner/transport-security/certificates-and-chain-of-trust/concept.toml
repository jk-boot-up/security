[docs.problem]
scenario = """
A customer's browser connects to shop.example and receives a public key. The browser has no way to know, from the key alone, whether it belongs to the store or to someone sitting on the path.
"""
naive = """
Trust whatever key the server presents, or trust a certificate because it is well formed.
"""
deliver = [
    "X.509 certificates built byte by byte, parsed and checked by the JDK.",
    "A chain of root, intermediate and server certificates validated with the JDK's PKIX validator on a fixed date.",
    "Refusals for expired, unknown-root, changed and overstepping certificates, each with the JDK's reason.",
    "A separate host name check, with wildcard rules.",
    "A revocation list, and a stolen-authority-key forgery that it stops.",
]

[docs.prerequisites]
required = [
    "Java basics",
    "The digital-signatures project, or an idea of what signing and verifying are",
]
not_required = [
    "ASN.1 or DER knowledge: the builder explains the few pieces it uses",
    "OpenSSL, keytool or any certificate authority",
]
install = []

[docs.session]
objectives = [
    "say what a certificate contains and what it proves",
    "follow a chain from a server to a trusted root",
    "list what a validator checks, and what it does not",
    "explain why the host name is a separate check",
    "describe what revocation is for, and its limits",
]
walkthrough = """
Start with the passport. Run the demo one act at a time. After act two, ask what the browser needed to know in advance. After act three, ask why the rogue root's matching name does not help the attacker.
In act five, ask who should be allowed to hold the intermediate's key, and where.
"""
exercises = [
    "Add a subject alternative name for www.shop.example and check both names match.",
    "Issue a certificate valid from a future date and see the reason the validator gives.",
    "Add a second intermediate and a path length of one, and find where the validator stops.",
    "Make the revocation list a signed document, and have the validator check its signature.",
]

[docs.explained]
sentence = """
A certificate is an issuer's signature over a name and a public key, a chain of them leads to a root the client trusts without proof, and a client must also check dates, permissions, revocation and the host name.
"""
verdict = """
Rely on a real certificate authority and the platform's validator. Check the host name every time. Keep the trusted root list small, issue short-lived certificates, keep authority keys offline or in hardware, and have a way to revoke.
"""
recognise = [
    "The browser's certificate viewer, showing the chain.",
    "`keytool -list` and the `cacerts` file.",
    "ACME clients renewing certificates automatically.",
    "Certificate transparency logs that record every certificate issued.",
]

[spec]
purpose = """
Teach what a certificate and a chain of trust are by building X.509 certificates, validating a chain with the JDK, and showing each way validation can fail.
"""
nongoals = [
    "Running a real certificate authority.",
    "Certificate formats such as PEM and PKCS12: the next project and the keystore project.",
    "OCSP and CRL protocols.",
]
problem = """
Learners see the padlock but not what stands behind it, so certificate errors and outages are mysteries.
"""
roles = [["DER encoding", "`Der`"], ["Certificate issuing", "`CertBuilder`"], ["The store's certificates", "`Pki`"], ["Chain validation", "`ChainValidator`"], ["Host names", "`HostName`"], ["Revocation", "`RevocationList`"], ["Entry point", "`CertsDemo`"], ["The chain check by hand", "`ChainSteps`"]]
requirements = [
    "The DER encodings match published values and the JDK parses every certificate made.",
    "A good chain is accepted, and an expired, unknown-root, changed or overstepping chain is refused with the JDK's reason.",
    "The host name check handles exact names and one-label wildcards.",
    "A revoked serial is refused, and a stolen authority key is shown to forge accepted certificates until revoked.",
    "The demo prints the same output on every run although its keys are random.",
]

