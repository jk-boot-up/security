# concept.toml: everything about this project that is not Java code.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "certificates-and-chain-of-trust"
module = "transport-security"
title = "Certificates and the Chain of Trust"
short_title = "Certificates and Trust"
package = "certs"
main_class = "CertsDemo"
tagline = "Who vouches for a key, and who vouches for them"
bold = "A certificate ties a name to a public key with an issuer's signature, and a chain of them leads back to a root that the client already trusts, but a chain proves who signed, not that the name is the one you meant, and one stolen authority key breaks everything below it."
domain = "an online store"
domain_note = ""
youtube_description = """Certificates and the chain of trust in Java: how a browser knows that a public key really belongs to shop.example. Explained with an online store, like a passport signed by an office whose stamp is signed by a ministry you already trust. We build a root, an intermediate and a server certificate by writing their encoding byte by byte, validate the chain with the JDK, then watch it refuse an expired certificate, a certificate from an authority nobody trusts, a changed certificate, and a server certificate that tries to issue others. We check the host name as the separate step it is, and finish with the bill: revocation, and what a stolen authority key allows."""
thumb_lines = ["CERTIFICATES AND", "THE CHAIN OF TRUST"]
thumb_code = "CertPathValidator PKIX"
youtube_title = "Certificates and the Chain of Trust in Java (X.509, PKIX, Revocation)"
youtube_tags = ["certificates", "x509", "chain of trust", "pki", "certificate authority", "revocation", "pkix", "java", "cybersecurity for beginners"]

[readme]
intro = """
A public key is useful only if you know whose it is. A **certificate** answers that: it holds a name, a public key, a validity period and rules about what the key may do, and it carries the **signature** of an **issuer**, so
anyone with the issuer's public key can check it. The issuer's own key comes in a certificate signed by a higher issuer, and so on up to a **root** that the client was shipped with and trusts without proof. The list from the server's certificate
up to the root is the **chain of trust**.

The demo builds that chain for an online store, writing the X.509 encoding byte by byte, since the JDK reads and validates certificates but has no public API to make them. It validates the chain with the JDK's own PKIX validator
and then breaks it in five ways.
"""
analogy = """
Think of a passport. The passport carries your photo and your name, and a stamp from the passport office. You do not know the officer, but you know the office's stamp is certified by a ministry, and you already trust the ministry. A forged
passport can look identical in every way except that its stamp was not made by an office the ministry certified. And a valid passport is still no use if it belongs to someone else, so you also compare the name.
"""
scenario = """
An online store's customers connect to shop.example. The store's server presents a certificate issued by an intermediate authority, which was issued by a root authority that the customer's browser trusts. The demo builds the chain,
validates it on a fixed date, and tries an expired certificate, a certificate from an unknown authority, a changed certificate, a server key that signs other certificates, a revoked certificate and a stolen authority key.
"""
costs = [
    "**Trust is concentrated.** A root may vouch for any name, so the root store is a security decision and a stolen authority key breaks everything below it.",
    "**Revocation is hard.** A list only works if the client has the latest one. Real systems use CRLs, OCSP, short lifetimes, or all three.",
    "**Certificates expire.** They must be renewed before the end date, and an expired certificate on a production server is an outage.",
    "**The demo builds certificates by hand.** The encoding is a minimal subset, for teaching: use a certificate authority, keytool or a library for real work, as the next project does.",
]
too_much = """
Never build your own certificates for production by hand. The point of this project is to see what a certificate is made of and what a validator checks, so the failures in real systems become readable.
"""
met_before = [
    "The padlock in the browser, and the \"your connection is not private\" warning.",
    "`cacerts`, the Java file listing the roots the JDK trusts, and the roots in your operating system.",
    "Let's Encrypt and other certificate authorities, and their 90-day certificates.",
    "Certificate-expiry outages in the news.",
]
where = """
This project follows [tls-handshake](../tls-handshake) and is in [transport-security](..). The next steps are a version with Bouncy Castle and an OpenSSL certificate authority, and then a working HTTPS server.
"""
twin = """
The keys are random, so the demo prints only facts that do not depend on them: who signed what, whether a chain is accepted and the JDK's reason when it is not. All checks run on a fixed date, 2026-01-01, never on the real clock.
The encoding is checked against published object identifier encodings, and the JDK itself parses and validates every certificate the builder makes.
"""
test_note = "The keys are random, so the demo prints only facts that do not depend on them, and every check runs on a fixed date rather than the real clock. The DER encodings are checked against published values, and the JDK parses and validates every certificate the builder makes."

[[act]]
title = "A chain of three certificates"
summary = "The shop asks for CN=shop.example with its own 256-bit EC key, valid 2025-06-01 to 2026-06-01; signing adds the issuer CN=Example Issuing CA and a SHA256withECDSA signature that anyone checks with the issuer's public key; the root is self-signed, the intermediate is a CA, the server's certificate is not."
detail = """
Before signing, the shop asks for a name, CN=shop.example for the site shop.example, its own public key, an EC key of 256 bits, and the dates 2025-06-01 to 2026-06-01. After signing, the certificate with serial 3 holds the same three, plus the issuer, CN=Example Issuing CA, and the issuer's SHA256withECDSA signature over all of it, made with the issuer's private key. Anyone can check that signature with the issuer's public key.
The chain from the root down: Example Root CA signs itself; Example Issuing CA is signed by the root and is a CA, so it may issue certificates; shop.example is signed by the intermediate and is not a CA.
"""
figure = "certificate_card"
figure_title = "What a certificate is: a request, signed"
figure_speech = """
Here is what a certificate is, on the shop's own. [[slnc 400]] Before signing, the shop asks for three things. [[slnc 300]] Its name, shop dot example. [[slnc 300]] Its own public key, an elliptic curve key of two hundred fifty six bits. [[slnc 300]] And its dates. [[slnc 500]]
The issuer signs. [[slnc 400]] After signing, the certificate holds the same three things, plus the issuer's name, and the issuer's signature over all of it. [[slnc 500]]
The signature is made with the issuer's private key, which never leaves the issuer. [[slnc 300]] Anyone can check it with the issuer's public key. [[slnc 300]] And if any byte changes, the check fails.
"""
speech = """
The program's output. [[slnc 400]] Before signing: the name, the public key, and the dates. [[slnc 500]]
After signing: the issuer and the signature are added, and the signature checks with the issuer's public key. [[slnc 500]]
Then the chain. [[slnc 300]] The root signs itself. [[slnc 300]] The intermediate is a C A, signed by the root. [[slnc 300]] The server's certificate is not a C A.
"""
rows = { chain = "active ok" }
console = [
    ["BEFORE SIGNING (what the shop asks for):", "ok"],
    ["  name        CN=shop.example, for the site shop.example", "muted"],
    ["  public key  EC, 256 bits, the shop's own", "muted"],
    ["  valid       2025-06-01 to 2026-06-01", "muted"],
    ["AFTER SIGNING (the certificate, serial 3):", "bad"],
    ["  the same three, and issuer  CN=Example Issuing CA", "muted"],
    ["  signature   SHA256withECDSA, by the issuer's private key", "muted"],
    ["  anyone checks it with the issuer's public key: true", "muted"],
    ["THE CHAIN, FROM THE ROOT DOWN:", "amber"],
    ["  root          Example Root CA     self-signed: true", "muted"],
    ["  intermediate  Example Issuing CA  CA: true, by the root", "muted"],
    ["  server        shop.example        CA: false, by the intermediate", "muted"],
]

[[act]]
title = "The browser's check, step by step"
summary = "The server sends shop.example and Example Issuing CA; the browser trusts Example Root CA and checks, step by step, issuer names, signatures, dates and the CA flag up the chain, then the root and the name: by hand accepted true, the JDK accepted true."
detail = """
Before the check, the browser has what the server sent, its own certificate shop.example and the intermediate Example Issuing CA, the root it already trusts, Example Root CA, and the site it is visiting, shop.example, on 2026-01-01.
Step 1 checks shop.example against Example Issuing CA: it names it as the issuer, its signature checks with that public key, and 2026-01-01 is inside 2025-06-01 to 2026-06-01. Step 2 checks Example Issuing CA against Example Root CA the same way, and also that it may issue certificates. Step 3: the root is in the trust store, and shop.example is in the certificate.
After the check, the class ChainSteps, which makes these steps by hand, accepts the chain, and so does the JDK's PKIX validator. A wildcard *.example matches shop.example but not a.b.example: it stands for exactly one label.
"""
figure = "check_steps"
figure_title = "The browser's check, step by step"
figure_speech = """
Here is the browser's check, one step at a time. [[slnc 400]] Step one: the shop's certificate, checked against the intermediate. [[slnc 300]] Does it name the intermediate as its issuer? Yes. [[slnc 300]] Does its signature check with the intermediate's public key? Yes. [[slnc 300]] Is today inside its dates? Yes. [[slnc 500]]
Step two: the intermediate, checked against the root, the same way. [[slnc 300]] And it must be a C A, allowed to issue certificates. [[slnc 500]]
Step three: the root must already be in the browser's trust store. [[slnc 300]] And the site's name must be in the shop's certificate. [[slnc 500]]
After the check: accepted, by hand, and by the J D K.
"""
speech = """
The program's output. [[slnc 400]] Before the check: what the server sent, what the browser trusts, and the site it visits. [[slnc 500]]
Step one: the shop's certificate against the intermediate. [[slnc 300]] Three checks, all true.
[[page]]
Step two: the intermediate against the root, with the C A flag too. [[slnc 400]] Step three: the root and the name. [[slnc 400]]
After the check: accepted, by hand and by the J D K. [[slnc 400]] And a wildcard stands for exactly one label.
"""
rows = { check = "active ok" }
console = [
    ["BEFORE THE CHECK (what the browser has):", "ok"],
    ["  sent by the server  shop.example, Example Issuing CA", "muted"],
    ["  already trusted     Example Root CA", "muted"],
    ["  visiting            shop.example, on 2026-01-01", "muted"],
    ["STEP 1. shop.example AGAINST Example Issuing CA:", "amber"],
    ["  names it as the issuer: true", "muted"],
    ["  its signature checks with that public key: true", "muted"],
    ["  2026-01-01 is in 2025-06-01 to 2026-06-01: true", "muted"],
    ["---", ""],
    ["STEP 2. Example Issuing CA AGAINST Example Root CA:", "amber"],
    ["  names it as the issuer: true", "muted"],
    ["  its signature checks with that public key: true", "muted"],
    ["  2026-01-01 is in 2025-01-01 to 2030-01-01: true", "muted"],
    ["  it may issue certificates (a CA): true", "muted"],
    ["STEP 3. THE ROOT AND THE NAME:", "amber"],
    ["  Example Root CA is in the trust store: true", "muted"],
    ["  shop.example is in the certificate: true", "muted"],
    ["AFTER THE CHECK:", "bad"],
    ["  by hand: accepted true, the JDK: accepted true", "muted"],
    ["  *.example matches shop.example true, a.b.example false", "muted"],
]

[[act]]
title = "Three reasons to refuse"
summary = "Three chains: one valid 2024-01-01 to 2024-12-31 fails at the dates (EXPIRED); one from a rogue root also named Example Root CA fails at the signature (INVALID_SIGNATURE) although the issuer's name matched; the good chain is accepted but does not match evil.example."
detail = """
Before the check, the browser is shown three chains: a certificate for shop.example valid only from 2024-01-01 to 2024-12-31; a certificate for shop.example from a rogue root that is also named Example Root CA; and the good chain, shown to a visitor who meant evil.example.
After the check: the first fails at the dates, and the JDK says EXPIRED. The second fails at the signature, and the JDK says INVALID_SIGNATURE: the issuer's name matched, but the key did not. The third chain is accepted, but the name evil.example does not match. Names prove nothing, only keys do, and the chain and the name are two separate checks.
"""
figure = "refusals"
figure_title = "Three chains, and the step each one fails"
figure_speech = """
Three chains, and where each one fails. [[slnc 400]] The first ended on the last day of twenty twenty four. [[slnc 300]] It fails at the dates. [[slnc 300]] The J D K says expired. [[slnc 500]]
The second comes from a rogue root with exactly the same name as the real one. [[slnc 300]] The name matches, but the signature does not check with the real root's key. [[slnc 300]] Invalid signature. [[slnc 500]]
The third is the good chain, and it is accepted. [[slnc 300]] But the visitor meant evil dot example, and the name does not match. [[slnc 500]]
Names prove nothing. [[slnc 300]] Only keys do.
"""
speech = """
The program's output. [[slnc 400]] Before the check: the three chains. [[slnc 500]]
After the check: the dates fail, then the signature fails, though the issuer's name matched. [[slnc 400]] And the good chain, with the wrong name. [[slnc 500]]
The chain and the name are two separate checks.
"""
rows = { refuse = "active amber" }
console = [
    ["BEFORE THE CHECK (three chains the browser is shown):", "ok"],
    ["  1. shop.example, valid 2024-01-01 to 2024-12-31", "muted"],
    ["  2. shop.example, from a root also named Example Root CA", "muted"],
    ["  3. the good chain, but the visitor meant evil.example", "muted"],
    ["AFTER THE CHECK (the failed step, and the JDK's reason):", "bad"],
    ["  1. by hand: the dates       JDK: EXPIRED", "muted"],
    ["  2. by hand: the signature   JDK: INVALID_SIGNATURE", "muted"],
    ["     (the issuer's name matched: true, the key did not)", "muted"],
    ["  3. chain accepted true, the name evil.example matches false", "muted"],
    ["names prove nothing, only keys do; chain and name are two checks", "amber"],
]

[[act]]
title = "Changed certificates, and certificates that overstep"
summary = "Changing CN=shop.example to CN=shop.examplE still parses but fails at the signature (INVALID_SIGNATURE); the shop's server certificate is not a CA, so a certificate it signs for other.example fails at the CA flag (INVALID_KEY_USAGE); the intermediate allows 0 more CAs below it."
detail = """
Before the change, the signed name is CN=shop.example. After changing one letter, CN=shop.examplE, the certificate still parses, but it fails at the signature, and the JDK says INVALID_SIGNATURE: the signature covers every byte.
Before the next check, the shop's server key signs a certificate for other.example, but the shop's certificate is not a CA. After the check, it fails at the CA flag, and the JDK says INVALID_KEY_USAGE. The intermediate itself allows 0 more CAs below it: its path length.
"""
figure = "tamper_overstep"
figure_title = "One changed letter, and a key that oversteps"
figure_speech = """
On the left, one changed letter. [[slnc 300]] The last e of the name becomes a capital E. [[slnc 300]] The certificate still parses. [[slnc 300]] But the signature covers every byte, so it fails at the signature. [[slnc 500]]
On the right, the shop's own key signs a certificate for another site. [[slnc 300]] But the shop's certificate is not a C A. [[slnc 300]] So the check fails at the C A flag, and the J D K says invalid key usage. [[slnc 500]]
Only a C A may sign certificates.
"""
speech = """
The program's output. [[slnc 400]] Before the change, and after: one letter. [[slnc 300]] It fails at the signature. [[slnc 500]]
Then a server key that signs another certificate. [[slnc 300]] It fails at the C A flag. [[slnc 500]]
And the intermediate allows no more C As below it.
"""
rows = { overstep = "active ok" }
console = [
    ["BEFORE THE CHANGE (the signed name):  CN=shop.example", "ok"],
    ["AFTER THE CHANGE (one letter):        CN=shop.examplE", "bad"],
    ["  it still parses: true", "muted"],
    ["  by hand: the signature   JDK: INVALID_SIGNATURE", "muted"],
    ["BEFORE THE CHECK (the shop's server key signs other.example):", "ok"],
    ["  the shop's certificate is a CA: false", "muted"],
    ["AFTER THE CHECK:", "bad"],
    ["  by hand: the CA flag     JDK: INVALID_KEY_USAGE", "muted"],
    ["the intermediate allows 0 more CAs below it (path length)", "amber"],
]

[[act]]
title = "Revocation, and the bill"
summary = "A thief with the intermediate's private key issues shop.example, serial 77, and the forged chain is accepted; with serial 3 on the list the shop's chain is refused (REVOKED); with serial 2, the intermediate, both the shop's and the forged chain are refused."
detail = """
Before revocation, a thief has the intermediate's private key and issues their own certificate for shop.example, serial 77. The forged chain is accepted: a stolen CA key breaks everything below it.
After revocation: with serial 3, the shop's, on the client's list, the shop's chain is refused, REVOKED. With serial 2, the intermediate's, on the list, the shop's chain and the forged chain are both refused.
The bill: a list works only if the client has the latest one, so real clients use CRLs, OCSP, short lifetimes, or all three; a trusted root may vouch for any name, so keep the store small; and keep CA keys offline or in hardware.
"""
figure = "revocation"
figure_title = "A stolen CA key, and revoking it"
figure_speech = """
Before revocation. [[slnc 300]] A thief steals the intermediate's private key. [[slnc 300]] With it, the thief issues a certificate for the shop's name. [[slnc 300]] Every check passes, so the forged chain is accepted. [[slnc 500]]
After revocation. [[slnc 300]] With the shop's serial on the list, the shop's own chain is refused. [[slnc 300]] With the intermediate's serial on the list, both the shop's chain and the forged chain are refused. [[slnc 500]]
Everything below a revoked C A falls. [[slnc 300]] But only for clients that have the latest list.
"""
speech = """
The program's output. [[slnc 400]] Before revocation: the forged chain is accepted. [[slnc 500]]
After revocation: the shop's serial refuses the shop's chain. [[slnc 300]] The intermediate's serial refuses both. [[slnc 500]]
And the bill. [[slnc 300]] Clients need the latest list. [[slnc 300]] Keep the trust store small. [[slnc 300]] And keep C A keys offline, or in hardware.
"""
rows = { revoke = "active wrong" }
console = [
    ["BEFORE REVOCATION (a thief has the intermediate's private key):", "ok"],
    ["  the thief issues shop.example, serial 77", "muted"],
    ["  the forged chain accepted: true  <- EVERYTHING BELOW FALLS", "bad"],
    ["AFTER REVOCATION (serials on the client's list):", "bad"],
    ["  serial 3 (the shop's)", "muted"],
    ["     the shop's chain accepted false, REVOKED", "muted"],
    ["  serial 2 (the intermediate's)", "muted"],
    ["     the shop's chain accepted false, the forged false", "muted"],
    ["THE BILL:", "amber"],
    ["  a list works only if the client has the latest one:", "muted"],
    ["  real clients use CRLs, OCSP, short lifetimes, or all three", "muted"],
    ["  a trusted root may vouch for any name: keep the store small", "muted"],
    ["  and keep CA keys offline or in hardware", "muted"],
]

