narration = """That's certificates and the chain of trust. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] A certificate is an issuer's signature over a name and a key, and a client must still check the dates, the permissions, the revocation, and the host name. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine, with nothing installed except a Java development kit. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a second intermediate, and find where the validator stops. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
How a client decides that a public key belongs to shop.example: the chain of certificates the server presents, the client's list of trusted roots, the authorities' private keys and the revocation information. It covers a forger, a thief of authority keys and
a careless root store. It does not cover the TLS handshake itself, or the web application.
"""
assets = [
    "The issuing authority's private key.",
    "The client's list of trusted roots.",
    "The server's private key.",
    "The customer's belief that they are talking to the shop.",
]
actors = [
    "The customer's browser, which validates chains.",
    "The certificate authorities.",
    "An attacker on the path who can present any chain.",
    "An attacker who can steal an authority's key, or add a root to a store.",
]
boundaries = [
    "Server to client: the chain crosses the internet and none of it is trusted until validated.",
    "Authority to the world: the authority's private key is the line that keeps every issued certificate meaningful.",
    "Root store to everything else: the store is the client's trust decision.",
]
assumptions = [
    "The client has the right root certificates, put there by the operating system or platform.",
    "The client's clock is correct.",
    "In the demo, keys are generated at run time and the date is fixed at 2026-01-01.",
]
out_of_scope = [
    "The TLS handshake: the tls-handshake project.",
    "Running a real certificate authority.",
    "Certificate transparency monitoring.",
]
tests = [
    "`DerTest` checks the encodings against published object identifier encodings and length rules.",
    "`ChainTest` checks parsing, a good chain, expiry, not-yet-valid, an unknown root with a matching name, a missing intermediate, a changed certificate, overstepping, path length, revocation and a stolen authority key.",
    "`HostNameTest` checks exact names, case and one-label wildcards.",
    "`ChainStepsTest` checks that the chain check by hand reaches the JDK's verdict, and names the failed step, for every chain in the demo.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next project, https-server, brings the certificate, the handshake and the web together in a working server.
"""

[[threat]]
id = "T1"
stride = "S"
threat = "An attacker presents a certificate for shop.example from an authority the client does not trust"
where = "`ChainValidator`"
control = "Validate the chain to a trusted root; a rogue root with the same name still fails the signature check"
residual = "Depends on the root store being right"

[[threat]]
id = "T2"
stride = "S"
threat = "An authority's private key is stolen and used to issue certificates for any name below it"
where = "`CertBuilder.issue`, the issuing CA"
control = "Keep authority keys offline or in hardware, use short-lived intermediates, and revoke at once if stolen"
residual = "Until revocation reaches clients, forged certificates are accepted"

[[threat]]
id = "T3"
stride = "T"
threat = "A certificate is changed after it was issued"
where = "`Tamper`, `ChainValidator`"
control = "The issuer's signature covers every field, so any change fails validation"
residual = "None for the signed fields"

[[threat]]
id = "T4"
stride = "E"
threat = "A server certificate, or too deep an intermediate, is used to issue further certificates"
where = "`ChainValidator`"
control = "Basic constraints and key usage are enforced, with a path length limit"
residual = "A badly configured authority can still issue a CA certificate it should not"

[[threat]]
id = "T5"
stride = "S"
threat = "A valid chain for a different site is accepted for shop.example"
where = "`HostName`"
control = "Check the host name against the certificate's names on every connection"
residual = "Clients that skip the name check are open to this"

[[threat]]
id = "T6"
stride = "T"
threat = "A malicious or careless root is added to the client's root store"
where = "the root store"
control = "Keep the store small, controlled and audited"
residual = "Every root in the store can vouch for any name"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] Six classes matter here. [[slnc 300]] Here is what each one does."""

[[class]]
name = "CertsDemo"
what = "runs the five acts"
[[class.part]]
title = "the five acts"
code = """
Pki pki = new Pki();
act1Chain(out, pki);
act2GoodChain(out, pki);
act3Refusals(out, pki);
act4Tampering(out, pki);
act5Revocation(out, pki);
"""
speech = """The demo builds a fresh set of certificates, and runs the five acts. [[slnc 300]] The keys are random, so it prints only facts that do not depend on them."""

[[class]]
name = "CertBuilder"
what = "issues a certificate"
[[class.part]]
title = "the signed part, then the signature"
code = """
byte[] tbs = Der.sequence(
        Der.explicit(0, Der.integer(2)),
        Der.integer(request.serial()),
        algorithm,
        issuerName,
...
        subjectName,
        subjectKeys.getPublic().getEncoded(),
...
byte[] certificate = Der.sequence(tbs, algorithm,
        Der.bitString(0, sign(signer, tbs)));      // the issuer's signature
"""
speech = """Cert builder writes the part to be signed: version, serial, issuer, dates, subject, public key and extensions. [[slnc 300]] Then it appends the issuer's signature over exactly those bytes."""

[[class]]
name = "ChainSteps"
what = "the chain check, by hand"
[[class.part]]
title = "each certificate against the next"
code = """
X509Certificate next = i + 1 < chain.size()
        ? chain.get(i + 1) : root;                  // who should have signed it
steps.add(new Step(certificate, next,
        certificate.getIssuerX500Principal()
                .equals(next.getSubjectX500Principal()),
        signedBy(certificate, next),
        !when.isBefore(certificate.getNotBefore().toInstant())
                && !when.isAfter(certificate.getNotAfter().toInstant()),
        i == 0 || certificate.getBasicConstraints() >= 0,   // above the server: a CA
        !revoked.contains(certificate.getSerialNumber())));
"""
speech = """Chain steps checks each certificate against the next one up. [[slnc 300]] The issuer's name, the signature, the dates, the C A flag, and the revocation list. [[slnc 300]] A test proves it reaches the J D K's verdict."""

[[class]]
name = "ChainValidator"
what = "the JDK's PKIX check"
[[class.part]]
title = "trusted roots, a date, a revocation list"
code = """
CertPath path = CertificateFactory.getInstance("X.509").generateCertPath(chain);
...
parameters.setDate(Date.from(when));
parameters.addCertPathChecker(new RevocationList(revokedSerials));
CertPathValidator.getInstance("PKIX").validate(path, parameters);
...
return new Result(false, String.valueOf(e.getReason()));
"""
speech = """Chain validator hands the chain to Java's P K I X validator, with the trusted roots, a fixed date, and the revocation list. [[slnc 300]] When it refuses, the reason is printed."""

[[class]]
name = "HostName"
what = "the separate name check"
[[class.part]]
title = "a wildcard is one label"
code = """
names = certificate.getSubjectAlternativeNames();      // the DNS names in it
...
if (!pattern.startsWith("*.")) {
    return pattern.equals(host);
}
int dot = host.indexOf('.');
return dot > 0 && host.substring(dot + 1).equals(pattern.substring(2));   // one label
"""
speech = """Host name is the second, separate check: is the visited name in the certificate? [[slnc 300]] A star stands for exactly one label."""

[[class]]
name = "Tamper"
what = "changes one letter"
[[class.part]]
title = "change one byte inside the signed part"
code = """
int at = indexOf(bytes, needle);
...
bytes[at + needle.length - 1] -= 32;      // e becomes E
return CertBuilder.parse(bytes);
"""
speech = """Tamper finds the name inside the certificate's bytes, and makes its last letter a capital. [[slnc 300]] The result still parses, but the signature no longer matches."""

