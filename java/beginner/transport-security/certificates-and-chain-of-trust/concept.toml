[[scene]]
key = "01-poster"
kind = "poster"
title = "Certificates and the Chain of Trust"
narration = """Hello, and welcome. [[slnc 400]] This video explains certificates and the chain of trust, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A certificate ties a name to a public key, with the signature of an issuer. [[slnc 300]] A chain of them leads back to a root that the client already trusts. [[slnc 600]] Think of a passport. [[slnc 300]] It carries a stamp from an office. [[slnc 300]] The office's stamp is certified by a ministry that you already trust. [[slnc 300]] A forged passport can look identical, except that its stamp was not certified. [[slnc 700]] In this video, the domain is an online store. [[slnc 500]] By the end, you will hear how a chain is built. [[slnc 300]] How it is checked. [[slnc 300]] Five ways it fails. [[slnc 300]] And what a stolen authority key allows."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["A customer's browser connects to the shop.", "", "It receives a public key.", "", "How does it know the key belongs", "to the store and not to someone", "on the path?"]
narration = """Here is the scenario. [[slnc 400]] A customer's browser connects to the shop. [[slnc 500]] It receives a public key. [[slnc 600]] How does it know the key belongs to the store, and not to someone on the path?"""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["Certificate: a name, a key, and a signature", "Issuer: who signed it", "Root: a certificate trusted without proof", "Chain: server, intermediate, root", "Revocation: withdrawing a certificate early"]
narration = """Before the demos, the words. [[slnc 500]] A certificate holds a name, a key, and a signature. [[slnc 500]] The issuer is who signed it. [[slnc 500]] A root is a certificate trusted without proof. [[slnc 500]] A chain runs from the server, through intermediates, to a root. [[slnc 500]] And revocation withdraws a certificate before it expires."""

[[scene]]
key = "03-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "04-chain"
kind = "figure"
title = "Trust flows down a chain"
body = "chain_core"
narration = """Here is the whole idea, on the demo's real certificates. [[slnc 400]] The browser comes with a trust store, and in it, the root. [[slnc 500]] The root signs the intermediate. [[slnc 300]] The intermediate signs the shop's certificate. [[slnc 500]] The browser checks the other way, upwards. [[slnc 300]] The shop's certificate, then the intermediate, until it reaches a key it already trusts. [[slnc 500]] Nothing in a certificate is secret. [[slnc 300]] It is trusted only because a trusted key signed its way down."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "09-ladder"
kind = "bullets"
title = "What a Validator Checks"
body = ["Each signature, up to a trusted root", "Dates: not before, not after", "May this certificate issue others?", "Is any certificate revoked?", "Separately: does the name match?"]
narration = """Let's put the checks side by side. [[slnc 400]] Each signature, up to a trusted root. [[slnc 500]] The dates. [[slnc 500]] Whether each certificate is allowed to issue others. [[slnc 500]] Whether any of them is revoked. [[slnc 600]] And separately, whether the name matches the site you meant."""

[[scene]]
key = "11-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["The padlock and the warning page", "cacerts and the system root store", "Let's Encrypt and short certificates", "Expiry outages in the news"]
narration = """You have probably met this already. [[slnc 400]] The padlock in the browser, and the warning page when a check fails. [[slnc 500]] The cacerts file, and your system's list of roots. [[slnc 500]] Let's Encrypt, and its short lived certificates. [[slnc 500]] And news stories about outages, because a certificate expired."""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Use a real CA and the platform validator", "Always check the host name", "Keep the root store small", "Short lifetimes; automate renewal", "Keep CA keys offline; plan revocation"]
narration = """So, how do you use it? [[slnc 400]] Use a real certificate authority, and the platform's validator. [[slnc 500]] Always check the host name. [[slnc 500]] Keep the list of trusted roots small. [[slnc 500]] Use short lifetimes, and automate renewal. [[slnc 500]] Keep authority keys offline, and plan how to revoke."""

