# concept.toml: everything about this project that is not Java code.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "certificates-and-chain-of-trust"
module = "transport-security"
title = "Certificates and the Chain of Trust"
short_title = "Certificates and Trust"
package = "certs"
main_class = "CertsDemo"
tagline = "Who vouches for a key, and who vouches for them"
bold = "A certificate ties a name to a public key with an issuer's signature, and a chain of them leads back to a root that the client already trusts, but a chain proves who signed, not that the name is the one you meant, and one stolen authority key breaks everything below it."
domain = "an online store"
domain_note = ""
youtube_description = """Certificates and the chain of trust in Java: how a browser knows that a public key really belongs to shop.example. Explained with an online store, like a passport signed by an office whose stamp is signed by a ministry you already trust. We build a root, an intermediate and a server certificate by writing their encoding byte by byte, validate the chain with the JDK, then watch it refuse an expired certificate, a certificate from an authority nobody trusts, a changed certificate, and a server certificate that tries to issue others. We check the host name as the separate step it is, and finish with the bill: revocation, and what a stolen authority key allows."""
thumb_lines = ["CERTIFICATES AND", "THE CHAIN OF TRUST"]
thumb_code = "CertPathValidator PKIX"
youtube_title = "Certificates and the Chain of Trust in Java (X.509, PKIX, Revocation)"
youtube_tags = ["certificates", "x509", "chain of trust", "pki", "certificate authority", "revocation", "pkix", "java", "cybersecurity for beginners"]

[readme]
intro = """
A public key is useful only if you know whose it is. A **certificate** answers that: it holds a name, a public key, a validity period and rules about what the key may do, and it carries the **signature** of an **issuer**, so
anyone with the issuer's public key can check it. The issuer's own key comes in a certificate signed by a higher issuer, and so on up to a **root** that the client was shipped with and trusts without proof. The list from the server's certificate
up to the root is the **chain of trust**.

The demo builds that chain for an online store, writing the X.509 encoding byte by byte, since the JDK reads and validates certificates but has no public API to make them. It validates the chain with the JDK's own PKIX validator
and then breaks it in five ways.
"""
analogy = """
Think of a passport. The passport carries your photo and your name, and a stamp from the passport office. You do not know the officer, but you know the office's stamp is certified by a ministry, and you already trust the ministry. A forged
passport can look identical in every way except that its stamp was not made by an office the ministry certified. And a valid passport is still no use if it belongs to someone else, so you also compare the name.
"""
scenario = """
An online store's customers connect to shop.example. The store's server presents a certificate issued by an intermediate authority, which was issued by a root authority that the customer's browser trusts. The demo builds the chain,
validates it on a fixed date, and tries an expired certificate, a certificate from an unknown authority, a changed certificate, a server key that signs other certificates, a revoked certificate and a stolen authority key.
"""
costs = [
    "**Trust is concentrated.** A root may vouch for any name, so the root store is a security decision and a stolen authority key breaks everything below it.",
    "**Revocation is hard.** A list only works if the client has the latest one. Real systems use CRLs, OCSP, short lifetimes, or all three.",
    "**Certificates expire.** They must be renewed before the end date, and an expired certificate on a production server is an outage.",
    "**The demo builds certificates by hand.** The encoding is a minimal subset, for teaching: use a certificate authority, keytool or a library for real work, as the next project does.",
]
too_much = """
Never build your own certificates for production by hand. The point of this project is to see what a certificate is made of and what a validator checks, so the failures in real systems become readable.
"""
met_before = [
    "The padlock in the browser, and the \"your connection is not private\" warning.",
    "`cacerts`, the Java file listing the roots the JDK trusts, and the roots in your operating system.",
    "Let's Encrypt and other certificate authorities, and their 90-day certificates.",
    "Certificate-expiry outages in the news.",
]
where = """
This project follows [tls-handshake](../tls-handshake) and is in [transport-security](..). The next steps are a version with Bouncy Castle and an OpenSSL certificate authority, and then a working HTTPS server.
"""
twin = """
The keys are random, so the demo prints only facts that do not depend on them: who signed what, whether a chain is accepted and the JDK's reason when it is not. All checks run on a fixed date, 2026-01-01, never on the real clock.
The encoding is checked against published object identifier encodings, and the JDK itself parses and validates every certificate the builder makes.
"""
test_note = "The keys are random, so the demo prints only facts that do not depend on them, and every check runs on a fixed date rather than the real clock. The DER encodings are checked against published values, and the JDK parses and validates every certificate the builder makes."

[[act]]
title = "A chain of three certificates"
summary = "A root signs itself, an intermediate is signed by the root and may issue certificates, and the server certificate for shop.example is signed by the intermediate and may not."
detail = """
The root, Example Root CA, is signed by itself. The intermediate, Example Issuing CA, is signed by the root and may issue certificates. The server certificate, for shop.example, is signed by the intermediate and may not issue certificates.
Each certificate holds its owner's public key and the issuer's signature over it, both as plain data. The signature algorithm is SHA256 with ECDSA, and anyone can check it with the issuer's public key.
"""
speech = """
First demo: a chain of three certificates. [[slnc 400]] The root signs itself. [[slnc 600]]
The intermediate is signed by the root, and may issue certificates. [[slnc 600]]
The server certificate, for the shop, is signed by the intermediate, and may not issue any. [[slnc 600]]
Each one holds its owner's public key, and the issuer's signature over it. [[slnc 300]] Anyone can check the signature with the issuer's public key.
"""
rows = { chain = "active ok" }
console = [
    ["root: CN=Example Root CA, signed by itself: true", "muted"],
    ["intermediate: CN=Example Issuing CA, signed by CN=Example Root CA, may issue certificates: true", "muted"],
    ["server: CN=shop.example, signed by CN=Example Issuing CA, may issue certificates: false", "muted"],
    ["the signature algorithm is SHA256withECDSA, and anyone can check it with the issuer's public key", "ok"],
]

[[act]]
title = "The browser's check"
summary = "The server sends its certificate and the intermediate; the browser trusts the root, so the chain is accepted, and the name shop.example matches but evil.example does not."
detail = """
The server sends its own certificate and the intermediate. The browser already trusts the root, so the chain is accepted. The certificate is for shop.example and not for evil.example. A wildcard such as star dot example stands for exactly one label.
"""
speech = """
Second demo: the browser's check. [[slnc 400]] The server sends its own certificate, and the intermediate. [[slnc 300]] The browser already trusts the root. [[slnc 600]]
The chain is accepted. [[slnc 600]]
The certificate is for the shop. [[slnc 300]] It is not for any other name. [[slnc 600]]
A wildcard stands for exactly one label, not more.
"""
rows = { check = "active ok" }
console = [
    ["the server sends its own certificate and the intermediate; the browser already trusts the root", "muted"],
    ["the chain is accepted: true", "ok"],
    ["the certificate is for shop.example: true", "ok"],
    ["the certificate is for evil.example: false", "ok"],
    ["a wildcard *.example stands for exactly one label: shop.example true, a.b.example false", "muted"],
]

[[act]]
title = "Three reasons to refuse"
summary = "An expired certificate is refused with reason EXPIRED, a certificate from an unknown authority with the same name is refused because its signature does not match, and a valid chain still needs a separate name check."
detail = """
A certificate that ended on 2024-12-31, checked on 2026-01-01, is refused with the reason expired. A certificate for shop.example from an authority the browser does not trust is refused, even though the rogue root has the same name as the real one:
names prove nothing, only keys do. The same valid chain shown to a visitor who meant evil.example is accepted as a chain, and the name does not match. A client must check the chain and the name, and they are separate checks.
"""
speech = """
Third demo: three reasons to refuse. [[slnc 400]] A certificate that has ended is refused. [[slnc 600]]
A certificate from an authority the browser does not trust is refused. [[slnc 300]] Even if that authority has the same name as the real one. [[slnc 300]] Names prove nothing. Only keys do. [[slnc 600]]
And a valid chain still has to match the name. [[slnc 300]] The chain check and the name check are separate.
"""
rows = { refuse = "active amber" }
console = [
    ["a certificate that ended on 2024-12-31, checked on 2026-01-01: accepted false, reason EXPIRED", "ok"],
    ["a certificate for shop.example from an authority the browser does not trust: accepted false, reason INVALID_SIGNATURE", "ok"],
    ["the rogue root has the same name as the real one: true, so names prove nothing, only keys do", "amber"],
    ["the same valid chain, shown to a visitor who meant evil.example: chain accepted true, name matches: false", "amber"],
    ["so a client must check the chain and the name, and both are separate checks", "muted"],
]

[[act]]
title = "Changed certificates, and certificates that overstep"
summary = "One changed letter in the name still parses but fails the signature, and a server certificate that signs another certificate is refused because it is not allowed to."
detail = """
One letter of the name is changed. The certificate still parses, and it is refused because the signature no longer matches. Then the shop's server key signs a certificate for other.example. It is refused: a server certificate says it is not a certificate authority,
so what it signs is not trusted. The intermediate has a path length of zero, so it may not have further authorities below it.
"""
speech = """
Fourth demo: changed certificates. [[slnc 400]] One letter of the name is changed. [[slnc 300]] The certificate still reads as a certificate. [[slnc 300]] It is refused, because the signature no longer matches. [[slnc 600]]
Then the shop's server key signs a certificate for another name. [[slnc 300]] It is refused. [[slnc 300]] A server certificate says it is not an authority, so what it signs is not trusted. [[slnc 600]]
The intermediate has a path length of zero, so it may not have any more authorities below it.
"""
rows = { overstep = "active ok" }
console = [
    ["one letter of the name changed (CN=shop.examplE): it still parses, accepted false, reason INVALID_SIGNATURE", "ok"],
    ["the shop's server key signs a certificate for other.example: accepted false, reason INVALID_KEY_USAGE", "ok"],
    ["a server certificate says it is not a CA, so what it signs is not trusted", "muted"],
    ["the intermediate's limit on further authorities below it (path length): 0", "muted"],
]

[[act]]
title = "Revocation, and the bill"
summary = "A stolen intermediate key forges a certificate that is accepted until the intermediate is revoked; revocation only works if clients have the latest list."
detail = """
Someone steals the intermediate's private key and issues their own certificate for shop.example. The forged chain is accepted: a stolen authority key breaks everything below it. Putting the shop's own certificate on the revocation list gets it refused with the reason revoked.
Putting the intermediate on the list refuses both the shop's chain and the forged one. A list only works if the client gets the latest one, so real clients use CRLs, OCSP, short lifetimes, or all three.
Trusting a root is a decision, because it may vouch for any name: keep the store small and keep authority keys offline or in hardware.
"""
speech = """
Fifth demo: revocation, and the bill. [[slnc 400]] Someone steals the intermediate's private key. [[slnc 300]] They issue their own certificate for the shop. [[slnc 600]]
The forged chain is accepted. [[slnc 300]] A stolen authority key breaks everything below it. [[slnc 600]]
Put the intermediate on the revocation list, and both chains are refused. [[slnc 600]]
But a list only works if the client has the latest one. [[slnc 300]] Real clients use lists, online checks, short lifetimes, or all three. [[slnc 600]]
And trusting a root is a decision. [[slnc 300]] Keep the store small, and keep authority keys offline.
"""
rows = { revoke = "active wrong" }
console = [
    ["someone steals the intermediate's private key and issues their own certificate for shop.example", "muted"],
    ["the forged chain is accepted: true  <- A STOLEN CA KEY BREAKS EVERYTHING BELOW IT", "bad"],
    ["the shop's own certificate put on the revocation list: accepted false, reason REVOKED", "ok"],
    ["the intermediate put on the list: the shop's chain accepted false, the forged chain accepted false", "ok"],
    ["but a list only works if the client gets the latest one: real clients use CRLs, OCSP, short lifetimes, or all three", "amber"],
    ["trusting a root is a decision: it may vouch for any name, so keep the store small and keep CA keys offline or in hardware", "amber"],
]

