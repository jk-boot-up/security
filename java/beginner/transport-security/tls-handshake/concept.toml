]
install = []

[docs.session]
objectives = [
    "say what a TLS handshake achieves",
    "say what a sniffer can and cannot see with TLS",
    "explain why a client checks a certificate and a name",
    "explain forward secrecy in one sentence",
    "say why old protocol versions are switched off",
]
walkthrough = """
Start with the code word and the stranger. Run the demo one act at a time. After act one, ask what a thief learns from the capture of a TLS connection. After act two, ask why the first message cannot be encrypted.
In act three, ask what would happen if the client accepted every certificate. In act four, ask what an attacker could do to a record without the key.
"""
exercises = [
    "Print the record types of the whole handshake and match them with the ClientHello, ServerHello and the encrypted records.",
    "Make the client trust both certificates and see the impostor accepted.",
    "Offer only TLS 1.3 on the client and a cipher suite that the server does not allow.",
    "Swap two records on the wire and see what the server does.",
]

[docs.explained]
sentence = """
TLS lets a client and a server agree on fresh secret keys in public, lets the client check the server's certificate and name, and then protects every record against reading and tampering, while the site's name and the sizes of messages stay visible.
"""
verdict = """
Use TLS 1.3, or 1.2 where needed, for every connection. Keep old versions off. Let the client verify the certificate and the name. Renew certificates automatically and protect their private keys. Remember what TLS does not hide.
"""
recognise = [
    "`https://` and the padlock in a browser.",
    "\"Your connection is not private\" errors for expired or wrong-name certificates.",
    "`minimum_tls_version` in load balancer settings.",
    "`curl -v` output showing the ClientHello, the ServerHello and the cipher suite.",
]

[spec]
purpose = """
Teach what the TLS handshake and record layer do by running two real TLS engines against each other in memory, with a sniffer that records the wire, a trusted and an untrusted certificate, a tampered record and old protocol versions.
"""
nongoals = [
    "Certificate authorities and chains: the next project.",
    "Writing the protocol: the JDK engine does that.",
    "Sockets, HTTP and servers: the https-server project.",
]
problem = """
Learners know HTTPS is safe but not why, and cannot say what it protects against or what it leaves visible.
"""
roles = [["The two engines and the loop", "`Connection`"], ["The sniffer's view", "`Wire`"], ["Test certificates", "`TestCertificates`"], ["Entry point", "`TlsDemo`"]]
requirements = [
    "The handshake succeeds with TLS 1.3 and the wire is recorded.",
    "An untrusted certificate and a wrong name are refused.",
    "A record with any changed byte is refused.",
    "TLS 1.0 is refused, TLS 1.2 works unless the server requires 1.3.",
    "The demo prints the same output on every run.",
]

