# concept.toml: everything about this project that is not Java code.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "tls-handshake"
module = "transport-security"
title = "The TLS Handshake"
short_title = "TLS Handshake"
package = "tls"
main_class = "TlsDemo"
tagline = "How two strangers agree on a secret in public"
bold = "TLS lets a client and a server agree on secret keys in front of a sniffer, check who the server is, and then protect every record against reading and changing, but it hides neither the site's name nor the sizes of messages."
domain = "an online store"
domain_note = ""
youtube_description = """The TLS handshake in Java: how two strangers agree on a secret in public. Explained with an online store, like two people who must settle on a code word while a stranger listens. Using two real TLS engines wired together in memory, we watch a sniffer see a card number without TLS and only scrambled records with it, follow the handshake from the readable ClientHello to the encrypted rest, see a client refuse an impostor and a wrong site name, see that one changed bit in a record is refused, see that old protocol versions are switched off, and finish with the bill."""
thumb_lines = ["THE TLS", "HANDSHAKE"]
thumb_code = "SSLEngine.beginHandshake()"
youtube_title = "The TLS Handshake Explained in Java (TLS 1.3, Certificates, Tampering)"
youtube_tags = ["tls", "tls 1.3", "handshake", "ssl", "sslengine", "certificates", "https", "java", "cybersecurity for beginners"]

[readme]
technologies = [
    ["keytool (from the JDK)", "25", "made the two test keystores in src/main/resources once; not needed to run anything"],
]
intro = """
**TLS** (Transport Layer Security) is the protection under HTTPS, and under mail, databases and most other things on the internet. It has two jobs. A **handshake** at the start of a connection lets the two sides agree on
secret keys, even though a sniffer is listening to every word, and lets the client check the server's **certificate**, which says that a key belongs to a name. Then the **record layer** protects every piece of data that follows,
so that it cannot be read or changed without being noticed.

This project uses two real TLS engines from the JDK, wired together in memory, so every byte one produces is exactly what would cross a network, and a sniffer class records it. The demo compares the wire with and without TLS,
follows the handshake, makes the client refuse an impostor and a wrong name, changes one bit of a record, and switches off old versions.
"""
analogy = """
Think of two people who have never met and must agree on a code word while a stranger listens. They each mix a private colour into a public one and swap the results, and each can finish the mix, while the listener cannot.
Then the server shows a letter signed by someone the client trusts, saying that this person is who they claim to be. From then on every message goes in a tamper-evident sealed envelope.
"""
scenario = """
An online store's customer sends an order with a card number to the store. The demo shows what a sniffer sees without TLS and with it, how the connection is agreed, who the client will talk to, and what happens when a record is changed
or an old protocol is offered.
"""
costs = [
    "**Certificates must be obtained, renewed and protected.** An expired certificate is an outage, and a stolen private key lets someone pose as the store.",
    "**The handshake costs a round trip and some computing.** TLS 1.3 reduced it to one round trip, and resumption can skip most of the rest.",
    "**The first message is readable.** The ClientHello shows the name of the site, and the sizes and timing of records still show, even though their content does not.",
    "**TLS ends at the endpoints.** It protects the connection between two ends, not what the ends do with the data, and a proxy that ends TLS sees everything.",
    "**Settings matter.** Old protocol versions and weak cipher suites must stay switched off, and the defaults of the platform are what keep that true.",
]
too_much = """
TLS is not optional: every connection that carries anything of value should use it. The choices are about how: modern versions only, certificates from a trusted authority, and automatic renewal.
"""
met_before = [
    "The padlock in a browser, and `https://` in every address.",
    "\"Certificate expired\" and \"your connection is not private\" errors.",
    "`curl -v https://...` showing the handshake and the negotiated cipher.",
    "Settings called `minimum TLS version` in cloud load balancers.",
]
where = """
This project is the first in [transport-security](..) and uses the keys, hashes and signatures of [cryptography](../../cryptography), and the connections of [networking](../networking).
"""
twin = """
Both TLS engines run in one process and pass bytes to each other in memory, so no network or port is used. The keys and nonces are random, so the demo prints only facts that do not depend on them. The test keystores were made once with
`keytool` and are valid for a hundred years, so the demo never expires. The cipher suite shown is the JDK 25 default.
"""
test_note = "The two engines run in memory and the keys and nonces are random, so the demo prints only facts that do not depend on them: protocol and cipher suite names, the types of records, and yes or no results. The test keystores are fixed files, valid for a hundred years."

[[act]]
title = "A sniffer on the wire, without and with TLS"
summary = "Without TLS the sniffer reads the card number; with TLS it sees a record of type 23 and no card number, and the record is only a few dozen bytes larger than the order."
detail = """
Without TLS the order is sent as it is, and the sniffer sees the card number. With TLS the sniffer sees a record of type 23, application data, and no card number. The record is only a few dozen bytes larger than the order: a header, padding and an authentication tag.
"""
speech = """
First demo: a sniffer on the wire. [[slnc 400]] Without T L S, the order is sent as it is. [[slnc 300]] The sniffer sees the card number. [[slnc 600]]
With T L S, the sniffer sees a record of type twenty three, application data. [[slnc 300]] And no card number. [[slnc 600]]
The record is only a few dozen bytes larger than the order.
"""
rows = { wire = "active ok" }
console = [
    ["without TLS the order is sent as it is, and the sniffer sees the card number: true", "bad"],
    ["with TLS the sniffer sees a record of type 23 (application data) and the card number: false", "ok"],
    ["the record is not larger than the order plus a few dozen bytes of header, padding and tag: true", "muted"],
]

[[act]]
title = "The handshake"
summary = "The client speaks first with a readable ClientHello that shows the site's name; the ServerHello chooses TLS 1.3 and TLS_AES_256_GCM_SHA384; the rest of the handshake, including the certificate, is encrypted."
detail = """
The client speaks first, with a handshake record called ClientHello. It is not encrypted, because no key exists yet, so the sniffer reads the name of the site. The server answers with a ServerHello, which chooses the protocol and cipher: TLS 1.3 and TLS_AES_256_GCM_SHA384.
After the ServerHello the rest of the handshake is encrypted, so even the certificate is hidden from the sniffer. Both sides now share keys that were never sent over the wire.
"""
speech = """
Second demo: the handshake. [[slnc 400]] The client speaks first, with a message called ClientHello. [[slnc 300]] It is not encrypted, because no key exists yet. [[slnc 300]] So a sniffer reads the name of the site. [[slnc 600]]
The server answers with a ServerHello, which chooses the protocol and the cipher. [[slnc 300]] T L S one point three. [[slnc 600]]
After that, the rest of the handshake is encrypted. [[slnc 300]] Even the certificate is hidden. [[slnc 600]]
Both sides now share keys that were never sent over the wire.
"""
rows = { hello = "active amber", keys = "active ok" }
console = [
    ["the client speaks first, with a handshake record (type 22) called ClientHello", "muted"],
    ["the ClientHello is not encrypted, because no key exists yet, so the sniffer reads the name of the site: true", "amber"],
    ["the server answers with a handshake record (type 22) called ServerHello, which chooses the protocol and cipher", "muted"],
    ["after the ServerHello the rest of the handshake is encrypted: the certificate is hidden from the sniffer: true", "ok"],
    ["agreed protocol: TLSv1.3", "ok"],
    ["agreed cipher suite: TLS_AES_256_GCM_SHA384", "ok"],
    ["both sides now share keys that were never sent over the wire", "ok"],
]

[[act]]
title = "Who is on the other end"
summary = "The shop's own certificate works; an impostor with the same name but an untrusted certificate is refused; the real certificate with a different requested name is refused."
detail = """
The shop's own certificate, for the name shop.example.test, works. An impostor with the same name but a certificate the client does not trust is refused by the client. The shop's real certificate, when the client asked for another name, is also refused: the name must match.
A certificate proves a key belongs to a name because someone the client trusts vouched for it.
"""
speech = """
Third demo: who is on the other end. [[slnc 400]] The shop's own certificate works. [[slnc 600]]
An impostor with the same name, but a certificate the client does not trust, is refused. [[slnc 600]]
The shop's real certificate is also refused, if the client asked for a different name. [[slnc 300]] The name must match. [[slnc 600]]
A certificate proves a key belongs to a name, because someone the client trusts vouched for it.
"""
rows = { identity = "active ok" }
console = [
    ["the shop's own certificate, name shop.example.test: handshake works: true", "ok"],
    ["an impostor with the same name but a certificate the client does not trust: handshake works: false  <- THE CLIENT REFUSES", "ok"],
    ["the shop's real certificate, but the client asked for another.example.test: handshake works: false  <- THE NAME MUST MATCH", "ok"],
    ["a certificate proves a key belongs to a name, because someone the client trusts vouched for it", "muted"],
]

[[act]]
title = "Protecting the data"
summary = "The server opens an untouched record; the same order in two connections looks different; one changed bit is refused; keys are made fresh each time from temporary key pairs."
detail = """
The server opens an untouched record and gets the order back. The same order in two connections gives different bytes on the wire, because each connection has fresh keys. One changed bit in a record is refused, so TLS protects integrity as well as secrecy.
Because the keys of each connection are made fresh from temporary key pairs, a stolen server key cannot open recorded traffic. This is called forward secrecy.
"""
speech = """
Fourth demo: protecting the data. [[slnc 400]] The server opens an untouched record, and gets the order back. [[slnc 600]]
The same order, in two connections, looks different on the wire. [[slnc 300]] Each connection has fresh keys. [[slnc 600]]
One changed bit in a record is refused. [[slnc 300]] So T L S protects integrity, as well as secrecy. [[slnc 600]]
And because the keys are made fresh each time, a stolen server key cannot open recorded traffic. [[slnc 300]] This is called forward secrecy.
"""
rows = { records = "active ok" }
console = [
    ["the server opens an untouched record and gets the order back: true", "ok"],
    ["the same order in two connections gives different bytes on the wire, because each has fresh keys: true", "ok"],
    ["one changed bit in a record: refused  <- TLS PROTECTS INTEGRITY AS WELL AS SECRECY", "ok"],
    ["the keys of each connection are made fresh from temporary key pairs, so a stolen server key cannot open recorded traffic", "muted"],
]

[[act]]
title = "Settings, and the bill"
summary = "A client offering only TLS 1.0 fails; TLS 1.2 still works and agrees TLSv1.2 unless the server requires 1.3; the bill is certificates, a round trip, and what still shows."
detail = """
A client that only offers TLS 1.0 cannot connect, because old versions are switched off. A client that offers only TLS 1.2 still works and agrees TLS 1.2, but fails against a server that requires TLS 1.3. The bill: certificates must be obtained and renewed,
the handshake costs a round trip and some computing, and the keys must be kept safe. TLS protects the connection between two ends, not what the ends do with the data, and the name of the site and the sizes of messages still show.
"""
speech = """
Fifth demo: settings, and the bill. [[slnc 400]] A client that offers only T L S one point zero cannot connect. [[slnc 300]] Old versions are switched off. [[slnc 600]]
A client that offers only T L S one point two still works. [[slnc 300]] Unless the server requires one point three. [[slnc 600]]
And the bill. [[slnc 300]] Certificates must be obtained and renewed. [[slnc 300]] The handshake costs a round trip. [[slnc 300]] And T L S protects the connection, not what the ends do with the data.
"""
rows = { settings = "active amber" }
console = [
    ["a client that only offers TLS 1.0: handshake works: false  <- OLD VERSIONS ARE SWITCHED OFF", "ok"],
    ["a client that offers only TLS 1.2: handshake works: true, agreed protocol: TLSv1.2", "amber"],
    ["the same client against a server that requires TLS 1.3: handshake works: false", "amber"],
    ["the bill: certificates must be obtained and renewed, the handshake costs a round trip and some computing, and the keys must be kept safe", "amber"],
    ["TLS protects the connection between two ends, not what the ends do with the data, and the name of the site and the sizes of messages still show", "amber"],
]

[animation]
subtitle = "A customer's order meets TLS: a readable hello, an encrypted handshake, a certificate check and protected records."
boxes = [
