[poster]
headline = [["THE TLS", "text"], ["HANDSHAKE", "accent"]]
taglines = [["How two strangers agree on a secret in public", "gold"]]
before = { code = "card=4111...", note = "readable by anyone on the path", tag = "BEFORE" }
after = { code = "TLS 1.3 record", note = "encrypted and tamper-evident", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "The TLS Handshake"
narration = """Hello, and welcome. [[slnc 400]] This video explains the T L S handshake, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] T L S is the protection under H T T P S. [[slnc 300]] A handshake at the start lets two strangers agree on secret keys, while someone listens. [[slnc 600]] Think of two people who must agree on a code word while a stranger listens. [[slnc 300]] Then one of them shows a letter, signed by someone the other trusts, saying who they are. [[slnc 300]] From then on, every message goes in a sealed envelope that shows if it was opened. [[slnc 700]] In this video, the domain is an online store. [[slnc 500]] By the end, you will hear what a sniffer sees. [[slnc 300]] How the keys are agreed. [[slnc 300]] How a client checks the server. [[slnc 300]] And what T L S does not hide."""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["A customer sends an order with a card number.", "", "The two sides have never met.", "Anyone on the path can listen,", "record, and change what passes."]
narration = """Here is the scenario. [[slnc 400]] A customer sends an order, with a card number, to an online store. [[slnc 500]] The two sides have never met. [[slnc 300]] Anyone on the path can listen. [[slnc 300]] Record. [[slnc 300]] And change what passes."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["Handshake: agreeing keys, checking identity", "Record: one protected piece of data", "Certificate: a key tied to a name", "Cipher suite: the algorithms in use", "Forward secrecy: fresh keys every time"]
narration = """Before the demos, the words. [[slnc 500]] The handshake is the start of a connection, where the keys are agreed and the identity is checked. [[slnc 500]] A record is one protected piece of data. [[slnc 500]] A certificate ties a key to a name. [[slnc 500]] The cipher suite is the set of algorithms in use. [[slnc 500]] And forward secrecy means that fresh keys are made every time."""

[[scene]]
key = "03-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "04-jobs"
kind = "figure"
title = "One order, three jobs of TLS"
body = "tls_jobs"
narration = """Here is the whole idea, on real values from the demo. [[slnc 400]] T L S does three jobs. [[slnc 500]] First, it agrees keys. [[slnc 300]] The handshake chose T L S one point three, and a cipher suite, and the keys were never sent. [[slnc 500]] Second, it checks who answered. [[slnc 300]] The client trusts one certificate, and refuses an impostor. [[slnc 500]] Third, it protects the data. [[slnc 300]] The order becomes a five byte header, and sixty seven encrypted bytes. [[slnc 300]] And one changed bit is refused. [[slnc 500]] The five acts show each job in turn."""

[[scene]]
key = "acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "09-ladder"
kind = "bullets"
title = "What TLS Gives, and Does Not"
body = ["Gives: secrecy of the data", "Gives: detection of changes", "Gives: the identity of the server", "Does not hide: the site name, sizes, timing", "Does not protect: the ends themselves"]
narration = """Let's put it side by side. [[slnc 400]] T L S gives secrecy of the data. [[slnc 500]] It gives detection of changes. [[slnc 500]] It gives the identity of the server. [[slnc 500]] It does not hide the name of the site, the sizes of messages, or their timing. [[slnc 500]] And it does not protect the two ends themselves."""

[[scene]]
key = "11-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["The padlock and https://", "\"Your connection is not private\"", "minimum TLS version settings", "curl -v output"]
narration = """You have probably met this already. [[slnc 400]] The padlock in a browser, and https at the start of an address. [[slnc 500]] The warning, your connection is not private. [[slnc 500]] Settings called minimum T L S version, in load balancers. [[slnc 500]] And the output of curl with the verbose option, which shows the handshake."""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["TLS on every connection", "Modern versions only", "Verify the certificate and the name", "Renew certificates automatically", "Know what TLS does not hide"]
narration = """So, how do you use it? [[slnc 400]] Use T L S on every connection. [[slnc 500]] Allow modern versions only. [[slnc 500]] Verify the certificate, and the name. [[slnc 500]] Renew certificates automatically, and protect their private keys. [[slnc 500]] And remember what T L S does not hide."""

[[scene]]
key = "13-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "13-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Make the client trust both", "certificates and see what happens."]
narration = """That's the T L S handshake. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] T L S lets two strangers agree on secret keys in public, check who the server is, and protect every record, while the site's name and the sizes of messages stay visible. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine, with nothing installed except a Java development kit. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Make the client trust both certificates, and see what happens. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
The connection between a customer's client and an online store's server: the handshake, the certificate check, the keys and the records. It covers an attacker who can listen to, record, change and inject traffic, and one who can run a server of their own
with a certificate of their own. It does not cover the endpoints, the certificate authorities, or the web application on top.
"""
assets = [
    "The content of orders, such as card numbers.",
    "The integrity of the records.",
    "The server's private key.",
    "The client's belief about who it is talking to.",
]
actors = [
    "The customer's client.",
    "The store's server.",
    "A passive attacker who records traffic.",
    "An active attacker who can change traffic or pose as the server.",
]
boundaries = [
    "Client to server across the internet: every record crosses it.",
    "Server to its private key: the key never crosses the network.",
]
assumptions = [
    "The client trusts only certificates it was configured to trust.",
    "The server's private key stays secret.",
    "In the demo, the keys and certificates are test values in the repository.",
]
out_of_scope = [
    "Certificate authorities and revocation: the next project.",
    "Attacks on the endpoints.",
    "Side channels in the implementation.",
]
tests = [
    "`HandshakeTest` checks the agreed protocol, the record types, the readable hello, data round trips, every changed byte of a record, the size of a record (header, order, type, padding and tag), the two fingerprints, untrusted certificates, wrong names, and protocol versions.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next project, certificates-and-chain-of-trust, looks at who vouches for a key, and how a chain of certificates is checked.
"""

[[threat]]
id = "T1"
stride = "I"
threat = "A passive attacker records traffic and reads the order"
where = "`Connection`, `Wire`"
control = "Records are encrypted with keys agreed in the handshake"
residual = "The site name, sizes and timing still show"

[[threat]]
id = "T2"
stride = "S"
threat = "An attacker poses as the store with a certificate of their own or one for another name"
where = "`TestCertificates`, `Connection`"
control = "The client trusts only configured certificates and checks the name"
residual = "A wrongly issued certificate from a trusted authority would be accepted"

[[threat]]
id = "T3"
stride = "T"
threat = "An attacker changes a record in transit"
where = "`Connection.serverOpens`"
control = "Every record carries an authentication tag, and a changed record is refused"
residual = "The attacker can still drop the connection"

[[threat]]
id = "T4"
stride = "I"
threat = "The server's private key is stolen"
where = "the server's keystore"
control = "Fresh keys per connection give forward secrecy for recorded traffic"
residual = "The thief can impersonate the server until the certificate is replaced"

[[threat]]
id = "T5"
stride = "T"
threat = "An attacker pushes the connection down to an old, weak protocol version"
where = "`Connection`, protocol settings"
control = "Old versions are switched off, and modern versions protect the negotiation"
residual = "Servers that still allow old versions can be attacked"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] Four small classes. [[slnc 300]] Here is what each one does."""

[[class]]
name = "TlsDemo"
what = "runs the five acts"
[[class.part]]
title = "the five acts"
code = """
act1BeforeAndAfter(out, client, shop);
act2Handshake(out, shop);
act3Identity(out, client, shop);
act4Protection(out, client, shop);
act5SettingsAndCosts(out, client, shop);
"""
speech = """T L S demo runs the five acts, and prints only facts that are the same on every run, because the keys are random."""
[[class.part]]
title = "act four: flip one bit"
code = """
changed[at] ^= 0x01;
...
    tampered.serverOpens(changed);
    result = "accepted";
} catch (SSLException e) {
    result = "refused, " + e.getMessage();
"""
speech = """Act four flips one bit of a sealed record. [[slnc 300]] The server's open throws, so the demo prints refused, with Java's own message."""

[[class]]
name = "Connection"
what = "two real TLS engines, wired in memory"
[[class.part]]
title = "a client engine and a server engine"
code = """
client = clientContext.createSSLEngine(hostName, 443);
client.setUseClientMode(true);
SSLParameters parameters = client.getSSLParameters();
parameters.setEndpointIdentificationAlgorithm("HTTPS");   // check the name
...
server = serverContext.createSSLEngine();
server.setUseClientMode(false);
"""
speech = """Connection makes two of Java's S S L engines, one for each side. [[slnc 300]] The endpoint identification setting makes the client check the name in the certificate."""
[[class.part]]
title = "the handshake loop, and sealing data"
code = """
client.beginHandshake();
...
while (progress && failure == null) {
    progress = step(client, true);
    progress |= step(server, false);
...
engine.wrap(ByteBuffer.allocate(0), out);   // handshake bytes to send
...
deliver(isClient, out);                     // onto the wire
...
client.wrap(ByteBuffer.wrap(data), out);    // the order becomes a record
"""
speech = """The handshake loop lets each engine take turns. [[slnc 300]] Whatever one wraps is delivered to the other, and recorded on the wire. [[slnc 300]] After the handshake, wrap turns the order into a record."""

[[class]]
name = "Wire"
what = "what a sniffer sees"
[[class.part]]
title = "reading record headers"
code = """
while (at + 5 <= bytes.length) {
    types.add(bytes[at] & 0xff);           // byte 0: the type
    int length = ((bytes[at + 3] & 0xff) << 8)
            | (bytes[at + 4] & 0xff);      // bytes 3 and 4: the length
    at += 5 + length;                      // the next record
"""
speech = """Wire keeps every byte each side sent. [[slnc 300]] Record types reads the five byte headers: the type in byte zero, the length in bytes three and four."""

[[class]]
name = "TestCertificates"
what = "the shop's and an impostor's certificates"
[[class.part]]
title = "trust one certificate; its fingerprint"
code = """
Certificate shop = load("shop.p12").getCertificate("shop");
KeyStore trust = KeyStore.getInstance("PKCS12");
trust.load(null, null);
trust.setCertificateEntry("shop", shop);       // the only one trusted
...
byte[] digest = MessageDigest.getInstance("SHA-256")
        .digest(certificate.getEncoded());
return HexFormat.of().formatHex(digest, 0, 8);
"""
speech = """Test certificates builds a client that trusts only the shop's certificate. [[slnc 300]] Fingerprint hashes a certificate with S H A two five six, so two certificates with one name can be told apart."""

