    ["hello", "Hellos", "the first messages are readable"],
    ["keys", "Shared keys", "agreed in public, never sent"],
    ["identity", "Certificate", "who the server is"],
    ["records", "Records", "encrypted and tamper-evident"],
    ["settings", "Settings", "modern versions only"],
]

[docs.dependencies]
intro = """
This project uses no library beyond the JDK. Its test certificates were made once with the JDK's `keytool`.
"""
what = [
    ["javax.net.ssl.SSLEngine", "the JDK's TLS engine without any sockets: it turns application data into records and back, and it runs the handshake when the caller passes it bytes."],
    ["keytool", "the JDK's tool for keystores. It made `shop.p12` and `impostor.p12` with an elliptic-curve key, the name shop.example.test, and a validity of one hundred years."],
]
why = """
Using the engine directly, with nothing but memory between the two sides, shows exactly what crosses the wire and keeps the demo exact and fast.
"""
install_note = "A JDK is all that is needed. The versions are pinned where Gradle controls them:"
versions = [
    ["Java (includes TLS 1.3)", "25"],
    ["JUnit", "6.1.3"],
    ["Keystore format", "PKCS12"],
    ["Test key", "EC P-256, 100-year certificate"],
]
costs = [
    "SSLEngine is a low-level API: the caller moves every byte and must handle buffer sizes and the handshake loop.",
    "The test keys are public in the repository and protect nothing.",
]

[docs.problem]
scenario = """
An online store's customer sends a card number across networks the store does not control. The two sides have never met, and anyone on the path can listen, record and change what passes.
"""
naive = """
Send the order as it is, or encrypt it with a key that was sent first in the same open connection.
"""
deliver = [
    "A comparison of what a sniffer sees without and with TLS.",
    "A handshake between two real TLS engines, with the wire recorded.",
    "A client that refuses an untrusted certificate and a wrong name.",
    "A record that is refused when one bit changes.",
    "Old protocol versions that are refused, and the TLS 1.2 against TLS 1.3 choice.",
    "The same facts printed on every run although keys and nonces are random.",
]

