narration = """Hello, and welcome. [[slnc 400]] This video explains the T L S handshake, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] T L S is the protection under H T T P S. [[slnc 300]] A handshake at the start lets two strangers agree on secret keys, while someone listens. [[slnc 600]] Think of two people who must agree on a code word while a stranger listens. [[slnc 300]] Then one of them shows a letter, signed by someone the other trusts, saying who they are. [[slnc 300]] From then on, every message goes in a sealed envelope that shows if it was opened. [[slnc 700]] In this video, the domain is an online store. [[slnc 500]] By the end, you will hear what a sniffer sees. [[slnc 300]] How the keys are agreed. [[slnc 300]] How a client checks the server. [[slnc 300]] And what T L S does not hide."""

