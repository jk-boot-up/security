# concept.toml: everything about this project that is not Java code.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "tls-handshake"
module = "transport-security"
title = "The TLS Handshake"
short_title = "TLS Handshake"
package = "tls"
main_class = "TlsDemo"
tagline = "How two strangers agree on a secret in public"
bold = "TLS lets a client and a server agree on secret keys in front of a sniffer, check who the server is, and then protect every record against reading and changing, but it hides neither the site's name nor the sizes of messages."
domain = "an online store"
domain_note = ""
youtube_description = """The TLS handshake in Java: how two strangers agree on a secret in public. Explained with an online store, like two people who must settle on a code word while a stranger listens. Using two real TLS engines wired together in memory, we watch a sniffer see a card number without TLS and only scrambled records with it, follow the handshake from the readable ClientHello to the encrypted rest, see a client refuse an impostor and a wrong site name, see that one changed bit in a record is refused, see that old protocol versions are switched off, and finish with the bill."""
thumb_lines = ["THE TLS", "HANDSHAKE"]
thumb_code = "SSLEngine.beginHandshake()"
youtube_title = "The TLS Handshake Explained in Java (TLS 1.3, Certificates, Tampering)"
youtube_tags = ["tls", "tls 1.3", "handshake", "ssl", "sslengine", "certificates", "https", "java", "cybersecurity for beginners"]

[readme]
technologies = [
    ["keytool (from the JDK)", "25", "made the two test keystores in src/main/resources once; not needed to run anything"],
]
intro = """
**TLS** (Transport Layer Security) is the protection under HTTPS, and under mail, databases and most other things on the internet. It has two jobs. A **handshake** at the start of a connection lets the two sides agree on
secret keys, even though a sniffer is listening to every word, and lets the client check the server's **certificate**, which says that a key belongs to a name. Then the **record layer** protects every piece of data that follows,
so that it cannot be read or changed without being noticed.

This project uses two real TLS engines from the JDK, wired together in memory, so every byte one produces is exactly what would cross a network, and a sniffer class records it. The demo compares the wire with and without TLS,
follows the handshake, makes the client refuse an impostor and a wrong name, changes one bit of a record, and switches off old versions.
"""
analogy = """
Think of two people who have never met and must agree on a code word while a stranger listens. They each mix a private colour into a public one and swap the results, and each can finish the mix, while the listener cannot.
Then the server shows a letter signed by someone the client trusts, saying that this person is who they claim to be. From then on every message goes in a tamper-evident sealed envelope.
"""
scenario = """
An online store's customer sends an order with a card number to the store. The demo shows what a sniffer sees without TLS and with it, how the connection is agreed, who the client will talk to, and what happens when a record is changed
or an old protocol is offered.
"""
costs = [
    "**Certificates must be obtained, renewed and protected.** An expired certificate is an outage, and a stolen private key lets someone pose as the store.",
    "**The handshake costs a round trip and some computing.** TLS 1.3 reduced it to one round trip, and resumption can skip most of the rest.",
    "**The first message is readable.** The ClientHello shows the name of the site, and the sizes and timing of records still show, even though their content does not.",
    "**TLS ends at the endpoints.** It protects the connection between two ends, not what the ends do with the data, and a proxy that ends TLS sees everything.",
    "**Settings matter.** Old protocol versions and weak cipher suites must stay switched off, and the defaults of the platform are what keep that true.",
]
too_much = """
TLS is not optional: every connection that carries anything of value should use it. The choices are about how: modern versions only, certificates from a trusted authority, and automatic renewal.
"""
met_before = [
    "The padlock in a browser, and `https://` in every address.",
    "\"Certificate expired\" and \"your connection is not private\" errors.",
    "`curl -v https://...` showing the handshake and the negotiated cipher.",
    "Settings called `minimum TLS version` in cloud load balancers.",
]
where = """
This project is the first in [transport-security](..) and uses the keys, hashes and signatures of [cryptography](../../cryptography), and the connections of [networking](../../networking).
"""
twin = """
Both TLS engines run in one process and pass bytes to each other in memory, so no network or port is used. The keys and nonces are random, so the demo prints only facts that do not depend on them. The test keystores were made once with
`keytool` and are valid for a hundred years, so the demo never expires. The cipher suite shown is the JDK 25 default.
"""
test_note = "The two engines run in memory and the keys and nonces are random, so the demo prints only facts that do not depend on them: protocol and cipher suite names, the types of records, and yes or no results. The test keystores are fixed files, valid for a hundred years."

[[act]]
title = "A sniffer on the wire, without and with TLS"
summary = "Without TLS the sniffer reads the card number in the 34-byte order; with TLS it sees one 72-byte record: a 5-byte header in the clear, then 67 encrypted bytes (34 order, 1 type, 16 padding, 16 tag)."
detail = """
Before TLS, the order card=4111111111111111&order=A-1001 crosses the wire as it is: 34 bytes, and the sniffer reads the card number. After TLS, the sniffer sees one record of 72 bytes. Its 5-byte header is in the clear: 17 is record type 23, application data;
03 03 is a version label kept for old network boxes; 00 43 says 67 bytes follow. Those 67 bytes are the 34 bytes of the order, encrypted, 1 byte for the real record type, 16 bytes of zero padding that the JDK adds, and the 16-byte authentication tag. 5 + 34 + 1 + 16 + 16 = 72, and the card number is no longer readable.
"""
figure = "sniffer_view"
figure_title = "What the sniffer sees, before and after TLS"
figure_speech = """
Here is the order, before and after T L S. [[slnc 400]] Before T L S, the sniffer sees every character. [[slnc 300]] The card number, in rose, is readable. [[slnc 600]]
After T L S, it sees one record of seventy two bytes. [[slnc 400]] Five bytes of header are in the clear. [[slnc 300]] One seven means type twenty three, application data. [[slnc 300]] Zero three, zero three, is a version label. [[slnc 300]] And zero zero, four three, says sixty seven bytes follow. [[slnc 500]]
Those sixty seven bytes are the order, thirty four bytes, encrypted. [[slnc 300]] One byte for the real type. [[slnc 300]] Sixteen bytes of padding, added by Java. [[slnc 300]] And a sixteen byte tag. [[slnc 500]]
Five, plus thirty four, plus one, plus sixteen, plus sixteen: seventy two. [[slnc 400]] And the card number is gone from view.
"""
speech = """
Here is what the program printed. [[slnc 400]] Before T L S: the order, thirty four bytes, and the card number is readable. [[slnc 500]]
After T L S: one record of seventy two bytes. [[slnc 300]] The header is in the clear, the rest is encrypted, and the card number is not readable. [[slnc 500]]
Then how the seventy two bytes are made, part by part.
"""
rows = { wire = "active ok" }
console = [
    ["BEFORE TLS (the order, as the sniffer sees it):", "ok"],
    ["  card=4111111111111111&order=A-1001", "muted"],
    ["  34 bytes, the card number readable: true  <- READABLE", "bad"],
    ["AFTER TLS (one record of 72 bytes, as the sniffer sees it):", "bad"],
    ["  header    17 03 03 00 43  (in the clear)", "muted"],
    ["  the rest  67 bytes, encrypted", "muted"],
    ["  the card number readable: false", "muted"],
    ["HOW THE 72 BYTES ARE MADE:", "amber"],
    ["  17        type 23, application data", "muted"],
    ["  03 03     version, written as TLS 1.2 for old boxes", "muted"],
    ["  00 43     length: 67 bytes follow the header", "muted"],
    ["  67 bytes  34 order + 1 type + 16 padding + 16 tag", "muted"],
]

[[act]]
title = "The handshake"
summary = "The client speaks first with a readable ClientHello that shows the site's name; the ServerHello chooses TLS 1.3 and TLS_AES_256_GCM_SHA384; after it, record types 20 and 23 follow and the certificate is encrypted."
detail = """
Before the keys exist, two hellos cross the wire in the clear, both handshake records of type 22. The ClientHello lists the versions and ciphers the client can use, a temporary public key and the site name, shop.example.test, which the sniffer can read. The ServerHello chooses TLSv1.3 and TLS_AES_256_GCM_SHA384 and adds the server's temporary public key.
Each side mixes its own temporary private key with the other's public key and gets the same secret, so the keys are never sent. After that, the client sends records of types 22 20 23 and the server 22 20 23 23: type 20, change cipher spec, is kept only for old network boxes, and type 23 is encrypted, so the certificate is not readable.
The cipher suite, part by part: TLS, the protocol; AES with a 256-bit key, the cipher; GCM, the mode that encrypts and adds a tag; SHA384, the hash that makes the keys.
"""
figure = "handshake_flow"
figure_title = "The handshake: who sends what, in order"
figure_speech = """
Here is the handshake, message by message. [[slnc 400]] The client speaks first, with a ClientHello. [[slnc 300]] It lists the versions it can speak, a temporary public key, and the site name. [[slnc 300]] No key exists yet, so it is in the clear. [[slnc 500]]
The server answers with a ServerHello. [[slnc 300]] It chooses T L S one point three, and adds its own temporary key. [[slnc 500]]
Now each side mixes its own private key with the other's public key, and both get the same secret. [[slnc 300]] From the rose line on, there are keys. [[slnc 500]]
Record type twenty is a leftover, for old boxes on the network. [[slnc 300]] Type twenty three is encrypted: the certificate, the proof that the server holds its private key, and Finished. [[slnc 500]]
On the right, the cipher suite, part by part. [[slnc 300]] A E S with a two hundred fifty six bit key, in G C M mode, and S H A three eighty four to make the keys.
"""
speech = """
The program's output. [[slnc 400]] Before the keys: the two hellos, record type twenty two, in the clear. [[slnc 300]] The site name is readable. [[slnc 300]] Then the chosen protocol, and cipher suite. [[slnc 500]]
After the keys: the record types each side sent. [[slnc 300]] The certificate is not readable. [[slnc 300]] And the keys themselves were never sent.
[[page]]
Part two. [[slnc 400]] What the record types mean. [[slnc 300]] Twenty two, handshake. [[slnc 300]] Twenty, change cipher spec. [[slnc 300]] Twenty three, encrypted. [[slnc 500]]
And the cipher suite, part by part.
"""
rows = { hello = "active amber", keys = "active ok" }
console = [
    ["BEFORE THE KEYS (the two hellos, in the clear):", "ok"],
    ["  client sends  ClientHello, record type 22", "muted"],
    ["  the site name shop.example.test readable: true", "muted"],
    ["  server sends  ServerHello, record type 22", "muted"],
    ["  chosen        TLSv1.3, TLS_AES_256_GCM_SHA384", "muted"],
    ["AFTER THE KEYS (the rest of the handshake, encrypted):", "bad"],
    ["  record types from the client  22 20 23", "muted"],
    ["  record types from the server  22 20 23 23", "muted"],
    ["  the certificate readable: false  <- ENCRYPTED", "bad"],
    ["  the keys themselves were never sent", "muted"],
    ["---", ""],
    ["WHAT THE RECORD TYPES MEAN:", "amber"],
    ["  22  handshake, in the clear", "muted"],
    ["  20  change cipher spec, kept only for old boxes", "muted"],
    ["  23  encrypted: the rest of the handshake, then data", "muted"],
    ["THE CIPHER SUITE, PART BY PART:", "amber"],
    ["  TLS        the protocol", "muted"],
    ["  AES 256    the cipher, with a 256-bit key", "muted"],
    ["  GCM        the mode: encrypts and adds a tag", "muted"],
    ["  SHA384     the hash that makes the keys", "muted"],
]

[[act]]
title = "Who is on the other end"
summary = "The client asks for shop.example.test and trusts one certificate, fingerprint 0ded3842d38b01a7; the shop works, an impostor with the same name but fingerprint b72122451fcf2531 is refused, and the shop is refused when the client asked for another name."
detail = """
Before the handshake the client knows two things: the name it asks for, shop.example.test, and the one certificate it trusts, whose SHA-256 fingerprint starts 0ded3842d38b01a7. After the handshake, three servers have answered. The shop presents that certificate, and the name matches: it works.
An impostor presents a certificate with the same name but another fingerprint, b72122451fcf2531, which the client does not trust: refused. The shop again, but the client asked for other.example.test: the certificate is trusted, but the name does not match, so it is refused too.
A name alone proves nothing; a certificate proves a key belongs to a name only because someone the client trusts vouched for it.
"""
figure = "identity_checks"
figure_title = "Who answered? Two checks on every certificate"
figure_speech = """
The client knows two things before it starts. [[slnc 300]] The name it asks for. [[slnc 300]] And the one certificate it trusts, shown by the first bytes of its S H A two five six fingerprint. [[slnc 500]]
Three servers answer. [[slnc 400]] The shop: its certificate is trusted, and the name matches. [[slnc 300]] It works. [[slnc 500]]
An impostor: the same name, but another fingerprint. [[slnc 300]] Not trusted, so it is refused. [[slnc 500]]
The shop again, but the client asked for another name. [[slnc 300]] Trusted, but the name does not match, so it is refused too. [[slnc 500]]
A name alone proves nothing.
"""
speech = """
The program's output. [[slnc 400]] Before the handshake: the name the client asks for, and the certificate it trusts. [[slnc 500]]
After the handshake: the shop works. [[slnc 300]] The impostor is refused. [[slnc 300]] And the wrong name is refused. [[slnc 500]]
The client must trust the certificate, not just read the name in it.
"""
rows = { identity = "active ok" }
console = [
    ["BEFORE THE HANDSHAKE (what the client knows):", "ok"],
    ["  asks for  shop.example.test", "muted"],
    ["  trusts    one certificate, SHA-256 0ded3842d38b01a7", "muted"],
    ["AFTER THE HANDSHAKE (three servers answer):", "bad"],
    ["  1. the shop, certificate 0ded3842d38b01a7", "muted"],
    ["     works: true", "muted"],
    ["  2. an impostor, same name, certificate b72122451fcf2531", "muted"],
    ["     works: false  <- NOT TRUSTED", "bad"],
    ["  3. the shop, but the client asked for other.example.test", "muted"],
    ["     works: false  <- THE NAME MUST MATCH", "bad"],
    ["a name alone proves nothing: the client must trust the certificate", "amber"],
]

[[act]]
title = "Protecting the data"
summary = "The same order gives different bytes in two connections and opens untouched; one bit flipped in byte 36 of 72 is refused with (bad_record_mac) Tag mismatch; keys from temporary key pairs give forward secrecy."
detail = """
Before sending, the order. After sending, the same order in two connections gives different bytes on the wire, because each connection has fresh keys, and untouched the server opens the record and gets the order back.
Before the check, an attacker flips one bit, byte 36 of 72, xor 01. After the check, the server, which recomputes the tag with its key, refuses the record: (bad_record_mac) Tag mismatch. So TLS protects integrity as well as secrecy.
Because the keys of each connection come from temporary key pairs, a stolen server key cannot open recorded traffic. This is called forward secrecy.
"""
figure = "tamper_check"
figure_title = "One flipped bit, and the tag check"
figure_speech = """
First, the same order sent in two connections. [[slnc 300]] The bytes on the wire differ, because each connection has fresh keys. [[slnc 300]] Untouched, the server opens it and gets the order back. [[slnc 500]]
Now an attacker flips one bit, in byte thirty six of seventy two. [[slnc 300]] The attacker has no key, so cannot make a new tag. [[slnc 500]]
The server decrypts, recomputes the tag with its key, and compares. [[slnc 300]] They differ. [[slnc 300]] The record is refused: bad record M A C, tag mismatch. [[slnc 500]]
So T L S protects integrity, as well as secrecy.
"""
speech = """
The program's output. [[slnc 400]] Before sending: the order. [[slnc 300]] After sending: different bytes in two connections, and the server gets the order back. [[slnc 500]]
Before the check: one bit flipped. [[slnc 300]] After the check: refused. [[slnc 500]]
And the keys come from temporary key pairs, so a stolen server key cannot open recorded traffic. [[slnc 300]] This is called forward secrecy.
"""
rows = { records = "active ok" }
console = [
    ["BEFORE SENDING (the order):", "ok"],
    ["  card=4111111111111111&order=A-1001", "muted"],
    ["AFTER SENDING (the record, in two connections):", "bad"],
    ["  the same bytes on the wire both times: false  <- FRESH KEYS", "bad"],
    ["  the server opens it, and gets the order back: true", "muted"],
    ["BEFORE THE CHECK (an attacker flips one bit):", "ok"],
    ["  byte 36 of 72, xor 01", "muted"],
    ["AFTER THE CHECK (the server checks the tag):", "bad"],
    ["  refused, (bad_record_mac) Tag mismatch  <- CHANGE SEEN", "bad"],
    ["fresh keys come from temporary key pairs, made per connection,", "amber"],
    ["so a stolen server key cannot open recorded traffic", "amber"],
]

[[act]]
title = "Settings, and the bill"
summary = "Against a default server, a client offering only TLSv1 is refused and TLSv1.2 agrees TLSv1.2; against a server that requires TLS 1.3, TLSv1.2 is refused and TLSv1.3 works; the bill is certificates, a round trip, and what still shows."
detail = """
Before tightening, against a default server: a client that offers only TLSv1 is refused, because old versions are switched off, and a client that offers only TLSv1.2 connects and agrees TLSv1.2. After tightening, the server requires TLS 1.3: the TLSv1.2 client is refused and a TLSv1.3 client connects.
The bill: certificates must be obtained, renewed and kept safe, the handshake costs a round trip and some computing, TLS protects the connection but not the ends, and the site name and the message sizes still show.
"""
figure = "version_matrix"
figure_title = "Which versions connect, and the bill"
figure_speech = """
Before tightening, a default server. [[slnc 300]] A client that offers only T L S one point zero is refused. [[slnc 300]] Old versions are off. [[slnc 300]] A client that offers one point two still connects, and agrees one point two. [[slnc 500]]
After tightening, the server requires one point three. [[slnc 300]] Now the one point two client is refused, and a one point three client connects. [[slnc 500]]
And the bill. [[slnc 300]] Certificates must be obtained, renewed and kept safe. [[slnc 300]] The handshake costs a round trip. [[slnc 300]] T L S protects the connection, not the ends. [[slnc 300]] And the site name and message sizes still show.
"""
speech = """
The program's output. [[slnc 400]] Before tightening: one point zero is refused, and one point two works. [[slnc 500]]
After tightening: one point two is refused, and one point three works. [[slnc 500]]
And the bill, in four lines.
"""
rows = { settings = "active amber" }
console = [
    ["BEFORE TIGHTENING (a default server):", "ok"],
    ["  client offers TLSv1    works: false  <- OLD VERSIONS ARE OFF", "bad"],
    ["  client offers TLSv1.2  works: true, agreed TLSv1.2", "muted"],
    ["AFTER TIGHTENING (the server requires TLS 1.3):", "bad"],
    ["  client offers TLSv1.2  works: false", "muted"],
    ["  client offers TLSv1.3  works: true, agreed TLSv1.3", "muted"],
    ["THE BILL:", "amber"],
    ["  certificates must be obtained, renewed and kept safe", "muted"],
    ["  the handshake costs a round trip and some computing", "muted"],
    ["  TLS protects the connection, not the ends", "muted"],
    ["  the site name and the message sizes still show", "muted"],
]

