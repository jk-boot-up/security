kind = "bullets"
title = "Who Does What"
body = ["Connection: two real TLS engines", "Wire: what a sniffer would see", "TestCertificates: the shop and an impostor", "TlsDemo: the five acts"]
narration = """Here is who does what in the code. [[slnc 400]] The connection class wires two real T L S engines together in memory. [[slnc 500]] The wire class records what a sniffer would see. [[slnc 500]] The test certificates class loads the shop's certificate, and an impostor's. [[slnc 500]] And the demo runs the five acts."""

[[scene]]
key = "11-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["The padlock and https://", "\"Your connection is not private\"", "minimum TLS version settings", "curl -v output"]
narration = """You have probably met this already. [[slnc 400]] The padlock in a browser, and https at the start of an address. [[slnc 500]] The warning, your connection is not private. [[slnc 500]] Settings called minimum T L S version, in load balancers. [[slnc 500]] And the output of curl with the verbose option, which shows the handshake."""

[[scene]]
key = "12-verdict"
kind = "bullets"
title = "How To Use It"
body = ["TLS on every connection", "Modern versions only", "Verify the certificate and the name", "Renew certificates automatically", "Know what TLS does not hide"]
narration = """So, how do you use it? [[slnc 400]] Use T L S on every connection. [[slnc 500]] Allow modern versions only. [[slnc 500]] Verify the certificate, and the name. [[slnc 500]] Renew certificates automatically, and protect their private keys. [[slnc 500]] And remember what T L S does not hide."""

[[scene]]
key = "13-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Make the client trust both", "certificates and see what happens."]
narration = """That's the T L S handshake. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] T L S lets two strangers agree on secret keys in public, check who the server is, and protect every record, while the site's name and the sizes of messages stay visible. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine, with nothing installed except a Java development kit. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Make the client trust both certificates, and see what happens. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"""

[threatmodel]
scope = """
The connection between a customer's client and an online store's server: the handshake, the certificate check, the keys and the records. It covers an attacker who can listen to, record, change and inject traffic, and one who can run a server of their own
with a certificate of their own. It does not cover the endpoints, the certificate authorities, or the web application on top.
"""
assets = [
    "The content of orders, such as card numbers.",
    "The integrity of the records.",
    "The server's private key.",
    "The client's belief about who it is talking to.",
]
actors = [
    "The customer's client.",
    "The store's server.",
    "A passive attacker who records traffic.",
    "An active attacker who can change traffic or pose as the server.",
]
boundaries = [
    "Client to server across the internet: every record crosses it.",
    "Server to its private key: the key never crosses the network.",
]
assumptions = [
    "The client trusts only certificates it was configured to trust.",
    "The server's private key stays secret.",
    "In the demo, the keys and certificates are test values in the repository.",
]
out_of_scope = [
    "Certificate authorities and revocation: the next project.",
    "Attacks on the endpoints.",
    "Side channels in the implementation.",
]
tests = [
    "`HandshakeTest` checks the agreed protocol, the record types, the readable hello, data round trips, every changed byte of a record, untrusted certificates, wrong names, and protocol versions.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next project, certificates-and-chain-of-trust, looks at who vouches for a key, and how a chain of certificates is checked.
"""

[[threat]]
id = "T1"
stride = "I"
threat = "A passive attacker records traffic and reads the order"
where = "`Connection`, `Wire`"
control = "Records are encrypted with keys agreed in the handshake"
residual = "The site name, sizes and timing still show"

[[threat]]
id = "T2"
stride = "S"
threat = "An attacker poses as the store with a certificate of their own or one for another name"
where = "`TestCertificates`, `Connection`"
control = "The client trusts only configured certificates and checks the name"
residual = "A wrongly issued certificate from a trusted authority would be accepted"

[[threat]]
id = "T3"
stride = "T"
threat = "An attacker changes a record in transit"
where = "`Connection.serverOpens`"
control = "Every record carries an authentication tag, and a changed record is refused"
residual = "The attacker can still drop the connection"

[[threat]]
id = "T4"
stride = "I"
threat = "The server's private key is stolen"
where = "the server's keystore"
control = "Fresh keys per connection give forward secrecy for recorded traffic"
residual = "The thief can impersonate the server until the certificate is replaced"

[[threat]]
id = "T5"
stride = "T"
threat = "An attacker pushes the connection down to an old, weak protocol version"
where = "`Connection`, protocol settings"
control = "Old versions are switched off, and modern versions protect the negotiation"
residual = "Servers that still allow old versions can be attacked"
