[[diagram]]
name = "threat-model-diagram"
kind = "flow"
title = "Threat model: trust boundaries and threats"
caption = "Dashed boxes are trust boundaries. Rose tags show where each threat in the table applies."
zones = [
    { label = "Developer", nodes = ["dev"], colour = "red" },
    { label = "Platform", nodes = ["shared"], colour = "green" },
]
nodes = [
    { id = "dev", label = "Developer", sub = "commits, may skip hooks", col = 0, row = 0, colour = "red", threats = ["T1", "T3"] },
    { id = "shared", label = "Shared repo", sub = "pre-receive hook", col = 1, row = 0, colour = "accent", threats = ["T2"] },
