[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a rule for database", "URLs with a password, and measure it."]
narration = "That's secret scanning. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] A secret in the history is leaked for good, so scan the history, block the next one on the server, and revoke before you clean up. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a rule to the small scanner for database U R Ls with a password, and measure it. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"


[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] git and gitleaks do the real work; the classes plant the truth, scan, and score. [[slnc 300]] Here are the ones that matter."""

[[class]]
name = "Planted"
what = "each planted string, and the truth about it"
[[class.part]]
title = "a value, and whether it is real"
code = """
public record Planted(String id, String value, boolean real) {
...
boolean in(String text) {
    return text.contains(value) || text.contains(base64());
"""
speech = """Each string has a name, a value, and the truth: a real secret, or a look-alike. [[slnc 300]] A finding counts for it when the reported text holds the value, as it is or in base64."""

[[class]]
name = "Detector"
what = "a small scanner: patterns, a password rule, and entropy"
[[class.part]]
title = "pattern rules"
code = """
new Rule("payment-live-key", Pattern.compile("sk_live_[A-Za-z0-9]{20,}")),
...
new Rule("password-assignment", Pattern.compile("(?i)(?:password|passwd|secret)\\\\s*[=:]\\\\s*(\\\\S{6,})")));
"""
speech = """A pattern rule knows the shape of one kind of key, like a payment key's prefix. [[slnc 300]] The password rule looks for the word password and a value, which is how it finds the short database password."""
[[class.part]]
title = "entropy, and every line ever added"
code = """
h -= p * Math.log(p) / Math.log(2);
...
if (!alreadyNamed && entropy(word) >= THRESHOLD) {
...
for (String line : repo.must("log", "--all", "-p", "--format=commit %H", "-U0").split("\\n")) {
"""
speech = """A long word with no rule is measured: four point two bits per character or more, and it is flagged. [[slnc 300]] To scan the history, the detector reads git log with patches, every line any commit added."""

[[class]]
name = "EntropySteps"
what = "a teaching class: entropy worked out in groups"
[[class.part]]
title = "k characters seen c times in n"
code = """
byTimes.forEach((times, k) -> {
    double p = (double) times / n;
    groups.add(new Group(k, times, n, k * p * Math.log(1 / p) / Math.log(2)));
"""
speech = """Characters that appear the same number of times add the same share, so they are added as one group. [[slnc 300]] A test proves the groups add up to the detector's own entropy."""

[[class]]
name = "Gitleaks"
what = "one pinned gitleaks release, checked and run"
[[class.part]]
title = "the download is checked"
code = """
if (!actual.equals(SHA256.get(asset))) {
...
command.addAll(List.of("--no-banner", "-l", "fatal", "--report-format", "json", "--report-path", report.toString()));
"""
speech = """gitleaks' rules decide the output, so the demo downloads one release, and refuses it unless its S H A two fifty six matches. [[slnc 300]] Each run writes a jay son report, which the class reads."""

[[class]]
name = "Score"
what = "found, missed and flagged, against the truth"
[[class.part]]
title = "compare findings with what was planted"
code = """
List<Planted> found = Planted.realOnes().stream().filter(p -> hit(p, findings)).toList();
...
List<Planted> alarms = Planted.ALL.stream().filter(p -> !p.real() && hit(p, findings)).toList();
...
return ratio(found.size(), found.size() + falseAlarms.size());
"""
speech = """A real secret with a finding is found; a look-alike with a finding is a false alarm. [[slnc 300]] Precision divides the secrets found by everything flagged."""

