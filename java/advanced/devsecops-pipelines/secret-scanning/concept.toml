[poster]
headline = [["SECRET", "text"], ["SCANNING", "accent"]]
taglines = [["Entropy by hand, history scans, allowlists, baselines and hooks", "gold"]]
before = { code = "files now: 2 of 5 secrets", note = "Files now", tag = "BEFORE" }
after = { code = "whole history: 5 of 5", note = "History", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "Secret Scanning"
narration = "Hello, and welcome. [[slnc 400]] This video explains secret scanning, with gitleaks. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A secret is a key, a password, or a token that grants access. [[slnc 300]] Secret scanning looks for them in the code, and in the whole git history, before an attacker does. [[slnc 300]] A secret committed once stays in the history, even after the file is removed. [[slnc 600]] Think of a bank vault code written on a sticky note: throwing the note away does not help if someone photocopied it. [[slnc 300]] Change the code. [[slnc 600]] Our example is a bank."

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["A bank's git repository of 5 commits holds", "5 real secrets and 4 look-alikes,", "and a clean-up commit removes two files.", "", "Two scanners are measured against that truth:", "a small one written in Java, and gitleaks."]
narration = "Here is the scenario. [[slnc 400]] A bank's git repository grows over five commits. [[slnc 300]] It holds five real secrets, and four look-alikes that are not secrets, such as a key from the documentation. [[slnc 500]] A later commit removes two of the files. [[slnc 500]] Two scanners are measured against that truth: a small one written in Java, with patterns and an entropy check, and gitleaks."

[[scene]]
key = "02-words"
kind = "bullets"
title = "The Words"
body = ["Secret: a key, password or token that grants access", "Look-alike: a string that looks like one, but is not", "Pattern rule: a known shape, like sk_live_", "Entropy: how random a string looks, in bits", "History: every line any commit ever added", "Hook: a script git runs before a commit or a push"]
narration = """Before the demos, the words. [[slnc 500]] A secret is a key, a password, or a token that grants access. [[slnc 500]] A look-alike is a string that looks like a secret, but is not one, such as a checksum or a key from the documentation. [[slnc 500]] A pattern rule looks for a known shape, like the prefix of a payment key. [[slnc 500]] Entropy measures how random a string looks, in bits per character. [[slnc 500]] The history is every line any commit ever added. [[slnc 500]] And a hook is a script that git runs before a commit, or before it accepts a push."""

[[scene]]
key = "02-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "02-still"
kind = "figure"
title = "A removed key, still in the history"
body = "still_in_history"
narration = """Let's see the core idea on one example: the payment key. [[slnc 400]] At the top, the input: five commits of the bank's repository. [[slnc 700]]
Commit one adds the payment key to a properties file. [[slnc 300]] Commit four removes it again. [[slnc 300]] The rose line is how long the key sits in the history: from commit one on, for good. [[slnc 700]]
At the bottom, the result. [[slnc 300]] On the left, the files now: no payment key. [[slnc 300]] A scan of the files would say all is well. [[slnc 500]] On the right, a fresh clone. [[slnc 300]] It still holds the key, because every clone carries the whole history. [[slnc 600]]
So a removed key is still a leaked key. [[slnc 300]] Revoke it first, then clean up."""

[[scene]]
key = "03-acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "04-costs"
kind = "bullets"
title = "What It Costs"
body = ["Every scanner misses some and flags some", "Allowlists and baselines need upkeep", "A hook on the laptop can be skipped", "Removing a key does not remove it", "  from the history: revoke it first"]
narration = "Nothing is free. [[slnc 400]] Here is what it costs. [[slnc 500]] Every scanner misses some secrets and flags some look-alikes. [[slnc 500]] Allowlists and baselines need upkeep, or they hide real leaks. [[slnc 500]] A hook on the laptop can be skipped with no verify. [[slnc 500]] And removing a key does not remove it from the history: every clone still holds it. [[slnc 300]] Revoke the key first, then clean up."

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["BankRepo, Git: build the bank's repository", "Planted: each string, and whether it is a secret", "Detector: the small scanner written in Java", "EntropySteps: entropy, worked out in steps", "Gitleaks: runs the pinned gitleaks", "Score, Finding: what each scanner got right", "SecretScanningDemo: runs the demos"]
narration = "Here is who does what in the code. [[slnc 400]] BankRepo and Git build the bank's repository, commit by commit. [[slnc 500]] Planted is each string put in it, with the truth: a real secret, or a look-alike. [[slnc 500]] Detector is the small scanner written in Java, and EntropySteps works its entropy out in steps. [[slnc 300]] Gitleaks downloads one pinned release of gitleaks, and runs it. [[slnc 500]] Score and Finding record what each scanner got right and wrong. [[slnc 300]] And SecretScanningDemo runs the demos."

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["An e-mail: a secret was detected in your push", "A .env file in a pull request", "A key starting AKIA in a config file", "git log -p showing a deleted password"]
narration = "You have probably met this already. [[slnc 400]] An e-mail saying a secret was detected in your push is secret scanning on the server. [[slnc 500]] A dot env file in a pull request is a leak about to happen. [[slnc 500]] A key starting with A K I A in a config file is a cloud access key. [[slnc 500]] And git log, showing a password in a deleted file, is why the history matters."

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Scan the whole history, not just the files", "Allowlist look-alikes; baseline the known", "A pre-commit hook, and a pre-receive hook", "A leaked key: revoke it first", "Keep secrets in a vault, not in the repository"]
narration = "So, how do you use it? [[slnc 400]] Scan the whole history, not just today's files. [[slnc 500]] Allowlist the look-alikes, and baseline the known findings, so only a new leak fails the build. [[slnc 500]] Use a pre-commit hook on the laptop, and a pre-receive hook on the shared repository, which cannot be skipped. [[slnc 500]] When a key leaks, revoke it first. [[slnc 300]] And keep secrets in a vault, not in the repository."

