[[act]]
title = "Blocking a secret before it is shared"
summary = "A pre-commit hook on the laptop runs gitleaks on what is staged, and a pre-receive hook on the shared repository runs it on each push. A clean first push is accepted. A commit with the payment key is refused by the pre-commit hook (1 commit); with --no-verify it is made (2 commits); its push is rejected by the pre-receive hook (1 commit on the server). With the key taken out, a clean change is accepted (2 commits on the server)."
detail = """
The hooks: pre-commit on the laptop scans what is staged; pre-receive on the shared repository scans each push. Both run gitleaks.
The input: a commit that adds the payment key to app.properties. With the pre-commit hook it is refused, and the laptop has 1 commit; with --no-verify it is made, and the laptop has 2.
The result: the push of that commit is rejected by the pre-receive hook, and the server keeps 1 commit. After the key is taken out, a clean change is accepted and the server has 2 commits.
"""
figure = "hooks"
figure_title = "A key stopped on the laptop, and again on the server"
figure_speech = """
Fifth demo: blocking a secret before it is shared. [[slnc 400]] On the left, the laptop, with a pre-commit hook that scans what is staged. [[slnc 300]] A commit with the payment key is refused. [[slnc 300]] But no verify skips the hook, and the commit is made. [[slnc 700]]
On the right, the shared repository, with a pre-receive hook that scans every push. [[slnc 300]] The push of that commit is rejected, and the server keeps one commit. [[slnc 700]]
A hook on the laptop is a convenience. [[slnc 300]] The hook on the server is the one that cannot be skipped.
"""
speech = """
Here is the real output. [[slnc 400]] The two hooks, and a clean first push, accepted. [[slnc 400]] The commit with the payment key: refused by the hook, then made with no verify. [[slnc 400]] Its push: rejected by the server. [[slnc 300]] And after the key is taken out, a clean change is accepted.
"""
