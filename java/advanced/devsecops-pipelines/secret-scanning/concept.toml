# concept.toml: everything about this project that is not Java code.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "secret-scanning"
level = "advanced"
module = "devsecops-pipelines"
title = "Secret Scanning"
short_title = "Secret Scanning"
package = "secretscan"
main_class = "SecretScanningDemo"
tagline = "Find a bank's secrets in the files and in the whole git history, compare a scanner you write with gitleaks, and block the next secret before it leaves the laptop"
bold = "A bank's repository of 5 commits holds 5 real secrets and 4 look-alikes; a scan of the files now finds 2 of the 5 and a scan of the whole history finds 4 with gitleaks and 5 with a small scanner written in Java, and each gets something wrong (gitleaks misses a database password and flags a test key, the small scanner flags a documentation key and the same test key); an allowlist for documentation and fixtures leaves no look-alike flagged, and a baseline report reduces 7 findings to 1 new one; a pre-commit hook refuses a commit with a key, --no-verify gets around it, and a pre-receive hook on the shared repository rejects the push; and a fresh clone still holds a key that a later commit removed, so the key must be revoked."
domain = "a bank"
domain_note = ""
youtube_description = "Secret scanning for a bank's git repository: a scanner written in Java next to gitleaks, files now versus the whole history, look-alikes and misses, an allowlist and a baseline, a pre-commit hook, a pre-receive hook and why a removed key must still be revoked."
thumb_lines = ["SECRET", "SCANNING"]
thumb_code = "payment.key=sk_live_51Hq3..."
youtube_title = "Secret Scanning: Gitleaks, Git History, Pre-Commit and Pre-Receive Hooks"
youtube_tags = ["secret scanning", "gitleaks", "git history", "pre-commit hook", "pre-receive hook", "leaked credentials", "devsecops", "shift left", "entropy", "java"]

[readme]
intro = """
A secret committed once is in the repository for good: removing the file removes it from the files, not from the history, and every clone carries the history. This project builds a bank's git repository in five commits with **5 real secrets and 4 look-alikes** planted in it, and measures two scanners against that truth: a small one written in Java (patterns and an entropy check) and **gitleaks**. A Java program drives the real `git` and `gitleaks` command lines (`brew install gitleaks`); the demo is tagged `integration`: `./gradlew integrationTest`.

What it shows:
- **Files now or the whole history.** The files at HEAD hold 2 of the 5 secrets; the whole history holds all 5. gitleaks finds **4**, the small scanner **5**.
- **Misses and false alarms.** gitleaks misses a database password (low entropy) and flags a test key; the small scanner flags a documentation key and the same test key. Neither is right about everything.
- **An allowlist and a baseline.** An allowlist for documentation and fixtures removes the look-alikes; a baseline turns **7 findings** into **1 new** one.
- **Blocking.** A pre-commit hook refuses a commit with a key, `--no-verify` skips it, and a pre-receive hook on the shared repository still rejects the push.
- **The bill.** A fresh clone still holds a key that a later commit removed: revoke first, then clean up.

**Maps to:** OWASP Top 10 A02 Cryptographic Failures and A07 · NIST SSDF PS.1 · CIS Software Supply Chain · MITRE ATT&CK T1552 Unsecured Credentials.
"""
analogy = """
A house key left in a hotel room drawer. Taking it out of the drawer today does not help the guests who already copied it. The only fix is to change the lock, and the next best thing is a front desk that stops the key from being left there.
"""
scenario = """
A bank's payments team has committed keys and passwords over the years, and cleaned some of them up. The demo builds such a repository, scans it in several ways and then tries to commit and push one more.
"""
costs = [
    "**Every scanner misses and flags,** so a person reads the results.",
    "**A hook on a laptop can be skipped,** so the check must also run on the server.",
    "**A key found in history has to be revoked,** which can break production.",
    "**An allowlist can hide a real secret.**",
    "**Scanning the whole history takes longer** than scanning a diff.",
]
too_much = """
A private repository with one developer and no cloud keys can rely on a pre-commit hook alone. A scan of the whole history is for the day a repository becomes shared, public or audited.
"""
met_before = [
    "A password in application.properties \"for now\".",
    "A key removed by a commit that is still in the log.",
    "A hook that everyone skips with --no-verify.",
    "A scanner that nobody has measured.",
]
where = """
This project is part of the [devsecops-pipelines](..) module, which lets a pipeline stop what a person misses. The keys it finds are the ones the [kubernetes-secrets](../../kubernetes-and-container-security/kubernetes-secrets) project keeps out of the cluster.
"""
twin = """
The git repositories and the gitleaks runs are real. The keys are made-up strings in the shapes of real ones, and none of them opens anything. The demo prints counts and names, never hashes or paths.
"""
test_note = "The detector and the scoring are tested with no tools. The demo runs git and gitleaks (./gradlew integrationTest)."

[[act]]
title = "The history is the repository"
summary = "The files now hold 2 of the 5 secrets; the whole history holds all 5."
detail = """
The bank's repository has 5 commits. Two files with keys were deleted by a later commit. A scan of the files at HEAD finds 2 of the 5 real secrets, and a scan of every line ever added finds them all with the small scanner and 4 with gitleaks.
"""
speech = """
First demo: the history is the repository. [[slnc 400]] Scan the files and you find two of five secrets. [[slnc 600]] Scan the history and you find four or five.
"""
rows = { history = "active wrong" }
console = [
    ["own scanner, files now: 2 of 5", "bad"],
    ["own scanner, all history: 5 of 5", "ok"],
    ["gitleaks, all history: 4 of 5", "ok"],
]

[[act]]
title = "What each one gets wrong"
summary = "gitleaks misses a database password and flags a test key; the small scanner flags a documentation key and the same test key."
detail = """
Four look-alikes are planted: a key in the documentation, a checksum, a test key in a fixture and an identifier. The small scanner flags the documentation key and the test key. gitleaks flags the test key and misses the database password, which has too little entropy.
"""
speech = """
Second demo: what each one gets wrong. [[slnc 400]] Every scanner misses something and flags something. [[slnc 600]] Measure yours against secrets you planted.
"""
rows = { wrong = "active ok" }
console = [
    ["gitleaks misses: database password", "bad"],
    ["gitleaks flags: test key of a fixture", "bad"],
    ["own scanner flags: documentation key, test key", "bad"],
]

[[act]]
title = "An allowlist and a baseline"
summary = "An allowlist removes the look-alikes, and a baseline turns 7 findings into 1 new one."
detail = """
An allowlist for the documentation folder and test resources leaves 4 of 5 real secrets found and no look-alike flagged. A report of the 7 findings saved as a baseline lets the next run report only the 1 new token, with exit code 1 so the build fails on it.
"""
speech = """
Third demo: an allowlist and a baseline. [[slnc 400]] Say what is not a secret, and say what is already known. [[slnc 600]] Then only the new leak fails the build.
"""
rows = { allow = "active ok" }
console = [
    ["allowlist: 0 look-alikes flagged", "ok"],
    ["7 findings before", "ok"],
    ["baseline: 1 new, exit 1", "ok"],
]

[[act]]
title = "Blocking the next one"
summary = "A pre-commit hook refuses the commit, --no-verify skips it, and a pre-receive hook rejects the push."
detail = """
A hook that runs gitleaks on the staged changes refuses a commit with a payment key. The same commit made with --no-verify succeeds. A pre-receive hook in the shared repository scans the pushed commits and rejects the push; a clean change is accepted.
"""
speech = """
Fourth demo: blocking. [[slnc 400]] The laptop hook can be skipped. [[slnc 600]] The hook on the shared repository cannot.
"""
rows = { block = "active ok" }
console = [
    ["commit with a secret: refused", "ok"],
    ["--no-verify: made", "bad"],
    ["push of it: rejected", "ok"],
]

[[act]]
title = "The bill"
summary = "A fresh clone still holds a key that a commit removed."
detail = """
The payment key was removed from the files by a later commit and a fresh clone still holds it. Removing a file does not remove a secret: revoke the key first, then clean up. Every scanner misses and flags, and a hook on a laptop can be skipped.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] A fresh clone still holds the key. [[slnc 600]] Revoke it first, then clean up.
"""
rows = { bill = "active wrong" }
console = [
    ["a fresh clone still holds the removed key: yes", "bad"],
    ["revoke the key first", "ok"],
    ["a server hook cannot be skipped", "ok"],
]

[animation]
subtitle = "A bank's repository, scanned and guarded."
boxes = [
    ["history", "The history is the repository", "2 vs 5"],
    ["wrong", "What each one gets wrong", "misses, alarms"],
    ["allow", "An allowlist and a baseline", "7 to 1"],
    ["block", "Blocking the next one", "hooks"],
    ["bill", "The bill", "revoke"],
]

[docs.problem]
scenario = """
A bank's team has committed keys over the years and wants to find them and stop the next one.
"""
naive = """
Delete the file and hope that nobody looks at the history.
"""
deliver = [
    "A repository with planted secrets and look-alikes.",
    "A scanner written in Java and gitleaks, compared with the truth.",
    "An allowlist and a baseline.",
    "A pre-commit hook and a pre-receive hook.",
]

[docs.prerequisites]
required = [
    "Java basics",
    "git",
    "gitleaks (brew install gitleaks)",
]
not_required = [
    "A cloud account",
    "Docker",
]
install = ["git", "gitleaks"]

[docs.session]
objectives = [
    "explain why a removed secret is still in the history",
    "compare a scanner with planted secrets",
    "use an allowlist and a baseline",
    "block a secret with a client hook and a server hook",
]
walkthrough = """
Run the demo and compare the first two scans. In the second act find the secret that gitleaks misses and the look-alike that both flag.
"""
exercises = [
    "Add a rule to the small scanner for database URLs with a password and measure it.",
    "Plant a secret in a binary file and see which scanner finds it.",
    "Add a gitleaks:allow comment to the test key and see what it does.",
    "Make the pre-receive hook scan only the new commits of an existing branch.",
]

[docs.explained]
sentence = """
A secret in the history is a secret in every clone, so scan the history and revoke what you find.
"""
verdict = """
Scan the whole history once and every change after that, measure the scanner on planted secrets, keep the allowlist small, block at the client and at the server, and revoke before you clean up.
"""
recognise = [
    "A secrets file deleted in a later commit.",
    "A hook skipped with --no-verify.",
    "A scan that only reads the files at HEAD.",
    "An allowlist that grows every sprint.",
]

[spec]
purpose = """
Teach secret scanning by planting secrets in a repository and measuring scanners and hooks against what was planted.
"""
nongoals = [
    "Secret managers and rotation (see kubernetes-secrets).",
    "Rewriting history with git filter-repo.",
    "Scanning container images.",
]
problem = """
Secrets are committed by accident, removed by a later commit and forgotten, while scanners are trusted without being measured.
"""
roles = [["The planted truth", "`Planted`"], ["The repository", "`BankRepo`"], ["The scanner written here", "`Detector`"], ["gitleaks", "`Gitleaks`"], ["The scoring", "`Score`"], ["Entry point", "`SecretScanningDemo`"]]
requirements = [
    "The repository holds known real secrets and known look-alikes.",
    "Scanners are scored against the truth on files and on history.",
    "An allowlist and a baseline change the result as the demo prints.",
    "A client hook can be skipped and a server hook cannot.",
    "The demo prints the same output on every run.",
]

