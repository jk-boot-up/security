title = "Secret Scanning"
short_title = "Secret Scanning"
package = "secretscan"
main_class = "SecretScanningDemo"
tagline = "Measure entropy by hand, find a bank's secrets in the files and in the whole git history, score a scanner written in Java against gitleaks, and block the next secret with hooks"
bold = "A key in base64 matches no pattern, but its entropy, worked out by hand, is 4.707 bits per character, above the threshold of 4.2, while a hex checksum can never pass 4.0; a bank's repository of 5 commits holds 5 real secrets and 4 look-alikes, the files now hold 2 of the 5 and a fresh clone still holds a key that commit 4 removed; over the whole history a scanner written in Java finds 5 of 5 and flags 2 look-alikes (precision 71%), gitleaks finds 4 of 5 and flags 1 (precision 80%); an allowlist leaves no look-alike flagged and a baseline of 7 findings leaves 1 new one; a pre-commit hook refuses a commit with a key, --no-verify gets around it, and a pre-receive hook on the shared repository rejects the push."
domain = "a bank"
