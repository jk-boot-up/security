[readme]
intro = """
A secret committed once is in the repository for good: removing the file removes it from the files, not from the history, and every clone carries the history. This project builds a bank's git repository in five commits with **5 real secrets and 4 look-alikes** planted in it, and measures two scanners against that truth: a small one written in Java (patterns and an entropy check) and **gitleaks**. A Java program drives the real `git` and `gitleaks` 8.30.1 command lines (the pinned gitleaks release is downloaded into `build/` once and checked against its SHA-256); the demo is tagged `integration`: `./gradlew integrationTest`.

What it shows:
- **Entropy by hand.** A key in base64 matches no pattern; its entropy is worked out step by step: **4.707** bits per character, above the threshold of 4.2. A hex checksum can never pass 4.0.
- **Files now or the whole history.** The files at HEAD hold 2 of the 5 secrets; a fresh clone still holds a key that commit 4 removed.
- **Misses and false alarms.** Over the whole history the scanner written in Java finds **5 of 5** and flags 2 look-alikes; gitleaks finds **4 of 5** (it misses a short database password) and flags 1.
- **An allowlist and a baseline.** An allowlist for documentation and fixtures removes the look-alike; a baseline turns **7 findings** into **1 new** one.
- **Blocking.** A pre-commit hook refuses a commit with a key, `--no-verify` skips it, and a pre-receive hook on the shared repository still rejects the push.

**Maps to:** OWASP Top 10 (2025) A04 Cryptographic Failures and A07 Authentication Failures · NIST SSDF PS.1 · CIS Software Supply Chain · MITRE ATT&CK T1552 Unsecured Credentials.
"""
analogy = """
A house key left in a hotel room drawer. Taking it out of the drawer today does not help the guests who already copied it. The only fix is to change the lock, and the next best thing is a front desk that stops the key from being left there.
"""
scenario = """
A bank's payments team has committed keys and passwords over the years, and cleaned some of them up. The demo builds such a repository, scans it in several ways and then tries to commit and push one more.
"""
costs = [
    "**Every scanner misses and flags,** so a person reads the results.",
    "**A hook on a laptop can be skipped,** so the check must also run on the server.",
    "**A key found in history has to be revoked,** which can break production.",
    "**An allowlist can hide a real secret.**",
    "**Scanning the whole history takes longer** than scanning a diff.",
]
too_much = """
A private repository with one developer and no cloud keys can rely on a pre-commit hook alone. A scan of the whole history is for the day a repository becomes shared, public or audited.
"""
met_before = [
    "A password in application.properties \"for now\".",
    "A key removed by a commit that is still in the log.",
    "A hook that everyone skips with --no-verify.",
    "A scanner that nobody has measured.",
]
where = """
This project is part of the [devsecops-pipelines](..) module, which lets a pipeline stop what a person misses. The keys it finds are the ones the [kubernetes-secrets](../../kubernetes-and-container-security/kubernetes-secrets) project keeps out of the cluster.
"""
twin = """
The git repositories and the gitleaks runs are real. The keys are made-up strings in the shapes of real ones, and none of them opens anything. The demo prints counts, names and only the first characters of a key, never a whole key.
"""
test_note = "The detector, the entropy steps, the scoring and the verdicts are tested with no tools. The demo runs git and gitleaks 8.30.1 (./gradlew integrationTest)."

[[act]]
title = "One string, measured by hand"
summary = "The key in k8s/secret.yaml (commit 5) is base64, 44 characters, and no pattern rule matches it. Its entropy, worked out in four groups of characters (21 once, 6 twice, 2 three times, 1 five times), is 4.707 bits per character, above the threshold of 4.2. A SHA-256 checksum in hex has 16 different characters, so at most 4.000 bits; its entropy is 3.786. The detector reports the key as a high-entropy string and the checksum not at all."
detail = """
The input is the key line of k8s/secret.yaml, added in commit 5: 44 characters of base64, which hides the sk_live_ prefix, so none of the pattern rules matches it.
How the entropy is made: H is the sum of p times log2 of 1/p over the characters, with p the count divided by 44. Characters that appear the same number of times are added as one group: 21 once give 2.606, 6 twice give 1.216, 2 three times give 0.528 and 1 five times gives 0.357. H = 4.707, above the threshold of 4.2.
A look-alike: the checksum is a SHA-256 in hex, 64 characters of only 16 different symbols, so at most log2(16) = 4.000; it measures 3.786.
The result: the detector reports high-entropy-string for the key and nothing for the checksum. Decoded, the key is the payment key in a Kubernetes Secret.
"""
figure = "entropy_steps"
figure_title = "Entropy, worked out for one key"
figure_speech = """
First demo: one string, measured by hand. [[slnc 400]] At the top, the input: a key from a Kubernetes Secret file, written in base64. [[slnc 300]] Forty four characters, and no pattern rule matches it, because base64 hides the prefix. [[slnc 700]]
So the detector measures how random it looks: its entropy, in bits per character. [[slnc 300]] Characters that appear the same number of times are added as one group. [[slnc 300]] Twenty one characters appear once, and give two point six bits. [[slnc 300]] Six appear twice, and give one point two. [[slnc 300]] The last two groups add about point nine. [[slnc 500]] Added up: four point seven bits per character. [[slnc 700]]
On the right, against the threshold of four point two. [[slnc 300]] The key is above it. [[slnc 300]] A checksum in hex has only sixteen different symbols, so it can never pass four bits. [[slnc 300]] It stays below the line, and is never flagged.
"""
speech = """
Here is the real output. [[slnc 400]] The input: forty four characters of base64, and no pattern rule matches. [[slnc 400]] Then the entropy, group by group: two point six, one point two, point five, and point four. [[slnc 300]] H is four point seven, above the threshold of four point two: a secret. [[slnc 400]] The checksum: sixty four characters, but at most four bits each, and it measures three point eight.
[[page]]
What the detector reports. [[slnc 300]] The base64 key: a high entropy string. [[slnc 300]] The checksum: nothing. [[slnc 300]] Decoded, the key is the payment key, stored in a Kubernetes Secret.
"""
rows = { entropy = "active ok" }
console = [
    ["THE INPUT (k8s/secret.yaml, commit 5):", "code"],
    ["  key: c2tfbGl2ZV81MVpw... (44 characters, base64)", "muted"],
    ["  pattern rules that match it: 0 (base64 hides the prefix)", "muted"],
    ["HOW THE ENTROPY IS MADE (bits per character):", "code"],
    ["  H = the sum of p x log2(1/p), p = count / 44", "muted"],
    ["  21 characters once:     21 x 1/44 x log2(44/1) = 2.606", "muted"],
    ["  6 characters twice:     6 x 2/44 x log2(44/2) = 1.216", "muted"],
    ["  2 characters 3 times:   2 x 3/44 x log2(44/3) = 0.528", "muted"],
    ["  1 character 5 times:    1 x 5/44 x log2(44/5) = 0.357", "muted"],
    ["  H = 4.707, the threshold 4.2: a secret", "ok"],
    ["A LOOK-ALIKE (checksums.txt, a SHA-256 in hex):", "code"],
    ["  9f86d081884c7d65... (64 characters, 16 different)", "muted"],
    ["  at most log2(16) = 4.000, H = 3.786: below 4.2", "bad"],
    ["---", ""],
    ["WHAT THE DETECTOR REPORTS:", "code"],
    ["  the base64 key  high-entropy-string", "ok"],
    ["  the checksum    nothing", "bad"],
    ["  decoded, the key is sk_live_... (key in a Kubernetes Secret)", "muted"],
]

