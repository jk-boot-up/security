tagline = "A release pipeline for a bank's Gradle library with reproducible builds, cosign signatures, SLSA-style provenance and gates that fail closed, and a deploy step that refuses forged releases"
bold = "Commit 7feddf9e3682 built in two clean checkouts gives identical jars with fixed archive settings (every entry dated 1980-02-01 00:00), and different jars when the file times are kept or when build-info.properties records the build path; cosign signs the SHA-256 of the jar with an EC key of 256 bits, and both cosign and the JDK alone refuse a jar with one bit changed and a signature checked with another key; the provenance names the builder, the command, the commit and tree, build.gradle and 1 dependency, and an edited commit no longer verifies; 4 gates stop 6 of 6 planted flaws, each at its own gate (2 of 4 unit tests fail, trivy reports CVE-2022-42889 CRITICAL in commons-text 1.9, gitleaks reports an aws-access-token); 3 broken tools give no program, exit 1 and exit 1, which a pipeline that fails closed stops 3 of 3 times and one that fails open releases 3 of 3 times; deploy makes 7 checks in order, accepts the genuine release (7 of 7) and refuses a swapped jar and a foreign key at check 2 and a replayed old release at check 6, so 1 jar is in production."
domain = "a bank"
domain_note = ""
youtube_description = "A local release pipeline in Java for a bank's Gradle library: reproducible builds, cosign signatures checked again with the JDK, SLSA-style provenance, gates for secrets, dependencies, tests and signatures that fail closed when a tool is missing or crashes, and a deploy step that refuses forged releases."
