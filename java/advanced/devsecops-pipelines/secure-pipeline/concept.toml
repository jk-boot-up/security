Below, the result, jar one against jar two. [[slnc 300]] Only the fixed setting gives the same S H A two fifty six. [[slnc 300]] With file times, the five entries are the same and so are their bytes, but the times are not, so the digest differs. [[slnc 300]] With the build path, one entry holds other bytes: checkout one, against checkout two. [[slnc 600]]
A build is reproducible only when nothing about the time, or the machine, gets into the jar.
