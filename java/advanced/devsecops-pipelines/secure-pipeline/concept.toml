# concept.toml: everything about this project that is not Java code.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "secure-pipeline"
level = "advanced"
module = "devsecops-pipelines"
title = "Secure Pipeline"
short_title = "Secure Pipeline"
package = "securepipe"
main_class = "SecurePipelineDemo"
tagline = "A release pipeline for a bank's Gradle library with reproducible builds, cosign signatures, SLSA-style provenance and gates that fail closed, and a deploy step that refuses forged releases"
bold = "The same commit built in two clean checkouts gives identical jars with preserveFileTimestamps off and reproducibleFileOrder on (identical: yes), and different jars when the old settings keep file times (no) or when the build path is written into the jar (no, 1 entry: build-info.properties); cosign verifies the jar and its provenance with the public key and refuses a jar with one bit changed and a signature checked with another key; the in-toto provenance names the builder, the command, 3 inputs, the jar digest and the source commit and tree, and an edited commit no longer verifies; 4 gates (secret scan with gitleaks, dependency check with trivy on a CycloneDX bill of materials, unit tests, signature check) stop 6 of 6 planted failures, 0 let through, each at the gate that owns the flaw; 3 of 3 broken tools (gitleaks missing, gitleaks crashing, trivy without its database) stop the pipeline that fails closed and 3 of 3 are released by one that fails open; the deploy step accepts the genuine release and refuses 3 of 3 forged releases (a swapped jar, an attacker's own build and a replayed old release), so 1 jar is in production."
domain = "a bank"
domain_note = ""
youtube_description = "A local release pipeline in Java for a bank's Gradle library: reproducible builds, cosign signatures, SLSA-style provenance, gates for secrets, dependencies, tests and signatures that fail closed when a tool is missing or crashes, and a deploy step that refuses forged releases."
thumb_lines = ["SECURE", "PIPELINE"]
thumb_code = "$ cosign verify-blob --key cosign.pub"
youtube_title = "Secure Pipeline: Reproducible Builds, Signing, Provenance and Gates That Fail Closed"
youtube_tags = ["devsecops", "secure pipeline", "reproducible builds", "cosign", "slsa", "provenance", "supply chain", "gitleaks", "trivy", "fail closed", "gradle", "java"]

[readme]
intro = """
A release pipeline is the road every change takes to production, so it has to be the hardest road to cheat on. This project builds one for a small Gradle library of a bank and then tries to cheat it. The stages are driven from Java and use the real tools: **git**, **Gradle**, **gitleaks**, **trivy** and **cosign**. No Gitea or Woodpecker server is run: the stages are the same ones a Woodpecker pipeline would call, in a Java program that can measure them. The demo is tagged `integration`: `./gradlew integrationTest` (trivy needs its vulnerability database, downloaded once).

What it shows:
- **Reproducible build.** The same commit in two directories gives identical jars: **yes**. With the old archive settings: **no** (file times). With the build path written into the jar: **no** (1 entry).
- **Signing.** cosign verifies the jar and the provenance; a jar with one bit changed and a signature checked with another key both fail.
- **Provenance.** An in-toto statement with a SLSA v1 predicate: builder, command, **3** inputs, jar digest, source commit and tree.
- **Gates.** **4** gates stop **6 of 6** planted failures, each at its own gate. **3 of 3** broken tools stop a pipeline that fails closed and get past one that fails open.
- **Deploy.** The genuine release is accepted and **3 of 3** forged releases are refused.

**Maps to:** SLSA v1 (build levels and provenance) · in-toto attestation · NIST SSDF PS.1, PS.2 and PW.4 · OWASP CI/CD Security Risks · CIS software supply chain guide.
"""
analogy = """
A bank vault with a guard at every door. The guard at each door has an order: if you cannot tell whether the visitor is allowed in, the answer is no. A guard who lets people in when the phone is dead is not a guard.
"""
scenario = """
A bank keeps a small ledger library. Every release must come out of a clean build, must be signed, must say where it came from, and must pass four checks. The demo plants six failures, breaks three tools and forges three releases to see what gets through.
"""
costs = [
    "**Reproducible builds need care:** one timestamp or path in a jar is enough to break them.",
    "**Gates add minutes** to every change and tools need updating (the trivy database is large).",
    "**Fail closed stops releases** when a tool has a bad day.",
    "**Provenance is only as good as the builder** that writes it; a compromised builder signs lies.",
    "**Keys must be kept** somewhere better than a pipeline variable.",
]
too_much = """
A personal project that nobody else installs does not need signatures and provenance. Anything that other people or other machines trust and run does.
"""
met_before = [
    "A pipeline that is green because the scanner was not installed.",
    "A jar on a shared drive that nobody can trace to a commit.",
    "A hotfix built on a laptop.",
    "An old release that was valid yesterday and is replayed today.",
]
where = """
This is a project of the [devsecops-pipelines](..) module. secret-scanning, sast and dast are three of the gates; this project puts gates, signatures and provenance on one road. The signed-images idea reappears in kubernetes-admission-control, where the cluster does the verifying.
"""
twin = """
git, Gradle, gitleaks, trivy and cosign are the real tools. The pipeline is a Java program, not a Gitea and Woodpecker server, and the signing key pair is made for each run and never stored. The library, the planted flaws and the builder id are the project's own.
"""
test_note = "The verifier, the provenance, the bill of materials, the gate rules and the comparison of jars are tested with the JDK only (a JDK ECDSA key stands in for cosign). The demo runs the tools (./gradlew integrationTest)."

[[act]]
title = "Build it twice"
summary = "The same commit built in two directories gives identical jars only with fixed archive settings and no path in the jar."
detail = """
The library is cloned twice into clean directories and built with Gradle. With preserveFileTimestamps off and reproducibleFileOrder on, the two jars have the same SHA-256. With the old settings (file times kept) they differ, though the entries are the same and no content differs. With a build-info file that records the build path, one entry (build-info.properties) differs. The fix is to fix the archive settings and to put nothing about the machine in the jar. Gradle 9 does the first by default.
"""
speech = """
First demo: build it twice. [[slnc 400]] Two clean directories, one commit. [[slnc 600]] Same jar, only when nothing about the machine gets in.
"""
rows = { repro = "active ok" }
console = [
    ["fixed archive settings: identical yes", "ok"],
    ["file times kept: identical no", "bad"],
    ["build path in the jar: identical no, 1 entry", "bad"],
]

[[act]]
title = "Sign it"
summary = "cosign signs the jar and the provenance; one changed bit or another key fails verification."
detail = """
A cosign key pair is made in a temporary directory. The jar and the provenance are signed with cosign sign-blob, and cosign verify-blob checks them with the public key. A jar with one bit changed fails. A signature checked against the public key of another key pair fails. The key files are deleted at the end of the run.
"""
speech = """
Second demo: sign it. [[slnc 400]] The signature belongs to these exact bytes. [[slnc 600]] Change one bit, or use the wrong key, and it is refused.
"""
rows = { sign = "active ok" }
console = [
    ["jar signature verifies: yes", "ok"],
    ["one bit changed: no", "bad"],
    ["another key: no", "bad"],
]

[[act]]
title = "Say where it came from"
summary = "An in-toto statement with a SLSA predicate names the builder, the command, 3 inputs, the jar digest and the source."
detail = """
The provenance names the builder id, the build command (gradlew jar), 3 inputs (the source commit and tree, build.gradle and 1 dependency), and the SHA-256 of the jar as its subject. The verifier checks that the subject digest equals the jar, that the source commit equals the commit that was checked out, and that the tree matches. The provenance of the previous release names another commit, and an edited provenance no longer verifies.
"""
speech = """
Third demo: say where it came from. [[slnc 400]] The provenance names the jar, the commit and the builder. [[slnc 600]] Edit it and the signature breaks.
"""
rows = { prov = "active ok" }
console = [
    ["subject digest equals the jar: yes", "ok"],
    ["source commit equals the checkout: yes", "ok"],
    ["edited provenance verifies: no", "bad"],
]

[[act]]
title = "Gates that fail closed"
summary = "4 gates stop 6 of 6 planted failures, and 3 of 3 broken tools stop the pipeline that fails closed."
detail = """
The gates are a secret scan (gitleaks over the whole history), a dependency check (trivy on a CycloneDX bill of materials made from build.gradle), the unit tests, and a signature check. Planted: a failing test, a vulnerable dependency (commons-text 1.9), a committed secret built from fragments, an unsigned artifact, a jar altered after signing and a jar signed with an unknown key. 6 of 6 are stopped and each at the gate that owns the flaw. Then tools are broken: gitleaks missing, gitleaks crashing on its configuration and trivy without its database. A pipeline that fails closed stops in 3 of 3; one that fails open releases 3 of 3.
"""
speech = """
Fourth demo: gates that fail closed. [[slnc 400]] Six planted failures, six stopped. [[slnc 600]] A tool that cannot answer must count as no.
"""
rows = { gates = "active ok" }
console = [
    ["planted failures: 6, stopped: 6", "ok"],
    ["broken tools, fail closed: 3 of 3 stopped", "ok"],
    ["broken tools, fail open: 3 of 3 released", "bad"],
]

[[act]]
title = "Deploy only what verifies"
summary = "The deploy step accepts the genuine release and refuses 3 of 3 forged releases."
detail = """
Deploy verifies the signatures of the jar and the provenance, the digest, the builder and the source commit and tree before it copies anything. The genuine release is accepted. A jar swapped after signing is refused at the artifact signature. An attacker's own build with a matching provenance, signed with the attacker's key, is refused at the artifact signature. The genuine previous release, replayed, is refused at the source commit. One jar is in production.
"""
speech = """
Fifth demo: deploy only what verifies. [[slnc 400]] Three forgeries, three refusals. [[slnc 600]] Even a genuine old release is refused, because it names the wrong commit.
"""
rows = { deploy = "active ok" }
console = [
    ["genuine release: accepted", "ok"],
    ["forged releases: 3, refused: 3", "ok"],
    ["jars in production: 1", "ok"],
]

