[[scene]]
key = "01-poster"
kind = "poster"
title = "Secure Pipeline"
narration = "Hello, and welcome. [[slnc 400]] This video explains a secure release pipeline. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A release pipeline is the road every change takes to production, so it has to be the hardest road to cheat on. [[slnc 300]] A secure one builds the same bytes every time, signs them, says where they came from, and stops when any check cannot answer. [[slnc 600]] Think of an armoured cash van: sealed bags, a signed manifest, and a guard who refuses any bag with a broken seal. [[slnc 600]] Our example is a bank."

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["A bank's small Gradle library,", "released by a pipeline driven from Java,", "with git, Gradle, gitleaks, trivy and cosign.", "", "Then the demo tries to cheat it:", "planted flaws, broken tools, forged releases."]
narration = "Here is the scenario. [[slnc 400]] A bank has a small Gradle library: a ledger, with a fee rule and its tests. [[slnc 300]] A release pipeline, driven from Java, builds it with real tools: git, Gradle, gitleaks, trivy, and cosign. [[slnc 500]] Then the demo tries to cheat it: with six planted flaws, with three broken tools, and with three forged releases sent to the deploy step."

[[scene]]
key = "02-words"
kind = "bullets"
title = "The Words"
body = ["Reproducible: the same commit gives the same bytes", "Signature: proof that a key holder signed these bytes", "Provenance: what was built, from what, by whom", "Gate: a check a change must pass to go on", "Fail closed: no answer counts as no", "Deploy: the step that puts a jar in production"]
narration = """Before the demos, the words. [[slnc 500]] A build is reproducible when the same commit always gives the same bytes. [[slnc 500]] A signature proves that the holder of a key signed these exact bytes. [[slnc 500]] Provenance is a signed statement of what was built, from which commit, and by which builder. [[slnc 500]] A gate is a check that a change must pass to go on. [[slnc 500]] A gate fails closed when a tool that cannot answer counts as a no. [[slnc 500]] And deploy is the step that puts a jar in production."""

[[scene]]
key = "02-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "02-chain"
kind = "figure"
title = "One release, four files"
body = "release_chain"
narration = """Let's see the core idea on one example: the bank's real release. [[slnc 400]] At the top, the input: four files. [[slnc 300]] The jar, its signature, the provenance statement, and the signature of that statement. [[slnc 700]]
In the middle, how deploy ties them together. [[slnc 300]] The jar's signature must verify with the pipeline's public key. [[slnc 300]] The digest of the jar must equal the subject in the provenance. [[slnc 300]] And the provenance must name the commit that deploy wants. [[slnc 700]]
At the bottom, the result. [[slnc 300]] The release the pipeline made passes all seven checks, and is accepted. [[slnc 500]] The genuine previous release is replayed. [[slnc 300]] Its signatures are real, and its digest matches. [[slnc 300]] But it names another commit, so it is refused. [[slnc 600]]
Trust the jar only when every file agrees with every other."""

[[scene]]
key = "03-acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "04-costs"
kind = "bullets"
title = "What It Costs"
body = ["Reproducible builds need fixed archive settings", "Signing keys must be kept, and rotated", "A gate that fails closed stops releases", "  when a tool is down", "Provenance proves origin, not that the code is safe"]
narration = "Nothing is free. [[slnc 400]] Here is what it costs. [[slnc 500]] Reproducible builds need fixed archive settings, and nothing from the machine in the jar. [[slnc 500]] Signing keys must be kept safe, and rotated. [[slnc 500]] A gate that fails closed stops a release when a tool is down, and people will ask to turn it off. [[slnc 500]] And provenance proves where a jar came from, not that the code in it is safe."

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["Pipeline, Gate: the stages, and pass, fail or error", "Reproducibility: builds twice and compares", "Cosign, SignatureSteps: sign, and check with the JDK", "Provenance: what, from what, by whom", "Verifier, Deploy: accept only what verifies", "Tools, Reports: pinned tools, and what they saw"]
narration = "Here is who does what in the code. [[slnc 400]] Pipeline runs the stages, and Gate turns what a tool did into pass, fail, or error. [[slnc 500]] Reproducibility builds one commit twice and compares the jars. [[slnc 500]] Cosign signs, and SignatureSteps checks a signature again with the J D K alone. [[slnc 500]] Provenance writes the statement of where a jar came from. [[slnc 500]] Verifier and Deploy accept a release only when every check passes. [[slnc 300]] And Tools downloads the pinned tools, while Reports reads what they found."

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["A CI step marked: continue on error", "A release with a jar but no signature", "A .sig or .intoto.jsonl file next to a release", "Two builds of one tag with different checksums"]
narration = "You have probably met this already. [[slnc 400]] A step in a C I build marked continue on error is a gate that fails open. [[slnc 500]] A release with a jar but no signature cannot be checked. [[slnc 500]] A dot sig file, or an in toto file, next to a release, is a signature and provenance. [[slnc 500]] And two builds of one tag with different checksums is a build that is not reproducible."

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Make builds reproducible, and check it", "Sign the artifact and its provenance", "Gates fail closed: no answer means no", "Deploy checks it all again, commit included", "Pin the tools; keep the key out of the build"]
narration = "So, how do you use it? [[slnc 400]] Make builds reproducible, and check it by building twice. [[slnc 500]] Sign the artifact, and its provenance. [[slnc 500]] Make every gate fail closed: a tool that cannot answer counts as no. [[slnc 500]] Make the deploy step check it all again, including the commit, so an old release cannot be replayed. [[slnc 300]] And pin the versions of your tools, and keep the signing key away from the code being built."

[[scene]]
key = "12-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a forged release whose", "provenance names an untrusted builder."]
narration = "That's a secure release pipeline. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Build the same bytes every time, sign them and their origin, fail closed at every gate, and let production take only what verifies. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a fifth release whose provenance names an untrusted builder, and see which check refuses it. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"


[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] The tools do the scanning and signing; the classes run them in order, and decide. [[slnc 300]] Here are the ones that matter."""

[[class]]
name = "Pipeline"
what = "the stages of a release, one gate after another"
[[class.part]]
title = "run a gate, stop or go on"
code = """
List<String> scan = secretScanCommand(c, checkout.dir, secretReport);
Gate.Answer secrets = Gate.run(checkout.dir, scan, SECRET_FOUND);
if (!Gate.goesOn(secrets.outcome(), c.failClosed)) {
    List<String> found = Reports.gitleaks(secretReport);
    return stop("secret scan", passed, secrets, found, commit, tree);
}
passed++;
"""
speech = """Each gate runs its tool in a fresh checkout. [[slnc 300]] If the gate does not let the change go on, the pipeline stops there, with the gate's name and what the tool reported. [[slnc 300]] Otherwise it counts one more gate passed."""

[[class]]
name = "Gate"
what = "turns a tool's exit code into pass, fail or error"
[[class.part]]
title = "an error is not a pass"
code = """
if (exit == 0) {
    return Outcome.PASS;
}
return exit == foundExit ? Outcome.FAIL : Outcome.ERROR;
...
return outcome == Outcome.PASS || outcome == Outcome.ERROR && !failClosed;
"""
speech = """Exit zero passes, and the tool's own code for found fails. [[slnc 300]] Anything else, or no program at all, is an error. [[slnc 300]] A pipeline that fails closed goes on only after a pass."""

[[class]]
name = "Reproducibility"
what = "builds one commit twice and compares the jars entry by entry"
[[class.part]]
title = "other bytes, other times"
code = """
if (ea.getCrc() != eb.getCrc()) {
    differentContent.add(name);
...
if (ta != null && !ta.equals(eb.getTimeLocal())) {
    differentTimes = true;
"""
speech = """For each entry in the two jars, a different checksum means other bytes, and a different time means the file times got in. [[slnc 300]] Either one changes the digest of the whole jar."""

[[class]]
name = "SignatureSteps"
what = "a teaching class: cosign's check, redone with the JDK alone"
[[class.part]]
title = "SHA-256, then ECDSA"
code = """
Signature s = Signature.getInstance("SHA256withECDSA");
s.initVerify(publicKey(publicKey));
s.update(Files.readAllBytes(file));
return s.verify(Base64.getDecoder().decode(Files.readString(signature).strip()));
"""
speech = """The signature file is base sixty four, and cosign dot pub is a normal public key. [[slnc 300]] The J D K hashes the bytes with S H A two fifty six and checks the E C D S A signature, and it agrees with cosign on every case."""

[[class]]
name = "Provenance"
what = "the in-toto statement: what was built, from what, by whom"
[[class.part]]
title = "the commit, the tree and the subject"
code = """
sourceDigest.put("gitCommit", f.commit());
sourceDigest.put("gitTree", f.tree());
...
statement.put("_type", "https://in-toto.io/Statement/v1");
statement.put("subject", List.of(subject));
statement.put("predicateType", "https://slsa.dev/provenance/v1");
"""
speech = """The statement records the source commit and tree, and names the jar as its subject, by digest. [[slnc 300]] It is signed like the jar, so any edit breaks it."""

[[class]]
name = "Verifier"
what = "the checks in order; the first that fails is the answer"
[[class.part]]
title = "signature, digest, commit"
code = """
if (!signatures.verify(publicKey, b.jar(), b.jarSignature())) {
    return Verdict.no("artifact signature");
}
...
if (!Provenance.subjectDigest(statement).equals(Digest.sha256(b.jar()))) {
    return Verdict.no("artifact digest");
}
