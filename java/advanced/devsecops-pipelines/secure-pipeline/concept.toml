    "Write the same stages as a Woodpecker pipeline file.",
]

[docs.explained]
sentence = """
A pipeline you can trust is a build you can repeat, an artifact you can verify and gates that say no when they cannot say yes.
"""
verdict = """
Build in clean directories with fixed archive settings and compare the digests, sign the artifact and its provenance, verify both again at deploy together with the commit, and make every gate fail when its tool does not answer.
"""
recognise = [
    "A green pipeline where a scanner was never installed.",
    "A jar with no record of its source.",
    "A build that differs on every run.",
    "A check that is skipped when the tool is missing.",
]

[spec]
purpose = """
Teach a release pipeline with reproducible builds, signatures, provenance and gates that fail closed, measured on planted failures and forgeries.
"""
nongoals = [
    "Running a Gitea and Woodpecker server.",
    "Keyless signing and a transparency log.",
    "Securing the builder itself.",
]
problem = """
Releases are built wherever, checked when convenient and trusted without proof.
"""
roles = [["The stages and gates", "`Pipeline`, `Gate`"], ["Building twice and comparing", "`Reproducibility`"], ["Signing with cosign", "`Cosign`"], ["The provenance statement", "`Provenance`"], ["The bill of materials", "`Sbom`"], ["Everything checked before trust", "`Verifier`"], ["The step before production", "`Deploy`"]]
requirements = [
    "The same commit gives identical jars in two directories, and the variants that do not are shown.",
    "The artifact and its provenance are signed and verified with a key made for the run.",
    "The provenance subject equals the jar and the source equals the checked-out commit.",
    "Each planted failure stops the pipeline at its own gate.",
    "A tool that is missing or crashes stops the pipeline.",
    "Deploy accepts only a release that verifies and refuses forged ones.",
    "The demo prints the same output on every run and stores no key.",
]

