[[act]]
title = "A gate whose tool cannot answer"
summary = "Three tools are broken, each on a change with a flaw: gitleaks is missing (no program), gitleaks crashes on a configuration that is not TOML (exit 1, not 0 or 7), and trivy has an empty database (exit 1, not 0 or 3). Each answer is an ERROR. A pipeline that fails closed stops 3 of 3, at the secret scan and the dependency check; the same pipeline set to fail open releases 3 of 3 flawed changes."
detail = """
The input: three broken tools, each on a change that must be stopped. gitleaks is not installed, on the change with a committed secret. gitleaks crashes because its configuration is not TOML, on the same change. trivy has an empty database, on the change with the vulnerable library.
What each tool gave back: no program, exit 1 and exit 1. None of them is 0 (pass) or the tool's exit code for found, so the gate's outcome is ERROR every time.
The result, the same errors in two pipelines: the pipeline that fails closed stops at the secret scan, the secret scan and the dependency check: 3 of 3 stopped. The same pipeline set to fail open treats an error as a pass and releases all three flawed changes: 3 of 3 released.
"""
figure = "closed_or_open"
figure_title = "No answer must mean no"
figure_speech = """
Fifth demo: a gate whose tool cannot answer. [[slnc 400]] At the top, the input: three broken tools. [[slnc 300]] gitleaks is not installed. [[slnc 300]] gitleaks crashes, because its configuration file is broken. [[slnc 300]] And trivy has an empty vulnerability database. [[slnc 300]] Each one runs on a change with a real flaw in it. [[slnc 700]]
On the left, what the gate sees. [[slnc 300]] No program at all, then exit one, and exit one. [[slnc 300]] A pass is zero, and found has its own number, so each of these is an error. [[slnc 700]]
In the middle, a pipeline that fails closed. [[slnc 300]] An error stops it, so all three are stopped. [[slnc 500]] On the right, the same pipeline set to fail open. [[slnc 300]] An error counts as a pass, so all three flawed changes are released, and the pipeline is green. [[slnc 600]]
A gate that cannot answer must say no.
"""
