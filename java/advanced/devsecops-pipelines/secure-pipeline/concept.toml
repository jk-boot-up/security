[[act]]
title = "Sign it"
summary = "The release jar, built from commit 7feddf9e3682 after all 4 gates passed, is signed with a cosign key pair made for this run; the key is EC, 256 bits. cosign sign-blob takes the SHA-256 of the jar's bytes and signs it with ECDSA. cosign verify-blob and a small class that uses the JDK alone agree on all four checks: the jar as built yes, one bit changed no, another key no, provenance.json as built yes."
detail = """
The input: bank-ledger.jar, built from commit 7feddf9e3682, which passed all 4 gates, and a key pair made in a temporary directory for this run. The key in cosign.pub is EC, 256 bits: the curve P-256.
How the signature is made: cosign sign-blob takes the SHA-256 of all the bytes of the jar, signs that digest with ECDSA and cosign.key, and writes the signature in base64 to bank-ledger.jar.sig.
The check: cosign verify-blob, and then SignatureSteps, which redoes it with the JDK alone (SHA256withECDSA and the public key read from cosign.pub). Both say yes for the jar as built and for provenance.json, and no for the jar with one bit changed and for the signature checked with the public key of another key pair.
"""
figure = "sign_and_check"
figure_title = "A signature over one digest"
figure_speech = """
Second demo: sign it. [[slnc 400]] On the left, the input: the release jar, built from the bank's commit, and a key pair made for this run only. [[slnc 300]] Its public key is an elliptic curve key of two hundred and fifty six bits. [[slnc 700]]
Below, how the signature is made, in three steps. [[slnc 300]] First, all the bytes of the jar go into S H A two fifty six, which gives one digest. [[slnc 300]] Second, E C D S A signs that digest with the private key. [[slnc 300]] Third, the signature is written to a dot sig file, in base sixty four. [[slnc 700]]
On the right, the result, checked twice: by cosign, and by a few lines that use only the J D K. [[slnc 300]] The jar as built: yes, and yes. [[slnc 300]] Change one bit, and the digest changes, so both say no. [[slnc 300]] Check with another public key, and both say no. [[slnc 600]]
The signature belongs to these exact bytes, and to this one key.
"""
speech = """
Here is the real output. [[slnc 400]] The input: the jar, from the commit that passed all four gates, and a key pair made for this run. [[slnc 300]] The key is E C, two hundred and fifty six bits. [[slnc 400]] Then the three steps: the S H A two fifty six of the bytes, E C D S A over that digest, and the signature in base sixty four.
[[page]]
The check. [[slnc 300]] cosign and the J D K agree on every line. [[slnc 300]] The jar as built verifies. [[slnc 300]] One changed bit does not. [[slnc 300]] Another key does not. [[slnc 300]] And the provenance file, signed the same way, verifies.
"""
