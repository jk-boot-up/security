[[act]]
title = "The fixed application"
summary = "The fixed version escapes its output, binds the query to a number, sets HttpOnly and SameSite on the cookie and sends security headers. Before the fixes the logged-in scan raised 9 of 9 planted flaws (high 2, medium 3, low 3, informational 2); after them the same scan raises 0 of 9 (high 0, medium 1, low 0, informational 2). Left for a person: Absence of Anti-CSRF Tokens on /login, risk medium, confidence low."
detail = """
The fixes: the output is escaped, the query is bound to a number, the cookie has HttpOnly and SameSite, and the security headers are sent.
Before the fixes, the logged-in scan raised 9 of 9 planted flaws: high 2, medium 3, low 3, informational 2.
After the fixes, the same scan raises 0 of 9: high 0, medium 1, low 0, informational 2.
Left for a person to judge: Absence of Anti-CSRF Tokens on /login, risk medium, confidence low. The login form has no token, and a person decides whether it matters. A clean scan says only that these probes found nothing on these pages.
"""
figure = "before_after"
figure_title = "Alerts by risk, before and after the fixes"
figure_speech = """
Fifth demo: the fixed application. [[slnc 400]] At the top, the fixes: escape the output, bind the query, flag the cookie, and send the headers. [[slnc 700]]
On the left, before the fixes: nine of nine planted flaws, with two high alerts. [[slnc 300]] In the middle, after the fixes: none of them, and no high or low alerts. [[slnc 700]]
On the right, what is left: one medium alert, with low confidence. [[slnc 300]] The login form has no anti forgery token. [[slnc 300]] A scanner cannot decide if that matters. [[slnc 300]] A person does. [[slnc 300]] And a clean scan proves only that these probes found nothing on these pages.
"""
speech = """
Here is the real output. [[slnc 400]] The fixes. [[slnc 300]] Before them: nine of nine, two high alerts. [[slnc 300]] After them: none of the planted flaws, and one medium alert. [[slnc 400]] Left for a person: no anti C S R F token on the login page, risk medium, confidence low.
"""
rows = { fixed = "active ok" }
