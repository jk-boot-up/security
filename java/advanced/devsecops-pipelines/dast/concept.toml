[[act]]
title = "The application, and a passive scan"
summary = "The bank site has 9 planted flaws, 1 behind the login: 3 script flaws (/search, /account, /admin/report), 1 query flaw (/account), 2 cookie flaws (/login) and 3 missing headers (every page). A passive scan crawls and only reads the responses, sends no attacks, and finds script 0 of 3, query 0 of 1, cookie and header 5 of 5."
