[poster]
headline = [["DYNAMIC", "text"], ["ANALYSIS", "accent"]]
taglines = [["Passive, active and logged-in scans, counted against planted flaws", "gold"]]
before = { code = "no login: 8 of 9 found", note = "Anonymous", tag = "BEFORE" }
after = { code = "logged in: 9 of 9 found", note = "Logged in", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "Dynamic Analysis"
narration = "Hello, and welcome. [[slnc 400]] This video explains dynamic analysis, with OWASP ZAP. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] Dynamic analysis tests the running application from the outside, the way an attacker would. [[slnc 300]] It crawls the pages, reads the responses, and sends attack strings. [[slnc 300]] A passive scan only reads. [[slnc 300]] An active scan attacks. [[slnc 600]] Think of a building inspector who walks the corridors, against one who also tries the locks, and who only sees the floors they have a key for. [[slnc 600]] Our example is a bank."

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["A bank's web application: a search page,", "an account page, a login and an admin area.", "", "It starts with 9 planted flaws, one behind", "the login. The demo scans it three ways,", "fixes it, and scans it again."]
narration = "Here is the scenario. [[slnc 400]] A bank's web application has a search page, an account page, a login, and an admin area. [[slnc 500]] It starts with nine planted flaws: reflected script, a query built from a string, missing cookie flags, and missing security headers. [[slnc 500]] One of them is behind the login. [[slnc 500]] The demo scans it three ways, counts what each scan found against the planted flaws, then fixes the application and scans it again."

[[scene]]
key = "02-words"
kind = "bullets"
title = "The Words"
body = ["Dynamic analysis: testing the running application", "Passive scan: only reads the responses", "Active scan: sends attack strings", "Spider: the crawler that finds the pages", "Alert: a finding, with a risk and a confidence", "Planted flaw: a known flaw, to score the scan"]
narration = """Before the demos, the words. [[slnc 500]] Dynamic analysis tests the running application, from the outside. [[slnc 500]] A passive scan only reads the responses. [[slnc 500]] An active scan sends attack strings, and looks at what comes back. [[slnc 500]] The spider is the crawler that finds the pages to test. [[slnc 500]] An alert is a finding, with a risk, how bad it would be, and a confidence, how sure the scanner is. [[slnc 500]] And a planted flaw is one we put there on purpose, so we can score the scan."""

[[scene]]
key = "02-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "02-three"
kind = "figure"
title = "One site, three scans"
body = "three_scans"
narration = """Let's see the core idea first: the same bank site, scanned three ways. [[slnc 400]] Nine flaws are planted, and one of them is behind the login. [[slnc 700]]
On the left, a passive scan. [[slnc 300]] It only reads, so it finds the cookie and header flaws, and no injection. [[slnc 700]]
In the middle, an active scan without a login. [[slnc 300]] Its attacks find most script flaws and the query flaw. [[slnc 300]] But it never reaches the admin area, so it misses the flaw there. [[slnc 700]]
On the right, the same active scan, logged in. [[slnc 300]] Now it reaches every page, and finds nine of nine. [[slnc 600]]
A scanner finds only what it sends, and only where it can reach."""

[[scene]]
key = "03-acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "04-costs"
kind = "bullets"
title = "What It Costs"
body = ["A scan sees only what it can reach", "Active scans send real attacks:", "  never against production without consent", "Every alert needs a person to judge it", "A scan takes time, and a 2 GB Docker image", "A clean result is not a proof"]
narration = "Nothing is free. [[slnc 400]] Here is what it costs. [[slnc 500]] A scan sees only the pages it can reach, so without a login it never tests the admin area. [[slnc 500]] Active scans send real attacks, so never point one at a system you have no permission to test. [[slnc 500]] Every alert needs a person to judge it. [[slnc 500]] A scan takes time, and the ZAP image is about two gigabytes. [[slnc 300]] And a clean result is not a proof: it means only that this scan found nothing."

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["BankApp: the bank application, flawed and fixed", "Flaw: a planted flaw, the truth to score against", "Probe: two of ZAP's checks, redone by hand", "Zap: runs ZAP in Docker from an automation plan", "Alert: one kind of alert, with risk and confidence", "DastDemo: runs the demos"]
narration = "Here is who does what in the code. [[slnc 400]] BankApp is the bank application, in a flawed version and a fixed one. [[slnc 500]] Flaw is one planted flaw, the truth each scan is scored against. [[slnc 500]] Probe redoes two of Zap's checks by hand, with the same attack strings. [[slnc 500]] Zap runs OWASP Zap in Docker, from an automation plan: crawl, passive rules, and optionally an active scan. [[slnc 500]] Alert is one kind of alert in the report, with its risk and confidence. [[slnc 300]] And DastDemo runs the demos."

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["A ZAP report: Cross Site Scripting (Reflected)", "Cookie No HttpOnly Flag", "Content Security Policy Header Not Set", "A scan report with no pages behind the login"]
narration = "You have probably met this already. [[slnc 400]] A ZAP report line saying cross site scripting, reflected, is an active rule that worked. [[slnc 500]] Cookie no H T T P only flag, and content security policy header not set, are passive findings. [[slnc 500]] And a scan report that lists no pages behind the login is a scan that never got in."

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Run passive scans on every build", "Run active scans on a test copy, logged in", "Score the scan on flaws you planted", "Judge every alert; fix or record why not", "Keep code review and static analysis too"]
narration = "So, how do you use it? [[slnc 400]] Run a passive scan on every build: it is quick and safe. [[slnc 500]] Run active scans on a test copy, logged in, so the scan reaches every page. [[slnc 500]] Score the scan on flaws you planted, so you know what it can find. [[slnc 300]] Judge every alert: fix it, or record why not. [[slnc 500]] And keep code review and static analysis too, because a scan only finds what it can reach."

[[scene]]
key = "12-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Plant a flaw that needs", "a header, and see which scan finds it."]
narration = "That's dynamic analysis with OWASP ZAP. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] A scanner finds only what it can reach, so log it in, score it on flaws you planted, and judge every alert. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Plant a flaw that is only reached with a request header, and see which scan finds it. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"


[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] Zap does the scanning; the classes run the site, plant the truth, and count. [[slnc 300]] Here are the ones that matter."""

[[class]]
name = "BankApp"
what = "the bank site, flawed or fixed"
[[class.part]]
title = "output, escaped only when fixed"
code = """
private String out(String text) {
    if (!fixed) {
        return text;
    }
    return text.replace("&", "&amp;").replace("<", "&lt;")
            .replace(">", "&gt;").replace("\\\"", "&quot;");
"""
speech = """Every text the site writes into a page goes through out. [[slnc 300]] The flawed version returns it as it is; the fixed one escapes it, which is what stops the reflected script."""
[[class.part]]
title = "a query glued from a string, or bound"
code = """
PreparedStatement ps = db.prepareStatement("SELECT owner, balance FROM accounts WHERE id = ?");
...
rs = db.createStatement().executeQuery("SELECT owner, balance FROM accounts WHERE id = " + id);
"""
speech = """The fixed version binds the id as a number. [[slnc 300]] The flawed one glues it into the query, so three minus two reaches the database as code."""

[[class]]
name = "Flaw"
what = "a planted flaw: the alert it should raise, and where"
[[class.part]]
title = "raised when the alert is on its path"
code = """
new Flaw("reflected page in the admin area", "Cross Site Scripting (Reflected)", "/admin/report", true),
...
return alerts.stream().anyMatch(a -> a.name().startsWith(alert) && (path == null || a.on(path)));
"""
speech = """Each flaw names the alert a scanner should raise, the page, and whether it needs the login. [[slnc 300]] It counts as found only when that alert is raised on that page."""

[[class]]
name = "Probe"
what = "a teaching class: two of ZAP's checks, by hand"
[[class.part]]
title = "the same attack strings"
code = """
static final String SCRIPT = "</p><scrIpt>alert(1);</scRipt><p>";
...
static final String EXPRESSION = "3-2";
...
return answer.content().contains(SCRIPT);
...
boolean same = plain.content().equals(expression.content());
boolean another = !plain.content().equals(other.content());
return plain.status() == 200 && same && another;
"""
speech = """Probe sends Zap's own strings. [[slnc 300]] Reflected script: the string comes back unchanged. [[slnc 300]] S Q L injection: three minus two gives the page of one, and two gives another page. [[slnc 300]] A test proves both verdicts match Zap's."""

[[class]]
name = "Zap"
what = "ZAP in Docker, run from a generated plan"
[[class.part]]
title = "the session cookie, and the chosen rules"
code = """
y.append("        replacementString: session=").append(session).append("\\n");
...
y.append("        - {id: ").append(id).append(", threshold: medium, strength: medium}\\n");
"""
speech = """For a logged-in scan, a replacer rule puts the session cookie on every request. [[slnc 300]] The active scan runs only the chosen rules, so it stays short and repeatable."""
[[class.part]]
title = "a pinned image"
code = """
static final String IMAGE = "ghcr.io/zaproxy/zaproxy@sha256:5ccfff9a411743ab2615136a2edd7416bec9ce41572fa94e935df38c14adb2b6";
"""
speech = """The image is pinned by its digest, because Zap's rules decide what the demo prints."""

