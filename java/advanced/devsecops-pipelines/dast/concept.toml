    "explain why a clean scan is not a proof",
]
walkthrough = """
Run the demo and compare the anonymous scan with the logged-in scan. Find the one flaw the anonymous scan could not reach.
"""
exercises = [
    "Add a flaw that needs a header, plant it and see which scan finds it.",
    "Add the rule for path traversal to the active scan.",
    "Make the scan fail the build on any high alert.",
