narration = "Hello, and welcome. [[slnc 400]] This video explains dynamic analysis, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A small bank web application runs with 9 planted flaws, one of them behind the login; a passive ZAP scan finds the 5 cookie and header flaws and none of the 4 script and query flaws, an active scan without a login finds 2 of 3 script flaws and the query flaw and never reaches the admin page, a logged-in scan finds all 9 of 9, and the fixed application raises none of the planted flaws, with one medium alert left (no anti-CSRF token) for a person to judge. [[slnc 600]] Think of it this way. [[slnc 300]] A building inspector who tries the doors from the street. She finds the unlocked ones she can see, and only if she has a key does she walk the corridors behind the lobby. Telling her the building is clean after she tried the front doors would be an overstatement. [[slnc 700]] In this video, the domain is a bank. [[slnc 500]] By the end, you will be able to: [[slnc 300]] Tell a passive scan from an active scan. [[slnc 300]] Give a scanner a session so it reaches the pages behind a login. [[slnc 300]] Count a scan against planted flaws."

