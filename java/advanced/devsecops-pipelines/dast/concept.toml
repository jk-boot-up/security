[[act]]
title = "An active scan, without a login"
summary = "The plan adds two active rules, 40012 reflected script and 40018 SQL injection. Worked out by hand: GET /account?id=1 and id=3-2 both return Asha: 1200 while id=2 returns Ben: 300, so the database worked 3-2 out; the fixed application answers id=3-2 with status 400. The scan finds script 2 of 3, query 1 of 1, cookie and header 5 of 5; it missed the reflected page in the admin area, which it never reached."
detail = """
The plan adds the active rules 40012 (reflected script) and 40018 (SQL injection).
How the query check works, worked out by hand with the same expression ZAP sends: id=1 gives Asha: 1200; id=3-2 gives Asha: 1200 too; id=2 gives Ben: 300. The page for 3-2 is the page for 1, so the database worked the expression out: the input reached the query as code. The fixed application answers id=3-2 with status 400.
The result: script flaws 2 of 3, query flaws 1 of 1, cookie and header flaws 5 of 5. Missed: the reflected page in the admin area. The admin area was not reached.
"""
figure = "query_check"
figure_title = "Three requests, and the database doing a sum"
figure_speech = """
Third demo: an active scan, without a login. [[slnc 400]] On the left, how Zap's query check works, redone by hand. [[slnc 300]] Ask for account one: Asha, twelve hundred. [[slnc 300]] Ask for account three minus two: Asha again. [[slnc 300]] Ask for account two: Ben. [[slnc 700]]
Three minus two gave the page of one, so the database did the sum. [[slnc 300]] The input became part of the query: S Q L injection. [[slnc 300]] The fixed application refuses it with status four hundred. [[slnc 700]]
On the right, what the anonymous scan found: two of three script flaws, and the query flaw. [[slnc 300]] It missed the admin page, because it never got past the login.
"""
speech = """
Here is the real output. [[slnc 400]] The two active rules. [[slnc 300]] Then the query check by hand: one, three minus two, and two. [[slnc 300]] Three minus two gives the page of one: the database worked it out. [[slnc 300]] The fixed application answers with four hundred. [[slnc 300]] The scan found two of three script flaws, and the query flaw.
[[page]]
What it missed: the reflected page in the admin area. [[slnc 300]] The admin area was never reached.
"""
