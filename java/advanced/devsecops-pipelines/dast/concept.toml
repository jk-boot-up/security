# concept.toml: everything about this project that is not Java code.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "dast"
level = "advanced"
module = "devsecops-pipelines"
title = "Dynamic Analysis"
short_title = "DAST"
package = "dast"
main_class = "DastDemo"
tagline = "Scan a running bank web application with OWASP ZAP, compare a passive, an anonymous and a logged-in scan with the flaws that were planted, and rescan the fixed version"
bold = "A small bank web application runs with 9 planted flaws, one of them behind the login; a passive ZAP scan finds the 5 cookie and header flaws and none of the 4 script and query flaws, an active scan without a login finds 2 of 3 script flaws and the query flaw and never reaches the admin page, a logged-in scan finds all 9 of 9, and the fixed application raises none of the planted flaws, with one medium alert left (no anti-CSRF token) for a person to judge."
domain = "a bank"
domain_note = ""
youtube_description = "Dynamic application security testing (DAST) with OWASP ZAP for a bank's web application: a passive scan, an anonymous active scan, a logged-in active scan, the planted flaws as the truth, and a rescan of the fixed version."
thumb_lines = ["DYNAMIC", "ANALYSIS"]
thumb_code = "alert: Cross Site Scripting (Reflected)"
youtube_title = "Dynamic Analysis with OWASP ZAP: Passive, Active and Logged-In Scans"
youtube_tags = ["dast", "owasp zap", "dynamic analysis", "web application security", "authenticated scan", "xss", "sql injection", "devsecops", "automation framework", "java"]

[readme]
intro = """
Dynamic analysis tests the running application from outside, as an attacker would: it crawls the pages, reads the responses and sends attack strings. This project starts a small bank web application in Java with **9 planted flaws** (reflected script, a query built with a string, cookie flags, missing security headers), one of them behind the login, and scans it with **OWASP ZAP** in Docker driven by an automation plan. A Java program starts the application and ZAP (`docker pull ghcr.io/zaproxy/zaproxy:stable`, about 2 GB once) and counts what each scan found against the planted truth; the demo is tagged `integration`: `./gradlew integrationTest`.

What it shows:
- **Passive.** A scan that only reads responses finds the **5** cookie and header flaws and none of the script and query flaws.
- **Active, anonymous.** Attack strings find **2 of 3** script flaws and the query flaw; the admin page is never reached.
- **Active, logged in.** With the session cookie the scan finds **9 of 9**.
- **The fixed application.** Nothing planted is raised; one medium alert (no anti-CSRF token) remains for a person to judge.
- **The bill.** A scanner finds what it can reach, and a clean scan is not a proof.

**Maps to:** OWASP Top 10 A03 Injection and A05 Security Misconfiguration · OWASP ASVS V5, V14 · NIST SSDF PW.8 · CWE-79, CWE-89.
"""
analogy = """
A building inspector who tries the doors from the street. She finds the unlocked ones she can see, and only if she has a key does she walk the corridors behind the lobby. Telling her the building is clean after she tried the front doors would be an overstatement.
"""
scenario = """
A bank's web application has a search page, an account page, a login and an admin area. The demo starts it with known flaws, scans it three ways, fixes it and scans it again.
"""
costs = [
    "**A scan sees only what it can reach,** so it needs logins and a good crawl.",
    "**Active scans send attacks,** so they run against a test copy, never production.",
    "**Alerts need judging;** risk and confidence are guides.",
    "**A scan takes time and a Docker image of 2 GB.**",
    "**A clean result is not a proof.**",
]
too_much = """
A static site with no forms needs no active scan. Use DAST when the application takes input, has a login, or is built from parts that static analysis cannot see together.
"""
met_before = [
    "A yearly penetration test as the only test.",
    "A scan that never logged in.",
    "A report with hundreds of informational alerts.",
    "An active scan run against production.",
]
where = """
This is a project of the [devsecops-pipelines](..) module, with [sast](../sast) and [secret-scanning](../secret-scanning). SAST reads the source; DAST attacks the running application.
"""
twin = """
ZAP and the application are real; the application is a small made-up bank site that runs in the demo's own process. The demo prints counts and flaw names, never addresses or ports.
"""
test_note = "The application, the report parsing and the plan are tested with no tools. The demo runs Docker and ZAP (./gradlew integrationTest)."

[[act]]
title = "The application under test"
summary = "A small bank site has 9 planted flaws, one of them behind the login."
detail = """
The site has a search page that writes the query into the page, an account page that builds its query with a string and prints errors, a login that sets a cookie without flags, an admin area that needs the session and has its own reflected page, and none of the security headers.
"""
speech = """
First demo: the application under test. [[slnc 400]] Nine planted flaws. [[slnc 600]] One of them is behind the login.
"""
rows = { app = "active ok" }
console = [
    ["planted flaws: 9", "bad"],
    ["behind the login: 1", "bad"],
    ["the truth is known", "ok"],
]

[[act]]
title = "Passive and anonymous scans"
summary = "A passive scan finds the 5 cookie and header flaws; an anonymous active scan finds 2 of 3 script flaws and the query flaw."
detail = """
The passive scan only reads responses: it finds the cookie flags and the missing headers and none of the script and query flaws. The active scan adds attack strings and finds the reflected script on the search and account pages and the query flaw, but the spider is sent to the login page and never reaches the admin page.
"""
speech = """
Second demo: passive and anonymous scans. [[slnc 400]] Reading finds the headers. Attacking finds the script and the query. [[slnc 600]] Without a login the admin page is never tested.
"""
rows = { passive = "active ok" }
console = [
    ["passive: 5 of 5 cookie and header flaws", "ok"],
    ["active, anonymous: 2 of 3 script flaws", "bad"],
    ["not found: the admin page", "bad"],
]

[[act]]
title = "A logged-in scan"
summary = "With the session cookie the active scan finds all 9 planted flaws."
detail = """
The plan sends the session cookie with every request, so the spider reaches the admin area and the active scan finds the reflected script there. All 9 of 9 planted flaws are found. The report has 2 high, 3 medium, 3 low and 2 informational alerts.
"""
speech = """
Third demo: a logged-in scan. [[slnc 400]] Give the scanner the session. [[slnc 600]] Now it finds nine of nine.
"""
rows = { login = "active ok" }
console = [
    ["active, logged in: 3 of 3 script flaws", "ok"],
    ["planted flaws found: 9 of 9", "ok"],
    ["alerts by risk: 2, 3, 3, 2", "ok"],
]

[[act]]
title = "The fixed application"
summary = "After the fixes nothing planted is raised and one medium alert remains."
detail = """
The fixed version escapes its output, binds the query, sets HttpOnly and SameSite on the cookie and sends the security headers. The same logged-in scan raises none of the planted flaws. One medium alert remains, no anti-CSRF token on the login form, which a person has to judge.
"""
speech = """
Fourth demo: the fixed application. [[slnc 400]] The same scan now finds none of the planted flaws. [[slnc 600]] One alert is left for a person to judge.
"""
rows = { fixed = "active ok" }
console = [
    ["after the fixes: 0 of 9", "ok"],
    ["alerts by risk: 0, 1, 0, 2", "ok"],
    ["left: Absence of Anti-CSRF Tokens", "bad"],
]

[[act]]
title = "The bill"
summary = "A scanner finds what it can reach, and a clean scan is not a proof."
detail = """
Without the login the admin area was never tested. A clean scan says these probes found nothing in these pages. Every alert has a risk and a confidence, and a person decides which ones are real.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] A scanner finds what it can reach. [[slnc 600]] A clean scan is not a proof.
"""
rows = { bill = "active wrong" }
console = [
    ["the admin area needed a login", "bad"],
    ["a clean scan is not a proof", "bad"],
    ["a person judges each alert", "ok"],
]

