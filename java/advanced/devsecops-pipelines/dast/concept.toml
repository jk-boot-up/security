# concept.toml: everything about this project that is not Java code.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "dast"
level = "advanced"
module = "devsecops-pipelines"
title = "Dynamic Analysis"
short_title = "DAST"
package = "dast"
main_class = "DastDemo"
tagline = "Redo two ZAP attacks by hand, scan a running bank web application with OWASP ZAP passively, actively and logged in, count each scan against the planted flaws, and rescan the fixed version"
bold = "ZAP's reflected-script attack string comes back unchanged from the flawed bank site and escaped from the fixed one, and an id of 3-2 returns the page for id 1, so the database worked the input out; of 9 planted flaws, one behind the login, a passive scan finds the 5 cookie and header flaws, an active scan without a login adds 2 of 3 script flaws and the query flaw but never reaches the admin area, and a logged-in scan finds 3 + 1 + 5 = 9 of 9 with 2 high, 3 medium, 3 low and 2 informational alerts; after the fixes none of the planted flaws is raised and one medium alert (no anti-CSRF token on the login form) is left for a person to judge."
domain = "a bank"
domain_note = ""
youtube_description = "Dynamic application security testing (DAST) with OWASP ZAP for a bank's web application: a passive scan, an anonymous active scan, a logged-in active scan, the planted flaws as the truth, and a rescan of the fixed version."
thumb_lines = ["DYNAMIC", "ANALYSIS"]
thumb_code = "alert: Cross Site Scripting (Reflected)"
youtube_title = "Dynamic Analysis with OWASP ZAP: Passive, Active and Logged-In Scans"
youtube_tags = ["dast", "owasp zap", "dynamic analysis", "web application security", "authenticated scan", "xss", "sql injection", "devsecops", "automation framework", "java"]

[readme]
intro = """
Dynamic analysis tests the running application from outside, as an attacker would: it crawls the pages, reads the responses and sends attack strings. This project starts a small bank web application in Java with **9 planted flaws** (reflected script, a query built with a string, cookie flags, missing security headers), one of them behind the login, and scans it with **OWASP ZAP** in Docker driven by an automation plan. A Java program starts the application and ZAP (the image is pinned by digest, about 2 GB, pulled once) and counts what each scan found against the planted truth; the demo is tagged `integration`: `./gradlew integrationTest`.

What it shows:
- **One attack by hand.** ZAP's attack string for reflected script comes back unchanged from the flawed site and escaped from the fixed one.
- **Passive.** A scan that only reads responses finds the **5** cookie and header flaws and none of the script and query flaws.
- **Active, anonymous.** An id of `3-2` returns the page of id 1: the database worked the input out. The scan finds **2 of 3** script flaws and the query flaw; the admin area is never reached.
- **Active, logged in.** With the session cookie the scan finds **3 + 1 + 5 = 9 of 9**.
- **The fixed application.** Nothing planted is raised; one medium alert (no anti-CSRF token) remains for a person to judge.

**Maps to:** OWASP Top 10 (2025) A05 Injection and A02 Security Misconfiguration · OWASP ASVS 5.0 V1 Encoding and Sanitization, V13 Configuration · NIST SSDF PW.8 · CWE-79, CWE-89.
"""
analogy = """
A building inspector who tries the doors from the street. She finds the unlocked ones she can see, and only if she has a key does she walk the corridors behind the lobby. Telling her the building is clean after she tried the front doors would be an overstatement.
"""
scenario = """
A bank's web application has a search page, an account page, a login and an admin area. The demo starts it with known flaws, scans it three ways, fixes it and scans it again.
"""
costs = [
    "**A scan sees only what it can reach,** so it needs logins and a good crawl.",
    "**Active scans send attacks,** so they run against a test copy, never production.",
    "**Alerts need judging;** risk and confidence are guides.",
    "**A scan takes time and a Docker image of 2 GB.**",
    "**A clean result is not a proof.**",
]
too_much = """
A static site with no forms needs no active scan. Use DAST when the application takes input, has a login, or is built from parts that static analysis cannot see together.
"""
met_before = [
    "A yearly penetration test as the only test.",
    "A scan that never logged in.",
    "A report with hundreds of informational alerts.",
    "An active scan run against production.",
]
where = """
This is a project of the [devsecops-pipelines](..) module, with [sast](../sast) and [secret-scanning](../secret-scanning). SAST reads the source; DAST attacks the running application.
"""
twin = """
ZAP and the application are real; the application is a small made-up bank site that runs in the demo's own process. The demo prints counts and flaw names, never addresses or ports.
"""
test_note = "The application, the two checks redone by hand, the report parsing and the plan are tested with no tools. The demo runs Docker and ZAP, pinned by image digest (./gradlew integrationTest)."

[[act]]
title = "One attack, worked out by hand"
summary = "The request puts ZAP's attack string for reflected script, </p><scrIpt>alert(1);</scRipt><p>, in the search parameter. The flawed application returns it unchanged inside its page; the fixed one returns it escaped (&lt;scrIpt&gt;...). ZAP reports Cross Site Scripting (Reflected) on /search, parameter q, with the same attack, risk high, confidence medium."
detail = """
The request: GET /search?q= followed by the attack string of ZAP's rule 40012, </p><scrIpt>alert(1);</scRipt><p>, sent by a small teaching class with the same string.
The response of the flawed application, status 200: <p>Results for </p><scrIpt>alert(1);</scRipt><p></p>. The attack string came back unchanged, so a browser would run it.
The response of the fixed application, status 200: the same text with every < written as &lt;, so it is shown as text. The attack string did not come back unchanged.
What ZAP reports: Cross Site Scripting (Reflected), on /search, parameter q, with the same attack; risk high, confidence medium.
"""
figure = "attack_by_hand"
figure_title = "One attack string, two answers"
figure_speech = """
First demo: one attack, worked out by hand. [[slnc 400]] At the top, the request. [[slnc 300]] It puts a piece of markup, a script tag, in the search box. [[slnc 300]] It is the exact string Zap sends. [[slnc 700]]
On the left, the flawed application. [[slnc 300]] It writes the search text into its page as it is. [[slnc 300]] The script tag comes back unchanged, so the customer's browser would run it: the alert is raised. [[slnc 700]]
On the right, the fixed application. [[slnc 300]] Every angle bracket is written as an entity, so the browser shows it as text. [[slnc 300]] The string does not come back unchanged: not raised. [[slnc 600]]
At the bottom, Zap's own report agrees: reflected cross site scripting, on the search page.
"""
speech = """
Here is the real output. [[slnc 400]] The request, with Zap's attack string. [[slnc 400]] The flawed application: status two hundred, and the string comes back unchanged. [[slnc 400]] The fixed application: the same text, escaped, so it does not.
[[page]]
What Zap reports: reflected cross site scripting, on the search page, parameter q, with the same attack. [[slnc 300]] Risk high, confidence medium.
"""
rows = { attack = "active ok" }
