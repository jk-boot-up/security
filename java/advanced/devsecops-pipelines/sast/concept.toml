    { id = "rules", label = "Rules", sub = "pattern, taint", col = 1, row = 0, colour = "amber" },
    { id = "semgrep", label = "Semgrep", sub = "scan, test", col = 2, row = 0, colour = "accent" },
    { id = "score", label = "Score", sub = "found, flagged", col = 3, row = 0, colour = "green" },
]
edges = [
    { from = "semgrep", to = "code", label = "reads" },
    { from = "rules", to = "semgrep", label = "taught to" },
    { from = "score", to = "semgrep", label = "counts results of" },
]

[[diagram]]
