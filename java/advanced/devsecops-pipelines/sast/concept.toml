At the bottom, after the change: the sanitizer integer parse int is removed from the S Q L rule. [[slnc 300]] Now it reports line twenty two as well. [[slnc 300]] Line twenty two is the parsed number, marked o k. [[slnc 300]] The broken rule flags safe code, and the test fails, before the rule ever reaches a pipeline.
"""
