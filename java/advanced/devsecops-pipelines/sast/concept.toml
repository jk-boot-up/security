# concept.toml: everything about this project that is not Java code.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "sast"
level = "advanced"
module = "devsecops-pipelines"
title = "Static Analysis"
short_title = "SAST"
package = "sast"
main_class = "SastDemo"
tagline = "Write static analysis rules for a bank's Java code, compare a pattern rule with a taint rule, test the rules, and triage the findings with Semgrep"
bold = "A bank's web code holds 7 planted flaws and 7 safe look-alikes, marked in comments; on the SQL queries a pattern rule finds 4 of 4 flaws and flags 3 of 4 safe lines, while a taint rule that follows input from the request to the query finds 3 of 4 and flags 1 of 4 and misses the flaw whose query is built in another file; the taint rules with a weak-hash rule find 6 of 7 flaws; Semgrep's own rule tests pass 4 of 4 checks, and the same tests catch a rule with its sanitizer removed (3 of 4); a false alarm is suppressed with a comment that names the rule, the reason and the owner, and a build check refuses a suppression without them."
domain = "a bank"
domain_note = ""
youtube_description = "Static analysis (SAST) with Semgrep for a bank's Java code: a pattern rule and a taint rule compared on planted flaws and safe look-alikes, what a taint rule cannot see across files, tests for rules, and triage with reasons and owners."
thumb_lines = ["STATIC", "ANALYSIS"]
thumb_code = "source: getParameter -> sink: executeQuery"
youtube_title = "Static Analysis with Semgrep: Taint Rules, Rule Tests and Triage"
youtube_tags = ["static analysis", "sast", "semgrep", "taint analysis", "sql injection", "custom rules", "triage", "false positives", "devsecops", "java"]

[readme]
intro = """
Static analysis reads the code without running it. A **pattern rule** looks for a shape such as a query built with `+`; a **taint rule** follows input from where it enters (a request parameter) to where it hurts (a query), and does not report it when a check lies in between. This project plants **7 flaws and 7 safe look-alikes** in a small bank web application (each marked with a comment), writes the rules in **Semgrep**'s YAML, and counts what each rule gets right. A Java program drives the real `semgrep` (installed with pip into `build/` the first time; python3 and a network once); the demo is tagged `integration`: `./gradlew integrationTest`.

What it shows:
- **Pattern against taint.** On the SQL, the pattern rule finds **4 of 4** flaws and flags **3 of 4** safe lines; the taint rule finds **3 of 4** and flags **1 of 4**.
- **What a taint rule cannot see.** The flaw whose query is built in another file is missed, because the input and the query are never in one method.
- **Tests for the rules.** `semgrep --test` passes **4 of 4** checks; a rule with its sanitizer removed passes only **3 of 4**: the test catches it.
- **Triage.** A false alarm is suppressed with a comment that says why and who owns it; a build check fails a suppression without both.
- **The bill.** A rule is code: it needs tests, owners and an honest list of what it cannot see.

**Maps to:** OWASP Top 10 A03 Injection · OWASP ASVS V5 · NIST SSDF PW.7 · CWE-89, CWE-78, CWE-22, CWE-328.
"""
analogy = """
A proofreader with two methods. One circles every sentence with a certain shape. The other follows a claim from the place it is made to the place a reader relies on it, and stays quiet if someone checked it on the way. The second is quieter, but it only follows what is on the same page.
"""
scenario = """
A bank's web application builds queries, runs a converter and reads files. Some of that code uses request input unsafely, some looks the same and is safe. The demo writes rules and counts what they find.
"""
costs = [
    "**Rules need tests,** or nobody knows what they miss.",
    "**A taint rule sees one method at a time** in the open source engine.",
    "**False alarms cost reviewers' time,** and suppressions can hide real flaws.",
    "**A rule only knows its own sources, sinks and sanitizers.**",
    "**Findings are not fixes;** a person decides each one.",
]
too_much = """
A small team can start with the maintained rule sets and no custom rules. Write your own when the code has its own frameworks, sources and sanitizers that the shared rules do not know.
"""
met_before = [
    "A scanner report with a thousand findings and no owner.",
    "A grep for \"executeQuery\" in a build step.",
    "A suppression comment with no reason.",
    "A rule pack that nobody has tested.",
]
where = """
This is a project of the [devsecops-pipelines](..) module, with [secret-scanning](../secret-scanning). The flaws are the ones found at runtime in the intermediate track; here they are found in the source.
"""
twin = """
Semgrep is real and runs offline with the rule files in this project. The code under test is a small made-up bank application that is never compiled or run. The demo prints counts and rule names, never paths.
"""
test_note = "The scoring, the markers and the suppression check are tested with no tools. The demo runs Semgrep (./gradlew integrationTest)."

[[act]]
title = "The code under test"
summary = "Six files hold 7 planted flaws and 7 safe look-alikes, each marked in a comment."
detail = """
The bank's web code builds queries from request parameters directly, through a variable and through a helper, runs a converter, reads a file and hashes with MD5. Next to them are safe versions: a prepared statement, a parsed number, a constant, an allowlisted column, a command array, a validated file name and SHA-256.
"""
speech = """
First demo: the code under test. [[slnc 400]] Seven planted flaws and seven safe look-alikes. [[slnc 600]] Each line is marked, so a rule can be scored.
"""
rows = { code = "active ok" }
console = [
    ["files: 6", "ok"],
    ["flaws planted: 7", "bad"],
    ["safe look-alikes: 7", "ok"],
]

[[act]]
title = "Pattern against taint"
summary = "On the SQL the pattern rule finds 4 of 4 and flags 3 of 4 safe lines; the taint rule finds 3 of 4 and flags 1 of 4."
detail = """
The pattern rule flags any query that is not a constant: the parsed number, the constant and the allowlisted column too. The taint rule follows the request parameter and knows that parsing is a sanitizer, so it flags only the allowlisted column. It misses the query built in another file, because there the input is a method parameter.
"""
speech = """
Second demo: pattern against taint. [[slnc 400]] The pattern rule finds everything and flags three safe lines. [[slnc 600]] The taint rule flags one, and misses the flaw in the other file.
"""
rows = { taint = "active ok" }
console = [
    ["pattern rule: 4 of 4, 3 of 4 safe flagged", "bad"],
    ["taint rule: 3 of 4, 1 of 4 safe flagged", "ok"],
    ["taint rule misses: sql-other-file", "bad"],
]

[[act]]
title = "Tests for the rules"
summary = "semgrep --test passes 4 of 4 checks, and a rule with its sanitizer removed passes only 3 of 4."
detail = """
A test file marks the lines a rule must flag and the lines it must leave alone. The four taint checks pass. The same file run against a rule without the parseInt sanitizer fails one check: the test notices the broken rule. The pattern rule has no test, and the run says so.
"""
speech = """
Third demo: tests for the rules. [[slnc 400]] Mark what must be flagged and what must not. [[slnc 600]] Break the rule, and a check fails.
"""
rows = { tests = "active ok" }
console = [
    ["semgrep --test: 4 of 4 checks pass", "ok"],
    ["sanitizer removed: 3 of 4", "ok"],
    ["rule files with no test: 1", "bad"],
]

[[act]]
title = "Triage"
summary = "A false alarm is suppressed with a reason and an owner, and a build check refuses a suppression without them."
detail = """
The taint rules report 7 findings, 6 real and 1 false, and exit with code 1. A comment above the false one names the rule, says why and who decides, and the scan reports 6. A second comment with no reason is counted as badly written and the check fails. A file with no flaw gives exit code 0.
"""
speech = """
Fourth demo: triage. [[slnc 400]] Seven findings, one false. [[slnc 600]] Suppress it with a reason and an owner, and fail the build on a suppression without them.
"""
rows = { triage = "active ok" }
console = [
    ["findings: 7 (6 real, 1 false), exit 1", "bad"],
    ["suppression with a reason: 6 findings", "ok"],
    ["suppression with no reason: check fails", "ok"],
]

[[act]]
title = "The bill"
summary = "A taint rule follows input inside a method; the sink in another file is missed."
detail = """
A rule knows only its sources, sinks and sanitizers, so a check it does not know looks like no check. A rule without a test is a guess. The reports are a list for people to read, not a verdict.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] A rule sees what it was taught. [[slnc 600]] Test it, own it, and know what it cannot see.
"""
rows = { bill = "active wrong" }
console = [
    ["the sink in another file is missed", "bad"],
    ["an allowlist is invisible to a rule", "bad"],
    ["a rule without a test is a guess", "bad"],
]

[animation]
subtitle = "A bank's code, read by rules."
boxes = [
    ["code", "The code under test", "7 and 7"],
    ["taint", "Pattern against taint", "4/4 and 3/4"],
    ["tests", "Tests for the rules", "4/4, then 3/4"],
    ["triage", "Triage", "7 to 6"],
    ["bill", "The bill", "own file only"],
]

[docs.problem]
scenario = """
A bank wants injection flaws found in the source before the code runs.
"""
naive = """
Search the code for the word executeQuery and read every hit.
"""
deliver = [
    "Rules written in Semgrep's YAML.",
    "A pattern rule and a taint rule, scored on planted flaws.",
    "Tests for the rules.",
    "Triage with reasons and owners.",
]

[docs.prerequisites]
required = [
    "Java basics",
    "python3 (Semgrep is installed with pip into build/ the first time)",
    "A network once",
]
not_required = [
    "A Semgrep account",
    "CodeQL",
]
install = ["python3"]

[docs.session]
objectives = [
    "write a pattern rule and a taint rule",
    "score a rule on planted flaws and safe lines",
    "test a rule and see a broken rule fail",
    "triage a finding with a reason and an owner",
]
walkthrough = """
Run the demo and compare the pattern rule with the taint rule in the second act. Open rules/taint.yml and find the sanitizer that the safe parsed number relies on.
"""
exercises = [
    "Add a source for a header and a test for it.",
    "Write a rule for a new sink such as a LDAP search and plant a flaw for it.",
    "Make the taint rule follow a call into AccountRepository by adding the sink to its method.",
    "Add a rule test that fails when the allowlisted column is flagged and decide what to do about it.",
]

[docs.explained]
sentence = """
A rule is a program, so give it tests and an owner.
"""
verdict = """
Start with taint rules for the flaws that matter, score every rule on planted flaws and safe look-alikes, test the rules in the build, suppress only with a reason and an owner, and keep a list of what the tool cannot see.
"""
recognise = [
    "A scan that reports a thousand findings and nobody reads.",
    "A suppression comment with no reason.",
    "A custom rule without a test file.",
    "A report that is green because the rule saw nothing.",
]

[spec]
purpose = """
Teach static analysis by writing rules, scoring them on planted flaws and safe lines, testing them, and triaging what they report.
"""
nongoals = [
    "CodeQL and whole-program analysis.",
    "Fixing the flaws.",
    "Language-specific frameworks beyond the rules shown.",
]
problem = """
Static analysis tools report a lot, rules are written without tests, and nobody measures what they miss.
"""
roles = [["The planted truth", "`Marker`"], ["The scan and the rule tests", "`Semgrep`"], ["The scoring", "`Score`"], ["The suppression check", "`Suppressions`"], ["The tool install", "`Venv`"], ["Entry point", "`SastDemo`"]]
requirements = [
    "Every flaw and every safe look-alike is marked in the code under test.",
    "Pattern and taint rules are scored on the same lines.",
    "A rule with a missing sanitizer fails a rule test.",
    "A suppression without a rule, a reason and an owner fails the check.",
    "The demo prints the same output on every run.",
]

