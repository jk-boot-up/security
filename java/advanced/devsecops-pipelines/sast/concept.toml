]

[[diagram]]
name = "threat-model-diagram"
kind = "flow"
title = "Threat model: trust boundaries and threats"
caption = "Dashed boxes are trust boundaries. Rose tags show where each threat in the table applies."
zones = [
    { label = "Developers", nodes = ["dev"], colour = "red" },
    { label = "Pipeline", nodes = ["scan"], colour = "green" },
]
nodes = [
    { id = "dev", label = "Developer", sub = "writes and suppresses", col = 0, row = 0, colour = "red", threats = ["T1", "T3"] },
    { id = "scan", label = "Semgrep rules", sub = "tested, owned", col = 1, row = 0, colour = "accent", threats = ["T2"] },
    { id = "code", label = "Code", sub = "ships to production", col = 2, row = 0, colour = "amber", threats = ["T1"] },
]
edges = [
    { from = "dev", to = "scan", label = "commit", colour = "red", dashed = true, threats = ["T3"] },
    { from = "scan", to = "code", label = "findings", threats = ["T1", "T2"] },
]

[threatmodel]
scope = """
Injection flaws in the source of the application. It does not cover flaws that exist only at runtime, in dependencies or in configuration.
"""
assets = [
    "The application source.",
    "The rules and the suppressions.",
]
actors = [
    "A developer who writes an unsafe query.",
    "A developer who suppresses a finding to get a build green.",
    "A maintainer of the rules.",
]
boundaries = [
    "The build: findings stop it or do not.",
]
assumptions = [
    "The rules know the sources, sinks and sanitizers of the code.",
]
out_of_scope = [
    "Business logic flaws.",
    "Flaws in libraries.",
]
tests = [
    "`ScoreTest` and `MarkerAndSuppressionsTest` check the scoring, the markers and the suppression check with no tools.",
    "`DemoRunsTest` runs Semgrep and compares the whole demo with the golden output (integrationTest).",
]
next = """
The next project in the module is dast.
"""

[[threat]]
id = "T1"
stride = "T"
threat = "An injection flaw ships because no rule saw it"
where = "the source"
control = "Taint rules for the sources and sinks of the application, scored on planted flaws"
residual = "Flows across files and frameworks"

[[threat]]
id = "T2"
stride = "R"
threat = "A rule silently stops working"
where = "the rules"
control = "Rule tests in the build"
residual = "Cases the tests do not cover"

[[threat]]
id = "T3"
stride = "R"
threat = "A finding is suppressed without a reason"
where = "the code"
control = "A check that requires a rule, a reason and an owner"
residual = "A reason that is not true"

[poster]
headline = [["STATIC", "text"], ["ANALYSIS", "accent"]]
taglines = [["Write static analysis rules for a bank's Java code, compare a pattern rule with a taint ru", "gold"]]
before = { code = "pattern rule: 3 of 4 safe lines flagged", note = "Pattern against taint", tag = "BEFORE" }
after = { code = "taint rule: 1 of 4 safe lines flagged", note = "Taint", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "Static Analysis"
narration = "Hello, and welcome. [[slnc 400]] This video explains static analysis of Java code, with Semgrep. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] Static analysis reads code without running it, and flags lines that look like a flaw. [[slnc 300]] A pattern rule looks for a shape, like a query built with a plus sign. [[slnc 300]] A taint rule follows input from where it enters to where it hurts, and stays quiet when a check lies between. [[slnc 300]] Both are code, and both need tests. [[slnc 600]] Think of a proof-reader who flags every long sentence, against one who actually follows the argument. [[slnc 600]] Our example is a bank."

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["A bank's small web application,", "with 7 planted flaws and", "7 safe look-alikes, each marked", "in a comment, so a rule can be scored.", "", "The demo runs pattern rules and taint rules,", "tests the rules, and triages the findings."]
narration = "Here is the scenario. [[slnc 400]] A bank's small web application has seven planted flaws, and seven safe lines that look like them. [[slnc 500]] Each one is marked in a comment, so every rule can be scored: what it found, what it missed, and what it flagged by mistake. [[slnc 500]] The demo runs a pattern rule and a taint rule with Semgrep, tests the rules themselves, and triages the findings."

[[scene]]
key = "03-acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "04-costs"
kind = "bullets"
title = "What It Costs"
body = ["Pattern rules raise false alarms", "Taint rules miss flows across files", "Rules are code, with tests to keep", "Every suppression needs a reason and an owner", "A clean scan is not a safe program"]
narration = "Nothing is free. [[slnc 400]] Here is what it costs. [[slnc 500]] Pattern rules raise false alarms on safe code that looks the same. [[slnc 500]] Taint rules miss flows that cross from one file to another. [[slnc 500]] Rules are code, with tests to write and keep. [[slnc 500]] Every suppressed finding needs a reason, and an owner. [[slnc 300]] And a clean scan is not a safe program: it means only that these rules found nothing."

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["Marker: reads the flaw and safe marks", "Semgrep, Venv: runs Semgrep", "Score: found, missed, and false alarms", "Suppressions: checks every nosemgrep has a", "  reason and an owner", "SastDemo: runs the demos"]
narration = "Here is who does what in the code. [[slnc 400]] Marker reads the marks that say which lines are flaws, and which are safe. [[slnc 500]] Semgrep runs the real Semgrep, with the rules and their tests. [[slnc 300]] Score counts what each rule found, missed, and flagged by mistake. [[slnc 500]] Suppressions checks that every suppressed finding says why, and who owns it. [[slnc 300]] And SastDemo runs the demos."

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["A scanner finding: SQL injection, CWE-89", "// nosemgrep with no reason", "A rule file with no test file", "Hundreds of findings nobody reads"]
narration = "You have probably met this already. [[slnc 400]] A scanner finding for S Q L injection, C W E 89, is a rule that matched. [[slnc 500]] A no semgrep comment with no reason is a finding hidden without a decision. [[slnc 500]] A rule file with no test file is a rule nobody can trust. [[slnc 500]] And hundreds of findings nobody reads are what pattern rules alone produce."

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Taint rules for injection; patterns for the rest", "Score rules on planted flaws and look-alikes", "A test for every rule", "Suppress with a reason and an owner", "Know what the rules cannot see"]
narration = "So, how do you use it? [[slnc 400]] Use taint rules for injection, and pattern rules for simple shapes like a weak hash. [[slnc 500]] Score your rules on planted flaws and safe look-alikes. [[slnc 300]] Give every rule a test. [[slnc 500]] Suppress a finding only with a reason and an owner, and make the build check it. [[slnc 300]] And write down what the rules cannot see, like a flow across files."

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a header as a source,", "and a test for it."]
narration = "That's static analysis with Semgrep. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] A rule is code: score it on flaws and look-alikes, test it, give every suppression a reason, and be honest about what it cannot see. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a request header as a source of tainted input, and a test for it. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"

