say = "VULN marks a planted flaw, a vulnerability. SAFE marks a safe line that looks like one."
[[acronym]]
short = "YAML"
long = "YAML Ain't Markup Language: the format of the rule files"
say = "YAML is the text format of the rule files."
[[acronym]]
short = "JSON"
long = "JavaScript Object Notation: what Semgrep prints"
say = "jay son is JavaScript object notation, the format Semgrep prints its results in."
[[acronym]]
short = "MD5, SHA-1"
long = "Message Digest 5; Secure Hash Algorithm 1: broken hashes"
say = "M D five is message digest five, and S H A one is secure hash algorithm one. Both are broken as hashes."
[[acronym]]
