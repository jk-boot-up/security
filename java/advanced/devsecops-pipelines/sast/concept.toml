[poster]
headline = [["STATIC", "text"], ["ANALYSIS", "accent"]]
taglines = [["Pattern and taint rules, rule tests and triage", "gold"]]
before = { code = "pattern rule: 3 of 4 safe lines flagged", note = "Pattern against taint", tag = "BEFORE" }
after = { code = "taint rule: 1 of 4 safe lines flagged", note = "Taint", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "Static Analysis"
narration = "Hello, and welcome. [[slnc 400]] This video explains static analysis of Java code, with Semgrep. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] Static analysis reads code without running it, and flags lines that look like a flaw. [[slnc 300]] A pattern rule looks for a shape, like a query built with a plus sign. [[slnc 300]] A taint rule follows input from where it enters to where it hurts, and stays quiet when a check lies between. [[slnc 300]] Both are code, and both need tests. [[slnc 600]] Think of a proof-reader who flags every long sentence, against one who actually follows the argument. [[slnc 600]] Our example is a bank."

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["A bank's small web application,", "with 7 planted flaws and", "7 safe look-alikes, each marked", "in a comment, so a rule can be scored.", "", "The demo runs pattern rules and taint rules,", "tests the rules, and triages the findings."]
narration = "Here is the scenario. [[slnc 400]] A bank's small web application has seven planted flaws, and seven safe lines that look like them. [[slnc 500]] Each one is marked in a comment, so every rule can be scored: what it found, what it missed, and what it flagged by mistake. [[slnc 500]] The demo runs a pattern rule and a taint rule with Semgrep, tests the rules themselves, and triages the findings."

[[scene]]
key = "02-words"
kind = "bullets"
title = "The Words"
body = ["Static analysis: reading code without running it", "Rule: what a scanner looks for", "Pattern rule: a shape of code", "Taint rule: input followed from a source to a sink", "Sanitizer: a call that makes the input safe", "Finding: a line a rule flags; false alarm: a safe one"]
narration = """Before the demos, the words. [[slnc 500]] Static analysis reads the code without running it. [[slnc 500]] A rule says what the scanner looks for. [[slnc 500]] A pattern rule looks for a shape of code, like a query built with a plus sign. [[slnc 500]] A taint rule follows input from a source, where it enters, to a sink, where it can hurt. [[slnc 500]] A sanitizer is a call on the way that makes the input safe, like parsing it as a number. [[slnc 500]] A finding is a line a rule flags; when the line is safe, it is a false alarm."""

[[scene]]
key = "02-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "02-two-readers"
kind = "figure"
title = "One safe line, read by two rules"
body = "two_readers"
narration = """Let's see the core idea on one example: a safe line, read by both kinds of rule. [[slnc 400]] At the top, the input: two lines. [[slnc 300]] A number is parsed from the request, then glued into a query. [[slnc 700]]
On the left, the pattern rule. [[slnc 300]] It sees execute query with a plus sign in it, and that is all it looks for. [[slnc 300]] So it flags the line: a false alarm. [[slnc 700]]
On the right, the taint rule. [[slnc 300]] It sees the input come from the request, the source. [[slnc 300]] But on the way, integer parse int turns it into a number, and a number cannot carry S Q L. [[slnc 300]] That call is a sanitizer, so the rule stays quiet. [[slnc 600]]
Same line, two rules: one looks at shapes, the other follows the data."""

[[scene]]
key = "03-acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "04-costs"
kind = "bullets"
title = "What It Costs"
body = ["Pattern rules raise false alarms", "Taint rules miss flows across files", "Rules are code, with tests to keep", "Every suppression needs a reason and an owner", "A clean scan is not a safe program"]
narration = "Nothing is free. [[slnc 400]] Here is what it costs. [[slnc 500]] Pattern rules raise false alarms on safe code that looks the same. [[slnc 500]] Taint rules miss flows that cross from one file to another. [[slnc 500]] Rules are code, with tests to write and keep. [[slnc 500]] Every suppressed finding needs a reason, and an owner. [[slnc 300]] And a clean scan is not a safe program: it means only that these rules found nothing."

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["Marker: reads the flaw and safe marks", "Semgrep, Venv: runs Semgrep", "RuleFile, TaintSteps: a rule, followed by hand", "Score: found, missed, and false alarms", "Suppressions: checks every nosemgrep has a", "  reason and an owner", "SastDemo: runs the demos"]
narration = "Here is who does what in the code. [[slnc 400]] Marker reads the marks that say which lines are flaws, and which are safe. [[slnc 500]] Semgrep runs the real Semgrep, with the rules and their tests. [[slnc 300]] RuleFile reads a rule, and TaintSteps follows the taint by hand. [[slnc 300]] Score counts what each rule found, missed, and flagged by mistake. [[slnc 500]] Suppressions checks that every suppressed finding says why, and who owns it. [[slnc 300]] And SastDemo runs the demos."

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["A scanner finding: SQL injection, CWE-89", "// nosemgrep with no reason", "A rule file with no test file", "Hundreds of findings nobody reads"]
narration = "You have probably met this already. [[slnc 400]] A scanner finding for S Q L injection, C W E 89, is a rule that matched. [[slnc 500]] A no semgrep comment with no reason is a finding hidden without a decision. [[slnc 500]] A rule file with no test file is a rule nobody can trust. [[slnc 500]] And hundreds of findings nobody reads are what pattern rules alone produce."

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Taint rules for injection; patterns for the rest", "Score rules on planted flaws and look-alikes", "A test for every rule", "Suppress with a reason and an owner", "Know what the rules cannot see"]
narration = "So, how do you use it? [[slnc 400]] Use taint rules for injection, and pattern rules for simple shapes like a weak hash. [[slnc 500]] Score your rules on planted flaws and safe look-alikes. [[slnc 300]] Give every rule a test. [[slnc 500]] Suppress a finding only with a reason and an owner, and make the build check it. [[slnc 300]] And write down what the rules cannot see, like a flow across files."

[[scene]]
key = "12-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a header as a source,", "and a test for it."]
narration = "That's static analysis with Semgrep. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] A rule is code: score it on flaws and look-alikes, test it, give every suppression a reason, and be honest about what it cannot see. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a request header as a source of tainted input, and a test for it. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"


[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] Semgrep does the scanning; the classes score it against the truth written in the code, and a small teaching class redoes the taint by hand. [[slnc 300]] Here are the ones that matter."""

[[class]]
name = "Marker"
what = "the truth about a line, written in a comment"
[[class.part]]
title = "// VULN or // SAFE, and an id"
code = """
private static final Pattern MARK = Pattern.compile("// (VULN|SAFE) ([a-z-]+)");
...
markers.add(new Marker(p.getFileName().toString(), i + 1, m.group(1).equals("VULN"), m.group(2)));
"""
speech = """Every planted flaw and every safe look-alike ends in a comment. [[slnc 300]] Marker reads them, with the file and the line, so any finding can be checked against the truth."""

[[class]]
name = "Score"
what = "found, missed and flagged, per rule"
[[class.part]]
title = "compare findings with markers"
code = """
List<Marker> found = mine.stream().filter(m -> m.vulnerable() && hits.contains(m.key())).toList();
List<Marker> missed = mine.stream().filter(m -> m.vulnerable() && !hits.contains(m.key())).toList();
List<Marker> flagged = mine.stream().filter(m -> !m.vulnerable() && hits.contains(m.key())).toList();
"""
speech = """A flaw with a finding on its line is found; without one, it is missed. [[slnc 300]] A safe line with a finding is flagged: a false alarm."""
[[class.part]]
title = "recall and precision"
code = """
return ratio(found.size(), vulnerable());
...
return ratio(found.size(), found.size() + flaggedSafe.size());
"""
speech = """Recall divides the flaws found by all the flaws. [[slnc 300]] Precision divides them by everything the rule flagged."""

[[class]]
name = "TaintSteps"
what = "a teaching class: taint followed by hand"
[[class.part]]
title = "assigned from a tainted value, tainted"
code = """
String from = line.contains("." + source + "(") ? "the source" : tainted.stream().filter(v -> line.matches(".*\\\\b" + v + "\\\\b.*")).findFirst().orElse(null);
if (a.find() && from != null) {
    tainted.add(a.group(1));
"""
speech = """A variable assigned from the source, or from a tainted variable, becomes tainted. [[slnc 300]] When the sink is called with one, that is a finding. [[slnc 300]] A test checks the three steps of the first demo."""

[[class]]
name = "Semgrep"
what = "runs the real semgrep and reads its JSON"
[[class.part]]
title = "a scan, with --error for the build"
code = """
command.addAll(List.of("--json", "--metrics=off", "--disable-version-check", "--quiet"));
if (error) {
    command.add("--error");
"""
speech = """Rules come from local files, with metrics off. [[slnc 300]] With the error flag, any finding makes the exit code one, which fails a build."""
[[class.part]]
title = "expected against reported lines"
code = """
m.path("expected_lines").forEach(n -> expected.add(n.asInt()));
m.path("reported_lines").forEach(n -> reported.add(n.asInt()));
"""
speech = """semgrep test prints, for each rule, the lines its test file expects and the lines it reported. [[slnc 300]] A check passes when they are the same."""

[[class]]
name = "Suppressions"
what = "a suppression must name the rule, the reason and the owner"
[[class.part]]
title = "the shape of a good one"
code = """
private static final Pattern GOOD = Pattern.compile(
        "nosemgrep: [\\\\w.-]+ -- .{10,} \\\\(owner: [\\\\w-]+\\\\)");
"""
speech = """The rule's name, two dashes and a reason of at least ten characters, then an owner in brackets. [[slnc 300]] A build check counts every no semgrep comment that does not match."""

