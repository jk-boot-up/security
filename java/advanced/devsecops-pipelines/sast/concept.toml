[[act]]
title = "Pattern against taint"
summary = "On the 8 SQL lines the pattern rule finds 4 of 4 flaws and flags 3 of 4 safe lines (recall 4/4 = 100%, precision 4/7 = 57%); the taint rule finds 3 of 4 and flags 1 of 4 (recall 3/4 = 75%, precision 3/4 = 75%): it misses sql-other-file and flags sql-allowlisted."
detail = """
The input: six files with 7 planted flaws and 7 safe look-alikes, each marked // VULN or // SAFE, and two rules: the pattern rule sql-concat matches executeQuery($Q + ...) and executeQuery($Q); the taint rule sql-taint follows getParameter to executeQuery.
The result, line by line on the 8 SQL lines: the pattern rule finds every flaw but also flags the parsed number, the constant and the allowlisted column. The taint rule knows parsing is a sanitizer and that a constant carries no input; it flags only the allowlisted column, and misses sql-other-file, whose query is built in AccountRepository, another file.
How the score is made: recall = found / flaws (4/4 = 100% and 3/4 = 75%); precision = real / flagged (4/7 = 57% and 3/4 = 75%).
"""
figure = "pattern_vs_taint"
figure_title = "The eight SQL lines, as each rule sees them"
figure_speech = """
Second demo: a pattern rule against a taint rule, on the eight lines that run S Q L. [[slnc 400]] Each row is one line of the bank's code: four real flaws, and four safe look-alikes. [[slnc 600]]
The pattern rule, in the middle column, looks only at the shape. [[slnc 300]] It finds all four flaws. [[slnc 300]] But it also flags three safe lines: the parsed number, the constant, and the allowlisted column. [[slnc 700]]
The taint rule, on the right, follows the input. [[slnc 300]] It flags only one safe line, the allowlisted column, because it cannot know that the allowlist is a check. [[slnc 300]] And it misses one flaw: the query built in another file. [[slnc 600]]
At the bottom, the two numbers. [[slnc 300]] Recall: found divided by flaws. [[slnc 300]] Precision: real flaws divided by everything flagged.
