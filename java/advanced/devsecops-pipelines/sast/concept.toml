[[diagram]]
name = "threat-model-diagram"
kind = "flow"
title = "Threat model: trust boundaries and threats"
caption = "Dashed boxes are trust boundaries. Rose tags show where each threat in the table applies."
zones = [
    { label = "Developers", nodes = ["dev"], colour = "red" },
    { label = "Pipeline", nodes = ["scan"], colour = "green" },
]
nodes = [
    { id = "dev", label = "Developer", sub = "writes and suppresses", col = 0, row = 0, colour = "red", threats = ["T1", "T3"] },
    { id = "scan", label = "Semgrep rules", sub = "tested, owned", col = 1, row = 0, colour = "accent", threats = ["T2"] },
    { id = "code", label = "Code", sub = "ships to production", col = 2, row = 0, colour = "amber", threats = ["T1"] },
]
edges = [
    { from = "dev", to = "scan", label = "commit", colour = "red", dashed = true, threats = ["T3"] },
    { from = "scan", to = "code", label = "findings", threats = ["T1", "T2"] },
]

[threatmodel]
scope = """
Injection flaws in the source of the application. It does not cover flaws that exist only at runtime, in dependencies or in configuration.
"""
assets = [
    "The application source.",
    "The rules and the suppressions.",
]
actors = [
    "A developer who writes an unsafe query.",
    "A developer who suppresses a finding to get a build green.",
    "A maintainer of the rules.",
]
boundaries = [
    "The build: findings stop it or do not.",
]
assumptions = [
    "The rules know the sources, sinks and sanitizers of the code.",
]
out_of_scope = [
    "Business logic flaws.",
    "Flaws in libraries.",
]
tests = [
    "`ScoreTest` and `MarkerAndSuppressionsTest` check the scoring, the markers and the suppression check with no tools.",
    "`DemoRunsTest` runs Semgrep and compares the whole demo with the golden output (integrationTest).",
]
next = """
The next project in the module is dast.
"""

[[threat]]
id = "T1"
stride = "T"
threat = "An injection flaw ships because no rule saw it"
where = "the source"
control = "Taint rules for the sources and sinks of the application, scored on planted flaws"
residual = "Flows across files and frameworks"

[[threat]]
id = "T2"
stride = "R"
threat = "A rule silently stops working"
where = "the rules"
control = "Rule tests in the build"
residual = "Cases the tests do not cover"

[[threat]]
id = "T3"
stride = "R"
threat = "A finding is suppressed without a reason"
where = "the code"
control = "A check that requires a rule, a reason and an owner"
residual = "A reason that is not true"

