rules:
  - id: sql-taint
    languages: [java]
    mode: taint
    severity: ERROR
    message: Input from the request reaches a SQL query without being parsed or bound.
    pattern-sources:
      - pattern: $REQ.getParameter(...)
    pattern-sinks:
      - pattern: $S.executeQuery(...)
    pattern-sanitizers:
      - pattern: Integer.parseInt(...)
      - pattern: Validate.fileName(...)
    metadata: {kind: taint}
  - id: command-taint
    languages: [java]
    mode: taint
    severity: ERROR
    message: Input from the request reaches a command line.
    pattern-sources:
      - pattern: $REQ.getParameter(...)
    pattern-sinks:
      - pattern: $R.exec($CMD)
    pattern-sanitizers:
      - pattern: Validate.fileName(...)
    metadata: {kind: taint}
  - id: path-taint
    languages: [java]
    mode: taint
    severity: ERROR
    message: Input from the request chooses a file.
    pattern-sources:
      - pattern: $REQ.getParameter(...)
    pattern-sinks:
      - pattern: new File($DIR, $NAME)
    pattern-sanitizers:
      - pattern: Validate.fileName(...)
    metadata: {kind: taint}
  - id: weak-hash
    languages: [java]
    severity: WARNING
    message: MD5 and SHA-1 are broken as hashes.
    pattern-either:
      - pattern: MessageDigest.getInstance("MD5")
      - pattern: MessageDigest.getInstance("SHA-1")
    metadata: {kind: pattern}
