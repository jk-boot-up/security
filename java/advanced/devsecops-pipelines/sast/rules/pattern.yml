rules:
  - id: sql-concat
    languages: [java]
    severity: ERROR
    message: A query is built with a string that is not a constant, so it can carry input into the SQL.
    pattern-either:
      - pattern: $S.executeQuery($Q + ...)
      - pattern: $S.executeQuery($Q)
    pattern-not: $S.executeQuery("..." + "...")
    metadata: {kind: pattern}
