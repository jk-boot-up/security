[[act]]
title = "Testing the rules with their own samples"
summary = "Every rule carries a bad sample that must fire it and a good one that must not: 8 of 8 pass. A K3 written as 'ends with :latest' does not fire on its bad sample, image: shop/orders, because an image with no tag has nothing after its last part; the real K3 reads the tag as none, so Kubernetes pulls latest, and fires."
detail = """
The input is sixteen samples, two per rule, each a snippet put into a small Pod: for example K1 bad securityContext: {privileged: true} and good {privileged: false}; K3 bad image: shop/orders and good image: shop/web:1.8.2. A bad sample such as imagePullPolicy: Always sets nothing the rule asks about, so the default applies and the rule must fire.
The result: 8 of 8 rules fire on bad and stay quiet on good. Then a rule with a mistake: K3 written as "the image ends with :latest". On its bad sample shop/orders it does not fire, so its own test fails. How the real K3 reads shop/orders: the last part after the last / is orders; it has no : or @, so the tag is none and Kubernetes pulls latest; K3 fires.
"""
figure = "rule_test"
figure_title = "A rule's own sample catches its mistake"
figure_speech = """
Second demo: testing the rules themselves. [[slnc 400]] A rule is a small program, and it can be wrong. [[slnc 300]] So each rule carries two samples: a bad one that must fire it, and a good one that must not. [[slnc 700]]
Here is a rule with a mistake. [[slnc 300]] Someone wrote K three as: the image ends with colon latest. [[slnc 300]] Its bad sample is shop slash orders, an image with no tag at all. [[slnc 300]] It does not end with colon latest, so the rule stays quiet, and its own test fails. [[slnc 600]]
On the right, the real rule, step by step. [[slnc 300]] Take the last part of the name, after the last slash: orders. [[slnc 300]] There is no colon and no at sign, so there is no tag, and Kubernetes pulls latest anyway. [[slnc 300]] The real rule fires. [[slnc 500]] All eight rules pass their samples.
"""
speech = """
The input: two samples for each rule. [[slnc 300]] A bad one, that must fire the rule, and a good one, that must not. [[slnc 300]] A bad sample like image pull policy always sets nothing the rule asks about, so the default applies.
