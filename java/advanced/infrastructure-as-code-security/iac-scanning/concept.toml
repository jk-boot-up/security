# concept.toml: everything about this project that is not Java code.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "iac-scanning"
level = "advanced"
module = "infrastructure-as-code-security"
title = "IaC Scanning"
short_title = "IaC Scanning"
package = "iacscan"
main_class = "IacScanningDemo"
tagline = "Write eight rules for Kubernetes manifests with tests of their own, run Checkov, Trivy and KICS on the same files, and handle exceptions and a baseline in the build"
bold = "An online store's Kubernetes manifests break 8 rules written in Java (13 findings: a privileged container, root, a latest tag, no limits, a password written in the file, the host network, a writable filesystem, privilege escalation); each rule has a bad and a good sample, 8 of 8 pass, and a rule that only knows :latest fails its own test on an untagged image; Checkov, Trivy and KICS agree on 7 of the 8 and all three miss the password written in the file while two flag the good practice of reading it from a Secret; all three still give advice on the fixed files; an exception is a waiver with an owner, a reason and an end date, an expired one brings the finding back, and a waiver with no owner hides nothing; Checkov's annotation and Trivy's ignore file do the same inside the tools; a baseline fails the build on a new finding, here 5 from a new service."
domain = "an online store"
domain_note = ""
youtube_description = "Infrastructure-as-code scanning for an online store's Kubernetes manifests: eight rules written in Java and tested with their own samples, Checkov, Trivy and KICS compared on the same files, the password all three miss, exceptions with an owner and an end date, and a baseline that fails the build only on new findings."
thumb_lines = ["IAC", "SCANNING"]
thumb_code = "checkov.io/skip1: CKV_K8S_19"
youtube_title = "IaC Scanning: Writing Rules, Comparing Checkov, Trivy and KICS, Exceptions and Baselines"
youtube_tags = ["iac scanning", "kubernetes security", "checkov", "trivy", "kics", "policy as code", "false positives", "devsecops", "shift left", "java"]

[readme]
intro = """
Scanning infrastructure code is cheap and early, which makes it easy to do badly: hundreds of findings nobody reads, a rule nobody tested, an exception nobody owns. This project works on the three parts that decide whether a scanner helps. A store's Kubernetes manifests are read by **eight rules written in Java** (each with a bad and a good sample that test the rule itself), then by **Checkov, Trivy and KICS** (KICS runs from its Docker image), then handled with **waivers** and a **baseline**. It needs Python 3, Trivy (`brew install trivy`) and Docker; the tests that use them are tagged `integration`: `./gradlew integrationTest`.

What it shows:
- **Writing a rule.** A rule is a question about one container. The eight: privileged, may run as root, latest or untagged image, no limits, a password in the file, the host network, a writable filesystem, privilege escalation. The first manifests give **13 findings**, the fixed ones 1.
- **Testing the rule.** Every rule has a bad and a good sample; **8 of 8** fire on the first and stay quiet on the second. A rule that only looks for `:latest` fails its own test on an image with no tag.
- **Three scanners.** They agree on **7 of the 8** rules. **All three miss a password written in the file**, and Checkov and KICS flag the good practice of reading it from a Secret. All three still give advice on the fixed files.
- **Exceptions.** A waiver names an owner, a reason and an end date; an expired one brings the finding back; one with no owner hides nothing. Checkov's annotation and Trivy's ignore file do the same inside the tools.
- **A baseline.** The build fails on a finding that is not in the accepted list, so a new service with a latest tag shows **5 new findings** while old ones do not block anyone.
- **The bill.** Every scanner has a blind spot; noise is a cost; an exception without an owner and an end date is a hole.

**Maps to:** NIST CSF 2.0 Protect (PR.PS) · CIS Kubernetes Benchmark · Pod Security Standards · CWE-250, CWE-798 · OWASP CI/CD Security Risks.
"""
analogy = """
A spell-checker for building plans. It catches the typos fast, but you must tell it which odd words are on purpose, and it cannot tell you the plan is for the wrong building.
"""
scenario = """
An online store ships web, orders and a metrics agent as Kubernetes workloads. The demo scans the first manifests, fixes them, and runs the same files through three tools.
"""
costs = [
    "**Noise:** the fixed files still draw dozens of findings from each tool.",
    "**Tools disagree in names and counts,** so comparing them takes a mapping.",
    "**A rule you wrote is a program,** and needs tests like one.",
    "**Exceptions pile up** unless they end.",
    "**Scanning files says nothing about the running cluster.**",
]
too_much = """
A single manifest for a demo on a laptop does not need three scanners and a baseline. Add them when several people change the files.
"""
met_before = [
    "A CI job that prints 300 warnings and always passes.",
    "A `latest` tag in a Deployment.",
    "A comment saying `# TODO remove` on an exception.",
    "A password in an env block.",
]
where = """
This is the first project of the [infrastructure-as-code-security](..) module. The module before it ended with [cloud-misconfigurations](../../cloud-security-without-a-cloud/cloud-misconfigurations). Rules that stop a deployment are the subject of policy-as-code.
"""
twin = """
The tools are real: Checkov from pip, Trivy from Homebrew and KICS from its image. The demo prints which checks fail, never how many, because each tool's rule set changes with its version.
"""
test_note = "The rules, waivers and baseline are tested with no tools. The rest run the three scanners (./gradlew integrationTest)."

[[act]]
title = "Eight rules in Java"
summary = "A rule is a question about one container; the first manifests break them 13 times, the fixed ones once."
detail = """
Three workloads: web with a privileged container and a latest tag, orders with a password written in the env block, and a metrics agent that needs the host network. The rules report 13 findings; after the fixes (a pinned image, limits, a read-only filesystem, no privilege escalation, the password from a Secret) one remains: the agent's host network.
"""
speech = """
First demo: eight rules in Java. [[slnc 400]] A rule is a question about one container. [[slnc 600]]
The first manifests break them thirteen times. [[slnc 300]] After the fixes, one finding is left, and it is a decision.
"""
rows = { rules = "active wrong" }
console = [
    ["web: privileged, root, latest, no limits", "bad"],
    ["orders: DB_PASSWORD written in the file", "bad"],
    ["13 findings; fixed: 1 (the agent's host network)", "ok"],
]

[[act]]
title = "Testing the rules"
summary = "Each rule has a bad and a good sample; 8 of 8 pass, and a rule that only knows :latest fails its own test."
detail = """
A rule is code, so it gets tests: a sample that must fire it and one that must not. All eight pass. A K3 that only looks for :latest is caught by the sample with no tag: it does not fire on its bad sample.
"""
speech = """
Second demo: testing the rules. [[slnc 400]] Every rule has a bad sample and a good sample. [[slnc 600]]
A rule that only knows the latest tag fails its own test.
"""
rows = { tests = "active ok" }
console = [
    ["8 of 8 rules pass their samples", "ok"],
    ["K3 that knows only :latest", "bad"],
    ["K3 does not fire on its bad sample", "ok"],
]

[[act]]
title = "Three scanners on the same files"
summary = "They agree on 7 of 8 rules; all three miss the password written in the file."
detail = """
Checkov, Trivy and KICS read the same manifests. For seven of the eight rules each has a check. For the password written in the env block none does, while Checkov and KICS flag the fixed version, which reads it from a Secret. All three still give advice on the fixed files.
"""
speech = """
Third demo: three scanners. [[slnc 400]] They agree on seven of eight rules. [[slnc 600]]
All three miss the password written in the file. [[slnc 300]] Two of them flag the safer version.
"""
rows = { tools = "active wrong" }
console = [
    ["7 of 8 rules found by all three", "ok"],
    ["password in the file: checkov no, trivy no, kics no", "bad"],
    ["password from a Secret: checkov yes, kics yes", "bad"],
]

[[act]]
title = "Exceptions"
summary = "A waiver has an owner, a reason and an end date; an expired one brings the finding back."
detail = """
The metrics agent needs the host network. A waiver naming an owner, a reason and 2026-12-31 hides the finding until that day; on 2027-01-01 the finding is back and the waiver is stale. A waiver with no owner hides nothing, and neither does one for another resource. Checkov's annotation and Trivy's ignore file hide the same finding inside the tools.
"""
speech = """
Fourth demo: exceptions. [[slnc 400]] An exception has an owner, a reason, and an end date. [[slnc 600]]
When the date passes, the finding comes back.
"""
rows = { waivers = "active ok" }
console = [
    ["waiver until 2026-12-31: 0 findings", "ok"],
    ["on 2027-01-01: the finding is back", "ok"],
    ["no owner: hides nothing", "ok"],
]

[[act]]
title = "A baseline, and the bill"
summary = "The build fails on new findings only; every scanner has a blind spot and an exception is a hole until it ends."
detail = """
Adding a cart service with a latest tag gives 5 new findings against the accepted list, and none fixed. The old findings do not block anyone, and the list can only shrink. The bill: noise, blind spots, exceptions that do not end, and files that say nothing about the running cluster.
"""
speech = """
Fifth demo: a baseline. [[slnc 400]] The build fails on new findings only. [[slnc 600]]
A new service with a latest tag shows five new findings. [[slnc 300]] The old ones do not block anyone, and the list can only shrink.
"""
rows = { baseline = "active ok" }
console = [
    ["new service cart: 5 new findings", "ok"],
    ["fixed since the baseline: 0", "ok"],
    ["an exception without an end date is a hole", "bad"],
]

[animation]
subtitle = "Rules, scanners, exceptions and a baseline for an online store's manifests."
boxes = [
    ["rules", "Our rules", "13 findings"],
    ["tests", "Rule tests", "8 of 8"],
    ["tools", "Three scanners", "7 of 8 agree"],
    ["waivers", "Exceptions", "owner and end date"],
    ["baseline", "Baseline", "new findings only"],
]

[docs.problem]
scenario = """
An online store changes its Kubernetes manifests every day and wants mistakes caught before they are applied.
"""
naive = """
Run a scanner in the pipeline, read nothing, and always pass.
"""
deliver = [
    "Rules written in code and tested with their own samples.",
    "Three real scanners compared on the same files.",
    "Exceptions that end.",
    "A baseline that fails the build on new findings only.",
]

[docs.prerequisites]
required = [
    "Java basics",
    "Python 3, Trivy and Docker",
]
not_required = [
    "A Kubernetes cluster",
]
install = ["python3", "trivy", "docker"]

[docs.session]
objectives = [
    "write a rule and test it",
    "compare scanners by what they miss",
    "write an exception that ends",
    "use a baseline to fail on new findings",
]
walkthrough = """
Run act three and find the one rule that no scanner has. In act four change the day and watch the finding return.
"""
exercises = [
    "Add a rule for a missing liveness probe and its samples.",
    "Add a rule that finds a password written in a ConfigMap.",
    "Write the waiver file as YAML and load it.",
    "Fail the build when a waiver is stale.",
]

[docs.explained]
sentence = """
A scanner is only as good as its rules, its exceptions and the discipline of acting on what it says.
"""
verdict = """
Test your own rules, use more than one scanner and know what each misses, give every exception an owner and an end date, and let a baseline stop only the new problems.
"""
recognise = [
    "`checkov.io/skip1` annotations with no reason.",
    "A `.trivyignore` file that only grows.",
    "A pipeline step with `|| true`.",
    "`image: x:latest`.",
]

[spec]
purpose = """
Teach infrastructure-as-code scanning by writing tested rules, comparing real scanners and handling exceptions and baselines.
"""
nongoals = [
    "Admission control (see policy-as-code).",
    "Scanning a running cluster.",
    "Writing rules for the tools' own languages.",
]
problem = """
Scans produce noise, miss things and collect exceptions, and then nobody trusts them.
"""
roles = [["The rules", "`Rules`, `Rule`"], ["The engine", "`Engine`"], ["The rule tests", "`RuleTester`"], ["The real tools", "`Scanners`"], ["Exceptions", "`Waiver`"], ["The baseline", "`Baseline`"], ["Entry point", "`IacScanningDemo`"]]
requirements = [
    "Rules are code over parsed manifests and each has a bad and a good sample.",
    "Checkov, Trivy and KICS run on the same files and are compared by rule.",
    "Waivers need an owner, a reason and an end date and expire.",
    "A baseline separates new findings from accepted ones.",
    "The demo prints the same output on every run and no counts that depend on a tool version.",
]

