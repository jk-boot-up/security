    { label = "Developer", nodes = ["dev"], colour = "red" },
    { label = "The pipeline", nodes = ["scan", "gate"], colour = "green" },
]
nodes = [
    { id = "dev", label = "Developer", sub = "changes manifests", col = 0, row = 0, colour = "red", threats = ["T1", "T2"] },
    { id = "scan", label = "Scanners", sub = "rules and tools", col = 1, row = 0, colour = "accent", threats = ["T1", "T3"] },
    { id = "gate", label = "Gate", sub = "waivers, baseline", col = 2, row = 0, colour = "amber", threats = ["T2"] },
]
edges = [
    { from = "dev", to = "scan", label = "commit", colour = "red", dashed = true, threats = ["T1"] },
