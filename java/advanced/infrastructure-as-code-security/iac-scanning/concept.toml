]

[threatmodel]
scope = """
The checks on infrastructure files in the build. It does not cover the running cluster or the images.
"""
assets = [
    "The manifests that reach the cluster.",
    "The trust in the scan result.",
]
actors = [
    "A developer in a hurry.",
    "An attacker who can change a manifest.",
]
boundaries = [
    "The pipeline: what it passes is applied.",
]
assumptions = [
    "The scanners run on the same files that are applied.",
]
out_of_scope = [
    "Compromised scanners.",
    "Changes made directly in the cluster.",
]
tests = [
    "`EngineTest` checks the rules, their samples, the waivers and the baseline with no tools.",
    "`ScannersTest` runs Checkov, Trivy and KICS.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next project in this module is policy-as-code.
"""

[[threat]]
id = "T1"
stride = "T"
threat = "A risky setting reaches the cluster because no rule knows it"
where = "the rules"
control = "Rules with their own tests and more than one scanner"
residual = "Problems no scanner has a check for"

[[threat]]
id = "T2"
stride = "R"
threat = "An exception hides a finding forever"
where = "waivers and ignore files"
control = "An owner, a reason and an end date, and a report of stale ones"
residual = "Valid waivers that are wrong"

[[threat]]
id = "T3"
stride = "D"
threat = "Noise makes people stop reading the scan"
where = "the report"
control = "A baseline that blocks only new findings"
residual = "A long accepted list"

