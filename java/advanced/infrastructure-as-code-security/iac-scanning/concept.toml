[[act]]
title = "Exceptions: a waiver with an owner and an end"
summary = "The agent's K6 is waived by the platform team until 2026-12-31: on 2026-10-22 it leaves 0 findings, on 2027-01-01 the finding is back with 1 stale waiver; a waiver with no owner, or for another resource, hides nothing. Checkov's annotation and Trivy's ignore file turn CKV_K8S_19 and KSV-0009 from failing to passing."
detail = """
The input is the one finding left, K6 on DaemonSet/metrics-agent, and a waiver for it: owner platform team, reason reads node counters from the host network, ends 2026-12-31. The dates are fixed, so the output does not depend on the day it runs.
The result by day and waiver: on 2026-10-22 the waiver leaves 0 findings; on 2027-01-01 it has ended, so 1 finding is back and the waiver is reported as stale; a waiver with no owner leaves 1; a waiver for DaemonSet/other leaves 1. Inside the tools: a checkov.io/skip1 annotation for CKV_K8S_19 and a .trivyignore line KSV-0009 turn each check from failing (yes) to passing (no). Neither of those has an end date.
"""
figure = "waiver_timeline"
figure_title = "A waiver that ends"
figure_speech = """
Fourth demo: exceptions. [[slnc 400]] The agent really needs the host network, so the finding is waived. [[slnc 300]] A waiver here has a rule, a resource, an owner, a reason, and an end date. [[slnc 700]]
On the timeline, the green bar is the waiver's life: it ends on the thirty first of December, twenty twenty six. [[slnc 300]] On the twenty second of October, it hides the finding: zero left. [[slnc 300]] On the first of January, twenty twenty seven, it has ended. [[slnc 300]] The finding comes back, and the waiver is reported as stale. [[slnc 600]]
Below, two waivers that hide nothing. [[slnc 300]] One has no owner, and one names another resource. [[slnc 300]] An exception without an owner and an end date is not an exception. It is a hole.
"""
speech = """
The input: the one finding left, and a waiver for it, owned by the platform team, ending on the thirty first of December. [[slnc 400]] The result: zero findings before the end, one after, and the waiver is stale. [[slnc 300]] No owner, or another resource: the waiver hides nothing.
[[page]]
The same inside the tools: an annotation for Checkov, and an ignore file for Trivy. [[slnc 300]] Both checks stop failing. [[slnc 300]] But neither has an owner or an end date.
"""
