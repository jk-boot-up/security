]

[threatmodel]
scope = """
The checks on infrastructure files in the build. It does not cover the running cluster or the images.
"""
assets = [
    "The manifests that reach the cluster.",
    "The trust in the scan result.",
]
actors = [
    "A developer in a hurry.",
    "An attacker who can change a manifest.",
]
boundaries = [
    "The pipeline: what it passes is applied.",
]
assumptions = [
    "The scanners run on the same files that are applied.",
]
out_of_scope = [
    "Compromised scanners.",
    "Changes made directly in the cluster.",
]
tests = [
    "`EngineTest` checks the rules, their samples, the tag reading, the matrix and settings views, the waivers and the baseline with no tools.",
    "`ScannersTest` checks the check mapping with no tools, and runs Checkov, Trivy and KICS (integration).",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next project in this module is policy-as-code.
"""

[[threat]]
id = "T1"
stride = "T"
threat = "A risky setting reaches the cluster because no rule knows it"
where = "the rules"
control = "Rules with their own tests and more than one scanner"
residual = "Problems no scanner has a check for"

[[threat]]
id = "T2"
stride = "R"
threat = "An exception hides a finding forever"
where = "waivers and ignore files"
control = "An owner, a reason and an end date, and a report of stale ones"
residual = "Valid waivers that are wrong"

[[threat]]
id = "T3"
stride = "D"
threat = "Noise makes people stop reading the scan"
where = "the report"
control = "A baseline that blocks only new findings"
residual = "A long accepted list"

[poster]
headline = [["IAC", "text"], ["SCANNING", "accent"]]
taglines = [["Eight tested rules, three pinned scanners, waivers that end and a baseline", "gold"]]
before = { code = "web: privileged, root, latest, no limits", note = "Eight rules in Java", tag = "BEFORE" }
after = { code = "6 now - 1 accepted = 5 new", note = "A baseline in the build", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "IaC Scanning"
narration = "Hello, and welcome. [[slnc 400]] This video explains I a C scanning. [[slnc 300]] I a C is infrastructure as code: deployment files, like Kubernetes manifests, that describe what should run. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] An infrastructure scanner reads those files before anything runs, and flags settings like a privileged container or a password written in the file. [[slnc 300]] Scanning is cheap and early, which makes it easy to do badly: rules nobody tested, findings nobody reads, and exceptions nobody owns. [[slnc 600]] Think of a spell checker that you must also check, and whose ignore list needs a date on every word. [[slnc 600]] Our example is an online store."

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online store ships three workloads", "on Kubernetes:", "  web, orders, and a metrics agent", "", "Eight rules written in Java,", "Checkov, Trivy and KICS,", "read the same manifests,", "before and after the fixes."]
narration = "Here is the scenario. [[slnc 400]] An online store ships three workloads on Kubernetes: a web front, an orders service, and a metrics agent. [[slnc 500]] Eight rules written in Java read the manifests, and so do three real scanners: Checkov, Trivy, and KICS. [[slnc 500]] The demo scans the first manifests, fixes them, tests the rules themselves, and then handles exceptions and a baseline the way a build would."

[[scene]]
key = "02-words"
kind = "bullets"
title = "The Words"
body = ["Manifest: a file that says what should run", "Container: one program, with its settings", "Rule: a question about one container", "Finding: a rule that one container breaks", "Waiver: an exception with an owner and an end", "Baseline: the findings accepted so far"]
narration = """Before the demos, the words. [[slnc 500]] A manifest is a file that says what should run in the cluster. [[slnc 500]] A container is one program, with its settings: its image, its limits, its security context. [[slnc 500]] A rule is a question about one container, like: does it run privileged? [[slnc 500]] A finding is one rule that one container breaks. [[slnc 500]] A waiver is an exception, with an owner, a reason and an end date. [[slnc 500]] And a baseline is the list of findings accepted so far, so only new ones fail the build."""

[[scene]]
key = "02-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "02-one-container"
kind = "figure"
title = "One container, eight questions"
body = "one_container"
narration = """Let's see the core idea on one example: the web container. [[slnc 400]] On the left, what its file sets: only two things. [[slnc 300]] The image is shop slash web colon latest. [[slnc 300]] And privileged is true. [[slnc 600]]
On the right, the eight rules, each a question about this one container. [[slnc 300]] Privileged: yes, broken. [[slnc 300]] The latest tag: broken. [[slnc 300]] And four more are broken by what the file does not say. [[slnc 300]] No run as non root, so it may run as root. [[slnc 300]] No limits, no read only filesystem, and nothing that stops privilege escalation. [[slnc 600]]
Only the secret rule and the host network rule pass. [[slnc 300]] A missing setting is a default, and the defaults are the risky choice. [[slnc 300]] That is why a scanner must read what is absent, too."""

[[scene]]
key = "03-acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "04-costs"
kind = "bullets"
title = "What It Costs"
body = ["Noise: many findings, few that matter", "Tools disagree in names and counts", "A rule you write is a program to test", "Exceptions pile up", "Files say nothing about the running cluster"]
narration = "Nothing is free. [[slnc 400]] Here is what it costs. [[slnc 500]] Noise: many findings, and only a few that matter. [[slnc 500]] Tools disagree, in their names for a problem and in their counts. [[slnc 500]] A rule you write is a program, and needs tests of its own. [[slnc 500]] Exceptions pile up, unless each one has an end date. [[slnc 300]] And scanning files says nothing about what is really running in the cluster."

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["A CI job that prints 300 warnings and passes", "image: shop/web:latest in a Deployment", "checkov.io/skip1 with no reason", "A .trivyignore file that only grows", "A password in an env block"]
narration = "You have probably met this already. [[slnc 400]] A continuous integration job that prints three hundred warnings, and always passes. [[slnc 500]] An image with the latest tag in a deployment. [[slnc 500]] A Checkov skip annotation with no reason, and a trivy ignore file that only grows. [[slnc 500]] And a password written in an env block, which, as we saw, no scanner flagged."

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Test every rule with a bad and a good sample", "Run more than one scanner, at pinned versions", "Write rules for what the tools miss", "Exceptions: an owner, a reason, an end date", "A baseline that fails on new findings only", "Scan the running cluster as well"]
narration = "So, how do you use it? [[slnc 400]] Test every rule with a bad sample and a good one. [[slnc 300]] Run more than one scanner, at pinned versions, because each one misses something and their checks change. [[slnc 500]] Write your own rules for what the tools miss, like a password in the file. [[slnc 300]] Give every exception an owner, a reason, and an end date. [[slnc 500]] Fail the build on new findings only, so the list can only shrink. [[slnc 300]] And scan the running cluster as well."

[[scene]]
key = "12-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a rule that finds a password", "written in a ConfigMap."]
narration = "That's infrastructure code scanning. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] A scanner helps only when its rules are tested, its findings are few enough to read, and every exception has an owner and an end date. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a rule that finds a password written in a config map. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] The rules are plain Java over the parsed manifests, and the tools are run as programs. [[slnc 300]] Here are the classes that matter."""

[[class]]
name = "Rules"
what = "the eight rules, each a question about one container"
[[class.part]]
title = "a rule and its two samples"
code = """
new Rule("K3", "image is latest or has no tag", c -> {
    String tag = tag(c.container().path("image").asString(""));
    return tag.isEmpty() || tag.equals("latest");
}, "image: shop/orders", "image: shop/web:1.8.2"),
"""
speech = """A rule has an id, a title, a question about one container, and two samples. [[slnc 300]] K three breaks when the image has no tag, or the latest tag."""
[[class.part]]
title = "reading the tag"
code = """
String last = image.substring(image.lastIndexOf('/') + 1);
int at = Math.max(last.lastIndexOf(':'), last.lastIndexOf('@'));
return at < 0 ? "" : last.substring(at + 1);
"""
speech = """The tag is what follows the last colon or at sign, in the last part of the name. [[slnc 300]] Looking only at the last part matters: a registry address can have a colon and a port."""

[[class]]
name = "Engine"
what = "runs every rule on every container of every document"
[[class.part]]
title = "one finding per broken rule"
code = """
for (JsonNode c : pod.path("containers")) {
    for (Rule r : rules) {
        if (r.breaks().test(new Rule.Container(pod, c))) {
            out.add(new Finding(r.id(), resource, c.path("name").asString()));
"""
speech = """The engine reads each document, finds the pod spec, and asks each rule about each container. [[slnc 300]] A yes is one finding: a rule, a resource, and a container."""

[[class]]
name = "RuleTester"
what = "tests a rule with its own bad and good samples"
[[class.part]]
title = "must fire, must stay quiet"
code = """
if (!fires(rule, rule.bad())) {
    return rule.id() + " does not fire on its bad sample";
}
if (fires(rule, rule.good())) {
    return rule.id() + " fires on its good sample";
"""
speech = """Each sample is put into a small pod and scanned with the one rule. [[slnc 300]] The bad sample must fire it, the good one must not. [[slnc 300]] That is how the mistaken K three was caught."""

[[class]]
name = "Scanners"
what = "runs Checkov, Trivy and KICS at pinned versions"
[[class.part]]
title = "Trivy from a pinned image"
code = """
cmd.addAll(List.of(TRIVY_IMAGE, "config", "--format", "json", "--quiet",
        "--skip-version-check", "--skip-check-update"));
"""
speech = """Trivy runs from a pinned image, and skip check update keeps the checks that came with it. [[slnc 300]] KICS is pinned by its image digest, and Checkov by its pip version, so the demo's output never changes on its own."""

[[class]]
name = "Waiver"
what = "a written exception that ends"
[[class.part]]
title = "valid, the same finding, and not ended"
code = """
return valid() && rule.equals(f.rule()) && resource.equals(f.resource())
        && !today.isAfter(expires);
"""
speech = """A waiver hides a finding only when it is valid, with an owner, a reason and an end date, names the same rule and resource, and has not ended."""

[[class]]
name = "Baseline"
what = "the findings accepted so far"
[[class.part]]
title = "only new findings count"
code = """
public static List<Finding> newFindings(List<Finding> now, List<Finding> accepted) {
    return now.stream().filter(f -> !accepted.contains(f)).toList();
"""
speech = """The build fails on a finding that is not in the accepted list. [[slnc 300]] Old findings do not block anyone, and new ones cannot slip in."""

[[acronym]]
short = "IaC"
long = "Infrastructure as Code: the setup written as files"
say = "I a C is infrastructure as code: servers, networks and workloads written as files, so they can be read and checked before they exist."
[[acronym]]
short = "YAML"
long = "YAML Ain't Markup Language: the format of the manifests"
say = "YAML is a text format of keys, values and lists. Kubernetes manifests are written in it."
[[acronym]]
short = "CI"
long = "Continuous Integration: the build that runs on every change"
say = "C I is continuous integration: the build and checks that run on every change."
[[acronym]]
short = "KICS"
long = "Keeping Infrastructure as Code Secure: Checkmarx's scanner"
say = "KICS stands for keeping infrastructure as code secure. It is an open source scanner from Checkmarx."
[[acronym]]
short = "CKV, KSV"
long = "Checkov's check ids; Trivy's Kubernetes check ids"
say = "Checkov's check ids start with C K V. Trivy's Kubernetes checks start with K S V."
[[acronym]]
short = "CPU"
long = "Central Processing Unit: a container's processor share"
say = "C P U is the central processing unit. A limit on C P U caps how much processor a container may use."
[[acronym]]
short = "K1, K2, K3, K4, K5, K6, K7, K8"
long = "the ids of our eight rules"
say = "K one to K eight are the ids of our own eight rules, K for Kubernetes."
[[acronym]]
short = "ALL"
long = "drop ALL: remove every Linux capability"
say = "Drop all, in capital letters, removes every Linux capability from a container."
