    { id = "rules", label = "Rules and tools", sub = "Java, Checkov, Trivy, KICS", col = 1, row = 0, colour = "accent" },
    { id = "waivers", label = "Waivers", sub = "owner, end date", col = 2, row = 0, colour = "amber" },
    { id = "gate", label = "Baseline gate", sub = "new findings only", col = 3, row = 0, colour = "green" },
]
edges = [
    { from = "files", to = "rules", label = "scan" },
    { from = "rules", to = "waivers" },
    { from = "waivers", to = "gate" },
]

