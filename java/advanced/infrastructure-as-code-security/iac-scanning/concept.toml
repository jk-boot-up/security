This is the first project of the [infrastructure-as-code-security](..) module. The module before it ended with [cloud-misconfigurations](../../cloud-security-without-a-cloud/cloud-misconfigurations). Rules that stop a deployment are the subject of policy-as-code.
"""
twin = """
The tools are real and pinned: Checkov 3.3.30 from pip, Trivy 0.76.0 from its image with the checks built into it, and KICS from its image by digest. A tool's rule set changes with its version, so pinning is what keeps the golden output, and its counts, stable.
"""
test_note = "The rules, their samples, the tag reading, the matrix, waivers and baseline are tested with no tools (./gradlew test). The rest run the three scanners (./gradlew integrationTest). Dates are fixed, so the output does not depend on the day."

