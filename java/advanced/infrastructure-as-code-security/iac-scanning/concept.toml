The rest of the samples. [[slnc 300]] The result: eight of eight rules pass. [[slnc 400]] Then a K three with a mistake: it only looks for colon latest. [[slnc 300]] On shop slash orders, it does not fire, and its test fails.
[[page]]
How the real K three reads shop slash orders: the last part is orders, there is no tag, so it fires.
"""
