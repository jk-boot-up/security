    { id = "cases", label = "Cases", sub = ["good()", "all()", "rules()"], col = 0, row = 0, colour = "accent" },
    { id = "opa", label = "Opa", sub = ["deny()", "test()", "conftest()"], col = 1, row = 0, colour = "amber" },
    { id = "mutants", label = "Mutants", sub = ["count()", "disable()", "killed()"], col = 2, row = 0, colour = "green" },
]
edges = [
    { from = "opa", to = "cases", label = "decides" },
    { from = "mutants", to = "opa", label = "runs tests with" },
]

[[diagram]]
name = "data-flow-diagram"
kind = "flow"
title = "From a request to a decision"
caption = "The object is read from either shape of input."
nodes = [
