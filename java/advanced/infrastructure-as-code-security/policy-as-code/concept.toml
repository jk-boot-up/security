long = "Open Policy Agent: a general policy engine"
say = "O P A is the Open Policy Agent, a general policy engine. Its language is Rego."
[[acronym]]
short = "API"
long = "Application Programming Interface"
say = "A P I means application programming interface. The Kubernetes A P I server receives every request to create something."
[[acronym]]
short = "R1-R11"
long = "Rule numbers in the bank's policy"
say = "R one to R eleven are the rule numbers of the bank's policy. Every deny message starts with one."
[[acronym]]
short = "CPU"
long = "Central Processing Unit: a container's cpu limit"
say = "C P U is the central processing unit. A cpu limit caps how much processor time a container may use."
[[acronym]]
