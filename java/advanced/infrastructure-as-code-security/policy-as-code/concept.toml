# concept.toml: everything about this project that is not Java code.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "policy-as-code"
level = "advanced"
module = "infrastructure-as-code-security"
title = "Policy as Code"
short_title = "Policy as Code"
package = "policyascode"
main_class = "PolicyAsCodeDemo"
tagline = "Write a bank's deny-by-default deployment policy in Rego, test the policy and test its tests, and run it as an admission review and in the build with Conftest"
bold = "A bank's deployment policy in Rego (OPA) denies everything that does not pass its ten rules, and a table of 13 requests agrees with it on 13 of 13; the first draft agreed on only 11, because an empty object and a Deployment without containers were allowed (a missing field made the rule undefined, so nothing was denied); a list of what is forbidden allows a container with no security context and no limits, the policy that asks for what is required denies it; opa test runs 17 tests, and switching off one of the 12 rules at a time shows how good the tests are: 8 of 12 with one test for each rule, 12 of 12 with all; the same file serves an admission review (allowed true or false with the reasons) and Conftest in the build (exit 1), and a new rule is rolled out as a warning (exit 0) before it becomes a denial (exit 1)."
domain = "a bank"
domain_note = ""
youtube_description = "Policy as code for a bank's Kubernetes deployments: a deny-by-default policy in Rego, a table of requests it must decide as a reviewer expects, the holes a missing field leaves, tests for the policy and mutation testing of those tests, an admission review, Conftest in the build and a warning-first rollout."
thumb_lines = ["POLICY", "AS CODE"]
thumb_code = "not c.securityContext.runAsNonRoot == true"
youtube_title = "Policy as Code: Deny-by-Default Rego Rules, Testing the Policy and Its Tests (OPA, Conftest)"
youtube_tags = ["policy as code", "open policy agent", "rego", "conftest", "kubernetes admission control", "deny by default", "mutation testing", "devsecops", "compliance as code", "java"]

[readme]
intro = """
A rule in a wiki is a wish; a rule in code is checked on every change. This project writes a bank's deployment policy in **Rego**, the language of **Open Policy Agent**, and spends most of its effort on the part that is easy to skip: making sure the policy is right. A Java program drives the real `opa` and `conftest` command line tools (`brew install opa conftest`); the tests that use them are tagged `integration`: `./gradlew integrationTest`. The policy is in [`policy/main.rego`](policy/main.rego) with its tests beside it.

What it shows:
- **Deny by default.** Ten rules: allowed kinds, the bank's registry, non-root, not privileged, limits, an owner label, no host network, no `latest`, no default namespace, and containers declared. A table of **13 requests**, each with the rules a reviewer expects it to break, and the policy agrees on **13 of 13**.
- **The holes.** The first draft agreed on only **11 of 13**: an empty object and a Deployment with no containers were allowed, because a missing field makes a rule undefined and an undefined rule denies nothing. A list of what is forbidden does the same to a container with no security context.
- **Testing the policy.** `opa test` runs **17 tests**. Switching off one rule at a time (12 mutants) and asking whether the tests notice gives **8 of 12** with one test for each rule and **12 of 12** with all of them: the missing four are the cases a happy-path test never reaches.
- **In the cluster and in the build.** The same file answers an AdmissionReview (`allowed: false` with the reasons) and Conftest on files (exit 1). A new rule is first a **warning** (exit 0), then a denial (exit 1).
- **The bill.** A policy is code: reviewed, versioned and tested, and so are its tests.

**Maps to:** NIST CSF 2.0 Govern and Protect (GV.PO policy, PR.PS) · NIST SP 800-53 CM-6, CM-7 · CIS Kubernetes Benchmark · Pod Security Standards · OPA Gatekeeper and Kyverno are the same idea in other engines.
"""
analogy = """
A security checkpoint with a written list of what may pass. The list that says "no knives" lets through anything it did not think of. The list that says "only these items" does not. Then someone has to test the guard, not only the list.
"""
scenario = """
A bank deploys its payment services to Kubernetes and wants nothing to run that its security team has not allowed. The demo feeds the policy thirteen requests, then breaks the policy on purpose to see whether the tests notice.
"""
costs = [
    "**A new language to learn,** with undefined as a third value besides true and false.",
    "**Deny by default blocks legitimate work** until the policy catches up.",
    "**Tests for the policy are a second program** to keep up to date.",
    "**A policy engine in the request path** can take the cluster down if it fails closed or open at the wrong time.",
    "**Rules about files say nothing about what was changed by hand.**",
]
too_much = """
A team with three services and one cluster can use the built-in Pod Security Standards. Write your own policy when rules are specific to the organisation (a registry, an owner label) or must be tested and reviewed like code.
"""
met_before = [
    "A wiki page of deployment rules that nobody checks.",
    "A pipeline step that greps for `latest`.",
    "A policy that was copied and never tested.",
    "An exception made in the cluster by hand.",
]
where = """
This is the second project of the [infrastructure-as-code-security](..) module, after [iac-scanning](../iac-scanning). Enforcing the policy inside a cluster is the subject of kubernetes-admission-control, in the next module.
"""
twin = """
The tools are real (`opa` and `conftest`), and the AdmissionReview has the shape a validating webhook receives; there is no cluster. The demo prints decisions and counts of tests, never paths or ids.
"""
test_note = "The cases, the mutants and the response are tested with no tools. The rest run opa and conftest (./gradlew integrationTest)."

[[act]]
title = "Deny by default"
summary = "Ten rules, and a table of 13 requests that the policy decides as a reviewer expects."
detail = """
Each request has the rules a reviewer expects it to break: a foreign registry, a latest tag, no security context, privileged, no limits, no owner label, host network, a ClusterRoleBinding, the default namespace, three mistakes at once, an empty object and a Deployment with no containers. The good request is allowed; the others are denied with the right rule numbers. The policy agrees on 13 of 13.
"""
speech = """
First demo: deny by default. [[slnc 400]] Thirteen requests, and for each one the rules a reviewer says it breaks. [[slnc 600]]
The policy agrees on all thirteen.
"""
rows = { policy = "active ok" }
console = [
    ["good: allow", "ok"],
    ["three mistakes: deny R2 R3 R8", "ok"],
    ["agree on 13 of 13 requests", "ok"],
]

[[act]]
title = "The holes"
summary = "The first draft agreed on 11 of 13: a missing field made a rule undefined, so nothing was denied."
detail = """
Without the two guard rules the policy allows an empty object and a Deployment with no containers. The same trap in a list of what is forbidden: the rule compares a field to false, the field is missing, the comparison is undefined and the container passes. The policy that asks for what is required denies the container with no security context and no limits: R3 and R5.
"""
speech = """
Second demo: the holes. [[slnc 400]] The first draft agreed on eleven of thirteen. [[slnc 600]]
A missing field makes a rule undefined, and an undefined rule denies nothing. [[slnc 300]] Ask for what is required, not for what is forbidden.
"""
rows = { holes = "active wrong" }
console = [
    ["draft: an empty object: allow", "bad"],
    ["naive list: no securityContext, no limits: allow", "bad"],
    ["main.rego: deny R3 R5", "ok"],
]

[[act]]
title = "Testing the policy and its tests"
summary = "17 tests pass; switching off one of 12 rules at a time, one test for each rule notices 8 and all tests notice 12."
detail = """
opa test runs the Rego tests: 17 of 17. To test the tests, each of the 12 deny rules is switched off in turn and the suite is run again. Three tests notice 2 mutants, one test for each rule notices 8, and the full suite notices 12. The four it misses are the cases a happy-path test never reaches: only the cpu limit missing, only the memory limit, no kind, no containers.
"""
speech = """
Third demo: testing the policy. [[slnc 400]] Seventeen tests pass. [[slnc 600]]
Switch off one rule at a time and see if the tests notice. [[slnc 300]] One test for each rule notices eight of twelve. All the tests notice twelve.
"""
rows = { tests = "active ok" }
console = [
    ["opa test: 17 of 17", "ok"],
    ["one test for each rule: 8 of 12 mutants", "bad"],
    ["all tests: 12 of 12", "ok"],
]

[[act]]
title = "In the cluster and in the build"
summary = "An AdmissionReview gets allowed false with reasons, Conftest exits 1 on files, and a new rule starts as a warning."
detail = """
The same file reads an AdmissionReview and plain manifests. A Deployment from docker.io with a latest tag is not allowed, with 2 reasons; the good one is. Conftest on three files exits 1 and lists the failures by file. A new rule for a writable root filesystem is a warning first (exit 0, 1 warning) and a denial after (exit 1).
"""
speech = """
Fourth demo: in the cluster and in the build. [[slnc 400]] The same file answers an admission review and a build. [[slnc 600]]
A new rule starts as a warning, and becomes a denial when the team has fixed what it finds.
"""
rows = { enforce = "active ok" }
console = [
    ["admission: allowed=false, 2 reasons", "ok"],
    ["conftest on three files: exit 1", "ok"],
    ["new rule as warn: exit 0; as deny: exit 1", "ok"],
]

[[act]]
title = "The bill"
summary = "A policy is code; a missing field must mean deny; a rule is rolled out as a warning first."
detail = """
A policy is reviewed, versioned and tested, and its tests are tested. A missing field must mean deny. Roll a rule out as a warning before it denies. The cost is a language to learn, a second program of tests, and an engine in the request path.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] A policy is code, so review it, version it, and test it. [[slnc 600]]
Test the tests as well. [[slnc 300]] And roll out a new rule as a warning before it denies.
"""
rows = { bill = "active wrong" }
console = [
    ["a missing field must mean deny", "bad"],
    ["test the tests: mutation", "ok"],
    ["warn first, deny later", "ok"],
]

[animation]
subtitle = "A bank's deployment policy, tested and enforced."
boxes = [
    ["policy", "Deny by default", "13 of 13"],
    ["holes", "The holes", "11 of 13"],
    ["tests", "Testing it", "8, then 12 of 12"],
    ["enforce", "Cluster and build", "review, conftest"],
    ["bill", "The bill", "code, warn first"],
]

[docs.problem]
scenario = """
A bank wants every deployment checked against its rules, in the build and again in the cluster.
"""
naive = """
Write the rules on a wiki page and ask reviewers to remember them.
"""
deliver = [
    "A deny-by-default policy in Rego.",
    "A table of requests it must decide as a reviewer expects.",
    "Tests for the policy and mutation testing of those tests.",
    "An AdmissionReview and Conftest on files, and a warning-first rollout.",
]

[docs.prerequisites]
required = [
    "Java basics",
    "opa and conftest (brew install opa conftest)",
]
not_required = [
    "A Kubernetes cluster",
]
install = ["opa", "conftest"]

[docs.session]
objectives = [
    "write a deny-by-default rule in Rego",
    "explain why undefined fails open",
    "test a policy and test its tests",
    "roll a rule out as a warning",
]
walkthrough = """
Run act two and find the two requests the draft allows. In act three find the four mutants that one test for each rule misses.
"""
exercises = [
    "Add a rule that every Deployment has at least two replicas and its tests.",
    "Write the test that kills the cpu limit mutant only.",
    "Add an exception list as data with an owner and an end date.",
    "Make Conftest fail the build on warnings.",
]

[docs.explained]
sentence = """
A policy that cannot say no to what it did not expect is not a policy.
"""
verdict = """
Ask for what is required, deny when a field is missing, test every rule with a case it must deny and one it must allow, test the tests by switching rules off, and roll out a new rule as a warning.
"""
recognise = [
    "`deny` rules that compare a field with `false`.",
    "`opa test` with only happy-path cases.",
    "A policy repository with no tests.",
    "A webhook with `failurePolicy: Ignore`.",
]

[spec]
purpose = """
Teach policy as code by writing, breaking, testing and enforcing a bank's deployment policy in Rego.
"""
nongoals = [
    "Running a webhook in a cluster (see kubernetes-admission-control).",
    "Rego beyond the rules used here.",
    "Gatekeeper and Kyverno.",
]
problem = """
Deployment rules that live on a wiki are not enforced, and policies that live in code are rarely tested.
"""
roles = [["The policy", "`policy/main.rego`"], ["The tools", "`Opa`"], ["The requests", "`Cases`"], ["The tests of the tests", "`Mutants`"], ["The webhook shape", "`Admission`"], ["Entry point", "`PolicyAsCodeDemo`"]]
requirements = [
    "The policy denies by default and treats a missing field as a denial.",
    "A table of requests with expected rules is decided as expected.",
    "The policy has Rego tests and mutation testing of them.",
    "The same file serves an AdmissionReview and Conftest.",
    "A new rule can be a warning before it is a denial.",
    "The demo prints the same output on every run.",
]

