title = "Policy as Code"
narration = "Hello, and welcome. [[slnc 400]] This video explains policy as Code, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A bank's deployment policy in Rego (O P A) denies everything that does not pass its ten rules, and a table of 13 requests agrees with it on 13 of 13; the first draft agreed on only 11, because an empty object and a Deployment without containers were allowed (a missing field made the rule undefined, so nothing was denied); a list of what is forbidden allows a container with no security context and no limits, the policy that asks for what is required denies it; opa test runs 17 tests, and switching off one of the 12 rules at a time shows how good the tests are: 8 of 12 with one test for each rule, 12 of 12 with all; the same file serves an admission review (allowed true or false with the reasons) and Conftest in the build (exit 1), and a new rule is rolled out as a warning (exit 0) before it becomes a denial (exit 1). [[slnc 600]] Think of it this way. [[slnc 300]] A security checkpoint with a written list of what may pass. The list that says \"no knives\" lets through anything it did not think of. The list that says \"only these items\" does not. Then someone has to test the guard, not only the list. [[slnc 700]] In this video, the domain is a bank. [[slnc 500]] By the end, you will be able to: [[slnc 300]] Write a deny-by-default rule in Rego. [[slnc 300]] Explain why undefined fails open. [[slnc 300]] Test a policy and test its tests."

