[[act]]
title = "The holes: a missing field"
summary = "The first draft, without the last two rules, allowed an empty object and a Deployment with no containers: 11 of 13. object.kind is undefined, so the rule about allowed kinds is undefined too and makes no message. naive.rego compares runAsNonRoot == false, which is undefined for a missing field, so it allows a container that main.rego denies with R3 and R5."
detail = """
Before the fix, the draft has ten deny rules. It allows the empty object (the reviewer expects R1) and the Deployment with no containers (the reviewer expects R10), so it agrees on 11 of 13.
How the empty object is read: object.kind is undefined; the line not object.kind in allowed_kinds is undefined too, so the rule body fails and no message is made. The line not object.kind is true. How the Deployment with no containers is read: count(containers) is 0, so every rule that loops over the containers has nothing to check, and count(containers) == 0 is true.
After the fix, two rules ask for what is required: R1 a kind at all (not object.kind) and R10 at least one container (count(containers) == 0). The policy agrees on 13 of 13.
The same trap in a list of what is forbidden: for the good request with no securityContext and no limits, c.securityContext.runAsNonRoot is undefined, so naive.rego's runAsNonRoot == false is undefined and it allows the container. main.rego's not runAsNonRoot == true is true, so it denies with R3 and R5.
"""
figure = "missing_field"
figure_title = "A missing field is undefined, and undefined denies nothing"
figure_speech = """
Second demo: the holes. [[slnc 400]] At the top left, before the fix. [[slnc 300]] The first draft did not have the last two rules, and it allowed two requests the reviewer wanted denied: an empty object, and a Deployment with no containers. [[slnc 700]]
Below it, how Rego read them, step by step, with the values from opa. [[slnc 300]] In the empty object, object dot kind is undefined: the field is not there. [[slnc 300]] So the line that asks whether the kind is allowed is undefined too, and the rule makes no message. [[slnc 300]] But not object dot kind is true. [[slnc 300]] In the Deployment with no containers, the count is zero, so the rules about containers have nothing to check. [[slnc 700]]
On the right, the same trap in a list of what is forbidden. [[slnc 300]] The naive rule asks whether run as non root equals false. [[slnc 300]] The field is missing, so the answer is undefined, and the container is allowed. [[slnc 300]] The main policy asks the opposite question: not equal to true. [[slnc 300]] That is true, so it denies. [[slnc 500]] Ask for what is required, and a missing field is denied.
"""
speech = """
Before the fix: the draft allows the empty object and the Deployment with no containers. [[slnc 300]] It agrees on eleven of thirteen. [[slnc 400]] Then the value of each step. [[slnc 300]] Object dot kind is undefined, and so is the line that checks it. [[slnc 300]] Not object dot kind is true. [[slnc 300]] With no containers, the count is zero.
[[page]]
After the fix: two rules that ask for what is required, a kind at all, and at least one container. [[slnc 300]] Thirteen of thirteen again. [[slnc 400]] Then the same trap in naive dot rego. [[slnc 300]] Equal to false is undefined, so it allows. [[slnc 300]] Not equal to true is true, so main dot rego denies with rules three and five.
"""
rows = { holes = "active wrong" }
console = [
    ["BEFORE THE FIX (the first draft, without the last two rules):", "code"],
    ["  request               reviewer       draft", "muted"],
    ["  an empty object       deny R1        allow", "bad"],
    ["  no containers         deny R10       allow", "bad"],
    ["  the first draft agrees on 11 of 13", "muted"],
    ["HOW THE EMPTY OBJECT IS READ (the value of each step):", "code"],
    ["  object.kind                                 undefined", "bad"],
    ["  not object.kind in allowed_kinds            undefined", "bad"],
    ["  not object.kind                             true", "ok"],
    ["HOW THE DEPLOYMENT WITH NO CONTAINERS IS READ:", "code"],
    ["  count(containers)                           0", "muted"],
    ["  count(containers) == 0                      true", "ok"],
    ["---", ""],
    ["AFTER THE FIX (rules that ask for what is required):", "code"],
    ["  R1: a kind at all              not object.kind", "muted"],
    ["  R10: at least one container    count(containers) == 0", "muted"],
    ["  the policy agrees on 13 of 13", "ok"],
    ["THE SAME TRAP IN A LIST OF WHAT IS FORBIDDEN:", "code"],
    ["  the request: the good one, no securityContext, no limits", "muted"],
    ["  c.securityContext.runAsNonRoot              undefined", "bad"],
    ["  c.securityContext.runAsNonRoot == false     undefined", "bad"],
    ["  not c.securityContext.runAsNonRoot == true  true", "ok"],
    ["  naive.rego (== false)        allow", "bad"],
    ["  main.rego (not ... == true)  deny R3 R5", "muted"],
]

[[act]]
title = "Testing the policy and its tests"
summary = "opa test passes 17 of 17 tests. Each of the 12 rules is switched off in turn by renaming deny to deny_off; 3 tests notice 2 of the 12 mutants, 13 tests (one for each rule) notice 8, and all 17 notice 12."
detail = """
The input is policy/main_test.rego: opa test runs 17 tests and all pass.
How a mutant is made: rule 5 of 12 (R5: a cpu limit) starts with deny contains msg if; the mutant renames it to deny_off contains msg if. Nobody asks for deny_off, so the rule is switched off. If no test fails, no test checks that rule.
The result, per rule: 3 tests (the good request and the two R1 tests) notice 2 mutants, the two R1 rules. 13 tests, one for each rule, notice 8: they miss the cpu limit alone, the memory limit alone, a kind at all, and at least one container. All 17 tests notice all 12.
"""
figure = "mutant_grid"
figure_title = "Switch off one rule at a time: which tests notice?"
figure_speech = """
Third demo: testing the policy, and testing its tests. [[slnc 400]] The policy has seventeen tests of its own, and all of them pass. [[slnc 300]] But a passing test suite does not say which rules it checks. [[slnc 700]]
So we make mutants. [[slnc 300]] A mutant is the policy with one rule switched off: deny is renamed to deny off, which nobody asks for. [[slnc 300]] Twelve rules give twelve mutants. [[slnc 300]] For each one we run the tests again. [[slnc 300]] If a test fails, the mutant is noticed. [[slnc 700]]
Each row is one rule, and each column is a test suite. [[slnc 300]] Three tests notice only the two rules about the kind. [[slnc 300]] Thirteen tests, one for each rule, notice eight. [[slnc 300]] They miss a cpu limit alone, a memory limit alone, a kind at all, and at least one container. [[slnc 300]] All seventeen tests notice all twelve.
"""
speech = """
Here is the output. [[slnc 400]] Opa test: seventeen of seventeen tests pass. [[slnc 300]] Then how a mutant is made: the rule's first line, before and after. [[slnc 300]] Deny contains message becomes deny off contains message. [[slnc 400]] Then the table: the first rules, with three, thirteen and seventeen tests.
[[page]]
The last rules. [[slnc 300]] The result: three tests notice two mutants, thirteen tests notice eight, and all seventeen notice twelve of twelve.
"""
