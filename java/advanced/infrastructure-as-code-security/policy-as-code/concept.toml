    { id = "deny", label = "deny messages", sub = "R1 to R10", col = 1, row = 0, colour = "amber" },
    { id = "allow", label = "allow", sub = "no messages", col = 2, row = 0, colour = "green" },
]
edges = [
    { from = "input", to = "deny" },
    { from = "deny", to = "allow", label = "count is 0" },
]

[[diagram]]
name = "sequence-diagram"
kind = "sequence"
title = "An admission review"
participants = ["API server", "Webhook", "OPA"]
steps = [
    ["API server", "Webhook", "AdmissionReview with the object"],
    ["Webhook", "OPA", "data.main.deny"],
    ["OPA", "Webhook", "R2 and R8 messages", "reply"],
    ["Webhook", "API server", "allowed false, with the reasons", "reply"],
]

[[diagram]]
name = "uml-diagram"
kind = "sequence"
title = "Testing the tests"
participants = ["Mutants", "Policy", "opa test"]
steps = [
    ["Mutants", "Policy", "switch off rule n"],
    ["Mutants", "opa test", "run the suite on the mutant"],
    ["opa test", "Mutants", "a failure means the mutant is killed", "reply"],
]

[[diagram]]
name = "threat-model-diagram"
kind = "flow"
title = "Threat model: trust boundaries and threats"
caption = "Dashed boxes are trust boundaries. Rose tags show where each threat in the table applies."
zones = [
    { label = "Developer", nodes = ["dev"], colour = "red" },
    { label = "Platform", nodes = ["policy", "cluster"], colour = "green" },
]
nodes = [
    { id = "dev", label = "Developer", sub = "submits manifests", col = 0, row = 0, colour = "red", threats = ["T1", "T3"] },
    { id = "policy", label = "Policy", sub = "Rego, tested", col = 1, row = 0, colour = "accent", threats = ["T1", "T2"] },
    { id = "cluster", label = "Cluster", sub = "admission", col = 2, row = 0, colour = "amber", threats = ["T3"] },
]
edges = [
    { from = "dev", to = "policy", label = "request", colour = "red", dashed = true, threats = ["T1"] },
    { from = "policy", to = "cluster", label = "decision", threats = ["T2", "T3"] },
]

[threatmodel]
scope = """
The rules that decide which workloads may be created. It does not cover the images, the nodes or changes that bypass the API server.
"""
assets = [
    "The cluster's workloads.",
    "The policy itself.",
]
actors = [
    "A developer who submits a manifest.",
    "An attacker who finds a gap in the policy.",
    "A maintainer who changes the policy.",
]
boundaries = [
    "The admission point: nothing is created without passing it.",
]
assumptions = [
    "The webhook is called for every request and fails closed.",
]
out_of_scope = [
    "Compromise of the API server.",
    "Policies for network traffic.",
]
tests = [
    "`PolicyTest` checks the cases, the mutants and the response with no tools, and the decisions, the Rego tests and the mutation score with opa.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next project, in the module kubernetes-and-container-security, is kubernetes-admission-control.
"""

[[threat]]
id = "T1"
stride = "E"
threat = "A gap in the policy lets a risky workload in"
where = "the rules"
control = "Deny by default, a table of cases and tests for every rule"
residual = "Cases nobody thought of"

[[threat]]
id = "T2"
stride = "T"
threat = "A change to the policy weakens it unnoticed"
where = "the policy repository"
control = "Review, tests and mutation testing in the build"
residual = "A reviewer who approves a bad test"

[[threat]]
id = "T3"
stride = "D"
threat = "A strict new rule blocks legitimate deployments"
where = "admission"
control = "Roll out as a warning first"
residual = "Time spent on warnings"

