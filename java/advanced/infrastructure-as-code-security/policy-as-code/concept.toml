    { id = "tests", label = "Tests", sub = "17, and mutants", col = 1, row = 0, colour = "amber" },
    { id = "ci", label = "Conftest", sub = "files in the build", col = 2, row = 0, colour = "client" },
    { id = "webhook", label = "AdmissionReview", sub = "allowed true or false", col = 3, row = 0, colour = "green" },
]
edges = [
