[[act]]
title = "In the cluster and in the build"
summary = "An AdmissionReview of a Deployment with docker.io/library/nginx:latest gets allowed false with the R2 and R8 reasons; Conftest on three files fails b-cart.yaml (R8) and c-legacy.yaml (R2 R8) and exits 1; a new rule R11 for a read-only root filesystem exits 0 with 1 warning, then 1 with 1 failure."
detail = """
The input in the cluster is an AdmissionReview (apiVersion admission.k8s.io/v1) with uid 705ab4f5 and a Deployment named payments whose image is docker.io/library/nginx:latest. The result is the response: allowed false, with the reasons R2 (a foreign registry) and R8 (the latest tag). The good Deployment gets allowed true.
The input in the build is three files: a-payments.yaml with registry.bank.example/payments:2.3.1, b-cart.yaml with registry.bank.example/payments:latest, and c-legacy.yaml with docker.io/library/nginx:latest. Conftest passes the first, fails b-cart.yaml on R8 and c-legacy.yaml on R2 and R8, and exits 1, so the build stops.
A new rule, R11, asks for a read-only root filesystem, which payments.yaml does not set. First as a warning (warn contains msg): exit 0, 1 warning, 0 failures, the build goes on. Later as a denial (deny contains msg): exit 1, 0 warnings, 1 failure, the build stops.
"""
figure = "cluster_and_build"
figure_title = "One policy file, in the cluster and in the build"
figure_speech = """
Fourth demo: the same policy file, in the cluster and in the build. [[slnc 400]] At the top left, the request. [[slnc 300]] When someone creates a Deployment, the Kubernetes A P I server sends an admission review to a webhook. [[slnc 300]] This one is the payments Deployment, with an nginx image from docker dot io, tagged latest. [[slnc 600]]
Below it, the response. [[slnc 300]] Allowed is false, and the two reasons go back to the person who asked. [[slnc 300]] The good Deployment is allowed. [[slnc 700]]
On the right, the build. [[slnc 300]] Conftest reads three files with the same policy. [[slnc 300]] One passes, two fail, and Conftest exits with one, so the build stops before anything reaches the cluster. [[slnc 700]]
At the bottom, a new rule: a read only root filesystem. [[slnc 300]] As a warning, Conftest exits with zero, and the build goes on while teams fix their files. [[slnc 300]] Later, as a denial, it exits with one.
"""
speech = """
The request: an admission review, with its A P I version, a request identifier, and the Deployment's image. [[slnc 400]] The response: allowed is false, with the rule two and rule eight messages. [[slnc 300]] The good Deployment is allowed.
[[page]]
The files in the build, and their images. [[slnc 300]] What Conftest says: the first passes, the cart fails on rule eight, and the legacy file fails on rules two and eight. [[slnc 300]] Exit one: the build stops.
[[page]]
A new rule, rule eleven. [[slnc 300]] First as a warning: exit zero, one warning, and the build goes on. [[slnc 300]] Later as a denial: exit one, one failure, and the build stops.
