[poster]
headline = [["POLICY", "text"], ["AS CODE", "accent"]]
taglines = [["A deny-by-default policy in Rego, tested, and its tests tested", "gold"]]
before = { code = "c.securityContext.runAsNonRoot == false", note = "A missing field is allowed", tag = "BEFORE" }
after = { code = "not c.securityContext.runAsNonRoot == true", note = "A missing field is denied", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "Policy as Code"
narration = "Hello, and welcome. [[slnc 400]] This video explains policy as code, with the Open Policy Agent, O P A, and its language, Rego. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A rule in a wiki is a wish. [[slnc 300]] A rule written as code is checked on every change, in the build and in the cluster. [[slnc 300]] A deny by default policy refuses anything it cannot prove is allowed. [[slnc 300]] And because a policy is code, it needs tests, and its tests need testing too. [[slnc 600]] Think of a bank's checklist for opening an account, that refuses a form with any box left blank. [[slnc 600]] Our example is a bank."

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["A bank deploys its payment services", "to Kubernetes, and wants nothing to run", "that its security team has not allowed.", "", "The demo feeds the Rego policy 13 requests,", "breaks the policy on purpose to see", "whether the tests notice, and runs it", "as an admission review and with Conftest."]
narration = "Here is the scenario. [[slnc 400]] A bank deploys its payment services to Kubernetes, and wants nothing to run that its security team has not allowed. [[slnc 500]] The demo writes the policy in Rego, and feeds it thirteen requests, each with the rules a reviewer expects it to break. [[slnc 500]] Then it breaks the policy on purpose, one rule at a time, to see whether the tests notice, and runs it as an admission review in the cluster and with Conftest in the build."

[[scene]]
key = "02-words"
kind = "bullets"
title = "The Words"
body = ["Policy: rules that decide yes or no", "Rego: the language of Open Policy Agent", "deny rule: adds a message when it matches", "Undefined: a field that is not there", "Mutant: the policy with one rule switched off", "Admission review: the cluster asks before it creates"]
narration = """Before the demos, the words. [[slnc 500]] A policy is a set of rules that decide yes or no. [[slnc 500]] Rego is the language of the Open Policy Agent. [[slnc 500]] A deny rule adds a message when its conditions match; a request with no messages is allowed. [[slnc 500]] Undefined is what Rego gives for a field that is not there. [[slnc 300]] It is neither true nor false, and a rule that meets it makes no message. [[slnc 500]] A mutant is the policy with one rule switched off, to see whether the tests notice. [[slnc 500]] And an admission review is the question the Kubernetes A P I server asks before it creates anything."""

[[scene]]
key = "02-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "02-rule-by-rule"
kind = "figure"
title = "One request through every rule"
body = "rule_by_rule"
narration = """Let's see the core idea on one example: one request, through every rule. [[slnc 400]] On the left, the input. [[slnc 300]] It is the good request with two changes: its image comes from docker dot io with the latest tag, and it has no security context. [[slnc 700]]
In the middle, the twelve deny rules of the policy. [[slnc 300]] Each rule looks at the request on its own. [[slnc 300]] The green ones find nothing to say. [[slnc 300]] The red ones match, and each adds a message: rule two for the foreign registry, rule three because the container may run as root, and rule eight for the latest tag. [[slnc 700]]
On the right, the result: the set of messages. [[slnc 300]] Allow is true only when the set is empty. [[slnc 300]] Here there are three messages, so allow is false. [[slnc 500]] That is deny by default: a request must pass every rule."""

[[scene]]
key = "03-acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "04-costs"
kind = "bullets"
title = "What It Costs"
body = ["Rego is one more language to learn", "A missing field must mean deny, on purpose", "Tests, and tests of the tests", "New rules need a warning period", "Every exception is a policy change"]
narration = "Nothing is free. [[slnc 400]] Here is what it costs. [[slnc 500]] Rego is one more language for the team to learn. [[slnc 500]] A missing field must mean deny, and that has to be written on purpose. [[slnc 500]] The policy needs tests, and the tests need checking too. [[slnc 500]] A new rule needs a warning period, or it breaks every team's build on day one. [[slnc 300]] And every exception becomes a change to the policy, with a review."

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["deny contains msg if { ... } in a .rego file", "opa test in a build", "conftest test in a pipeline", "An admission webhook that says allowed: false"]
narration = "You have probably met this already. [[slnc 400]] Deny contains message if, in a rego file, is one rule of a policy. [[slnc 500]] Opa test, in a build, runs the policy's own tests. [[slnc 500]] Conftest test, in a pipeline, checks configuration files against the policy before deploy. [[slnc 500]] And an admission webhook answering allowed false, with reasons, is the same policy at the cluster's door."

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Deny by default", "Ask for what is required, not what is forbidden", "A table of requests a reviewer agrees with", "Test the policy; mutate it to test the tests", "The same policy in the build and the cluster", "Warn first, deny later"]
narration = "So, how do you use it? [[slnc 400]] Deny by default. [[slnc 300]] Ask for what is required, not for what is forbidden, so a missing field is refused. [[slnc 500]] Keep a table of requests, with the answers a reviewer agrees with. [[slnc 300]] Test the policy, and switch rules off one at a time to test the tests. [[slnc 500]] Run the same policy in the build and in the cluster. [[slnc 300]] And roll out every new rule as a warning first."

[[scene]]
key = "12-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Write the test that notices", "the cpu limit rule switched off."]
narration = "That's policy as code. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] A policy is code, so deny by default, review it, version it, test it, and test its tests. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Write the one test that notices when the C P U limit rule is switched off. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] The policy itself is Rego; the Java classes feed it requests, run the real tools, and test the tests. [[slnc 300]] Here are the ones that matter."""

[[class]]
name = "Cases"
what = "the requests, and what a reviewer expects of each"
[[class.part]]
title = "a change to the good request, and the rules it breaks"
code = """
of("foreign registry", o -> container(o).put("image", "docker.io/library/nginx:1.27"), "R2"),
...
of("an empty object", o -> o.removeAll(), "R1"),
"""
speech = """Each case starts from the good request, changes one thing, and names the rules a reviewer expects it to break. [[slnc 300]] The empty object removes everything. [[slnc 300]] This table is the specification the policy is checked against."""

[[class]]
name = "Opa"
what = "runs the pinned opa and conftest tools"
[[class.part]]
title = "the deny messages for one input"
code = """
JsonNode value = eval(List.of(policy), "data." + pkg + ".deny", input);
if (value != null) {
    value.forEach(m -> out.add(m.asString()));
"""
speech = """Opa eval reads the request on standard input and prints the deny set as J S O N. [[slnc 300]] No result means undefined; an empty list means allowed."""
[[class.part]]
title = "the versions are pinned"
code = """
static final String OPA_VERSION = "1.21.3";
static final String CONFTEST_VERSION = "0.71.1";
"""
speech = """The golden output was made with these versions. [[slnc 300]] On any other version the demo stops with a clear message, rather than print different numbers."""

[[class]]
name = "Steps"
what = "a teaching class: each step of reading a missing field as its own rule"
[[class.part]]
title = "one rule per step, so opa shows each value"
code = """
kind := main.object.kind
kind_not_allowed := true if not main.object.kind in main.allowed_kinds
no_kind := true if not main.object.kind
"""
speech = """Opa only shows the final answer, so this module gives each step its own name. [[slnc 300]] A step that is undefined is simply missing from the result, and the demo prints undefined."""

[[class]]
name = "Mutants"
what = "switches off one rule at a time, and asks whether the tests notice"
[[class.part]]
title = "rename deny, and the rule is switched off"
code = """
return source.substring(0, m.start()) + "deny_off contains " + source.substring(m.end());
"""
speech = """The n-th deny rule is renamed deny off. [[slnc 300]] Nobody asks for deny off, so that rule can never deny."""
[[class.part]]
title = "a mutant is noticed when a test fails"
code = """
Files.writeString(dir.resolve("main.rego"), disable(source, i));
...
Opa.Tests t = Opa.test(regex, List.of(dir));
noticed.add(t.passed() != t.total() || t.total() < 0);
"""
speech = """Each mutant is written beside the real tests, and opa test runs on it. [[slnc 300]] If every test still passes, no test checks that rule."""

[[class]]
name = "Admission"
what = "the shape of a Kubernetes validating webhook"
[[class.part]]
title = "no messages, allowed"
code = """
return new Response(denials.isEmpty(), String.join("; ", denials));
"""
speech = """The webhook's answer is allowed when there are no deny messages. [[slnc 300]] Otherwise the messages go back as the reason."""

