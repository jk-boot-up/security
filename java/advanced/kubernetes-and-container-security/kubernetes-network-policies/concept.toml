[[acronym]]
short = "DNS"
long = "Domain Name System: turns a name into an address"
say = "D N S is the domain name system. In a cluster, a pod asks kube D N S for the address of a service name."
[[acronym]]
short = "YAML"
long = "YAML Ain't Markup Language: the text format of manifests"
say = "Yaml is a text format. Kubernetes manifests, policies included, are written in it."
[[acronym]]
short = "TCP, UDP"
long = "Transmission Control Protocol; User Datagram Protocol"
say = "T C P is the transmission control protocol, and U D P the user datagram protocol. D N S uses both on port fifty three."
[[acronym]]
short = "HTTP"
long = "Hypertext Transfer Protocol: what curl speaks to each pod"
say = "H T T P is the hypertext transfer protocol. Each pod answers it on port eight zero eight zero."
[[acronym]]
short = "CNI"
long = "Container Network Interface: the network plugin that enforces policies"
say = "C N I is the container network interface. The network plugin, kindnet here, programs the policies into the node."
[[acronym]]
