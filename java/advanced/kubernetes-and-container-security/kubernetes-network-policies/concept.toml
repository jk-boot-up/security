[[act]]
title = "The label is the credential"
summary = "With the design's policies in place, the jobs pod relabelled app=web passes the allow for web: 4 of 20 = 3 wanted + 1 unwanted, shop/jobs -> pay/api."
detail = """
Before: the design's policies; shop/jobs has app=jobs, and 3 of 20 are reachable, equal to the design.
The change: kubectl -n shop label pod jobs app=web --overwrite, by anyone who may edit pods in shop.
The result: shop/jobs has app=web, and 4 of 20 = 3 wanted + 1 unwanted: shop/jobs -> pay/api.
Why: allow-api-from-shop-web asks two questions of a caller: is its namespace shop, and does it have app=web. Jobs now answers yes to both.
"""
figure = "label_credential"
figure_title = "Change a label, change the access"
figure_speech = """
Last demo: the label is the credential. [[slnc 400]] The design's policies are in place, and the measurement equals the design. [[slnc 300]] The jobs pod has the label app equals jobs. [[slnc 700]]
The change: one command, by anyone allowed to edit pods in shop. [[slnc 300]] The jobs pod is relabelled app equals web. [[slnc 700]]
The allow for the api asks two questions of a caller. [[slnc 300]] Is it in the namespace shop? Yes. [[slnc 300]] Does it have the label app equals web? Now, yes. [[slnc 300]] So the jobs pod gets the store front's access. [[slnc 300]] On the right, the grid has one rose cell: jobs to api.
"""
speech = """
Before: the design's policies, and the jobs pod labelled jobs. [[slnc 300]] Three reachable, equal to the design. [[slnc 400]] The change: one kubectl label command. [[slnc 300]] After: the jobs pod is labelled web, and four are reachable: one unwanted, jobs to api.
[[page]]
Why: the allow asks two questions, the namespace and the label. [[slnc 300]] Jobs now answers yes to both. [[slnc 300]] Whoever can set a pod's labels can choose its policies.
"""
rows = { relabel = "active wrong" }
console = [
