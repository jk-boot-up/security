[poster]
headline = [["NETWORK", "text"], ["POLICIES", "accent"]]
taglines = [["Deny by default, allow the design, measure every pair", "gold"]]
before = { code = "no policy: 20 of 20 pairs reachable", note = "A flat network", tag = "BEFORE" }
after = { code = "the design's allows: 3 of 20", note = "Default deny", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "Kubernetes Network Policies"
narration = "Hello, and welcome. [[slnc 400]] This video explains Kubernetes network policies, measured on a real cluster. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A Kubernetes cluster is a flat network: every pod can reach every other pod, unless a network policy says otherwise. [[slnc 300]] The safe pattern is to deny everything, then allow one connection for each line of the design. [[slnc 300]] And because a wrong policy is still a valid one, you measure every pair of pods against the design. [[slnc 600]] Think of an office where every door is locked, and each person's badge opens only the rooms on their list. [[slnc 600]] Our example is an online store."

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online store runs five pods", "in three namespaces: shop, pay and ops,", "on a real kind cluster", "whose network plugin enforces policies.", "", "The design allows 3 pairs.", "The demo runs curl inside every pod", "to every other pod, after each change."]
narration = "Here is the scenario. [[slnc 400]] An online store runs five pods, in three namespaces: shop, pay and ops. [[slnc 300]] They run on a real Kubernetes cluster made with kind, whose network plugin enforces policies. [[slnc 500]] The design allows three pairs to talk, and nothing else. [[slnc 500]] After every change, the demo runs curl inside every pod, against every other pod, and compares what can really talk with the design."

[[scene]]
key = "02-words"
kind = "bullets"
title = "The Words"
body = ["Pod: one running container, with an address", "Namespace: a folder of pods", "Label: a tag on a pod, such as app=web", "NetworkPolicy: selects pods, lists what may reach them", "Ingress: traffic in; egress: traffic out", "Network plugin: the part that enforces policies"]
narration = """Before the demos, the words. [[slnc 500]] A pod is a running container, with its own address. [[slnc 500]] A namespace groups pods, like a folder. [[slnc 500]] A label is a tag on a pod, such as app equals web. [[slnc 500]] A network policy selects pods by their labels, and lists who may reach them. [[slnc 500]] Ingress is traffic coming in, and egress is traffic going out. [[slnc 500]] And the network plugin is the part of the cluster that enforces the policies. [[slnc 300]] Here it is kindnet."""

[[scene]]
key = "02-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "02-allow"
kind = "figure"
title = "What one allow says"
body = "allow_anatomy"
narration = """Let's see the core idea on one example: one allow, from the demo. [[slnc 400]] It is a policy in the namespace pay. [[slnc 600]] In cyan, the pod selector under spec. [[slnc 300]] It picks the pods this policy protects: those labelled app equals api. [[slnc 700]]
In amber, who may call them. [[slnc 300]] A namespace selector for shop, and a pod selector for app equals web. [[slnc 300]] Both sit in one element of the list, so a caller must match both. [[slnc 700]]
In green, the port: only eight zero eight zero. [[slnc 600]] Everything else stays denied, because the default deny already selects the api. [[slnc 300]] So a policy is a list of selectors, and a selector is only as good as the labels it reads."""

[[scene]]
key = "03-acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "04-costs"
kind = "bullets"
title = "What It Costs"
body = ["Every allowed connection must be written", "Default deny breaks DNS until it is allowed", "Labels become credentials", "The API server accepts wrong policies", "Measuring every pair takes time"]
narration = "Nothing is free. [[slnc 400]] Here is what it costs. [[slnc 500]] Every allowed connection must be written down, as a policy. [[slnc 500]] Denying outgoing traffic also stops name lookups, until D N S is allowed. [[slnc 500]] Labels become credentials, so whoever can set a label gets its access. [[slnc 500]] The A P I server accepts a wrong policy as happily as a right one. [[slnc 300]] And measuring every pair of pods takes time."

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["podSelector: {} with no ingress rules", "namespaceSelector without a podSelector", "A pod that cannot resolve names after a change", "app= labels that decide access"]
narration = "You have probably met this already. [[slnc 400]] An empty pod selector, with no ingress rules, is a default deny. [[slnc 500]] A namespace selector without a pod selector allows a whole namespace, which is the first mistake. [[slnc 500]] A pod that cannot resolve names after a policy change is egress denied without D N S. [[slnc 500]] And app labels that decide access are the credential from the last demo."

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Default deny, ingress and egress, everywhere", "One allow for each line of the design", "Select pods, not whole namespaces", "Allow DNS on purpose", "Control who may set labels", "Measure every pair against the design"]
narration = "So, how do you use it? [[slnc 400]] Deny by default, for traffic in and out, in every namespace. [[slnc 300]] Add one allow for each line of the design. [[slnc 500]] Select pods, not whole namespaces. [[slnc 300]] Allow D N S on purpose. [[slnc 500]] Control who may set labels, because a label is a credential. [[slnc 300]] And measure every pair of pods against the design, in the build and on a schedule."

[[scene]]
key = "12-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Let the admin pod reach the api,", "and find what else the policy opens."]
narration = "That's Kubernetes network policies. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Deny by default, allow one line of the design at a time, and measure every pair of pods, because the A P I server accepts a wrong policy as readily as a right one. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a policy that lets the admin pod reach the api, and find what else it opens. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] The cluster and the network plugin are real, so the classes write policies, measure, and compare. [[slnc 300]] Here are the ones that matter."""

[[class]]
name = "Policies"
what = "the online store's network policies, one builder for each shape"
[[class.part]]
title = "a default deny: every pod, no rule"
code = """
public static Policy denyAllIngress(String namespace) {
...
  podSelector: {}
  policyTypes: [Ingress]
"""
speech = """An empty pod selector selects every pod of the namespace. [[slnc 300]] The policy type is ingress, and there is no rule, so nothing may come in."""
[[class.part]]
title = "an allow: both selectors in one element"
code = """
- from:
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: %s}%s
  ports: [{port: 8080}]
"""
speech = """The namespace selector and the pod selector sit in one element of the from list, so a caller needs both. [[slnc 300]] When the pod label is left out, the whole namespace may call: the first mistake."""

[[class]]
name = "Lab"
what = "the five pods on a real cluster, and the measurement"
[[class.part]]
title = "every pod tries every other pod"
code = """
for (Workload from : PODS) {
    for (int i = 0; i < PODS.size(); i++) {
        Workload to = PODS.get(i);
        if (!from.equals(to)) {
            String url = "http://" + ips.get(i) + ":8080/hostname";
            pairs.add(Intent.pair(from, to));
            exits.add(pool.submit(() -> cluster.curl(from, url)));
"""
speech = """For each pair of different pods, curl runs inside the caller against the other pod's address. [[slnc 300]] Five pods give twenty pairs. [[slnc 300]] A pair is reachable when curl's exit code is zero."""

[[class]]
name = "Intent"
what = "the design as allowed pairs, and the comparison"
[[class.part]]
title = "unwanted and missing"
code = """
boolean open = reachable.contains(pair);
if (open && !allowed.contains(pair)) {
    unwanted.add(pair);
} else if (!open && allowed.contains(pair)) {
    missing.add(pair);
"""
speech = """An open pair the design does not list is unwanted. [[slnc 300]] A closed pair the design lists is missing. [[slnc 300]] The measurement equals the design when both lists are empty."""

[[class]]
name = "Cluster"
what = "kind and kubectl, with a pinned node image"
[[class.part]]
title = "curl inside a pod"
code = """
return kubectl("-n", from.namespace(), "exec", from.name(), "--",
        "curl", "-s", "-m", "2", "-o", "/dev/null", url).exit();
"""
speech = """The probe runs inside the calling pod, so the network plugin judges it like any real call. [[slnc 300]] Two seconds without an answer is a time out, exit code twenty eight."""

[[class]]
name = "Report"
what = "turns measurements into the demo's lines, with no tools"
[[class.part]]
title = "reachable = wanted + unwanted"
code = """
lines.add(String.format("reachable   %d of %d = %d wanted + %d unwanted",
        d.reachable(), d.total(), d.wanted(), d.unwanted().size()));
"""
speech = """Every count is split the same way: what is reachable is what the design wants, plus what it does not. [[slnc 300]] Tests feed this class recorded measurements, so it is checked without a cluster."""

