# concept.toml: everything about this project that is not Java code.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "kubernetes-network-policies"
level = "advanced"
module = "kubernetes-and-container-security"
title = "Kubernetes Network Policies"
short_title = "Network Policies"
package = "k8snetpol"
main_class = "KubernetesNetworkPoliciesDemo"
tagline = "Default-deny a bank's pods on a real Kubernetes cluster, allow only what the design lists, and measure every pair of pods against the design"
bold = "Five pods of a bank on a real cluster (kind) reach each other on 20 of 20 pairs with no policy, 17 of them unwanted; a default deny closes all 20 and one allow for each line of the design opens exactly the 3 that are meant, and the measurement equals the design; three mistakes that the API server accepts show up only in the measurement: an allow for a whole namespace (1 unwanted pair), a typo in the app label of an allow (1 missing pair) and a deny written for one app that forgets a pod (4 unwanted pairs); a default deny of egress also stops the name lookup until DNS is allowed, and stops a server outside the cluster from being called; and a pod relabelled app=web gets the web's access."
domain = "a bank"
domain_note = ""
youtube_description = "Kubernetes network policies for a bank on a real kind cluster: default deny, one allow for each line of the design, measuring all pairs of pods against the design, the mistakes that are accepted silently, egress and DNS, and labels as the credential."
thumb_lines = ["NETWORK", "POLICIES"]
thumb_code = "podSelector: {}  # deny all"
youtube_title = "Kubernetes Network Policies: Default Deny and Measuring Every Pair of Pods"
youtube_tags = ["kubernetes network policies", "default deny", "microsegmentation", "kind", "kindnet", "dns egress", "zero trust", "kubernetes security", "devsecops", "java"]

[readme]
intro = """
A Kubernetes cluster is a flat network: every pod can reach every other pod unless a **NetworkPolicy** says otherwise. This project runs a real cluster with **kind** (its default network plugin, kindnet, enforces policies), puts five pods of a bank in three namespaces and **measures** which pod can reach which. A Java program applies the policies and runs `curl` inside each pod against every other pod (`brew install kind kubectl`, Docker running); the demo makes a cluster, so it is tagged `integration`: `./gradlew integrationTest`.

What it shows:
- **A flat network.** With no policy, **20 of 20** pairs of pods reach each other; the design allows 3, so **17 are unwanted**.
- **Default deny, then the design.** One deny closes all 20 pairs; one allow for each line of the design opens exactly **3 of 20** and the measurement equals the design.
- **Three mistakes the API server accepts.** An allow for a whole namespace (**1 unwanted** pair), a typo in an app label (**1 missing** pair), a deny written for one app that forgets a pod (**4 unwanted** pairs). Only the measurement shows them.
- **Egress and DNS.** Denying egress also stops the name lookup until DNS is allowed, and stops a taken-over api from calling a server outside the cluster.
- **The label is the credential.** A pod relabelled `app=web` gets the web's access.

**Maps to:** NIST CSF 2.0 Protect (PR.IR) · NIST SP 800-53 SC-7 · CIS Kubernetes Benchmark 5.3 · Zero trust microsegmentation.
"""
analogy = """
An office building where every door is unlocked. Locking them all is the easy part. The work is to cut a key for each line of the floor plan, and then to walk the building and try every door, because a key cut for the wrong room works just as well.
"""
scenario = """
A bank runs a shop front, a payments api, a database and an operators' admin pod in three namespaces. The design lists three allowed conversations and nothing else. The demo applies policies and then tries every pair of pods.
"""
costs = [
    "**A policy that selects nothing is valid,** and does nothing.",
    "**Labels become credentials,** and whoever can set them chooses the policy.",
    "**Egress rules need DNS too,** or names stop working.",
    "**Enforcement depends on the network plugin;** some accept policies and ignore them.",
    "**Every pair must be tested** to know what the policies do.",
]
too_much = """
A cluster with one team and no sensitive data can start with namespaces and RBAC. Use network policies when a taken-over pod must not reach the database, or when a rule says which service may call which.
"""
met_before = [
    "A cluster where every pod can reach the database.",
    "A policy copied from a blog post and never tested.",
    "An egress rule that broke DNS on a Friday.",
    "A label changed to get a pod working.",
]
where = """
This is the second project of the [kubernetes-and-container-security](..) module, after [kubernetes-admission-control](../kubernetes-admission-control). The same measuring of a design against a network was done with Docker networks in [network-isolation](../../cloud-security-without-a-cloud/network-isolation).
"""
twin = """
The cluster, the policies and the network plugin are real, and the pods are small web servers. The demo prints counts and pod names, never addresses or ids.
"""
test_note = "The design comparison and the policy manifests are tested with no tools. The demo makes a cluster (./gradlew integrationTest)."

[[act]]
title = "A flat network"
summary = "With no policy 20 of 20 pairs of pods reach each other; the design allows 3."
detail = """
Five pods in the namespaces shop, pay and ops try every other pod: web, jobs, api, db and admin. All 20 pairs answer. The design lists three: web to api, api to db and admin to db. The other 17 are open and unwanted.
"""
speech = """
First demo: a flat network. [[slnc 400]] Five pods try every other pod. [[slnc 600]] Twenty of twenty pairs answer, and the design allows three.
"""
rows = { flat = "active wrong" }
console = [
    ["no policy: 20 of 20 pairs reachable", "bad"],
    ["the design allows 3", "ok"],
    ["17 unwanted", "bad"],
]

[[act]]
title = "Default deny, then the design"
summary = "One deny closes all 20 pairs, three allows open exactly the 3 in the design."
detail = """
A policy that selects every pod and lists no rule allows no traffic in. Then one allow for each line of the design, naming the namespace and the pod label of the caller. The measurement is 3 of 20, none unwanted and none missing: it equals the design.
"""
speech = """
Second demo: default deny. [[slnc 400]] Close everything, then open one door for each line of the design. [[slnc 600]] The measurement equals the design.
"""
rows = { deny = "active ok" }
console = [
    ["deny all ingress: 0 of 20", "ok"],
    ["the design's allows: 3 of 20", "ok"],
    ["equals the design: yes", "ok"],
]

[[act]]
title = "Mistakes the API server accepts"
summary = "An allow for a whole namespace, a typo in a label and a forgotten pod are all valid, and only the measurement shows them."
detail = """
An allow for the whole shop namespace lets the jobs pod reach the api: 1 unwanted pair. A typo in the app label of an allow selects nothing, so web cannot reach api: 1 missing pair. A deny written for the web only leaves the jobs pod with no policy at all: 4 unwanted pairs.
"""
speech = """
Third demo: mistakes. [[slnc 400]] Each one is a valid policy that the API server accepts. [[slnc 600]] Only the measurement shows what it does.
"""
rows = { mistakes = "active wrong" }
console = [
    ["whole namespace: 1 unwanted", "bad"],
    ["typo in a label: 1 missing", "bad"],
    ["a forgotten pod: 4 unwanted", "bad"],
]

[[act]]
title = "Egress and DNS"
summary = "Denying egress stops the name lookup until DNS is allowed, and stops a call to a server outside the cluster."
detail = """
Before any egress rule the api reaches a server outside the cluster. A deny of egress in pay with one allow, api to db, keeps the design at 3 of 20, closes the outside server and also stops the lookup of the service name db until DNS is allowed.
"""
speech = """
Fourth demo: egress. [[slnc 400]] Deny what leaves the namespace and the name lookup stops too. [[slnc 600]] Allow DNS, and keep the outside closed.
"""
rows = { egress = "active ok" }
console = [
    ["outside server: answered, then timed out", "ok"],
    ["db by name: timed out", "bad"],
    ["DNS allowed: answered", "ok"],
]

[[act]]
title = "The label is the credential"
summary = "A pod relabelled app=web is let in by the web's allow."
detail = """
With the intended policies in place the jobs pod is relabelled app=web. The allow for web now applies to it: 1 unwanted pair. A policy trusts labels, so whoever can set labels chooses the policy.
"""
speech = """
Fifth demo: labels. [[slnc 400]] The policy trusts the label. [[slnc 600]] Change the label and you change the policy that applies.
"""
rows = { label = "active wrong" }
console = [
    ["jobs relabelled app=web", "bad"],
    ["jobs to api: reachable", "bad"],
    ["4 of 20 pairs reachable", "bad"],
]

[animation]
subtitle = "A bank's pods, closed and then measured."
boxes = [
    ["flat", "A flat network", "20 of 20"],
    ["deny", "Default deny, then the design", "3 of 20"],
    ["mistakes", "Mistakes the API server accepts", "3 kinds"],
    ["egress", "Egress and DNS", "names stop"],
    ["label", "The label is the credential", "1 unwanted"],
]

[docs.problem]
scenario = """
A bank wants its database reachable only from the api, and wants to know that it is.
"""
naive = """
Write a few policies from an example and assume they work.
"""
deliver = [
    "A real cluster with five pods.",
    "Default deny and one allow for each line of the design.",
    "A measurement of all pairs against the design.",
    "The mistakes that are accepted silently, egress and DNS, and labels.",
]

[docs.prerequisites]
required = [
    "Java basics",
    "Docker running",
    "kind and kubectl (brew install kind kubectl)",
]
not_required = [
    "A cloud account",
    "A second network plugin",
]
install = ["kind", "kubectl"]

[docs.session]
objectives = [
    "write a default deny and an allow for one conversation",
    "measure every pair of pods against a design",
    "explain why a typo in a label is silent",
    "explain why egress rules need DNS",
]
walkthrough = """
Run the demo and compare the first and the second act. In the third act find the pair that each mistake opens or closes.
"""
exercises = [
    "Add a policy that lets the admin pod reach the api, and find what else it opens.",
    "Make the DNS allow narrower and check the lookup still works.",
    "Write a test that fails the build when the measurement differs from the design.",
    "Block the relabelling with an admission policy from kubernetes-admission-control.",
]

[docs.explained]
sentence = """
A network policy is not what you wrote, it is what the pods can reach.
"""
verdict = """
Deny by default in every namespace, allow one conversation at a time naming the namespace and the pod, allow DNS when egress is denied, measure every pair against the design on every change, and control who can set labels.
"""
recognise = [
    "A cluster with no network policy at all.",
    "An allow that names a namespace and no pod.",
    "An egress deny that took DNS down.",
    "Pods labelled by hand to make something work.",
]

[spec]
purpose = """
Teach network policy by applying it to a real cluster and measuring the result against a design.
"""
nongoals = [
    "Service meshes and mutual TLS (see service-identity-and-zero-trust).",
    "Calico and Cilium policy extensions.",
    "Traffic from outside the cluster.",
]
problem = """
Network policies are written from examples and rarely tested, so a wrong one looks the same as a right one.
"""
roles = [["The pods", "`Workload`"], ["The design and its comparison", "`Intent`"], ["The manifests", "`Policies`"], ["The cluster and the probes", "`Lab`"], ["Kubernetes tools", "`Cluster`"], ["Entry point", "`KubernetesNetworkPoliciesDemo`"]]
requirements = [
    "With no policy every pair of pods is reachable.",
    "Default deny plus the design's allows gives a measurement equal to the design.",
    "Each mistake changes the measurement in the way the demo prints.",
    "Denying egress stops name lookups until DNS is allowed.",
    "The demo prints the same output on every run.",
]

