[[act]]
title = "Mistakes the API server accepts"
summary = "An allow for a whole namespace (1 unwanted), a typo in a label (1 missing) and a deny for one app that leaves a pod with no policy (4 unwanted) are all accepted; only the measurement shows them."
detail = """
Each mistake replaces one of the design's policies; the API server answers created every time.
Mistake 1: allow-api-from-shop has a namespace selector and no pod selector, so any pod of shop may call the api. The result: 4 of 20 = 3 wanted + 1 unwanted, shop/jobs -> pay/api.
Mistake 2: allow-apii-from-shop-web selects app=apii, a label no pod has: it selects no pod, so the api stays denied. The result: 2 of 20 = 2 wanted + 0 unwanted, 1 missing, shop/web -> pay/api.
Mistake 3: deny-ingress-web replaces the deny for all of shop and selects only web, so jobs has no policy at all. The result: 7 of 20 = 3 wanted + 4 unwanted: every other pod reaches jobs.
"""
figure = "three_mistakes"
figure_title = "Three valid policies, three wrong grids"
figure_speech = """
Third demo: three mistakes, each accepted by the A P I server. [[slnc 400]] Each one replaces one policy of the design. [[slnc 700]]
On the left, mistake one. [[slnc 300]] The allow for the api names the namespace shop, but no pod label. [[slnc 300]] So the jobs pod may call the api too: one rose cell, one unwanted pair. [[slnc 700]]
In the middle, mistake two. [[slnc 300]] A typo: the allow selects pods labelled a p i i, and there are none. [[slnc 300]] A selector that matches nothing is valid. [[slnc 300]] The store front can no longer reach the api: one amber cell, one missing pair. [[slnc 700]]
On the right, mistake three. [[slnc 300]] The deny in shop was written for the web pod only. [[slnc 300]] The jobs pod is left with no policy at all, so every other pod reaches it: four unwanted pairs. [[slnc 600]]
All three were created without a warning. [[slnc 300]] Only the measurement shows them.
"""
speech = """
Mistake one, the input: an allow for the whole shop namespace. [[slnc 300]] It selects the api, and the A P I server accepts it. [[slnc 300]] The result: four reachable, three wanted plus one unwanted: jobs to api.
[[page]]
Mistake two, the input: a typo in the app label. [[slnc 300]] It selects no pod, and it is accepted. [[slnc 300]] The result: two reachable, and one missing: web to api.
[[page]]
Mistake three, the input: a deny for the web pod only. [[slnc 300]] The jobs pod is left with no policy. [[slnc 300]] The result: seven reachable, three wanted plus four unwanted, every one of them into jobs.
"""
