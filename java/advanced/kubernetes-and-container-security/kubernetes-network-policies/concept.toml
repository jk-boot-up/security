[[act]]
title = "Egress and DNS"
summary = "A default deny of egress in pay, with one allow from api to db, closes the outside server and also the lookup of the name db, until DNS is allowed."
detail = """
Before, with the design's ingress policies and nothing on egress: the api reaches a server outside the cluster, and reaches db by its service name.
The input: deny-all-egress in pay and allow-api-to-db. The result: the 20 pairs still give 3 of 20 = 3 wanted; the outside server times out; db by address answers; db by name times out.
Why: the name db.pay.svc.cluster.local is first asked of kube-dns (2 pods in kube-system, port 53), and no egress allow names them. After allow-dns, db by name answers and the outside server still times out.
"""
figure = "egress_dns"
figure_title = "Denying egress also stops the name lookup"
figure_speech = """
Fourth demo: egress, the traffic that leaves a pod. [[slnc 400]] On the left, before any egress policy. [[slnc 300]] The api reaches a server outside the cluster, and it reaches the database by its name. [[slnc 700]]
In the middle, after a deny of all egress in pay, and one allow from the api to the database. [[slnc 300]] The outside server times out: good. [[slnc 300]] The database answers by its address. [[slnc 300]] But by its name, it times out. [[slnc 700]]
Why? [[slnc 300]] Before the call, the name is looked up: a question to kube D N S, in the kube system namespace, on port fifty three. [[slnc 300]] And no egress allow names kube D N S. [[slnc 700]]
On the right, after an allow for D N S. [[slnc 300]] The name answers again, and the outside server stays closed.
"""
speech = """
Before, with nothing on egress: the api reaches the outside server, and the database by name. [[slnc 400]] The input: deny all egress in pay, and allow the api to the database. [[slnc 300]] The result: the pairs still match the design, the outside server times out, and so does the database by name.
[[page]]
Why the name fails: it is first asked of kube D N S, two pods in kube system, on port fifty three. [[slnc 300]] No egress allow names them. [[slnc 400]] Allow D N S, and the name answers. [[slnc 300]] The outside server stays closed.
"""
rows = { egress = "active ok" }
console = [
    ["BEFORE (the design's policies, nothing on egress):", "code"],
