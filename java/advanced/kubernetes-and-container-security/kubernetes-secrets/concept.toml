[[act]]
title = "OpenBao and a 10 second token"
summary = "OpenBao holds the database password (in no Secret, not in etcd). Its role lets only payments/payments-app log in, with audience openbao, for 10 seconds. The pod sends its token (sub system:serviceaccount:payments:payments-app): HTTP 200, a token of 10 seconds; it reads the password (200); 12 seconds later 12 > 10, HTTP 403; other-app gets HTTP 403."
detail = """
The input: an OpenBao role auth/kubernetes/role/payments for the ServiceAccount payments/payments-app, audience openbao, policy payments-read (read secret/data/payments/db), tokens of 10 seconds. The database password is in OpenBao, in no Kubernetes Secret and not in etcd.
The request: payments-app sends the token the kubelet put in its pod: sub system:serviceaccount:payments:payments-app, aud openbao. OpenBao asks the API server who it belongs to (a TokenReview).
The response: HTTP 200, an OpenBao token for 10 seconds with the policies default and payments-read. Read at once: HTTP 200 and the right value. Read again 12 seconds later: 12 > 10, the token has expired, HTTP 403. other-app logs in with its own token (sub ...:other-app) and gets HTTP 403: it is not the role's ServiceAccount.
"""
figure = "openbao_timeline"
figure_title = "The login, its answer, and the token's ten seconds"
figure_speech = """
Fourth demo: the database password lives outside Kubernetes, in open bao, a secrets server. [[slnc 400]] At the top left, the request. [[slnc 300]] The pod sends the token Kubernetes gave it. [[slnc 300]] Its subject names the service account payments app, and its audience is open bao. [[slnc 600]]
At the top right, the response. [[slnc 300]] H T T P two hundred, and an open bao token that lasts ten seconds, with the policy that may read the password. [[slnc 700]]
At the bottom, that token on a time line. [[slnc 300]] Green while it is valid, red once its ten seconds are over. [[slnc 300]] Read at once: two hundred. [[slnc 300]] Read twelve seconds later: twelve is more than ten, so four oh three. [[slnc 600]]
And the other app, with its own valid token, is refused: it is not the service account the role names.
