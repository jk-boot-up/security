[poster]
headline = [["KUBERNETES", "text"], ["SECRETS", "accent"]]
taglines = [["Base64, raw etcd, encryption at rest, short-lived tokens", "gold"]]
before = { code = "card-key in etcd: plain text: yes", note = "A plain Secret", tag = "BEFORE" }
after = { code = "card-key-2: encrypted: yes", note = "Encryption at rest", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "Kubernetes Secrets"
narration = "Hello, and welcome. [[slnc 400]] This video explains Kubernetes Secrets, and what really protects them. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A Kubernetes Secret looks protected, but its values are only base64, an encoding anyone can reverse, and by default they are stored as they are. [[slnc 300]] Encryption at rest protects the disk, not the people who can read secrets. [[slnc 300]] A secrets server with short-lived tokens can keep a password out of the cluster altogether. [[slnc 600]] Think of an envelope marked secret, that is not sealed. [[slnc 600]] Our example is a bank."

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["A bank's card key in a Kubernetes Secret,", "on a real kind cluster.", "", "The demo reads it with an auditor's role,", "and raw out of etcd, before and after", "encryption at rest.", "", "Then moves a password to OpenBao,", "behind 10-second tokens."]
narration = "Here is the scenario. [[slnc 400]] A bank puts its card key in a Kubernetes Secret, on a real cluster made with kind. [[slnc 500]] The demo reads it the way an auditor's role can, and raw out of etcd, the cluster's database, before and after encryption at rest is switched on. [[slnc 500]] Then it moves a database password to open bao, and lets a pod read it only with a token that lasts ten seconds."

[[scene]]
key = "02-words"
kind = "bullets"
title = "The Words"
body = ["Secret: a Kubernetes object for small sensitive values", "base64: an encoding of bytes as text, no key", "etcd: the database behind the API server", "Encryption at rest: the API server encrypts before etcd", "ServiceAccount: the identity a pod runs as", "OpenBao: an open source secrets server"]
narration = """Before the demos, the words. [[slnc 500]] A Secret is a Kubernetes object for small sensitive values, like a key or a password. [[slnc 500]] Base64 writes any bytes as plain letters and digits; it uses no key. [[slnc 500]] etcd is the database behind the A P I server, where every object is stored. [[slnc 500]] Encryption at rest means the A P I server encrypts a value before it writes it to etcd. [[slnc 500]] A service account is the identity a pod runs as, proved by a signed token. [[slnc 500]] And open bao is an open source secrets server, a fork of HashiCorp Vault."""

[[scene]]
key = "02-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "02-base64"
kind = "figure"
title = "How base64 is undone, with no key"
body = "base64_steps"
narration = """Let's see the core idea on one example: undoing base64. [[slnc 400]] At the top, the input: the card key as the A P I returns it. [[slnc 300]] Take its first four characters: Z, G, V, and small t. [[slnc 600]]
Each one is a place in a fixed alphabet: capital A is zero, capital Z is twenty five, small a is twenty six. [[slnc 300]] So Z is twenty five, G is six, V is twenty one, and small t is forty five. [[slnc 300]] Each place is written with six bits. [[slnc 700]]
Put the four groups side by side: twenty four bits. [[slnc 300]] Cut them into three groups of eight: three bytes. [[slnc 300]] One hundred, one hundred and one, and one hundred and nine: the letters d, e, m. [[slnc 600]]
Do the same for the rest, and the whole card key comes out. [[slnc 300]] A fixed table and some regrouping of bits: there is no key anywhere."""

[[scene]]
key = "03-acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "04-costs"
kind = "bullets"
title = "What It Costs"
body = ["Encryption at rest: a key file to protect", "Old secrets must be rewritten to be encrypted", "list on secrets is read on secrets", "A secrets server is one more thing to run", "Applications must handle short-lived tokens"]
narration = "Nothing is free. [[slnc 400]] Here is what it costs. [[slnc 500]] Encryption at rest needs a key, and that key is a file on the control plane that must be protected. [[slnc 500]] Old secrets stay plain text until every one is rewritten. [[slnc 500]] The right to list secrets is the right to read them, so roles need care. [[slnc 500]] A secrets server is one more service to run. [[slnc 300]] And applications must handle tokens that expire in seconds."

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["Cluster, Manifests: kind and the bank's objects", "Stored, Base64Steps: raw etcd values, base64 by hand", "Encryption: switches on encryption at rest", "OpenBao, Jwt, Http: the secrets server and tokens", "KubernetesSecretsDemo: runs the demos"]
narration = "Here is who does what in the code. [[slnc 400]] Cluster and Manifests make the kind cluster, and the bank's secret, roles, and pods. [[slnc 500]] Stored reads raw values out of etcd, with etcdctl inside the etcd pod, and Base64Steps undoes base64 by hand. [[slnc 300]] Encryption restarts the A P I server with an encryption configuration, and rewrites the secrets. [[slnc 500]] OpenBao, Jwt, and Http set up open bao, and log a pod in with its service account token. [[slnc 300]] And KubernetesSecretsDemo runs the demos."

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["data: with base64 values in a Secret", "A role with list on secrets", "An EncryptionConfiguration file", "A ServiceAccount token Secret with no expiry"]
narration = "You have probably met this already. [[slnc 400]] A data section of base64 values, in a Secret, is an encoding, not a lock. [[slnc 500]] A role with list on secrets can read every one of them. [[slnc 500]] An encryption configuration file on the control plane is encryption at rest. [[slnc 500]] And a service account token stored as a Secret, with no expiry, is the old kind of token that works for ever."

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Treat base64 as plain text", "Never grant list or get on secrets lightly", "Encrypt at rest, with a KMS, and rewrite old secrets", "Keep the most valuable secrets out of the cluster", "Short-lived, bound tokens only"]
narration = "So, how do you use it? [[slnc 400]] Treat base64 as plain text. [[slnc 300]] Never grant list or get on secrets lightly. [[slnc 500]] Switch on encryption at rest, with a key kept in a key management service, and rewrite the old secrets. [[slnc 500]] Keep the most valuable secrets out of the cluster, in a secrets server. [[slnc 300]] And use only short-lived tokens bound to one pod and one audience."

[[scene]]
key = "12-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a second key, make it first,", "and rewrite the secrets."]
narration = "That's Kubernetes Secrets. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] A Secret is only base64, encryption at rest protects the disk and not the reader, and the safest secret is one that never enters the cluster and is reached with a token that lasts seconds. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a second encryption key, make it the first, and rewrite the secrets. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] The cluster, etcd and open bao are real; the classes drive them, and two small teaching classes redo by hand what the demo prints. [[slnc 300]] Here are the ones that matter."""

[[class]]
name = "Cluster"
what = "a kind cluster, etcd reads, and the API server restart"
[[class.part]]
title = "read a value straight out of etcd"
code = """
Stored etcdValue(String key) throws IOException, InterruptedException {
    return new Stored(etcd("get", key, "--print-value-only"));
"""
speech = """e t c d c t l runs inside the etcd pod, with the cluster's own certificates. [[slnc 300]] It returns the value exactly as the A P I server wrote it, with no decryption."""
[[class.part]]
title = "switch on encryption at rest"
code = """
Files.writeString(encDir.resolve("enc.yaml"), Encryption.aescbc(key));
...
Sh.must(List.of("docker", "exec", node(), "sh", "-c", restart));
"""
speech = """The new configuration is written to a folder the A P I server reads. [[slnc 300]] Moving its manifest away and back makes the kubelet restart it, and it reads the file again."""

[[class]]
name = "Encryption"
what = "the EncryptionConfiguration file"
[[class.part]]
title = "aescbc first, identity last"
code = """
- aescbc:
    keys:
      - name: key1
        secret: %s
- identity: {}
"""
speech = """The first provider encrypts every new write. [[slnc 300]] Identity stays last, so values stored before can still be read. [[slnc 300]] That is why old secrets stay plain until they are written again."""

[[class]]
name = "Stored"
what = "a raw etcd value: encrypted or not, and its bytes"
[[class.part]]
title = "encrypted means the marker is there"
code = """
boolean encrypted() {
    return raw.contains(Encryption.MARKER);
"""
speech = """An encrypted value starts with k eight s colon e n c, the provider and the key name. [[slnc 300]] A plain one does not."""
[[class.part]]
title = "the bytes in front of a text"
code = """
int at = raw.indexOf(text);
...
for (int i = at - n; i < at; i++) {
    bytes.add((int) raw.charAt(i));
"""
speech = """It finds the card key in the value and returns the bytes in front of it. [[slnc 300]] The demo prints them in hex: field numbers and lengths."""

[[class]]
name = "Base64Steps"
what = "a teaching class: base64 undone by hand"
[[class.part]]
title = "4 places of 6 bits, 3 bytes of 8"
code = """
int v = ALPHABET.indexOf(c);
values.add(v);
bits24 = (bits24 << 6) | v;
...
List<Integer> bytes = List.of(bits24 >> 16 & 0xff, bits24 >> 8 & 0xff, bits24 & 0xff);
"""
speech = """Each character's place in the alphabet is six bits. [[slnc 300]] Four of them make twenty four bits, cut into three bytes. [[slnc 300]] A test checks that it gives what Java's own base64 decoder gives."""

[[class]]
name = "OpenBao"
what = "the role, the login and the read"
[[class.part]]
title = "a role for one ServiceAccount, 10 second tokens"
code = """
String role = "bao write auth/kubernetes/role/payments"
        + " bound_service_account_names=" + serviceAccount
        + " bound_service_account_namespaces=" + namespace
        + " audience=" + Manifests.AUDIENCE
        + " token_policies=" + POLICY
        + " token_ttl=" + TOKEN_TTL_SECONDS + "s token_max_ttl=" + TOKEN_TTL_SECONDS + "s";
"""
speech = """The role names the one service account and namespace that may log in, the audience the token must carry, and the policy. [[slnc 300]] Token T T L and max T T L are both ten seconds, so a token cannot be renewed past that."""

[[class]]
name = "Jwt"
what = "the claims of a token, read with no key"
[[class.part]]
title = "lifetime and pod"
code = """
return hasExpiry() ? claims.path("exp").asLong() - claims.path("iat").asLong() : -1;
...
return claims.path("kubernetes.io").path("pod").path("name").asString("");
"""
speech = """The lifetime is expiry minus issue time, or minus one when there is no expiry. [[slnc 300]] A bound token names its pod inside the kubernetes dot i o claim."""

[[acronym]]
short = "API"
long = "Application Programming Interface: here, the Kubernetes API server"
say = "A P I is application programming interface. Here it is the Kubernetes A P I server, that every kubectl command talks to."
[[acronym]]
short = "etcd"
long = "the key-value database where Kubernetes stores every object"
say = "etcd is the key value database where Kubernetes keeps every object, secrets included."
[[acronym]]
short = "AES, CBC"
long = "Advanced Encryption Standard; Cipher Block Chaining, one of its modes"
say = "A E S is the advanced encryption standard. C B C is cipher block chaining, one of its modes. A E S C B C is the provider that encrypts the secrets."
[[acronym]]
short = "KMS"
long = "Key Management Service: keeps the key outside the cluster"
say = "K M S is key management service: a separate service that keeps the encryption key outside the cluster."
[[acronym]]
short = "RBAC"
long = "Role-Based Access Control: Roles and RoleBindings"
say = "R B A C is role based access control: roles that list verbs like get and list, bound to accounts."
[[acronym]]
short = "JWT"
long = "JSON Web Token: signed claims, readable by anyone"
say = "J W T is jay son web token: a set of claims, signed but not encrypted, so anyone can read them."
[[acronym]]
short = "JSON"
long = "JavaScript Object Notation"
say = "jay son is JavaScript object notation, the text format of the claims."
[[acronym]]
short = "base64"
long = "an encoding of bytes as text, 64 characters, 6 bits each"
say = "Base64 writes bytes as text with sixty four characters, six bits each."
[[acronym]]
short = "TTL"
long = "Time To Live: how long a token stays valid"
say = "T T L is time to live: how long a token stays valid."
[[acronym]]
short = "HTTP"
long = "Hypertext Transfer Protocol: 200 is OK, 403 is Forbidden"
say = "H T T P is the hypertext transfer protocol. Code two hundred means O K; four oh three means forbidden."
[[acronym]]
short = "sub, aud, exp, iat"
long = "JWT claims: subject, audience, expiry, issued at"
say = "In a token, sub is the subject, aud the audience, exp the expiry time, and i a t the time it was issued."
[[acronym]]
short = "hex"
long = "hexadecimal: base 16, two digits per byte (0x17 = 23)"
say = "Hex is hexadecimal, base sixteen: two digits per byte. Hex one seven is twenty three."
