title = "Kubernetes Secrets"
short_title = "Secrets"
package = "k8ssecrets"
main_class = "KubernetesSecretsDemo"
tagline = "Why a Kubernetes Secret is only base64, how to read it raw out of etcd before and after encryption at rest, and how OpenBao and a bound token replace a long-lived secret"
bold = "A card key in a Kubernetes Secret on a real cluster (kind) decodes with no key, and the auditor who may only list secrets reads it (yes), while a ServiceAccount with no rule cannot (no); read raw from etcd with etcdctl the value holds the key as plain text (yes) and not even as base64 (no); after the API server is restarted with an aescbc EncryptionConfiguration the old secret is still plain text, a new one is encrypted (yes) with no plain text, and only after every secret is rewritten is every secret in etcd encrypted (yes), the key being a file on the control-plane node and the auditor still reading the value; OpenBao holds the database password outside Kubernetes (none in any Secret, none in etcd): a pod logs in with its ServiceAccount token (HTTP 200), gets a token of 10 seconds, reads the password (HTTP 200), another ServiceAccount is refused (HTTP 403) and the same token is refused 12 seconds later (HTTP 403); a bound ServiceAccount token lives 600 seconds, has one audience and is tied to a pod and stops working when the pod is deleted (no), while the old token Secret has no expiry (no) and still works (yes)."
domain = "a bank"
domain_note = ""
youtube_description = "Kubernetes Secrets for a bank on a real kind cluster: base64 is not encryption, reading the raw value from etcd before and after encryption at rest, OpenBao with a short-lived token, and bound ServiceAccount tokens against the old token Secret."
thumb_lines = ["KUBERNETES", "SECRETS"]
thumb_code = "k8s:enc:aescbc:v1:key1"
youtube_title = "Kubernetes Secrets: Base64, Encryption at Rest, OpenBao and Short-Lived Tokens"
youtube_tags = ["kubernetes secrets", "encryption at rest", "etcd", "openbao", "vault", "service account token", "kind", "kubernetes security", "devsecops", "java"]

[readme]
intro = """
A Kubernetes **Secret** looks protected and is not: its values are only base64, and by default etcd stores them as they are. This project runs a real cluster with **kind**, puts a bank's card key in a Secret, reads it raw out of **etcd** (with `etcdctl` inside the etcd pod) before and after turning on **encryption at rest**, then moves a database password to **OpenBao** and compares a short-lived **bound token** with the old token Secret. A Java program drives `kind`, `kubectl` and `docker` (`brew install kind kubectl`, Docker running, a network for the images); the demo makes a cluster, so it is tagged `integration`: `./gradlew integrationTest`.

What it shows:
- **Base64 is an encoding.** The value decodes with no key, an auditor who may only **list** secrets reads it (yes), and an account with no rule cannot (no).
- **Raw etcd, before.** The stored value holds the card key as plain text (yes), not even as base64 (no).
- **Encryption at rest.** After the API server restarts with an `aescbc` EncryptionConfiguration, the old secret is still plain text, a new one is encrypted; only after a rewrite of every secret is **every secret in etcd encrypted**. The key is a file on the control-plane node, and the auditor still reads the value.
- **OpenBao and a short-lived token.** The database password is in no Secret and not in etcd. A pod logs in with its ServiceAccount token (HTTP 200), gets a token of **10 seconds**, reads the password (200); another ServiceAccount is refused (403) and the same token is refused 12 seconds later (403).
- **A bound ServiceAccount token.** 600 seconds, one audience, tied to a pod, and refused once the pod is gone; the old token Secret has no expiry and still works.

OpenBao runs in **development mode** (in memory, a known root token): it is the closest thing to a real server that runs on a laptop, and it speaks the same API. A KMS provider for the encryption key is not run here; the key sits on the control plane and the docs say so.

**Maps to:** NIST CSF 2.0 Protect (PR.DS) · NIST SP 800-53 SC-28 and IA-5 · CIS Kubernetes Benchmark 1.2.27 and 5.4 · OWASP Kubernetes Top 10 K08.
"""
analogy = """
A note in a safe-looking envelope that is only folded, not sealed. Anyone who is handed the envelope reads it, and so does anyone who finds it in the drawer. Sealing the drawer helps against a thief, not against the clerk with the key; the better way is to hand out a pass that works for ten seconds.
"""
scenario = """
A bank keeps a card key and a database password for its payments service. The demo stores the key in a Secret, reads it from etcd, turns encryption on, moves the password to OpenBao and compares two kinds of ServiceAccount token.
"""
costs = [
    "**Base64 hides nothing,** and anyone who may list secrets reads them.",
    "**Encryption at rest protects a disk or an etcd backup,** not a person with the right to read secrets.",
    "**Existing secrets stay plain** until each one is rewritten.",
    "**The key sits on the control plane** unless a KMS provider keeps it outside.",
    "**An external secret store is one more system** to run, unseal and audit.",
]
too_much = """
A cluster with no sensitive data and one team can use plain Secrets with tight RBAC. Turn on encryption at rest when etcd backups or disks leave your control, and use an external store when a secret must be short-lived or audited.
"""
met_before = [
    "A Secret committed to Git as base64.",
    "A role that allows list on secrets in every namespace.",
    "An etcd backup in a shared bucket.",
    "A service account token that never expires.",
]
where = """
This is the third project of the [kubernetes-and-container-security](..) module, after [kubernetes-admission-control](../kubernetes-admission-control) and [kubernetes-network-policies](../kubernetes-network-policies).
"""
twin = """
The cluster, etcd, the encryption configuration, OpenBao and the tokens are real. OpenBao runs in development mode and the encryption key is a local file. The demo prints yes/no, counts and HTTP codes, never ids or tokens.
"""
test_note = "The token reader, the etcd value check, the encryption configuration and the manifests are tested with no tools. The demo makes a cluster (./gradlew integrationTest)."

[[act]]
title = "Base64 is not encryption"
summary = "A Secret's value decodes with no key and a role that may only list secrets reads it."
detail = """
The card key stored in a Secret comes back as base64 and decodes at once. The auditor ServiceAccount may only list secrets and reads the value (yes); a ServiceAccount with no rule on secrets cannot (no).
"""
speech = """
First demo: base64. [[slnc 400]] The value decodes with no key. [[slnc 600]] A role that may only list secrets reads it.
"""
rows = { base64 = "active wrong" }
console = [
    ["key=ZGVtby1jYXJkLXZhdWx0LWtleS0wMDE=", "bad"],
    ["decoded with no key", "bad"],
    ["auditor reads the value: yes", "bad"],
]

[[act]]
title = "Raw etcd, before"
summary = "Read with etcdctl, the stored value holds the key as plain text."
detail = """
etcdctl inside the etcd pod reads /registry/secrets/payments/card-key. The value contains the card key as plain text (yes), not even as base64 (no), and not every secret in etcd is encrypted (no).
"""
speech = """
Second demo: etcd. [[slnc 400]] Read the raw value. [[slnc 600]] The key is there as plain text.
"""
rows = { etcd = "active wrong" }
console = [
    ["etcdctl get /registry/secrets/payments/card-key", "ok"],
    ["plain text in etcd: yes", "bad"],
    ["every secret encrypted: no", "bad"],
]

[[act]]
title = "Encryption at rest"
summary = "After a restart with aescbc only new secrets are encrypted; a rewrite encrypts the rest."
detail = """
The API server restarts with an EncryptionConfiguration. card-key stays plain text, card-key-2 is stored as k8s:enc:aescbc with no plain text. After every secret is rewritten, every secret in etcd is encrypted and the card key is nowhere in etcd. The key is a file on the node, and the auditor still reads the value.
"""
speech = """
Third demo: encryption at rest. [[slnc 400]] New secrets are encrypted, old ones are not until rewritten. [[slnc 600]] It protects the disk, not the reader.
"""
rows = { rest = "active ok" }
console = [
    ["card-key, written before: plain text: yes", "bad"],
    ["card-key-2: encrypted: yes", "ok"],
    ["every secret encrypted: yes", "ok"],
]

[[act]]
title = "OpenBao and a 10 second token"
summary = "The password is outside Kubernetes; a pod logs in with its ServiceAccount token and gets 10 seconds."
detail = """
OpenBao holds the database password: no Secret and no etcd value contains it. payments-app logs in with its ServiceAccount token (HTTP 200), gets a token of 10 seconds and reads the password (200). other-app is refused (403), and the same token is refused 12 seconds later (403).
"""
speech = """
Fourth demo: OpenBao. [[slnc 400]] The pod proves who it is with its ServiceAccount token. [[slnc 600]] It gets a token for ten seconds, and then it is refused.
"""
rows = { openbao = "active ok" }
console = [
    ["login: HTTP 200, 10 seconds", "ok"],
    ["other-app: HTTP 403", "ok"],
    ["12 seconds later: HTTP 403", "ok"],
]

[[act]]
title = "A bound ServiceAccount token"
summary = "A token tied to a pod and an audience for 600 seconds, against the old token Secret that never expires."
detail = """
kubectl create token gives a token with a lifetime of 600 seconds, the audience openbao and the pod report-job. The old token Secret has no expiry and no pod. When the pod is deleted the API server stops accepting the bound token (no) and still accepts the old one (yes).
"""
speech = """
Fifth demo: bound tokens. [[slnc 400]] Tied to a pod, to an audience and to ten minutes. [[slnc 600]] The old token never expires.
"""
rows = { bound = "active ok" }
console = [
    ["lifetime 600 seconds, tied to the pod", "ok"],
    ["the old token: no expiry", "bad"],
    ["pod deleted: bound no, old yes", "ok"],
]

[animation]
subtitle = "A bank's card key, from base64 to a ten second token."
boxes = [
    ["base64", "Base64 is not encryption", "decoded"],
    ["etcd", "Raw etcd, before", "plain text"],
    ["rest", "Encryption at rest", "aescbc"],
    ["openbao", "OpenBao and a 10 second token", "HTTP 403"],
    ["bound", "A bound ServiceAccount token", "600 s"],
]

