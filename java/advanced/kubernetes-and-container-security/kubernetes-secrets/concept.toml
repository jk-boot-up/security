[readme]
intro = """
A Kubernetes **Secret** looks protected and is not: its values are only base64, and by default etcd stores them as they are. This project runs a real cluster with **kind**, puts a bank's card key in a Secret, reads it raw out of **etcd** (with `etcdctl` inside the etcd pod) before and after turning on **encryption at rest**, then moves a database password to **OpenBao** and compares a short-lived **bound token** with the old token Secret. A Java program drives `kind`, `kubectl` and `docker` (`brew install kind kubectl`, Docker running, a network for the images); the demo makes a cluster, so it is tagged `integration`: `./gradlew integrationTest`.

What it shows:
- **Base64 is an encoding.** The value decodes with no key, an auditor who may only **list** secrets reads it (yes), and an account with no rule cannot (no).
- **Raw etcd, before.** The stored value holds the card key as plain text (yes), not even as base64 (no).
- **Encryption at rest.** After the API server restarts with an `aescbc` EncryptionConfiguration, the old secret is still plain text, a new one is encrypted; only after a rewrite of every secret is **every secret in etcd encrypted**. The key is a file on the control-plane node, and the auditor still reads the value.
- **OpenBao and a short-lived token.** The database password is in no Secret and not in etcd. A pod logs in with its ServiceAccount token (HTTP 200), gets a token of **10 seconds**, reads the password (200); another ServiceAccount is refused (403) and the same token is refused 12 seconds later (403).
- **A bound ServiceAccount token.** 600 seconds, one audience, tied to a pod, and refused once the pod is gone; the old token Secret has no expiry and still works.

OpenBao runs in **development mode** (in memory, a known root token): it is the closest thing to a real server that runs on a laptop, and it speaks the same API. A KMS provider for the encryption key is not run here; the key sits on the control plane and the docs say so.

**Maps to:** NIST CSF 2.0 Protect (PR.DS) · NIST SP 800-53 SC-28 and IA-5 · CIS Kubernetes Benchmark 1.2.27 and 5.4 · OWASP Kubernetes Top 10 K08.
"""
analogy = """
A note in a safe-looking envelope that is only folded, not sealed. Anyone who is handed the envelope reads it, and so does anyone who finds it in the drawer. Sealing the drawer helps against a thief, not against the clerk with the key; the better way is to hand out a pass that works for ten seconds.
"""
scenario = """
A bank keeps a card key and a database password for its payments service. The demo stores the key in a Secret, reads it from etcd, turns encryption on, moves the password to OpenBao and compares two kinds of ServiceAccount token.
"""
costs = [
    "**Base64 hides nothing,** and anyone who may list secrets reads them.",
    "**Encryption at rest protects a disk or an etcd backup,** not a person with the right to read secrets.",
    "**Existing secrets stay plain** until each one is rewritten.",
    "**The key sits on the control plane** unless a KMS provider keeps it outside.",
    "**An external secret store is one more system** to run, unseal and audit.",
]
too_much = """
A cluster with no sensitive data and one team can use plain Secrets with tight RBAC. Turn on encryption at rest when etcd backups or disks leave your control, and use an external store when a secret must be short-lived or audited.
"""
met_before = [
    "A Secret committed to Git as base64.",
    "A role that allows list on secrets in every namespace.",
    "An etcd backup in a shared bucket.",
    "A service account token that never expires.",
]
where = """
This is the third project of the [kubernetes-and-container-security](..) module, after [kubernetes-admission-control](../kubernetes-admission-control) and [kubernetes-network-policies](../kubernetes-network-policies).
"""
twin = """
The cluster, etcd, the encryption configuration, OpenBao and the tokens are real. OpenBao runs in development mode and the encryption key is a local file. The demo prints yes/no, counts and HTTP codes, never ids or tokens.
"""
test_note = "The token reader, the etcd value check, the base64 steps, the encryption configuration and the manifests are tested with no tools. The demo makes a cluster (./gradlew integrationTest) from a kind node image pinned by digest."

[[act]]
title = "Base64 is not encryption"
summary = "The card key comes back from the API as base64, ZGVtby1jYXJk..., which decodes with no key: four characters are four places in a fixed alphabet, 24 bits, three bytes. The auditor, who may only list secrets, reads it (yes); an account with no rule cannot (no)."
detail = """
The input is a Secret payments/card-key with the key demo-card-vault-key-001. The API returns data.key = ZGVtby1jYXJkLXZhdWx0LWtleS0wMDE=.
How base64 is undone, on the first four characters: Z G V t are places 25, 6, 21 and 45 in the alphabet; as 6 bits each they are 011001 000110 010101 101101; the same 24 bits cut into 8 are 01100100 01100101 01101101, the bytes 100 101 109, "dem". No key is used anywhere.
The result: the auditor ServiceAccount, whose Role allows only list on secrets, reads the value (yes), because a list returns every item with its data; the ServiceAccount nobody, with no rule, is refused (no).
"""
figure = "who_reads"
figure_title = "The Secret as typed, as the API returns it, and who reads it"
figure_speech = """
First demo: base64 is not encryption. [[slnc 400]] At the top left, the input: the Secret the bank created. [[slnc 300]] Its name is payments slash card key, and its value is the card key, demo card vault key zero zero one. [[slnc 600]]
At the top right, what the A P I gives back. [[slnc 300]] The same value, in base64. [[slnc 300]] It looks scrambled, but as we just saw, anyone can turn it back, with no key. [[slnc 700]]
At the bottom, the result: who can read it. [[slnc 300]] The auditor's role allows only one verb on secrets: list. [[slnc 300]] But a list returns every secret with its data, so the auditor reads the card key. [[slnc 300]] The account called nobody has no rule on secrets, and it is refused. [[slnc 600]]
So the right to list secrets is the right to read them.
"""
speech = """
Here is the real output. [[slnc 400]] The secret as it was created, then what the A P I returns: the base64 text. [[slnc 400]] Then how base64 is undone, on the first four characters. [[slnc 300]] Each character is a place in the alphabet, six bits each. [[slnc 300]] Cut into eight bits, they are the bytes one hundred, one hundred and one, and one hundred and nine: d, e, m. [[slnc 300]] The whole value decodes to the card key.
[[page]]
Who can read it. [[slnc 300]] The auditor, who may only list secrets, reads the value: yes. [[slnc 300]] The account with no rule: no.
"""
rows = { base64 = "active wrong" }
console = [
    ["THE SECRET (kubectl create secret generic):", "code"],
    ["  name   payments/card-key", "muted"],
    ["  key    demo-card-vault-key-001", "muted"],
    ["WHAT THE API RETURNS (data.key):", "code"],
    ["  ZGVtby1jYXJkLXZhdWx0LWtleS0wMDE=", "muted"],
    ["HOW BASE64 IS UNDONE (first 4 characters, no key):", "code"],
    ["  characters  Z, G, V, t", "muted"],
    ["  place in    25 6 21 45 (A=0 ... Z=25, a=26 ... z=51)", "muted"],
    ["  6 bits      011001 000110 010101 101101", "muted"],
    ["  8 bits      01100100 01100101 01101101", "muted"],
    ["  bytes       100 101 109 = \"dem\"", "muted"],
    ["  all of it   demo-card-vault-key-001", "bad"],
    ["---", ""],
    ["WHO CAN READ IT:", "code"],
    ["  auditor (may only list secrets)  reads the value: yes", "bad"],
    ["  nobody (no rule on secrets)      reads the value: no", "ok"],
]

[[act]]
title = "Raw etcd, before encryption"
summary = "etcdctl reads /registry/secrets/payments/card-key straight out of etcd: the value starts with k8s and a zero byte, and the card key is there as plain text, behind the bytes 0a 03 'key' 12 17, where 0x17 = 23 is its length. 0 of 2 secrets are encrypted."
detail = """
The input: etcdctl, run inside the etcd pod, reads the key /registry/secrets/payments/card-key, the value exactly as the API server wrote it.
The result: the value starts with k8s, a zero byte and the protobuf form of the object (v1, Secret). The card key is in it as plain text (yes); not even its base64 form is there (no), because protobuf stores bytes.
The 7 bytes in front of the card key, in hex: 0a 03 is field 1, length 3; 6b 65 79 is "key", the name in data; 12 17 is field 2, length 0x17 = 23; then the 23 characters of the card key. Of the 2 secrets in etcd, 0 are encrypted.
"""
figure = "etcd_bytes"
figure_title = "The bytes etcd holds in front of the card key"
figure_speech = """
Second demo: the raw value in etcd, before any encryption. [[slnc 400]] At the top, the input: e t c d c t l reads the key of the card key secret, straight out of the database. [[slnc 300]] The value starts with k eight s and a zero byte: this is how Kubernetes marks a value in protobuf, a compact binary form. [[slnc 700]]
In the middle, the result: the seven bytes in front of the card key, in hex. [[slnc 300]] Zero A, zero three: field one, three bytes long. [[slnc 300]] Six B, six five, seven nine: the letters k, e, y, the name of the entry. [[slnc 300]] One two, one seven: field two, and its length. [[slnc 300]] Hex one seven is twenty three, exactly the length of the card key, which follows as plain text. [[slnc 700]]
So anyone with a copy of etcd, or of its backup, reads the card key straight off the disk.
"""
speech = """
Here is the output. [[slnc 400]] The read, then what etcd holds. [[slnc 300]] It starts with k eight s, and the card key is there as plain text: yes. [[slnc 300]] Not even the base64 form: protobuf stores the raw bytes. [[slnc 400]] The seven bytes in front of the card key: a field number and a length, the name key, then field two, twenty three bytes long.
[[page]]
Every secret in etcd: of the two secrets in etcd, none is encrypted.
"""
rows = { etcd = "active wrong" }
console = [
    ["THE READ (etcdctl, inside the etcd pod):", "code"],
    ["  get /registry/secrets/payments/card-key", "muted"],
    ["WHAT ETCD HOLDS:", "code"],
    ["  starts with      k8s.....v1..Secret..  (. = not a letter)", "muted"],
    ["  the card key     as plain text: yes", "bad"],
    ["  its base64 form  no", "muted"],
    ["THE 7 BYTES IN FRONT OF THE CARD KEY (hex):", "code"],
    ["  0a 03     field 1, length 3", "muted"],
    ["  6b 65 79  \"key\", the name in data", "muted"],
    ["  12 17     field 2, length 0x17 = 23", "muted"],
    ["  then      demo-card-vault-key-001 (23 characters)", "bad"],
    ["---", ""],
    ["EVERY SECRET IN ETCD:", "code"],
    ["  encrypted   0 of 2", "bad"],
]

[[act]]
title = "Encryption at rest"
summary = "The API server restarts with an EncryptionConfiguration: aescbc with a 32-byte key1 first, identity second. card-key, written before, stays plain; card-key-2 is stored as k8s:enc:aescbc:v1:key1 and bytes that look random (1 of 3). After kubectl replace of every secret: 3 of 3, the card key nowhere in etcd. The key is a file on the node and the auditor still reads the value."
detail = """
The input: an EncryptionConfiguration for secrets with two providers: aescbc with key1 (32 random bytes, never printed) first, then identity, which still reads values stored plain. The API server is restarted to read it.
The result before the rewrite: card-key, written before, is still plain text (yes); card-key-2, written after, is encrypted (yes) with no plain text (no); kubectl returns it as before (yes); 1 of 3 secrets is encrypted.
How the encrypted value reads: it starts with k8s:enc:aescbc:v1:key1: — k8s:enc (encrypted by the API server), aescbc (the provider, AES in CBC mode), v1 (its format), key1 (the key's name) — then bytes that look random, with no "Secret" in them.
After kubectl replace of every secret, card-key is encrypted too, 3 of 3 are encrypted, and the card key is nowhere in etcd. What it does not change: the key is a file on the control-plane node (yes), and the auditor still reads the value (yes).
"""
figure = "encryption_counts"
figure_title = "Encrypted secrets at each step, and the prefix"
figure_speech = """
Third demo: encryption at rest. [[slnc 400]] The input is a configuration file: encrypt secrets with A E S in C B C mode, under a key named key one, and still read old values stored plain. [[slnc 700]]
At the top, the result, step by step. [[slnc 300]] Before the configuration, none of the two secrets is encrypted. [[slnc 300]] After the A P I server restarts, only the new secret is encrypted: one of three. [[slnc 300]] The old card key stays plain text, because nothing wrote it again. [[slnc 300]] After every secret is replaced, all three are encrypted. [[slnc 700]]
At the bottom, how an encrypted value starts. [[slnc 300]] k eight s colon e n c: the A P I server encrypted it. [[slnc 300]] A E S C B C: the provider. [[slnc 300]] v one: its format. [[slnc 300]] And key one: the name of the key that opens it. [[slnc 300]] After that come bytes that look random.
"""
speech = """
The configuration: secrets, A E S C B C first with a thirty two byte key, then identity. [[slnc 400]] Before the rewrite, the old card key is still plain text, the new one is encrypted. [[slnc 300]] kubectl still returns it as before, because the A P I server decrypts on the way out. [[slnc 300]] One of three secrets is encrypted.
[[page]]
What etcd holds for the new secret: the prefix, part by part, then bytes that look random. [[slnc 400]] After every secret is replaced, three of three are encrypted, and the card key is nowhere in etcd.
[[page]]
What it does not change. [[slnc 300]] The key is a file on the control plane node. [[slnc 300]] And the auditor still reads the value, because the A P I server decrypts for anyone allowed to read.
"""
rows = { rest = "active ok" }
console = [
    ["THE ENCRYPTION CONFIGURATION (the API server restarted):", "code"],
    ["  resources   secrets", "muted"],
    ["  provider 1  aescbc, key1: 32 random bytes, not printed", "muted"],
    ["  provider 2  identity: reads what was stored plain", "muted"],
    ["BEFORE THE REWRITE:", "code"],
    ["  card-key (written before)  plain text: yes", "bad"],
    ["  card-key-2 (written after)  encrypted: yes, plain text: no", "ok"],
    ["  kubectl returns card-key-2 as before: yes", "muted"],
    ["  secrets encrypted  1 of 3", "bad"],
    ["---", ""],
    ["WHAT ETCD HOLDS FOR card-key-2:", "code"],
    ["  starts with  k8s:enc:aescbc:v1:key1:", "muted"],
    ["  k8s:enc   encrypted by the API server", "muted"],
    ["  aescbc    the provider: AES in CBC mode", "muted"],
