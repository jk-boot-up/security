[[act]]
title = "A bound ServiceAccount token"
summary = "kubectl create token gives a token whose claims are read with no key: exp - iat = 600 seconds, audience openbao, pod report-job. The old token Secret has 6 claims, no exp and no aud: it never expires. While report-job runs the API server accepts both; once the pod is deleted, the bound token is refused (no) and the old one still accepted (yes)."
detail = """
The input: kubectl create token payments-app for 10 minutes, audience openbao, bound to the pod report-job; and a Secret of type service-account-token, the old kind, that Kubernetes fills with a token.
How the lifetime is worked out: a JWT is signed, not encrypted, so its claims are read with no key. The bound token has the claims aud exp iat iss jti kubernetes.io nbf sub; exp - iat = 600 seconds; audience openbao; pod report-job. The old token has 6 claims, with no exp and no aud: it never expires and is tied to no pod.
The result, asked of the API server with a TokenReview: while report-job runs, both are accepted; after the pod is deleted, the bound token is refused (no) and the old one is still accepted (yes).
"""
figure = "tokens_compare"
figure_title = "The bound token and the old token Secret, side by side"
figure_speech = """
Fifth demo: two kinds of service account token. [[slnc 400]] On the left, a bound token, made with kubectl create token. [[slnc 300]] Like every J W T, it is signed, not encrypted, so its claims can be read with no key. [[slnc 300]] Expiry minus issue time is six hundred seconds, ten minutes. [[slnc 300]] Its audience is open bao, and it is tied to the pod report job. [[slnc 600]]
On the right, the old kind: a token kept in a secret. [[slnc 300]] It has no expiry claim, no audience, and no pod. [[slnc 300]] It never expires. [[slnc 700]]
At the bottom, the result: what the A P I server answers. [[slnc 300]] While the pod runs, it accepts both. [[slnc 300]] After the pod is deleted, it refuses the bound token, and still accepts the old one.
"""
speech = """
The bound token: its claims, a lifetime of six hundred seconds, the audience open bao, and the pod report job. [[slnc 400]] The old token: six claims, no expiry and no audience, so it never expires, and no pod. [[slnc 400]] The A P I server's answer: both accepted while the pod runs. [[slnc 300]] After it is deleted, the bound token no, the old one yes.
"""
rows = { bound = "active ok" }
console = [
    ["THE BOUND TOKEN (kubectl create token, 10 minutes):", "code"],
    ["  claims    aud exp iat iss jti kubernetes.io nbf sub", "muted"],
    ["  lifetime  exp - iat = 600 seconds", "ok"],
    ["  audience  openbao", "muted"],
