]

[docs.explained]
sentence = """
A Secret is only as safe as the people and the disks that can reach it.
"""
verdict = """
Turn on encryption at rest with a KMS provider and rewrite old secrets, give list and get on secrets to very few, keep long-lived secrets in an external store, and use bound tokens that expire and name an audience.
"""
recognise = [
    "A Secret committed to Git.",
    "A role with list on secrets everywhere.",
    "An etcd backup left on a shared disk.",
    "A token Secret created years ago.",
]

[spec]
purpose = """
Teach the limits of Kubernetes Secrets by reading them raw from etcd and by replacing a long-lived secret with short-lived tokens.
"""
nongoals = [
    "A KMS provider and key rotation in production.",
    "A production OpenBao (storage, unsealing, audit).",
    "External Secrets Operator and the CSI driver.",
]
problem = """
Secrets are believed to be encrypted because they are called secrets, and tokens are left to live forever.
"""
roles = [["The cluster and etcd reads", "`Cluster`"], ["The encryption configuration", "`Encryption`"], ["A raw etcd value", "`Stored`"], ["A ServiceAccount token", "`Jwt`"], ["OpenBao setup and calls", "`OpenBao`"], ["The manifests", "`Manifests`"], ["Entry point", "`KubernetesSecretsDemo`"]]
requirements = [
    "A Secret's value is recovered with no key.",
    "Before encryption etcd holds the value as plain text.",
    "After the configuration only new and rewritten secrets are encrypted.",
    "A pod gets a token that is refused after 10 seconds.",
    "A bound token stops working with its pod and the old one does not.",
    "The demo prints the same output on every run.",
]

