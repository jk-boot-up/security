# An exception: one named pod may break one policy, until a date. It lives in the kyverno namespace, which is the only namespace the admission controller reads exceptions from.
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: node-agent
  namespace: kyverno
spec:
  policyRefs:
    - {name: disallow-privileged, kind: ValidatingPolicy}
  matchConditions:
    - name: only-the-node-agent
      expression: "object.metadata.name == 'node-agent'"
  expiresAt: "__EXPIRES__"
