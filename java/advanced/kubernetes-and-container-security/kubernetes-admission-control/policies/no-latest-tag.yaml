# An image is named by a tag other than latest, or by a digest.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: no-latest-tag
spec:
  validationActions: [Deny]
  matchConstraints:
    namespaceSelector:
      matchLabels: {bank/admission: enforced}
    resourceRules:
      - {apiGroups: [""], apiVersions: ["v1"], operations: ["CREATE"], resources: ["pods"]}
  validations:
    - expression: "object.spec.containers.all(c, c.image.contains('@') || (c.image.lastIndexOf(':') > c.image.lastIndexOf('/') && !c.image.endsWith(':latest')))"
      message: "images need a version tag or a digest, not latest"
