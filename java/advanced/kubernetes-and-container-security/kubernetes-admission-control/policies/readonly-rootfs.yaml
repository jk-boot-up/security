# Starts in Audit: a violation is reported, not refused. It becomes Deny when the teams have fixed what the report lists.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: readonly-rootfs
spec:
  validationActions: [Audit]
  matchConstraints:
    namespaceSelector:
      matchLabels: {bank/admission: enforced}
    resourceRules:
      - {apiGroups: [""], apiVersions: ["v1"], operations: ["CREATE"], resources: ["pods"]}
  validations:
    - expression: "object.spec.containers.all(c, has(c.securityContext) && has(c.securityContext.readOnlyRootFilesystem) && c.securityContext.readOnlyRootFilesystem)"
      message: "the root filesystem must be read-only"
