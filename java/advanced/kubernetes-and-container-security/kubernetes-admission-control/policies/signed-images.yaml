# Images from the bank's registry must carry a cosign signature made with the bank's key. The registry address and the public key are filled in when the policy is applied.
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: signed-images-only
spec:
  validationActions: [Deny]
  evaluation: {mode: Kubernetes}
  matchConstraints:
    namespaceSelector:
      matchLabels: {bank/admission: enforced}
    resourceRules:
      - {apiGroups: [""], apiVersions: ["v1"], operations: ["CREATE"], resources: ["pods"]}
  matchImageReferences:
    - glob: "__REGISTRY__/*"
  credentials:
    allowInsecureRegistry: true
  attestors:
    - name: bank
      cosign:
        key:
          data: |
__PUBLIC_KEY__
        ctlog:
          insecureIgnoreTlog: true
          insecureIgnoreSCT: true
  validations:
    - expression: "images.containers.map(i, verifyImageSignatures(i, [attestors.bank])).all(e, e > 0)"
      message: "the image has no valid signature from the bank"
