# Mutation: containers that did not choose get allowPrivilegeEscalation: false. Privileged containers are left for the validating policy to refuse.
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: default-no-privilege-escalation
spec:
  matchConstraints:
    namespaceSelector:
      matchLabels: {bank/admission: enforced}
    resourceRules:
      - {apiGroups: [""], apiVersions: ["v1"], operations: ["CREATE"], resources: ["pods"]}
  matchConditions:
    - name: no-privileged-container
      expression: "!object.spec.containers.exists(c, has(c.securityContext) && has(c.securityContext.privileged) && c.securityContext.privileged)"
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >
          Object{
            spec: Object.spec{
              containers: object.spec.containers.map(c, Object.spec.containers{
                name: c.name,
                securityContext: Object.spec.containers.securityContext{allowPrivilegeEscalation: false}
              })
            }
          }
