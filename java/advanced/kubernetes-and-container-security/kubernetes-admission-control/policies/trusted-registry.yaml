# Images come from the bank's own registry. __REGISTRY__ is replaced with its address when the policy is applied.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: trusted-registry
spec:
  validationActions: [Deny]
  matchConstraints:
    namespaceSelector:
      matchLabels: {bank/admission: enforced}
    resourceRules:
      - {apiGroups: [""], apiVersions: ["v1"], operations: ["CREATE"], resources: ["pods"]}
  validations:
    - expression: "object.spec.containers.all(c, c.image.startsWith('__REGISTRY__/'))"
      message: "images must come from the bank's registry"
