[poster]
headline = [["ADMISSION", "text"], ["CONTROL", "accent"]]
taglines = [["Kyverno at the door of a real cluster: refuse, mutate, verify, except", "gold"]]
before = { code = "Kyverno stopped: privileged pod admitted", note = "No webhook, no gate", tag = "BEFORE" }
after = { code = "denied the request: Policy disallow-privileged failed", note = "Refused by name", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "Kubernetes Admission Control"
narration = "Hello, and welcome. [[slnc 400]] This video explains Kubernetes admission control, with Kyverno, on a real cluster. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] Before Kubernetes creates a workload, the request passes admission controllers: the last gate before anything runs. [[slnc 300]] Kyverno is one, and its policies can refuse a request, change it, check that its image was signed, or allow a dated exception. [[slnc 300]] But a gate only sees new requests, and only while it is running. [[slnc 600]] Think of a bank's door guard, who checks everyone coming in, but not the people already inside. [[slnc 600]] Our example is a bank."

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["A bank's payments namespace", "on a real kind cluster,", "with Kyverno as the admission controller", "and a local registry with signed images.", "", "The demo sends ten requests,", "then audits, mutates, signs,", "takes an exception, and stops the controller."]
narration = "Here is the scenario. [[slnc 400]] A bank runs its payment services in one namespace of a real Kubernetes cluster, made with kind. [[slnc 500]] Kyverno is the admission controller, and a local registry holds images, some signed with the bank's cosign key. [[slnc 500]] The demo sends ten requests, tries audit mode, a mutating policy, signed images, and exceptions, and finally stops the controller to see what gets through."

[[scene]]
key = "02-words"
kind = "bullets"
title = "The Words"
body = ["Admission controller: asked before anything is created", "Webhook: how the API server asks it", "Validating policy: admits or refuses", "Mutating policy: changes the request", "Audit mode: reports, does not refuse", "Digest: the image's own hash; a tag can move"]
narration = """Before the demos, the words. [[slnc 500]] An admission controller is asked before anything is created in the cluster. [[slnc 500]] A webhook is how the A P I server asks it: an H T T P S call, with the request inside. [[slnc 500]] A validating policy admits or refuses. [[slnc 300]] A mutating policy changes the request first. [[slnc 500]] In audit mode, a policy only reports what breaks it, and refuses nothing. [[slnc 500]] And a digest is the image's own hash: it names exactly one image, while a tag like latest can move to another one."""

[[scene]]
key = "02-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "02-one-request"
kind = "figure"
title = "One request, every policy"
body = "one_request"
narration = """Let's see the core idea on one example: one request, and every policy. [[slnc 400]] On the left, the input: a pod with the image nginx latest, privileged, and with no limits. [[slnc 300]] kubectl sends it to the A P I server, which asks the admission controller before it creates anything. [[slnc 700]]
In the middle, every policy looks at the same request. [[slnc 300]] Under each name is what the policy asks for. [[slnc 300]] Four of them fail: privileged, no limits, the latest tag, and another registry. [[slnc 300]] The signature policy has no objection, because it checks only images from the bank's registry. [[slnc 700]]
On the right, the answer. [[slnc 300]] A request is admitted only when no policy fails, so it is refused, and the reply names all four policies."""

[[scene]]
key = "03-acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "04-costs"
kind = "bullets"
title = "What It Costs"
body = ["Admission sees new requests, not running ones", "Audit mode first, or teams are blocked", "Every exception needs an owner and a date", "Signed images need key management", "A controller that is down admits everything"]
narration = "Nothing is free. [[slnc 400]] Here is what it costs. [[slnc 500]] Admission sees new requests, not the workloads already running. [[slnc 500]] A new rule needs an audit period first, or it blocks teams overnight. [[slnc 500]] Every exception needs an owner, and an end date. [[slnc 500]] Signed images need keys to be kept, and rotated. [[slnc 300]] And when the controller is down, Kyverno removes its webhooks, and the cluster admits whatever it is given."

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["admission webhook \"...\" denied the request", "A ClusterPolicy or ValidatingPolicy resource", "A PolicyReport listing failing pods", "An image replaced by name@sha256:..."]
narration = "You have probably met this already. [[slnc 400]] Admission webhook denied the request, in a deploy log, is a policy refusing a workload. [[slnc 500]] A cluster policy, or a validating policy, resource is a Kyverno policy. [[slnc 500]] A policy report listing failing pods is audit mode at work. [[slnc 500]] And an image tag replaced by a digest, in a running pod, is an image policy pinning what was signed."

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Label namespaces, and enforce on all that matter", "Audit first; deny when reports are clean", "Only signed images, pinned by digest", "Exceptions: one pod, one rule, an end date", "Watch the controller; decide if it fails closed", "Scan what already runs"]
narration = "So, how do you use it? [[slnc 400]] Enforce policies on every namespace that matters, not only the labelled ones. [[slnc 500]] Start each rule in audit mode, and deny once the reports are clean. [[slnc 300]] Admit only signed images, pinned by digest. [[slnc 500]] Keep exceptions to one pod, one rule, and an end date. [[slnc 300]] Watch the controller, and decide whether the cluster should fail closed when it is down. [[slnc 300]] And scan what is already running."

[[scene]]
key = "12-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a policy that refuses a", "container with no readiness probe, in audit mode first."]
narration = "That's Kubernetes admission control. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Admission control is the last gate before a workload exists, so refuse by name, pin what was signed, audit before you deny, and remember it sees only new requests, and only while it runs. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a policy that refuses a container with no readiness probe, starting in audit mode. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] The policies are Kyverno files; the Java classes make the cluster and the registry, send the requests, and read the answers. [[slnc 300]] Here are the ones that matter."""

[[class]]
name = "Cluster"
what = "a real kind cluster on a pinned node image"
[[class.part]]
title = "its own kubeconfig, and timeouts tried again"
code = """
List<String> command = new ArrayList<>(List.of("kubectl", "--kubeconfig", kubeconfig.toString()));
...
if (r.ok() || attempt == 5 || !isTransient(r.output())) {
    return r;
"""
speech = """The cluster runs Kubernetes one point thirty seven, on a node image pinned by digest. [[slnc 300]] kubectl always uses the cluster's own kubeconfig file, so it never touches another cluster. [[slnc 300]] A timeout on a busy machine is tried again; a refusal never is."""

[[class]]
name = "Registry"
what = "a local registry, the bank's cosign key, and signed images"
[[class.part]]
title = "push, then read the digest the registry gives"
code = """
Sh.must(List.of("docker", "push", "-q", ref));
...
return head.headers().firstValue("Docker-Content-Digest").orElseThrow();
"""
speech = """Each image is pushed, and the registry answers with its digest. [[slnc 300]] Cosign then signs that digest with the bank's key, and stores the signature in the registry. [[slnc 300]] The rogue image is pushed, but never signed."""

[[class]]
name = "Kyverno"
what = "installs a pinned Kyverno and applies the bank's policies"
[[class.part]]
title = "a pinned release, checked before it is applied"
code = """
static final String VERSION = "v1.19.2";
...
verifySha256(manifest, INSTALL_SHA256);
"""
speech = """Kyverno's install file is a fixed release, and its S H A two fifty six is checked before it is applied to the cluster. [[slnc 300]] Switching a policy from audit to deny is one patch of its validation actions."""

[[class]]
name = "Verdict"
what = "reads the API server's answer"
[[class.part]]
title = "admitted, or refused by which policies"
code = """
Matcher m = POLICY.matcher(r.output());
while (m.find()) {
    names.add(m.group(1));
"""
speech = """kubectl apply with a server dry run asks the A P I server without creating anything. [[slnc 300]] A refusal names each policy that failed, and Verdict collects the names."""

[[class]]
name = "TagRule"
what = "a teaching class: the no-latest-tag expression, step by step"
[[class.part]]
title = "a colon before the last slash is a port"
code = """
boolean digest = image.contains("@");
// a ':' before the last '/' is a port, not a tag
boolean tag = image.lastIndexOf(':') > image.lastIndexOf('/');
boolean latest = image.endsWith(":latest");
"""
speech = """The policy's expression, redone in Java. [[slnc 300]] A digest is always fine. [[slnc 300]] Otherwise the name needs a tag after the last slash, and the tag must not be latest."""

[[acronym]]
short = "API"
long = "Application Programming Interface"
say = "A P I means application programming interface. The Kubernetes A P I server receives every request to create something."
[[acronym]]
short = "HTTPS"
long = "Hypertext Transfer Protocol Secure: the encrypted web protocol"
say = "H T T P S is the hypertext transfer protocol inside transport layer security: how the A P I server calls a webhook."
[[acronym]]
short = "CEL"
long = "Common Expression Language: how the policies are written"
say = "C E L is the common expression language. The policies' rules are written in it."
[[acronym]]
short = "SHA, SHA-256"
long = "Secure Hash Algorithm, 256 bits: the digest of an image"
say = "S H A two fifty six is the secure hash algorithm with two hundred fifty six bits. An image digest is one."
[[acronym]]
short = "CPU"
long = "Central Processing Unit"
say = "C P U is the central processing unit. A cpu limit caps how much processor time a container may use."
