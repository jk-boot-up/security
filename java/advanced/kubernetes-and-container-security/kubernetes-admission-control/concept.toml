[readme]
intro = """
A request to create a pod passes the API server's authentication and authorization, and then the **admission controllers**: the last gate before the workload exists. This project runs a real cluster with **kind**, installs **Kyverno** (v1.19.2) as the admission controller and applies a bank's policies written in CEL. A Java program makes the cluster (kind node image pinned to Kubernetes 1.37.0 by digest), a local registry (pinned by digest) and the bank's cosign key, and sends the requests (`brew install kind kubectl cosign`, Docker running); the demo makes a cluster, so it is tagged `integration`: `./gradlew integrationTest`. The policies are in [`policies/`](policies).

What it shows:
- **Policies that refuse.** Ten requests to a labelled namespace: **6 are refused**, each by the policies that name the reason (privileged, no limits, another registry, an image nobody signed); a privileged pod in a namespace without the label is admitted.
- **Audit first.** A privileged pod that was running before the policies keeps running. A rule in audit mode admits a writable root filesystem, the **policy report** lists it, and when the rule becomes a denial the next such pod is refused.
- **Mutation and signed images.** A pod that said nothing gets `allowPrivilegeEscalation: false`; the tag of a signed image is replaced by the **digest** that was signed; an image nobody signed is refused.
- **Exceptions.** One named pod may break one rule until a date, from the `kyverno` namespace only: **1 of 4** requests is admitted.
- **When the controller is down.** With the admission controller stopped Kyverno removes its webhooks (**0 left**) and the API server admits even a privileged pod.

**Maps to:** NIST CSF 2.0 Protect (PR.PS) · NIST SP 800-53 CM-7, CM-14 · CIS Kubernetes Benchmark 5.2 · Pod Security Standards · SLSA and signed images.
"""
analogy = """
A building's front desk. Every visitor is asked who they are, whether they may enter this floor, and then the desk checks the bag. The desk can also hand out a badge with the right colour. But it only sees people arriving: someone already inside is not checked, and if the desk is empty nobody is asked.
"""
scenario = """
A bank runs its payments namespace on Kubernetes and wants no privileged pod, no pod without limits and no image that was not signed by its own build to be created there. The demo creates a real cluster and sends it good and bad requests.
"""
costs = [
    "**An engine in the path of every request;** when it is down, its webhooks are gone and nothing is checked.",
    "**Admission sees requests, not what already runs.**",
    "**A namespace without the label is not covered.**",
    "**Mutation changes what the team wrote,** so the pod that runs differs from the file in git.",
    "**A first run needs a network** for the cluster images and Kyverno.",
]
too_much = """
A single team on a managed cluster can start with the built-in Pod Security Admission labels. Reach for a policy engine when the rules are the bank's own (a registry, signatures, an owner label), or when mutation, reports and exceptions are needed.
"""
met_before = [
    "A cluster where every developer is an administrator.",
    "An image pulled by tag from any registry.",
    "A policy engine installed in audit mode and left there.",
    "An exception granted in a chat message.",
]
where = """
This is the first project of the [kubernetes-and-container-security](..) module. The rules as code and their tests are in [policy-as-code](../../infrastructure-as-code-security/policy-as-code); here an engine enforces them in a cluster.
"""
twin = """
The cluster, Kyverno, the registry and the signatures are real. Only the images are tiny, built for the demo. The demo prints decisions and counts, never addresses, ids or timestamps.
"""
test_note = "The requests, the verdicts, the policy files, the tag rule and the retry rule are tested with no tools. The demo makes a cluster (./gradlew integrationTest)."

[[act]]
title = "Policies that refuse"
summary = "Five Deny policies in the labelled payments namespace. Of ten requests, six are refused, each by the policies that name the reason; nginx:latest privileged, no limits is refused by four. A signed image tagged latest is admitted, because the image policy first rewrites the tag to the signed digest. A privileged pod in the unlabelled scratch namespace is admitted."
detail = """
The policies, all Deny, in namespaces labelled bank/admission=enforced: disallow-privileged (no privileged containers), require-limits (cpu and memory limits on every container), no-latest-tag (a version tag or a digest, not latest), trusted-registry (images only from the bank's registry) and signed-images-only (a valid signature with the bank's key).
The input is ten requests, each sent with kubectl apply --dry-run=server, so the API server and its admission webhooks decide without creating anything. Refused: privileged (disallow-privileged), no limits (require-limits), nginx:1.27 from another registry (trusted-registry), bank/rogue that nobody signed (signed-images-only), a privileged Deployment (disallow-privileged, through the rule Kyverno generates for the pods it would make), and nginx:latest privileged with no limits (four policies). Admitted: the good pod, the signed image named by the tag :1, the privileged pod in scratch (no label, so no policy applies), and the signed image tagged latest.
Why "signed, tagged latest" is admitted: signed-images-only verifies the signature and replaces the tag with the digest that was signed before the validating policies run, so no-latest-tag sees name@sha256:... and has nothing to refuse.
How one request is decided: for nginx:latest privileged, no limits, four policies fail and signed-images-only has no objection, because it checks only images from the bank's registry. A request is admitted only when no policy fails, so it is refused.
How no-latest-tag reads an image name: a digest (@) is always allowed; otherwise there must be a tag, a ':' after the last '/', and it must not be :latest. registry:5000/bank/payments has a ':' only in the port, so it has no tag and is refused.
"""
figure = "requests_table"
figure_title = "Ten requests, and how an image name is read"
figure_speech = """
First demo: policies that refuse. [[slnc 400]] On the left, the input: ten requests, sent to the payments namespace as a dry run, so nothing is created. [[slnc 300]] Next to each one, the answer from the A P I server. [[slnc 700]]
Six are refused, and each refusal names its policy: privileged, no limits, another registry, an image nobody signed, and a privileged Deployment. [[slnc 300]] Two requests are admitted for a reason worth knowing. [[slnc 300]] The signed image tagged latest gets in, because the signature policy first replaces the tag with the digest that was signed. [[slnc 300]] So the latest rule sees a digest, and has nothing to refuse. [[slnc 300]] And the privileged pod in the scratch namespace gets in, because that namespace has no label, so no policy applies there. [[slnc 700]]
On the right, how the latest rule reads an image name. [[slnc 300]] A digest is always fine. [[slnc 300]] Otherwise there must be a tag after the last slash, and it must not be latest. [[slnc 300]] A colon before the last slash is a port, so registry colon five thousand slash bank slash payments has no tag at all.
"""
speech = """
Here is the real output. [[slnc 400]] First the five policies, all in deny mode, each with what it asks for. [[slnc 300]] They apply only in namespaces with the bank's label.
[[page]]
The ten requests and their answers. [[slnc 300]] Six are refused, each by name. [[slnc 300]] The signed image tagged latest is admitted, because the signature policy swapped its tag for the signed digest first. [[slnc 300]] And the privileged pod in scratch is admitted, because scratch has no label.
[[page]]
How one request is decided. [[slnc 300]] Four policies fail, and the signature policy has no objection, because the image is not from the bank's registry. [[slnc 300]] One failure is enough, so it is refused.
[[page]]
How the latest rule reads an image name, redone in Java. [[slnc 300]] The columns are: a digest, a tag, the latest tag, and the result. [[slnc 300]] The name with only a port has no tag, so it is refused.
"""
rows = { refuse = "active ok" }
console = [
    ["THE POLICIES (Deny; namespaces with bank/admission=enforced):", "code"],
    ["  disallow-privileged  no privileged containers", "muted"],
    ["  require-limits       cpu and memory limits on every container", "muted"],
    ["  no-latest-tag        a version tag or a digest, not latest", "muted"],
    ["  trusted-registry     images only from the bank's registry", "muted"],
    ["  signed-images-only   a valid signature with the bank's key", "muted"],
    ["---", ""],
    ["THE REQUESTS AND THE ANSWERS (apply --dry-run=server):", "code"],
    ["  good: signed, limits                admitted", "ok"],
    ["  privileged                          refused: disallow-privileged", "bad"],
    ["  no limits                           refused: require-limits", "bad"],
    ["  signed, tagged latest               admitted", "ok"],
    ["  nginx:1.27 (another registry)       refused: trusted-registry", "bad"],
    ["  bank/rogue (nobody signed it)       refused: signed-images-only", "bad"],
    ["  signed, named by the tag :1         admitted", "ok"],
    ["  nginx:latest privileged, no limits  refused: 4 policies (below)", "bad"],
    ["  a privileged Deployment             refused: disallow-privileged", "bad"],
    ["  privileged, in scratch (no label)   admitted", "bad"],
    ["---", ""],
    ["HOW ONE REQUEST IS DECIDED (nginx:latest privileged, no limits):", "code"],
    ["  disallow-privileged  fails", "bad"],
    ["  require-limits       fails", "bad"],
    ["  no-latest-tag        fails", "bad"],
    ["  trusted-registry     fails", "bad"],
