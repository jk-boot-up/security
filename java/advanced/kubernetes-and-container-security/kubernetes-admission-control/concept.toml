figure_title = "One exception, four requests"
figure_speech = """
Fourth demo: exceptions. [[slnc 400]] On the left, the exception. [[slnc 300]] It lets one pod, named node agent, break one policy: no privileged containers. [[slnc 300]] And Kyverno reads exceptions only from its own namespace, which developers cannot write to. [[slnc 700]]
