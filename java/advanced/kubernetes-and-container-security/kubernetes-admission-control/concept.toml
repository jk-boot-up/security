[[act]]
title = "What was there before, and audit mode"
summary = "legacy-agent, privileged, started before the policies and is still Running. readonly-rootfs starts in Audit: ledger, with a writable root filesystem, is admitted, and the policy report lists readonly-rootfs on ledger and disallow-privileged on legacy-agent as fail. Switched to Deny, readonly-rootfs refuses ledger2."
detail = """
Before the policies, a privileged pod legacy-agent was started. After the policies, it is still Running: admission sees only new requests.
A new policy, readonly-rootfs, starts in Audit. The input is ledger, a pod with a writable root filesystem; the result is admitted.
The policy report lists what breaks a policy, refused or not: readonly-rootfs on ledger, fail, and disallow-privileged on legacy-agent, fail. The report is how a team finds what a new rule would break, and what already runs against the rules.
After the switch to Deny, ledger2, the same kind of pod, is refused by readonly-rootfs.
"""
figure = "audit_timeline"
figure_title = "Audit first: the report shows what admission cannot"
figure_speech = """
Second demo: what was there before, and audit mode. [[slnc 400]] From left to right, in time. [[slnc 300]] Before the policies, a privileged pod called legacy agent was started. [[slnc 300]] After the policies, it is still running. [[slnc 300]] Admission sees only new requests; it never looks at what already runs. [[slnc 700]]
Then a new policy starts in audit mode: a read only root filesystem. [[slnc 300]] The ledger pod breaks it, and is admitted anyway. [[slnc 300]] Audit mode reports, and refuses nothing. [[slnc 700]]
At the bottom, the policy report. [[slnc 300]] It lists both pods as failing: the ledger, and the legacy agent that started before any policy. [[slnc 300]] Once the teams have fixed what the report lists, the policy switches to deny, and the next such pod is refused.
"""
speech = """
Before the policies, legacy agent started, privileged. [[slnc 300]] After them, it is still running. [[slnc 400]] The new policy in audit mode admits the ledger pod. [[slnc 300]] The policy report lists two failures, the ledger and the legacy agent. [[slnc 300]] After the switch to deny, ledger two is refused.
"""
