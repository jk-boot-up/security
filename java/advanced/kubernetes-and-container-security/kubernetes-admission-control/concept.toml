[[act]]
title = "A policy that changes the request"
summary = "The team sent image <registry>/bank/payments:1 and a securityContext with only readOnlyRootFilesystem: true. The API server would store the image as <registry>/bank/payments:1@<digest>, the digest the bank signed, and a securityContext with allowPrivilegeEscalation: false added. A privileged pod is still refused by disallow-privileged."
detail = """
Before the mutation, what the team sent: image <registry>/bank/payments:1, and securityContext with readOnlyRootFilesystem: true.
After the mutation, what the API server would store: the image <registry>/bank/payments:1@<digest>, where the digest is the one the bank signed (yes), added by signed-images-only; and the securityContext with allowPrivilegeEscalation: false added by default-no-privilege-escalation, and readOnlyRootFilesystem: true kept.
Mutating webhooks run before validating ones. The mutating policy skips privileged containers, and the privileged pod is still refused by disallow-privileged.
"""
figure = "mutation"
figure_title = "Before and after the mutation"
figure_speech = """
Third demo: a policy that changes the request. [[slnc 400]] At the top, the input: what the team sent. [[slnc 300]] The image is named by the tag one, and the security context sets only a read only root filesystem. [[slnc 700]]
In the middle, the result: what the A P I server would store. [[slnc 300]] The image now carries the digest after the tag. [[slnc 300]] It is the digest the bank signed, so the pod runs exactly the image that was checked, even if someone moves the tag later. [[slnc 300]] And the security context gained allow privilege escalation false, a safe default the team did not write. [[slnc 300]] Their own setting is kept. [[slnc 700]]
At the bottom, a privileged pod. [[slnc 300]] Mutation runs first, then validation, and the privileged pod is still refused.
"""
speech = """
Before the mutation: the image by tag, and one security setting. [[slnc 400]] After it: the image with the signed digest, and allow privilege escalation false added. [[slnc 300]] The digest is the one the bank signed. [[slnc 400]] A privileged pod is still refused by the validating policy.
"""
