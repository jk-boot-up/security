[[act]]
title = "When the admission controller is down"
summary = "With Kyverno running, a privileged pod is refused. With Kyverno stopped, no policy webhook is left in the API server (0), and both a good pod and a privileged pod are admitted. After Kyverno is back, the privileged pod is refused again."
detail = """
Before, with Kyverno running, a privileged pod is refused by disallow-privileged.
Kyverno stopped (its admission controller scaled to zero): Kyverno removes its webhooks, so 0 policy webhooks are left in the API server. The API server asks no one: a good pod is admitted, and so is a privileged pod.
After it is back, a good pod is admitted and a privileged pod is refused again.
A gate that is down is no gate: run more than one replica, watch it, and decide whether the cluster should fail closed.
"""
figure = "controller_down"
figure_title = "Kyverno stopped: the API server asks no one"
figure_speech = """
Fifth demo: when the admission controller is down. [[slnc 400]] On the left, Kyverno is running, and a privileged pod is refused, as before. [[slnc 700]]
In the middle, Kyverno is stopped. [[slnc 300]] When it goes, it removes its webhooks from the A P I server, and zero are left. [[slnc 300]] So the A P I server asks no one. [[slnc 300]] The good pod is admitted, and so is the privileged pod. [[slnc 700]]
On the right, Kyverno is back, its webhooks return, and the privileged pod is refused again. [[slnc 500]] Everything created while it was down stays, and only the policy report will show it.
"""
speech = """
Before: a privileged pod is refused. [[slnc 400]] Kyverno stopped: zero policy webhooks left, and both pods are admitted, the privileged one too. [[slnc 400]] After it is back: the privileged pod is refused again.
"""
rows = { down = "active wrong" }
console = [
    ["BEFORE (Kyverno running):", "code"],
    ["  a privileged pod: refused: disallow-privileged", "bad"],
    ["KYVERNO STOPPED:", "code"],
    ["  policy webhooks left in the API server: 0", "bad"],
    ["  a good pod: admitted", "ok"],
    ["  a privileged pod: admitted", "bad"],
    ["AFTER IT IS BACK:", "code"],
    ["  a good pod: admitted", "ok"],
    ["  a privileged pod: refused: disallow-privileged", "bad"],
]

