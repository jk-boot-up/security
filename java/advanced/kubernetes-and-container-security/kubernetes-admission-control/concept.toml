# concept.toml: everything about this project that is not Java code.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "kubernetes-admission-control"
level = "advanced"
module = "kubernetes-and-container-security"
title = "Kubernetes Admission Control"
short_title = "Admission Control"
package = "k8sadmission"
main_class = "KubernetesAdmissionControlDemo"
tagline = "Stop a bank's unsafe workloads at the door of a real Kubernetes cluster with Kyverno policies that validate, mutate, verify signed images and take exceptions"
bold = "A real cluster (kind) with Kyverno as its admission controller refuses 6 of 10 requests for a bank's payments namespace, each by name (privileged, no limits, another registry, an image nobody signed with the bank's cosign key, and a Deployment checked through its pods); a signed image named by a tag is admitted and its tag is replaced by the digest that was signed; a rule starts in audit mode, the policy report shows the writable root filesystem and a privileged pod that was running before any policy, and the same rule then refuses a new pod; an exception for one pod is honoured only from the kyverno namespace and only until its date (1 of 4 requests admitted); and with the admission controller stopped Kyverno removes its webhooks (0 left) and the API server stops asking anyone."
domain = "a bank"
domain_note = ""
youtube_description = "Kubernetes admission control with Kyverno on a real kind cluster for a bank: validating policies, audit mode and policy reports, a mutating policy, cosign-signed images by digest, time-limited exceptions and what happens when the controller is down."
thumb_lines = ["ADMISSION", "CONTROL"]
thumb_code = "denied the request: Policy disallow-privileged failed"
youtube_title = "Kubernetes Admission Control: Kyverno Policies, Signed Images and Exceptions on a Real Cluster"
youtube_tags = ["kubernetes admission control", "kyverno", "admission webhook", "cosign", "signed images", "policy report", "kind", "kubernetes security", "devsecops", "java"]

[readme]
intro = """
A request to create a pod passes the API server's authentication and authorization, and then the **admission controllers**: the last gate before the workload exists. This project runs a real cluster with **kind**, installs **Kyverno** (v1.19.2) as the admission controller and applies a bank's policies written in CEL. A Java program makes the cluster, a local registry and the bank's cosign key, and sends the requests (`brew install kind kubectl cosign`, Docker running); the demo makes a cluster, so it is tagged `integration`: `./gradlew integrationTest`. The policies are in [`policies/`](policies).

What it shows:
- **Policies that refuse.** Ten requests to a labelled namespace: **6 are refused**, each by the policies that name the reason (privileged, no limits, another registry, an image nobody signed); a privileged pod in a namespace without the label is admitted.
- **Audit first.** A privileged pod that was running before the policies keeps running. A rule in audit mode admits a writable root filesystem, the **policy report** lists it, and when the rule becomes a denial the next such pod is refused.
- **Mutation and signed images.** A pod that said nothing gets `allowPrivilegeEscalation: false`; the tag of a signed image is replaced by the **digest** that was signed; an image nobody signed is refused.
- **Exceptions.** One named pod may break one rule until a date, from the `kyverno` namespace only: **1 of 4** requests is admitted.
- **The bill.** With the admission controller stopped Kyverno removes its webhooks (**0 left**) and the API server admits what it is given.

**Maps to:** NIST CSF 2.0 Protect (PR.PS) · NIST SP 800-53 CM-7, CM-14 · CIS Kubernetes Benchmark 5.2 · Pod Security Standards · SLSA and signed images.
"""
analogy = """
A building's front desk. Every visitor is asked who they are, whether they may enter this floor, and then the desk checks the bag. The desk can also hand out a badge with the right colour. But it only sees people arriving: someone already inside is not checked, and if the desk is empty nobody is asked.
"""
scenario = """
A bank runs its payments namespace on Kubernetes and wants no privileged pod, no pod without limits and no image that was not signed by its own build to be created there. The demo creates a real cluster and sends it good and bad requests.
"""
costs = [
    "**An engine in the path of every request;** when it is down, its webhooks are gone and nothing is checked.",
    "**Admission sees requests, not what already runs.**",
    "**A namespace without the label is not covered.**",
    "**Mutation changes what the team wrote,** so the pod that runs differs from the file in git.",
    "**A first run needs a network** for the cluster images and Kyverno.",
]
too_much = """
A single team on a managed cluster can start with the built-in Pod Security Admission labels. Reach for a policy engine when the rules are the bank's own (a registry, signatures, an owner label), or when mutation, reports and exceptions are needed.
"""
met_before = [
    "A cluster where every developer is an administrator.",
    "An image pulled by tag from any registry.",
    "A policy engine installed in audit mode and left there.",
    "An exception granted in a chat message.",
]
where = """
This is the first project of the [kubernetes-and-container-security](..) module. The rules as code and their tests are in [policy-as-code](../../infrastructure-as-code-security/policy-as-code); here an engine enforces them in a cluster.
"""
twin = """
The cluster, Kyverno, the registry and the signatures are real. Only the images are tiny, built for the demo. The demo prints decisions and counts, never addresses, ids or timestamps.
"""
test_note = "The requests, the verdicts and the policy files are tested with no tools. The demo makes a cluster (./gradlew integrationTest)."

[[act]]
title = "Policies that refuse"
summary = "Ten requests to a labelled namespace: 6 are refused, each by the policies that name the reason, and 4 are admitted."
detail = """
A privileged pod, a pod with no limits, an image from another registry, an image nobody signed and a privileged Deployment are refused. A pod that breaks three rules is refused by all of them. A signed image is admitted, by digest, by tag or tagged latest. The same privileged pod in a namespace without the label is admitted: admission covers only what is labelled.
"""
speech = """
First demo: policies that refuse. [[slnc 400]] Ten requests go to a real cluster. [[slnc 600]] Six are refused, each by the policies that name the reason. [[slnc 300]] The same privileged pod in an unlabelled namespace is admitted.
"""
rows = { refuse = "active ok" }
console = [
    ["privileged: refused by disallow-privileged", "ok"],
    ["image nobody signed: refused by signed-images-only", "ok"],
    ["privileged, unlabelled namespace: admitted", "bad"],
]

[[act]]
title = "Audit first, then deny"
summary = "A privileged pod that was running before the policies keeps running; the policy report lists it, and a new rule refuses only new pods once it is switched to deny."
detail = """
The legacy agent is privileged and keeps running when the policies arrive, because admission sees requests, not what already runs. A rule in audit mode admits a pod with a writable root filesystem and the policy report says fail for it and for the legacy agent. When the rule is switched to deny the next such pod is refused.
"""
speech = """
Second demo: audit first. [[slnc 400]] Admission sees requests, not what already runs. [[slnc 600]] The policy report lists the pods that break a rule, and the rule is switched to deny when they are fixed.
"""
rows = { audit = "active ok" }
console = [
    ["legacy-agent keeps running", "bad"],
    ["report: readonly-rootfs on ledger fail", "ok"],
    ["policy now in Deny: refused by readonly-rootfs", "ok"],
]

[[act]]
title = "Mutation and signed images"
summary = "A pod that said nothing gets allowPrivilegeEscalation false, and the tag of a signed image is replaced by its digest."
detail = """
A mutating policy adds allowPrivilegeEscalation false to containers that did not choose and keeps the settings they did choose. The image policy resolves the tag :1 of the signed image to its digest and writes the digest into the pod, so what runs is what was signed. A privileged pod is still refused after the mutation.
"""
speech = """
Third demo: mutation. [[slnc 400]] The controller can change a request before it decides. [[slnc 600]] A tag is replaced by the digest that was signed, so what runs is what was checked.
"""
rows = { mutate = "active ok" }
console = [
    ["allowPrivilegeEscalation false added: yes", "ok"],
    ["tag :1 replaced by the signed digest: yes", "ok"],
    ["privileged after the mutation: refused", "ok"],
]

[[act]]
title = "Exceptions"
summary = "An exception for one named pod is honoured from the kyverno namespace until its date, and in no other case."
detail = """
node-agent is admitted while the exception lasts. Another pod with the same spec is refused. The same exception written in the team's own namespace is ignored, and an exception that ended in 2020 is ignored too. One request of four is admitted.
"""
speech = """
Fourth demo: exceptions. [[slnc 400]] One named pod may break one rule, until a date. [[slnc 600]] An exception written by the team in its own namespace, or one that has ended, changes nothing.
"""
rows = { except = "active ok" }
console = [
    ["node-agent, exception until 2099: admitted", "ok"],
    ["same exception in the team's namespace: refused", "ok"],
    ["exception expired in 2020: refused", "ok"],
]

[[act]]
title = "The bill"
summary = "With the admission controller stopped, 0 policy webhooks are left and the API server admits what it is given."
detail = """
A stopped Kyverno removes its webhooks, and with none left the API server admits everything. Admission is also blind to what already runs and to namespaces without the label. The cost is an engine in the path of every request that must stay available.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] Stop the admission controller and no policy webhook is left. [[slnc 600]] The API server then admits what it is given.
"""
rows = { bill = "active wrong" }
console = [
    ["policy webhooks left: 0", "bad"],
    ["good pod, controller stopped: admitted", "bad"],
    ["same pod after it is back: admitted", "ok"],
]

[animation]
subtitle = "A bank's policies at the door of a real cluster."
boxes = [
    ["refuse", "Policies that refuse", "6 of 10"],
    ["audit", "Audit first", "report, then deny"],
    ["mutate", "Mutation, signatures", "digest"],
    ["except", "Exceptions", "1 of 4"],
    ["bill", "The bill", "0 webhooks"],
]

[docs.problem]
scenario = """
A bank wants unsafe workloads refused when they are created, not found in a review afterwards.
"""
naive = """
Ask every team to follow a checklist, and look at the cluster now and then.
"""
deliver = [
    "A real cluster with an admission controller.",
    "Policies that validate, mutate and verify signed images.",
    "Audit mode, policy reports and a rollout to deny.",
    "Exceptions that expire, and what happens when the controller is down.",
]

[docs.prerequisites]
required = [
    "Java basics",
    "Docker running",
    "kind, kubectl and cosign (brew install kind kubectl cosign)",
]
not_required = [
    "A cloud account",
    "Knowledge of CEL",
]
install = ["kind", "kubectl", "cosign"]

[docs.session]
objectives = [
    "explain what an admission controller sees and what it does not",
    "write a validating, a mutating and an image policy",
    "roll a rule out in audit mode before it denies",
    "explain why the policy engine itself must stay available",
]
walkthrough = """
Run the demo and find the four admitted requests in the first act. In the last act find what Kyverno does when it stops.
"""
exercises = [
    "Add a policy that refuses a container with no readiness probe, first in audit mode.",
    "Make the signed-images policy accept two keys.",
    "Add a second replica of the admission controller and repeat the last act.",
    "Write an exception that ends tomorrow and watch it stop working.",
]

[docs.explained]
sentence = """
Admission control is the last gate before a workload exists, and a gate that is down is no gate.
"""
verdict = """
Refuse by default in labelled namespaces, start every new rule in audit mode, sign what you deploy and deploy by digest, keep exceptions where teams cannot write, and keep the engine available.
"""
recognise = [
    "A cluster where anyone can run a privileged pod.",
    "Images pulled by tag from any registry.",
    "A policy engine installed with failurePolicy Ignore and never tested.",
    "Exceptions written in the team's own namespace.",
]

[spec]
purpose = """
Teach admission control by enforcing a bank's workload rules with Kyverno on a real cluster, and by showing what it cannot do.
"""
nongoals = [
    "Production hardening of Kyverno (replicas, resources, upgrades).",
    "Gatekeeper and the Pod Security Admission labels.",
    "Network policies and runtime security (the next projects).",
]
problem = """
Rules for workloads that live in documents are not enforced, and rules enforced only in the pipeline are bypassed by anyone with kubectl.
"""
roles = [["The cluster", "`Cluster`"], ["The admission controller", "`Kyverno`"], ["The registry and signatures", "`Registry`"], ["The requests", "`Pods`"], ["The answer", "`Verdict`"], ["Entry point", "`KubernetesAdmissionControlDemo`"]]
requirements = [
    "Policies refuse in labelled namespaces and name the policy that refused.",
    "A new rule can start in audit mode and be switched to deny.",
    "Images from the bank's registry must carry its cosign signature and are written by digest.",
    "An exception works only from the kyverno namespace and only until its date.",
    "The demo prints the same output on every run.",
]

