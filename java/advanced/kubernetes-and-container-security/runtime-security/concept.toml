[threatmodel]
scope = """
What a running pod does: processes started, files opened for writing and connections made. It does not cover the node's own processes, other namespaces, or what a permitted action does with its data.
"""
assets = [
    "The payments service.",
    "The ledger database.",
    "The rules and the baseline.",
]
actors = [
    "An attacker with a shell in the pod.",
    "A developer who opens a debug shell.",
    "A person who changes the rules.",
]
boundaries = [
    "The pod's cgroup: the sensor decides by it which records belong to a pod.",
]
assumptions = [
    "The audit trail of the node's kernel is complete.",
    "The baseline matches what the service really does.",
]
out_of_scope = [
    "Compromise of the node or the sensor.",
    "Responding to an alert.",
]
tests = [
    "`AuditTest` and `RulesTest` check the parsing and the three rules with no tools.",
    "`DemoRunsTest` makes the cluster and compares the whole demo with the golden output (integrationTest).",
]
next = """
The next project, in the same module, is kubernetes-secrets.
"""

[[threat]]
id = "T1"
stride = "E"
threat = "A shell is opened in the payments pod"
where = "the pod"
control = "Start without a shell; rule Shell in container"
residual = "A shell not started by exec or run as another name"

[[threat]]
id = "T2"
stride = "I"
threat = "A taken-over pod writes a program or calls an outside server"
where = "the pod"
control = "Rules for unexpected write and outbound connection; read-only root and network policy to prevent"
residual = "Behaviour inside the baseline"

[[threat]]
id = "T3"
stride = "R"
threat = "The sensor misses a short process or the rules are out of date"
where = "the sensor"
control = "Read the container from the kernel event (Falco); keep the baseline with the service"
residual = "A process that exits before the lookup"

[poster]
headline = [["RUNTIME", "text"], ["SECURITY", "accent"]]
taglines = [["Detect a shell, a write and a connection in a running pod", "gold"]]
before = { code = "normal work: 0 alerts", note = "The baseline", tag = "BEFORE" }
after = { code = "Unexpected write: /usr/bin/miner", note = "A write it never makes", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "Runtime Security"
narration = "Hello, and welcome. [[slnc 400]] This video explains runtime security for containers, with Falco's rules and the Linux audit trail. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] Admission control decides what may start, and network policies decide what may talk. [[slnc 300]] Runtime security watches what a running container actually does, and alerts on what it should never do: open a shell, write a program, or call a server outside. [[slnc 600]] Think of a camera inside the bank vault: the door was locked, but you still want to see who is moving the boxes. [[slnc 600]] Our example is a bank."

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["A bank's payments pod and ledger pod", "on a real kind cluster.", "", "A sensor watches every program start,", "every write, and every connection.", "", "First, normal work. Then a shell,", "a write to /usr/bin, and a call outside."]
narration = "Here is the scenario. [[slnc 400]] A bank's payments pod and ledger pod run on a real Kubernetes cluster, made with kind. [[slnc 500]] A sensor watches every program that starts, every file that is written, and every connection that is made. [[slnc 500]] First the payments service does its normal work. [[slnc 300]] Then someone opens a shell in it, writes a program to slash usr slash bin, and calls a server outside the cluster."

[[scene]]
key = "02-words"
kind = "bullets"
title = "The Words"
body = ["System call: a program asks the kernel to act", "Audit record: the kernel's note of one call", "Baseline: what the service normally does", "Rule: a test of one record against it", "Alert: a rule that matched", "Prevent vs detect: refuse it, or report it"]
narration = """Before the demos, the words. [[slnc 500]] A system call is a program asking the kernel to do something: start a program, open a file, or connect. [[slnc 500]] An audit record is the kernel's note of one such call. [[slnc 500]] The baseline is what the service normally does. [[slnc 500]] A rule tests one record against the baseline. [[slnc 500]] An alert is a rule that matched. [[slnc 500]] And to prevent is to refuse an action; to detect is to report it."""

[[scene]]
key = "02-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "02-record"
kind = "figure"
title = "How one audit record is read"
body = "record_reading"
narration = """Let's see the core idea on one example: one audit record, the payments service calling the ledger. [[slnc 400]] At the top, the bytes the kernel wrote: the socket address, in hex. [[slnc 600]] The first two bytes are the family. [[slnc 300]] Read low byte first, they make two: I P v four. [[slnc 600]] The next two bytes are the port. [[slnc 300]] Read high byte first, hex one five three eight is five thousand four hundred thirty two. [[slnc 600]] Then four bytes of address, not shown here. [[slnc 600]]
The record also names the process, nc, and the container it ran in. [[slnc 300]] Kubectl maps that container to the pod, payments api. [[slnc 300]] And the address is on the baseline, so there is no alert. [[slnc 300]] Every alert in this video is made this way."""

[[scene]]
key = "03-acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "04-costs"
kind = "bullets"
title = "What It Costs"
body = ["Every service needs its own normal baseline", "Sensors need kernel support", "Alerts need someone to answer them", "Detection comes after the act", "A noisy rule is soon ignored"]
narration = "Nothing is free. [[slnc 400]] Here is what it costs. [[slnc 500]] Every service needs its own picture of normal, kept up to date. [[slnc 500]] Sensors need kernel support, and Falco's driver cannot start on every kernel, as the first demo shows. [[slnc 500]] Every alert needs someone to answer it. [[slnc 500]] Detection comes after the act, so it pairs with prevention. [[slnc 300]] And a noisy rule is soon ignored."

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["\"Terminal shell in container\" from Falco", "kubectl exec into a production pod", "A miner written to /usr/bin", "An unexpected outbound connection alert"]
narration = "You have probably met this already. [[slnc 400]] Terminal shell in container is one of Falco's best-known alerts. [[slnc 500]] Kubectl exec into a production pod is the shell from the third demo, for good reasons or bad. [[slnc 500]] A crypto miner written to slash usr slash bin is the most common container intrusion. [[slnc 500]] And an unexpected outbound connection is often the attacker calling home."

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Write down what each service normally does", "Alert on a shell, a write, a call outside", "Prevent as well: read-only root, network policy", "Check the sensor works on your kernel", "Route alerts to someone who answers"]
narration = "So, how do you use it? [[slnc 400]] Write down what each service normally does. [[slnc 300]] Alert on what it never does: a shell, a write outside its folders, a call outside the cluster. [[slnc 500]] Prevent as well as detect, with a read-only root and network policies; a refused write still raises its alert. [[slnc 500]] Check that the sensor really works on your kernel. [[slnc 300]] And route every alert to someone who answers it."

[[scene]]
key = "12-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a rule for a program that", "is written and then run."]
narration = "That's runtime security. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Watch what a running container does, alert on what it should never do, and prevent what you can, because detection always comes after the act. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a rule for a program that is written and then run, the drop and execute pattern. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] The cluster, the syscalls and the audit records are real; the classes read the records and judge them. [[slnc 300]] Here are the ones that matter."""

[[class]]
name = "Audit"
what = "reads Linux audit records into events"
[[class.part]]
title = "the container, from the cgroup path"
code = """
private static final Pattern CONTAINER =
        Pattern.compile("cri-containerd-([0-9a-f]{64})\\\\.scope");
"""
speech = """Every process in a Kubernetes container sits in a control group whose name holds the container's id. [[slnc 300]] The sensor copies that path next to each record, and this pattern takes the id out."""
[[class.part]]
title = "a socket address, from hex"
code = """
int family = Integer.parseInt(hex.substring(2, 4) + hex.substring(0, 2), 16);
...
int port = Integer.parseInt(hex.substring(4, 8), 16);
"""
speech = """The family is two bytes, read low byte first. [[slnc 300]] The port is the next two bytes, read high byte first. [[slnc 300]] Then four bytes of address."""

[[class]]
name = "Rules"
what = "the three tests, the same ones as the Falco rules file"
[[class.part]]
title = "a shell, a write, a connection"
code = """
case "exec" -> {
    if (e.success() && SHELLS.contains(e.comm())) {
...
case "write" -> {
    for (String path : e.paths()) {
        if (baseline.writablePrefixes().stream().noneMatch(path::startsWith)) {
...
case "connect" -> {
    if (e.address() != null && !e.ip().startsWith("127.")
            && !baseline.allowedIps().contains(e.ip())) {
"""
speech = """A program named like a shell is an alert. [[slnc 300]] A write outside the folders on the baseline is an alert. [[slnc 300]] A connection to an address that is not on the baseline, and not the pod itself, is an alert."""

[[class]]
name = "Sensor"
what = "Linux audit, switched on by a privileged container"
[[class.part]]
title = "a container that shares the kernel's processes"
code = """
Sh.must(List.of("docker", "run", "-d", "--name", name,
        "--privileged", "--pid=host", "-e", "COLLECTOR=" + script,
"""
speech = """The sensor runs in a privileged container that sees every process of Docker's Linux machine. [[slnc 300]] It switches on audit for three syscalls and keeps the records of Kubernetes containers."""

[[class]]
name = "Falco"
what = "Falco, run as a container: checks the rules, tries its driver"
[[class.part]]
title = "falco --validate"
code = """
return Sh.run(List.of("docker", "run", "--rm", "-v", rulesDir.toAbsolutePath() + ":/r:ro",
        IMAGE, "falco", "--validate", "/etc/falco/falco_rules.yaml",
        "--validate", "/r/" + file)).ok();
"""
speech = """Falco checks the bank's rules together with its own default rules, which define the macros they use. [[slnc 300]] A rule with a wrong field fails here."""

[[acronym]]
short = "BTF"
long = "BPF Type Format: the kernel's description of its own types"
say = "B T F is the B P F type format: a description of the kernel's own data types. Falco's modern driver needs it."
[[acronym]]
short = "BPF, eBPF"
long = "(extended) Berkeley Packet Filter: small programs run in the kernel"
say = "B P F, and extended B P F, are small programs that run inside the Linux kernel. Falco's driver is one."
[[acronym]]
short = "API"
long = "Application Programming Interface"
say = "A P I is application programming interface."
[[acronym]]
short = "DNS"
long = "Domain Name System: turns a name into an address"
say = "D N S is the domain name system. The service may call the cluster's D N S server."
[[acronym]]
short = "IPv4, IP"
long = "Internet Protocol version 4: four-byte addresses"
say = "I P is the internet protocol. Version four, I P v four, has four-byte addresses."
[[acronym]]
short = "YAML"
long = "YAML Ain't Markup Language: the text format of the rules"
say = "Yaml is a text format. Falco's rules file is written in it."
[[acronym]]
short = "ID, UID"
long = "Identifier; User Identifier (0 is root)"
say = "I D is an identifier. The user identifier, U I D, zero is the root user."
[[acronym]]
short = "VM"
long = "Virtual Machine: the Linux machine inside Docker Desktop"
say = "V M is virtual machine. Docker Desktop runs containers in a Linux V M."
