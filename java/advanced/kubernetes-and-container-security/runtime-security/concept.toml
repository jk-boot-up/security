[[act]]
title = "A write where it never writes"
summary = "A program written to /usr/bin raises 1 alert; the same write in a pod with a read-only root is refused by the kernel and still raises 1 alert, for the folder /usr/bin/."
detail = """
The input: tee /usr/bin/miner in payments-api. The result: one alert, Unexpected write in container, /usr/bin/miner, because the path starts with none of /var/log/payments/, /tmp/ and /dev/.
The same input in payments-api-ro, whose root file system is read-only: the kernel refuses it (Read-only file system). The result: one alert all the same, for /usr/bin/ (refused): a refused open names only the folder the file was to be made in.
"""
figure = "write_prevent"
figure_title = "Prevent with a read-only root, detect all the same"
figure_speech = """
Fourth demo: a write where the service never writes. [[slnc 400]] The input, on both sides: a program called miner, written to slash usr slash bin. [[slnc 700]]
On the left, in the normal payments pod. [[slnc 300]] The kernel writes it. [[slnc 300]] And the rule raises one alert, because the path starts with none of the folders on the baseline. [[slnc 700]]
On the right, the same write in a pod whose root file system is read only. [[slnc 300]] The kernel refuses it. [[slnc 300]] And the attempt still raises one alert. [[slnc 300]] A refused open names only the folder, so the alert says slash usr slash bin. [[slnc 600]] Prevention stops the write; detection tells you someone tried.
"""
speech = """
The input: a program written to slash usr slash bin. [[slnc 300]] The result: one alert, unexpected write. [[slnc 300]] Why: the path starts with none of the three allowed folders.
[[page]]
The same input in the read only pod. [[slnc 300]] The kernel refuses it: read only file system. [[slnc 300]] And there is still one alert, for the folder, marked refused.
"""
