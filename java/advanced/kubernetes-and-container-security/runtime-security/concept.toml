]

[threatmodel]
scope = """
What a running pod does: processes started, files opened for writing and connections made. It does not cover the node's own processes, other namespaces, or what a permitted action does with its data.
"""
assets = [
    "The payments service.",
    "The ledger database.",
    "The rules and the baseline.",
]
actors = [
    "An attacker with a shell in the pod.",
    "A developer who opens a debug shell.",
    "A person who changes the rules.",
]
boundaries = [
    "The pod's cgroup: the sensor decides by it which records belong to a pod.",
]
assumptions = [
    "The audit trail of the node's kernel is complete.",
    "The baseline matches what the service really does.",
]
out_of_scope = [
    "Compromise of the node or the sensor.",
    "Responding to an alert.",
]
tests = [
    "`AuditTest` and `RulesTest` check the parsing and the three rules with no tools.",
    "`DemoRunsTest` makes the cluster and compares the whole demo with the golden output (integrationTest).",
]
next = """
The next project, in the same module, is kubernetes-secrets.
"""

[[threat]]
id = "T1"
stride = "E"
threat = "A shell is opened in the payments pod"
where = "the pod"
control = "Start without a shell; rule Shell in container"
residual = "A shell not started by exec or run as another name"

[[threat]]
id = "T2"
stride = "I"
threat = "A taken-over pod writes a program or calls an outside server"
where = "the pod"
control = "Rules for unexpected write and outbound connection; read-only root and network policy to prevent"
residual = "Behaviour inside the baseline"

[[threat]]
id = "T3"
stride = "R"
threat = "The sensor misses a short process or the rules are out of date"
where = "the sensor"
control = "Read the container from the kernel event (Falco); keep the baseline with the service"
residual = "A process that exits before the lookup"

