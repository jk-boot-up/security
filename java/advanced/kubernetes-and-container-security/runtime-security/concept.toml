# concept.toml: everything about this project that is not Java code.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "runtime-security"
level = "advanced"
module = "kubernetes-and-container-security"
title = "Runtime Security"
short_title = "Runtime Security"
package = "runtimesec"
main_class = "RuntimeSecurityDemo"
tagline = "Detect a shell, an unexpected write and an unexpected outbound connection in a bank's payments pod on a real Kubernetes cluster, with Falco's rules and the Linux audit trail"
bold = "On a real cluster (kind) a bank's payments pod does its normal work (a call to the ledger, a write to its log folder) and raises 0 alerts although the sensor saw all 3 kinds of syscall; then one shell opened with kubectl exec raises 1 alert, one program written to /usr/bin raises 1, one connection to a server outside the cluster raises 1, and the same write in a pod with a read-only root file system is refused and still raises 1; Falco 0.45.1 accepts the bank's 3 rules (falco --validate: yes) but its modern eBPF driver cannot start on Docker Desktop's kernel (no BTF: BPF_TRACE_RAW_TP is not supported), so the same 3 tests run on Linux audit records of that kernel."
domain = "a bank"
domain_note = ""
youtube_description = "Runtime security for a bank's pods on a real kind cluster: Falco rules for a shell in a container, an unexpected write and an unexpected outbound connection, why Falco's driver cannot run on Docker Desktop, a Linux audit sensor in its place, and prevent versus detect."
thumb_lines = ["RUNTIME", "SECURITY"]
thumb_code = "Shell in a bank container"
youtube_title = "Runtime Security: Detecting a Shell, a Write and a Connection in a Container with Falco"
youtube_tags = ["runtime security", "falco", "kubernetes security", "container security", "linux audit", "ebpf", "intrusion detection", "kind", "devsecops", "java"]

[readme]
intro = """
Admission control and network policies decide what may start and what may talk. **Runtime security** watches what a running container actually does. This project runs a real cluster with **kind**, puts a bank's payments pod and a ledger pod in it, and detects three behaviours that a payments service must not show: **a shell**, **a write where it never writes** and **a connection to an address it never calls**. The rules are written for **Falco** and checked by Falco itself; the demo's sensor applies the same three tests to Linux audit records (`brew install kind kubectl`, Docker running). The demo makes a cluster, so it is tagged `integration`: `./gradlew integrationTest`.

What it shows:
- **Falco on this machine.** Falco 0.45.1 accepts the bank's **3 rules**, but its modern eBPF driver cannot start on Docker Desktop's kernel (no BTF: `BPF_TRACE_RAW_TP` is not supported). The demo says so and uses Linux audit on the same kernel.
- **Normal work, 0 alerts.** A call to the ledger and a write to the log folder are seen by the sensor (3 of 3 kinds) and raise **0 alerts**.
- **Three behaviours, 1 alert each.** A shell opened with `kubectl exec`, a program written to `/usr/bin`, a connection to a server outside the cluster.
- **Prevent and detect.** The same write in a pod with a read-only root file system is refused and still raises **1 alert**.

**Maps to:** NIST CSF 2.0 Detect (DE.CM) · NIST SP 800-53 SI-4 · CIS Kubernetes Benchmark 5 · MITRE ATT&CK for Containers (execution, persistence, command and control).
"""
analogy = """
A bank branch with locks on the doors and a guest list at the entrance. Neither tells you that someone inside has opened the vault room, carried something out of the back door or phoned an unknown number. A camera that knows the normal routine tells you the moment it changes.
"""
scenario = """
A bank runs a payments service that serves requests, writes its log to one folder and calls the ledger database. It never needs a shell, never writes to the program folders and never calls any other address. The demo does the normal work, then each of the three things it must never do.
"""
costs = [
    "**A detector prevents nothing.** It tells you, after the fact.",
    "**Every rule needs a baseline** of what the service does, and a new feature makes the baseline wrong.",
    "**The driver needs the kernel's help.** Falco's eBPF driver cannot load on every kernel.",
    "**A sensor that looks up the container afterwards can miss a short process.**",
    "**Alerts need an owner,** or they become noise.",
]
too_much = """
A cluster with no sensitive workload can start with admission control and network policies. Add runtime detection when a taken-over container would do harm, or when a rule says suspicious activity must be detected.
"""
met_before = [
    "A container that ran a miner for a month.",
    "A rule that fired a hundred times a day and was muted.",
    "A debug shell left in production.",
    "A log line nobody read.",
]
where = """
This is the third project of the [kubernetes-and-container-security](..) module, after [kubernetes-admission-control](../kubernetes-admission-control) and [kubernetes-network-policies](../kubernetes-network-policies). Those prevent; this one detects what gets through.
"""
twin = """
The cluster, the pods, the syscalls and the audit records are real, and Falco's own validator checks the rules. Falco's driver is the one thing that cannot run here, and the demo prints that instead of hiding it. The demo prints counts and pod names, never ids or addresses.
"""
test_note = "The audit parsing, the three rules and the manifests are tested with no tools. The demo makes a cluster (./gradlew integrationTest)."

[[act]]
title = "Falco on this machine"
summary = "Falco accepts the 3 rules, but its driver cannot start on this kernel."
detail = """
Falco 0.45.1 is run as a container. falco --validate accepts the bank's 3 rules. Started with the modern eBPF driver it stops with BPF_TRACE_RAW_TP is not supported: the kernel of Docker Desktop's VM has no BTF. The demo then applies the same three tests to Linux audit records.
"""
speech = """
First demo: Falco on this machine. [[slnc 400]] Falco accepts the three rules. [[slnc 600]] Its driver cannot start on this kernel, so the demo uses Linux audit.
"""
rows = { falco = "active wrong" }
console = [
    ["rules accepted by falco --validate: yes", "ok"],
    ["modern eBPF driver: not supported", "bad"],
    ["kernel has BTF: no", "bad"],
]

[[act]]
title = "The service doing its work"
summary = "A call to the ledger and a write to the log folder are seen and raise 0 alerts."
detail = """
The payments pod calls itself, writes to its log folder and calls the ledger service. The sensor sees all 3 kinds of syscall (exec, write, connect) and the rules raise 0 alerts: normal work is not an alert.
"""
speech = """
Second demo: normal work. [[slnc 400]] The sensor sees everything the service does. [[slnc 600]] Zero alerts.
"""
rows = { normal = "active ok" }
console = [
    ["sensor saw: exec yes, write yes, connect yes", "ok"],
    ["alerts: 0", "ok"],
]

[[act]]
title = "A shell in the container"
summary = "A shell opened with kubectl exec raises 1 alert."
detail = """
Someone opens a shell in the payments pod with kubectl exec and types id -u. The service was started without a shell, so a shell is never normal: Shell in container, pod payments-api, sh.
"""
speech = """
Third demo: a shell. [[slnc 400]] The service never needs one. [[slnc 600]] One alert.
"""
rows = { shell = "active wrong" }
console = [
    ["kubectl exec payments-api -- sh", "bad"],
    ["Shell in container: sh", "bad"],
]

[[act]]
title = "A write where it never writes"
summary = "A program written to /usr/bin raises 1 alert."
detail = """
A program is written to /usr/bin in the payments pod. The service writes only to its log folder and /tmp: Unexpected write in container, /usr/bin/miner. The log folder is written the same way and raises nothing.
"""
speech = """
Fourth demo: a write. [[slnc 400]] The service writes only to its log folder. [[slnc 600]] A program in slash usr slash bin is one alert.
"""
rows = { write = "active wrong" }
console = [
    ["write /usr/bin/miner", "bad"],
    ["Unexpected write: /usr/bin/miner", "bad"],
]

[[act]]
title = "A connection it never makes"
summary = "A connection to a server outside the cluster raises 1 alert."
detail = """
The payments pod connects to a server outside the cluster on port 4444. The service calls only the ledger and the cluster DNS: Unexpected outbound connection to the outside server. The ledger call raised nothing.
"""
speech = """
Fifth demo: a connection. [[slnc 400]] The service calls only the ledger. [[slnc 600]] A call to an unknown address is one alert.
"""
rows = { connect = "active wrong" }
console = [
    ["connect the outside server:4444", "bad"],
    ["Unexpected outbound connection", "bad"],
]

[[act]]
title = "Prevent and detect"
summary = "A read-only root refuses the write, and the attempt still raises 1 alert."
detail = """
The same write in a pod with a read-only root file system is refused by the kernel. The sensor still sees the attempt: Unexpected write in container, /usr/bin/ (refused). Prevention and detection work together.
"""
speech = """
Last demo: prevent and detect. [[slnc 400]] A read-only root refuses the write. [[slnc 600]] The attempt is still an alert.
"""
rows = { prevent = "active ok" }
console = [
    ["write refused: read-only file system", "ok"],
    ["Unexpected write: /usr/bin/ (refused)", "ok"],
]

[animation]
subtitle = "A bank's pod, watched while it runs."
boxes = [
    ["falco", "Falco on this machine", "no BTF"],
    ["normal", "The service doing its work", "0 alerts"],
    ["shell", "A shell in the container", "1 alert"],
    ["write", "A write where it never writes", "1 alert"],
    ["connect", "A connection it never makes", "1 alert"],
    ["prevent", "Prevent and detect", "refused, 1 alert"],
]

[docs.problem]
scenario = """
A bank wants to know when its payments pod starts doing something it never does.
"""
naive = """
Rely on admission control and network policies, and find out about a taken-over container from a customer.
"""
deliver = [
    "A real cluster with a payments pod and a ledger pod.",
    "Three rules in Falco's language, checked by Falco.",
    "A sensor on this kernel that applies the same three tests.",
    "Normal work with 0 alerts, the three behaviours with 1 alert each, and prevent versus detect.",
]

[docs.prerequisites]
required = [
    "Java basics",
    "Docker running",
    "kind and kubectl (brew install kind kubectl)",
]
not_required = [
    "A cloud account",
    "A Linux machine (Docker Desktop is enough)",
]
install = ["kind", "kubectl"]

[docs.session]
objectives = [
    "write a Falco rule for a shell, a write and a connection",
    "explain why a rule needs a baseline",
    "explain why Falco's driver needs BTF or a kernel module",
    "explain the difference between preventing and detecting",
]
walkthrough = """
Run the demo and compare the second act with the next three. Then find in the last act which part refused and which part told you.
"""
exercises = [
    "Add a rule for a program that is written and then run (drop and execute).",
    "Add the ledger to the baseline of a second service and see what changes.",
    "Make the sensor read the container from the kernel record instead of afterwards, and find what the audit record lacks.",
    "Run the rules file in Falco on a Linux machine with BTF.",
]

[docs.explained]
sentence = """
A detector only knows what you told it is normal.
"""
verdict = """
Start the service without a shell, make the root file system read-only, deny the network by default, and write a rule for each thing the service must never do, with the baseline in the same file and an owner for each alert.
"""
recognise = [
    "A container image with a shell and curl in production.",
    "A rule with no baseline that fires all day.",
    "A cluster with detection and nobody on call.",
    "A driver that was never tested on the kernel that runs it.",
]

[spec]
purpose = """
Teach runtime detection by watching a real pod do normal work and then three things it must never do.
"""
nongoals = [
    "Responding to an alert (see the detection module).",
    "Falco's Kubernetes audit plugin.",
    "Seccomp and AppArmor profiles.",
]
problem = """
Preventive controls are bypassed by a taken-over container, and without runtime detection nobody notices.
"""
roles = [["The pods", "`Pods`"], ["The audit records", "`Audit`, `Event`"], ["The three rules", "`Rules`, `Alert`"], ["Falco", "`Falco`"], ["The audit sensor", "`Sensor`"], ["The cluster and the lab", "`Cluster`, `Lab`"], ["Entry point", "`RuntimeSecurityDemo`"]]
requirements = [
    "Normal work of the service raises no alert.",
    "A shell, a write outside the expected folders and a connection to an unknown address each raise one alert.",
    "A refused write is still reported.",
    "Falco accepts the rules file.",
    "The demo prints the same output on every run.",
]

