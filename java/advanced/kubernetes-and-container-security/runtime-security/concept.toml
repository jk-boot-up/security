[[act]]
title = "A shell in the container"
summary = "Someone opens a shell in payments-api with kubectl exec and types id -u, which answers 0 (root): 1 alert, Shell in container, sh."
detail = """
The input: kubectl exec -i payments-api -- sh, then id -u. The shell answers 0, the root user.
The result: one alert: rule Shell in container, pod payments-api, detail sh.
Why: the exec record names the process sh, sh is in the shell list (ash, bash, dash, sh, zsh), and the service was started as httpd, never by a shell, so any shell is an alert.
"""
figure = "shell_alert"
figure_title = "A shell where none belongs"
figure_speech = """
Third demo: a shell in the container. [[slnc 400]] On the left, the input. [[slnc 300]] Someone with kubectl exec rights opens a shell in the payments pod, and types i d dash u. [[slnc 300]] It answers zero: the shell runs as root. [[slnc 700]]
On the right, the result: one alert. [[slnc 300]] Shell in container, in payments api, the program sh. [[slnc 700]]
Why? [[slnc 300]] The exec record names the process sh, which is on the list of shells. [[slnc 300]] The service itself was started without a shell, so a shell in it is never normal work.
"""
speech = """
The input: kubectl exec into the payments pod, then i d dash u. [[slnc 300]] It answers zero, the root user. [[slnc 400]] The result: one alert, shell in container, sh.
[[page]]
Why: the exec record names sh, which is on the list of shells. [[slnc 300]] And the baseline has no shell at all.
"""
