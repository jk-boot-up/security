slug = "siem-basics"
level = "advanced"
module = "detection-engineering"
title = "SIEM Basics"
short_title = "SIEM Basics"
package = "siembasics"
main_class = "SiemBasicsDemo"
tagline = "Three logs, one shape, one clock"
bold = "One day of a bank's logs comes from three sources in three formats, a web application (623 lines of JSON), a database audit log (322 lines of key=value in local time) and a host (506 lines of syslog); 20 lines that do not fit are kept as dead letters; a query written for the web fields finds 121 failed logins and one query on the common fields finds 178 from 2 sources; the database's +0530 clock, read as if it were UTC, moves an event by 330 minutes and a rule misses the bulk export (1 alert against 0); a rule of 10 failed logins within 10 minutes finds 0 alerts one source at a time and 1 alert on the joined events (8 web and 6 host failures, then a success: 15 events), 0 for ordinary mistyped passwords, and the 2 alerts become 1 case."
domain = "a bank"
domain_note = ""
youtube_description = "SIEM basics for a bank: one web, database and syslog line each turned into one common event shape, dead letters for what does not parse, one query on the common fields, the time zone offset worked out and the alert it decides, a brute-force rule that only sees the attack across sources, and two alerts grouped into one case."
