[threatmodel]
scope = """
The collection, normalization and correlation of security logs. It does not cover how the logs are produced or the response.
"""
assets = [
    "The logs.",
    "The rules.",
    "The clock.",
]
actors = [
    "An attacker who spreads over systems.",
    "An analyst.",
    "A log source that changes its format.",
]
boundaries = [
    "The parser: what it cannot read is a blind spot.",
]
assumptions = [
    "The sources' clocks are right, or their offsets are known.",
]
out_of_scope = [
    "Log tampering at the source.",
    "Response.",
]
tests = [
    "`SiemTest` checks the parsers, the offset, the dead letters, the rules and the cases with the JDK only.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
This is the last project of the module.
"""

[[threat]]
id = "T1"
stride = "R"
threat = "An attack that spans sources is not seen"
where = "the rules"
control = "Normalize the sources and write rules over the joined events"
residual = "Sources that are not collected"

[[threat]]
id = "T2"
stride = "I"
threat = "Lines that do not parse hide an attack"
where = "the parsers"
control = "Keep dead letters, count them, alert when they rise"
residual = "Formats that change without notice"

[[threat]]
id = "T3"
stride = "T"
threat = "A wrong clock reorders events"
where = "the timestamps"
control = "Record the offset of every source and test with it"
residual = "Clocks that drift"

