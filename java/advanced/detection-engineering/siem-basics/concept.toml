[[act]]
title = "One query on the common fields"
summary = "A query on the web application's own fields (type = login and ok = false) finds 121 failed logins. One query on the common fields (action = login and outcome = failure) finds 178: 121 from the web and 57 from the hosts."
detail = """
The input is the same day, asked the same question twice. Before normalizing, the query uses the web's own field names, so it can only read the web: 121 failed logins. After normalizing, one query on the common fields reads every source: web 121, database 0, host 57, so 178 from 2 sources.
"""
figure = "one_query"
figure_title = "The same question, before and after normalizing"
figure_speech = """
Second demo: one question, asked twice. [[slnc 400]] How many logins failed today? [[slnc 700]]
At the top, before normalizing. [[slnc 300]] The query uses the web application's own names: type equals login, and ok equals false. [[slnc 300]] Those names exist only in the web log, so it finds one hundred and twenty one, all from the web. [[slnc 700]]
At the bottom, after normalizing. [[slnc 300]] Every source now has the same fields: action, and outcome. [[slnc 300]] One query, action equals login and outcome equals failure, reads them all. [[slnc 300]] The web gives the same one hundred and twenty one, and the hosts add fifty seven secure shell failures. [[slnc 300]] One hundred and seventy eight in all. [[slnc 500]] The failures were always there. Only the field names stood in the way.
"""
speech = """
Before normalizing: a query on the web's own fields finds one hundred and twenty one. [[slnc 400]] After: one query on the common fields. [[slnc 300]] The web gives one hundred and twenty one, the database none, and the hosts fifty seven. [[slnc 300]] One hundred and seventy eight, from two sources.
"""
rows = { normalize = "active ok" }
console = [
    ["BEFORE NORMALIZING (a query on the web's own fields):", "code"],
    ["  type = login and ok = false", "muted"],
    ["  failed logins found: 121 (the web only)", "muted"],
    ["AFTER NORMALIZING (one query on the common fields):", "code"],
    ["  action = login and outcome = failure", "muted"],
    ["  web    121", "muted"],
    ["  db     0", "muted"],
    ["  host   57", "muted"],
    ["  failed logins found: 178 from 2 sources", "ok"],
]

[[act]]
title = "The clock decides an alert"
summary = "The database writes 14:55:00 +0530. Honoured, that is 14:55:00 - 05:30 = 09:25:00 UTC, five minutes after alice's web login at 09:20:00, so the rule \"a web login, then a bulk read within 15 minutes\" raises 1 alert. Read as UTC, the read lands at 14:55:00, 335 minutes after the login: 0 alerts. The nightly report job's 600000-row read at 02:00:00 has no login before it: 0 alerts."
detail = """
The input is the database line time=2026-10-23 14:55:00 +0530 ... rows=500000, alice's web login at 09:20:00 UTC, and the rule: a web login, then a bulk read by the same user within 15 minutes.
How the time is made: with the offset honoured, 14:55:00 - 05:30 = 09:25:00 UTC; with it ignored, 14:55:00 is read as if it were UTC, and the event moves by 330 minutes.
The result: honoured, the login and the read are 5 minutes apart, 1 alert; ignored, 335 minutes apart, 0 alerts. The nightly report job reads 600000 rows at 02:00:00 with no web login before it and raises no alert.
"""
figure = "clock_timeline"
figure_title = "One offset, two clocks, one alert"
figure_speech = """
Third demo: the clock. [[slnc 400]] The database writes its local time, fourteen fifty five, and its offset: plus five thirty. [[slnc 700]]
At the top, how the time is made. [[slnc 300]] With the offset honoured, fourteen fifty five, minus five hours thirty, is nine twenty five U T C. [[slnc 300]] With the offset ignored, fourteen fifty five is read as if it were already U T C. [[slnc 700]]
On the timeline, alice's web login is at nine twenty. [[slnc 300]] The green box is the rule's window: a bulk read within fifteen minutes of a login. [[slnc 300]] The honoured read, at nine twenty five, falls inside it. One alert. [[slnc 500]] The ignored read lands at fourteen fifty five, five and a half hours away. [[slnc 300]] No alert, and the export of half a million rows goes unseen. [[slnc 500]] Time is the first thing that breaks a correlation.
"""
speech = """
The input: the database line in local time, the rule, and alice's web login at nine twenty. [[slnc 400]] How the time is made: honoured, nine twenty five U T C. Ignored, fourteen fifty five, three hundred and thirty minutes away. [[slnc 400]] The rule both ways: five minutes apart gives one alert, three hundred and thirty five minutes apart gives none. [[slnc 300]] And the nightly report job, with no login before it, raises no alert.
"""
rows = { clock = "active ok" }
console = [
    ["THE DATABASE LINE (local time, with its offset):", "code"],
    ["  time=2026-10-23 14:55:00 +0530 ... rows=500000", "muted"],
    ["  the rule: a web login, then a bulk read within 15 min", "muted"],
    ["  alice's web login: 09:20:00 UTC", "muted"],
    ["HOW THE TIME IS MADE:", "code"],
    ["  offset honoured  14:55:00 - 05:30 = 09:25:00 UTC", "ok"],
    ["  offset ignored   14:55:00 read as UTC = 14:55:00 UTC", "bad"],
    ["  the event moves by 330 minutes", "bad"],
    ["THE RULE, BOTH WAYS:", "code"],
    ["  honoured: login 09:20:00, read 09:25:00, 5 min apart: 1 alert", "ok"],
    ["  ignored:  login 09:20:00, read 14:55:00, 335 min apart: 0 alerts", "bad"],
    ["  the nightly report job: 600000 rows at 02:00:00, no web login", "muted"],
    ["    before it: 0 alerts", "muted"],
]

[[act]]
title = "Correlating across sources"
summary = "From 203.0.113.5, alice gets 8 failed web logins and 6 failed ssh logins between 09:12:00 and 09:14:20, then a web success at 09:20:00. The rule (10 failures within 10 minutes, then a success) sees 8 on the web alone and 6 on the host alone: 0 alerts. On the joined events it counts 14 failures and the success: 1 alert with 15 events. Ordinary mistyped passwords raise 0."
detail = """
The input is alice's events from 203.0.113.5: web, 8 failed logins from 09:12:00 to 09:14:20; host, 6 failed logins from 09:12:10 to 09:14:15; web, a successful login at 09:20:00.
How the rule counts: the window is 09:10:00 to 09:20:00. The web alone has 8 failures, under 10; the host alone has 6 and no success: no alert either way. Joined, 14 failures, then the success: an alert.
The result: one source at a time, 0 alerts; on the joined events, 1 alert about alice with 15 events behind it; everyone else, with up to 3 mistyped passwords before a success, 0 alerts.
"""
figure = "joined_timeline"
figure_title = "Eight here, six there: fourteen together"
figure_speech = """
Fourth demo: correlating across sources. [[slnc 400]] The input is every event about alice from one outside address. [[slnc 300]] The top row is the web: eight failed logins in about two minutes. [[slnc 300]] The second row is the host's secure shell: six more failures in the same minutes. [[slnc 300]] Then, at nine twenty, a successful web login. [[slnc 700]]
The rule says: ten failures within ten minutes, then a success, from the same address. [[slnc 300]] The amber box is the ten minutes before the success. [[slnc 500]] The web alone has eight. Under ten, so no alert. [[slnc 300]] The host alone has six, and no success. No alert. [[slnc 500]] Joined, the same window holds fourteen failures, then the success. [[slnc 300]] One alert, with fifteen events behind it. [[slnc 500]] The attacker split the guesses across two doors, and only the joined view sees both.
"""
speech = """
The input: alice's events from one address. [[slnc 300]] Eight web failures, six host failures, then a web success. [[slnc 400]] How the rule counts: the window is nine ten to nine twenty. Eight alone, six alone, no alert. Joined, fourteen: an alert. [[slnc 400]] The result: zero alerts one source at a time, one alert on the joined events, and none for ordinary mistyped passwords.
"""
rows = { correlate = "active ok" }
console = [
    ["THE EVENTS FOR alice FROM 203.0.113.5:", "code"],
    ["  web  8 failed logins, 09:12:00 to 09:14:20", "muted"],
    ["  host 6 failed logins, 09:12:10 to 09:14:15", "muted"],
    ["  web  a successful login at 09:20:00", "muted"],
    ["HOW THE RULE COUNTS (10 failures within 10 min, then a success):", "code"],
    ["  the window: 09:10:00 to 09:20:00", "muted"],
    ["  web alone:  8 failures, under 10: no alert", "bad"],
    ["  host alone: 6 failures, no success, under 10: no alert", "bad"],
    ["  joined:     14 failures, then the success: alert", "ok"],
    ["THE RESULT:", "code"],
    ["  one source at a time: 0 alerts", "bad"],
    ["  the joined events:    1 alert, alice, 15 events behind it", "ok"],
    ["  everyone else (up to 3 mistyped passwords): 0 alerts", "muted"],
]

[[act]]
title = "From alerts to cases"
summary = "Two alerts about alice, a burst of failures then a success (15 events) and a login then a bulk read (2 events), become one case: 2 alerts, 17 events, one story."
detail = """
The input is the alerts the two rules raised. The result is the cases: alerts about the same user are grouped, so the analyst gets one case about alice with 2 alerts and 17 events behind them, not two unrelated alerts.
"""
figure = "alerts_to_case"
figure_title = "Two alerts, one case"
figure_speech = """
Fifth demo: from alerts to cases. [[slnc 400]] On the left, the input: the two alerts the rules raised today. [[slnc 300]] A burst of failures, then a success, about alice, with fifteen events behind it. [[slnc 300]] And a login, then a bulk read, also about alice. [[slnc 700]]
On the right, the result. [[slnc 300]] Alerts about the same user are grouped into one case. [[slnc 300]] One case, two alerts, seventeen events. [[slnc 500]] The analyst reads one story: someone guessed alice's password from outside, got in, and exported half a million rows. [[slnc 300]] Two separate alerts in a queue could each look like noise.
"""
speech = """
The alerts: the burst, with fifteen events, and the bulk read, with two. [[slnc 400]] The cases: alerts about one user are one case. [[slnc 300]] Alice: two alerts, seventeen events, one story.
"""
rows = { cases = "active ok" }
console = [
    ["THE ALERTS:", "code"],
    ["  burst of failures, then a success    alice  15 events", "muted"],
    ["  login, then a bulk read              alice   2 events", "muted"],
    ["THE CASES (alerts about one user are one case):", "code"],
    ["  alice: 2 alerts, 17 events, one story", "ok"],
    ["  alerts 2, cases 1", "ok"],
]

