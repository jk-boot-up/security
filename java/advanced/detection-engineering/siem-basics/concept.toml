    ["  host (syslog)", "muted"],
    ["    Oct 23 09:12:10 bastion-01 sshd[6040]: Failed password", "muted"],
    ["    for alice from 203.0.113.5 port 55123 ssh2", "muted"],
    ["---", ""],
