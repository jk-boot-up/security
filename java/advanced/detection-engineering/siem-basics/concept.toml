# concept.toml: everything about this project that is not Java code.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "siem-basics"
level = "advanced"
module = "detection-engineering"
title = "SIEM Basics"
short_title = "SIEM Basics"
package = "siembasics"
main_class = "SiemBasicsDemo"
tagline = "Collect a bank's web, database and host logs in three formats, normalize them into one shape and one clock, and correlate across sources to see an attack that no single source shows"
bold = "One day of a bank's logs comes from three sources in three formats, a web application (623 lines of JSON), a database audit log (322 lines of key=value in local time) and a host (506 lines of syslog); 20 lines that do not fit are kept as dead letters; a query written for the web fields finds 121 failed logins and one query on the common fields finds 178 from 2 sources; the database's +0530 clock, read as if it were UTC, moves an event by 330 minutes and a rule misses the bulk export (1 alert against 0); a rule of 10 failed logins within 10 minutes finds 0 alerts one source at a time and 1 alert on the joined events (alice, 15 events), 0 for ordinary mistyped passwords, and the 2 alerts become 1 case."
domain = "a bank"
domain_note = ""
youtube_description = "SIEM basics for a bank: collecting web, database and syslog lines, dead letters for what does not parse, one common event shape, the time zone mistake that breaks a correlation, a rule that sees an attack only across sources, and turning alerts into cases."
thumb_lines = ["SIEM", "BASICS"]
thumb_code = "action=login outcome=failure source=web|host"
youtube_title = "SIEM Basics: Parsing, Normalizing, Time and Correlating Across Sources"
youtube_tags = ["siem", "log normalization", "log correlation", "syslog", "time zones", "dead letter queue", "security monitoring", "soc", "detection engineering", "java"]

[readme]
intro = """
A SIEM does three things before it can say anything useful: it **collects** lines from many sources, it **normalizes** them into one shape and one clock, and it **correlates** them across sources and time. This project does all three in Java for one day at a bank, from three sources in three formats: a web application (JSON), a database audit log (key=value, in local time with an offset) and a host (syslog, with no year and no time zone). An attack is hidden across them. It needs only the JDK: `./gradlew test`, then `./gradlew run`.

What it shows:
- **Collecting.** 623 + 322 + 506 lines; the **20** lines of the database log that do not fit are kept as **dead letters**, not dropped.
- **Normalizing.** A query written for the web's field names finds **121** failed logins; one query on the common fields finds **178**, from 2 sources.
- **The clock.** The database writes `+0530`; read as UTC it moves an event by **330 minutes**, and a correlation rule misses the bulk export (**1** alert against **0**).
- **Correlating.** A rule of 10 failed logins in 10 minutes raises **0** alerts one source at a time and **1** on the joined events; ordinary mistyped passwords raise **0**.
- **Cases.** The 2 alerts about the same user are **1** case.

**Maps to:** NIST CSF 2.0 DE.CM and DE.AE · NIST SP 800-92 (log management) · MITRE ATT&CK T1110 (brute force), T1078 (valid accounts), T1213 (data from information repositories) · ECS and OCSF as common schemas.
"""
analogy = """
A call centre that takes reports in three languages and three time zones. Until the reports are written in one language and stamped with one clock, nobody can see that three callers described the same man at the same door.
"""
scenario = """
A bank's logs arrive from a web application, a database and a host, each in its own format. The demo parses them, puts them on one clock and one schema, and runs two rules that need all three.
"""
costs = [
    "**Every source needs a parser** and a person to keep it working.",
    "**Lines that do not parse are a blind spot** unless they are counted.",
    "**Clocks disagree,** and the disagreement hides attacks.",
    "**Storage and licences grow with volume.**",
    "**Correlation rules need tuning** against your own traffic.",
]
too_much = """
A small team with one application can read its log directly. A SIEM pays when several sources must be read together, retention and search are required, or the same rules must run on all of them.
"""
met_before = [
    "A log line with no time zone.",
    "A parser that silently drops what it cannot read.",
    "Three dashboards for one attack.",
    "An alert threshold applied to one source only.",
]
where = """
This is a project of the [detection-engineering](..) module, after [detection-as-code](../detection-as-code) and [threat-hunting](../threat-hunting). The rules there assume the common shape that this project builds.
"""
twin = """
The parsers and rules are real Java, and the three formats are those of a typical web application, database audit log and ssh server. The lines are made by a seeded generator, so each run is the same.
"""
test_note = "The parsers, the rules and the generator are tested with the JDK only. The demo is compared with its golden output."

[[act]]
title = "Collecting three sources"
summary = "623 JSON lines, 322 database lines and 506 syslog lines; the 20 that do not fit are kept as dead letters."
detail = """
Three parsers read three formats. 623 web events, 302 database events and 506 host events come out. The 20 garbled lines of the database audit log do not match and are kept as dead letters, so that someone can count them and ask why.
"""
speech = """
First demo: collecting. [[slnc 400]] Three sources and three formats. [[slnc 600]] Twenty lines do not fit, and they are kept, not dropped.
"""
rows = { collect = "active ok" }
console = [
    ["web 623, database 322, host 506 lines", "ok"],
    ["events parsed: 623, 302, 506", "ok"],
    ["dead letters: 20", "bad"],
]

[[act]]
title = "Normalizing into one shape"
summary = "A query for the web's fields finds 121 failed logins; one query on the common fields finds 178 from 2 sources."
detail = """
Every event becomes the same record: time in UTC, source, host, user, address, action and outcome. A query written for the web application's field names finds 121 failed logins. One query on action login and outcome failure finds 178, from the web and the hosts.
"""
speech = """
Second demo: normalizing. [[slnc 400]] A query for one source's fields sees one source. [[slnc 600]] One shape, and the same query sees them all.
"""
rows = { normalize = "active wrong" }
console = [
    ["web-only query: 121", "bad"],
    ["common query: 178 from 2 sources", "ok"],
    ["one shape, one query", "ok"],
]

[[act]]
title = "The clock"
summary = "The database's +0530 clock, read as UTC, moves an event by 330 minutes and a correlation rule misses the attack."
detail = """
The database writes local time with an offset of +0530. If the offset is ignored the bulk export moves by 330 minutes. The rule login then a bulk read within 15 minutes raises 1 alert when the offset is honoured and 0 when it is not. The nightly report job reads 600000 rows too, but has no web login before it, so it raises none.
"""
speech = """
Third demo: the clock. [[slnc 400]] A time zone ignored moves an event by five and a half hours. [[slnc 600]] The rule that needed the order of events now misses the attack.
"""
rows = { clock = "active wrong" }
console = [
    ["offset ignored: 330 minutes off", "bad"],
    ["rule with offset: 1 alert, without: 0", "bad"],
    ["the nightly job: 0 alerts", "ok"],
]

[[act]]
title = "Correlating across sources"
summary = "A rule of 10 failures in 10 minutes raises 0 alerts one source at a time and 1 on the joined events."
detail = """
Alice's account is attacked with 8 failures on the web and 6 on ssh, then a success. Neither source reaches 10 failures alone, so the rule per source raises 0 alerts. On the joined events there are 14 failures and a success from the same address: 1 alert with 15 events behind it. Ordinary mistyped passwords raise none.
"""
speech = """
Fourth demo: correlating. [[slnc 400]] Eight failures on one source and six on another. [[slnc 600]] Neither source alone sees the attack. The joined events do.
"""
rows = { correlate = "active ok" }
console = [
    ["one source at a time: 0 alerts", "bad"],
    ["joined events: 1 alert, 15 events", "ok"],
    ["mistyped passwords: 0 alerts", "ok"],
]

[[act]]
title = "From alerts to cases"
summary = "The 2 alerts about alice are 1 case."
detail = """
The brute force alert and the login-then-bulk-read alert are about the same user on the same day. An analyst should get one case with both, not two tickets.
"""
speech = """
Fifth demo: cases. [[slnc 400]] Two alerts about the same user. [[slnc 600]] One case for the analyst.
"""
rows = { cases = "active ok" }
console = [
    ["alerts: 2", "ok"],
    ["cases: 1 (alice)", "ok"],
    ["2 alerts in the case", "ok"],
]

[animation]
subtitle = "A bank's three logs, on one clock."
boxes = [
    ["collect", "Collecting three sources", "20 dead letters"],
    ["normalize", "Normalizing into one shape", "121 to 178"],
    ["clock", "The clock", "330 minutes"],
    ["correlate", "Correlating across sources", "0, then 1"],
    ["cases", "From alerts to cases", "1 case"],
]

[docs.problem]
scenario = """
A bank has an attack spread over its web application, its database and its hosts, and each log looks innocent alone.
"""
naive = """
Search each log with its own tool and compare by eye.
"""
deliver = [
    "Parsers for three formats, with dead letters.",
    "One event shape and one clock.",
    "Rules that look across sources.",
    "Alerts grouped into cases.",
]

[docs.prerequisites]
required = [
    "Java basics",
]
not_required = [
    "A SIEM product",
    "Docker",
]
install = []

[docs.session]
objectives = [
    "parse three log formats into one event shape",
    "explain why lines that do not parse must be counted",
    "show how a time zone mistake breaks a correlation",
    "write a rule that needs two sources",
]
walkthrough = """
Run the demo and compare the web-only query with the common query. Then set the offset to be ignored and see the second rule go quiet.
"""
exercises = [
    "Add a fourth source, a proxy log, and its parser.",
    "Add enrichment: the department of each user and the criticality of each host.",
    "Make the rule window per user depend on the user's usual behaviour.",
    "Alert when the number of dead letters rises.",
]

[docs.explained]
sentence = """
A SIEM is only as good as its parsers, its clock and its joins.
"""
verdict = """
Parse every source into one shape, keep and count what does not parse, put every time on one clock and record where it came from, write rules that need more than one source, and group alerts into cases.
"""
recognise = [
    "A parser that drops what it cannot read.",
    "A log with no time zone.",
    "A threshold applied to one source.",
    "One ticket for each alert about the same person.",
]

[spec]
purpose = """
Teach the basics of a SIEM by parsing, normalizing and correlating three bank log sources.
"""
nongoals = [
    "Operating a SIEM product.",
    "Scaling ingestion.",
    "Machine-learning detections.",
]
problem = """
Attacks cross systems while logs are kept in separate formats and clocks, so each source looks innocent.
"""
roles = [["The one event shape", "`Event`"], ["The log lines", "`Sources`"], ["The parsers", "`Parsers`"], ["The rules and cases", "`Correlator`"], ["Entry point", "`SiemBasicsDemo`"], ["The tests", "`SiemTest`"]]
requirements = [
    "Three formats are parsed into one event shape in UTC.",
    "Lines that do not parse are kept and counted.",
    "Ignoring a source's offset changes a rule's result as the demo prints.",
    "A rule over the joined events finds an attack that no single source shows.",
    "The demo prints the same output on every run.",
]

