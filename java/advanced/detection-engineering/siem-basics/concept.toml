[poster]
headline = [["SIEM", "text"], ["BASICS", "accent"]]
taglines = [["Three logs, one shape, one clock", "gold"]]
before = { code = "web alone 8, host alone 6: no alert", note = "One source at a time", tag = "BEFORE" }
after = { code = "joined 14 failures: 1 alert", note = "Correlated", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "SIEM Basics"
narration = "Hello, and welcome. [[slnc 400]] This video explains the basics of a S I E M. [[slnc 300]] Here, S I E M means a security information and event management system. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] Such a system does three things before it can say anything useful. [[slnc 300]] It collects lines from many sources. [[slnc 300]] It normalizes them into one shape, and one clock. [[slnc 300]] And it correlates them, across sources and across time. [[slnc 600]] Think of a bank's statements from three branches, in three languages and three time zones: you cannot see a pattern until they are translated, and put in order. [[slnc 600]] Our example is a bank."

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["One day of a bank's logs from three sources:", "a web application (JSON), a database audit log", "(key=value, local time) and a host (syslog).", "", "Hidden across them: someone guesses alice's", "password, gets in, and exports 500000 rows."]
narration = "Here is the scenario. [[slnc 400]] One day of a bank's logs arrives from three sources, each in its own format. [[slnc 300]] A web application writes J S O N. [[slnc 300]] A database audit log writes key equals value lines, in local time. [[slnc 300]] And a host writes syslog. [[slnc 500]] Hidden across them is an attack: someone guesses alice's password, gets in, and exports half a million rows. [[slnc 300]] No single log shows all of it."

[[scene]]
key = "02-words"
kind = "bullets"
title = "The Words"
body = ["Source: a system that writes log lines", "Parser: turns a line into an event", "Dead letter: a line that did not fit, kept", "Normalize: one set of field names, one clock", "Correlate: a rule over events from many sources", "Case: the alerts about one user, together"]
narration = """Before the demos, the words. [[slnc 500]] A source is a system that writes log lines: here the web application, the database, and a host. [[slnc 500]] A parser turns one line into an event. [[slnc 500]] A dead letter is a line that did not fit the parser, kept instead of thrown away. [[slnc 500]] To normalize is to give every event the same field names, and the same clock. [[slnc 500]] To correlate is to run a rule over events from many sources at once. [[slnc 500]] And a case gathers the alerts about one user, so they are read together."""

[[scene]]
key = "02-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "02-shape"
kind = "figure"
title = "Three lines, one shape"
body = "one_shape"
narration = """Let's see the core idea on three real lines, all about alice. [[slnc 600]] On the left, the input. [[slnc 300]] The web writes J S O N, with its time already in U T C. [[slnc 300]] The database writes key equals value, with its local time, fourteen fifty five, and an offset of plus five thirty. [[slnc 300]] The host writes syslog: no year, no zone, and the user hidden inside a sentence. [[slnc 700]]
On the right, the result. [[slnc 300]] Each line becomes one event with the same eight fields. [[slnc 300]] The time is in U T C: nine twenty, nine twenty five, and nine twelve. [[slnc 300]] The user is alice in all three. [[slnc 300]] The action and the outcome have the same names everywhere: a login that worked, a bulk read, a login that failed. [[slnc 600]] Now one query, and one rule, can read all three sources."""

[[scene]]
key = "03-acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "04-costs"
kind = "bullets"
title = "What It Costs"
body = ["Every source needs a parser, kept up to date", "Lines that do not fit must be kept, not dropped", "One ignored time zone moves events by hours", "One schema for all sources needs agreement", "Storage grows with every source added"]
narration = "Nothing is free. [[slnc 400]] Here is what it costs. [[slnc 500]] Every source needs a parser, kept up to date when the format changes. [[slnc 500]] Lines that do not fit must be kept as dead letters, not dropped, or an attack can hide in them. [[slnc 500]] One ignored time zone moves events by hours, and breaks every rule that needs their order. [[slnc 500]] One schema for all sources needs everyone to agree on the field names. [[slnc 300]] And storage grows with every source you add."

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Three dashboards, one per system", "A timestamp such as 2026-03-14 09:15:02 +0530", "A field called user in one log, usr in another", "An alert that fires only when two logs are joined"]
narration = "You have probably met this already. [[slnc 400]] Three dashboards, one for each system, show three parts of one attack. [[slnc 500]] A time stamp ending plus zero five thirty is local time with an offset, to convert before comparing. [[slnc 500]] A field called user in one log, and u s r in another, is why a common schema matters. [[slnc 500]] And an alert that fires only when two logs are joined is correlation at work."

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Store every time in UTC, with the source offset", "Map every source to one schema, such as ECS", "Keep the lines that do not parse, and count them", "Write rules on the common fields", "Group related alerts into one case"]
narration = "So, how do you use it? [[slnc 400]] Store every time in U T C, after applying the source's offset, and record where each clock came from. [[slnc 500]] Map every source to one common schema, such as E C S or O C S F. [[slnc 500]] Keep the lines that do not parse, count them, and look at them. [[slnc 500]] Write rules on the common fields, so one rule sees every source. [[slnc 300]] And group alerts about the same user into one case."

[[scene]]
key = "12-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a fourth source,", "a proxy log, and its parser."]
narration = "That's the basics of a S I E M. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Collect everything, put it on one clock and one schema, and only then can a rule see an attack that crosses systems. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a fourth source, a proxy log, with its own parser. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] Four small classes: the sources, the parsers, the one event shape, and the rules. [[slnc 300]] Here are the lines that matter."""

[[class]]
name = "Parsers"
what = "lines to events; a line that does not fit is kept"
[[class.part]]
title = "a dead letter"
code = """
Matcher m = WEB.matcher(l);
if (!m.matches()) {
    dead.add(l);
    continue;
}
"""
speech = """Each parser matches a line against its format. [[slnc 300]] A line that does not match is added to the dead letters, not dropped."""
[[class.part]]
title = "the clock, honoured or ignored"
code = """
Instant at = honourOffset
        ? OffsetDateTime.parse(m.group(1), DB_TIME).toInstant()
        : LocalDateTime.parse(m.group(1).substring(0, 19),
                DateTimeFormatter.ofPattern("yyyy-MM-dd HH:mm:ss")).toInstant(ZoneOffset.UTC);
"""
speech = """Honoured, the database time is read with its offset, and turned into an instant. [[slnc 300]] Ignored, the offset is cut off and the local time is read as U T C: the mistake the demo shows on purpose."""

[[class]]
name = "Event"
what = "the one shape every source becomes"
[[class.part]]
title = "eight fields, time in UTC"
code = """
public record Event(Instant at, String source, String host, String user, String ip,
        String action, String outcome, long rows) {
...
public boolean failedLogin() {
    return action.equals("login") && outcome.equals("failure");
"""
speech = """An instant in U T C, the source, the host, the user, the address, the action, the outcome and the rows read. [[slnc 300]] A failed login means the same thing for every source."""

[[class]]
name = "Correlator"
what = "rules across sources and time"
[[class.part]]
title = "failures before a success, all sources joined"
code = """
long failures = list.stream().filter(Event::failedLogin)
        .filter(f -> !f.at().isAfter(ok.at()) && Duration.between(f.at(), ok.at()).compareTo(window) <= 0)
        .count();
if (failures >= minFailures) {
"""
speech = """For each user and address, the rule takes each successful login and counts the failures in the window before it. [[slnc 300]] The list holds events from every source, so web and host failures add up."""
[[class.part]]
title = "alerts to cases"
code = """
return alerts.stream().collect(Collectors.groupingBy(Alert::user, TreeMap::new, Collectors.toList()));
"""
speech = """Cases are alerts grouped by user. [[slnc 300]] Two alerts about alice become one case."""

[[class]]
name = "Sources"
what = "one seeded day of lines in three formats, with the attack hidden in it"
[[class.part]]
title = "the attack, split across two sources"
code = """
for (int i = 0; i < 8; i++) {
    web.add(web(start.plusSeconds(i * 20L), "login", "alice", "203.0.113.5", false));
}
for (int i = 0; i < 6; i++) {
    host.add(host(start.plusSeconds(10 + i * 25L), "bastion-01", "alice", "203.0.113.5", false));
"""
speech = """The generator hides eight web failures and six secure shell failures for alice, from one address. [[slnc 300]] Neither reaches ten alone."""

[[acronym]]
short = "SIEM"
long = "Security Information and Event Management"
say = "S I E M is security information and event management: the system that collects the logs and raises the alerts."

[[acronym]]
short = "JSON"
long = "JavaScript Object Notation: the web log's format"
say = "J S O N is JavaScript object notation, the format of the web application's log."

[[acronym]]
short = "UTC"
long = "Coordinated Universal Time: one clock for every event"
say = "U T C is coordinated universal time: the one clock every event is put on."

[[acronym]]
short = "SSH"
long = "Secure Shell: the host's remote login"
say = "S S H is secure shell, the remote login whose failures the host's syslog records."

[[acronym]]
short = "ECS, OCSF"
long = "Elastic Common Schema; Open Cybersecurity Schema Framework"
say = "E C S and O C S F are two published common schemas: shared field names for security events."
