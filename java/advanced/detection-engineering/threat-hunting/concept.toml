[[act]]
title = "Hunt 4 and the scoreboard"
summary = "Bulk volume gives 2 leads, 1 an attack; the four hunts hand over 7 leads and find 4 of the 4 attacks the logs can show."
detail = """
Hunt 4. The hypothesis: data leaves in bulk, far above the host's own normal. For each host, the megabytes (MB) sent out per day are compared with that host's median day plus 6 times the median absolute deviation (MAD). srv-03: median 0.78 MB, MAD 0.09 MB, limit 1.32 MB, and 2401 MB on day 5. srv-04: limit 1.46 MB and 301 MB on day 6, a patch. srv-02 sends about 601 MB every day, which is its own median, so it is no lead.
The scoreboard: 7 leads to review, 5 of them attack events, which cover 4 of the 4 attacks that the logs show. The scheduled task is in no log: a gap in the data, not in the hunt.
"""
figure = "volume_days"
figure_title = "Each host against its own normal, and the scoreboard"
figure_speech = """
Fourth demo: data leaving in bulk. [[slnc 400]] The input: megabytes sent out per day, for two servers. [[slnc 700]]
Each host is compared with its own normal. [[slnc 300]] First its median day. [[slnc 300]] Then the median absolute deviation, M A D: how far a typical day is from that median. [[slnc 300]] The limit is the median plus six times the M A D. [[slnc 600]]
Server three's limit is about one point three megabytes. [[slnc 300]] On day five it sends two thousand four hundred: a lead, and an attack. [[slnc 300]] Server four's patch download is a lead too, but benign. [[slnc 300]] Server two sends six hundred megabytes every night, so that is its normal, and it is no lead. [[slnc 700]]
At the bottom, the scoreboard of all four hunts: seven leads, and every attack the logs can show.
