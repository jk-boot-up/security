    "A SIEM",
    "Docker",
]
install = []

[docs.session]
objectives = [
    "turn a hypothesis about an intruder into a query",
    "judge a lead against what really happened",
    "explain why benign periodic traffic looks like a beacon",
    "turn a hunt into a rule with an allowlist",
]
