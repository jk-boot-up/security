[[act]]
title = "From a hunt to a rule"
summary = "The beacon hunt as a rule raises 1 false alert on a clean week until the heartbeat is allowlisted; then 0, and 1 true alert on the attack week."
detail = """
The beacon hunt becomes a rule with the same limits: 50 or more calls, a variation under 0.30, at most 3 hosts. Before the allowlist, on a clean week made from seed 20261024, it raises 1 alert, the partner heartbeat: a false alarm. After the allowlist, the clean week gives 0 alerts and the attack week 1, the beacon: a true alarm.
A hunt gives leads, not verdicts; a hunt can only look at data that was collected; and a hunt that worked becomes a rule, with an allowlist and tests.
"""
figure = "rule_backtest"
figure_title = "The beacon hunt as a rule, before and after the allowlist"
figure_speech = """
Fifth demo: from a hunt to a rule. [[slnc 400]] The beacon hunt worked, so it becomes a rule that runs every week, with the same limits. [[slnc 700]]
On the left, before the allowlist. [[slnc 300]] On a clean week, with no attack in it, the rule raises one alert: the partner's heartbeat. [[slnc 300]] A false alarm. [[slnc 600]]
On the right, after the allowlist. [[slnc 300]] The clean week gives no alerts. [[slnc 300]] And on the attack week, the rule raises one alert: the beacon, a true alarm. [[slnc 600]]
The false lead of the hunt became the allowlist of the rule.
"""
speech = """
The real output. [[slnc 400]] The rule, then the clean week before the allowlist: one false alarm. [[slnc 300]] After the allowlist: none on the clean week, and one true alarm on the attack week. [[slnc 500]] And the bill. [[slnc 300]] A hunt gives leads, not verdicts. [[slnc 300]] It can only see data that was collected. [[slnc 300]] And a hunt that worked becomes a rule, with an allowlist and tests.
"""
