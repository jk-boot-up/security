[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] It is plain Java, with no libraries. [[slnc 300]] Here are the classes that matter."""

[[class]]
name = "Generator"
what = "a seeded week at a bank, with attacks and look-alikes"
[[class.part]]
title = "a beacon with jitter, and a heartbeat without"
code = """
RandomGenerator rng = RandomGeneratorFactory
        .of("L64X128MixRandom").create(seed);
...
for (long t = 100; t < WEEK; t += 600) {
    dns.add(new Dns("srv-02", "monitoring.partner.example", t, 200));
...
for (long t = 2 * DAY; t < 6 * DAY; t += 300 + rng.nextInt(61) - 30) {
    dns.add(new Dns("wks-014", "cdn-sync.example.invalid", t, 120));
"""
speech = """A fixed seed makes the same week on every run. [[slnc 300]] The heartbeat calls every six hundred seconds exactly. [[slnc 300]] The beacon calls every three hundred seconds, give or take thirty: that jitter is its disguise."""

[[class]]
name = "Hunts"
what = "the four hypotheses, and the numbers behind each"
[[class.part]]
title = "how even the gaps are"
code = """
double mean = Arrays.stream(gaps).average().orElse(0);
double sd = Math.sqrt(Arrays.stream(gaps)
        .map(g -> (g - mean) * (g - mean))
        .average().orElse(0));
...
return mean > 0 ? sd / mean : 0;
"""
speech = """The gaps between calls give a mean and a standard deviation. [[slnc 300]] Their ratio is the variation: zero for a perfect timer, about one for random calls."""
[[class.part]]
title = "regular AND rare"
code = """
Gaps g = gaps(e.getValue());
if (g.mean() > 0
        && g.variation() < maxVariation
        && hostsOf.get(domain) <= maxHostsForDomain) {
    leads.add(new Lead(e.getKey(), g.calls()
..."""
speech = """The beacon hunt joins two signals. [[slnc 300]] A pair is a lead only when its gaps are even and few hosts call its domain. [[slnc 300]] The allowlist is checked before both."""
[[class.part]]
title = "each host against its own normal"
code = """
double median = median(Arrays.stream(perDay)
        .asDoubleStream().toArray());
double mad = median(Arrays.stream(perDay)
        .mapToDouble(v -> Math.abs(v - median)).toArray());
return new Volume(perDay, median, mad,
        median + deviations * Math.max(mad, 1));
"""
speech = """The volume hunt takes a host's median day, and the median distance from it. [[slnc 300]] The limit is the median plus six of those distances, so one huge day cannot move it."""

[[class]]
name = "ThreatHuntingDemo"
what = "runs the hunts and judges every lead against the truth"
[[class.part]]
title = "the truth, and the judgement"
code = """
static final Set<String> ATTACK = Set.of(BEACON,
        "winword -> powershell", "powershell -> whoami",
        "srv-03 on day 5", "svc-backup from 203.0.113.50");
...
return ATTACK.contains(l.subject()) ? "ATTACK" : "not an attack";
"""
speech = """In the demo, the truth is known, because the attacks were planted. [[slnc 300]] In a real team, this line is a person, reading each lead."""

