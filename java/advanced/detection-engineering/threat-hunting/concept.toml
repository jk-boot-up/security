    "Add a hunt for logins from two places at once.",
    "Add jitter detection that does not depend on a fixed limit.",
    "Write the rare pair hunt as a rule and backtest it on the clean week.",
    "Add the scheduled task to the logs and write the hunt that finds it.",
]

[docs.explained]
sentence = """
A hunt asks the data a question that an alert never asked.
"""
verdict = """
Start from a hypothesis, query the data you have, judge every lead against what really happened, allowlist what is benign and write down why, name the data you are missing, and turn what works into a rule with tests.
"""
recognise = [
    "A hunt that is a search for an indicator from the news.",
    "A beacon rule with no allowlist.",
    "A threshold nobody has tuned.",
    "A hunt in one person's notebook.",
]

[spec]
purpose = """
Teach threat hunting by running four hypothesis-driven hunts over a seeded week of bank logs and scoring the leads.
"""
nongoals = [
    "Tools for hunting at scale.",
    "Machine-learning anomaly detection.",
    "Incident response.",
]
problem = """
Teams wait for alerts and do not look for what the alerts miss, or they hunt without a hypothesis and cannot say what they learned.
"""
roles = [["The events", "`Events`"], ["The seeded week", "`Generator`"], ["The hunts", "`Hunts`"], ["A lead", "`Hunts.Lead`"], ["The scoreboard", "`ThreatHuntingDemo`"], ["Entry point", "`ThreatHuntingDemo`"]]
requirements = [
    "The week is seeded and has known attacks and known benign look-alikes.",
    "Each hunt starts from a hypothesis and gives leads.",
    "Leads are judged against the truth and counted.",
    "A hunt can be written as a rule and backtested with and without an allowlist.",
    "The demo prints the same output on every run.",
]

