On the right, hunt three. [[slnc 300]] The guess: a stolen account logs in at a new hour, from a new place. [[slnc 300]] Each account's normal comes from the first four days. [[slnc 300]] The backup account logs in at midnight and at two. [[slnc 300]] Its new login, from a new address, is at three: a new hour, so a lead. [[slnc 500]] The manager's hotel login is at eleven, a usual hour, so it is not.
