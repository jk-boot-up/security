[[scene]]
key = "01-poster"
kind = "poster"
title = "Threat Hunting"
narration = "Hello, and welcome. [[slnc 400]] This video explains threat hunting, with four hunts written in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A hunt starts with a guess about what an intruder does, not with an alert. [[slnc 300]] The hunter turns the guess into a query over the logs, and the query gives leads: places to look. [[slnc 300]] A person judges each lead, and a hunt that works becomes a rule. [[slnc 600]] Think of a bank auditor who does not wait for a complaint, but asks: if someone were skimming, where would it show? [[slnc 600]] Our example is a bank."

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["A simulated week at a bank: 40 workstations,", "5 servers, 60 people and a service account.", "", "Hidden in it: 5 attacks, and benign things", "that look like attacks.", "", "Four hunts look for them; every lead is", "judged against what really happened."]
narration = "Here is the scenario. [[slnc 400]] A bank's security team has a week of logs, and a worry that someone is already inside. [[slnc 500]] Forty workstations, five servers, sixty people, and one service account. [[slnc 500]] Hidden in the week are five attacks, and some ordinary things that look like attacks. [[slnc 500]] The demo runs four hunts, and judges every lead they give against what really happened. [[slnc 300]] It all runs on your own machine, with only Java."

[[scene]]
key = "02-words"
kind = "bullets"
title = "The Words"
body = ["Hypothesis: a guess about what an intruder does", "Lead: a place to look, which a person judges", "Beacon: malware calling home on a timer", "Baseline: what is normal for one host or account", "Allowlist: benign things, written down with a reason", "Rule: a hunt that runs by itself, every week"]
narration = """Before the demos, the words. [[slnc 500]] A hypothesis is a guess about what an intruder does. [[slnc 500]] A lead is a place to look; it is not a verdict, and a person judges it. [[slnc 500]] A beacon is malware calling home to its owner on a timer. [[slnc 500]] A baseline is what is normal for one host, or one account. [[slnc 500]] An allowlist is a list of benign things, each written down with its reason. [[slnc 500]] And a rule is a hunt that runs by itself, every week, and raises an alert."""

[[scene]]
key = "02-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "02-core"
kind = "figure"
title = "From a guess to one lead"
body = "hunt_funnel"
narration = """Let's see the core idea on one hunt. [[slnc 400]] At the top, the guess: malware calls home on a timer, so look for many calls with even gaps. [[slnc 700]]
The query asks for exactly that, and gives eighty seven leads. [[slnc 300]] Far too many: every workstation checks for updates on a timer too. [[slnc 500]] So we add a second condition: the domain must be rare, called by at most three hosts. [[slnc 300]] Two leads are left. [[slnc 600]]
At the bottom, a person judges them. [[slnc 300]] One is the partner's heartbeat: benign, so it goes on the allowlist. [[slnc 300]] The other is a workstation calling a strange domain every five minutes: the attack. [[slnc 500]] Guess, query, judge, and learn."""

[[scene]]
key = "03-acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "04-costs"
kind = "bullets"
title = "What It Costs"
body = ["Every lead costs a person's time", "A limit that is too strict loses the attack", "Ordinary things look like attacks", "An attack with no log cannot be hunted", "A rule from a hunt needs an allowlist"]
narration = "Nothing is free. [[slnc 400]] Here is what it costs. [[slnc 500]] Every lead costs a person's time, and most leads are not attacks. [[slnc 500]] A limit that is too strict loses the attack: here, a beacon with a little jitter. [[slnc 500]] Ordinary things look like attacks, such as a heartbeat, or a patch download. [[slnc 500]] An attack that leaves no log cannot be hunted at all. [[slnc 300]] And a rule made from a hunt needs an allowlist, or it raises false alarms."

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["A host calling one rare domain every 5 minutes", "winword.exe starting powershell.exe", "A service account logging in at 3 a.m.", "  from a new address", "A server sending a thousand times its usual bytes"]
narration = "You have probably met this already. [[slnc 400]] A host calling one rare domain every five minutes may be a beacon. [[slnc 500]] Word starting PowerShell is a document running code. [[slnc 500]] A service account logging in at three in the morning, from a new address, may be stolen. [[slnc 500]] And a server sending a thousand times its usual bytes may be data leaving in bulk."

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Start each hunt from a written hypothesis", "Combine signals: regular AND rare", "Compare each host with its own baseline", "Judge every lead; allowlist with a reason", "Turn good hunts into rules; close log gaps"]
narration = "So, how do you use it? [[slnc 400]] Start each hunt from a written hypothesis about what an intruder does. [[slnc 500]] Combine signals: a regular call alone is common, a regular call to a rare domain is not. [[slnc 500]] Compare each host and each account with its own baseline. [[slnc 500]] Judge every lead, and allowlist the benign ones with a reason. [[slnc 300]] Then turn good hunts into rules, and close the gaps in the logs that a hunt reveals."

[[scene]]
key = "12-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a hunt for logins", "from two places at once."]
narration = "That's threat hunting. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Start from a guess about the intruder, combine signals until the leads are few, judge each one, and turn what works into a rule. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a hunt for logins from two places at once. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"

