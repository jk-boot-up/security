[[act]]
title = "Hunt 1: a timer in the lookups"
summary = "Regular calls alone give 87 leads; adding rarity gives 2; a limit that is too strict loses the beacon; the allowlist leaves 1, the attack."
detail = """
The hypothesis: malware calls home on a timer, so many calls with even gaps. For each host and domain, the gaps between calls are worked out: their mean, their standard deviation (sd), and the variation, sd divided by mean. The beacon: 1152 calls, mean 300 s, sd 18 s, variation 0.06. The partner heartbeat: 0.00. An hourly update check: 0.00. A news site: 0.99, random.
Before rarity: 50 or more calls with a variation under 0.30 gives 87 leads, every time sync and update check. After rarity (at most 3 hosts call the domain): 2 leads, the beacon and the heartbeat. Too strict (under 0.01): the beacon's jitter of 0.06 slips through. After the analyst allowlists the heartbeat: 1 lead, an attack.
"""
figure = "gap_variation"
figure_title = "How even are the gaps? Four pairs, worked out"
figure_speech = """
Second demo: a timer in the lookups. [[slnc 400]] The guess: malware calls home on a timer. [[slnc 300]] So for each host and domain, we take the times of the calls, and the gaps between them. [[slnc 700]]
Then we work out two numbers: the mean gap, and the standard deviation, how far the gaps spread around the mean. [[slnc 300]] Divide one by the other, and you get the variation. [[slnc 600]]
The beacon: a mean of three hundred seconds, a spread of eighteen. [[slnc 300]] Eighteen divided by three hundred is zero point zero six. [[slnc 300]] The heartbeat and the update check are perfect timers: zero. [[slnc 300]] A news site is random: about one. [[slnc 600]]
The limit is zero point three. [[slnc 300]] Everything left of it is a timer.
"""
speech = """
The real output. [[slnc 400]] The hypothesis, and the four pairs with their calls, mean gap, spread, and variation.
[[page]]
Before rarity, the query gives eighty seven leads. [[slnc 300]] Look at why: every workstation checks for updates and syncs its clock on a timer. [[slnc 400]] Those domains are called by forty one and forty five hosts. [[slnc 300]] After rarity, at most three hosts per domain, two leads are left: the heartbeat, which is not an attack, and the beacon, which is.
[[page]]
A limit that is too strict, under zero point zero one, keeps the perfect heartbeat and loses the beacon. [[slnc 300]] Its jitter is the disguise. [[slnc 400]] After the analyst allowlists the heartbeat, one lead is left, and it is the attack.
"""
rows = { timer = "active ok" }
# console-src: TWO|BEFORE RARITY|TOO STRICT
console = [
    ["THE HYPOTHESIS:", "code"],
    ["  malware calls home on a timer: many calls, even gaps", "muted"],
