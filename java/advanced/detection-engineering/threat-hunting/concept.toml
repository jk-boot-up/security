[threatmodel]
scope = """
The use of logs to find an intruder who has not raised an alert. It does not cover response.
"""
assets = [
    "The logs.",
    "The hunt notes and rules.",
]
actors = [
    "An intruder who stays quiet.",
    "An analyst.",
    "An administrator whose work looks odd.",
]
boundaries = [
    "The log pipeline: what is not collected cannot be hunted.",
]
assumptions = [
    "The logs are complete and have not been tampered with.",
]
out_of_scope = [
    "Attacks that leave no log.",
    "Response.",
]
tests = [
    "`HuntsTest` checks each hunt, the generator and the median with the JDK only.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next project in the module is siem-basics.
"""

[[threat]]
id = "T1"
stride = "R"
threat = "An intruder stays unseen because no rule asks the right question"
where = "the detections"
control = "Hypothesis-driven hunts that become rules"
residual = "Techniques nobody thought of"

[[threat]]
id = "T2"
stride = "I"
threat = "A gap in the logs hides an attack"
where = "the log sources"
control = "List the data gaps and close them"
residual = "Sources that cannot be collected"

[[threat]]
id = "T3"
stride = "D"
threat = "Too many false leads exhaust the analysts"
where = "the team"
control = "Rarity and baseline filters, allowlists with reasons"
residual = "Time spent on each lead"

