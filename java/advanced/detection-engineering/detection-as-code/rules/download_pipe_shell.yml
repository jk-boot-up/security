title: A download piped straight into a shell
id: 7c1f0b52-0d3a-4c1e-9a11-000000000005
name: download-pipe-shell
status: test
description: curl or wget whose output is run by a shell, the usual way to fetch and run a second stage.
author: bank detection engineering
date: 2026-03-01
tags:
    - attack.command-and-control
    - attack.t1105
    - attack.execution
    - attack.t1059.004
logsource:
    product: linux
    category: process_creation
detection:
    selection_fetch:
        CommandLine|contains:
            - 'curl '
            - 'wget '
    selection_pipe:
        CommandLine|contains:
            - '| sh'
            - '|sh'
            - '| bash'
            - '|bash'
    filter_internal:
        CommandLine|contains: 'repo.bank.internal'
    condition: selection_fetch and selection_pipe and not filter_internal
falsepositives:
    - An installer from a vendor that tells you to pipe it into a shell
level: medium
