title: Account created or changed to have administrator rights
id: 7c1f0b52-0d3a-4c1e-9a11-000000000002
name: new-admin-user
status: test
description: A new account in the sudo or wheel group, or with user id 0, is a way to keep access.
author: bank detection engineering
date: 2026-03-01
tags:
    - attack.persistence
    - attack.t1136.001
    - attack.privilege-escalation
    - attack.t1098
logsource:
    product: linux
    category: process_creation
detection:
    selection_create:
        Image|endswith:
            - '/useradd'
            - '/adduser'
        CommandLine|contains:
            - ' -G sudo'
            - ' -G wheel'
            - ' -u 0 '
            - ' -o '
    selection_modify:
        Image|endswith: '/usermod'
        CommandLine|contains:
            - 'sudo'
            - 'wheel'
    filter_provisioning:
        User: 'svc-provision'
    condition: 1 of selection_* and not filter_provisioning
falsepositives:
    - An administrator adding a colleague to the sudo group by hand
level: medium
