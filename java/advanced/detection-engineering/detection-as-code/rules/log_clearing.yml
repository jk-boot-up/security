title: Logs or shell history cleared
id: 7c1f0b52-0d3a-4c1e-9a11-000000000006
name: log-clearing
status: test
description: Deleting or emptying logs and history on Linux, and clearing the event log on Windows.
author: bank detection engineering
date: 2026-03-01
tags:
    - attack.defense-evasion
    - attack.t1070.002
    - attack.t1070.001
    - attack.t1070.003
logsource:
    product: linux
    category: process_creation
detection:
    selection_linux:
        Image|endswith:
            - '/rm'
            - '/shred'
            - '/truncate'
        CommandLine|contains: '/var/log/'
    selection_history:
        CommandLine|contains:
            - 'history -c'
            - 'unset HISTFILE'
    selection_wevtutil:
        Image|endswith: '\wevtutil.exe'
        CommandLine|contains: ' cl '
    selection_eventid:
        EventID: '1102'
    filter_logrotate:
        ParentImage|endswith: '/logrotate'
    condition: 1 of selection_* and not filter_logrotate
falsepositives:
    - A clean-up job that deletes old application logs
level: medium
