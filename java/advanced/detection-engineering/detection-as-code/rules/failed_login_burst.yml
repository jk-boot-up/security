title: A failed login
id: 7c1f0b52-0d3a-4c1e-9a11-000000000004
name: auth-failure
status: test
description: One failed login to the bank's staff or customer applications. Used by the burst rule, not alone.
author: bank detection engineering
date: 2026-03-01
tags:
    - attack.credential-access
    - attack.t1110.001
    - attack.t1110.003
logsource:
    product: bank
    service: auth
detection:
    selection:
        EventType: 'login'
        outcome: 'failure'
    condition: selection
level: informational
---
title: Many failed logins from one source
id: 7c1f0b52-0d3a-4c1e-9a11-000000000014
name: failed-login-burst
status: test
description: Ten or more failed logins from one address within five minutes, for one user or for many (spraying).
author: bank detection engineering
date: 2026-03-01
tags:
    - attack.credential-access
    - attack.t1110.001
    - attack.t1110.003
correlation:
    type: event_count
    rules:
        - auth-failure
    group-by:
        - src_ip
    timespan: 5m
    condition:
        gte: 10
falsepositives:
    - A service account with an old password that retries, a branch behind one address
level: high
