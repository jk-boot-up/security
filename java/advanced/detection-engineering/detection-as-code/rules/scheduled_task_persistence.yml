title: A scheduled job added that fetches or runs something
id: 7c1f0b52-0d3a-4c1e-9a11-000000000007
name: scheduled-task-persistence
status: test
description: A cron line or a Windows scheduled task that downloads, decodes or runs from a temporary folder.
author: bank detection engineering
date: 2026-03-01
tags:
    - attack.persistence
    - attack.t1053.003
    - attack.t1053.005
logsource:
    product: linux
    category: process_creation
detection:
    selection_cron:
        CommandLine|contains: 'crontab'
    selection_payload:
        CommandLine|contains:
            - 'curl '
            - 'wget '
            - '/tmp/'
            - 'base64'
    selection_schtasks:
        Image|endswith: '\schtasks.exe'
        CommandLine|contains: '/create'
    filter_backup:
        User: 'svc-backup'
    condition: ((selection_cron and selection_payload) or selection_schtasks) and not filter_backup
falsepositives:
    - A deployment that creates a scheduled task on a server
level: medium
