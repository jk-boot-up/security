title: Shell started by a web or application server process
id: 7c1f0b52-0d3a-4c1e-9a11-000000000001
name: web-server-shell
status: test
description: A web server, PHP or Java application server starting a shell is how a web shell or a injected command runs on a bank host.
author: bank detection engineering
date: 2026-03-01
tags:
    - attack.persistence
    - attack.t1505.003
    - attack.execution
    - attack.t1059.004
logsource:
    product: linux
    category: process_creation
detection:
    selection_parent:
        ParentImage|endswith:
            - '/nginx'
            - '/httpd'
            - '/php-fpm'
            - '/java'
    selection_child:
        Image|endswith:
            - '/sh'
            - '/bash'
            - '/dash'
    filter_healthcheck:
        CommandLine|startswith: '/bin/sh -c /opt/bank/bin/healthcheck'
    condition: selection_parent and selection_child and not filter_healthcheck
falsepositives:
    - A batch job in the Java application server that runs a shell script on purpose
level: high
