title: Injection or path traversal in a web request
id: 7c1f0b52-0d3a-4c1e-9a11-000000000008
name: web-injection-probe
status: test
description: A request whose query holds SQL injection or path traversal strings.
author: bank detection engineering
date: 2026-03-01
tags:
    - attack.initial-access
    - attack.t1190
logsource:
    category: webserver
detection:
    selection:
        query|contains:
            - "' or "
            - 'union select'
            - '../../'
            - '; drop '
    filter_branch_search:
        uri|startswith: '/search/branches'
    condition: selection and not filter_branch_search
falsepositives:
    - A customer or a staff member searching for words that look like SQL
level: medium
