title: Tool names and arguments of credential dumping
id: 7c1f0b52-0d3a-4c1e-9a11-000000000003
name: credential-dump-tools
status: test
description: Known credential dumpers by name and by argument, and a copy of the shadow file.
author: bank detection engineering
date: 2026-03-01
tags:
    - attack.credential-access
    - attack.t1003.001
    - attack.t1003.008
logsource:
    product: linux
    category: process_creation
detection:
    selection_image:
        Image|endswith:
            - '/mimikatz'
            - '\mimikatz.exe'
            - '\procdump.exe'
            - '/secretsdump.py'
            - '/lazagne'
    selection_cmd:
        CommandLine|contains:
            - 'mimikatz'
            - 'sekurlsa::'
            - 'lsass.dmp'
    selection_shadow:
        Image|endswith:
            - '/cp'
            - '/cat'
            - '/tar'
        CommandLine|contains: '/etc/shadow'
    filter_hunt:
        User: 'sec-hunt'
    condition: 1 of selection_* and not filter_hunt
falsepositives:
    - A person searching a file or a log for the name of a tool
level: high
