[[act]]
title = "Tests and mutants"
summary = "web-server-shell has 9 test cases, 5 that must match and 4 that must not. Every rule's 83 cases pass. Each small change to a rule (a mutant) makes at least one case fail: 80 of 80 killed, 0 survived."
detail = """
The input is the test file beside each rule, rules/tests/NAME.json: a few events and whether the rule must alert (match) or must not (no match). For web-server-shell: nginx, httpd, php-fpm and the application server starting a shell must match, a shell that only mentions the health check later must match, and a worker, a person's bash, the health check and python must not.
The result: 9 files, 83 cases (47 should match, 36 should not), 0 failing. Then the mutants: the mutator drops a value from a list (tighten), drops a filter or turns the first and into or (loosen), drops a field, or moves a threshold or window. For web-server-shell each of its 9 mutants makes 1 to 4 cases fail. Over every rule: 80 mutants, 30 loosen and 50 tighten, all 80 killed.
"""
figure = "mutants"
figure_title = "Every change to the rule makes a test fail"
figure_speech = """
Fourth demo: tests, and tests of the tests. [[slnc 400]] On the left, the input: the cases that sit beside the rule, in its test file. [[slnc 300]] Rose cases must raise an alert: nginx starting a shell, the application server starting a shell. [[slnc 300]] Green cases must stay quiet: a worker that is not a shell, a person's own bash, and the health check. [[slnc 700]]
On the right, the mutants. [[slnc 300]] A mutant is the rule with one small change. [[slnc 300]] Drop one value from a list, and the rule is tighter. [[slnc 300]] Drop the filter, or turn and into or, and the rule is looser. [[slnc 300]] Each mutant is run against the same cases. [[slnc 500]] Drop the value nginx, and the case nginx starts s h fails. [[slnc 300]] Drop the filter, and the health check case fails. [[slnc 300]] Every mutant makes at least one case fail: it is killed. [[slnc 500]] A mutant that survives would show a change that no test notices.
