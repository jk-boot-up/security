[[scene]]
key = "01-poster"
kind = "poster"
title = "Detection as Code"
narration = "Hello, and welcome. [[slnc 400]] This video explains detection as code, with Sigma rules. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A detection is a rule that raises an alert when the logs show an attack. [[slnc 300]] Detection as code treats it like any other code. [[slnc 300]] It has an author, a version, tests, and a cost, counted in false alarms. [[slnc 600]] Think of a bank's fraud rules: each one is reviewed, tested on past fraud, and watched for how many good customers it blocks. [[slnc 600]] Our example is a bank."

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["A bank's security team keeps its detections", "in a repository: 8 Sigma rules, each tagged", "with the attack techniques it is meant to catch.", "", "Each rule is scored on a labelled week of logs,", "tested, and held to a false-alarm budget."]
narration = "Here is the scenario. [[slnc 400]] A bank's security team keeps its detections in a repository: eight Sigma rules, each tagged with the attack techniques it is meant to catch. [[slnc 500]] Every rule is scored on a week of recorded logs, twenty one thousand seven hundred events, in which ninety two attacks are labelled. [[slnc 500]] Every rule has tests, and it must stay within a budget of false alarms a day."

[[scene]]
key = "02-words"
kind = "bullets"
title = "The Words"
body = ["Sigma rule: a detection written as a YAML file", "Selection: fields an event must match", "Filter: a known harmless case left out", "False alarm: an alert on a harmless event", "Precision, recall: how many alerts are real,", "  and how many attacks are caught", "Evasion: an attack spelled so a rule misses it"]
narration = """Before the demos, the words. [[slnc 500]] A Sigma rule is a detection written as a small Y A M L file, in an open format that many tools can read. [[slnc 500]] A selection lists fields an event must match, such as the program that started. [[slnc 500]] A filter is a known harmless case the rule leaves out. [[slnc 500]] A false alarm is an alert on a harmless event. [[slnc 500]] Precision says how many of the alerts are real. [[slnc 300]] Recall says how many of the attacks are caught. [[slnc 500]] And an evasion is an attack spelled another way, so the rule misses it."""

[[scene]]
key = "02-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "02-rule"
kind = "figure"
title = "What a Sigma rule is made of"
body = "rule_anatomy"
narration = """Let's see the core idea on one real rule: web server shell. [[slnc 400]] It is a plain text file, in the repository, next to its tests. [[slnc 600]] At the top, the tags. [[slnc 300]] They name the attack techniques the rule is meant to catch: here a web shell, and a Unix shell. [[slnc 600]] Then the selections. [[slnc 300]] The parent process must end in nginx, httpd, php fpm or java: a web or application server. [[slnc 300]] The child process must be a shell. [[slnc 500]] Then a filter, in rose: the bank's own health check, a shell the application server starts on purpose. [[slnc 500]] And the condition joins them: parent, and child, and not the filter. [[slnc 600]] Because the rule is a file, it can be reviewed, versioned, and tested, like any other code."""

[[scene]]
key = "03-acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "04-costs"
kind = "bullets"
title = "What It Costs"
body = ["Every rule misses some spellings of an attack", "Every filter is also a way past the rule", "Labelled logs and tests take work to keep", "A threshold chosen on one week fits that week", "A converted query must be checked against", "  the original"]
narration = "Nothing is free. [[slnc 400]] Here is what it costs. [[slnc 500]] Every rule misses some spellings of an attack: here, seventeen evasions. [[slnc 500]] Every filter that silences a false alarm is also a way past the rule, so it needs a test that says why it is there. [[slnc 500]] Labelled logs, and tests, take work to keep. [[slnc 500]] A threshold or a filter chosen on one week of logs fits that week; the next week is the real test. [[slnc 300]] And a query converted for another tool must be checked against the original."

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["A YAML rule with logsource, detection, condition", "A tag such as attack.t1110 (brute force)", "An alert queue nobody can keep up with", "A rule changed in the console, with no review"]
narration = "You have probably met this already. [[slnc 400]] Y A M L files with log source, detection, and condition are Sigma rules. [[slnc 500]] A tag such as attack dot t one one one zero maps it to a technique, here brute force. [[slnc 500]] An alert queue nobody can keep up with is a rule with no false alarm budget. [[slnc 500]] And a rule changed straight in the S I E M console, with no review, is a detection that is not code."

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Keep rules in a repository, with review", "Give every rule should-match and", "  should-not-match tests, and mutate it", "Score rules on labelled logs, evasions included", "Set a false-alarm budget per rule", "Read coverage from attacks, not from tags", "Check every converted query against the rule"]
narration = "So, how do you use it? [[slnc 400]] Keep rules in a repository, with review, like any other code. [[slnc 500]] Give every rule tests that must match, and tests that must not, and mutate the rule to check that the tests notice. [[slnc 500]] Score rules on labelled logs, with evasions in them. [[slnc 500]] Set a false alarm budget for each rule. [[slnc 300]] Read your coverage from the attacks you caught, not from the tags. [[slnc 300]] And check every converted query against the rule it came from."

[[scene]]
