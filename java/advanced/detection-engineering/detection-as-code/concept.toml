# concept.toml: everything about this project that is not Java code.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "detection-as-code"
level = "advanced"
module = "detection-engineering"
title = "Detection as Code"
short_title = "Detection as Code"
package = "detectioncode"
main_class = "DetectionAsCodeDemo"
tagline = "Write a bank's detections as Sigma rules tagged with MITRE ATT&CK, test them against a week of labelled logs, hold each to a false-positive budget, and run the pySigma-converted queries in OpenSearch"
bold = "8 Sigma rules run over 21,700 recorded events with 92 labelled attacks catch 65 of 82 attacks the rules are meant for (the 17 evasions are the misses) with 57 false alarms, 3 of the 8 rules go over their false-alarm budget, 83 rule test cases kill 80 of 80 mutated rules, 5 ATT&CK gaps are listed, and the queries pySigma makes return the same events as the Java evaluation in 8 of 8 cases in OpenSearch (the correlation rule is not converted by the backend)."
domain = "a bank"
domain_note = ""
youtube_description = "Detection engineering for a bank: Sigma rules tagged with MITRE ATT&CK, tested against labelled logs, held to false-positive budgets, mutation tested, and converted by pySigma to OpenSearch queries."
thumb_lines = ["DETECTION", "AS CODE"]
thumb_code = "condition: selection and not filter"
youtube_title = "Detection as Code: Sigma Rules, ATT&CK Coverage and False-Positive Budgets"
youtube_tags = ["detection engineering", "sigma", "mitre attack", "pysigma", "opensearch", "siem", "false positives", "mutation testing", "threat detection", "java"]

[readme]
intro = """
A detection is code: it has an author, a test, a version and a cost in alerts. This project writes **8 Sigma rules** (YAML) for a bank's hosts and applications, each tagged with MITRE ATT&CK techniques: a shell started by a web server, a new administrator, credential dumping tools, a burst of failed logins, a download piped into a shell, cleared logs, a scheduled task and an injection in a web request. A seeded generator makes **a week of 21,700 recorded events** (benign traffic, look-alikes and 92 labelled attacks), a small Sigma evaluator in Java scores every rule against the truth, and **pySigma** converts the rules to queries that run in **OpenSearch** in Docker. The demo is tagged `integration`: `./gradlew integrationTest`.

What it shows:
- **Scored.** 65 of the 82 attacks the rules are written for are caught; the 17 misses are spelled another way on purpose; 57 false alarms.
- **Budgets.** Each rule has a number of false alarms per day it may raise; 3 of 8 go over.
- **Tests and mutation.** 83 should-match and should-not-match cases; 80 of 80 loosened or tightened rules fail them.
- **Coverage.** ATT&CK techniques the rules cover against those the attacks used, with 5 gaps.
- **Conversion.** pySigma makes 8 queries; OpenSearch returns the same events as the Java evaluation for 8 of 8.

**Maps to:** MITRE ATT&CK T1505.003, T1136.001, T1003, T1110, T1105, T1070, T1053, T1190 · NIST CSF DE.CM, DE.AE · NIST SP 800-92.
"""
analogy = """
A smoke alarm with a test button and a log of every time it rang. You know how often it rings for toast, which fires it misses, and you can say so before the real fire.
"""
scenario = """
A bank's security team keeps its detections in a repository. Every change is a rule file with tests, it is scored on recorded logs, and it must stay within a budget of false alarms a day.
"""
costs = [
    "**Evasions exist.** A rule written for one spelling misses another.",
    "**Filters are holes.** A filter that silences a false alarm is also a way past the rule.",
    "**Labelled logs are made by people** and fit the attacks they thought of.",
    "**Conversion is not complete.** Backends do not support every Sigma feature.",
    "**Budgets need upkeep** as the traffic changes.",
]
too_much = """
A very small team with one log source can start with a few rules in the SIEM. Use detections as code when rules are shared, reviewed and changed often.
"""
met_before = [
    "Rules edited in a SIEM console with no history.",
    "An alert that fires 200 times a day and is muted.",
    "A coverage slide that lists techniques with no test.",
    "A rule that nobody knows still works.",
]
where = """
This is a project of the [detection-engineering](..) module. It uses the ideas of [privacy-engineering](../../privacy-and-data-protection/privacy-engineering) only in that it measures against a labelled truth, as [sast](../../devsecops-pipelines/sast) does.
"""
twin = """
Sigma, pySigma and OpenSearch are real; the logs are made by a seeded generator and are made up. The demo prints counts and rule names, never ports or container names.
"""
test_note = "The Sigma evaluator, the correlation, the corpus, the scoring, the rule tests, the mutation of every rule and the coverage matrix are tested with no tools. The demo runs pySigma and OpenSearch in Docker (./gradlew integrationTest)."

[[act]]
title = "The recorded logs"
summary = "A week of 21,700 events with 92 labelled attacks, 94 look-alikes with no filter and 208 with one."
detail = """
A seeded generator makes logins, process starts and web requests of a bank, look-alikes such as a health check run by the application server, and 92 attacks of which 65 are meant for a rule, 17 are evasions of those rules and 10 have no rule.
"""
speech = """
First demo: the recorded logs. [[slnc 400]] Twenty one thousand seven hundred events. [[slnc 600]] Ninety two attacks, labelled.
"""
rows = { logs = "active ok" }
console = [
    ["events: 21700 over 7 days", "ok"],
    ["attacks: 92", "bad"],
    ["look-alikes: 302", "bad"],
]

[[act]]
title = "Rules scored"
summary = "The 8 rules catch 65 of the 82 attacks they are written for, with 57 false alarms."
detail = """
Each rule is scored against the truth: attacks caught and missed, false alarms, precision and recall. The misses are the evasions: a renamed tool, another way to spell a command.
"""
speech = """
Second demo: rules scored. [[slnc 400]] Sixty five of eighty two attacks caught. [[slnc 600]] Fifty seven false alarms.
"""
rows = { score = "active ok" }
console = [
    ["caught 65 of 82", "ok"],
    ["false alarms 57", "bad"],
    ["recall 0.73 to 0.82", "ok"],
]

[[act]]
title = "False-positive budgets"
summary = "Each rule has a number of false alarms a day; 3 of the 8 go over it."
detail = """
The budget is set with the SOC. log-clearing, scheduled-task-persistence and web-server-shell go over on some days. Removing the health-check filter takes web-server-shell from 6 to 77 false alarms.
"""
speech = """
Third demo: false-positive budgets. [[slnc 400]] Three rules are over. [[slnc 600]] Take away one filter and six false alarms become seventy seven.
"""
rows = { budget = "active ok" }
console = [
    ["rules over budget: 3 of 8", "bad"],
    ["no filter: 6 to 77", "bad"],
    ["failed logins at 15: 0 false alarms", "ok"],
]

[[act]]
title = "Tests and mutants"
summary = "83 test cases fail on 80 of 80 loosened or tightened rules."
detail = """
Each rule has a file of cases that should match and should not. The mutator drops a filter, a field or a value, changes an and to an or, moves a threshold: all 80 changed rules fail a test.
"""
speech = """
Fourth demo: tests and mutants. [[slnc 400]] Eighty three cases. [[slnc 600]] Every one of eighty changed rules fails a test.
"""
rows = { mutants = "active ok" }
console = [
    ["cases: 83", "ok"],
    ["mutants killed: 80 of 80", "ok"],
    ["rules with no test: 0", "ok"],
]

[[act]]
title = "ATT&CK coverage"
summary = "Techniques the rules cover against the techniques the attacks used, with 5 gaps and 10 partial."
detail = """
The matrix has 20 techniques: 4 covered, 10 partial because of evasions, 5 with attacks and no rule, and 1 tagged and never attacked in the logs.
"""
speech = """
Fifth demo: ATT&CK coverage. [[slnc 400]] Five gaps with no rule. [[slnc 600]] A tag is not a detection.
"""
rows = { attack = "active ok" }
console = [
    ["gaps: 5 techniques", "bad"],
    ["partial: 10", "bad"],
    ["covered: 4 of 20", "ok"],
]

[[act]]
title = "pySigma and OpenSearch"
summary = "pySigma converts 8 of 9 rules; the queries return the same events as Java for 8 of 8."
detail = """
pySigma 1.5.1 with the OpenSearch backend converts 8 rules to Lucene queries; the backend does not support the correlation rule, so the count is done over the failed logins OpenSearch returns. 8 of 8 queries return exactly the events of the Java evaluation over 21,700 events.
"""
speech = """
Sixth demo: pySigma and OpenSearch. [[slnc 400]] Eight queries. [[slnc 600]] The same events as the Java evaluation, eight of eight.
"""
rows = { opensearch = "active ok" }
console = [
    ["converted: 8 of 9", "ok"],
    ["same events: 8 of 8", "ok"],
    ["correlation: not converted", "bad"],
]

[animation]
subtitle = "A bank's detections, tested like code."
boxes = [
    ["logs", "The recorded logs", "21,700"],
    ["score", "Rules scored", "65 of 82"],
    ["budget", "False-positive budgets", "3 of 8 over"],
    ["mutants", "Tests and mutants", "80 of 80"],
    ["attack", "ATT&CK coverage", "5 gaps"],
    ["opensearch", "pySigma and OpenSearch", "8 of 8"],
]

[docs.problem]
scenario = """
A bank wants to know whether its detections catch the attacks they are written for, how many false alarms they cost, and what they miss.
"""
naive = """
Edit rules in the console and judge them by how quiet they are.
"""
deliver = [
    "Sigma rules with ATT&CK tags.",
    "A labelled week of logs.",
    "Precision, recall and a false-alarm budget for each rule.",
    "Rule tests, mutation tests and a coverage matrix.",
    "pySigma conversion checked against OpenSearch.",
]

[docs.prerequisites]
required = [
    "Java basics",
    "python3 with pip (pySigma is installed into build/ once)",
    "Docker running",
    "The OpenSearch image (docker pull opensearchproject/opensearch:3.9.0, about 1.3 GB once)",
]
not_required = [
    "A SIEM licence",
    "Real logs",
]
install = ["docker", "python3"]

[docs.session]
objectives = [
    "write a Sigma rule with a condition, a filter and ATT&CK tags",
    "score a rule against labelled logs",
    "set and check a false-alarm budget",
    "test a rule with cases and mutants",
    "read an ATT&CK coverage matrix",
]
walkthrough = """
Run the demo. Find the rule that is over budget, remove its filter in a copy, and watch the tests and the false alarms change.
"""
exercises = [
    "Write a ninth rule for T1021.004 and add its attacks and tests.",
    "Add a filter to log-clearing to bring it within budget and a test that says why.",
    "Catch the evasions of download-pipe-shell and see the false alarms.",
    "Add the Elasticsearch backend and compare queries.",
]

[docs.explained]
sentence = """
A detection is code: give it tests and a truth, measure what it catches and what it costs, and keep the numbers.
"""
verdict = """
Keep rules in a repository with tests and tags, score them on labelled logs, set a false-alarm budget per rule, mutate the rules to test the tests, and read coverage from attacks, not from tags.
"""
recognise = [
    "A rule that has not fired in a year and has no test.",
    "A rule that fires 200 times a day.",
    "A coverage chart made of tags.",
    "A filter nobody can explain.",
]

[spec]
purpose = """
Teach detection engineering by scoring Sigma rules against labelled logs with budgets, tests and a coverage matrix.
"""
nongoals = [
    "Impossible travel and machine learning detections.",
    "Writing a Sigma backend.",
    "Running a production SIEM.",
]
problem = """
Detections are written and judged by how quiet they are, with no truth to compare with.
"""
roles = [["A rule", "`Rule`"], ["Sigma evaluation", "`Sigma`, `Engine`"], ["The recorded logs", "`Corpus`"], ["The score", "`Score`"], ["Tests and mutants", "`RuleTests`, `Mutator`"], ["ATT&CK matrix", "`Coverage`"], ["pySigma and OpenSearch", "`Pysigma`, `OpenSearch`"], ["Entry point", "`DetectionAsCodeDemo`"]]
requirements = [
    "Eight Sigma rules with ATT&CK tags.",
    "A seeded corpus with benign, look-alike and labelled attack events.",
    "Precision, recall and a budget check per rule.",
    "Rule tests and mutation of every rule.",
    "A coverage matrix with gaps.",
    "pySigma queries compared with the Java evaluation in OpenSearch.",
    "The demo prints the same output on every run.",
]

