narration = "That's detection as code. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] A detection is code: review it, test it, score it on real attacks, and hold it to a budget of false alarms. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a filter that brings the log clearing rule within its budget, and a test that says why. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] The rules are Y A M L files; the Java reads them, runs them, and measures them. [[slnc 300]] Here are the classes that matter."""

[[class]]
name = "Sigma"
what = "reads a rule and turns it into a test on one event"
[[class.part]]
title = "a selection: every field must match"
code = """
return f -> any.stream().anyMatch(tests ->
        tests.stream().allMatch(t -> t.test(f)));
"""
speech = """A selection is a set of fields. [[slnc 300]] Every field must match, and a list of values means any one of them."""
[[class.part]]
title = "the condition: or, and, not"
code = """
private Predicate<Map<String, String>> not() {
    if (peek("not")) {
        pos++;
        return not().negate();
"""
speech = """The condition is parsed like a tiny language. [[slnc 300]] Or, then and, then not, then a selection's name. [[slnc 300]] Not simply turns the answer around."""

[[class]]
name = "ConditionSteps"
what = "a teaching class: each selection answered on its own"
[[class.part]]
title = "one selection, as its own rule"
code = """
// a detection of one selection, whose condition is that selection
out.put(name, Sigma.compile(Map.of(name, body, "condition", name))
        .test(event));
"""
speech = """To show the steps, each selection is compiled as a rule of its own. [[slnc 300]] A test checks that the answers, joined by the condition, give the rule's own result."""

[[class]]
name = "Engine"
what = "runs a rule over events in time order"
[[class.part]]
title = "a correlation: N events in a window"
code = """
times.addLast(e.ms());
while (e.ms() - times.peekFirst() > span) {
    times.removeFirst();
}
if (times.size() >= c.gte()) {
    out.add(e.id());
"""
speech = """For the failed login burst, the engine keeps a window of times for each address. [[slnc 300]] Old times fall out of the window. [[slnc 300]] When ten are inside it, the last one raises the alert."""

[[class]]
name = "Score"
what = "one rule against the truth"
[[class.part]]
title = "precision and the budget"
code = """
double precision() {
    return tpAlerts + falsePositives == 0 ? 1.0
            : (double) tpAlerts / (tpAlerts + falsePositives);
...
int daysOver(int budget) {
"""
speech = """Precision is the alerts on the rule's attacks, divided by those plus the false alarms. [[slnc 300]] And days over counts the days whose false alarms are above the budget."""

[[class]]
name = "Mutator and RuleTests"
what = "mutants, and the cases that must catch them"
[[class.part]]
title = "a mutant, and a passing case"
code = """
out.add(detection(rule, "loosen", "drop " + sel, d -> Sigma.map(d.get("detection"))
        .put("condition", condition.replace("and not " + sel, "").trim())));
...
static boolean passes(Case c, Rule rule, Map<String, Rule> all) {
    return !Engine.alerts(rule, all, c.events()).isEmpty()
            == c.expect();
"""
speech = """The mutator copies the rule and changes one thing: here, it drops a filter from the condition. [[slnc 300]] A case passes when the rule alerts exactly when it should. [[slnc 300]] A mutant is killed when some case fails."""

[[class]]
name = "Coverage"
what = "the ATT&CK matrix, from tags and labelled attacks"
[[class.part]]
title = "the status of a technique"
code = """
if (rules.isEmpty()) {
    return "GAP no rule";
}
if (attacks == 0) {
    return "untested, no labelled attack";
}
return detected == attacks ? "covered" : "partial";
"""
speech = """No rule is a gap. [[slnc 300]] A rule with no attack to test it is untested. [[slnc 300]] Otherwise, covered only when every attack was caught."""

[[class]]
name = "Pysigma and OpenSearch"
what = "the real tools, at pinned versions"
[[class.part]]
title = "pinned, and compared"
code = """
static final String PYSIGMA = "1.5.1";
static final String OPENSEARCH_BACKEND = "2.0.3";
...
static final String IMAGE = "opensearchproject/opensearch:3.9.0";
...
boolean agree = java.equals(opensearch);
"""
speech = """The tool versions are pinned, so the output is the same on every run. [[slnc 300]] For each query, the set of event ids from OpenSearch must equal the set from Java."""

[[acronym]]
short = "SIEM"
long = "Security Information and Event Management"
say = "S I E M is security information and event management: the system that collects the logs and raises the alerts."

[[acronym]]
short = "MITRE ATT&CK"
long = "Adversarial Tactics, Techniques and Common Knowledge"
say = "MITRE attack is a public catalogue of how attackers work, kept by the non-profit MITRE. The letters stand for adversarial tactics, techniques, and common knowledge."

[[acronym]]
short = "YAML"
long = "YAML Ain't Markup Language: a text format for data"
say = "Y A M L is a plain text format for data. Sigma rules are written in it."

[[acronym]]
short = "JSON"
long = "JavaScript Object Notation"
say = "J S O N is JavaScript object notation: the format of the events and of the test files."

[[acronym]]
short = "P, R"
long = "Precision and recall"
say = "P is precision: how many alerts are real. R is recall: how many attacks are caught."

[[acronym]]
short = "SSH"
long = "Secure Shell: remote login to a server"
say = "S S H is secure shell: logging in to a server from another one."

[[acronym]]
short = "T1003-T1505"
long = "ATT&CK technique ids, e.g. T1110 Brute Force"
say = "A technique id such as T one one one zero names one attack technique: here brute force. The part after the dot names a variant."
