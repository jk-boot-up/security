[[act]]
title = "Mutual TLS alone does not decide"
summary = "5 callers x 4 bank services - 4 calls to itself = 16 pairs; the design allows 2. With mutual TLS and no policy 16 of 16 answer, 14 not in the design, 4 of 4 from legacy/batch which has no proxy, and the node gets HTTP 200: Linkerd's default policy is all-unauthenticated."
detail = """
The input: every caller (web, payments, ledger, statements and legacy/batch) calls every bank service: 5 x 4 - 4 = 16 pairs. The design allows 2: web -> payments and payments -> ledger.
The result: 16 of 16 answered, 14 not in the design, 0 missing. legacy/batch, with no proxy, reached 4 of 4. Ledger's proxy let in a connection with no identity (yes), and the node itself, with no proxy and no identity, gets HTTP 200. Linkerd's default inbound policy, all-unauthenticated, lets every caller in: mutual TLS encrypts and names, but decides nothing.
"""
figure = "matrix_open"
figure_title = "Who answered, with mutual TLS and no policy"
figure_speech = """
Third demo: is mutual T L S a decision? [[slnc 400]] The input: five callers each call the four bank services. [[slnc 300]] Five times four is twenty, minus the four calls a service would make to itself: sixteen pairs. [[slnc 300]] The design wants only two of them: web calls payments, and payments calls the ledger. [[slnc 700]]
