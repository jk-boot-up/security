[[diagram]]
name = "threat-model-diagram"
kind = "flow"
title = "Threat model: trust boundaries and threats"
caption = "Dashed boxes are trust boundaries. Rose tags show where each threat in the table applies."
zones = [
    { label = "Cluster", nodes = ["web", "ctl", "ledger"], colour = "green" },
    { label = "Outside the mesh", nodes = ["batch", "node"], colour = "red" },
]
nodes = [
    { id = "web", label = "Web proxy", sub = "has an identity", col = 0, row = 0, colour = "accent", threats = ["T3"] },
    { id = "ctl", label = "Identity service", sub = "signs certificates", col = 1, row = 0, colour = "amber", threats = ["T4"] },
    { id = "ledger", label = "Ledger proxy", sub = "checks the policy", col = 2, row = 0, colour = "green", threats = ["T1"] },
    { id = "batch", label = "Batch job", sub = "no proxy", col = 3, row = 0, colour = "red", threats = ["T2"] },
    { id = "node", label = "Node", sub = "root can capture", col = 4, row = 0, colour = "red", threats = ["T5"] },
]
edges = [
    { from = "web", to = "ledger", label = "mTLS call", threats = ["T1"] },
    { from = "batch", to = "ledger", label = "plaintext", colour = "red", dashed = true, threats = ["T2"] },
    { from = "node", to = "ledger", label = "plaintext", colour = "red", dashed = true, threats = ["T5"] },
]

[threatmodel]
scope = """
Calls between a bank's pods in a Kubernetes cluster that runs Linkerd. It does not cover the application's own flaws, the cluster's control plane or the nodes' operating system.
"""
assets = [
    "The account data in the calls.",
    "The identities and the trust anchor.",
    "The policies.",
]
actors = [
    "A pod that is not in the mesh.",
    "A user who can create pods.",
    "Root on a node.",
    "A caller that is allowed but sends hostile requests.",
]
boundaries = [
    "The proxy of each pod.",
    "The ServiceAccount: who may create pods that run as it.",
]
assumptions = [
    "The control plane and its trust anchor are not compromised.",
]
out_of_scope = [
    "Compromise of the identity service.",
    "Denial of service.",
]
tests = [
    "`PoliciesTest`, `MetricsTest`, `CertInfoTest`, `WireTest` and `DesignTest` check the manifests, the counters, the certificate reading and the scoring with no tools.",
    "`DemoRunsTest` makes the cluster and compares the whole demo with the golden output (integrationTest).",
]
next = """
The next project in the module continues with the identity of workloads.
"""

[[threat]]
id = "T1"
stride = "S"
threat = "A service is called by a workload that is not meant to"
where = "the ledger"
control = "A Server and an AuthorizationPolicy naming one identity"
residual = "A workload that holds the named identity"

[[threat]]
id = "T2"
stride = "I"
threat = "Traffic to or from a pod outside the mesh is readable"
where = "the account data"
control = "Put the pod in the mesh and require mesh identity in the policy"
residual = "Pods and ports with no Server"

[[threat]]
id = "T3"
stride = "E"
threat = "A new pod takes another workload's identity"
where = "the identities"
control = "Restrict who may create pods and ServiceAccounts"
residual = "Anyone with the right to create pods"

[[threat]]
id = "T4"
stride = "R"
threat = "A stolen certificate is used until it expires"
where = "the identities"
control = "Short certificate lifetime and automatic renewal"
residual = "No revocation before expiry"

[[threat]]
id = "T5"
stride = "I"
threat = "Root on a node reads the plaintext inside a pod"
where = "the account data"
control = "Node hardening and access control"
residual = "The mesh cannot protect it"

[poster]
headline = [["SERVICE MESH", "text"], ["mTLS", "accent"]]
taglines = [["Pod identities, encrypted calls, and what a mesh misses", "gold"]]
before = { code = "account number on the wire: yes, then no", note = "The wire", tag = "BEFORE" }
after = { code = "2 of 16 pairs answered", note = "Policy", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "Service Mesh and Automatic mTLS"
narration = "Hello, and welcome. [[slnc 400]] This video explains a service mesh, and automatic mutual T L S, with Linkerd. [[slnc 300]] T L S is transport layer security, the encryption behind H T T P S; mutual means both ends show a certificate. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A service mesh puts a small proxy beside every pod. [[slnc 300]] The proxies get a certificate for each pod from its service account, encrypt every call between them, and check each other's certificates, with no change to the application. [[slnc 600]] Think of every office in a bank getting its own guard, who checks the badge of every visitor. [[slnc 300]] The guard still needs a list of who may come in. [[slnc 600]] Our example is a bank."

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["A bank's pods on a real kind cluster:", "web, payments, ledger and statements,", "plus a batch job outside the mesh.", "", "Linkerd adds a proxy to each pod. The demo", "measures who can call whom, before and after."]
narration = "Here is the scenario. [[slnc 400]] A bank runs four workloads on a real Kubernetes cluster, made with kind: web, payments, ledger, and statements. [[slnc 500]] A batch job runs in a legacy namespace, outside the mesh. [[slnc 500]] Linkerd adds a proxy beside each pod. [[slnc 300]] The demo measures what is on the wire, and who can call whom, before and after, and with and without a policy."

[[scene]]
key = "02-words"
kind = "bullets"
title = "The Words"
body = ["Pod: one running workload in Kubernetes", "ServiceAccount: the account a pod runs as", "Proxy: a small program beside the app in the pod", "Identity: a name in the proxy's certificate", "Server, AuthorizationPolicy: Linkerd's policy objects", "Trust anchor: the root that signs every certificate"]
narration = """Before the demos, the words. [[slnc 500]] A pod is one running workload in Kubernetes. [[slnc 500]] A service account is the account a pod runs as; Kubernetes gives the pod a signed token for it. [[slnc 500]] A proxy is a small program the mesh adds beside the app, inside the same pod; all traffic goes through it. [[slnc 500]] An identity is the name in the proxy's certificate. [[slnc 500]] A Server and an authorization policy are Linkerd's objects that say who may call a port. [[slnc 500]] And the trust anchor is the root certificate that every other certificate in the mesh leads back to."""

[[scene]]
key = "02-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "02-identity"
kind = "figure"
title = "How a pod gets its name"
body = "identity_parts"
narration = """Let's see the core idea on one example: where a pod's name comes from. [[slnc 400]] At the top, the input: the payments pod runs in the namespace bank, as the service account payments. [[slnc 300]] That is all the mesh needs. [[slnc 600]]
In the middle, how the name is made. [[slnc 300]] Five parts, joined by dots. [[slnc 300]] The service account, payments. [[slnc 300]] The namespace, bank. [[slnc 300]] A fixed part, service account dot identity. [[slnc 300]] Linkerd's own namespace. [[slnc 300]] And the trust domain, cluster dot local. [[slnc 700]]
At the bottom, the result: that is exactly the subject of the certificate payments' proxy holds. [[slnc 300]] The proxy proved the pod's service account with its token, and Linkerd signed the name. [[slnc 300]] So the name is only as good as the control over who may run a pod as that account."""

[[scene]]
key = "03-acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "04-costs"
kind = "bullets"
title = "What It Costs"
body = ["A proxy in every pod: memory and latency", "Mutual TLS alone lets everyone call everyone", "Root on the node reads the plaintext", "  between the proxy and the app", "An allowed caller can still send an attack", "Whoever may create pods may take an identity"]
narration = "Nothing is free. [[slnc 400]] Here is what it costs. [[slnc 500]] A proxy in every pod costs memory and some latency, and a control plane to run. [[slnc 500]] Mutual T L S alone lets every workload call every other one. [[slnc 300]] You still need a policy. [[slnc 500]] Root on the node reads the plaintext between the proxy and the app. [[slnc 500]] An allowed caller can still send an injection string, and the mesh passes it on. [[slnc 500]] And whoever may create pods may run as a service account, and take its identity."

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["Cluster, Linkerd: a kind cluster with Linkerd", "Service: a workload and its ServiceAccount", "Lab, Design: measure who can call whom", "Policies: Server and AuthorizationPolicy", "Sniffer, Wire: a capture with root on the node", "Metrics, CertInfo: proxy counters, certificates"]
narration = "Here is who does what in the code. [[slnc 400]] Cluster and Linkerd make a real kind cluster, with Linkerd installed. [[slnc 500]] Service is a workload of the bank, with the service account its pod runs as. [[slnc 500]] Lab measures who can call whom, and Design compares it with the plan. [[slnc 500]] Policies writes Linkerd's Server and authorization policy objects. [[slnc 300]] Sniffer captures packets the way someone with root on the node would, and Wire reads the capture. [[slnc 300]] Metrics reads the proxies' counters, and CertInfo reads a certificate's dates."

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["A pod with two containers: the app and linkerd-proxy", "An annotation: linkerd.io/inject: enabled", "An identity ending in", "  serviceaccount.identity.linkerd.cluster.local", "A namespace with no AuthorizationPolicy"]
narration = "You have probably met this already. [[slnc 400]] A pod with two containers, the app and linkerd proxy, is a pod in the mesh. [[slnc 500]] An annotation saying linkerd inject enabled is how it got there. [[slnc 500]] A long name ending in service account, identity, linkerd, cluster local, is a pod's identity. [[slnc 500]] And a namespace with no authorization policy is encrypted, and open to every caller."

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Put every workload in the mesh", "Write a policy that names who may call", "Control who may create pods and ServiceAccounts", "Still validate input in the application", "Keep certificate lifetimes short"]
narration = "So, how do you use it? [[slnc 400]] Put every workload in the mesh, so nothing talks in clear. [[slnc 500]] Write a policy that names exactly which identities may call each service. [[slnc 500]] Control who may create pods and service accounts, because that controls identity. [[slnc 500]] Still validate input in the application. [[slnc 300]] And keep certificate lifetimes short."

[[scene]]
key = "12-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Set the namespace's default", "inbound policy to deny, and compare."]
narration = "That's a service mesh with automatic mutual T L S. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] The mesh gives every pod an identity and encrypts every call, but only a policy decides who may call whom. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Set the namespace's default inbound policy to deny, and compare who can still call whom. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] The cluster, Linkerd and the capture are real; the classes drive them and read what they report. [[slnc 300]] Here are the ones that matter."""

[[class]]
name = "Service"
what = "a workload, its ServiceAccount and its identity"

[[class.part]]
title = "the identity: five parts joined by dots"
code = """
public String identity() {
    return String.join(".", identityParts());
...
return java.util.List.of(serviceAccount, namespace,
        "serviceaccount.identity", "linkerd", "cluster.local");
"""
speech = """The name a proxy gets is the service account, the namespace, and three fixed parts. [[slnc 300]] A test checks it against the subject Linkerd really signs."""

[[class]]
name = "Lab"
what = "the bank's pods on the cluster, and the measurements"

[[class.part]]
title = "inject the proxies"
code = """
cluster.must("annotate", "namespace", namespace,
        "linkerd.io/inject=enabled", "--overwrite");
cluster.must("-n", namespace, "rollout", "restart", "deploy");
"""
speech = """One annotation on the namespace, and a restart. [[slnc 300]] Linkerd adds its proxy to every new pod there. [[slnc 300]] The apps do not change."""

[[class.part]]
title = "every caller calls every service"
code = """
for (Service from : CALLERS) {
    for (Service to : BANK) {
        if (!from.equals(to) && cluster.http(from, to.url("/hostname")) == 200) {
            answered.add(Design.pair(from, to));
"""
speech = """Each caller runs curl inside its own pod. [[slnc 300]] The pairs that answer two hundred are the measurement the demo compares with the design."""

[[class]]
name = "Policies"
what = "Linkerd's Server and AuthorizationPolicy for one service"

[[class.part]]
title = "a Server, then the one identity allowed"
code = """
kind: Server
...
  port: 8080
...
kind: MeshTLSAuthentication
...
  identities: [%3$s]
...
kind: AuthorizationPolicy
...
  requiredAuthenticationRefs:
"""
speech = """A Server covers port eighty eighty, and alone it refuses every caller. [[slnc 300]] The authorization policy lets in only the identities the mesh authentication lists, and only over mutual T L S."""

[[class]]
name = "Design"
what = "the plan, and a measurement scored against it"

[[class.part]]
title = "unwanted and missing pairs"
code = """
boolean open = answered.contains(pair);
if (open && !allowed.contains(pair)) {
    unwanted.add(pair);
} else if (!open && allowed.contains(pair)) {
    missing.add(pair);
"""
speech = """A pair that answers but is not in the design is unwanted. [[slnc 300]] A pair in the design that is refused is missing. [[slnc 300]] With the policy, both lists are empty."""

[[class]]
name = "Metrics"
what = "a proxy's counters, summed by the other end's identity"

[[class.part]]
title = "the identity, or no identity"
code = """
String key = "true".equals(labels.get("tls")) && labels.containsKey(idLabel)
        ? labels.get(idLabel) : NO_IDENTITY;
sums.merge(key, Long.parseLong(m.group(3)), Long::sum);
"""
speech = """Each counter line says whether the connection was T L S, and whose certificate was on the other end. [[slnc 300]] A plain connection is counted as no identity."""

[[class]]
name = "Wire"
what = "a packet capture, read the way a person on the node would"

[[class.part]]
title = "is the request there to read?"
code = """
private static final Pattern REQUEST = Pattern.compile("GET (\\\\S+) HTTP/1\\\\.1");
...
if (m.group(1).contains(text)) {
    return m.group();
"""
speech = """It looks for a plain H T T P request line that carries the account number. [[slnc 300]] Before the proxies it is there; between two proxies it never is."""

[[class]]
name = "CertInfo"
what = "who a certificate names, and for how long"

[[class.part]]
title = "the lifetime, without the skew"
code = """
static final Duration SKEW = Duration.ofSeconds(20);
...
return Duration.between(notBefore, notAfter).minus(SKEW.multipliedBy(2));
"""
speech = """Linkerd starts a certificate twenty seconds early and ends it twenty seconds late. [[slnc 300]] Taking both away gives the lifetime that was asked for: five minutes."""

[[acronym]]
short = "TLS, mTLS"
long = "Transport Layer Security; mutual TLS: both ends show a certificate"
say = "T L S is transport layer security. Mutual T L S, or m T L S, means both ends show a certificate and check the other's."

[[acronym]]
short = "HTTP, HTTPS"
long = "Hypertext Transfer Protocol (S: over TLS): 200 is OK, 403 is Forbidden"
say = "H T T P is the hypertext transfer protocol, and H T T P S is H T T P over T L S. Code two hundred means O K; four oh three means forbidden."

[[acronym]]
short = "kind"
long = "Kubernetes IN Docker: a whole cluster in one container"
say = "kind stands for Kubernetes in Docker: a real cluster whose node is one container."

[[acronym]]
short = "SQL"
long = "Structured Query Language: ' OR '1'='1 is a classic injection string"
say = "S Q L is structured query language. Quote, or, quote one equals one, is a classic injection string."

[[acronym]]
short = "CN"
long = "Common Name: the name in a certificate's subject"
say = "C N is the common name, the name in a certificate's subject."

[[acronym]]
short = "CLI"
long = "Command-Line Interface: the linkerd program"
say = "C L I is a command line interface: here, the linkerd program."

[[acronym]]
short = "RBAC"
long = "Role-Based Access Control: who may create pods"
say = "R B A C is role based access control. It decides who may create pods, and so who may take an identity."

[[acronym]]
short = "OK"
long = "the answer of a request that worked (HTTP 200)"
say = "O K is the answer of a request that worked."
