]

[threatmodel]
scope = """
Calls between a bank's pods in a Kubernetes cluster that runs Linkerd. It does not cover the application's own flaws, the cluster's control plane or the nodes' operating system.
"""
assets = [
    "The account data in the calls.",
    "The identities and the trust anchor.",
    "The policies.",
]
actors = [
    "A pod that is not in the mesh.",
    "A user who can create pods.",
    "Root on a node.",
    "A caller that is allowed but sends hostile requests.",
]
boundaries = [
    "The proxy of each pod.",
    "The ServiceAccount: who may create pods that run as it.",
]
assumptions = [
    "The control plane and its trust anchor are not compromised.",
]
out_of_scope = [
    "Compromise of the identity service.",
    "Denial of service.",
]
tests = [
    "`PoliciesTest`, `MetricsTest`, `CertInfoTest` and `DesignTest` check the manifests, the counters, the certificate reading and the scoring with no tools.",
    "`DemoRunsTest` makes the cluster and compares the whole demo with the golden output (integrationTest).",
]
next = """
The next project in the module continues with the identity of workloads.
"""

[[threat]]
id = "T1"
stride = "S"
threat = "A service is called by a workload that is not meant to"
where = "the ledger"
control = "A Server and an AuthorizationPolicy naming one identity"
residual = "A workload that holds the named identity"

[[threat]]
id = "T2"
stride = "I"
threat = "Traffic to or from a pod outside the mesh is readable"
where = "the account data"
control = "Put the pod in the mesh and require mesh identity in the policy"
residual = "Pods and ports with no Server"

[[threat]]
id = "T3"
stride = "E"
threat = "A new pod takes another workload's identity"
where = "the identities"
control = "Restrict who may create pods and ServiceAccounts"
residual = "Anyone with the right to create pods"

[[threat]]
id = "T4"
stride = "R"
threat = "A stolen certificate is used until it expires"
where = "the identities"
control = "Short certificate lifetime and automatic renewal"
residual = "No revocation before expiry"

[[threat]]
id = "T5"
stride = "I"
threat = "Root on a node reads the plaintext inside a pod"
where = "the account data"
control = "Node hardening and access control"
residual = "The mesh cannot protect it"

