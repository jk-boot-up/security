    { id = "service", label = "Service", sub = ["identity()", "manifest()"], col = 0, row = 0, colour = "accent" },
    { id = "policies", label = "Policies", sub = ["forService()"], col = 1, row = 0, colour = "amber" },
    { id = "design", label = "Design", sub = ["compare()"], col = 2, row = 0, colour = "green" },
]
edges = [
    { from = "policies", to = "service", label = "names the identity of" },
    { from = "design", to = "service", label = "scores pairs of" },
]

[[diagram]]
