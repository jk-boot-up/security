caption = "The proxies carry the call."
nodes = [
    { id = "app", label = "web", sub = "the caller", col = 0, row = 0, colour = "client" },
    { id = "p1", label = "Proxy", sub = "mutual TLS", col = 1, row = 0, colour = "amber" },
    { id = "p2", label = "Payments proxy", sub = "checks the policy", col = 2, row = 0, colour = "accent" },
    { id = "svc", label = "payments", sub = "the service", col = 3, row = 0, colour = "green" },
