[[act]]
title = "Certificate lifetime and renewal"
summary = "This run issues certificates for 5m0s (Linkerd's default is 24h0m0s). Payments' certificate spans Not After - Not Before = 340 s; minus 2 x 20 s clock skew = 300 s = 5 minutes. The trust anchor is valid for 365 days. After the renewal the proxy holds a newer certificate with the same name, the pod did not restart, and payments still calls ledger (HTTP 200)."
detail = """
The input: linkerd install --identity-issuance-lifetime=5m0s; Linkerd's own default is 24h0m0s, read from the CLI's help.
How the lifetime is read: the certificate states Not Before and Not After. Linkerd backdates the start and extends the end by 20 seconds each, so a clock a little wrong still works: 340 s - 2 x 20 s = 300 s = 5 minutes.
The trust anchor that signs the issuer is valid for 365 days.
The result after the renewal (checked every 15 s): a newer certificate (yes), the same name (yes), the pod restarted (no), payments calls ledger HTTP 200. A certificate is trusted until it expires: its lifetime is how long a stolen one is useful.
"""
figure = "lifetime_bar"
figure_title = "A workload certificate's dates, and its renewal"
figure_speech = """
Sixth demo: how long a certificate lives. [[slnc 400]] The input is one setting: this run asks for five minutes, where Linkerd's default is twenty four hours. [[slnc 700]]
The bar shows payments' certificate, from Not Before to Not After: three hundred and forty seconds. [[slnc 300]] Linkerd starts it twenty seconds early and ends it twenty seconds late, so a clock that is a little wrong still works. [[slnc 300]] Three hundred and forty, minus two times twenty, is three hundred seconds: five minutes. [[slnc 700]]
At the bottom, the result once the time ran out. [[slnc 300]] The proxy holds a newer certificate, with the same name. [[slnc 300]] The pod did not restart, and payments still reaches the ledger. [[slnc 300]] There is no revocation here: a stolen certificate works until it expires, so the lifetime is the window an attacker gets.
"""
speech = """
The setting: Linkerd's default lifetime, and five minutes in this run. [[slnc 400]] How the lifetime is read: Not After minus Not Before, three hundred and forty seconds, minus twenty seconds of clock skew twice: three hundred seconds, five minutes. [[slnc 300]] The trust anchor is valid for three hundred and sixty five days. [[slnc 400]] After the renewal: a newer certificate, the same name, no restart, and the call still answers.
"""
rows = { lifetime = "active ok" }
console = [
    ["THE SETTING (linkerd install):", "code"],
    ["  Linkerd's default lifetime   24h0m0s", "muted"],
    ["  this run                     5m0s", "muted"],
    ["HOW THE LIFETIME IS READ (payments' certificate):", "code"],
    ["  Not After - Not Before       340 s", "muted"],
    ["  minus the clock skew, twice  340 - 2 x 20 = 300 s = 5 minutes", "ok"],
