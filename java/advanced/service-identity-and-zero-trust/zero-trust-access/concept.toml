[[act]]
title = "Who is calling: the token, checked by hand"
summary = "Alice's token is header.claims.signature with alg RS256, audience ledger-api, roles [teller], compliant true and a lifetime of 300 seconds. Checked by hand, s^e mod n is 256 bytes: 00 01, 202 bytes of FF, 00, a 19-byte label and a 32-byte hash equal to the SHA-256 of header.claims, and the JDK agrees. Bob's token with the roles edited keeps the padding but not the hash; a token signed with another key has no padding at all. At the proxy 7 of 7 bad tokens get 401, and the same 10 identity-less requests now get 0 successes, through the proxy or straight to the ledger."
detail = """
The input: alice's token from Keycloak, three base64url parts. The header says RS256 and names a key in the JWKS; the claims say issuer .../realms/bank, audience ledger-api, user alice, roles [teller], compliant true, and exp - iat = 300 seconds.
How the signature is checked: the key is RSA 2048 bits with e = 65537. The signature s is 256 bytes; m = s^e mod n is 256 bytes and must be 00 01, 202 bytes of FF, 00, the 19-byte label that says a SHA-256 hash follows, then 32 bytes equal to the SHA-256 of header.claims. They are, and the JDK's SHA256withRSA agrees. Then issuer, audience and expiry are checked.
Two forgeries: bob's token with the roles edited to admin keeps bob's real signature, so the padding is right but the hash is not; mallory's token signed with her own key gives m that is noise, with no padding.
The result at the proxy: no token, an expired token, a token for reports-api, the edited roles, a changed signature character, mallory's own key and the algorithm none all get 401. The same ten requests with no identity get 0 of 10 through the proxy, and 0 of 10 straight to the ledger, which wants the proxy's mark.
"""
figure = "signature_by_hand"
figure_title = "RS256, worked out for one token"
figure_speech = """
Second demo: who is calling. [[slnc 400]] At the top, the input: alice's token, and the bank's public key, from Keycloak's key set. [[slnc 300]] The key is R S A, two thousand and forty eight bits. [[slnc 700]]
The check undoes the signature: m equals s to the power e, modulo n. [[slnc 300]] The result is a block of two hundred and fifty six bytes, and it must have a fixed shape. [[slnc 300]] First zero zero zero one, then two hundred and two bytes of F F, then zero zero. [[slnc 300]] Then a label of nineteen bytes, that says a S H A two fifty six hash follows. [[slnc 300]] And the last thirty two bytes must equal the S H A two fifty six of the header and the claims. [[slnc 300]] For alice's token, they do. [[slnc 700]]
At the bottom, two forgeries. [[slnc 300]] Bob edited his roles to admin and kept his signature. [[slnc 300]] The padding is still right, but the hash no longer fits the new claims. [[slnc 300]] Mallory signed with her own key. [[slnc 300]] With the bank's key, her block is noise: not even the padding is there.
"""
speech = """
Here is the real output. [[slnc 400]] The token has three parts. [[slnc 300]] Its header names the algorithm, R S 256, and a key in the key set. [[slnc 300]] Its claims name the issuer, the audience ledger A P I, alice, her role teller, a compliant device, and a lifetime of three hundred seconds.
[[page]]
The signature, by hand. [[slnc 300]] A two thousand and forty eight bit key. [[slnc 300]] A two hundred and fifty six byte signature, and a two hundred and fifty six byte block. [[slnc 300]] The padding, the label, and the hash all check out, and the J D K agrees. [[slnc 300]] Then the issuer, the audience, and the expiry are good: the token is valid.
[[page]]
The same steps on two forgeries. [[slnc 300]] Bob's edited token keeps the padding, but fails the hash. [[slnc 300]] Mallory's own key fails even the padding. [[slnc 300]] The J D K refuses both. [[slnc 400]] At the proxy, seven bad tokens, seven times four oh one, each with its reason.
[[page]]
And the same ten requests with no identity: none gets through the proxy, and none gets through straight to the ledger, because it answers only the proxy.
"""
rows = { authn = "active ok" }
