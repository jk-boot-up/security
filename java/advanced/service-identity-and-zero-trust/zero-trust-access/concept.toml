Here is the real output. [[slnc 400]] Alice's token works before the logout. [[slnc 300]] After it, the same token still gets two hundred. [[slnc 300]] With a session check it gets four oh one, while a new login and bob still get in, for three calls to Keycloak. [[slnc 400]] The four second token works at once after the logout, and is refused once it expires: four seconds at most, not three hundred.
