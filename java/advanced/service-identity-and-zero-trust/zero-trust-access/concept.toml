[[scene]]
key = "01-poster"
kind = "poster"
title = "Zero Trust Access"
narration = "Hello, and welcome. [[slnc 400]] This video explains zero trust access, with Keycloak and O P A, the open policy agent. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] Zero trust says that being inside the network proves nothing. [[slnc 300]] Every request is authenticated, authorized, and logged, close to the resource it wants. [[slnc 600]] Think of a building where the lobby guard used to wave everyone through. [[slnc 300]] Now every office door checks a badge, looks up what that badge may open, and writes down each attempt. [[slnc 600]] Our example is a bank."

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["A bank's internal ledger API: balances,", "transfers, audit exports and account freezes.", "", "Before: anything inside the network may call it.", "After: an identity-aware proxy checks a Keycloak", "token, asks OPA for a decision, and writes", "an audit record for every request."]
narration = "Here is the scenario. [[slnc 400]] A bank has an internal ledger A P I, for balances, transfers, audit exports, and account freezes. [[slnc 500]] Before: anything that can reach it on the network may call it, with no identity at all. [[slnc 500]] After: an identity aware proxy, written in Java, sits in front of it. [[slnc 300]] It checks a token from Keycloak, asks O P A for a decision, and writes one audit record for every request."

[[scene]]
key = "02-words"
kind = "bullets"
title = "The Words"
body = ["Token: a signed note from Keycloak: who, and roles", "Claims: the fields inside, like iss, aud and exp", "Authenticate: check who is calling (401 if not)", "Authorize: check what they may do (403 if not)", "Policy: the rules, here in Rego, run by OPA", "Session: a login at Keycloak, ended by a logout"]
narration = """Before the demos, the words. [[slnc 500]] A token is a signed note from Keycloak that says who the caller is, and which roles they have. [[slnc 500]] Its claims are the fields inside: the issuer, the audience it was made for, and when it expires. [[slnc 500]] To authenticate is to check who is calling. [[slnc 300]] If that fails, the answer is four oh one. [[slnc 500]] To authorize is to check what they may do. [[slnc 300]] If that fails, the answer is four oh three. [[slnc 500]] A policy is the set of rules, written here in a language called Rego, and run by O P A. [[slnc 500]] And a session is a login at Keycloak, which a logout ends."""

[[scene]]
key = "02-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "02-core"
kind = "figure"
title = "One request, three checks"
body = "one_request"
narration = """Let's see the core idea on one example: alice, a teller, sends a transfer with her token. [[slnc 400]] At the top, the three checks the proxy makes, in front of the ledger. [[slnc 300]] First, authenticate: who is calling? [[slnc 300]] The token's signature, issuer, audience, and expiry. [[slnc 300]] Second, authorize: may they do this? [[slnc 300]] O P A looks at the role, the device, and the hour. [[slnc 300]] Third, record it, one line per request. [[slnc 700]]
At the bottom, three requests. [[slnc 300]] At ten in the morning, all three checks say yes, and the ledger runs: two hundred. [[slnc 500]] At eleven at night, the same token passes the first check, but O P A says no: four oh three, outside business hours. [[slnc 500]] With no token at all, the first check fails: four oh one. [[slnc 600]]
Every one of the three answers is written down, and the ledger only runs for the first."""

[[scene]]
key = "03-acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "04-costs"
kind = "bullets"
title = "What It Costs"
body = ["Every request pays for a check and a decision", "A token outlives its session until it expires", "Checking the session costs one call per request", "If OPA is down, nothing gets in", "The proxy must be the only door to the ledger", "The policy and the audit log need upkeep"]
narration = "Nothing is free. [[slnc 400]] Here is what it costs. [[slnc 500]] Every request pays for a signature check and a policy decision. [[slnc 500]] A token stays valid after its session ends, until it expires. [[slnc 300]] Checking the session closes that gap, for one more call per request. [[slnc 500]] If the policy engine is down, nothing gets in. [[slnc 500]] The proxy must be the only door: here the ledger wants the proxy's mark, and a real one would use mutual T L S. [[slnc 500]] And the policy, and the audit log, need people to keep them right."

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["Ledger: the bank's internal ledger API", "Proxy: authenticate, authorize, record", "Jwt, Jwks: check the token with the issuer's keys", "Rs256Steps: the signature check, by hand", "Opa: asks the policy engine for a decision", "AuditLog: one line per decision, never a token", "Keycloak: issues the tokens, ends sessions"]
narration = "Here is who does what in the code. [[slnc 400]] Ledger is the bank's internal ledger A P I. [[slnc 500]] Proxy runs the same three steps on every request: authenticate, authorize, and record. [[slnc 500]] Jwt and Jwks check the token's signature against the issuer's published keys, and its issuer, audience, and expiry. [[slnc 300]] Rs256Steps redoes the signature check by hand, for teaching. [[slnc 500]] Opa asks the policy engine for a decision. [[slnc 300]] AuditLog writes one line per decision, and is never given a token. [[slnc 300]] And Keycloak issues the tokens, and ends sessions."

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["A VPN that opens every internal system", "An internal service with no login at all", "A JWT in an Authorization: Bearer header", "A 401 for no token, a 403 for no permission"]
narration = "You have probably met this already. [[slnc 400]] The V P N that opens every internal system is the perimeter. [[slnc 500]] An internal service with no login at all trusts the network. [[slnc 500]] The J W T in an authorization bearer header is an identity on each request. [[slnc 500]] And a four oh one for no token, against a four oh three for no permission, are the two questions: who are you, and may you."

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Authenticate every request, near the resource", "Check signature, issuer, audience and expiry;", "  choose the algorithm yourself", "Decide with role, device and time; deny by default", "Log every decision, never the token", "Short token lifetimes; check the session"]
narration = "So, how do you use it? [[slnc 400]] Authenticate every request, close to the resource. [[slnc 500]] Check the token's signature, issuer, audience, and expiry, and choose the algorithm yourself, never from the token. [[slnc 500]] Decide with more than a role: the device and the time too, and deny by default. [[slnc 500]] Log every decision, and never the token. [[slnc 300]] And keep token lifetimes short, or check the session."

[[scene]]
key = "12-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Let an auditor read balances", "only from a compliant device, 08:00 to 20:00."]
narration = "That's zero trust access. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Being inside the network proves nothing: check who is calling, decide if they may, and record it, on every request. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a rule that lets an auditor read balances only from a compliant device, between eight in the morning and eight in the evening. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] Keycloak and O P A do the identity and the decisions; the proxy ties them together. [[slnc 300]] Here are the classes that matter."""

[[class]]
name = "Proxy"
what = "the one door: authenticate, authorize, record"
[[class.part]]
title = "401, then 403, then forward"
code = """
Jwt.Result jwt = Jwt.verify(token, keys, issuer, audience, clock.instant());
if (!jwt.valid()) {
    return new Outcome(401, jwt.reason(), jwt.user(), "authentication failed", false);
...
Decider.Decision d = decider.decide(input);
if (!d.allow()) {
    return new Outcome(403, String.join(" + ", d.reasons()), jwt.user(), "forbidden", false);
"""
speech = """First the token: if it is not valid, the answer is four oh one, with the reason. [[slnc 300]] Then the policy engine: if it says no, the answer is four oh three, with its reasons. [[slnc 300]] Only then is the request forwarded to the ledger."""
[[class.part]]
title = "fail closed, and always one record"
code = """
// when the decision cannot be made the answer is no
o = new Outcome(503, "decision unavailable", "-", "no decision", false);
}
audit.record(o.allowed() ? "allow" : "deny", o.status(), o.reason(), o.user(), method, path);
"""
speech = """If anything goes wrong, such as O P A being down, the answer is five oh three, a no. [[slnc 300]] And whatever happened, the last line writes exactly one record."""

[[class]]
name = "Jwt"
what = "the token rules, in the right order"
[[class.part]]
title = "the verifier picks the algorithm"
code = """
if (!"RS256".equals(header.get("alg"))) {
    return Result.invalid("unsupported algorithm", "-", Map.of());
...
if (!s.verify(signature)) {
    return Result.invalid("bad signature", "-", Map.of());
...
if (!audiences(claims.get("aud")).contains(audience)) {
"""
speech = """Only R S 256 is accepted, so a token that says the algorithm none is refused. [[slnc 300]] The signature is checked before any claim is trusted. [[slnc 300]] Then the issuer, the audience, and the expiry."""

[[class]]
name = "Rs256Steps"
what = "a teaching class: the signature check by hand"
[[class.part]]
title = "s^e mod n, then padding and hash"
code = """
byte[] m = fixed(new BigInteger(1, s).modPow(key.getPublicExponent(), key.getModulus()), k);
...
boolean padding = m[0] == 0 && m[1] == 1 && i - 2 >= 8 && i < k && m[i] == 0;
...
boolean hash = label && MessageDigest.isEqual(Arrays.copyOfRange(m, k - 32, k), digest);
"""
speech = """The public key undoes the signature: s to the power e, modulo n. [[slnc 300]] The block must start with the padding, and end with the S H A two fifty six of the header and the claims. [[slnc 300]] A test proves these steps give the J D K's answer."""

[[class]]
name = "Opa"
what = "asks the policy engine, over HTTP"
[[class.part]]
title = "no answer is not a yes"
code = """
HttpRequest req = HttpRequest.newBuilder(base.resolve("/v1/data/bank/zerotrust/decision"))
...
if (res.statusCode() != 200 || !result.has("allow")) {
    throw new IOException("opa gave no decision");
"""
speech = """The proxy posts the input to O P A and reads the decision. [[slnc 300]] A missing answer throws, and the proxy turns that into a no."""

[[class]]
name = "Ledger"
what = "the resource: it answers only the proxy"
[[class.part]]
title = "the proxy's mark"
code = """
if (mark != null && !mark.equals(x.getRequestHeaders().getFirst("X-Proxy-Mark"))) {
    reply(x, 403, "only the proxy may call the ledger");
"""
speech = """Behind the proxy, the ledger refuses any request without the proxy's mark, so skipping the proxy gets nothing. [[slnc 300]] In production this link would be mutual T L S."""

[[class]]
name = "AuditLog"
what = "one line per decision, made of fields only"
[[class.part]]
title = "never given a token"
code = """
Entry e = new Entry(entries.size() + 1L, decision, status, reason, user, method, path);
...
line.put("reason", e.reason());
line.put("user", e.user());
"""
speech = """A record is built from fields: the decision, the status, the reason, the user, the method, and the path. [[slnc 300]] It is never handed a header or a token, so none can leak into the log."""

[[acronym]]
short = "OPA"
long = "Open Policy Agent: the engine that runs the Rego policy"
say = "O P A is the open policy agent, the engine that runs the policy."
[[acronym]]
short = "JWT"
long = "JSON Web Token: header.claims.signature"
say = "J W T is a jay son web token: a header, the claims, and a signature."
[[acronym]]
short = "JWKS"
long = "JSON Web Key Set: the issuer's published public keys"
say = "J W K S is the jay son web key set, the public keys the issuer publishes."
[[acronym]]
short = "JSON"
long = "JavaScript Object Notation: the format of tokens and records"
say = "jay son is JavaScript object notation."
[[acronym]]
short = "RS256, RSA"
long = "an RSA signature over a SHA-256 hash; RSA: Rivest, Shamir, Adleman"
say = "R S 256 is an R S A signature over a S H A two fifty six hash. R S A is named after Rivest, Shamir and Adleman."
[[acronym]]
short = "SHA-256"
long = "Secure Hash Algorithm, 256 bits: 32 bytes"
say = "S H A two fifty six is the secure hash algorithm with two hundred and fifty six bits, thirty two bytes."
[[acronym]]
short = "JDK"
long = "Java Development Kit: its Signature class does RS256"
say = "J D K is the Java development kit."
[[acronym]]
short = "API"
long = "Application Programming Interface: the ledger's requests"
say = "A P I is application programming interface."
[[acronym]]
short = "HTTP, GET/POST"
long = "Hypertext Transfer Protocol; GET reads, POST changes"
say = "H T T P is the hypertext transfer protocol. GET reads, and POST changes something."
[[acronym]]
short = "401, 403, 503"
long = "HTTP status: not authenticated, forbidden, unavailable"
say = "Four oh one means not authenticated, four oh three means forbidden, and five oh three means unavailable."
[[acronym]]
short = "iss, aud, exp, iat"
long = "claims: issuer, audience, expires at, issued at"
say = "iss, aud, exp and iat are the claims issuer, audience, expires at, and issued at."
[[acronym]]
short = "kid, alg"
long = "header fields: the key id, and the algorithm"
say = "kid is the key id, and alg is the algorithm."
[[acronym]]
short = "FF, hex"
long = "hexadecimal: FF is the byte 255"
say = "Hex is hexadecimal. F F is the byte two hundred and fifty five."
[[acronym]]
short = "VPN"
long = "Virtual Private Network: puts a laptop on the inside"
say = "V P N is a virtual private network."
[[acronym]]
short = "TLS"
long = "Transport Layer Security: mutual TLS would link proxy and ledger"
say = "T L S is transport layer security."
