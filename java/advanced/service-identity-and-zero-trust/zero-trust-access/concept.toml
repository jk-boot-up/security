[project]
slug = "zero-trust-access"
level = "advanced"
module = "service-identity-and-zero-trust"
title = "Zero Trust Access"
short_title = "Zero Trust Access"
package = "zerotrust"
main_class = "ZeroTrustAccessDemo"
tagline = "Put an identity-aware proxy in front of a bank's ledger API: every request is authenticated with a Keycloak token, authorized by OPA and written to an audit log, close to the resource"
bold = "A bank's ledger API behind the network perimeter answers 10 of 10 requests that carry no identity, 3 of them transfers; behind an identity-aware proxy the same 10 requests get 0 successes, and a request that skips the proxy and goes straight to the ledger gets 0 too; the proxy checks a Keycloak JWT (signature from the JWKS, issuer, audience, expiry) and refuses 7 of 7 bad tokens with 401 (none, expired, wrong audience, edited roles, flipped signature, forged with the attacker's own key, algorithm none), then asks OPA, which answers 403 for the wrong role, a device that is not compliant, and a transfer at 23:00; of 39 requests every one has exactly one audit record (39 of 39) and 0 of 22 tokens appear in the log; a token outlives its ended session and is still accepted (200) until it expires, a session check at Keycloak refuses it (401) for 1 extra call per request, a 4 second lifetime bounds the exposure, and with OPA down the proxy answers 503."
domain = "a bank"
domain_note = ""
youtube_description = "Zero trust access in Java with Keycloak and OPA: an identity-aware proxy that checks a JWT, asks a policy engine for a decision and writes an audit record for every request, compared with the network perimeter, plus token lifetime, revocation and what happens when a part is down."
thumb_lines = ["ZERO TRUST", "ACCESS"]
thumb_code = "token -> policy -> 200 or 403"
youtube_title = "Zero Trust Access: Identity-Aware Proxy with Keycloak and OPA, Audit and Revocation"
youtube_tags = ["zero trust", "identity-aware proxy", "keycloak", "opa", "rego", "jwt", "audit log", "token revocation", "policy as code", "java"]

[readme]
intro = """
Zero trust says that being inside the network proves nothing: **every request is authenticated, authorized and logged, close to the resource**. This project puts that into one small system for a bank's internal **ledger API**. A real **Keycloak** (in Docker) issues the tokens, a real **OPA** server decides, and an **identity-aware proxy** written in Java (the JDK's HttpServer) sits in front of the ledger: it validates the JWT, asks OPA, enforces the answer, and writes one audit record. Everything is measured with real HTTP requests; the demo is tagged `integration`: `./gradlew integrationTest` (needs Docker and the opa binary).

What it shows:
- **The perimeter.** The ledger inside the network answers **10 of 10** requests with no identity. Behind the proxy the same 10 get **0**, and 0 more when they go straight to the ledger.
- **Authentication.** **7 of 7** bad tokens get 401: none, expired, wrong audience, roles edited, signature flipped, signed with the attacker's own key, algorithm none.
- **Authorization.** OPA answers 403 for the wrong role, a device that is not compliant and a transfer outside business hours; its Rego has **15 of 15** tests.
- **Audit.** **39** requests, **39** records, **0 of 22** tokens in the log.
- **Lifetime.** A token stays valid after its session ends (**200**) until it expires; a session check refuses it (**401**) for one more call per request; a **4 second** lifetime bounds the window.

**Maps to:** NIST SP 800-207 (zero trust architecture) · OWASP ASVS V3 and V4 · RFC 7519 (JWT) and RFC 8725 (JWT best practices) · CIS Controls 6 and 8 · ISO/IEC 27001:2022 A.8.2 and A.8.15.
"""
analogy = """
A building where the lobby guard used to wave everyone through because they were already inside. Now every office door checks a badge, looks up what that badge may open, and writes down each attempt, so being in the lobby opens nothing.
"""
scenario = """
A bank's ledger API serves balances, transfers, audit exports and account freezes. Today anything that can reach it can call it. The demo puts a proxy in front that knows who is calling, asks a policy whether they may, and records every answer.
"""
costs = [
    "**Every request pays for a signature check and a policy decision,** and the proxy and policy engine become part of availability.",
    "**A token is valid until it expires,** so revoking a session needs a short lifetime or a check on every request.",
    "**A device posture claim is only as good as its source;** here it is set by the demo.",
    "**Policies are code** that needs its own tests and review.",
    "**The last hop matters:** a ledger that any process can reach directly undoes the proxy.",
]
too_much = """
A single-tenant tool that only one trusted process calls does not need a proxy and a policy engine. Use this where many people and services reach sensitive operations and someone must later say who did what.
"""
met_before = [
    "A VPN that puts a laptop on the same flat network as the databases.",
    "An internal admin page with no login because it is internal.",
    "A role check copied into five services, each slightly different.",
    "An access log with IP addresses and no names.",
]
where = """
This is a project of the [service-identity-and-zero-trust](..) module. mutual-tls-between-services and workload-identity prove which service is calling; this one adds which person, on which device, may do what, and the record of it.
"""
twin = """
Keycloak and the opa binary are real. The proxy and the ledger are the project's own small Java programs. Envoy and oauth2-proxy were not run: they would do the proxy's job, and writing it in Java shows every step. The device posture is a claim set per Keycloak client, standing in for a device management system.
"""
test_note = "The JWT validation, the proxy, the audit log and the ledger are tested with the JDK only, with a stand-in for OPA. The demo runs Keycloak in Docker and the opa binary (./gradlew integrationTest)."

[[act]]
title = "The perimeter"
summary = "The ledger inside the network answers all 10 requests that carry no identity."
detail = """
The ledger API trusts the network. Ten requests with no identity (3 balances, 3 transfers, 2 audit exports, 2 freezes) all succeed, its code runs 10 times and 3 transfers are executed for callers nobody can name. The ledger can log an address, not a person.
"""
speech = """
First demo: the perimeter. [[slnc 400]] Ten requests, no identity. [[slnc 600]] Ten answers, three of them transfers.
"""
rows = { perimeter = "active wrong" }
console = [
    ["requests with no identity: 10", "bad"],
    ["succeed: 10", "bad"],
    ["transfers executed: 3", "bad"],
]

[[act]]
title = "Who is calling"
summary = "The proxy refuses 7 of 7 bad tokens with 401, and the same 10 identity-less requests now get 0 successes."
detail = """
The proxy checks the signature against the keys Keycloak publishes, the issuer, the audience and the expiry, and accepts only RS256. No token, an expired token, a token for another audience, a token with its roles edited to admin, a flipped signature character, a token signed with the attacker's own key and a token with the algorithm none all get 401. The ten identity-less requests get 0 successes, and 0 when sent straight to the ledger.
"""
speech = """
Second demo: who is calling. [[slnc 400]] Seven bad tokens, seven refusals. [[slnc 600]] The same ten requests now get nothing.
"""
rows = { authn = "active ok" }
console = [
    ["bad tokens refused: 7 of 7", "ok"],
    ["no identity, through the proxy: 0 of 10", "ok"],
    ["no identity, straight to the ledger: 0 of 10", "ok"],
]

[[act]]
title = "May they"
summary = "OPA answers 403 for the wrong role, a device that is not compliant, and a transfer at 23:00."
detail = """
With a good token, the proxy asks OPA with the user, roles, device posture claim, method, path and hour. Bob the auditor cannot transfer, Alice the teller cannot read the audit, Carol the admin is not a teller, a device that is not compliant is refused, and a teller's transfer at 23:00 is refused while the same transfer at 10:00 gets 200. The Rego file has 15 of 15 tests passing.
"""
speech = """
Third demo: may they. [[slnc 400]] A good token is not enough. [[slnc 600]] The role, the device and the hour all have to say yes.
"""
rows = { authz = "active ok" }
console = [
    ["wrong role: 403", "ok"],
    ["device not compliant: 403", "ok"],
    ["transfer at 23:00: 403", "ok"],
]

[[act]]
title = "Logged"
summary = "39 requests, 39 audit records, and 0 of 22 tokens in the log."
detail = """
Each request ends in one place that writes one record: allow or deny, the status, the reason, the user, the method and the path. Of 39 requests sent, 39 records match in order with the status the caller saw: 12 allow and 27 deny, each with a reason. None of the 22 tokens used appears in the log.
"""
speech = """
Fourth demo: logged. [[slnc 400]] Thirty-nine requests, thirty-nine records. [[slnc 600]] And not one token in the log.
"""
rows = { audit = "active ok" }
console = [
    ["requests: 39, records: 39", "ok"],
    ["allow 12, deny 27", "ok"],
    ["tokens in the log: 0 of 22", "ok"],
]

[[act]]
title = "A token outlives its session"
summary = "After logout the token is still accepted until it expires; a session check or a 4 second lifetime closes the window."
detail = """
Alice's session is ended at Keycloak, and her token, good for 300 seconds, still gets 200: the proxy checks signature and expiry. With a session check at Keycloak on every request the same token gets 401, at a cost of one call per request (3 for 3). A token with a 4 second lifetime is accepted at once after its session ends and refused after 4 seconds. With Keycloak stopped, old tokens still work without the check and are refused with it; with OPA stopped the answer is 503.
"""
speech = """
Fifth demo: a token outlives its session. [[slnc 400]] Logout does not reach a token that checks only its signature. [[slnc 600]] A short life or a session check closes the window.
"""
rows = { expiry = "active wrong" }
console = [
    ["after logout, no check: 200", "bad"],
    ["after logout, session check: 401", "ok"],
    ["OPA down: 503", "ok"],
]

