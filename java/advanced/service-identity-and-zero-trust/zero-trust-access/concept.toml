[[act]]
title = "A token outlives its session"
summary = "Alice's token, good for 300 seconds, gets 200 before her logout and still 200 after it, because the proxy checks only signature and expiry. With a session check at Keycloak on every request it gets 401 (session ended), a new login and bob still get 200, for 3 calls to Keycloak. A 4 second token still works at once after the logout and gets 401 once it expires: the window is 4 seconds at most, not 300. With Keycloak stopped, a valid token still gets 200 without the check and 401 with it; with OPA stopped the answer is 503."
detail = """
The input: alice's token with a lifetime of 300 seconds; it gets 200 before her logout.
The result after the logout at Keycloak: the same token still gets 200, because its signature and expiry are still good. With a session check at Keycloak on every request it gets 401, session ended, while a new login and bob's token get 200; the check cost 3 calls to Keycloak for 3 requests.
A short lifetime instead: a 4 second token gets 200 before the logout and at once after it, and 401, expired, once its 4 seconds are over. The window after a logout is 4 seconds at most, not 300.
When a part is down: with Keycloak stopped a valid token still gets 200, because the keys are cached; with the session check on it gets 401, because the session cannot be confirmed. With OPA stopped the proxy answers 503, decision unavailable: no decision is a no.
"""
figure = "token_window"
figure_title = "How long a token works after a logout"
figure_speech = """
Fourth demo: a token outlives its session. [[slnc 400]] At the top, the input: alice logs out at Keycloak. [[slnc 300]] Does the token she already holds still work? [[slnc 700]]
The amber line is the logout. [[slnc 300]] In the first row, a proxy that checks only the signature and the expiry. [[slnc 300]] The token keeps working until its three hundred seconds are over: the rose bar. [[slnc 500]] In the second row, the proxy asks Keycloak, on every request, whether the session is still alive. [[slnc 300]] The token is refused at once, for one extra call per request. [[slnc 500]] In the third row, a token that lives only four seconds. [[slnc 300]] It still works right after the logout, but only for four seconds at most. [[slnc 700]]
At the bottom, when a part is down. [[slnc 300]] With Keycloak stopped, old tokens still work, because the keys are cached. [[slnc 300]] With O P A stopped, the proxy answers five oh three: no decision is a no.
"""
