[threatmodel]
scope = """
Access to a bank's ledger API through an identity-aware proxy with Keycloak and OPA, on one machine. It does not cover the security of Keycloak itself, the user's device, or the network between the proxy and the ledger.
"""
assets = [
    "Balances and transfers.",
    "The audit log.",
    "The signing keys of the identity provider.",
]
actors = [
    "An attacker inside the network.",
    "A teller, an auditor and an admin.",
    "A user whose session was ended.",
]
boundaries = [
    "The proxy: a request outside it is untrusted.",
    "The ledger: it trusts only the proxy.",
]
assumptions = [
    "Keycloak's keys are published over a channel the proxy trusts.",
    "The proxy and the ledger share a mark made at run time (mutual TLS in production).",
]
out_of_scope = [
    "Browser sessions and single sign-on.",
    "Real device posture signals.",
]
tests = [
    "`JwtTest` checks the token rules with a key made in the test.",
    "`ProxyTest` checks the status codes, the one record per request, the session check and the failure to decide, with no Docker.",
    "`DemoRunsTest` runs Keycloak and OPA and compares the whole demo with the golden output (integrationTest).",
]
next = """
This is the last project of the service-identity-and-zero-trust module.
"""

[[threat]]
id = "T1"
stride = "S"
threat = "A forged or edited token"
where = "the proxy"
control = "RS256 only, signature from the JWKS, then issuer, audience and expiry"
residual = "A stolen valid token works until it expires"

[[threat]]
id = "T2"
stride = "E"
threat = "A valid user does what their role or device does not allow"
where = "OPA"
control = "Default-deny Rego with roles, device posture and hour, tested"
residual = "The posture claim is only as good as its source"

[[threat]]
id = "T3"
stride = "R"
threat = "An action with no record of who did it"
where = "the audit log"
control = "One record per request, with user and reason, no token"
residual = "The log must be protected and shipped elsewhere"

[[threat]]
id = "T4"
stride = "T"
threat = "A caller inside the network skips the proxy"
where = "the ledger"
control = "The ledger answers only a request that carries the proxy's mark"
residual = "A mark on a flat network is weak: use mutual TLS"

[[threat]]
id = "T5"
stride = "E"
threat = "A token used after its session ended"
where = "the proxy"
control = "Short lifetime and a session check at the issuer"
residual = "The check costs a call per request and needs Keycloak up"

