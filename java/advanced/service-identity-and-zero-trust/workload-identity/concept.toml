[docs.session]
objectives = [
    "explain why a shared secret makes a leak worth every service",
    "tell a SPIFFE ID, a registration entry and an SVID apart",
    "check a peer's SPIFFE ID against a trust bundle in Java",
    "explain what a stolen SVID is worth and why a short lifetime is the revocation",
]
walkthrough = """
Run the demo and compare the leaked shared secret with the stolen SVID: what can each do, and for how long? Then change the entry's selector and see who gets the identity.
"""
exercises = [
    "Add a fraud-engine entry that may only GET /statements and call the ledger as it.",
    "Change the SVID lifetime to 60 seconds and count the rotations in 50 seconds.",
    "Add a second selector (the path of the program) to the payments entry and see what stops matching.",
    "Make the ledger refuse an SVID with less than 5 seconds left.",
]

[docs.explained]
sentence = """
Give each workload a name it cannot choose and a certificate that expires in seconds, so a leak is worth a few seconds of one service.
"""
verdict = """
Register each workload with a selector the platform decides, let the SPIRE agent renew its SVID, verify the peer's SPIFFE ID on both sides, authorize by that ID, and keep the lifetime shorter than you can detect a theft.
"""
recognise = [
    "An API key in an environment variable.",
    "A shared service account.",
    "A header such as X-Service that names the caller.",
    "A client certificate that lasts a year.",
]

