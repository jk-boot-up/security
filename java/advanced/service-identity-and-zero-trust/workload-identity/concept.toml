[poster]
headline = [["WORKLOAD", "text"], ["IDENTITY", "accent"]]
taglines = [["Short-lived SPIFFE identities instead of a shared secret", "gold"]]
before = { code = "X-Api-Key: <one key, 3 holders>", note = "A leak is every service", tag = "BEFORE" }
after = { code = "spiffe://bank.example/payments", note = "20 seconds, by registration", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "Workload Identity"
narration = "Hello, and welcome. [[slnc 400]] This video explains workload identity, with SPIFFE and SPIRE. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A shared secret says only that someone who holds this key is calling, never which service. [[slnc 300]] Workload identity gives each service its own name, a SPIFFE I D, proven by a short lived certificate that the platform hands out and renews. [[slnc 300]] The service never stores a secret. [[slnc 600]] Think of one master key shared by every branch, against a daily badge printed for each person at the door. [[slnc 600]] Our example is a bank."

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["A bank's ledger is called by payments", "and reporting.", "", "Before: one static secret copied into 3 services.", "After: a real SPIRE server and agent give each", "a SPIFFE ID and a certificate that lives 20 seconds."]
narration = "Here is the scenario. [[slnc 400]] A bank's ledger service is called by payments, and by reporting. [[slnc 500]] Before: one static secret is copied into three services, and the ledger takes the caller's word for who it is. [[slnc 500]] After: a real SPIRE server and agent give each workload a SPIFFE I D, and an X 5 0 9 certificate, called an S V I D, that lives twenty seconds."

[[scene]]
key = "02-words"
kind = "bullets"
title = "The Words"
body = ["Workload: a running service, such as payments", "SPIFFE ID: a workload's name, spiffe://bank.example/...", "SVID: a short-lived certificate that carries that name", "SPIRE server: keeps the entries, signs the SVIDs", "SPIRE agent: checks who a process is, hands it its SVID", "Registration entry: a selector and the ID it gets"]
narration = """Before the demos, the words. [[slnc 500]] A workload is a running service, such as payments. [[slnc 500]] A SPIFFE I D is a workload's name, written like spiffe colon slash slash bank dot example slash payments. [[slnc 500]] An S V I D is a short lived certificate that carries that name. [[slnc 500]] The SPIRE server keeps the registration entries and signs the S V I Ds. [[slnc 500]] The SPIRE agent runs beside the workloads: it checks who a process really is, and hands it its S V I D. [[slnc 500]] And a registration entry pairs a selector, here the operating system user, with the I D that goes with it."""

[[scene]]
key = "02-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "02-who"
kind = "figure"
title = "Who decides a workload's name"
body = "who_decides"
narration = """Let's see the core idea on one example. [[slnc 400]] On the left, the input: the reporting process, user two thousand and three, which claims to be payments. [[slnc 300]] It asks the SPIRE agent for its identity, through a local socket. [[slnc 600]]
In the middle, how the agent decides. [[slnc 300]] It does not read the claim. [[slnc 300]] It asks the operating system which user owns the process on the other end of the socket: two thousand and three. [[slnc 300]] Then it finds the registration entry with that selector. [[slnc 600]]
On the right, the result: spiffe colon slash slash bank dot example slash reporting, in a certificate that lives twenty seconds. [[slnc 300]] The claim changed nothing. [[slnc 300]] The platform decides who a workload is, not the workload."""

[[scene]]
key = "03-acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "04-costs"
kind = "bullets"
title = "What It Costs"
body = ["A SPIRE server and an agent on every node", "Registration entries must be kept right", "A stolen SVID works until it expires", "The SPIRE server is now a target", "Services need a Workload API client"]
narration = "Nothing is free. [[slnc 400]] Here is what it costs. [[slnc 500]] You run a SPIRE server, and an agent on every node. [[slnc 500]] Registration entries must be kept right, because they decide who gets which name. [[slnc 500]] A stolen S V I D still works until it expires. [[slnc 500]] The SPIRE server is now a target worth protecting. [[slnc 300]] And services need a workload A P I client, and a T L S setup that picks up new certificates without a restart."

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["LegacyLedger: the before, one shared secret", "Lab: a real SPIRE server and agent", "Workload: gets its identity from the agent", "Policy: which SPIFFE ID may call which route", "SpiffeIds, Rotations: an ID taken apart, rotations", "WorkloadIdentityDemo: runs the demos"]
narration = "Here is who does what in the code. [[slnc 400]] LegacyLedger is the before: one shared secret, and the caller's own word. [[slnc 500]] Lab runs a real SPIRE server and agent in a Linux container. [[slnc 500]] Workload is the Java program each service runs. [[slnc 300]] It never says who it is: its identity is whatever the agent hands it. [[slnc 500]] Policy says which SPIFFE I D may call which route. [[slnc 300]] SpiffeIds takes an I D apart, and Rotations counts how often a certificate was replaced. [[slnc 300]] And WorkloadIdentityDemo runs the demos."

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["An API key in an environment variable,", "  the same in three services", "An ID such as spiffe://bank.example/payments", "A certificate that expires within the hour", "A header such as X-Service-Name: payments"]
narration = "You have probably met this already. [[slnc 400]] The same A P I key in an environment variable of three services is a shared secret. [[slnc 500]] An I D starting spiffe, colon, slash slash, is a workload identity. [[slnc 500]] A certificate that expires within the hour is a short lived S V I D. [[slnc 500]] And a header that says which service is calling is the caller's own word, which proves nothing."

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Give each service its own identity", "Let the platform prove it, not the service", "Keep certificates short-lived and rotated", "Authorize by the SPIFFE ID", "Retire the shared secrets"]
narration = "So, how do you use it? [[slnc 400]] Give each service its own identity. [[slnc 500]] Let the platform prove who a process is, not the process itself. [[slnc 500]] Keep certificates short lived, and rotated automatically. [[slnc 500]] Authorize by the SPIFFE I D. [[slnc 300]] And retire the shared secrets once nothing uses them."

[[scene]]
key = "12-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a fraud-engine entry", "that may only read statements."]
narration = "That's workload identity with SPIFFE and SPIRE. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Replace a shared secret with a name for each service, proven by a certificate the platform issues and renews every few seconds. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a registration entry for fraud engine that may only read statements, and call the ledger as it. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] SPIRE is real; the classes set it up, run the workloads as different users, and check what they get. [[slnc 300]] Here are the ones that matter."""

[[class]]
name = "LegacyLedger"
what = "the before: one shared secret and the caller's word"

[[class.part]]
title = "the key, then the claimed name"
code = """
if (presentedKey == null || !presentedKey.equals(secret)) {
    return 401;
...
return Policy.allows(Policy.DOMAIN + claimedService, method, path) ? 200 : 403;
"""
speech = """The key proves only that the caller holds the key. [[slnc 300]] After that, the name the caller claims is all there is to check."""

[[class]]
name = "Lab"
what = "a real SPIRE server and agent in a Linux container"

[[class.part]]
title = "a registration entry: a user number and an ID"
code = """
server("entry", "create", "-parentID", NODE,
        "-spiffeID", "spiffe://" + DOMAIN + "/" + workload,
        "-selector", "unix:uid:" + UIDS.get(workload),
        "-x509SVIDTTL", Integer.toString(SVID_TTL_SECONDS));
"""
speech = """The selector is the operating system user a process runs as. [[slnc 300]] The time to live is twenty seconds. [[slnc 300]] What the process says about itself is never part of the entry."""

[[class]]
name = "Workload"
what = "the Java program each service runs"

[[class.part]]
title = "the ledger reads the ID from the certificate"
code = """
parameters.setNeedClientAuth(true);
...
caller = spiffeIdOf((X509Certificate) chain[0]);
...
int code = Policy.allows(caller, method, path) ? 200 : 403;
"""
speech = """The ledger demands a client certificate. [[slnc 300]] It reads the SPIFFE I D from the certificate, and applies the same rules as before."""

[[class.part]]
title = "the client accepts one server ID"
code = """
return SpiffeSslContextFactory.getSslContext(SslContextOptions.builder()
        .x509Source(source)
        .acceptedSpiffeIdsSupplier(() -> Set.of(SpiffeId.parse(expectedId)))
        .build());
"""
speech = """The source hands the current S V I D to every handshake, so rotation needs no code. [[slnc 300]] And the client accepts only the ledger's I D, which is why the fake ledger was refused."""

[[class]]
name = "Policy"
what = "which SPIFFE ID may call which route"

[[class.part]]
title = "anything not listed is refused"
code = """
if (callerId == null || !callerId.startsWith(DOMAIN)) {
    return false;
...
return RULES.contains(new Rule(callerId, method, path));
"""
speech = """An I D from another trust domain, or none, gets nothing. [[slnc 300]] Otherwise the rule for that I D, method and path must exist."""

[[class]]
name = "SpiffeIds"
what = "a teaching class: a SPIFFE ID taken apart by hand"

[[class.part]]
title = "trust domain, then path"
code = """
String rest = id.substring(SCHEME.length());
int slash = rest.indexOf('/');
if (slash < 0) {
    return new Parts(rest, "");
}
return new Parts(rest.substring(0, slash), rest.substring(slash));
"""
speech = """After spiffe colon slash slash comes the trust domain, up to the first slash, then the path. [[slnc 300]] A test checks that it agrees with the java spiffe library."""

[[class]]
name = "Rotations"
what = "how often a certificate was replaced"

[[class.part]]
title = "count the serial number changes"
code = """
for (int i = 1; i < seenInOrder.size(); i++) {
    if (!seenInOrder.get(i).equals(seenInOrder.get(i - 1))) {
        changes++;
"""
speech = """Every new certificate has a new serial number. [[slnc 300]] Counting the changes, call after call, counts the rotations."""

[[acronym]]
short = "SPIFFE"
long = "Secure Production Identity Framework For Everyone: the naming standard"
say = "SPIFFE is the secure production identity framework for everyone: the standard for workload names."

[[acronym]]
short = "SPIRE"
long = "the SPIFFE Runtime Environment: a server and agents that issue SVIDs"
say = "SPIRE is the SPIFFE runtime environment: a server and agents that issue the certificates."

[[acronym]]
short = "SVID"
long = "SPIFFE Verifiable Identity Document: here an X.509 certificate"
say = "S V I D is SPIFFE verifiable identity document. Here it is an X five oh nine certificate that carries the SPIFFE I D."

[[acronym]]
short = "ID"
long = "identifier: the workload's name"
say = "I D is identifier: the workload's name."

[[acronym]]
short = "X.509"
long = "the standard format of certificates"
say = "X five oh nine is the standard format of certificates."

[[acronym]]
short = "TLS, mTLS"
long = "Transport Layer Security; mutual TLS: both ends show a certificate"
say = "T L S is transport layer security. Mutual T L S means both ends show a certificate and check the other's."

[[acronym]]
short = "TTL"
long = "Time To Live: how long an SVID is valid"
say = "T T L is time to live: how long an S V I D is valid."

[[acronym]]
short = "API"
long = "Application Programming Interface: the Workload API is the agent's local socket"
say = "A P I is application programming interface. The workload A P I is the agent's local socket that hands out S V I Ds."

[[acronym]]
short = "HTTP"
long = "Hypertext Transfer Protocol: 200 OK, 401 no valid key, 403 Forbidden"
say = "H T T P is the hypertext transfer protocol. Two hundred is O K, four oh one means no valid key, four oh three means forbidden."

[[acronym]]
short = "uid"
long = "user identifier: the operating system user number, 2001 to 2004 here"
say = "U I D is the user identifier: the operating system's number for a user."

[[acronym]]
short = "OK"
long = "the answer of a request that worked (HTTP 200)"
say = "O K is the answer of a request that worked."
