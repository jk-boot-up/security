    "Kubernetes attestation.",
    "JWT-SVIDs.",
]
problem = """
Services prove who they are with a secret that every copy shares and that never expires.
"""
roles = [["Authorization by SPIFFE ID", "`Policy`"], ["The shared-secret ledger", "`LegacyLedger`"], ["SPIRE in Docker", "`Lab`"], ["The Java workloads", "`Workload`"], ["Counting rotations", "`Rotations`"], ["Entry point", "`WorkloadIdentityDemo`"]]
requirements = [
