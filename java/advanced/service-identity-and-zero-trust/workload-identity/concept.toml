# concept.toml: everything about this project that is not Java code.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "workload-identity"
level = "advanced"
module = "service-identity-and-zero-trust"
title = "Workload Identity"
short_title = "Workload ID"
package = "workloadid"
main_class = "WorkloadIdentityDemo"
tagline = "Replace a shared secret with SPIFFE IDs and short-lived SVIDs from a real SPIRE server and agent, between two Java services at a bank"
bold = "One static secret copied into 3 services lets a leak from any one of them act as every service; with SPIRE each workload gets a SPIFFE ID chosen by a registration entry and its operating system user, not by what it claims, and an X.509-SVID that lives 20 seconds; two Java services verify each other's SPIFFE ID against the trust bundle, the ledger authorizes by that ID (200 and 403 as the rules say), the SVID is renewed on its own at least 3 times in 50 seconds with 0 calls failed, a stolen copy works while it lives and is refused after 20 seconds, and a process that matches no entry gets no SVID."
domain = "a bank"
domain_note = ""
youtube_description = "Workload identity for a bank's services with SPIFFE and SPIRE: a shared secret that leaks, SPIFFE IDs chosen by registration entries, 20 second X.509 SVIDs, mutual verification between two Java services, automatic rotation and a stolen SVID."
thumb_lines = ["WORKLOAD", "IDENTITY"]
thumb_code = "spiffe://bank.example/payments"
youtube_title = "Workload Identity with SPIFFE and SPIRE: Short-Lived SVIDs Instead of Shared Secrets"
youtube_tags = ["spiffe", "spire", "workload identity", "svid", "mtls", "zero trust", "service identity", "x509", "secret rotation", "java"]

[readme]
intro = """
A shared secret says "someone who holds this key is calling", never which service. This project first shows that **before**: one static key copied into the configuration of payments, reporting and fraud-engine; when the fraud-engine's copy leaks, the attacker is every service. It then runs a real **SPIRE** server and agent (SPIFFE's reference implementation) and gives each workload a **SPIFFE ID** such as `spiffe://bank.example/payments`, chosen by a registration entry and the operating system user the process runs as, plus an **X.509-SVID** that lives 20 seconds. SPIRE has no macOS build, so the official linux arm64 release runs in one Docker container (`eclipse-temurin:25-jre`, the release downloaded once into `build/spire`); the Java workloads run in that container as different users and use the `java-spiffe` Workload API client. The demo is tagged `integration`: `./gradlew integrationTest` (about 3 minutes).

What it shows:
- **The shared secret.** Held by **3** services, it lets a copy from one service call as any of them; the ledger takes the caller's word for who it is.
- **Identity by registration.** The same Java program gets `ledger`, `payments` or `reporting` depending on the user it runs as; a claim in its environment changes nothing.
- **Mutual verification.** Two Java services check each other's SPIFFE ID against the trust bundle; the ledger answers 200 and 403 by the rules; a server with the wrong ID and a certificate made by an attacker are refused (0 requests reach the ledger).
- **Rotation.** SVIDs are replaced at least **3** times in 50 seconds with **0** failed calls and no renewal code in the services.
- **A stolen SVID.** It works while it lives and is refused after 20 seconds; a shared secret still works.
- **No entry, no identity.** A process that matches nothing gets no SVID, and deleting an entry ends a workload's identity.

**Maps to:** NIST SP 800-207 (zero trust) · SPIFFE and SPIRE · OWASP ASVS V9 · CWE-798 (hard-coded credentials).
"""
analogy = """
A shared secret is a master key cut three times: whoever finds one lost copy can open every door and nobody can tell which copy it was. A SPIFFE ID is a name badge printed at the door by a guard who looks at who is standing there, and the badge stops working after 20 seconds.
"""
scenario = """
A bank's ledger is called by payments (which moves money) and reporting (which reads statements). The demo first lets one shared key leak, then replaces it with SPIRE identities, rotates them, steals one and starts a process that matches no entry.
"""
costs = [
    "**SPIRE is more to run:** a server, an agent on each node and registration entries to keep.",
    "**The agent and the server must stay up,** because a short lifetime depends on renewal.",
    "**The identity is only as strong as the selector,** here the operating system user.",
    "**A stolen SVID works until it expires,** so the lifetime is the revocation.",
    "**Services need a Workload API client** and a TLS context that reads the SVID at each handshake.",
]
too_much = """
One service calling one other service inside a closed network may be fine with a managed secret that is rotated. Use workload identity when many services call each other and a leak from any one of them must not be worth everything.
"""
met_before = [
    "An API key in an environment variable copied into every service.",
    "A service account password nobody has changed since it was created.",
    "A client certificate that lives for a year.",
    "A header that says which service is calling.",
]
where = """
This is a project of the [service-identity-and-zero-trust](..) module, with [mutual-tls-between-services](../mutual-tls-between-services) and [service-mesh-mtls](../service-mesh-mtls). The first runs its own CA; this one lets SPIRE decide who a workload is and renew its certificate.
"""
twin = """
SPIRE (server and agent 1.15.5), Docker and the java-spiffe client are real, and every number is measured. The "bank" is a ledger and three callers on one node; a real deployment has many nodes and a node attestor stronger than a join token. The demo never prints ports, serial numbers, tokens or times.
"""
test_note = "The policy, the rotation count and the shared-secret ledger are tested with no tools. The demo runs SPIRE in Docker (./gradlew integrationTest)."

[[act]]
title = "One shared secret"
summary = "One key in 3 services lets a leak from any of them act as every service."
detail = """
The ledger accepts one static key and a header that says which service is calling. Payments, reporting and fraud-engine hold the same key. When the fraud-engine's configuration leaks, an attacker who says payments moves money (200) and one who says reporting reads statements (200). Even a service that is not allowed to transfer says payments and gets 200.
"""
speech = """
First demo: one shared secret. [[slnc 400]] Three services hold the same key. [[slnc 600]] When one copy leaks, the attacker is every service.
"""
rows = { secret = "active wrong" }
console = [
    ["secret held by: 3 of 3", "bad"],
    ["leaked copy, POST /transfers: 200", "bad"],
    ["the ledger takes the caller's word", "bad"],
]

[[act]]
title = "Identity by registration"
summary = "SPIRE gives the same Java program a different SPIFFE ID for each user it runs as."
detail = """
A SPIRE server and agent run in a Docker container with 3 registration entries, each chosen by a selector, the operating system user id. The Java program run as the ledger, payments and reporting users gets spiffe://bank.example/ledger, /payments and /reporting. A process that puts a claim to be payments in its environment still gets the identity of the user it runs as.
"""
speech = """
Second demo: identity by registration. [[slnc 400]] The same program gets a different name for each user. [[slnc 600]] A claim in its environment changes nothing.
"""
rows = { entries = "active ok" }
console = [
    ["entries: 3, selector unix user id", "ok"],
    ["reporting user claims payments: reporting", "ok"],
    ["SVID lifetime: 20 seconds", "ok"],
]

[[act]]
title = "Two services check each other"
summary = "Each side verifies the other's SPIFFE ID against the trust bundle, and the ledger authorizes by it."
detail = """
Payments posts a transfer and gets 200, asks for statements and gets 403; reporting is the other way round. The ledger's audit names each caller by the SPIFFE ID in the certificate. Payments refuses a server that presents another workload's SVID, and the ledger refuses a certificate that names itself payments but was made by the attacker: 0 requests reach the ledger's code.
"""
speech = """
Third demo: two services check each other. [[slnc 400]] Payments may transfer, reporting may read. [[slnc 600]] A wrong server and a forged certificate are refused.
"""
rows = { mutual = "active ok" }
console = [
    ["payments POST /transfers: 200", "ok"],
    ["reporting POST /transfers: 403", "ok"],
    ["forged certificate: refused, 0 reached the ledger", "ok"],
]

[[act]]
title = "Rotation without a restart"
summary = "SVIDs are replaced at least 3 times in 50 seconds and no call fails."
detail = """
Payments calls the ledger on new connections for 50 seconds. Its own SVID is replaced at least 3 times and the ledger's, as payments sees it, at least 3 times. At least 100 calls are made and 0 fail. The services have no renewal code: the Workload API client swaps the SVID and the TLS context reads it at each handshake.
"""
speech = """
Fourth demo: rotation. [[slnc 400]] Twenty seconds is short. [[slnc 600]] The certificates are replaced three times and no call fails.
"""
rows = { rotation = "active ok" }
console = [
    ["SVID replaced: at least 3 times", "ok"],
    ["calls at least 100, failed 0", "ok"],
    ["no renewal code in the services", "ok"],
]

[[act]]
title = "A stolen SVID"
summary = "A copy works while the SVID lives and is refused after 20 seconds; a shared secret still works."
detail = """
The certificate, key and bundle on payments' disk are copied by an attacker running as another user and POST /transfers gets 200, and the ledger's audit names the call as payments. After the SVID's lifetime the same copy is refused while payments itself still gets 200. The leaked shared secret still gets 200 at that moment.
"""
speech = """
Fifth demo: a stolen SVID. [[slnc 400]] A copy works while it lives. [[slnc 600]] After twenty seconds it is refused. The shared secret never expires.
"""
rows = { stolen = "active ok" }
console = [
    ["stolen SVID, POST /transfers: 200", "bad"],
    ["after 20 seconds: refused", "ok"],
    ["leaked shared secret then: 200", "bad"],
]

[[act]]
title = "No entry, no identity"
summary = "A process that matches no entry gets no SVID, and deleting an entry ends an identity."
detail = """
A process run as the attacker's user, saying it is payments, gets no SVID and 0 of its requests reach the ledger. When the payments entry is deleted, a new payments process gets no SVID within 40 seconds while reporting still gets 200. Changing the shared secret to evict an attacker would have broken 3 of 3 services.
"""
speech = """
Sixth demo: no entry, no identity. [[slnc 400]] A claim gets nothing. [[slnc 600]] Delete the entry and the identity ends, and no other service is touched.
"""
rows = { noentry = "active ok" }
console = [
    ["attacker saying payments: no SVID issued", "ok"],
    ["entry deleted: payments gets nothing", "ok"],
    ["new shared secret: 3 of 3 services fail", "bad"],
]

