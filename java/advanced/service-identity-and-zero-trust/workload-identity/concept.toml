[[act]]
title = "Evicting the attacker"
summary = "Changing the shared secret stops the leaked copy (401) but breaks 3 of 3 services until each gets the new one. The stolen SVID needed no change in any service (0): it expired by itself, while the leaked secret kept working (200) until it was changed."
detail = """
The shared secret is changed at the ledger: the leaked copy now gets 401, and 3 of 3 services fail until each is given the new secret: evicting one attacker is an outage and a rollout.
The stolen SVID: no service was changed (0); it expired by itself after 20 s. The leaked shared secret was still accepted (200) until it was changed.
A short lifetime is the revocation that always works; it costs a SPIRE server and agent that must stay up to renew.
"""
figure = "eviction"
figure_title = "What it takes to evict the attacker"
figure_speech = """
Last demo: getting the attacker out. [[slnc 400]] On the left, the shared secret. [[slnc 300]] The ledger changes it, and the leaked copy is refused with four oh one. [[slnc 300]] But all three services held the same secret, so all three of three now fail too, until each one is given the new value. [[slnc 300]] Evicting one attacker means an outage and a rollout. [[slnc 700]]
On the right, the stolen S V I D. [[slnc 300]] Nobody changed anything. [[slnc 300]] Zero services touched: it expired by itself after twenty seconds. [[slnc 300]] Meanwhile the leaked secret kept working, two hundred, until it was changed. [[slnc 600]]
A short lifetime is the revocation that always works.
"""
speech = """
The shared secret is changed: the leaked copy gets four oh one, and three of three services fail until each gets the new one. [[slnc 400]] The stolen S V I D: zero services changed, it expired by itself. [[slnc 300]] The leaked secret had worked, two hundred, until it was changed.
