[[act]]
title = "Two Java services check each other's SPIFFE ID"
summary = "Over mutual TLS the ledger reads the caller's SPIFFE ID from its certificate and applies the same two rules: payments POST /transfers 200, GET /statements 403; reporting GET /statements 200, POST /transfers 403. The audit names 4 requests by certificate. A server run as reporting is refused by payments, which expects spiffe://bank.example/ledger, and a self-made certificate naming payments is refused before any request reaches the ledger (0)."
detail = """
The requests, over mutual TLS, with the SVIDs SPIRE issued: payments POST /transfers 200, payments GET /statements 403, reporting GET /statements 200, reporting POST /transfers 403. The ledger takes the caller's ID from the certificate, not from a header.
The ledger's audit: 4 requests, named spiffe://bank.example/payments and spiffe://bank.example/reporting.
Two impostors: a server run by the reporting workload, called by payments as if it were the ledger, is refused (payments accepts only spiffe://bank.example/ledger). A certificate the attacker made with keytool, naming itself spiffe://bank.example/payments, is refused at the handshake: it is not signed by the trust bundle, and 0 requests reach the ledger's code.
"""
figure = "mutual_check"
figure_title = "Both ends check the other's SPIFFE ID"
figure_speech = """
Third demo: two Java services that check each other. [[slnc 400]] At the top, the requests. [[slnc 300]] The ledger no longer reads a header. [[slnc 300]] It reads the SPIFFE I D in the caller's certificate, and applies the same two rules as before. [[slnc 300]] Payments may transfer, and gets four oh three for statements; reporting the other way round. [[slnc 700]]
At the bottom, two impostors. [[slnc 300]] On the left, a server run by reporting, pretending to be the ledger. [[slnc 300]] Payments checks the server's I D too, expects the ledger, and refuses. [[slnc 300]] On the right, a certificate the attacker made himself, with the payments name written in it. [[slnc 300]] No SPIRE signature, so the handshake fails, and zero requests reach the ledger's code.
"""
