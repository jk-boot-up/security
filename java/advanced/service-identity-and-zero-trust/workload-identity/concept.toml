The theft: certificate, private key and bundle, copied by another user. [[slnc 400]] The attacker's calls: two hundred at once, and the audit names payments. [[slnc 300]] After twenty one seconds: refused. [[slnc 400]] At the same moment, payments itself gets two hundred, and the leaked shared secret still gets two hundred.
