[[act]]
title = "A workload that matches no entry"
summary = "A process run as the attacker's user 2004, saying it is payments, gets no SVID and cannot call the ledger (0 requests reach it). Once the payments entry is deleted, a new payments process gets no SVID either, while reporting still gets 200."
detail = """
The input: a process run as user 2004, which no registration entry selects, with the claim spiffe://bank.example/payments in its environment.
The result: it asks for an SVID: none issued; it calls the ledger: no SVID, so no handshake, and 0 requests reach the ledger's code.
Then the payments entry is deleted on the server. Within 40 s the agent stops issuing it: a new payments process gets no SVID. reporting, unaffected, GET /statements: 200. No entry, no identity.
"""
figure = "no_entry"
figure_title = "No entry, no identity"
figure_speech = """
Sixth demo: a process that matches no entry. [[slnc 400]] At the top, the input: a process run as the attacker's own user, two thousand and four, that claims to be payments. [[slnc 300]] The agent looks it up: no entry selects that user. [[slnc 300]] So no S V I D is issued, and with no certificate it cannot even start a handshake with the ledger. [[slnc 700]]
At the bottom, an entry is taken away. [[slnc 300]] The operator deletes the payments entry on the server. [[slnc 300]] A new payments process now gets nothing either. [[slnc 300]] Reporting, which still has its entry, carries on with two hundred. [[slnc 600]]
Identity is something the platform gives, and can take back, not something a process can claim.
"""
