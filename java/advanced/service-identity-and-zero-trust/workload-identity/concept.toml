[[act]]
title = "SPIRE decides who a workload is"
summary = "A SPIRE 1.15.5 server and agent hold 3 registration entries: unix:uid:2001 -> spiffe://bank.example/ledger, 2002 -> payments, 2003 -> reporting. The same Java program run as each user gets that ID; run as user 2003 while saying it is payments, it still gets /reporting. An SVID's dates span 30 s: 10 s back-dated, so 30 - 10 = 20 s, the TTL."
detail = """
The input: SPIRE server and agent 1.15.5 in one Linux container, trust domain bank.example, and 3 registration entries, each a selector and a SPIFFE ID: unix:uid:2001 -> spiffe://bank.example/ledger, unix:uid:2002 -> .../payments, unix:uid:2003 -> .../reporting.
The result: the same Java program, run as user 2001, 2002 and 2003, gets ledger, payments and reporting. Run as user 2003 with the claim "I am spiffe://bank.example/payments" in its environment, it gets spiffe://bank.example/reporting: the agent asks the kernel who the process is, and never reads the claim.
One SPIFFE ID, part by part: scheme spiffe://, trust domain bank.example, path /reporting.
How long an SVID lives: its own dates span 30 s (Not After - Not Before); SPIRE starts them 10 s early, so 30 - 10 = 20 s, the TTL; just issued, at most 20 s are left (yes).
"""
figure = "svid_parts"
figure_title = "A SPIFFE ID and an SVID's dates, part by part"
figure_speech = """
Second demo, the result in detail. [[slnc 400]] At the top, one SPIFFE I D taken apart. [[slnc 300]] The scheme, spiffe colon slash slash. [[slnc 300]] The trust domain, bank dot example: who vouches for the name. [[slnc 300]] And the path, slash reporting: the workload's name inside that domain. [[slnc 700]]
At the bottom, the S V I D's dates. [[slnc 300]] From not before to not after is thirty seconds. [[slnc 300]] SPIRE starts the certificate ten seconds early, so a clock that is a little behind still accepts it. [[slnc 300]] Thirty minus ten is twenty seconds: the time to live we asked for. [[slnc 700]]
So the certificate that proves this name is worthless twenty seconds after it is issued, and the agent must hand out the next one.
"""
speech = """
The setup: SPIRE one fifteen five, the trust domain, and three entries. [[slnc 400]] The registration entries: a user number on the left, a SPIFFE I D on the right. [[slnc 400]] The same program, run as each user, gets that user's I D. [[slnc 300]] Run as user two thousand and three while saying it is payments, it still gets reporting.
[[page]]
One SPIFFE I D, part by part: scheme, trust domain, path. [[slnc 400]] How long an S V I D lives: thirty seconds on the certificate, minus ten seconds back dated, is twenty seconds, the time to live.
"""
