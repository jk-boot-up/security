[[act]]
title = "Rotation: an SVID that lives 20 seconds"
summary = "payments calls the ledger on a new connection about 4 times a second for 50 s, 50 / 20 = 2.5 SVID lifetimes: at least 100 calls (yes), 0 failed, payments' own SVID and the ledger's as seen by payments each replaced at least 3 times (yes), with no renewal code in the services."
detail = """
The input: payments calls the ledger, a new connection each time, about 4 calls a second for 50 s, while SVIDs live 20 s: 50 / 20 = 2.5 lifetimes, so the certificates must be replaced during the test.
The result: at least 100 calls (yes), 0 failed; payments' own SVID replaced at least 3 times (yes), and the ledger's, as seen by payments, at least 3 times (yes), counted from the serial numbers seen one after the other. The services contain no renewal code: the Workload API client swaps the SVID and each TLS handshake reads the current one.
"""
figure = "rotation_timeline"
figure_title = "Fifty seconds of calls, and SVIDs that live twenty"
figure_speech = """
Fourth demo: rotation. [[slnc 400]] At the top, the input: payments calls the ledger four times a second, on a new connection each time, for fifty seconds. [[slnc 300]] Each certificate lives only twenty seconds, so fifty seconds is two and a half lifetimes. [[slnc 700]]
The time line shows it. [[slnc 300]] No single certificate could last the test. [[slnc 300]] The agent hands out a new one before the old one ends, and the next handshake simply uses it. [[slnc 700]]
At the bottom, the result. [[slnc 300]] At least a hundred calls, none failed. [[slnc 300]] Both certificates, payments' own and the ledger's, were replaced at least three times. [[slnc 300]] And neither service has a line of renewal code.
"""
speech = """
The test: fifty seconds, about four calls a second; the S V I D lives twenty seconds, so two and a half lifetimes. [[slnc 400]] The result: at least a hundred calls, zero failed. [[slnc 300]] Payments' S V I D replaced at least three times, and the ledger's too. [[slnc 300]] No renewal code in the services: the workload A P I client swaps the S V I D, and each handshake reads the current one.
"""
