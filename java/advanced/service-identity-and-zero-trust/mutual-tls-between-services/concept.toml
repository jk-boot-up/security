[threatmodel]
scope = """
Calls between a bank's services inside its network. It does not cover end users, browsers or the protection of keys in hardware.
"""
assets = [
    "The ledger's transfers and statements.",
    "The private keys of the services.",
    "The CA and its trust file.",
]
actors = [
    "A service with a valid certificate and no business calling an endpoint.",
    "A process on the same host.",
    "A thief holding a copy of a certificate and key.",
    "A second CA that the ledger is told to trust.",
]
boundaries = [
    "The TLS handshake: the chain is checked before any application code runs.",
    "The policy: the identity decides what a caller may do.",
]
assumptions = [
    "Each service keeps its private key secret.",
    "The clocks agree within a second.",
]
out_of_scope = [
    "Hardware-protected keys.",
    "A compromised CA.",
    "Traffic analysis.",
]
tests = [
    "`IdentitiesTest` and `PolicyTest` check the identity rule and the policy with no tools.",
    "`ChainStepsTest` checks the chain by hand against the JDK's own check, the SAN listing and the pinned assets, on a fixed chain made once with step.",
    "`DemoRunsTest` starts step-ca and compares the whole demo with the golden output (integrationTest).",
]
next = """
The next project in the module is service-mesh-mtls.
"""

[[threat]]
id = "T1"
stride = "S"
threat = "A service calls the ledger as another service or with no identity"
where = "the ledger"
control = "Mutual TLS with a private CA; the identity is read from the SAN and authorized per endpoint"
residual = "A service that is allowed too much"

[[threat]]
id = "T2"
stride = "S"
threat = "A certificate from another CA names itself payments"
where = "the trust file"
control = "The chain must lead to a trusted root; a handshake that fails never reaches the code"
residual = "A CA added to the trust file can mint any identity"

[[threat]]
id = "T3"
stride = "E"
threat = "A stolen certificate and key is used from another machine"
where = "the keys"
control = "Lifetimes of minutes or hours, renewal, and a revocation list that the ledger reads"
residual = "Use until expiry if the list is not read"

[poster]
headline = [["MUTUAL", "text"], ["TLS", "accent"]]
taglines = [["Client certificates, identity from the SAN, rotation and revocation", "gold"]]
before = { code = "trust the network: 2 of 2 allowed", note = "By address", tag = "BEFORE" }
after = { code = "trust the identity: 1 of 2 allowed", note = "By certificate", tag = "AFTER" }

[[scene]]
key = "01-poster"
kind = "poster"
title = "Mutual TLS Between Services"
narration = "Hello, and welcome. [[slnc 400]] This video explains mutual T L S between services. [[slnc 300]] T L S is transport layer security, the lock in H T T P S. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] In ordinary T L S, only the server proves who it is. [[slnc 300]] In mutual T L S, the caller shows a certificate too, so the server learns which service is calling, and can decide by that identity instead of by the network address. [[slnc 600]] Think of a bank branch where staff badge in at the door, instead of being let in because they are already inside the building. [[slnc 600]] Our example is a bank."

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["A bank's ledger service runs real HTTPS that", "demands a client certificate.", "", "A private CA, step-ca, issues certificates to", "payments, reporting and fraud-engine.", "The ledger decides who may call what."]
narration = "Here is the scenario. [[slnc 400]] A bank's ledger service runs real H T T P S, and demands a client certificate. [[slnc 500]] A private certificate authority, step C A, issues certificates to three services: payments, reporting, and fraud engine. [[slnc 500]] The ledger reads the identity in each certificate, and decides which service may call which endpoint."

[[scene]]
key = "02-words"
kind = "bullets"
title = "The Words"
body = ["Certificate: a public key, a name, and a CA's signature", "Client certificate: the one the caller shows", "CA: the authority that signs certificates", "Trust file: the CAs a service believes", "Identity: the service named in the certificate", "Revocation: the CA saying a certificate is void"]
narration = """Before the demos, the words. [[slnc 500]] A certificate binds a public key to a name, and is signed by an authority. [[slnc 500]] A client certificate is the one the caller shows, in mutual T L S. [[slnc 500]] A certificate authority, a C A, signs certificates. [[slnc 500]] A trust file lists the authorities a service believes. [[slnc 500]] The identity is the service that the certificate names. [[slnc 500]] And revocation is the authority saying that a certificate is void before it expires."""

[[scene]]
key = "02-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "02-badge"
kind = "figure"
title = "A certificate is a badge"
body = "badge"
narration = """Let's see the core idea on one example: the payments service calling the ledger. [[slnc 400]] On the left, the input: the certificate payments shows. [[slnc 300]] Its subject is a host style name. [[slnc 300]] Its subject alternative name holds a U R I: spiffe, bank, payments. [[slnc 300]] And it is signed by the bank's own authority. [[slnc 700]]
In the middle, what the ledger does with it. [[slnc 300]] First, the handshake checks the signatures, up to a root in its trust file. [[slnc 300]] Then the ledger reads the U R I, removes the prefix, and gets the identity: payments. [[slnc 700]]
On the right, the result. [[slnc 300]] The ledger's rule says payments may post transfers: two hundred. [[slnc 300]] The same certificate asking for statements gets four oh three. [[slnc 600]]
The certificate says who is calling. The rules say what that caller may do."""

[[scene]]
key = "03-acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "04-costs"
kind = "bullets"
title = "What It Costs"
body = ["Revocation works only if the server reads it", "Short lifetimes need a renewal that never fails", "Any CA in the trust file can mint any identity", "Certificates must be issued, renewed and watched"]
narration = "Nothing is free. [[slnc 400]] Here is what it costs. [[slnc 500]] Revocation works only if the server reads the revocation list. [[slnc 500]] Short lifetimes need a renewal that never fails. [[slnc 500]] Any authority in the trust file can mint any identity, so trust as few as you can. [[slnc 500]] And every certificate must be issued, renewed, and watched."

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["Ca, StepTools: step-ca, a pinned private authority", "Ledger: HTTPS that demands a client certificate", "ChainSteps: the chain check, redone by hand", "Identities: reads the URI in the SAN", "Policy: which identity may call which endpoint", "Caller, Tls: a service and its certificate"]
narration = "Here is who does what in the code. [[slnc 400]] Ca runs step C A, the private certificate authority, from a pinned release that StepTools downloads. [[slnc 500]] Ledger is the H T T P S service that demands a client certificate. [[slnc 500]] ChainSteps redoes the chain check by hand. [[slnc 300]] Identities reads the caller's identity from the U R I in the subject alternative name, never from the subject name. [[slnc 500]] Policy says which identity may call which endpoint. [[slnc 300]] And Caller and Tls are a calling service and its certificate."

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["An error: bad_certificate or certificate_required", "A firewall rule: allow 10.0.0.0/8", "A URI SAN such as spiffe://bank/payments", "ssl_verify_client on, in a server config"]
narration = "You have probably met this already. [[slnc 400]] A handshake error saying bad certificate, or certificate required, is a server asking for a client certificate. [[slnc 500]] A firewall rule that allows the whole internal network is trust by address. [[slnc 500]] The U R I spiffe, bank, payments, in a certificate, is a service identity. [[slnc 500]] And ssl verify client on, in a server config, is mutual T L S switched on."

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Demand a client certificate from your own CA", "Authorize by the identity in the SAN,", "  not by the network", "Short lifetimes, renewed with no restart", "Read the revocation list, or keep lifetimes short", "Keep the trust file to the CAs you run"]
narration = "So, how do you use it? [[slnc 400]] Demand a client certificate, issued by your own private authority. [[slnc 500]] Authorize by the identity in the subject alternative name, not by the network. [[slnc 500]] Use short lifetimes, renewed without a restart. [[slnc 500]] Read the revocation list, or keep lifetimes so short that a stolen certificate soon expires. [[slnc 500]] And keep the trust file to the authorities you run, because each one can mint any identity."

[[scene]]
key = "12-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a service to the", "policy, and issue it a certificate."]
narration = "That's mutual T L S between services. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Let every service prove who it is with a short lived certificate, and decide by that identity, never by where the call came from. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a new service to the policy, and issue it a certificate. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"


[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] step C A issues the certificates, and the J D K does the T L S; the classes decide who gets in and what they may do. [[slnc 300]] Here are the ones that matter."""

[[class]]
name = "Ledger"
what = "HTTPS that demands a client certificate and decides by its identity"
[[class.part]]
title = "no certificate, no connection"
code = """
SSLParameters p = getSSLContext().getDefaultSSLParameters();
p.setNeedClientAuth(true);
params.setSSLParameters(p);
"""
speech = """The server needs client authentication. [[slnc 300]] A caller without a certificate, or with one that no trusted authority signed, fails in the handshake, before any of the ledger's code runs."""
[[class.part]]
title = "identity, revocation, then the rule"
code = """
String identity = Identities.of(caller).orElse(null);
...
} else if (revoked.contains(caller.getSerialNumber())) {
...
} else if (policy.allows(identity, method, path)) {
    status = 200;
"""
speech = """For a request that got through, the ledger takes the identity from the certificate, refuses a revoked serial number, and then asks the policy."""

[[class]]
name = "Identities"
what = "the identity is the URI in the SAN, never the subject"
[[class.part]]
title = "type 6 is a URI"
code = """
.filter(n -> n.size() == 2 && n.get(0) instanceof Integer type && type == URI && n.get(1) instanceof String)
.map(n -> (String) n.get(1))
.filter(uri -> uri.startsWith(PREFIX) && uri.length() > PREFIX.length() && uri.indexOf('/', PREFIX.length()) < 0)
.map(uri -> uri.substring(PREFIX.length()))
"""
speech = """The J D K lists each alternative name as a type number and a value; six is a U R I. [[slnc 300]] Only a U R I in the bank's trust domain, with no further path, is an identity."""

[[class]]
name = "ChainSteps"
what = "a teaching class: the chain check, redone by hand"
[[class.part]]
title = "names and signatures, link by link"
code = """
boolean nameFits = next != null && next.getSubjectX500Principal().equals(c.getIssuerX500Principal());
...
c.verify(key);
"""
speech = """Each certificate must name the next as its issuer, and the next one's public key must verify its signature. [[slnc 300]] A test proves this gives the same answer as the J D K's own check."""

[[class]]
name = "Tls"
what = "the certificate and the trust file, replaceable while running"
[[class.part]]
title = "reload without a restart"
code = """
void replace(Credential credential, List<X509Certificate> trusted) throws GeneralSecurityException {
    trust.current = trustManager(trusted);
    keys.credential = credential;
"""
speech = """New connections ask these two holders for the certificate and for the trust decision. [[slnc 300]] Replacing what they hold is a reload: the server never stops."""

[[class]]
name = "Ca"
what = "step-ca, driven with the step command line"
[[class.part]]
title = "issue, renew, revoke"
code = """
List<String> cmd = new java.util.ArrayList<>(List.of(StepTools.step(), "ca", "certificate", subject, base + ".crt", base + ".key",
...
Sh.must(work, env, concat(List.of(StepTools.step(), "ca", "renew", from + ".crt", from + ".key", "--out", to + ".crt", "--force"), connect));
...
Sh.must(work, env, concat(List.of(StepTools.step(), "ca", "revoke", "--cert", base + ".crt", "--key", base + ".key"), connect));
"""
speech = """Each certificate comes from the real authority, with the identity as a U R I. [[slnc 300]] Renew asks for a new certificate for the same key, and revoke only records the serial number on the authority's list."""

[[acronym]]
short = "TLS, mTLS"
long = "Transport Layer Security; mutual TLS: both sides show a certificate"
say = "T L S is transport layer security. In mutual T L S, both sides show a certificate."
[[acronym]]
short = "HTTP, HTTPS"
long = "Hypertext Transfer Protocol; HTTPS is HTTP over TLS"
say = "H T T P S is the hypertext transfer protocol over T L S."
[[acronym]]
short = "CA"
long = "Certificate Authority: signs certificates (here step-ca)"
say = "C A is certificate authority, which signs certificates."
[[acronym]]
short = "SAN"
long = "Subject Alternative Name: where the identity is written"
say = "S A N is subject alternative name, where the identity is written."
[[acronym]]
short = "URI"
long = "Uniform Resource Identifier: spiffe://bank/payments"
say = "U R I is uniform resource identifier, such as spiffe, bank, payments."
[[acronym]]
short = "CN"
long = "Common Name: the subject's name, not used for identity"
say = "C N is the common name in the subject. The ledger does not use it."
[[acronym]]
short = "DNS"
long = "Domain Name System: a host name such as localhost"
say = "D N S is the domain name system; a D N S name is a host name."
[[acronym]]
short = "SPIFFE"
long = "Secure Production Identity Framework For Everyone: the URI form"
say = "Spiffe is the secure production identity framework for everyone, which defines the U R I form."
[[acronym]]
short = "CRL"
long = "Certificate Revocation List: the serials a CA has revoked"
say = "C R L is certificate revocation list, the serial numbers the authority has revoked."
[[acronym]]
short = "EC, ECDSA"
long = "Elliptic Curve; the Elliptic Curve Digital Signature Algorithm"
say = "E C is elliptic curve, and E C D S A is the elliptic curve digital signature algorithm."
[[acronym]]
short = "SHA256"
long = "Secure Hash Algorithm, 256 bits: hashed before signing"
say = "S H A two fifty six is the secure hash algorithm with two hundred and fifty six bits."
[[acronym]]
short = "JDK"
long = "Java Development Kit: its HttpsServer and HttpClient"
say = "J D K is the Java development kit."
