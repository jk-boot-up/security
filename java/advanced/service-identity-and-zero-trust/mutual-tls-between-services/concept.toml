[[act]]
title = "Who gets through the handshake"
summary = "Three calls to POST /transfers: no client certificate; a certificate from Partner Bank CA that names spiffe://bank/payments; and payments calling a ledger whose certificate names DNS ledger-old.bank.internal. All three are refused at the handshake, the first two by the ledger and the third by the client, and 0 requests reach the ledger's own code."
detail = """
The input: three calls to POST /transfers. One has no client certificate. One has a certificate that names URI spiffe://bank/payments, but was issued by Partner Bank CA. The third is payments calling a ledger whose certificate names DNS ledger-old.bank.internal, while the client asked for localhost.
The result: the first is refused because the ledger wants a certificate; the second because its issuer is not in trust.pem; requests that reached the ledger's own code: 0. The third is refused by the client: the server's name does not fit. Mutual TLS checks both sides.
"""
figure = "handshake_door"
figure_title = "Refused before any code runs"
figure_speech = """
Second demo: who gets through the handshake. [[slnc 400]] On the left, the input: three calls. [[slnc 300]] The first has no client certificate at all. [[slnc 300]] The second has a certificate that says payments, but a partner bank's authority signed it. [[slnc 300]] The third is the real payments service, calling a ledger whose certificate names another host. [[slnc 700]]
In the middle, the handshake: the door. [[slnc 500]] On the right, the result. [[slnc 300]] All three are refused. [[slnc 300]] The ledger wants a certificate, and only from an authority in its trust file. [[slnc 300]] And the client checks the server too, so a wrong name is refused on the caller's side. [[slnc 600]]
Below, the count that matters: zero requests reached the ledger's own code.
"""
