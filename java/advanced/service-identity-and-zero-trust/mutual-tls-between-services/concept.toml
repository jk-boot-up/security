[docs.session]
objectives = [
    "explain what a client certificate proves and what it does not",
    "take a service identity from a certificate SAN and authorize by it",
    "renew a short-lived certificate and reload a server without downtime",
    "say what a revoked certificate can still do",
]
walkthrough = """
Run the demo and compare the second act with the first: the same host gets two answers. Open Identities.java and see which part of the certificate is the identity. Then read the rotation act and find where the server stops using the old certificate.
"""
exercises = [
    "Add a service to the policy and issue it a certificate.",
    "Make the ledger read the revocation list every 10 seconds on a timer and measure how long a revoked certificate still works.",
    "Add name constraints to the second CA so it can only mint identities under its own prefix.",
    "Check the revocation list inside the handshake with a custom trust manager instead of in the handler.",
]

[docs.explained]
sentence = """
A certificate is a badge: check who it names, give it a short life, and renew it before it ends.
"""
verdict = """
Use a private CA, give every service a certificate with its identity in the SAN, authorize by that identity, keep lifetimes short and renew automatically, make servers reload certificates and trust without a restart, and read the revocation list or rely on expiry. Treat the trust file as part of the policy.
"""
recognise = [
    "An internal API that trusts the source address.",
    "A client certificate checked for validity but never for who it names.",
    "A certificate renewal that is a calendar reminder.",
    "A revocation that nobody's server reads.",
]

[spec]
purpose = """
Teach mutual TLS between services by running a real private CA and a real server, and measuring who gets in, how identity decides, what rotation costs and what a revoked certificate can still do.
"""
nongoals = [
    "A service mesh (the next project).",
    "Browser or end-user certificates.",
    "Hardware-protected keys.",
]
problem = """
Services trust the network, so any caller on it is trusted, and certificates are issued once and forgotten.
"""
roles = [["The private CA and the step commands", "`Ca`"], ["The ledger server, its reload and the revocation check", "`Ledger`"], ["The identity in a certificate", "`Identities`"], ["Who may call what", "`Policy`"], ["The TLS settings that can be replaced while running", "`Tls`"], ["A calling service", "`Caller`"], ["Entry point", "`MutualTlsDemo`"]]
requirements = [
    "The CA is a real step-ca and the calls are real TLS.",
    "The identity comes from the SAN, never from the subject name.",
    "A refused handshake never reaches the application code.",
    "The server reloads its certificate and trust without a restart and without a failed call.",
    "The demo prints the same output on every run and leaves no key behind.",
]

