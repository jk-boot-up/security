[[act]]
title = "Rotation: a certificate that lives 8 seconds"
summary = "payments gets a certificate with notAfter - notBefore = 8 seconds, accepted at first, while a caller keeps calling on new connections. Halfway through its life it is renewed: new serial number, later expiry. The ledger reloads a renewed server certificate and a trust file that grows from 1 root to 2, without a restart; Partner Bank CA's certificate for payments goes from handshake refused to 200. After its expiry the first certificate is refused at the handshake, 0 requests reach the ledger, the renewed one gets 200, and of at least 20 calls meanwhile 0 failed."
detail = """
The input: payments' certificate, notAfter - notBefore = 8 seconds, accepted now; a caller keeps calling the ledger on new connections meanwhile.
The renewal, halfway through its life: step ca renew gives a new serial number and a later expiry, and the caller switches to it.
The server reloads without a restart: a renewed server certificate, which clients see; the roots in trust.pem go from 1 to 2 as Partner Bank CA is added, so its certificate that names payments goes from handshake refused to 200. Adding a CA is adding everyone it can mint.
The result: the first certificate after its expiry is refused at the handshake and 0 requests reach the ledger's code; the renewed certificate gets 200; at least 20 calls were made meanwhile, and 0 failed.
"""
figure = "rotation_timeline"
figure_title = "Eight seconds of life"
figure_speech = """
Fourth demo: rotation. [[slnc 400]] At the top, the input: a certificate for payments that lives only eight seconds, on a timeline in seconds. [[slnc 700]]
Halfway, at about four seconds, the amber line. [[slnc 300]] The certificate is renewed: a new serial number and a later expiry. [[slnc 300]] And the ledger reloads its own certificate and its trust file, without a restart. [[slnc 300]] A second authority is added to the trust file, and its certificate for payments is suddenly accepted. [[slnc 700]]
At eight seconds, the rose line: the first certificate expires. [[slnc 300]] After that, it is refused in the handshake. [[slnc 300]] The renewed one still works. [[slnc 300]] And a caller that kept calling the whole time saw no failed call. [[slnc 600]]
A short life is a revocation that always works, as long as renewal never fails.
"""
speech = """
Here is the real output. [[slnc 400]] Eight seconds of life, accepted now, and a caller that keeps calling. [[slnc 400]] Halfway: a new serial number and a later expiry.
[[page]]
The server reloads without a restart. [[slnc 300]] Clients see the new server certificate. [[slnc 300]] The trust file goes from one root to two, and the partner bank's certificate goes from refused to two hundred. [[slnc 400]] The result: after expiry, the first certificate is refused, the renewed one gets two hundred, and no call failed.
"""
