Here is the real output. [[slnc 400]] What step C A issued: a subject and a U R I for each service. [[slnc 400]] Then the chain, two certificates, each one verified by the next, up to the root in the trust file: trusted.
[[page]]
How the ledger reads the identity: not the subject, but the U R I, with the prefix removed: payments. [[slnc 400]] The key is E C, signed with S H A two fifty six and E C D S A, and it lives six hundred seconds: ten minutes.
"""
