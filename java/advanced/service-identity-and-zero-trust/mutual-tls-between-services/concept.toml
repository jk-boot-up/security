[[act]]
title = "A stolen certificate, and revocation"
summary = "A copy of payments' certificate and key, used from another process, gets 200 on POST /transfers. It is revoked at the CA and is on the CA's revocation list (CRL, 1 entry, signature checked). Before the ledger reads the list it still gets 200; after, 403, certificate revoked. payments' own certificate, not revoked, still gets 200."
detail = """
The input: a copy of payments' certificate and key, used from another process. It calls POST /transfers: 200, because a certificate cannot tell who holds its key.
Revoked at the CA: step ca revoke puts its serial number on the CA's revocation list (CRL); the demo fetches it, checks its signature and finds 1 entry.
The result at the ledger: before the ledger reads the list, 200. After it reads the list, 403, certificate revoked. payments' own certificate, not revoked, still gets 200.
The bill: a revocation works only where the list is read; a short lifetime is the revocation that always works; every CA in trust.pem can mint any identity.
"""
figure = "revocation_steps"
figure_title = "Revoked, and still accepted"
figure_speech = """
Last demo: a stolen certificate. [[slnc 400]] At the top, the input: a copy of the payments certificate and its key, used from another process. [[slnc 700]]
Below, the result, step by step. [[slnc 300]] First, the stolen copy calls the ledger: two hundred. [[slnc 300]] A certificate cannot tell who holds its key. [[slnc 500]] Second, the authority revokes it, and its serial number is on the revocation list. [[slnc 300]] Third, the surprise: the ledger still answers two hundred. [[slnc 300]] Nothing told it. [[slnc 500]] Fourth, the ledger reads the list, and the stolen copy gets four oh three. [[slnc 300]] The real payments certificate still works. [[slnc 600]]
A revocation works only where the list is read.
"""
speech = """
Here is the real output. [[slnc 400]] The stolen copy calls the ledger: two hundred. [[slnc 300]] Revoked at the authority: it is on the list. [[slnc 300]] At the ledger, before it reads the list: two hundred. [[slnc 300]] After: four oh three, certificate revoked. [[slnc 300]] The real payments certificate: two hundred.
[[page]]
And the bill. [[slnc 300]] A revocation works only where the list is read. [[slnc 300]] A short lifetime is the revocation that always works. [[slnc 300]] And every authority in the trust file can mint any identity.
"""
rows = { revoked = "active ok" }
console = [
    ["THE INPUT:", "code"],
