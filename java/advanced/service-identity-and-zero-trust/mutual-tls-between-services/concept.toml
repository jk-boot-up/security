# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "mutual-tls-between-services"
level = "advanced"
module = "service-identity-and-zero-trust"
title = "Mutual TLS Between Services"
short_title = "mTLS"
package = "mtls"
main_class = "MutualTlsDemo"
tagline = "Make a bank's services prove who they are with client certificates from a private CA, authorize by that identity and not by the network, and rotate short-lived certificates without downtime"
bold = "A bank's ledger service runs real HTTPS that demands a client certificate from a real private CA (step-ca): a call with no certificate and a call with a certificate from another CA that names itself payments are both refused at the handshake and neither reaches the ledger's code (0 requests); the identity is the URI in the certificate's SAN, so payments is allowed to POST /transfers (200) and refused GET /statements (403), reporting is the other way round, and a valid fraud-engine certificate with no rule gets 403; an allow-the-network rule lets 2 of 2 callers on the same host in, the certificate identity 1 of 2; a certificate that lives 8 seconds is renewed halfway, the server reloads its certificate and trust file without a restart with 0 failed calls out of at least 20 made meanwhile, and the old certificate is refused after its expiry while the renewed one gets 200; a stolen certificate that is revoked at the CA still gets 200 at the ledger until the ledger reads the CA's revocation list, and then gets 403."
domain = "a bank"
domain_note = ""
youtube_description = "Mutual TLS between a bank's services with step-ca and the JDK: client certificates, authorization by the identity in the certificate and not by the network, short-lived certificates renewed with the server reloading trust, and what a revoked certificate can still do."
thumb_lines = ["MUTUAL", "TLS"]
thumb_code = "client cert -> identity -> 200 or 403"
youtube_title = "Mutual TLS Between Services: Client Certificates, Identity and Rotation"
youtube_tags = ["mutual tls", "mtls", "client certificates", "step-ca", "zero trust", "service identity", "certificate rotation", "revocation", "private ca", "java"]

[readme]
intro = """
In ordinary TLS only the server proves who it is. In **mutual TLS** the caller shows a certificate too, so the server learns **which service** is calling and can decide by that identity instead of by the network address. This project runs a bank's **ledger service** as a real HTTPS server (the JDK's `HttpsServer`) that demands a client certificate, and a real private CA, **step-ca**, that issues the certificates; the Java code drives the `step` command line and makes real TLS calls with the JDK's `HttpClient`. The demo is tagged `integration` (needs `step` and `step-ca` on the PATH, about 25 seconds): `./gradlew integrationTest`.

What it shows:
- **Who gets in.** No certificate, or a certificate from another CA that names itself `payments`, is refused at the handshake and **0** requests reach the ledger's code. A server that shows a certificate for another host is refused by the client.
- **Identity from the SAN.** The ledger takes the caller from the URI in the certificate (`spiffe://bank/payments`), not from the subject name. `payments` gets **200** on `POST /transfers` and **403** on `GET /statements`; `reporting` the other way round; `fraud-engine`, with a valid certificate and no rule, gets **403**.
- **Identity, not the network.** An allow-the-network rule lets **2 of 2** callers on the same host in; the certificate identity lets **1 of 2**.
- **Rotation.** A certificate that lives **8 seconds** is renewed halfway; the server reloads its certificate and trust file without a restart, and **0** of at least 20 calls on new connections fail; the old certificate is refused after its expiry and the renewed one gets 200.
- **A compromised certificate.** Revoked at the CA, it still gets **200** at the ledger until the ledger reads the CA's revocation list; then **403**.

**Maps to:** NIST SP 800-207 (zero trust) · NIST SP 800-204B · OWASP ASVS V9 · PCI DSS 4.0 req. 4.2 and 8.6 · RFC 8446, RFC 5280.
"""
analogy = """
A staff door that reads a badge instead of looking at the corridor. Anyone in the corridor is not let in for being there; the badge says who they are and the door knows what that person may open. Badges expire in minutes and are reissued, so a lost badge stops working soon, even if nobody remembers to cancel it.
"""
scenario = """
A bank's payments, reporting and fraud-engine services call a ledger service. The ledger must know which of them is calling, let payments move money, let reporting read statements, and refuse the rest, even from the same host.
"""
costs = [
    "**A CA is now critical infrastructure:** if it is down, nothing renews.",
    "**Short lifetimes need a renewal job that never fails,** and a clock that is right.",
    "**Revocation does not happen by itself:** a server must read the list.",
    "**Every CA in a trust file can mint any identity.**",
    "**Every service needs a key it can keep secret.**",
]
too_much = """
A few services behind one gateway on a private network may be fine with the gateway doing TLS. Use mutual TLS when many services call each other and the network alone cannot say who is calling.
"""
met_before = [
    "An internal API that trusts anything from the office network.",
    "A shared API key in every service's configuration.",
    "A certificate that expired on a Sunday and stopped payments.",
    "A firewall rule named after a subnet that nobody can explain.",
]
where = """
This is the first project of the [service-identity-and-zero-trust](..) module. The service mesh version, where the mesh issues the identities and does the handshake, comes next.
"""
twin = """
step-ca, the step command line, the TLS handshake and the HTTP calls are real and run on this machine. The bank, its services and the endpoints are made up. The demo prints counts and yes or no, never ports, serial numbers or paths.
"""
test_note = "The identity rule and the policy are tested with no tools. The demo starts step-ca and takes about 25 seconds (./gradlew integrationTest)."

[[act]]
title = "Who gets in"
summary = "No certificate, or a certificate from another CA, is refused at the handshake and no request reaches the ledger's code."
detail = """
step-ca issues a certificate to each service, with the identity as a URI in the SAN and a different subject name. The ledger demands a client certificate. A call with none fails, and so does a call with a certificate from another CA that claims to be payments: the ledger's code runs 0 times. The client checks the server too: a ledger that shows a certificate for another host is refused.
"""
speech = """
First demo: who gets in. [[slnc 400]] No certificate, refused. [[slnc 600]] A certificate from another CA that names itself payments, refused, and the ledger's code never runs.
"""
rows = { gate = "active ok" }
console = [
    ["no client certificate: handshake refused", "ok"],
    ["another CA, names itself payments: refused", "ok"],
    ["requests that reached the ledger: 0", "ok"],
]

[[act]]
title = "Identity, not the network"
summary = "payments and reporting get different answers for the same call; an allow-the-network rule lets both in."
detail = """
The ledger reads the identity from the SAN. payments gets 200 on POST /transfers and 403 on GET /statements; reporting gets 200 on GET /statements and 403 on POST /transfers; fraud-engine has a valid certificate and no rule, so 403. A rule that allows the trusted network lets both of two callers on the same host in; the certificate identity lets one.
"""
speech = """
Second demo: identity, not the network. [[slnc 400]] Same host, same call, two answers. [[slnc 600]] The network rule lets both in, the certificate rule lets one.
"""
rows = { identity = "active ok" }
console = [
    ["payments POST /transfers: 200", "ok"],
    ["reporting POST /transfers: 403", "ok"],
    ["by network: 2 of 2, by identity: 1 of 2", "ok"],
]

[[act]]
title = "Rotation"
summary = "A certificate that lives 8 seconds is renewed halfway and the server reloads trust with no failed call; the old one is refused after expiry."
detail = """
A caller's certificate lives 8 seconds. Halfway through, step ca renew gives a new serial number and a later expiry; the server reloads its own certificate and its trust file without a restart, and a second CA added to the trust file is accepted at once. At least 20 calls on new connections run meanwhile, with 0 failures. After 8 seconds the first certificate is refused and the renewed one gets 200.
"""
speech = """
Third demo: rotation. [[slnc 400]] A certificate that lives eight seconds, renewed halfway. [[slnc 600]] The server reloads without a restart, and no call fails.
"""
rows = { rotation = "active ok" }
console = [
    ["lifetime: 8 seconds", "ok"],
    ["calls during the reload: failed 0", "ok"],
    ["first certificate after expiry: refused", "ok"],
    ["renewed certificate: 200", "ok"],
]

[[act]]
title = "A compromised certificate"
summary = "A stolen certificate revoked at the CA still gets 200 until the ledger reads the revocation list."
detail = """
A copy of a certificate and its key works from any process: 200. The CA revokes it and lists it on its revocation list, but the ledger still answers 200 because nothing told it. Once the ledger loads the list it answers 403 with the reason. A certificate that was not revoked is unaffected.
"""
speech = """
Fourth demo: a compromised certificate. [[slnc 400]] Revoked at the CA, and the ledger still says yes. [[slnc 600]] Only when the ledger reads the list does it say no.
"""
rows = { revoked = "active wrong" }
console = [
    ["revoked at the CA: on its list", "ok"],
    ["the ledger afterwards: 200", "bad"],
    ["after loading the list: 403", "ok"],
]

[[act]]
title = "The bill"
summary = "A revocation is only as good as the server that reads it; short lifetimes are the revocation that always works; a CA in the trust file can mint any identity."
detail = """
The CA records a revocation but a server that does not read the list never learns of it. A short lifetime is the revocation that always works, and it costs a renewal job that must not fail. Adding a CA to the trust file lets it mint any identity, payments included: the trust file is part of the policy.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] Revocation needs a reader. [[slnc 600]] Short lifetimes work always, and the trust file is policy.
"""
rows = { bill = "active wrong" }
console = [
    ["revocation needs a server that reads it", "bad"],
    ["short lifetime needs a renewal that never fails", "bad"],
    ["a CA in the trust file can mint any identity", "bad"],
]

[animation]
