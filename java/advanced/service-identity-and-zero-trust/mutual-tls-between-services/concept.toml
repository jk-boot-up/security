[threatmodel]
scope = """
Calls between a bank's services inside its network. It does not cover end users, browsers or the protection of keys in hardware.
"""
assets = [
    "The ledger's transfers and statements.",
    "The private keys of the services.",
    "The CA and its trust file.",
]
actors = [
    "A service with a valid certificate and no business calling an endpoint.",
    "A process on the same host.",
    "A thief holding a copy of a certificate and key.",
    "A second CA that the ledger is told to trust.",
]
boundaries = [
    "The TLS handshake: the chain is checked before any application code runs.",
    "The policy: the identity decides what a caller may do.",
]
assumptions = [
    "Each service keeps its private key secret.",
    "The clocks agree within a second.",
]
out_of_scope = [
    "Hardware-protected keys.",
    "A compromised CA.",
    "Traffic analysis.",
]
tests = [
    "`IdentitiesTest` and `PolicyTest` check the identity rule and the policy with no tools.",
    "`DemoRunsTest` starts step-ca and compares the whole demo with the golden output (integrationTest).",
]
next = """
The next project in the module is service-mesh-mtls.
"""

[[threat]]
id = "T1"
stride = "S"
threat = "A service calls the ledger as another service or with no identity"
where = "the ledger"
control = "Mutual TLS with a private CA; the identity is read from the SAN and authorized per endpoint"
residual = "A service that is allowed too much"

[[threat]]
id = "T2"
stride = "S"
threat = "A certificate from another CA names itself payments"
where = "the trust file"
control = "The chain must lead to a trusted root; a handshake that fails never reaches the code"
residual = "A CA added to the trust file can mint any identity"

[[threat]]
id = "T3"
stride = "E"
threat = "A stolen certificate and key is used from another machine"
where = "the keys"
control = "Lifetimes of minutes or hours, renewal, and a revocation list that the ledger reads"
residual = "Use until expiry if the list is not read"

