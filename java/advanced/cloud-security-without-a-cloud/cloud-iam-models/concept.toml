title = "Cloud IAM Models"
short_title = "Cloud IAM Models"
package = "iammodel"
main_class = "IamModelDemo"
tagline = "Evaluate cloud permission policies the way the provider does: deny wins, accounts must agree, roles narrow, and a deputy can be confused"
bold = "A policy evaluator written in Java follows the documented rules: nothing is allowed until something allows it, an explicit deny anywhere wins, within one account an identity policy or a resource policy is enough and across accounts both are needed, organization policies, permission boundaries and session policies only narrow, a resource policy that names the principal is not narrowed, and a role's trust policy decides who may assume it; with it a service that assumes roles for many customers is fooled until an external id issued per customer is required, a search over the policies finds the harmless-looking permissions that lead to administrator rights, and the model finds the shape of a problem that a real account must confirm."
domain = "a bank"
domain_note = ""
youtube_description = "A cloud permission evaluator written in Java 25 for the policy language of the big providers: identity policies, explicit deny, NotAction, wildcards, conditions and policy variables; resource policies and the difference between one account and two; organization policies; roles with trust policies that ask for a second factor; permission boundaries and session policies that only narrow; a resource policy that names a session; the confused deputy attack on a reporting service that assumes roles in its customers' accounts and the external id that stops it; the same idea between services with a source ARN; and a search for privilege escalation paths."
