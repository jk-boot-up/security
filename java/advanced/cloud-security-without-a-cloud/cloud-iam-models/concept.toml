[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] The policies are J S O N text, and the evaluator is plain Java. [[slnc 300]] Here are the classes that matter."""

[[class]]
name = "Evaluator"
what = "the provider's documented rules, in order"
[[class.part]]
title = "a deny anywhere wins"
code = """
for (Policy pol : p.policies()) {
    if (matches(pol, req, false, true)) {
        return new Decision(false, "explicit deny in " + pol.name());
"""
speech = """The first check looks for a deny statement that matches the request. [[slnc 300]] If one does, the answer is deny, and no allow is looked at."""
[[class.part]]
title = "one account, or two"
code = """
if (sameAccount) {
    ...
    if (identityAllow) {
        return new Decision(true, "allowed by an identity policy");
...
if (identityAllow && resourceAllow) {
    return new Decision(true, "allowed by both accounts");
"""
speech = """In one account, either an identity policy or the resource policy is enough. [[slnc 300]] Across accounts, the code needs both: an and, not an or."""

[[class]]
name = "Wild"
what = "the wildcards * and ? of policy documents"
[[class.part]]
title = "a pattern becomes a regular expression"
code = """
case '*' -> regex.append(".*");
case '?' -> regex.append('.');
...
int flags = ignoreCase ? Pattern.CASE_INSENSITIVE | Pattern.DOTALL : Pattern.DOTALL;
return Pattern.compile(regex.toString(), flags).matcher(value).matches();
"""
speech = """Star matches any run of characters, and a question mark exactly one. [[slnc 300]] Actions are matched ignoring case, resources are not."""

[[class]]
name = "Role"
what = "a trust policy, and the session it gives"
[[class.part]]
title = "the trust policy is the role's resource policy"
code = """
if (!Evaluator.matches(trust, withContext, true, false)) {
    Decision no = new Decision(false, "implicit deny: the trust policy does not allow it");
    return new Session(no, null);
...
String sessionArn = "arn:aws:sts::" + account + ":assumed-role/" + name + "/" + sessionName;
"""
speech = """Assuming a role is a request too: the trust policy must allow the caller, with its conditions. [[slnc 300]] Then the caller gets a session with its own A R N, which carries the role's policies, its boundary and the session policy."""

[[class]]
name = "Steps"
what = "a teaching class: the evaluation order as seven questions"
[[class.part]]
title = "stop at the first answer that decides"
code = """
a.add(deny == null ? "no" : "yes: " + deny);
if (deny != null) {
    return stop(a, false);
...
return new Walk(a, same ? identity || byResource : identity && byResource);
"""
speech = """Steps asks the seven questions one by one, and stops at the first one that decides. [[slnc 300]] A test proves it gives the evaluator's answer for four hundred and twenty requests."""

[[class]]
name = "Escalation"
what = "searches the policies for a path to administrator"
[[class.part]]
title = "pass an admin role to a function"
code = """
boolean passes = can(p, "iam:PassRole", admin.arn(), w.account());
boolean creates = can(p, "lambda:CreateFunction", FUNCTION, w.account());
boolean invokes = can(p, "lambda:InvokeFunction", FUNCTION, w.account());
if (isAdmin(sessionOf(admin), w.account()) && passes && creates && invokes) {
"""
speech = """Each step of a path is a request to the evaluator. [[slnc 300]] If a user may pass an admin role to a function they create and run, that is a path."""

