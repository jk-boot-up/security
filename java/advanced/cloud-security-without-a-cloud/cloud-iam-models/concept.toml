[readme]
intro = """
The advanced track moves from one application to systems, and cloud security begins with one question that every provider answers the same way: **may this principal do this to that?** This project writes the answer in Java. A policy evaluator reads documents in the common JSON form (effect, actions, resources, principals, conditions) and follows the rules the providers document. It runs offline: no cloud account, no network, no Docker. (The sibling that runs the same questions against a local cloud emulator and infrastructure as code belongs to the next projects of the module.)

What it shows:
- **Identity policies.** Default deny; an allow; an **explicit deny** that beats every allow; wildcards in actions (case-insensitive) and resources (case-sensitive); and `Allow` with `NotAction`, which allows *everything else*.
- **Accounts.** Within one account an identity policy or a resource policy is enough; across accounts **both** must say yes (a table of six cases). A bucket policy with `Principal: *` lets someone with no account read; a stranger from another account still needs their own account to allow it. An **organization policy** that does not allow an action stops even an administrator.
- **Roles and the layers that narrow them.** A trust policy that asks for a second factor; eight actions asked of the session: the role allows 6, a **permission boundary** leaves 4, a **session policy** leaves 2, and a session policy can only narrow. A bucket policy that **names the session** is not narrowed by either. Conditions on tags and source address, with policy variables.
- **The confused deputy.** A reporting service assumes a role in each customer's account. Mallory types the bank's role into the service's form and reads the bank's data. The trust policy now asks for the **external id** the service issued to the bank: the bank's request works, Mallory's does not. The same idea between services with `aws:SourceArn`.
- **The bill.** A search that asks the evaluator at each step finds who can make themselves an administrator: carol (assume a developer role that may rewrite its own policy) and ben (pass the admin role to a function he runs), and not ana. Every wildcard is a decision nobody made, and a model finds the shape of a problem that a real account confirms.

**Maps to:** NIST CSF 2.0 Protect (PR.AA access control) · CIS Benchmarks for cloud providers · CWE-266, CWE-269 (privilege management), CWE-441 (unintended proxy, the confused deputy) · OWASP Cloud-Native Application Security Top 10.
"""
analogy = """
A building with guards at several doors. Each guard has a list; one guard's "no" is final, a guest of a neighbouring company needs both companies' guards to agree, a visitor's pass can be narrower than the person's rights but never wider, and a courier who delivers on request must be told whose delivery it is.
"""
scenario = """
An online bank on a cloud: people in one account, an audit account, a reporting service from a third party. The demo asks the evaluator about each of them and turns the answers into a picture of where trust is given.
"""
costs = [
    "**Policies are code that nobody tests:** a wildcard here and a missing condition there are found by an attacker first.",
    "**Every layer must be understood:** identity, resource, organization, boundary, session.",
    "**Trust between accounts is a decision with a party on the other side** whose own mistakes become yours.",
    "**A model is not the service:** it follows the documented rules for a few services and misses the rest.",
    "**Least privilege is work:** broad policies are quick, narrow ones need the requests to be known.",
]
too_much = """
A personal account with one user and nothing in it does not need an evaluator. Use one when several people, accounts and third parties share an environment, and when the policies change often.
"""
met_before = [
    "A JSON policy with `\"Action\": \"*\"` that was \"temporary\".",
    "An error that says \"is not authorized to perform\".",
    "A role that a vendor asked you to create so that they can \"connect\".",
    "A bucket that turned out to be public.",
]
where = """
This is the first project of the [cloud-security-without-a-cloud](..) module of the advanced track. It builds on [access control](../../../intermediate/web-security) and on [secrets management](../../../intermediate/secrets-and-supply-chain/secrets-management-with-openbao) from the intermediate track.
"""
twin = """
Everything is plain Java: the policy documents are parsed with Jackson, the wildcards and conditions are written out, and the accounts, roles and the reporting service are small records. The output is the same on every run.
"""
test_note = "The tests run the evaluator rule by rule: deny, wildcards, NotAction, one account and two, anonymous callers, organization policies, boundaries and session policies, conditions and missing keys, trust policies, the external id, the source ARN and the escalation search."

[[act]]
title = "Identity policies: default deny, allow, explicit deny"
summary = "Nothing is allowed until something allows it; a deny beats every allow; action names ignore case and resource names do not; Allow with NotAction allows everything else."
detail = """
ana's policy allows reading bank-reports and denies reading bank-reports/secret/*. Reading a report is allowed (also with S3:GETOBJECT, because action names ignore case); reading the secret is an explicit deny; writing, reading another bucket, and reading Bank-Reports with a capital are implicit denies (resource names do not ignore case). carol's policy is Allow with NotAction iam:*: deleting a bucket is allowed, creating a user is not.
"""
speech = """
First demo: identity policies. [[slnc 400]] Nothing is allowed until something allows it, and a deny beats every allow. [[slnc 600]]
Action names ignore case. Resource names do not. [[slnc 300]] Allow with not action allows everything else.
"""
rows = { identity = "active ok" }
console = [
    ["ana reads a report: ALLOW; the secret: explicit deny", "ok"],
    ["Bank-Reports with a capital: implicit deny", "bad"],
    ["carol: Allow + NotAction iam:* allows s3:DeleteBucket", "bad"],
]

[[act]]
title = "Accounts: who has to agree"
summary = "In one account either side is enough; across accounts both; Principal * means anyone; an organization policy stops even an administrator."
detail = """
Six cases of a caller in the bank account. A bucket in the same account: an identity policy alone, a bucket policy alone, or both, allow. A bucket in another account: both allow; an identity policy alone is denied because the resource's account does not allow it; a bucket policy alone is denied because the principal's own account does not. A bucket policy with Principal * lets someone with no account at all read; a stranger from another account whose own policies allow nothing cannot, and with a policy of their own that allows it, can. An organization policy that does not allow s3:GetObject stops even an administrator.
"""
speech = """
Second demo: accounts. [[slnc 400]] In one account either side is enough. Across accounts, both must say yes. [[slnc 600]]
A bucket policy for everyone lets anyone on the internet read. [[slnc 300]] An organization policy stops even an administrator.
"""
rows = { accounts = "active ok" }
console = [
    ["same account: identity or bucket policy is enough", "ok"],
    ["other account: both must allow", "ok"],
    ["Principal *: someone with no account can read", "bad"],
]

[[act]]
title = "Roles and the layers that narrow them"
summary = "A trust policy asks for a second factor; a boundary and a session policy narrow 6 actions to 4 to 2; naming the session is stronger than naming the account."
detail = """
ben assumes Developer, whose trust policy asks for a second factor: without it the trust policy does not allow it; with it the trust policy and ben's own policies allow it. Of eight actions the role's own policy allows 6. With a permission boundary of s3:* and dynamodb:* 4 are left; with a session policy passed at assumption, 2; a session policy can only narrow, so asking for everything changes nothing. A bucket policy that names the session itself allows s3:DeleteObject, which neither the boundary nor the session policy would. Conditions on a tag and on the source address allow the payments team from the office network and nobody else.
"""
speech = """
Third demo: roles and the layers that narrow them. [[slnc 400]] The trust policy asks for a second factor. [[slnc 600]]
Six actions, then four with a boundary, then two with a session policy. [[slnc 300]] A bucket policy that names the session is not narrowed.
"""
rows = { roles = "active ok" }
console = [
    ["without MFA: the trust policy does not allow it", "ok"],
    ["role 6 actions; boundary 4; session policy 2", "ok"],
    ["a bucket policy naming the session: DeleteObject allowed", "bad"],
]

[[act]]
title = "The confused deputy"
summary = "A reporting service that assumes roles for many customers reads the bank's data for Mallory until the trust policy asks for the external id issued to the bank."
detail = """
ReportCo reads its customers' buckets by assuming a role each customer made, whose trust policy names ReportCo's account. The bank's own request through ReportCo is allowed. Mallory, another customer, types the bank's role into ReportCo's form: allowed, the service is the deputy and it has been fooled. The trust policy now also asks for the external id that ReportCo issued to the bank: the bank's request is allowed, Mallory's, which carries the id issued to Mallory, is denied. An id that Mallory chooses is no use: it must be issued by the service, one for each customer, and not guessable. Between services the same is done with aws:SourceArn in the condition: a topic that trusts a service publishes for any bucket that asks, and only for the bank's buckets with the condition.
"""
speech = """
Fourth demo: the confused deputy. [[slnc 400]] A reporting service assumes a role in each customer's account. [[slnc 600]]
Mallory gives it the bank's role, and it reads the bank's data for him. [[slnc 300]] The external id, issued to each customer, stops it.
"""
rows = { deputy = "active wrong" }
console = [
    ["Mallory types the bank's role into ReportCo: ALLOW", "bad"],
    ["with the external id: the bank allowed, Mallory denied", "ok"],
    ["aws:SourceArn: Mallory's bucket denied, the bank's allowed", "ok"],
]

[[act]]
title = "The bill"
summary = "A search over the policies finds carol and ben on a path to administrator, and not ana; wildcards are decisions nobody made; a model is not the service."
detail = """
Who can make themselves an administrator, asking the evaluator at every step: ana, no path found. ben passes the admin role to a function he creates and runs (iam:PassRole, lambda:CreateFunction, lambda:InvokeFunction). carol assumes a developer role that may rewrite its own policy (iam:CreatePolicyVersion on DevPolicy). Three of three policies have a wildcard action or resource. This evaluator follows the documented rules for a handful of services; the real service has more, so a model like this finds the shape of a problem and the real service's policy simulator, or a real test account, confirms it.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] A search over the policies finds who can become an administrator. [[slnc 600]]
Carol can, through a role that rewrites its own policy. Ben can, by passing the admin role to a function. Ana cannot. [[slnc 300]] A model finds the shape of a problem. A real account confirms it.
"""
rows = { bill = "active wrong" }
console = [
    ["carol -> assume DevRole -> iam:CreatePolicyVersion => administrator", "bad"],
    ["ben -> iam:PassRole + lambda:CreateFunction + InvokeFunction => administrator", "bad"],
    ["ana: no path found", "ok"],
]

