[[act]]
title = "The confused deputy"
summary = "A reporting service that assumes roles for many customers reads the bank's files for Mallory, until the trust policy asks for the external id the service issued to the bank."
detail = """
The input: ReportCo, a reporting service in account 999999999999, reads each customer's files by assuming a role the customer made. The bank's role ReportCoAccess may read bank-reports/*, and its trust policy allows ReportCo's account.
Before the fix: the bank's own request through ReportCo is allowed, and so is Mallory's, who simply names the bank's role. ReportCo acts with its own rights for whoever asks: it is the confused deputy.
After the fix: ReportCo issued one external id per customer (the-bank ext-bank-7f3a, mallory-corp ext-mallory-91c2), and the trust policy asks for sts:ExternalId equal to ext-bank-7f3a. The bank's request sends that id: ALLOW. Mallory's request sends hers: DENY. She cannot choose the id, because ReportCo issues it.
Between services the same is done with aws:SourceArn: a topic that trusts the notifier publishes for any bucket, and with ArnLike arn:aws:s3:::bank-* only for the bank's buckets.
"""
figure = "deputy_flow"
figure_title = "The deputy, before and after the external id"
figure_speech = """
Fourth demo: the confused deputy. [[slnc 400]] Report Co is a reporting service. [[slnc 300]] It reads each customer's files by assuming a role that the customer made. [[slnc 700]]
At the top, before the fix. [[slnc 300]] The bank's role trusts Report Co's account, and nothing more. [[slnc 300]] The bank's own request is allowed. [[slnc 300]] Then Mallory, another customer, types the bank's role into Report Co's form. [[slnc 300]] Report Co assumes it with its own rights, and reads the bank's files for her. [[slnc 300]] The service is the deputy, and it has been fooled. [[slnc 700]]
At the bottom, after the fix. [[slnc 300]] Report Co issued each customer its own external I D. [[slnc 300]] The bank's trust policy now asks for the bank's I D. [[slnc 300]] Report Co sends the I D of whoever asked, so the bank's request matches, and Mallory's does not.
"""
speech = """
The input: Report Co, its customers, and the bank's role. [[slnc 300]] Before the fix, the trust policy names only Report Co's account. [[slnc 400]] So the bank's request is allowed, and so is Mallory's. [[slnc 300]] Report Co is the deputy, acting with its own rights for whoever asked.
[[page]]
The fix. [[slnc 300]] The external I Ds that Report Co issued, one per customer. [[slnc 300]] The trust policy now asks for the bank's I D. [[slnc 400]] The bank's request sends it, and is allowed. Mallory's sends hers, and is denied. [[slnc 300]] She cannot choose the I D, because Report Co issues it.
[[page]]
The same idea between services. [[slnc 300]] A topic trusts the notifier service. [[slnc 300]] Before, it publishes for any bucket that asks, even Mallory's. [[slnc 300]] After a condition on the source A R N, only the bank's buckets.
"""
