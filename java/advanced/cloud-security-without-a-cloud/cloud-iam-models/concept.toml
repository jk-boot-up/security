[[act]]
title = "The bill"
summary = "A search that asks the evaluator at every step finds carol and ben on a path to administrator, and not ana; every policy here has a wildcard."
detail = """
The input: five policies in the bank account. ana may read bank-reports/*; ben may pass roles and create and invoke functions; carol may assume DevRole; DevRole's DevPolicy allows s3:* and iam:CreatePolicyVersion; AdminRole has Allow * on *.
The result of the search: ana has no path. ben passes AdminRole to a function he creates and invokes, and the function runs as administrator. carol assumes DevRole, whose policy may write a new version of DevPolicy itself.
How carol's path is found, step by step: carol may assume DevRole (ALLOW); the session may create a new version of DevPolicy (ALLOW); version 2 says Allow * on *, and DevRole has it, so the session is an administrator (yes).
3 of 3 statements have a wildcard action or resource. This evaluator follows the documented rules for a handful of services; the real service has more, so a model finds the shape of a problem and the provider's policy simulator, or a test account, confirms it.
"""
figure = "escalation_paths"
figure_title = "Three users, two paths to administrator"
figure_speech = """
Fifth demo: the bill. [[slnc 400]] A search over the policies asks one question: who can make themselves an administrator? [[slnc 300]] Every step is a request to the evaluator. [[slnc 700]]
Ana can only read reports. [[slnc 300]] No path. [[slnc 500]]
Ben may pass a role, create a function, and invoke it. [[slnc 300]] He passes the admin role to a new function and runs it. [[slnc 300]] The function is an administrator, and does what he asks. [[slnc 500]]
Carol was given one harmless looking permission: to assume a developer role. [[slnc 300]] But that role may write a new version of its own policy. [[slnc 300]] One new version, allow star on star, and she is an administrator.
"""
speech = """
The input: the five policies in the bank account. [[slnc 400]] Ana reads reports, ben builds functions, carol may assume the developer role, and two roles exist.
[[page]]
The paths the search found. [[slnc 300]] Ana: none. [[slnc 300]] Ben: pass role, create function, invoke function, administrator. [[slnc 300]] Carol: assume the developer role, then create a policy version, administrator.
[[page]]
How carol's path is found, one request at a time. [[slnc 300]] Each step is allowed. [[slnc 400]] And every one of these policies has a wildcard: each wildcard is a decision nobody made. [[slnc 300]] A model finds the shape of a problem. The real service confirms it.
"""
rows = { bill = "active wrong" }
