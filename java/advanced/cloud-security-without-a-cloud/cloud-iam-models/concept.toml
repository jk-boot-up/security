[docs.problem]
scenario = """
A bank runs on a cloud with several accounts, a third-party reporting service and many policies written over time by different people.
"""
naive = """
Give people broad permissions and hope that nobody misuses them.
"""
deliver = [
    "An evaluator for the policy language, following the documented rules.",
    "The effect of accounts, roles, boundaries and session policies.",
    "The confused deputy attack and its two defences.",
    "A search for paths to administrator rights.",
]

[docs.prerequisites]
required = [
    "Java basics",
    "The intermediate tracks on access control and secrets",
]
not_required = [
    "A cloud account",
]
install = []

[docs.session]
objectives = [
    "decide a request by hand with explicit deny, allow and implicit deny",
    "explain why two accounts must both agree",
    "describe what a boundary and a session policy can and cannot do",
    "explain the confused deputy and the external id",
]
walkthrough = """
Run act two and find the case where one account's allow is not enough. In act three count the actions left at each layer. In act four find the line that makes the attack fail.
"""
exercises = [
    "Add the condition operator DateLessThan and a policy that expires.",
    "Add tag-based access control with aws:ResourceTag and test it.",
    "Add iam:AttachRolePolicy to the escalation search and find a new path.",
    "Write a policy for ana that allows only what the demo shows she uses.",
]

[docs.explained]
sentence = """
A permission is the outcome of several documents that must agree, and the one that says no always wins.
"""
verdict = """
Start from deny, allow narrowly, use conditions for who and from where, put a boundary on roles that others create, require an external id from every third party that assumes a role, look for escalation paths as you would for bugs, and confirm the model against the real service.
"""
recognise = [
    "`\"Effect\": \"Allow\"` with `\"Action\": \"*\"`.",
    "A trust policy that names an account root.",
    "`sts:AssumeRole` in a vendor's setup guide.",
    "An external id field in an integration form.",
]

[spec]
purpose = """
Teach cloud permission evaluation, role trust and the confused deputy by writing the evaluator.
"""
nongoals = [
    "A complete implementation of any provider's service rules.",
    "Running against a cloud.",
    "Policy authoring tools.",
]
problem = """
Cloud permissions come from several documents that interact, and mistakes in them are found by attackers.
"""
roles = [["The policy language", "`Policy`, `Conditions`, `Wild`"], ["The evaluation", "`Evaluator`, `Decision`, `Request`, `Principal`, `Steps`"], ["Roles", "`Role`"], ["The escalation search", "`Escalation`"], ["Entry point", "`IamModelDemo`"]]
requirements = [
    "An explicit deny in any policy denies.",
    "Within one account an identity policy or a resource policy allows; across accounts both are needed.",
    "Organization policies, boundaries and session policies only narrow.",
    "A trust policy decides who may assume a role, with conditions.",
    "The external id and the source ARN stop the confused deputy.",
    "The demo prints the same output on every run.",
]

