First demo: identity policies. [[slnc 400]] On the left, the input: ana's policy. [[slnc 300]] One statement allows her to get and list objects in the bucket called bank reports. [[slnc 300]] A second statement denies getting anything under secret. [[slnc 700]]
In the middle, six requests she makes. [[slnc 300]] On the right, the answers. [[slnc 300]] Reading a report is allowed. [[slnc 300]] The same action in capitals is allowed too, because action names ignore case. [[slnc 300]] Reading the secret matches both statements, and the deny wins. [[slnc 300]] Writing a report, or reading another bucket, is allowed by nothing, so it is denied. [[slnc 600]]
And the last one: bank reports with capital letters is a different bucket, because resource names keep their case. [[slnc 300]] Nothing allows it, so it is denied.
