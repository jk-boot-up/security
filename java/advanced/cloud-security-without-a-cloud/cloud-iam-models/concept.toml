[[scene]]
key = "01-poster"
kind = "poster"
title = "Cloud IAM Models"
narration = "Hello, and welcome. [[slnc 400]] This video explains how cloud permission policies are evaluated, with an evaluator written in Java. [[slnc 300]] I A M is identity and access management: who may do what in a cloud. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] In a cloud, every request asks one question: may this person, or this service, do this action, to that resource? [[slnc 300]] Nothing is allowed until a policy allows it, an explicit deny anywhere wins, two accounts must both agree, and some layers can only narrow what is allowed. [[slnc 600]] Think of a bank vault with several keyholders: one no from anyone keeps it shut. [[slnc 600]] Our example is a bank on a cloud."

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online bank on a cloud:", "  people in its own account", "  a second account beside it", "  a reporting service from a third party", "", "The demo asks the evaluator about each", "request, and searches the policies", "for ways to become an administrator."]
narration = "Here is the scenario. [[slnc 400]] An online bank runs on a cloud: its people in one account, a second account beside it, and a reporting service from a third party. [[slnc 500]] The demo writes their policies in the common J S O N form that the big providers use, and asks the evaluator about each request. [[slnc 500]] Then it searches all the policies for ways that someone could become an administrator. [[slnc 300]] No cloud account is needed: it all runs on your machine."

[[scene]]
key = "02-words"
kind = "bullets"
title = "The Words"
body = ["Principal: who asks (a user, a role session)", "Policy: statements of Allow or Deny", "Identity policy: attached to the principal", "Resource policy: attached to the bucket or topic", "Role: assumed for a while; its trust policy says by whom", "Boundary, session policy: limits that only narrow"]
narration = """Before the demos, the words. [[slnc 500]] A principal is whoever asks: a user, or a session of a role. [[slnc 500]] A policy is a list of statements; each one allows or denies some actions on some resources. [[slnc 500]] An identity policy is attached to the principal. [[slnc 300]] A resource policy is attached to the thing being asked for, such as a storage bucket. [[slnc 500]] A role is assumed for a while, and its trust policy says who may assume it. [[slnc 500]] And a permission boundary or a session policy is a limit: it can only narrow what is allowed, never add to it."""

[[scene]]
key = "02-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "02-ladder"
kind = "figure"
title = "How one request is decided"
body = "decision_ladder"
narration = """Let's see the core idea on one example: how one request is decided. [[slnc 400]] The evaluator asks seven questions, always in the same order, from the top. [[slnc 600]] On the left, request one: ana reads a quarterly report. [[slnc 300]] No deny matches. [[slnc 300]] There is no organization policy, no boundary and no session policy to narrow it. [[slnc 300]] Her identity policy allows it, there is no bucket policy, and the bucket is in her own account. [[slnc 300]] So one side is enough: allow. [[slnc 700]]
On the right, request three: ana reads a file under secret. [[slnc 300]] The very first question is already yes: a deny statement matches. [[slnc 300]] The walk ends there, and nothing below it is even asked. [[slnc 300]] However many allows there are, the answer is deny."""

[[scene]]
key = "03-acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "04-costs"
kind = "bullets"
title = "What It Costs"
body = ["Policies are code that nobody tests", "Every layer must be understood", "Trust between accounts has a party on the other side", "A model is not the real service", "Least privilege is ongoing work"]
narration = "Nothing is free. [[slnc 400]] Here is what it costs. [[slnc 500]] Policies are code, and usually nobody tests them. [[slnc 500]] Every layer, identity, resource, organization, boundary, and session, must be understood to read one answer. [[slnc 500]] Trust between accounts is a decision that involves the party on the other side. [[slnc 500]] A model shows the shape of the rules, but it is not the real service. [[slnc 300]] And least privilege is work that never ends."

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["\"Effect\": \"Deny\" in a policy", "\"Principal\": \"*\" on a storage bucket", "An external ID field in an integration form", "iam:PassRole in a finding"]
narration = "You have probably met this already. [[slnc 400]] An effect of deny, in a policy, wins over every allow. [[slnc 500]] A principal of star, on a storage bucket, lets anyone on the internet in. [[slnc 500]] An external I D field, in a third party's sign-up form, is the defence against the confused deputy. [[slnc 500]] And pass role, in a security finding, is often a path to administrator."

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Default deny; explicit deny for what must never happen", "Both accounts must agree; know which one you are", "Narrow roles with boundaries and sessions", "An external ID for every third-party role", "Search for escalation paths, and test policies"]
narration = "So, how do you use it? [[slnc 400]] Start from deny, and add an explicit deny for what must never happen. [[slnc 500]] Remember that across accounts both sides must agree. [[slnc 300]] Narrow roles with permission boundaries and session policies. [[slnc 500]] Ask for an external I D, and the source of each request, for every role a third party may assume. [[slnc 300]] And search your policies for escalation paths, and test them like code."

[[scene]]
key = "12-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add DateLessThan and a policy", "that expires."]
narration = "That's cloud permission models. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Nothing is allowed until something allows it, a deny anywhere wins, accounts must agree, and the layers above a role can only narrow it. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add the date less than condition, and write a policy that expires. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"

