[[act]]
title = "Accounts: who has to agree"
summary = "In one account either side is enough; across accounts both must allow; Principal * means anyone; an organization policy stops even an administrator."
detail = """
The input: ben, of the bank account 111111111111, asks s3:GetObject on shared-data/file.csv. His identity policy may allow it, the bucket policy may allow his account, and the bucket may sit in his account or in another.
The result, six cases: with the bucket in the same account, either policy alone allows (3 of 3); in another account only both together allow (1 of 3). Identity alone is denied because the bucket's account does not allow it; the bucket policy alone because ben's own account does not.
A bucket policy with Principal * lets someone with no account at all read. A stranger from another account still needs their own policy to allow it. An organization policy that only allows ec2:* denies s3:GetObject even to an administrator with Allow * on *.
"""
figure = "accounts_grid"
figure_title = "One account or two: who has to say yes"
figure_speech = """
Second demo: accounts. [[slnc 400]] Ben, in the bank's account, asks to read a file in a bucket. [[slnc 300]] Two policies can allow it: his own identity policy, and the bucket's policy. [[slnc 700]]
On the left, the bucket is in ben's own account. [[slnc 300]] Either policy alone is enough, so all three cases are allowed. [[slnc 600]]
On the right, the bucket is in another account. [[slnc 300]] Now both must say yes. [[slnc 300]] Only the case where both allow is allowed: one of three. [[slnc 300]] So one account cannot hand out another account's data, and cannot take it either. [[slnc 600]]
At the bottom, a bucket policy with principal star. [[slnc 300]] Someone with no account at all can read. [[slnc 300]] That is anyone on the internet.
"""
speech = """
The input: ben's request, his identity policy, and the bucket policy that allows his account. [[slnc 400]] Then the six answers. [[slnc 300]] In the same account, every case is allowed. [[slnc 300]] In the other account, only the case where both policies allow.
[[page]]
How the rule works out: three of three with or, one of three with and. [[slnc 400]] A bucket open to principal star lets anyone read, while a stranger from another account still needs their own policy. [[slnc 400]] And an organization policy that only allows E C two stops even an administrator from reading.
"""
