Third demo: roles. [[slnc 400]] Ben assumes the role called Developer, with a second factor, and gets a session. [[slnc 300]] Eight actions are asked of that session. [[slnc 700]]
The first column is the role's own policy: S three, Dynamo D B, E C two, and pass role. [[slnc 300]] It allows six of the eight. [[slnc 500]]
The second column adds a permission boundary, S three and Dynamo D B only. [[slnc 300]] An action must now be allowed by both, so four are left. [[slnc 500]]
The third column adds a session policy, passed when the role is assumed. [[slnc 300]] Two are left. [[slnc 600]] Each layer can only take away. [[slnc 300]] None of them can add an action that the role does not allow.
