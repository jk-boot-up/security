# concept.toml: everything about this project that is not Java code.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "cloud-misconfigurations"
level = "advanced"
module = "cloud-security-without-a-cloud"
title = "Cloud Misconfigurations"
short_title = "Cloud Misconfigurations"
package = "cloudmisconf"
main_class = "CloudMisconfigurationsDemo"
tagline = "Deploy a bank's first cloud setup to an AWS emulator, find 13 misconfigurations, fix them, and find the same problems in the code before deploy with Checkov and Trivy"
bold = "On Moto, an emulator of the AWS API that needs no account, a bank's first setup has 13 findings of 9 kinds: a bucket readable by everyone through its ACL, another through its policy, a developer policy that allows every action on every resource, ports 22 and 5432 open to 0.0.0.0/0, a server whose metadata service answers without a token, and disks that are not encrypted; the fixes leave none, but the server and the disks must be replaced; the same setup written as OpenTofu files fails both Checkov and Trivy, which agree on 7 of the 9 kinds and each miss something (Trivy has no check for the wildcard policy or the public bucket policy); a server-side request forgery steals the role's credentials from the metadata service of version 1, version 2 stops a simple fetch with 401 but not a request that can choose its method and headers; a scanner sees the setting, not the intent."
domain = "a bank"
domain_note = ""
youtube_description = "Cloud misconfigurations on a local AWS emulator for a bank: public buckets, a wildcard administrator policy, ports open to the world, the metadata service without a token and unencrypted disks, found by a scanner written in Java, fixed, and found again in OpenTofu files by Checkov and Trivy, with the metadata endpoint attacked and defended."
thumb_lines = ["CLOUD", "MISCONFIG"]
thumb_code = "Principal: *  0.0.0.0/0"
youtube_title = "Cloud Misconfigurations: Finding and Fixing Them on an AWS Emulator (Moto, Checkov, Trivy, IMDSv2)"
youtube_tags = ["cloud misconfiguration", "aws security", "s3 public bucket", "imdsv2", "ssrf", "checkov", "trivy", "moto", "infrastructure as code", "java"]

[readme]
intro = """
Most cloud breaches are not clever. A bucket was public, a policy said `*`, a port was open to the world. This project makes those mistakes on purpose, in a safe place: **Moto**, an open-source emulator of the AWS API (no account, no cost, nothing leaves the machine). A Java program deploys a bank's first setup with the real AWS SDK, scans it with nine rules of its own, applies the fixes and scans again; then the same setup is written as OpenTofu files and read by two real scanners, **Checkov** and **Trivy**, before anything is deployed. LocalStack was the usual choice, but it now needs an account token, so it is not used. It needs Python 3 (a virtual environment with Moto and Checkov is built under `build/`) and Trivy (`brew install trivy`); the tests that use them are tagged `integration`: `./gradlew integrationTest`.

What it shows:
- **The first version.** Two buckets readable by everyone (one by ACL, one by bucket policy), a third that is fine, a policy that allows every action on every resource, ports 22 and 5432 open to `0.0.0.0/0`, a server whose metadata service answers without a token and disks that are not encrypted: **13 findings of 9 kinds**.
- **The fixes.** Public access blocked, encryption and versioning on, a least-privilege policy, ports closed, a server with IMDSv2 and encrypted disks: **0 findings**. Two of the nine fixes mean replacing resources, not editing them.
- **Before deploy.** The same setup as `.tf` files fails Checkov and Trivy. **7 of the 9 kinds** are found by both; Checkov alone finds the wildcard policy and the public bucket policy. The fixed files still draw advice: both ask for a customer-managed key where the rule accepts AES256.
- **The metadata endpoint.** A server-side request forgery against IMDSv1 returns the role's credentials; IMDSv2 answers a simple fetch with 401, a request through a proxy with 403, but a feature that lets the visitor choose the method and a header gets the token and the credentials anyway.
- **The bill.** A scanner sees settings, not intent; an emulator is not the cloud; exceptions need an owner and a date; code and the cloud drift apart.

**Maps to:** NIST CSF 2.0 Protect (PR.PS configuration) · CIS AWS Foundations Benchmark · CWE-732, CWE-918 (SSRF), CWE-311 · MITRE ATT&CK T1530 (data from cloud storage) and T1552.005 (cloud instance metadata API).
"""
analogy = """
A new office building handed over with every door on its default setting. A checklist walk-through before move-in (the scanner on the plans) finds the doors that open to the street; a walk-through after (the scanner on the live building) finds the ones that someone propped open since.
"""
scenario = """
A bank puts its statements, exports and audit log in buckets, gives its developers an account and runs a web server and a database. The demo deploys the first version and attacks it.
"""
costs = [
    "**Scanners disagree,** and each misses something; use more than one.",
    "**Fixes can mean replacement:** a disk cannot be encrypted in place.",
    "**An emulator is not the cloud:** Moto stores the settings but does not enforce every policy.",
    "**Strict rules produce noise:** some findings are a decision, not a mistake.",
    "**Fixed files still draw advice,** and advice has a price.",
]
too_much = """
A throwaway sandbox account with no data does not need nine rules. Scan when the account holds something worth stealing or the code will be reused.
"""
met_before = [
    "A bucket opened for a quick demo and never closed.",
    "A policy with Action star.",
    "A security group with 0.0.0.0/0 on SSH.",
    "A scanner report of hundreds of findings that nobody reads.",
]
where = """
This is the third project of the [cloud-security-without-a-cloud](..) module, after [cloud-iam-models](../cloud-iam-models) and [network-isolation](../network-isolation). The scanners in act three are the subject of iac-scanning.
"""
twin = """
Moto answers the same API calls as AWS, so the SDK code is the code you would run against the cloud; only the endpoint differs. Instance and volume ids are never printed.
"""
test_note = "The metadata service and the file mapping are tested with no tools. The rest start Moto, Checkov and Trivy (./gradlew integrationTest)."

[[act]]
title = "The first version"
summary = "Deployed with the AWS SDK to Moto, the setup has 13 findings of 9 kinds."
detail = """
Three buckets: bank-statements with a public-read ACL, bank-exports with a policy for everyone, and bank-audit, which is fine. A policy that allows every action on every resource, a web group with 22 and 443 open to the world, a database group with 5432 open, a server with the metadata service answering without a token and an unencrypted disk. The scanner reports 13 findings: 3 critical, 5 high, 3 medium... of nine kinds of rule.
"""
speech = """
First demo: the bank's first version. [[slnc 400]] Deployed with the real SDK to an emulator. [[slnc 600]]
Two buckets that anyone can read. A policy that allows everything. Ports open to the world. [[slnc 300]] Thirteen findings.
"""
rows = { first = "active wrong" }
console = [
    ["bank-statements: public ACL", "bad"],
    ["developer-everything: Action *, Resource *", "bad"],
    ["13 findings of 9 kinds", "bad"],
]

[[act]]
title = "The fixes"
summary = "Public access blocked, least privilege, ports closed, IMDSv2, encryption: 0 findings, and two resources replaced."
detail = """
The buckets get a public access block, encryption and versioning; the policies are replaced; the ingress rules are revoked; the server and the disks are deleted and created again, because the metadata options and the encryption of a disk cannot be changed in place. The scanner reports nothing.
"""
speech = """
Second demo: the fixes. [[slnc 400]] Block public access, narrow the policy, close the ports. [[slnc 600]]
The server and the disks have to be replaced. [[slnc 300]] The scan finds nothing.
"""
rows = { fixes = "active ok" }
console = [
    ["public access blocked, encryption and versioning on", "ok"],
    ["server and disks replaced, not edited", "ok"],
    ["0 findings", "ok"],
]

[[act]]
title = "Before deploy: Checkov and Trivy"
summary = "The same setup as OpenTofu files fails both scanners, which agree on 7 of the 9 kinds."
detail = """
The setup written as main.tf in two versions. Both scanners fail the first. Of our nine rules, 7 are found by both; Checkov alone finds the wildcard policy and the public bucket policy, and Trivy has no check for either. On the fixed files none of the nine problems is left except encryption: both tools ask for a customer-managed key where the rule accepts AES256.
"""
speech = """
Third demo: before deploy. [[slnc 400]] The same setup, written as files, read by Checkov and Trivy. [[slnc 600]]
They agree on seven of nine. [[slnc 300]] Each one misses something, so use both.
"""
rows = { scan = "active ok" }
console = [
    ["both fail the first version", "ok"],
    ["found by both: 7 of 9", "ok"],
    ["Trivy misses the wildcard policy", "bad"],
]

[[act]]
title = "The metadata endpoint"
summary = "A request forgery reads the role's credentials from IMDSv1; IMDSv2 stops a simple fetch but not a forgery that sets headers."
detail = """
A server on a loopback port answers like the metadata service in both versions. A web feature that fetches a link on the visitor's behalf gets the credentials from version 1 and a 401 from version 2. A feature that lets the visitor choose the method and a header does the PUT for a token, then the GET: version 2 hands over the credentials too. A request that came through a proxy is refused with 403 in both.
"""
speech = """
Fourth demo: the metadata endpoint. [[slnc 400]] Version one gives the credentials to a simple fetch. [[slnc 600]]
Version two refuses it. [[slnc 300]] But a feature that sets the method and a header gets through.
"""
rows = { imds = "active wrong" }
console = [
    ["v1: url fetch 200, credentials leaked", "bad"],
    ["v2: url fetch 401", "ok"],
    ["v2: request forgery 200, leaked", "bad"],
]

[[act]]
title = "The bill"
summary = "Scanners see settings, not intent; the emulator is not the cloud; two fixes replace resources."
detail = """
Two of the nine fixes replace a resource. A scanner sees the setting, not the intent: a public bucket for a website needs a written exception with an owner and a date. Moto stores configuration but does not enforce it the way AWS does, so the emulator tests the code, not the cloud. Scan the files before deploy and the account on a schedule, because code and the cloud drift apart.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] A scanner sees the setting, not the intent. [[slnc 600]]
The emulator is not the cloud. [[slnc 300]] Scan the files, and scan the account.
"""
rows = { bill = "active wrong" }
console = [
    ["2 of 9 fixes replace a resource", "bad"],
    ["a public website bucket needs a dated exception", "ok"],
    ["scan the files and the account", "ok"],
]

