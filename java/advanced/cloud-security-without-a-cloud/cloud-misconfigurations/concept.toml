[[scene]]
key = "01-poster"
kind = "poster"
title = "Cloud Misconfigurations"
narration = "Hello, and welcome. [[slnc 400]] This video explains cloud misconfigurations, found and fixed on a local A W S emulator. [[slnc 300]] A W S is Amazon Web Services, the largest public cloud. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] Most cloud breaches are not clever. [[slnc 300]] A storage bucket was public, a policy allowed everything, a port was open to the whole internet. [[slnc 300]] Each one is a setting someone chose, or forgot. [[slnc 300]] This project makes those mistakes on purpose, in a safe emulator, finds them with a scanner, fixes them, and finds them again in the files before deploy. [[slnc 600]] Think of a new branch office, opened with the back door propped open and the safe left unlocked. [[slnc 600]] Our example is a bank."

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["A bank's first cloud setup:", "  buckets for statements, exports, audit logs", "  a policy for its developers", "  a web server, a database, two disks", "", "Deployed with the real AWS SDK to Moto,", "an emulator: no account, nothing leaves", "the machine."]
narration = "Here is the scenario. [[slnc 400]] A bank's first cloud setup: storage buckets for statements, exports, and audit logs, a policy for its developers, a web server, a database, and two disks. [[slnc 500]] A Java program deploys it with the real A W S S D K, the software development kit, to Moto, an open source emulator of the A W S A P I. [[slnc 300]] There is no account, no cost, and nothing leaves the machine. [[slnc 500]] Then it scans the setup, fixes it, scans the same setup as files, and attacks the server's metadata service."

[[scene]]
key = "02-words"
kind = "bullets"
title = "The Words"
body = ["Bucket: a store of files (objects) in the cloud", "ACL and bucket policy: two ways to share a bucket", "Public access block: a switch that refuses both", "Policy: what an identity may do, on what", "Security group: a firewall around a server", "Metadata service: where a server gets its keys", "Infrastructure as code: the setup, as files"]
narration = """Before the demos, the words. [[slnc 500]] A bucket is a store of files, called objects, in the cloud. [[slnc 500]] An access control list and a bucket policy are two ways to share a bucket, and both can share it with everyone. [[slnc 500]] A public access block is a switch that refuses both. [[slnc 500]] A policy says what an identity may do, on which resources. [[slnc 500]] A security group is a firewall around a server: which ports are open, to which addresses. [[slnc 500]] The metadata service is a local address where a server gets its own credentials. [[slnc 500]] And infrastructure as code means the whole setup is written as files, so it can be read before it exists."""

[[scene]]
key = "02-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "02-one-bucket"
kind = "figure"
title = "One bucket: settings in, findings out"
body = "one_bucket"
narration = """Let's see the core idea on one example: one bucket. [[slnc 400]] A scanner does not guess. [[slnc 300]] It reads each setting through the A P I, and a rule judges each one. [[slnc 600]] At the top, bank statements. [[slnc 300]] Public is A C L: the access control list lets everyone read it. [[slnc 300]] That fires the critical rule, s three public A C L. [[slnc 300]] The block is none, so nothing stops it: a high finding. [[slnc 300]] Encryption is none: a medium finding. [[slnc 300]] And versions are off, so a deleted file is gone: a low finding. [[slnc 700]]
At the bottom, the audit bucket, set up the right way. [[slnc 300]] Not public, fully blocked, encrypted, versioned. [[slnc 300]] No rule fires. [[slnc 600]] The whole scan is just this, done for every bucket, policy, group, server and disk."""

[[scene]]
key = "03-acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "04-costs"
kind = "bullets"
title = "What It Costs"
body = ["Scanners disagree, and each misses something", "Some fixes mean replacing a resource", "An emulator is not the cloud", "Strict rules produce noise and exceptions", "Fixed files still draw advice"]
narration = "Nothing is free. [[slnc 400]] Here is what it costs. [[slnc 500]] Scanners disagree, and each one misses something, so one alone is not enough. [[slnc 500]] Some fixes, like disk encryption, mean replacing a resource, not editing it. [[slnc 500]] An emulator answers like the cloud, but it does not enforce everything the cloud enforces. [[slnc 500]] Strict rules produce noise, and the exceptions need an owner and a date. [[slnc 300]] And even fixed files draw advice, like asking for a key of your own."

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["\"Principal\": \"*\" in a bucket policy", "\"Action\": \"*\" with \"Resource\": \"*\"", "0.0.0.0/0 on port 22 or 5432", "HttpTokens: optional on a server"]
narration = "You have probably met this already. [[slnc 400]] A principal of star, in a bucket policy, is a bucket anyone can read. [[slnc 500]] An action of star, with a resource of star, is an administrator in disguise. [[slnc 500]] Every address allowed on port twenty two or fifty four thirty two puts the server or the database on the internet. [[slnc 500]] And H T T P tokens set to optional is the old metadata service, which gives out credentials to a simple request."

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Block public access at the account", "Least-privilege policies; never * on *", "No admin ports open to the world", "IMDSv2 required on every server", "Encrypt disks and buckets from the start", "Scan the files before deploy, and the account after"]
narration = "So, how do you use it? [[slnc 400]] Block public access for the whole account. [[slnc 300]] Write least privilege policies, never star on star. [[slnc 500]] Keep admin and database ports off the internet. [[slnc 300]] Require version two of the metadata service on every server, which is an edit, not a rebuild. [[slnc 500]] Encrypt disks and buckets from the start, because changing it later means replacing them. [[slnc 300]] And scan the files before deploy, with more than one tool, and the live account after."

[[scene]]
key = "12-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a tenth rule for a bucket", "without logging."]
narration = "That's cloud misconfigurations. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Most cloud breaches are settings, so scan the files before deploy, scan the account after, and plan to replace what cannot be edited. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a tenth rule, for a bucket without access logging. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] The scanner reads the account, the rules judge what it read, and the fixes are plain S D K calls. [[slnc 300]] Here are the classes that matter."""

[[class]]
name = "Scanner"
what = "reads the account through the SDK, like an auditor's tool"
[[class.part]]
title = "who the ACL lets in"
code = """
for (Grant g : c.s3().getBucketAcl(r -> r.bucket(name)).grants()) {
    if (EVERYONE.equals(g.grantee().uri())) {
        publicAcl = g.permissionAsString();
"""
speech = """The scanner only reads. [[slnc 300]] For each bucket it asks for the access control list, and looks for a grant to the group of all users. [[slnc 300]] What it reads goes into a snapshot of plain values."""

[[class]]
name = "Rules"
what = "the nine rules, run on the snapshot, with no emulator"
[[class.part]]
title = "star on star"
code = """
if (st.effect().equals("Allow") && st.action().equals("*")
        && st.resource().equals("*")) {
    out.add(new Finding("iam-wildcard-admin", "CRITICAL", p.name(),
            "allows every action on every resource"));
"""
speech = """Each rule is a plain if. [[slnc 300]] An allow statement with every action on every resource is a critical finding. [[slnc 300]] Because the rules read plain values, the unit tests need no emulator."""
[[class.part]]
title = "admin ports to the world"
code = """
static final Set<Integer> ADMIN_PORTS = Set.of(22, 3389, 5432, 3306, 6379, 27017, 9200);
...
if (i.cidr().equals(WORLD) && ADMIN_PORTS.contains(i.port())) {
"""
speech = """Our rule lists database ports as well as remote login ports. [[slnc 300]] That is why it finds port fifty four thirty two, where both scanners stay silent."""

[[class]]
name = "Environment"
what = "deploys the first version, and logs every fix it makes"
[[class.part]]
title = "an edit, then a replacement"
code = """
c.ec2().modifyInstanceMetadataOptions(r -> r.instanceId(old.instanceId())
        .httpTokens(HttpTokensState.REQUIRED).httpPutResponseHopLimit(1));
done.add(new Fix("edit", "tokens required, hop limit 1 on server web"));
c.ec2().terminateInstances(t -> t.instanceIds(old.instanceId()));
"""
speech = """Version two of the metadata service is switched on in place, on the running server. [[slnc 300]] Then the server is still replaced, because its root disk must be encrypted, and that only happens when a disk is made."""

[[class]]
name = "IacScanners"
what = "runs Checkov and Trivy on the files, at pinned versions"
[[class.part]]
title = "a pinned image, its own checks"
code = """
static final String TRIVY_IMAGE = "aquasec/trivy:" + TRIVY_VERSION;
...
"config", "--format", "json", "--quiet",
"--skip-version-check", "--skip-check-update", "/src"));
"""
speech = """Trivy runs from a pinned image, and skip check update keeps the checks that came with it. [[slnc 300]] So the counts in the demo do not change when new checks are published."""
[[class.part]]
title = "the check that fired, or a dash"
code = """
public String first(List<String> candidates) {
    return candidates.stream().filter(ids()::contains).findFirst().orElse("-");
"""
speech = """For each of our rules, a map lists the matching check ids of each tool. [[slnc 300]] The first one that failed is printed, or a dash when the tool has none."""

[[class]]
name = "Imds"
what = "the metadata service, in both versions, on a loopback port"
[[class.part]]
title = "a token first, but not through a proxy"
code = """
if (ex.getRequestMethod().equals("PUT") && path.equals(TOKEN_PATH)) {
    if (ex.getRequestHeaders().containsKey("X-Forwarded-For")) {
        status = 403;   // a token request that came through a proxy is refused
...
if (tokenRequired && (t == null || !tokens.containsKey(t))) {
    status = 401;
"""
speech = """A put on the token path hands out a token, unless the request came through a proxy. [[slnc 300]] With tokens required, a get without a valid token gets four oh one. [[slnc 300]] Version one skips that check."""

