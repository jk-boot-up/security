[[act]]
title = "The fixes, made with the same SDK"
summary = "Nine changes, 7 edits in place and 2 replacements, take the account from 13 findings to 0. Switching on IMDSv2 is an edit; encrypting a disk means a new disk, and for the root disk a new server."
detail = """
The input is the 13 findings. The fixes are SDK calls, each logged as it is made: the ACL set to private, the public bucket policy deleted, a full public access block, AES256 and versions on both buckets, a new policy version that allows only s3:GetObject on bank-statements, ports 22 and 5432 closed, and the metadata options switched to tokens required with a hop limit of 1, in place.
A disk cannot be encrypted after it was made, so the data disk is replaced by an encrypted one and the server by a new one with an encrypted root disk: 9 changes = 7 edits + 2 replacements. The scanner reads the account again: every bucket blocked, AES256 and versioned, no world-open admin port, tokens required, 2 disks and 2 encrypted. 0 findings.
"""
figure = "fixes"
figure_title = "Nine changes take thirteen findings to none"
figure_speech = """
Second demo: the fixes, made with the same S D K. [[slnc 400]] On the left, the nine changes, in the order they were made. [[slnc 300]] Green ones are edits, made in place. [[slnc 300]] Amber ones are replacements: the old resource is deleted, and a new one is created. [[slnc 700]]
Seven are edits. [[slnc 300]] The buckets are closed, encrypted and versioned. [[slnc 300]] The policy is narrowed to reading one bucket. [[slnc 300]] The two ports are closed. [[slnc 300]] And version two of the metadata service is switched on, on the running server. [[slnc 600]]
Two are replacements. [[slnc 300]] A disk is encrypted only when it is made. [[slnc 300]] So the data disk is new, and the server is new too, because its root disk must be encrypted. [[slnc 600]]
On the right, the result: thirteen findings before, none after.
"""
