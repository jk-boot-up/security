[[act]]
title = "The metadata endpoint, reached through the web server"
summary = "A link fetch reads the role's credentials from IMDSv1 (200) and gets 401 from IMDSv2. A webhook tester that lets the visitor set the method and a header gets a 36-character token with PUT and the credentials with GET, even from IMDSv2. Through a proxy that adds X-Forwarded-For, IMDSv2 refuses the token request with 403; IMDSv1 still answers."
detail = """
The metadata service runs on a loopback port in both versions. The input of the first request is a plain GET of /latest/meta-data/iam/security-credentials/web-role, made by a feature that fetches a link for the visitor; version 1 answers 200 with the credentials, version 2 answers 401 because there is no token.
A webhook tester lets the visitor choose the method and one header: a PUT to /latest/api/token with a TTL header gets a token of 36 characters, and a GET with X-aws-ec2-metadata-token gets the credentials from version 2 too. Behind a proxy that adds X-Forwarded-For, version 2 refuses the token PUT with 403 and the GET without a token with 401; version 1 still answers 200. A hop limit of 1 also stops a token from reaching a container one network hop further.
"""
figure = "imds_paths"
figure_title = "Three ways to the metadata service"
figure_speech = """
Fourth demo: the metadata service. [[slnc 400]] Every cloud server can ask a local address for its role's credentials. [[slnc 300]] If a web feature can be tricked into calling that address, that is server side request forgery. [[slnc 700]]
Top lane: a feature that fetches a link. [[slnc 300]] Version one answers any get, and the credentials leak. [[slnc 300]] Version two answers four oh one, because there is no token. [[slnc 600]]
Middle lane: a webhook tester, where the visitor chooses the method and a header. [[slnc 300]] It sends a put for a token, then a get with the token. [[slnc 300]] Version two answers both, and the credentials leak. [[slnc 600]]
Bottom lane: the same, through a proxy that adds the forwarded for header. [[slnc 300]] Version two refuses the token request. [[slnc 300]] Version one still answers.
"""
speech = """
The first request: a plain get of the role's address. [[slnc 300]] Version one answers two hundred, with the credentials. [[slnc 300]] Version two answers four oh one. [[slnc 500]] Then the webhook tester: a put for a token, then a get with the token header. [[slnc 300]] Version two hands out a token of thirty six characters, and then the credentials.
[[page]]
The same requests through a proxy. [[slnc 300]] Version one still answers. [[slnc 300]] Version two refuses the token request with four oh three, so the get has no token, and gets four oh one.
"""
rows = { imds = "active wrong" }
console = [
    ["THE REQUEST (a feature that fetches a link for the visitor):", "code"],
    ["  GET /latest/meta-data/iam/security-credentials/web-role", "muted"],
