]

[docs.problem]
scenario = """
A bank moves its statements, exports and audit log to the cloud and gives its developers an account.
"""
naive = """
Click through the console until it works, and open whatever is in the way.
"""
deliver = [
    "A real SDK against an emulator.",
    "Nine rules and a scan before and after the fixes.",
    "Checkov and Trivy on the same setup as files.",
    "The metadata service attacked and defended.",
]

[docs.prerequisites]
required = [
    "Java basics",
    "Python 3 (for the Moto and Checkov virtual environment)",
    "Trivy",
]
not_required = [
    "A cloud account",
    "LocalStack or its token",
]
install = ["python3", "trivy"]

[docs.session]
objectives = [
    "name the common cloud misconfigurations",
    "scan an account and fix the findings",
    "scan infrastructure files before deploy",
    "explain IMDSv1, IMDSv2 and what neither stops",
]
walkthrough = """
Run act one and group the 13 findings into their nine kinds. In act three find the two kinds that Trivy misses. In act four read the three IMDS lines.
"""
exercises = [
    "Add a tenth rule for a bucket without logging.",
    "Make the fixed files pass the customer-managed key checks.",
    "Add an exception list with an owner and an expiry date.",
    "Make the scan a test that fails the build on a critical finding.",
]

[docs.explained]
sentence = """
Most cloud breaches are settings, so look for the settings in the code before deploy and in the account afterwards.
"""
verdict = """
Block public access by default, give every identity only what it needs, close administrative ports, require IMDSv2 and encrypt disks, scan the files in the build and the account on a schedule, and write down every exception with an owner and a date.
"""
recognise = [
    "`Principal: *` in a bucket policy.",
    "`Action: *` with `Resource: *`.",
    "`cidr_blocks = [\"0.0.0.0/0\"]` on port 22.",
    "`http_tokens = \"optional\"`.",
]

[spec]
purpose = """
Teach cloud misconfigurations by deploying, scanning, fixing and attacking a bank's setup on an emulator.
"""
nongoals = [
    "Real AWS accounts.",
    "Policy evaluation (see cloud-iam-models).",
    "Runtime threat detection.",
]
problem = """
Cloud settings are easy to get wrong and hard to see.
"""
roles = [["The account", "`Environment`"], ["The emulator", "`Venv.Moto`"], ["The scanner", "`Scanner`"], ["The file scanners", "`IacScanners`"], ["The metadata service", "`Imds`"], ["Entry point", "`CloudMisconfigurationsDemo`"]]
requirements = [
    "The setup is deployed with the AWS SDK to a local emulator.",
    "Nine rules scan buckets, policies, groups, servers and disks.",
    "The fixes leave no findings.",
    "Checkov and Trivy scan the same setup as files and are compared.",
    "The metadata service is simulated in both versions.",
    "The demo prints the same output on every run and never prints an id.",
]

