[[act]]
title = "What the scanners and the emulator cannot tell"
summary = "On bank-audit, whose public access is blocked, Moto accepts a public bucket policy and a public-read ACL with 200, where AWS refuses both with 403 AccessDenied; the scan of the account afterwards shows 2 CRITICAL findings. Replacement, intent and drift are left for people."
detail = """
The input is two calls on bank-audit, which has a full public access block: PutBucketPolicy with Principal * for s3:GetObject, and PutBucketAcl public-read. Moto answers 200 to both; AWS would answer 403 AccessDenied, because it enforces the block. So the emulator tests the code, not the cloud: the scan of the account afterwards finds s3-public-acl and s3-public-policy on bank-audit, 2 CRITICAL.
What is left for people: a disk is encrypted only when it is made, so plan replacements; a public website bucket looks like a leak to every scanner and needs a written exception with an owner and a date; and code and the account drift apart, so scan the files before deploy and the account after.
"""
figure = "emulator_gap"
figure_title = "Moto accepts what AWS refuses"
figure_speech = """
Fifth demo: what the tools cannot tell. [[slnc 400]] The audit bucket blocks all public access. [[slnc 300]] Then two calls try to open it: a bucket policy for everyone, and a public read A C L. [[slnc 700]]
Moto answers two hundred to both, accepted. [[slnc 300]] The real A W S would answer four oh three, access denied, because it enforces the block. [[slnc 300]] An emulator stores the settings, but does not enforce them all. [[slnc 600]]
Below, the scan of the account afterwards. [[slnc 300]] It finds both: two critical findings on the audit bucket. [[slnc 300]] So test the code on the emulator, and scan the real account on a schedule.
"""
