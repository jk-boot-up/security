main_class = "CloudMisconfigurationsDemo"
tagline = "Deploy a bank's first cloud setup to an AWS emulator, find 13 misconfigurations, fix them, and find them again in the files with Checkov and Trivy"
bold = "On Moto, an emulator of the AWS API that needs no account, a bank's first setup gives 13 findings from 9 rules: two buckets anyone can read (by ACL and by bucket policy), a policy that allows * on *, ports 22 and 5432 open to 0.0.0.0/0, a metadata service that answers without a token and unencrypted disks; 7 edits and 2 replacements leave none. The same setup as OpenTofu files fails Checkov and Trivy, which agree on 7 of the 9 rules, and neither flags port 5432. A link fetch steals the role's credentials from IMDSv1; IMDSv2 stops it, but not a feature that sets the method and a header. And Moto accepts a public policy on a blocked bucket that AWS would refuse: an emulator tests the code, not the cloud."
domain = "a bank"
