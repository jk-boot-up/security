[project]
slug = "network-isolation"
level = "advanced"
module = "cloud-security-without-a-cloud"
title = "Network Isolation"
short_title = "Network Isolation"
package = "netiso"
main_class = "NetworkIsolationDemo"
tagline = "Measure what a taken-over service can reach on a flat network, on coarse networks and on a layout built from the design, and compare the measurement with the intent"
bold = "On real Docker networks, a taken-over front on one flat network reaches the database, the cache, the admin panel and the build server (15 of 15 pairs can talk, the design wanted 6); three coarse networks cut that to 8 pairs and the front reaches only the application, but members of one network reach each other, so 2 pairs nobody asked for exist; a layout built from the design as code, one internal network for each allowed pair, measures exactly 6 pairs, and a service joined to one more network is found as drift by measuring against the intent; internal networks have no way out, the front keeps one; reachable is not authorised and the Docker socket is worth more than every rule."
domain = "an online store"
domain_note = ""
youtube_description = "Network segmentation measured on real Docker networks for an online store's six services: one flat network where a taken-over front reaches the database, the cache, the admin panel and the build server; three coarse networks; a layout generated from the design as code with one internal network for each allowed pair; drift found by comparing what can talk with what should; published ports; and which services can reach a server on the internet."
thumb_lines = ["NETWORK", "ISOLATION"]
thumb_code = "nc -z -w1 db 5432"
youtube_title = "Network Isolation: Measuring What a Taken-Over Service Can Reach (Docker Networks, Intent as Code)"
youtube_tags = ["network segmentation", "network isolation", "docker networks", "lateral movement", "blast radius", "security groups", "zero trust", "cloud security", "drift detection", "java"]

[readme]
intro = """
Every cloud calls it something different (a VPC, a security group, a subnet, a network policy), and they all answer one question: **if this service is taken over, what can it reach?** This project answers it by measuring. It builds real Docker networks for a shop of six services, each a container listening on its port, and tries to connect from inside each container. It needs Docker; the tests are tagged `integration` (the intent tests are not): `./gradlew integrationTest`. The demo takes about two minutes, most of it connection attempts that time out, which is how a closed port looks from inside.

What it shows:
- **One flat network.** Six containers, one network. The taken-over front reaches the application, the database, the cache, the admin panel and the build server; **15 of 15 pairs** can talk, and the design wanted 6.
- **Three coarse networks.** Front (web, app), back (app, db, cache, admin, internal) and management (admin, ci, internal). The front reaches only the application, by name and by address. But everything on a network reaches everything else on it: **8 pairs**, of which 2 nobody asked for (`admin-cache`, `cache-db`).
- **The design as code, and a layout built from it.** The intent is six pairs. One internal network for each pair, each service on the networks of its pairs: measured **6 pairs, 0 extra, 0 missing**. Someone with the Docker socket joins web and db to one more network, and measuring against the intent finds `db-web` at once.
- **The edge.** Only the front is published to the host (and only on a network that is not internal); of the six, only the front can reach a server on the internet side: internal networks have no way out.
- **The bill.** A service on several networks is a pivot; reachable is not authorised; the Docker socket beats every rule; one network for each pair does not scale, which is why clouds have security groups and clusters network policies; and the network is what you measure, not what you draw.

**Maps to:** NIST CSF 2.0 Protect (PR.IR network integrity) · CIS Benchmarks (Docker, cloud network sections) · CWE-923, CWE-1327 (binding to an unrestricted address) · MITRE ATT&CK lateral movement (TA0008).
"""
analogy = """
A building where every door is unlocked from the inside. If a burglar gets into the lobby, can they reach the vault? Painting the corridors different colours changes nothing; walking the corridors with a stopwatch, from every room, tells you what a burglar could do.
"""
scenario = """
An online store with a web front, an application, a database, a cache, an admin panel and a build server. The demo takes over the front, then the rest, and counts what each can reach.
"""
costs = [
    "**More networks mean more to manage,** and a layout that is not generated drifts.",
    "**The measurement takes time:** a closed port is found by waiting.",
    "**A service on two networks is a bridge** between them.",
    "**Segmentation is not authentication:** a reachable port still has to say no to the wrong caller.",
    "**Egress is easy to forget,** and it is how stolen data leaves.",
]
too_much = """
A development laptop with three containers does not need a network design. Segment when the services are not equally trusted: when one is on the internet and another holds data.
"""
met_before = [
    "A compose file with a single default network.",
    "A security group with 0.0.0.0/0 on every port.",
    "An internal flag on a Docker network.",
    "A firewall change that was made in the console and never written down.",
]
where = """
This is the second project of the [cloud-security-without-a-cloud](..) module, after [cloud-iam-models](../cloud-iam-models). The same question for Kubernetes is the subject of kubernetes-network-policies.
"""
twin = """
The networks and containers are real; the checks are connections from inside the containers, made with nc. Names and addresses are never printed, only which services reach which, so the output is the same on every run.
"""
test_note = "The intent and the comparison are tested with no Docker. The rest create real networks and containers and remove them (./gradlew integrationTest)."

[[act]]
title = "One flat network"
summary = "A taken-over front reaches the database, the cache, the admin panel and the build server; 15 of 15 pairs can talk."
detail = """
Six containers on one Docker network, each listening on its port. The front is taken over; what it reaches by name: app, db, cache, admin and ci. Pairs that can talk, in either direction: 15 of 15; the design wanted 6.
"""
speech = """
First demo: one flat network. [[slnc 400]] The front is taken over. [[slnc 600]]
It reaches the application, the database, the cache, the admin panel, and the build server. [[slnc 300]] Fifteen pairs can talk. The design wanted six.
"""
rows = { flat = "active wrong" }
console = [
    ["web reaches app, db, cache, admin, ci", "bad"],
    ["15 of 15 pairs can talk", "bad"],
    ["the design wanted 6", "ok"],
]

[[act]]
title = "Three networks: front, back, management"
summary = "The front reaches only the application, but members of one network reach each other: 8 pairs, 2 of them unwanted."
detail = """
Web and app on front; app, db, cache and admin on back, an internal network with no route out; admin and ci on management. The front is taken over: it reaches the application only, by name and by address after scanning every address it can learn. Pairs that can talk: 8 of 15, the design wanted 6, extra: 2 (admin-cache and cache-db), missing: 0. Everything on a network can talk to everything else on it.
"""
speech = """
Second demo: three networks. [[slnc 400]] The front now reaches only the application. [[slnc 600]]
But everything on a network talks to everything else on it, so two pairs exist that nobody asked for.
"""
rows = { coarse = "active ok" }
console = [
    ["web reaches app only, by name and by address", "ok"],
    ["8 of 15 pairs; the design wanted 6", "bad"],
    ["extra: admin-cache, cache-db", "bad"],
]

[[act]]
title = "The design as code, and a layout built from it"
summary = "One internal network for each wanted pair measures exactly 6 pairs; a service joined to one more network is drift."
detail = """
The intent is six pairs: admin-app, admin-ci, admin-db, app-cache, app-db and app-web. One internal network for each pair, each service on the networks of its pairs: measured 6 pairs, extra 0, missing 0. The taken-over front reaches the application only, by name and by address. Someone with the Docker socket joins web and db to one more network; measuring against the intent finds db-web at once.
"""
speech = """
Third demo: the design as code. [[slnc 400]] Six pairs may talk. One internal network for each pair. [[slnc 600]]
The measurement matches the design exactly. [[slnc 300]] And when someone joins two services to one more network, the comparison finds it.
"""
rows = { code = "active ok" }
console = [
    ["intent: 6 pairs; measured: 6, extra 0, missing 0", "ok"],
    ["web reaches app only", "ok"],
    ["one more network: extra db-web, found", "ok"],
]

[[act]]
title = "The edge: what is published, and what can leave"
summary = "Only the front is published to the host, and only the front can reach a server on the internet side."
detail = """
Published to the host: web yes, app no, db no, and the host can open web's port. With an attacker's server on the internet side, the services that can reach it: web only. Internal networks have no way out, so a taken-over database cannot send anything out; a taken-over front still can, and its way out is the next thing to close.
"""
speech = """
Fourth demo: the edge. [[slnc 400]] Only the front is published to the host. [[slnc 600]]
And only the front can reach a server on the internet. [[slnc 300]] A taken-over database cannot send anything out.
"""
rows = { edge = "active ok" }
console = [
    ["published: web yes, app no, db no", "ok"],
    ["can reach the attacker's server: web only", "bad"],
    ["internal networks have no way out", "ok"],
]

[[act]]
title = "The bill"
summary = "Pivots, reachable is not authorised, the Docker socket beats every rule, and a diagram of the network is a wish."
detail = """
Names are scoped to networks: a service on two networks, and app is on four, is a pivot. Reachable is not authorised. Whoever can use the Docker socket can join any container to any network. One network for each pair does not scale to a hundred services, which is why clouds have security groups and clusters have network policies, and why those need testing as this does. Measure against the intent in the build and on a schedule.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] A service on two networks is a pivot. Reachable is not authorised. [[slnc 600]]
Whoever has the Docker socket can join anything to anything. [[slnc 300]] A diagram of the network is a wish. The measurement is the network.
"""
rows = { bill = "active wrong" }
console = [
    ["app is on four networks: a pivot", "bad"],
    ["the Docker socket joins any container to any network", "bad"],
    ["measure against the intent, in the build and on a schedule", "ok"],
]

