[[act]]
title = "The bill"
summary = "The pivots are the services on several networks (app is on four); reachable is not authorised; the Docker socket beats every rule; one network per pair costs 7 networks for 6 services."
detail = """
The pivots, worked out from the layout of act three: web is on 2 networks, app on 4, db on 2, admin on 3. A taken-over pivot reaches every network it is on, so the pivots are where an attacker goes next.
What the network does not decide: reachable is not authorised, so the database still checks who the application is; and whoever can use the Docker socket can join anything to any network.
What it costs: one network per pair is 7 networks for 6 services, which does not scale to a hundred; at scale clouds use security groups and clusters use network policies, and they need testing the same way, against the intent, on a schedule.
"""
figure = "pivots"
figure_title = "The pivots: services on more than one network"
figure_speech = """
Fifth demo: the bill. [[slnc 400]] A service on two or more networks is a pivot. [[slnc 300]] If it is taken over, it reaches every network it is on. [[slnc 700]]
The application is on four networks: to the admin panel, the cache, the database, and the front. [[slnc 300]] The admin panel is on three. [[slnc 300]] The front and the database are on two each. [[slnc 600]]
These are the services to watch most closely. [[slnc 300]] And remember: reaching a service is not the same as being allowed to use it. [[slnc 300]] The database must still check who is calling.
"""
speech = """
The pivots: the application on four networks, the admin panel on three, the front and the database on two. [[slnc 400]] What the network does not decide: whether a call is authorised, and who may use the Docker socket. [[slnc 300]] And the cost: seven networks for six services. [[slnc 300]] At scale, security groups and network policies, tested the same way.
"""
