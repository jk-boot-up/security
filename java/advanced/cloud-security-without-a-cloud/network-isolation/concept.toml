[docs.problem]
scenario = """
An online store runs six services, one of which faces the internet, and one of them will one day be taken over.
"""
naive = """
Put everything on one network and rely on each service's own login.
"""
deliver = [
    "Real networks and containers.",
    "Measurement from inside, by name and by address.",
    "The design as a table of allowed pairs, and a layout built from it.",
    "Drift found by comparing the measurement with the design.",
]

[docs.prerequisites]
required = [
    "Java basics",
    "Docker, with the alpine:3.24.3 image (pulled on first use)",
]
not_required = [
    "A cloud account",
]
install = ["docker"]

[docs.session]
objectives = [
    "measure what a service can reach",
    "explain why a network joins both directions",
    "build a layout from a table of allowed pairs",
    "find drift by comparing with the intent",
]
walkthrough = """
Run act two and name the two pairs nobody asked for. In act three find the line that shows drift. In act four find the only service that can leave.
"""
exercises = [
    "Add a metrics service that every service may talk to, and see what the layout becomes.",
    "Close the front's way out and keep its published port.",
    "Write the intent for a service with three replicas.",
    "Make the measurement a test that fails when there is an extra pair.",
]

[docs.explained]
sentence = """
Isolation is a property of the network, so it is measured, and the design is a table that the measurement is compared with.
"""
verdict = """
Write down which services may talk, build the network from that table, measure from inside on every change and on a schedule, close egress as carefully as ingress, treat a service on two networks as a bridge, and remember that reachable is not authorised.
"""
recognise = [
    "A compose file with one network.",
    "`internal: true` on a network.",
    "A security group that names another security group.",
    "A diagram of the network that nobody has checked.",
]

[spec]
purpose = """
Teach network segmentation by measuring reachability on real networks against a written intent.
"""
nongoals = [
    "Firewalls on the host.",
    "Kubernetes network policies.",
    "Authentication between services.",
]
problem = """
Services share networks that nobody drew carefully, so a taken-over service reaches things it should not.
"""
roles = [["The shop", "`Service`"], ["The networks and containers", "`Lab`"], ["The design", "`Intent`"], ["Entry point", "`NetworkIsolationDemo`"]]
requirements = [
    "Reachability is measured from inside containers, by name and by address.",
    "The intent is a table of allowed pairs and a layout can be built from it.",
    "The measurement is compared with the intent for extra and missing pairs.",
    "Published ports and egress are measured.",
    "The demo prints the same output on every run.",
]

