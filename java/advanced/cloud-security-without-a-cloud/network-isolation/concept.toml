[[act]]
title = "The edge: what is published, and what can leave"
summary = "Only the front is published to the host, and only the front can reach a server on the internet side: internal networks have no way out."
detail = """
The way in: of the six services only web is published to the host, on 127.0.0.1, and the host can connect to it; app, db, cache, admin and ci are not published.
The way out: a server evil, listening on port 4444, is put on the edge network, as a stand-in for the internet. Measured from each service, only web reaches it.
How it is worked out: only edge has a way out, and only web is on edge, so the layout predicts web, and web is what is measured. A taken-over database cannot send anything out; a taken-over front still can, and that way out is the next thing to close.
"""
figure = "edge_ways"
figure_title = "The way in and the way out"
figure_speech = """
Fourth demo: the edge. [[slnc 400]] On the left, the way in. [[slnc 300]] Only the web front is published to the host, and the host can connect to it. [[slnc 300]] The other five services have no published port at all. [[slnc 700]]
On the right, the way out. [[slnc 300]] A stand-in for an attacker's server on the internet, called evil, listens on port forty four forty four. [[slnc 300]] From each service, the demo tries to reach it. [[slnc 600]]
Only the web front can. [[slnc 300]] Every other service is only on internal networks, and an internal network has no way out. [[slnc 300]] So a taken-over database cannot send its data anywhere. [[slnc 300]] A taken-over front still can.
"""
speech = """
The way in: only the front is published to the host, and the host connects. [[slnc 300]] No other service is published. [[slnc 400]] Then the way out: an attacker's server on the edge network.
[[page]]
