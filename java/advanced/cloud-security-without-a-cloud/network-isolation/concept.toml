[[scene]]
key = "01-poster"
kind = "poster"
title = "Network Isolation"
narration = "Hello, and welcome. [[slnc 400]] This video explains network isolation, measured on real Docker networks. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] Network isolation answers one question: if this service is taken over, what else can it reach? [[slnc 300]] Clouds call the answer by many names, like a V P C, a virtual private cloud, a security group, or a network policy. [[slnc 300]] This project measures it, by connecting from inside every container, and compares the result with the design. [[slnc 600]] Think of the doors between rooms in a shop: the till should open to the stockroom, never to the safe. [[slnc 600]] Our example is an online store."

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An online store with six services:", "  a web front, an application,", "  a database, a cache,", "  an admin panel and a build server", "", "Each runs in a real container.", "The demo connects from inside each one,", "on three different network layouts."]
narration = "Here is the scenario. [[slnc 400]] An online store with six services: a web front, an application, a database, a cache, an admin panel, and a build server. [[slnc 500]] Each runs in a real Docker container, listening on its port. [[slnc 500]] The demo tries to connect from inside every container to every other one, on three layouts: one flat network, three coarse networks, and a layout built from the design."

[[scene]]
key = "02-words"
kind = "bullets"
title = "The Words"
body = ["Network: containers on it can reach each other", "Internal network: no route out to the internet", "Pair: two services that can talk, either way", "Intent: the pairs the design allows, as code", "Drift: the real network no longer matches the intent", "Pivot: a service on two or more networks"]
narration = """Before the demos, the words. [[slnc 500]] A Docker network joins containers: every container on it can reach every other one. [[slnc 500]] An internal network has no route out to the internet. [[slnc 500]] A pair is two services that can talk, in either direction. [[slnc 500]] The intent is the list of pairs the design allows, written as code. [[slnc 500]] Drift is when the real network no longer matches the intent. [[slnc 500]] And a pivot is a service on two or more networks: taken over, it reaches all of them."""

[[scene]]
key = "02-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "02-formula"
kind = "figure"
title = "How many pairs one network makes"
body = "pairs_formula"
narration = """Let's see the core idea on one example: how many pairs of services one network lets talk. [[slnc 400]] On the left, six services on one network. [[slnc 300]] Every line is a pair that can talk. [[slnc 600]] Each of the six can reach the other five. [[slnc 300]] Six times five is thirty arrows. [[slnc 300]] But an arrow each way between the same two services is one pair, so divide by two: fifteen pairs. [[slnc 600]] The design of this store wants only six. [[slnc 300]] So a flat network gives nine pairs that nobody asked for. [[slnc 300]] The demo measures all fifteen, from inside the containers."""

[[scene]]
key = "03-acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "04-costs"
kind = "bullets"
title = "What It Costs"
body = ["More networks mean more to manage", "Measuring takes time", "A service on two networks is a bridge", "Segmentation is not authentication", "The way out is easy to forget"]
narration = "Nothing is free. [[slnc 400]] Here is what it costs. [[slnc 500]] More networks mean more to manage, and more to get wrong. [[slnc 500]] Measuring every pair of services takes time. [[slnc 500]] A service that sits on two networks is a bridge between them. [[slnc 500]] Being able to reach a service is not the same as being allowed to use it, so each one still needs authentication. [[slnc 300]] And the way out, to the internet, is easy to forget."

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["One default network for every container", "A database port open to a whole VPC", "A security group that allows 0.0.0.0/0", "A network diagram nobody has checked"]
narration = "You have probably met this already. [[slnc 400]] One default network shared by every container is the flat network from the first demo. [[slnc 500]] A database port open to a whole V P C is a coarse network. [[slnc 500]] A security group that allows every address is no isolation at all. [[slnc 500]] And a network diagram that nobody has checked against the real thing is a wish."

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Write down which services may talk", "Build the networks from that intent", "Measure, and compare with the intent", "Publish only the front; close the way out", "Guard whatever can change the networks", "Still authenticate every call"]
narration = "So, how do you use it? [[slnc 400]] Write down which services may talk, as code. [[slnc 300]] Build the networks from that intent, not by hand. [[slnc 500]] Measure what can really talk, in the build and on a schedule, and compare it with the intent. [[slnc 500]] Publish only the front, and close the way out for everything else. [[slnc 300]] Guard whatever can change the networks, like the Docker socket. [[slnc 300]] And still authenticate every call."

[[scene]]
key = "12-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a metrics service that every", "service may talk to, and see what the layout becomes."]
narration = "That's network isolation. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] A network diagram is a wish, and the measurement is the network, so write the intent as code, build from it, and measure against it. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a metrics service that every service may talk to, and see what the layout becomes. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"

