[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] One class works the layout out on paper, and one builds it for real and measures it. [[slnc 300]] Here are the ones that matter."""

[[class]]
name = "Layout"
what = "a layout on paper: which service is on which network"
[[class.part]]
title = "every two members of a network are a pair"
code = """
for (List<String> members : networks.values()) {
    for (int i = 0; i < members.size(); i++) {
        for (int j = i + 1; j < members.size(); j++) {
            out.add(Intent.pair(members.get(i), members.get(j)));
"""
speech = """Two containers can talk exactly when they share a network. [[slnc 300]] So the pairs are every two members of every network, collected in a set so that none is counted twice."""
[[class.part]]
title = "n services make n x (n - 1) / 2 pairs"
code = """
int n = networks.get(network).size();
return n * (n - 1) / 2;
"""
speech = """The count for one network, as worked out in the demo. [[slnc 300]] A test proves the real Docker networks give the same pairs as the layout."""

[[class]]
name = "Intent"
what = "the design as code: the pairs that may talk"
[[class.part]]
title = "extra: reachable, and not wanted"
code = """
public Set<String> extra(Set<String> measured) {
    Set<String> out = new TreeSet<>(measured);
    out.removeAll(pairs);
"""
speech = """Extra pairs are the measured ones minus the intended ones. [[slnc 300]] Missing pairs are the other way round. [[slnc 300]] Drift shows up here as soon as it happens."""

[[class]]
name = "Lab"
what = "real Docker networks and containers, and the measurement"
[[class.part]]
title = "an internal network has no way out"
code = """
List<String> command = new ArrayList<>(List.of("network", "create"));
if (internal) {
    command.add("--internal");
"""
speech = """Each network is made with the docker command. [[slnc 300]] The internal flag removes its route to the outside."""
[[class.part]]
title = "measure from inside a container"
code = """
String[] probe = {"exec", containers.get(from), "nc", "-z", "-w", "1", host, String.valueOf(port)};
return Sh.run(probe).ok();
"""
speech = """A connection is tried from inside one container with netcat, waiting at most one second. [[slnc 300]] A closed path is found by waiting, which is why the demo takes a few minutes."""

