    "Ghidra",
    "Docker",
]
install = []

[docs.session]
objectives = [
    "read strings and names from a class file without running it",
    "recognise a comparison in javap output",
    "patch a method with the JDK class file API",
    "explain what obfuscation stops and does not stop",
]
walkthrough = """
Run the demo and follow the order of cost: strings, names, bytecode, decompiler. In the last act find the three things that obfuscation leaves.
"""
exercises = [
    "Move the licence check to a small server and see what an attacker can still change.",
    "Add a check that the class files have not been changed and patch that too.",
    "Write a rule that finds hard-coded keys in the constant pools of a jar.",
    "Rename the methods with the class file API and see what javap shows.",
]

[docs.explained]
sentence = """
Whatever runs on someone else's machine is theirs to read and change.
"""
verdict = """
Keep secrets and decisions on the server, assume every client is read and patched, treat obfuscation as a delay and not as a lock, and read unknown code in the order of cost: strings, names, bytecode, then a decompiler.
"""
recognise = [
    "A key in a mobile app or a jar.",
    "A licence check that returns a boolean on the client.",
    "Obfuscation as the only protection.",
    "A check that the client does on itself.",
]

