[[act]]
title = "Changing it"
summary = "Patcher replaces check's 12 instructions (19 bytes) by iconst_1, ireturn (2 bytes): a wrong key and no key are now licensed."
detail = """
Before the patch: check is 12 instructions in 19 bytes; the right key is licensed, a wrong key and no key are denied.
The patch: Patcher looks for a static method that takes a String, returns a boolean, calls String.equals and branches with ifeq, and finds bank/Licence.check. With the JDK class file API it writes a copy whose body is two instructions, iconst_1 and ireturn: push 1, true, and return it.
After the patch: check is 2 instructions in 2 bytes, and all three keys, wrong or none, are licensed. A check that runs on the customer's computer decides nothing.
"""
figure = "patch_before_after"
figure_title = "Before and after the patch"
figure_speech = """
Fourth demo: changing it. [[slnc 400]] On the left, before the patch. [[slnc 300]] The check method is twelve instructions, nineteen bytes. [[slnc 300]] A wrong key is denied, and so is no key. [[slnc 700]]
In the middle, the patch. [[slnc 300]] Patcher finds the method by its shape: it takes a string, returns a boolean, calls equals, and branches. [[slnc 300]] Then it writes a new body of two instructions. [[slnc 300]] I const one pushes one, which means true. [[slnc 300]] I return returns it. [[slnc 700]]
On the right, after the patch. [[slnc 300]] Two instructions, two bytes. [[slnc 300]] A wrong key is licensed. [[slnc 300]] No key is licensed. [[slnc 500]] The customer owns the computer, so the customer owns the check.
"""
speech = """
The real output. [[slnc 400]] Before the patch: twelve instructions, nineteen bytes, and the wrong key and no key are denied. [[slnc 300]] The patch: what Patcher looks for, what it found, and the new body.
[[page]]
After the patch: two instructions. [[slnc 300]] Every key is now licensed, even none. [[slnc 400]] The check ran on the customer's computer, so it decided nothing.
"""
