# concept.toml: everything about this project that is not Java code.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "reverse-engineering-fundamentals"
level = "advanced"
module = "offensive-security-methodology"
title = "Reverse Engineering Fundamentals"
short_title = "Reverse Engineering"
package = "reverseeng"
main_class = "ReverseEngineeringDemo"
tagline = "Read a bank client's class files with the JDK's class file API, javap and the CFR decompiler, find a hard-coded key, patch a licence check, and see what obfuscation does and does not stop"
bold = "A bank's desktop client of 3 class files keeps its licence key in the constant pool, where 3 strings name a key, a licence or an address; javap shows the String.equals comparison and the decompiler gives back 19 lines of source for the 20 of the original; one method replaced by 'return true' makes a wrong key and no key pass; an obfuscated copy with one-letter names and encoded strings behaves identically and shows 0 of those strings, but its decompiled check is still readable, its own decoder gives back all 3 strings, and its key check is found by shape although it is called a and is patched the same way."
domain = "a bank"
domain_note = ""
youtube_description = "Reverse engineering fundamentals for a Java client: reading the constant pool and bytecode with the JDK class file API and javap, decompiling with CFR, patching a client-side licence check, and what renaming and string encoding stop and do not stop."
thumb_lines = ["REVERSE", "ENGINEERING"]
thumb_code = "invokevirtual String.equals; ifeq"
youtube_title = "Reverse Engineering Java: Constant Pool, javap, CFR and Patching a Licence Check"
youtube_tags = ["reverse engineering", "java bytecode", "javap", "cfr decompiler", "class file api", "obfuscation", "client-side checks", "hardcoded secrets", "software protection", "java"]

[readme]
intro = """
Anything that runs on a machine you do not control can be read and changed by whoever owns the machine. This project takes a small desktop client of a bank, whose **licence check** compares a typed key with a key in the program, and takes it apart the way an analyst would: first the **strings** in the constant pool, then the **names**, then the **bytecode** with `javap`, then a **decompiler** (**CFR**). Then it **patches** the check with the JDK's own class file API so that any key passes, and repeats everything on an **obfuscated** copy to see what renaming and encoded strings really stop. The sample is compiled by the demo from source in `samples/`; everything is local and the program is the project's own. `./gradlew test`, then `./gradlew run` (CFR is downloaded once into `build/` and checked against its SHA-256).

What it shows:
- **Reading without running.** 3 of the strings in the constant pool name a key, a licence or an address, and the key is one of them; `javap` shows `String.equals` followed by `ifeq` in a method called `check`.
- **Decompiling.** CFR gives back **19** lines for the **20** of the original source, with the key and the comparison in them.
- **Changing it.** Replace one method by `return true` and a wrong key, or no key, passes: a client-side check decides nothing.
- **Obfuscation.** One-letter names and encoded strings leave **0** of the 3 strings, but the decompiled logic is readable, the program's own decoder gives back all **3**, and the check is found by its shape and patched the same way.
- **The bill.** Keep the decision on the server; obfuscation raises the cost of reading and does not prevent it.

**Maps to:** OWASP MASVS-RESILIENCE · OWASP Top 10 A04 Insecure Design · CWE-798 hard-coded credentials, CWE-602 client-side enforcement of server-side security · MITRE ATT&CK T1027 obfuscated files.
"""
analogy = """
A combination lock whose combination is printed inside the case. Locking the case with a smaller lock only makes the reader walk to the workshop. The honest fix is to keep the decision at the bank, behind a counter that the customer does not carry home.
"""
scenario = """
A bank ships a desktop client that checks a licence key on the customer's own computer. A vendor wants to know how easily it can be read and changed. The demo reverse-engineers the client and then its obfuscated copy.
"""
costs = [
    "**Obfuscation makes your own debugging harder,** and crash reports unreadable.",
    "**Patching is easy to repeat** for every new release.",
    "**Decompilers are not perfect,** and the output can differ from the source.",
    "**Analysis takes skill and time,** and the tools change.",
    "**A server-side check needs a network** and a server.",
]
too_much = """
A tool used only inside a company on managed machines does not need protection from its users. Think about reverse engineering when code ships to customers, devices or browsers, or when you analyse something that was shipped to you.
"""
met_before = [
    "An API key in a mobile app.",
    "A licence check that returns a boolean.",
    "A password in a jar file.",
    "Obfuscation sold as security.",
]
where = """
This is a project of the [offensive-security-methodology](..) module. The hard-coded secrets found here are the kind that [secret-scanning](../../devsecops-pipelines/secret-scanning) looks for in the source.
"""
twin = """
The sample is the project's own small program, compiled in the demo, and the key is a made-up string. javap and the JDK class file API are the JDK's; CFR is a real decompiler. The demo prints counts, never paths.
"""
test_note = "The class file reading, the patching and the sample are tested with the JDK only. The demo also runs javap and CFR (./gradlew integrationTest)."

[[act]]
title = "The program"
summary = "A bank's desktop client of 3 class files accepts one key and refuses the rest."
detail = """
The client has a Licence class that compares the typed key with a key held in the program, a Statement class that formats lines and a Main class that starts it. With the right key it shows a statement line, with a wrong key it prints that it is denied.
"""
speech = """
First demo: the program. [[slnc 400]] Three class files and one licence check. [[slnc 600]] The right key works, a wrong key is denied.
"""
rows = { program = "active ok" }
console = [
    ["class files: 3", "ok"],
    ["the right key: licensed", "ok"],
    ["a wrong key: denied", "ok"],
]

[[act]]
title = "Reading it without running it"
summary = "3 strings in the constant pool name a key, a licence or an address, and javap shows the comparison."
detail = """
The constant pool of the class files holds the strings that the code loads. Three of them contain key, licence or an address, and one is the licence key itself. javap -c shows invokevirtual String.equals followed by ifeq in a method called check. Ten of the 13 names in the files are longer than one letter.
"""
speech = """
Second demo: reading it. [[slnc 400]] The strings give the key away. [[slnc 600]] javap shows the comparison.
"""
rows = { read = "active wrong" }
console = [
    ["strings that name a key: 3", "bad"],
    ["the licence key is one of them: yes", "bad"],
    ["String.equals then ifeq in check: yes", "bad"],
]

[[act]]
title = "Decompiling it"
summary = "CFR gives back 19 lines for the 20 of the original source, with the key and the comparison."
detail = """
A decompiler turns the bytecode back into Java. CFR's output of the Licence class has the key and the equals call in it, in 19 non-blank lines against the 20 of the original source.
"""
speech = """
Third demo: decompiling. [[slnc 400]] The decompiler gives back the source. [[slnc 600]] The key and the comparison are in it.
"""
rows = { decompile = "active wrong" }
console = [
    ["source has the key and the comparison: yes", "bad"],
    ["19 lines against 20 in the original", "bad"],
    ["the logic is readable", "bad"],
]

[[act]]
title = "Changing it"
summary = "One method replaced by 'return true' makes a wrong key, or no key, pass."
detail = """
The class file API replaces the body of the check method with two instructions, iconst_1 and ireturn. The patched program says licensed to a wrong key and to no key. A check that runs on the customer's computer decides nothing.
"""
speech = """
Fourth demo: changing it. [[slnc 400]] Replace the method with return true. [[slnc 600]] Any key, or none, is now licensed.
"""
rows = { patch = "active wrong" }
console = [
    ["methods patched: 1", "bad"],
    ["wrong key: licensed", "bad"],
    ["no key: licensed", "bad"],
]

[[act]]
title = "Obfuscation"
summary = "Short names and encoded strings leave 0 strings to read, but the logic, the decoder and the check's shape give it all away."
detail = """
The obfuscated copy behaves exactly like the original and shows 0 of the 3 strings; none of its names is longer than one letter. Its decompiled check is still readable as a comparison with a decoded string. Calling the program's own decoder gives back all 3 strings, and the check is found by its shape, a static method that takes a String and returns a boolean using equals and a branch, and patched the same way.
"""
speech = """
Fifth demo: obfuscation. [[slnc 400]] The strings and the names are gone. [[slnc 600]] The logic, the decoder and the shape of the check are not.
"""
rows = { obf = "active wrong" }
console = [
    ["strings that name a key: 0 against 3", "ok"],
    ["strings recovered by its own decoder: 3", "bad"],
    ["check found by shape and patched: yes", "bad"],
]

[animation]
subtitle = "A bank's client, taken apart."
boxes = [
    ["program", "The program", "3 classes"],
    ["read", "Reading it without running it", "3 strings"],
    ["decompile", "Decompiling it", "19 vs 20"],
    ["patch", "Changing it", "return true"],
    ["obf", "Obfuscation", "0 strings"],
]

