[[act]]
title = "Decompiling it"
summary = "CFR turns Licence.class back into Java: the key and the logic come back, only the parameter name is lost; 19 non-blank lines against 20."
detail = """
The input: the check method as the bank wrote it, nine lines with two if statements, and its compiled class file.
The result: CFR 0.152, given only Licence.class, prints the method back in five lines: the same null check, then return VENDOR_KEY.equals(string). The field VENDOR_KEY = "bankapp-demo-key-0001" comes back too. Lost: the parameter name, key, which the class file does not keep, so CFR calls it string. The whole file is 19 non-blank lines against 20 in the original.
"""
figure = "decompile_before_after"
figure_title = "The source, and what the decompiler gives back"
figure_speech = """
Third demo: decompiling. [[slnc 400]] A decompiler turns bytecode back into Java source. [[slnc 600]] On the left, the input: the check method as the bank wrote it. [[slnc 300]] Nine lines, with two if statements. [[slnc 700]]
On the right, the result: what C F R prints from the class file alone. [[slnc 300]] The same null check. [[slnc 300]] Then the two ifs become one line: return vendor key dot equals. [[slnc 300]] Shorter, but the same logic. [[slnc 600]]
At the bottom, what came back, and what was lost. [[slnc 300]] The key came back, with its field name. [[slnc 300]] Only the parameter name was lost, because a class file does not keep it, so C F R calls it string.
"""
