[[act]]
title = "Obfuscation"
summary = "One-letter names and XOR-encoded strings: 0 of 13 names readable and 0 strings name a key, but XOR 0x5a decodes them, the decompiled check is readable, and the check is found by shape and patched the same way."
detail = """
Before obfuscation: 10 of 13 names are readable and 3 strings name a key, a licence or an address.
After obfuscation (the same behaviour for every key): bank/Licence.check is a/a.a, VENDOR_KEY is k, 0 of 13 names are readable and 0 strings name a key. The pool holds hex instead, 383b3431... for the key.
How one string is decoded: the decoder a/c.d reads two hex digits as a byte and XORs it with 0x5a. 38 XOR 5a is 62, the letter b; 3b gives 61, a; 34 gives 6e, n; 31 gives 6b, k. All 21 bytes give bankapp-demo-key-0001. XorSteps redoes this by hand, and a test proves it matches the program's decoder.
What is still there: the decompiled check reads return k.equals(string); calling the program's own decoder on its 6 encoded strings gives back the 3 that name a key, a licence or an address; and the key check is found by its shape although it is called a, patched, and a wrong key is licensed.
"""
figure = "xor_decode"
figure_title = "Obfuscation: what it hides, and how it comes back"
figure_speech = """
Fifth demo: obfuscation. [[slnc 400]] At the top, before and after. [[slnc 300]] Before, ten of thirteen names are readable, and three strings name a key. [[slnc 300]] After, every name is one letter, and no string names a key. [[slnc 300]] The pool holds hexadecimal instead. [[slnc 700]]
In the middle, how one string comes back. [[slnc 300]] The decoder reads two hex digits as one byte, and X O R s it with five A. [[slnc 300]] Three eight X O R five A is six two: the letter b. [[slnc 300]] Three B gives a. [[slnc 300]] Three four gives n, and three one gives k. [[slnc 300]] Twenty one bytes later, the whole key is back. [[slnc 700]]
At the bottom, what obfuscation did not hide. [[slnc 300]] The check still reads k dot equals. [[slnc 300]] And Patcher still finds it by its shape, and patches it.
"""
speech = """
The real output. [[slnc 400]] Before and after obfuscation: the same behaviour, no readable names, no readable strings. [[slnc 300]] The pool now holds a hex string. [[slnc 300]] Below it, the first four bytes decoded by hand, and all twenty one.
[[page]]
What is still there. [[slnc 300]] The decompiled check. [[slnc 300]] The program's own decoder, called on its six encoded strings, gives back the three that matter. [[slnc 300]] The check is found by its shape and patched, and the wrong key is licensed. [[slnc 400]] Then the bill: keep the decision on the server; obfuscation only raises the cost of reading.
"""
rows = { obf = "active wrong" }
