[[scene]]
key = "01-poster"
kind = "poster"
title = "Reverse Engineering Fundamentals"
narration = "Hello, and welcome. [[slnc 400]] This video explains the fundamentals of reverse engineering, on Java class files. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] Reverse engineering is reading a program you only have in compiled form, to learn what it does. [[slnc 300]] Anything that runs on a machine you do not control can be read, and changed, by whoever owns the machine. [[slnc 600]] Think of a combination lock whose combination is printed inside the case: whoever takes the lock home can read it. [[slnc 600]] Our example is a bank."

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["A bank ships a desktop client of 3 class files", "that checks a licence key on the customer's", "own computer.", "", "The demo reads it, decompiles it, patches it,", "then does it all again on an obfuscated copy."]
narration = "Here is the scenario. [[slnc 400]] A bank ships a small desktop client, three class files, that checks a licence key on the customer's own computer. [[slnc 500]] The demo takes it apart the way an analyst would. [[slnc 300]] It reads the strings, then the bytecode, then decompiles it, and patches it. [[slnc 500]] Then it does it all again on an obfuscated copy. [[slnc 300]] Everything runs on your own machine, on the project's own sample."

[[scene]]
key = "02-words"
kind = "bullets"
title = "The Words"
body = ["Class file: compiled Java, what the JVM runs", "Constant pool: the strings and names a class uses", "Bytecode: the instructions of each method", "Decompiler: turns bytecode back into source", "Patch: a changed copy of the class file", "Obfuscation: renamed and encoded, same behaviour"]
narration = """Before the demos, the words. [[slnc 500]] A class file is compiled Java: what the Java virtual machine runs. [[slnc 500]] The constant pool is the table in a class file that holds the strings and names its code uses. [[slnc 500]] Bytecode is the list of instructions of each method. [[slnc 500]] A decompiler turns bytecode back into Java source. [[slnc 500]] A patch is a changed copy of a class file. [[slnc 500]] And obfuscation renames everything and encodes the strings, while the behaviour stays the same."""

[[scene]]
key = "02-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "02-core"
kind = "figure"
title = "One class file, read four ways"
body = "read_in_order_of_cost"
narration = """Let's see the core idea on one class file: Licence dot class. [[slnc 400]] An analyst reads it in the order of cost, the cheapest first. [[slnc 700]]
First, the strings in the constant pool. [[slnc 300]] The licence key is right there, in plain text. [[slnc 500]] Second, the names: Licence, check, vendor key. [[slnc 300]] They say where to look. [[slnc 500]] Third, the bytecode: l d c loads the key, String dot equals compares, and if equal zero decides. [[slnc 500]] Fourth, a decompiler gives back the method as Java. [[slnc 700]]
Each step costs a little more, and each one shows the same secret. [[slnc 300]] The key, and the decision, are on the customer's machine."""

[[scene]]
key = "03-acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "04-costs"
kind = "bullets"
title = "What It Costs"
body = ["A client-side check decides nothing", "Strings in a class file are plain to read", "Obfuscation raises the cost of reading,", "  and does not prevent it", "Keeping the decision on a server needs a server"]
narration = "Nothing is free. [[slnc 400]] Here is what it costs. [[slnc 500]] A check that runs on the customer's machine decides nothing: one patched method, and every key passes. [[slnc 500]] Strings in a class file are plain to read, keys included. [[slnc 500]] Obfuscation raises the cost of reading, and does not prevent it. [[slnc 300]] And keeping the decision on a server means running, and protecting, that server."

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["A licence key or API key inside a jar", "A cracked build of a paid application", "Class names like a, b and c: obfuscation", "javap -c output: invokevirtual, ifeq"]
narration = "You have probably met this already. [[slnc 400]] A licence key, or an A P I key, inside a jar is readable by anyone who has the jar. [[slnc 500]] A cracked build of a paid application is a patched check. [[slnc 500]] Class names like a, b, and c are obfuscation. [[slnc 500]] And java p output, with invoke virtual and if equal zero, is the bytecode where the decision is made."

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Never put a secret in code you ship", "Keep decisions on the server", "Treat the client as the attacker's", "Use obfuscation to slow, not to protect", "Read your own release as an attacker would"]
narration = "So, how do you use it? [[slnc 400]] Never put a secret in code you ship. [[slnc 500]] Keep every decision that matters on the server. [[slnc 500]] Treat the client as belonging to the attacker. [[slnc 500]] Use obfuscation to slow a reader down, not to protect anything. [[slnc 300]] And read your own release the way an attacker would, before they do."

[[scene]]
key = "12-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Move the licence check to", "a small server, and see what can still be changed."]
narration = "That's the fundamentals of reverse engineering. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Whoever runs your program can read it and change it, so keep secrets and decisions off their machine. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Move the licence check to a small server, and see what an attacker can still change. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"

