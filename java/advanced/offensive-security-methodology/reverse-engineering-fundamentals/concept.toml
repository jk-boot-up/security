[[threat]]
id = "T2"
stride = "I"
threat = "A key stored in the program is read"
where = "the constant pool"
control = "Keep keys out of the client"
residual = "Keys that must be on the device"

[[threat]]
id = "T3"
stride = "R"
threat = "Obfuscation is relied on instead of design"
where = "the release process"
control = "Treat it as a delay and assume the program is read"
