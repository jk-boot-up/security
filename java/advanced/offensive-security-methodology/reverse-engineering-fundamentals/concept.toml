[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] It is plain Java: the JDK's own class file A P I, plus the C F R decompiler. [[slnc 300]] Here are the classes that matter."""

[[class]]
name = "Sample"
what = "the bank's client, compiled from source and run from a class loader"
[[class.part]]
title = "compile, then run with a key"
code = """
List<String> args = new ArrayList<>(List.of("--release", "21", "-d", out.toString()));
...
if (compiler.run(null, null, null, args.toArray(String[]::new)) != 0) {
...
Class<?> entry = loader.loadClass(entryClass);
Object result = entry.getMethod(entryMethod, String.class).invoke(null, key);
"""
speech = """Sample compiles the client with the JDK's own compiler. [[slnc 300]] Then it loads the classes into a fresh class loader and calls the entry point with a key. [[slnc 300]] So the same client can be run again after every change."""

[[class]]
name = "Pool"
what = "reads strings, names and the shape of methods, without running anything"
[[class.part]]
title = "the strings in the constant pool"
code = """
ClassModel cm = ClassFile.of().parse(Files.readAllBytes(classFile));
...
for (var entry : cm.constantPool()) {
    if (entry instanceof StringEntry s) {
        out.add(s.stringValue());
"""
speech = """The class file A P I parses the bytes. [[slnc 300]] Every string entry in the constant pool is a string the code loads, the key among them."""
[[class.part]]
title = "a key check, found by its shape"
code = """
String type = m.methodTypeSymbol().descriptorString();
if (type.equals("(Ljava/lang/String;)Z") && m.code().isPresent()
        && callsEquals(m.code().get()) && branches(m.code().get())) {
    return m;
"""
speech = """The check is found by its shape, not its name. [[slnc 300]] It takes a string, returns a boolean, calls String dot equals, and branches. [[slnc 300]] Renaming it to a changes nothing."""

[[class]]
name = "Tools"
what = "runs javap and the CFR decompiler of the JDK that runs the demo"
[[class.part]]
title = "a pinned decompiler, checked by its hash"
code = """
static final String CFR_VERSION = "0.152";
...
return Path.of(System.getProperty("java.home"), "bin", tool).toString();
...
if (!sha.equals(CFR_SHA256)) {
"""
speech = """C F R is pinned to one version, and its jar is checked against its S H A two fifty six hash. [[slnc 300]] java p and C F R run from the J D K that runs the demo, so the output is always the same."""

[[class]]
name = "Patcher"
what = "writes a copy of the class files in which the check says yes"
[[class.part]]
title = "two instructions replace the check"
code = """
MethodModel check = Pool.keyCheck(cm);
...
if (element == check) {
    int flags = check.flags().flagsMask();
    cb.withMethodBody(check.methodName(), check.methodType(), flags,
            code -> code.iconst_1().ireturn());
"""
speech = """Patcher copies every element of the class, except the check. [[slnc 300]] The check gets a new body: i const one, i return. [[slnc 300]] That is all a crack is."""

[[class]]
name = "XorSteps"
what = "redoes the obfuscated client's decoder by hand"
[[class.part]]
title = "two hex digits, one byte, XOR 0x5A"
code = """
public static final int KEY = 0x5A;
...
int encoded = Integer.parseInt(hex.substring(i, i + 2), 16);
out.add(new Step(hex.substring(i, i + 2), encoded, encoded ^ KEY));
"""
speech = """Two hex digits make one byte, and X O R with five A gives the character. [[slnc 300]] A test proves it gives exactly what the program's own decoder gives."""

