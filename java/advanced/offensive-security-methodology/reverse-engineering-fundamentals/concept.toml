[[act]]
title = "Reading it without running it"
summary = "7 strings in the constant pool, 3 of them naming a key, a licence or an address; 10 of 13 names are readable; javap shows the key loaded by ldc and compared by String.equals and ifeq."
detail = """
The input: the 3 class files, never run. The constant pool of a class file holds the strings its code loads. Of the 7 strings in the three files, 3 name a key, a licence or an address, and one of them is the licence key itself.
The names: 13 classes, methods and fields, and 10 of them are longer than one letter (the other 3 are constructors, called <init>). A reader learns from bank/Licence.check and VENDOR_KEY where to look.
The bytecode of check, from javap -c: offsets 0 to 5 return false for no key; 6 loads the key from the pool with ldc; 9 calls String.equals; 12, ifeq, jumps to 17 (return 0, false) when they differ; 15 and 16 return 1, true.
"""
figure = "pool_and_bytecode"
figure_title = "The constant pool and the bytecode of check"
figure_speech = """
Second demo: reading the client without running it. [[slnc 400]] On the left, the constant pool: the strings the code loads. [[slnc 300]] Seven strings in three files. [[slnc 300]] Three of them, marked in red, name a key, a licence, or an address. [[slnc 300]] The first one is the licence key itself, in plain text. [[slnc 700]]
On the right, the bytecode of the check method, as java p prints it. [[slnc 300]] At offset six, l d c loads the key from the pool. [[slnc 300]] At offset nine, String dot equals compares it with the typed key. [[slnc 300]] At offset twelve, if equal zero jumps to seventeen when they differ, and returns zero: false. [[slnc 300]] Otherwise offset fifteen returns one: true. [[slnc 600]]
The whole decision is two instructions. [[slnc 300]] Remember offset twelve.
"""
speech = """
The real output. [[slnc 400]] Seven strings in the constant pool, and the star marks the three that name a key, a licence, or an address. [[slnc 300]] Then the thirteen names. [[slnc 300]] Ten are readable, and the other three are constructors.
[[page]]
The bytecode of check, tidied: the pool numbers are replaced by what they point to. [[slnc 300]] Twelve instructions in nineteen bytes.
[[page]]
And what it says, line by line. [[slnc 300]] No key returns false. [[slnc 300]] The key is loaded and compared. [[slnc 300]] If not equal, jump and return false. [[slnc 300]] If equal, return true.
"""
