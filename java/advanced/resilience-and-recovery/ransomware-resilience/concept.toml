[docs.session]
objectives = [
    "show what an attacker with the backup credentials can destroy in a plain, a versioned and a locked bucket",
    "give the backup job and the recovery account separate, minimal policies",
    "keep a copy in a second store with its own credentials",
    "stop poisoned backups with a canary file and entropy, and restore the last good run",
    "compute RTO and RPO for a restore exercise",
]
walkthrough = """
Run the demo and follow the count of restorable backups through the first three acts. In the fifth act find the line where the poisoned backup matches its manifest and say why that does not help. In the last act change the throughput and see which restore misses the target.
"""
exercises = [
    "Change the retention from 1 day to 30 and decide what a poisoned run costs to keep.",
    "Make the ransomware encrypt 10 percent of each file and find the block size at which the test stops seeing it.",
    "Add a second recovery step that replays the ledger and compares the total with the manifest.",
    "Write the same policies as OpenTofu files and apply them to the store.",
]

[docs.explained]
sentence = """
A backup the attacker can delete or poison is not a backup; lock it, separate it, copy it elsewhere, check what goes in, and practise the restore.
"""
verdict = """
Use object lock in COMPLIANCE mode for data that cannot be recreated, give the backup job only the right to add objects, keep a recovery account that can only read, copy to a store with other credentials, check the data before it is backed up and after it is restored, and practise a timed restore with a computed recovery time and point.
"""
recognise = [
    "A backup account with full access.",
    "Versioning mistaken for immutability.",
    "A nightly job that backs up whatever is there.",
    "A restore plan nobody has run.",
]

[spec]
purpose = """
Teach immutable backups, isolated recovery and a timed restore exercise for a bank's ledger, and measure them against a ransomware simulation.
"""
nongoals = [
    "Real malware.",
    "Backup of databases with transaction logs.",
    "Cloud provider specific vault products.",
]
problem = """
Backups are written by accounts that can delete them, copied without looking at them, and restored for the first time in a crisis.
"""
roles = [["The S3-compatible store and its users", "`Store`"], ["Buckets, versions and error codes", "`Bucket`"], ["Access policies", "`Policies`"], ["The backup job", "`BackupJob`"], ["Canary and entropy checks", "`Guard`, `Entropy`"], ["The ransomware simulation", "`Ransomware`"], ["Restore and verification", "`Restore`"], ["RTO and RPO arithmetic", "`Recovery`"]]
requirements = [
    "A plain, a versioned and a locked bucket are attacked with the backup credentials and the counts are printed.",
    "Retention in COMPLIANCE mode cannot be shortened or removed by the administrator.",
    "Writer and recovery credentials are separate and minimal.",
    "A copy lives in a second store with unrelated credentials.",
    "The ransomware simulation poisons a backup and the guard stops it.",
