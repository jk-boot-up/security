Bottom left, the poisoned backup checked. [[slnc 300]] Its S H A 256 sums match its manifest, ten of ten. [[slnc 300]] Of course they do: the manifest was made from the encrypted files. [[slnc 300]] But only one file, the short ransom note, looks like a ledger. [[slnc 600]]
Bottom right, the restore. [[slnc 300]] It takes the newest run that passes both checks: nine o'clock, identical for nine of nine files.
"""
