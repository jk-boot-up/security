[[act]]
title = "The guard: a canary file and entropy"
summary = "Ledger text scores 3.93 bits per byte, the same block encrypted 7.95; with a canary file and a 7.5 limit the guard refuses every encrypted directory."
detail = """
How entropy is worked out on one block of 4096 bytes: H is the sum, over the byte values that occur, of -p x log2(p), where p = count / 4096. The ledger text uses 18 byte values; the largest terms are '1' (633 times, p 0.1545, term 0.4163), ',' and '0', and H = 3.93 bits per byte. The same block encrypted with AES uses all 256 byte values, each about 28 times (p 0.0068, term 0.0492), and H = 7.95.
The guard has three detectors, and each one alone stops the backup: the canary file's SHA-256 changed, the entropy of a whole file is above 7.5, or the entropy of any 4 KiB block is above 7.5.
On five directories of 9 files: a healthy one is allowed; AES on every file trips all three; with the canary skipped by name, the entropy still catches it; AES on the first half of each file hides from the whole-file test but not from the block test; and a healthy directory with a compressed export is a false alarm, because compressed data looks like ciphertext.
"""
figure = "entropy_terms"
figure_title = "Entropy, worked out on one 4 KiB block"
figure_speech = """
Fifth demo: the guard that looks at the data before it is backed up. [[slnc 400]] Its main test is entropy: how evenly the bytes are spread. [[slnc 300]] The formula is at the top. [[slnc 300]] For each byte value, p is how often it occurs, divided by four thousand and ninety six, and the term is minus p times log two of p. [[slnc 700]]
On the left, one block of the ledger text. [[slnc 300]] The digit one occurs six hundred and thirty three times, so p is about fifteen percent, and its term is zero point four two. [[slnc 300]] Only eighteen byte values occur, and the sum is three point nine three bits per byte. [[slnc 700]]
In the middle, the same block after A E S encryption. [[slnc 300]] All two hundred and fifty six values occur, each about twenty eight times, and the sum is seven point nine five, close to the maximum of eight. [[slnc 600]]
On the right, the scale, with the limit at seven point five. [[slnc 300]] At the bottom, the guard on five directories: every encrypted one is refused, and so is a compressed export, a false alarm.
"""
speech = """
The output starts with the formula, then the three largest terms for the ledger text, and its total: three point nine three bits per byte. [[slnc 400]] Then the same block encrypted: two hundred and fifty six values, and seven point nine five.
[[page]]
The three detectors: the canary file, the entropy of a whole file, and the entropy of any four kibibyte block. [[slnc 400]] Healthy is allowed. [[slnc 300]] Skipping the canary does not help the ransomware. [[slnc 300]] Encrypting half of each file hides from the whole file test, but not from the block test. [[slnc 300]] And the compressed export is a false alarm.
"""
