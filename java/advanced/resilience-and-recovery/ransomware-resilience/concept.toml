title = "Ransomware Resilience"
short_title = "Ransomware Resilience"
package = "ransomres"
main_class = "RansomwareResilienceDemo"
tagline = "Keep a bank's ledger backups where an attacker with the backup credentials cannot destroy them: object lock, separate credentials, a second store, a guard against poisoned backups, and a restore exercise with a recovery time and point"
bold = "An attacker with the backup credentials overwrites 24 of 24 ledger backups in a plain bucket and deletes 24 of 24, and in a versioned bucket deletes all 48 versions by id and leaves 0 of 24 restorable; in a bucket with object lock in COMPLIANCE mode the same attacker, and the root administrator, are refused 24 of 24 times with AccessDenied, retention cannot be shortened or turned into GOVERNANCE and the bucket cannot be deleted, while 24 of 24 backups still restore by version; a backup account that can only add objects is refused 7 of 7 other actions, a copy in a second store answers InvalidAccessKeyId to the first store's root and survives its loss; ransomware that encrypts 9 files poisons the 10:00 backup (SHA-256 matches 10 of 10, looks like a ledger 1 of 10) unless the guard refuses it, and the restore of the 09:00 run is identical for 9 of 9 files with 3000 transactions lost; restoring 24 backups takes 91.6 minutes from the first store and 168.4 minutes from the air-gapped copy against a 240 minute target."
domain = "a bank"
domain_note = ""
youtube_description = "Ransomware resilience for a bank's ledger backups in Java with the AWS SDK against RustFS: object lock in COMPLIANCE mode, versioning, separate writer and recovery credentials, an air-gapped copy, a guard with a canary file and entropy that stops poisoned backups, and a restore exercise with computed RTO and RPO."
thumb_lines = ["RANSOMWARE", "RESILIENCE"]
thumb_code = "AccessDenied: COMPLIANCE retention"
youtube_title = "Ransomware Resilience: Immutable Backups, Isolated Recovery and a Timed Restore"
youtube_tags = ["ransomware", "immutable backups", "object lock", "worm", "s3", "rustfs", "air gap", "rto", "rpo", "backup security", "java"]

[readme]
intro = """
Ransomware does not only encrypt the live data. It looks for the backups, and an attacker who has the backup credentials can overwrite or delete them. This project builds the ledger backups of a **bank** in four layers and measures what each layer survives: a plain bucket, a **versioned** bucket, a bucket with **object lock in COMPLIANCE mode**, and a vault with **separate credentials** and a **copy in a second store**. It then runs a **ransomware simulation** (AES, originals deleted) to show the **poisoned backup**, a guard with a **canary file** and **entropy** checks, and a **restore exercise** whose time and data loss are computed. The store is **RustFS** (S3 API with versioning, object lock and policies) in Docker, driven with the **AWS SDK for Java v2**; the demo is tagged `integration`: `./gradlew integrationTest`.

What it shows:
- **No protection.** An attacker with the backup credentials loses the bank **24 of 24** backups by overwriting them, and the deletes are accepted **24 of 24** times.
- **Versioning only.** Overwrites are survived (**24 of 24** restore by version), but a permanent delete of all **48** versions by id leaves **0 of 24**.
- **Object lock.** Delete of a locked version is refused **24 of 24** times with **AccessDenied** for the backup credentials and for the root administrator; shortening the retention is refused, and 24 of 24 backups restore.
- **Isolation.** A writer that can only add objects is refused 7 of 7 other actions; a copy in a second store is unreachable from the first store's credentials and restores **24 of 24** after the first store is lost.
- **Poisoned backups.** After the infection the 10:00 backup matches its own SHA-256 manifest **10 of 10** but looks like a ledger **1 of 10**; the guard refuses it, and restoring run 09:00 gives **9 of 9** identical files with **3000** transactions lost.
- **The exercise.** 24 backups restore in **91.6** minutes from the first store and **168.4** minutes from the air-gapped copy (target 240).

**Maps to:** MITRE ATT&CK T1486 data encrypted for impact and T1490 inhibit system recovery · NIST CSF 2.0 RC.RP and PR.DS-11 · NIST SP 800-34 contingency planning · ISO/IEC 27001 A.8.13 information backup · 3-2-1-1-0 backup rule · FFIEC business continuity guidance for banks.
"""
analogy = """
A safe deposit box with a time lock that even the bank manager cannot open early, and a second box in another city. A burglar with the manager's keys can empty a normal drawer, but not the box that will not open until the date, and not the one he does not know about. A guard at the door checks that what goes into the box is still the ledger and not scrambled paper.
"""
scenario = """
A bank keeps hourly backups of its ledger in an object store. Ransomware reaches the data directory at 09:20, and the attacker has the backup service credentials. The demo measures what is lost with no protection, versioning, object lock, separate credentials and a second store, and then runs a timed restore.
"""
costs = [
    "**A lock also keeps bad backups,** so a poisoned backup stays for the whole retention and costs storage until it ends.",
    "**COMPLIANCE mode cannot be undone,** not by you either: a mistake in the retention period is paid for in full.",
    "**A lock does not stop an overwrite by key,** it only keeps the old version, so restores must look at versions and checksums.",
    "**A second store is a second system** to run, to patch and to test, with its own credentials to guard.",
    "**Detectors raise false alarms:** a compressed export looks like ciphertext, and half-encrypted files hide from a whole-file entropy test.",
    "**An untested restore is a guess,** and a real one costs people and hours.",
]
too_much = """
A laptop with no data that cannot be rebuilt does not need a locked vault. Use compliance locking for data that the business cannot recreate: ledgers, customer records and audit logs.
"""
met_before = [
    "Backups on a share that the same admin account can delete.",
    "A backup job that copies encrypted files every night.",
    "A restore that has never been tried.",
    "A retention period nobody checked against the time an attacker stays unnoticed.",
]
where = """
This is a project of the [resilience-and-recovery](..) module. It builds on the AWS SDK and policy work of the cloud-security modules and on the chaos experiments of security-chaos-engineering, which deletes things on purpose; here the thing that must survive is the backup.
"""
twin = """
RustFS is a real S3-compatible store and enforces the lock, the versions and the policies; the data are the project's own generated ledgers, the key of the ransomware is thrown away, and the production size and speed of the recovery time are a fixed model. No tool from the plan was skipped except OpenTofu, which the demo does not need.
"""
test_note = "The ledger, the entropy and canary guard, the ransomware simulation on a temporary directory, the policies and the recovery arithmetic are tested without tools. The demo starts two RustFS containers (./gradlew integrationTest)."

[[act]]
title = "A plain bucket"
summary = "With the backup credentials an attacker overwrites 24 of 24 backups and deletes 24 of 24."
detail = """
The bank keeps 24 hourly ledger snapshots in a bucket with no versioning and no lock, written by a service account that can do everything. The attacker uses that account to overwrite every backup with random bytes: 24 of 24 are accepted, 0 of 24 restore with a matching SHA-256, and then the deletes are accepted 24 of 24 times and no object is left.
"""
speech = """
First demo: a plain bucket. [[slnc 400]] The backup account can do everything. [[slnc 600]] Twenty four of twenty four overwritten, then deleted.
"""
rows = { plain = "active wrong" }
console = [
    ["overwrites accepted: 24 of 24", "bad"],
    ["backups that restore: 0 of 24", "bad"],
    ["objects left after deletes: 0", "bad"],
]

[[act]]
title = "Versioning only"
summary = "Versions survive an overwrite, but a permanent delete by version id removes all 48."
detail = """
With versioning every overwrite adds a version: 48 versions, 24 of 24 backups restore when the restore looks through the versions and 0 of 24 when it takes the latest. A delete of a key only adds a delete marker (24 markers, 48 versions still there). A permanent delete by version id is accepted 48 of 48 times and leaves 0 versions and 0 of 24 restorable backups.
"""
speech = """
Second demo: versioning. [[slnc 400]] It survives the overwrite. [[slnc 600]] But the version ids can be deleted too.
"""
rows = { versioning = "active wrong" }
console = [
    ["restore by version: 24 of 24", "ok"],
    ["permanent deletes accepted: 48 of 48", "bad"],
    ["backups that restore: 0 of 24", "bad"],
]

[[act]]
title = "Object lock in COMPLIANCE mode"
summary = "Deleting a locked version is refused 24 of 24 times, even for root; retention cannot be shortened."
detail = """
The bucket has object lock with a default retention of 1 day in COMPLIANCE mode (30 days or more in production). The backup credentials, the governance-bypass header and the root administrator are all refused with AccessDenied on 24 of 24 versions. An overwrite by key is accepted as a new version and the new garbage versions are locked too (48 of 48 refused), so 24 of 24 backups restore by version. Shortening the retention and changing COMPLIANCE to GOVERNANCE are AccessDenied, suspending versioning is InvalidBucketState and deleting the bucket is BucketNotEmpty. Root can extend a lock and can remove the default rule, which leaves the 24 stored versions locked but not new backups, unless the writer sets the retention on each object.
"""
speech = """
Third demo: object lock. [[slnc 400]] Even root is refused. [[slnc 600]] The old versions stay, and they restore.
"""
rows = { lock = "active ok" }
console = [
    ["delete by id refused: 24 of 24, AccessDenied", "ok"],
    ["shorten retention: AccessDenied", "ok"],
    ["restore by version: 24 of 24", "ok"],
]

[[act]]
title = "Isolation and an air-gapped copy"
summary = "A writer that can only add objects is refused 7 of 7 other actions; a second store answers InvalidAccessKeyId to the first store's root."
detail = """
The backup writer may add objects and list; the recovery account may read every version; nobody else is needed. The writer is refused a version delete, a key delete, a read, a retention change, a legal hold, a bucket delete and another bucket (AccessDenied each); the recovery account is refused a write and a delete. A policy cannot stop the writer from overwriting a key it wrote, which is why the lock matters. The 24 checked backups are copied to a second store whose credentials the first store does not know: the first store's root and the writer get InvalidAccessKeyId there, and a disconnected store answers nothing at all.
"""
speech = """
Fourth demo: isolation. [[slnc 400]] The writer can only add. [[slnc 600]] A second store does not know the first store's keys.
"""
rows = { isolation = "active ok" }
console = [
    ["writer: 7 of 7 other actions refused", "ok"],
    ["first store's root on second store: InvalidAccessKeyId", "ok"],
    ["air-gap copy restores: 24 of 24", "ok"],
]

[[act]]
title = "Ransomware and the poisoned backup"
summary = "The 10:00 backup of encrypted files passes its SHA-256 manifest 10 of 10; the guard refuses it and run 09:00 restores 9 of 9 files."
detail = """
A simulation encrypts the 9 files of the data directory with AES-256-GCM at 09:20 and deletes the originals. The unguarded job backs up 11 objects at 10:00; they match their own manifest 10 of 10 and look like a ledger 1 of 10 (the ransom note), and they cannot be deleted for the retention. The guard (canary file, file entropy, 4 KiB block entropy) refuses the run and writes 0 objects. Ransomware that skips the canary is caught by entropy, half-encrypted files only by the block test, and a compressed export is a false alarm. Restore picks the newest run that passes both checks: 09:00, identical for 9 of 9 files, with 3000 transactions lost at 1800 an hour.
"""
speech = """
Fifth demo: ransomware. [[slnc 400]] The checksum matches because the backup is of the encrypted files. [[slnc 600]] A guard, then the last good run.
"""
rows = { ransom = "active wrong" }
console = [
    ["poisoned backup SHA-256 matches: 10 of 10", "bad"],
    ["guard refused: wrote 0 objects", "ok"],
    ["transactions lost: 3000", "ok"],
]

[[act]]
title = "The restore exercise"
summary = "24 backups restore into a fresh directory in 91.6 minutes from the first store and 168.4 from the air-gapped copy."
detail = """
The exercise restores the 24 backups into a fresh directory, checks every SHA-256 against the manifest and the ledger total, and counts 120 steps. The recovery time is computed, not timed: 15 minutes to declare, 45 to build a clean environment, 120 steps of 3 seconds and 24 backups of 25 GiB at 400 MiB/s, which is 91.6 minutes; after the first store is destroyed the copy at 100 MiB/s gives 168.4 minutes. Both meet the 240 minute target. The recovery point depends on the schedule: 19200, 4800, 3000 and 2550 transactions lost for backups every 1440, 240, 60 and 15 minutes.
"""
speech = """
Sixth demo: the restore exercise. [[slnc 400]] Twenty four of twenty four, checked against the manifest. [[slnc 600]] The time is arithmetic, not a stopwatch.
"""
rows = { restore = "active ok" }
console = [
    ["restore 1: 24 of 24, 91.6 min", "ok"],
    ["first store destroyed: unreachable", "bad"],
    ["restore 2 from the copy: 24 of 24, 168.4 min", "ok"],
]

