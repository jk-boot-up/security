console_green = ["THE RESTORE", "THE SECOND STORE", "THE RECOVERY ACCOUNT", "THE DIRECTORIES"]
console_amber = ["HOW "]

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] The store is real, so most of the work is a few S 3 calls and a few checks. [[slnc 300]] Here are the classes that matter."""

[[class]]
name = "Bucket"
what = "the few S3 calls the demo repeats"
[[class.part]]
title = "object lock with a default retention in COMPLIANCE mode"
code = """
c.createBucket(b -> b.bucket(name).objectLockEnabledForBucket(true));
c.putObjectLockConfiguration(b -> b.bucket(name)
    .objectLockConfiguration(o -> o
        .objectLockEnabled(ObjectLockEnabled.ENABLED)
        .rule(r -> r.defaultRetention(d -> d
            .mode(ObjectLockRetentionMode.COMPLIANCE)
            .days(days)))));
"""
speech = """Object lock must be switched on when the bucket is created; it also turns versioning on. [[slnc 300]] The default rule then locks every new version for that many days, in compliance mode."""
[[class.part]]
title = "every attempt becomes ok, an error code, or unreachable"
code = """
try {
    call.run();
    return "ok";
} catch (S3Exception e) {
    return e.awsErrorDetails().errorCode();
} catch (SdkClientException e) {
    return "unreachable";
"""
speech = """Every attack in the demo goes through this method. [[slnc 300]] The store's own answer, such as access denied, is what gets counted and printed."""

[[class]]
name = "Policies"
what = "who may do what to the backups"
[[class.part]]
title = "the writer may add and list; the recovery account may read"
code = """
static final List<String> WRITER = List.of(
    "s3:PutObject", "s3:ListBucket");
...
static final List<String> READER = List.of(
    "s3:GetObject", "s3:GetObjectVersion",
    "s3:ListBucket", "s3:ListBucketVersions");
"""
speech = """Two small lists of actions, turned into policy documents for the store. [[slnc 300]] No delete, and no retention change, for either of them."""

[[class]]
name = "Guard"
what = "the check before a backup"
[[class.part]]
title = "three detectors, any one stops the backup"
code = """
boolean canaryChanged = !Files.isRegularFile(canary)
    || !Sha.hex(Files.readAllBytes(canary)).equals(canaryHash);
...
fileHigh |= data.length >= Entropy.BLOCK / 2
    && Entropy.bits(data) > Entropy.LIMIT;
blockHigh |= Entropy.maxBlock(data) > Entropy.LIMIT;
"""
speech = """The canary is compared with its known checksum. [[slnc 300]] Then every file is tested twice: as a whole, and block by block, so that half-encrypted files are caught too."""

[[class]]
name = "Entropy"
what = "Shannon entropy in bits per byte"
[[class.part]]
title = "the sum of -p x log2(p) over the byte values"
code = """
for (int c : counts) {
    if (c > 0) {
        double p = (double) c / length;
        h -= p * (Math.log(p) / Math.log(2));
"""
speech = """This is the formula from the picture. [[slnc 300]] A teaching class, EntropySteps, prints the same sum term by term, and a test proves it gives exactly this value."""

[[class]]
name = "BackupJob"
what = "copies a directory, with a SHA-256 manifest"
[[class.part]]
title = "a guarded job looks first and writes nothing"
code = """
Guard.Verdict verdict = guard.check(dir);
if (guarded && !verdict.clean()) {
    return new Result(true, 0, verdict);
}
"""
speech = """Without this check, the job backs up whatever is there, encrypted or not, with a perfectly matching manifest."""

[[class]]
name = "Restore"
what = "the way back"
[[class.part]]
title = "a run must match its manifest and still look like a ledger"
code = """
sumsOk &= Sha.hex(data).equals(e.getValue());
contentOk &= Guard.looksLikeLedger(data)
    && !e.getKey().endsWith(".locked");
"""
speech = """A checksum alone would accept the poisoned run. [[slnc 300]] The content test is what makes the restore skip it."""

[[class]]
name = "Recovery"
what = "recovery time and point, with no clock"
[[class.part]]
title = "the time from the steps and backups the restore really took"
code = """
long transferSeconds = backups
    * (MODELLED_BYTES_PER_BACKUP / (1024 * 1024)) / mibPerSecond;
return DECLARE_SECONDS + PROVISION_SECONDS
    + steps * SECONDS_PER_STEP + transferSeconds;
"""
speech = """Nothing here reads a clock, so the answer is the same on a fast or a slow machine. [[slnc 300]] The data lost is the minutes since the last good backup, times the transactions per minute."""

[[acronym]]
short = "S3"
long = "Simple Storage Service: the object store interface"
say = "S 3 is simple storage service, the object store interface that RustFS speaks."
[[acronym]]
short = "SHA-256"
long = "Secure Hash Algorithm, 256 bits: a checksum"
say = "S H A 256 is the secure hash algorithm with two hundred and fifty six bits, used here as a checksum."
[[acronym]]
short = "AES"
long = "Advanced Encryption Standard"
say = "A E S is the advanced encryption standard, the cipher the ransomware uses."
[[acronym]]
short = "GCM"
long = "Galois/Counter Mode: an AES mode"
say = "G C M is Galois counter mode, a way of using A E S."
[[acronym]]
short = "RTO"
long = "Recovery Time Objective: how long the way back may take"
say = "R T O is recovery time objective: how long the way back may take."
[[acronym]]
short = "RPO"
long = "Recovery Point Objective: how much data may be lost"
say = "R P O is recovery point objective: how much data may be lost."
[[acronym]]
short = "AWS"
long = "Amazon Web Services, where the S3 interface comes from"
say = "A W S is Amazon Web Services, where the S 3 interface comes from."
[[acronym]]
short = "SDK"
long = "Software Development Kit: here the AWS SDK for Java"
say = "S D K is software development kit: here the Java library that talks S 3."
[[acronym]]
short = "KiB/MiB/GiB"
long = "kibibyte, mebibyte, gibibyte: 1024, 1024 x 1024, ... bytes"
say = "K i B, M i B and G i B are kibibytes, mebibytes and gibibytes: powers of one thousand and twenty four bytes."
[[acronym]]
short = "root"
long = "the store's administrator account"
say = "Root is the store's administrator account, which may do anything that is not locked."
