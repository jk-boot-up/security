[[scene]]
key = "01-poster"
kind = "poster"
title = "Ransomware Resilience"
narration = "Hello, and welcome. [[slnc 400]] This video explains ransomware resilience. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] Ransomware does not only encrypt the live data. [[slnc 300]] It looks for the backups, and an attacker with the backup credentials can overwrite or delete them. [[slnc 300]] Resilience is a backup the attacker cannot change, cannot reach, and that you have practised restoring. [[slnc 600]] Think of a bank's records kept in a time locked vault in another city: even the manager cannot open it early. [[slnc 600]] Our example is a bank, with two real object stores that speak the S 3 interface, the simple storage service."

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["A bank keeps hourly backups of its ledger", "in an object store.", "", "Ransomware reaches the data at 09:20, and the", "attacker has the backup credentials. The demo", "adds one layer of protection at a time."]
narration = "Here is the scenario. [[slnc 400]] A bank keeps hourly backups of its ledger in an object store. [[slnc 500]] Ransomware reaches the data directory at twenty past nine, and the attacker has the backup service's credentials. [[slnc 500]] The demo measures what is lost with no protection, with versioning, with object lock, and with separate credentials and a second store. [[slnc 300]] Then it guards the backup job, and runs a timed restore."

[[scene]]
key = "02-words"
kind = "bullets"
title = "The Words"
body = ["Version: each write of a key is kept, with an id", "Object lock: no delete before a retain-until date", "COMPLIANCE mode: nobody, not even root, may unlock", "Air gap: a copy the first store's keys cannot reach", "Canary: a file that must never change", "Entropy: how evenly bytes spread, 0 to 8 bits", "Manifest: one SHA-256 per file, kept apart"]
narration = """Before the demos, the words. [[slnc 500]] With versioning, each write of a key is kept as a version, with its own id. [[slnc 500]] Object lock forbids deleting a version before its retain until date. [[slnc 500]] In compliance mode, nobody, not even root, can remove or shorten that lock. [[slnc 500]] An air gap is a copy that the first store's credentials cannot reach. [[slnc 500]] A canary is a file that must never change, so a change means trouble. [[slnc 500]] Entropy measures how evenly the bytes are spread, from zero to eight bits per byte. [[slnc 500]] And a manifest lists one S H A 256 checksum per file, kept apart from the backups."""

[[scene]]
key = "02-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "02-idea"
kind = "figure"
title = "One backup, three kinds of bucket"
body = "one_backup"
narration = """Let's see the core idea on one backup: the first ledger snapshot. [[slnc 400]] At the top of each column, before the attack, it has one version, and its checksum matches. [[slnc 600]] Now the attacker, holding the backup credentials, overwrites it, and then deletes it by its version id. [[slnc 600]] On the left, a plain bucket keeps only one version. [[slnc 300]] The overwrite replaces the ledger, and the delete leaves nothing. [[slnc 500]] In the middle, versioning keeps the ledger under the garbage. [[slnc 300]] But a delete by version id is permanent, so both versions go. [[slnc 500]] On the right, object lock in compliance mode. [[slnc 300]] The garbage is added as a new version, but neither version can be deleted before its date, not even by root. [[slnc 300]] So the ledger is still there, and it restores."""

[[scene]]
key = "03-acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "03-rpo"
kind = "figure"
title = "How much data a backup schedule loses"
body = "rpo_schedule"
narration = """One more picture, about the recovery point: how much data is lost. [[slnc 400]] At the top, the case from the demo. [[slnc 300]] The last good backup is nine o'clock, and the systems are cut off at ten forty: one hundred minutes. [[slnc 300]] The bank takes one thousand eight hundred transactions an hour, so one hundred minutes lose three thousand. [[slnc 600]] Below, the same infection under four schedules. [[slnc 300]] Once a day loses nineteen thousand two hundred. [[slnc 300]] Every four hours, four thousand eight hundred. [[slnc 300]] Every hour, three thousand. [[slnc 300]] Every fifteen minutes, two thousand five hundred and fifty. [[slnc 500]] The schedule sets the floor; the time to notice the attack adds the rest."""

[[scene]]
key = "04-costs"
kind = "bullets"
title = "What It Costs"
body = ["Locked backups cannot be deleted, even by mistake", "Retention costs storage for every poisoned run", "A second store needs its own credentials", "Checksums prove a copy, not that it is good", "Entropy tests raise false alarms", "Restores must be practised and timed"]
narration = "Nothing is free. [[slnc 400]] Here is what it costs. [[slnc 500]] Locked backups cannot be deleted, not even by mistake, and not even by root. [[slnc 500]] Retention costs storage, including for every poisoned run. [[slnc 500]] A second store needs its own credentials, kept apart. [[slnc 500]] A checksum proves a copy is complete, not that what was copied is good. [[slnc 500]] Entropy tests raise false alarms, for example on a compressed export. [[slnc 300]] And restores must be practised, and timed."

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["A ransom note in every folder", "Files with a new extension that will not open", "Backup jobs that succeeded, of encrypted data", "AccessDenied when deleting a locked object"]
narration = "You have probably met this already. [[slnc 400]] A ransom note in every folder, and files with a new extension that will not open, are the attack. [[slnc 500]] Backup jobs that all succeeded, of data that was already encrypted, are poisoned backups. [[slnc 500]] And access denied, when deleting a locked object, is object lock doing its job."

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Lock backups in COMPLIANCE mode", "Set the retention on each object, too", "Give the backup writer add-only rights", "Keep a copy in a second, separate store", "Check that data looks right before backing up", "Practise and time the restore"]
narration = "So, how do you use it? [[slnc 400]] Lock backups with object lock, in compliance mode. [[slnc 300]] Set the retention on each object as well, not only as the bucket's default. [[slnc 500]] Give the backup writer the right to add, and nothing else. [[slnc 500]] Keep a copy in a second, separate store, with credentials the first cannot reach. [[slnc 500]] Check that the data still looks right before you back it up. [[slnc 300]] And practise the restore, and time it."

[[scene]]
key = "12-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Change the retention to", "30 days, and work out what a poisoned run costs."]
narration = "That's ransomware resilience. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Assume the attacker has the backup credentials: lock the backups, keep a copy they cannot reach, check what goes in, and practise the restore. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Change the retention from one day to thirty, and work out what keeping a poisoned run costs. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"

