title = "How To Use It"
body = ["Show what an attacker with the backup credentials can destroy in a plain, a versioned and a locked bucket", "Give the backup job and the recovery account separate, minimal policies", "Keep a copy in a second store with its own credentials", "Stop poisoned backups with a canary file and entropy, and restore the last good run", "Compute RTO and RPO for a restore exercise"]
narration = "So, how do you use it? [[slnc 400]] Use object lock in COMPLIANCE mode for data that cannot be recreated, give the backup job only the right to add objects, keep a recovery account that can only read, copy to a store with other credentials, check the data before it is backed up and after it is restored, and practise a timed restore with a computed recovery time and point."

