[threatmodel]
scope = """
The decision a payments service takes when a control it calls cannot answer. It does not cover the controls' own correctness.
"""
assets = [
    "Approved payments.",
    "Audit records.",
    "The limit on one account.",
]
actors = [
    "An attacker who degrades a dependency.",
    "An outage.",
    "An operator.",
]
boundaries = [
    "The network between the service and each dependency.",
]
assumptions = [
    "The experiments run on a copy of the service.",
]
out_of_scope = [
    "Attacks on the proxy.",
    "Load and capacity.",
]
tests = [
    "`PaymentsTest` runs both versions against stub dependencies, the audit trails and the deadline with the JDK only.",
    "`MonitorTest` checks that an alert comes after exactly 3 failed probes.",
    "`DemoRunsTest` starts Toxiproxy and compares the whole demo with the golden output (integrationTest).",
]
next = """
The next project in the module is the ransomware resilience work.
"""

[[threat]]
id = "T1"
stride = "D"
threat = "A dependency is slowed or dropped on purpose"
where = "the network path"
control = "Fail closed and a deadline on every call"
residual = "Payments wait in review"

[[threat]]
id = "T2"
stride = "T"
threat = "The service reads silence as permission"
where = "the decision code"
control = "Deny, review or a local fallback"
residual = "A stale cache of revocation answers"

[[threat]]
id = "T3"
stride = "R"
threat = "A failed control is not reported"
where = "operations"
control = "Probes with an alert after 3 failures"
residual = "Degradations the probes do not see"

