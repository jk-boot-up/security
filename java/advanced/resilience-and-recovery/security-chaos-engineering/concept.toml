[[act]]
title = "The audit trail: the sink down, then a slow close"
summary = "With the audit sink down for a burst the first version loses 20 of 20 records without a sound; the hardened one keeps 20 in a journal and sends 20 when the sink is back. A slow close loses nothing in either."
detail = """
The hypotheses: every decision reaches the audit sink once it is back (E6), and a slow close loses no record and raises no false alarm (E7).
The first version keeps a buffer of 5 records in memory and drops what cannot be sent: in E6 the 20 payments are approved and 20 of 20 records are lost; dropped 20, and nobody is told. The hardened version writes each record to a journal on disk first, then sends it: 20 wait in the journal while the sink is down, and 20 are sent when it is back, so 0 of 20 are lost.
The slow close (E7) costs nothing: 4 approved, 0 of 4 lost, in both versions.
"""
figure = "audit_paths"
figure_title = "Twenty decisions while the audit sink is down"
figure_speech = """
Fourth demo: the audit trail. [[slnc 400]] Every decision the service makes must reach the audit sink, and here the sink is down during a burst of twenty payments. [[slnc 700]]
At the top, the first version. [[slnc 300]] Records go into a small buffer in memory, and a sender thread posts them. [[slnc 300]] Each post fails, and each record is dropped. [[slnc 300]] All twenty are gone, and the payments were still approved, so nobody notices. [[slnc 700]]
At the bottom, the hardened version. [[slnc 300]] Each record is written to a journal on disk first. [[slnc 300]] While the sink is down, twenty wait there. [[slnc 300]] When it is back, all twenty are sent, and none is lost.
"""
speech = """
The output: the two hypotheses. [[slnc 300]] The first version loses twenty of twenty records while the sink is down, and the slow close loses nothing. [[slnc 400]] The hardened version loses zero: twenty wait in the journal, and twenty are sent when the sink is back.
"""
