[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] Most of the difference between the two versions is a few lines that decide what silence means. [[slnc 300]] Here are the classes that matter."""

[[class]]
name = "BankPayments"
what = "the payments service, first and hardened"
[[class.part]]
title = "no answer from authorization: deny, or carry on"
code = """
Optional<String> authz = http.get(at.authorization()
    + "/check?account=" + p.account() + "&amount=" + p.amount());
if (authz.isEmpty()) {
    if (hardened) {
        return Decision.deny("authorization unreachable");
    }
"""
speech = """An empty answer means the call failed. [[slnc 300]] The hardened version denies. [[slnc 300]] The first version falls through, and the payment carries on as if authorization had said yes."""
[[class.part]]
title = "no fraud score: hold for review, or approve unscreened"
code = """
if (fraud.isEmpty()) {
    return hardened ? Decision.review("fraud score unreachable")
        : Decision.approve(false, "no score, treated as clean");
}
"""
speech = """Without a score, the hardened version asks a person. [[slnc 300]] The first version approves, and marks the payment as unscreened, which is how the demo can count them."""

[[class]]
name = "Http"
what = "a client with one deadline for the whole call"
[[class.part]]
title = "the deadline covers the body too"
code = """
CompletableFuture<HttpResponse<String>> call =
    client.sendAsync(request, HttpResponse.BodyHandlers.ofString());
try {
    HttpResponse<String> response =
        call.get(deadlineMillis, TimeUnit.MILLISECONDS);
"""
speech = """The whole exchange, body included, must finish within the deadline. [[slnc 300]] So a trickle of bytes cannot keep the service waiting."""

[[class]]
name = "SpooledAudit"
what = "the hardened audit trail: a journal first"
[[class.part]]
title = "write the journal, then send; if the journal fails, say no"
code = """
try {
    Files.writeString(journal, id + "\\n",
        StandardOpenOption.CREATE, StandardOpenOption.APPEND);
} catch (IOException e) {
    return false;
}
pending.add(id);
"""
speech = """The record is on disk before anything is sent. [[slnc 300]] If even the journal cannot be written, the payment is refused, rather than made without a record."""

[[class]]
name = "Monitor"
what = "probes, and an alert after three failures"
[[class.part]]
title = "three failed probes in a row raise one alert"
code = """
int n = failures.merge(name, 1, Integer::sum);
seen.add(n);
if (n == THRESHOLD) {
    alerts.add(new Alert(name, n));
"""
speech = """A failure adds one to the count in a row, and an answer resets it. [[slnc 300]] Exactly at three, one alert is raised."""

[[class]]
name = "Toxiproxy"
what = "the proxy container, driven over its interface"
[[class.part]]
title = "a fault is a disabled proxy or a toxic"
code = """
int status = fault == Fault.DOWN
    ? call("POST", "/proxies/" + proxy, "{\\"enabled\\":false}")
    : call("POST", "/proxies/" + proxy + "/toxics",
        fault.toxicJson());
"""
speech = """Down switches the proxy off. [[slnc 300]] Every other fault adds a toxic, such as latency, a reset or a bandwidth limit, on that one connection."""

