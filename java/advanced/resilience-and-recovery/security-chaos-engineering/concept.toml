[readme]
intro = """
A security control is a dependency like any other: it is a call over a network, and it can be slow, hung, reset or gone. What the service does then is a decision somebody made, often by accident. This project asks the question by experiment. A **bank payments service** (built with the JDK `HttpServer`) calls five dependencies through **Toxiproxy**, which runs in Docker and is driven from Java through its HTTP API. Each of 10 experiments states a **steady state**, **injects a failure**, **observes** and gives a **verdict**, for two hypotheses: the control **fails closed**, and **an alert fires**. The first version has planted weaknesses; the hardened version fixes them. The demo needs Docker and the `ghcr.io/shopify/toxiproxy:2.13.0` image (a few MB) and is tagged `integration`: `./gradlew integrationTest`.

What it shows:
- **Fail open.** With authorization down, slow or reset the first version approves **6 of 6** payments; the hardened one approves **0 of 6**.
- **Unscreened payments.** With the fraud service hung or on a trickle **6 of 6** are approved without a score; the hardened version holds **6 of 6** for review.
- **Silent loss.** A burst of 20 decisions while the audit sink is down loses **20 of 20** records in the first version and **0 of 20** in the hardened one.
- **Limits and revocation.** One account gets **40 of 40** payments through a limit of 5 when the store resets, against **5 of 40**; a revoked certificate is approved **6 of 6** when the responder is down or slow, against **0 of 6**.
- **Alerts.** The first version raises **0** alerts; the hardened version raises one after **3** failed probes, and none for a slow close that costs nothing. Scoreboard: **2 of 20** hypotheses held against **20 of 20**.

**Maps to:** NIST SP 800-53 SI-13, SC-24 (fail in known state), AU-5 (response to audit processing failures), CP-10 · OWASP ASVS 5.0 V16 Security Logging and Error Handling · MITRE ATT&CK T1562 (impair defenses) · Principles of Chaos Engineering.
"""
analogy = """
A fire drill for the locks. You do not wait for a real power cut to find out whether the doors open or stay shut: you cut the power on purpose, with the building watched, and write down what each door did and whether the alarm rang.
"""
scenario = """
A bank's payments service checks every payment against five controls. In a real incident the dependencies fail one at a time. The demo breaks them one at a time on purpose, and counts what the service approves, what it loses and what it reports.
"""
costs = [
    "**Experiments need a safe place:** a copy of the service, not production at first.",
    "**Fail closed costs customers:** payments wait or are refused while a dependency is down.",
    "**Probes see failures, not every degradation:** a slow close passes them.",
    "**A cache or fallback has its own gap,** like a certificate revoked during an outage.",
    "**Injected failures are tidy;** real ones are messier.",
]
too_much = """
A service with no dependencies that guard anything needs no drill. Start with the controls that, if they quietly stopped, would turn a bad payment into an approved one.
"""
met_before = [
    "A try and catch that returns true.",
    "A timeout that falls back to allow.",
    "A log buffer that drops when it is full.",
    "A revocation check that soft-fails.",
]
where = """
This is a project of the [resilience-and-recovery](..) module. The earlier modules built the controls; this one asks what they do when they are hurt. It uses the same idea as ransomware resilience: assume the failure and measure the response.
"""
twin = """
Toxiproxy is real and runs in Docker. The payments service and its five dependencies are the project's own small programs; the failures are injected on the real connections between them. Nothing is simulated in the service's own code.
"""
test_note = "The service, the audit trails, the monitor and its probe history, and the trickle arithmetic are tested with stub dependencies and no Docker. The demo starts Toxiproxy (./gradlew integrationTest)."

[[act]]
title = "The service, the faults and the steady state"
summary = "Five controls, each a call to a dependency through its own Toxiproxy proxy; six faults; a 1500 ms deadline; and a steady state that holds before 20 of 20 runs."
detail = """
The input: a bank payments service with five controls, each a call to a dependency: the rate limit (ratelimit), the certificate revocation check (revocation), authorization, the fraud score (fraud) and the audit trail (audit). The first version, when a call fails, reads it as no limit, not revoked, allow, a clean score, and drops the audit record.
Toxiproxy 2.13.0 sits between the service and each dependency and can inject six faults: down (connections refused), slow (answers held back 5000 ms), hang (accepted, nothing sent), reset, trickle (1 KB per second) and slow close (3000 ms after the answer). Every call has a deadline of 1500 ms, body included.
The steady state, checked before each experiment in both versions: s1 and s2 are approved, s3 (9000) is denied by the fraud score, s4 (certificate rev-7) is denied by the revocation check, and 4 of 4 audit records arrive. It held before 20 of 20 runs, so every difference later is caused by the fault.
"""
figure = "controls_map"
figure_title = "Five controls, five proxies, six faults"
figure_speech = """
First demo: the service, and how it is hurt. [[slnc 400]] On the left, the bank's payments service. [[slnc 300]] Every payment goes through five controls, and each control is a call to another service. [[slnc 300]] The rate limit store, the certificate revocation responder, authorization, the fraud score, and the audit sink. [[slnc 700]]
In the middle, Toxiproxy. [[slnc 300]] Each dependency is reached through its own proxy, so a failure can be injected on exactly one connection, on purpose. [[slnc 600]]
At the bottom, the six faults it can inject. [[slnc 300]] Down, slow, a hang, a reset, a trickle, and a slow close. [[slnc 600]] An experiment is always the same four steps: check the steady state, inject one fault, count what the service does, and give a verdict.
"""
