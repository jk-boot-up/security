[[act]]
title = "The fraud score: a hang and a trickle"
summary = "With the fraud service hung or on a trickle the first version approves 6 of 6 payments unscreened; the hardened one holds 6 for review. A 4009-byte answer at 1024 bytes a second takes 3.9 s, past the 1.5 s deadline."
detail = """
The hypotheses: no payment is approved without a fraud score when the fraud service hangs (E4) or trickles (E5).
The first version reads no score as a clean score: unscreened 6 of 6, review 0, BROKEN. The hardened version holds the payment for a person: unscreened 0 of 6, review 6, held.
How the trickle misses the deadline: an answer is 4009 bytes, the score line and a padding; at 1024 bytes a second that is 4009 / 1024 = 3.9 s, more than the 1.5 s deadline. A deadline on the connection alone would wait for every byte.
"""
figure = "fraud_trickle"
figure_title = "No score, and a trickle that misses the deadline"
figure_speech = """
Third demo: the fraud score. [[slnc 400]] At the top, the two experiments. [[slnc 300]] The fraud service accepts the connection and then hangs, or it answers one kilobyte a second. [[slnc 600]] The first version approves all six payments without any score. [[slnc 300]] The hardened version holds all six for a person to review. [[slnc 700]]
At the bottom, why the trickle is a failure at all. [[slnc 300]] The answer is four thousand and nine bytes. [[slnc 300]] At one thousand and twenty four bytes a second, it takes three point nine seconds to arrive. [[slnc 300]] The green line is the deadline, one and a half seconds, for the whole call, body included. [[slnc 300]] So the service gives up long before the answer is complete.
"""
speech = """
The output: the hypotheses, then the first version, with six of six unscreened and none held for review. [[slnc 400]] The hardened version: zero unscreened, six held for review. [[slnc 400]] And the trickle, worked out: four thousand and nine bytes, at one thousand and twenty four a second, is three point nine seconds, more than the deadline.
"""
