[[scene]]
key = "01-poster"
kind = "poster"
title = "Security Chaos Engineering"
narration = "Hello, and welcome. [[slnc 400]] This video explains security chaos engineering. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A security control is often a call to another service, and that service can be slow, hung, reset, or gone. [[slnc 300]] What happens then is a decision somebody made, often by accident. [[slnc 300]] Security chaos engineering breaks the dependency on purpose, and checks two things: that the control holds, and that someone is told. [[slnc 600]] Think of a bank cutting the power to its alarm system during a drill, to see whether the doors lock or open. [[slnc 600]] Our example is a bank."

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["A bank's payments service checks every payment", "with 5 controls: a rate limit, a revocation check,", "authorization, a fraud score and an audit trail.", "", "Toxiproxy breaks each dependency on purpose.", "10 experiments, 2 hypotheses each."]
narration = "Here is the scenario. [[slnc 400]] A bank's payments service checks every payment with five controls: a rate limit, a certificate revocation check, authorization, a fraud score, and an audit trail. [[slnc 500]] Each one calls a dependency. [[slnc 300]] Toxiproxy sits in between, and breaks them one at a time: down, slow, hung, reset, or on a trickle. [[slnc 500]] Ten experiments each test two hypotheses: the control holds, and an alert fires."

[[scene]]
key = "02-words"
kind = "bullets"
title = "The Words"
body = ["Steady state: what normal looks like, checked first", "Hypothesis: what must stay true under the fault", "Fail open: no answer is read as yes", "Fail closed: no answer is read as no", "Deadline: the most time a whole call may take", "Probe: a small health check; 3 failures, an alert"]
narration = """Before the demos, the words. [[slnc 500]] The steady state is what normal looks like, and it is checked before every experiment. [[slnc 500]] A hypothesis is what must stay true while the fault is in place. [[slnc 500]] A control fails open when no answer is read as yes. [[slnc 500]] It fails closed when no answer is read as no. [[slnc 500]] A deadline is the most time a whole call may take, body included. [[slnc 500]] And a probe is a small health check: three failures in a row raise an alert."""

[[scene]]
key = "02-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "02-idea"
kind = "figure"
title = "One call, two answers to silence"
body = "fail_open_closed"
narration = """Let's see the core idea on one call. [[slnc 400]] The payments service asks authorization whether this account may pay. [[slnc 300]] But Toxiproxy has switched that connection off, so the question is refused, and no answer comes back. [[slnc 700]] Now the service has to decide what silence means. [[slnc 600]] On the left, the first version. [[slnc 300]] Its code says: if there is no answer, approve. [[slnc 300]] So six of six payments are approved, and the control is broken. [[slnc 600]] On the right, the hardened version. [[slnc 300]] If there is no answer, deny. [[slnc 300]] Zero of six are approved, and the control holds. [[slnc 500]] One line of code, chosen once, decides what every outage does."""

[[scene]]
key = "03-acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "04-costs"
kind = "bullets"
title = "What It Costs"
body = ["Failing closed refuses good payments", "  while a dependency is down", "Holding payments for review needs people", "A journal for audit records needs disk", "A local count or cache has its own gap", "Experiments must be run with care"]
narration = "Nothing is free. [[slnc 400]] Here is what it costs. [[slnc 500]] Failing closed refuses good payments while a dependency is down. [[slnc 500]] Holding payments for review needs people to review them. [[slnc 500]] Keeping audit records in a journal until the sink is back needs disk, and a flush. [[slnc 500]] A local count, or a cached answer, has its own gap, like the revoked certificate. [[slnc 300]] And experiments outside a test copy must be planned, small, and easy to stop."

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["catch (Exception e) { return true; }", "A timeout on connect, but none on the read", "Audit logs with a gap during an outage", "A dashboard that stayed green all through", "  an incident"]
narration = "You have probably met this already. [[slnc 400]] A catch block that returns true is a control that fails open. [[slnc 500]] A timeout on connect, but none on the read, lets a trickle hang the service. [[slnc 500]] Audit logs with a gap during an outage are records lost in silence. [[slnc 500]] And a dashboard that stayed green all through an incident is a missing alert."

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Decide fail open or closed for each control", "Put a deadline on the whole call", "Hold for review instead of approving blind", "Never drop an audit record in silence", "Alert on a failing control; test it by experiment"]
narration = "So, how do you use it? [[slnc 400]] Decide, on purpose, whether each control fails open or closed. [[slnc 500]] Put a deadline on the whole call, body included. [[slnc 500]] When a check cannot answer, hold the payment for review, instead of approving it blind. [[slnc 500]] Never drop an audit record in silence. [[slnc 300]] And alert when a control is failing, then prove all of it by experiment."

[[scene]]
key = "12-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Make the audit sink slow", "instead of down, and see what holds."]
narration = "That's security chaos engineering. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Break each control's dependency on purpose, and check that the control holds, and that somebody hears about it. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add an experiment that makes the audit sink slow instead of down. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"

