[[act]]
title = "Pseudonyms for analytics"
summary = "A keyed pseudonym is stable under one key and different under another; it replaces a name, it does not hide a person."
detail = """
The analytics extract has one row for each transaction with an HMAC-SHA256 pseudonym of the customer. 22,346 rows carry 2,000 pseudonyms. The same customer gets the same pseudonym under the same key, which keeps joins working, and another one under a new key. The rows still carry the postcode, birth date and gender.
"""
figure = "pseudonym_steps"
figure_title = "How a pseudonym is made"
figure_speech = """
Third demo: pseudonyms for analytics. [[slnc 400]] On the left, the input. [[slnc 300]] The text is customer, colon, seventeen, and the key is a secret that the bank keeps. [[slnc 600]]
H M A C with S H A two fifty six mixes the key into a hash of the text, and gives thirty two bytes, shown in hex. [[slnc 300]] The pseudonym is the first eight bytes, boxed in green. [[slnc 300]] Without the key, nobody can work it out from a customer number. [[slnc 600]]
In the middle: the same customer under the same key gets the same pseudonym, so the analytics team can still join the rows of one customer. [[slnc 300]] Under another key, it gets a different one. [[slnc 600]]
At the bottom, what it does not hide. [[slnc 300]] The rows still carry the postcode, the birth date and the gender, so the outside list ties sixteen thousand five hundred and thirty nine of the twenty two thousand three hundred and forty six rows back to a name. [[slnc 300]] A pseudonym replaces a name. [[slnc 300]] It does not hide a person.
"""
speech = """
Here is the output. [[slnc 400]] The input text and the key. [[slnc 300]] Then the whole H M A C, thirty two bytes on two lines, and the pseudonym: its first eight bytes. [[slnc 400]] Then the same customer three times: twice under the first key, with the same pseudonym, and once under the second key, with a different one.
[[page]]
The published analytics rows: twenty two thousand three hundred and forty six rows, with two thousand distinct pseudonyms, one for each customer. [[slnc 300]] One row of customer seventeen: the pseudonym, an amount band, the full postcode, birth date and gender, and the year. [[slnc 400]] So the outside list ties sixteen thousand five hundred and thirty nine rows back to a name.
"""
