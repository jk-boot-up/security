[project]
slug = "privacy-engineering"
level = "advanced"
module = "governance-risk-and-compliance"
title = "Privacy Engineering"
short_title = "Privacy Engineering"
package = "privacyeng"
main_class = "PrivacyEngineeringDemo"
tagline = "Minimize, pseudonymize, retain and erase a bank's customer data in PostgreSQL, measure who can still be picked out, and find the copies that an erasure request misses"
bold = "A bank's PostgreSQL database of 2,000 customers collects 9 personal columns of which 7 are needed by a purpose and phone and gender by none; 99.8% of customers are alone in their group on postcode, birth date and gender, and an outside list names 1,398 of them from pseudonymized rows, but with the postcode cut to 3 digits and the birth date to its decade nobody is alone and the outside list names 0; a retention job deletes 9,643 old transactions, keeps 14 under a legal hold, withdraws 494 old consents and deletes 505 old notes, and does not touch 8,054 analytics rows from before the limit; an erasure request for one customer blanks their data and still leaves 6 rows in other people's notes and payments that mention them, found by a scan of every text column and scrubbed to 0."
domain = "a bank"
domain_note = ""
youtube_description = "Privacy engineering for a bank in PostgreSQL: data minimization against purposes, k-anonymity and linkage with an outside list, keyed pseudonyms, a retention job with a legal hold, a data map found from the schema, an access and erasure request, and the mentions that remain in other people's records."
thumb_lines = ["PRIVACY", "ENGINEERING"]
thumb_code = "name -> pseudonym; postcode -> 3 digits"
youtube_title = "Privacy Engineering: Minimization, Pseudonyms, Retention and Erasure in PostgreSQL"
youtube_tags = ["privacy engineering", "data minimization", "pseudonymization", "k-anonymity", "data retention", "gdpr", "right to erasure", "data subject access request", "postgresql", "java"]

[readme]
intro = """
Privacy engineering turns the principles of data protection law into code and queries: collect what a purpose needs, keep it only as long as it is needed, make it hard to pick a person out of the data that is shared, and be able to find and erase everything about one person when they ask. This project does it in **PostgreSQL** (started in Docker) with a seeded database of **2,000 customers** with accounts, transactions and support notes, and measures each step. A Java program starts the database and runs the queries; the demo is tagged `integration`: `./gradlew integrationTest`.

What it shows:
- **Minimization.** 9 personal columns, **7** needed by one of 5 purposes; **phone** and **gender** are held for no purpose.
- **Who can be picked out.** **99.8%** of customers are alone in their group on postcode, birth date and gender; an outside list names **1,398** from pseudonymized rows. Cut the postcode to 3 digits and the birth date to its decade and nobody is alone and the list names **0**.
- **Pseudonyms.** Keyed HMAC pseudonyms: the same customer gets the same one under one key and another under a new key. A pseudonym is a name replaced, not a person hidden.
- **Retention.** The job deletes **9,643** transactions older than 7 years, keeps **14** under a legal hold, withdraws **494** old consents and deletes **505** notes, and does not reach **8,054** analytics rows.
- **A customer's request.** The data map is found from the schema; after erasure **6** rows in other people's notes and payments still mention the customer, until they are scrubbed.

**Maps to:** GDPR Articles 5 (minimization, storage limitation), 15 (access), 17 (erasure), 25 (data protection by design) and 32 · ISO/IEC 27701 · NIST Privacy Framework (CT.DM, CT.DP) · NIST SP 800-188 (de-identification).
"""
analogy = """
A library that keeps loan records. It asks only for what lending needs, throws old loans away on a schedule, and publishes reading statistics without names. When a reader asks to be forgotten it has to look in the card file, in the staff's notes and in the statistics, because the reader's name is on more cards than the reader's own.
"""
scenario = """
A bank holds customer data in PostgreSQL, shares an analytics extract, and gets a request from a customer to see and then erase their data. The demo builds the database and measures each step.
"""
costs = [
    "**Coarser data is less useful** for analytics.",
    "**Retention jobs must know every copy,** or the copies outlive the source.",
    "**Erasure conflicts with the law** that requires a bank to keep records.",
    "**Free text hides personal data** that no schema describes.",
    "**Pseudonym keys become the new secret** to protect and rotate.",
]
too_much = """
A site that collects a name and an email for a newsletter needs a retention rule and a delete button, not k-anonymity. Use the measures here when data is shared for analytics, copied across systems, or held for years.
"""
met_before = [
    "A column collected because it might be useful.",
    "A data extract with the name removed.",
    "A retention policy in a document and no job.",
    "An erasure request answered by deleting one row.",
]
where = """
This is the last project of the [governance-risk-and-compliance](..) module. It uses the keyed-hash idea of the cryptography modules for pseudonyms and the retention and evidence habits of [controls-and-evidence](../controls-and-evidence).
"""
twin = """
PostgreSQL is real and the data is made up by a seeded generator, so each run is the same. The identifiers are invented and match nobody. The demo prints counts, never names or numbers of customers.
"""
test_note = "The purposes, the pseudonyms and the seed are tested with the JDK only; the database tests need Docker (./gradlew integrationTest)."

[[act]]
title = "What is collected, and why"
summary = "9 personal columns are collected and 7 are needed by a purpose; phone and gender have none."
detail = """
The customers table holds name, email, phone, postcode, birth date, gender, national id and two marketing columns. Five purposes (payments, statements, marketing, fraud analytics and identity checks required by law) need 7 of the 9. Phone and gender are collected, stored and protected for no purpose, so the bank can stop collecting them.
"""
speech = """
First demo: what is collected, and why. [[slnc 400]] Nine personal columns. [[slnc 600]] Seven have a purpose. Phone and gender have none.
"""
rows = { collect = "active ok" }
console = [
    ["personal columns: 9", "ok"],
    ["needed by a purpose: 7", "ok"],
    ["no purpose: phone, gender", "bad"],
]

[[act]]
title = "Who can be picked out"
summary = "99.8% of customers are alone in their group on postcode, birth date and gender; coarser values leave nobody alone."
detail = """
Postcode, birth date and gender are not names, and together they pick out nearly everyone. An outside list with names and those three values names 1,398 customers from the published rows. With the postcode cut to 3 digits and the birth date to its decade the smallest group has 4 customers and the outside list names none.
"""
speech = """
Second demo: who can be picked out. [[slnc 400]] No names, and still nearly everyone is alone in their group. [[slnc 600]] Make the values coarser and nobody is.
"""
rows = { pick = "active wrong" }
console = [
    ["alone in the group: 99.8%", "bad"],
    ["named from an outside list: 1398", "bad"],
    ["with coarse values: 0", "ok"],
]

[[act]]
title = "Pseudonyms for analytics"
summary = "A keyed pseudonym is stable under one key and different under another; it replaces a name, it does not hide a person."
detail = """
The analytics extract has one row for each transaction with an HMAC-SHA256 pseudonym of the customer. 22,346 rows carry 2,000 pseudonyms. The same customer gets the same pseudonym under the same key, which keeps joins working, and another one under a new key. The rows still carry the postcode, birth date and gender.
"""
speech = """
Third demo: pseudonyms. [[slnc 400]] A keyed hash replaces the name. [[slnc 600]] The other columns still find the person.
"""
rows = { pseudo = "active ok" }
console = [
    ["22346 rows, 2000 pseudonyms", "ok"],
    ["same key, same pseudonym: yes", "ok"],
    ["a name replaced, not a person hidden", "bad"],
]

[[act]]
title = "Retention"
summary = "The job deletes 9,643 old transactions and keeps 14 under a legal hold, but does not reach 8,054 analytics rows."
detail = """
Transactions older than 7 years are deleted unless the customer is under a legal hold: 9,657 expired, 14 kept. 494 marketing consents older than 2 years are withdrawn and 505 notes older than a year are deleted. The analytics table is a copy that the job does not know about: 8,054 of its 22,346 rows are older than the limit.
"""
speech = """
Fourth demo: retention. [[slnc 400]] The job deletes what has expired and keeps what the law holds. [[slnc 600]] It does not know about the analytics copy.
"""
rows = { retain = "active wrong" }
console = [
    ["deleted 9643, kept for a hold 14", "ok"],
    ["494 consents withdrawn, 505 notes deleted", "ok"],
    ["analytics rows past the limit: 8054", "bad"],
]

[[act]]
title = "A customer's request"
summary = "After an erasure request, 6 rows in other people's notes and payments still mention the customer, until they are scrubbed."
detail = """
The data map is found from the foreign keys of the schema, not from a list: customers, accounts, transactions and support notes. For customer 17 the export counts 1 customer, 1 account, 4 transactions and 11 analytics rows. After the erasure, which keeps the 4 transactions by law, a scan of every text column finds 6 rows that mention the customer's name or email, in notes of other customers and in payments to them. Scrubbing leaves 0.
"""
speech = """
Fifth demo: a customer's request. [[slnc 400]] Erase the customer and scan every text column. [[slnc 600]] Six rows in other people's records still mention them.
"""
rows = { request = "active wrong" }
console = [
    ["tables found from the schema: 4", "ok"],
    ["rows that still mention the customer: 6", "bad"],
    ["after the scrub: 0", "ok"],
]

