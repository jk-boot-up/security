After the job: nine thousand six hundred and forty three transactions deleted, twelve thousand seven hundred and three left, and the fourteen old ones left are all under a hold. [[slnc 400]] Four hundred and ninety four consents withdrawn, and five hundred and five notes deleted. [[slnc 400]] And the analytics table, which the job does not know about, still has eight thousand and fifty four old rows.
