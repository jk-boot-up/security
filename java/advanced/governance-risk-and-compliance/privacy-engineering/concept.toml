[[act]]
title = "Retention"
summary = "The job deletes 9,643 old transactions and keeps 14 under a legal hold, but does not reach 8,054 analytics rows."
detail = """
Transactions older than 7 years are deleted unless the customer is under a legal hold: 9,657 expired, 14 kept. 494 marketing consents older than 2 years are withdrawn and 505 notes older than a year are deleted. The analytics table is a copy that the job does not know about: 8,054 of its 22,346 rows are older than the limit.
"""
figure = "retention"
figure_title = "The retention job, before and after"
figure_speech = """
Fourth demo: retention. [[slnc 400]] The job runs on a fixed day, the twenty third of October twenty twenty six, so every run is the same. [[slnc 600]]
At the top left, the rules. [[slnc 300]] Transactions are kept for seven years, so anything booked before October twenty nineteen is removed. [[slnc 300]] Marketing consent lasts two years, and support notes one year. [[slnc 300]] A legal hold, for example during a court case, keeps a customer's data past its limit. [[slnc 600]]
On the right, before the job. [[slnc 300]] Nine thousand six hundred and fifty seven transactions are older than seven years, and fourteen of them are under a legal hold. [[slnc 600]]
In the middle, after the job. [[slnc 300]] Nine thousand six hundred and forty three are deleted: the nine thousand six hundred and fifty seven, minus the fourteen on hold. [[slnc 300]] Twelve thousand seven hundred and three are left. [[slnc 600]]
At the bottom, what it did not touch. [[slnc 300]] The analytics copy still holds eight thousand and fifty four rows from twenty eighteen or earlier. [[slnc 300]] The job reaches only the tables it knows about.
"""
speech = """
Here is the output. [[slnc 400]] The rules: what is kept, for how long, and the date before which it is removed. [[slnc 300]] The legal hold covers the customers whose number is a multiple of seven hundred. [[slnc 400]] Before the job: the transactions, those older than seven years, fourteen of them under a hold, four hundred and ninety four old consents, and five hundred and five old support notes.
