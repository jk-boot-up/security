summary = "99.8% of customers are alone in their group on postcode, birth date and gender; coarser values leave nobody alone."
detail = """
Postcode, birth date and gender are not names, and together they pick out nearly everyone. An outside list with names and those three values names 1,398 customers from the published rows. With the postcode cut to 3 digits and the birth date to its decade the smallest group has 4 customers and the outside list names none.
"""
figure = "groups"
figure_title = "How many customers are alone in their group"
figure_speech = """
Second demo: who can be picked out. [[slnc 400]] The published rows have no name, but they keep the postcode, the birth date and the gender. [[slnc 600]]
At the top, how many groups those values allow. [[slnc 300]] With the full values: thirty postcodes, times one thousand eight hundred and ninety nine birth dates, times two, is one hundred and thirteen thousand nine hundred and forty possible groups, for only two thousand customers. [[slnc 300]] So almost every customer is alone in a group. [[slnc 400]] With coarse values, the first three digits of the postcode and the decade of birth: ten prefixes, times six decades, times two, is one hundred and twenty groups. [[slnc 600]]
In the middle, the share of customers alone in their group: ninety nine point eight percent with the full values, and zero with the coarse ones. [[slnc 600]]
At the bottom, the linking attack. [[slnc 300]] An outside list holds the name and the three values of one thousand four hundred customers. [[slnc 300]] With the full values it names one thousand three hundred and ninety eight of them. [[slnc 300]] With the coarse values it names nobody.
"""
