[[scene]]
key = "01-poster"
kind = "poster"
title = "Privacy Engineering"
narration = "Hello, and welcome. [[slnc 400]] This video explains privacy engineering. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] Privacy engineering turns the principles of data protection law into code and queries. [[slnc 300]] Collect what a purpose needs. [[slnc 300]] Keep it only as long as needed. [[slnc 300]] Make it hard to pick a person out of shared data. [[slnc 300]] And find and erase everything about one person when they ask. [[slnc 600]] Think of a bank teller who asks only for what the form needs, shreds it on schedule, and can find your file in one drawer. [[slnc 600]] Our example is a bank."

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["A bank's PostgreSQL database of 2,000 customers,", "with accounts, transactions and support notes.", "", "It shares an analytics extract, and a customer", "asks to see, then erase, their data.", "The demo measures each step."]
narration = "Here is the scenario. [[slnc 400]] A bank holds data on two thousand customers in a Postgres database: accounts, transactions, and support notes. [[slnc 500]] It shares an analytics extract with another team. [[slnc 300]] Then a customer asks to see their data, and then to have it erased. [[slnc 500]] The demo builds the database, and measures each step."

[[scene]]
key = "02-words"
kind = "bullets"
title = "The Words"
body = ["Personal data: anything about one person", "Purpose: why the bank holds a column", "Quasi-identifier: not a name, still points at you", "Pseudonym: a stand-in made with a secret key", "Retention: how long data may be kept", "Erasure: deleting one person on request"]
narration = """Before the demos, the words. [[slnc 500]] Personal data is anything about one person: a name, an email, a postcode, a birth date. [[slnc 500]] A purpose is the reason the bank holds a column, such as payments or statements. [[slnc 500]] A quasi identifier is a value that is not a name, like a postcode or a birth date, but that points at one person when combined with others. [[slnc 500]] A pseudonym is a stand in for the customer, made with a secret key. [[slnc 500]] Retention is how long each kind of data may be kept. [[slnc 300]] And erasure is deleting one person's data when they ask."""

[[scene]]
key = "02-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "02-linking"
kind = "figure"
title = "A row with no name, and an outside list"
body = "linking"
narration = """Let's see the core idea on one example: a row with no name. [[slnc 400]] On the left, customer seventeen's row as the bank publishes it, without the name. [[slnc 300]] It keeps three ordinary values: the postcode, the birth date, and the gender. [[slnc 600]] On the right, an outside list, such as a club membership list, with the same three values and a name. [[slnc 300]] The green arrows match the values one by one. [[slnc 700]]
At the bottom, the result. [[slnc 300]] With the full values, only one customer in the whole bank has this postcode, birth date and gender. [[slnc 300]] So the row with no name belongs to Sven Becker seventeen, a made up customer. [[slnc 600]] Now make the values coarse: the first three digits of the postcode, and the decade of birth. [[slnc 300]] Twenty one customers share them, and the row could be any of them. [[slnc 500]] Removing the name is not enough. [[slnc 300]] The other columns have to be made coarse too."""

[[scene]]
key = "03-acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "04-costs"
kind = "bullets"
title = "What It Costs"
body = ["Coarser data is less useful for analysis", "A pseudonym is a name replaced,", "  not a person hidden", "Legal holds keep data past its retention", "Other people's records still mention", "  an erased customer"]
narration = "Nothing is free. [[slnc 400]] Here is what it costs. [[slnc 500]] Coarser data, like a shorter postcode, is less useful for analysis. [[slnc 500]] A pseudonym is a name replaced, not a person hidden. [[slnc 500]] Legal holds keep some data past its retention. [[slnc 500]] And after an erasure, other people's notes and payments can still mention the customer, until they are scrubbed too."

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["A form asking for more than the service needs", "A data export request under GDPR Article 15", "An analytics file with postcode and birth date", "A retention schedule nobody runs"]
narration = "You have probably met this already. [[slnc 400]] A form that asks for more than the service needs is a minimization failure. [[slnc 500]] A request for a copy of your data is the right of access, Article 15 of the G D P R. [[slnc 500]] An analytics file with full postcode and birth date can name most people in it. [[slnc 500]] And a retention schedule nobody runs keeps everything forever."

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Give every personal column a purpose", "Coarsen before you share; measure who is alone", "Use keyed pseudonyms, and guard the key", "Run retention as a job, with legal holds", "Keep a data map for access and erasure"]
narration = "So, how do you use it? [[slnc 400]] Give every personal column a purpose, and stop collecting the rest. [[slnc 500]] Coarsen data before you share it, and measure how many people are alone in their group. [[slnc 500]] Use keyed pseudonyms, and guard the key. [[slnc 500]] Run retention as a scheduled job, with legal holds. [[slnc 300]] And keep a data map, so access and erasure find everything."

[[scene]]
key = "12-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Fail the build when a column", "is collected for no purpose."]
narration = "That's privacy engineering. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Collect only what a purpose needs, keep it only as long as needed, share it coarse, and be able to find and erase one person on request. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a rule that fails the build when a column is collected for no purpose. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"

