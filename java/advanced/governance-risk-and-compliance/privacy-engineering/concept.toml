[[act]]
title = "A customer's request"
summary = "After an erasure request, 6 rows in other people's notes and payments still mention the customer, until they are scrubbed."
detail = """
The data map is found from the foreign keys of the schema, not from a list: customers, accounts, transactions and support notes. For customer 17 the export counts 1 customer, 1 account, 4 transactions and 11 analytics rows. After the erasure, which keeps the 4 transactions by law, a scan of every text column finds 6 rows that mention the customer's name or email, in notes of other customers and in payments to them. Scrubbing leaves 0.
"""
figure = "erasure"
figure_title = "An erasure, and what still mentions the customer"
figure_speech = """
Fifth demo: a customer's request. [[slnc 400]] Customer seventeen first asks for their data, and then for its erasure. [[slnc 600]]
On the left, the export. [[slnc 300]] The tables come from a data map found from the foreign keys of the schema: one customer row, one account, and four transactions. [[slnc 300]] The analytics table has no foreign key, so the map misses it; its eleven rows are found by the pseudonym instead. [[slnc 600]]
On the right, the erasure. [[slnc 300]] Nine personal columns are blanked, and the eleven analytics rows are deleted. [[slnc 300]] The four transactions are kept, in amber, because the law requires the bank to keep them. [[slnc 600]]
Then a scan of every text column, for the name, the email, the phone and the national id. [[slnc 300]] It still finds the customer in two support notes and four transactions: other customers' notes and payments that name them. [[slnc 600]]
At the bottom, after the scrub: the six rows no longer mention the customer.
"""
speech = """
Here is the output. [[slnc 400]] The data map: five tables in the schema, four found from the foreign keys, and the analytics table not found, because it has no foreign key. [[slnc 400]] Then the export for customer seventeen, counted table by table, with the analytics rows found by the pseudonym.
[[page]]
The erasure: nine columns blanked, no support notes of their own, eleven analytics rows deleted, and four transactions kept by law. [[slnc 400]] What still mentions the customer: two support notes and four transactions. [[slnc 300]] After the scrub: six rows before, zero after.
[[page]]
And the lessons. [[slnc 300]] No name is not anonymous: the other columns find the person. [[slnc 300]] Copies sit in notes, in analytics, and in other people's records. [[slnc 300]] And the law can require keeping what a customer asks to erase.
"""
rows = { request = "active wrong" }
