[[threat]]
id = "T1"
stride = "I"
threat = "People are named from a pseudonymized extract"
where = "the extract"
control = "Coarsen the values and measure the smallest group"
residual = "Other outside data sets"

[[threat]]
id = "T2"
stride = "R"
threat = "A copy outlives the source"
where = "the extract and the notes"
control = "A data map from the schema; retention that reaches every copy"
residual = "Copies outside the database"

[[threat]]
id = "T3"
stride = "I"
threat = "The pseudonym key leaks"
where = "the key"
control = "Keep the key apart and rotate it; re-pseudonymize"
residual = "Data already shared"

