[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] The data lives in a real Postgre S Q L database, and most of the work is plain S Q L sent from Java. [[slnc 300]] Here are the classes that matter."""

[[class]]
name = "Purposes"
what = "each purpose, and the personal columns it needs"
[[class.part]]
title = "a column no purpose needs"
code = """
new Purpose("payments", "pay", Set.of("name", "postcode")),
...
public static List<String> withoutPurpose() {
    return PERSONAL_COLUMNS.stream()
            .filter(c -> !needed().contains(c)).toList();
"""
speech = """Each purpose lists the columns it needs. [[slnc 300]] A personal column that no purpose lists is collected for nothing. [[slnc 300]] That is how phone and gender are found."""

[[class]]
name = "Anonymity"
what = "how easily a person is picked out, counted in SQL"
[[class.part]]
title = "the full values and the coarse ones"
code = """
public static final String FULL = "postcode, birth_date, gender";
public static final String COARSE = "left(postcode, 3),
        (extract(year from birth_date)::int / 10), gender";
...
long below = pg.count("SELECT coalesce(sum(n), 0) FROM (SELECT count(*) AS n
        FROM " + table + " GROUP BY " + columns + " HAVING count(*) < ?) g", k);
"""
speech = """The groups are counted in S Q L, grouping the rows by three columns. [[slnc 300]] The coarse version keeps three digits of the postcode and the decade of birth. [[slnc 300]] A group smaller than k is a group where people can be picked out."""

[[class]]
name = "Coarse"
what = "a teaching class: the coarse values for one customer"
[[class.part]]
title = "three digits and a decade"
code = """
return postcode.substring(0, 3);
...
return (birthDate.getYear() / 10 * 10) + "s";
"""
speech = """Coarse works out in Java what the S Q L does, for one customer. [[slnc 300]] One zero eight four five becomes one zero eight, and nineteen sixty nine becomes the nineteen sixties."""

[[class]]
name = "PseudonymSteps"
what = "a teaching class: how one pseudonym is made"
[[class.part]]
title = "the whole HMAC, then its first 8 bytes"
code = """
String input = "customer:" + customerId;
Mac mac = Mac.getInstance("HmacSHA256");
mac.init(new SecretKeySpec(
        secret.getBytes(StandardCharsets.UTF_8), "HmacSHA256"));
String full = HexFormat.of().formatHex(
        mac.doFinal(input.getBytes(StandardCharsets.UTF_8)));
// 8 bytes are 16 hex digits
return new PseudonymSteps(input, full, full.substring(0, 16));
"""
speech = """PseudonymSteps keeps every step: the input text, the whole H M A C, and the first sixteen hex digits, which are eight bytes. [[slnc 300]] A test proves it gives exactly the pseudonym that the Pseudonyms class writes to the analytics table."""

[[class]]
name = "Retention"
what = "the limits, and the job that deletes what has expired"
[[class.part]]
title = "delete old transactions, unless on hold"
code = """
public static final int TRANSACTION_YEARS = 7;
...
pg.update("DELETE FROM transactions t USING accounts a, customers c
        WHERE a.id = t.account_id AND c.id = a.customer_id
        AND NOT c.legal_hold AND t.booked_on < ?",
"""
speech = """The job is one delete statement for each kind of data, with a cut off date. [[slnc 300]] The legal hold is a condition in the same statement. [[slnc 300]] A table the job does not name, like the analytics copy, is never touched."""

[[class]]
name = "Subject"
what = "a customer's access and erasure request"
[[class.part]]
title = "the data map, from the foreign keys"
code = """
List<String> tables = new ArrayList<>(List.of("customers"));
...
WHERE tc.constraint_type = 'FOREIGN KEY'
        AND ccu.table_name = ANY (?::text[]) ORDER BY 1",
"""
speech = """The data map starts at the customers table and adds every table whose foreign key points at a table already found. [[slnc 300]] A copy with no foreign key, like the analytics table, is missed."""
[[class.part]]
title = "every text column, searched"
code = """
for (String col : pg.strings("SELECT table_name || '.' || column_name
        FROM information_schema.columns WHERE table_schema = 'public'
        AND data_type IN ('text', 'character varying') ORDER BY 1")) {
...
if (n > 0) {
    found.merge(table, n, Long::sum);
"""
speech = """After the erasure, every text column of every table is searched for the customer's name, email, phone and national id. [[slnc 300]] That is how the six rows in other people's records are found."""

[[acronym]]
short = "SQL"
long = "Structured Query Language: the language of the database"
say = "S Q L is structured query language: the language used to ask a database for data. PostgreSQL is a database that speaks it."
[[acronym]]
short = "HMAC"
long = "Hash-based Message Authentication Code: a hash mixed with a key"
say = "H M A C is hash based message authentication code: a hash mixed with a secret key, so only the key's holder can make it."
[[acronym]]
short = "SHA-256"
long = "Secure Hash Algorithm, 256 bits: a 32-byte fingerprint"
say = "S H A two fifty six is the secure hash algorithm with two hundred and fifty six bits: a thirty two byte fingerprint of any input."
[[acronym]]
short = "GDPR"
long = "General Data Protection Regulation: the European Union's privacy law"
say = "G D P R is the general data protection regulation: the European Union's data protection law."
[[acronym]]
short = "ID"
long = "Identifier: a number that names one record or one person"
say = "I D is identifier: a number that names one record, or one person, like a national id."
