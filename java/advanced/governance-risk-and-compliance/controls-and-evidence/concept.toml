[[act]]
title = "When a test starts to fail"
summary = "C01, least privilege, is PASSING with 24 tests and 0 failed, and the Protect function has 2 of 5 controls with passing evidence. A role change lets a clerk act as an admin; the next build fails deniesAnAdminRoleToAClerk, C01 becomes FAILING, and Protect drops to 1 of 5, with nobody updating a spreadsheet."
detail = """
Before: C01, least privilege roles, has LeastPrivilegeTest with 24 tests and none failed, so it is PASSING; the Protect function has 2 of 5 controls with passing evidence (C01 and C02).
The change: a role change lets a clerk act as an admin, and the next build runs the same 24 tests, one of which fails.
After: any test failed? 1 of 24, deniesAnAdminRoleToAClerk, so C01 is FAILING, and Protect has 1 of 5 (C02). The status changed with the build.
What evidence cannot show: a passing test proves the test passed, not that the control works, and a test can be weak; an attestation is a promise that ages slowly and proves less; a control with no owner and no date is a wish.
"""
figure = "one_failure"
figure_title = "One failing test, and the control turns red the same day"
figure_speech = """
Fifth demo: when a test starts to fail. [[slnc 400]] On the left, before. [[slnc 300]] C zero one, least privilege roles: twenty four tests, none failed, so it is passing. [[slnc 300]] In the Protect function, two of five controls have passing evidence. [[slnc 600]]
Then a role change lets a clerk act as an admin. [[slnc 300]] The next build runs the same twenty four tests, and one fails: denies an admin role to a clerk. [[slnc 600]]
On the right, after. [[slnc 300]] C zero one is failing, and Protect drops to one of five. [[slnc 300]] Nobody had to remember to update a spreadsheet. [[slnc 300]] The evidence came from the build, so the status followed it on the same day.
"""
speech = """
Before: C zero one passes all twenty four tests, and Protect has two of five controls with passing evidence. [[slnc 400]] The change: a clerk can now act as an admin, and one test fails. [[slnc 400]] After: the failing rule decides, C zero one is failing, and Protect has one of five. [[slnc 500]] And what evidence cannot show. [[slnc 300]] A passing test is not a working control, because tests can be weak. [[slnc 300]] A signature is a promise. [[slnc 300]] And a control with no owner and no date is only a wish.
"""
rows = { drift = "active wrong" }
