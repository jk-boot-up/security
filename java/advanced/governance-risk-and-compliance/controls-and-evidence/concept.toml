title = "Controls and Evidence"
short_title = "Controls and Evidence"
package = "controlsevidence"
main_class = "ControlsAndEvidenceDemo"
tagline = "A control you cannot show, you cannot claim"
bold = "A bank's 12 controls, each with an owner, are mapped to the 6 functions of NIST CSF 2.0 and to 13 of the 14 ISO 27001 Annex A controls it has chosen (A.8.28, secure coding, is not served); evidence is read from JUnit test reports and signed attestations, and a status is decided by rules asked in order: C03 is FAILING because 1 of its 10 tests failed 2 days ago; across the catalogue 4 of 12 controls have fresh passing test evidence, 1 is failing, 1 partial, 2 stale (one passed, but 144 days ago against a limit of 90), 3 attested and 1 has none; one failing test turns a passing control failing the same day."
domain = "a bank"
domain_note = ""
