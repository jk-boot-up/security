requirements = [
    "Every control has an owner, a CSF subcategory and an Annex A control.",
    "Evidence is read from JUnit XML or from a dated attestation.",
    "Automated evidence is stale after 90 days and an attestation after 365.",
    "A failing test makes a control failing.",
    "The demo prints the same output on every run.",
]

