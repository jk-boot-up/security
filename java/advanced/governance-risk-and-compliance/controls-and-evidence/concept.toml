# concept.toml: everything about this project that is not Java code.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "controls-and-evidence"
level = "advanced"
module = "governance-risk-and-compliance"
title = "Controls and Evidence"
short_title = "Controls and Evidence"
package = "controlsevidence"
main_class = "ControlsAndEvidenceDemo"
tagline = "Map a bank's controls to NIST CSF 2.0 and ISO 27001, collect evidence from test results, and see which controls are passing, failing, stale or missing"
bold = "A bank's 12 controls, each with an owner, are mapped to the 6 functions of NIST CSF 2.0 and to 13 of the 14 ISO 27001 Annex A controls it has chosen (A.8.28 is not served); evidence is read from JUnit test results and from attestations: today 4 of 12 controls have fresh passing test evidence, 1 is failing, 1 partial (skipped tests), 2 stale (one 144 days old against a limit of 90) and 1 has no evidence at all; one failing test turns a passing control failing and leaves 1 of 5 Protect controls with passing evidence instead of 2."
domain = "a bank"
domain_note = ""
youtube_description = "Controls and evidence for a bank: a control catalogue mapped to NIST CSF 2.0 and ISO 27001 Annex A, evidence read from JUnit test results and attestations, freshness rules, and a status for each control that an auditor can follow."
thumb_lines = ["CONTROLS", "EVIDENCE"]
thumb_code = "C03 PR.DS-02 A.8.24 -> FAILING"
youtube_title = "Controls and Evidence: NIST CSF 2.0, ISO 27001 and Evidence from Tests"
youtube_tags = ["controls and evidence", "nist csf 2.0", "iso 27001", "compliance as code", "audit evidence", "continuous compliance", "grc", "statement of applicability", "governance", "java"]

[readme]
intro = """
An audit asks two questions about every control: *is it mapped to what we promised*, and *can you show that it works today*. This project keeps the bank's **12 controls** in a catalogue with an owner and a mapping to **NIST CSF 2.0** subcategories and to **ISO/IEC 27001:2022 Annex A**, reads evidence from **JUnit test results** (and from signed-off attestations where no test exists), and gives each control a status for the day. It needs only the JDK; `./gradlew test`, then `./gradlew run`.

What it shows:
- **The maps.** All **6** CSF functions have a control (Protect has 5); **13 of the 14** Annex A controls the bank chose are served, and A.8.28 is not.
- **The evidence today.** **4 of 12** controls have fresh passing test evidence; **1** is failing, **1** is partial because tests were skipped, **2** are stale and **1** has no evidence.
- **The trail.** For one control: the owner, the CSF and ISO references, the test run, its age, and the test that failed.
- **A test starts to fail.** One failing test turns a passing control failing and leaves **1 of 5** Protect controls with passing evidence.
- **The bill.** Evidence shows that a test passed, not that the control is effective.

**Maps to:** NIST CSF 2.0 Govern (GV.OC, GV.PO) · ISO/IEC 27001:2022 clause 9 and Annex A · SOC 2 CC4.1 monitoring · NIST SP 800-53 CA-2, CA-7.
"""
analogy = """
A restaurant's food-safety binder. The chef says the fridge is cold. The inspector wants the temperature log, with today's date, signed by whoever read the thermometer. A binder that is a year old, or that has a gap in it, is worth less than a thermometer that reports every hour.
"""
scenario = """
A bank is preparing for an audit. It has twelve controls, a statement of applicability with fourteen Annex A controls, and test results from the build. The demo says which controls it can prove today.
"""
costs = [
    "**Evidence has to be kept fresh,** or it turns stale in a quarter.",
    "**A mapping is a claim,** and nobody checks the claim without a review.",
    "**Tests can be weak,** and a green test proves little.",
    "**Attestations are cheap to give and hard to check.**",
    "**A catalogue needs owners who answer.**",
]
too_much = """
A small team with one auditor and a handful of controls can use a spreadsheet. Automate evidence when the same questions come every quarter, or when several frameworks ask about the same controls.
"""
met_before = [
    "A spreadsheet of controls updated before the audit.",
    "A screenshot as evidence.",
    "A control that serves three standards and has three owners.",
    "A statement of applicability nobody has read since it was signed.",
]
where = """
This is a project of the [governance-risk-and-compliance](..) module, after [risk-management](../risk-management), which prices the controls that this project tracks.
"""
twin = """
The catalogue and the test results are small fixtures that look like the real thing; the dates are fixed so that every run gives the same output. The mappings use real NIST CSF 2.0 and ISO 27001:2022 identifiers.
"""
test_note = "The assessor, the parsing of test reports and the catalogue are tested with the JDK only. The demo is compared with its golden output."

[[act]]
title = "The catalogue and its maps"
summary = "12 controls reach all 6 CSF functions and 13 of the 14 chosen Annex A controls."
detail = """
Each control has an owner, one CSF 2.0 subcategory and one or more Annex A controls. Governance has 2, Identify 2, Protect 5, Detect 1, Respond 1 and Recover 1. The statement of applicability chose 14 Annex A controls; A.8.28, secure coding, is not served by any control. Two controls serve two Annex A controls each.
"""
speech = """
First demo: the catalogue and its maps. [[slnc 400]] Twelve controls, six functions. [[slnc 600]] Thirteen of fourteen Annex A controls are served, and secure coding is not.
"""
rows = { maps = "active ok" }
console = [
    ["controls: 12", "ok"],
    ["CSF functions with a control: 6 of 6", "ok"],
    ["not served: A.8.28", "bad"],
]

[[act]]
title = "What the evidence says today"
summary = "4 of 12 controls have fresh passing test evidence; the rest are failing, partial, stale, attested or missing."
detail = """
Seven controls have test results, four are attested by a person and one has nothing. Today there are 4 passing, 1 partial (two skipped tests), 1 failing, 2 stale, 3 attested and 1 with no evidence. Automated evidence is stale after 90 days, an attestation after 365.
"""
speech = """
Second demo: the evidence today. [[slnc 400]] Four of twelve controls can be proved with a fresh passing test. [[slnc 600]] One fails, two are stale, and one has no evidence.
"""
rows = { evidence = "active wrong" }
console = [
    ["passing 4, partial 1, failing 1", "ok"],
    ["stale 2, attested 3, none 1", "bad"],
    ["fresh passing evidence: 4 of 12", "bad"],
]

[[act]]
title = "The trail for one control"
summary = "From the control to the test run that failed, with its age and its owner."
detail = """
C03, TLS on every internal call, belongs to the platform team, serves CSF PR.DS-02 and Annex A A.8.24 and A.8.20, and its last run was 2 days ago: 10 tests, 1 failed. The oldest automated evidence is the configuration baseline, 144 days old against a limit of 90.
"""
speech = """
Third demo: the trail. [[slnc 400]] From the control to the test, the owner and the date. [[slnc 600]] An auditor can follow it without asking anyone.
"""
rows = { trail = "active ok" }
console = [
    ["C03, owner platform-team, PR.DS-02", "ok"],
    ["10 tests, 1 failed: rejectsTlsOneOne", "bad"],
    ["oldest evidence: C04, 144 days", "bad"],
]

[[act]]
title = "When a test starts to fail"
summary = "One failing test turns a passing control failing and leaves 1 of 5 Protect controls with passing evidence."
detail = """
C01, least privilege, is passing. With one failing test it is failing. The Protect function had 2 of 5 controls with passing evidence; it now has 1 of 5. A status that follows the tests needs no one to remember to update a spreadsheet.
"""
speech = """
Fourth demo: when a test fails. [[slnc 400]] One failing test, and the control is failing. [[slnc 600]] The function loses a passing control with it.
"""
rows = { drift = "active wrong" }
console = [
    ["C01 before: PASSING", "ok"],
    ["after one failing test: FAILING", "bad"],
    ["Protect with passing evidence: 2, then 1", "bad"],
]

[[act]]
title = "The bill"
summary = "Evidence shows a test passed, not that the control works; attestations prove less and age slowly."
detail = """
A test can be too weak, so a green result is a claim about the test as much as the control. A person's attestation is evidence of a promise. A control with no owner and no date is a wish, and every line of the catalogue has both.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] A passing test is not an effective control. [[slnc 600]] Keep the owner and the date on every line.
"""
rows = { bill = "active wrong" }
console = [
    ["a test can be too weak", "bad"],
    ["an attestation proves less", "bad"],
    ["every control has an owner and a date", "ok"],
]

[animation]
subtitle = "A bank's controls, mapped and proved."
boxes = [
