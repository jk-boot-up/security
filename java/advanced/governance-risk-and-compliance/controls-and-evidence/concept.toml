[[scene]]
key = "01-poster"
kind = "poster"
title = "Controls and Evidence"
narration = "Hello, and welcome. [[slnc 400]] This video explains controls and evidence, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A control is something the business does to reduce a risk, such as encrypting every internal call. [[slnc 300]] An audit asks two questions about every control. [[slnc 300]] Is it mapped to what we promised? [[slnc 300]] And can you show that it works today? [[slnc 300]] Evidence is the answer to the second. [[slnc 600]] Think of a bank's fire doors: the plan says they exist, and the inspection log says they closed last week. [[slnc 600]] Our example is a bank."

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["A bank is preparing for an audit:", "  12 controls, each with an owner", "  mapped to NIST CSF 2.0", "  and to 14 chosen ISO 27001 controls", "", "Evidence comes from test reports", "and signatures. What can it prove today?"]
narration = "Here is the scenario. [[slnc 400]] A bank is preparing for an audit. [[slnc 300]] It has twelve controls, each with an owner. [[slnc 300]] Each is mapped to the N I S T cybersecurity framework, and to the fourteen I S O twenty seven thousand and one Annex A controls the bank has chosen. [[slnc 500]] Evidence comes from the test reports of the build, and from a person's signature where no test exists. [[slnc 300]] The demo says which controls the bank can prove today."

[[scene]]
key = "02-words"
kind = "bullets"
title = "The Words"
body = ["Control: what the bank does against a risk", "Framework: a list of promises (CSF, ISO)", "Statement of applicability: the ones chosen", "Evidence: a dated record that it works", "Attestation: a person signs that it works", "Stale: evidence older than its limit"]
narration = """Before the demos, the words. [[slnc 500]] A control is what the bank does against a risk, with an owner. [[slnc 500]] A framework is a published list of promises: here, the N I S T cybersecurity framework, and I S O twenty seven thousand and one. [[slnc 500]] The statement of applicability lists the Annex A controls a company has chosen to keep. [[slnc 500]] Evidence is a dated record that a control works, such as a test report. [[slnc 500]] An attestation is a person signing that it works. [[slnc 500]] And evidence is stale when it is older than its limit."""

[[scene]]
key = "02-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "02-trail"
kind = "figure"
title = "One control: the promise, the evidence, today's status"
body = "control_trail"
narration = """Let's see the core idea on one control. [[slnc 400]] On the left, the control: C zero three, T L S on every internal call, owned by the platform team. [[slnc 600]] It answers two frameworks at once. [[slnc 300]] In the N I S T cybersecurity framework, it is P R dot D S dash zero two: protect, data security. [[slnc 300]] In I S O twenty seven thousand and one, it is two Annex A controls: A eight twenty four, and A eight twenty. [[slnc 600]] Then the evidence: a test report from the build, that ran two days ago. [[slnc 300]] Ten tests, and one failed. [[slnc 600]] So today the control is failing. [[slnc 300]] The promise is on paper in two frameworks, and the evidence says it does not hold today."""

[[scene]]
key = "03-acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "04-costs"
kind = "bullets"
title = "What It Costs"
body = ["Every control needs an owner", "Evidence goes stale and must be refreshed", "Skipped tests are only partial evidence", "Two frameworks are two maps to keep", "A passing test is not a working control"]
narration = "Nothing is free. [[slnc 400]] Here is what it costs. [[slnc 500]] Every control needs an owner who answers for it. [[slnc 500]] Evidence goes stale: one test report here is a hundred and forty four days old, against a limit of ninety. [[slnc 500]] Skipped tests are only partial evidence. [[slnc 500]] Two frameworks are two maps to keep up to date. [[slnc 300]] And a passing test shows that a test passed, not that the control is effective."

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["A statement of applicability", "A spreadsheet of controls, a year old", "A screenshot sent to an auditor", "A control with no owner", "NIST CSF 2.0 and ISO 27001 audits"]
narration = "You have probably met this already. [[slnc 400]] A statement of applicability lists the Annex A controls a company has chosen. [[slnc 500]] A spreadsheet of controls, last updated a year ago, is stale evidence. [[slnc 500]] A screenshot sent to an auditor is evidence that nobody can check again. [[slnc 500]] A control with no owner is a control nobody will fix. [[slnc 500]] And every N I S T or I S O audit asks for exactly this map, and this evidence."

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Give every control an owner", "Map each control to what you promised", "Read evidence from the build", "Set an age limit for evidence", "Show gaps as gaps: failing, stale, none"]
narration = "So, how do you use it? [[slnc 400]] Give every control an owner. [[slnc 500]] Map each control to what you promised, and look for promises that nothing serves. [[slnc 500]] Read evidence from the build, automatically, so it stays fresh. [[slnc 500]] Set an age limit for evidence. [[slnc 300]] And show gaps as gaps: failing, stale, or missing, never quietly green."

[[scene]]
key = "12-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Escalate a control whose", "test has failed for more than 7 days."]
narration = "That's controls and evidence. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Map every control to a promise, give it an owner, and let fresh, automatic evidence say whether it works today. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a rule that escalates a control whose test has failed for more than seven days. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] It needs only the J D K. [[slnc 300]] Here are the classes that matter."""

[[class]]
name = "Control"
what = "one line of the catalogue"
[[class.part]]
title = "a CSV line becomes a control"
code = """
String[] f = line.split(",", -1);
List<String> iso = List.of(f[4].split(";"));
controls.add(new Control(f[0], f[1], f[2], f[3], iso, f[5], f[6]));
"""
speech = """Each line of the catalogue has seven fields. [[slnc 300]] The I S O field can hold several Annex A ids, separated by semicolons. [[slnc 300]] So one control can serve more than one promise."""

[[class]]
name = "Frameworks"
what = "the names behind the ids"
[[class.part]]
title = "a CSF id, taken apart"
code = """
int dot = id.indexOf('.');
int dash = id.indexOf('-');
String function = id.substring(0, dot);
String category = id.substring(dot + 1, dash);
return new CsfId(function, category, id.substring(dash + 1));
"""
speech = """Before the dot is the function, between the dot and the dash the category, after the dash the subcategory. [[slnc 300]] A test checks that every id in the catalogue has a name."""

[[class]]
name = "Evidence"
what = "a test report, read safely"
[[class.part]]
title = "no document type, and the failed tests by name"
code = """
factory.setFeature(XMLConstants.FEATURE_SECURE_PROCESSING, true);
factory.setFeature(NO_DOCTYPE, true);
...
if (c.getElementsByTagName("failure").getLength() > 0) {
    failed.add(c.getAttribute("name"));
"""
speech = """A test report is input from outside, so the parser refuses a document type, which blocks external entities. [[slnc 300]] A test case with a failure element is a failed test, kept by its name."""

[[class]]
name = "Assessor"
what = "the status rules, in order"
[[class.part]]
title = "the first rule that matches decides"
code = """
if (evidence.isEmpty()) {
    return Status.NONE;
...
if (ageInDays(e) > (c.automated() ? AUTOMATED_DAYS : MANUAL_DAYS)) {
    return Status.STALE;
...
if (!e.failed().isEmpty()) {
    return Status.FAILING;
}
return e.skipped() > 0 ? Status.PARTIAL : Status.PASSING;
"""
speech = """No evidence comes first, then age, so a passing test that is too old is stale. [[slnc 300]] Then a failed test, then a skipped one. [[slnc 300]] Passing is what is left."""

[[class]]
name = "StatusSteps"
what = "a teaching class: the rules asked one by one"
[[class.part]]
title = "each rule with its real values"
code = """
long age = assessor.ageInDays(e);
int limit = c.automated() ? Assessor.AUTOMATED_DAYS : Assessor.MANUAL_DAYS;
boolean stale = age > limit;
"""
speech = """This class asks the same rules, one at a time, and keeps each question with its answer. [[slnc 300]] A test proves that its last step is always the assessor's status, for every control and every kind of run."""

