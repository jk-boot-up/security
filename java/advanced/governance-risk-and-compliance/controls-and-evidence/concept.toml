[[threat]]
id = "T1"
stride = "T"
threat = "Evidence is edited to show a green status"
where = "the evidence files"
control = "Take the reports from the build, and review changes to the evidence folder"
residual = "A weak test that always passes"

[[threat]]
id = "T2"
stride = "R"
threat = "An old result is shown as current"
where = "the report"
control = "Show the age, and make old evidence stale"
residual = "Limits that are too generous"

[[threat]]
id = "T3"
stride = "I"
threat = "A test report with an entity reads a file"
where = "the XML parser"
control = "Refuse a document type definition"
residual = "Other parsers in the pipeline"

