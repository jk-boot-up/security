[[act]]
title = "Evidence from a test report"
summary = "tls-everywhere.xml is read as suite TlsEverywhereTest, ran 2026-10-21, 10 tests, 0 skipped, 1 failed (rejectsTlsOneOne). On 2026-10-23 it is 2 days old, within the limit of 90; one test failed, so C03 is FAILING."
detail = """
The input is the JUnit XML test report of the build: a testsuite element with the name TlsEverywhereTest, tests="10", failures="1", skipped="0" and the timestamp 2026-10-21T09:00:00; one testcase, rejectsTlsOneOne, holds a failure element.
The reader takes the suite, the date of the timestamp, the counts and the names of the failed tests.
The status is decided by asking the rules in order: any evidence? yes. Fresh? 2026-10-23 - 2026-10-21 = 2 days, within the limit of 90. Any test failed? 1 of 10, rejectsTlsOneOne, so the status is FAILING, and the failing test is named.
"""
figure = "xml_to_status"
figure_title = "From a test report to a status, rule by rule"
figure_speech = """
Third demo: evidence from a test report. [[slnc 400]] On the left, the input: the J Unit X M L file the build wrote. [[slnc 300]] The parts the reader needs are in amber: the suite name, the number of tests, the failures, and the timestamp. [[slnc 300]] In rose, the one test case that failed: rejects T L S one one. [[slnc 600]]
On the right, what the reader takes from it, and then the rules, asked in order. [[slnc 300]] Is there any evidence? Yes. [[slnc 300]] Is it fresh? Two days old, and the limit is ninety. [[slnc 300]] Did any test fail? One of ten. [[slnc 300]] That rule decides: the control is failing. [[slnc 600]]
The answer names the test, so the owner knows where to look.
"""
