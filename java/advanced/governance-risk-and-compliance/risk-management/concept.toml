The average of a range is the three points added, divided by three. [[slnc 300]] Zero point two three three events a year, and seven point eight million dollars an event. [[slnc 300]] Multiplied, that is one point eight million dollars a year: the expected loss. [[slnc 600]] The heat map gives ransomware a score of ten, below risks that cost far less."""

