In the middle, how many. [[slnc 300]] With that rate, the chance of no event at all is zero point seven zero six, and of at most one, zero point nine five two. [[slnc 300]] The second draw, zero point seven three seven, falls in the band for one event. [[slnc 600]]
On the right, how much. [[slnc 300]] The third draw reads the loss range, and gives three million dollars. [[slnc 600]]
So year eleven loses three million dollars to ransomware. [[slnc 300]] Most years lose nothing, and a few lose a lot.
"""
