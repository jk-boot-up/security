kind = "poster"
title = "Risk Management"
narration = "Hello, and welcome. [[slnc 400]] This video explains quantitative risk management, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A risk is how often something bad happens, and what it costs when it does. [[slnc 300]] A heat map paints each risk red, amber or green. [[slnc 300]] It does not say how much money is at stake, what a control is worth, or whether the bank can live with the bad years. [[slnc 300]] Ranges and a simulation can. [[slnc 600]] Think of an insurer, who prices a policy from how often claims happen and how big they get, not from a colour. [[slnc 600]] Our example is a bank."

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["A bank's risk committee has:", "  8 risks, each as two ranges", "  7 controls, each with a cost", "  a budget of $800k a year", "  an appetite: few years over $5M", "", "The demo simulates 50,000 years", "and asks what the money buys."]
narration = "Here is the scenario. [[slnc 400]] A bank's risk committee has eight risks, from ransomware to a lost laptop. [[slnc 300]] An expert gives each one two ranges: how often it happens in a year, and what one event costs. [[slnc 500]] There are seven controls, each with a yearly cost, and a budget of eight hundred thousand dollars. [[slnc 300]] And the board has an appetite: only a few years may lose more than five million. [[slnc 500]] The demo simulates fifty thousand years, and asks what the money buys."

[[scene]]
key = "02-words"
kind = "bullets"
title = "The Words"
body = ["Risk register: the list of risks", "Range: least, most likely, most", "Monte Carlo: many random years", "Expected loss: the average year", "Tail: the bad years, 1 in 10 or 1 in 20", "Net benefit: loss avoided minus cost", "Appetite and residual risk"]
narration = """Before the demos, the words. [[slnc 500]] A risk register is the list of a business's risks. [[slnc 500]] A range, or three point estimate, is the least, the most likely, and the most an expert will say. [[slnc 500]] A Monte Carlo simulation draws many random years from the ranges. [[slnc 500]] The expected loss is the average year. [[slnc 300]] The tail is the bad years: the loss that one year in ten, or one in twenty, goes over. [[slnc 500]] A control's net benefit is the loss it avoids, minus what it costs. [[slnc 500]] The risk appetite is how much bad the board accepts, and the residual risk is what is left after the controls."""

