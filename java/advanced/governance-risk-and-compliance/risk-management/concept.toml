[[threat]]
id = "T2"
stride = "I"
threat = "One number is trusted without its range"
where = "the report"
control = "Show the tail and the range with the mean"
residual = "A reader who skips them"

[[threat]]
id = "T3"
stride = "R"
threat = "A decision cannot be explained later"
where = "the register"
control = "Keep the register, the seed and the inputs under version control"
residual = "Decisions made outside the model"

