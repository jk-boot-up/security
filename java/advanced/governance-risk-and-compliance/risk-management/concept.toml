[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] It needs only the J D K. [[slnc 300]] Here are the classes that matter."""

[[class]]
name = "Tri"
what = "a range: least, most likely, most"
[[class.part]]
title = "a draw between 0 and 1 becomes a value"
code = """
public double at(double u) {
    double split = (max - min) == 0 ? 0 : (mode - min) / (max - min);
    if (u < split) {
        return min + Math.sqrt(u * (max - min) * (mode - min));
    }
    return max - Math.sqrt((1 - u) * (max - min) * (max - mode));
"""
speech = """A draw between zero and one is a share of the triangle's area. [[slnc 300]] Below the most likely point, the value is read from the least end; above it, from the most end. [[slnc 300]] This is the formula the first act worked out by hand."""

[[class]]
name = "Simulation"
what = "50,000 years, the same years for every treatment"
[[class.part]]
title = "the draws are made once and kept"
code = """
RandomGenerator rng = RandomGeneratorFactory.of(ALGORITHM).create(seed + 7919L * r);
for (int t = 0; t < trials; t++) {
    frequencyU[r][t] = rng.nextDouble();
    eventsU[r][t] = rng.nextDouble();
"""
speech = """Each risk gets its own seeded random generator, of a fixed algorithm. [[slnc 300]] The draws are made once and kept. [[slnc 300]] So two sets of controls are compared on exactly the same years, and the difference is the controls, not the luck."""
[[class.part]]
title = "how many events: walk up the chances"
code = """
double p = StrictMath.exp(-lambda);
double cumulative = p;
int k = 0;
while (u > cumulative && k < MAX_EVENTS) {
    k++;
    p *= lambda / k;
    cumulative += p;
"""
speech = """The chance of no event is e to the minus rate. [[slnc 300]] The loop adds the chance of one, two, three events, until the draw is reached. [[slnc 300]] Strict math keeps the result the same on every machine."""
[[class.part]]
title = "a control multiplies the rate and the loss"
code = """
double lambda = risk.frequency().at(frequencyU[riskIndex][t]) * fFactor;
int events = poisson(lambda, eventsU[riskIndex][t]);
...
sum += risk.loss().at(lossU[riskIndex][t][j]) * lFactor;
"""
speech = """One year of one risk: the rate, then the number of events, then a loss for each event. [[slnc 300]] A control's factors multiply the rate and the loss."""

[[class]]
name = "YearSteps"
what = "a teaching class: one year redone by hand"
[[class.part]]
title = "the same draws, step by step"
code = """
double u1 = sim.frequencyDraw(riskIndex, year);
double split = (f.mode() - f.min()) / (f.max() - f.min());
double rate = f.at(u1);
...
while (u2 > cumulative && events < Simulation.MAX_EVENTS) {
"""
speech = """This class redoes one simulated year, keeping every step: the draws, the split, the rate, and the chances. [[slnc 300]] A test proves that its total is exactly the simulation's loss, for every risk and every year."""

[[class]]
name = "Optimizer"
what = "the best set of controls within a budget"
[[class.part]]
title = "try every set, keep the largest net benefit"
code = """
for (int mask = 1; mask < (1 << available.size()); mask++) {
...
    if (cost > budget) {
        continue;
    }
    double mean = Simulation.mean(sim.portfolio(set));
    double net = baseline - mean - cost;
"""
speech = """Each bit of the mask says whether a control is in the set: one hundred and twenty seven sets for seven controls. [[slnc 300]] A set over the budget is skipped. [[slnc 300]] The net benefit is the loss before, minus the loss after, minus the cost."""

