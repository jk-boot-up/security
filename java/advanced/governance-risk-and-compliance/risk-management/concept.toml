# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "risk-management"
level = "advanced"
module = "governance-risk-and-compliance"
title = "Risk Management"
short_title = "Risk Management"
package = "riskmgmt"
main_class = "RiskManagementDemo"
tagline = "Quantify a bank's risk register with ranges and a Monte Carlo simulation, choose controls within a budget, and check the residual risk against an appetite"
bold = "A bank's register of 8 risks, each with a range for how often it happens and what it costs, is simulated for 50,000 years: the heat map's top three share only 1 of 3 risks with the top three by expected loss; the whole register has an expected loss of $5.8M a year, 1 year in 20 loses more than $16.8M, and the chance of losing more than $5.0M in a year is 41.4%, against an appetite of 5%; the best set of controls within an $800k budget (backups, multi-factor login, vendor assessments and dual approval, $610k) cuts the expected loss to $3.1M and beats the cheapest-first set by $581k a year, but still leaves a 19.5% chance over the appetite; only all 7 controls ($1.7M) bring it to 4.1%."
domain = "a bank"
domain_note = ""
youtube_description = "Quantitative risk management for a bank: a register with three-point estimates, a Monte Carlo simulation of 50,000 years, the heat map compared with expected loss, the best set of controls within a budget, residual risk against an appetite, and what the model cannot know."
thumb_lines = ["RISK", "MANAGEMENT"]
thumb_code = "P(loss > $5M in a year) = 41.4%"
youtube_title = "Risk Management: Monte Carlo Risk Register, Controls Within a Budget and Risk Appetite"
youtube_tags = ["risk management", "risk register", "monte carlo", "fair", "risk appetite", "residual risk", "cost benefit", "grc", "governance", "java"]

[readme]
intro = """
A risk register with a heat map says which risks look big; it does not say how much money is at stake, what a control is worth, or whether the bank is inside its appetite. This project keeps the register as ranges, a least, a most likely and a most value for how often a risk happens in a year and for what one event costs, and simulates **50,000 years** of events in Java (a seeded Monte Carlo, in the spirit of FAIR). It then picks controls within a budget by trying every set, and checks the residual risk against a stated appetite. It needs only the JDK; `./gradlew test`, then `./gradlew run`.

What it shows:
- **Heat map against money.** The top three risks by likelihood times impact share only **1 of 3** with the top three by expected loss.
- **The whole register.** Expected loss **$5.8M** a year, **1 year in 20** loses more than **$16.8M**, and the chance of losing more than $5.0M in a year is **41.4%**; 1,000 years give an estimate 0.9% away.
- **Treatment.** Within **$800k** the best set of four controls costs **$610k**, cuts the expected loss to **$3.1M**, and beats cheapest-first by **$581k** a year.
- **Appetite.** After the best set the chance over the appetite is **19.5%** against 5%; only all seven controls (**$1.7M**) give **4.1%**.
- **The bill.** The inputs are an expert's ranges, the risks are taken as independent, and a number is easy to trust too much.

**Maps to:** NIST CSF 2.0 Govern (GV.RM risk management strategy) · ISO/IEC 27005 · FAIR (Factor Analysis of Information Risk) · NIST SP 800-30 and 800-39.
"""
analogy = """
A weather forecast against a calendar saying that Tuesday is usually grey. The calendar ranks days. The forecast says how likely rain is, how much, and whether you should carry an umbrella that costs something to carry. Neither knows about the storm that nobody has seen before.
"""
scenario = """
A bank's risk committee has eight risks, seven possible controls and a budget of $800k, and wants to know what the money buys. The demo turns the register into ranges, simulates years, and compares treatments.
"""
costs = [
    "**The inputs are guesses with ranges,** and the output inherits them.",
    "**Independence is assumed;** real incidents arrive together.",
    "**A number looks more certain than it is.**",
    "**Workshops to agree ranges take time** and argument.",
    "**A model cannot know the incident nobody has imagined.**",
]
too_much = """
A small company with a handful of risks can use a heat map and a conversation. Quantify when money is being chosen between controls, when a board asks how much, or when the appetite is stated as a number.
"""
met_before = [
    "A heat map where everything is amber.",
    "A control bought because a peer bought it.",
    "A risk register updated once a year.",
    "An appetite statement with no number in it.",
]
where = """
This is a project of the [governance-risk-and-compliance](..) module. The controls it prices are the kinds built in the earlier modules: backups, segmentation, multi-factor login and tokenization.
"""
twin = """
The simulation is real and seeded, so every run gives the same numbers. The register, the ranges and the costs are made up for a bank and are not data about any real organisation.
"""
test_note = "The distributions, the simulation, the optimizer and the register are tested with the JDK only. The demo is compared with its golden output."

[[act]]
title = "Heat map against money"
summary = "The top three risks by score share only 1 of 3 with the top three by expected loss."
detail = """
Eight risks have a least, a most likely and a most value for how often they happen and for what an event costs. Their scores (likelihood times impact) rank card breach, insider fraud and outage first, while the simulated expected loss ranks ransomware, third-party breach and card breach first.
"""
speech = """
First demo: the heat map against money. [[slnc 400]] Rank the risks by score and by expected loss. [[slnc 600]] Only one of the top three is the same.
"""
rows = { map = "active wrong" }
console = [
    ["top three by score: card-breach, insider-fraud, outage", "bad"],
    ["top three by expected loss: ransomware, third-party, card-breach", "ok"],
    ["in both lists: 1 of 3", "bad"],
]

[[act]]
title = "The whole register"
summary = "The expected loss is $5.8M a year, 1 year in 20 loses more than $16.8M, and 41.4% of years lose more than $5.0M."
detail = """
50,000 simulated years add up the eight risks. The mean agrees with mean frequency times mean loss, which checks the simulation. The tail is the news: 1 year in 10 loses more than $12.8M. An estimate from 1,000 years is 0.9% away from the one from 50,000.
"""
speech = """
Second demo: the whole register. [[slnc 400]] Fifty thousand simulated years. [[slnc 600]] The mean is five point eight million, and the tail is three times that.
"""
rows = { whole = "active ok" }
console = [
    ["expected loss a year: $5.8M", "ok"],
    ["1 year in 20 loses more than $16.8M", "bad"],
    ["more than $5.0M in a year: 41.4%", "bad"],
]

[[act]]
title = "Controls within a budget"
summary = "The best set within $800k costs $610k and beats cheapest first by $581k a year."
detail = """
Seven controls each change the frequency or the loss of some risks. Trying every set within the budget on the same simulated years gives backups, multi-factor login, vendor assessments and dual approval: $610k, expected loss $3.1M, net benefit $2.1M. Buying the cheapest first gives a net benefit that is $581k a year smaller.
"""
speech = """
Third demo: controls within a budget. [[slnc 400]] Try every set on the same simulated years. [[slnc 600]] The best set beats the cheapest first by half a million a year.
"""
rows = { treat = "active ok" }
console = [
    ["best set: backups, mfa, vendors, approval", "ok"],
    ["expected loss $3.1M, net benefit $2.1M", "ok"],
    ["beats cheapest first by $581k", "ok"],
]

[[act]]
title = "Appetite and what is left"
summary = "After the best set the chance of losing more than $5.0M is 19.5% against an appetite of 5%; all seven controls give 4.1%."
detail = """
The appetite says at most a 5% chance of losing more than $5.0M in a year. Before: 41.4%. After the best set: 19.5%, still outside. With all seven controls, which cost $1.7M: 4.1%, inside. Reaching the appetite costs more than the budget, so the committee must spend more, transfer the rest with insurance, or change the appetite.
"""
speech = """
Fourth demo: appetite. [[slnc 400]] The best set is still outside it. [[slnc 600]] Closing the gap is a decision for the committee.
"""
rows = { appetite = "active wrong" }
console = [
    ["before: 41.4%, within appetite: no", "bad"],
    ["after the best set: 19.5%, no", "bad"],
    ["all 7 controls: 4.1%, yes", "ok"],
]

[[act]]
title = "The bill"
summary = "The inputs are ranges from a workshop, the risks are independent here, and a number is easy to trust too much."
detail = """
A ransomware loss estimate 50% higher moves the expected loss by $116k, a small change next to the uncertainty of the ranges themselves. Real incidents arrive together, which this model does not show. Present the range and the tail, not only the mean.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] Every input is an expert's range. [[slnc 600]] Show the tail with the number.
"""
rows = { bill = "active wrong" }
console = [
    ["inputs are ranges, not measurements", "bad"],
    ["risks taken as independent", "bad"],
    ["show the range and the tail", "ok"],
]

