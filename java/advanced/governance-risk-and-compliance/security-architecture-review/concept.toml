# concept.toml: everything about this project that is not Java code.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "security-architecture-review"
level = "advanced"
module = "governance-risk-and-compliance"
title = "Security Architecture Review"
short_title = "Architecture Review"
package = "archreview"
main_class = "ArchitectureReviewDemo"
tagline = "Review a bank's design written in the Structurizr DSL with rules over trust zones, flows, data stores and decision records, and see what no rule can find"
bold = "A bank's online banking design is written in the Structurizr DSL with 9 parts in 6 trust zones and 9 flows, 8 of them crossing a zone, and 4 decision records of which 2 are accepted; 65 STRIDE questions follow from its parts and flows; 10 weaknesses are planted in it: the first 8 rules report 8 of the 10, the ninth rule (every flow encrypted and authenticated) reports 9 of 10, and the tenth, a web application that trusts a hidden form field, is in no model and needs a person; the reviewed design has 0 findings, no path from the web zone to confidential data, and 4 of 4 decisions accepted."
domain = "a bank"
domain_note = ""
youtube_description = "Security architecture review for a bank: a design in the Structurizr DSL read in Java, trust zones and flows checked by rules, STRIDE questions generated from the model, architecture decision records with their status, planted weaknesses as the truth, and what a review of a model cannot find."
thumb_lines = ["ARCHITECTURE", "REVIEW"]
thumb_code = "web -> ledgerdb  crosses dmz -> data"
youtube_title = "Security Architecture Review: Trust Boundaries, Data Flows and Decision Records (Structurizr, ADRs)"
youtube_tags = ["security architecture review", "threat modeling", "stride", "structurizr", "c4 model", "architecture decision records", "trust boundaries", "data flow", "design review", "java"]

[readme]
intro = """
A security review of a design asks where the trust boundaries are, which flows cross them, what the data stores hold and who decided what. This project writes a bank's online banking design in the **Structurizr DSL** (the C4 model as text), reads it in Java with the Structurizr library, and runs **rules** over it: a flow between zones must be encrypted and authenticated, nothing in the web zone may reach confidential data directly, confidential data must be encrypted at rest, every part has an owner, and every decision a part rests on is an **accepted** architecture decision record. Ten weaknesses are planted in the first design, so the rules can be scored. `./gradlew test`, then `./gradlew run`.

What it shows:
- **The design as drawn.** 9 parts, 9 flows in 6 zones (8 cross a zone), 4 decision records (2 accepted), and **65** STRIDE questions that follow from the kinds of its parts and flows.
- **Rules over the design.** The first 8 rules report **8 of 10** planted weaknesses; one more rule, every flow encrypted and authenticated, gets **9 of 10**.
- **What no rule finds.** A web application that trusts a hidden form field is not in the model; a person has to ask.
- **The reviewed design.** **0** findings, no path from the web zone to confidential data, **4 of 4** decisions accepted.
- **The bill.** Rules read the model, and the model is what the team drew.

**Maps to:** NIST CSF 2.0 ID.RA and GV.RM · OWASP Threat Modeling · STRIDE · NIST SP 800-160 (systems security engineering) · C4 model and ADRs (Nygard).
"""
analogy = """
An architect's plan check before building starts. A checker can measure that every fire door opens outward and every corridor is wide enough, because those are in the drawing. It cannot see that the builder will prop a door open with a brick, which nobody drew.
"""
scenario = """
A bank's team has drawn the architecture of its online banking in a text file and recorded its decisions. A review has to find what is wrong before the system is built. The demo plants ten weaknesses and counts what the rules find.
"""
costs = [
    "**The model must be kept up to date,** or the review reviews a story.",
    "**Rules find what is in the model,** not what was left out.",
    "**Properties such as zone and owner must be filled in** by the team.",
    "**Decision records need discipline** to stay current.",
    "**A tool-generated list of questions is long** and needs people to answer.",
]
too_much = """
A one-page application with one database does not need a modelled review. Use it when several teams build parts of a system, when data is confidential, or when a regulator asks to see the design decisions.
"""
met_before = [
    "A diagram on a whiteboard photographed once.",
    "A design document nobody has opened since approval.",
    "A decision made in chat and never written down.",
    "A review that checks the diagram but not the code.",
]
where = """
This is a project of the [governance-risk-and-compliance](..) module, with [risk-management](../risk-management) and [controls-and-evidence](../controls-and-evidence). The rules here are the design-time counterpart of the network and admission policies built earlier.
"""
twin = """
The design, the zones and the decision records are made up for a bank. The Structurizr parser is the real library, and the rules are small Java methods over the model.
"""
test_note = "The parsing, the rules, the decision records and the scoring are tested with the JDK and the Structurizr library only. The demo is compared with its golden output."

[[act]]
title = "The design as drawn"
summary = "9 parts, 9 flows in 6 zones, 4 decision records, and 65 STRIDE questions that follow from them."
detail = """
The design has a customer, operations staff, a card network, a web application, a payments API, a ledger service, a reporting job and two data stores. Eight of the 9 flows cross a zone. Two of the 4 decision records are accepted. STRIDE asks 2 questions about a person or an external system, 6 about a process, 4 about a data store and 3 about each flow: 65.
"""
speech = """
First demo: the design as drawn. [[slnc 400]] Nine parts, nine flows, six zones. [[slnc 600]] A review would ask sixty-five questions, generated from the model.
"""
rows = { design = "active ok" }
console = [
    ["parts: 9, flows: 9, zones: 6", "ok"],
    ["flows that cross a zone: 8", "ok"],
    ["STRIDE questions: 65", "ok"],
]

[[act]]
title = "Rules over the design"
summary = "The first 8 rules report 8 of the 10 planted weaknesses."
detail = """
The rules find the web application reading the ledger database directly, sessions crossing a zone unencrypted, no authentication towards the card network, confidential data unencrypted at rest, a reporting job without an owner, a confidential store without a recorded decision, and two designs resting on decisions that are superseded or only proposed. They miss the ledger calls inside a zone and the hidden form field.
"""
speech = """
Second demo: rules over the design. [[slnc 400]] Ten weaknesses are planted. [[slnc 600]] The first eight rules find eight.
"""
rows = { rules = "active wrong" }
console = [
    ["first 8 rules: 8 of 10 reported", "bad"],
    ["no-direct-path-to-data: web -> ledgerdb", "ok"],
    ["not reported: calls inside a zone, the hidden field", "bad"],
]

[[act]]
title = "One more rule"
summary = "A rule that wants every flow encrypted and authenticated finds the internal ledger calls: 9 of 10."
detail = """
The cross-zone rules cannot see the calls from the API to the ledger, because both are in the application zone. A rule for every flow, inside a zone too, reports them. The tenth weakness, a web application that trusts a hidden form field for the account number, is in no model, so no rule reports it.
"""
speech = """
Third demo: one more rule. [[slnc 400]] Zero trust says to check the calls inside a zone too. [[slnc 600]] Nine of ten, and the tenth needs a person.
"""
rows = { more = "active ok" }
console = [
    ["every-flow rule added: 9 of 10", "ok"],
    ["api -> ledger now reported", "ok"],
    ["hidden form field: no rule can", "bad"],
]

[[act]]
title = "The reviewed design"
summary = "After the review the design has 0 findings, no path from the web zone to confidential data, and 4 of 4 decisions accepted."
detail = """
The web application no longer reads the database: it calls the payments API. Sessions go over TLS with a client certificate, the ledger and card network calls use mutual authentication, the ledger database is encrypted at rest with a recorded decision, the reporting job has an owner, and the superseded and proposed decisions are replaced by accepted ones.
"""
speech = """
Fourth demo: the reviewed design. [[slnc 400]] No path from the web zone to confidential data. [[slnc 600]] Four of four decisions are accepted.
"""
rows = { fixed = "active ok" }
console = [
    ["findings from all 9 rules: 0", "ok"],
    ["paths from web to confidential data: 0 (before 1)", "ok"],
    ["decision records accepted: 4 of 4", "ok"],
]

[[act]]
title = "The bill"
summary = "Rules read the model, and the model is what the team drew; a design with no findings is not a safe one."
detail = """
A flaw that is not in the picture is not found. The hidden form field needs a person who asks what the web application trusts. A design that the rules agree with is only a design that the rules agree with.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] The rules read the model. [[slnc 600]] A person still has to ask what was left out.
"""
rows = { bill = "active wrong" }
console = [
    ["a flaw not in the picture is not found", "bad"],
    ["a person asks what is trusted", "ok"],
    ["no findings is not safe", "bad"],
]

[animation]
subtitle = "A bank's design, reviewed by rules and by people."
boxes = [
    ["design", "The design as drawn", "65 questions"],
    ["rules", "Rules over the design", "8 of 10"],
    ["more", "One more rule", "9 of 10"],
    ["fixed", "The reviewed design", "0 findings"],
    ["bill", "The bill", "the model"],
]

[docs.problem]
scenario = """
A bank wants to find the weaknesses in a design before the system is built.
"""
naive = """
Hold a review meeting and write the comments in the margin of a PDF.
"""
deliver = [
    "A design written in the Structurizr DSL.",
    "Rules over zones, flows, data stores, owners and decisions.",
    "Planted weaknesses to score the rules.",
    "A reviewed design and its decision records.",
]

[docs.prerequisites]
required = [
    "Java basics",
]
not_required = [
    "Docker",
    "Structurizr tools (the library is a dependency)",
]
install = []

[docs.session]
objectives = [
    "describe a design as text with trust zones and flow properties",
    "write a rule over a design and score it on planted weaknesses",
    "generate STRIDE questions from a model",
    "tell what a model-based review cannot find",
]
walkthrough = """
Run the demo and compare the first eight rules with the ninth. Then open design/v1/bank.dsl and find the flow that no cross-zone rule can see.
"""
exercises = [
    "Add a rule that every internet-facing part has a web application firewall property.",
    "Add a hidden-form-field note to the model as a trust assumption and write a rule that requires one for each web part.",
    "Check that every decision record names its consequences.",
    "Draw the container view with the Structurizr tools and compare it with the rules.",
]

[docs.explained]
sentence = """
A design review finds what is in the drawing, so draw the trust, not only the boxes.
"""
verdict = """
Write the design as text with zones, owners and flow properties, check it with rules on every change, record decisions with a status, score the rules on planted weaknesses, and keep a person in the review to ask what is missing.
"""
recognise = [
    "A diagram with boxes and no trust boundaries.",
    "A decision made once and never revisited.",
    "A review that only checks the diagram against itself.",
    "A data store reached from the web tier.",
]

[spec]
purpose = """
Teach security architecture review by checking a bank's design in the Structurizr DSL with rules and decision records, and by scoring the rules on planted weaknesses.
"""
nongoals = [
    "Drawing tools and diagrams.",
    "Threat modelling workshops.",
    "Reviewing code.",
]
problem = """
Design reviews depend on who is in the room, and the decisions made there are not written down or checked later.
"""
roles = [["The design from the DSL", "`Design`"], ["The decision records", "`Adr`"], ["The review rules", "`Rules`"], ["What a rule reports", "`Finding`"], ["The planted weaknesses", "`Planted`"], ["Entry point", "`ArchitectureReviewDemo`"]]
requirements = [
    "The design is read from a Structurizr DSL file with zone and flow properties.",
    "Rules report findings by rule and subject.",
    "Planted weaknesses score the rules, including one that no rule can find.",
    "Decision records are read with their status.",
    "The demo prints the same output on every run.",
]

