[[act]]
title = "One more rule"
summary = "A rule that wants every flow encrypted and authenticated, inside a zone too, finds the internal ledger calls: 9 of 10."
detail = """
The input: one more rule, every-flow-encrypted-and-authenticated. The cross-zone rules skip api -> ledger, because both ends are in the app zone; it is not encrypted and checks no caller.
The result: 3 new findings. api -> ledger is planted weakness 4; api -> cards and web -> sessions were already found by the cross-zone rules. With 9 rules: 12 findings, 9 of 10 planted weaknesses found, 3 findings that match no planted one, 1 missed.
The tenth weakness, a web application that trusts a hidden form field for the account number, is in no model: the model has no property for what a page trusts, so no rule can read it.
"""
figure = "one_more_rule"
figure_title = "The flow inside one zone, and the score"
figure_speech = """
Third demo: one more rule. [[slnc 400]] On the left, the input: the flow from the payments A P I to the ledger service. [[slnc 300]] Both are in the application zone, so the cross zone rules never look at it. [[slnc 300]] Yet it is not encrypted, and it checks no caller. [[slnc 600]]
The new rule wants every flow encrypted and checked, inside a zone too. [[slnc 300]] That is the zero trust idea: being inside a zone is not a reason to trust a call. [[slnc 700]]
On the right, the result. [[slnc 300]] The first eight rules found eight of ten. [[slnc 300]] All nine find nine of ten. [[slnc 300]] The price is two more findings that only repeat what was already found. [[slnc 600]]
And the one that is still missed: the web application trusts a hidden form field for the account number. [[slnc 300]] No property in the model says what a page trusts, so no rule can see it.
"""
speech = """
The new rule, and the only flow inside one zone: the A P I calls the ledger, with no encryption and no caller check. [[slnc 400]] Three new findings. [[slnc 300]] One is planted weakness four. [[slnc 300]] The other two, the card network and the sessions, were already found by the cross zone rules.
[[page]]
The score with nine rules: twelve findings, nine of ten planted weaknesses found, three findings that match no planted one, and one missed. [[slnc 300]] The hidden field, which no property in the model describes.
