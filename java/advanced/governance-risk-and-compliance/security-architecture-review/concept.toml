[threatmodel]
scope = """
The design of the online banking system, as modelled. It does not cover the code or the running system.
"""
assets = [
    "The ledger.",
    "The sessions.",
    "The decision records.",
]
actors = [
    "A developer who adds a flow.",
    "An attacker who reaches the web zone.",
    "A reviewer.",
]
boundaries = [
    "The trust zones: internet, dmz, app, data, office and external.",
]
assumptions = [
    "The model matches what is built.",
]
out_of_scope = [
    "Implementation bugs.",
    "Supply chain.",
]
tests = [
    "`ReviewTest` checks the parsing, the rules, the decision records and the scoring with the JDK and the Structurizr library.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next project in the module is privacy-engineering.
"""

[[threat]]
id = "T1"
stride = "E"
threat = "An attacker in the web zone reaches confidential data"
where = "the flows"
control = "A rule against direct paths to data; calls go through an API that authenticates"
residual = "Flaws in the API"

[[threat]]
id = "T2"
stride = "I"
threat = "A flow or a store exposes data unencrypted"
where = "flows and stores"
control = "Rules for encryption in transit and at rest"
residual = "Data in memory"

[[threat]]
id = "T3"
stride = "R"
threat = "A decision is forgotten or overturned without record"
where = "the decision records"
control = "A rule that a part rests on an accepted record"
residual = "Records that are accepted but wrong"

