[[act]]
title = "Rules over the design"
summary = "Ten weaknesses are planted; the first 8 rules report 8 of them, plus 1 finding that matches no planted one."
detail = """
The input: the ten planted weaknesses, the truth the rules are scored on, and the first eight rules, each a few lines of Java over the model.
How a flow is checked: web -> ledgerdb goes from dmz to data, is encrypted and checks its caller with a database user, but it reaches confidential data from an outer zone, so no-direct-path-to-data fires. web -> sessions crosses the same zones but is not encrypted, so cross-zone-encrypted fires. How a decision is checked: sessions rests on 0003, which is Superseded by 5, and cards rests on 0004, which is Proposed: neither is Accepted.
The result: 9 findings. 8 match a planted weakness by rule and subject; wide-access-to-data on ledgerdb (3 containers reach it) matches none. Missed: the ledger calls inside the app zone, and the hidden account-number field.
"""
figure = "score_grid"
figure_title = "Ten planted weaknesses, and what the first rules report"
figure_speech = """
Second demo: rules over the design. [[slnc 400]] On the left, the input: ten weaknesses planted in the design on purpose. [[slnc 300]] They are the truth that the rules are scored against. [[slnc 700]]
On the right, the result: for each weakness, the rule that reported it, on the same part or flow. [[slnc 300]] The direct path from the web to the ledger database, the unencrypted sessions, the card network call with no caller check, the data not encrypted at rest, the job with no owner, the store with no decision, and the two decisions that are not accepted. [[slnc 600]]
Two are missed. [[slnc 300]] Number four, the ledger calls inside the application zone, because both cross zone rules only look at flows that cross a zone. [[slnc 300]] And number ten, the web application that trusts a hidden form field, because it is not in the model at all.
"""
