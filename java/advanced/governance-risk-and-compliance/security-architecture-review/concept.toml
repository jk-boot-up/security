The arrows are the nine flows. [[slnc 300]] A green arrow is encrypted and checks its caller. [[slnc 300]] A rose arrow is one a flow rule will object to. [[slnc 300]] Look at the arrow from the web application straight to the ledger database: it is encrypted, but it goes from the zone that faces the internet to the bank's most confidential data. [[slnc 600]]
