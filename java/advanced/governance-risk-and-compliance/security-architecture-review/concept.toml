[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] The design is text in the Structurizr D S L, read by the Structurizr library, and the rules are plain Java. [[slnc 300]] Here are the classes that matter."""

[[class]]
name = "Design"
what = "the parts, zones and flows read from the DSL file"
[[class.part]]
title = "every element becomes a part with a kind and a zone"
code = """
StructurizrDslParser parser = new StructurizrDslParser();
parser.parse(Files.readString(dsl));
...
} else if (e instanceof Container c) {
    kind = c.getTags().contains("Datastore") ? Kind.DATASTORE : Kind.PROCESS;
...
String zone = props.getOrDefault("zone", "");
byName.put(e.getId(), new Part(id, e.getName(), kind, zone, props));
"""
speech = """The real Structurizr parser reads the file. [[slnc 300]] A container tagged as a data store becomes a data store, and every other container a process. [[slnc 300]] The zone, the owner and the classification are properties the team wrote."""

[[class]]
name = "Rules"
what = "the review rules, each a few lines over the model"
[[class.part]]
title = "no direct path to data, and encrypted crossings"
code = """
boolean toConfidential = f.to().kind() == Design.Kind.DATASTORE
        && f.to().prop("classification").equals("confidential");
boolean fromOuter = f.from().zone().equals("dmz") || f.from().zone().equals("internet");
if (rules.contains("no-direct-path-to-data") && toConfidential && fromOuter) {
...
if (rules.contains("cross-zone-encrypted") && f.crossesZones() && !encrypted) {
"""
speech = """A rule is an if over one flow or one part. [[slnc 300]] The first reports a flow from an outer zone to a confidential data store. [[slnc 300]] The second reports a flow that crosses a zone without encryption."""
[[class.part]]
title = "a decision must exist and be accepted"
code = """
Adr adr = adrs.get(p.prop("adr"));
if (adr == null || !adr.accepted()) {
    String why = adr == null ? "does not exist" : "is " + adr.status();
"""
speech = """A part that cites a decision record is checked against that record's status. [[slnc 300]] Superseded or proposed is reported, and so is a record that does not exist."""

[[class]]
name = "FlowCheck"
what = "a teaching class: the flow rules as questions, one by one"
[[class.part]]
title = "the answers decide which rules fire"
code = """
if (toConfidentialStore() && fromOuterZone()) {
    fire.add("no-direct-path-to-data");
}
if (crossesZone() && !encrypted()) {
    fire.add("cross-zone-encrypted");
"""
speech = """FlowCheck answers the questions about one flow, and says which rules fire. [[slnc 300]] A test proves it agrees with Rules on every flow of both designs."""

[[class]]
name = "Stride"
what = "the STRIDE letters asked about each kind of part"
[[class.part]]
title = "letters by kind, and three for a flow"
code = """
case PERSON, EXTERNAL -> List.of("S", "R");
case PROCESS -> List.of("S", "T", "R", "I", "D", "E");
case DATASTORE -> List.of("T", "R", "I", "D");
...
public static final List<String> FLOW = List.of("T", "I", "D");
"""
speech = """A person or an outside system can be spoofed or deny what it did. [[slnc 300]] A process can suffer all six threats, a data store four, and a flow three. [[slnc 300]] That is how sixty-five questions follow from the model."""

[[class]]
name = "Changes"
what = "what changed between two versions of the design"
[[class.part]]
title = "a removed flow, or a changed property"
code = """
if (b == null) {
    out.add(new Change(id, "flow", "drawn", "removed"));
...
compare(id, a.props(), b.props(), out);
"""
speech = """Changes compares the two design files, flow by flow and part by part. [[slnc 300]] That is how the fourth demo lists what the review changed."""

[[class]]
name = "Planted"
what = "the truth: each weakness, its rule and its subject"
[[class.part]]
title = "found means the same rule on the same subject"
code = """
new Planted("web trusts a hidden account-number field", null, "web"));
...
return findings.stream()
        .anyMatch(f -> f.rule().equals(rule) && f.subject().equals(subject));
"""
speech = """Each planted weakness names the rule that should report it, and on what. [[slnc 300]] The hidden field has no rule, so nothing can ever report it."""

[[acronym]]
short = "DSL"
long = "Domain-Specific Language: a small language for one job"
say = "D S L is domain specific language: a small language for one job, here describing a software architecture."
[[acronym]]
short = "C4"
long = "Context, Containers, Components and Code: four levels of diagram"
say = "C 4 stands for context, containers, components and code: four levels of architecture diagram."
[[acronym]]
short = "STRIDE"
long = "Spoofing, Tampering, Repudiation, Disclosure, Denial, Elevation"
say = "S T R I D E names six kinds of threat: spoofing, tampering, repudiation, information disclosure, denial of service, and elevation of privilege."
[[acronym]]
short = "ADR"
long = "Architecture Decision Record: one decision and its status"
say = "A D R is architecture decision record: one decision, written down, with its status."
[[acronym]]
short = "DMZ"
long = "Demilitarized Zone: the zone that faces the internet"
say = "D M Z is demilitarized zone: the network zone that faces the internet."
[[acronym]]
short = "API"
long = "Application Programming Interface: here, the payments service"
say = "A P I is application programming interface. Here, the payments A P I is the service that other parts call."
