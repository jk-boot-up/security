[[scene]]
key = "01-poster"
kind = "poster"
title = "Security Architecture Review"
narration = "Hello, and welcome. [[slnc 400]] This video explains a security architecture review. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A security review of a design asks where the trust boundaries are, which flows cross them, what the data stores hold, and who decided what. [[slnc 300]] When the design is written as text, many of those questions become rules a program can check. [[slnc 600]] Think of checking a bank branch's floor plan before it is built: where the vault is, who walks past it, and which doors need a lock. [[slnc 600]] Our example is a bank."

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["A bank's online banking design, written in", "the Structurizr DSL: 9 parts in 6 trust zones,", "9 flows and 4 decision records.", "", "10 weaknesses are planted. The demo counts", "what the rules find, and what they cannot."]
narration = "Here is the scenario. [[slnc 400]] A bank's team has written the architecture of its online banking as text, in the Structurizr D S L, a language for the C 4 model. [[slnc 500]] It has nine parts in six trust zones, nine flows, and four decision records. [[slnc 500]] The demo plants ten weaknesses in it, runs review rules written in Java, and counts what the rules find, and what they cannot."

[[scene]]
key = "02-words"
kind = "bullets"
title = "The Words"
body = ["Part: a person, a system, a process or a data store", "Trust zone: parts that trust each other alike", "Flow: one part calling another", "Decision record: a decision, with its status", "Rule: a check in code over the model", "Planted weakness: a known flaw, to score the rules"]
narration = """Before the demos, the words. [[slnc 500]] A part is a person, an outside system, a process, or a data store. [[slnc 500]] A trust zone is a group of parts that are trusted alike, such as the zone that faces the internet. [[slnc 500]] A flow is one part calling another; when it goes from one zone to another, it crosses a trust boundary. [[slnc 500]] An architecture decision record writes down one decision, with a status: proposed, accepted, or superseded. [[slnc 500]] A rule is a check, written in code, over the model. [[slnc 300]] And a planted weakness is a flaw put in on purpose, so the rules can be scored."""

[[scene]]
key = "02-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "02-check"
kind = "figure"
title = "How one rule reads one flow"
body = "flow_check"
narration = """Let's see the core idea on one example: how the rules read one flow. [[slnc 400]] Two flows leave the web application, and both go from the D M Z to the data zone. [[slnc 600]] The rules ask the same questions of each. [[slnc 300]] Does it cross a zone? Yes, both do. [[slnc 300]] Is it encrypted? The flow to the ledger database is. [[slnc 300]] The flow to the session store is not. [[slnc 300]] How is the caller checked? With a database user, and with a password. [[slnc 300]] Does it reach confidential data? The ledger database does; the sessions do not. [[slnc 700]]
At the bottom, the result. [[slnc 300]] The ledger database flow fires no direct path to data: the zone that faces the internet must not reach confidential data directly. [[slnc 300]] The sessions flow fires cross zone encrypted. [[slnc 300]] Every answer comes from a property the team wrote in the model. [[slnc 300]] What the team did not write, no rule can read."""

[[scene]]
key = "03-acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "04-costs"
kind = "bullets"
title = "What It Costs"
body = ["Rules read the model, not the system", "The model is only what the team drew", "Some weaknesses are in no model:", "  a person has to ask", "The model must be kept up to date"]
narration = "Nothing is free. [[slnc 400]] Here is what it costs. [[slnc 500]] Rules read the model, not the running system. [[slnc 500]] The model is only what the team drew. [[slnc 500]] Some weaknesses are in no model at all, like a web application that trusts a hidden form field: a person has to ask. [[slnc 500]] And the model must be kept up to date as the system changes."

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["A C4 container diagram", "A decision record with the status Proposed", "A flow from the web zone straight to the database", "A design review held after the system is built"]
narration = "You have probably met this already. [[slnc 400]] The C 4 container diagram shows the parts of a system and the flows between them. [[slnc 500]] A decision record with the status proposed is a decision nobody has made yet. [[slnc 500]] A flow from the web zone straight to the database crosses trust boundaries it should not. [[slnc 500]] And a design review held after the system is built is too late to be cheap."

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Write the design as text, next to the code", "Mark trust zones and data classifications", "Encrypt and check every flow, inside a zone too", "Turn review questions into rules; score them", "Still ask what the model cannot show"]
narration = "So, how do you use it? [[slnc 400]] Write the design as text, next to the code. [[slnc 500]] Mark each part's trust zone, and what data each store holds. [[slnc 500]] Encrypt every flow and check its caller, inside a zone too. [[slnc 500]] Turn repeatable review questions into rules that run on every change, and score them on planted weaknesses. [[slnc 300]] And still ask, as a person, what the model cannot show."

[[scene]]
key = "12-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a rule that every", "internet-facing part has a firewall property."]
narration = "That's a security architecture review. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Write the design down, check its boundaries and flows with rules, and keep a person asking about what no model shows. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a rule that every internet facing part has a web application firewall property. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"

