[[act]]
title = "A recorded session, and the server key leaks later"
summary = "The same bank transfer is recorded under static RSA, DHE and ECDHE. The static RSA client sent the secret itself, encrypted to the server key (256 bytes), so the leaked key opens it in 6 steps; DHE (128 bytes) and ECDHE (32 bytes) sent public values only and stay closed, and an unrelated key opens 0 of 3."
detail = """
The input: the request POST /transfer?from=ACC-1001&to=ACC-2002&amount=2500 is sent once under each of three TLS 1.2 suites, through a tap that records both directions. In no recording is the request visible in clear.
What the client sent in its key exchange message: static RSA, 256 bytes, the secret encrypted to the server's key; DHE, 128 bytes, a DH public value; ECDHE, 32 bytes, an EC public value. The secrets of DHE and ECDHE were made from keys thrown away after the handshake.
How the leaked key opens the static RSA session: RSA-decrypt the 256 bytes to the 48-byte pre-master secret; the TLS 1.2 PRF with "master secret" and both randoms gives the 48-byte master secret; with "key expansion" a 40-byte key block; bytes 0 to 15 are the client write key and bytes 32 to 35 the salt; AES-GCM with the salt and 8 bytes from the record opens the request. The result: static RSA opened, DHE and ECDHE not, and a key that is not the server's opens 0 of 3.
"""
figure = "leaked_key"
figure_title = "Which recording a leaked key opens, step by step"
figure_speech = """
Fourth demo: a session is recorded today, and the server's key leaks a year later. [[slnc 400]] Three sessions carry the same bank transfer. [[slnc 600]]
On the left, what each client sent in its key exchange message. [[slnc 300]] With static R S A, the client sent the secret itself, two hundred and fifty six bytes, encrypted to the server's key. [[slnc 300]] With D H E and E C D H E, it sent only a public value. [[slnc 300]] The secret was agreed from keys that were thrown away after the handshake. [[slnc 600]]
On the right, how the leaked key opens the static R S A session. [[slnc 300]] Decrypt the two hundred and fifty six bytes: forty eight bytes of pre-master secret. [[slnc 300]] The T L S pseudo random function turns it into the master secret, then into a key block. [[slnc 300]] Sixteen bytes of it are the client's key, and four bytes are the salt. [[slnc 300]] A E S G C M then opens the record, and the transfer is there in clear. [[slnc 600]]
For D H E and E C D H E, there is nothing for the key to decrypt.
"""
speech = """
The recording: the same transfer, in three sessions. [[slnc 300]] In none of them is the request visible in clear. [[slnc 400]] What the client sent: the encrypted secret for static R S A, and only public values for D H E and E C D H E.
[[page]]
How the leaked key opens the static R S A session, in six steps, with the size of every value. [[slnc 400]] The result: static R S A is opened, and the transfer is read. [[slnc 300]] D H E and E C D H E are not. [[slnc 300]] And a key that is not the server's opens none of the three.
"""
