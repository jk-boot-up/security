[[scene]]
key = "01-poster"
kind = "poster"
title = "TLS Attacks and Downgrades"
narration = "Hello, and welcome. [[slnc 400]] This video explains T L S attacks and downgrades. [[slnc 300]] T L S is transport layer security, the protocol behind the padlock in the browser. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A server that speaks T L S is as strong as the oldest thing it still accepts. [[slnc 300]] A downgrade attack pushes both ends to agree on that oldest thing: an old version, or a weak cipher. [[slnc 300]] T L S one point three removed most of those old choices. [[slnc 600]] Think of a bank branch with a strong new door, that still keeps its old side door unlocked for a few customers. [[slnc 600]] Our example is a bank."

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["A bank's online banking front end must serve", "a few old devices, so the old settings stay on.", "", "Three local servers: a weak one with 6 planted", "weaknesses, a strong one, and a TLS 1.3 only one.", "openssl and testssl.sh probe them."]
narration = "Here is the scenario. [[slnc 400]] A bank's online banking front end must serve a few old devices, so someone keeps the old settings switched on. [[slnc 500]] The demo starts three local servers, on this machine only. [[slnc 300]] A weak one, with six planted weaknesses. [[slnc 300]] A strong one, for T L S one point two and one point three. [[slnc 300]] And one that speaks only T L S one point three. [[slnc 500]] It scans them, pushes a client down to the oldest version, and opens a recorded session with a leaked key."

[[scene]]
key = "02-words"
kind = "bullets"
title = "The Words"
body = ["Protocol version: TLS 1.0, 1.1, 1.2, 1.3", "Cipher suite: key exchange, cipher, MAC", "Static RSA: the secret is sent, encrypted", "Forward secrecy: throw-away keys per session", "Downgrade: both ends pushed to an older choice", "Fallback signal: 'I am retrying with less'"]
narration = """Before the demos, the words. [[slnc 500]] A protocol version is the edition of T L S, from one point zero, which is old, to one point three. [[slnc 500]] A cipher suite names the algorithms of one connection: the key exchange, the cipher, and the check. [[slnc 500]] Static R S A means the client sends the session secret, encrypted to the server's long term key. [[slnc 500]] Forward secrecy means each session uses throw away keys, so a stolen server key cannot open old recordings. [[slnc 500]] A downgrade pushes both ends to an older choice than they could use. [[slnc 500]] And the fallback signal is a flag a client sends when it retries with less."""

[[scene]]
key = "02-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "02-ladder"
kind = "figure"
title = "A downgrade on one connection"
body = "downgrade_ladder"
narration = """Let's see the core idea on one example: one client, and one network. [[slnc 400]] The server could speak T L S one point three. [[slnc 300]] But the network in the middle resets every hello that offers more than T L S one point zero. [[slnc 600]]
The client tries up to T L S one point three. [[slnc 300]] Reset. [[slnc 300]] It assumes the server is old, and tries one point two. [[slnc 300]] Reset again. [[slnc 300]] Then one point one. [[slnc 300]] Reset. [[slnc 600]]
On the fourth try it offers T L S one point zero, the network lets it through, and the server accepts. [[slnc 300]] The connection uses A E S one twenty eight S H A: static R S A, C B C, and S H A one. [[slnc 600]] Nobody broke any encryption. [[slnc 300]] The client was simply too helpful, and the network chose the version."""

[[scene]]
key = "03-acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "04-costs"
kind = "bullets"
title = "What It Costs"
body = ["Turning off old versions locks out old devices", "A scanner shows some flaws only in a table", "Static RSA: one leaked key opens", "  every recorded session", "Ephemeral keys cost one more computation", "The lab depends on the OpenSSL build"]
narration = "Nothing is free. [[slnc 400]] Here is what it costs. [[slnc 500]] Turning off old versions locks out the old devices that needed them. [[slnc 500]] A scanner shows some weaknesses only in its cipher table, so someone has to read it. [[slnc 500]] With static R S A, one leaked server key opens every session ever recorded. [[slnc 500]] Ephemeral keys cost one more computation per connection. [[slnc 300]] And this lab depends on its Open S S L build, which has no R C four and no compression to plant."

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["A scan report: TLS 1.0 offered (deprecated)", "A cipher name such as AES128-SHA", "  (static RSA, CBC, SHA-1)", "An error: inappropriate fallback", "A load balancer policy that allows TLS 1.0"]
narration = "You have probably met this already. [[slnc 400]] A scan report saying T L S one point zero offered, deprecated, is an old version left on. [[slnc 500]] A cipher name such as A E S one twenty eight S H A means static R S A, C B C mode, and S H A one. [[slnc 500]] An inappropriate fallback error is the fallback signal doing its job. [[slnc 500]] And a load balancer policy that still allows T L S one point zero is the weak server, in production."

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "How To Use It"
body = ["TLS 1.2 at minimum; TLS 1.3 where you can", "Only ECDHE or DHE key exchange, with AEAD", "Honour TLS_FALLBACK_SCSV on the server", "Scan every server, and read the cipher table", "Clients: set a minimum, never fall back"]
narration = "So, how do you use it? [[slnc 400]] Accept T L S one point two at the minimum, and one point three where you can. [[slnc 500]] Allow only ephemeral key exchange, E C D H E or D H E, with authenticated encryption such as G C M. [[slnc 500]] Honour the fallback signal on the server. [[slnc 500]] Scan every server, and read the whole cipher table, not only the findings. [[slnc 300]] And on clients, set a minimum version, and never retry with a lower one."

[[scene]]
key = "12-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Plant a certificate signed", "with SHA-1, and see who finds it."]
narration = "That's T L S attacks and downgrades. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] A server is as weak as the oldest thing it accepts, so switch the old things off, keep forward secrecy, and never let a client fall back. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a seventh weakness, a certificate signed with S H A one, and see which tool finds it. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] The servers and the scanner are real programs, and Java drives them, sits in the middle, and reads what they say. [[slnc 300]] Here are the classes that matter."""

[[class]]
name = "Weakness"
what = "the planted truth the tools are scored against"
[[class.part]]
title = "six weaknesses, a label and a short name"
code = """
TLS_1_0("TLS 1.0 accepted", "TLS 1.0"),
...
NULL_CIPHER("NULL cipher (no encryption)", "NULL cipher");
"""
speech = """Each planted weakness is one value of an enum. [[slnc 300]] Because we planted them, we know the right answer, and can count what each tool found and missed."""

[[class]]
name = "Server"
what = "one local openssl s_server on 127.0.0.1"
[[class.part]]
title = "the server is a real openssl process"
code = """
List<String> cmd = new ArrayList<>(lab.openssl().command("s_server",
        "-accept", "127.0.0.1:" + port,
        "-cert", lab.cert().toString(), "-key", lab.key().toString(),
        "-cipher", profile.ciphers,
        "-min_protocol", profile.minProtocol,
        "-serverpref", "-www", "-quiet"));
"""
speech = """A profile gives the suites and the minimum version. [[slnc 300]] The weak profile lists the old suites and T L S one point zero. [[slnc 300]] The server listens on this machine only."""

[[class]]
name = "Tap"
what = "a man in the middle that records, and can break handshakes"
[[class.part]]
title = "reset every hello above a version"
code = """
int version = TlsRecords.clientHelloVersion(first);
if (version > maxHelloVersion) {
    broken = true;
    return;
"""
speech = """The tap reads the first record of each connection. [[slnc 300]] If the hello offers a version above the limit, it closes the connection, the way a faulty middlebox or an attacker would."""

[[class]]
name = "TlsAttacksDemo"
what = "the demo, and a client that retries"
[[class.part]]
title = "retry with less, with or without the signal"
code = """
for (int i = 3; i >= minVersionIndex; i--) {
...
    boolean signal = scsv && !attempts.isEmpty();
    if (signal) {
        flags.add("-fallback_scsv");
"""
speech = """The client starts at T L S one point three and steps down on each failure, never below its minimum. [[slnc 300]] With the signal on, every retry tells the server: I am falling back."""

[[class]]
name = "TlsRecords"
what = "reads the bytes of a recorded connection"
[[class.part]]
title = "the downgrade marker"
code = """
byte[] tail = Arrays.copyOfRange(r, 24, 32);
byte[] marker = {0x44, 0x4F, 0x57, 0x4E, 0x47, 0x52, 0x44};
"""
speech = """The last eight bytes of the server's random value. [[slnc 300]] If the first seven spell DOWNGRD, the server was pushed below T L S one point three."""

[[class]]
name = "Decryptor"
what = "a teaching class: opens a recording with a leaked key"
[[class.part]]
title = "from the encrypted secret to the client's key"
code = """
byte[] premaster = premaster(exchange, key);
...
byte[] master = prf(premaster, "master secret",
        concat(clientRandom, serverRandom), 48);
byte[] block = prf(master, "key expansion",
        concat(serverRandom, clientRandom), 40);
byte[] clientKey = Arrays.copyOfRange(block, 0, 16);
"""
speech = """This redoes the T L S one point two key schedule by hand. [[slnc 300]] The leaked key decrypts the pre-master secret, and the pseudo random function makes the master secret and the key block. [[slnc 300]] A test checks the function against a published test vector."""

[[class]]
name = "TestSsl"
what = "runs testssl.sh and reads its JSON report"
[[class.part]]
title = "a weakness with no finding of its own"
code = """
int rsa = new TreeSet<>(kx(findings, "RSA")).size();
if (rsa > 0) {
    found.put(Weakness.STATIC_RSA,
            "only the Kx column: RSA, " + rsa + " rows");
"""
speech = """Static R S A has no finding of its own in the report. [[slnc 300]] So the code reads the key exchange column of the cipher table, and counts the rows that say R S A."""

[[acronym]]
short = "TLS, TLS1, TLS1_1"
long = "Transport Layer Security; testssl.sh ids for TLS 1.0 and 1.1"
say = "T L S is transport layer security: the protocol that encrypts a connection and proves the server's identity. In test s s l's report, T L S one and T L S one underscore one are the findings for versions one point zero and one point one."
[[acronym]]
short = "SSL"
long = "Secure Sockets Layer: TLS's old name, as in testssl.sh"
say = "S S L is secure sockets layer, the old name of T L S. Test s s l and s client keep the old name."
[[acronym]]
short = "HTTP, HTTPS"
long = "Hypertext Transfer Protocol; HTTP inside TLS"
say = "H T T P is the hypertext transfer protocol of the web, and H T T P S is H T T P inside T L S."
[[acronym]]
short = "RSA"
long = "Rivest-Shamir-Adleman: a public-key algorithm"
say = "R S A, after Rivest, Shamir and Adleman, is a public key algorithm. Used as the key exchange, it gives no forward secrecy."
[[acronym]]
short = "DH, DHE, ECDHE"
long = "Diffie-Hellman; (Elliptic Curve) Diffie-Hellman Ephemeral"
say = "D H is Diffie Hellman key agreement. D H E and E C D H E use fresh, ephemeral keys for every session, which gives forward secrecy."
[[acronym]]
short = "EC"
long = "Elliptic Curve: a kind of public key"
say = "E C means elliptic curve, the family of keys used by E C D H E."
[[acronym]]
short = "AES, AES128"
long = "Advanced Encryption Standard, here with a 128-bit key"
say = "A E S is the advanced encryption standard, the usual block cipher. A E S one twenty eight uses a one hundred twenty eight bit key."
[[acronym]]
short = "GCM, CBC"
long = "Galois/Counter Mode; Cipher Block Chaining"
say = "G C M is Galois counter mode, which encrypts and checks in one step. C B C is cipher block chaining, an older mode with a separate check."
[[acronym]]
short = "AEAD"
long = "Authenticated Encryption with Associated Data"
say = "A E A D is authenticated encryption with associated data, like G C M: it encrypts and detects any change."
[[acronym]]
short = "MAC"
long = "Message Authentication Code: a keyed check value"
say = "M A C is a message authentication code: a check value that only the key holders can make."
[[acronym]]
short = "SHA, SHA-1, SHA256"
long = "Secure Hash Algorithm; SHA-1 is broken"
say = "S H A is the secure hash algorithm. S H A one is the old, broken version."
[[acronym]]
short = "SCSV"
long = "Signaling Cipher Suite Value: TLS_FALLBACK_SCSV"
say = "S C S V is a signaling cipher suite value. T L S fallback S C S V is a fake suite a client adds when it retries with a lower version."
[[acronym]]
short = "PRF"
long = "Pseudo-Random Function: TLS 1.2's key maker"
say = "P R F is the pseudo random function that T L S one point two uses to turn a secret into keys."
[[acronym]]
short = "JDK"
long = "Java Development Kit"
say = "J D K is the Java development kit, here its built in T L S client."
[[acronym]]
short = "JSON"
long = "JavaScript Object Notation: the report format"
say = "J S O N is JavaScript object notation, the format of test s s l's report."
[[acronym]]
short = "ML-KEM, KEM"
long = "Module-Lattice Key Encapsulation Mechanism (post-quantum)"
say = "M L KEM is the module lattice key encapsulation mechanism, a post quantum key exchange. X twenty five five nineteen M L KEM seven sixty eight joins it with elliptic curve key agreement."
[[acronym]]
short = "LUCKY13"
long = "Lucky Thirteen: a timing attack on CBC with a MAC"
say = "Lucky thirteen is a timing attack on C B C suites that check with a M A C. Test s s l names its finding after it."
[[acronym]]
short = "RC4"
long = "Rivest Cipher 4: a broken stream cipher"
say = "R C four is Rivest cipher four, a broken stream cipher."
