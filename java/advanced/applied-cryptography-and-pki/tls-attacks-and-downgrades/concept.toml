# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "tls-attacks-and-downgrades"
level = "advanced"
module = "applied-cryptography-and-pki"
title = "TLS Attacks and Downgrades"
short_title = "TLS Attacks"
package = "tlsattacks"
main_class = "TlsAttacksDemo"
tagline = "Run deliberately weak local TLS servers, scan them with openssl and testssl.sh against the weaknesses that were planted, watch a client fall back to TLS 1.0, read a recorded session with a leaked key, and check what TLS 1.3 removed"
bold = "A weak local server has 6 planted weaknesses (TLS 1.0 and 1.1, static RSA, CBC with SHA-1, a 1024-bit DH group, a NULL cipher); our own openssl probes find 6 of 6 and testssl.sh finds 6 of 6, 4 by a finding that names the problem and 2 only by reading its cipher table, and the strong server raises none. A client that falls back ends on TLS 1.0 with AES128-SHA after 4 attempts, the same client with TLS_FALLBACK_SCSV is refused, and a leaked server key opens the recorded static RSA session (1 of 3) and neither the DHE nor the ECDHE one. A TLS 1.3 only server refuses all 3 older versions, static RSA and CBC."
domain = "a bank"
domain_note = ""
youtube_description = "TLS attacks and downgrades on deliberately weak local servers: openssl and testssl.sh scored against planted weaknesses, the fallback dance and TLS_FALLBACK_SCSV, a recorded session opened with a leaked key, and what TLS 1.3 removed."
thumb_lines = ["TLS ATTACKS", "AND DOWNGRADES"]
thumb_code = "-fallback_scsv"
youtube_title = "TLS Attacks and Downgrades: Weak Servers, testssl.sh, SCSV and What TLS 1.3 Removed"
youtube_tags = ["tls", "tls downgrade", "testssl.sh", "openssl", "forward secrecy", "tls 1.3", "fallback scsv", "static rsa", "cipher suites", "java"]

[readme]
intro = """
A TLS server is as strong as the oldest thing it still accepts. This project starts **three local servers** with `openssl s_server` on 127.0.0.1: a weak one with **6 planted weaknesses**, a strong one for TLS 1.2 and 1.3, and a TLS 1.3 only one. Java probes them with `openssl s_client`, runs **testssl.sh v3.2.4** (cloned into `build/` and pinned to its commit) and reads its JSON, and counts what each found against the weaknesses that were planted. The demo needs OpenSSL 3 or 4, git and network access once; it is tagged `integration`: `./gradlew integrationTest`.

What it shows:
- **Truth and measurement.** Our own probes find **6 of 6** planted weaknesses; testssl.sh finds **6 of 6**, **4** by a finding that names the problem and **2** (static RSA, the 1024-bit group) only by reading the key exchange column of its cipher table. The strong server raises **0**.
- **The downgrade dance.** A network that breaks every handshake above TLS 1.0 pushes a retrying client to **TLS 1.0 with AES128-SHA after 4 attempts**; with `TLS_FALLBACK_SCSV` the server refuses; a client with a minimum of TLS 1.2 stops after 2.
- **Forward secrecy.** A recorded session is opened later with the leaked server key: the static RSA one is (**1 of 3**), the DHE and ECDHE ones are not. The Java code does the TLS 1.2 key derivation and the AES-GCM decryption.
- **What TLS 1.3 removed.** A TLS 1.3 only server refuses **3 of 3** older versions, static RSA and CBC; compression and renegotiation have no place in the protocol.
- **Honest limits.** This OpenSSL build has no RC4 and no zlib, and refuses DH groups below 1024 bits, so those could not be planted.

**Maps to:** OWASP Top 10 A02 Cryptographic Failures · NIST SP 800-52 Rev. 2 · RFC 7507 (fallback SCSV), RFC 8446 (TLS 1.3), RFC 8996 (TLS 1.0 and 1.1 deprecated) · PCI DSS 4.0 requirement 4.2.1 · CWE-326, CWE-327.
"""
analogy = """
A bank branch that still has its old side door. The main door has a good lock, but if a customer who finds it stuck is told to try the old door, and nobody checks who sent him there, the old door is the one that counts. Forward secrecy is the shredder: the key of the night safe may leak next year, and the receipts of last year are already gone.
"""
scenario = """
A bank's online banking front end must serve a few old devices. The demo starts a server that accepts everything it ever did, scans it, makes a client fall back to the oldest version, opens a recording with a leaked key, and checks that TLS 1.3 does not allow any of it.
"""
costs = [
    "**The old settings are kept for a few old clients,** and every one of them is open to all the callers.",
    "**A scanner reports what is offered,** and a person reads the table for what it does not name.",
    "**Forward secrecy needs ephemeral keys,** one more computation per connection.",
    "**TLS 1.3 has no way back,** so the old clients must be updated or kept on a separate endpoint.",
    "**The lab depends on the OpenSSL build:** no RC4, no zlib and no tiny DH groups here.",
]
too_much = """
An internal tool that only talks to servers you control needs no scan of its own. Use this when a service is reachable by clients you do not control, or when you must show that old settings are really off.
"""
met_before = [
    "A load balancer that still lists TLS 1.0 for one partner.",
    "A scan report with a green grade and a static RSA suite in the middle of it.",
    "A client library that retries with a lower version on any error.",
    "A configuration with a 1024-bit DH file nobody has opened since 2015.",
]
where = """
This is a project of the [applied-cryptography-and-pki](..) module, with [post-quantum-cryptography](../post-quantum-cryptography). The earlier [mutual-tls-between-services](../../service-identity-and-zero-trust/mutual-tls-between-services) project builds the strong side of TLS; this one attacks the weak side.
"""
twin = """
OpenSSL and testssl.sh are real; the servers are local, on 127.0.0.1, with a throw-away key and certificate in a temporary folder. The demo never prints ports, keys or serials, and it never scans anything that is not its own.
"""
test_note = "The record parser, the key derivation, the middlebox and the report parsing are tested with no tools. The demo runs OpenSSL and testssl.sh (./gradlew integrationTest)."

[[act]]
title = "The weak server"
summary = "A local server has 6 planted weaknesses; a strong and a TLS 1.3 only server are the controls."
detail = """
The weak server accepts TLS 1.0 and 1.1, static RSA, CBC with SHA-1, a 1024-bit finite-field DH group and a NULL cipher. openssl s_client probes show what each of the three servers accepts: 4 protocol versions and 8 cipher suites, as yes and no.
"""
speech = """
First demo: the weak server. [[slnc 400]] Six planted weaknesses. [[slnc 600]] Two other servers are the controls.
"""
rows = { weak = "active ok" }
console = [
    ["planted weaknesses: 6", "bad"],
    ["DH group: 1024 bits", "bad"],
    ["strong server: none", "ok"],
]

[[act]]
title = "Probes and testssl.sh"
summary = "Our probes and testssl.sh each find 6 of 6; testssl.sh names 4 and shows 2 only in its cipher table."
detail = """
Java reads the testssl.sh JSON and counts it against the planted list. TLS 1.0, TLS 1.1, the NULL cipher and the CBC suites have a finding of their own. Static RSA and the 1024-bit group have none: they show only in the key exchange column of the cipher table. The strong server raises nothing.
"""
speech = """
Second demo: probes and testssl.sh. [[slnc 400]] Both find six of six. [[slnc 600]] Two of them only in the cipher table.
"""
rows = { scan = "active ok" }
console = [
    ["own probes: 6 of 6", "ok"],
    ["testssl.sh: 6 of 6, 4 named", "ok"],
    ["strong server: 0", "ok"],
]

[[act]]
title = "The downgrade dance"
summary = "A client that retries ends on TLS 1.0 with AES128-SHA; the fallback signal and a minimum version stop it."
detail = """
A middlebox breaks every handshake above TLS 1.0. The retrying client needs 4 attempts and ends on TLS 1.0 with a static RSA CBC suite. With TLS_FALLBACK_SCSV the server answers inappropriate fallback. A client with a minimum of TLS 1.2 stops after 2 attempts. The JDK client never retries. A TLS 1.3 server that is pushed down marks its ServerHello with DOWNGRD.
"""
speech = """
Third demo: the downgrade dance. [[slnc 400]] A failing network and a retrying client end on TLS one point zero. [[slnc 600]] The fallback signal stops it.
"""
rows = { downgrade = "active wrong" }
console = [
    ["falls back: TLSv1, AES128-SHA, 4 attempts", "bad"],
    ["with SCSV: inappropriate fallback", "ok"],
    ["minimum TLS 1.2: 2 attempts, no", "ok"],
]

[[act]]
title = "The leaked key"
summary = "A recording is opened with the leaked server key for static RSA and not for DHE or ECDHE."
detail = """
The demo records three sessions through a tap. Java derives the TLS 1.2 keys from the RSA-decrypted pre-master secret and decrypts the AES-GCM record: the request is read for the static RSA session. For DHE and ECDHE the secret was agreed from keys that were thrown away, and the leaked key opens nothing. A key that is not the server's opens none.
"""
speech = """
Fourth demo: the leaked key. [[slnc 400]] Static RSA is opened a year later. [[slnc 600]] The ephemeral exchanges are not.
"""
rows = { leak = "active wrong" }
console = [
    ["static RSA: opened, amount=2500", "bad"],
    ["DHE: not opened", "ok"],
    ["ECDHE: not opened", "ok"],
]

[[act]]
title = "What TLS 1.3 removed"
summary = "A TLS 1.3 only server refuses all 3 older versions, static RSA and CBC; compression and renegotiation have no place."
detail = """
The TLS 1.3 only server answers protocol version to TLS 1.0, 1.1 and 1.2, and refuses a static RSA and a CBC suite. None of the 3 TLS 1.3 suites has a fixed key exchange or lacks AEAD. A TLS 1.3 hello offers only the null compression method, the client library refuses to renegotiate, and the 1024-bit group in the server's file is not used. RC4 and zlib are not in this OpenSSL build.
"""
speech = """
Fifth demo: what TLS one point three removed. [[slnc 400]] Old versions, static RSA, CBC. [[slnc 600]] Refused, three of three.
"""
rows = { tls13 = "active ok" }
console = [
    ["older versions refused: 3 of 3", "ok"],
    ["static RSA and CBC refused", "ok"],
    ["1024-bit group used: no", "ok"],
]

