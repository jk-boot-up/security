[[act]]
title = "The downgrade dance"
summary = "A network that resets every hello above TLS 1.0 pushes a retrying client down in 4 attempts to TLS 1.0 with AES128-SHA. With TLS_FALLBACK_SCSV on its retries the server refuses (inappropriate fallback); a client with a minimum of TLS 1.2 stops after 2 attempts; the JDK client does not retry. A TLS 1.3 server pushed to TLS 1.2 writes DOWNGRD into its ServerHello random."
detail = """
First, the server's own marker: asked for TLS 1.2, a server that can speak TLS 1.3 ends its ServerHello random with the bytes 44 4F 57 4E 47 52 44 01, "DOWNGRD" and 01, which means a downgrade to TLS 1.2. Asked for TLS 1.3, there is no marker.
The input of the dance is a network that resets every ClientHello offering more than TLS 1.0. A client that falls back with no signal tries up to TLS 1.3, TLS 1.2, TLS 1.1 and TLS 1.0, and connects on the fourth attempt with AES128-SHA.
The same client sending TLS_FALLBACK_SCSV on every retry is refused on the fourth attempt: the server can do better than TLS 1.0, so it answers inappropriate fallback. A client with a minimum of TLS 1.2 stops after 2 attempts and never offers TLS 1.0. The JDK client, with TLSv1.3 and TLSv1.2 enabled, fails and does not retry.
"""
figure = "three_clients"
figure_title = "Three clients through the same broken network"
figure_speech = """
Third demo: the downgrade dance. [[slnc 400]] At the top, the server's own alarm. [[slnc 300]] A server that can speak T L S one point three, but is asked for one point two, writes eight special bytes at the end of its random value. [[slnc 300]] They spell DOWNGRD, then one. [[slnc 300]] A modern client that sees them knows it was pushed down. [[slnc 600]]
Below, three clients go through the same network, which resets every hello above T L S one point zero. [[slnc 600]]
On the left, a client with no signal. [[slnc 300]] It is reset three times, and on the fourth try it connects with T L S one point zero. [[slnc 600]]
In the middle, the same client, but every retry carries the fallback signal, S C S V. [[slnc 300]] The server sees that it could do better, and refuses. [[slnc 600]]
On the right, a client with a minimum of T L S one point two. [[slnc 300]] It gives up after two tries, and never offers the old version.
"""
speech = """
The server hello random. [[slnc 300]] Asked for T L S one point two, the last eight bytes spell DOWNGRD and one. [[slnc 300]] Asked for one point three, there is no marker. [[slnc 400]] The network resets every hello above T L S one point zero. [[slnc 300]] The client with no signal ends on T L S one point zero with A E S one twenty eight S H A, after four attempts.
[[page]]
With the fallback signal, the fourth attempt is refused: inappropriate fallback. [[slnc 400]] With a minimum of T L S one point two, the client stops after two attempts. [[slnc 400]] And the J D K client fails, and does not retry with an older version.
"""
rows = { downgrade = "active wrong" }
console = [
    ["THE SERVER HELLO RANDOM (a server that can speak TLS 1.3):", "code"],
    ["  asked for TLS 1.2  last 8 bytes 44 4F 57 4E 47 52 44 01", "muted"],
    ["                     \"DOWNGRD\" + 01: a downgrade to TLS 1.2", "ok"],
    ["  asked for TLS 1.3  no DOWNGRD marker in the last 8 bytes", "muted"],
    ["THE NETWORK (a broken or hostile middlebox):", "code"],
    ["  resets every hello that offers more than TLS 1.0", "muted"],
    ["A CLIENT THAT FALLS BACK WITH NO SIGNAL:", "code"],
    ["  attempt 1  up to TLS 1.3   reset by the network", "amber"],
    ["  attempt 2  TLS 1.2         reset by the network", "amber"],
    ["  attempt 3  TLS 1.1         reset by the network", "amber"],
    ["  attempt 4  TLS 1.0         connected, AES128-SHA", "bad"],
    ["  result     connected yes, on TLSv1 with AES128-SHA", "bad"],
    ["---", ""],
    ["THE SAME CLIENT, SENDING TLS_FALLBACK_SCSV ON EVERY RETRY:", "code"],
    ["  attempt 1  up to TLS 1.3   reset by the network", "amber"],
    ["  attempt 2  TLS 1.2 + SCSV  reset by the network", "amber"],
    ["  attempt 3  TLS 1.1 + SCSV  reset by the network", "amber"],
