[[act]]
title = "What TLS 1.3 removed"
summary = "A TLS 1.3 only server whose file still lists old suites and a 1024-bit DH group refuses TLS 1.0, 1.1 and 1.2 (3 of 3, protocol version), static RSA and CBC; its hello offers only the null compression method, renegotiation is forbidden, and the key exchange used the named group X25519MLKEM768, not the 1024-bit group. All 3 TLS 1.3 suites are AEAD with no fixed key exchange."
detail = """
The input is a server with a minimum of TLS 1.3 whose configuration still lists DHE-RSA-AES128-SHA and AES128-GCM-SHA256 and a 1024-bit DH group.
What a client asked for, and the answer: TLS 1.0, 1.1 and 1.2 refused 3 of 3 with the alert protocol version; static RSA (AES128-GCM-SHA256) and CBC with a MAC (AES128-SHA) do not connect; a TLS 1.3 hello started with -comp offers only method 0, no compression; the client library refuses to renegotiate, because TLS 1.3 forbids it; the 1024-bit DH group is not used, the named group X25519MLKEM768 is.
The TLS 1.3 suites, from openssl ciphers -v -tls1_3: TLS_AES_256_GCM_SHA384, TLS_CHACHA20_POLY1305_SHA256 and TLS_AES_128_GCM_SHA256, all Kx=any, Au=any, Mac=AEAD: 0 of 3 with a fixed key exchange, 0 of 3 not AEAD. For comparison, the weak server on TLS 1.2: no compression (this build has no zlib), renegotiation refused with a no_renegotiation alert, and no RC4 in this build.
"""
figure = "tls13_removed"
figure_title = "What a client asked the TLS 1.3 only server, and the answer"
figure_speech = """
Fifth demo: what T L S one point three removed. [[slnc 400]] This server's configuration still lists the old suites and the ten twenty four bit group. [[slnc 300]] But its minimum is T L S one point three. [[slnc 600]]
On the left, what a client asked for. [[slnc 300]] On the right, the answer. [[slnc 300]] T L S one point zero, one point one and one point two: refused, three of three. [[slnc 300]] Static R S A and C B C: no connection. [[slnc 300]] Compression: the hello offers only method zero, which means none. [[slnc 300]] Renegotiation: forbidden. [[slnc 300]] And the old D H group is ignored. [[slnc 300]] The key exchange used a named group, a hybrid of X twenty five five nineteen and M L KEM. [[slnc 600]]
At the bottom, the only three suites T L S one point three has. [[slnc 300]] Every one is authenticated encryption, and none fixes the key exchange.
"""
