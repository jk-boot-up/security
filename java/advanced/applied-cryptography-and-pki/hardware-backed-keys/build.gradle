plugins {
    id 'java'
    id 'application'
}

group = 'com.jk.explore.security'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.jk.explore.security.hsmkeys.HardwareBackedKeysDemo'
    // the demo calls the PKCS#11 library and sets an environment variable through the foreign function API
    applicationDefaultJvmArgs = ['--enable-native-access=ALL-UNNAMED']
}

// The demo starts SoftHSM tokens, keytool and child JVMs; it is tagged integration. The other tests need no tool.
test {
    useJUnitPlatform {
        excludeTags 'integration'
    }
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

tasks.register('integrationTest', Test) {
    description = 'Runs the tests that need SoftHSM2 installed (brew install softhsm).'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'integration'
    }
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    shouldRunAfter test
}

// No deprecated or to-be-removed API is allowed in any project: a warning fails the build.
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.addAll(['-Xlint:deprecation', '-Xlint:removal', '-Werror'])
}
