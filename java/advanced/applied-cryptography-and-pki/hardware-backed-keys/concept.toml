[[scene]]
key = "01-poster"
kind = "poster"
title = "Hardware-Backed Keys"
narration = "Hello, and welcome. [[slnc 400]] This video explains hardware backed keys, with P K C S 11. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A hardware backed key is made inside a token, such as a hardware security module, and never leaves it. [[slnc 300]] The application asks the token to sign, and the token answers with a signature, never with the key. [[slnc 300]] So the key cannot be copied with the file it lives in. [[slnc 600]] Think of a notary who stamps your documents, but never lends you the stamp. [[slnc 300]] Someone who fools the notary still gets stamps. [[slnc 600]] Our example is a bank."

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["A bank signs its payment files with one key.", "", "The demo creates that key on a SoftHSM2 token,", "signs from Java, tries to get the key out 5 ways,", "compares a key in a file, then acts as an", "attacker already on the host."]
narration = "Here is the scenario. [[slnc 400]] A bank signs its payment files with one key. [[slnc 500]] The demo creates that key on a SoftHSM 2 token, a software stand in for a hardware security module, and signs from Java. [[slnc 500]] It tries five ways to get the key out, compares the same key kept in a file, and then acts as an attacker who is already on the host."

[[scene]]
key = "02-words"
kind = "bullets"
title = "The Words"
body = ["Token: a device that keeps keys and uses them", "HSM: a hardware token for servers", "Session and login: a PIN opens the token", "Sensitive, extractable: may the key be read or leave?", "Wrap: encrypt one key under another to move it", "Audit log: a record of what was signed"]
narration = """Before the demos, the words. [[slnc 500]] A token is a device that keeps keys, and uses them for you. [[slnc 500]] A hardware security module is a token built for servers, made to resist being opened. [[slnc 500]] A session is a connection to the token, and a login with the PIN opens its private keys. [[slnc 500]] Sensitive means the key's value cannot be read; extractable means it may leave the token at all. [[slnc 500]] To wrap a key is to encrypt it under another key, so it can be moved or backed up. [[slnc 500]] And the audit log is the bank's record of what was signed."""

[[scene]]
key = "02-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "02-file-in"
kind = "figure"
title = "A file goes in, a signature comes out"
body = "file_in_signature_out"
narration = """Let's see the core idea on one real payment file. [[slnc 400]] On the left, the input: a payment file of a hundred and forty bytes. [[slnc 300]] Its name, four payments from one account to another, and the total. [[slnc 600]] In the middle, the token. [[slnc 300]] The private key, R S A two thousand and forty eight, lives inside it and never leaves. [[slnc 300]] Java sends the file in, and asks for S H A two fifty six with R S A. [[slnc 600]] On the right, the result: a signature of two hundred and fifty six bytes. [[slnc 300]] That is two thousand and forty eight bits, divided by eight. [[slnc 300]] Five of five such files verify with the public key. [[slnc 300]] Change one bit of a file, and none verify. [[slnc 500]] The key did its work without ever coming out."""

[[scene]]
key = "03-acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "04-costs"
kind = "bullets"
title = "What It Costs"
body = ["Code on the host can still sign anything", "SoftHSM2 never locks after wrong PINs", "A software token is a directory of files", "Backups need a key made extractable on purpose", "A real HSM costs money and a ceremony"]
narration = "Nothing is free. [[slnc 400]] Here is what it costs. [[slnc 500]] Code that gets into the application's process can still ask the token to sign anything: in the demo, five hundred forged files. [[slnc 500]] SoftHSM 2 never locks after wrong PINs, so the application must. [[slnc 500]] A software token is only a directory of files, and a copy of it is a clone. [[slnc 500]] Backups need a key made extractable on purpose. [[slnc 300]] And a real hardware module costs money, and a key ceremony."

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["A .p12 or .jks file on a server, with its", "  password in a config file", "A setting such as pkcs11.library or a PIN", "  in an environment variable", "CKA_SENSITIVE and CKA_EXTRACTABLE attributes"]
narration = "You have probably met this already. [[slnc 400]] A key file in P K C S twelve or J K S format, on a server, with its password in a config file, is a key that can be copied. [[slnc 500]] A setting naming a P K C S 11 library, and a PIN in an environment variable, is a token in use. [[slnc 500]] And attributes named sensitive, and extractable, are what decide whether the key can ever leave."

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Generate the key on the token, not extractable", "Lock out after wrong PINs", "Keep your own limits: rate, approvers, audit", "Plan backups on purpose", "Protect the host; the token does not"]
narration = "So, how do you use it? [[slnc 400]] Generate the key on the token, sensitive, and not extractable. [[slnc 500]] Lock out after wrong PINs, in the token if it can, and in the application if not. [[slnc 500]] Keep your own limits in front of the key: a rate, two approvers for large payments, and a log that cannot be edited. [[slnc 500]] Plan backups on purpose. [[slnc 300]] And protect the host, because the token signs whatever a logged in process asks."

[[scene]]
key = "12-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Log out between batches, and", "measure how many forged signatures still fit."]
narration = "That's hardware backed keys. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] A token stops the key being copied, not being used, so keep limits, approvals, and an audit log in front of it. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Log out between batches, and measure how many forged signatures still fit in the window. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] Java talks to the token in two ways: the J D K's provider, and raw P K C S eleven calls. [[slnc 300]] Here are the classes that matter."""

[[class]]
name = "Raw"
what = "PKCS#11 calls the JDK does not offer"
[[class.part]]
title = "the template of the key ceremony"
code = """
List<Attr> privT = List.of(Attr.bool(CKA_TOKEN, true), Attr.bool(CKA_PRIVATE, true),
        Attr.bool(CKA_SENSITIVE, true), Attr.bool(CKA_EXTRACTABLE, false),
        Attr.bool(CKA_SIGN, true), new Attr(CKA_ID, id), Attr.text(CKA_LABEL, label));
"""
speech = """The private half is asked for with a template. [[slnc 300]] Sensitive true, extractable false, and allowed to sign. [[slnc 300]] The token itself enforces these from then on."""
[[class.part]]
title = "C_WrapKey: encrypt a key, or refuse"
code = """
long rv = call(WRAP, session, m, wrapKey, key, MemorySegment.NULL, len);
if (rv != 0) {
    return new Answer(rv, new byte[0]);
"""
speech = """Wrapping is one call to the token. [[slnc 300]] For the payment key it returns key unextractable. [[slnc 300]] The code only reports the token's answer: the refusal is in the token, not in Java."""

[[class]]
name = "TokenAccess"
what = "logs in and signs through Java's PKCS11 provider"
[[class.part]]
title = "login is loading the KeyStore with the PIN"
code = """
KeyStore ks = KeyStore.getInstance("PKCS11", provider);
ks.load(null, pin == null ? null : pin.toCharArray());
...
Signature s = Signature.getInstance("SHA256withRSA", provider);
s.initSign(key);
"""
speech = """Logging in is loading the P K C S eleven KeyStore with the PIN. [[slnc 300]] Signing is the usual Signature class, but with the token's provider. [[slnc 300]] The private key object is only a handle: its bytes stay in the token."""

[[class]]
name = "PinGuard"
what = "the bank's own lockout, because SoftHSM2 has none"
[[class.part]]
title = "stop asking after three failures"
code = """
if (failures >= max) {
    return Outcome.LOCKED;
...
failures++;
return Outcome.REFUSED;
"""
speech = """After three wrong PINs the guard stops asking the token, and answers locked. [[slnc 300]] It lives in the application, so code that calls the provider directly goes around it."""

[[class]]
name = "SigningService"
what = "the bank's rules in front of the key"
[[class.part]]
title = "approvers first, then the rate"
code = """
long others = r.approvers().stream().filter(a -> !a.equals(r.requester())).distinct().count();
if (r.totalCents() >= dualControlCents && others < 2) {
    audit.append("refused-approvers", r.file(), r.content());
...
if (recent.size() >= maxPerWindow) {
"""
speech = """A large file needs two approvers who are not the requester. [[slnc 300]] Then at most eight signatures in the window. [[slnc 300]] Every decision goes into the audit log."""

[[class]]
name = "AuditLog"
what = "a hash-chained record of what was signed"
[[class.part]]
title = "each hash includes the one before"
code = """
String line = seq + "|" + event + "|" + file + "|" + contentHash + "|" + previous;
return sha256(line.getBytes(StandardCharsets.UTF_8));
...
String previous = entries.isEmpty() ? "genesis" : entries.getLast().hash();
"""
speech = """An entry's hash is S H A two fifty six of its fields, joined by bars, with the previous hash last. [[slnc 300]] The first entry's previous is the word genesis. [[slnc 300]] A test redoes the first entry of the demo by hand."""

[[class]]
name = "Malware"
what = "code inside the application's process"
[[class.part]]
title = "no PIN: use the login that is already there"
code = """
TokenAccess.Login login = TokenAccess.login(p, null);
...
if (k instanceof PrivateKey pk) {
    return TokenAccess.sign(p, pk, data);
"""
speech = """Inside the process, the attacker loads the KeyStore with no PIN at all. [[slnc 300]] The provider is already logged in, so it finds the key and signs. [[slnc 300]] That is the five hundred of five hundred."""

