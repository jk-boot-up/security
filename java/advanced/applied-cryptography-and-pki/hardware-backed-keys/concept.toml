[[act]]
title = "A key that can be backed up, and the limits"
summary = "A release-signing key made extractable on purpose is wrapped into an 80-byte blob (67 key bytes, padded to 72, + 8), destroyed and restored; but a logged-in attacker wraps it under a key of their own and forges a signature. The token protected 0 of 5 ways out for the non-extractable key, 1 of 1 worked for the extractable key and for the key in a file."
detail = """
The input is a release-signing key, EC P-256, made on the token with CKA_EXTRACTABLE true, and a sensitive AES token key to wrap it with AES key wrap with padding.
The backup cycle: wrap gives CKR_OK and a blob of 80 bytes; after the key is destroyed, signing gives CKR_OBJECT_HANDLE_INVALID; unwrapping the blob gives CKR_OK, and the restored key signs and verifies with the original public key.
An attacker with a logged-in session wraps the same kind of key under an AES key they can read (CKR_OK) and opens it in Java: 67 key bytes, padded to 72, + 8 = 80, which is the blob size. A forged release signature verifies. When the wrapping key is lost with the token, the blob restores nothing (CKR_UNWRAPPING_KEY_HANDLE_INVALID).
What the token protects: ways to copy a key out that worked were 0 of 5 for the non-extractable key, 1 of 1 for the extractable one and 1 of 1 for the key in a file. What it does not: use while logged in, by anyone in the process, and the rate, approvers and audit kept in the application.
"""
figure = "backup_wrap"
figure_title = "A key wrapped for backup, and who else can unwrap it"
figure_speech = """
Sixth demo: a key that can be backed up. [[slnc 400]] A release signing key, an elliptic curve key, is made extractable on purpose, so it can be backed up. [[slnc 700]]
Top left, the backup cycle. [[slnc 300]] The token wraps it under its own A E S key: a blob of eighty bytes. [[slnc 300]] The key is destroyed, and signing fails. [[slnc 300]] The blob is unwrapped, and the key signs again. [[slnc 700]]
Top right, why eighty bytes. [[slnc 300]] The key is sixty seven bytes. [[slnc 300]] Key wrap pads that to seventy two, a multiple of eight, and adds eight more: eighty. [[slnc 700]]
But anyone with a logged in session can wrap it under a key they can read, open it in Java, and forge a signature. [[slnc 300]] And if the wrapping key is lost with the token, the blob is useless. [[slnc 300]] A key that can leave for a backup can leave for an attacker.
"""
speech = """
Here is the real output. [[slnc 400]] The release key, extractable on purpose. [[slnc 300]] The backup cycle: wrap, destroy, unwrap, sign, verify. [[slnc 300]] The attacker's wrap, and the blob size worked out: sixty seven, padded to seventy two, plus eight, is eighty. [[slnc 300]] A lost wrapping key restores nothing.
[[page]]
What the token protects: no way out worked for the non-extractable key. [[slnc 300]] One of one worked for the extractable key, and for the key in a file. [[slnc 300]] What it does not protect: use by anyone in the logged in process, and the bank's own rules. [[slnc 300]] At the end, the scratch directory is removed.
"""
rows = { backup = "active wrong" }
console = [
    ["THE RELEASE-SIGNING KEY, EXTRACTABLE ON PURPOSE:", "code"],
    ["  key      EC P-256, made on the token, CKA_EXTRACTABLE true", "muted"],
    ["  wrapped  under a sensitive AES token key (key wrap, padded)", "muted"],
    ["THE BACKUP CYCLE:", "code"],
    ["  wrap                CKR_OK, a blob of 80 bytes", "muted"],
