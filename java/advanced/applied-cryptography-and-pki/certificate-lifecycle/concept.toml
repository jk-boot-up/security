[[act]]
title = "Revocation and a dead responder"
summary = "A hard-fail client refuses when it cannot learn the status, a soft-fail one accepts. With the openssl ocsp responder up, the good certificate is accepted and the revoked one refused by both; with it down or hanging, the hard-fail client refuses even the good one and the soft-fail client accepts the revoked one, 2 of 2 times; each hanging check waited about 1 second. A client holding an old CRL accepts a certificate revoked after it; the next CRL refuses it. A CRL is 20 KB at 1,000 entries and 2120 KB at 100,000: an entry is 2 + (2 + 2 serial) + (2 + 13 date) = 21 bytes, 22 once a serial needs 3 bytes. Dropping 90,000 expired entries, as RFC 5280 allows, gives 205 KB."
detail = """
The input: two policies for a client that cannot learn the status. Hard fail refuses the certificate; soft fail accepts it anyway.
OCSP, the responder up: the good certificate is accepted and the revoked one refused, by both clients; the responder saw 2 requests for the 2 good checks. Down or hanging: the hard-fail client refuses even the good certificate (status unknown) and the soft-fail client accepts the revoked one, 2 of 2 times. A hanging check waited about 1 second, the demo's timeout, against 15 by default.
A CRL: a signed list good for 3600 seconds in this lab, with 1 entry. api.bank.example is revoked after it; a client with that CRL accepts it, a client with the next CRL (2 entries) refuses it. Two hours later the next update has passed: hard fail refuses, soft fail accepts.
How big a CRL gets: 20 KB at 1,000 entries, 205 KB at 10,000 and 2120 KB at 100,000, which takes 17.4 seconds at 1 Mbit/s. One entry, read from the CRL: 2 bytes of header, 2 + 2 for the serial 1000 and 2 + 13 for the date, 21 bytes; the serial 1969F needs 3 bytes, so 22. With 90,000 of 100,000 entries already expired, openssl ca -updatedb keeps them (2120 KB); dropping them, as RFC 5280 allows, leaves 205 KB.
"""
figure = "revocation_grid"
figure_title = "Who decides when the answer is missing"
figure_speech = """
Second demo: revocation. [[slnc 400]] On the left, the input: two certificates, one good and one revoked, and a responder that is up, down, or hanging. [[slnc 300]] Each is checked by a hard fail client, and a soft fail client. [[slnc 700]]
With the responder up, both clients get it right. [[slnc 300]] When the responder is down, or hangs, the hard fail client refuses even the good certificate. [[slnc 300]] That is an outage. [[slnc 300]] And the soft fail client accepts the revoked one. [[slnc 300]] That is a bypass, for anyone who can block the answer. [[slnc 700]]
On the right, a revocation list, measured. [[slnc 300]] Each entry is twenty one bytes: a two byte header, the serial number, and the date. [[slnc 300]] So a hundred thousand entries make about two megabytes, seventeen seconds on a slow phone. [[slnc 300]] Dropping the expired entries keeps the list small.
"""
speech = """
Here is the real output. [[slnc 400]] The two policies, hard fail and soft fail. [[slnc 300]] Then the O C S P table. [[slnc 300]] With the responder up, both clients are right. [[slnc 300]] Down or hanging, the hard fail client refuses everything, and the soft fail client accepts the revoked certificate.
[[page]]
The responder saw two requests for the two good checks, and a hanging check waited about a second. [[slnc 400]] Then the revocation list. [[slnc 300]] A client with the old list still accepts a certificate revoked after it. [[slnc 300]] The next list refuses it. [[slnc 300]] And a list past its next update is refused by a hard fail client.
[[page]]
How big a list gets: twenty kilobytes at a thousand entries, over two megabytes at a hundred thousand. [[slnc 400]] One entry, worked out: twenty one bytes, and twenty two once the serial number needs a third byte. [[slnc 400]] Dropping the ninety thousand expired entries takes the list from two megabytes to two hundred and five kilobytes.
"""
rows = { revoke = "active wrong" }
console = [
