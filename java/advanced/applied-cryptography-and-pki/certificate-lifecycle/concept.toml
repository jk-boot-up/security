[[act]]
title = "Stapling"
summary = "The server sends a signed, dated OCSP answer, under 512 bytes, inside the TLS handshake (openssl s_server -status_file). With the responder up, the stapling server is accepted with 1 response in the handshake and 0 requests to the responder; the server that does not staple costs 1 request, and the responder learns the site. With the responder down, the hard-fail client refuses the server that does not staple and accepts the one that staples; two days later the staple is out of date and refused. After a revocation the old staple is still accepted, with 0 requests; a client asking the responder, or a staple made after the revocation, refuses."
detail = """
The input: a staple is the OCSP answer, signed and dated, carried in the TLS handshake; it is under 512 bytes.
The responder up, a hard-fail client: the server that staples is accepted with 1 response in the handshake and 0 requests to the responder; the server that does not staple is accepted with 0 in the handshake and 1 request, so the responder sees which site the client visits.
The responder down: the server that does not staple is refused by the hard-fail client (status unknown) and accepted by the soft-fail one; the server that staples is accepted, because the answer came with it. Read 2 days later, past its next update, the staple is refused as out of date.
The certificate revoked: the old staple is still accepted, with 0 requests to the responder; a client that asks the responder refuses, and so does a staple made after the revocation. A staple is as old as its last refresh, 1 day in this lab.
"""
figure = "stapling"
figure_title = "The answer, carried by the server"
figure_speech = """
Third demo: stapling. [[slnc 400]] At the top, the input: two servers with the same certificate. [[slnc 300]] One staples: it fetches the O C S P answer itself, and sends it inside the T L S handshake. [[slnc 300]] The other does not. [[slnc 700]]
With the responder up, both are accepted. [[slnc 300]] But the server that does not staple makes the client ask the responder, one request, and the responder learns which site the client visits. [[slnc 300]] The stapling server costs no request at all. [[slnc 700]]
With the responder down, the stapling server is still accepted, and the other one is refused by a hard fail client. [[slnc 500]] At the bottom, the catch. [[slnc 300]] After a revocation, the old staple is still accepted, until the server refreshes it. [[slnc 300]] A staple is as old as its last refresh.
"""
speech = """
Here is the real output. [[slnc 400]] The staple: a signed, dated answer, under five hundred and twelve bytes. [[slnc 300]] With the responder up: the stapling server, one response in the handshake, no request. [[slnc 300]] The other server, one request to the responder. [[slnc 400]] With the responder down: the stapling server is still accepted, the other is refused by a hard fail client, and a staple read two days later is out of date.
[[page]]
After a revocation: the old staple is still accepted, with no request. [[slnc 300]] A client that asks the responder refuses, and so does a fresh staple.
"""
