[[scene]]
key = "01-poster"
kind = "poster"
title = "Certificate Lifecycle"
narration = "Hello, and welcome. [[slnc 400]] This video explains the certificate lifecycle. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A certificate has a life. [[slnc 300]] It is issued, trusted, sometimes revoked, renewed, and, if nobody looks, it expires in the middle of a working day. [[slnc 300]] Each step can fail in its own way. [[slnc 600]] Think of a bank card: issued, blocked when stolen, replaced before it expires, and refused at every till the day after it does. [[slnc 600]] Our example is a bank."

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["A bank's private PKI: a root and an intermediate", "made with openssl, issuing server certificates.", "", "The demo revokes them with a CRL, an OCSP", "responder and stapling, renews short-lived ones", "with step-ca, and misses a renewal."]
narration = "Here is the scenario. [[slnc 400]] A bank runs a private certificate authority: a root, and an intermediate, made with openssl. [[slnc 500]] The intermediate issues server certificates. [[slnc 300]] The demo revokes them with a revocation list, an O C S P responder, and stapling. [[slnc 500]] It replaces them with short lived certificates that step C A renews. [[slnc 300]] And it lets one renewal be missed."

[[scene]]
key = "02-words"
kind = "bullets"
title = "The Words"
body = ["Certificate: a public key and names, signed by a CA", "Chain: leaf, intermediate, root; each signs the next", "Revoked: withdrawn before its end date", "CRL: a signed list of revoked serial numbers", "OCSP: ask a responder about one certificate", "Staple: the server sends that answer itself"]
narration = """Before the demos, the words. [[slnc 500]] A certificate binds a public key to names, and is signed by a certificate authority. [[slnc 500]] A chain runs from the server's certificate, the leaf, through an intermediate, to a root the client already trusts. [[slnc 500]] A revoked certificate is withdrawn before its end date, for example when its key is stolen. [[slnc 500]] The C R L is a signed list of revoked serial numbers, that clients download. [[slnc 500]] O C S P asks a responder about one certificate at a time. [[slnc 500]] And a staple is that answer, sent by the server itself, inside the handshake."""

[[scene]]
key = "02-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "02-core"
kind = "figure"
title = "The life of one certificate"
body = "lifecycle"
narration = """Let's see the core idea on one example: a certificate from step C A that lives twelve seconds. [[slnc 400]] At the top, the input: issued at zero, ending at twelve. [[slnc 700]]
Three moments matter. [[slnc 300]] At eight seconds, two thirds of its life, the renewal is due. [[slnc 300]] If the C A answers, a new certificate takes over, and the old one is simply never used again. [[slnc 300]] If not, there are four seconds of headroom to try again. [[slnc 500]] At nine seconds, with a quarter of the life left, the expiry monitor alerts. [[slnc 500]] At twelve, the certificate ends, and every handshake is refused. [[slnc 700]]
At the bottom, the results. [[slnc 300]] Renewed in time: three hundred handshakes, none failed. [[slnc 300]] Renewal missed: one hundred of one hundred refused. [[slnc 300]] A short life makes revocation almost unnecessary, and makes renewal the thing that must never fail."""

[[scene]]
key = "03-acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "04-costs"
kind = "bullets"
title = "What It Costs"
body = ["Hard fail: a dead responder is an outage", "Soft fail: a blocked answer is a bypass", "CRLs grow: 2120 KB at 100,000 entries", "A stale staple hides a revocation", "Short lives need a renewal that never stops"]
narration = "Nothing is free. [[slnc 400]] Here is what it costs. [[slnc 500]] With hard fail, a dead O C S P responder is an outage. [[slnc 300]] With soft fail, an attacker who blocks the answer gets a revoked certificate accepted. [[slnc 500]] Revocation lists grow: about two megabytes at a hundred thousand entries. [[slnc 500]] A stale staple hides a revocation for as long as it lives. [[slnc 500]] And short lived certificates need a renewal that never stops."

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["Pki: the openssl root and intermediate", "Chains, ChainSteps: check a chain (JDK, by hand)", "Responder, Crls: OCSP and the revocation list", "StaplingServer, StapleClient: stapling", "StepCa, Renewer: short lives, renewed", "Fleet, ExpiryWatch: the expiry monitor"]
narration = "Here is who does what in the code. [[slnc 400]] Pki is the private authority made with openssl: a root, and an intermediate. [[slnc 500]] Chains builds and checks a chain with the J D K, at a time we choose, and ChainSteps redoes it by hand. [[slnc 500]] Responder runs a real O C S P responder that can be switched off, and Crls measures the revocation list. [[slnc 500]] StaplingServer and StapleClient show stapling. [[slnc 300]] StepCa and Renewer issue short lived certificates, and renew them. [[slnc 300]] And Fleet and ExpiryWatch are the expiry monitor."

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["A browser error: the certificate date is invalid", "certificate has expired, in a service log", "An outage traced to one forgotten certificate", "A certificate valid for 90 days, or fewer"]
narration = "You have probably met this already. [[slnc 400]] A browser error saying the certificate date is invalid is an expired certificate. [[slnc 500]] Certificate has expired, in a service log, is a missed renewal. [[slnc 500]] An outage traced back to one forgotten certificate is the most common way this goes wrong. [[slnc 500]] And a certificate valid for ninety days, or fewer, is a short life, renewed automatically."

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Short lives, renewed at two thirds", "Staple OCSP, and refresh the staple", "Decide hard or soft fail on purpose", "Monitor every certificate's expiry", "Keep the root offline"]
narration = "So, how do you use it? [[slnc 400]] Use short lived certificates, renewed automatically at two thirds of their life. [[slnc 500]] Staple the O C S P answer, and keep the staple fresh. [[slnc 500]] Decide between hard fail and soft fail on purpose, knowing what each costs. [[slnc 500]] Monitor the expiry of every certificate, with enough warning to act. [[slnc 300]] And keep the root offline."

[[scene]]
key = "12-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Set the lifetime to 9 seconds,", "and predict the renewals in 30 seconds."]
narration = "That's the certificate lifecycle. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Revocation is weaker than it looks, so keep certificates short lived, renew them automatically, and watch every expiry date. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Change the lifetime to nine seconds, and predict how many renewals happen in thirty seconds. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] openssl and step C A do the real work, and the J D K's own code checks the chains. [[slnc 300]] Here are the classes that matter."""

[[class]]
name = "ChainSteps"
what = "a teaching class: the chain check, step by step"
[[class.part]]
title = "names, signatures, the right to sign, the dates"
code = """
steps.add(new Step("leaf issuer = intermediate subject", found.isPresent()));
...
steps.add(new Step("leaf signature, intermediate's key", signedBy(leaf, inter)));
...
steps.add(new Step("the time is inside every validity", List.of(leaf, inter, root).stream()
        .allMatch(c -> !at.before(c.getNotBefore()) && !at.after(c.getNotAfter()))));
"""
speech = """Each step is one question with a yes or a no: does the name match, does the signature check with the next key, is the time inside the dates. [[slnc 300]] A test proves these steps accept and refuse the same chains as the J D K."""

[[class]]
name = "Chains"
what = "the JDK's PKIX check, with revocation set up"
[[class.part]]
title = "hard fail or soft fail"
code = """
HARD(EnumSet.noneOf(Option.class)),
SOFT(EnumSet.of(Option.SOFT_FAIL));
...
Set<Option> options = EnumSet.of(Option.ONLY_END_ENTITY, Option.NO_FALLBACK);
options.addAll(policy.options);
"""
speech = """The J D K's revocation checker refuses by default when it cannot learn the status. [[slnc 300]] One option, soft fail, makes it accept instead. [[slnc 300]] That one word is the difference between an outage and a bypass."""

[[class]]
name = "StapleClient"
what = "a TLS client that reads the stapled answer"
[[class.part]]
title = "the answer from the handshake"
code = """
List<byte[]> responses = socket instanceof SSLSocket s
        && s.getHandshakeSession() instanceof ExtendedSSLSession e
        ? e.getStatusResponses() : List.of();
"""
speech = """During the handshake, the client takes the O C S P answers the server stapled. [[slnc 300]] With one there, it needs no request to the responder."""

[[class]]
name = "Renewer"
what = "renews at two thirds of the life"
[[class.part]]
title = "when a renewal is due"
code = """
long life = Duration.between(notBefore, notAfter).toMillis();
return notBefore.plusMillis(life * 2 / 3);
"""
speech = """For a twelve second certificate the renewal is due at eight seconds. [[slnc 300]] The third that is left is the headroom when the C A is away."""

[[class]]
name = "ExpiryWatch"
what = "the monitor: a quarter of the life left"
[[class.part]]
title = "when to alert"
code = """
Duration left = Duration.between(now, notAfter);
return left.compareTo(life.dividedBy(4)) <= 0;
"""
speech = """The monitor alerts when a quarter of the life or less is left. [[slnc 300]] A healthy renewal at two thirds never reaches it, so an alert means the renewal is stuck."""

[[class]]
name = "Fleet"
what = "the inventory, and the outages a monitor prevents"
[[class.part]]
title = "renewed in time, or an outage"
code = """
renewedAt = scan.plus(ownerDays, ChronoUnit.DAYS);
...
if (renewedAt == null || renewedAt.isAfter(e.notAfter())) {
    outages++;
"""
speech = """The alert day, plus the days the owner needs, is when the certificate is renewed. [[slnc 300]] If that is after its expiry, it counts as an outage."""

