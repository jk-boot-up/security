[[act]]
title = "The missed renewal"
summary = "With the CA down past the expiry, 50 handshakes before it are fine, then 100 of 100 are refused (certificate expired), more than 10 renewals failed and none succeeded; the monitor alerted at least 2 seconds before the first refusal. Once the CA is back the expired certificate cannot be renewed and has to be issued anew; with a new one, 0 of 20 handshakes are refused. An inventory of 60 certificates has 4 already expired, 6 under 7 days, 14 under 30 days and 36 with 30 days or more. Of the 26 that expire in the next 60 days, no monitor means 26 outages; a 7-day alert prevents 23 when the owner needs 3 days and none when the owner needs 10; a 30-day alert with 10 days needed prevents 18."
detail = """
The input: the CA stays down past the end of a 12-second certificate.
The result: before the expiry, 50 handshakes and 0 refused; after it, 100 of 100 refused with the reason certificate expired. More than 10 renewals failed and 0 succeeded. The monitor alerted before the first refusal, and at least 2 seconds before it.
The CA is back: renewing the expired certificate is refused, so it has to be issued anew; with the new one, 20 handshakes and 0 refused.
An inventory of 60 certificates, at the monitor's first scan: 4 expired, 6 under 7 days, 14 under 30 days and 36 with 30 days or more. The 4 expired ones are found before anyone reports them.
How an outage is counted over the next 60 days, with a scan every morning: the alert comes on the first morning with fewer than the alert's days left, the certificate is renewed the alert day plus the days the owner needs, and it is an outage when that is after its expiry. 26 expire: no monitor, 26 outages; a 7-day alert with 3 days needed, 3 outages and 23 prevented; with 10 days needed, 26 and 0; a 30-day alert with 10 days needed, 8 and 18.
"""
figure = "missed_and_fleet"
figure_title = "A missed renewal, and a monitor that warns in time"
figure_speech = """
Fifth demo: the missed renewal. [[slnc 400]] On the left, the input: the C A goes down, and stays down past the certificate's end. [[slnc 700]]
Before the expiry, every handshake works. [[slnc 300]] After it, one hundred of one hundred are refused: certificate expired. [[slnc 300]] The monitor had alerted at least two seconds earlier, but nobody could renew. [[slnc 300]] Once the C A is back, the expired certificate cannot be renewed: it has to be issued anew. [[slnc 700]]
On the right, an inventory of sixty certificates. [[slnc 300]] Four are already expired, found on the first scan. [[slnc 500]] Below, how many outages a monitor prevents over sixty days. [[slnc 300]] A seven day alert saves twenty three of twenty six when the owner needs three days. [[slnc 300]] It saves none when the owner needs ten. [[slnc 300]] An alert is worth the time the owner needs to act.
"""
speech = """
Here is the real output. [[slnc 400]] Before the expiry: fifty handshakes, none refused. [[slnc 300]] After it: one hundred refused, certificate expired. [[slnc 300]] More than ten renewals failed, and the monitor alerted at least two seconds before the first refusal. [[slnc 400]] With the C A back, the old certificate cannot be renewed; a new one works.
[[page]]
The inventory: four expired, six under seven days, fourteen under thirty, and thirty six fine. [[slnc 400]] The next sixty days: twenty six expire. [[slnc 300]] No monitor, twenty six outages. [[slnc 300]] A seven day alert and three days of work: three outages. [[slnc 300]] With ten days of work: twenty six. [[slnc 300]] A thirty day alert: eight.
[[page]]
How an outage is counted: the alert day, plus the days the owner needs, after the expiry.
"""
