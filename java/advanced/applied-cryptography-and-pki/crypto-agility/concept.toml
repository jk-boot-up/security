[[act]]
title = "Tampering and downgrade"
summary = "Record 5 has header 45 03 03 and 53 bytes. Its version byte changed to 02 is refused because the tag does not match; a claim of version 00 (ECB, no tag) and a version-1 record after the cut-off are refused by the policy."
detail = """
The input is record 5 as stored: header 45 03 03, 53 bytes, and it reads. The policy reads v1, v2 and v3 and writes v3; after the cut-off it reads v2 and v3 only.
Three changes are made before the read: the version byte becomes 02 (claims AES-GCM); the version byte becomes 00 (claims AES in ECB mode, which has no tag); and a version-1 record (header 45 01 04) is read after the cut-off.
The result: the first is refused because the tag does not match, since the tag covers the header. The second is refused because version 0 is not accepted by the policy. The third is refused because version 1 is not accepted by the policy any more.
"""
figure = "tamper_checks"
figure_title = "Three changed headers, three refusals"
figure_speech = """
Fifth demo: tampering and downgrade. [[slnc 400]] At the top, the input: record five as stored. [[slnc 300]] Header four five, zero three, zero three: ChaCha twenty, under key three. [[slnc 300]] On the right, the policy. [[slnc 300]] It reads versions one, two and three, and writes three. [[slnc 300]] After a cut-off, it reads only two and three. [[slnc 700]]
Below, three changes made before the read. [[slnc 300]] First, an attacker changes the version byte to two. [[slnc 300]] The tag covers the header, so the tag does not match. [[slnc 500]] Second, the version byte becomes zero: A E S in E C B mode, with no tag at all. [[slnc 300]] The policy never reads version zero. [[slnc 500]] Third, an honest version one record, after the cut-off. [[slnc 300]] The policy no longer reads it. [[slnc 500]] An old version that is read forever is a downgrade waiting.
"""
speech = """
Here is the real output. [[slnc 400]] Record five as stored, and the policy before and after the cut-off. [[slnc 300]] Then the three changes, and the result. [[slnc 300]] One: the tag does not match. [[slnc 300]] Two: version zero is not accepted by the policy. [[slnc 300]] Three: version one is not accepted any more. [[slnc 300]] All three are refused.
"""
rows = { downgrade = "active ok" }
