# concept.toml: everything about this project that is not Java code.
# The numbers are the ones the demo prints (docs/expected-output.txt).

[project]
slug = "crypto-agility"
level = "advanced"
module = "applied-cryptography-and-pki"
title = "Crypto Agility"
short_title = "Crypto Agility"
package = "cryptoagility"
main_class = "CryptoAgilityDemo"
tagline = "Inventory the algorithms in a bank's code, store data in a versioned envelope, and rotate the algorithm and the key under 10,100 records without losing one"
bold = "A scan of a bank's code finds 20 uses of algorithms in 10 files: 11 approved, 5 to migrate and 4 forbidden, in 3 files; 10,000 records written by the old system in AES-CBC with a MAC are read next to new AES-GCM records because every value carries a header that names its suite and key, and a reader that assumes the first suite refuses a new record; reads that rewrite what they read move 2,000 records, a batch moves the other 8,000, and all 10,100 still read back as written; a second rotation to ChaCha20-Poly1305 under a third key moves all 10,100 again; key 1 cannot be retired while 10,000 records depend on it, and after its retirement a backup of 100 records taken before the migration reads 0 of 100; a changed version byte, a record claiming the unauthenticated first suite and a version the policy no longer reads are all refused."
domain = "a bank"
domain_note = ""
youtube_description = "Crypto agility for a bank: an inventory of algorithm names in source, a versioned and authenticated envelope, migration by read-repair and by batch, a second rotation, retiring a key and the backup that still needs it, and downgrade protection."
thumb_lines = ["CRYPTO", "AGILITY"]
thumb_code = "v1/key1 -> v2/key2 -> v3/key3"
youtube_title = "Crypto Agility: Versioned Envelopes, Rotating Algorithms and Retiring Keys"
youtube_tags = ["crypto agility", "key rotation", "algorithm migration", "versioned encryption", "aes-gcm", "chacha20-poly1305", "cryptographic inventory", "downgrade", "post-quantum readiness", "java"]

[readme]
intro = """
Every algorithm will be retired one day. **Crypto agility** is being able to do it without losing data or stopping the bank: you know where each algorithm is used, every stored value says how it was protected, and you have practised moving data from one algorithm and key to the next. This project does it with the JDK only: an **inventory** of the algorithm names in a bank's source, a **versioned envelope** (a header with the suite and the key id that is authenticated with the data), and a store of **10,100 records** that is migrated twice. `./gradlew test`, then `./gradlew run`.

What it shows:
- **What the code asks for.** 20 uses in 10 files: **11** approved, **5** to migrate, **4** forbidden (in 3 files).
- **A header that says how.** Old AES-CBC records and new AES-GCM records are read side by side; a reader that assumes one suite **refuses** the new record.
- **Moving the data.** **2,000** reads that rewrite what they read, then a batch of **8,000**: all **10,100** still read back as written. A second rotation to ChaCha20-Poly1305 moves all of them again.
- **Retiring a key.** Key 1 is refused while 10,000 records depend on it; once it is retired, a **backup of 100 records** from before the migration reads **0 of 100**.
- **Tampering and downgrade.** A changed version byte, a record claiming the unauthenticated first suite, and a version the policy no longer reads are all refused.

**Maps to:** NIST CSF 2.0 PR.DS · NIST SP 800-131A (transitions) · NIST IR 8547 (post-quantum migration) · CISA and NSA guidance on cryptographic inventories (CBOM).
"""
analogy = """
Changing the locks of a building that people live in. You need a list of every door, a label on every key that says which lock it opens, a night-by-night plan to swap the locks, and one person who checks that nobody is still holding a key to a lock you have thrown away, including the ones in the safe-deposit box.
"""
scenario = """
A bank's customer records are protected with a mix of old and new algorithms. A new standard requires a change, and the records and backups must keep working. The demo scans the code, then moves the data twice.
"""
costs = [
    "**A header and a policy add code** to every read and write.",
    "**A migration is a project;** it needs time, monitoring and a rollback.",
    "**Backups and replicas hold old versions** for years.",
    "**Supporting many versions widens the attack surface.**",
    "**An inventory by name misses algorithms chosen at runtime.**",
]
too_much = """
A system with one short-lived cache needs no envelope. Use agility where data outlives the algorithm: databases, backups, archives and signatures that must be checked years later.
"""
met_before = [
    "A column of ciphertext with no version.",
    "An algorithm name hard-coded in forty places.",
    "A key kept forever because a backup needs it.",
    "A migration script run once, in a hurry, and never again.",
]
where = """
This is a project of the [applied-cryptography-and-pki](..) module, after [post-quantum-cryptography](../post-quantum-cryptography), whose algorithms are the next ones to migrate to.
"""
twin = """
The cryptography is the JDK's own and the records are real encrypted values. The source files that are scanned are small text fixtures, not compiled. The demo prints counts, never keys or ciphertext.
"""
test_note = "The envelope, the store, the inventory and the policy are tested with the JDK only. The demo is compared with its golden output."

[[act]]
title = "What the code asks for"
summary = "20 uses of algorithms in 10 files: 11 approved, 5 to migrate and 4 forbidden."
detail = """
A scan of the source for the names passed to Cipher, MessageDigest, Mac, Signature and the other getInstance calls finds 20 uses. The policy lists each name as approved, to migrate or forbidden. Forbidden ones, such as AES in ECB mode, MD5 and triple DES, are in 3 files.
"""
speech = """
First demo: what the code asks for. [[slnc 400]] Twenty uses in ten files. [[slnc 600]] Eleven are approved, five need to move, and four are forbidden.
"""
rows = { inventory = "active ok" }
console = [
    ["20 uses in 10 files", "ok"],
    ["approved 11, to migrate 5, forbidden 4", "bad"],
    ["3 files with a forbidden algorithm", "bad"],
]

[[act]]
title = "A value that says how it was protected"
summary = "Old and new records are read side by side because each carries its suite and key; a reader that assumes one suite refuses the new one."
detail = """
10,000 records were written in AES-CBC with a MAC under key 1. The bank starts to write AES-GCM under key 2. Each value has a three-byte header with a magic byte, the suite version and the key id, and the header is authenticated with the data. The reader that picks the suite from the header reads all 10,100.
"""
speech = """
Second demo: a header. [[slnc 400]] Every value says how it was protected. [[slnc 600]] The new reader reads both, and the old one cannot read the new.
"""
rows = { header = "active ok" }
console = [
    ["v1/key1 = 10000", "ok"],
    ["v1/key1 = 10000, v2/key2 = 100", "ok"],
    ["the reader that follows the header: 10100 of 10100", "ok"],
]

[[act]]
title = "Moving the data"
summary = "2,000 reads that rewrite what they read and a batch of 8,000 move everything, and all 10,100 records still read back as written."
detail = """
Retiring key 1 at the start is refused because 10,000 records depend on it. Reading 2,000 records with read-repair writes them again in the current suite: 8,000 remain on key 1. A batch moves them, and every record reads back as written. A second rotation to ChaCha20-Poly1305 under a third key moves all 10,100 again.
"""
speech = """
Third demo: moving the data. [[slnc 400]] Rewrite what you read, then run a batch for the rest. [[slnc 600]] Nothing is lost, and the next rotation is the same process.
"""
rows = { move = "active ok" }
console = [
    ["after 2000 reads: v1 8000, v2 2100", "ok"],
    ["a batch changed 8000 records", "ok"],
    ["intact 10100 of 10100", "ok"],
]

[[act]]
title = "Retiring a key"
summary = "Key 1 can be retired when no live record uses it, but a backup from before the migration then reads 0 of 100."
detail = """
After the second rotation the live records are all under key 3, so keys 1 and 2 can be retired. A backup of 100 records taken before the migration was sealed under key 1 and now reads 0 of 100: the backup must be migrated too, or the key kept as long as the backup.
"""
speech = """
Fourth demo: retiring a key. [[slnc 400]] No live record needs key one. [[slnc 600]] A backup does, and it cannot be read any more.
"""
rows = { retire = "active wrong" }
console = [
    ["live records under key 1: 0", "ok"],
    ["retiring keys 1 and 2: allowed", "ok"],
    ["backup readable: 0 of 100", "bad"],
]

[[act]]
title = "Tampering and downgrade"
summary = "A changed version byte, a record claiming the unauthenticated first suite and a version the policy no longer reads are all refused."
detail = """
The header is part of what is authenticated, so changing the version byte makes the check fail. A record that claims the first suite, which had no authentication at all, is refused by the policy. A version-1 record is refused after the policy stops reading version 1. The policy decides what is read and what is written.
"""
speech = """
Fifth demo: tampering and downgrade. [[slnc 400]] The header is authenticated with the data. [[slnc 600]] An old version that is read forever is a downgrade waiting.
"""
rows = { downgrade = "active ok" }
console = [
    ["version byte changed: refused", "ok"],
    ["first suite claimed: refused by policy", "ok"],
    ["version 1 after the cut-off: refused", "ok"],
]

[animation]
subtitle = "A bank's records, moved from one algorithm to the next."
boxes = [
    ["inventory", "What the code asks for", "20 uses"],
    ["header", "A value that says how it was protected", "10,100"],
    ["move", "Moving the data", "10,100 intact"],
    ["retire", "Retiring a key", "0 of 100"],
    ["downgrade", "Tampering and downgrade", "3 refused"],
]

[docs.problem]
scenario = """
A bank must replace an algorithm in a database of customer records and in its backups.
"""
naive = """
Write a script that decrypts everything with the old code and encrypts it with the new, once.
"""
deliver = [
    "An inventory of the algorithm names in the code.",
    "A versioned and authenticated envelope.",
    "A migration by read-repair and by batch, twice.",
    "Retiring a key, and the downgrade protection of a policy.",
]

[docs.prerequisites]
required = [
    "Java basics",
]
not_required = [
    "Docker",
    "A library such as Tink (it does the same job for you)",
]
install = []

[docs.session]
objectives = [
    "inventory the algorithms used in source code",
    "design a header that makes stored data self-describing",
    "migrate data between suites and keys without loss",
    "explain when a key can be retired and why a backup matters",
]
walkthrough = """
Run the demo and find the 8,000 records left after the 2,000 reads. Then change the write version in the code and run it again to see a rotation to a new suite.
"""
exercises = [
    "Add AES-256-GCM-SIV or another suite as version 4 and rotate to it.",
    "Make the batch resumable after a crash.",
    "Replace the envelope with a Tink keyset and compare.",
    "Write a check for the build that fails on a forbidden algorithm in a new file.",
]

[docs.explained]
sentence = """
You can only change an algorithm you can find, and only in data that says how it was protected.
"""
verdict = """
Keep an inventory of algorithm names, put the suite and key id in an authenticated header, write the newest suite and read only what the policy allows, rewrite on read and by batch, and retire a key only when the records and the backups under it are gone.
"""
recognise = [
    "Ciphertext in a column with no version.",
    "An algorithm name hard-coded in many places.",
    "A key kept for ever because nobody knows what it protects.",
    "A migration that was never rehearsed.",
]

[spec]
purpose = """
Teach crypto agility by building an inventory, a versioned envelope and a migration of a store of records across suites and keys.
"""
nongoals = [
    "Choosing the best algorithm.",
    "Hardware security modules.",
    "Key management services.",
]
problem = """
Data is encrypted once, with nothing to say how, and the algorithm cannot be changed without knowing all its uses.
"""
roles = [["The algorithm list", "`Policy`"], ["The scan of source", "`Inventory`"], ["The versioned value", "`Envelope`"], ["The keys", "`KeyRing`"], ["The records and the migration", "`Store`"], ["Entry point", "`CryptoAgilityDemo`"]]
requirements = [
    "Every algorithm name in the source is listed with a status.",
    "Every stored value carries an authenticated header with the suite and the key id.",
    "The reader picks the suite from the header and obeys a policy.",
    "Records can be migrated by read-repair and by batch without loss.",
    "The demo prints the same output on every run.",
]

