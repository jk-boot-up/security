[threatmodel]
scope = """
How stored data is protected and how the protection can be changed. It does not cover the strength of the algorithms themselves.
"""
assets = [
    "The customer records.",
    "The backups.",
    "The keys.",
]
actors = [
    "An attacker who can change stored values.",
    "A developer who adds a new algorithm name.",
    "An operator who retires a key.",
]
boundaries = [
    "The store: what is read from it is checked by the envelope.",
]
assumptions = [
    "The keys are kept safe; the policy is reviewed.",
]
out_of_scope = [
    "Side channels.",
    "Attacks on the algorithms.",
]
tests = [
    "`EnvelopeTest` and `StoreAndInventoryTest` check the suites, the header, the policy, the migration and the inventory with the JDK only.",
    "`DemoRunsTest` compares the whole demo with the golden output.",
]
next = """
The next project in the module is hardware-backed-keys.
"""

[[threat]]
id = "T1"
stride = "T"
threat = "A stored value is changed to a weaker suite"
where = "the store"
control = "Authenticate the header with the data and refuse versions the policy does not read"
residual = "A suite that is weak but still allowed"

[[threat]]
id = "T2"
stride = "D"
threat = "A key is retired while data still needs it"
where = "the key ring"
control = "Count the live records and the backups under a key before retiring it"
residual = "Copies nobody knows about"

[[threat]]
id = "T3"
stride = "I"
threat = "A forbidden algorithm stays in the code"
where = "the source"
control = "Keep an inventory and fail the build on a forbidden name"
residual = "Names chosen at runtime"

