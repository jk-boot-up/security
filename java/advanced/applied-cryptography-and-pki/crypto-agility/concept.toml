[poster]
headline = [["CRYPTO", "text"], ["AGILITY", "accent"]]
taglines = [["Change the algorithm, keep every record", "gold"]]
before = { code = "v1/key1 -> v2/key2 -> v3/key3", note = "Three suites", tag = "BEFORE" }
