[[scene]]
key = "01-poster"
kind = "poster"
title = "Crypto Agility"
narration = "Hello, and welcome. [[slnc 400]] This video explains crypto agility. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] Every algorithm will be retired one day. [[slnc 300]] Crypto agility is being able to do that without losing data or stopping the business. [[slnc 300]] You know where each algorithm is used, every stored value says how it was protected, and you have practised moving data from one algorithm and key to the next. [[slnc 600]] Think of a bank that labels every safe deposit box with the lock it uses, so it can change the locks one box at a time. [[slnc 600]] Our example is a bank."

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["A bank's customer records are protected with", "a mix of old and new algorithms: 10,000 in", "AES-CBC with an HMAC, new ones in AES-GCM.", "", "A new standard requires a change. The demo scans", "the code, then moves the data twice."]
narration = "Here is the scenario. [[slnc 400]] A bank's customer records are protected with a mix of algorithms. [[slnc 300]] Ten thousand old records use A E S, the advanced encryption standard, in C B C mode, with an H MAC. [[slnc 300]] New ones use A E S G C M. [[slnc 500]] A new standard requires a change, and the records, and the backups, must keep working. [[slnc 500]] The demo scans the code for the algorithms it names, then moves all the data twice."

[[scene]]
key = "02-words"
kind = "bullets"
title = "The Words"
body = ["Suite: the algorithms that protect one value", "Envelope: a value with a header naming its suite and key", "Key id: which key sealed the value", "Policy: which suites are read, and which is written", "Read-repair: rewrite a record when it is read", "Retire a key: delete it for good"]
narration = """Before the demos, the words. [[slnc 500]] A suite is the set of algorithms that protect one value, for example A E S G C M. [[slnc 500]] An envelope is the stored value, with a short header that names its suite and its key. [[slnc 500]] The key I D says which key sealed the value. [[slnc 500]] The policy says which suites may still be read, and which one is written. [[slnc 500]] Read repair means rewriting a record in the newest suite when it is read. [[slnc 500]] And retiring a key means deleting it for good: whatever it sealed can no longer be read."""

[[scene]]
key = "02-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "02-envelope"
kind = "figure"
title = "One record, sealed in three suites"
body = "envelope_bytes"
narration = """Let's see the core idea on one real record. [[slnc 400]] At the top, the record before sealing: customer one, balance thirty seven. [[slnc 300]] Twenty one bytes of text. [[slnc 600]] Below, the same record sealed in each of the three suites, byte by byte. [[slnc 300]] Purple is the header: three bytes that say which suite and which key sealed it. [[slnc 300]] Blue is the I V, the fresh random start value. [[slnc 300]] Amber is the ciphertext, and green is the tag that detects any change. [[slnc 700]]
Version one is A E S in C B C mode, with an H MAC. [[slnc 300]] C B C pads the text to whole sixteen byte blocks, so twenty one bytes become thirty two. [[slnc 300]] The H MAC tag is thirty two bytes. [[slnc 300]] Eighty three in all. [[slnc 500]] A E S G C M and ChaCha twenty keep the text length, and use a sixteen byte tag: fifty two. [[slnc 600]] The header is what makes a change of algorithm possible."""

[[scene]]
key = "03-acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "04-costs"
kind = "bullets"
title = "What It Costs"
body = ["Every value carries a header", "Two suites must be read during a migration", "A batch over every record takes time", "A retired key makes old backups unreadable", "The policy must say what is forbidden"]
narration = "Nothing is free. [[slnc 400]] Here is what it costs. [[slnc 500]] Every stored value carries a header that names its suite and key. [[slnc 500]] During a migration, the code must read two suites side by side. [[slnc 500]] A batch over every record takes time, and must not lose one. [[slnc 500]] A retired key makes old backups unreadable, so decide about the backups first. [[slnc 300]] And someone must keep the policy of what is allowed, and what is forbidden."

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Cipher.getInstance(\"AES\") with no mode", "MessageDigest.getInstance(\"MD5\") or \"SHA-1\"", "Ciphertext stored with no version or key id", "A migration plan that ignores the backups"]
narration = "You have probably met this already. [[slnc 400]] Cipher get instance A E S, with no mode, quietly means E C B. [[slnc 500]] A message digest of M D 5, or S H A 1, is an algorithm to move. [[slnc 500]] Ciphertext stored with no version, and no key I D, cannot be migrated safely. [[slnc 500]] And a migration plan that ignores the backups loses them when the old key goes."

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Inventory the algorithms your code names", "Store a version and key id with every value", "Authenticate the header with the data", "Migrate by read-repair, then by batch", "Retire a key only when nothing needs it"]
narration = "So, how do you use it? [[slnc 400]] Inventory the algorithms your code names. [[slnc 500]] Store a version and a key I D with every value. [[slnc 500]] Authenticate the header together with the data, so it cannot be changed, and refuse versions the policy no longer reads. [[slnc 500]] Migrate by rewriting what you read, then by a batch for the rest. [[slnc 300]] And retire a key only when no record, and no backup you need, depends on it."

[[scene]]
key = "12-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Make the batch resumable", "after a crash."]
narration = "That's crypto agility. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Know where every algorithm is used, label every value with how it was protected, and practise the move before you are forced to make it. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Make the migration batch resumable after a crash. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] It uses only the J D K. [[slnc 300]] Here are the classes that matter."""

[[class]]
name = "Inventory"
what = "finds the algorithm names the source asks for"
[[class.part]]
title = "a pattern for every getInstance call"
code = """
Matcher m = GET_INSTANCE.matcher(Files.readString(p));
while (m.find()) {
    uses.add(new Use(p.getFileName().toString(), m.group(1), Policy.of(m.group(1))));
"""
speech = """A regular expression finds the name passed to each get instance call, in Cipher, Message Digest, Mac, Signature and the others. [[slnc 300]] Every match becomes a use: the file, the name, and what the policy says about it."""

[[class]]
name = "Policy"
what = "the bank's list of algorithm names"
[[class.part]]
title = "a status for every name"
code = """
Map.entry("AES/GCM/NoPadding", Status.APPROVED),
...
Map.entry("SHA-1", Status.DEPRECATED),
...
Map.entry("MD5", Status.FORBIDDEN),
...
return LIST.getOrDefault(algorithm, Status.UNKNOWN);
"""
speech = """The policy is a plain map from a name to a status. [[slnc 300]] A name that is not on the list is unknown, so a new algorithm is noticed, not silently accepted."""

[[class]]
name = "Envelope"
what = "a value with an authenticated header"
[[class.part]]
title = "seal: the header, then the suite it names"
code = """
byte[] header = {MAGIC, (byte) version, (byte) keyId};
...
case V1_CBC_HMAC -> sealCbc(plain, header, keyId);
...
cipher.updateAAD(header);
"""
speech = """The header is three bytes: the magic letter E, the version and the key I D. [[slnc 300]] The version picks the suite. [[slnc 300]] In C B C, the H MAC covers the header. [[slnc 300]] In G C M and ChaCha twenty, the header is passed as associated data, so the tag covers it too."""
[[class.part]]
title = "open: the policy first"
code = """
int version = versionOf(blob);
if (!rules.readable().contains(version)) {
    throw new GeneralSecurityException("version " + version + " is not accepted by the policy");
...
if (!keys.has(keyId)) {
    throw new GeneralSecurityException("key " + keyId + " is retired");
"""
speech = """Before any decryption, the reader asks the policy whether this version is still read. [[slnc 300]] Then it checks that the key still exists. [[slnc 300]] These are the refusals you saw in the demos."""

[[class]]
name = "KeyRing"
what = "the keys by id, and a key for each purpose"
[[class.part]]
title = "derive a key from the master key"
code = """
Mac mac = Mac.getInstance("HmacSHA256");
mac.init(new SecretKeySpec(master, "HmacSHA256"));
...
mac.update((purpose + "/" + block).getBytes(StandardCharsets.UTF_8));
"""
speech = """Each key I D has one master key. [[slnc 300]] The key for each suite is an H MAC of the purpose, like G C M, under that master key, which is the idea of H K D F. [[slnc 300]] So one master key never serves two suites directly."""

[[class]]
name = "Store"
what = "the records, and how they move"
[[class.part]]
title = "read-repair"
code = """
byte[] plain = envelope.open(blob, rules);
boolean old = Envelope.versionOf(blob) != rules.writeVersion()
        || Envelope.keyOf(blob) != keyId;
if (repair && old) {
    records.put(id, envelope.seal(plain, rules.writeVersion(), keyId));
"""
speech = """A read opens the record with whatever suite its header names. [[slnc 300]] If that is not the current suite and key, the record is sealed again in them. [[slnc 300]] The batch does the same for every record that is left."""

[[class]]
name = "Layout"
what = "a teaching class: where every byte of an envelope goes"
[[class.part]]
title = "the parts follow from the version"
code = """
int iv = version == Envelope.V1_CBC_HMAC ? 16 : 12;
int tag = version == Envelope.V1_CBC_HMAC ? 32 : 16;
String header = HexFormat.ofDelimiter(" ").formatHex(blob, 0, HEADER);
return new Layout(header, iv, blob.length - HEADER - iv - tag, tag, blob.length);
"""
speech = """The version says how long the I V and the tag are. [[slnc 300]] What is left is the ciphertext. [[slnc 300]] A test seals texts of every length up to forty bytes and proves the parts add up."""

[[acronym]]
short = "JDK"
long = "Java Development Kit: Java and its standard library"
say = "J D K is the Java development kit: Java and its standard library, which has all the algorithms used here."
[[acronym]]
short = "AES"
long = "Advanced Encryption Standard: the usual block cipher"
say = "A E S is the advanced encryption standard, the usual block cipher. It encrypts sixteen bytes at a time."
[[acronym]]
short = "ECB, CBC, GCM"
long = "Electronic Codebook; Cipher Block Chaining; Galois/Counter"
say = "E C B, C B C and G C M are modes of A E S. E C B shows patterns and is forbidden. C B C needs a separate tag. G C M encrypts and checks in one step."
[[acronym]]
short = "AEAD, AAD"
long = "Authenticated Encryption with Associated Data; the associated data"
say = "A E A D is authenticated encryption with associated data, like G C M and ChaCha twenty Poly thirteen oh five. The associated data, here the header, is checked but not encrypted."
[[acronym]]
short = "MAC, HMAC"
long = "Message Authentication Code; Hash-based MAC"
say = "A MAC is a message authentication code, a tag that shows a value was not changed. H MAC builds one from a hash such as S H A two fifty six."
[[acronym]]
short = "IV"
long = "Initialisation Vector: a fresh random start value"
say = "An I V is an initialisation vector: a fresh random value, so the same text never seals to the same bytes."
[[acronym]]
short = "SHA, SHA-1, SHA256, MD, MD5"
long = "Secure Hash Algorithm; Message Digest 5"
say = "S H A is the secure hash algorithm. S H A two fifty six is approved. S H A one is to migrate, and M D 5, message digest five, is broken."
[[acronym]]
short = "DES, DESede"
long = "Data Encryption Standard; triple DES"
say = "D E S is the old data encryption standard. Triple D E S, which Java calls DES e d e, runs it three times. Both are forbidden."
[[acronym]]
short = "RSA, PKCS"
long = "Rivest-Shamir-Adleman; Public-Key Cryptography Standards"
say = "R S A is a public key algorithm by Rivest, Shamir and Adleman. P K C S, public key cryptography standards, number one defines an old padding for it."
[[acronym]]
short = "PBKDF2, HKDF"
long = "Password-Based / HMAC-based Key Derivation Function"
say = "P B K D F two derives a key from a password. H K D F derives keys from a master key with H MAC."
[[acronym]]
short = "PRNG"
long = "Pseudo-Random Number Generator"
say = "P R N G stands for pseudo random number generator. S H A one P R N G is an old one to migrate."
[[acronym]]
short = "ID, hex"
long = "Identifier; hexadecimal, two digits per byte"
say = "An I D is an identifier. Hex is hexadecimal, two digits per byte: four five is the letter E."
[[acronym]]
short = "NIST, SP, IR, CSF"
long = "US standards body; its publications and framework"
say = "N I S T is the United States National Institute of Standards and Technology. It publishes special publications, interagency reports and the cybersecurity framework."
[[acronym]]
short = "CISA, NSA, CBOM"
long = "US agencies; Cryptography Bill Of Materials"
say = "C I S A and the N S A are United States agencies. A cryptography bill of materials, C B O M, is an inventory like the one in the first demo."
