[[act]]
title = "Moving the data"
summary = "Key 1 cannot be retired while 10,000 records need it. 2,000 reads that rewrite what they read leave 8,000 on key 1; a batch moves those 8,000; all 10,100 still read back as written."
detail = """
The input is the store: 10,000 records as v1/key1 and 100 as v2/key2. Retiring key 1 now would strand 10,000 records, so it is refused.
Step 1 is read-repair: 2,000 reads each write the record again in the current suite and key. The result is 8,000 on v1/key1 and 2,100 on v2/key2.
Step 2 is a batch for the rest: it changes 8,000 records, and all 10,100 are v2/key2.
How the counts add up: key 1 goes 10,000 - 2,000 = 8,000, then - 8,000 = 0; key 2 goes 100 + 2,000 = 2,100, then + 8,000 = 10,100. All 10,100 read back as the text that was put in.
"""
figure = "migration_bars"
figure_title = "From key 1 to key 2, in two steps"
figure_speech = """
Third demo: moving the data. [[slnc 400]] The top bar is the input: the store before the move. [[slnc 300]] Amber is version one under key one, ten thousand records. [[slnc 300]] The thin blue slice is the hundred new records. [[slnc 300]] Key one cannot be retired yet, because ten thousand records need it. [[slnc 700]]
Step one is read repair. [[slnc 300]] Every time the bank reads a record in the old suite, it writes it again in the new one. [[slnc 300]] Two thousand reads move two thousand records. [[slnc 700]]
Step two is a batch for the rest, eight thousand records. [[slnc 500]] At the bottom, the arithmetic. [[slnc 300]] Key one goes from ten thousand, to eight thousand, to zero. [[slnc 300]] Key two goes from one hundred, to two thousand one hundred, to ten thousand one hundred. [[slnc 300]] And every record still reads back as written.
"""
speech = """
Here is the real output. [[slnc 400]] Before the move: ten thousand on key one, a hundred on key two, and retiring key one is refused. [[slnc 300]] After two thousand reads that rewrite: eight thousand, and two thousand one hundred. [[slnc 300]] The batch changes the last eight thousand.
[[page]]
How the counts add up, for each key. [[slnc 400]] And after the move, ten thousand one hundred of ten thousand one hundred read back as written. [[slnc 300]] Nothing was lost.
"""
