[[act]]
title = "A value that says how it was protected"
summary = "Every sealed record starts with a 3-byte header: magic 45, the suite version and the key id. 10,000 old AES-CBC records and 100 new AES-GCM records live side by side; a reader that follows the header reads all 10,100, and an old reader refuses the new one."
detail = """
The input is one record, customer-1;balance=37, 21 bytes of text. Sealed in each suite it becomes header + IV + ciphertext + tag: 3 + 16 + 32 + 32 = 83 bytes in AES-CBC with HMAC-SHA256 (CBC pads 21 bytes to 32), and 3 + 12 + 21 + 16 = 52 bytes in AES-GCM and in ChaCha20-Poly1305.
The header is the letter E (hex 45), then the version (01, 02, 03) and the key id. The tag covers the header too, so it cannot be changed unseen.
The store holds 10,000 records written by the old system as v1/key1. The bank starts writing AES-GCM under key 2: 100 new records are v2/key2. The old reader, which knows only version 1, refuses the new record with header 45 02 02; the reader that picks the suite from the header reads 10,100 of 10,100.
"""
figure = "two_readers"
figure_title = "Old and new records, and two readers"
figure_speech = """
Second demo: a value that says how it was protected. [[slnc 400]] At the top, the input: the store of the old system. [[slnc 300]] Ten thousand records, all version one, under key one. [[slnc 300]] Then the bank starts to write A E S G C M under a new key. [[slnc 300]] A hundred new records are version two, under key two. [[slnc 700]]
Below, one new record. [[slnc 300]] Its first three bytes are its header. [[slnc 300]] Four five is the letter E, which marks an envelope. [[slnc 300]] Zero two is the suite, A E S G C M. [[slnc 300]] And zero two is the key. [[slnc 700]]
On the right, the result. [[slnc 300]] The old reader assumes version one, so it refuses the new record. [[slnc 300]] The reader that follows the header reads all ten thousand one hundred. [[slnc 500]] Old and new can live side by side.
"""
speech = """
Here is the real output. [[slnc 400]] One record, twenty one bytes of text. [[slnc 300]] Sealed in each suite, it is a header, an I V, the ciphertext and a tag. [[slnc 300]] Version one is eighty three bytes, because C B C pads to whole blocks and H MAC adds thirty two. [[slnc 300]] The other two are fifty two. [[slnc 400]] Then the header, byte by byte.
[[page]]
The store before and after the new suite: ten thousand version one records, and a hundred version two. [[slnc 400]] The old reader refuses the new record. [[slnc 300]] The reader that follows the header reads ten thousand one hundred of ten thousand one hundred.
"""
