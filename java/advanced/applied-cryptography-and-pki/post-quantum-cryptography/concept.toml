[[act]]
title = "A hybrid key exchange: X25519 and ML-KEM-768"
summary = "The client sends 44 + 1206 = 1250 bytes and the server 44 + 1088 = 1132. HKDF-SHA256 joins the two 32-byte secrets (64 bytes) with a 2409-byte context, worked by hand to the JDK's exact key. An attacker who breaks only X25519, or only ML-KEM, cannot rebuild the key, though an X25519-only key would fall; a context missing one byte gives another key."
detail = """
What crosses the network: the client sends an X25519 key of 44 bytes and an ML-KEM key of 1206, 1250 bytes; the server sends an X25519 key of 44 and a ciphertext of 1088, 1132 bytes.
How the key is made, worked by hand: the secrets are X25519 32 + ML-KEM 32 = 64 bytes; the context is the label (27 bytes) and every public value, 27 + 44 + 1206 + 44 + 1088 = 2409 bytes; extract is HMAC with 32 zero bytes as the key over the secrets, 32 bytes; expand is HMAC with that over the context and the byte 01, 32 bytes. By hand equals the JDK's KDF, the client's key equals the server's, and it differs from a key of X25519 alone.
A recording attacked years later: with X25519 broken the attacker recovers its secret, but a hybrid key rebuilt without the ML-KEM secret does not match; an X25519-only key would be rebuilt. With ML-KEM broken, a key rebuilt without the X25519 secret does not match. With one ciphertext byte missing from the context, the key does not match.
"""
figure = "hybrid_combine"
figure_title = "Two secrets, one key: the hybrid exchange"
figure_speech = """
Fourth demo: a hybrid key exchange, like the one browsers use today. [[slnc 400]] Both ends run two exchanges side by side: X twenty five five nineteen, and M L KEM seven sixty eight. [[slnc 600]]
At the top, how the key is made. [[slnc 300]] The two thirty two byte secrets are joined: sixty four bytes. [[slnc 300]] H K D F extracts thirty two bytes from them, then expands with the context. [[slnc 300]] The context is a label and every public value of the exchange, two thousand four hundred and nine bytes. [[slnc 300]] The demo redoes these two steps by hand, and gets exactly the J D K's key. [[slnc 600]]
At the bottom, a recording attacked years later. [[slnc 300]] Break X twenty five five nineteen alone, and the hybrid key still cannot be rebuilt. [[slnc 300]] A key from X twenty five five nineteen alone would fall. [[slnc 300]] Break M L KEM alone, and the key still holds.
"""
speech = """
What crosses the network: both public keys one way, a key and a ciphertext back. [[slnc 400]] How the key is made, step by step: the secrets, the context, extract, and expand. [[slnc 300]] By hand matches the J D K, and both sides agree.
[[page]]
A recording, attacked years later. [[slnc 300]] With only X twenty five five nineteen broken, the hybrid key is not rebuilt, but an X twenty five five nineteen only key would be. [[slnc 300]] With only M L KEM broken, the key holds. [[slnc 300]] And a changed context gives another key.
"""
