[readme]
intro = """
A large quantum computer would break RSA, finite-field Diffie-Hellman and elliptic curves, and anyone can record encrypted traffic today and open it later. The JDK 25 ships the two NIST standards that answer this, **ML-KEM** (FIPS 203, key establishment) and **ML-DSA** (FIPS 204, signatures), in the ordinary `KeyPairGenerator`, `KEM` and `Signature` classes. This project uses them for a bank, measures what they cost in bytes, builds a **hybrid** exchange with X25519, models how long data must stay secret, and counts where the earlier projects still use the old algorithms. It needs only the JDK; Bouncy Castle 1.86 is used for one cross-check. Run `./gradlew run`.

What it shows:
- **Sizes.** An ML-KEM-768 public key is **1206** bytes against **44** for X25519 (27.4 times); an ML-DSA-65 signature is **3309** bytes against **64** for ECDSA P-256; the keys and signatures of a short certificate chain grow from **374** to **13875** bytes.
- **ML-KEM.** Encapsulation succeeds and both sides derive the same 32-byte key: yes.
- **Implicit rejection.** A flipped bit gives **no error** and a different key; the failure shows at first use, as an AES-GCM tag failure.
- **Hybrid.** X25519 and ML-KEM secrets joined by HKDF with the transcript as context: breaking only one part does not give the key.
- **Mosca.** Secrecy years plus migration years against years to the threat, from made-up inputs: **3 of 5** data classes exposed if the threat is 8 years away.
- **Inventory.** **26 of 117** earlier projects name a classical public-key algorithm; none names ML-KEM or ML-DSA.
- **Two implementations.** The JDK and Bouncy Castle agree on public keys, ciphertexts and signatures, and do not agree on private key encodings.

**Maps to:** NIST FIPS 203 and FIPS 204 · NIST SP 800-227 (KEM recommendations) · NIST IR 8547 (transition to post-quantum) · OWASP Cryptographic Storage · PCI DSS 4.0 requirement 12.3.3 (cryptographic inventory).
"""
analogy = """
A bank that knows a better vault door is coming in some years, and that thieves are already photographing today's locks. It does not wait for the new door: it lists every door, replaces the ones guarding things that must stay secret for decades, and fits the new lock next to the old one until it trusts the new one.
"""
scenario = """
A bank protects card messages, online sessions, a statement archive, loan contracts and a settlement file. The demo uses the new algorithms, sizes them, models which data is at risk of being recorded now, and counts where the repository still uses the old ones.
"""
costs = [
    "**Bytes.** Keys, ciphertexts and signatures are 10 to 50 times larger, which costs bandwidth and can split a handshake across packets.",
    "**Young algorithms.** Hybrid keeps today's security if a flaw is found in the new one.",
    "**The threat date is unknown,** so the model is an illustration, not a forecast.",
    "**Inventory is work.** A name in the source is not proof of use, and keys also hide in hardware, vendors and certificates.",
    "**Private key formats differ** between libraries.",
]
too_much = """
A system whose data is worthless in a year and that is rebuilt every two years can wait and watch. Anything that must stay secret for ten years, or that signs things that must stay valid for decades, should plan now.
"""
met_before = [
    "Waiting for a quantum computer to exist before planning.",
    "Replacing RSA with a larger RSA key.",
    "A migration with no list of where the old algorithms are.",
    "A new algorithm used alone on day one.",
]
where = """
This is a project of the [applied-cryptography-and-pki](..) module. It counts the algorithms named in the earlier beginner and intermediate projects.
"""
twin = """
Nothing is simulated except the attacker of the hybrid exchange, who is handed one broken secret (what a quantum computer would produce) and tries to rebuild the key. The inputs of Mosca's inequality are made up and labelled so. The demo prints sizes, counts and yes or no answers, never keys or timings.
"""
test_note = "The demo needs only the JDK and Bouncy Castle and runs in seconds, so the golden-file test runs with ./gradlew test."

[[act]]
title = "What the new algorithms cost"
summary = "An ML-KEM-768 public key is 1206 bytes against 44 for X25519; an ML-DSA-65 signature is 3309 bytes against 64."
detail = """
The sizes come from real keys, ciphertexts and signatures made in the demo. ML-KEM-768 needs a 1206-byte public key and a 1088-byte ciphertext, 27.4 and 24.7 times X25519. ML-DSA-65 has a 1974-byte public key and a 3309-byte signature. Two certificates plus the handshake signature grow from 374 bytes with ECDSA P-256 to 13875 bytes.
"""
speech = """
First demo: what the new algorithms cost. [[slnc 400]] A key of twelve hundred bytes, where X twenty five five one nine needed forty four. [[slnc 600]] A signature of thirty three hundred bytes, where ECDSA needed sixty four.
"""
rows = { sizes = "active ok" }
console = [
    ["ML-KEM-768 public key: 1206 bytes", "bad"],
    ["X25519 public key: 44 bytes", "ok"],
    ["ML-DSA-65 signature: 3309 bytes", "bad"],
]

[[act]]
title = "ML-KEM and implicit rejection"
summary = "Encapsulation succeeds and both sides derive the same key; a flipped bit gives a different key and no error."
detail = """
KeyPairGenerator ML-KEM-768 and the KEM class give a 1088-byte ciphertext and a 32-byte shared secret. With one bit flipped, decapsulation raises no error and returns a key of 32 bytes that differs from the sender's; the first use, an AES-GCM tag check, fails. Only a ciphertext of the wrong length raises DecapsulateException.
"""
speech = """
Second demo: ML-KEM. [[slnc 400]] Flip one bit and nothing is raised. [[slnc 600]] The receiver holds a different key, and the failure shows at first use.
"""
rows = { kem = "active ok" }
console = [
    ["both sides derived the same key: yes", "ok"],
    ["one bit flipped, error raised: no", "bad"],
    ["first use: AES-GCM tag check failed", "ok"],
]

[[act]]
title = "ML-DSA and a hybrid exchange"
summary = "ML-DSA signs and verifies in the Signature class; the hybrid key is not rebuilt by an attacker who broke only one part."
detail = """
ML-DSA-65 signs a statement and verifies it; one changed bit, another bank's key and a signature from ML-DSA-44 all fail. The hybrid exchange joins the X25519 and ML-KEM secrets with HKDF-SHA256 and the whole transcript; an attacker given the X25519 secret, or given the ML-KEM secret, does not rebuild the key. A classical-only exchange would be rebuilt.
"""
speech = """
Third demo: signatures and the hybrid. [[slnc 400]] Break one part and the key is still safe. [[slnc 600]] Break the only part and it is not.
"""
rows = { hybrid = "active ok" }
console = [
    ["ML-DSA-65 signature verifies: yes", "ok"],
    ["X25519 broken, hybrid key rebuilt: no", "ok"],
    ["X25519 broken, classical-only rebuilt: yes", "bad"],
]

[[act]]
title = "Harvest now, decrypt later"
summary = "Mosca's inequality, from made-up inputs, marks 3 of 5 bank data classes as exposed if the threat is 8 years away."
detail = """
Secrecy years plus migration years against years to the threat. A card authorisation message needs 3 years and a loan contract needs 34. If the threat is 8 years away, 3 of 5 data classes are already exposed to recording today; at 15 and at 25 years, 1 of 5. The inputs are an illustration, not a prediction.
"""
speech = """
Fourth demo: harvest now, decrypt later. [[slnc 400]] How long must the data stay secret, and how long does moving take? [[slnc 600]] The loan contracts are late in every scenario.
"""
rows = { mosca = "active ok" }
console = [
    ["threat in 8 years: 3 of 5 exposed", "bad"],
    ["threat in 15 and in 25 years: 1 of 5", "bad"],
    ["illustration, not a prediction", "ok"],
]

[[act]]
title = "Inventory and two implementations"
summary = "26 of 117 earlier projects name a classical public-key algorithm; Bouncy Castle and the JDK agree on public keys, ciphertexts and signatures."
detail = """
Scanning the main source of the beginner and intermediate tracks finds 10 projects naming RSA, 12 ECDSA, 5 ECDH, 2 X25519 and 7 Ed25519, and none naming ML-KEM or ML-DSA. Bouncy Castle 1.86 and the JDK exchange public keys, ciphertexts and signatures in both directions and agree; the JDK does not read a Bouncy Castle private key encoding.
"""
speech = """
Fifth demo: the inventory. [[slnc 400]] Twenty six of one hundred seventeen projects use an algorithm a quantum computer breaks. [[slnc 600]] A second implementation agrees on the wire formats.
"""
rows = { inventory = "active ok" }
console = [
    ["projects naming RSA: 10, ECDSA: 12, ECDH: 5", "bad"],
    ["projects naming ML-KEM or ML-DSA: 0", "bad"],
    ["Bouncy Castle and JDK agree on the wire: yes", "ok"],
]

