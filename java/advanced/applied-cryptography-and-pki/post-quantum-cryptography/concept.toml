[[act]]
title = "ML-KEM in the JDK"
summary = "The sender encapsulates to the bank's ML-KEM-768 key (1206 bytes): a 1088-byte ciphertext and a 32-byte key that the bank recovers exactly. A flipped bit raises no error (implicit rejection): the bank gets a different 32-byte key, and the first use fails the AES-GCM tag check. A 10-byte ciphertext is the only error. Bouncy Castle 1.86 agrees in both directions."
detail = """
The input: the bank's ML-KEM-768 public key, 1206 bytes in X.509 form. The sender encapsulates to it and gets a 1088-byte ciphertext, which it sends, and a 32-byte shared key, which it keeps. The bank decapsulates with its private key and gets the same 32 bytes. A second encapsulation gives a new ciphertext and a new key.
A tampered ciphertext: the message "card 4111 declined" is sealed with the shared key, one bit of the ciphertext is flipped, and decapsulation raises no error. The bank gets a 32-byte key that differs from the sender's, and its first use, opening the message, fails the AES-GCM tag check. The untouched ciphertext opens the message. Only a ciphertext of the wrong length, 10 bytes, raises DecapsulateException.
Bouncy Castle 1.86, a second implementation: a public key re-encoded by the JDK is byte for byte the same, and encapsulation in one library and decapsulation in the other give the same key, both ways.
"""
figure = "kem_flow"
figure_title = "One ML-KEM exchange, and a flipped bit"
figure_speech = """
Second demo: M L KEM in the J D K. [[slnc 400]] KEM means key encapsulation mechanism. [[slnc 300]] It does not agree on a key like Diffie Hellman. [[slnc 300]] One side makes a key, and sends it locked to the other side's public key. [[slnc 600]]
At the top, the sender takes the bank's public key, twelve hundred and six bytes, and encapsulates. [[slnc 300]] It keeps a thirty two byte shared key, and sends a ciphertext of ten eighty eight bytes. [[slnc 300]] The bank decapsulates it with its private key, and gets the same thirty two bytes. [[slnc 600]]
At the bottom, an attacker flips one bit of the ciphertext. [[slnc 300]] There is no error. [[slnc 300]] This is called implicit rejection: the bank simply gets a different key. [[slnc 300]] The failure shows only at the first use, when the authenticated cipher's tag does not match.
"""
speech = """
The sender: the public key, the ciphertext it sends, and the shared key it keeps. [[slnc 400]] The bank decapsulates, and gets the same key. [[slnc 300]] A second try gives a new ciphertext and a new key.
[[page]]
A tampered ciphertext: no error, a different key, and the first use fails the tag check. [[slnc 300]] The untouched one opens the message. [[slnc 300]] Only a wrong length is an error. [[slnc 400]] And Bouncy Castle agrees with the J D K, in both directions.
"""
rows = { kem = "active ok" }
console = [
