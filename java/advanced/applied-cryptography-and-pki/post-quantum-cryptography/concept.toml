[[scene]]
key = "01-poster"
kind = "poster"
title = "Post-Quantum Cryptography"
narration = "Hello, and welcome. [[slnc 400]] This video explains post quantum cryptography, in the J D K, the Java development kit. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A large quantum computer would break R S A, Diffie Hellman, and elliptic curves. [[slnc 300]] Anyone can record encrypted traffic today, and open it later. [[slnc 300]] Post quantum algorithms resist that computer. [[slnc 300]] N I S T has standardized two of them: M L KEM, to agree a key, and M L D S A, to sign. [[slnc 600]] Think of a bank fitting a new lock before the burglars' new tool is finished, because they are already photographing the old one. [[slnc 600]] Our example is a bank."

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["A bank protects card messages, online sessions,", "a statement archive, loan contracts and", "a settlement file.", "", "The demo uses ML-KEM and ML-DSA from the JDK,", "sizes them, builds a hybrid exchange, and plans", "which data and which code move first."]
narration = "Here is the scenario. [[slnc 400]] A bank protects card messages, online sessions, a statement archive, loan contracts, and a settlement file. [[slnc 500]] The demo uses M L KEM and M L D S A from the J D K, and measures their sizes. [[slnc 500]] It builds a hybrid key exchange, works out which data is at risk of being recorded now, and lists which of the bank's code has to move first."

[[scene]]
key = "02-words"
kind = "bullets"
title = "The Words"
body = ["Quantum computer: breaks RSA and elliptic curves", "Harvest now, decrypt later: record today, open later", "KEM: one side makes a key and locks it", "  to the other side's public key", "Hybrid: an old and a new exchange, joined", "Migration: moving every use to a new algorithm"]
narration = """Before the demos, the words. [[slnc 500]] A large quantum computer, if one is built, could break R S A and elliptic curves, the public key algorithms in use today. [[slnc 500]] Harvest now, decrypt later means recording encrypted traffic today, and opening it once that computer exists. [[slnc 500]] A KEM, a key encapsulation mechanism, lets one side make a key and lock it to the other side's public key. [[slnc 500]] A hybrid exchange runs an old and a new exchange side by side, and joins the two secrets. [[slnc 500]] And a migration is the work of moving every use of an algorithm to a new one."""

[[scene]]
key = "02-letters"
kind = "acronyms"
title = "Letters"
narration = "unused"

[[scene]]
key = "02-mosca"
kind = "figure"
title = "Is data recorded today already at risk?"
body = "mosca_timeline"
narration = """Let's see the core idea on one example: the bank's statement archive. [[slnc 400]] The question is not only when a quantum computer arrives. [[slnc 300]] It is whether the data recorded today must still be secret then. [[slnc 600]]
The amber bar is x: the archive must stay secret for ten years. [[slnc 300]] The cyan bar is y: moving it to new algorithms takes three years. [[slnc 300]] Together, thirteen years. [[slnc 600]]
The red line is z: one scenario, a threat that arrives in eight years. [[slnc 300]] Thirteen is more than eight. [[slnc 300]] So anything recorded today, before the move is done, is exposed for five years. [[slnc 300]] The archive is already late. [[slnc 600]] This is Mosca's inequality: x plus y greater than z means start now."""

[[scene]]
key = "03-acts"
kind = "acts"
title = "Acts"
narration = "unused"

[[scene]]
key = "04-costs"
kind = "bullets"
title = "What It Costs"
body = ["Keys and signatures are much bigger:", "  1206 bytes against 44; 3309 against 64", "A bad ciphertext raises no error at once", "A hybrid runs two exchanges", "Every use of the old algorithms must be found", "Private key encodings differ between libraries"]
narration = "Nothing is free. [[slnc 400]] Here is what it costs. [[slnc 500]] Keys and signatures are much bigger: twelve hundred bytes for an M L KEM public key, against forty four. [[slnc 300]] Thirty three hundred bytes for an M L D S A signature, against sixty four. [[slnc 500]] A tampered ciphertext raises no error; the failure shows only at first use. [[slnc 500]] A hybrid runs two exchanges. [[slnc 500]] Every use of the old algorithms must be found before it can be moved. [[slnc 300]] And private key encodings differ between libraries."

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["A TLS group named X25519MLKEM768", "Signature.getInstance(\"SHA256withRSA\") in code", "A long-lived archive encrypted with RSA", "A cryptographic inventory, asked for by an audit"]
narration = "You have probably met this already. [[slnc 400]] The key exchange group named X twenty five five nineteen M L KEM seven sixty eight, in T L S, is a hybrid exchange, already in browsers. [[slnc 500]] A signature with R S A, in code, is something to move. [[slnc 500]] An archive that must stay secret for decades is the data most at risk. [[slnc 500]] And an auditor asking for a cryptographic inventory is the first step of the move."

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "How To Use It"
body = ["Inventory every use of RSA and elliptic curves", "Protect long-lived secrets first", "Use hybrid key exchange now", "Plan for bigger keys and signatures", "Make algorithms easy to swap"]
narration = "So, how do you use it? [[slnc 400]] Inventory every use of R S A and elliptic curves. [[slnc 500]] Protect the data that must stay secret longest first. [[slnc 500]] Use a hybrid key exchange now, so breaking one part is not enough. [[slnc 500]] Plan for bigger keys and signatures, in messages, certificates, and storage. [[slnc 300]] And make algorithms easy to swap, because this will not be the last move."

[[scene]]
key = "12-classes"
kind = "classes"
title = "Classes"
narration = "unused"

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a data class of your", "own to the Mosca table."]
narration = "That's post quantum cryptography. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Traffic recorded today can be opened later, so find the old algorithms, protect long lived data first, and use a hybrid exchange now. [[slnc 500]] The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs on your own machine. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Add a data class of your own to the Mosca table, and see when it is exposed. [[slnc 500]] If you found this useful, a like really helps other people discover it. [[slnc 300]] Kindly subscribe to the channel. [[slnc 300]] It helps the channel grow and bring you more content. [[slnc 400]] Thanks for watching!"

[classes]
title = "The Java Classes"
narration = """Now, a quick look at the code. [[slnc 300]] The new algorithms are in the J D K's ordinary classes, so the code is short. [[slnc 300]] Here are the classes that matter."""

[[class]]
name = "Sizes"
what = "measures real keys, ciphertexts and signatures"
[[class.part]]
title = "one handshake's keys and signatures"
code = """
static int chainBytes(Signing s) {
    return 2 * s.publicKey() + 3 * s.signature();
"""
speech = """Every size is measured from a real object. [[slnc 300]] A handshake carries two certificate keys and three signatures, so that is the sum."""

[[class]]
name = "PostQuantumDemo"
what = "the demo: ML-KEM through javax.crypto.KEM"
[[class.part]]
title = "encapsulate, then decapsulate"
code = """
KEM kem = KEM.getInstance("ML-KEM");
KEM.Encapsulated first = kem.newEncapsulator(pair.getPublic()).encapsulate();
byte[] opened = kem.newDecapsulator(pair.getPrivate())
        .decapsulate(first.encapsulation()).getEncoded();
"""
speech = """The sender encapsulates to the public key, and gets a ciphertext and a key. [[slnc 300]] The bank decapsulates the ciphertext with its private key, and gets the same key."""

[[class]]
name = "Signatures"
what = "ML-DSA through java.security.Signature"
[[class.part]]
title = "the same API as RSA"
code = """
Signature s = Signature.getInstance("ML-DSA");
s.initSign(pair.getPrivate());
s.update(message);
return s.sign();
"""
speech = """Signing with M L D S A looks exactly like signing with R S A. [[slnc 300]] Only the algorithm name changes, which is what makes a migration possible."""

[[class]]
name = "Hybrid"
what = "X25519 and ML-KEM side by side, joined by HKDF"
[[class.part]]
title = "both secrets in, one key out"
code = """
HKDFParameterSpec spec = HKDFParameterSpec.ofExtract()
        .addIKM(secrets.toByteArray()).thenExpand(info, 32);
SecretKey key = KDF.getInstance("HKDF-SHA256").deriveKey("AES", spec);
"""
speech = """The two secrets are the input, and the whole transcript is the context. [[slnc 300]] Without both secrets, the key cannot be made."""

[[class]]
name = "HkdfSteps"
what = "a teaching class: HKDF redone by hand"
[[class.part]]
title = "expand: one HMAC block"
code = """
byte[] message = Arrays.copyOf(info, info.length + 1);
message[info.length] = 1;
return hmac(prk, message);
"""
speech = """Extract is one H M A C over the secrets. [[slnc 300]] Expand is one more, over the context and the byte one. [[slnc 300]] A test checks that this gives the J D K's exact key."""

[[class]]
name = "Mosca"
what = "which data is exposed, and when"
[[class.part]]
title = "x plus y greater than z"
code = """
boolean exposed(int yearsToThreat) {
    return needed() > yearsToThreat;
"""
speech = """Needed is the secrecy years plus the migration years. [[slnc 300]] If that is more than the years to the threat, data recorded today is exposed."""

[[class]]
name = "Inventory"
what = "reads the bank's code and orders the migration"
[[class.part]]
title = "a file moves with its most urgent use"
code = """
Use first = found.stream().map(Algorithm::use)
        .min(Enum::compareTo).orElse(Use.SYMMETRIC);
"""
speech = """Each algorithm a file names has a use: key exchange, signature, or symmetric. [[slnc 300]] The file is placed by the most urgent one."""

