[[act]]
title = "Planning the migration"
summary = "Mosca's inequality with made-up inputs: data is exposed when secrecy years plus migration years exceed the years to the threat; if the threat is 8 years away, 3 of 5 data classes recorded today are already exposed (the statement archive by 5 years), and 1 of 5 at 15 or 25. An inventory of 7 of the bank's source files puts 3 key exchange files first, 3 signature files next, and keeps the 1 symmetric-only file."
detail = """
Mosca's inequality, with made-up inputs and not a prediction: data is exposed when x + y > z, where x is how many years it must stay secret, y how many years the migration takes, and z how many years until a quantum computer breaks the old algorithms.
The bank's data: card authorisation 1 + 2 = 3, online banking session 0 + 2 = 2, statement archive 10 + 3 = 13, loan contracts and identity documents 30 + 4 = 34, settlement file 7 + 5 = 12. For z = 8, 15 and 25 the result is the years left to start, or how late it already is: at z = 8 the statement archive is 5 years late, the loan contracts 26 and the settlement file 4, so 3 of 5 are exposed; at 15 and 25 only the loan contracts, 1 of 5.
The inventory reads 7 of the bank's source files as text: online-banking/TlsSetup (X25519), interbank/SettlementChannel (ECDH, AES) and archive/ArchiveKeyWrap (RSA key transport) are key exchange, first, because a recording opens later; statements/StatementSigner (RSA), mobile/DeviceBinding (ECDSA) and identity/LoginTokens (Ed25519, HMAC) are signatures, second; payments/CardVault (AES, HMAC) is symmetric only and stays.
"""
figure = "plan_grid"
figure_title = "Which data is late, and which code moves first"
figure_speech = """
Fifth demo: planning the migration. [[slnc 400]] On the left, Mosca's inequality for each kind of the bank's data. [[slnc 300]] The columns are three scenarios for when the threat arrives: eight, fifteen, or twenty five years from now. [[slnc 300]] These are illustrations, not predictions. [[slnc 600]] Green means there are still years left to start the move. [[slnc 300]] Red means data recorded today is already exposed. [[slnc 300]] Loan contracts must stay secret for thirty years, so they are late in every scenario. [[slnc 600]]
On the right, the inventory of the bank's code, in the order it should move. [[slnc 300]] Red: key exchange first, because a recording made today can be opened later. [[slnc 300]] Amber: signatures next; they can only be forged once the algorithm is broken. [[slnc 300]] Green: a file that uses only A E S and H M A C stays as it is.
