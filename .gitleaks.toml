# Secret-scanner settings for this repository.
#
# The projects below ship demo keys and keystores on purpose: test certificates for local TLS servers, and private keys
# printed in docs and golden outputs to show the PEM format. They protect nothing, use demo passwords, and are described
# as demo values in each project's docs. Every other path is scanned with the default rules.

[extend]
useDefault = true

[allowlist]
description = "Demo keys and keystores used only by local labs"
paths = [
    '''java/beginner/transport-security/[^/]+/src/main/resources/.*''',
    '''java/beginner/transport-security/[^/]+/infra/.*''',
    '''java/beginner/cryptography/asymmetric-encryption-with-bouncy-castle/(README|concept|docs/|video/|src/test/).*''',
    '''java/beginner/transport-security/tls-handshake-with-openssl/(concept|docs/|video/|src/test/).*''',
]
